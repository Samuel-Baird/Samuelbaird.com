<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<title>Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.6 var(--font-sans)}
a{color:var(--accent);text-underline-offset:3px}
.rail{max-width:40rem;margin:0 auto;padding:32px 16px 64px}
h1{font:600 clamp(1.8rem,5vw,2.4rem)/1.15 var(--font-serif);margin:0 0 8px}
.eyebrow{color:var(--accent);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px}
.course{display:block;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:var(--foreground);margin:0 0 12px}
.course:hover,.course:focus-visible{border-color:var(--accent)}
.course b{display:block;font:600 1.2rem/1.3 var(--font-serif)}
.course span{color:var(--muted);font-size:.92rem}
#prog{color:var(--accent);font-size:.9rem}
</style>
</head>
<body>
<div class="rail">
  <p class="eyebrow small-caps">Personal study guides</p>
  <h1>Learn</h1>
  <p class="sub">Fast-track courses built from the syllabus: videos, key equations, book pointers and original practice problems.</p>
  <a class="course" href="/learn/me3320">
    <b>ME 3320 · Heat Transfer</b>
    <span>Fall 2026 · 18 units, 90 videos, 37 practice problems, mock finals, formula sheet</span><br>
    <span id="prog"></span>
  </a>
</div>
<script>
try{
  var s=JSON.parse(localStorage.getItem("me3320:v1")||"{}"),d=Object.keys(s.done||{}).filter(function(k){return s.done[k]}).length,p=Object.keys(s.solved||{}).filter(function(k){return s.solved[k]}).length;
  if(d||p)document.getElementById("prog").textContent=d+" of 18 units done · "+p+" problems solved";
}catch(e){}
</script>
</body>
</html>
