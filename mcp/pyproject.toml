[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urim-translate"
version = "0.1.0"
description = "Translation MCP server for any agent: Church-attested LDS terminology, scripture text and validation (Urim)."
requires-python = ">=3.11"
dependencies = ["mcp>=2", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["urim_translate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
