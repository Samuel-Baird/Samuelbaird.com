[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urim-translate"
version = "0.1.0"
description = "Local, free translation MCP server that enforces Church-attested LDS terminology (Urim)."
requires-python = ">=3.11"
dependencies = ["mcp>=2", "httpx", "pyyaml"]

[project.optional-dependencies]
argos = ["argostranslate"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["urim_translate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
