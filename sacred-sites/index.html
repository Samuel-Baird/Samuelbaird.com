<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacred Sites Visited</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="/sacred-sites/style.css">
</head>
<body>
<header>
  <h1>Sacred Sites Visited</h1>
  <nav>
    <a href="/">Home</a>
    <a href="https://ithinkisam.substack.com/" target="_blank" rel="noopener">Substack</a>
  </nav>
</header>
<main>
  <aside id="panel">
    <div id="stats"></div>
    <p class="hint">Since January 2025. Each site is counted once; repeat visits (especially LDS temples) are tucked inside the popup.</p>

    <ul id="communities"></ul>
    <h2>Sites</h2>
    <ul id="sites"></ul>
  </aside>
  <div id="map" role="application" aria-label="Map of sacred sites visited"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
