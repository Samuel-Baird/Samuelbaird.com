<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14172b">
<title>Sleep Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314172b'/%3E%3Cpath d='M62 22a30 30 0 1 0 16 46A26 26 0 0 1 62 22z' fill='%23f2d58a'/%3E%3C/svg%3E">
<style>
:root{--bg:#14172b;--bg2:#1d2142;--card:#222750;--fg:#eef0ff;--muted:#9aa0cc;--accent:#f2d58a;--accent-fg:#14172b;--stop:#ff8a7a;--line:#303667}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
header{text-align:center;color:var(--muted)}
header h1{margin:0;font-size:1rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.status{color:var(--muted);min-height:1.5em}
.clock{font-size:clamp(3rem,16vw,4.5rem);font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.big{width:200px;height:200px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font:700 1.5rem system-ui,sans-serif;cursor:pointer;box-shadow:0 0 0 12px rgba(242,213,138,.12),0 10px 40px rgba(0,0,0,.4);transition:transform .1s}
.big:active{transform:scale(.97)}
.big.running{background:var(--stop);box-shadow:0 0 0 12px rgba(255,138,122,.14),0 10px 40px rgba(0,0,0,.4);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 22px rgba(255,138,122,.06),0 10px 40px rgba(0,0,0,.4)}}
@media (prefers-reduced-motion:reduce){.big.running{animation:none}}
.hint{color:var(--muted);font-size:.9rem}
.last{color:var(--muted);font-size:.9rem}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.icon{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon:hover,.icon:focus-visible,.big:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.sheet .in{width:100%;max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h2{margin:0;font-size:1.3rem}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--fg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat{background:var(--card);border-radius:14px;padding:14px}
.stat b{display:block;font-size:1.5rem;font-weight:600}
.stat span{color:var(--muted);font-size:.85rem}
h3{margin:20px 0 10px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;background:var(--card);border-radius:14px;padding:14px 12px 8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .stack{width:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;flex:1}
.col .n{background:var(--accent);border-radius:4px 4px 0 0}
.col .p{background:#8fb4ff}
.col small{font-size:.7rem;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;margin-top:8px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 14px}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t span{color:var(--muted);font-size:.85rem}
.item button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:6px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.btn{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 .95rem system-ui,sans-serif;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
form label{display:block;margin:10px 0 4px;color:var(--muted);font-size:.85rem}
form input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;color-scheme:dark}
</style>
</head><body>
<div class="app">
  <header><h1>Sleep Timer</h1></header>

  <div class="main">
    <div class="status" id="status">Ready</div>
    <div class="clock" id="clock" aria-live="off">0:00:00</div>
    <button class="big" id="toggle">Start</button>
    <div class="hint" id="hint">Tap Start when she falls asleep</div>
    <div class="last" id="last"></div>
  </div>

  <div class="bar">
    <button class="icon" id="openHist" aria-label="History and edit"><svg viewBox="0 0 24 24"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg></button>
    <button class="icon" id="openStats" aria-label="Sleep report"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
  </div>
</div>

<!-- Report -->
<div class="sheet" id="stats" role="dialog" aria-modal="true" aria-label="Sleep report" hidden>
  <div class="in">
    <div class="top"><h2>Sleep report</h2><button class="btn" data-close>Close</button></div>
    <div class="tabs" role="tablist" id="range">
      <button role="tab" data-d="7" aria-selected="true">7 days</button>
      <button role="tab" data-d="30" aria-selected="false">30 days</button>
      <button role="tab" data-d="0" aria-selected="false">All</button>
    </div>
    <div id="statsBody"></div>
  </div>
</div>

<!-- History -->
<div class="sheet" id="hist" role="dialog" aria-modal="true" aria-label="History" hidden>
  <div class="in">
    <div class="top"><h2>History</h2><button class="btn" data-close>Close</button></div>
    <div class="row" style="margin-bottom:16px">
      <button class="btn pri" id="addBtn">+ Add entry</button>
      <button class="btn" id="csvBtn">Export CSV</button>
    </div>
    <form id="form" hidden style="margin-bottom:20px">
      <label for="fIn">Clock in</label><input type="datetime-local" id="fIn" required>
      <label for="fOut">Clock out</label><input type="datetime-local" id="fOut" required>
      <div class="row" style="margin-top:14px"><button class="btn pri" type="submit" id="fSave">Save</button><button class="btn" type="button" id="fCancel">Cancel</button></div>
    </form>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
(()=>{
const KEY='sleepTimer.v1';
const $=s=>document.querySelector(s);
let db={entries:[],running:null};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.entries))db=d}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const dur=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m`};
const clockFmt=ms=>{const s=Math.floor(Math.max(0,ms)/1000);return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`};
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dt=t=>new Date(t).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
const isNight=t=>{const h=new Date(t).getHours();return h>=18||h<6};
const local=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayKey=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};

const toggle=$('#toggle');
function render(){
  const r=db.running;
  toggle.textContent=r?'Stop':'Start';
  toggle.classList.toggle('running',!!r);
  $('#status').textContent=r?`Asleep since ${tm(r)}`:'Awake';
  $('#hint').textContent=r?'Tap Stop when she wakes up':'Tap Start when she falls asleep';
  tick();
  const l=db.entries.slice().sort((a,b)=>b.end-a.end)[0];
  $('#last').textContent=l&&!r?`Last: ${dt(l.start)}, ${tm(l.start)} – ${tm(l.end)} (${dur(l.end-l.start)})`:'';
}
function tick(){$('#clock').textContent=clockFmt(db.running?Date.now()-db.running:0)}
setInterval(tick,500);
document.addEventListener('visibilitychange',tick);

toggle.onclick=()=>{
  if(db.running){
    const s=db.running,e=Date.now();
    if(e-s<1000||confirm(`Clock out? Slept ${dur(e-s)}.`)){
      if(e-s>=1000)db.entries.push({id:e,start:s,end:e});
      db.running=null;
    }
  }else db.running=Date.now();
  save();render();
};

// sheets
const open=id=>{$(id).hidden=false;document.body.style.overflow='hidden'};
const closeAll=()=>{document.querySelectorAll('.sheet').forEach(s=>s.hidden=true);document.body.style.overflow=''};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('#openStats').onclick=()=>{renderStats();open('#stats')};
$('#openHist').onclick=()=>{renderList();open('#hist')};

// stats
let days=7;
$('#range').onclick=e=>{const b=e.target.closest('button');if(!b)return;days=+b.dataset.d;
  document.querySelectorAll('#range button').forEach(x=>x.setAttribute('aria-selected',x===b));renderStats()};
function renderStats(){
  const now=Date.now(),from=days?dayKey(now)-(days-1)*864e5:0;
  const es=db.entries.filter(e=>e.start>=from);
  const body=$('#statsBody');
  if(!es.length){body.innerHTML='<div class="empty">No sleep logged in this range yet.</div>';return}
  const total=es.reduce((a,e)=>a+e.end-e.start,0);
  const nights=es.filter(e=>isNight(e.start)),naps=es.filter(e=>!isNight(e.start));
  const first=days||Math.max(1,Math.round((dayKey(now)-dayKey(Math.min(...es.map(e=>e.start))))/864e5)+1);
  const avg=a=>a.length?dur(a.reduce((s,e)=>s+e.end-e.start,0)/a.length):'–';
  const longest=es.reduce((m,e)=>e.end-e.start>m.end-m.start?e:m);
  // typical bedtime / wake (circular mean via minutes from 6pm)
  const mins=(t,off)=>{const d=new Date(t);return ((d.getHours()*60+d.getMinutes()-off)+1440)%1440};
  const clk=(m,off)=>{const x=(m+off)%1440;return tm(new Date(2000,0,1,Math.floor(x/60),x%60))};
  const bed=nights.length?clk(nights.reduce((a,e)=>a+mins(e.start,1080),0)/nights.length,1080):'–';
  const wake=nights.length?clk(nights.reduce((a,e)=>a+mins(e.end,1080),0)/nights.length,1080):'–';
  // chart
  const nd=days&&days<=30?days:Math.min(days||14,14),cols=[];
  for(let i=nd-1;i>=0;i--){const k=dayKey(now)-i*864e5;
    const day=db.entries.filter(e=>dayKey(e.start)===k);
    cols.push({k,n:day.filter(e=>isNight(e.start)).reduce((a,e)=>a+e.end-e.start,0),p:day.filter(e=>!isNight(e.start)).reduce((a,e)=>a+e.end-e.start,0)})}
  const max=Math.max(1,...cols.map(c=>c.n+c.p));
  const chart=cols.map(c=>`<div class="col" title="${dt(c.k)}: ${dur(c.n+c.p)}"><div class="stack"><div style="flex:${c.n/max}" class="n"></div><div style="flex:${c.p/max}" class="p"></div><div style="flex:${1-(c.n+c.p)/max}"></div></div><small>${nd>10?new Date(c.k).getDate():new Date(c.k).toLocaleDateString([],{weekday:'narrow'})}</small></div>`).join('');
  body.innerHTML=`
    <div class="grid">
      <div class="stat"><b>${dur(total/first)}</b><span>Avg sleep / day</span></div>
      <div class="stat"><b>${es.length}</b><span>Sessions</span></div>
      <div class="stat"><b>${avg(nights)}</b><span>Avg night sleep</span></div>
      <div class="stat"><b>${avg(naps)}</b><span>Avg nap · ${naps.length} naps</span></div>
      <div class="stat"><b>${bed}</b><span>Typical bedtime</span></div>
      <div class="stat"><b>${wake}</b><span>Typical wake-up</span></div>
      <div class="stat"><b>${dur(longest.end-longest.start)}</b><span>Longest · ${dt(longest.start)}</span></div>
      <div class="stat"><b>${dur(total)}</b><span>Total sleep</span></div>
    </div>
    <h3>Daily sleep${nd<(days||14)?'':''}</h3>
    <div class="chart">${chart}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Night</span><span><i style="background:#8fb4ff"></i>Nap</span></div>`;
}

// history
function renderList(){
  const l=$('#list'),es=db.entries.slice().sort((a,b)=>b.start-a.start);
  l.innerHTML=es.length?es.map(e=>`<div class="item"><div class="t"><b>${dur(e.end-e.start)} ${isNight(e.start)?'🌙':'☀️'}</b><span>${dt(e.start)} · ${tm(e.start)} – ${tm(e.end)}</span></div><button data-edit="${e.id}" aria-label="Edit">✎</button><button data-del="${e.id}" aria-label="Delete">🗑</button></div>`).join(''):'<div class="empty">Nothing logged yet.</div>';
}
let editing=null;
const form=$('#form');
function showForm(e){editing=e?e.id:null;$('#fIn').value=local(e?e.start:Date.now()-36e5);$('#fOut').value=local(e?e.end:Date.now());form.hidden=false;$('#fIn').focus()}
$('#addBtn').onclick=()=>showForm();
$('#fCancel').onclick=()=>{form.hidden=true};
form.onsubmit=ev=>{ev.preventDefault();
  const s=new Date($('#fIn').value).getTime(),e=new Date($('#fOut').value).getTime();
  if(!(e>s)){alert('Clock out must be after clock in.');return}
  if(editing){const x=db.entries.find(x=>x.id===editing);x.start=s;x.end=e}
  else db.entries.push({id:Date.now(),start:s,end:e});
  save();form.hidden=true;renderList();render()};
$('#list').onclick=ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.del&&confirm('Delete this entry?')){db.entries=db.entries.filter(x=>x.id!=b.dataset.del);save();renderList();render()}
  if(b.dataset.edit)showForm(db.entries.find(x=>x.id==b.dataset.edit));
};
$('#csvBtn').onclick=()=>{
  const rows=['clock_in,clock_out,minutes',...db.entries.slice().sort((a,b)=>a.start-b.start).map(e=>`${new Date(e.start).toISOString()},${new Date(e.end).toISOString()},${Math.round((e.end-e.start)/60000)}`)];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='sleep.csv';a.click();
};
render();
})();
</script>
</body></html>
