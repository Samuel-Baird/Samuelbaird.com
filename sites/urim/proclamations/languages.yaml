# Registry of editions. One entry per language folder (or alphabet) on the site and in the output.
#
#   slug        key AND folder name: lower-case ASCII, no hyphens (files are <doc>-<slug>-<size>.pdf)
#   kind        language (text published by the Church in that language) or script (a conversion of English)
#   code        the Church website's ?lang= code, also the folder texts/<code>/ (languages only)
#   native      the language's own name, shown first;  english: its English name
#   hyphenation pyphen dictionary for justified text, or null
#   justify     true/false; default true only when there is a hyphenation dictionary (otherwise ragged-right)
#   caps        upper (default) or none, for scripts without capitals (Georgian)
#   font        serif | sans: the Latin face family (other scripts need a font added to fonts/)
#   aof_split   words in the Articles of Faith heading where "the title" ends and "of The Church of ..." begins
#   credit      the unofficial-edition line in the bottom margin (English is used if absent)
#   hints       optional typographic hints verified for that language: heading breaks as word counts,
#               and the number of small-caps lead-in words per Family paragraph. Without them, headings
#               are balanced automatically and lead-ins follow the first clause.
#
# To add a language: add an entry, run `python -m proclamations.fetch_texts --lang <code>`, then generate.

english:
  kind: language
  code: eng
  native: English
  english: English
  hyphenation: en_US
  font: serif
  aof_split: "of The Church"
  credit: "Unofficial poster layout of the text published on churchofjesuschrist.org. Not an official publication of The Church of Jesus Christ of Latter-day Saints.  Generated by Urim, urim.samuelbaird.com"
  hints:
    breaks:
      family: {subtitle: [2, 3], author: [9, 9]}
      restoration: {title: [5, 6], author: [9, 9]}
      living-christ: {subtitle: [5], author: [8]}
      articles-of-faith: {title: [2, 2]}
    family_leads: [4, 3, 4, 3, 2, 3, 2, 2, 3]

espanol:
  kind: language
  code: spa
  native: Español
  english: Spanish
  hyphenation: es
  font: serif
  aof_split: "de La Iglesia"
  credit: "Diseño no oficial del texto publicado en churchofjesuschrist.org. No es una publicación oficial de La Iglesia de Jesucristo de los Santos de los Últimos Días.  Generado por Urim, urim.samuelbaird.com"
  hints:
    breaks:
      family: {subtitle: [2, 3], author: [10, 12]}
      restoration: {title: [5, 4], author: [10, 12]}
      living-christ: {subtitle: [5], author: [11]}
      articles-of-faith: {title: [2, 2]}
    family_leads: [4, 4, 4, 3, 2, 5, 2, 2, 3]

portugues:
  kind: language
  code: por
  native: Português
  english: Portuguese
  hyphenation: pt_BR
  font: serif
  aof_split: "de A Igreja"
  credit: "Layout não oficial do texto publicado em churchofjesuschrist.org. Não é uma publicação oficial de A Igreja de Jesus Cristo dos Santos dos Últimos Dias.  Gerado por Urim, urim.samuelbaird.com"

deseret:
  kind: script
  code: dsrt
  native: "𐐔𐐯𐑆𐐲𐑉𐐯𐐻"
  english: Deseret Alphabet
  source: eng
  hyphenation: null
  justify: true
  font: sans
  credit: "Unofficial Deseret Alphabet edition. Not an official publication of The Church of Jesus Christ of Latter-day Saints. Text: churchofjesuschrist.org.  Generated by Urim, urim.samuelbaird.com"
  hints: {}
