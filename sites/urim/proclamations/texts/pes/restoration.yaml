title: احیای کمال مژدۀ عیسی مسیح
subtitle: بیانیّه‌ای به جهانیان در دویستمین سالگرد
author: ریاست اوّل و شورای دوازده رسول کلیسای عیسی مسیح مقدّسین آخرین زمان
note: این بیانیّه توسط رئیس راسل نلسون به عنوان بخشی از پیامش، در همایش عمومی ۵ آوریل ۲۰۲۰، در سالت لیک
  سیتی در ایالت یوتا خوانده شد.
paragraphs:
- ما با صلابت و رسماً اعلام می‌کنیم که خدا فرزندانش را در هر ملّتی از دنیا دوست دارد. خدا، پدر ما، تولّدی
  الهی، زندگی بی‌نظیر و ایثار بر آمده از کفّارۀ بیکران پسر محبوبش، عیسی مسیح، را به ما اعطا نموده است.
  عیسی با قدرت پدر، دوباره برخاست و بر مرگ چیره گشت. او منجی ما، سرمشق ما، و ضامن ماست.
- دویست سال پیش، در صبح زیبای یک روز بهاری در ۱۸۲۰، جوزف اسمیت جوان، در جستجوی دانستن اینکه به کدام کلیسا
  بپیوندد، به جنگلی در نزدیکی خانه‌اش در شمال ایالت نیویورک ایالات متحدۀ آمریکا رفت تا دعا کند. او دربارۀ
  رستگاری روانش پرسش‌هایی داشت و بر این باور بود که خدا او را هدایت خواهد کرد.
- ما با فروتنی اعلام می‌کنیم که در پاسخ به دعایش، خدا، پدر ما و پسرش، عیسی مسیح، بر جوزف پدیدار گشتند
  و همانطور که در کتاب مقدّس پیش بینی شده بود، «احیای همۀ چیزها» (اعمال رسولان ۳‏:۲۱) را آغاز کردند. در
  این رؤیت، او دریافت که به دنبالِ مرگِ رسولانِ اولیّه، کلیسای عهد جدیدِ مسیح بر روی زمین از دست رفت.
  جوزف وسیله‌ای برای بازگشت آن خواهد بود.
- ما تصدیق می‌کنیم که تحت رهنمودِ پدر و پسر، پیام‌آورانِ آسمانی برای آموزش جوزف و برپایی دوبارۀ کلیسای
  عیسی مسیح آمدند. یحیی تعمید دهنده که رستاخیز یافته بود، اقتدار غسل‌تعمید برای امرزش گناهان را احیا کرد.
  سه تن از دوازده رسول اولیه، پطرس، یعقوب، و یوحنا، رسالت و کلیدهای اقتدار کشیشی را احیا کردند. دیگران
  هم آمدند؛ از جمله، الیاس که اقتدار پیوند همیشگی خانواده‌ها به یکدیگر در روابط ابدی خویشاوندی را که در
  ورای مرگ ادامه می‌یابد، احیا نمود.
- ما همچنین گواهی می‌دهیم که هدیه و قدرت خدا به جوزف اسمیت داده شد تا یک نگاشتۀ باستانی را ترجمه کند کتاب
  مورمون — گواهی دیگری بر عیسی مسیح. قطعاتی از این متن مقدّس حاوی شرحی از حضور توأم با خدمت عیسی مسیح
  در میان مردم نیمکرۀ غربی می‌باشد که مدت کوتاهی پس از رستاخیز او صورت گرفت. این کتاب، هدف از زندگی را
  تعلیم می‌دهد و اصول مسیح را که در کانون آن هدف قرار دارند توضیح می‌دهد. به عنوان نوشتۀ مقدّسی در کنار
  کتاب مقدّس، کتاب مورمون گواهی می‌دهد که همۀ انسان‌ها، پسران و دختران پدری پُر مِهر در آسمان هستند، و
  اینکه او طرحی الهی برای زندگی ما دارد، و همچنین اینکه پسرش، عیسی مسیح، به مانند روزگار کهن، امروزه نیز
  با ما سخن می‌گوید.
- ما اعلام می‌کنیم که کلیسای عیسی مسیح مقدّسین آخرین زمان، که در ۶ آوریل ۱۸۳۰ بنیان گذاشته شد، کلیسای
  احیاء شدۀ عهد جدید مسیح است. این کلیسا بر زندگی بی‌نقص سنگ شالودۀ اصلی‌اش، عیسی مسیح، و کفّارۀ بیکران
  و رستاخیز عینی او بنا گشته است. عیسی مسیح باری دیگر رسولان را فراخوانده و به آنها اقتدار کشیشی داده
  است. او از همۀ ما دعوت می‌کند که به سوی او و کلیسایش بیاییم، تا روح القدُس و آیین‌های رستگاری را دریافت
  کرده و از شادی ماندگار برخوردار گردیم.
- از زمان آغاز این احیاء توسّط خدا، پدر ما، و پسر محبوبش، عیسی مسیح، تاکنون دویست سال گذشته است. میلیون‌ها
  نفر در سراسر دنیا، از این رویدادهای پیشگویی شده آگاه و پذیرای آنها گشته‌اند.
- ما با مسرّت اعلام می‌کنیم که آن احیای موعود، از طریق دریافت پیوستۀ وحی ادامه خواهد یافت. زمین هرگز مثل
  قبل نخواهد بود، از آن رو که خدا «همۀ چیزها را تحت فرمان مسیح گِرد هم جمع خواهد کرد» (افسسیان ۱‏:۱۰).
- با احترام و سپاس از خدا، ما به عنوان رسولان او از همه دعوت می‌کنیم که به این آگاهی دست یابند که درهای
  آسمان‌ها گشوده‌اند، چنانکه ما نیز به این آگاهی نائل گشته‌ایم. ما تأکید می‌کنیم که خدا در حال هویدا ساختن
  ارادۀ خود برای پسران و دختران محبوبش است. ما شهادت می‌دهیم كه آنانی كه با اتکاء به دعا، پیام احیاء را
  مطالعه کرده و بر اساس ایمان عمل می‌كنند، بركت خواهند یافت تا گواهی مخصوص خود در مورد الوهیت و مقصود
  از احیاء را به دست آورند تا دنیا را برای آمدن دوباره و وعده داده شدۀ سَروَر و منجی‌مان، عیسی مسیح، مهیّا
  سازند.
