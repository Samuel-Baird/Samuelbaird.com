title: ارکان دین
subtitle: کلیسای عیسی مسیح مقدّسین آخرین زمان
author: ''
verses:
- n: 1
  text: ما به خدا، پدر جاویدان، و به پسر او، عیسی مسیح، و به روح القُدس ایمان داریم.
  label: ۱
- n: 2
  text: ما ایمان داریم که آدمیان برای گناهان خودشان، و نه برای گناه آدم، تنبیه خواهند شد.
  label: ۲
- n: 3
  text: ما ایمان داریم که از طریق کفّارۀ مسیح، با اطاعت از قوانین و آیین مژده همۀ بشریّت می توانند نجات
    یابند.
  label: ۳
- n: 4
  text: 'ما ایمان داریم که اصول و آیین نخستین مژده اینها هستند: نخست، ایمان به سَروَر عیسی مسیح: دوّم،
    توبه: سوّم، تعمید با فرو رفتن در آب برای آمرزش از گناهان؛ چهارم، نهادن دستها برای هدیۀ روح القُدُس.'
  label: ۴
- n: 5
  text: ما ایمان داریم که یک مرد می بایستی با نبُوّت از سوی خدا خوانده شود، و با نهادن دستها بدست کسانی
    که دارای اختیار هستند، تا آن مژده را موعظه کنند و آیین آن را انجام دهند.
  label: ۵
- n: 6
  text: ما به همان سازمانی که در کلیسای نخستین وجود داشت، یعنی، رسولان، پیامبران، پیشوایان، آموزگاران،
    مبلغان، و مانند آن ایمان داریم.
  label: ۶
- n: 7
  text: ما به هدیۀ زبان، نبوّت، مکاشفه، رؤیا، شفا، ترجمۀ زبان ها، و مانند آن ایمان داریم.
  label: ۷
- n: 8
  text: ما ایمان داریم کتاب مقدّس سخن خدا است تا آن جایی که درست ترجمه شده باشد؛ ما همچنین ایمان داریم
    که کتاب مورمون سخن خدا است.
  label: ۸
- n: 9
  text: ما به همۀ آنچه خدا آشکار کرده است، همۀ آنچه که او اکنون آشکار می کند ایمان داریم، و ما ایمان داریم
    که او هنوز هم چیزهای بسیار بزرگ و مهمی را در رابطه با ملکوت خدا آشکار خواهد کرد.
  label: ۹
- n: 10
  text: ما به گردآوری واقعی اسرائیل و بازآوری ده طایفه ایمان داریم؛ اینکه صهیون (اورشلیم نو) بر روی قارۀ
    آمریکا بنا خواهد شد؛ اینکه مسیح شخصاً بر روی زمین فرمانروایی خواهد کرد؛ و، اینکه زمین دوباره تازه
    شده و جلال بهشتی خود را دریافت خواهد کرد.
  label: ۱۰
- n: 11
  text: ما امتیاز پرستش خدای قادر متعال را بر پایۀ ندای وجدان خودمان ادعا می کنیم، و به همۀ آدمیان همین
    امتیاز را می دهیم، می گذاریم آنها به هر صورتی، در هر کجا، و هر چه می خواهند پرستش کنند.
  label: ۱۱
- n: 12
  text: ما به مطیع بودن به پادشاهان، رئیس جمهورها، فرمانروایان، و حاکمین، در فرمانبرداری، ارج نهادن، و
    حفظ قانون ایمان داریم.
  label: ۱۲
- n: 13
  text: ما به درستکاری، راستگویی، پاکدامنی، خیرخواهی، پارسایی، و به نیکوکاری به همۀ آدمیان ایمان داریم؛
    براستی، ما می توانیم بگوییم که ما از اندرزهای پولس پیروی می کنیم — ما به همه چیز ایمان داریم، ما به
    همه چیز امیدواریم، ما در چیزهای بسیاری پایداری کرده ایم، و امیدواریم بتوانیم در همه چیز پایداری کنیم.
    اگر چیزی باشد که پارسا، دوست داشتنی، یا شهرت خوبی داشته یا شایستۀ ستایش باشد، ما بدنبال این چیزها
    هستیم.
  label: ۱۳
