retrieved: '2026-11-02'
title: Olutel a Cherrengelel a Ebangkelio er a Jesus Kristo
subtitle: Erul Dart el Rak el Chais el mo er a Beluulechad
author: First Presidency me a Chelechad er a Teruich me a Terung el Apostol er a Ikelesia er a Jesus Kristo
  er a Uriul-klebesei el Santo
note: Aki oba omengull me a omereng el saul, e kemam el Apostol er Ngii a olengit er kemiu me bo modengei—el
  uai kemam—el kmo a babeluades a mla obok. Aki mesisiich el ouchais el kmo a Dios a olecholt er a moktek
  er Ngii el kirir a rebetik er a rengul Rengelekel sechal me a redil. Aki ouchais el kmo tirkel mo ngara
  nglunguuch e mesuub er a klemechel Oluut e ultuil er a klaumerang a mo ngeltengat el mo nguu a sioning
  er tir el kirel a chedaol moktek er ngii el kirel a kedmeklel a beluulechad er sel telib Longeru Lemei
  a Rubak e Osobeled, el Jesus Kristo.
paragraphs:
- Aki mui louchais el kmo a Dios a betik a rengul er a Rengelekel el ngara bek el beluu er a beluulechad.
  A Dios el Chedam a mla meskid a chedaol cherellel, me a diak a mo mekesiur el klengar, me a cherrungel
  el tngakireng er a Betik er a Rengul Ngelekel Sechal, el Jesus Kristo. Ng okiu a klisichel a Chedam,
  e a Jesus a liluut el mekiis e mlo mesisiich er a kodall. Ngii a Osobeled, e Okesiud, e Olsobel er kid.
- Erul dart el rak er a memong, er a tal mle klebokel el tutau er sera 1820, e a ngeasek el Joseph Smith,
  lulsiik el kmo ngera el ikelesia e lebo el chad er ngii, a mlo er a chereomel er a bita er a blil er
  a New York, USA el mo meluluuch. Ng mla er ngii a keril el kirel a osebelel a klengar er ngii e ulumerang
  el kmo a Dios a mo omekrael er ngii.
- Me a ki oba ngariou el reng, e ouchais el kmo a nger er a nglunguchel, e a Dios el Chedam me a Ngelekel
  Sechal, el Jesus Kristo, a mlo chemolt er a Joseph e childolii a “olutel a rokui el tekoi” (Mesa Rellir
  3:21) el mlulaoch er a chelsel a Bibilia. Chelsel tia el ues, eng mlo medengei el kmo a uriul er a kodellir
  tirkel mle kot el Apostol, er sel Ikelesia er a Kristo er a Beches el Renged a mlo dibus er tia el beluulechad.
  A Joseph a mo donguu el mo uchul tial oluut.
- Aki mesisiich louchais el kmo ngokiu a dereder er a Chedam me a Ngelekel Sechal, e a roderuchel er a
  babeluades a mlei e ulsisecheklii a Joseph el kirel a teketekel a Ikelesia er a Jesus Kristo. A mla
  mekiis er a kodall el Johanes el Techolb a ulutii a klisiich er a techolbechelid el mo modulb el kirel
  a ngbetel a klengit. A tedei er tirkel mle kot el teruich me a terung el Apostol—el Petrus, Jakobus,
  me a Johanes—a ulutii a ngerachel er a re apostol me a kisel a klisichel a deruchellel a priesthood.
  A rebebil a mlei ruriul, el uldimukl er a Elijah, el mle olutii a klisiich el merenged a telungalek
  el dmak el mo cherechar el ngara diak a ulebengelel el deleuill el mo el muut er a uriul er a kodall.
- 'Aki lmuut el dochelii a sioning er kemam el kmo a Joseph Smith a ngiluu sel sengk me a klisichel a
  Dios el mo oleuiid a chuodel el rekord: el Babier er a Mormon—Tiang a Dirrek el Ouchais El Kirel a Jesus
  Kristo. A llechukl er a chelsel tial chedaol hong a uldimukl a cheldechedechal me a urerel a Jesus Kristo
  er a delongelir a rechad el mla er a Beluu er a Merikel ruriul er a Okisel er a Kodall. Ng olisechakl
  er a moktek er a klengar e smaod osisecheklel a Kristo, el ngii a chedul tia el moktek. Meng kldemel
  a Biblia, e a Babier er a Mormon a ouchais el kmo a rokui el chad el sechal me a redil a ngelekel a
  oubeltikereng el Chedam er a Babeluades, e Ngii a ngarngii a chedaol moktek er ngii el kirel a klengar
  kid, e a Ngelekel Sechal, er a Jesus Kristo, a mengedecheduch el mei er kid er chelechal sils el di
  uaia ngara mong.'
- Aki ouchais el kmo a Ikelesia er a Jesus Kristo er a Uriul-klebesei el Santo, el ulemuchel sera April
  6, 1830, a Ikelesia er a Kristo er a Beches el Renged el mla moluut. Tia el Ikelesia a delalm er a cherrungel
  el klengar ngike el ngii a mesisiich el dodai, el Jesus Kristo, me a sel Klou el Tngakireng er Ngii
  me a Okiis er a Kodall. A Jesus a mla lmuut el omekedong er a re Apostol e mla mesterir a klisichel
  a priesthood. Ngii a olengit er kid el rokui el mo er Ngii me a Ikelesia er Ngii, e mo nguu a Chedaol
  Reng, me a chedaol ruoll er a mo suobel, me a diak a ulebengelel el deurreng.
- Ng mla mocheuekl erul dart el rak er sera ledubech tial Oluut lokiu a Dios el Chedam me a Betik er a
  Rengul Ngelekel Sechal, el Jesus Kristo. A remilion el chad el meliuekl er a beluulechad a mla kongei
  a klemedengei er a ikal teletael el mla mocholt.
- Aki dmeu a rengmam e ouchais el kmo sel yaksok er a Oluut a melemolem el merael mo ruchei el okiu a
  melemolem el chedaol ocholt. A beluulechad a diak el luut el mo osisiu, le Dios a mo “mengideb loldak
  a rokui el tekoi el mo tang el ngara Kristo” (Mesa Efesus 1:10).
