title: A Tebechelel a Klaumerang er a Ikelesia er a Jesus Kristo ra Uriul Klebesei el Santo
subtitle: ''
author: ''
verses:
- n: 1
  text: Aki oumerang er a Dios, el Edam er a diak a Ulebengelel Klengar, me a Ngelekel el Jesus Kristo,
    me Edaol Reng.
- n: 2
  text: Aki oumerang el kmo a rechad a mobals el kirel a kngterir, ng diak el telmellel a Adam.
- n: 3
  text: Aki oumerang el kmo ngokiu a Tngakireng ra Kristo, ea rechad el rokui a sebechir el mo suobel,
    lokiu a otireklel a llach ma ruoll el ngar er a osischeklel a Evangelio.
- n: 4
  text: 'Aki oumerang el kmo a kot el ngaruchei el llechul ma ruoll ra Evangkelio aika kid: kot, Klaumerang
    er a Rubak el Jesus Kristo; ongerung, Ouuchel el reng; ongedei, Techolb el mo modulb el kirel a ngbetel
    a klengit; ongeuang, Lomor er a chim a sengk er a Edaol Reng.'
- n: 5
  text: Aki oumerang el kmo a chad a kirel mo mokedong er a Dios, lokiu a ulaoch, me a lomor er a chim
    tirke el oba klisiich, el mo omerk er a Evangelio e omtebechel e meruul aikel ruoll.
- n: 6
  text: Aki oumerang er se el di osisiu el teletael el mla er ngii er a Ikelesia, era ngara mong, el mla
    er a ngii er a reapostol, me a reprofet, me a repastor, me a resensei, me a evangelists, me a lmuut
    el bebil.
- n: 7
  text: Aki oumerang er a sengk er a omelekoi, me a ulaoch, me a ocholt, me a ues, me a klisiich lomekungil,
    me a oidel a tekoi, me a lmuut el bebil.
- n: 8
  text: Aki oumerang er a Biblia el kmo ng tekingel a Dios se el otireklii a malmalt loidel; aki dirrek
    l oumerang el kmo a Babier er a Mormon meng tekingel a Dios.
- n: 9
  text: Aki oumerang aikel rokui el bla locholt a Dios, me a aikel rokui el olecholt er chelchang, aki
    dirrek loumerang el kmo a ngii a dirk mo olecholt a betok el meklou e okedeldaol tekoi el kirel a
    Rengedel a Dios.
- n: 10
  text: Aki oumerang er a mei el eldellel a klechad era Israel me a okisel aikel Teruich el Kebliil; me
    a Zion (el ngii a Beches el Jerusalem) a mo mekiis el mo dechor er a chutem er a Merikel; me a Kristo
    el ngii a mo mengedereder er a beluulechad, me a beluulechad a mo mukbeches e mo er ngii a klebkellel
    a paradis.
- n: 11
  text: Aki mengerchir er a llemalt er a omengull er a tkul er a Bab el Dios el oltirakl a rengmam, e
    dirrek el kongei er a uaisei el techall el mo er a rokui el chad, me bol sebechir el ngar er se el
    sorir el teletael, me a sorir el basio, e longull er a se el sorir.
- n: 12
  text: Aki oumerang el kmo aki chederdall er a reking, me a represident, me a remerredel, me a remagistret,
    e olngesenges, e mengull, e omekerreu a llach.
- n: 13
  text: Aki oumerang el kmo ng kiram el meruul a llemalt, me a klemerang, me a kldung, me a blekokeuii,
    me a klikiid, me a omeruul klungiaol el mo er a rokui el chad; klemerang, e aki sebechemam el kmo
    aki oltirakl er a omellach er a Paulos—Aki oumerang a rokui, aki mengiil a rokui, aki mla outekangel
    a rokui el tekoi, e mengiil el mo sebechemam lotekangel a rokui el tekoi. Alsekum ngar ngii a kldung,
    me a klamiokel, me a lechub eng ungil tekoi me a lechub eng odengesall, e a ika kid el tekoi aki mosiik.
signature: Joseph Smith.
