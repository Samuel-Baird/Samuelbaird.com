title: Iren Pwoson akan
subtitle: en Mwomwohdiso en Sises Krais en Souleng en Imwin Rahn akan
author: ''
verses:
- n: 1
  text: Se kamehlele Koht, Sahm Soutuk, oh Sapwellime Iehros, Sises Krais, oh Ngehn Sarawi.
- n: 2
  text: Se kamehlele me aramas koaros pahn kalokolongki pein diparail akan oh kaidehn ong ni dipen Adam.
- n: 3
  text: Se kamehlele me sang ni Tompen Krais, aramas koaros pahn kak komourala, sang ni peikihong kosonned
    akan oh tiahk sarawi kan en Rongamwahuo.
- n: 4
  text: 'Se kamehlele me tepin padahk oh tiahk sarawi kan en Rongamwahuo iei: keieu, Pwoson Kauno Sises
    Krais; keriau, Koluhla; kesiluh, Papidais sang ni kaduhdi ong ni lapwepen dihp akan; kapahieu Pwilidien
    pehkan ong ni kisakis en Ngehn Sarawi.'
- n: 5
  text: Se kamehlele me Koht udahn pahn ketin malipe aramas emen, sang ni kokohp, oh pwildien pehn irail
    akan me ahneki mweimwei, en kalohngki Rongamwahuo oh wia tiahk sarawi kan.
- n: 6
  text: Se kamehlele koasoandien pwihnohte me miher nan udahn Mwomwohdiso en Keilahn aio, me iei, wahnpoaron
    kan, soukohp kan, silepe kan, sounpadahk kan, sounkapai kan, oh pil mehteikan.
- n: 7
  text: Se kamehlele kisakis en wehwehki lokaia kan, kokohp, kaudiahl, kairoir, kamwahuiala, kawehwepen
    lokaia kan, oh pil mehteikan.
- n: 8
  text: Se kamehlele Paipel iei mahsen en Koht ma e kawehwehdi ni pwung; se kamehlele me Pwuhk en Mormon
    iei mahsen en Koht.
- n: 9
  text: Se kamehlele koaros me Koht ketin kasaledahr, mehkoaros me E ketin wia e sansalehr ahnsou wet,
    oh se kamehlele me E pahn ketin kasalehda soahng tohto me lapalap oh kesempwal me pid duwen Wehin
    Koht.
- n: 10
  text: Se kamehlele pwurpenehn mehn Israel oh kopwurupwurdohn Keinek Eiseko; oh Saion (Serusalem Kapwo)
    pahn kokouda pohn sahpw en Amerika; me Krais pahn pein ketin kakaun sampah; oh, me sampah pahn kaweliakapwala
    oh alehda lingan en paradais.
- n: 11
  text: Se koasoaia me se ahneki pwuhng en kaudekiong Koht Wasa Lapalap nin duwen dahme pein aht pepehm
    kasalehiong kiht, oh mweidohng aramas koaros en ahneki pwuhngohte, mweidohng irail en kaudok ni wiepe,
    wasa, de dahme irail men wia.
- n: 12
  text: Se kamehlele me se pahn uhpa nanmwarki kan, preseden kan, soumas akan, oh kaun en wehi kan, sang
    ni peikihong, wahuniki, oh utung kosonnedo.
- n: 13
  text: Se kamehlele me se pahn kin mehlel, loaloapwoat, mour mwakelekel, kadek, madamadau mwakelekel,
    oh wia me mwahu ong aramas koarusie; ni mehlel, se koasoaia me se idawehn kaweid en Pohl—Se kamehlele
    mehkoaros, se koapwoaroapwoariki mehkoaros, se dadaurehr soahng tohto kan, oh koapwoaroapwoariki me
    se pahn kak dadaurete mehkoaros. Ma mie mehkot me mwahu, kaselel, de rohng me mwahu de mwahu en kepinga,
    se kin rapahki mepwukat.
signature: Sosep Smith.
