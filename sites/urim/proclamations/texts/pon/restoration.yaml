retrieved: '2026-11-02'
title: Kopwurupwurdohn Rongamwahu Unsek en Sises Krais
subtitle: Kalohk Ehu en Ke-Riepwikihn Pahr ong Sampah
author: Presidensi Keieu oh Pwihn en Wahnpoaron Ehk-riemenko en Mwomwohdiso en Sises Krais en Souleng
  en Imwin Rahn akan
note: Kalohk wet wadawada sang rehn President Russell M. Nelson ni ah wia kisehn sapwellime mahsen nan
  Kapokon Lap Ke-190, ni Epreil 5, 2020, nan Salt Lake City, Utah.
paragraphs:
- Se kalohkihda ni wahu me Koht ketin poakohng Sapwellime seri kan nan wehi koaros en sampah. Koht Sahm
  ketkihong kitailehr kisakis en ipwidi, mour, oh tomw soutuk en Sapwellime Ieros, Sises Krais. Sang ni
  manaman en Sahmo, Sises ketin iasadahr oh powehdier mehla. Ih me wia atail Sounkomour, Mehn Kahlmengi,
  oh atail Soundoar.
- Pahr riepwiki samwalahro, ni menseng kaselel ehu nan pahr 1820, Sosep Smith ni eh pwulopwulte, raparapahki
  en esehla mehnia mwomwohdiso me e pahn iang, ahpw kohla nan tuhkehko pwehn kapakap wasa me karanih nihmweo
  nan New York, USA. Mie ah iren kalelapak kan me pid duwen komour en pali ngene oh e likih me Koht pahn
  ketin kaweidi ih.
- Ni wahu, se kalohkihda pwe en sapengala ah kapakapo, Koht Sahm oh Sapwellime Ieroso, Sises Krais, ketin
  pwarehng Sosep Smith oh kasarawiala “weliakapwalahn mehkoaros” (Wiewia kan 3:21) nin duwen me Pwuhk
  Sarawi mahsaniher. Nan sansalo, e esehda me mwurin kamakamalahn tepin Wahnpoaron ko, Sapwellimen Krais
  Mwomwohdiso en Kedehde Kapwo sohralahr sang sampah. Sosep me pahn wia soun doadoahk mwahu ong ni kopwurupwurdo
  wet.
- Se kadehdehki me sang ni kaweid en Sahmo oh Iehroso, meninkeder kan en nanleng pekederdohr pwehn kaweid
  Sosep oh pwurehng kauwada Mwomwohdiso en Sises Krais. Sohn Sounpepdais me iasadahro kapwurehdo mweimwei
  en pepdais ni kaduhdi ong ni lapwapen dihp. Wahnpoaron silimen—Piter, Seims, oh Sohn—kapwurehdo pwukoahn
  wahnpoaron oh kih kan en mweimwei en prihsdud. Mehkei pil pwaredo me iangahki Elijah, me kapwurehdo
  mweimwei en katengepene peneinei kan kohkohlahte mwurin mehla.
- 'Se pil kadehde me Sosep Smith alehdi kisakis oh manaman en Koht pwehn kawehwe poadoapoad en kawahu
  iei: Pwuhk en Mormon—Pil Ehu Kadehdepen Sises Krais. Tehn pwuhk en poadoapoad sarawi wet pil iangahki
  koasoaipen Sises Krais ah ketin kalohk rehn aramas en Pali kapi en sampah mwurin Sapwellime Iasadahu.
  Pwuhko padahngki kahrepen mour oh kawehwe padahk en Krais, me wia poahsoan en karepehu. Ni eh kin utung
  Pwuhk Sarawi, Pwuhk en Mormon kin kadehde me aramas koaros wia sapwellimen Sahm Nanleng me diren limpoak,
  me mie Sapwellime koasoandi ong atail mour, oh me Sapwellime Iehros, Sises Krais, kin wie mahmahsente
  rahn wet duwehte keilahn aio.'
- Se kalohkih me Mwomwohdiso en Sises Krais en Souleng en Imwin Rahn akan, me kokouda ni Epreil 6, 1830,
  iei Sapwellimen Krais Mwomwohdiso en Kadehde Kapw me kopwurupwurdohr. Mwomwohdiso wet poahsoanda pohn
  mour unsek en takai en pwukokeimwo, Sises Krais, oh Sapwellime Tomw soutuko oh Iasadao. Sises Krais
  ketin pwurehng malipehier Wahnpoaron akan oh ketkihong irailehr mweimwei en prihsduhd. E ketin luke
  kitail en kohdo Reh oh Sapwellime Mwomwohdiso, pwehn ale Ngehn Sarawi, oh tiahk sarawi kan en komour,
  oh sohsohki popohl soutuk.
- Met pahr riepwikiehr sang ansou me Koht Sahm oh Sapwellime Iehros, Sises Krais, tapiada Kopwurupwurdo
  wet. Aramas rar kei nan sampah wet alehier kamarain sang kokohp pwukat.
- Se kalohkihda ni popohl me inoupen Kopwurupwurdohu doudoulahte mwowe sang ni popouslahn kaudiahl. Sampah
  wet sohte pahn duweduwehte, ansou me Koht pahn ketin “kapwurepene mehkoaros rehn Krais” (Episos 1:10).
- Ni wahu oh kaping kalahngan, ni aht wia Sapwellime Wahnpoaron kei se luke koaruhsie en ese—duwehte kiht—me
  nanleng ritdahr. Se kahdehde me Koht kin ketin kaskasalehda Kupwure ong Sapwellime ohl akan oh lih akan.
  Se kadehde me irail akan me kin kapakapki oh onopiki padahk en Kopwurupwurdohu oh mwekidki ni pwoson
  pahn kapaikihda pein arail kadehde duwen eh sarawi oh kahrepeh kan pwehn kaunopada sampah ong inou en
  Ketido Keriau en atail Kaun oh Sounkomour, Sises Krais.
