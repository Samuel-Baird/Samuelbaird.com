title: Krais Ieiaso
subtitle: Kadehde En Wahnpoaron Akan
author: Mwomwohdiso en Sises Krais en Souleng en Imwin Rahn akan
paragraphs:
- Ni atail katamanda ipwdien Sises Krais sounpar riekid samwalahro, kitail kin kihda atail kadehde en
  mehlel en sapwellime Ieias lap oh manaman lap duwen sapwellime meirong en tomw kesempwalo. Sohte emen
  me ahnekier soangen lipwalipw loal ong koaros me mourehr oh me pahn ipwidi pohn sampa.
- Iei ih me Siohwa Lapalap en Kadehde Mering, Mesaia en Kadehde Kapw. Sang ni kaweid en Semeo, iei Ih
  me sounkapikipik en sampah. “E ketin kapikadahr mehkoaros; oh ma sohte Ih sohte mehkot me wiawidahr
  en mie” (Sohn 1:3). Mendahte sohte dipe, E ketin pepdaislahr pwehn kapwaiahda pwunglahn mehkoaros. E
  “ketselier oh wiadahr me mwahu” (Wiewia kan 10:38), ahpw aramas akan sohte pwungki. Sapwellime rongamwahuo
  iei rohng en meleilei oh nsenamwahu. E ketin pekier koaros en idawehn sapwellime karasaras. E ketin
  aluhier nan ahl akan en Palistain, kamwahwiala me soumwahu kan, wiahiong me maskun kan en kilangada
  wasa, oh kamourada me melahr akan. E ketin padahkihong kitailehr padahk mehlel akan duwen mour soutuk,
  mehlel en atail mour mwohn mouret, kahrepen atail mour pohn sampah, oh dahme sapwellimen Koht aramas
  koaros en kak wiahla nan mour kohkohdo.
- E ketin wiadahr kamadipw sarawi en wia mehn ketemen en sapwellime meirong en tomw me e ketin wiahier.
  E ketin poaridier oh dipkidahr kadipadip likamw akan, alehdier kalokolok pwehn kainsenamwahuiala ineng
  en pwihn en aramas lingerer pah kan, alehdier kalokolok, oh kamatala ni lohpwu en Kalpweri. E ketikidahr
  sapwellime ieiaso pwehn tomwkihla dipen aramas koaros. Sapwellime tomwo iei kisakis ehu me wia weliepen
  koaros me pahn mour pohn sampah.
- Se kadehde ni wahu me Sapwellime ieiaso me keieu kesempwal ong nan poadoapoad en aramas koaros, sohte
  tepida nan Pedlem de keimwsakala pohn Kalpweri. Iei ih me Mesenih en Sahmo, Iehros en Koht ni paliwar,
  Soundoar en Sampah.
- E ketin iasadahsangehr nan sousouo pwehn wiahla tepin aramas me iasadasang irail me melahr akan” (1
  Korint 15:20). Nin duwen Ih Kauno a ketin iasadahr, E ketin pwarekehr irail akan me e kin ketin poakepoake
  ni ansou me e momouro. E pil ketin padahkongehr “ekei sampwellime sihpw akan” (Sohn 10:16) nan Amerika.
  Ni keilahn aio, I oh Semehu ahpw pwarongehr pwutak Sosep Smith, kihkiheng kaweid nan ereihn irair en
  inouo “me pahn wiawi ni ahnsou me konehng” (Episos 1:10).
- 'Me pid Krais Ieiaso, Soukohp Sosep ntingihdier me: “Sapwellime pwoarenmas akan duwehte mpwul en kisiniei;
  piten tapwi pwetepwet duwehte sno; sihlangio linganla dauli marain en ketipin; oh kapitie duwehte pwilipwil
  en pillap akan, iei ihme kapitien Siohwa, mahmahsanih:'
- “Ngehi me tapi oh imwi; ngehi me momouro, ngehi me kamakamalahro; ngehi iei amwail sounsawas rehn Sahmo”
  (P&I 110:3–4).
- 'Pwehki Ih Soukohpo pil kalohngki me: “Oh met, mwurin kadehde tohto me kohdahr duwen ih, met iei kadehdeo,
  keimwseklahn kadehdeh koaros, me se kadehdehkier duwen ih: Me e ketin ieias!'
- “Pwe se kilangehr ih, iei ih me ketiket ni palimaun en Koht; oh se rongehr kapitieo wie kadkadehdehki
  me iei ih me wia sapwellimen Sahm Ieiroso—
- “Me sang ih, oh sang reh, oh pwehki ih, me sampah kan miehki oh kepikipikdahr, oh irail toweh kan en
  wasahu iei Sapwellimen Koht pwutak oh serepein kan” (P&I 76:22–24).
- Se kalohngki ni wahu lap me Sapwellime prihsduhd oh Sapwellime Mwomwohdiso kapwurupwurodohngehr sampah—“kokoudahr
  pohn poahson en … wahnpoaron akan oh soukohp akan, Sises Krais me pein wia takain pwukekeimwo” (Episos
  2:20).
- Se kadehde me ehu rahn E pahn ketin sapahldohng sampah. “Oh lingan en Koht pahn sansalada, oh aramas
  koaros pahn kilang” (Aiseia 40:5). E pahn ketin kaunda nin duwen Nanmwariki en Nanmwariki kan oh ketin
  kakaun nin duwen Kaun en Kaun akan, oh aramas koaros pahn kelepwikihdi oh lokaia koaros pahn kadehde
  ni wahu mwohn sihlahngi. Emen emen kitail pahn pahkadeikada reh nin duwen atail doadoahk kan oh ineng
  en nan mohngiongitail kan.
- Se wia kadehde, nin duwen Sapwellime wahnpoaronme pilipildahr kan—me Sises iei Krais Ieias, Iehros en
  Koht me kin ieias kohkohlahte. Iei ih Nanmwarki Lapalap Immanuel, me rahnwet kin ketiket ni palimaun
  en Semehu. Iei I me maraino, mour, oh koapwoaroapwoar en sampah. Sapwellime ahlo iei ahl me kolahng
  peren nan mouret oh mour soutuk nan sampah me pahn kohdo. Kaping ong Koht pwehki kisakis en Sapwellime
  Ieros sarawio me sohte mehkot kak rasohng.
