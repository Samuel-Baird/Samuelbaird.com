title: ພຣະ​ຄຣິດ​ທີ່​ຊົງ​ພຣະ​ຊົນ
subtitle: ປະ​ຈັກ​ພະ​ຍານ​ຂອງ​ອັກ​ຄະ​ສາ​ວົກ
author: ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ແຫ່ງ​ໄພ່​ພົນ​ຍຸກ​ສຸດ​ທ້າຍ
paragraphs:
- ຂະ​ນະ​ທີ່​ພວກ​ເຮົາ​ສະ​ເຫລີມ​ສະ​ຫລອງ​ການ​ກຳ​ເນີດ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ ເມື່ອ​ສອງ​ພັນ​ປີ​ທີ່​ຜ່ານ​ມາ, ພວກ​ເຮົາ​ຂໍ​ມອບ​ປະ​ຈັກ​ພະ​ຍານ​ຂອງ​ພວກ​ເຮົາ​ເຖິງ​ຄວາມ​ເປັນ​ຈິງ​ໃນ​ພຣະ​ຊົນ​ຊີບ​ອັນ​ຫາ​ທີ່​ປຽບ​ບໍ່​ໄດ້​ຂອງ​ພຣະ​ອົງ
  ແລະ ເຖິງ​ອຳ​ນາດ​ອັນ​ບໍ່​ມີ​ຂອບ​ເຂດ​ຂອງ​ການ​ເສຍ​ສະ​ລະ​ຊົດ​ໃຊ້​ທີ່​ຍິ່ງ​ໃຫຍ່​ຂອງ​ພຣະ​ອົງ. ບໍ່​ເຄີຍ​ມີ​ມະ​ນຸດ​ຄົນ​ໃດ
  ທີ່​ມີ​ອິດ​ທິ​ພົນ​ເໜືອ​ກວ່າ​ພຣະ​ອົງ​ຕໍ່​ທຸກ​ຄົນ​ທີ່​ເຄີຍ​ມີ​ຊີ​ວິດ​ຢູ່ ແລະ ຈະ​ມີ​ຊີ​ວິດ​ຢູ່​ເທິງ​ແຜ່ນ​ດິນ​ໂລກ.
- ພຣະ​ອົງ​ເປັນ​ພຣະ​ເຢ​ໂຮ​ວາ​ອົງ​ຍິ່ງ​ໃຫຍ່​ຂອງ​ພຣະ​ຄຳ​ພີ​ເດີມ, ເປັນ​ພຣະ​ເມ​ຊີ​ອາ​ຂອງ​ພຣະ​ຄຳ​ພີ​ໃໝ່. ພາຍ​ໃຕ້​ການ​ຊີ້​ນຳ​ຂອງ​ພຣະ​ບິ​ດາ​ຂອງ​ພຣະ​ອົງ,
  ພຣະ​ອົງ​ໄດ້​ເປັນ​ພຣະ​ຜູ້​ສ້າງ​ຂອງ​ແຜ່ນ​ດິນ​ໂລກ. “ພຣະ​ເຈົ້າ​ໄດ້​ຊົງ​ສ້າງ​ທຸກ​ສິ່ງ​ຂຶ້ນ​ໂດຍ​ທາງ​ພຣະ​ທຳ
  ໃນ​ບັນ​ດາ​ສິ່ງ​ທີ່​ເປັນ​ມາ​ນັ້ນ ບໍ່​ມີ​ສິ່ງ​ໜຶ່ງ​ສິ່ງ​ໃດ​ທີ່​ເປັນ​ມາ​ໂດຍ​ນອກ​ຈາກ​ພຣະ​ທຳ” (ໂຢ​ຮັນ 1:3).
  ເຖິງ​ແມ່ນ​ປາດ​ສະ​ຈາກ​ບາບ, ແຕ່​ພຣະ​ອົງ​ຍັງ​ໄດ້​ຮັບ​ບັບ​ຕິ​ສະ​ມາ ເພື່ອ​ໃຫ້​ຄວາມ​ຊອບ​ທຳ​ທັງ​ໝົດສຳ​ເລັດ.
  ພຣະ​ອົງ “ໄດ້​ໄປ​ທຸກ​ຫົນ​ທຸກ​ແຫ່ງ​ເຮັດ​ຄຸນ​ງາມ​ຄວາມ​ດີ” (ກິດ​ຈະ​ການ 10:38), ແຕ່​ຖືກ​ກຽດ​ຊັງ​ເພາະ​ການ​ນັ້ນ.
  ພຣະ​ກິດ​ຕິ​ຄຸນ​ຂອງ​ພຣະ​ອົງ​ຄື​ຂ່າວ​ສານ​ແຫ່ງ​ສັນ​ຕິ​ສຸກ ແລະ ຄວາມ​ປາດ​ຖະ​ໜາ​ດີ. ພຣະ​ອົງ​ໄດ້​ຂໍ​ຮ້ອງ​ໃຫ້​ທຸກ​ຄົນ​ເຮັດ​ຕາມ​ຕົວ​ຢ່າງ​ຂອງ​ພຣະ​ອົງ.
  ພຣະ​ອົງ​ໄດ້​ຍ່າງ​ໄປ​ຕາມ​ຖະ​ໜົນ​ຫົນ​ທາງ​ໃນ​ຟີ​ລິດ​ສະ​ຕິນ, ໄດ້​ປິ່ນ​ປົວ​ຄົນ​ເຈັບ​ປ່ວຍ, ໄດ້​ໂຜດ​ຄົນ​ຕາ​ບອດ​ໃຫ້​ເຫັນ​ຮຸ່ງ,
  ແລະ ໄດ້​ນຳ​ຄົນ​ຕາຍ​ເປັນ​ຄືນ​ມາ. ພຣະ​ອົງ​ໄດ້​ສິດ​ສອນ​ຄວາມ​ຈິງ​ກ່ຽວ​ກັບ​ນິ​ລັນ​ດອນ, ຄວາມ​ເປັນ​ຈິງ​ເຖິງ​ການ​ດຳ​ລົງ​ຢູ່​ກ່ອນ​ເກີດ​ຂອງ​ເຮົາ,
  ຈຸດ​ປະ​ສົງ​ຂອງ​ຊີ​ວິດ​ເຮົາ​ເທິງ​ແຜ່ນ​ດິນ​ໂລກ, ແລະ ສັກ​ກະ​ຍະ​ພາບ​ສຳ​ລັບ​ບຸດ ແລະ ທິ​ດາ​ຂອງ​ພຣະ​ເຈົ້າ​ໃນ​ຊີ​ວິດ​ທີ່​ຈະ​ມາ​ເຖິງ.
- ພຣະ​ອົງ​ໄດ້​ຈັດ​ຕັ້ງ​ສິນ​ລະ​ລຶກ​ຂຶ້ນ ເພື່ອ​ເຕືອນ​ໃຈ​ເຮົາ​ເຖິງ​ການ​ເສຍ​ສະ​ລະ​ຊົດ​ໃຊ້​ອັນ​ຍິ່ງ​ໃຫຍ່​ຂອງ​ພຣະ​ອົງ.
  ພຣະ​ອົງ​ໄດ້​ຖືກ​ຈັບ​ກຸມ ແລະ ຖືກ​ປະ​ນາມ ດ້ວຍ​ຂໍ້​ກ່າວ​ຫາ​ທີ່​ບໍ່​ມີ​ມູນ​ຄວາມ​ຈິງ, ຖືກ​ຕັດ​ສິນ​ລົງ​ໂທດ​ເພື່ອ​ສະ​ໜອງ​ຄຳ​ຂໍ​ຮ້ອງ​ຂອງ​ຝູງ​ຊົນ,
  ແລະ ຖືກ​ສັ່ງ​ໃຫ້​ປະ​ຫານ​ຊີ​ວິດ​ຢູ່​ເທິງ​ໄມ້​ກາງ​ແຂນ​ທີ່​ພູ​ກະ​ໂຫລກ​ຫົວ. ພຣະ​ອົງ​ໄດ້​ສະ​ລະ​ພຣະ​ຊົນ​ຊີບ​ເພື່ອ​ຊົດ​ໃຊ້​ບາບ​ຂອງ​ມວນ​ມະ​ນຸດ​ທັງ​ປວງ.
  ຂອງ​ປະ​ທານ​ຂອງ​ພຣະ​ອົງ ເປັນ​ຂອງ​ປະ​ທານ​ອັນ​ລ້ຳ​ຄ່າ​ແທນ​ທຸກ​ຄົນ​ທີ່​ເຄີຍ​ມີ​ຊີ​ວິດ​ຢູ່​ເທິງ​ແຜ່ນ​ດິນ​ໂລກ.
- ພວກ​ເຮົາ​ຂໍ​ເປັນ​ພະ​ຍານ​ຢ່າງ​ໜັກ​ແໜ້ນ​ວ່າ ພຣະ​ຊົນ​ຊີບ​ຂອງ​ພຣະ​ອົງ, ຊຶ່ງ​ເປັນ​ສູນ​ກາງ​ໃຫ້​ປະ​ຫວັດ​ສາດ​ຂອງ​ມວນ​ມະ​ນຸດ​ທັງ​ປວງ,
  ບໍ່​ໄດ້​ເລີ່ມ​ຕົ້ນ​ໃນ​ເມືອງ​ເບັດ​ເລ​ເຮັມ ແລະ ຈະ​ບໍ່​ສິ້ນ​ສຸດ​ລົງ​ທີ່​ພູ​ກະ​ໂຫລກ​ຫົວ. ພຣະ​ອົງ​ເປັນ​ພຣະ​ບຸດ​ຫົວ​ປີ​ຂອງ​ພຣະ​ບິ​ດາ,
  ເປັນ​ພຣະ​ບຸດ​ອົງ​ດຽວ​ທີ່​ຖື​ກຳ​ເນີດ​ໃນ​ເນື້ອ​ໜັງ, ເປັນ​ພຣະ​ຜູ້​ໄຖ່​ຂອງ​ໂລກ.
- ພຣະ​ອົງ​ໄດ້​ລຸກ​ຂຶ້ນ​ຈາກ​ຄວາມ​ຕາຍ​ເພື່ອ “ເປັນ​ຜົນ​ແລກ​ໃນ​ພວກ​ຄົນ​ທີ່​ລ່ວງ​ລັບ​ໄປ​ແລ້ວ​ນັ້ນ” (1 ໂກ​ຣິນ​ໂທ
  15:20). ໃນ​ຖາ​ນະ​ພຣະ​ຜູ້​ເປັນ​ເຈົ້າ​ທີ່​ຟື້ນ​ຄືນ​ພຣະ​ຊົນ​ແລ້ວ, ພຣະ​ອົງ​ໄດ້​ສະ​ເດັດ​ໄປ​ຢ້ຽມ​ຢາມ​ຜູ້​ທີ່​ພຣະ​ອົງ​ຮັກ​ຕອນ​ພຣະ​ອົງ​ຍັງ​ຊົງ​ພຣະ​ຊົນ.
  ພຣະ​ອົງ​ກໍ​ຍັງ​ໄດ້​ປະ​ຕິ​ບັດ​ສາດ​ສະ​ໜາ​ກິດ​ທ່າມ​ກາງ “ຝູງ​ແກະ​ອື່ນ” ຂອງ​ພຣະ​ອົງ (ໂຢ​ຮັນ 10:16) ໃນ​ອາ​ເມ​ຣິ​ກາ​ສະ​ໄໝ​ບູ​ຮານ​ນຳ​ອີກ.
  ໃນ​ໂລກ​ສະ​ໄໝ​ໃໝ່, ພຣະ​ອົງ ແລະ ພຣະ​ບິ​ດາ​ຂອງ​ພຣະ​ອົງ​ໄດ້​ມາ​ປະ​ກົດ​ຕໍ່​ຊາຍ​ໜຸ່ມ​ໂຈ​ເຊັບ ສະ​ມິດ, ໃນ​ການ​ເລີ່ມ​ຕົ້ນ
  “ເວ​ລາ​ກຳ​ນົດ​ຄົບ​ບໍ​ລິ​ບູນ” ຕາມ​ຄຳ​ສັນ​ຍາ​ອັນ​ຍາວ​ນານ (ເອ​ເຟ​ໂຊ 1:10).
- 'ກ່ຽວ​ກັບ​ພຣະ​ຄຣິດ​ທີ່​ຊົງ​ພຣະ​ຊົນ, ສາດ​ສະ​ດາ​ໂຈ​ເຊັບ​ໄດ້​ຂຽນ​ວ່າ: “ພຣະ​ເນດ​ຂອງ​ພຣະ​ອົງ​ເປັນ​ດັ່ງ​ແປວ​ໄຟ;
  ພຣະ​ເກ​ສາ​ຂອງ​ພຣະ​ອົງ​ຂາວ​ເໝືອນ​ຫິ​ມະ​ບໍ​ລິ​ສຸດ; ພຣະ​ພັກ​ຂອງ​ພຣະ​ອົງ​ຮຸ່ງ​ເຫລື້ອມ​ແຈ້ງ​ກວ່າ​ຄວາມ​ສະ​ຫວ່າງ​ຂອງ​ດວງ​ຕາ​ເວັນ;
  ແລະ ສຸ​ລະ​ສຽງ​ຂອງ​ພຣະ​ອົງ​ຄື​ກັບ​ນ້ຳ​ໄຫລ​ຢ່າງ​ໄວ​ຂອງ​ແມ່​ນ້ຳ​ອັນ​ກວ້າງ​ໃຫຍ່, ແມ່ນ​ແຕ່​ສຸ​ລະ​ສຽງ​ຂອງ​ພຣະ​ເຢ​ໂຮ​ວາ,
  ກ່າວ​ວ່າ:'
- “ເຮົາ​ເປັນ​ຜູ້​ທໍາ​ອິດ ແລະ ຜູ້​ສຸດ​ທ້າຍ; ເຮົາ​ຄື​ເຂົາ​ຜູ້​ນັ້ນ​ທີ່​ມີ​ຊີ​ວິດ, ເຮົາ​ຄື​ຜູ້​ນັ້ນ​ທີ່​ຖືກ​ປະ​ຫານ;
  ເຮົາ​ຄື​ຜູ້​ວິງ​ວອນ​ແທນ​ພວກ​ເຈົ້າ​ນຳ​ພຣະ​ບິ​ດາ” (ຄພ 110:3–4).
- 'ສາດ​ສະ​ດາ​ໄດ້​ປະ​ກາດ​ກ່ຽວ​ກັບ​ພຣະ​ອົງ​ວ່າ: “ແລະ ບັດ​ນີ້, ຫລັງ​ຈາກ​ປະ​ຈັກ​ພະ​ຍານ​ຫລາຍ​ຢ່າງ​ທີ່​ໃຫ້​ໄວ້​ເຖິງ​ພຣະ​ອົງ,
  ນີ້​ຄື​ປະ​ຈັກ​ພະ​ຍານ, ສຸດ​ທ້າຍ​ຂອງ​ທັງ​ໝົດ, ຊຶ່ງ​ພວກ​ເຮົາ​ມອບ​ໃຫ້​ເຖິງ​ພຣະ​ອົງ: ວ່າ​ພຣະ​ອົງ​ຊົງ​ພຣະ​ຊົນ!'
- “ເພາະ​ພວກ​ເຮົາ​ໄດ້​ເຫັນ​ພຣະ​ອົງ ແມ່ນ​ແຕ່​ຢູ່​ທາງ​ເບື້ອງ​ຂວາ​ພຣະ​ຫັດ​ຂອງ​ພຣະ​ເຈົ້າ; ແລະ ພວກ​ເຮົາ​ໄດ້​ຍິນ​ສຸ​ລະ​ສຽງ​ກ່າວ​ເປັນ​ພະ​ຍານ​ວ່າ
  ພຣະ​ອົງ​ເປັນ​ພຣະ​ອົງ​ດຽວ​ທີ່​ຖື​ກຳ​ເນີດ​ຈາກ​ພຣະ​ບິ​ດາ—
- “ວ່າ​ໂດຍ​ພຣະ​ອົງ, ແລະ ຜ່ານ​ພຣະ​ອົງ, ແລະ ຈາກ​ພຣະ​ອົງ, ໂລກ​ຕ່າງໆ​ຈຶ່ງ​ຖືກ​ສ້າງ​ຂຶ້ນ​ມາ, ແລະ ຜູ້​ອາ​ໄສ​ຢູ່​ໃນ​ນັ້ນ​ເປັນ​ບຸດ
  ແລະ ທິ​ດາ​ທີ່​ຖື​ກຳ​ເນີດ​ຂອງ​ພຣະ​ເຈົ້າ” (ຄພ 76:22–24).
- ພວກ​ເຮົາ​ຂໍ​ປະ​ກາດ​ຢ່າງ​ໜັກ​ແໜ້ນ​ວ່າ ຖາ​ນະ​ປະ​ໂລ​ຫິດ​ຂອງ​ພຣະ​ອົງ ແລະ ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ອົງ​ໄດ້​ຖືກ​ຟື້ນ​ຟູ​ເທິງ​ແຜ່ນ​ດິນ​ໂລກ—ຖືກ​ສ້າງ​ຂຶ້ນ​ເທິງ​ຮາກ​ຖານ
  ຊຶ່ງ​ພວກ​ອັກ​ຄະ​ສາ​ວົກ ແລະ ບັນ​ດາ​ສາດ​ສະ​ດາ​ໄດ້​ວາງ​ລົງ​ແລ້ວ, ພຣະ​ເຢ​ຊູ​ຄຣິດ​ເອງ​ເປັນ​ຫີນ​ເສົາ​ເອກ (ເບິ່ງ
  ເອ​ເຟ​ໂຊ 2:20).
- ພວກ​ເຮົາ​ເປັນ​ພະ​ຍານ​ວ່າ ພຣະ​ອົງ​ຈະ​ສະ​ເດັດ​ກັບ​ມາ​ຍັງ​ແຜ່ນ​ດິນ​ໂລກ​ອີກ​ໃນ​ມື້​ໜຶ່ງ. “ທຸກ​ປະ​ຊາ​ຊາດ​ກໍ​ຈະ​ໄດ້​ເຫັນ​ສະ​ຫງ່າ​ລາ​ສີ​ຂອງ​ພຣະ​ຜູ້​ເປັນ​ເຈົ້າ”
  (ເອ​ຊາ​ຢາ 40:5). ພຣະ​ອົງ​ຈະ​ປົກ​ຄອງ​ເປັນ​ຈອມ​ກະ​ສັດ ແລະ ຈອມ​ເຈົ້າ​ນາຍ, ແລະ ທຸກ​ຫົວ​ເຂົ່າ​ຈະ​ຄຸ​ລົງ ແລະ
  ທຸກ​ລີ້ນ​ຈະ​ກ່າວ​ໃນ​ການ​ນະ​ມັດ​ສະ​ການ​ຢູ່​ຕໍ່​ພຣະ​ພັກ​ຂອງ​ພຣະ​ອົງ. ເຮົາ​ແຕ່​ລະ​ຄົນ​ຈະ​ຢືນ​ຮັບ​ການ​ພິ​ພາກ​ສາ​ຈາກ​ພຣະ​ອົງ​ຕາມ​ວຽກ​ງານ​ຂອງ​ເຮົາ
  ແລະ ຕາມ​ຄວາມ​ປາດ​ຖະ​ໜາ​ຂອງ​ໃຈ​ເຮົາ.
- ພວກ​ເຮົາ​ສະ​ແດງ​ປະ​ຈັກ​ພະ​ຍານ, ໃນ​ຖາ​ນະ​ອັກ​ຄະ​ສາ​ວົກ​ທີ່​ໄດ້​ຮັບ​ການ​ແຕ່ງ​ຕັ້ງ​ຢ່າງ​ຖືກ​ຕ້ອງ​ຂອງ​ພຣະ​ອົງ—ວ່າ
  ພຣະ​ເຢ​ຊູ​ຄື ພຣະ​ຄຣິດ​ທີ່​ຊົງ​ພຣະ​ຊົນ, ພຣະ​ບຸດ​ທີ່​ເປັນ​ອະ​ມະ​ຕະ​ຂອງ​ພຣະ​ເຈົ້າ. ພຣະ​ອົງ​ເປັນ​ກະ​ສັດ​ເອ​ມາ​ນູ​ເອນ​ຜູ້​ຍິ່ງ​ໃຫຍ່,
  ຜູ້​ຊຶ່ງ​ທຸກ​ວັນ​ນີ້​ປະ​ທັບ​ຢືນ​ຢູ່​ເບື້ອງ​ຂວາ​ພຣະ​ຫັດ​ຂອງ​ພຣະ​ບິ​ດາ​ຂອງ​ພຣະ​ອົງ. ພຣະ​ອົງ​ເປັນ​ຄວາມ​ສະ​ຫວ່າງ,
  ເປັນ​ຊີ​ວິດ, ແລະ ເປັນ​ຄວາມ​ຫວັງ​ຂອງ​ໂລກ. ທາງ​ຂອງ​ພຣະ​ອົງ​ຄື​ທາງ​ທີ່​ນຳ​ໄປ​ສູ່​ຄວາມ​ສຸກ​ໃນ​ຊີ​ວິດ​ນີ້
  ແລະ ຊີ​ວິດ​ນິ​ລັນ​ດອນ​ໃນ​ໂລກ​ທີ່​ຈະ​ມາ​ເຖິງ. ຂອບ​ຄຸນ​ພຣະ​ເຈົ້າ​ສຳ​ລັບ​ຂອງ​ປະ​ທານ​ທີ່​ຫາ​ອັນ​ປຽບ​ບໍ່​ໄດ້​ນັ້ນ
  ຊຶ່ງ​ເປັນ​ພຣະ​ບຸດ​ແຫ່ງ​ສະ​ຫວັນ​ຂອງ​ພຣະ​ອົງ.
date: ວັນ​ທີ 1 ເດືອນ​ມັງ​ກອນ, 2000
