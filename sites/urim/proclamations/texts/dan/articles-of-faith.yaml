title: Trosartiklerne
subtitle: for Jesu Kristi Kirke af Sidste Dages Hellige
author: ''
verses:
- n: 1
  text: Vi tror på Gud, den evige Fader, og på hans Søn, Jesus Kristus, og på Helligånden.
- n: 2
  text: Vi tror, at menneskene vil blive straffet for deres egne synder og ikke for Adams overtrædelse.
- n: 3
  text: Vi tror, at hele menneskeheden i kraft af Kristi forsoning kan blive frelst ved lydighed mod evangeliets
    love og ordinancer.
- n: 4
  text: 'Vi tror, at evangeliets første principper og ordinancer er: 1) tro på Herren Jesus Kristus, 2)
    omvendelse, 3) dåb ved nedsænkning i vand til syndernes forladelse, 4) håndspålæggelse for Helligåndsgaven.'
- n: 5
  text: Vi tror, at en mand må kaldes af Gud ved profeti og ved håndspålæggelse af dem, der har myndighed
    dertil, for at kunne prædike evangeliet og forrette dets ordinancer.
- n: 6
  text: Vi tror på den samme organisation, som fandtes i den oprindelige kirke, nemlig apostle, profeter,
    hyrder, lærere, evangelister og så videre.
- n: 7
  text: Vi tror på tungemålsgaven, profeti, åbenbaring, syner, helbredelse, udlægning af tungemål og så
    videre.
- n: 8
  text: Vi tror, at Bibelen er Guds ord, for så vidt som den er rigtigt oversat; vi tror også, at Mormons
    Bog er Guds ord.
- n: 9
  text: Vi tror på alt, hvad Gud har åbenbaret, alt, hvad han nu åbenbarer, og vi tror, at han endnu vil
    åbenbare mange store og vigtige ting angående Guds rige.
- n: 10
  text: Vi tror på den bogstavelige indsamling af Israel og på genrejsningen af de ti stammer, at Zion
    (Det Ny Jerusalem) skal blive bygget på det amerikanske kontinent, at Kristus personligt skal regere
    på jorden, og at jorden skal blive fornyet og få sin paradisiske herlighed.
- n: 11
  text: Vi kræver ret til at tilbede Gud den Almægtige i overensstemmelse med vor egen samvittigheds bud
    og indrømmer alle mennesker den samme ret – lad dem tilbede hvorledes, hvor eller hvad de vil.
- n: 12
  text: Vi tror, at vi må indordne os under konger, præsidenter, herskere og øvrighedspersoner med hensyn
    til at adlyde, ære og holde loven.
- n: 13
  text: 'Vi tror, at vi skal være ærlige, pålidelige, kyske, velgørende, dydige, og at vi skal gøre godt
    mod alle mennesker; faktisk kan vi sige, at vi følger Paulus’ formaning: Vi tror alt, vi håber alt,
    vi har udholdt meget og håber at kunne udholde alt. Hvis noget er dydigt, elskeligt, værd at tale
    godt om eller rosværdigt, så tragter vi efter det.'
signature: Joseph Smith.
