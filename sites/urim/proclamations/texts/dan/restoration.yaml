retrieved: '2026-11-02'
title: Gengivelsen af Jesu Kristi evangeliums fylde
subtitle: En tohundredeårsproklamation til verden
author: Det Første Præsidentskab og De Tolv Apostles Råd i Jesu Kristi Kirke af Sidste Dages Hellige
note: Denne proklamation blev oplæst af præsident Russell M. Nelson som en del af hans tale ved aprilkonferencen
  2020, 5. april 2020, i Salt Lake City i Utah.
paragraphs:
- Vi proklamerer højtideligt, at Gud elsker sine børn i hvert eneste land i verden. Gud Faderen har givet
  os sin elskede Søns, Jesu Kristi, guddommelige fødsel, hans uforlignelige liv og uendelige sonoffer.
  I kraft af Faderens magt opstod Jesus igen og sejrede over døden. Han er vor Frelser, vort Eksempel
  og vor Forløser.
- For tohundrede år siden på en smuk forårsmorgen i 1820 søgte den unge Joseph Smith at vide, hvilken
  kirke han skulle tilslutte sig. Han gik ind i skoven for at bede i nærheden af sit hjem i staten New
  York i USA. Han havde spørgsmål om sin sjæls frelse og stolede på, at Gud ville vejlede ham.
- I ydmyghed erklærer vi, at som svar på hans bøn viste Gud Faderen og hans Søn, Jesus Kristus, sig for
  Joseph og indledte den tid, hvor »alt det genoprettes« (ApG 3:21), som det er forudsagt i Bibelen. Af
  dette syn lærte han, at Kristi kirke i Det Nye Testamente var gået tabt på jorden efter de oprindelige
  apostles død. Joseph skulle være et redskab i dens tilbagevenden.
- Vi bekræfter, at himmelske budbringere under ledelse af Faderen og Sønnen kom for at instruere Joseph
  og genetablere Jesu Kristi Kirke. Den opstandne Johannes Døber gengav myndigheden til at døbe ved nedsænkning
  til syndernes forladelse. Tre af de oprindelige tolv apostle – Peter, Jakob og Johannes – gengav apostelembedet
  og nøglerne til præstedømmemyndighed. Andre kom også, herunder profeten Elias, som gengav myndigheden
  til at knytte familier sammen for evigt i evige forhold, der varer ud over døden.
- 'Vi bevidner endvidere, at Joseph Smith blev givet Guds gave og kraft til at oversætte en gammel optegnelse:
  Mormons Bog: Endnu et vidnesbyrd om Jesus Kristus. Siderne i denne hellige tekst indeholder en beretning
  om Jesu Kristi personlige virke blandt folket på den vestlige halvkugle kort tid efter hans opstandelse.
  Den lærer os om formålet med livet og forklarer Kristi lære, som er centralt for dette formål. Mormons
  Bog vidner som et helligt sidestykke til Bibelen om, at alle mennesker er sønner og døtre af en kærlig
  Fader i himlen, at han har en guddommelig plan for os, og at hans Søn, Jesus Kristus, taler i dag såvel
  som i gamle dage.'
- Vi erklærer, at Jesu Kristi Kirke af Sidste Dages Hellige, der blev organiseret den 6. april 1830, er
  Kristi genoprettede kirke fra Det Nye Testamente. Denne kirke er forankret i sin hovedhjørnesten, Jesus
  Kristus, og hans fuldkomne liv, hans uendelige forsoning og bogstavelige opstandelse. Jesus Kristus
  har atter kaldet apostle og har givet dem præstedømmemyndighed. Han indbyder os alle til at komme til
  sig, til at modtage Helligånden, frelsens ordinancer og til at opnå vedvarende glæde.
- To hundrede år er nu gået, siden denne genoprettelse blev igangsat af Gud Faderen og hans elskede Søn,
  Jesus Kristus. Millioner over hele verden har fået kundskab om disse profeterede begivenheder.
- Vi erklærer med glæde, at den lovede genoprettelse skrider fremad gennem fortsat åbenbaring. Jorden
  vil aldrig blive den samme igen, hvor Gud vil »sammenfatte [i ét] alt i Kristus« (Ef 1:10).
- Med ærbødighed og taknemlighed opfordrer vi som hans apostle alle til at vide – som vi ved – at himlene
  er åbne. Vi bekræfter, at Gud gør sin vilje kendt for sine elskede sønner og døtre. Vi vidner om, at
  de, der bønsomt studerer genoprettelsens budskab og handler i tro, vil blive velsignet med at få deres
  eget vidnesbyrd om dens guddommelighed og dens formål med at forberede verden på vor Herre og Frelsers,
  Jesu Kristi, andet komme.
