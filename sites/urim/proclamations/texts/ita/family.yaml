title: La famiglia
subtitle: Un proclama al mondo
author: Prima Presidenza e Consiglio dei Dodici Apostoli de La Chiesa di Gesù Cristo dei Santi degli Ultimi
  Giorni
note: Questo proclama è stato letto dal presidente Gordon B. Hinckley come parte del suo messaggio nella
  riunione generale della Società di Soccorso tenuta il 23 settembre 1995 a Salt Lake City, Utah.
paragraphs:
- Noi, Prima Presidenza e Consiglio dei Dodici Apostoli de La Chiesa di Gesù Cristo dei Santi degli Ultimi
  Giorni, proclamiamo solennemente che il matrimonio tra l’uomo e la donna è ordinato da Dio e che la
  famiglia è centrale nel piano del Creatore per il destino eterno dei Suoi figli.
- Tutti gli esseri umani — maschi e femmine — sono creati a immagine di Dio. Ognuno di essi è un beneamato
  figlio o figlia di spirito di genitori celesti e, come tale, ognuno di essi possiede una natura e un
  destino divini. Il genere sessuale è una caratteristica essenziale dell’identità e del fine preterreni,
  terreni ed eterni dell’individuo.
- Nel regno preterreno i figli e le figlie di spirito conoscevano e adoravano Dio come loro Padre Eterno
  e accettarono il Suo piano mediante il quale i Suoi figli potevano ricevere un corpo fisico e acquisire
  un’esperienza sulla terra per progredire verso la perfezione e infine realizzare il loro destino divino
  come eredi della vita eterna. Il piano divino di felicità consente ai rapporti familiari di perpetuarsi
  oltre la tomba. Le sacre ordinanze e alleanze disponibili nei sacri templi consentono alle persone di
  ritornare alla presenza di Dio e alle famiglie di essere unite per l’eternità.
- Il primo comandamento che Dio dette a Adamo ed Eva riguardava il loro potenziale di genitori come marito
  e moglie. Noi proclamiamo che il comandamento dato da Dio ai Suoi figli di moltiplicarsi e riempire
  la terra è sempre valido. Dichiariamo inoltre che Dio ha comandato che i sacri poteri della procreazione
  devono essere usati soltanto tra l’uomo e la donna legittimamente sposati come marito e moglie.
- Noi proclamiamo che i mezzi mediante i quali viene creata la vita terrena sono stati stabiliti divinamente.
  Noi affermiamo la santità della vita e la sua importanza nel piano eterno di Dio.
- Marito e moglie hanno la solenne responsabilità di amarsi e prendersi cura l’uno dell’altra e di amare
  e prendersi cura dei loro figli. “I figli sono un’eredità che viene dall’Eterno” (Salmi 127:3). I genitori
  hanno il sacro dovere di allevare i loro figli nell’amore e nella rettitudine, di provvedere alle loro
  necessità fisiche e spirituali, e di insegnare loro ad amarsi e a servirsi l’un l’altro, a osservare
  i comandamenti di Dio e a essere cittadini obbedienti alle leggi ovunque vivano. Mariti e mogli — madri
  e padri — saranno ritenuti responsabili dinanzi a Dio dell’assolvimento di questi obblighi.
- La famiglia è ordinata da Dio. Il matrimonio tra l’uomo e la donna è essenziale per il Suo piano eterno.
  I figli hanno il diritto di nascere entro il vincolo del matrimonio e di essere allevati da un padre
  e da una madre che rispettano i voti nuziali con assoluta fedeltà. La felicità nella vita familiare
  è meglio conseguibile quando è basata sugli insegnamenti del Signore Gesù Cristo. Il successo del matrimonio
  e della famiglia è fondato e mantenuto sui principi della fede, della preghiera, del pentimento, del
  perdono, del rispetto, dell’amore, della compassione, del lavoro e delle sane attività ricreative. Per
  disegno divino i padri devono presiedere le loro famiglie con amore e rettitudine e hanno la responsabilità
  di provvedere alle necessità di vita e alla protezione delle loro famiglie. La principale responsabilità
  delle madri è la cura dei figli. In queste sacre responsabilità, padri e madri sono tenuti ad aiutarsi
  l’un l’altro come soci alla pari. Le disabilità, la morte o altre circostanze possono richiedere degli
  adattamenti individuali. Gli altri parenti sono tenuti a dare un sostegno quando è necessario.
- Noi avvertiamo che le persone che violano le alleanze della castità, che maltrattano il coniuge o i
  figli, o che mancano di assolvere le loro responsabilità familiari saranno chiamate un giorno a renderne
  conto dinanzi a Dio. Inoltre, avvertiamo che la disintegrazione della famiglia richiamerà sugli individui,
  sulle comunità e sulle nazioni le calamità predette dai profeti antichi e moderni.
- Invitiamo i cittadini responsabili e i funzionari pubblici di tutto il mondo a promuovere quelle misure
  che hanno lo scopo di mantenere e rafforzare la famiglia come unità fondamentale della società.
