title: Trúaratriði
subtitle: Kirkju Jesú Krists hinna Síðari daga heilögu
author: ''
verses:
- n: 1
  text: Vér trúum á Guð, hinn eilífa föður, og á son hans, Jesú Krist, og á heilagan anda.
- n: 2
  text: Vér trúum, að mönnum verði refsað fyrir eigin syndir, en ekki fyrir brot Adams.
- n: 3
  text: Vér trúum, að fyrir friðþægingu Krists geti allir menn orðið hólpnir með hlýðni við lögmál og
    helgiathafnir fagnaðarerindisins.
- n: 4
  text: 'Vér trúum, að frumreglur og helgiathafnir fagnaðarerindisins séu: Í fyrsta lagi trú á Drottin
    Jesú Krist; í öðru lagi iðrun; í þriðja lagi skírn með niðurdýfingu til fyrirgefningar synda; í fjórða
    lagi handayfirlagning til veitingar á gjöf heilags anda.'
- n: 5
  text: Vér trúum, að maður verði að vera kallaður af Guði með spádómi og með handayfirlagningu þeirra
    sem vald hafa, til að prédika fagnaðarerindið og framkvæma helgiathafnir þess.
- n: 6
  text: Vér höfum trú á sama skipulagi og var í frumkirkjunni, þ.e. postulum, spámönnum, hirðum, fræðurum,
    guðspjallamönnum og svo framvegis.
- n: 7
  text: Vér höfum trú á gjöf til að tala tungum, gjöf spádóma, opinberana, sýna, lækninga, túlkunar tungna
    og svo framvegis.
- n: 8
  text: Vér trúum, að Biblían sé orð Guðs, að svo miklu leyti sem hún er rétt þýdd. Vér trúum einnig,
    að Mormónsbók sé orð Guðs.
- n: 9
  text: Vér trúum öllu, sem Guð hefur opinberað, öllu, sem hann nú opinberar, og vér trúum að hann muni
    enn opinbera margt stórfenglegt og mikilvægt varðandi Guðs ríki.
- n: 10
  text: Vér höfum trú á hinni raunverulegu samansöfnun Ísraels og endurreisn hinna tíu kynkvísla; að Síon
    (Nýja Jerúsalem) verði reist á meginlandi Ameríku, að Kristur muni sjálfur ríkja hér á jörðu og að
    jörðin verði endurnýjuð og hljóti paradísardýrð sína.
- n: 11
  text: Vér krefjumst þeirra réttinda að fá að tilbiðja almáttugan Guð, eftir því sem eigin samviska býður,
    og viðurkennum sömu réttindi til handa öllum mönnum. Lofum þeim að tilbiðja, hvernig, hvar eða hvað,
    sem þeim þóknast.
- n: 12
  text: Vér höfum trú á að lúta konungum, forsetum, stjórnendum og yfirvöldum með því að hlýða lögunum,
    virða þau og styðja.
- n: 13
  text: 'Vér trúum, að vér eigum að vera heiðvirð, sönn, skírlíf, góðgjörn, dyggðug og gjöra öllum mönnum
    gott. Vér getum í sannleika sagt, að vér förum eftir áminningu Páls: Vér trúum öllu, vér vonum allt,
    vér höfum staðist margt og vér vonumst til þess að geta staðist allt. Sé eitthvað dyggðugt, fagurt,
    háleitt eða lofsvert, þá sækjumst vér eftir því.'
signature: Joseph Smith.
