retrieved: '2026-11-02'
title: Endurreisn fyllingar fagnaðarerindis Jesú Krists
subtitle: Tvö hundruð ára afmælisyfirlýsing til heimsins
author: Æðsta forsætisráð og Tólfpostularáð Kirkju Jesú Krists hinna Síðari daga heilögu
note: Yfirlýsingu þessa las Russell M. Nelson forseti, sem hluta af boðskap sínum á 190. aðalráðstefnu,
  5. apríl 2020, í Salt Lake City, Utah.
paragraphs:
- Við lýsum hátíðlega yfir að Guð elskar börn sín meðal allra þjóða heimsins. Guð faðirinn hefur gefið
  okkur guðlega fæðingu, óviðjafnanlegt líf og altæka friðþægingarfórn síns elskaða sonar, Jesú Krists.
  Fyrir mátt föðurins, reis Jesús upp aftur og sigraði dauðann. Hann er frelsari okkar, fyrirmynd okkar
  og lausnari okkar.
- Fyrir tvö hundruð árum, á fallegum vormorgni, árið 1820, hélt hinn ungi Joseph Smith út í skóg til bænar,
  nærri heimili sínu í uppsveitum New York, Bandaríkjunum, til að vita í hvaða kirkju hann ætti að ganga.
  Hann hafði spurningar varðandi eigin sáluhjálp og treysti því að Guð hjálpaði sér.
- Af auðmýkt lýsum við yfir, að sem svar við bæn Josephs Smith, birtust Guð faðirinn og sonur hans, Jesús
  Kristur, honum og innleiddu „endurreisn allra hluta“ (sjá Postulasagan 3:21), eins og sagt er fyrir
  um í Biblíunni. Í þessari sýn komst hann að því að kirkja Krists í Nýja testamentinu hafði glatast á
  jörðu, eftir dauða hinna upprunalegu postula. Joseph átti ríkan þátt í endurreisn hennar.
- Við staðfestum að himneskir sendiboðar komu, undir leiðsögn föðurins og sonarins, til að leiðbeina Joseph
  og endurreisa kirkju Jesú Krists. Hinn upprisni Jóhannes skírari endurreisti valdið til að skíra með
  niðurdýfingu til fyrirgefningar synda. Þrír hinna upprunalegu tólf postula – Pétur, Jakob og Jóhannes
  – endurreistu postuladóminn og lykla prestdæmisvalds. Aðrir komu líka, þar á meðal Elía, sem endurreisti
  valdið til ævarandi sameiningar fjölskyldna í eilíf sambönd, sem ná út fyrir dauða.
- 'Við vitnum ennfremur að Joseph Smith fékk gjöf og kraft Guðs til að þýða forna heimild: Mormónsbók
  – Annað vitni um Jesú Krist. Í þessu helga riti eru síður sem segja frá persónulegri þjónustu Jesú Krists
  meðal fólks á vesturhveli jarðar, fljótlega eftir upprisu hans. Bókin kennir um tilgang lífsins og útskýrir
  kenningu Krists, sem er kjarni þess tilgangs. Sem ritningarfélagi Biblíunnar, vitnar Mormónsbók að allar
  manneskjur séu synir og dætur kærleiksríks föður á himnum, að hann hafi guðlega áætlun fyrir líf okkar
  og að sonur hans, Jesús Kristur, tali á okkar tíma, sem til forna.'
- Við lýsum yfir að Kirkja Jesú Krists hinna Síðari daga heilögu, stofnuð 6. apríl 1830, er hin endurreista
  kirkja Krists í Nýja testamentinu. Kirkja þessi er grundvölluð á hinu fullkomna lífi aðalhyrningasteins
  hennar, Jesú Krists, og altækri friðþægingu hans og bókstaflegri upprisu. Jesús Kristur hefur enn að
  nýju kallað postula og veitt þeim prestdæmisvald. Hann býður okkur öllum að koma til sín og kirkju sinnar,
  að taka á móti heilögum anda, helgiathöfnum sáluhjálpar og hljóta varanlega gleði.
- Tvö hundruð ár hafa nú liðið frá því að þessi endurreisn var hafin af Guði föðurnum og ástkærum syni
  hans, Jesú Kristi. Milljónir um heim allan hafa hlotið þekkingu á þessum forspáðu atburðum.
- Við lýsum fagnandi yfir að hinni fyrirheitnu endurreisn miðar áfram með viðvarandi opinberun. Jörðin
  verður aldrei aftur söm, því Guð mun „safna öllu … undir eitt höfuð í Kristi“ (Efesusbréfið 1:10).
- Með lotningu og þakklæti bjóðum við, sem postular hans, öllum að vita – eins og við vitum – að himnarnir
  eru opnir. Við staðfestum að Guð kunngerir sínum ástkæru sonum og dætrum vilja sinn. Við vitnum að þeir
  sem af kostgæfni ígrunda boðskap endurreisnarinnar og ganga fram í trú, munu blessaðir til að hljóta
  eigin vitnisburð um guðleika hennar og tilgang til að búa heiminn undir síðari komu Drottins okkar,
  Jesú Krists.
