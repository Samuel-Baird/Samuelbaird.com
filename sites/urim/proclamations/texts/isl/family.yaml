title: Fjölskyldan
subtitle: Yfirlýsing til heimsins
author: Æðsta forsætisráðið og Tólfpostularáðið í Kirkju Jesú Krists hinna Síðari daga heilögu
note: Yfirlýsingu þessa las Gordon B. Hinckley forseti sem hluta af boðskap sínum á aðalráðstefnu Líknarfélagsins
  sem haldin var 23. september 1995 í Salt Lake City, Utah.
paragraphs:
- Við, Æðsta forsætisráðið og Tólfpostularáðið í Kirkju Jesú Krists hinna Síðari daga heilögu, lýsum því
  hátíðlega yfir að hjónaband milli karls og konu er vígt af Guði og að fjölskyldan er kjarninn í áætlun
  skaparans um eilíf örlög barna hans.
- Allar mannlegar verur – karlar og konur – eru skapaðar í mynd Guðs. Hver þeirra er ástkær andasonur
  eða dóttir himneskra foreldra og sem slík á sérhvert þeirra sér guðlegt eðli og örlög. Kynferði er nauðsynlegur
  eiginleiki einstaklingsins, sem einkennir hann og samræmist tilgangi hans í fortilveru, jarðneskri tilveru
  og um eilífð.
- Í fortilverunni þekktu og tilbáðu andasynir og dætur Guðs hann sem eilífan föður og samþykktu áætlun
  hans, en samkvæmt henni gátu börn hans hlotið efnislíkama og öðlast jarðneska reynslu til að feta í
  átt að fullkomnun og að lokum gera að veruleika guðleg örlög sín sem erfingjar eilífs lífs. Hin guðlega
  sæluáætlun gerir fjölskylduböndin varanleg handan grafar. Helgiathafnir og sáttmálar í heilögum musterum
  gera mönnum mögulegt að komast aftur í návist Guðs og fjölskyldum að sameinast að eilífu.
- Fyrsta boðorðið sem Guð gaf Adam og Evu varðaði mögulegt foreldrahlutverk þeirra sem eiginmanns og eiginkonu.
  Við lýsum því yfir að boðorð Guðs til barna hans um að margfaldast og uppfylla jörðina er enn í gildi.
  Við lýsum því jafnframt yfir að Guð hefur boðið að hinn helgi kraftur getnaðar skuli aðeins notaður
  milli karls og konu í löglega vígðu hjónabandi.
- Við lýsum því yfir að leiðin til sköpunar jarðlífsins er guðlega tilnefnd. Við staðfestum helgi lífsins
  og mikilvægi þess í eilífri áætlun Guðs.
- Eiginmaður og eiginkona bera þá helgu ábyrgð að elska og annast hvort annað og börn sín. „[Börn] eru
  gjöf frá Drottni“ (Sálmarnir 127:3). Foreldrar hafa þá helgu skyldu að ala börn sín upp í kærleika og
  réttlæti, að sjá fyrir líkamlegum og andlegum þörfum þeirra, að kenna þeim að elska hvert annað og þjóna
  hvert öðru, að virða boðorð Guðs og vera löghlýðnir þegnar, hvar sem þau búa. Eiginmenn og eiginkonur
  – mæður og feður – verða ábyrg frammi fyrir Guði, ef þau bregðast þessum skyldum.
- Fjölskyldan er vígð af Guði. Hjónaband milli karls og konu er nauðsynlegt eilífri áætlun hans. Börn
  eiga rétt á því að fæðast innan hjónabandsins, vera alin upp af föður og móður sem heiðra hjónabandseiða
  sína af fullkominni tryggð. Hamingju í fjölskyldulífi hljótum við fyrst og fremst þegar við byggjum
  á kenningum Drottins Jesú Krists. Farsælt hjónaband og fjölskyldulíf byggist og varðveitist á reglum
  trúar, bænar, iðrunar, fyrirgefningar, virðingar, kærleika, umhyggju, vinnu og heilbrigðrar dægrastyttingar.
  Samkvæmt guðlegri áætlun eiga feður að vera í forsæti fjölskyldu sinnar í kærleika og réttlæti og bera
  þá ábyrgð að sjá henni fyrir nauðsynjum lífsins og vernda hana. Meginábyrgð mæðra er að annast börnin.
  Við þessa helgu ábyrgð ber feðrum og mæðrum skylda til að hjálpa hvort öðru sem jafningjar. Sjúkdómar,
  andlát eða aðrar aðstæður geta gert persónulega aðlögun nauðsynlega. Ættingjar ættu að veita stuðning
  þegar með þarf.
- Við vörum við því að einstaklingar sem rjúfa sáttmála skírlífis, sem misþyrma maka eða barni eða sinna
  ekki ábyrgð sinni gagnvart fjölskyldunni, munu síðar meir verða að standa ábyrgir gerða sinna frammi
  fyrir Guði. Við vörum einnig við því að sundrung fjölskyldunnar mun leiða yfir einstaklinga, samfélög
  og þjóðir þær hörmungar sem spámenn fyrr og nú hafa sagt fyrir um.
- Við biðjum alla ábyrga þegna og opinbera embættismenn alls staðar að efla þá þætti sem ætlaðir eru til
  að varðveita og styrkja fjölskylduna sem grundvallareiningu þjóðfélagsins.
