retrieved: '2026-11-02'
title: Jesucristo Evanhélio Plenitu Restaurasiõ
subtitle: Peteĩ Ñemomarandu Múndope g̃uarã Bicentenario rehe
author: Jesucristo Tupao Santokuéra Ára Pahapegua Primera Presidencia ha Consejo de los Doce Apóstoles
note: Reverencia ha aguije reheve, ore, Ijapostolkuéra ramo ro’invita opavavépe oikuaa hag̃ua—ore roikuaaháicha—umi
  yvága ojepe’aha. Romoañete Tupã oikuaaukaha hína Hembipota Ita’ýra ha Itajyrakuéra ohayhuetévape g̃uarã.
  Rotestifika umi oestudiáva ñembo’e reheve pe Rrestaurasiõ mensáhe ha o’actua jerovia reheve, ojehovasataha
  ohupyty hag̃ua itestimonio tee, idivinida ha ipropósitogui ombosako’i hag̃ua ko múndo Ñandejára ha Salvador,
  Jesucristo, Jejujey Mokõiha oñeprometeva’ekuépe g̃uarã.
paragraphs:
- Ore, marangatúpe romomarandu Tupã ohayhuha Ita’yrakuéra opa mundo retãmeguápe. Tupã pe Túva ome’ẽva’ekue
  ñandéve Ita’ýra Ohayhuetéva, Jesucristo, ñegueronase divino, rekove ijojaha’ỹva ha jehasa’asy expiatorio
  ijapyra’ỹva. Túva pu’aka rupi, Jesús oikovejey ha ohupyty pe pu’aka ñemano ári. Ha’e ñande Salvador,
  ñane rembiecharã ha ñane Redentor.
- Ojapo dosciento ary, peteĩ arapoty pyhareve porãite jave 1820-pe, mitãrusu José Smith, oñeha’ãvo oikuaa
  mba’e tupaópepa ojoajuva’erã, oho oñembo’e hag̃ua peteĩ ka’aguýpe hi’ag̃uiva hógagui estado de Nueva
  York, Estados Unidos-pe. Ha’e orekókuri ñeporandu hi’ánga salvasiõ rehegua ha oguerovia Tupã oisambyhytaha
  chupe.
- Humilda reheve, romomarandu iñembo’e ñembohováirõ, Tupã upe Túva ha Ita’ýra, Jesucristo, ojehechauka
  hague José-pe ha omoñepyrũ pe “opa mba’e rrestaurasiõ” (tojehecha Hechos 3:21) oje’e haguéicha Biblia-pe.
  Ko Visiõme, José oikuaa Cristo Tupao Nuevo Testamento-pegua okañy hague yvy árigui, umi Apóstol ypykue
  omanomba rire, ha José ha’etaha tembiporu imba’eguasúva iñemoĩjeýpe.
- Romoañete, upe Túva ha Ta’ýra sambyhy guýpe, ouhague yvagagua maranduharakuéra ohekombo’e hag̃ua José-pe
  ha omoĩ jey hag̃ua Jesucristo Tupao. Juan el Bautista, tekove oikovejeýva ramo, omoĩjey pe autorida
  oñemongarai hag̃ua ñeñapymi rupi angaipakuéra rremisiõrã. Mbohapy umi Doce Apóstol ypykue – Pedro, Santiago
  ha Juan – omoĩjey upe apostolado ha sacerdocio autorida llavekuéra. Ou avei ambuekuéra, ijapytépe Elías
  pe Profeta, omoĩjeýva pe autorida oñembojoaju hag̃ua familiakuéra tapiaite g̃uarã, joaju opave’ỹvape,
  ohóva ñemanógui amogotyove.
- 'Rome’ẽ avei testimonio José Smith-pe oñeme’ẽ hague Tupã don ha pu’aka ombohasa hag̃ua peteĩ jehaipyre
  ymaguare: Mormón Kuatiañe’ẽ—Ambue Jesucristo Testamento. Umi jehai sagrado roguépe oĩ peteĩ ñemombe’u
  Jesucristo ministerio personal-gui yvyporakuéra hemisferio occidental-pegua apytépe, Ijeikovejey riremi.
  Ombo’e ko tekove propósito ha omyesakã Cristo doctrina, imba’eguasúva upe propositorã. Peteĩ escritura
  ramo omoirũva Biblia-pe, Mormón Kuatiañe’ẽ otestifika opaite yvyporakuéra ha’eha peteĩ Túva Yvagapegua
  oporohayhúva ra’y ha rajykuéra, Ha’e oguerekoha peteĩ plan divino ñande rekovépe g̃uarã ha Ita’ýra Jesucristo,
  oñe’ẽha avei ko árape, ojapo haguéicha ára ymaguarépe.'
- Romomarandu Jesucristo Tupao Santokuéra Ára Pahapegua, oñe’organisava’ekue Abril 6 1830-pe, ha’eha Cristo
  Tupao Nuevo Testamento-pegua oñemoĩjeyva’ekue. Ko Tupao oñemboguapy Jesucristo, ha’éva iprincipal piedra
  angular, rekove perfecto ári, ha Iñexpiasiõ ijapyra’ỹva ha Ijeikovejey añete ári. Jesucristo ohenói
  jey Apostol-kuéra ha ome’ẽ chupekuéra pe sacerdocio autorida. Ha’e ñane’invita opavavépe jaju hag̃ua
  Hendápe ha Itupaópe, jarresivi hag̃ua pe Espiritu Santo, umi ordenansa salvasiõrã, ha jahupyty hag̃ua
  vy’apavẽ hi’aréva.
- Ohasáma dosciento ary Tupã pe Túva ha Ita’ýra Ohayhuetéva, Jesucristo, omoñepyrũ hague ko Rrestaurasiõ.
  Millones ko múndope oñañuã ko’ã tembiasa ojeprofetisava’ekue kuaapy.
- Vy’a reheve romomarandu upe Rrestaurasiõ oñeprometeva’ekue ohoha tenonde gotyo rrevelasiõ meme rupive.
  Ko yvy araka’eve ndaha’emo’ãvéima ha’ehaguéicha, Tupã “ombyatýta[gui] opa mba’e Cristo-pe” (tojehecha
  Efesios 1:10).
