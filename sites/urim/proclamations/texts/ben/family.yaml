title: পরিবার
subtitle: বিশ্বের কাছে একটি ঘোষণা
author: শেষকালীন ধার্মিকদের যীশু খ্রীষ্টের মন্ডলীর প্রথম প্রেসিডেন্সি ও বারোজন প্রেরিতের পরিষদ্
note: ২৩শে সেপ্টেম্বর, ১৯৯৫ তারিখে, সল্ট লেক সিটি, উটাহতে অনুষ্ঠিত সাধারণ রিলিফ সোসাইটি মিটিংয়ে, প্রেসিডেন্ট
  গর্ডন বি হিঙ্কলি তাঁর বার্তার একটি অংশ হিসাবে এই ঘোষণাটি পড়েছিলেন।
paragraphs:
- আমরা শেষকালীন ধার্মিকদের যীশু খ্রীষ্টের মন্ডলীর প্রথম প্রেসিডেন্সি ও বারোজন প্রেরিতের পরিষদ্, আন্তরিকভাবে
  ঘোষণা করছি যে, একজন পুরুষ ও একজন নারীর মধ্যে বিবাহ ঈশ্বরের দ্বারা নিযুক্ত করা এবং পরিবার হলো স্রষ্টার
  পরিকল্পনার কেন্দ্রবিন্দু যাতে তাঁর সন্তানরা অনন্ত নিয়তি পায়।
- পুরুষ ও মহিলা—সমস্ত মানুষ—ঈশ্বরের প্রতিমূর্তিতে তৈরি হয়েছে। প্রত্যেকে স্বর্গীয় পিতামাতার অত্যন্ত প্রিয়
  আত্মিক পুত্র বা কন্যা এবং সেজন্য প্রত্যেকের একটি ঐশ্বরিক চরিত্র ও নিয়তি আছে। লিঙ্গ প্রত্যেক ব্যক্তির
  প্রাথমিক জীবন, মর্ত জীবন, এবং অনন্ত পরিচয় ও উদ্দেশ্যের একটি অপরিহার্য চরিত্র।
- প্রাথমিক জীবনের রাজ্যে, আত্মিক পুত্র ও কন্যারা ঈশ্বরকে তাদের অনন্ত পিতা হিসাবে জানতো ও আরাধনা করতো এবং
  তাঁর পরিকল্পনা গ্রহণ করেছিলো যাতে তাঁর সন্তানরা শারীরিক শরীর লাভ করতে পারে এবং পার্থিব অভিজ্ঞতা লাভ
  করে পরিপূর্ণতার দিকে অগ্রগতি হওয়া এবং সর্বশেষে তাদের ঐশ্বরিক ভাগ্যকে অনন্ত জীবনের উত্তরাধিকারী হিসেবে
  অর্জন করতে পারে। সুখের ঐশ্বরিক পরিকল্পনা, সমাধিকে অতিক্রম করে পারিবারিক সম্পর্ককে চিরস্থায়ী করতে সহায়তা
  করে। পবিত্র ধর্মধামে পাওয়া পবিত্র ধর্মানুষ্ঠান ও চুক্তিগুলি মানুষকে ঈশ্বরের উপস্থিতিতে ফিরে যেতে এবং
  পরিবারকে চিরতরের জন্য যুক্ত করতে সাধ্য করে।
- ঈশ্বর আদম ও হবাকে প্রথম যে আজ্ঞা দিয়েছিলেন তা ছিলো স্বামী-স্ত্রী হিসেবে তাদের অভিভাবকত্বের সম্ভাবনা
  সম্পর্কে। আমরা ঘোষণা করি যে, তাঁর সন্তানদের সংখ্যাবৃদ্ধি ও পৃথিবী পুনরায় পূর্ণ করার জন্য ঈশ্বরের আদেশ
  বৈধ। আমরা আরও ঘোষণা করছি যে, ঈশ্বর আদেশ দিয়েছেন যে জন্মদান করার পবিত্র ক্ষমতা কেবল পুরুষ ও নারীর মধ্যে,
  স্বামী ও স্ত্রী হিসাবে আইনত বিবাহের মধ্যেই নিযুক্ত হবে।
- আমরা ঘোষণা করি যেভাবে মর্ত জীবন তৈরী হয়েছে সেটা ঐশ্বরিকভাবে নিরূপিত করা হয়েছে। আমরা আমাদের জীবনের
  পবিত্রতার সত্যতা সমর্থন করি এবং তার গুরুত্ব ঈশ্বরের অনন্ত পরিকল্পনার মধ্যে।
- স্বামী ও স্ত্রীর একটি গুরুত্বপূর্ণ দায়িত্ব আছে, একে অপরকে এবং তাদের সন্তানদেরকে ভালবাসা ও যত্ন নেওয়া।
  "শিশুরা প্রভুর একটি ঐতিহ্য" (গীতসংহিতা ১২৭:৩)। পিতা-মাতাদের পবিত্র দায়িত্ব হলো তাদের সন্তানদের ভালবাসা
  ও ন্যায়পরায়ণতার সাথে লালন-পালন করা, তাদের শারীরিক ও আধ্যাত্মিক চাহিদাগুলি প্রদান করা এবং তাদেরকে একে
  অন্যকে ভালোবাসতে ও সেবা করতে, ঈশ্বরের আদেশ পালন করতে, এবং যেখানেই তারা বাস করুক না কেন আইন-শৃঙ্খলারক্ষাকারী
  নাগরিক হতে শেখানো। স্বামী ও স্ত্রীকে—মাতা ও পিতাকে—এই বাধ্যবাধকতাগুলোর জন্য ঈশ্বরের কাছে দায়বদ্ধ রাখা
  হবে।
- ঈশ্বরের দ্বারা পরিবার নিযু্ক্ত হয়েছে। তাঁর অনন্ত পরিকল্পনার জন্য পুরুষ এবং মহিলার মধ্যে বিবাহ অপরিহার্য।
  সন্তানরা বিবাহ বন্ধনের মধ্যে জন্ম গ্রহণ করতে পারে, এবং পিতা ও মাতার দ্বারা পালিত হবে যারা পূর্ণ বিশ্বস্ততার
  সাথে বৈবাহিক প্রতিজ্ঞাকে সম্মান করে। প্রভু যীশু খ্রীষ্টের শিক্ষার উপর প্রতিষ্ঠিত হলে পারিবারিক জীবনে
  সুখ অর্জনের সম্ভাবনা সবচেয়ে বেশি। সফল বিবাহ এবং পরিবার প্রতিষ্ঠিত এবং প্রতিপালিত হয় বিশ্বাস, প্রার্থনা,
  অনুতাপ, ক্ষমা, সম্মান, প্রেম, সমবেদনা, কাজ, এবং স্বাস্থ্যকর বিনোদন কার্যক্রমের নীতির উপর। ঐশ্বরিক নকশা
  অনুযায়ী, পিতারা তাদের পরিবারের উপর ভালবাসা এবং ন্যায়পরায়ণতায় সভাপতিত্ব করেন এবং তাদের পরিবারের জন্য
  জীবনের প্রয়োজনীয়তা এবং সুরক্ষা প্রদানের দায়িত্ব পালন করেন। মাতাদের দায়িত্ব মূলত সন্তানদের লালন-পালন
  করা। এই পবিত্র দায়িত্বগুলিতে, পিতা ও মাতা সমান অংশীদার হিসেবে একে অপরের সহয়তা করতে বাধ্য। প্রতিবন্ধকতা,
  মৃত্যু বা অন্যান্য পরিস্থিতিতে ব্যক্তিগত অভিযোজন প্রয়োজন হতে পারে। প্রয়োজনের সময় আত্মীয়স্বজনের সহায়তা
  করা উচিত।
- আমরা সাবধান করে দিচ্ছি যে, যারা বিশুদ্ধতার চুক্তিসমূহ ভঙ্গ করে, যারা স্বামী বা স্ত্রীকে অথবা সন্তানকে
  অপব্যবহার করে অথবা যারা পরিবারগত দায়িত্ব পালনে ব্যর্থ হয় তারা একদিন ঈশ্বরের সামনে দায়বদ্ধ থাকবে।
  আরও, আমরা সতর্ক করে দিচ্ছি যে, পরিবারের ভাঙ্গনের ফলে ব্যক্তি, সম্প্রদায় এবং জাতির উপর প্রাচীন ও আধুনিক
  ভাববাদীদের দ্বারা ভবিষ্যদ্বাণী করা বিপর্যয় নিয়ে আসবে।
- আমরা সমাজের মৌলিক একক হিসাবে পরিবারকে বজায় রাখতে এবং শক্তিশালী করার জন্য পরিকল্পিত পদক্ষেপগুলির উন্নতি
  করার জন্য দায়িত্বশীল নাগরিক এবং সরকারের কর্মকর্তাদের সর্বত্র আহ্বান জানাচ্ছি।
