title: যীশু খ্রীষ্টের সুসমাচারের পূর্ণতার পুনরূদ্ধার
subtitle: বিশ্বের কাছে একটা দ্বিশততমবর্ষীয় ঘোষণা
author: শেষকালীন ধার্মিকদের যীশু খ্রীষ্টের মন্ডলীর প্রথম প্রেসিডেন্সি ও বারোজন প্রেরিতের পরিষদ
note: এই ঘোষণাটা প্রেসিডেন্ট রাসেল এম. নেলসন, ৫ই এপ্রিল, ২০২০ তারিখে উটাহ-এর সল্ট লেক সিটিতে অনুষ্ঠিত
  ১৯০তম বার্ষিক সাধারণ সম্মেলনে তাঁর বার্তার অংশ হিসেবে পাঠ করেন।
paragraphs:
- আমরা দৃঢ়ভাবে ঘোষণা করি যে ঈশ্বর পৃথিবীর সকল জাতির সন্তানদের ভালোবাসেন। ঈশ্বর, আমাদের পিতা তাঁর প্রিয়
  পুত্র যীশু খ্রীষ্টের ঐশ্বরিক জন্ম, অতুলনীয় জীবন এবং অসীম প্রায়শ্চিত্তমূলক ত্যাগ দান করেছেন। পিতার
  ক্ষমতার দ্বারা যীশু পুনরুত্থিত হয়েছিলেন এবং মৃত্যুর উপর জয় লাভ করেছিলেন। তিনি আমাদের ত্রাণকর্তা, আমাদের
  আদর্শ এবং আমাদের মুক্তিদাতা।
- দুইশত বছর আগে, ১৮২০ সালের এক সুন্দর বসন্তের সকালে, তরুণ যোসেফ স্মিথ কোন মন্ডলীতে যোগ দেবেন তা জানার
  জন্য মার্কিন যুক্তরাষ্ট্রের নিউ ইয়র্কের উত্তরাঞ্চলে তাঁর বাড়ির কাছের বনে প্রার্থনা করতে গিয়েছিলেন।
  তাঁর আত্মার পরিত্রাণ নিয়ে তাঁর মনে প্রশ্ন ছিলো এবং তিনি বিশ্বাস করেছিলেন যে ঈশ্বরই তাঁকে পথ দেখাবেন।
- বিনয়ের সাথে, আমরা ঘোষণা করছি যে তাঁর প্রার্থনার উত্তরে, পিতা ঈশ্বর এবং তাঁর পুত্র যীশু খ্রীষ্ট যোসেফের
  কাছে আবির্ভূত হয়েছিলেন এবং বাইবেলে ভবিষ্যদ্বাণী অনুসারে “সমস্ত বিষয়ের পুনঃস্থাপন” (প্রেরিত ৩:২১) শুরু
  করেছিলেন। এই দর্শনে, তিনি জানতে পারেন যে আদি প্রেরিতদের মৃত্যুর পর, খ্রীষ্টের নতুন নিয়মের মণ্ডলী পৃথিবী
  থেকে হারিয়ে গিয়েছিলো। এর প্রত্যাবর্তনে যোসেফ গুরুত্বপূর্ণ ভূমিকা পালন করবেন।
- আমরা সমর্থন করি যে পিতা ও পুত্রের নির্দেশনায়, স্বর্গীয় দূতগণ যোসেফকে শিক্ষা দিতে এবং যীশু খ্রীষ্টের
  মণ্ডলী পুনঃপ্রতিষ্ঠা করতে এসেছিলেন। পুনরুত্থিত বাপ্তিস্মদাতা যোহন পাপমোচনের জন্য নিমজ্জনের দ্বারা বাপ্তিস্ম
  দেওয়ার কর্তৃত্ব পুনরুদ্ধার করেছিলেন। মূল বারোজন প্রেরিতের মধ্যে তিনজন—পিতর, যাকোব এবং যোহন—যোসেফ স্মিথের
  কাছে প্রেরিত পদ এবং যাজকত্বের চাবিগুলো পুনরুদ্ধার করেছিলেন। আরও অনেকে এসেছিলেন, যাদের মধ্যে এলিয়ও ছিলেন,
  যিনি মৃত্যুকে অতিক্রমকারী অনন্তকালীন সম্পর্কে পরিবারগুলোকে চিরকালের জন্য একত্রিত করার কর্তৃত্ব পুনরুদ্ধার
  করেছিলেন।
- 'আমরা আরও সাক্ষ্য দিই যে, যোসেফ স্মিথকে একটা প্রাচীন নথি: মরমনের পুস্তক—অনুবাদ করার জন্য ঈশ্বরের একটা
  দান ও ঈশ্বরের একটা ক্ষমতা দেওয়া হয়েছিলো যেই পুস্তক হলো যীশু খ্রীষ্টের আরেকটি সাক্ষ্য। এই পবিত্র গ্রন্থের
  পৃষ্ঠাগুলোতে যীশু খ্রীষ্টের পুনরুত্থানের কিছু সময় পরেই পশ্চিম গোলার্ধের মানুষের মধ্যে তাঁর ব্যক্তিগত
  পরিচর্যার বিবরণ রয়েছে। এটা জীবনের উদ্দেশ্য সম্পর্কে শিক্ষা দেয় এবং খ্রীষ্টের উপদেশাবলী ব্যাখ্যা করে,
  যা সেই উদ্দেশ্যের কেন্দ্রবিন্দু। বাইবেলের একটা সহযোগী ধর্মগ্রন্থ হিসেবে, মরমনের পুস্তক সাক্ষ্য দেয়
  যে, সকল মানুষ স্বর্গের এক প্রেমময় পিতার পুত্র ও কন্যা, আমাদের জন্য তাঁর একটা ঐশ্বরিক পরিকল্পনা রয়েছে
  এবং তাঁর পুত্র, যীশু খ্রীষ্ট, প্রাচীনকালের মতো আজও কথা বলেন।'
- আমরা ঘোষণা করছি যে ১৮৩০ সালের ৬ই এপ্রিল প্রতিষ্ঠিত, শেষকালীন ধার্মিকদের যীশু খ্রীষ্টের মণ্ডলী হলো, খ্রীষ্টের
  পুনরুদ্ধারকৃত নতুন নিয়মের মণ্ডলী। এই মণ্ডলী তাঁর প্রধান ভিত্তি-প্রস্তর, যীশু খ্রীষ্টের নিখুঁত জীবন
  এবং তাঁর অসীম প্রায়শ্চিত্ত ও আক্ষরিক পুনরুত্থানে প্রোথিত। যীশু খ্রীষ্ট পুনরায় প্রেরিতদের আহ্বান করেছেন
  এবং তাদের যাজকত্বের কর্তৃত্ব দিয়েছেন। তিনি আমাদের সকলকে তাঁর ও তাঁর মণ্ডলীর কাছে আসার জন্য, পবিত্র
  আত্মা ও পরিত্রাণের বিধানসমূহ গ্রহণ করার জন্য এবং চিরস্থায়ী আনন্দ লাভ করার জন্য আমন্ত্রণ জানান।
- পিতা ঈশ্বর এবং তাঁর প্রিয় পুত্র যীশু খ্রীষ্ট কর্তৃক এই পুনরুদ্ধার প্রক্রিয়া শুরু হওয়ার পর এখন দুইশত
  বছর অতিবাহিত হয়েছে। বিশ্বজুড়ে লক্ষ লক্ষ মানুষ এই ভবিষ্যদ্বাণীকৃত ঘটনাগুলোর শিক্ষাকে গ্রহণ করেছে।
- আমরা আনন্দের সাথে ঘোষণা করছি যে প্রতিশ্রুত পুনরুদ্ধার অবিরাম দৈববাণীর মাধ্যমে এগিয়ে চলেছে। পৃথিবী আর
  কখনও আগের মতো হবে না, কারণ ঈশ্বর “খ্রীষ্টে সকল বস্তুকে একত্র করবেন” (ইফিষীয় ১:১০)।
- শ্রদ্ধা ও কৃতজ্ঞতার সাথে, আমরা তাঁর প্রেরিতগণ হিসেবে সকলকে আমন্ত্রণ জানাই—আমাদের মতোই—জানতে যে স্বর্গ
  আজও উন্মুক্ত। আমরা দৃঢ়ভাবে বিশ্বাস দিই যে ঈশ্বর তাঁর প্রিয় পুত্র ও কন্যাদের জন্য তাঁর ইচ্ছা প্রকাশ
  করছেন। আমরা সাক্ষ্য দিই যে যারা প্রার্থনার সাথে পুনরুদ্ধারের বার্তা অধ্যয়ন করে এবং বিশ্বাসে কাজ করে,
  তারা এর ঐশ্বরিকতা এবং আমাদের প্রভু ও ত্রাণকর্তা যীশু খ্রীষ্টের প্রতিশ্রুত দ্বিতীয় আগমনের জন্য বিশ্বকে
  প্রস্তুত করার উদ্দেশ্য সম্পর্কে নিজেদের সাক্ষ্য লাভ করে আশীর্বাদপ্রাপ্ত হবে।
