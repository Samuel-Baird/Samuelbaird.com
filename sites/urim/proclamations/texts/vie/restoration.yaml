title: Sự Phục Hồi Phúc Âm Trọn Vẹn của Chúa Giê Su Ky Tô
subtitle: Bản Tuyên Ngôn Kỷ Niệm Hai Trăm Năm cùng Thế Giới
author: Đệ Nhất Chủ Tịch Đoàn và Hội Đồng Mười Hai Vị Sứ Đồ của Giáo Hội Các Thánh Hữu Ngày Sau của Chúa
  Giê Su Ky Tô
note: Bản tuyên ngôn này đã được Chủ Tịch Russell M. Nelson đọc như là một phần sứ điệp của ông tại Đại
  Hội Trung Ương Thường Niên kỳ thứ 190 vào ngày 5 tháng Tư năm 2020, ở Salt Lake City, Utah.
paragraphs:
- Chúng tôi long trọng tuyên bố rằng Thượng Đế yêu thương con cái của Ngài ở mọi quốc gia trên thế giới.
  Thượng Đế Đức Chúa Cha đã ban cho chúng ta sự giáng sinh thiêng liêng, cuộc sống độc nhất vô nhị và
  sự hy sinh chuộc tội vô hạn của Con Trai Yêu Dấu của Ngài, Chúa Giê Su Ky Tô. Bởi quyền năng của Đức
  Chúa Cha, Chúa Giê Su đã sống lại và chiến thắng cái chết. Ngài là Đấng Cứu Rỗi, Đấng Gương Mẫu và Đấng
  Cứu Chuộc của chúng ta.
- Cách đây hai trăm năm, trong một buổi sáng đẹp trời mùa xuân vào năm 1820, thiếu niên Joseph Smith,
  đang tìm kiếm để biết được giáo hội nào mình sẽ gia nhập, đã đi vào khu rừng gần nhà để cầu nguyện,
  ở miền bắc New York, Hoa Kỳ. Ông đã có những thắc mắc liên quan đến sự cứu rỗi của linh hồn mình và
  tin rằng Thượng Đế sẽ hướng dẫn ông.
- Với lòng khiêm nhường, chúng tôi tuyên bố rằng để đáp lại lời cầu nguyện của ông, Thượng Đế Đức Chúa
  Cha và Con Trai của Ngài, Chúa Giê Su Ky Tô, đã hiện đến cùng Joseph và khai mở sự khôi phục lại muôn
  vật (xin xem Công Vụ Các Sứ Đồ 3:21) như đã được báo trước trong Kinh Thánh. Trong khải tượng này, ông
  đã biết được rằng tiếp theo sau cái chết của Các Sứ Đồ nguyên thủy, Giáo Hội thời Tân Ước của Đấng Ky
  Tô đã bị mất khỏi thế gian. Joseph sẽ là công cụ để mang giáo hội đó trở lại.
- Chúng tôi khẳng định rằng dưới sự hướng dẫn của Đức Chúa Cha và Vị Nam Tử, các sứ giả thiên thượng đã
  đến chỉ dạy cho Joseph và tái lập Giáo Hội của Chúa Giê Su Ky Tô. Giăng Báp Tít phục sinh đã phục hồi
  thẩm quyền làm phép báp têm bằng cách dìm mình xuống nước để xá miễn các tội lỗi. Ba trong số mười hai
  Sứ Đồ nguyên thủy—Phi E Rơ, Gia Cơ và Giăng—đã phục hồi chức vụ sứ đồ và các chìa khóa của thẩm quyền
  chức tư tế. Những vị khác cũng đến, kể cả Ê Li, là người đã phục hồi thẩm quyền để kết hợp các gia đình
  lại với nhau vĩnh viễn trong các mối quan hệ vĩnh cửu mà vượt quá cái chết.
- 'Chúng tôi làm chứng thêm rằng Joseph Smith đã được ban cho ân tứ và quyền năng của Thượng Đế để phiên
  dịch một biên sử cổ xưa: Sách Mặc Môn—Một Chứng Thư Khác về Chúa Giê Su Ky Tô. Các trang thánh thư này
  bao gồm một bài tường thuật về giáo vụ cá nhân của Chúa Giê Su Ky Tô ở giữa những người ở Tây Bán Cầu
  ngay sau khi Ngài phục sinh. Thánh thư này giảng dạy về mục đích của cuộc sống và giải thích giáo lý
  của Đấng Ky Tô, chính là trọng tâm của mục đích đó. Là một thánh thư song hành với Kinh Thánh, Sách
  Mặc Môn làm chứng rằng tất cả loài người đều là các con trai và con gái của Cha trên Trời nhân từ, rằng
  Ngài có một kế hoạch thiêng liêng cho cuộc sống của chúng ta, và Con Trai của Ngài, Chúa Giê Su Ky Tô,
  vẫn còn phán trong thời nay cũng như thời xưa.'
- Chúng tôi tuyên bố rằng Giáo Hội Các Thánh Hữu Ngày Sau của Chúa Giê Su Ky Tô, được tổ chức vào ngày
  6 tháng Tư năm 1830, là Giáo Hội thời Tân Ước của Đấng Ky Tô đã được phục hồi. Giáo Hội này được neo
  chặt nơi cuộc sống hoàn hảo của đá góc nhà của chính Giáo Hội là Chúa Giê Su Ky Tô, và trong Sự Chuộc
  Tội vô hạn và Sự Phục Sinh thật sự của Ngài. Một lần nữa, Chúa Giê Su Ky Tô đã kêu gọi Các Sứ Đồ và
  đã ban cho họ thẩm quyền chức tư tế. Ngài mời gọi tất cả chúng ta đến cùng Ngài và Giáo Hội của Ngài,
  để tiếp nhận Đức Thánh Linh, các giáo lễ cứu rỗi và để có được niềm vui lâu dài.
- Giờ đây, hai trăm năm đã trôi qua kể từ khi Sự Phục Hồi này được khởi xướng bởi Thượng Đế Đức Chúa Cha
  và Con Trai Yêu Dấu của Ngài, Chúa Giê Su Ky Tô. Hàng triệu người trên khắp thế giới đã chấp nhận một
  sự hiểu biết về những sự kiện đã được tiên tri này.
- Chúng tôi hân hoan tuyên bố rằng Sự Phục Hồi đã được hứa sẽ tiến bước qua sự mặc khải liên tục. Thế
  gian sẽ không bao giờ như xưa nữa khi Thượng Đế sẽ “hội hiệp muôn vật lại trong Đấng Ky Tô” (Ê Phê Sô
  1:10).
- Với lòng tôn kính và biết ơn, chúng tôi với tư cách là Các Sứ Đồ của Ngài xin mời tất cả mọi người hãy
  biết—như chúng tôi biết—rằng các tầng trời đang mở ra. Chúng tôi khẳng định rằng Thượng Đế đang tỏ rõ
  ý muốn của Ngài cho các con trai và con gái yêu dấu của Ngài biết. Chúng tôi làm chứng rằng những người
  nào thành tâm nghiên cứu sứ điệp về Sự Phục Hồi và hành động theo đức tin thì sẽ được ban phước để có
  được chứng ngôn của họ về tính chất thiêng liêng và mục đích của sứ điệp này nhằm chuẩn bị thế gian
  cho Ngày Tái Lâm đã được hứa của Chúa và Đấng Cứu Rỗi của chúng ta, Chúa Giê Su Ky Tô.
