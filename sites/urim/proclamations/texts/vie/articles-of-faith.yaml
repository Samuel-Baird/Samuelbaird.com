title: Những Tín Điều
subtitle: của Giáo Hội Các Thánh Hữu Ngày Sau của Chúa Giê Su Ky Tô
author: ''
verses:
- n: 1
  text: Chúng tôi tin nơi Thượng Đế, Đức Chúa Cha Vĩnh Cửu, và nơi Con của Ngài, Chúa Giê Su Ky Tô, và
    nơi Đức Thánh Linh.
- n: 2
  text: Chúng tôi tin rằng loài người sẽ bị trừng phạt vì những tội lỗi riêng của họ, và không phải vì
    sự phạm giới của A Đam.
- n: 3
  text: Chúng tôi tin rằng nhờ Sự Chuộc Tội của Đấng Ky Tô, tất cả nhân loại có thể được cứu rỗi, bằng
    cách tuân theo các luật pháp và các giáo lễ của Phúc Âm.
- n: 4
  text: 'Chúng tôi tin rằng những nguyên tắc và giáo lễ đầu tiên của Phúc Âm là: thứ nhất, Đức Tin nơi
    Chúa Giê Su Ky Tô; thứ nhì, Sự Hối Cải; thứ ba, Phép Báp Têm bằng cách được dìm mình xuống nước để
    được xá miễn tội lỗi; thứ tư, Phép Đặt Tay để tiếp nhận ân tứ Đức Thánh Linh.'
- n: 5
  text: Chúng tôi tin rằng muốn được thuyết giảng Phúc Âm và thực hiện các giáo lễ trong Phúc Âm, con
    người phải được Thượng Đế kêu gọi bằng lời tiên tri và bằng phép đặt tay bởi những vị có thẩm quyền.
- n: 6
  text: Chúng tôi tin ở cùng một loại tổ chức mà đã có trong Giáo Hội Nguyên Thủy, nghĩa là cũng có các
    vị sứ đồ, tiên tri, giám trợ, thầy giảng, các vị rao giảng Phúc Âm, và vân vân.
- n: 7
  text: Chúng tôi tin vào ân tứ về ngôn ngữ, lời tiên tri, sự mặc khải, các khải tượng, phép chữa bệnh,
    sự thông dịch các ngôn ngữ, và vân vân.
- n: 8
  text: Chúng tôi tin Kinh Thánh là lời của Thượng Đế khi sách ấy được phiên dịch chính xác; chúng tôi
    cũng tin Sách Mặc Môn là lời của Thượng Đế.
- n: 9
  text: Chúng tôi tin tất cả mọi điều Thượng Đế đã mặc khải, tất cả mọi điều Ngài hiện đang mặc khải,
    và chúng tôi tin rằng Ngài sẽ còn mặc khải nhiều điều lớn lao và quan trọng có liên quan đến Vương
    Quốc của Thượng Đế.
- n: 10
  text: Chúng tôi tin vào sự quy tụ thực sự của Y Sơ Ra Ên và vào sự phục hồi Mười Chi Tộc; rằng Si Ôn
    (Tân Giê Ru Sa Lem) sẽ được thiết lập trên lục địa Mỹ Châu; rằng Đấng Ky Tô sẽ thân hành trị vì thế
    gian; và rằng thế gian sẽ được đổi mới và tiếp nhận vinh quang giống như thiên đàng.
- n: 11
  text: Chúng tôi xin đặc ân thờ phượng Đấng Thượng Đế Toàn Năng theo tiếng gọi lương tâm riêng của chúng
    tôi, và cũng xin dành cho tất cả mọi người có được cùng đặc ân này, để họ thờ phượng gì, bằng cách
    nào hay ở đâu tùy theo họ chọn.
- n: 12
  text: Chúng tôi tin ở sự phục tùng các vua chúa, các tổng thống, các nhà cai trị và các pháp quan, cùng
    ở sự tuân theo, tôn trọng và tán trợ luật pháp.
- n: 13
  text: Chúng tôi tin ở sự lương thiện, chân thành, trinh khiết, bác ái, đạo đức và làm điều thiện cho
    tất cả mọi người; thật vậy, chúng tôi có thể nói rằng chúng tôi theo lời khuyên răn của Phao Lô—Chúng
    tôi tin tất cả mọi điều, chúng tôi hy vọng tất cả mọi điều, chúng tôi đã chịu đựng được nhiều điều,
    và hy vọng có thể chịu đựng được tất cả mọi điều. Nếu có điều gì đạo đức, đáng yêu chuộng, hay có
    tiếng tốt hay đáng khen, thì chúng tôi theo đuổi những điều này.
signature: Joseph Smith.
