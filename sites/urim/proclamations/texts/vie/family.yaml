title: Gia Đình
subtitle: Bản Tuyên Ngôn cùng Thế Giới
author: Đệ Nhất Chủ Tịch Đoàn và Hội Đồng Mười Hai Vị Sứ Đồ của Giáo Hội Các Thánh Hữu Ngày Sau của Chúa
  Giê Su Ky Tô
note: Bản tuyên ngôn này đã được Chủ Tịch Gordon B. Hinckley đọc như là một phần sứ điệp của ông tại Buổi
  Họp Hội Phụ Nữ Trung Ương được tổ chức vào ngày 23 tháng Chín năm 1995, ở Salt Lake City, Utah.
paragraphs:
- Chúng tôi, Đệ Nhất Chủ Tịch Đoàn và Hội Đồng Mười Hai Vị Sứ Đồ của Giáo Hội Các Thánh Hữu Ngày Sau của
  Chúa Giê Su Ky Tô, long trọng tuyên bố rằng hôn nhân giữa một người nam và một người nữ đã được Thượng
  Đế quy định sẵn và gia đình là trọng tâm kế hoạch của Đấng Sáng Tạo dành cho số mệnh vĩnh cửu của con
  cái Ngài.
- Tất cả nhân loại—nam lẫn nữ—đều được sáng tạo theo hình ảnh của Thượng Đế. Mỗi người là một đứa con
  trai hay con gái linh hồn yêu dấu của cha mẹ thiên thượng, và, vì lẽ đó, mỗi người có một thiên tính
  và một số mệnh thiêng liêng. Phái tính là một đặc điểm cơ bản của từng người về gốc tích và mục đích
  của trạng thái tiền dương thế, hữu diệt và vĩnh cửu.
- Trong tiền dương thế, những người con trai và con gái linh hồn đã biết và đã thờ phượng Thượng Đế là
  Cha Vĩnh Cửu của họ và chấp nhận kế hoạch của Ngài mà qua đó các con cái của Ngài có thể nhận được một
  thể xác và đạt được kinh nghiệm trần thế để tiến triển đến sự toàn hảo và cuối cùng ý thức được số mệnh
  thiêng liêng của mình với tư cách là người thừa hưởng cuộc sống vĩnh cửu. Kế hoạch hạnh phúc thiêng
  liêng giúp mối liên hệ gia đình có thể được tồn tại sau cái chết. Những giáo lễ và giao ước thiêng liêng
  có sẵn trong các đền thờ thánh giúp cho những cá nhân có thể trở về chốn hiện diện của Thượng Đế và
  cho gia đình được kết hợp mãi mãi.
- Lệnh truyền đầu tiên mà Thượng Đế ban cho A Đam và Ê Va liên quan đến tiềm năng làm cha mẹ của họ với
  tư cách là vợ chồng. Chúng tôi tuyên bố rằng lệnh truyền của Thượng Đế cho con cái của Ngài là phải
  sinh sôi nẩy nở và làm cho đầy dẫy trái đất, thì vẫn còn hiệu lực. Chúng tôi tuyên bố thêm rằng Thượng
  Đế đã truyền lệnh rằng những khả năng thiêng liêng về sự sinh sản chỉ được sử dụng giữa người nam và
  người nữ đã cưới hỏi hợp pháp là chồng và vợ mà thôi.
- Chúng tôi tuyên bố rằng những phương cách mà qua đó cuộc sống hữu diệt được tạo ra là do Thượng Đế ấn
  định. Chúng tôi xác nhận tính thiêng liêng của cuộc sống và tầm quan trọng của cuộc sống trong kế hoạch
  vĩnh cửu của Thượng Đế.
- Người chồng và người vợ có một trách nhiệm trọng đại là phải yêu thương và chăm sóc lẫn nhau và con
  cái của mình. “Con cái là cơ nghiệp bởi Đức Giê Hô Va mà ra” (Thi Thiên 127:3). Cha mẹ có bổn phận thiêng
  liêng là nuôi nấng con cái mình trong tình thương và sự ngay chính, cung cấp những nhu cầu vật chất
  và thuộc linh cho chúng, dạy dỗ chúng biết yêu thương và phục vụ lẫn nhau, tuân giữ các giáo lệnh của
  Thượng Đế và là những công dân biết tuân theo các luật pháp ở bất cứ nơi nào chúng sinh sống. Những
  người chồng và những người vợ—những người mẹ và những người cha—sẽ chịu trách nhiệm trước mặt Thượng
  Đế trong việc hoàn thành các bổn phận này.
- Gia đình là do Thượng Đế quy định. Hôn nhân giữa người nam và người nữ là thiết yếu cho kế hoạch vĩnh
  cửu của Ngài. Con cái phải được sinh ra trong vòng ràng buộc hôn nhân và được nuôi nấng bởi một người
  cha và một người mẹ biết tôn trọng những lời thệ ước hôn nhân với lòng chung thủy trọn vẹn. Hạnh phúc
  trong cuộc sống gia đình hầu như có thể đạt được khi được đặt trên những lời giảng dạy của Chúa Giê
  Su Ky Tô. Các cuộc hôn nhân và các gia đình thành công được thiết lập và duy trì trên các nguyên tắc
  về đức tin, sự cầu nguyện, hối cải, tha thứ, kính trọng, yêu thương, lòng trắc ẩn, việc làm và những
  sinh hoạt giải trí lành mạnh. Qua kế hoạch thiêng liêng, những người cha phải chủ tọa gia đình mình
  trong tình thương yêu và sự ngay chính và có trách nhiệm cung cấp cho những nhu cầu cần thiết của cuộc
  sống và bảo vệ gia đình mình. Những người mẹ có trách nhiệm chính yếu để nuôi dưỡng con cái mình. Trong
  các trách nhiệm thiêng liêng này, những người cha và người mẹ có bổn phận giúp đỡ lẫn nhau với tư cách
  là những người bạn đời bình đẳng. Bệnh tật, chết chóc hay những hoàn cảnh khác có thể đòi hỏi sự thích
  ứng của cá nhân. Các thân quyến xa gần nên giúp đỡ khi cần thiết.
- Chúng tôi khuyến cáo những cá nhân nào đã vi phạm các giao ước về sự trinh khiết, ngược đãi người hôn
  phối hay con cái hoặc không làm tròn các trách nhiệm gia đình, một ngày kia sẽ đứng chịu trách nhiệm
  trước mặt Thượng Đế. Hơn nữa, chúng tôi cũng khuyến cáo rằng cảnh đổ vỡ trong gia đình sẽ mang lại cho
  cá nhân, cộng đồng và quốc gia những tai họa mà đã được các tiên tri thời xưa và hiện đại tiên đoán.
- Chúng tôi kêu gọi những công dân và viên chức chính quyền có trách nhiệm ở khắp mọi nơi hãy đẩy mạnh
  các biện pháp mà nhằm duy trì và củng cố gia đình như là một đơn vị cơ bản của xã hội.
