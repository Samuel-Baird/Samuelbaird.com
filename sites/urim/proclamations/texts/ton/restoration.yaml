title: Ko e Fakafoki Mai ʻa e Kakato ʻo e Ongoongolelei ʻo Sīsū Kalaisí
subtitle: Ko Ha Fanongonongo ki Māmani ʻo e Taʻu Uangeaú
author: Ko e Kau Palesitenisī ʻUluakí pea mo e Fakataha Alēlea ʻa e Kau ʻAposetolo ʻe Toko Hongofulu Mā
  Ua ʻo e Siasi ʻo Sīsū Kalaisi ʻo e Kau Māʻoniʻoni ʻi he Ngaahi ʻAho Kimui Ní
note: Naʻe lau ʻa e fanongonongó ni ʻe Palesiteni Lāsolo M. Nalesoni ko ha konga ia ʻo ʻene pōpoaki ʻi
  he Konifelenisi Lahi Fakataʻu Hono 190, ʻi he ʻaho 5 ʻo ʻEpeleli 2020, ʻi Sōleki Siti ʻi ʻIutā.
paragraphs:
- ʻOku mau fakahā ʻi he loto māluʻia ʻoku ʻofa ʻa e ʻOtuá ʻi Heʻene fānau ʻi he puleʻanga kotoa pē ʻi
  he māmaní. Kuo foaki mai ʻe he ʻOtua ko e Tamaí ʻa e fanauʻi fakalangí, ʻa e moʻui taʻe-mafakatatauá,
  mo e feilaulau fakalelei taʻefakangatangata ʻa Hono ʻAlo ʻOfaʻanga ko Sīsū Kalaisí. Naʻe toe tuʻu ʻa
  Sīsū mo ikunaʻi ʻa e maté ʻaki e mālohi ʻo e Tamaí. Ko Ia hotau Fakamoʻuí, hotau Faʻifaʻitakiʻangá,
  pea mo hotau Huhuʻí.
- ʻI ha pongipongi fakaʻofoʻofa ʻi he taʻu ʻe uangeau kuo hilí, ʻi he faʻahitaʻu failau ʻo e 1820, naʻe
  fononga ai ʻa e talavou ko Siosefa Sāmitá ʻi heʻene fekumi ke ʻilo pe ko e fē e siasi ke kau ki aí,
  ʻo lotu ʻi he vao ʻakau ofi mai ki hono ʻapí ʻi he fakatokelau ʻo Niu ʻIoke, USA. Naʻe ʻi ai haʻane
  ngaahi fehuʻi fekauʻaki mo e fakamoʻui ʻo hono laumālié pea naʻá ne falala ʻe fakahinohinoʻi ia ʻe he
  ʻOtuá.
- ʻOku mau fakahā ʻi he loto-fakatōkilalo, ko e tali ki he lotu ʻa Siosefá, naʻe hā mai ai kiate ia ʻa
  e ʻOtua ko e Tamaí mo Hono ʻAlo ko Sīsū Kalaisí, pea naʻe kamata ai e “[fakafoki mai] ʻo e meʻa kotoa
  pē” (Ngāue 3:21) ʻo hangē ko ia ne tomuʻa kikiteʻi ʻi he Tohi Tapú. ʻI he mata meʻa-hā-mai ko ʻení,
  naʻá ne ʻilo ai naʻe hili e pekia ʻa e fuofua kau ʻAposetoló, naʻe mole mei he māmaní ʻa e Siasi ʻo
  Kalaisi ʻi he Fuakava Foʻoú. ʻE hoko ʻa Siosefa ko ha konga mahuʻinga ʻo hono fakafoki maí.
- ʻOku mau fakamoʻoniʻi naʻe omi ha kau talafekau fakalangi ‘o fakatatau ki he fakahinohino ʻa e Tamaí
  mo e ʻAló, ʻo fakahinohinoʻi ʻa Siosefa mo toe fokotuʻu e Siasi ʻo Sīsū Kalaisí. Naʻe fakafoki mai ʻe
  Sione Papitaiso kuo toetuʻú ʻa e mafai ke papitaiso ʻi he fakauku ke fakamolemoleʻi ‘a e ngaahi angahalá.
  Naʻe hanga ʻe ha toko tolu ʻi he fuofua kau ʻAposetolo ʻe toko hongofulu mā uá—Pita, Sēmisi, mo Sione—ʻo
  fakafoki mai e tuʻunga fakaeʻaposetolo mo e ngaahi kī ʻo e mafai lakanga fakataulaʻeikí. Naʻe ōmai foki
  mo ha niʻihi kehe, ʻo kau ai ʻa ʻIlaisiā, ʻa ia naʻá ne fakafoki mai e mafai ke fakatahaʻi e ngaahi
  fāmilí ke taʻengata ʻi ha ngaahi vā fetuʻutaki taʻengata ʻoku ope atu ʻi he maté.
- 'ʻOku mau fakamoʻoni foki naʻe foaki kia Siosefa Sāmita ʻa e meʻafoaki mo e māfimafi ʻo e ʻOtuá ke liliu
  ha lekooti fakakuongamuʻa: ko e Tohi ʻa Molomoná—Ko ha Fakamoʻoni ʻe Taha ʻo Sīsū Kalaisi. ʻOku fakakau
  ʻi he ngaahi peesi ʻo e fakamatala toputapú ni ha fakamatala ki he ngāue fakafaifekau fakataautaha ʻa
  Sīsū Kalaisi ʻi he lotolotonga ‘o e kakai ʻi he Hemisifia Hihifó, hili pē ʻEne Toetuʻú. ʻOku akoʻi ai
  e taumuʻa ʻo e moʻuí mo fakamatalaʻi e tokāteline ʻo Kalaisí, ʻa ia ʻoku fakatefito ai e taumuʻa ko
  iá. ʻI heʻene hoko ko ha folofola tokoni ki he Tohi Tapú, ʻoku fakamoʻoni ʻa e Tohi ʻa Molomoná ko e
  faʻahinga kotoa pē ʻo e tangatá ko ha ngaahi foha mo e ngaahi ʻofefine kinautolu ʻo ha Tamai ʻi Hēvani
  ʻofa, ʻoku ʻi ai Haʻane palani fakalangi ki heʻetau moʻuí, pea ʻoku folofola mai foki Hono ʻAlo ko Sīsū
  Kalaisí ʻi he kuongá ni ʻo hangē ko ia ʻi he kuonga muʻá.'
- ʻOku mau fakahā ko e Siasi ʻo Sīsū Kalaisi ʻo e Kau Māʻoniʻoni ʻi he Ngaahi ʻAho Kimui Ní ʻa ia naʻe
  fokotuʻu ʻi he ʻaho 6 ʻo ʻEpeleli 1830, ko hono fakafoki mai ia ʻo e Siasi ʻo Kalaisi ʻi he Fuakava
  Foʻoú. ʻOku fakavaʻe ʻa e Siasí ni ʻi he moʻui haohaoa ʻo hono fungani makatulikí, ʻa Sīsū Kalaisi mo
  ʻEne Fakalelei taʻefakangatangatá mo e Toetuʻu moʻoní. Kuo toe ui ‘e Sīsū Kalaisi ha kau ‘Aposetolo
  mo foaki kiate kinautolu e mafai ʻo e lakanga fakataulaʻeikí. ʻOkú Ne fakaafeʻi kitautolu kotoa ke haʻu
  kiate Ia mo Hono Siasí, ke maʻu e Laumālie Māʻoniʻoní, ngaahi ouau ʻo e fakamoʻuí, mo maʻu e fiefia
  ʻoku tuʻuloá.
- Kuo ʻosi eni ha taʻu ʻe uangeau talu mei hono kamataʻi ʻe he ʻOtua ko e Tamaí mo Hono ʻAlo ʻOfaʻanga
  ko Sīsū Kalaisí ʻa e Fakafoki Mai ko ʻeni ʻo e ongoongoleleí. Kuo tali ʻe he laui miliona ʻi he funga
  ʻo e māmaní ʻa e ʻilo ki he ngaahi meʻa ko ʻeni ne kikiteʻi ʻe hokó.
- ʻOku mau fakahā loto-fiefia ʻoku laka ki muʻa hono Fakafoki Mai ʻo e ongoongolelei ne talaʻofá, ʻi he
  hokohoko atu hono maʻu ʻo e fakahaá. He ʻikai ke toe tatau ʻa e māmaní, he ʻe hanga ʻe he ʻOtuá ʻo “[tānaki]
  fakataha ʻa e meʻa kotoa pē ʻia Kalaisi” (ʻEfesō 1:10).
- ʻI he loto-ʻapasia mo e loto-houngaʻia, pea ʻi heʻemau hoko ko ʻEne kau ʻAposetoló, ʻoku mau fakaafeʻi
  ʻa e kakai kotoa pē ke nau ʻilo—ʻo hangē ko ia ʻoku mau ʻiló—ʻoku fakaava mai ʻa e ngaahi langí. ʻOku
  mau fakamoʻoniʻi ʻoku fakahā mai ʻe he ʻOtuá Hono finangaló ki Hono ngaahi foha mo e ngaahi ʻofefine
  ʻofeiná. ʻOku mau fakamoʻoni ko kinautolu ʻoku nau ako ʻi he faʻa lotu ʻa e pōpoaki ʻo hono Fakafoki
  Mai ʻo e ongoongoleleí pea ngāue ʻi he tuí, ʻe tāpuekina kinautolu ke nau maʻu haʻanau fakamoʻoni ki
  hono fakalangí pea ki hono taumuʻa ke teuteuʻi ʻa e māmaní ki he talaʻofa ʻo e Hāʻele ʻAnga Ua Mai ʻa
  hotau ʻEiki mo e Fakamoʻui ko Sīsū Kalaisí.
