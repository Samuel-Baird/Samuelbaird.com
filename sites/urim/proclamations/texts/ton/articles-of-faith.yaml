title: Ko e Ngaahi Tefito ʻo e Tuí
subtitle: ʻo e Siasi ʻo Sīsū Kalaisi ʻo e Kau Māʻoniʻoni ʻi he Ngaahi ʻAho Kimui Ní
author: ''
verses:
- n: 1
  text: ʻOku mau tui ki he ʻOtua, ko e Tamai Taʻengatá, pea ki Hono ʻAlo, ko Sīsū Kalaisí, pea ki he Laumālie
    Māʻoniʻoní.
- n: 2
  text: ʻOku mau tui ʻe tauteaʻi ʻa e tangatá koeʻuhi ko ʻenau ngaahi angahala ʻanautolú pē, kae ʻikai
    ko e maumau-fono ʻa ʻĀtamá.
- n: 3
  text: ʻOku mau tui ʻe lava ʻo fakamoʻui ʻa e faʻahinga ʻo e tangatá kotoa pē ʻi he Fakalelei ʻa Kalaisí,
    tuʻunga ʻi he talangofua ki he ngaahi fono mo e ngaahi ouau ʻo e Ongoongoleleí.
- n: 4
  text: 'ʻOku mau tui ko e ngaahi ʻuluaki tefitoʻi moʻoni mo e ngaahi ouau ʻo e Ongoongoleleí ko e: ʻuluakí,
    Tui ki he ʻEiki ko Sīsū Kalaisí; uá: Fakatomalá; tolú, Papitaiso ʻi he fakauku ke fakamolemoleʻi ʻa
    e ngaahi angahalá; faá, Hilifaki ʻo e nima ke maʻu ʻa e meʻafoaki ʻo e Laumālie Māʻoniʻoní.'
- n: 5
  text: ʻOku mau tui kuo pau ke ui ha tangata ʻe he ʻOtuá, ʻi he kikite, pea ʻi he hilifaki ʻo e nima
    ʻe kinautolu ʻoku nau maʻu ʻa e mafaí, ke malanga ʻaki ʻa e Ongoongoleleí mo fakahoko hono ngaahi
    ouaú.
- n: 6
  text: ʻOku mau tui ki he ngaahi lakanga tatau ko ia naʻe fokotuʻu ʻi he Siasí ʻi he kuonga muʻá, ʻa
    ia ko e kau ʻaposetolo, kau palōfita, kau faifekau, kau akonaki, kau ʻevangeliō, mo e ngaahi lakanga
    peheé.
- n: 7
  text: ʻOku mau tui ki he meʻafoaki ʻo e lea ʻi he ngaahi lea kehekehé, kikité, fakahaá, ngaahi meʻa-hā-maí,
    fakamoʻui ʻo e mahakí, fakamatalaʻi ʻo e ngaahi lea kehekehé, mo e ngaahi meʻa peheé.
- n: 8
  text: ʻOku mau tui ko e Tohi Tapú ko e folofola ia ʻa e ʻOtuá ʻi he ngaahi meʻa kotoa pē ʻoku liliu
    totonú; ʻoku mau tui foki ko e Tohi ʻa Molomoná ko e folofola ia ʻa e ʻOtuá.
- n: 9
  text: ʻOku mau tui ki he ngaahi meʻa kotoa pē kuo fakahā mai ʻe he ʻOtuá, mo e ngaahi meʻa kotoa pē
    ʻokú Ne fakahā mai ʻi he taimi ní, pea ʻoku mau tui te Ne kei fakahā mai ʻamui ha ngaahi meʻa lalahi
    mo mahuʻinga ʻo kau ki he Puleʻanga ʻo e ʻOtuá.
- n: 10
  text: ʻOku mau tui ki hono tānaki fakataha moʻoni ʻo ʻIsilelí pea ki hono fakafoki mai ʻo e Faʻahinga
    ʻe Hongofulú; pea ko Saione (ko e Selusalema Foʻoú) ʻe langa ia ʻi he konitinēniti ʻo ʻAmeliká; pea
    ko Kalaisi pē ʻe pule ʻi he māmaní; pea, ʻe fakafoʻou ʻa e māmaní ʻo maʻu ʻe ia ʻa hono nāunau fakapalataisí.
- n: 11
  text: ʻOku mau ʻekea ʻa e faingamālie ke hū ki he ʻOtua Māfimafí ʻo fakatatau ki he ngaahi tuʻutuʻuni
    ʻa homau konisēnisi ʻomautolu pē, pea tuku ki he kakai kotoa pē ʻa e faingamālie tatau, ʻo tukuange
    ke nau lotu, pe ʻe founga fēfē, pē ʻe fai ʻi fē, pe ko e hā te nau lotu ki aí.
- n: 12
  text: ʻOku mau tui ʻoku totonu ke fakaongoongo ki he ngaahi tuʻi, kau palesiteni, kau pule, mo e kau
    fakamaau fakapuleʻanga, ʻi he talangofua, fakaʻapaʻapaʻi, mo poupou ki he laó.
- n: 13
  text: ʻOku mau tui ʻoku totonu ke faitotonu, angatonu, sino maʻa, angalelei, anga-māʻoniʻoni, pea failelei
    ki he kakai kotoa pē; ko e moʻoni, ʻoku mau lava ke pehē ʻoku mau muimui ki he naʻinaʻi ʻa Paulá—ʻOku
    mau tui ki he ngaahi meʻa kotoa pē, ʻoku mau ʻamanaki lelei ki he ngaahi meʻa kotoa pē, kuo mau kātakiʻi
    ʻa e ngaahi meʻa lahi, pea ʻoku mau ʻamanaki ke mau lava ʻo kātakiʻi ʻa e ngaahi meʻa kotoa pē. Kapau
    ʻoku ai ha meʻa ʻoku māʻoniʻoni, fakaʻofoʻofa, pe ongoongo lelei pe feʻunga mo hono vīkivikiʻí, ko
    e ngaahi meʻa ia ʻoku mau fekumi ki aí.
signature: Siosefa Sāmita.
