title: Ko e Fāmilí
subtitle: Ko Ha Fanongonongo ki Māmani
author: Ko e Kau Palesitenisī ʻUluakí pea mo e Fakataha Alēlea ʻo e Kau ʻAposetolo ʻe Toko Hongofulu Mā
  Ua ʻo e Siasi ʻo Sīsū Kalaisi ʻo e Kau Māʻoniʻoni ʻi he Ngaahi ʻAho Kimui Ní
note: Naʻe lau ʻa e fanongonongó ni ʻe Palesiteni Kōtoni B. Hingikelī ko ha konga ia ʻo ʻene pōpoaki ʻi
  he Fakatahaʻanga Lahi ʻa e Fineʻofá ʻa ia naʻe fakahoko ʻi he ʻaho 23 ʻo Sepitema 1995, ʻi Sōleki Siti
  ʻi ʻIutā.
paragraphs:
- Ko kimautolu, ko e Kau Palesitenisī ʻUluaki pea mo e Fakataha Alēlea ʻo e Kau ʻAposetolo ʻe Toko Hongofulu
  Mā Ua ʻo e Siasi ʻo Sīsū Kalaisi ʻo e Kau Māʻoniʻoni ʻi he Ngaahi ʻAho Kimui Ní, ʻoku mau fakahā heni
  ʻi he loto māluʻia, ko e mali ʻi ha vā ʻo ha tangata mo ha fefine naʻe tuʻutuʻuni ia ʻe he ʻOtuá pea
  ko e fāmilí ko e uho ia ʻo e palani ʻa e Fakamoʻuí ki he ikuʻanga taʻengata ʻo ʻEne fānaú.
- Ko e kakai kotoa pē—ʻa e tangata mo e fefine—naʻe fakatupu ia ʻi he tatau ʻo e ʻOtuá. Ko e toko taha
  fakafoʻituitui kotoa pē ko e foha mo e ʻofefine ia ʻo ha mātuʻa fakalangi, pea ʻi heʻene peheé, ʻoku
  maʻu ai ʻe he toko taha kotoa pē ha natula fakalangi pea mo ha ikuʻanga pau. Ko e tuʻunga tangata pe
  fefiné ko ha ʻulungāanga mahuʻinga ia ʻoku ʻiloʻi ai ʻa e tuʻunga mo e taumuʻa ʻo e tokotaha fakafoʻituituí,
  ʻi he maama fakalaumālié, mo e moʻui fakamatelié pea mo e taʻengatá.
- ʻI he maama fakalaumālié, naʻe ʻiloʻi ai mo hū ʻa e ngaahi foha mo e ngaahi ʻofefine fakalaumālié ki
  he ʻOtua ko ʻenau Tamai Taʻengatá mo nau tali ʻa ʻEne palani ʻe tuʻunga ai ha lava ʻa ʻEne fānaú ʻo
  maʻu ha sino fakamāmani pea mo ha taukei ʻi he māmaní ke fakalakalaka hake ki he haohaoá mo ʻiloʻi fakapapau
  ʻa honau ikuʻanga fakalangi ʻi heʻenau tuʻu ko e ʻea hoko ki he moʻui taʻengatá. ʻOku fakangofuaʻi ai
  ʻe he palani fakalangi ʻo e fiefiá ʻa e feohi fakafāmilí ke tolonga atu ʻo ʻoua naʻa ngata pē ʻi he
  faʻitoká. ʻOku fakaʻatā foki ʻe he ngaahi ouau mo e ngaahi fuakava toputapu ʻi he ngaahi temipale toputapú
  ki he toko taha kotoa pē ke ne foki ki he ʻao ʻo e ʻOtuá pea mo e ngaahi fāmilí ke fakatahaʻi ʻo taʻengata.
- ʻOku fekauʻaki ʻa e fuofua fekau naʻe tuku ʻe he ʻOtuá kia ʻĀtama mo ʻIví pea mo e meʻa te na malava
  ʻi hona tuʻunga fakaemātuʻá, ko e husepāniti mo e uaifí. ʻOku mau fakahā ai heni ʻoku kei tuʻu maʻu
  pē ʻa e fekau ko ia ʻa e ʻOtuá ki Heʻene fānaú ke nau fanafanau mo fakatokolahi ʻa māmaní. ʻOku mau
  toe fakahā foki heni kuo ʻosi tuʻutuʻuni ʻe he ʻOtuá ke toki ngāueʻaki pē ʻa e ngaahi mālohi toputapu
  ʻo e fakatupú ʻe ha tangata mo ha fefine, kuo na ʻosi mali fakalao ko ha husepāniti mo ha uaifi.
- ʻOku mau fakahā heni ko e founga ko ia ʻoku fakatupu ai ʻa e moʻui fakamatelié, ko ha tuʻutuʻuni fakalangi
  ia. ʻOku mau fakamoʻoni atu ki hono haohaoa ʻo e moʻuí pea mo hono mahuʻinga ʻi he palani taʻengata
  ʻa e ʻOtuá.
- ʻOku ʻi ai ha fatongia toputapu ʻo e husepānití mo e uaifí ke na feʻofaʻaki mo fetauhiʻaki pea ki heʻena
  fānaú foki. He “Ko e fānaú ko ha tofiʻa mei he [ʻEikí]” (Same 127:3). ʻOku maʻu ʻe he mātuʻá ha fatongia
  toputapu ke ohi hake ʻa ʻenau fānaú ʻi he ʻofa mo e māʻoniʻoni, mo tokonaki maʻa ʻenau ngaahi fie maʻu
  fakatuʻasinó mo fakalaumālié, pea hinoiʻi kinautolu ke nau feʻofoʻofani mo fetauhiʻaki, tauhi ʻa e ngaahi
  fekau ʻa e ʻOtuá, pea hoko ko ha kau tangataʻi fonua tauhi lao ʻi ha feituʻu pē ʻoku nau nofo ai. Kuo
  pau ke ʻekeʻi mei he husepānití mo e uaifí—ʻa e faʻē mo e tamai—ʻi he ʻao ʻo e ʻOtuá ʻa e anga ʻo ʻenau
  fakahoko ʻo e ngaahi fatongiá ni.
- Ko e fāmilí ko e tuʻutuʻuni ia ʻa e ʻOtuá. ʻOku mahuʻinga ʻa e mali ʻa e tangatá mo e fefiné ki Heʻene
  palani taʻengatá. ʻOku maʻu aiʻe he fānaú ha totonu ke fanauʻi kinautolu ʻi he ngaahi haʻi ʻo e nofo
  malí, pea ke ohi hake kinautolu ʻe ha tamai mo ha faʻē ʻokú na tauhi ʻa e ngaahi fuakava ʻo e malí ʻi
  he faitōnunga kakato. Ko e fiefia ko ia ʻi he moʻui fakafāmilí ʻoku meimei ke toki aʻusia pē ia ʻi he
  taimi kuo langa ai ʻa e fāmilí ʻi he ngaahi akonaki ʻa e ʻEiki ko Sīsū Kalaisí. ʻOku faʻu mo pukepuke
  ʻa e nofo-malí mo e ngaahi fāmili ʻoku fiefiá ʻi he ngaahi tefitoʻi moʻoni ʻo e tuí, lotú, fakatomalá,
  faʻa fakamolemolé, fakaʻapaʻapá, ʻofá, manavaʻofá, ngāué, pea mo e ngaahi ʻekitivitī ʻoku fakatupulakí.
  Tuʻunga ʻi ha palani fakalangi, ʻoku ʻa e ngaahi tamaí ai, ke nau puleʻi honau fāmilí ʻi he ʻofa mo
  e māʻoniʻoni pea ko honau fatongia ke tokonaki ʻa e ngaahi fie maʻu ʻo e moʻuí pea mo ha maluʻi maʻa
  honau ngaahi fāmilí. Ko e tefitoʻi fatongia ʻo e ngaahi faʻeé ke lehilehiʻi hake ʻa ʻenau fānaú. ʻI
  he ngaahi fatongia toputapú ni, ʻoku haʻisia ai ʻa e ngaahi tamaí mo e ngaahi faʻeé ke nau fetokoniʻaki
  ko ha kaungā-ngāue tuʻunga tatau. Ka ʻe fie maʻu ke fai ha liliu fakafoʻituitui ia ʻo ka hoko ha faingataʻaʻia
  fakaesino, mate, pe ko ha ngaahi toe tūkunga kehe. ʻOku totonu ke tokoni ʻa e kāinga ofí ʻi hano fie
  maʻu.
- ʻOku mau fakatokanga atu ko e niʻihi fakafoʻituitui ko ia ʻoku nau maumauʻi ʻa e ngaahi fuakava ʻo e
  anga-maʻá, ʻa kinautolu ʻoku nau ngaohi koviʻi ʻa e malí pe fānaú, pe ʻoku ʻikai ke nau fakahoko honau
  ngaahi fatongia fakafāmilí, te nau tuʻu ʻi ha ʻaho ʻo fai ha fakamatala ʻi he ʻao ʻo e ʻOtuá. Ko e tahá,
  ʻoku mau toe fakatokanga atu ʻe hanga ʻe he movetevete ʻo e fāmilí ʻo ʻomi ki he kakaí fakatāutaha,
  tukui koló mo e ngaahi puleʻangá ʻa e ngaahi fakamamahi naʻe kikiteʻi ʻe he kau palōfita ʻo e kuonga
  muá mo onopōní.
- ʻOku mau kole ai ki he tangataʻi fonua falalaʻanga mo e kau ʻōfisa fakapuleʻanga ʻi he feituʻu kotoa
  pē ke mou poupouʻi ʻa e ngaahi lao kuo fokotuʻu ke ne pukepuke mo fakamālohia ʻa e fāmilí ʻi heʻene
  hoko ko e tefitoʻi ʻiuniti mahuʻinga ʻo e sosaietí.
