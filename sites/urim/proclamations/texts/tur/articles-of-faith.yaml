title: ’nin İman Maddeleri
subtitle: İsa Mesih’in Son Zaman Azizler Kilisesi
author: ''
verses:
- n: 1
  text: Biz Ebedi Baba Tanrı’ya, O’nun Oğlu İsa Mesih’e ve Kutsal Ruh’a inanıyoruz.
- n: 2
  text: Biz insanların Adem’in itaatsizliğinden dolayı değil, kendi günahları için cezalandırılacağına
    inanıyoruz.
- n: 3
  text: Biz bütün insanların Mesih’in kefareti aracılığıyla, Sevindirici Haber’in yasalarına ve kutsal
    törenlerine uyarak kurtulabileceğine inanıyoruz.
- n: 4
  text: 'Biz Sevindirici Haber’in ilk ilkelerinin ve kutsal törenlerinin şunlar olduğuna inanıyoruz: Birincisi
    Rab İsa Mesih’e İman; ikincisi Tövbe; üçüncüsü günahların bağışlanması için suya daldırılarak yapılan
    Vaftiz; dördüncüsü Kutsal Ruh armağanının ellerin baş üzerine konularak verilmesi.'
- n: 5
  text: Biz bir kimsenin Sevindirici Haberi vaaz etmesi ve ona ait kutsal törenleri uygulaması için Tanrı
    tarafından peygamberlik sözü aracılığıyla göreve çağrılması gerektiğine ve yetkili kişiler tarafından
    ellerin baş üzerine konularak atanması gerektiğine inanıyoruz.
- n: 6
  text: Biz İlk Kilise’de var olan, yani havariler, peygamberler, önderler, öğretmenler, müjdeciler ve
    diğer şahıslardan oluşan organizasyonun aynısına inanıyoruz.
- n: 7
  text: Biz dil, peygamberlik sözü, vahiy, görümler, iyileştirme, dillerin tercümesi armağanlarına ve
    diğer armağanlara inanıyoruz.
- n: 8
  text: Biz Kutsal Kitap’ın doğru tercüme edildiği kadar Tanrı’nın sözü olduğuna inanıyoruz; biz ayrıca
    Mormon Kitabı’nın da Tanrı’nın sözü olduğuna inanıyoruz.
- n: 9
  text: Biz Tanrı’nın vahiy etmiş olduğu, halen vahiy etmekte olduğu her şeye ve O’nun kendi Krallığı
    hakkında daha birçok büyük ve önemli şeyleri vahiy edeceğine inanıyoruz.
- n: 10
  text: Biz İsrail’in tam olarak bir araya toplanacağına ve On Oymak’ın geri geleceğine, Siyon’un (Yeni
    Yeruşalim’in) Amerika kıtası üzerinde kurulacağına, Mesih’in şahsen yeryüzünde hüküm süreceğine ve
    yeryüzünün yenileneceğine ve cennetsel görkemine kavuşacağına inanıyoruz.
- n: 11
  text: Biz Her Şeye Gücü Yeten Tanrı’ya kendi vicdanımızın sesine göre ibadet edebilme ayrıcalığımızın
    olduğunu ve bütün insanlara da aynı ayrıcalığın tanınmasına izin verilmesini savunuyoruz; bırakın
    insanlar nasıl istiyorlarsa, istedikleri yerde, istedikleri şeye ibadet etsinler.
- n: 12
  text: Biz krallara, başkanlara, hükümdarlara ve yargıçlara bağlı olup yasalara uymamız gerektiğine,
    yasalara saygı gösterip onları desteklememiz gerektiğine inanıyoruz.
- n: 13
  text: Biz dürüst olmaya, doğru olmaya, iffetli olmaya, hayırsever olmaya, erdemli olmaya ve herkese
    iyilik yapmamız gerektiğine inanıyoruz; gerçekten Pavlus’un öğütlerine uyduğumuzu söyleyebiliriz.
    Biz her şeye inanır, her şeyi umut ederiz; birçok şeye dayandık ve her şeye dayanabilmeyi umut ediyoruz.
    Eğer erdemli ve güzel olan veya hayranlık uyandıran ya da övgüye değer bir şey varsa, biz bu şeylerin
    peşinden koşarız.
signature: Joseph Smith.
