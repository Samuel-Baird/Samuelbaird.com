title: Aile
subtitle: Bütün Dünyaya Bir Bildiri
author: İsa Mesih’in Son Zaman Azizler Kilisesi Birinci Başkanlığı ve Oniki Havariler Meclisi
note: Bu bildiri, Başkan Gordon B. Hinckley tarafından 23 Eylül 1995 yılında Salt Lake City, Utah’ta düzenlenen
  Genel Yardımlaşma Cemiyeti Toplantısı’ndaki mesajının bir parçası olarak okunmuştur.
paragraphs:
- Bizler, İsa Mesih’in Son Zaman Azizler Kilisesi’nin Birinci Başkanlığı ve Oniki Havariler Meclisi olarak,
  bir erkek ile bir kadın arasındaki evliliğin Tanrı tarafından kurulduğunu ve bu nedenle ailenin, Yaratıcı’nın
  çocuklarının sonsuz kaderi ile ilgili planının merkezi olduğunu ciddi bir şekilde ilan ediyoruz.
- Bütün insanlar, erkek ve kadın olarak, Tanrı’nın suretinde yaratılmıştır. Her biri, cennetteki ebeveynlerinin
  sevgili birer ruh oğlu veya kızıdır, bu nedenle her birinin ilahi bir doğası ve kaderi vardır. Cinsiyet,
  kişinin ölümlülük öncesi, ölümlü ve ebedi kimliğinin ve amacının temel bir özelliğidir.
- Ölümlülük öncesi dünyada, ruh oğulları ve kızları Tanrı’ya inanıp O’na Ebedi Babaları olarak ibadet
  etmişler ve O’nun kendi çocuklarının fiziksel bir vücuda sahip olabilmelerini ve mükemmelliğe doğru
  ilerlemek üzere dünyevi tecrübeler edinebilmelerini ve en sonunda ebedi hayatın mirasçıları olarak ilahi
  kaderlerini gerçekleştirebilmelerini sağlayan planını kabul etmişlerdir. İlahi mutluluk planı, aile
  ilişkilerinin mezarın ötesinde devam etmesini sağlar. Kutsal tapınaklarda mevcut olan mukaddes törenler
  ve antlaşmalar, bireylerin Tanrı’nın huzuruna geri dönmelerini ve ailelerin sonsuza kadar birlikte olmalarını
  mümkün kılmaktadır.
- Tanrı’nın Adem ile Havva’ya verdiği ilk emir, onların karı koca olarak ebeveyn olma potansiyelleri ile
  ilgiliydi. Tanrı’nın, çocuklarına çoğalmaları ve dünyayı doldurmaları için vermiş olduğu emrin hâlâ
  geçerli olduğunu beyan ederiz. Ayrıca, Tanrı’nın çocuk yaratma ile ilgili mukaddes güçlerin, sadece
  yasal olarak evlenmiş karı koca olan erkek ve kadın arasında kullanılmasını emrettiğini de beyan ederiz.
- Ölümlü hayatın yaratılış şeklinin ilahi olarak tayin edildiğini beyan ederiz. Yaşamın kutsallığını ve
  Tanrı’nın ebedi planındaki önemini doğrularız.
- Karı kocanın birbirlerini ve çocuklarını sevip korumak gibi ciddi bir sorumlulukları vardır. “Çocuklar
  Rab’den bir mirastır” (Mezmurlar 127:3). Ebeveynlerin, çocuklarını sevgi ve doğrulukla yetiştirmek,
  onların fiziksel ve ruhsal ihtiyaçlarını karşılamak ve onlara birbirlerini sevmelerini ve birbirlerine
  hizmet etmelerini, Tanrı’nın emirlerine itaat etmelerini ve nerede yaşarlarsa yaşasınlar kanunlara uyan
  vatandaşlar olmalarını öğretmek gibi kutsal bir görevleri vardır. Karı kocalar – anneler ve babalar
  – bu yükümlülüklerin yerine getirilmesi hususunda Tanrı’nın önünde sorumlu tutulacaklardır.
- Aile, Tanrı tarafından kurulmuştur. Erkek ve kadın arasındaki evlilik, O’nun ebedi planının temelidir.
  Çocuklar, evlilik bağı altında doğma hakkına ve evlilik yeminine tam bir sadakatle saygı gösteren bir
  anne ve baba tarafından yetiştirilme hakkına sahiptir. Aile hayatındaki mutluluk, en uygun şekilde,
  Rab İsa Mesih’in öğretilerinin temeli üzerine kurulduğu takdirde elde edilebilir. Başarılı evlilikler
  ve aileler iman, dua, tövbe, affetme, saygı, sevgi, şefkat, çalışma ve sağlıklı eğlence faaliyetleri
  ilkeleri üzerine kurulur ve sürdürülür. İlahi tasarıma göre, babalar ailelerine sevgi ve doğrulukla
  başkanlık etmelidir ve ailelerinin yaşamları ve korunmaları için gerekli olan şeyleri sağlamakla sorumludur.
  Anneler öncelikle çocuklarının yetiştirilmesinden sorumludur. Bu mukaddes sorumlulukların yerine getirilmesi
  sırasında, babalar ve anneler eşit ortaklar olarak birbirlerine yardım etmekle yükümlüdürler. Engellilik,
  ölüm veya diğer koşullar, bu rollerin bireysel olarak uyum sağlamasını gerektirebilir. Akrabalar ihtiyaç
  olduğunda birbirlerine destek olmalıdır.
- İffet anlaşmalarını ihlal eden, eşine veya çocuklarına kötü muamele eden veya aile sorumluluklarını
  yerine getirmeyen bireylerin bir gün Tanrı’nın önünde hesap verecekleri konusunda uyarıda bulunuyoruz.
  Ayrıca, ailenin parçalanmasının bireylerin, toplumların ve ulusların başına, eski ve yeni peygamberler
  tarafından önceden bildirilen felaketleri getireceği konusunda da uyarıda bulunuyoruz.
- Bütün sorumlu vatandaşları ve devlet görevlilerini, her yerde toplumun temel birimi olan aileyi korumak
  ve güçlendirmek için düzenlenen bu önlemleri almaya çağırıyoruz.
