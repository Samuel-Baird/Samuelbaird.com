title: Ne Tîbî îgahbî
subtitle: Makoche Nehchagîya Nechîn Ayîngîyabich
author: ''
note: Ne wahowinchayubîne ayechuch President Gordon B. Hinckley Waho wîncha-îyachîyen Erzuchiyabîcha-en
  September 23, 1995 Mînî Tasuza Oyadekdda.
paragraphs:
- Îngebi, Wakâ ta Intoh Wagihabî ta Koskabî ouhm Jesus Christ Wakâ Ohnage Wîchastabî Nâgâhâbî ne Barebî
  ze ech. Hrtîjahyahr Wakâhumbine Wakâ edaha induwinja wînchagichoch tîbî îngabize hrtinjaguch inge Wakâ
  chinjîyabîne.
- Wîchastabî—wîchabî wîyâbî gîchî—Îe Wakâ dokejeze înges hichin îngarbich. Owath nahri inkbarbisinch chihinkju
  yambinehna chuhûnkchu yambine Akdduyumbî wuhouhsigene Wakâ Hugoyûhbî wuhouhsigene Wakâ zedaha îhibich,
  zeooth, owath woeisteybîgach inchiyanheya îngohpabich zehanga inkûzoth îwathtebîch hecheduch. Wakâ gîchî
  îkûzehana, îtumbî zehahna, îchiyahneya wîchach, îchiyahneha wîyach, îchiyahneya nîmî înkuch ze winjako
  dokasîkdaach, tawoh pinchîyah îyuhach.
- Akdduyumbî gîchî îkoh zeha, înahrî ne je Akdduyabî wuhosîgîne Wakâ chegîya îkoch gîchî îku zeha Wakâ
  ahopa chegiya doken îezay opabich dokîn îeze eyagobîch tawagîchothe nîwîchayach tacha îyuha chiyan nîbî
  makoche nen nîmî otabînacha ingogînichiyen otanîya îhaambîchîyen. Îhagekdda nîmî onîchîgînekddach închiyanakddach.
  Wogichothe dagînabî yahnech tîbî en winjihibîne toyadegîchîyabî inchiyahneddach. Wakâ tawogîchothe hrtinjageze,
  wîchoey îngiyagochas terhrîs Wakâ ikdda îkichiyen indo winjâ.
- Teha togarhehr tawogichothé Wakâ Adam nago Eve gîchî wincha ko ze ech. Akddu winchayubî hôgo winchayubî
  nagugas gîchî inga gîchî. Ne ogîgîbîne Wakâ Tawogichothe chînjabi wincha kozeddach gokta închîyath dagoskambîn
  wîkabichîyen narhnish ze hechedduch. Ne Wakâ tawogichothe zé ech ne wogasodesich ne wîchanehna wiyanehna
  gîchî wincha koch Wakahambîne wincha ne wiya ne gîchî zé tawogichothe ze éch.
- Ne owenîgîyabîne Wakâ dagoskambîne ogîkune hrtinjagach. Né winjakabîch wogasodisine Wakâ tawogichothe
  inchîyahneyach.
- Baré umbine ogîchîdokeyabîch gîchîkbârmbisîhna chinjahbi eyadoth osîgîchînabîch. Dagoskanane Wakâ onîkuch.
  Tîbîtubîne hrtinjagach dagoskan daawinjihe chîyabich gîchîkbarbisiko wothpe winchakiyabik-ddach dacha
  înagabîne owinchagijiginibi-huna nagu nari nîchagîya othpe wincha kîyabîch nagu gîchîkbarbisi wahosiginabi
  ko outhpe winchakiyabîch nagu wogiyabiko tawogichothe yuhabichiyen yotabî obîzin opabichiya othpe winchakiyabîchin
  Bare umbîne—hogu wîchayabî akddu wîchayabî—Dokîn winjihiyage ne Wakâ indoheya inaya zîkddach.
- Tîbîtabîne Wakâ tawogechothe-chach. Wîchane wiyane gîchî Wakâhumbine închiya hneyach. Dagoskuna ne Wakâhumbi
  en tubî chiyen odokiyach Dagoskana ne hongu akddu gîchî wînjîhîyabîch Wakâhumbine ahopabîch. Dagina
  umbîchiyen Jesus Christ ne chagiya othpe winchakiyabichas. Tîbîtabine wonîhnîhach. Tîbî tobîne nihes
  huch wawinjaginabi, chegiyubi, akddatasîgînabî, wîchagîjîkthîyabîshî, wahopabi, kitchibharbisi, wuhouhsegehnuhbi,
  pihinchiyuh, duhgohskuduh wohinjihar ko. Wakâ to wogichothe hechach akddu wîchayabîne towagihabich kitchikbarbisi,
  otanacha ohna wîcha noyabîch dagune owinchagijiginibihna doha owinchagihnabich. Honguwinchayabî tobinche
  ne chinjawinchayabî daa winjihiwinchagiyabîch. Ne woga sodahsi ne akdduyabî honguyabî topîchene ogîchîkiyabich
  akechen. Dagonarh dokechas wazirh makoche ayushtachus daguwinchayubî wogiyabikddach inabichas bare tîbîtôbi-zin.
- Duwehneh tacha ahope sinchash Wakâ togichuthe ahopesinchash ominchengabiko chinjabiko hechawincha yubichuch
  akshyane ahopa bisinchash Wakâ indoheya înazîhna hnogîchîkddach tîbîtubî nihuk subîchas. Îyahnetach
  wîchastabi makoche en umbize yahne itathum inko oginihanga-hakddach wohagogî peya hakddach îchîyath-yakddach
  Waningas Wakâ ta Wakohne wîchastabi nagu nagaha inko Wakâ ta Wakohne wîchastabî oyagabîch.
- Duwegas îhûga ingabîne nechako oyagabichen tîbî ingabîne dohanga hrtinjagene teha togarhehr tîbî ingabîne
  wogasodeshînch.
