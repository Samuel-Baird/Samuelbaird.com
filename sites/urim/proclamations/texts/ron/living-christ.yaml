title: Hristos cel Viu
subtitle: Mărturia apostolilor
author: Biserica lui Isus Hristos a Sfinților din Zilele din Urmă
paragraphs:
- Acum, când celebrăm nașterea lui Isus Hristos cu două milenii în urmă, ne oferim mărturia despre realitatea
  vieții Sale fără seamăn și virtutea infinită a mărețului Său sacrificiu ispășitor. Nimeni altcineva
  nu a avut o influență atât de profundă asupra tuturor celor care au trăit și vor mai trăi pe pământ.
- El a fost Marele Iehova din Vechiul Testament, Mesia din Noul. Sub îndrumarea Tatălui Său, El a fost
  creatorul pământului. „Toate lucrurile au fost făcute prin El; și nimic din ce a fost făcut, n-a fost
  făcut fără El” (Ioan 1:3). Deși fără păcat, El a fost botezat pentru a împlini toată neprihănirea. El
  „umbla din loc în loc, făcea bine” (Faptele apostolilor 10:38), dar a fost disprețuit pentru aceasta.
  Evanghelia Sa a fost un mesaj de pace și bunăvoință. El i-a îndemnat pe toți să urmeze exemplul Său.
  El a străbătut drumurile Palestinei, vindecându-i pe cei bolnavi, făcându-i pe orbi să vadă și înviindu-i
  pe morți. El a propovăduit despre adevărurile eternității, realitatea existenței noastre premuritoare,
  scopul vieții noastre pe pământ și potențialul fiilor și fiicelor lui Dumnezeu în viața care va veni.
- El a instituit împărtășania pentru a reaminti de mărețul Său sacrificiu ispășitor. El a fost arestat
  și judecat pe baza unor învinuiri false, condamnat pentru a satisface o gloată și osândit să moară pe
  crucea de pe Căpățâna. Și-a dat viața pentru a ispăși pentru păcatele întregii omeniri. Acesta a fost
  mărețul Său dar pentru toți cei care vor trăi vreodată pe pământ.
- Noi depunem mărturie, în mod solemn, că viața Sa, care este punctul central al întregii istorii umane,
  nici nu a început la Betleem, nici nu s-a încheiat pe Căpățâna. El a fost Întâiul Născut al Tatălui,
  Singurul Fiu Născut în trup, Mântuitorul lumii.
- El S-a ridicat din mormânt pentru a deveni „pârga celor adormiți” (1 Corinteni 15:20). Ca Domn înviat,
  El i-a vizitat pe aceia pe care i-a iubit pe când era în viață. De asemenea, El a slujit printre „alte
  oi” (Ioan 10:16) ale Sale de pe teritoriul vechii Americi. În lumea modernă, El și Tatăl Său i-au apărut
  băiatului Joseph Smith, începând mult promisa dispensație a „plinirii vremilor” (Efeseni 1:10).
- 'Despre Hristos cel Viu, profetul Joseph a scris: „Ochii Săi erau ca flacăra focului; părul de pe capul
  Său era alb ca zăpada pură; înfățișarea Sa strălucea mai presus de strălucirea soarelui; și glasul Său
  era ca sunetul vuietului unor ape mari, chiar glasul lui Iehova spunând:'
- Eu sunt Cel dintâi și Cel de pe urmă; Eu sunt Acela care trăiește, Eu sunt Acela care a fost ucis; Eu
  sunt Mijlocitorul vostru la Tatăl” (D&L 110:3–4).
- 'Despre El, profetul a declarat, de asemenea: „Și, acum, după numeroasele mărturii care au fost date
  despre El, aceasta este mărturia, ultima dintre toate, pe care o dăm despre El: Că El trăiește!'
- Căci noi L-am văzut, chiar la dreapta lui Dumnezeu; și am auzit glasul depunând mărturie că El este
  Singurul Născut al Tatălui –
- Că de El, și prin El, și de la El lumile sunt și au fost create și locuitorii din ele sunt fii și fiice
  născuți ai lui Dumnezeu” (D&L 76:22–24).
- Noi declarăm în cuvinte solemne că preoția Sa și Biserica Sa au fost restaurate pe pământ – „[zidite]
  pe temelia apostolilor și [profeților], piatra din capul unghiului fiind Isus Hristos” (Efeseni 2:20).
- Noi mărturisim că El va reveni, într-o zi, pe pământ. „Atunci se va descoperi slava Domnului, și în
  clipa aceea orice făptură o va vedea” (Isaia 40:5). El va conduce ca Rege al regilor și va domni ca
  Domn al domnilor și fiecare genunchi se va pleca și fiecare limbă va vorbi preaslăvind înaintea Sa.
  Fiecare dintre noi va sta să fie judecat de El potrivit faptelor noastre și dorințelor inimii noastre.
- Noi depunem mărturie, ca apostoli ai Săi rânduiți corect – că Isus este Hristosul cel Viu, Fiul nemuritor
  al lui Dumnezeu. El este marele Rege Emanuel, care stă, astăzi, la dreapta Tatălui Său. El este lumina,
  viața și speranța lumii. Calea Sa este drumul care duce la fericire în această viață și viață eternă
  în lumea care va veni. Să mulțumim lui Dumnezeu pentru darul fără seamăn care este Fiul Său divin.
