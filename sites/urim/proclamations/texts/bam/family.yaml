title: Denbaya
subtitle: Weleweledali da diɲɛ ye
author: Yesu Krisita ka Don Labanw Senumanw ka Egilisi ka Ɲɛmɔgɔya Fɔlɔ ani Ciden Tannifilaw ka Lajɛ
note: Ni weleweledali kalan na Gordon B. Hinckley fɛ, Egilisi ɲɛmɔgɔ, a ka kuma sen fɛ min fɔra Dɛmɛ don
  Jɛkulu ka foroba ɲɔgɔnyeba la min kɛra sɛtanburu kalo tile 23, san 1995 Salt Lake City.
paragraphs:
- Anw, Yesu Krisita ka Don Labanw Senumanw ka Egilisi ka Ɲɛmɔgɔya Fɔlɔ ani Ciden Tannifilaw ka Lajɛ, bɛ
  weleweleda sɛbɛ la ko cɛ ani muso ka furu latigɛlen dɔn Ala fɛ ani ko denbaya jɔyɔrɔ ka bo kosɛbɛ Dabaa
  ka fɛɛrɛ la A denw ka dakan banbali kosɔn.
- Hadamadenw bɛɛ, cɛw ani musow dan na Ala yɛrɛ ja la. An bɛɛ ye sankolo bangebaaw hakili denkɛw ani denmusow
  kanulenw ye ani, o cogo la, Alamaya cogoya ani Alamaya dakan bɛ an kelen kelen la. Cɛya walima musoya
  ye faranfasiyali ye min jɔyɔrɔ ka bo an kɛ cogo ani an kelen kelen kɛ kun laharaso, diɲɛsosigi ani banbali.
- Laharaso lahaala kɔnɔ, hakili denkɛw ani denmusow tun bɛ Ala don ani u tun bɛ A bato, u Fa Banbali.
  U sɔnna A ka laɲini ma A denw bɛ se ka farikolo sɔrɔ ani ka dɔnniya sɔrɔ dugukolo kan ka taɲɛ ka ta
  dafalenya la, ani laban na ka u ka Alamaya dakan waleya ka se ka ɲɛnamaya banbali tiɲɛ sɔrɔ. Ala ka
  hɛrɛ fɛɛrɛ bɛ a to somɔgɔya bɛ to ye saya kɔfɛ. Walesenumanw ani layidu senuw min bɛ se ka kɛ tampulu
  senumanw kɔnɔ bɛ se ka to mɔgɔw bɛ se ka segi ka ta Ala yɔrɔ ani denbaya ka se ka faraɲɔgɔnkan badaa
  badaa.
- Ala ye ci fɔlen fɔlɔ min di Hadama ni Hawa ma tun bɛ u ka bangebaaya se kun kan ni ɲɔgɔn cɛ ni muso
  ye. An bɛ a weleweleda ko Ala ye Ci fɔlen min di A denw ma ka bugu ka duguma kolo fa bɛ se na. An bɛ
  a weleweleda fana ko Ala ye a fɔ ko bange se senumanw ma kan ka kɛ fo cɛ ani muso min furu la ɲɔgɔn
  ma sariya kɔnɔ.
- An bɛ a weleweleda ko ɲɛnamaya dan cogo diɲɛsosigi la sigi la Ala fɛ. An bɛ ɲɛnamaya senumaya ko fɔ
  ani a nafa Ala ka banbali fɛrɛ la.
- Cɛ ni furumuso ka ci ye ka ɲɔgɔn kanu ani ka ɲɔgɔn ladon ani k’u denw kanu ani k’u ladon. “Denmisɛnw
  ye ciyɛn dilen ye Matigi fɛ” (Zaburu 127:3). Ci senuman bɛ bangebaaw bolo k’u denw mara kanuya ani tilennenya
  kɔnɔ, ka jɔ u ka farikolo ani Hakili ta fan fɛ mago kɔrɔ ani k’u kalan u ka kɛ ɲɔgɔn fɛ a ni ka bara
  kɛ ɲɔgɔnye, ka Ala ka ci fɔlen bato ani ka kɛ jamana denw sariya bonya baw ye u bɛ balo yɔrɔ min la.
  Furu cɛw ani furu musow (bamusow ani fakɛw) bɛ na jɔ u ka ci kɔrɔ Ala ɲɛmaa cogoya min na u ye o ko
  wajibiyalenw kɛ.
- Denbaya sigi la Ala fɛ. Furu min bɛ cɛ ni muso cɛ jɔyɔrɔ ka bo banbali fɛrɛ la. Jo bɛ denmisɛnw bolo
  ka wolo furu ɲɔgɔnya kɔnɔ ani ka lamɔ fa ani ba fɛ minnu bɛ u ka furu layidu bato kantigiya kɔnɔ. An
  garijɛgɛ bɛ bonya kosɛbɛ ka se ka denbaya hɛrɛ sɔrɔ n’o ya sɔrɔ o sigilen dɔ Matigi Yesu Krisita ka
  kalansiraw kan. Furuɲɔgɔnmaya ani denbaya kunnawolo sɛmɛlen dɔ ka bi daminɛ na ani tuma bɛ dannaya,
  deli, nimisa ka bɔ jurumu la, yafa, bonya, kanuya, hinɛ Baara ani tɔlɔ finw ɲumanw kan. Ni Ala ka kuma
  fɔlen ye, fa kan ka denbaya mara kanuya ani tilennenya kɔnɔ a ni a ka jo do ka jɔ denbaya ka magow gɛlɛnw
  kɔrɔ ani k’a ka denbaya tanga. Denba ka baara fɔlɔ ye k’a denw lamɔ. U ka ci senumanw kɔnɔ, fa ni ba
  wajibiyalen dɔ ka ɲɔgɔn dɛmɛ ka sɔrɔ u ye tama ɲɔgɔn kelenw ye. Lujura, saya walima lahaala wɛrɛ minnu
  bɛ se ka na ni kɛ cogoya wɛrɛ ye. Denbaya min ka bon kan ka ka na ni dɛmɛ ye ni o yan sɔrɔ a ka kan.
- 'An bɛ kan kari ma da kɛ: mɔgɔ minnu bɛ cɛnimusoya jɛlenya ka layiduw ciyɛn, ka tɔɔrɔ lase u cɛ wali
  u muso ma wali u denw, wali u t’u ka denbaya ci kɛ, bɛ na ɲɛfɔli kɛ don dɔ la Ala ɲɛ na. An bɛ ni kan
  kari da fana: denbaya ciyɛnli bɛ na kojugu sama ka na mɔgɔw sigidaw ani jamanaw kan o min tun fɔra fɔlɔ
  fɔlɔ ani bi kiraw fɛ.'
- An bɛ jamanadenw ɲumanw ani gofɛrɛnaman ɲɛmaaw yɔrɔ bɛɛ ka se ka walew sin sin walew minnu bɛ denbaya
  lakana ani ka sin sin a ka baara la min ye sigida jɔnjɔn ye.
