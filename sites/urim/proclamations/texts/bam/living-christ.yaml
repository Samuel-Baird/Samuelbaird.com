title: Krisita Balolen
subtitle: Cidenw ka Seereya
author: Yesu Krisita ka Don Labanw Senumanw ka Egilisi
paragraphs:
- Ka sɔrɔ an bɛ Yesu Krisita ka bangeli sanyɛlɛma hakili jigi seli la, ni ye o san ba fila ye sinsan,
  an bɛ an ka seereya di A ka balo kan nin sanga fɛn te ye ani A ka jurumu kafari saraka belebele senuman
  banbali kan. Mɔgɔ wɛrɛ te ye min ka kow ye fanga sɔrɔ min nun balo la ani min nun bɛ na balo duguma
  kolo kan i na fɔ Ale.
- Ale tun ye Layidu Kɔrɔ Jehova Belebele ye, Layidu Kura kɔnɔ Masiya. A Fa ka bi la sira li kɔnɔ A kɛra
  duguma kolo dan ba ye. “Fɛn bɛɛ dara Ale de fɛ. Fɛn o fɛn dara, o si ma da ni Ale nɔ tɛ.” (Yuhana 1:3).
  Ka sɔrɔ A jurumu tan, A batisera walasa ka tilennenya bɛɛ dafa. A “tun bɛ jamana yaala ka ko ɲuman kɛ”
  (Kɛwalew 10:38), A lagosi la o kosɔn. A ka kibaru duman tun ye bɛn ani ŋaniya ɲumaya ci ye. A ye a ɲini
  bɛɛ ka tugu A ka misali kɔ. A ye Filisiti siraw bɛɛ taama, ka banabaatɔw kɛnɛya, ka fiyentɔw ɲɛ yɛlɛn,
  ani ka suw kunu. A ye bada bada tiɲɛ kalanw kɛ, an ka ɲɛnamaya ka kɔn saya ɲɛ diɲɛ kɔnɔ tiɲɛ, an ka
  ɲɛnamaya kun diɲɛ kɔnɔ ani Ala denkɛw ani A denmusow semako diɲɛ min bɛ na kɔnɔ.
- A ye fana senuman sigi se kan ka hakili jigi kɛ A ka yɛrɛ saraka ka jurumu kafari belebele la. A minɛn
  na ka ɲangi ni nkalon jugu ye, ka ɲangi walasa ka jama sago kɛ ani ka ɲangi ka faga tɔɔrɔ gengen jiri
  kan Kunkolo Yɔrɔ la. A ye A ka ɲɛnamaya di walasa ka hadamadenw bɛɛ ka jurumuw kafari. O kun ye se ye
  min tun kali fara A la ka ta mɔgɔw bɛɛ ma min nun bɛ na ɲɛnamaya dugu kolo kan.
- An bɛ a seereya bɛɛ ye ko A ka ɲɛnamaya, min bɛ hadamadenw ka tariku bɛɛ la, ma daminɛ Bɛtilɛhɛm ani
  a ma laban tɔɔrɔ kan Kunkolo Yɔrɔ la. Ale tun ye Fa Denkɛ Fɔlɔ ye, Denkɛ Kelenpe kun n’o fari sogo la,
  diɲɛ Kunmabɔbaa.
- A kunu na ka bɔ kaburu la ka kɛ “minnu sara, … olu la kununlen fɔlɔ de ye” (1 Kɔrɛntekaw 15:20). Ka
  kɛ ni Matigi min sara ka kunu, A tagala bɔ A kun ye min nun kanu diɲɛ kɔnɔ. Ani fana A ye A ka Ala ko
  lase li kɛ A ka “sagaden wɛrɛw” cɛ la (Yuhana 10:16) Ameriki kunu kɔnɔ. Diɲɛ Kura ni kɔnɔ, Ale ani A
  Fa y’u yɛrɛ jira funakɛnin Joseph Smith la, n’o kɛra dayɛlɛli kura ye ka kɛ “kunnasigibaaya ka waati
  tannifilafiliw” min kun layidu kun tara ka bi ni waati jan (Efesekaw 1:10 lajɛ).
- 'A ɲɛw tun bɛ i ko tasuma mɛnɛ; A kunsigi tun ka jɛ i n’a fɔ nɛji saniyalen ; A ɲɛda tun bɛ yeelen bɔ
  ka tɛmɛ tile yeelen kan ; A kan tun bɛ i ko jiba mankan, hali Jehova ka kumakan, tun ba fɔ :'
- “Ne ye fɔlɔ ni laban ye; Min ɲɛnama don, ne de fagara. Ne ye aw lafasabaga ye Fa fɛ”. (KnL 110:3–4).
- 'Ani Sisan, seereya caman minnu dira A ko la, nin ye seereya ye, bɛɛ la laban na, an bɛ min di A ko
  la: Ko A balolen don!'
- “An y’A ye, Ala kinin fɛ; An ye kumakan mɛn min bɛ seereya kɛ ko Ale de ye Fa ka Denkɛ kelenpe ye—
- “Ko nin Ale ye, ani nin Ale sababula, nin Ale fɛ, diɲɛw bɛ, u tun danla, ani u sigibagaw ye denkɛw ni
  denmusow bangelen ye Ala fɛ” (KnL 76:22–24).
- An bɛ a fɔ bɛɛ ye ko A ka pɛrɛtirizi ani A ka Egilisi sigi la se kan kura ye dugu kolo san fɛ “a jɔ
  la jɔ sen kan min ye … cidenw ani kiraw, Yesu Krisita yɛrɛ min ye seleke kabakuru nafaman ye” (Efesekaw
  2:20).
- An bɛ a seereya ko A bɛ na segi ka na don dɔ la dugu kolo kan. “Ani Matigi nɔrɔ bi na da kɛnɛ kan o
  wati kele na, farisogow bɛɛ bɛ n’A ye” (Esayi 40:5 lajɛ). A na masaya i ko Masakɛw ka Masakɛ, ka masaya
  kɛ i ko Matigiw ka Matigi, kibirikun bɛɛ bɛ na biri ani nɛnw bɛɛ bɛ na kuma bato kɛ A ɲɛ kɔrɔ. An kele
  kele bɛɛ na kiri Ale fɛ an ka baara kɛ taw la ani an dusukunw na diya ɲɛ fɛnw.
- An bɛ a seereya, ka sɔrɔ an ye A ka Cidenw yamaruyalen ye—ko Yesu ye Krisita Balolen ye, Ala Denkɛ sabali.
  Ale de ye Masakɛ ba Emanuɛl ye, min jɔlen bɛ A Fa kini yan fan fɛ. Ale de ye yeelen ye, ɲɛnamaya ani
  jigiya jinɛ kɔnɔ. A ka sira ye sira ye min bɛ hɛrɛ lase an ma ani ɲɛnamaya banbali diɲɛ na ta kɔnɔ.
  Ala ka tanu A ka Alamaya Denkɛ sanga bali dili la an ma.
