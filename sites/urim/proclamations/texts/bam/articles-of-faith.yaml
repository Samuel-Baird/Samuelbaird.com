title: Dannayasenw
subtitle: Yesu Krisita ka Don Labanw Senumanw ka Egilisi
author: ''
verses:
- n: 1
  text: An dalen don Ala la, Badaa Fa, ani a Denkɛ Yesu Krisita la, ani Hakili Senu la.
- n: 2
  text: An dalen don a la ko, mɔgɔw bɛ na ɲangi u yɛrɛw ka jurumuw kɔsɔn, mun te Hadama ka sariya tiɲɛ
    kow ye.
- n: 3
  text: An dalen don a la ko, Yesu Krisita ka jurumuw juru sara wale kɔsɔn, hadamadenw bɛɛ bɛ se ka kisi,
    ni u ye Kibaru Duman sariyaw ni walesenumanw bato.
- n: 4
  text: 'An dalen don a la ko, Kibaru Duman sigisenw ni walesenumanw fɔlɔw ye: fɔlɔ, Matigi Yesu Krisita
    dannaya; filanan, nimisa; sabanan, batɛmu ka su ji la, jurumu yafa kɔsɔn; naaninan, bolo da, Hakili
    Senu di kɔsɔn.'
- n: 5
  text: An dalen don a la ko, mɔgɔ kan ka wele Ala fɛ ni kiraya ye, a ni bolo dali, yamaruya tigiw fɛ,
    walasa ka Kibaru Duman lase ani ka a walesenumanw kɛ.
- n: 6
  text: 'An dalen don, sigi cogoya la, min tun bɛ Egilisi fɔlɔ fɔlɔ kɔnɔ, i na fɔ: cidenw, kiraw, pasitɛriw,
    karamɔgɔw, kibaru duman fɔbaaw, ani o ɲɔgɔnna wɛrɛw.'
- n: 7
  text: An dalen don, kanw fɔli, kiraya, jiraliw, yeliw, kɛnɛyaliw, kanw wɛrɛw kɔrɔ fɔli, ani o ɲɔgɔnna
    wɛrɛw diw la.
- n: 8
  text: An dalen don a la ko, Bibile ye Ala ka kuma ye, ni o ya sɔrɔ a bayɛlɛmalen don ka ɲɛ; an dalen
    don la fana ko, Mormɔn ka Gafe ye Ala ka kuma ye.
- n: 9
  text: An dalen don, Ala ye min bɛɛ jira, a bɛ min bɛɛ jira la sisan, ani an dalen don a la ko, a bɛ
    na fɛn baw nafamanw caman jira Ala ka masaya ko la.
- n: 10
  text: An dalen don Israɛl ka lajɛ yɛrɛ la ani kabila tanw ka labɛn ko kura la. An dalen don a la ko,
    Sion (Jerusalɛm Kura) bɛ na jɔ ameriki gun kan, ko Krisita yɛrɛ bɛ na masaya dugukolo sanfɛ, ko dugukolo
    na kuraya ani ka a ka alijɛnɛ nɔɔrɔ ya sɔrɔ.
- n: 11
  text: An bɛ a fɔ ka jɛya ko, jo bɛ an bolo ka Sebaayabɛɛtigi Ala bato ni an hakili famuya ye, ani an
    sɔnna o jo kelen fana ma mɔgɔw bɛɛ ye, u ku ka bato kɛ komi a ka di u ye, yɔrɔ min ka di u ye, fɛn
    min ka di u ye.
- n: 12
  text: An dalen don a la ko, an kan ka kolo masaw ye, ɲɛmɔgɔw ye, marabagaw ye, a ni kiritigɛlaw ye ani
    fana ko an kan ka sariya bato, ka bonya, ani ka lafasa.
- n: 13
  text: An dalen don a la ko an kan ka kɛ mɔgɔ sɛbɛw ye, mɔgɔ laadiriw ye, mɔgɔ jɛlenw ye, mɔgɔ ɲuman,
    mɔgɔ tilennenw, ani an kan ka ɲumaya kɛ mɔgɔw bɛɛ ye; siga te a la an bɛ se ka fɔ ko an bɛ ka tugu
    Paul ka waajuli kan kɔ — an dalen don fɛn bɛɛ la, an jigi dalen don fɛn bɛɛ la, an ɲɛ fɛn caman muɲu,
    an jigi dalen don ka se ka fɛn bɛɛ muɲu. Ni ko tilennenw bɛ ye, ni ko minnu ka di bɛ ye, wali ni ko
    minnu tɔgɔ ɲumanw bɔra bɛ ye, wali ni ko minnu ka kan ni lafasali bɛ ye, an bɛ o ɲini.
signature: Joseph Smith.
