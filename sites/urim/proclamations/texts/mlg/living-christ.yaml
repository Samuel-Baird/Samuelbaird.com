title: Ilay Kristy Velona
subtitle: Tenivavolombelon’ny Apôstôly
author: Ny Fiangonan’i Jesoa Kristy Ho an’ny Olomasin’ny Andro Farany
paragraphs:
- Ho fankalazantsika ny fahatsiarovana ny nahaterahan’i Jesoa Kristy roa arivo taona lasa izay, dia manolotra
  ny tenivavolombelonay izahay ny amin’ny fisian’ny fiainany tsy manam-paharoa sy ny zava-tsoa tsy misy
  fetran’ny sorompanavotany lehibe. Tsy nisy olona hafa nanana akony toy izany teo amin’ireo rehetra efa
  niaina sy ireo mbola hiaina eto an-tany.
- Izy ilay Jehovah lehibe ao amin’ny Testamenta Taloha, ilay Mesia ao amin’ny Testamenta Vaovao. Izy no
  Mpamorona ny tany teo ambany fitarihan’ny Rainy, “Izy no nahariana ny zavatra rehetra; ary raha tsy
  Izy dia tsy nisy nahariana izao zavatra ary izao, na dia iray aza” (Jaona 1:3). Na dia tsy nanam-pahotana
  aza Izy dia natao batisa mba hahatanteraka ny fahamarinana rehetra. “Nandehandeha nanao soa” Izy (Asa
  10:38) nefa dia natao tsinontsinona noho izany. Ny filazantsarany dia hafatra mitory fiadanana sy hatsaram-panahy.
  Niantso ny olon-drehetra Izy mba hanaraka ny ohatra nomeny. Nandeha tamin’ny lalamben’i Palestina Izy,
  nanasitrana ny marary, nampahiratra ny jamba, ary nampitsangana ny maty. Nampianatra ireo fahamarinana
  maharitra mandrakizay Izy, ny fisian’ny fiainantsika talohan’izao fiainana izao, ny tanjon’ny fiainantsika
  eto an-tany, ary ny zavatra azon’ireo zanakalahy sy zanakavavin’ Andriamanitra tanterahina amin’ny fiainana
  ho avy.
- Nanao ny Fanasan’ny Tompo Izy ho fahatsiarovana ny sorompanavotany lehibe. Nosamborina Izy ary nohelohina
  tamin’ny fiampangana tsy marina, nohelohina mba hahafaly ireo mpioko, ary nohelohina ho faty teo ambony
  hazo fijaliana tany Kalvary. Natolony ny ainy mba ho sorona noho ny fahotan’ny zanak’olombelona rehetra.
  Fanomezana lehibe tamin’ny alalan’ny fisoloana tena no nataony ho an’izay rehetra niaina na mbola hiaina
  eto an-tany.
- Mijoro ho vavolombelona amim-panajana izahay, fa ny fiainany, izay ivon’ny tantaran’ny olombelona rehetra,
  dia sady tsy nanomboka tao Betlehema no tsy nifarana tao Kalvary. Izy no Voalohan-teraky ny Ray, ilay
  Zanakalahy tokana tao amin’ny nofo, ilay Mpanavotra izao tontolo izao.
- Nitsangana tamin’ny maty Izy mba “ho santatr’ izay efa nodimandry” (1 Korintiana 15:20). Amin’ny maha-Tompo
  efa nitsangana tamin’ny maty Azy, dia namangy ireo olon-tiany teo amin’ny fiainany Izy. Nanompo sy niasa
  tany amin’ireo “ondriny very” (Jaona 10:16) tany Amerika taloha koa Izy. Tao amin’izao tontolo iainantsika
  izao, dia niseho tamin’ilay zazalahy atao hoe Joseph Smith Izy sy ny Rainy, mba hampiditra amin’ilay
  “andro voatendry hanangonany ny zavatra rehetra” (Efesiana 1:10) efa nampanantenaina hatramin’ny ela.
- 'Toy izao no nosoratan’ny mpaminany Joseph mikasika ilay Kristy Velona: “Ny masony dia tahaka ny lelafo;
  ny volon-dohany dia fotsy tahaka ny oram-panala tsy misy fangarony; ny tarehiny dia manjelanjelatra
  mihoatra noho ny famirapiratry ny masoandro; ary ny feony dia tahaka ny firohondrohon’ny rano be, dia
  ny feon’i Jehovah manao hoe:'
- “Izaho no voalohany sy farany; Izaho no Ilay velona; Izaho no Ilay efa novonoina; Izaho no mpisolovava
  anareo ao amin’ny Ray” (F&F 110:3–4).
- 'Toy izao ihany koa no nambaran’ny mpaminany momba Azy: “Ary ankehitriny, aorian’ireo tenivavolombelona
  maro izay efa natao momba Azy, dia inty ny tenivavolombelona, ny farany amin’ny rehetra, izay ataonay
  momba Azy: Fa velona Izy!'
- “Fa hitanay Izy, eo an-tanana an-kavanan’ Andriamanitra; ary renay ny feo manambara fa Izy no Zanaka
  Lahitokan’ny Ray—
- “Fa tamin’ny alalany sy tao Aminy ary avy Aminy no ary sy nahariana ireo tontolo, ary ny mponina eo
  aminy dia ateraka ho zanakalahy sy ho zanakavavy ho an’ Andriamanitra” (F&F 76:22–24).
- Ambaranay amim-panajana fa ny Fisoronany sy ny Fiangonany dia naorina indray eto ambonin’ny tany–“natsangana
  teo ambonin’ny fanorenan’ny Apostoly sy ny mpaminany, ary Kristy Jesosy no fehizoro indrindra” (Efesiana
  2:20).
- Mijoro ho vavolombelona izahay fa mbola hiverina eto an-tany Izy indray andro any. “Dia hiseho ny voninahitr’i
  Jehovah, ary ny nofo rehetra hiara-mahita izany” (Isaia 40:5). Hanapaka amin’ny maha-Mpanjakan’ny mpanjaka
  sy hanjaka amin’ny maha-Tompon’ny tompo Azy Izy, ary handohalika ny lohalika rehetra ary ny lela rehetra
  hidera Azy. Isika tsirairay dia mbola hijoro hotsaraina eo anatrehany araka ny asantsika sy ny fanirian’ny
  fontsika.
- Mijoro ho vavolombelona izahay, amin’ny maha-apôstôly voatedriny anay–fa i Jesoa no ilay Kristy Velona,
  ilay Zanakalahin’ Andriamanitra tsy mety maty intsony. Izy ilay Mpanjaka lehibe Emanoela izay mijoro
  eo an-tanana ankavanan’ny Rainy ankehitriny, Izy no fahazavana, fiainana ary fanantenan’izao tontolo
  izao. Ny fampianarany no lalana mitondra mankany amin’ny fahasambarana eto amin’izao fiainana izao sy
  mankany amin’ny fiainana mandrakizay amin’ny fiainana ho avy. Isaorana anie Andriamanitra noho ny fanomezany
  tsy manam-paharoa ny Zanany masina.
