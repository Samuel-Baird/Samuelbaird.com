retrieved: '2026-11-02'
title: Ny Famerenana amin’ny Laoniny ny Fahafenoan’ny Filazantsaran’i Jesoa Kristy
subtitle: Fanambarana ho an’izao tontolo izao nandritra ny fankalazana ny faha-roanjato taona
author: Ny Fiadidiana Voalohany sy ny Filankevitry ny Apôstôly Roambinifolo ao amin’ Ny Fiangonan’i Jesoa
  Kristy ho an’ny Olomasin’ny Andro Farany
note: Ity fanambarana ity dia novakin’ny Filoha Russell M. Nelson ho anisan’ny hafatra nozarainy tamin’ny
  fihaonamben’ny Fiangonana maneran-tany fanao isan-taona faha-190, ny 5 aprily 2020, tao Salt Lake City,
  Utah.
paragraphs:
- Izahay dia manambara amin’ny fomba manetriketrika fa Andriamanitra dia tia ny zanany any amin’ny firenena
  rehetra manerana izao tontolo izao. Nomen’ Andriamanitra Ray antsika ny fahaterahana masina, sy ny fiainana
  tsy manam-paharoa, ary ny sorona fanavotana tsy misy fetran’ny Zanaka Malalany, dia i Jesoa Kristy.
  Tamin’ny alalan’ny herin’ny Ray no nitsanganan’i Jesoa indray ka nahazoany fandresena tamin’ny fahafatesana.
  Izy no Mpamonjy antsika, sy Ohatra arahintsika, ary Mpanavotra antsika.
- Roanjato taona lasa izay, indray maraina mahafinaritra tamin’ny lohataona 1820, raha nikatsaka ny hahafantatra
  izay fiangonana hidirana ho mpikambana ny zatovolahy Joseph Smith, dia nandeha tany an’ala izy mba hivavaka,
  akaikin’ny fonenany, tsy lavitry ny tanàn-dehiben’i New York Etazonia. Nanana fanontaniana izy mikasika
  ny famonjena ny fanahiny ka natoky fa hitarika azy Andriamanitra.
- Amim-panetrentena no hanambaranay fa ho valin’ny vavaka nataony, dia niseho tamin’i Joseph Andriamanitra
  Ray sy ny Zanakalahiny, Jesoa Kristy, ka nanokatra ilay “fampodiana ny zava-drehetra” (Asa 3:21) araka
  ny voambara mialoha tao amin’ny Baiboly. Nianatra izy tao amin’io fahitana io fa taorian’ny nahafatesan’ireo
  Apôstôly voalohany dia tsy hita teto an-tany intsony ny Fiangonan’i Kristy tamin’ny andron’ny Testamenta
  Vaovao. I Joseph no ho fitaovana amin’ny famerenana izany.
- Ambaranay fa teo ambany fitarihan’ny Ray sy ny Zanaka dia nisy iraka maro avy any an-danitra tonga hanome
  toromarika an’i Joseph sy hamerina hanorina indray ny Fiangonan’i Jesoa Kristy. Namerina tamin’ny laoniny
  ny fahefana hanaovana batisa asitrika ho famelana ny fahotana i Jaona Mpanao Batisa efa nitsangana tamin’ny
  maty. Namerina tamin’ny laoniny ny andraikitry ny apôstôly sy ireo fanalahidin’ny fahefan’ny fisoronana
  ny telo tamin’ireo Apôstôly Roambinifolo voalohany, dia i Petera, sy i Jakoba, ary i Jaona. Nisy hafa
  tonga ihany koa, anisan’izany i Elia, izay namerina tamin’ny laoniny ny fahefana hampitambarana mandrakizay
  ny fianakaviana ao anatin’ny fifandraisana maharitra mandrakizay izay manan-kery any ankoatry ny fahafatesana.
- 'Mbola hijoroanay ho vavolombelona ihany koa fa nomena an’i Joseph Smith ny fanomezam-pahasoavana sy
  herin’ Andriamanitra handikana rakitsoratra iray fahiny: ny Bokin’i Môrmôna—Testamenta iray hafa momba
  an’i Jesoa Kristy. Ny pejy sasany ao amin’io lahatsoratra masina io dia ahitana tantaran’ny asa fanompoana
  manokana nataon’i Jesoa Kristy teo anivon’ny vahoaka tany amin’ny Ilabolantany Andrefana tsy ela akory
  taorian’ny Fitsanganany tamin’ny maty. Izy io dia mampianatra ny tanjon’ny fiainana sy manazava ny fotopampianaran’i
  Kristy, izay ivon’io tanjona io. Amin’ny maha-soratra masina mpiara-dia amin’ny Baiboly azy, ny Bokin’i
  Môrmôna dia mijoro ho vavolombelona fa ny olombelona rehetra dia zanakalahy sy zanakavavin’ny Ray any
  An-danitra be fitiavana, fa manana drafitra masina Izy ho an’ny fiainantsika, ary ny Zanakalahiny, Jesoa
  Kristy, dia miteny ankehitriny tsy misy hafa amin’ny tamin’ny andro fahiny.'
- Ambaranay fa Ny Fiangonan’i Jesoa Kristy ho an’ny Olomasin’ny Andro Farany, naorina tamin’ny 6 aprily
  1830, no Fiangonan’i Kristy tamin’ny andron’ny Testamenta Vaovao, izay naverina tamin’ny laoniny. Ity
  Fiangonana ity dia mifototra lalina amin’ny fiainana tonga lafatr’ilay fehizorony indrindra, dia i Jesoa
  Kristy, sy ny Sorompanavotany tsy manam-petra ary ny Fitsanganany tamin’ny maty ara-bakiteny. Niantso
  Apôstôly indray i Jesoa Kristy ary nanome azy ireo ny fahefan’ny fisoronana. Manasa antsika rehetra
  Izy hanatona Azy sy ny Fiangonany, handray ny Fanahy Masina, sy ireo ôrdônansin’ny famonjena, ary mba
  hahazo fifaliana maharitra.
- Roanjato taona izay no lasana hatramin’ny nampanombohan’ Andriamanitra Ray sy ny Zanaka Malalany, Jesoa
  Kristy, an’ity Famerenana amin’ny laoniny ity. Olona an-tapitrisa maro manerana izao tontolo izao no
  nanaiky ny fahalalana momba ireo tranga efa nambara mialoha ireo.
- Ambaranay amim-piravoravoana fa mandroso amin’ny alalan’ny fanambarana mitohy ilay Famerenana amin’ny
  laoniny nampanantenaina. Tsy ho toy ny teo aloha intsony izao tontolo izao, rehefa hanohy “hanangona
  ny zavatra rehetra ho iray ao amin’i Kristy” (Efesiana 1:10) Andriamanitra.
- Amim-panajana lalina sy fankasitrahana, amin’ny maha-Apôstôliny anay no anasanay ny rehetra hahafantatra,
  tahaka ny ahafantaranay, fa misokatra ny lanitra. Ambaranay fa ampahafantarin’ Andriamanitra ny sitrapony,
  ho an’ireo zanakalahy sy zanakavavy malalany. Mijoro ho vavolombelona izahay fa ireo izay mandalina
  ombam-bavaka ny hafatry ny Famerenana amin’ny laoniny ka manao asa amim-pinoana dia ho voatahy hahazo
  fijoroana ho vavolombelona ho an’ny tenan’izy ireo manokana momba ny maha-avy amin’ Andriamanitra azy
  io sy momba ny tanjon’izy io, dia ny manomana izao tontolo izao ho amin’ny Fiavian’i Jesoa Kristy Tompo
  sy Mpamonjintsika fanindroany izay efa nampanantenaina.”
