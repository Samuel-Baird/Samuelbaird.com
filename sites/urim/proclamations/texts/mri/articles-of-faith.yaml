title: Ngā Tikanga o te Whakapono
subtitle: nō Te Hāhi o Ihu Karaiti o te Hunga Tapu o ngā Rā o Muri Nei
author: ''
verses:
- n: 1
  text: E whakapono ana mātou ki te Atua, ki te Matua Ora Tonu, ki Tana Tama ki a Ihu Karaiti, ki te Wairua
    Tapu anō hoki.
- n: 2
  text: E whakapono ana mātou tērā e whiua ngā tāngata mō ō rātou hara ake, ehara i te mea mō tō Arama
    haranga.
- n: 3
  text: E whakapono ana mātou e taea anō, e te whakamārietanga a te Karaiti, te whakaora i ngā tāngata
    katoa e ngohengohe ana ki ngā ture me ngā tikanga o te Rongo Pai.
- n: 4
  text: 'E whakapono ana mātou ko ngā tikanga o taua Rongo Pai: tuatahi, ko te Whakapono ki te Ariki ki
    a Ihu Karaiti; tuarua, ko te Rīpenatatanga; tuatoru ko te Iriiringa rumaki, hei murunga hara; tuawhā,
    ko te Whakapākanga o ngā ringaringa mō te Hoatutanga o te Wairua Tapu.'
- n: 5
  text: E whakapono ana mātou kua takoto te tikanga kia karangatia te tangata e te Atua, ki te kauwhau
    i te Rongo Pai, ki te mahi hoki i ōna tikanga, i runga i te poropititanga me te whakapākanga ringaringa
    o ngā tāngata kua whakaritea hei pērā.
- n: 6
  text: E whakapono ana mātou ki taua whakaritenga anō i whakaritea ai te hāhi i mua; arā, ki ngā āpōtoro,
    ki ngā poropiti, ki ngā hēpara, ki ngā kai whakaako, ki ngā kai kauwhau i te rongo pai, ki ērā atu
    anō hoki.
- n: 7
  text: E whakapono ana mātou ki te homaitanga o ngā reo kē, ki te mahi poropiti, ki ngā whakakitenga,
    ki ngā kitenga, ki ngā mana whakaora, ki te whakamāoritanga i ngā reo, ki ērā atu anō hoki.
- n: 8
  text: E whakapono ana mātou ko te Paipera Tapu te kupu a te Atua; arā, ko te wāhi i tika te whakamāoritanga;
    e whakapono ana anō hoki mātou ko te Pukapuka a Moromona te kupu a te Atua.
- n: 9
  text: E whakapono ana mātou ki ngā mea katoa kua whakakitea mai e te Atua i mua, ki ngā mea anō hoki
    e whakakitea mai nei e Ia ināianei; ā e whakapono ana mātou tērā e maha ngā tino tikanga utu nui o
    te rangatiratanga o te Atua, e whakakitea mai anō e Ia.
- n: 10
  text: E whakapono ana mātou ki te huihuinga katoatanga o Iharaira, ki te whakahokinga mai anō hoki o
    ngā hapū kotahi tekau, ki te hanganga o Hīona ki runga ki tēnei tuawhenua (ki Amerika), ki te kingitanga
    a Te Karaiti ki runga ki te whenua, ki te whakahoutanga anō hoki o te whenua, ki te rironga hoki i
    a ia o tōna kororia pararaiha.
- n: 11
  text: Kua kīa e mātou kei a mātou te tikanga ki te karakia atu ki te Atua Kaha rawa i runga i te whakaaetanga
    o ō mātou ake hinengaro; ā ka tuku atu i taua tikanga anō ki ngā tāngata katoa, ahakoa karakia rātou
    pēhea, ki hea, ki te aha rānei.
- n: 12
  text: E pai ana mātou ki te haere i raro i te mana o ngā kīngi, o ngā tumuaki, o ngā rangatira, o ngā
    kai whakahaere tikanga; ā e pai ana hoki mātou ki te ngohengohe, ki te whakahōnore, ki te tautoko
    hoki i te ture.
- n: 13
  text: Ā e hiahia ana mātou kia tika, kia pono, kia hē-kore, kia atawhai, kia ū ki te pai, ki te mahi
    pai anō hoki ki ngā tāngata katoa; arā, e whai ana mātou i tā Pāora whakatūpatoranga—E whakapono ana
    mātou ki ngā mea katoa, e tūmanako atu ana mātou ki ngā mea katoa, kua manawanui mātou ki ngā mea
    maha, ā e hiahia ana mātou kia manawanui ki ngā mea katoa. Mehemea he mea pai, he mea ātaahua rānei,
    he mea kōrerotia paitia rānei, he mea whakamoemititia rānei, e whai ana mātou i aua mea.
signature: Hōhepa Mete.
