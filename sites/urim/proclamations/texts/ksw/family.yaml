title: ဟံၣ်ဖိဃီဖိ
subtitle: တၢ်ဘိးဘၣ်သ့ၣ်ညါရၤလီၤလၢဟီၣ်ခိၣ်ဒီဖျၢၣ်
author: ယ့ၣ်ၡူးခရံာ်အသရိာ်ဘၣ်ဃးဒီးၦၤစီဆှံလၢမုၢ်နံၤခံကတၢၢ်အၦၤပၢၤလီၢ်ဆ့ၣ်နီၤအခိၣ်တဖုဒီးၦၤကူၣ်လိာ်တၢ်ဖိ လၢအမ့ၢ်တၢ်မၢဖိတဆံးခံဂၤ
note: တၢ်ဘိးဘၣ်သ့ၣ်ညါတဘ့ၣ်အံၤဘၣ်တၢ်ဖးအီၤလၢခိၣ်နၢ် ကိဒၢၣ်ဘံဟံးကလံး အိၣ်လၢအတၢ်ကစီၣ်လၢပိာ်မုၣ်ကရၢအတၢ်အိၣ်ဖှိၣ်ဖဲလါစဲးပတ့ဘၢၣ်
  ၂၃, ၁၉၉၅, ဖဲစါလ့ၣ်စံၣ်ထံး, ယူထၣ်.
paragraphs:
- ပဝဲ, ၦၤပၢၤလီၢ်ဆ့ၣ်နီၤအခိၣ်တဖုဒီးၦၤကူၣ်လိာ်တၢ်ဖိလၢအမ့ၢ်တၢ်မၢဖိတဆံးခံဂၤ, လၢယ့ၣ်ၡူးခရံာ်အသရိာ်ဘၣ်ဃးဒီးၦၤစီဆှံလၢမုၢ်နံၤခံကတၢၢ်,
  လၢတၢ်သညူးသၦၢ်ပတဲဖျါထီၣ်လၢတၢ်တ့တၢ်ဖျီပိာ်ခွါဒီးပိာ်မုၣ်န့ၣ်မ့ၢ်ယွၤတိာ်ပာ်စၢၤဝဲဒီးလၢဟံၣ်ဖိဃီဖိမ့ၢ်တၢ်အခီၣ်ထံးခီၣ်ဘိလၢၦၤတ့လီၤတၢ်တဂၤအတၢ်တိာ်ကျဲၤလၢအဖိအတၢ်ဟဲဝံဟဲစိာ်အစိၤစိၤအဃၣ်ဃၣ်န့ၣ်လီၤ.
- ကယဲၢ်ၦၤကညီခဲလၢာ်-ပိာ်ခွါဒီးပိာ်မုၣ်-ဘၣ်တၢ်တ့လီၤအီၤဒ်ယွၤအဂီၤဒၣ်ဝဲအသိးန့ၣ်လီၤ. ၦၤတဂၤစုာ်စုာ်မ့ၢ်မိၢ်ပၢ်လၢမူခိၣ်အဖိခွါဒီးဖိမုၣ်လၢအအဲၣ်အီၤဒီးအိၣ်ဒ်နီၢ်သးအသိးန့ၣ်,
  ဒီးမ့ၢ်လၢအအိၣ်ဒ်န့ၣ်အသိး, ၦၤတဂၤစုာ်စုာ်အိၣ်ဒီးတၢ်သကဲာ်ပဝးဒီးတၢ်ဟဲဝံဟဲစိာ်လၢအစီဆှံန့ၣ်လီၤ. တၢ်ကဲမုၣ်ကဲခွါန့ၣ်မ့ၢ်တၢ်အရ့ဒိၣ်လၢပတၢ်သကဲာ်ပဝးလၢပတၢ်အိၣ်မူတချုးဟီၣ်ခိၣ်,
  တၢ်အိၣ်မူလၢဟီၣ်ခိၣ်, ဒီးတၢ်အိၣ်သးဒီးတၢ်ပညိၣ်လီၤထူလီၤယိာ်န့ၣ်လီၤ.
- လၢတၢ်အိၣ်မူတချုးဟီၣ်ခိၣ်အလီၢ်န့ၣ်, နီၢ်သးဖိခွါဒီးဖိမုၣ်တဖၣ်သ့ၣ်ညါဒီးဘူၣ်ထီၣ်ဘါထီၣ်ယွၤဒ်အပၢ်လၢအမူဝဲလီၤထူလီၤယိာ်တဂၤဒီးတူၢ်လိာ်အတၢ်တိာ်ကျဲၤဖဲအဖိအလံၤကဒိးန့ၢ်နီၢ်ခိက့ၢ်ဂီၤဒီးန့ၢ်ဘၣ်တၢ်လဲၤခီဖျိလၢဟီၣ်ခိၣ်ဒ်သိးအကလဲၤဆူညါဆူတၢ်လၢတၢ်ၦဲၤဒီးသ့ၣ်ညါလၢခံကတၢၢ်အဝဲသ့ၣ်အတၢ်ဟဲဝံဟဲစိာ်စီဆှံဒ်အမ့ၢ်ၦၤဒိးန့ၢ်တၢ်အိၣ်မူလီၤထူလီၤယိာ်န့ၣ်လီၤ.
  တၢ်သူၣ်ခုသးခုအတၢ်တိာ်ကျဲၤစီဆှံပျဲဟံၣ်ဖိဃီဖိတၢ်ရ့လိာ်မုာ်လိာ်တဖၣ်လၢလဲၤယံၤန့ၢ်ဒံးတၢ်သံ. တၢ်အလုၢ်အလၢ်စီဆှံဒီးတၢ်အၢၣ်လီၤအီလီၤလၢတၢ်လုၢ်ဟံၣ်ပူၤပျဲၦၤတဂၤဒီးတဂၤက့ၤလၢယွၤအဂီၤထံးဒီးလၢဟံၣ်ဖိဃီဖိကအိၣ်တပူၤဃီလီၤထူလီၤယိာ်ကသ့န့ၣ်လီၤ.
- တၢ်မၤလိာ်ဆိကတၢၢ်တထံးလၢယွၤဟ့ၣ်လီၤစီၤအၤဒၣ်ဒီးနီၢ်အံၣ်အုမ့ၢ်ဘၣ်ထွဲဒီးအဝဲသ့ၣ်အတၢ်ကဲမိၢ်ပၢ်ဒ်ၦၤဒီမါဝၤန့ၣ်လီၤ.
  ပတဲဖျါထီၣ်လၢယွၤအတၢ်မၤလိာ်လၢအဖိအလံၤလၢကသၣ်ထီၣ်ဒီးအါထီၣ်ဒီးမၤၦဲၤဟီၣ်ခိၣ်အိၣ်တ့ၢ်ခဲကနံၣ်အံၤစ့ၢ်ကီးန့ၣ်လီၤ.
  ပတဲဖျါထီၣ်ဆူညါလၢယွၤမၤလိာ်ၦၤလၢတၢ်ထီၣ်ဖိအစိအကမီၤစီဆှံန့ၣ်ကဘၣ်တၢ်သူအီၤထဲဒ်ပိာ်ခွါဒီးပိာ်မုၣ်, လၢအဖျီအသးလၢပဒိၣ်အမဲာ်ညါဒ်ၦၤဒီမါဝၤအသိးန့ၣ်လီၤ.
- ပတဲဖျါထီၣ်လၢကျဲခီဖျိလၢတၢ်အိၣ်မူလၢဟီၣ်ခိၣ်တ့လီၤအသးန့ၣ်မ့ၢ်တၢ်လၢယွၤပာ်စီပာ်ဆှံလီၤ. ပစံးဝဲဂၢၢ်ဂၢၢ်ကျၢၤကျၢၤလၢတၢ်အိၣ်မူမ့ၢ်တၢ်အစီအဆှံဒီးအတၢ်ရ့ဒိၣ်လၢယွၤအတၢ်တိာ်ကျဲၤလီၤထူလီၤယိာ်န့ၣ်လီၤ.
- မါဒီးဝၤအိၣ်ဒီးအမူအဒါစီဆှံလၢကအဲၣ်ဒီးအံးထွဲကွၢ်ထွဲလိာ်အသးဒီးအဖိသ့ၣ်တဖၣ်စ့ၢ်ကီးန့ၣ်လီၤ. “ပဖိပလံၤန့ၣ်မ့ၢ်တၢ်န့ၢ်သါလၢယွၤလီၤ”
  (စံးထီၣ်ပတြၢၤ ၁၂၇:၃). မိၢ်ပၢ်တဖၣ်အိၣ်ဒီးအမူအဒါစီဆှံလၢလုၢ်ဒိၣ်ထီၣ်အဖိအလံၤလၢတၢ်အဲၣ်ဒီးတၢ်တီတၢ်လိၤ, လၢဟ့ၣ်တၢ်လၢအလိၣ်ဘၣ်န့ၣ်
  ဘၣ်ထွဲဒီးနီၢ်ခိၣ်ဒီးနီၢ်သး, ဒီးသိၣ်လိအဝဲသ့ၣ်လၢအဲၣ်လိာ်သးဒီးမၤစၢၤလိာ်သး, တိၢ်န့ၢ်ယွၤအတၢ်မၤလိာ်, ဒိကနၣ်ပဒိၣ်တၢ်သိၣ်တၢ်သီလၢအဝဲသ့ၣ်အတၢ်အိၣ်အလီၢ်န့ၣ်လီၤ.
  မါဒီးဝၤ, မိၢ်ဒီးပၢ်, တၢ်ကစံၣ်ညီၣ်အဝဲသ့ၣ်ဒ်အမၤလၢထီၣ်ၦဲၤထီၣ်အမူဒါလၢယွၤအမဲာ်ညါန့ၣ်လီၤ.
- ဟံၣ်ဖိဃီဖိန့ၣ်ယွၤတိာ်ပာ်စၢၤဝဲန့ၣ်လီၤ. တၢ်တ့တၢ်ဖျီပိာ်မုၣ်ဒီးပိာ်ခွါမ့ၢ်တၢ်အခီၣ်ထံးလၢအတၢ်တိာ်ကျဲၤအထူအယိာ်န့ၣ်လီၤ.
  ဖိသ့ၣ်တဖၣ်ကြၢးအိၣ်ဖျဲၣ်လၢတၢ်တ့တၢ်ဖျီအပူၤ, ဒီးကဘၣ်လုၢ်ဒိၣ်ထီၣ်လၢမိၢ်ဒီး ပၢ်လၢအပာ်ကဲအတၢ်တ့တၢ်ဖျီတၢ်အၢၣ်လီၤတဖၣ်ဒီးတၢ်သးတီလၢၦဲၤန့ၣ်လီၤ.
  တၢ်သူၣ်ခုသးခုလၢဟံၣ်ဖိဃီဖိအပူၤကဟဲညီနုၢ်ဖဲအသူၣ်ထီၣ်အသးလၢကစၢ်ယ့ၣ်ၡူးခရံာ်အတၢ်သိၣ်လိသီလိတဖၣ်န့ၣ်လီၤ. တၢ်တ့တၢ်ဖျီဒီးဟံၣ်ဖိဃီဖိလၢအဂ့ၤဘၣ်တၢ်ဒုးအိၣ်ထီၣ်ဒီးအံးထွဲကွၢ်ထွဲအီၤခီဖျိလၢတၢ်ဂ့ၢ်မိၢ်ၦၢ်တဖၣ်အံၤ,
  တၢ်စူၢ်တၢ်နာ်, တၢ်ထုကဖၣ်, တၢ်ပီၢ်ယၢ်လီၤက့ၤသး, တၢ်ပာ်ကဲ, တၢ်အဲၣ်တၢ်ကွံ, တၢ်သးကညီၤ, တၢ်ဖံးတၢ်မၤ, တၢ်လိာ်ကွဲတၢ်လၢအဂ့ၤလၢတၢ်အိၣ်ဆူၣ်အိၣ်ချ့အဂီၢ်န့ၣ်လီၤ.
  ခီဖျိလၢတၢ်တ့လီၤတၢ်အစီအဆှံန့ၣ်, ပၢ်ကပၢတၢ်လၢအဟံၣ်ဖိဃီဖိအဖီခိၣ်ဃုာ်ဒီးတၢ်အဲၣ်ဒီးတၢ်တီတၢ်လိၤဒီးအမူဒါအိၣ်လၢအကဟ့ၣ်တၢ်တဖၣ်ဘၣ်ထွဲဒီးတၢ်အိၣ်မူအတၢ်လိၣ်ဘၣ်ဒီးတၢ်ကဟုကယာ်လၢအဟံၣ်ဖိဃီဖိအဂီၢ်.
  မိၢ်အမူဒါခီၣ်ထံးတမံၤမ့ၢ်တၢ်အဲၣ်ကဟုကယာ်အဖိတဖၣ်လီၤ. လၢမူဒါစီဆှံတဖၣ်အံၤအပူၤန့ၣ်မိၢ်ဒီးပၢ်ကြၢးမၤစၢၤလိာ်သးဒ်ၦၤမၤသကိးတၢ်လၢအဒ်သိးသိးလိာ်သးန့ၣ်လီၤ.
  နီၢ်ခိက့ၢ်ဂီၤမ့ၢ်အိၣ်တဆူၣ်, တၢ်သံတၢ်ၦၢ်, မ့တမ့ၢ်တၢ်အိၣ်သးအဂုၤအဂၤတဖၣ်ကဆီတလဲအမူအဒါဒၣ်ဝဲတဖၣ်သ့န့ၣ်လီၤ.
  ဟံၣ်ဖိဃီဖိဒူၣ်ဖိထၢဖိကဘၣ်မၤစၢၤတၢ်ဖဲတၢ်လိၣ်ဘၣ်အီၤအခါန့ၣ်လီၤ.
- ပတဲပလီၢ်ၦၤလၢအလုၢ်သ့ၣ်ခါပတာ်တၢ်အိၣ်စီအိၣ်ဆှံအတၢ်အၢၣ်လီၤအီလီၤတဖၣ်, ၦၤလၢအမၤတရီတပါအဒီမါဝၤမ့တမ့ၢ်အဖိအလံၤ,
  မ့တမ့ၢ်မၤဟံၣ်ဖိဃီဖိအမူဒါတၦဲၤဘၣ်န့ၣ်, မုၢ်ကအိၣ်တနံၤဖဲအကဆၢထၢၣ်ဒီးအမူဒါကပာ်ဖျါထီၣ်က့ၤအသးလၢယွၤအမဲာ်ညါလီၤ.
  ဆူညါန့ၣ်, ပတဲပလီၢ်ဝဲလၢဟံၣ်ဖိဃီဖိတဖၣ်မ့ၢ်တအိၣ်လၢၤဘၣ်န့ၣ် ၦၤတဂၤဒီးတဂၤ, ၦၤဂီၢ်မုၢ်တဖၣ်, ဒီးထံကီၢ်တဖၣ်ကဘၣ်ကွၢ်ဆၢၣ်မဲာ်တၢ်နးတၢ်ဖှီၣ်ဒီးတၢ်ဟးဂူာ်ဟးဂီၤဒ်ဝံလၢပျၢၤဒီးဝံခဲကနံၣ်အံၤစံးပာ်ဝဲအသိးန့ၣ်လီၤ.
- ပကိးထီၣ်ၦၤထံဖိကီၢ်ဖိလၢအကြၢးအဘၣ်ဒီးပဒိၣ်ဖးဒိၣ်အခိၣ်အနၢ်လၢတၢ်လီၢ်ကိးတီၤဒဲးလၢကရၤလီၤတၢ်ဂ့ၢ်မိၢ်ၦၢ်တဖၣ်လၢအတြီသဒၢဒီးဟ့ၣ်ဂံၢ်ဟ့ၣ်ဘါဟံၣ်ဖိဃီဖိဒ်တၢ်အခီၣ်ထံးလၢၦၤကမျၢၢ်တဖၣ်န့ၣ်လီၤ.
