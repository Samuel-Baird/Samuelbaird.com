title: ယ့ၣ်ၡူးခရံာ်အတၢ်သးခုကစီၣ်အတၢ်ဟဲက့ၤစိာ်ကဒါက့ၤလၢၦဲၤ
subtitle: အနံၣ်ခံကယၤအနံၣ်ဆဲးဆၢတၢ်ဘိးဘၣ်သ့ၣ်ညါရၤလီၤလၢဟီၣ်ခိၣ်ဒီဖျၢၣ်
author: ယ့ၣ်ၡူးခရံာ်အသရိာ်ဘၣ်ဃးဒီးၦၤစီဆှံလၢမုၢ်နံၤခံကတၢၢ်အၦၤပၢၤလီၢ်ဆ့ၣ်နီၤအခိၣ်တဖုဒီးၦၤကူၣ်လိာ်တၢ်ဖိ လၢအမ့ၢ်တၢ်မၢဖိတဆံးခံဂၤ
note: သရိာ်ခိၣ်နၢ်တဂၤ(ရၢစး အဲၣ်မၢ နဲလ်စဲၤ)ဖးတၢ်ဘိးဘၣ်သ့ၣ်ညါအံၤလၢဟီၣ်ခိၣ်တၢ်အိၣ်ဖှိၣ်တနံၣ်တဘျီ ဟီၣ်ခိၣ်ဒီဖျၢၣ်အတၢ်အိၣ်ဖှိၣ်
  ၁၉၀ ဘျီ လါအ့ဖြ့ၣ် ၅, ၂၀၂၀, ဖဲစါလ့ၣ်စံၣ်ထံး, ယူထၣ်.
paragraphs:
- လၢတၢ်သညူးသၦၢ်ပတဲဖျါထီၣ်လၢကစၢ်ယွၤအဲၣ်အဖိအလံၤလၢကီၢ်ကိးဘ့ၣ်ဒဲးလၢဟီၣ်ခိၣ်ဒီဖျၢၣ်အံၤန့ၣ်လီၤ. ပၢ်ကစၢ်ယွၤဟ့ၣ်ၦၤယ့ၣ်ၡူးခရံာ်အတၢ်အိၣ်ဖျဲၣ်စီဆှံ,
  အတၢ်အိၣ်မူလၢၦၤထိၣ်သတြီၤဒီးတၢ်အဂၤတသ့ဘၣ်, ဒီးအဖိခွါယ့ၣ်ၡူးခရံာ်လၢအအဲၣ်ဝဲတဂၤအတၢ်လုၢ်ထီၣ်အသးလၢအလိးကဒါက့ၤၦၤလၢအကတၢၢ်တအိၣ်ဘၣ်.
  ခီဖျိလၢပၢ်အစိကမီၤယ့ၣ်ၡူးဂဲၤဆၢၣ်ထၢၣ်သမူထီၣ်က့ၤကဒီးတဘျီဒီးန့ၢ်ဘၣ်တၢ်မၤနၢၤလၢတၢ်သံအဖီခိၣ်န့ၣ်လီၤ. အဝဲမ့ၢ်ပၦၤအုၣ်က့ၤခီၣ်က့ၤကစၢ်,
  ပတၢ်အဒိအတဲာ်, ဒီးပတၢ်ၦ့ၤက့ၤၦၤကစၢ်တဂၤလီၤ.
- အပူၤကွံာ်အနံၣ်ခံကယၤန့ၣ်, မုၢ်ဂီၤခီအဃံအလၤတဂီၤဖဲတၢ်ကိၢ်ထီၣ်သီအကတီၢ်အနံၣ် ၁၈၂၀ (န့ၣ်), ၦၤသးစၢ်ဖိ, စီၤကၠိစဲးစမံာ်,
  ဃုကွၢ်သ့ၣ်ညါလၢသရိာ်လၢအကနုာ်လီၤပၣ်ဃုာ်အသးမ့ၢ်သရိာ်ဖဲလဲၣ်တဖျၢၣ်လဲၣ် ဒီးအလဲၤလၢၦၢ်လၢ်ကျါဘူးဒီးအဟံၣ်လၢ(ကီၢ်ဖိ)ညူယိၣ်,
  အၤမ့ရခၤ(USA), ဒ်သိးအကဃ့ဘါထုကဖၣ်န့ၣ်လီၤ. အဝဲအိၣ်ဒီးတၢ်သံကွၢ်တဖၣ်ဘၣ်ဃးဒီးအသးသမူအတၢ်အုၣ်က့ၤခီၣ်က့ၤဒီးနာ်လၢကစၢ်ယွၤကနဲၣ်ကျဲအီၤန့ၣ်လီၤ.
- လၢတၢ်ဆီၣ်လီၤသးပစံးဝဲလၢပၢ်ကစၢ်ယွၤဒီးအဖိခွါယ့ၣ်ၡူးခရံာ်အိၣ်ဖျါထီၣ်အသးလၢစီၤကၠိစဲးအမဲာ်ညါလၢတၢ်စံးဆၢအတၢ်ထုကဖၣ်,
  ဒီးစးထီၣ်, “တၢ်ခဲလၢာ်ဘၣ်တၢ်မၤက့ၤအသး” (မၤတၢ် ၃:၂၁) ဒ်တၢ်စံးပာ်လၢလံာ်စီဆှံအပူၤလီၤ. လၢတၢ်ထံၣ်တဘျီအံၤ, စီၤကၠိစဲးမၤလိဝဲဖဲလၢတၢ်မၢဖိအခီၣ်ထံးတဖုသံဝံၤအလီၢ်ခံန့ၣ်,
  ခရံာ်အသရိာ်လၢအအိၣ်လၢလံာ်တၢ်အၢၣ်လီၤအီလီၤအသီတဘ့ၣ်ဟါမၢ်ကွံာ်လၢဟီၣ်ခိၣ်ဒီဖျၢၣ်လီၤ. စီၤကၠိစဲးကမ့ၢ်ၦၤအရ့ဒိၣ်လၢသရိာ်အတၢ်ဟဲက့ၤကဒါက့ၤန့ၣ်လီၤ.
- ပအၢၣ်လီၤအီလီၤလၢပၢ်ကစၢ်ဒီးဖိခွါကစၢ်အတၢ်သိၣ်လိနဲၣ်ကျဲ, ၦၤဟဲစိာ်တၢ်ကစီၣ်ဖိစီဆှံဟဲလၢကသိၣ်လိစီၤကၠိစဲးဒီးဒုးအိၣ်ထီၣ်က့ၤယ့ၣ်ၡူးခရံာ်အသရိာ်.
  ၦၤ ဘျၢတၢ်စီၤယိၤဟၣ်လၢအဂဲၤဆၢထၢၣ်သမူထီၣ်က့ၤလံန့ၣ်ဟဲစိာ်ကဒါက့ၤဝဲတၢ်န့ၢ်စိန့ၢ်ကမီၤလၢဒိးဘျၢၦၤအသးလၢထံလၢတၢ်ပျၢ်တၢ်ဒဲးဘးအဂီၢ်လီၤ.
  တၢ်မၢဖိအခီၣ်ထံးသၢဂၤ, စီၤပ့းတရူး, စီၤယၤကိာ်, ဒီးစီၤယိၤဟၣ်, ဟဲစိာ်ကဒါက့ၤတၢ်မၢဖိအမူအဒါဒီးတၢ်န့ၢ်စိန့ၢ်ကမီၤလၢတၢ်ပာ်စုအနီၣ်ဝံာ်ခံတဖၣ်န့ၣ်လီၤ.
  ၦၤအဂၤတဖၣ်ဟဲစ့ၢ်ကီး, ပၣ်ဃုာ်ဒီး, ဝံအ့ၤလံယၤ, လၢအဟဲစိာ်ကဒါက့ၤတၢ်န့ၢ်စိန့ၢ်ကမီၤလၢအဒုးစဲဘူးဟံၣ်ဖိဃီဖိလီၤထူလီၤယိာ်တပူၤဃီလၢတၢ်ရ့လိာ်မုာ်လိာ်သးတဖၣ်အစိၤစိၤအဃၣ်ဃၣ်လၢအမၤနၢၤတၢ်သံလီၤ.
- ပအုၣ်ပသးဆူညါလၢစီၤကၠိစဲးစမံာ်ဘၣ်တၢ်ဟ့ၣ်လီၤအီၤတၢ်အဟ့ၣ်ဒီးယွၤအစိအကမီၤလၢကကွဲးကျိာ်ထံလံာ်လၢပျၢၤတဘ့ၣ်, အမံၤမ့ၢ်လံာ်မိမဲၣ်-လံာ်တၢ်အုၣ်သးအဂၤတဘ့ၣ်ဘၣ်ဃးဒီးယ့ၣ်ၡူးခရံာ်.
  လံာ်ကဘျံးတဖၣ်အိၣ်လၢလံာ်စီဆှံတဘ့ၣ်အံၤအိၣ်ဃုာ်ဒီးတၢ်ကွဲးနီၣ်ကွဲးဃါဘၣ်ဃးဒီးယ့ၣ်ၡူးခရံာ်အနီၢ်ကစၢ်တၢ်ဖံးတၢ်မၤဒၣ်ဝဲ,
  လၢၦၤလၢအအိၣ်ဝဲဆိးဝဲလၢဟီၣ်ခိၣ်မုၢ်နုာ်တခီ(ထံကီၢ်အမ့ရခၤ) ဖဲလၢအဂဲၤဆၢထၢၣ်ဝံၤအလီၢ်ခံတစိၤဖိန့ၣ်လီၤ. လံာ်တဘ့ၣ်အံၤသိၣ်လိၦၤဘၣ်ဃးပတၢ်အိၣ်မူအတၢ်ပညိၣ်ဒီးတဲဖျါထီၣ်ခရံာ်အတၢ်သိၣ်လိသီလိလၢအမ့ၢ်ပတၢ်ပညိၣ်အခၢၣ်သးန့ၣ်လီၤ.
  ဒ်လံာ်မၤသကိးတၢ်ဒီးလံာ်စီဆှံအသိးန့ၣ်, လံာ်မိမဲၣ်အုၣ်အသးလၢၦၤဟီၣ်ခိၣ်ဖိခဲလၢာ်န့ၣ်မ့ၢ်ပပၢ်အိၣ်လၢမူခိၣ်အဖိမုၣ်အဖိခွါတဖၣ်လၢအအဲၣ်ဝဲ,
  ဒီးအဝဲအိၣ်ဒီးတၢ်တိာ်ကျဲၤစီဆှံလၢပတၢ်အိၣ်မူအဂီၢ်, ဒီးလၢအဖိခွါ, ယ့ၣ်ၡူးခရံာ်ကတိၤတၢ်လၢမုၢ်မဆါတနံၤအံၤဒ်အကတိၤတၢ်လၢညါအသိးန့ၣ်လီၤ.
- ပတဲဖျါထီၣ်လၢယ့ၣ်ၡူးခရံာ်အသရိာ်ဘၣ်ဃးဒီးၦၤစီဆှံလၢမုၢ်နံၤခံကတၢၢ်, ဒုးအိၣ်ထီၣ်လၢ လါအ့ဖြ့ၣ် ၆, ၁၈၃၀, မ့ၢ်ဝဲခရံာ်အသရိာ်လၢအအိၣ်လၢလံာ်တၢ်အၢၣ်လီၤအီလီၤအသီတဘ့ၣ်လၢအဘၣ်တၢ်ဒုးအိၣ်ထီၣ်က့ၤအီၤလီၤ.
  သရိာ်အံၤအိၣ်စၢဃာ်လၢအသနၢၣ်ခီၣ်ထံးလၢအမ့ၢ်ယ့ၣ်ၡူးခရံာ်အတၢ်အိၣ်မူအလၢအၦဲၤဒီးအတၢ်လိးကဒါက့ၤလၢအကတၢၢ်တအိၣ်ဘၣ်ဒီးအတၢ်ဂဲၤဆၢထၢၣ်သမူထီၣ်က့ၤနီၢ်ကီၢ်န့ၣ်လီၤ.
  ယ့ၣ်ၡူးခရံာ်ကိးန့ၢ်ကဒီးအတၢ်မၢဖိဒီးဟ့ၣ်လီၤအဝဲသ့ၣ်တၢ်ပာ်စုအတၢ်န့ၢ်စိန့ၢ်ကမီၤန့ၣ်လီၤ. အဝဲကွဲမုာ်ပဝဲခဲလၢာ်လၢပကဟဲဆူအအိၣ်ဒီးဆူအသရိာ်,
  ဒ်သိးကဒိးန့ၢ်သးစီဆှံဒီး တၢ်အုၣ်က့ၤခီၣ်က့ၤအတၢ်အၢၣ်လီၤအလုၢ်အလၢ်တဖၣ်ဒီးအကဒိးန့ၢ်ဘၣ်တၢ်သူၣ်ခုသးခုလၢအဂၢၢ်အကျၢၤန့ၣ်လီၤ.
- အနံၣ်ခံကယၤလဲၤပူၤကွံာ်လံဖဲပၢ်ကစၢ်ယွၤဒီးအဖိခွါလၢအအဲၣ်, ယ့ၣ်ၡူးခရံာ်စးထီၣ်တၢ်ဟဲက့ၤစိာ်ကဒါက့ၤတစိၤအံၤန့ၣ်လီၤ.
  ၦၤအကကွဲၢ်ကကွဲၢ်တဖၣ်လၢဟီၣ်ခိၣ်ဒီဖျၢၣ် သ့ၣ်ညါတူၢ်လိာ်တၢ်မၤအသးတဖၣ်အံၤလၢတၢ်စံးပာ်စၢၤတ့ၢ်လံအီၤလံန့ၣ်လီၤ.
- ကလဲၤဆူညါခီဖျိလၢတၢ်လီၣ်ဖျါဆူညါတဖၣ်. ဟီၣ်ခိၣ်ဖျၢၣ်တလီၤဂာ်ဒ်အလီၢ်လီၢ်ကဒီးတဘျီဘၣ်, ဒ်ကစၢ်ယွၤက “ဒုးအိၣ်ဖှိၣ်တၢ်ခဲလၢာ်လၢအခိၣ်တဂၤဃီခရံာ်အပူၤ”အသိးန့ၣ်လီၤ
  (အ့းဖ့းစူး ၁:၁၀).
- ၦဲၤဒီးတၢ်ယူးယီၣ်ပာ်ကဲဒီးတၢ်စံးဘျုး, ပဝဲဒၣ်ဒ်တၢ်မၢဖိအသိးကွဲမုာ်ၦၤခဲလၢာ်လၢသ့ၣ်ညါဒ်ပသ့ၣ်ညါအသိး, လၢမူခိၣ်အိးထီၣ်ဝဲအသးန့ၣ်လီၤ.
  ပစံးဝဲသၦၢ်ၦၢ်လၢကစၢ်ယွၤဒုးသ့ၣ်ညါအတၢ်ဘၣ်သးလၢအဖိမုၣ်ဖိခွါတဖၣ်လၢအအဲၣ်ဝဲအဂီၢ်လီၤ. ပအုၣ်ပသးလၢၦၤလၢအမၤလိတၢ်ဃုာ်ဒီးတၢ်ထုကဖၣ်ဘၣ်ဃးဒီးတၢ်ဟဲက့ၤစိာ်ကဒါက့ၤအတၢ်ကစီၣ်ဒီးမၤတၢ်လၢတၢ်နာ်န့ၣ်,
  ကဘၣ်တၢ်ဆိၣ်ဂ့ၤအီၤလၢကန့ၢ်ဘၣ်အကစၢ်တၢ်အုၣ်သးဒၣ်ဝဲလၢအတၢ်စီဆှံဒီးလၢအတၢ်ပညိၣ်လၢကတဲာ်ကတီၤဟီၣ်ခိၣ်လၢပကစၢ်ဒီးၦၤအုၣ်က့ၤခီၣ်က့ၤကစၢ်တဂၤ,
  ယ့ၣ်ၡူးခရံာ်, အတၢ်ဟဲက့ၤခံဘျီတဘျီဒ်တၢ်အၢၣ်လီၤအီလီၤအီၤလံအသိးန့ၣ်လီၤ.
