title: Чланци вере
subtitle: Цркве Исуса Христа светаца последњих дана
author: ''
verses:
- n: 1
  text: 1. Верујемо у Бога, вечног Оца, у Његовог Сина, Исуса Христа, и у Светог Духа.
- n: 2
  text: 2. Верујемо да ће људи бити кажњени за сопствене грехе, а не за Адамов преступ.
- n: 3
  text: 3. Верујемо да се помирењем Христовим сав људски род може спасити, послушношћу законима и обредима
    јеванђеља.
- n: 4
  text: '4. Верујемо да су прва начела и обреди јеванђеља: прво, вера у Господа Исуса Христа; друго, покајање;
    треће, крштење урањањем за опрост греха; четврто, полагање руку за дар Светог Духа.'
- n: 5
  text: 5. Верујемо да човек мора бити позван од Бога, пророштвом и полагањем руку оних који имају власт,
    да проповеда јеванђеље и служи у обредима његовим.
- n: 6
  text: 6. Верујемо у исту организацију која је постојала у првобитној цркви, наиме, у апостоле, пророке,
    пастире, учитеље, јеванђелисте, и тако даље.
- n: 7
  text: 7. Верујемо у дар језика, пророштва, откривења, виђења, исцељења, тумачења језика, и тако даље.
- n: 8
  text: 8. Верујемо да је Библија реч Божја у оној мери у којој је тачно преведена; верујемо и да је Мормонова
    књига реч Божја.
- n: 9
  text: 9. Верујемо у све оно што је Бог открио, и у све оно што сада открива, и верујемо да ће открити
    још много тога великог и важног што се односи на царство Божје.
- n: 10
  text: 10. Верујемо у дословно сакупљање Израела и у обнову десет племена; да ће Сион (Нови Јерусалим)
    бити изграђен на америчком континенту; да ће Христ лично владати на земљи; и да ће земља бити обновљена
    и примити своју рајску славу.
- n: 11
  text: 11. Полажемо право на повластицу да се клањамо Свемогућем Богу онако како нам сопствена савест
    налаже, и дозвољавамо свима да имају исту ту повластицу; нека се клањају како, где, или чему желе.
- n: 12
  text: 12. Верујемо у подложност царевима, председницима, владарима, и судијама, у поштовање, признавање
    и подржавање закона.
- n: 13
  text: 13. Верујемо да треба да будемо поштени, одани, чедни, добронамерни, честити и да чинимо добро
    свима; заиста, можемо рећи да следимо Павлов савет – У све верујемо, свему се надамо, истрајали смо
    у много чему, и надамо се да ћемо истрајати у свему. Има ли чега честитог, лепог, или на добром гласу,
    или хвале вредног, то тражимо.
signature: Џозеф Смит.
