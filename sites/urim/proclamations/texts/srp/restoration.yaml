title: Обнова пунине Јеванђеља Исуса Христа
subtitle: Проглас свету поводом двестоте годишњице
author: Прво председништво и Савет дванаесторице апостола Цркве Исуса Христа светаца последњих дана
note: Овај проглас прочитао је председник Расел М. Нелсон као део своје поруке на 190. годишњој генералној
  конференцији 5. априла 2020. у Солт Лејк Ситију, у Јути.
paragraphs:
- Свечано изјављујемо да Бог воли своју децу у свим народима света. Бог Отац нам је дао божанско рођење,
  неупоредиви живот и бесконачну жртву Помирења свог љубљеног Сина Исуса Христа. Очевом моћу Исус је поново
  устао и извојевао победу над смрћу. Он је наш Спаситељ, наш Пример и наш Откупитељ.
- Пре две стотине година, једног дивног пролећног јутра 1820, млади Џозеф Смит, у жељи да сазна којој
  цркви да се прикључи, отишао је да се помоли у шуми у близини свог дома на северу државе Њујорк, у САД-у.
  Имао је питања у вези са спасењем своје душе и веровао је да ће га Бог усмерити.
- У понизности изјављујемо да су се, у одговору на његову молитву, Бог Отац и Његов Син Исус Христ, указали
  Џозефу и свечано покренули „обнову свега” (Дела 3:21) како што је проречено у Библији. У том виђењу,
  сазнао је да је након смрти првих апостола Христова новозаветна црква изгубљена са земље. Џозеф ће бити
  оруђе у њеном враћању.
- Потврђујемо да су под усмерењем Оца и Сина небески гласници дошли да поуче Џозефа и поново успоставе
  Цркву Исуса Христа. Васкрсли Јован Крститељ обновио је власт крштења урањањем за опрост греха. Тројица
  од првобитне дванаесторице апостола – Петар, Јаков и Јован – обновили су апостолство и кључеве свештеничке
  власти. Дошли су и други, укључујући Илију пророка који је обновио власт за спајање породица заувек,
  у вечним односима који превазилазе смрт.
- 'Уз то, сведочимо да је Џозеф Смит примио дар и моћ од Бога да преведе древни запис: Мормонову књигу
  – још једно сведочанство о Исусу Христу. Странице овог светог текста садрже извештај о личном службеништву
  Исуса Христа међу људима на западној полулопти убрзо након Његовог васкрсења. У њему се поучава о сврси
  живота и објашњавају Христова учења која су суштина те сврхе. Као Свето писмо које стоји уз Библију,
  Мормонова књига сведочи да су сва људска бића синови и ћерке брижног Оца на Небу, да Он има божански
  план за наше животе и да Његов Син Исус Христ говори и данас као у древним временима.'
- Изјављујемо да је Црква Исуса Христа светаца последњих дана, организована 6. априла 1830. године, обновљена
  Христова новозаветна црква. Ова Црква је усидрена у савршеном животу свог камена од угла, Исуса Христа,
  и у Његовом бесконачном помирењу и дословном васкрсењу. Исус Христ је поново позвао апостоле и доделио
  им власт свештенства. Он позива све нас да дођемо Њему и у Његову Цркву, да примимо Светог Духа, обреде
  спасења и да стекнемо трајну радост.
- Прошло је двеста година откако су Бог Отац и Његов љубљени Син Исус Христ покренули ову Обнову. Милиони
  широм света прихватили су знање о овим прореченим догађајима.
- Са задовољством изјављујемо да обећана Обнова напредује кроз непрекидно откривење. Земља више никада
  неће бити иста јер ће Бог учинити „да се све састави у Христу” (Ефесцима 1:10).
- Са поштовањем и захвалношћу, као Његови апостоли, позивамо све да сазнају, као што ми знамо, да су небеса
  отворена. Потврђујемо да Бог објављује своју вољу за своје вољене синове и ћерке. Сведочимо да ће они
  који уз молитву буду проучавали поруку о Обнови и деловали са вером, бити благословени сопственим сведочанством
  о њеној божанској природи и њеној сврси да припреми свет за обећани Други долазак нашег Господа и Спаситеља
  Исуса Христа.
