title: Ìmúpadàbọ̀sípò Ẹ̀kúnrẹ́rẹ́ ìhìnrere Jésù Krístì
subtitle: Ìkéde Igba Ọdún kan sí Àgbáyé
author: Àjọ Ààrẹ Ìkínní àti Ìgbìmọ̀ àwọn Àpóstélì Méjìlá ti Ìjọ Jésù Krístì ti àwọn Ènìyàn Mímọ́ Ọjọ́-ìkẹhìn
note: Pẹ̀lú ọ̀wọ̀ àti ìmoore, àwa gẹ́gẹ́bí Àpóstélì Rẹ̀ pe gbogbo ènìyàn láti mọ̀—bí a ti ṣe—pé àwọn ọ̀run
  ti ṣí. A tẹnumọ pé Ọlọ́run nfi ìfẹ́ Rẹ̀ hàn fún àwọn àyànfẹ́ ọmọkùnrin àti ọmọbìnrin Rẹ̀. A jẹri pé
  àwọn wọnnì tí yíò fi ẹ̀mí àdúrà ṣàṣàrò ọ̀rọ̀ Ímúpadàbọ̀sípò tí ó sì ṣe ìṣe nínú ìgbàgbọ́ yíò di alábùkúnfún
  láti jèrè ẹ̀rí ti arawọn nípa àtọ̀runwá rẹ̀ àti nípa èrèdí rẹ̀ láti múra ayé sílẹ̀ fún ìlérí Ìpadàbọ̀
  Ẹ̀ẹ̀kejì ti Olúwa àti Olùgbàlà wa, Jésù Krístì.
paragraphs:
- A fi tọ̀wọ̀tọ̀wọ̀ kéde pé Ọlọ́run nifẹ àwọn ọmọ Rẹ̀ ní gbogbo orílẹ̀-èdè ti ayé. Ọlọ́run Baba ti fún
  wa ní ìbí àtọ̀runwá, ìgbé ayé àìláfiwé, àti ètùtù ìrúbọ àìlópin Àyànfẹ́ Ọmọ Rẹ̀, Jésù Krístì. Nípa agbára
  Bàbá, Jésù dìde lẹ́ẹ̀kansi ó sì jèrè ìṣẹ́gun lórí ikú. Òun ni Olùgbàlà wa, Alápẹrẹ wa, àti Olùràpadà
  wa.
- Ní igba ọdún sẹ́hìn, ní òwúrọ̀ ìgbà ìrúwé dídára kan ní 1820, ọ̀dọ́mọkùnrin Joseph Smith, nwá láti mọ
  ìjọ ẹ̀yítí yíò darapọ̀mọ́, ó lọ sínú àwọn igi láti gbàdúrà nítòsí ilé rẹ̀ ní apá-òkè ìpínlẹ̀ New York,
  USA. Ó ní àwọn ìbèèrè ní ìkàsí sí ìgbàlà ẹ̀mí rẹ̀ àti pẹ̀lú ìgbẹ́kẹ̀lé pé Ọlọ́run yíò darí òun.
- Nínú ìrẹ̀lẹ̀, a kéde pé ní ìdáhùn sí àdúrà rẹ̀, Ọlọ́run Baba àti Ọmọ Rẹ̀, Jésù Krístì, farahàn sí Joseph
  ó sì fì ìpilẹ̀ṣẹ̀ “ìmúpadà nípa ohun gbogbo” múlẹ̀ (Ìṣe Àwọn Àpóstélì 3:21) bí a ṣe sọtẹ́lẹ̀ nínú Bíbélì.
  Nínú ìran yí, a kọ́ pé lẹ́hìn ikú àwọn Àpóstélì àkọ́kọ́, Ìjọ Krístì ti Májẹ̀mú Titun sọnù kúrò ní ilẹ̀
  ayé. Joseph yíò jẹ́ ohun-èlò nínú ìpadàbọ̀ rẹ̀.
- A tẹnumọ pé lábẹ́ ìdarí Baba àti Ọmọ, àwọn ìránṣẹ́ ti ọ̀run wá láti fi àṣẹ fún Joseph àti láti tún Ìjọ
  Jésù Krístì gbé kalẹ̀. Jòhánnù onírìbọmi tí ó jíìnde mú àṣẹ láti ṣe ìrìbọmi nípa rírìbọmi padàbọ̀sípò
  fún ìdáríjí àwọn ẹ̀ṣẹ̀. Mẹ́ta nínú àwọn Àpóstélì Méjìlá àkọ́kọ́—Pétérù, Jákọ́bù, àti pé Jòhánnù—mú jíjẹ́
  àpóstélì àti àwọn kọ́kọ́rọ́ àṣẹ oyè-àlùfáà padàbọ̀sípò. Àwọn míràn wá bákannáà, pẹ̀lú Èlíjàh, tí ó mú
  àṣẹ láti so áwọn ẹbí pọ̀ lápapọ̀ títíláé nínú àwọn ìbáṣepọ̀ ayérayé tí ó rékọjá ikú.
- 'A jẹ́rí síwájú si pé Joseph Smith ni a fún ní ẹ̀bùn àti agbára Ọlọ́run láti ṣe àyípadà-èdè ìwé-ìránti
  àtijọ́ kan: Ìwé ti Mọ́mọ́nì— Ẹ̀rí Míràn ti Jésù Krístì. Àwọn ojú-ewé ọ̀rọ̀-ìwé mímọ́ yí pẹ̀lú àkọsílẹ̀
  nípa iṣẹ́ ìránṣẹ́ araẹni ti Jésù Krístì ní àárin ènìyàn ní Ìwọ-òòrùn Ìlàjì-òṣùṣù Ayé làìpẹ́ lẹ́hìn Àjíìnde
  Rẹ̀. Ó kọ́ni ní èrèdí ìgbésí-ayé ó sì ṣe àlàyé ẹ̀kọ́ Krístì, èyí tí ó jẹ́ áringbùngbun sí èrèdí yí.
  Bí ojúgbà ìwé mímọ́ kan sí Bíbélì, Ìwé ti Mọ́mọ́nì jẹ́ ẹ̀rí pé gbogbo ẹ̀dá ènìyàn jẹ́ ọmọkùnrin àti
  ọmọbìnrin Baba olùfẹ́ni ní Ọ̀run, pé Òun ní ètò àtọ̀runwá kan fún ìgbé ayé wa, àti pé Ọmọ Rẹ̀, Jésù
  Krístì, nsọ ọ̀rọ̀ loni bákannáà bí àwọn ọjọ́ àtijọ́.'
- A kéde pé Ìjọ Jésù Krístì ti Àwọn Ènìyàn Mímọ́ Ọjọ́-ìkẹhìn, tí a dásílẹ̀ ní Ọjọ́ Kẹfà Oṣù Kẹ́rin, 1830,
  jẹ́ Ìjọ Krístì Májẹ̀mú Titun tí a múpadàbọ̀sípò. Ìjọ yí ni ó rọ̀mọ́ ìgbé ayé pípé ti olórí igun-òkúta
  rẹ̀, Jésù Krístì, àti Ètùtù Àìlópin Rẹ̀ àti gẹ́gẹ́bí ọ̀rọ̀ Àjíìnde ti rí gan. Jésù Krístì ti pe àwọn
  Àpóstélì lẹ́ẹ̀kansi ó sì ti fún wọn ní àṣẹ oyè-àlùfáà. O pe gbogbo wa láti wá sí ọ́dọ̀ Rẹ̀ àti Ìjọ Rẹ̀,
  láti gba Ẹ̀mí Mímọ́, àwọn ìlànà ìgbàlà, àti láti jèrè ayọ tí ó dúró títí.
- Igba ọdún ti kọjá báyìí látì ìgbà tí ìpilẹ̀ṣẹ̀ Ìmúpadàbọ̀sípò ti wá láti ọwọ́ Ọlọ́run Baba àti Àyànfẹ́
  Ọmọ Rẹ̀, Jésù Krístì. Àwọn ẹgbẹ̀rún lọ́nà ẹgbẹ̀rún káàkiri ayé ti gba ìmọ̀ àwọn àsọtẹ́lẹ̀ ìṣẹ̀lẹ̀ wọ̀nyí
  mọ́ra.
- A fi tayọ̀-tayọ̀ kéde pé ìlérí Ìmúpadàbọ̀sípò nlọ síwájú nípasẹ̀ ìtẹ̀síwájú ìfihàn. Ilẹ̀ ayé kò ní rí
  bákannáà mọ́ láé, bí ó ti jẹ́ pé Ọlọ́run yíò “kó ohun gbogbo papọ̀ ní ọ̀kan nínú Krístì” (Éfésù1:10).
