title: Ẹbí
subtitle: Ìkéde Kan sí Àgbáyé
author: ''
note: Ìkéde yìí ni Ààrẹ Gordon B. Hinckley kà bíi apákan ọ̀rọ̀ rẹ̀ ní ibi Ìpàdé Gbogbogbò ti Ẹgbẹ́ Ìrànlọ́wọ́
  tí a ṣe ní 23 Oṣù Kẹsan, 1995, ní Ìlú-nlá Salt Lake, Utah.
paragraphs:
- Àwa, Àjọ Ààrẹ Ìkínní àti Ìgbìmọ̀ Àwọn Àpóstélì Méjìlá ti Ìjọ Jésù Krístì ti Àwọn Ènìyàn Mímọ́ Ọjọ́-ìkẹhìn,
  fi tọ̀wọ̀tọ̀wọ̀ kéde pé ìgbéyàwó láàrin ọkùnrin kan àti obìnrin kan jẹ́ yíyàn láti ọwọ́ Ọlọ́run àti
  pé ẹbí jẹ́ àringbùngbun sí ètò Ẹlẹ́da fún àyànmọ́ ayérayé ti àwọn ọmọ Rẹ̀.
- Gbogbo àwọn ènìyàn—ọkùnrin àti obìnrin—ni a dá ní àwòrán Ọlọ́run. Ẹnìkọ̀ọ̀kan jẹ́ àyànfẹ́ ọmọ ẹ̀mí lọ́kùnrin
  àti lóbìnrin ti àwọn òbí ọ̀run, àti pé, nípa bẹ́ẹ̀, ẹnìkọ̀ọ̀kan ní àdánidá àti àyànmọ́ àtọ̀runwá. Ẹ̀yà
  lákọ-lábo jẹ́ kókó ìṣesí ìdánimọ̀ àti èredi ti olukúlùkù ṣaájú ayé-íkú, ní ayé-ikú, àti ní ayérayé.
- Nínú ìjọba ṣaájú ayé-ikú, àwọn ọmọkùnrin àti ọmọbìnrin ẹ̀mí mọ̀, wọ́n sì sìn Ọlọ́run bíi Baba wọn Ayérayé,
  àti pé wọ́n gba ètò Rẹ̀ nípa èyítí àwọn ọmọ Rẹ̀ le gba àgọ́ ti-ara kí wọn ó sì jèrè ìrírí ayé láti tẹ̀síwájú
  ní jíjẹ́ pípé àti ní ìgbẹ̀hìn kí wọn ó le mọ àyànmọ́ àtọ̀runwá wọn bíi àwọn ajogún iyè ayérayé. Ètò
  ìdùnnú ti àtọ̀runwá nfún àwọn ìbáṣepọ̀ ẹbí ní agbára láti tẹ̀síwájú kọjá ibojì. Àwọn ìlànà àti àwọn
  májẹ̀mú mímọ́ tí wọ́n wà nínú àwọn tẹ́mpìlì mímọ́ mú kí ó ṣeéṣe fún olukúlùkù láti padà sí ọ̀dọ̀ Ọlọ́run
  àti fún àwọn ẹbí láti wà ní sísọdọ̀kan titi ayérayé.
- Òfin ìkínní tí Ọlọ́run fún Ádámù àti Éfà dá lórí agbára wọn láti jẹ́ òbí bíi ọkọ àti aya. A kéde pé
  òfin Ọlọ́run fún àwọn ọmọ Rẹ̀ láti bí síi kí wọn ó sì gbilẹ̀ ayé ṣì wà ní lílò. A kéde síwájú síi pé
  Ọlọ́run ti pàṣẹ pé àwọn agbára mímọ́ ti ìṣẹ̀dá ni a gbọdọ̀ mú siṣẹ́ láàrin ọkùnrin àti obìnrin nìkan,
  tí a ṣe ìgbeyàwó fún pẹ̀lú òfin bíi ọkọ àti aya.
- A kéde ọ̀nà nípa èyítí a ṣe ẹ̀dá ayé-íkú pé ó jẹ́ yíyàn látọ̀runwá. A tẹnumọ́ jíjẹ́ mímọ́ ẹ̀mí àti ti
  síṣe pàtàkì rẹ̀ nínú ètò ayérayé ti Ọlọ́run.
- Ọkọ àti aya ní ojúṣe ọ̀wọ̀ kan láti fẹ́ràn kí wọn ó sì ṣe ìtọ́jú fún ara wọn àti fún àwọn ọmọ wọn. “Àwọn
  ọmọ ni ìní Olúwa” (Orin Dafidi 127:3). Àwọn òbí ní ojúṣe mímọ́ láti tọ́ àwọn ọmọ wọn nínú ìfẹ́ àti òdodo,
  láti pèsè fún àwọn àìní wọn ní ti-ara àti ti-ẹ̀mí, àti láti kọ́ wọn láti nifẹ àti láti sin ara wọn,
  láti kíyèsí àwọn òfin Ọlọ́run, kí wọn ó sì jẹ́ ará ìlú olùpa-òfin-mọ́ ní ibikíbi tí wọ́n bá ngbé. Àwọn
  ọkọ àti àwọn aya—àwọn ìyá àti àwọn baba—ni a ó mú jíhìn níwájú Ọlọ́run fún síṣe àwọn ojúṣe wọ̀nyí.
- Ẹbí jẹ́ yíyàn láti ọwọ́ Ọlọ́run. Ìgbéyàwó láàrin ọkùnrin àti obìnrin ṣe pàtàkì sí ètò ayérayé Rẹ̀. Àwọn
  ọmọ ní ẹ̀tọ́ sí ìbí nínú àwọn àsopọ̀ ìgbéyàwó, àti láti jẹ́ títọ́jú nípasẹ̀ baba kan àti ìyá kan àwọn
  ẹnití wọ́n bú ọlá fún àwọn ìbúra ìgbéyàwó pẹ̀lú ìfọkàntán pátápátá. Ìdùnnú nínú ìgbé ayé ẹbí ṣeéṣe jùlọ
  láti ṣe àṣeyọrí rẹ̀ nígbàtí a bá fi lélẹ̀ lórí àwọn ẹ̀kọ́ ti Olúwa Jésù Krístì. Àwọn ìgbéyàwó àti àwọn
  ẹbí tí ó yege ní a gbékalẹ̀ tí a sì múdúró lóri àwọn ìpìlẹ̀sẹ̀ ti ìgbàgbọ́, àdúrà, ìrònúpìwàdà, ìdáríjì,
  ìtẹ̀ríba, ìfẹ́, àànú, iṣẹ́, àti àwọn eré ìdárayá tí ó ṣànfàní. Nípa ètò àtọ̀runwá, àwọn baba nílati
  ṣe àkóso lórí ẹbí wọn nínú ìfẹ́ àti òdodo àti pé wọ́n ní ojúṣe láti pèsè àwọn ohun àìgbọdọ̀-máni ní
  ìgbé ayé àti ààbò fún àwọn ebí wọn. Àwọn ìyá ní àkọ́bẹ̀rẹ̀ ojúṣe fún títọ́ àwọn ọmọ wọn. Nínú àwọn ojúṣe
  mímọ́ wọ̀nyí, ó jẹ́ dandan fún àwọn baba àti àwọn ìyá láti ran ara wọn lọ́wọ́ bíi àwọn alábaṣepọ̀ dídọ́gba.
  Ìpèníjà ara, ikú, tàbí àwọn ipò míràn le fa àtúndá olukúlùkù. Àwọn ẹbí ati ibátan níláti ṣe àtilẹ́hìn
  nígbàtí ìníló bá wà.
- A kìlọ̀ pé olukúlùkù àwọn ẹnití wọ́n bá tàpá sí àwọn májẹmu ti ìpa-ara-ẹni-mọ́, ẹnití ó bá lo alábaṣepọ̀
  tàbí ọmọ ní ìlòkulò, tàbí ẹnití ó kùnà láti mú àwọn ojúṣe ẹbí ṣe yío dúró ní ọjọ́ kan láti jíhìn níwájú
  Ọlọ́run. Síwájú síi, a kìlọ̀ pé ìtúká ẹbí yío mú àwọn ìdààmú tí a ti sọtẹ́lẹ̀ láti ẹnu àwọn wòlíì àtijọ́
  àti ti òde òní wá sí orí àwọn olúkúlùkù, àwọn àdúgbò, àti àwọn orílẹ̀ èdè.
- A pe àwọn ará ilú àti àwọn òṣìṣẹ́ ti ìjọba níbigbogbo lati ṣe ìgbésókè àwọn òsùnwọ̀n wọnnì tí a ti pèrò
  láti ṣe ìmúdúró àti láti mú ẹbí lókun bíi kókó ẹyọ kan ní àwùjọ.
