title: Familia
subtitle: Tangazo kwa Ulimwengu
author: Urais wa Kwanza na Baraza la Mitume Kumi na Wawili wa Kanisa La Yesu Kristo la Watakatifu wa Siku
  za Mwisho
note: Tangazo hili lilisomwa na Rais Gordon B. Hinckley kama sehemu ya ujumbe wake kwenye Mkutano Mkuu
  wa Muungano wa Usaidizi uliofanywa Septemba 23, 1995, katika Jiji la Salt Lake, Utah.
paragraphs:
- Sisi, Urais wa Kwanza na Baraza la Mitume Kumi na Wawili wa Kanisa la Yesu Kristo la Watakatifu wa Siku
  za Mwisho, kwa dhati tunatangaza kwamba ndoa kati ya mwanamume na mwanamke imeamriwa na Mungu na kwamba
  familia ni kiini cha mpango wa Muumba kwa ajili ya hatima ya milele ya watoto Wake.
- Wanadamu wote—mwanamume na mwanamke—wameumbwa kwa mfano wa Mungu. Kila mmoja ni mwana au binti mpendwa
  wa kiroho wa wazazi wa mbinguni, na, kwa hivyo, kila mmoja ana asili na hatima takatifu na takdiri.
  Jinsia ni hulka muhimu ya utambuzi wa milele wa maisha kabla ya maisha ya dunia, na maisha ya dunia
  ya mtu na utambulisho na dhamira.
- Katika maisha kabla ya haya ya duniani, wana na mabinti wa kiroho walimjua na kumwabudu Mungu kama Baba
  yao wa Milele na kuukubali mpango Wake ambapo watoto Wake wangeweza kupata mwili na kupata uzoefu wa
  duniani ili wasonge kuelekea ukamilifu na hatimaye watambue hatima yao takatifu kama warithi wa uzima
  wa milele. Mpango mtakatifu wa furaha unawezesha uhusiano wa familia kuendelezwa zaidi ya kaburi. Ibada
  takatifu na maagano yanayopatikana katika mahekalu matakatifu hufanya iwezekane kwa watu binafsi kurudi
  katika uwepo wa Mungu na familia kuunganishwa milele.
- Amri ya kwanza ambayo Mungu aliwapa Adamu na Hawa ilihusu uwezekano wao wa kuwa wazazi kama mume na
  mke. Tunatangaza kwamba amri ya Mungu kwa watoto Wake kuongezeka na kuijaza dunia bado ina nguvu leo.
  Tunatangaza zaidi kwamba Mungu ameamuru kwamba nguvu takatifu za uzazi zitumike tu kati ya mwanamume
  na mwanamke, waliooana kisheria kama mume na mke.
- Tunatangaza kwamba namna ambavyo maisha ya duniani huanzishwa inaamuliwa na Mungu. Tunathibitisha utakatifu
  wa maisha na umuhimu wake katika mpango wa milele wa Mungu.
- Mume na mke wana jukumu zito la kupendana na kutunzana na kuwatunza watoto wao. “Watoto ni urithi wa
  Bwana” (Zaburi 127:3). Wazazi wana wajibu mtakatifu wa kuwalea watoto wao katika upendo na uadilifu,
  kuwapatia mahitaji yao ya kimwili na ya kiroho, na kuwafundisha kupendana na kutumikiana, kushika amri
  za Mungu, na kuwa raia wanaotii sheria popote wanapoishi. Waume na wake—akina mama na akina baba—watawajibika
  mbele za Mungu kwa jinsi walivyotekeleza majukumu haya.
- Familia imeamriwa na Mungu. Ndoa kati ya mwanamume na mwanamke ni muhimu kwenye mpango Wake wa milele.
  Watoto wana haki ya kuzaliwa ndani ya muunganiko wa ndoa, na kulelewa na baba na mama wanaoheshimu nadhiri
  za ndoa kwa uaminifu kamili. Furaha katika maisha ya familia ina uwezekano mkubwa wa kupatikana inapojengwa
  juu ya mafundisho ya Bwana Yesu Kristo. Ndoa na familia zilizofanikiwa zimeanzishwa na kudumishwa juu
  ya kanuni za imani, sala, toba, msamaha, heshima, upendo, huruma, kazi, na shughuli za burudani zinazofaa.
  Kwa mpango wa kiungu, akina baba wanapaswa kusimamia familia zao kwa upendo na haki na wanawajibika
  kutoa mahitaji ya maisha na ulinzi kwa familia zao. Akina mama wana jukumu la msingi katika malezi ya
  watoto wao. Katika majukumu haya matakatifu, baba na mama wana wajibu wa kusaidiana kama wenzi sawa.
  Ulemavu, kifo, au hali zinginezo zinaweza kuhitaji marekebisho ya majukumu ya mtu binafsi. Ndugu wengine
  wa familia wanapaswa kutoa msaada pale inapohitajika.
- Tunaonya kwamba watu binafsi wanaokiuka maagano ya usafi wa maadili, wanaowanyanyasa wenzi wa ndoa au
  watoto, au wanaoshindwa kutimiza majukumu ya familia siku moja watawajibika mbele za Mungu. Zaidi, tunaonya
  kwamba kusambaratika kwa familia kutaleta juu ya watu binafsi, jumuia na mataifa maafa yaliyotabiriwa
  na manabii wa zamani na wa sasa.
- Tunatoa wito kwa raia wanaowajibika na maafisa wa serikali kila mahali kuhimiza hatua hizo zilizosanifiwa
  kudumisha na kuimarisha familia kama kitengo muhimu cha jamii.
