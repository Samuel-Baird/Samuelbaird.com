title: Kristo Aliye Hai
subtitle: Ushuhuda wa Mitume
author: Kanisa la Yesu Kristo la Watakatifu wa Siku za Mwisho
paragraphs:
- Tunapoadhimisha kuzaliwa kwa Yesu Kristo milenia mbili zilizopita, tunatoa ushuhuda wetu wa uhalisia
  wa maisha Yake yasiyo na kifani na uwezo usio na kikomo wa dhabihu Yake kuu ya upatanisho. Hakuna mwingine
  yeyote ambaye amekuwa na ushawishi mkubwa hivyo juu ya wote ambao wameishi na ambao bado wataishi duniani.
- Yeye alikuwa Yehova Mkuu wa Agano la Kale, Masihi wa Agano Jipya. Chini ya maelekezo ya Baba Yake, Yeye
  alikuwa muumbaji wa dunia. “Vyote vilifanyika kwa huyo; wala pasipo yeye hakikufanyika chochote kilichofanyika”
  (Yohana 1:3). Ingawa hakuwa na dhambi, alibatizwa ili kutimiza haki yote. “Alizunguka huko na huko akitenda
  kazi njema” (Matendo ya Mitume 10:38), lakini bado alidharauliwa kwa hilo. Injili Yake ilikuwa ujumbe
  wa amani na habari njema. Aliwasihi wote kufuata mfano Wake. Alitembea katika barabara za Palestina,
  akiwaponya wagonjwa, akiwafanya vipofu wapate kuona, na kuwafufua wafu. Alifundisha kweli za milele,
  uhalisia wa uwepo wetu mbinguni kabla ya kuzaliwa katika mwili, dhumuni la maisha yetu duniani, na uwezekano
  wa ukuaji kwa wana na mabinti za Mungu katika maisha yajayo.
- Alianzisha sakramenti kama ukumbusho wa dhabihu Yake kuu ya upatanisho. Alikamatwa na kuhukumiwa kwa
  shutuma za uongo, akatiwa hatiani ili kuridhisha matakwa ya kundi la watu wenye ghasia, na kuhukumiwa
  kifo juu ya msalaba wa Kalvari. Aliyatoa maisha yake ili kulipia dhambi za wanadamu wote. Yake ilikuwa
  tunu kubwa kwa niaba ya wote ambao wangeishi duniani.
- Kwa dhati tunashuhudia kwamba maisha yake, ambayo ni kiini cha historia yote ya mwanadamu, hayakuanzia
  Bethlehemu wala kuhitimishwa pale Kalvari. Alikuwa Mzaliwa wa kwanza wa Baba, Mwana wa Pekee katika
  mwili, Mkombozi wa ulimwengu.
- Alifufuka kutoka kaburini na kuwa “limbuko la waliolala” (1 Wakorintho 15:20). Akiwa Bwana aliyefufuka,
  aliwatembelea wale aliowapenda kipindi cha uhai Wake. Pia alihudumu miongoni mwa “kondoo Wake wengine”
  (Yohana 10:16) katika Amerika ya kale. Katika nyakati hizi, Yeye na Baba Yake walimtokea mvulana Joseph
  Smith, wakianzisha “kipindi cha utimilifu wa nyakati” (Waefeso 1:10) kilichoahidiwa tangu zamani.
- 'Kuhusu Kristo Aliye Hai, Nabii Joseph aliandika: “Macho yake yalikuwa kama mwale wa moto; nywele za
  kichwa chake zilikuwa nyeupe kama theluji safi; uso wake ulingʼara kupita mngʼaro wa jua; na sauti yake
  ilikuwa kama sauti ya maji mengi yakimbiayo, hata sauti ya Yehova, akisema:'
- “Mimi ni kwanza na mwisho; Mimi ni yeye aliye hai, Mimi ni yule aliyeuawa; Mimi ni mtetezi wenu kwa
  Baba” (M&M 110:3–4).
- 'Juu Yake Nabii pia alitamka: “Na sasa, baada ya ushuhuda mwingi uliokwisha kutolewa juu yake, huu ni
  ushuhuda, wa mwisho wa zote, ambao tunautoa juu yake: Kwamba yu hai!'
- “Kwani tulimwona, hata mkono wa kuume wa Mungu; na tukasikia sauti ikitushuhudia kuwa yeye ndiye Mzaliwa
  Pekee wa Baba—
- “Kwamba kwa yeye, na kwa njia yake, na kutoka kwake, dunia zipo na ziliumbwa, na waliomo ni wana na
  mabinti wa Mungu” (M&M 76:22–24).
- Tunatamka kwa dhati, kwamba ukuhani Wake na Kanisa lake vimerejeshwa duniani—“Kanisa limejengwa juu
  ya msingi wa … mitume na manabii, Yesu Kristo mwenyewe akiwa jiwe kuu la pembeni” (Waefeso 2:20).
- Tunashuhudia kwamba siku moja atarudi duniani. “Na utukufu wa Bwana utafunuliwa, na wote wenye mwili
  watauona pamoja” (Isaya 40:5). Atatawala kama Mfalme wa Wafalme na kumiliki kama Bwana wa Mabwana, na
  kila goti litapigwa na kila ulimi utakiri katika kumwabudu. Kila mmoja wetu atasimama kuhukumiwa Naye
  kulingana na matendo yetu na matamanio ya mioyo yetu.
- Tunatoa ushuhuda, kama Mitume Wake waliotawazwa kwa mamlaka sahihi—kwamba Yesu ndiye Kristo Aliye Hai,
  Mwana asiyekufa wa Mungu. Yeye ndiye Mfalme mkuu Imanueli, ambaye leo anasimama mkono wa kuume wa Baba
  Yake. Yeye ndiye nuru, uzima, na tumaini la ulimwengu. Njia yake ndiyo njia ile inayoongoza kwenye furaha
  katika maisha haya na uzima wa milele katika ulimwengu ujao. Mungu ashukuriwe kwa zawadi isiyo na kifani
  ya Mwanaye mtakatifu.
