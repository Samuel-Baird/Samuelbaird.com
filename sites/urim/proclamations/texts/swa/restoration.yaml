slug: restoration
language: swa
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=swa
retrieved: '2026-11-02'
title: Urejesho wa Utimilifu wa Injili ya Yesu Kristo
subtitle: Tangazo kwa Ulimwengu la Maadhimisho ya Miaka Mia Mbili
author: Urais wa Kwanza na Baraza la Mitume Kumi na Wawili wa Kanisa la Yesu Kristo la Watakatifu wa Siku
  za Mwisho
note: Tangazo hili lilisomwa na Rais Russell M. Nelson kama sehemu ya ujumbe wake kwenye Mkutano Mkuu
  wa 190, tarehe Aprili 5, 2020, katika Jiji la Salt Lake, Utah.
paragraphs:
- Kwa dhati tunatangaza kwamba Mungu anawapenda watoto Wake katika kila taifa la ulimwengu. Mungu Baba
  ametupatia uzazi mtakatifu, maisha yasiyolinganishika, na dhabihu ya upatanisho isiyo na mwisho iliyofanywa
  na Mwanaye Mpendwa, Yesu Kristo. Kwa uweza wa Baba, Yesu alifufuka tena na kupata ushindi dhidi ya kifo.
  Yeye ni Mwokozi wetu, Mfano wetu, na Mkombozi wetu.
- Miaka mia mbili iliyopita, katika asubuhi nzuri ya majira ya kuchipua mnamo mwaka 1820, kijana Joseph
  Smith, akitafuta kujua kanisa lipi ajiunge nalo, alikwenda msituni kuomba karibu na nyumba yake huko
  Kaskazini ya New York, Marekani. Alikuwa na maswali kuhusu wokovu wa nafsi yake na aliamini kwamba Mungu
  angemwongoza.
- Kwa unyenyekevu, tunatamka kwamba katika kujibu sala yake, Mungu Baba na Mwanaye, Yesu Kristo, walimtokea
  Joseph na kuzindua “kufanywa upya kwa vitu vyote” (Matendo ya Mitume 3:21) kama ilivyotabiriwa katika
  Biblia. Katika ono hili, alijifunza kwamba kufuatia kifo cha Mitume wa mwanzo, Kanisa la Kristo la Agano
  Jipya lilipotea duniani. Joseph angekuwa chombo katika kurejeshwa kwake.
- Tunathibitisha kwamba chini ya maelekezo ya Baba na Mwana, wajumbe wa mbinguni walikuja kumwelekeza
  Joseph na kuanzisha tena Kanisa la Yesu Kristo. Yohana Mbatizaji aliyefufuka alirejesha mamlaka ya kubatiza
  kwa kuzamishwa kwa ajili ya ondoleo la dhambi. Watatu kati ya Mitume kumi na wawili wa mwanzo—Petro,
  Yakobo, na Yohana—walirejesha utume na funguo za mamlaka ya ukuhani. Wengine pia walikuja, ikiwa ni
  pamoja na Eliya, aliyerejesha mamlaka ya kuunganisha familia pamoja milele katika uhusiano usio na mwisho
  ambao unavuka mipaka ya kifo.
- 'Tunaendelea kutoa ushahidi kwamba Joseph Smith alipewa karama na nguvu ya Mungu ili kutafsiri kumbukumbu
  ya kale: Kitabu cha Mormoni—Ushuhuda Mwingine wa Yesu Kristo. Kurasa za maandishi haya matakatifu zinajumuisha
  simulizi juu ya huduma binafsi ya Yesu Kristo miongoni mwa watu wa Amerika ya Kaskazini na Kusini punde
  baada ya Ufufuko Wake. Kinafundisha juu ya dhumuni la maisha na kuelezea mafundisho ya Kristo, ambayo
  ni kiini cha dhumuni hilo. Kama maandiko mwenza ya Biblia, Kitabu cha Mormoni kinashuhudia kwamba wanadamu
  wote ni wana na mabinti za Baba wa Mbinguni mwenye upendo, kwamba Yeye ana mpango mtakatifu kwa ajili
  ya maisha yetu, na kwamba Mwanaye, Yesu Kristo, anazungumza leo kama vile ilivyokuwa katika siku za
  kale.'
- Tunatamka kwamba Kanisa la Yesu Kristo la Watakatifu wa Siku za Mwisho, lililoanzishwa mnamo tarehe
  Aprili 6, 1830, ni Kanisa la Kristo la Agano Jipya lililorejeshwa. Kanisa hili limeweka nanga katika
  maisha makamilifu ya jiwe lake kuu la pembeni, Yesu Kristo, na katika Upatanisho Wake usio na mwisho
  na Ufufuko wake halisi. Yesu Kristo kwa mara nyingine tena amewaita Mitume na amewapa mamlaka ya ukuhani.
  Anatualika sote kuja Kwake na kwenye Kanisa Lake, ili kupokea Roho Mtakatifu, ibada za wokovu, na kupata
  furaha ya kudumu.
- Miaka mia mbili sasa imepita tangu Urejesho huu ulipoanzishwa na Mungu Baba na Mwana Wake Mpendwa, Yesu
  Kristo. Mamilioni kote ulimwenguni wamekumbatia ufahamu wa matukio haya yaliyotabiriwa.
- Kwa furaha tunatamka kwamba Urejesho ulioahidiwa unasonga mbele kupitia ufunuo unaoendelea. Dunia kamwe
  haitabaki kama ilivyo, kwani Mungu “atavijumlisha vitu vyote katika Kristo” (Waefeso 1:10).
- Kwa unyenyekevu na shukrani, sisi kama Mitume Wake tunawaalika wote mjue—kama tunavyojua—kwamba mbingu
  ziko wazi. Tunathibitisha kwamba Mungu anafanya yajulikane mapenzi Yake kwa wana na mabinti Zake wapendwa.
  Tunashuhudia kwamba wale wote ambao kwa sala wanajifunza ujumbe wa Urejesho na kutenda kwa imani watabarikiwa
  kupata ushahidi wao wenyewe wa utakatifu wake na wa lengo lake la kuuandaa ulimwengu kwa Ujio wa Pili
  ulioahidiwa wa Bwana wetu na Mwokozi, Yesu Kristo.
