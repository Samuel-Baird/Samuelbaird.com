title: Umndeni
subtitle: Simemetelo lesibhekiswe Emhlabeni
author: ''
note: Lesi simemetelo safundvwa nguMengameli Gordon B. Hinckley, njengencenye yenkhulumo yakhe ngeMhlangano
  lomkhulu weNhlangano yekukhulula yebesifazane lowawubanjwe mhlaka 23 Inyoni, 1995, eSalt Lake City,
  Utah.
paragraphs:
- Tsine, Bungameli bekuCala neMkhandlu webaPhostoli labaLishumi naKubili beLibandla laJesu Khristu Lalabangcwele
  Betinsuku Tekugcina, simemetela ngesizotsa kutsi umshado emkhatsini wendvodza nemfati umiswe nguNkulunkulu
  nekutsi umndeni ubaluleke kakhulu ngalokuphatselene nelisu leMdali laloko bantfwana Bakhe labadalelwe
  kona ingunaphakadze.
- Bonkhe bantfu—lomdvuna nalomsikati—badalwe ngemfanekiso waNkulunkulu. Ngamunye uyindvodzana noma indvodzakati
  letsandzekako yemoya letalwa batali basezulwini, futsi, lawo madvodzana nemadvodzakati anebunjalo baNkulunkulu
  futsi bangaba njeNgaye. Bulili busimilo lesifunekako kumuntfu ngamunye emphilweni asete umtimba lobhubhako,
  sekanemtimba lobhubhako, kanye nelucobo lwakhe lwaphakadze kanjalo nenhloso yakhe.
- Emphilweni kusete umtimba lobhubhako, emadvodzana nemadvodzakati emoya bekamati futsi amkhonta Nkulunkulu
  njengaBabe waPhakadze futsi emukela lisu lakhe ngalo bantfwana Bakhe labebangatfola umtimba wenyama
  futsi batfole kutibonela nekutivela ngekwabo emhlabeni kute bachubekele phambili bate bapheleliswe nya
  futsi ekugcineni bakwati loko labadalelwe kona ngekukaNkulunkulu njenge tindlalifa tekuphila lokuphakadze.
  Lisu laNkulunkulu lenjabulo livumela budlelwane bemndeni buchubeke emuva kwekufa. Imisimeto netivumelwano
  letingcwele letitfolakala emathempelini langcwele tenta kutsi umuntfu ngamunye akwati kubuyela ebukhoneni
  baNkulunkulu futsi nekutsi imindeni ihlanganiswe ingunaphakadze.
- Umtsetfo wekucala Nkulunkulu lawunika Adamu naEva uhlangene nalokungenteka kute babe batali njengendvodza
  nemfati. Siyamemetela kutsi umtsetfo waNkulunkulu webantfwana Bakhe kutsi bandze bagcwalise umhlaba
  usemile nanyalo. Siyamemetela futsi kutsi Nkulunkulu uyale kutsi emandla langcwele ekwenta bantfwana
  kufanele asetjentiswe kuphela emkhatsini walosilisa newesifazane, labashade ngalokusemtsetfweni njengendvodza
  nemfati.
- Siyamemetela kutsi indlela imphilo yemtimba lobhubhako ledalwe ngayo imiswe nguNkulunkulu. Siyacinisekisa
  kutsi imphilo ingcwele futsi nekutsi lobo bungcwele bubalulekile ngalokuphatselene nelisu laphakadze
  laNkulunkulu.
- Indvodza nemfati banemtfwalo longcwele wekutsandzana futsi banakekelane kanjalo nebantfwababo. “Bantfwana
  balifa leliphuma eNkhosini” (Tihlabelelo 127:3). Batali banemsebenti lekufanele bawente longcwele wekukhulisa
  bantfwana babo ngelutsandvo nangekulunga, wekubanika tidzingo tabo tenyama netemoya, futsi netekubafundzisa
  kutsandzana nekusitana, bagcine imitsetfo yaNkulunkulu, futsi nekutsi bahloniphe timiso telive labo
  noma ngukuphi lapho bahlala khona. Emadvodza nebafati—bomake nabobabe—kuyodzingeka batiphendvulele embikwa
  Nkulunkulu mayelana nekugcina leto tibopho.
- Umndeni umiswe nguNkulunkulu. Umshado emkhatsini wesilisa newesifazane ubaluleke kakhulu ngalokuphatselene
  nelisu Lakhe laphakadze. Bantfwana banelilungelo lekutalwa emshadweni, nekutsi bakhuliswe ngubabe namake
  lohlonipha tifungo temshado ngekwetsembeka lokuphelele. Injabulo emphilweni yemndeni kunekwenteka izuzeke
  uma isekeleke etimfundzisweni teNkhosi Jesu Khristu. Imishado nemindeni lenemphumelelo imiswe futsi
  igcinwe ngetimfundziso tekukholwa, umthandazo, kuphendvuka, kucolelana, kuhloniphana, lutsandvo, sihawu,
  kusebenta, kanjalo netindlela letinhle tekutijabulisa. Ngeluhlelo lwaNkulunkulu, bobabe kufanele bengamele
  imindeni yabo ngelutsandvo nangekulunga futsi banemtfwalo wekondla imindeni yabo ngetidzingo temphilo
  nekuyivikela. Bomake banemtfwalo lomkhulu wekukhulisa bantfwana. Kulemitfwalo lengcwele, bobabe nabomake
  banesibopho sekutsi basitane njengalabatsandzanako labalinganako. Kukhubateka, kufa, noma letinye timo
  tingadzinga kube nelushintjo kulomunye mayelana nalemitfwalo. Letinye tihlobo temndeni nato kufanele
  telekelele uma kunesidzingo.
- Siyecwayisa kutsi labo labaphula letivumelwano tebumsulwa, labaphatsa kabi labo labatsandzana nabo noma
  bantfwana, noma labahlulekako kufeza imitfwalo lecondzene nemndeni ngalelinye lilanga kuyofanele batiphendvulele
  embikwa Nkulunkulu. Kwengeta, siyecwayisa kutsi kuhlakateka kwemndeni kutoletsa lusizi lolwabikwa bapholofethi
  basemandvulo nebanyalo kumuntfu ngamunye nangamunye, emiphakatsini, nasetiveni.
- Sincusa tonkhe takhamuti letifanele nebaphatsi tikhundla kuhulumende ndzawo tonkhe kutsi bakhutsate
  leyo metamo lekuhloswe ngayo kutsi kugcinwe futsi kuciniswe umndeni njengencenye lebalulekile yesive.
