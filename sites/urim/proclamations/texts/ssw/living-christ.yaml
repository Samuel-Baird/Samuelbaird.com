title: Khristu Lophilako
subtitle: Bufakazi bebaPhostoli
author: Libandla laJesu Khristu Lalabangcwele Betinsuku Tekugcina
paragraphs:
- Njengoba sikhumbula kutalwa kwaJesu Khristu tinkhulungwane letimbili teminyaka leyengcile, setfula bufakazi
  betfu beliciniso ngemphilo Yakhe lengalinganiswa nangemandla Akhe langapheli ngemhlatjelo Wakhe lomkhulu
  lohlawulako. Kute lomunye loke waba nemtselela lojule kangaka kubo bonkhe labake baphila nalabasetawuphila
  emhlabeni.
- Bekangu Jehova lomkhulu weliThestamente leLidzala, Mesiya waLelisha. Ngekusebentisa kuholwa nguBabe
  Wakhe, bekangu Mdali wemhlaba. “Konkhe kwadalwa ngaye; ngaphandle kwakhe kute lokwadalwa kuko konkhe
  lokudaliwe” (Johane 1:3). Noma bekangenasono, wabhajatiswa kufeza konkhe kulunga. Waya “kuyo yonkhe
  indzawo enta lokuhle” (Imisebenti yebaPhostoli 10:38), kodvwa bekatondzelwa loko. Livangeli Lakhe belingumlayeto
  wekuthula nentsandvo lenhle. Wancenga bonkhe kutsi balandzele sibonelo Sakhe. Wahamba emigwacweni yemaFilistiya,
  aphilisa labagulako, enta timphumphutse titfole kubona kwato, kanye nekuvusa labafile. Wafundzisa emaciniso
  angunaphakadze, emaciniso ngemphilo sisete umtimba lobhubhako, injongo yemphilo yetfu emhlabeni, nalangakhona
  kukwenta emadvodzana nemadvodzakati aNkulunkulu emphilweni letako.
- Wamisa sidlo seNkhosi njengesikhumbuto semhlatjelo Wakhe lomkhulu lohlawulako. Waboshwa waphindze wabekwa
  emacala langemanga, walahlwa ngelicala kwenelisa sicuku sebantfu, futsi wagwetjelwa kufa esiphambanweni
  saseGolkotha. Wanikela ngemphilo Yakhe kuhlawulela tono tabo bonkhe bantfu. Kwakhe kwabasipho lesikhulu
  lesimelele bonkhe labatawuphila emhlabeni.
- Ngesizotsa siyafakaza kutsi imphilo Yakhe, lebaluleke kakhulu emlandvweni webantfu bonkhe, ayitange
  icale eBhetlehema futsi ayephetselanga eGolkotha. Bekalitubulo leYise, iNdvodzana letelwe yodvwa ngekwenyama,
  umHlengi wemhlaba.
- Wavuka ethuneni “waba titselo tekucala kulabo labatawuvuka kulabafile” (catsanisa 1 kubase-Khorinte
  15:20). NjengeNkhosi leyavuka,wavakashela labo bekabatsandza emphilweni. Waphindze washumayela “letinye
  timvu” Takhe (Johane 10:16) tasemandvulo eMelika. Emhlabeni wanyalo, Yena naBabe Wakhe bavela emfaneni
  Joseph Smith, bacala setsembiso lebesetsenjiswe kudzala “seluhlelo lwekwengamela lekuphelela kwetikhatsi”
  (catsanisa Kubase-Efesu 1:10).
- 'NgaKristu lophilako, umPholofethi Joseph wabhala: Emehlo Akhe bekafanana nelilangabi lemlilo; tinwele
  tenhloko Yakhe betimhlophe njengelichwa lelicwebile; buso Bakhe bebukhatimula ngetulu kwekukhanya kwelilanga;
  futsi livi Lakhe lalinjenge nhlokomo yemanti lamaningi, ngisho livi laJehova lisho kutsi:'
- Usicalo nesiphetfo; Unguye lophilako, Unguye lowabulawa; Ungummeli wetfu kuBabe (buka T neT 110:3–4).
- 'UmPholofethi futsi wamemetela Ngaye kutsi: emva kwebufakazi lobuningi losebunikiwe ngaye, nabu bufakazi,
  ekugcineni kwako konkhe, umPholofethi labunikako Ngaye: Kutsi uyaphila!'
- Ngoba umPholofethi wambona, ngisho ngasesandleni sekudla saNkulunkulu; futsi umPholofetho weva livi
  lifakaza kutsi uyiNdvodzana letelwe yodvwa kuBabe—
- Kutsi Ngaye, futsi ngendlela Yakhe, futsi nangemasu Akhe, imihlaba ikhona futsi yadalwa, nebantfu bayo
  bangemadvodzana nemadvodzakati latelwe kuNkulunkulu. (buka T neT 76:22–24).
- Simemetela ngemagama ekuzotsa kutsi buPhristi Bakhe neLibandla Lakhe kubuyiselwe esimeni emhlabeni—“kwakhelwa
  etikwesisekelo … sebaPhostoli nebaPholofethi, Jesu Khristu lucobo ulitje lelisimise lendlu” (Kubase-Efesu
  2:20).
- Siyafakaza kutsi ngalelinye lemalanga utawubuya emhlabeni. “Futsi inkhatimulo yaSimakadze iyakwembulwa,
  nalolonkhe luntfu luyakuyibona” (Isaya 40:5). Utawubusa njengeNkhosi yemakhosi aphindze abuse njengeMbusi
  webabusi, futsi onkhe emadvolo ayawukhotsama futsi tonkhe tilimi tiyawukukhuluma tikhonte embiKwakhe.
  Ngamunye nangamunye wetfu siyawumela kwehlulelwa Nguye ngemisebenti yetfu nangetifiso tetinhlitiyo tetfu.
- Setfula bufakazi, njengebaPhostoli Bakhe labagcotjwe ngalokufanele—kutsi Jesu nguKhristu lophilako,
  iNdvodzana yaNkulunkulu lengabhubhi. UyiNkhosi lenkhulu Imanyuweli, lome namuhla ngasesandleni sekudla
  saBabe Wakhe. Ukukhanya, uyimphilo, nelitsemba lalamhlabeni. Indlela Yakhe yindlela leholela ekujabuleni
  kulemphilo lena naleyo mphilo lengunaphakadze emhlabeni lotako. Nkulunkulu akabongwe ngesipho lesingalinganiswa
  lesiyiNdvodzana Yakhe levela kuye.
