title: Tej Nqe Kev Ntseeg ntawm
subtitle: Yexus Khetos lub Koom Txoos ntawm Tsoom Haiv Neeg Ntseeg Hauv Hnub Nyoog Kawg
author: ''
verses:
- n: 1
  text: Peb ntseeg Vajtswv, Leej Txiv tus uas Nyob Mus Ib Txhis, thiab Nws Leej Tub, Yexus Khetos, thiab
    tus Vaj Ntsuj Plig Dawb Huv.
- n: 2
  text: Peb ntseeg tias tib neeg yuav raug txim rau lawv tus kheej tej kev txhaum, thiab tsis yog vim
    Adas txoj kev ua txhaum.
- n: 3
  text: Peb ntseeg tias los ntawm Khetos txoj Kev Theej Txhoj, tag nrho tib neeg txhua tus txais tau kev
    cawm dim, los ntawm kev ua raws li tej kev cai thiab kab ke ntawm txoj Moo Zoo.
- n: 4
  text: 'Peb ntseeg tias thawj cov ntsiab cai thiab kab ke ntawm txoj Moo Zoo yog: qhov ib, Kev ntseeg
    tus Tswv Yexus Khetos; qhov ob, Kev hloov siab lees txim; qhov peb, Kev cai raus dej rau txoj kev
    zam txim rau tej kev txhaum; qhov plaub, Kev tso tes saum taub hau kom muab lub txiaj ntsim Vaj Ntsuj
    Plig Dawb Huv.'
- n: 5
  text: Peb ntseeg tias Vajtswv yuav tsum hu ib tug neeg, los ntawm kev qhia tej uas yuav muaj los yav
    tom ntej, thiab los ntawm txoj kev tso tes rau saum taub hau los ntawm cov uas muaj cai, tus ntawd
    thiaj mus tshaj tawm txoj Moo Zoo thiab ua tej kab ke uas muaj nyob rau haud.
- n: 6
  text: Peb ntseeg tias muaj tib tug txheej txheem uas tau muaj nyob rau hauv lub Koom Txoos Thaum Ub,
    uas yog cov thwj tim, cov yaj saub, cov npisov, cov xib hwb, cov yawg suab, thiab li ntawd.
- n: 7
  text: Peb ntseeg tias muaj tej txiaj ntsim txawj hais lus, paub qhia tej yuav muaj los yav tom ntej,
    txais tau kev tshwm sim, ua yog toog, kho mob zoo, kev txhais tej lus, thiab tej zoo li ntawd.
- n: 8
  text: Peb ntseeg tias phau Npaivnpaum yog Vajtswv txoj lus npaum li uas tau txhais yog; peb kuj ntseeg
    tias Phau Ntawv Maumoos yog Vajtswv txoj lus thiab.
- n: 9
  text: Peb ntseeg tag nrho txhua yam uas Vajtswv tau muab qhia tshwm sim los, txhua yam uas Nws qhia
    tshwm sim los ziag no, thiab peb ntseeg hais tias Nws tseem yuav muab ntau yam tseem ceeb thiab muaj
    nqis ntsig txog Vajtswv lub Nceeg Vaj qhia tshwm sim los.
- n: 10
  text: Peb ntseeg tias yuav muab Ixayees sau los ua ke thiab muab Kaum Xeem Neeg txum tim rov qab los
    tiag tiag; ntseeg tias yuav muab Xi-oos (lub Nroog Yeluxalees Tshiab) txhim tsa nyob rau sab ntuj
    Amelikas teb; ntseeg tias Khetos tus kheej kiag yuav kav lub ntiaj teb; thiab, ntseeg tias lub ntiaj
    teb yuav rov tshiab dua tuaj thiab yuav txais lub yeeb koob ceeb tsheej.
- n: 11
  text: Peb qhia tias peb muaj cai teev tiam Vajtswv tus uas Muaj Hwj Chim Tag Nrho raws li seb peb lub
    siab xav li cas txog kev paub qhov zoo thiab qhov phem, thiab cia txhua tus neeg muaj cai li ntawd
    ib yam nkaus, cia lawv teev tiam txawm zoo li cas, nyob rau qhov twg, thiab teev tiam dab tsi los
    nyob ntawm lawv.
- n: 12
  text: Peb ntseeg tias peb yuav tsum ua raws li cov vaj ntxwv, cov thawj tswj hwm, cov kav teb kav chaw,
    thiab cov nom tswv, thiab yuav tsum ua raws li, hwm, thiab txhawb nqa tej kev cai.
- n: 13
  text: Peb ntseeg tias yuav tsum coj kom siab ncaj, tseeb, dawb huv, tsim nuj, tsim txiaj, thiab ua zoo
    rau txhua tus neeg; muaj tseeb tiag, peb hais tau tias peb ua raws li Povlauj cov lus ntuas—Peb ntseeg
    txhua yam, peb cia siab rau txhua yam, peb tau nyiaj dhau ntau yam, thiab cia siab hais tias yuav
    muaj peev xwm nyiaj dhau txhua yam. Yog hais tias muaj tej yam dab tsi uas tsim txiaj, ntxim hlub,
    los yog muaj moo zoo los yog txaus qhuas, peb nrhiav tej yam ntawd.
signature: Joseph Smith.
