slug: restoration
language: hat
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=hat
retrieved: '2026-11-02'
title: Retablisman Plenitid Levanjil Jezikri a
subtitle: Yon Pwoklamasyon Bisantnè pou Mond lan
author: Premye Prezidans lan ak Konsèy Douz Apot yo nan Legliz Jezikri pou Sen Dènye Jou yo
note: Prezidan Russell M. Nelson te li pwoklamasyon sa a kòm yon pati nan mesaj li nan 190èm Konferans
  Jeneral Anyèl ki te fèt 5 Avril 2020 an, nan Salt Lake City, Utah.
paragraphs:
- Nou deklare solanèlman ke Bondye renmen pitit Li yo nan tout nasyon nan mond lan. Bondye Papa a ba nou
  don nesans diven, lavi enkonparab, ak sakrifis ekspyatwa enfini Pitit Gason Byeneme L la, Jezikri. Pa
  pouvwa Papa a, Jezi te resisite epi Li te ranpòte viktwa sou lanmò. Li se Sovè nou, Egzanp nou, ak Redanmtè
  nou.
- Sa gen desanzan, nan yon bèl maten prentan an 1820, jèn Joseph Smith, ki t ap chèche konnen nan ki legliz
  pou l te mache, t ale nan yon rakbwa ki te tou pre lakay li nan Nò Nouyòk, nan Etazini, pou l te priye.
  Li te gen kesyon konsènan sali nanm li epi li te gen konfyans ke Bondye t ap ba l direksyon.
- Avèk imilite, nou deklare ke kòm repons pou priyè l la, Bondye Papa a ak Pitit Gason L lan, Jezikri,
  te parèt devan Joseph epi yo te inogire “retablisman tout bagay” (Travay 3:21) la jan sa te predi nan
  Bib la. Nan vizyon sa a, li te aprann ke, apre lanmò premye Apot yo, Legliz Kris la nan Nouvo Testaman
  an te pèdi e li pa t sou tè a ankò. Joseph ta pral jwe yon gwo wòl pou fè l retounen.
- Nou afime ke, anba direksyon Papa a ak Pitit Gason an, mesaje selès te vin enstwi Joseph ak retabli
  Legliz Jezikri a. Jan Batis resisite a te retabli otorite pou batize pa imèsyon pou remisyon peche yo.
  Twa nan premye Douz Apot yo—Pyè, Jak, ak Jan—te retabli apostola a ak kle otorite prètriz yo. Te gen
  lòt moun ki te vini tou, ladan yo, Eli, ki te retabli otorite pou ini fanmi yo ansanm pou tout tan nan
  relasyon etènèl ki ale pi lwen pase lanmò.
- 'Nou temwaye ankò ke Joseph Smith te resevwa don ak pouvwa Bondye pou l te tradui yon ansyen rejis:
  Liv Mòmon an—Yon Lòt Temwayaj Konsènan Jezikri. Paj tèks sakre sa a genyen yon istwa konsènan ministè
  pèsonèl Jezikri nan pami pèp ki t ap viv nan Emisfè Oksidantal la tousuit aprè Rezirèksyon L lan. Li
  ansenye bi lavi a epi li eksplike doktrin Kris la, ki se santral bi sa a. Kòm yon liv ekriti ki se konpanyon
  Bib la, Liv Mòmon an temwaye ke tou kretyen vivan se pitit gason ak pitit fi yon Papa eman ki nan Syèl
  la, ke Li gen yon plan diven pou lavi nou, epi Pitit Gason L lan, Jezikri, pale jodia menm jan L te
  konn pale nan tan lontan an.'
- Nou deklare ke Legliz Jezikri pou Sen Dènye Jou yo, ki te òganize 6 Avril 1830, se Legliz Kris la nan
  Nouvo Testaman an ki retabli. Legliz sa a ankre nan lavi pafè wòch fondasyon L lan, Jezikri, ak nan
  Ekspyasyon Enfini L lan ak Rezirèksyon literal Li a. Yon lòt fwa ankò Jezikri te aple Apot epi L te
  ba yo otorite prètriz la. Li envite nou tout pou nou vin jwenn Li ak Legliz Li a, pou nou resevwa Sentespri
  a, òdonans sali yo, epi jwenn lajwa ki dirab.
- Sa fè 200 zan kounyea depi lè Bondye Papa a ak Pitit Gason Byeneme L la, Jezikri, te inisye Retablisman
  an. Plizyè milyon moun nan tout mond lan anbrase yon konesans sou evènman sa yo ki te pwofetize.
- Nou deklare avèk lajwa ke Retablisman yo te pwomèt la ap avanse devan atravè revelasyon kontinyèl. Tè
  sa a pa p janm menm jan an ankò, paske Bondye pral “rasanble tout bagay fè youn nan Kris la” (Efezyen
  1:10).
- Avèk reverans ak gratitid, noumenm antanke Apot Li, nou envite tout moun pou yo konnen—menm jan nou
  konnen an—ke syèl la ouvè. Nou afime ke Bondye ap fè nou konnen volonte L pou pitit gason ak pitit fi
  byeneme L yo. Nou temwaye ke moun ki etidye mesaj Retablisman an nan yon espri lapriyè epi ki aji ak
  lafwa yo ap jwenn benediksyon pou yo gen pwòp temwayaj pa yo konsènan divinite Li ak objektif Li pou
  prepare mond lan pou Dezyèm Vini Senyè ak Sovè nou an, Jezikri.
