title: Fanmi an
subtitle: Yon pwoklamasyon pou mond lan
author: Premye Prezidans lan ak Konsèy Douz Apot yo nan Legliz Jezikri pou Sen Dènye Jou yo
note: Se Prezidan Gordon B. Hinckley ki te li pwoklamasyon sa a kòm yon pati nan mesaj li nan Reyinyon
  Jeneral Sosyete Sekou ki te fèt 23 septanm 1995, nan Salt Lake City, Utah.
paragraphs:
- Nou menm, Premye Prezidans lan ak Konsèy Douz Apot yo nan Legliz Jezikri pou Sen Dènye Jou yo, nou pwoklame
  solanèlman, maryaj ant yon gason ak yon fi se bagay Bondye òdone epi fanmi se pwen santral nan plan
  Kreyatè a pou destine etènèl pitit Li yo.
- Tout kretyen vivan—gason ak fi—te kreye dapre imaj Bondye. Yo chak se yon pitit lespri gason oubyen
  fi ki soti nan paran selès, epi konsa, yo chak gen yon nati ak yon destine diven. Maskilen ak feminen
  se yon karakteristik esansyèl pou moun ki premòtèl, ki mòtèl epi se yon idantite ak yon objetif etènèl.
- Nan egzistans premòtèl la, pitit gason ak pitit fi lespri yo te konnen Bondye epi yo te adore L kòm
  Papa Etènèl yo epi yo te aksepte plan L lan kote pitit Li yo te kabab vin gen yon kò fizik pou yo fè
  eksperyans terès pou yo pwogrese nan direksyon pèfeksyon epi pou yo vin rive alafen nan destine diven
  yo kòm eritye lavi etènèl. Plan bonè diven an pèmèt relasyon familyal yo kontinye jis apre lanmò. Òdonans
  ak alyans sakre ki disponib nan tanp yo rann posib pou chak moun retounen nan prezans Bondye epi pou
  fanmi yo ini pou letènite.
- Premye kòmandman Bondye te bay Adan ak Èv la te mansyone potansyèl yo kòm paran antanke mari ak madanm.
  Nou deklare kòmandman Bondye te bay pitit Li yo pou yo miltipliye epi pou yo ranpli latè a toujou valab.
  Nou deklare pi lwen ke Bondye kòmande pou pouvwa sakre pwokreyasyon yo sèvi sèlman ant gason ak fi ki
  marye legalman.
- Nou deklare mwayen pou kreye lavi mòtèl sou latè a se yon bagay Bondye tabli. Nou deklare lavi a sakre
  epi li enpòtan nan plan etènèl Bondye a.
- Mari ak madanm gen yon responsablite solanèl pou youn renmen ak pran swen lòt epi pou yo renmen ak pran
  swen pitit yo. “Pitit se eritaj Senyè a” (Sòm 127:3). Paran yo gen yon devwa sakre pou yo elve pitit
  yo nan lanmou ak jistis, pou satisfè bezwen fizik ak espirityèl yo, pou anseye yo pou yo sèvi epi pou
  youn renmen lòt, pou yo respekte kòmandman Bondye yo epi pou yo tounen sitwayen ki obeyi lwa kèlkeswa
  kote yo abite. Mari ak madanm—manman ak papa—pral gen responsablite devan Bondye pou akonplisman obligasyon
  sa yo.
- Se Bondye ki òdone fanmi. Maryaj ant gason ak fi se yon bagay endispansab pou plan etènèl Li a. Se dwa
  timoun pou yo pran nesans nan relasyon maryaj, epi pou yon papa ak yon manman ki onore alyans maryaj
  avèk fidelite total elve yo. Bonè nan lavi familyal kapab akonpli pi souvan lè l fonde sou ansèyman
  Lesenyè Jezikri. Maryaj ak fanmi ki gen siksè yo tabli epi yo chita sou prensip lafwa, priyè, repantans,
  padon, respè, lanmou, konpasyon, travay, ak aktivite rekreyatif ki pwòp. Dapre plan diven an, papa yo
  dwe dirije fanmi yo avèk lanmou ak jistis epi yo responsab pou yo bay fanmi yo tout sa yo bezwen nan
  lavi a ak pwoteksyon. Manman yo responsab prensipalman pou nouri pitit yo. Nan responsablite sakre sa
  yo, manman ak papa gen obligasyon pou youn ede lòt kòm asosye egal. Enfimite, lanmò, oubyen lòt sikonstans
  kapab egzije adaptasyon endividyèl. Lòt fanmi yo ta dwe bay sipò yo lè l nesesè.
- Nou avèti moun ki vyole alyans chastete, ki maltrete konjwen yo oubyen pitit yo, oubyen ki pa akonpli
  responsablite familyal yo pral rann kont devan Bondye yon jou. Anplis, nou avèti, dezentegrasyon fanmi
  an ap pote kalamite pwofèt ansyen ak modèn yo te predi yo sou endividi yo, kominote yo, ak nasyon yo.
- Nou mande sitwayen ak responsab gouvènman tout kote yo ye, pou yo sipòte lwa sa yo ki te etabli pou
  kenbe epi pou ranfòse fanmi kòm inite fondamantal sosyete a.
