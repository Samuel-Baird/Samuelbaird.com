title: Il-Familja
subtitle: Proklamazzjoni lid-Dinja
author: ''
note: Din il-proklamazzjoni nqrat mill-President Gordon B. Hinckley bħala parti mill-messaġġ tiegħu fil-Laqgħa
  Ġenerali tas-Soċjetà tal-Għajnuna li saret fit-23 ta’ Settembru, 1995, f’ Salt Lake City, Utah.
paragraphs:
- Aħna, l-Ewwel Presidenza u l-Kunsill tat-Tnax-il Appostlu tal-Knisja ta’ Ġesù Kristu tal-Qaddisin tal-Aħħar
  Jiem, niddikjaraw solennement li ż-żwieġ bejn raġel u mara huwa ordnat minn Alla u li l-familja hija
  ċentrali fil-pjan tal-Ħallieq għad-destin etern ta’ wliedu.
- Il-bnedmin kollha—irġiel u nisa—huma maħluqa fi xbieha ta’ Alla. Kull wieħed u waħda minnhom huma iben
  jew bint spirtu ta’ ġenituri tas-sema, u għalhekk, kollha għandhom natura divina u destin divin. Is-sess
  tagħna huwa karatteristika essenzjali tal-identità u l-għan individwali primortali, mortali u etern
  tagħna.
- Fid-dinja primortali, l-ulied spirti kienu jafu u jqimu lil Alla bħala l-Missier Etern tagħhom u aċċettaw
  il-pjan Tiegħu, li permezz tiegħu wliedu setgħu jiksbu ġisem fiżiku u jiksbu esperjenza fid-dinja biex
  jimxu ’l quddiem lejn il-perfezzjoni u fl-aħħarnett jirrealizzaw id-destin divin tagħhom bħala eredi
  tal-ħajja eterna. Il-pjan divin tal-ferħ jippermetti li r-relazzjonijiet fil-familja jibqgħu jeżistu
  lil hinn mill-qabar. L-ordinanzi u l-patti sagri tat-tempji mqaddsa jagħmluha possibbli li l-individwi
  jerġgħu lura fil-preżenza ta’ Alla u li l-familji jibqgħu magħqudin għall-eternità.
- L-ewwel kmandament li Alla ta lil Adam u Eva kien marbut mal-potenzjal tagħhom li jkunu ġenituri bħala
  raġel u mara miżżewġin. Aħna niddikjaraw li l-kmandament ta’ Alla lil uliedu sabiex jitkattru u jimlew
  id-dinja għadu jgħodd. Niddikjaraw ukoll li Alla kkmanda li l-qawwiet sagri tal-prokreazzjoni għandhom
  jintużaw biss bejn raġel u mara, miżżewġin bil-liġi.
- Niddikjaraw li l-mod li bih tinħoloq il-ħajja mortali huwa ġej minn Alla. Naffermaw il-qdusija tal-ħajja
  u l-importanza tagħha fil-pjan etern ta’ Alla.
- Raġel u mara miżżewġin għandhom ir-responsabbiltà solenni li jħobbu u jgħożżu lil xulxin u lil uliedhom.
  “L-ulied huma wirt il-Mulej”(Salm 127:3). Il-ġenituri għandhom dmir sagru li jrabbu lil uliedhom fl-imħabba
  u fis-sewwa, li jipprovdulhom għall-bżonnijiet fiżiċi u spiritwali tagħhom, li jgħallmuhom iħobbu u
  jaqdu lil xulxin, li josservaw il-kmandamenti ta’ Alla u li jkunu ċittadini li jobdu l-liġijiet kull
  fejn jgħixu. L-irġiel u n-nisa miżżewġin—ommijiet u missirijiet—jinżammu responsabbli quddiem Alla li
  jwettqu dawn l-obbligi.
- Il-familja hija ordnata minn Alla. Iż-żwieġ bejn raġel u mara huwa essenzjali għall-pjan etern Tiegħu.
  It-tfal huma intitolati li jitwieldu fir-rabta taż-żwieġ, u li jitrabbew minn missier u omm li jonoraw
  il-wegħdiet taż-żwieġ b’fedeltà sħiħa. Il-kuntentizza fil-ħajja fil-familja tista’ tinkiseb l-aktar
  meta tkun ibbażata fuq it-tagħlim tal-Mulej Ġesù Kristu. Iż-żwiġijiet u l-familji li jirnexxu huma stabbiliti
  u miżmuma fuq il-prinċipji tal-fidi, it-talb, l-indiema, ir-rispett, l-imħabba, il-kompassjoni, ix-xogħol,
  u l-attivitajiet ta’ rikreazzjoni xierqa. Fil-pjan divin, il-missirijiet għandhom jippresiedu fuq il-familji
  tagħhom bl-imħabba u s-sewwa, u huma responsabbli li jipprovdu l-bżonnijiet tal-ħajja u l-protezzjoni
  għall-familji tagħhom. L-ommijiet huma responsabbli l-ewwelnett mit-trobbija ta’ wliedhom. F’dawn ir-responsabbiltajiet
  sagri, il-missierijiet u l-ommijiet għandhom l-obbligu li jgħinu lil xulxin bħala sħab indaqs. Diżabilitajiet,
  imwiet, jew ċirkostanzi oħra jistgħu jwasslu għall-ħtieġa li l-individwi jaddattaw irwieħhom skond is-sitwazzjoni.
  Il-familji estiżi għandhom jipprovdu l-appoġġ tagħhom meta jkun meħtieġ.
- Inwissu lil dawk l-individwi li jiksru l-patti tal-kastità, li jabbużaw mis-sieħeb, mis-sieħba jew mill-ulied,
  jew li jonqsu milli jwettqu r-responsabbiltajiet fil-familja tagħhom, li xi darba jridu jagħtu kont
  ta’ għemilhom quddiem Alla. Aktar minn hekk, inwissu li d-diżintegrazzjoni tal-familja għad iġġib id-diżastri
  fuq l-individwi, fuq il-komunitajiet, u fuq in-nazzjonijiet, li wissewna dwarhom il-profeti kemm dawk
  tal-qedem kif ukoll dawk moderni.
- Insejħu liċ-ċittadini responsabbli u lill-uffiċjali tal-gvern kullimkien sabiex jippromwovu dawk il-miżuri
  maħsuba sabiex isostnu u jsaħħu l-familja bħala l-istruttura fundamentali tas-soċjetà.
