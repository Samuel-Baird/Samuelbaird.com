title: Ir-Restawrazzjoni tal-Milja tal-Evanġelju ta’ Ġesù Kristu
subtitle: Proklamazzjoni Biċentinarja lid-Dinja
author: L-Ewwel Presidenza u l-Kunsill tat-Tnax-il Appostlu tal-Knisja ta’ Ġesù Kristu tal-Qaddisin tal-Aħħar
  Żmien
note: B’qima u gratitudni, aħna, bħala l-Appostli tiegħu, nistiednu lil kulħadd biex ikun jaf—kif nafu
  aħna—li s-smewwiet jinsabu miftuħin. Aħna naffermaw li Alla qiegħed jgħarraf ir-rieda tiegħu lill-għeżież
  uliedu. Aħna nixhdu li dawk li bl-għajnuna tat-talb jistudjaw il-messaġġ tar-Restawrazzjoni u jaġixxu
  b’fidi, ikunu mberkin li jiksbu x-xhieda personali tagħhom tad-divinità tagħha u tal-għan tagħha li
  tħejji lid-dinja għall-imwiegħda Tieni Miġja tal-Mulej u s-Salvatur tagħna, Ġesù Kristu.
paragraphs:
- Aħna solennement niddikjaraw li Alla jħobb lil uliedu f’kull ġens tad-dinja. Alla l-Missier tana t-twelid
  divin, il-ħajja inkomparabbli, u s-sagrifiċċju infinit tal-Espjazzjoni ta’ Ibnu l-Għażiż, Ġesù Kristu.
  Bil-qawwa tal-Missier, Ġesù reġa’ qam u kiseb ir-rebħa fuq il-mewt. Huwa s-Salvatur tagħna, l-Eżemplar
  tagħna, u l-Feddej tagħna.
- Mitejn sena ilu, f’għodwa mill-isbaħ tar-rebbiegħa tal-1820, it-tfajjel Joseph Smith, li beda jfittex
  li jkun jaf ma’ liema knisja kellu jingħaqad, mar jitlob fil-bosk ħdejn id-dar tiegħu fit-tramuntana
  ta’ New York, fl-Istati Uniti. Hu kellu mistoqsijiet dwar is-salvazzjoni ta’ ruħu u kellu fiduċja li
  Alla kien se jidderiġih.
- B’umiltà, aħna niddikjaraw li b’risposta għat-talba tiegħu, Alla l-Missier u Ibnu, Ġesù Kristu, dehru
  lil Joseph u inawguraw ‘it-tiġdid kollu” (Atti 3:21) kif kien imħabbar fil-Bibbja. F’din il-viżjoni,
  huwa tgħallem li wara l-mewt tal-Appostli oriġinali, il-Knisja ta’ Kristu tat-Testment il-Ġdid kienet
  għosfrot mid-dinja. Joseph kien se jkun strumentali fir-ritorn tagħha.
- Aħna naffermaw li taħt id-direzzjoni tal-Missier u tal-Iben, ġew messaġġiera mis-smewwiet biex jagħtu
  struzzjonijiet lil Joseph u jerġgħu jistabbilixxu l-Knisja ta’ Ġesù Kristu. Ġwanni l-Battista mqajjem
  mill-imwiet irrestawra l-awtorità li tgħammed b’immersjoni għall-maħfra tad-dnubiet. Tlieta mit-tnax-il
  Appostlu oriġinali—Pietru, Ġakbu, u Ġwanni—irrestawraw l-appostolat u l-imfietaħ tal-awtorità tas-saċerdozju.
  Ġew oħrajn ukoll, fosthom Elija, li rrestawra l-awtorità li tgħaqqad il-familji flimkien għal dejjem
  f’relazzjonijiet eterni li jmorru lil hinn mill-mewt.
- 'Aħna nixhdu wkoll li Joseph Smith ingħata d-don u l-qawwa ta’ Alla biex jittraduċi annali antiki: il-Ktieb
  ta’ Mormon—Testment Ieħor ta’ Ġesù Kristu. Paġni minn dan it-test sagru jinkludu rakkont tal-ministeru
  personali ta’ Ġesù Kristu fost nies li kien hemm fl-Emisfera tal-Punent ftit wara l-Qawmien tiegħu mill-Imwiet.
  Jgħallem dwar l-għan tal-ħajja u jispjega d-duttrina ta’ Kristu, li hi fil-qofol ta’ dak l-għan. Bħala
  skrittura li takkumpanja lill-Bibbja, il-Ktieb ta’ Mormon jixhed li l-bnedmin kollha huma wlied Missier
  fis-Smewwiet kollu mħabba, li Hu għandu pjan divin għal ħajjitna, u li Ibnu, Ġesù Kristu, jitkellem
  illum ukoll kif għamel fi żmien il-qedem.'
- Aħna niddikjaraw li Il-Knisja ta’ Ġesù Kristu tal-Qaddisin tal-Aħħar Żmien, organizzata fis-6 ta’ April,
  1830, hija l-Knisja rrestawrata ta’ Kristu tat-Testment il-Ġdid. Din il-Knisja hi ankrata mal-ħajja
  perfetta tal-ġebla tax-xewka tagħha, Ġesù Kristu, u mal-Espjazzjoni infinita u l-Qawmien mill-Imwiet
  letterali tiegħu. Ġesù Kristu għal darb’oħra reġa’ sejjaħ Appostli u tahom l-awtorità tas-saċerdozju.
  Hu jistieden lilna lkoll biex nersqu lejh u lejn il-Knisja tiegħu, biex nirċievu l-Ispirtu s-Santu,
  l-ordinanzi tas-salvazzjoni, u niksbu l-ferħ li jibqa’ għal dejjem.
- Issa għaddew mitejn sena minn meta ngħata bidu għal din ir-Restawrazzjoni minn Alla l-Missier u Ibnu
  l-Għażiż, Ġesù Kristu. Miljuni ta’ nies madwar id-dinja ħaddnu l-għarfien ta’ dawn il-ġrajjiet imħabbra.
- Aħna bil-ferħ niddikjaraw li r-Restawrazzjoni mwiegħda se tibqa’ miexja ’l quddiem permezz tar-rivelazzjoni
  kontinwa. Id-dinja qatt mhi se terġa’ tkun l-istess, hekk kif Alla ‘kollox se jiġbor taħt ras waħda,
  li hu Kristu” (Efesin 1:10).
