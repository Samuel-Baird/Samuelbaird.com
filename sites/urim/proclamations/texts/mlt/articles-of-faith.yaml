title: L-Artikli tal-Fidi tal-Knisja ta’ Ġesù Kristu tal-Qaddisin tal-Aħħar Jiem
subtitle: ''
author: ''
verses:
- n: 1
  text: Aħna nemmnu f’ Alla, il-Missier Etern, u f’ Ibnu, Ġesù Kristu, u fl-Ispirtu s-Santu.
- n: 2
  text: Aħna nemmnu li l-bnedmin se jiġu kkastigati għal dnubiethom, u mhux għat-trasgressjoni ta’ Adam.
- n: 3
  text: Aħna nemmnu li permezz tal-Att tal-Fidwa ta’ Kristu, il-bnedmin kollha jistgħu jiġu salvati, jekk
    huma jobdu l-liġijiet u l-ordinanzi tal-Evanġelju.
- n: 4
  text: 'Aħna nemmnu li l-ewwel prinċipji u ordinanzi tal-Evanġelju huma: l-ewwel, Fidi fil-Mulej Ġesù
    Kristu; it-tieni, l-Indiema; it-tielet, Magħmudija b’ immersjoni għall-maħfra tad-dnubiet; ir-raba’,
    it-Tqegħid tal-idejn għad-don tal-Ispirtu s-Santu.'
- n: 5
  text: Aħna nemmnu li l-bniedem għandu jiġi msejjaħ minn Alla, permezz tal-profezija, u permezz tat-tqegħid
    tal-idejn minn dawk li għandhom l-awtorità, sabiex huwa jippriedka l-Evanġelju u jamministra fl-ordinanzi
    tiegħu.
- n: 6
  text: Aħna nemmnu fl-istess organizzazzjoni li kienet teżisti fil-Knisja Primittiva, jiġifieri, appostli,
    profeti, ragħajja, għalliema, evanġelisti, etċ.
- n: 7
  text: Aħna nemmnu fid-don tal-ilsna, tal-profezija, tar-rivelazzjoni, tal-viżjonijiet, tal-fejqan, tal-interpretazzjoni
    tal-ilsna, etċ.
- n: 8
  text: Aħna nemmnu li l-Bibbja hija l-kelma ta’ Alla sakemm hija tradotta b’ mod korrett; nemmnu wkoll
    li l-Ktieb ta’ Mormon huwa l-kelma ta’ Alla.
- n: 9
  text: Aħna nemmnu dak kollu li żvela Alla, dak kollu li qed jiżvela bħalissa, u nemmnu li għad irid
    jiżvela bosta ħwejjeġ kbar u importanti li jappartienu għas-Saltna ta’ Alla.
- n: 10
  text: Aħna nemmnu fil-ġabra reali ta’ Iżrael u fir-restawrazzjoni tal-Għaxar Tribujiet; li Sijon (Ġerusalem
    il-Ġdida) se tinbena fuq il-kontinent Amerikan; li Kristu se jsaltan personalment fuq wiċċ id-dinja;
    u li d-dinja se tiġġedded u se tirċievi l-glorja ċelestjali tagħha.
- n: 11
  text: Aħna nistennew li jkollna d-dritt li naduraw lil Alla s-Setgħan skond kif tgħidilna l-kuxjenza
    tagħna, u l-bnedmin kollha nagħtuhom id-dritt li jkollhom l-istess privileġġ, li nħalluhom iqimu kif,
    fejn, u lil min iridu huma.
- n: 12
  text: Aħna nemmnu li għandna nkunu suġġett għas-slaten, presidenti, mexxejja u maġistrati, billi nobdu,
    nonoraw u nsostnu l-liġi.
- n: 13
  text: Aħna nemmnu li għandna nkunu onesti, leali, kasti, benevolenti, virtużi u li nagħmlu t-tajjeb
    lill-bnedmin kollha; fil-fatt, nistgħu ngħidu li aħna nimxu wara l-kunsill ta’ Pawlu—Aħna nemmnu kollox,
    aħna nittamaw kollox, aħna b’ sabar issaportejna ħafna ħwejjeġ, u nittamaw li nkunu kapaċi nkomplu
    nissaportu kollox. Jekk hemm xi ħaġa virtuża, sabiħa, ta’ riputazzjoni tajba jew li jixirqilha t-tifħir,
    aħna nfittxuha.
signature: Joseph Smith.
