title: Հիսուս Քրիստոսի ավետարանի լրիվության վերականգնումը
subtitle: Երկուհարյուրամյա հռչակագիր աշխարհին
author: Հիսուս Քրիստոսի Վերջին Օրերի Սրբերի Եկեղեցու Առաջին Նախագահություն և Տասներկու Առաքյալների Խորհուրդ
note: Նախագահ Ռասսել Մ․ Նելսոնն այս հայտարարությունը ընթերցել է 190-րդ ամենամյա գերագույն համաժողովի իր
  ելույթի ժամանակ՝ 5 ապրիլի 2020 թ-ին, Սոլթ Լեյք Սիթիում (Յուտա)։
paragraphs:
- Մենք հանդիսավոր կերպով հայտարարում ենք, որ Աստված սիրում է Իր զավակներին աշխարհի յուրաքանչյուր երկրում։
  Հայր Աստված մեզ տվել է Իր Սիրելի Որդի՝ Հիսուս Քրիստոսի աստվածային ծնունդը, անզուգական կյանքը և անսահման
  քավող զոհաբերությունը։ Հոր զորությամբ Հիսուսը կրկին հարություն առավ և հաղթեց մահին։ Նա մեր Փրկիչն է,
  մեր Օրինակն ու մեր Քավիչը։
- Երկու հարյուր տարի առաջ՝ 1820 թվականի գարնանային մի գեղեցիկ առավոտ, երիտասարդ Ջոզեֆ Սմիթը, ցանկանալով
  իմանալ, թե որ եկեղեցուն միանա, գնաց աղոթելու իր տան մոտ գտնվող անտառում, ԱՄՆ-ի Նյու Յորք նահանգի ծայրամասում։
  Նա հարցեր ուներ իր հոգու փրկության վերաբերյալ և հավատում էր, որ Աստված կուղղորդի իրեն։
- Խոնարհությամբ հայտարարում ենք, որ, ի պատասխան նրա աղոթքի, Հայր Աստված և Նրա Որդին՝ Հիսուս Քրիստոսը,
  հայտնվեցին Ջոզեֆին և հանդիսավոր բացեցին «ամեն բաների հաստատվելու ժամանակները» (Գործք Առաքելոց 3.21),
  ինչպես կանխագուշակվել էր Աստվածաշնչում։ Այդ տեսիլքում նա իմացավ, որ առաջին առաքյալների մահից հետո Քրիստոսի
  Նոր Կտակարանի եկեղեցին այլևս Երկրի վրա չէր։ Ջոզեֆը պետք է գործիք դառնար այդ եկեղեցու վերադարձի գործում։
- Մենք հաստատում ենք, որ Հոր և Որդու ղեկավարության ներքո երկնային սուրհանդակներն իջան՝ Ջոզեֆին հրահանգելու
  և Հիսուս Քրիստոսի եկեղեցին կրկին վերականգնելու համար։ Հարություն առած Հովհաննես Մկրտիչը վերականգնեց
  մեղքերի թողության համար ընկղմամբ մկրտելու իշխանությունը։ Առաջին տասներկու առաքյալներից երեքը՝ Պետրոսը,
  Հակոբոսը և Հովհաննեսը, վերականգնեցին առաքյալների կոչումները և քահանայության իշխանության բանալիները։
  Եկան նաև ուրիշներ, այդ թվում՝ Եղիան, ով վերականգնեց ընտանիքները հավիտյան միավորելու իշխանությունը հավերժական
  հարաբերություններում, որը գերազանցում է մահին։
- Մենք նաև վկայում ենք, որ Ջոզեֆ Սմիթին տրվեց Աստծո պարգևն ու զորությունը թարգմանելու հնագույն հիշատակարանը՝
  «Մորմոնի Գիրքը. Եվս մեկ վկայություն Հիսուս Քրիստոսի մասին»։ Այս սուրբ գրքի էջերը պարունակում են Արևմտյան
  կիսագնդի ժողովրդին մատուցած Հիսուս Քրիստոսի անձնական ծառայության պատմությունը Նրա հարությունից անմիջապես
  հետո։ Այն ուսուցանում է կյանքի նպատակը և բացատրում է Քրիստոսի վարդապետությունը, որն այդ նպատակի համար
  կարևոր նշանակություն ունի։ Մորմոնի Գիրքը, լինելով Աստվածաշնչի ուղեկից սուրբ գրություն, վկայում է, որ
  բոլոր մարդիկ սիրող Երկնային Հոր որդիներն ու դուստրերն են, որ Նա աստվածային ծրագիր ունի մեր կյանքի համար,
  և որ Նրա Որդին՝ Հիսուս Քրիստոսը, այսօր խոսում է այնպես, ինչպես հին օրերում։
- Մենք հայտարարում ենք, որ Հիսուս Քրիստոսի Վերջին Օրերի Սրբերի Եկեղեցին, որը կազմավորվել է 1830 թվականի
  ապրիլի 6-ին, Քրիստոսի Նոր Կտակարանի վերականգնված եկեղեցին է։ Այս Եկեղեցին խարսխված է իր գլխավոր անկյունաքար՝
  Հիսուս Քրիստոսի կատարյալ կյանքին և Նրա անսահման Քավությանն ու իրական Հարությանը։ Հիսուս Քրիստոսը ևս
  մեկ անգամ կանչել է առաքյալներ և նրանց տվել քահանայության իշխանություն։ Նա հրավիրում է բոլորիս գալ դեպի
  Իրեն և Իր Եկեղեցին, ստանալ Սուրբ Հոգին, փրկության արարողությունները և ձեռք բերել հարատև ուրախություն։
- Արդեն անցել է երկու հարյուր տարի այն պահից, երբ Հայր Աստված և Նրա Սիրելի Որդի՝ Հիսուս Քրիստոսը սկիզբ
  դրեցին Վերականգնմանը։ Ամբողջ աշխարհում միլիոնավոր մարդիկ գիտելիք են ստացել այս մարգարեական իրադարձությունների
  մասին։
- Մենք ուրախությամբ հայտարարում ենք, որ խոստացված Վերականգնումը առաջ է ընթանում շարունակական հայտնության
  միջոցով։ Երկիրն այլևս երբեք նույնը չի լինի, քանի որ Աստված «ամեն բան [կ]բովանդակի Քրիստոսումը» (Եփեսացիս
  1.10)։
- Ակնածանքով և երախտագիտությամբ մենք՝ որպես Նրա առաքյալներ, հրավիրում ենք բոլորին իմանալ, ինչպես մենք
  գիտենք, որ երկինքները բաց են։ Մենք հաստատում ենք, որ Աստված Իր սիրելի որդիների և դուստրերի համար հայտնում
  է Իր կամքը։ Մենք վկայում ենք, որ նրանք, ովքեր աղոթքով կուսումնասիրեն Վերականգնման ուղերձը և հավատքով
  քայլ կանեն, կօրհնվեն և անձնական վկայություն կստանան այդ ուղերձի աստվածային ծագման ու մեր Տեր և Փրկիչ
  Հիսուս Քրիստոսի խոստացված Երկրորդ Գալուստի համար աշխարհը նախապատրաստելու նպատակի մասին։
