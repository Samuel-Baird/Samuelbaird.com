title: Ընտանիք
subtitle: Հայտարարություն աշխարհին
author: Հիսուս Քրիստոսի Վերջին Օրերի Սրբերի Եկեղեցու Առաջին Նախագահություն և Տասներկու Առաքյալների Խորհուրդ
note: Որպես իր ուղերձի մի մաս՝ այս հայտարարությունը կարդացվել է նախագահ Գորդոն Բ․ Հինքլիի կողմից Կանանց
  Սփոփող Միության գերագույն ժողովին 1995թ. սեպտեմբերի 23-ին, Սոլթ Լեյք Սիթիում։
paragraphs:
- Մենք՝ Հիսուս Քրիստոսի Վերջին Օրերի Սրբերի Եկեղեցու Առաջին Նախագահությունը և Տասներկու Առաքյալների Խորհուրդը,
  պաշտոնապես հայտարարում ենք, որ տղամարդու և կնոջ ամուսնությունը հաստատվել է Աստծո կողմից և, որ ընտանիքն
  ամենակարևոր դերն ունի Արարչի ծրագրում՝ Իր զավակների հավերժական ճակատագրի համար։
- Մարդկային էակները՝ տղամարդիկ և կանայք, բոլորն արարվել են Աստծո պատկերով։ Յուրաքանչյուրը երկնային ծնողների
  կողմից սիրված հոգևոր որդին կամ դուստրն է, և, որպես այդպիսին, յուրաքանչյուր ոք ունի աստվածային բնույթ
  և ճակատագիր։ Սեռն անհատի հիմնական բնութագիրն է նախաերկրային, երկրային և հավերժական կյանքի և նպատակի։
- Նախաերկրային աշխարհում հոգևոր որդիներն ու դուստրերը ճանաչում և երկրպագում էին Աստծուն, որպես իրենց Հավերժական
  Հորը և ընդունում էին Նրա ծրագիրը, ըստ որի պետք է ֆիզիկական մարմիններ ձեռք բերեին և աշխարհիկ փորձ կուտակեին
  դեպի կատարելություն ընթանալու և իրենց աստվածային ճակատագիրը որպես հավերժական կյանքի ժառանգներ բացառիկ
  կերպով գիտակցելու համար։ Երջանկության աստվածային ծրագիրը հնարավորություն է տալիս, որ ընտանեկան կապերը
  շարունակվեն մահից հետո։ Սուրբ տաճարներում կատարվող սուրբ արարողություններն ու ուխտերը հնարավոր են դարձնում
  անհատների համար՝ վերադարձը դեպի Աստծո ներկայությունը, իսկ ընտանիքների համար՝ հավերժական միասնությունը։
- Ադամին և Եվային Աստծո կողմից տրված առաջին պատվիրանը վերաբերվում էր որպես ամուսին և կին նրանց ծնող դառնալու
  հնարավորությանը։ Մենք հայտարարում ենք, որ դեռևս ուժի մեջ է Իր զավակներին տված շատանալու և երկիրը լցնելու
  վերաբերյալ Աստծո պատվիրանը։ Մենք հայտարարում ենք նաև Աստծո այն պատվիրանը, որ ծնունդ տալու սուրբ զորությունը
  պետք է օգտագործվի միայն այն տղամարդու և կնոջ միջև, որոնք օրինական ձևով ամուսնացած են որպես ամուսին և
  կին։
- Մենք հայտարարում ենք, որ երկրի վրա կյանքի ստեղծման ուղիները ղեկավարվում են Աստծո կողմից։ Մենք հաստատում
  ենք կյանքի սուրբ լինելը և նրա կարևորությունն Աստծո հավերժական ծրագրում։
- Ամուսինը և կինը սուրբ պատասխանատվություն են կրում սիրելու և հոգ տանելու միմյանց և երեխաների համար։ «Որդիները
  Տիրոջ ժառանգությունն են» (Սաղմոս 127.3)։ Ծնողների սուրբ պարտականությունն է՝ դաստիարակել երեխաներին սիրո
  և առաքինության մթնոլորտում, ապահովել նրանց նյութական և հոգևոր կարիքները, ուսուցանել նրանց սիրել և ծառայել
  մեկը մյուսին, պահել Աստծո պատվիրանները և օրինապաշտ քաղաքացիներ լինել, որտեղ էլ որ ապրեն։ Ամուսիններն
  ու կանայք՝ մայրերն ու հայրերը, հաշվետու կլինեն Աստծո առջև այս պարտականությունների իրականացման համար։
- Ընտանիքը հաստատված է Աստծո կողմից։ Տղամարդու և կնոջ ամուսնությունը հիմնական մասն է Նրա հավիտենական ծրագրի։
  Երեխաները պետք է ծնվեն ամուսնացած ծնողներից և դաստիարակվեն մոր և հոր կողմից, ովքեր ընդունում են ամուսնության
  խոստումը և հնազանդվում դրան ողջ հավատարմությամբ։ Ընտանեկան կյանքում երջանկության հասնելու ամենամեծ հավանականությունն
  այն դեպքում է, երբ ընտանիքը հիմնված է Տեր Հիսուս Քրիստոսի ուսմունքների վրա։ Հաջողակ ամուսնություններն
  ու ընտանիքները հիմնվում և պահպանվում են հավատի, աղոթքի, ապաշխարության, ներողամտության, հարգանքի, սիրո,
  կարեկցանքի, աշխատանքի և առողջ ու ստեղծարար միջոցառումների սկզբունքներով։ Ըստ աստվածային ծրագրի՝ հայրերը
  պետք է ղեկավարեն իրենց ընտանիքները սիրով ու առաքինությամբ, և պատասխանատու լինեն ապահովելու ընտանիքի
  կենսական կարիքներն ու պաշտպանությունը։ Մայրերը, հատկապես, պատասխանատու են իրենց երեխաների դաստիարակման
  համար։ Այս սուրբ պարտականություններն իրականացնելիս, հայրերն ու մայրերը պարտավոր են օգնել միմյանց որպես
  հավասար գործընկերներ։ Անաշխատունակությունը, մահը կամ այլ իրավիճակները կարող են անհրաժեշտություն առաջացնել,
  որպեսզի փոփոխվեն ընտանիքի համար հոգ տանողների դերերը։ Անհրաժեշտության դեպքում ընտանիքները կարող են ապավինել
  նաև մերձավորների օգնությանը։
- Մենք զգուշացնում ենք, որ այն անհատները, ովքեր խախտում են ողջախոհության ուխտերը, բռնություն են գործադրում
  իրենց կանանց, ամուսինների կամ երեխաների հանդեպ, կամ թերանում են ընտանեկան պարտականությունները կատարելիս,
  մի օր հաշվետու կլինեն Աստծո առջև։ Դեռ ավելին, մենք զգուշացնում ենք, որ ընտանիքի քայքայումը անհատներին,
  համայնքներին և ազգերին կպատճառի այն դժբախտությունները, որոնց մասին կանխագուշակել էին հին ու նոր մարգարեները։
- Մենք դիմում ենք պատասխանատու քաղաքացիներին և կառավարության պաշտոնյաներին ամենուր, որպեսզի պայմաններ
  ստեղծեն և միջոցառումներ անցկացնեն ուղղված ընտանիքների, որպես հասարակության հիմնական միավորների, պահպանմանն
  ու ամրապնդմանը։
