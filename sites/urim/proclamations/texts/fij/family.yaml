title: Na Matavuvale
subtitle: iVakaro iVuravura Raraba
author: Na Mataveiliutaki Taumada kei na Matabose ni iApositolo Le Tinikarua ni Lotu i Jisu Karisito ni
  Yalododonu Edaidai
note: A wiliki na ivakaro oqo me lewe ni nona itukutuku o Peresitedi Gordon B. Hinckley ena Soqoni Raraba
  ni iSoqosoqo ni Veivukei, ka vakayacori ena 23 ni Sepiteba 1995, e Salt Lake City, Utah.
paragraphs:
- Oi keitou na Mataveiliutaki Taumada kei na Matabose ni iApositolo Le Tinikarua ni Lotu i Jisu Karisito
  ni Yalododonu Edaidai, keitou vunautaka tiko ni sa qisia na Kalou me vakawati na tagane kei na yalewa,
  ka ni sa itakele ni nona ituvatuva na Dauveibuli ena nodra icavacava tawamudu na luvena na matavuvale.
- Oi keda yadudua sara na tamata—na tagane kei na yalewa—eda a buli me ucuya na Kalou. Oi keda yadudua
  eda luvena yalewa se tagane lomani vakayalo na noda itubutubu vakalomalagi, ka tu na keda dui ituvaki
  kei na icavacava vakalou. Na noda yalewa se tagane sa dua na tiki bibi ni keda ituvaki kei na keda inaki
  ena bula taumada, bula oqo kei na tawamudu.
- Ena bula taumada, era kila ka dau qarava na Kalou na luvena tagane kei na yalewa vakayalo me vaka ni
  Tamadra Tawamudu ka ciqoma na Nona yavu, ena rawa kina vei ira na Luvena me ra taukena e dua na yago
  vakalewe ka ra bulataka na bula oqo me rawa kina ni ra vinaka sara ka yaco me kila na kedra icavacava
  vakalou, me ra vakaivotavota ena bula tawamudu. Ena vakatara vei keda na ituvatuva vakalou ni bula marau
  me da laki tomana tale na noda veiwekani vakamatavuvale ena tai kadua ni ibulubulu. Na veicakacaka vakalotu
  tabu era tu ena loma ni valetabu ena rawa kina vua na tamata me lesu tale ki na iserau ni Kalou, ka
  vakaduavatataki na matavuvale me tawamudu
- Na isevu ni ivunau a solia na Kalou vei Atama kei Ivi sa baleta na nodrau rawa ni rawata na bula vakaitubutubu
  ena bula vakawati. Keitou vakadeitaka tale, ni se tudei tikoga na ivunau ni Kalou, me da vakatubukawa,
  ka vakatawai vuravura. Keitou vunautaka talega kina ni sa vakarota na Kalou, me rau qai vakayagataka
  walega na isolisoli vakalou oqori me rau vakatubukawa, na tagane kei yalewa ni rau sa vakamautaki vakalawa
  me rau veiwatini.
- Keitou vakaraitaka eke ni sa lewa vakalou na ivakarau ni vakatubukawa. Keitou vakadeitaka na vakalou
  ni bula, kei na kena bibi ena yavu tawamudu ni Kalou.
- Oi rau na veiwatini tagane kei na yalewa sa nodrau itavi bibi me rau veilomani ka dauveikaroni vakairau
  ka vakakina vei ira na luvedrau. “Raica na gone era sa nona isolisoli na [Turaga]” (Same 127:3). Sa
  nodrau itavi tabu na itubutubu me rau susugi ira na luvedrau ena loloma kei na buladodonu, ka vakarautaka
  na veika ni bula vakayago kei na bula vakayalo, ka me ra tuberi talega me ra dau veilomani ka veivukei
  vakaiira, muria na ivakaro ni Kalou, ka dau muria na lawa ni vanua cava ga era bula kina. Era na tarogi
  ena mata ni Kalou na turaga kei na marama vakawati—tama kei na tina—ena vuku ni itavi o ni sa vakacolati
  kina oqo.
- Na matavuvale e ilesilesi va-Kalou. Na nodrau vakawati na tagane kei yalewa sa yaga ki na Nona ituvatuva
  tawamudu. Sa dodonu me ra cadra mai vuravura na gone ena loma ni ivau ni vakamau, ka me ra mai susugi
  mai vua e dua na tama kei na dua na tina ka rau daudoka ena yalodrau dina taucoko na yalayala ni vakamau.
  Ena qai kune na marau ena bula vakamatavuvale ni sa yavutaki ena ivakavuvuli ni Turaga o Jisu Karisito.
  Ni sa yavu ka ivakadei ni bula vakawati kei na matavuvale e tudei na ivakavuvuli ni vakabauta, masumasu,
  veivutuni, veivosovosoti, veidokai, veilomani, yalololoma, cakacaka, kei na golevi ni itavi qaravi vivinaka.
  “Sa lewa vakalou, me ra veiliutaki ena yalololoma na tama ena nodra dui matavuvale, ena loloma kei na
  ivalavala dodonu ka sa nodra itavi talega na kena vakarautaki na veika me ra bula ka ra taqomaki kina
  na nodra matavuvale” (Ensign, Nove. 1995, 102).Sa nodra itavi taumada na tina me ra susugi ira cake
  na luvedra. Ena vuku ni itavi vakalou oqo, era sa vakacolati kina na tama kei na tina me ra veivukei
  ka veitokani tautauvata. Ena rawa ga ni qai moici ni sa yaco na mavoa bibi, mate se so tale na leqa
  vua e dua. Mera qai dau veivukei o ira na wekadra kevaka e gadrevi.
- Keitou vunautaka kina ni o ira na dau beca na ivakarau ni tiko savasava, vakatotogani watidra se luvedra,
  ka sega ni dau vakayacora na nodra itavi vakamatavuvale, ni ra na saumi taro kina vua na Kalou ena dua
  na siga. Me keitou vakadeitaka tale, ni na lutuka na tamata vakayadua, vakaitikotiko, se vakavanua na
  isamu ni dawa ni kena voroki na matavuvale, ka na sotavi kina na veileqa bibi era sa vunautaka tu na
  parofita mai liu, kei ira tale ga nikua.
- Keitou kerei kemuni kina na noda iliuliu vakavanua, kei kemuni na vakailesilesi vakamatanitu e veivanua
  kece sara, mo ni tokona na kena vakavulici na yavu bibi eso oqo, ena vakaqaqacotaki ni matavuvale, me
  yavu bula ni kawatamata.
