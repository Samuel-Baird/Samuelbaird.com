title: المسيح الحَيّ
subtitle: شَهادَة الرُسُلْ
author: كنيسة يسوع المسيح لقديسي الأيام الأخيرة
paragraphs:
- باحْتِفالِنا بذِكرى مِيلاد يسوع المسيح قَبْلَ أَلْفَيْ عام، فإِنَّنا نُقَدِّمُ بذلك شَهادَةً بِحَقِيقَةِ
  حياته المُنْقَطِعَةِ النظيروقُوَةِ ونقاء تَضْحِيَتِهِ الكفارية. لا يُوْجَدُ أَحَدٌ لديه مِثلُ هذا التأَثِير
  العميق مِنْ بَيْنِ جَمِيع مَنْ عاشوا وسوف يعيشون على الأرض.
- كان هو يهوه العهد القديم العظيم، مَسِيحُ العهد الجديد. تَحْتَ توجيه أبيه، كانَ هُوَ خَالِقُ الأَرْضِ.
  ”كُلُّ شيء به كان وبغيره لم يَكُنْ شَيء مما كان“ (يوحنا ١‏:٣). بالرغم من أنه كان خالٍ من الخطيئة إلا
  إنّه تَعَمَدَ لكي يُتَمِمَ كُلّ بِرٍ. مضى ”يَصْنَعُ خَيْراً“ (أعمال الرسل ١٠‏:٣٨)، ومع ذلك فقد ازدُرِيَ
  لأجل ذلك. كان إنجيله رِسالَةً للسلام والوِئام. حَثَنَا جميعاً على أن نَتَبِعَ قُدوته. تَجَوَّلَ في كافَةِ
  طُرُقَ فلسطين بِأَكْمَلِها، شافياً المرضى، دافعاً الأعمى لكي يُبْصِر، ومُقِيماً الموتى. عَلَّمَ حقائِقَ
  الأبدية، حقيقة وجودنا ما قبل الأرضي، الهدف من حياتنا على الأرض، والقُدْرَةَ الكامِنَةِ لأَبْنَاءِ وبَناتِ
  اللّٰه في الحياة المُقبلة.
- أسس مراسيم القُربان كمُذَكِرٍ لِتَضْحِيَتِه الكفارية العَظِيْمة. اعْتُقِلَ واُدِيْنَ باتِهاماتٍ باطِلة،
  حُوْكِمَ إرضاءً للجماهير، وحُكِمَ عليه بالموت على صليب الجلجثة. وَهَبَ حياته لِيُكَفِرَ عن خطايا كافَةِ
  البَشَرِيَةِ. كانت هَدِيَتُه ُأَعْظَمَ هَدِيَةٍ لِصالِحِ جَميْعِ مَنْ سَيَعيشونَ على الأرض.
- نَحْنُ نَشْهَدُ بِإِجْلالٍ بِأنَّ حياتَهُ، والتي هي المحور الأساسي لِتارِيخِ البَشَرِيَةِ بِأَكْمَلِهِ،
  لم تَبْدَأَ في بَيْتِ لَحْمٍ فَحَسْب ولم تَنْتَهِ في الجلجثة—فقط. لقد كان المولود الأول للآب، الابن
  الوحيد في الجسد، فادي العالم.
- قامَ مِنَ القبر ”كي يُصْبِحَ باكورة الراقدين“ (١ كورنثوس ١٥‏:٢٠). كَرَبٍ مُقامٍ، زارَ مَنْ أَحَبَهُم
  في الحياة. خَدَمَ أيضاً بين ”خِرَافِه الأُخْرى“ (يوحنا ١٠‏:١٦) في أمريكا القديمة. في العالم الحديث،
  هو وأباه ظهرا للصبي جوزف سميث، مُفتتحاً رحلة ”ملء الأزمنة“ الموعُوْد بها مُنْذُ زَمَنٍ طويل (أفسس ١‏:١٠).
- 'بخصوص المسيح الحي، كَتَبَ النبي جوزيف: ”وعيناه كانتا كَلَهِيْبٍ مِنَ النار؛ وكان شَعْرُ رأسه يُشبِه
  الثلج الناصِع البياض؛ وَمُحَياهُ فاقَ سُطُوعَ الشمس؛ وصَوْتُهُ كَصَوْتِ خَرِيْرِ مياهٍ كثيرةٍ، حتى صوت
  يهوه وقال:'
- ”أنا هو البداية والنهاية؛ أنا هُوَ الحَيُ، وأنا هُوَ الذي قُتِلَ؛ إني شَفِيْعُكُم مَعَ الآب“ (المبادئ
  والعهود ١١٠‏:٣–٤).
- 'عنه صَرَّح النَّبِيُ أيْضاً: ”والآن بَعْدَ الشهادَات الكثيرة التي أُعْطِيَتْ لَهُ، هذه هي الشهادة،
  في آخر الأمر، التي نُعْطِيها لَهُ: إِنَهُ يحيا!'
- ”لأننا شاهدناه على يمين اللّٰه؛ كما سَمِعْنا صَوْتاً يَشْهَدُ بِأَنَهُ ابن الآب الوحيد—
- ”وبأنّ العوالم به، وبواسطته، ومن أجله خُلِقَت ومازالت تُخلَق وسكانها يولَدون أبناء اللّٰه وبناته“ (المبادئ
  والعهود ٧٦‏:٢٢–٢٤).
- نُصَرِحُ بجدية أن كهنوته وكنيسته اسْتُعِيْدَتا على الأرض—”مبنيين على أساسِ … الرُسُلْ، والأنبياء، ويسوع
  المسيح نفسه حَجَرَ الزاوية“ (أفسس ٢‏:٢٠).
- نَشْهَدُ بِأَنَهُ سوف يَرْجَعُ يَوْماً ما إلى الأرض. ”فَيُعْلَنُ مَجْدُ الرب، ويراه كُلُ بَشَرٍ جميعاً“
  (إشعياء ٤٠‏:٥). فهو سوف يَحْكُمُ كملك الملوك ويَتَسَلَط كَرَبِ الأَرْباب، كُلُ رُكْبَةٍ سَتَجثو وكُلُ
  لسان سَيَعْبُده. كُلُ واحدٍ منّا سيقف ليُحاكَم وِفْقاً لأفعاله ورغبات قلبه.
- نحن نُدلي بشهادة، كرسله المرسومين على نحو مُلائِمٍ—بأن يسوع هو المسيح الحي، الابن الخالد للّٰه. هو الملك
  العظيم عمِانوئيل، الذي يقف اليوم على يمين أبيه. هو نور، حياة، ورجاء العالم. سبيله هو الطريق الذي يقود
  إلى السعادة في هذه الحياة والحياة الأبدية في العالم المُقْبِل. نشكر اللّٰه لهبة ابنه الإلهية المنقطعة
  النظير.
