title: Te Kristo ae Maiu
subtitle: Aia Koaua Abotoro
author: Ana Ekaretia Iesu Kristo ibukiia Aika Itiaki ni Boong aika Kaitira
paragraphs:
- Ngkai ti kauringa bungiakin Iesu Kristo uoua te ngaa te ririki n nako, ti anga ara koaua ni koauan Maiuna
  ae akea kabotauana ao kororaoin Ana angakarea ni Kamaiu ae akea tokina. Akea temanna ae e a tia ni korakora
  ana kakairi iaoia ni kabane ake a tia ni maiu ao ake a na maiu iaon te aonaaba.
- Ngaia bon Iehova ae Korakora n te O Tetemanti, te Meetia n te Nu Tetemanti. Iaan Ana kairiiri Tamana,
  bon Ngaia te tia karika aonaaba. “A bane ni karikaki bwaai i Rouna; ao ngke tao akea Ngaia ao e aki
  karikaki te bwai teuana ae karikaki” (Ioane 1:3). E ngae ngke akea Ana bure, E bwabetitoaki ibukin kakororaoan
  raoiroi ni kabane. E “nakonako ni kakaraoa ae raoiroi” (Mwakuri 10:38), ma e teimatoa ribakina iai.
  Ana euangkerio bon te rongorongo ibukin te rau ao te akoi. E butiia aomata ni kabane bwa a na ira Ana
  banna ni katooto. E nakonako ni kawain Baretain, ni kamaiuiia aoraki, kaurei mataia mataki bwa a na
  noraaba, ao ni kautiia maate. E reirei koaua aika akea tokiia, koauan raoi maiura i mwain te maiu ae
  mamate, te kantaninga ni maiura n te aonaaba, ao te konabwai n rikirake irouia natin te Atua aika mwaane
  ao aine n te maiu ae e na roko.
- E moana karaoan te bootaki n toa bwa te kauring n Ana mwakuri ni Kamaiu. E kabureaki ao ni kabuakakaaki
  ni bukinana aika kaairua, e bukinaki bwa e bure ni karau nanoia taan iowawa, ao ni motikaki taekana
  bwa E na mate iaon te kai i Korokota. E anga Maiuna ni karaoa te mwakuri ni Kamaiu ibukin aia bure aomata
  nako. Maiuna e tei n onea mwiin te bwaintangira ae korakora ibukiia ni kabane ake a maeka ngkoa ngkai
  ao rimwii iaon te aonaaba.
- Ti taekinna ma te nano ni karinerine bwa Maiuna, are te kabanea ni kakawaki n rongorongon te botanaomata,
  e aki moanaki i Beterem ke n toki i Korokota. Bon te Karimoa n Nati iroun te Tama, Ana Rikitemanna n
  te iriko, te Tia Kabooa te aonaaba.
- E uti man te ruanimate bwa “te moa n uaa i buakoia aika matu” (1 I-Korinto 15:20). Ngkai te Uea ae Mangauti,
  E kawariia te koraki ake E tangiriia n Ana tai ni maiu. E karaoa Ana mwakuri naba ibuakoia Ana “tiibu
  tabemwaang” (Ioane 10:16) n te aono n Amerika rimoa. Ni boong aikai, Ngaia ao Tamana a kaoti nakon te
  ataeinimwaane ae Iotebwa Timiti, ni kauka te tai ae e a kaman beritanaki “te mwioko n tararua n tain
  kororaoin bongina” (I-Ebeto 1:10).
- 'Ni kaineti ma te Kristo ae Maiu, E koroboki te Burabeti Iotebwa Timiti: “Matana ai aron uran te ai;
  iran atuuna e mainaina n aekan te tinoo; ao ubuna e oota riki nakon ootan taai; ao bwanaana ai aron
  tangin butin te ran ae korakora, bon bwanaan Iehova, ae kaangai:'
- “Ngai te moan ao te kabanea; Ngai are e maiu, Ngai are e tiringaki; Ngai te tia tei ibukimi iroun te
  Tama” (R&B 110:3–4).
- 'Ibukin Kristo E katanoata naba te Burabeti: “Ao ngkai, i mwin taian kakoaua aika mwaiti ake a kaotaki
  ibukina, aio te kabanea ni kakoaua ngkai, ae ti kaotia ibukina: Bwa e maiu!'
- “Bwa ti nooria, n angatain te Atua; ao ti ongo te bwanaa ae kaota koauana bwa ngaia te Rikitemanna iroun
  te Tama—
- “Bwa mai irouna, ao rinanona, ao irouna, iai aonaaba ao a karikaki, ao kaaina bon naati mwaane ao aine
  aika a manga bungiaki nakon te Atua” (R&B 76:22–24).
- Ti katanoata n taeka ni karinerine bwa Ana nakoanibonga ao Ana Ekaretia a tia ni manga kaokaki nako
  aon te aonaaba—“kateaki i aon taian boua ake … abotoro ao burabeti, ao Iesu Kristo naba te atibu are
  bouan te maninganinga are moan te kakanato” (I-Ebeto 2:20)
- Ti kakoaua bwa E na manga oki nakon te aonaaba n te bong teuana. “Ao e na kaotaki neboakin Iehova, ao
  a na bane aomata n uaia n noria” (Itaia 40:5). E na tautaeka bwa aia King King ao n uea bwa aia Uea
  Uea, ao a na katorobubua bubuaniwae ni kabane ao a na taetae neewe n taromauri i Matana. Ti na bane
  n tei i Matana bwa a na motikaki taekara irouna ni kaineti ma ara mwakuri ao baike a bane nanora iai.
- Ti anga te koaua, ngkai Ana Abotoro aika a tia ni katabuaki—bwa Iesu bon te Kristo ae Maiu, Natin te
  Atua ae maiu n aki toki. Bon ngaia te Uea Emanuera ae kakanato, ae e tei n te bong aei i angatain Tamana.
  Bon ngaia te oota, te maiu, ao te kantaninga n te aonaaba. Kawaina bon te kawai ae kaineti nakon te
  kukurei n te maiu aei ao n te maiu ae akea tokina n te aonaaba ae e na roko. Ke e katituaraoaki te Atua
  ibukin Ana bwaintangira ae akea kabotauana Natina ae Tabu.
