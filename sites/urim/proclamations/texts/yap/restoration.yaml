retrieved: '2026-11-02'
title: Fare Sulyarmen ko Gospel rok Yesus Kristus nike Polo’
subtitle: Ba Proclamation nifan ko Fayleng nike gaman L’agruw Mir’ay e Duw Ngay
author: Fare bin Somm’on e Presidency nge fapi Counsil ko fare Ragag nge L’agruwi Apostle ko Fare Galasia
  ku Yesus Kristus ni Fan ko Gidii’en Got ko Tin Tomur e Rran
note: Fithik e falfalaen’ nge tayfan, gamaed gidii’en e Apostles Rok e gamaed be yoeg ngak gubin e gidii’
  ningan nang—ni woed rogon ni gamaed manang—ni fare tharmiy e kan bing. Ma gamaed be micheg ni Got e
  be dag rogon e murwel Rok ngak pi fak nib tu’uf Rok. Gamaed be micheg ni pi cha’en nra meybil me fil
  mornga’agen fapi mulwol ko fare Sulyarmen me rrin’ ni woed rogon fare mich e ran tawa’ath nagraed ni
  ngeyag ngoraed e biroraed e mich mafan e biney e nge fal’agin rogon fare fayleng ko fare bin Migid e
  Wub ni micheg fare Somoel nge fare Tathapeg, Yesus Kristus.
paragraphs:
- Gamaed be micheg ni Got e ba tu’uf pi fak Rok ni gubin yang u dakean e fayleng nge nam. Got ni Chitamangiy
  e ke pii’ ngodaed fare yafos nib thothup, ndariy reb nib ta’areb rogon ngay, nge fare bayul ni miligach
  ni tay Fak nib Tu’uf Rok, Yesus Kristus. U dakean gelingin e Chitamangiy, Yesus e fos biyay ko yam’.
  I Ir e Tabiyul rodaed, Tagol rodaed, nge Tathapeg rodaed.
- L’agruw mir’ay e duw kafram, ko reb e kadbul riy ko 1820, Joseph Smith, e be gay ko bin ngan e galasia
  e nge un ngay, me yaen nga luwaay ni nge meybil u biyang nib chuchgur ko tabinaew rok u New York, USA.
  Bay e duwer rok ko rogon nrayag ninge thap e yafos rok mab pagan’ ngay nibay Got nra powi’iy.
- U fithik e sobut’aen, gamaed be micheg nikan fulweg taban e meybil rok, Got ni Chitamangiy nge fare
  Fak, Yesus Kristus, e yibi m’ug ngak Joseph min ndag ngak “uringin ban’en riy nge be’echnag” (Acts 3:21)
  ni woed rogon nikan noeg ulan fare Bible. Ko biney e yi’iy, ke fil mornga’agen ni napan tomuren e yam’
  ni tay fa tin nsomm’on e Apostle, Galasia rok Kristus nib be’ech e mathmit u fayleng. Ma Joseph era
  muruwliy ninge fulweg rogon.
- Gamaed be micheg ni u tan pa’ e Chitamangiy nge fare Fak, nge gidii’ nima awfeg e thin e yib u tharmiy
  ni nge yoeg rogon ngak Joseph ni nge sulweg biyay fare Galasia rok Yesus Kristus. John nima Tawfe ni
  foskoyam’ e sulweg yarmen fare tawfe ko ran ni nge chuweg e denen. Dalip nii’ ko fapi ragag nge l’agruwi
  Apostle—Peter, James, nge John—e sulweg yarmen wo’en e apostle nge fapi kiy ko gelngin e priesthood.
  Boech e ki yib, nib mu’un Elijah ngay, ni sulweg yarmen e tabinaew ninge par u ta’abang ni manemus ko
  bin migid e yafos ni gubinfen.
- Ma kagmaed be micheg ni Joseph Smith e ni pi’ ngak fare tawa’ath nge fare gelingin ni yib rok Got ninge
  pilyeg fapi chep ni kakrom—fare Babyor ku Mormon—Kureb e M’ag Rok’ Yesus Kristus. Babyoren e biney e
  babyor e bay mornga’agen e michib rok Yesus Kristus riy ngak e gidii’ ko nam nu Mariken u tomuren ni
  Foskoyam’. Biney e be weliy fan e biney e yafos nge rogon e yalen rok Kristus, ni’ir e bay u lukungun
  e pin’ey nib ga’fan. Ni’ir e bchagil nga ta’abang ko fare Bible, fare Babyor ku Mormon e micheg ni gubin
  e gidii’ ma fak e Chitamangiy nibay u Tharmiy, nibay nike ngongliy ba tonom nifan ngodaed, ma fare Fak,
  Yesus Kristus, e kama non e daba’ ni woed ni kakrom.
- Gamaed be yoeg ni Fare Galasia ku Yesus Kristus ni Fan ko Gidii’en Got ko Tin Tomur e Rran, e ni yarmiy
  ko April 6, 1830, ni’ir fare Galasia Rok Kristus nib Be’ech nike sulyarmen. Biney e Galasia e kan yuluy
  nag nib fel’ rogon nibay e en nib ga’ riy, ni’ir Yesus Kristus, nge fare Bayul Rok nge fare Foskoyam’
  ni tay. Yesus Kristus e ke yarmiy biyay fapi Apostles rok ma ke pii’ ngoraed gelngin e priesthood. Be
  piningdaed ni gubin ningaed bad Ngak nge Galasia Rok, ningan thapeg e Kan ni Thothup, nge fapi gam’ing
  ko thap, nge falfalaen’ ni manemus.
- La’gruw mira’ay e duw ngay e chiney nike Sulyarmen ere Galasia ney nike pii’ Got ni’ir e Chitamangiy
  nge far Fak nib Tu’uf Rok, Yesus Kristus. Bo’or e gidii’ u dakean e fayleng nike michuwean’ ngay ko
  tiney e llowaen’ nge tin ni un prophecy nag.
- Ma kagmaed be micheg ni fare Sulyarmen nikan micheg e kube ul’ul’ iyean nga mm’on u dakean e yi’iy ni
  kabe yib. Dabki sul fare fayleng ninge woed ni ta’ab rogon ko somm’on, napan Got nibe “kunuy nga ta’abang
  urngin banan ngak Kristus.” (Ephesians 1:10).
