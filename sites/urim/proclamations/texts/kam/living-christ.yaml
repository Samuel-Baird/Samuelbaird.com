title: Klĩsto Ũla wĩ Thayũ
subtitle: Ũkũsĩ wa Atũmwa
author: ''
paragraphs:
- Tũitanĩa na kũlilikana ĩsyawa ya Yesũ Klĩsto myaka ngili ilĩ mĩvĩtu, nĩtũkumya ũkũsĩ witũ wa ũw’o wa
  thayũ Wake ũte ngelekany’o na vinya wa ũnene wa nthembo Yake ya wĩw’anĩthyo. Vaiĩ ũngĩ waaĩthĩwa na
  vinya mwingĩ ta ũsu katĩ wa ala mekalile na ala makekala ĩũlũ wa nthĩ.
- Nĩwe waĩ Yeova wa Ũtianĩo Mũkũũ, Masia wa ũla Mweũ. Kwa welekelyo wa Ĩthe Wake, nĩwe waĩ mũmbi wa nthĩ.
  “Syĩndũ syonthe nĩsyatw’ĩkĩthiw’e nĩwe; na atevo vaiĩ kĩndũ ona kĩmwe kyaatw’ĩkĩthw’a katĩ wa ila syatw’ĩkĩthiw’e”
  (Yoana 1:3). Ona vala ndaĩ na naĩ, nĩwavatisiwe eanĩsye ũlũngalu w’onthe. “Nĩwaendaa ekĩte nesa” (Meko
  10:38), ĩndĩ nĩwavũthiw’e kwondũ wa ũu. Ũvoo Wake mũseo wa ũtũmane wa mũuo na ũseo. Nĩwamendethasya
  onthe kũatĩĩa ngelekan’yo Yake. Nĩwaendelaa nzĩanĩ syaVilisiti, aivosya awau, na kũtuma ililinda syona,
  na kũthayũũkya akw’ũ. Nĩwamanyĩasya maũw’o ma tene na tene, ũw’o wa thayũ wa mbee wa ũũ wa kũũ nthĩ,
  vata wa thayũ wa kũũ nthĩ, na vinya wa ana na eĩtu ma Ngai nthĩnĩ wa thayũ ũla ũkoka.
- Nĩwambĩlĩlye Sakalamendi ta ũlilikan’yo wa nthembo Yake nene ya wĩw’anĩthyo. Nĩwakwatiwe na athĩnw’a
  kwondũ wa mavĩtyo ma ũvũngũ, atalĩlwa mavĩtyo nĩkana atanĩthye andũ athũku, na atw’ĩĩwa kũkw’a ngelan’yonĩ
  ya Kaivali aĩvĩe naĩ sya andũ onthe. Nĩwanenganie thayũ Wake kũĩvĩa naĩ sya andũ onthe. Waĩ mũthĩnzĩo
  mũnene Wake wa kwĩyumya vandũ va onthe ala makekala ĩũlũ wa nthĩ.
- Kwa ũlũmu nĩtũũkũsĩĩa kana thayũ Wake, ũla nĩw’o wĩ katĩ wa ngewa syonthe sya andũ, ndwaa-ambĩlĩlya
  Mbethelemu kana ũkathelela Kaivali. Nĩwe waĩ Mwana wa Mbee wa Asa, Mwana Weka nthĩnĩ wa mwĩĩ, Mwovosya
  wa nthĩ.
- Nĩwathayũũkie kuma mbũanĩ “kwĩthĩwa e ũsyao wa mbee wa ala makomete” (1 Ako 15:20). Ta Mwĩaĩi mũthayũũku,
  nĩwathokie katĩ wa ala wendete thayũnĩ wake. Nĩwathũkũmie katĩ wa “malondu angĩ make” (Yoana 10:16)
  nthĩnĩ wa Amelika ya tene. Nthĩnĩ wa nthĩ ya ĩvinda yĩĩ, We na Asa Wake nĩmaumĩlĩle kamwana Joseph Smith,
  kũthokya kũvika walan’yonĩ wa wĩanĩu wa mavinda (Aeveso 1:10) ũla wathanĩtwe tene.
- 'Ĩũlũ wa Klĩsto Ũla wĩ Thayũ, Mwathani Joseph Smith nĩwaandĩkie: “Metho make maĩ ta mwaki; nzuĩ ya mũtwe
  wake yaĩ nzaũ ta ĩa; ũthyũ wake watisaa kũvĩtũka ũtisu wa syũa; na wasya wake waĩ ta wa kĩw’ũ kingĩ
  kĩsembete, ĩĩ wasya wa Yeova, ayasya:'
- “Ninyie mwambĩlĩlyo na mũminũkĩlyo; Ninyie ũla wĩ thayũ, Ninyie ũla wooaiwe; Ninyie mũsili kwa Asa”
  (M&M 110:3-4).
- 'Ĩũlũ wake Mwathani ĩngĩ nĩwaisye: “Nayu, ĩtina wa maũkũsĩ maingĩ ala maanenganwe ĩũlũ wake, ũũ nĩw’o
  ũkũsĩ, wa mũthya, ũla tũũnengane ĩũlũ wake: Kana E thayũ!'
- “Nũndũ nĩtwamwonie, e kw’okonĩ kwa aũme kwa Ngai; na tweew’a wasya ũikũsĩĩa kana nĩwe Mwana wa Asa weka—
- “Kana nĩwe, na kwĩsĩla kwake, na kwondũ wake, nthĩ nĩsyũmbawa na nĩsyoombiwe, na ekali ala mevo nĩ ana
  na eĩtu ma Ngai” (M&M 76:22-24).
- Nĩtũũweta kwa ũneeni mũlũmu kana ũthembi Wake na Ĩkanisa Yake nĩ ndũngĩĩe ĩũlũ wa nthĩ—“yakĩtwe ĩũlũ
  wa mwambĩlĩlyo wa…atũmwa na athani, Yesũ Klĩsto mwene nĩwe yĩla ĩvia ĩnene ya kĩkotonĩ” (Aeveso 2:20).
- Nĩtũũkũsĩĩa kana mũthenya ũmwe akasyoka kũũ nthĩ. “Na ũtheu mũtisu wa Mwĩaĩi ũkavuanw’a, na mĩĩ yonthe
  ĩkawona vamwe” (Isaia 40:5). Akasumbĩka ta Mũsumbĩ wa Asumbĩ na aisumbĩka ta Mwiaĩi wa Eaĩi, na kĩla
  ĩu yĩkatulya ndu na kĩla ũĩmĩ ũkaneena nthĩnĩ wa kũthaitha mbee Wake. Kĩla ũmwe waitũ akaũngama asilĩlwe
  nĩwe kwĩanana na meko maitũ na mawendi ma ngoo sitũ.
- Nĩtũkumya ũkũsĩ, ta Atũmwa ala atw’ĩĩe yu—kana Yesũ nĩwe Klĩsto Ũla wĩ Thayũ, Mwana wa Ngai ũtakw’a.
  Nĩwe Mũsumbĩ mũnene Ĩmanueli, ũla ũũngamĩte ũmũnthĩ kw’okonĩ kwa aũme kwa Asa. Nĩwe kyeni, thayũ, na
  wĩkwatyo wa nthĩ. Nzĩa Yake nĩyo nzĩa ĩla yelekelasya ũtanunĩ nthĩnĩ wa thayũ ũũ na thayũ wa tene na
  tene nthĩnĩ wa nthĩ ĩla ĩkoka. Ngai atũngĩwe mũvea kwondũ wa mũthĩnzĩo wake ũte ngelekan’yo wa Mwana
  Wake mũtheu.
