title: Mũsyĩ
subtitle: Ũtavan’yo kwa Nthĩ
author: ''
note: Ũtavan’yo ũũ wasomiwe nĩ Mũtongoi Gordon B. Hinckley ta kĩlungu kya ũtũmane wake nthĩnĩ wa ĩkomano
  ya onthe ya Ngwatanĩo ya Ũtethya ya Aka Ũla waĩ Mwei wa Kenda 23, 1995, nthĩnĩ wa Salt Lake City, Utah.
paragraphs:
- Ithyĩ, Ũtongoi wa Mbee na Nzama ya Atũmwa Ĩkũmi na Elĩ ma Ĩkanisa ya Yesũ Klĩsto ya Atheu ma Mĩthenya
  ya Mũminũkĩlyo, kwa ũlũmu nĩtũũtavan’ya kana mũtwaano katĩ wa mũndũũme na mũndũ mũka nĩ walan’yo wa
  Ngai na kana mũsyĩ nĩw’o wa vata walan’yonĩ wa Mũmbi kwa mũminũkĩlyo wa tene na tene wa syana Syake.
- Andũ onthe—aka na aũme—mombĩtwe kwa mũvw’ano wa Ngai. Kĩla ũmwe nĩ mwana kana mwĩĩtu mwendwa wa asyai
  ma ĩtunĩ, na, kwa kĩtumi kĩu, kĩla ũmwe e ũngai nthĩnĩ wake na mũminũkĩlyo mũtheu. Kwĩthĩwa wĩ mũndũũme
  kana mũndũ mũka nĩ wũmbo wa vata wa kĩla mũndũ nthĩnĩ wa thayũ wa mbee wa kũka kũũ nthĩ, wa kũũ nthĩ
  na ũvano wa vata na wa tene na tene.
- Nthĩnĩ wa thayũ wa tũtanamba kũka kũũ nthĩ, ana na eĩtu ma kĩveva nĩ mamwĩsĩ na kũmũthaitha Ngai ta
  Asa woo wa Tene na Tene na nĩmeetĩkĩlile walan’yo Wake ũla syana Syake ikatonya kũkwata mĩĩ na ĩngĩ
  kwĩthĩwa na ĩvinda ya kũũ nthĩ na kwĩana kwĩthĩwa me alũngalu na mũthya kwona mũminũkĩlyo woo mũtheu
  ta atiĩwa ma thayũ wa tene na tene. Walan’yo ũũ mũtheu wa ũtanu nũtumaa ngwatanĩo sya mĩsyĩ iendeew’a
  mbee wa mbũanĩ. Maũtw’ĩo matheu na maũtianĩo ala makwatĩkanaa makalũnĩ matheu matumaa vatonyeka kwa
  andũ kũsyoka wĩthĩonĩ wa Ngai na kwa mĩsyĩ kwĩthĩwa vamwe tene na tene.
- Mwĩao wa mbee ũla Ngai wanengie Atamu na Eva wakonetye kwĩthĩwa mena vinya wa ũsyai ta mũũme na mũka.
  Nĩtũũweta kana mwĩao wa Ngai kwa syana Syake wa kũsyaana na kusũsya nthĩ no ũkwatĩlĩĩlwe. Na mbee nĩtũũweta
  kana Ngai nĩ wumĩtye watho kana vinya ũũ mũtheu wa kũsyaa ũtũmĩwe nĩ mũndũũme na mũndũmũka, ala kwĩanana
  na mĩao ya nthĩ matwaanĩte ta mũũme na mũka.
- Nĩtũũweta nzĩa ĩla thayũ wũmbawa nĩ ntheu. Nĩtũũlũlũmĩlya ũtheu wa thayũ na vata waw’o nthĩnĩ wa walan’yo
  wa tene na tene wa Ngai.
- Mũũme na mũka methĩawa na wĩa wĩ mwanya wa kwendana na kũsũvĩana vamwe na syana syoo. “Syana nĩ ũtiĩwa
  kuma kwa Mwĩaĩi” (Savulĩ 127:3). Asyai methĩawa na wĩa mũtheu wa kũea syana syoo kwa wendo na waĩlu,
  kũsyĩanĩsya mavata ma kĩmwĩĩ na ma kĩveva na kũimanyĩsya kwendana na kũthũkũmana syo ene, kwĩw’a mĩao
  ya Ngai, na kwĩthĩwa syĩ ene nthĩ mew’aa mĩao ya nthĩ ĩla syĩkalaa. Aũme na iveti – aanyinyia na aaĩthe
  – makatalĩlwa mbee wa Ngai ũndũ mathũkũmie mawĩa aa.
- Mũsyĩ ũtw’ĩtwe nĩ Ngai. Mũtwaano katĩ wa mũndũũme na mũndũ mũka nĩ wa vata nthĩnĩ wa walan’yo Wake wa
  tene na tene. Syana syaĩle kũsyawa nthĩnĩ wa ngwatanĩo ya mũtwaano, na kũewa nĩ ĩthe na nyinyia ala
  manengae ndaĩa mawĩvĩto moo ma mũtwaano meeyumĩtye vyũ. Ũtanu nthĩnĩ wa mũsyĩ wĩthĩawa yĩla weethĩwa
  wakĩtwe ĩũlũ wa maũmanyĩsyo ma Mwĩaĩi Yesũ Klĩsto. Mĩtwaano na mĩsyĩ ĩla ĩthaĩĩaa yĩthĩawa ĩseũvĩtw’e
  na kũtw’ĩĩkwa nĩ maũmanyĩsyo ma mũĩkĩĩo, kũekanĩa, kũnengane ndaĩa, wendo, tei, ũthũkũmi, na kwĩka maũndũ
  ma kwĩtanĩthya vamwe ta mũsyĩ. Kwa walan’yo mũtheu, maĩthe nĩmaũngamĩaa mĩsyĩ kwa wendo na ũlũngalu
  na nĩ wĩa woo kũnengane syĩndũ ila syendekaa thayũnĩ na kũsiĩĩa mĩsyĩ yoo. Aanyinyia nĩ wĩa woo wa kĩ-kĩthĩo
  wa kũea syana syoo. Nthĩnĩ wa mawĩa aa matheu, aaĩthe na aanyinyia maĩle kũtethan’ya mo ene kwa wĩananu.
  Kwonza, kũkw’a kana itumi ingĩ nitonya kũete ũalyũku wa kĩmũndũ mawĩanĩ aa. Ala ma mũkonyo wa mũsyĩ
  nĩmaĩle kũnengane ũtethyo yĩla wendeka.
- Nĩtũkumya ũkan’yo kana andũ ala matũlaa maũtianĩo ma mwĩkalĩle mũtheu, ala matũmĩaa anyanyae kana syana
  syoo naĩ, kana maleaa kwĩanĩsya mawĩa moo mũthenya ũmwe makaũngama mbee wa Ngai na kumya ũtalo wa wĩa
  woo. Mbeange nĩtũkumya ũkan’yo kana kwanangĩka kwa mũsyĩ kũkaete maũndũ mathũku ala mathanĩtwe nĩ athani
  ma tene na ma ĩvinda yĩĩ nthĩnĩ wa andũ ene, isio na nthĩ mbingĩ.
- Twĩumya wĩtano kwa ene nthĩ ala mekwatĩtw’e na athũkũmi ma selikalĩ kĩla vandũ kũtw’ĩĩka maũndũ ala
  maseũvĩtw’e kũlũlũmĩĩlya mũsyĩ taw’o kĩlungu kya mwambĩlĩlyo wa nthĩ.
