title: Ũtũngĩo wa Wusũu wa Ũvoo Mũseo wa Yesũ Klĩsto
subtitle: Ũtavan’yo kwa Nthĩ wa Kũtanĩa Myaka Maana Elĩ
author: Ũtongoi wa Mbee na Nzama ya Atũmwa Ĩkũmi na Elĩ ma Ĩkanisa ya Yesũ Klĩsto ya Atheu ma Mĩthenya
  ya Mũminũkĩlyo
note: Twĩna ũtaĩo na mũvea, ithyĩ ta Atũmwa Make twĩthokya kĩla ũmwe amanye–ta ũndũ twĩsĩ–kana matu yu
  nĩmavinguku. Nĩtũkũĩkĩĩthya kana Ngai nĩũendeee na kũmanyĩthya ana Make endwa wendi Wake. Nĩtũũkũsĩĩa
  kana ala kwĩsĩla mboyanĩ masomaa ũtũmane wa Ũtũngĩo na mayĩka ũu kwa mũĩkĩĩo makaathimwa kwa kũkwata
  ũkũsĩ woo ene wa ũtheu waw’o na vata waw’o kũmban’ya nthĩ kwa watho wa Kũka kwa Kelĩ kwa Mwĩaĩi na Mũtangĩĩi
  Waitũ, Yesũ Klĩsto.
paragraphs:
- Kwa ũlũmu nĩtũũtavan’ya kana Ngai nĩwendete syana Syake mbaĩnĩ syonthe sya nthĩ. Ngai Asa nũtũnengete
  ũsyawa wa ũngai, thayũ ũte ngelekan’yo, na ũnene wa nthembo ya Mwana Wake Mwendwa, Yesũ Klĩsto.Kwa vinya
  wa Asa, Yesũ nĩwathayũũkie ĩngĩ na kwĩthĩwa na vinya ĩũlũ wa kĩkw’ũ. Nĩ Mũtangĩĩi waitũ, Ngelekan’yo
  yaitũ, na Mwovosya waitũ.
- Myaka maana elĩ mĩvĩtu, kĩokonĩ kyanake kya ĩvinda ya mbua mwaka wa 1820, Joseph Smith e mũnini, aĩmantha
  kũmanya nĩ ĩkanisa yĩva ya kũlika, nĩwaendie kĩthekanĩ kũvoya vakuvĩ na mũsyĩ woo ũla waĩ ngalĩko ya
  ĩũlũ ya New York, nthĩnĩ wa Ngwatanĩo ya nthĩ sya Amelika. Aĩna makũlyo ĩũlũ wa ũtangĩĩo wa thayũ wake
  na ena mũĩkĩĩo kana Ngai nũkũmũtongoesya.
- Kwa ũuu, nĩtũũweta kana nthĩnĩ wa ũsũngĩo wa mboya yake, Ngai Asa na Mwana Wake, Yesũ Klĩsto, nĩmamumĩlĩle
  Joseph na mambĩlĩlya “ũtũngĩo wa maũndũ onthe” (Meko 3:21) ota ũndũ kwaneenetwe Mbivilianĩ. Nthĩnĩ wa
  woni ũũ, nĩwamanyie kana kumana na kĩkw’ũ kya Atũmwa ma mbee, Ĩkanisa ya Klĩsto ya Ũtianĩo Mweũ nĩyaaie
  kũũ nthĩ. Joseph aendaa kwĩthĩwa e mũio nthĩnĩ wa kũyĩtũngĩa.
- Twĩĩkĩĩthya kana ungu wa mwolooto wa Asa na Mwana, atũmwa ma ĩtunĩ nĩmookie kũmũmanyĩsya Joseph na kũũngamya
  Ĩkanisa ya Yesũ Klĩsto ĩngĩ. Yoana Mũvatisi e mũthayũũku nĩwatũngĩĩie ũtonyi wa kũvatisa kwa kũthikwa
  kĩw’ũnĩ kwondũ wa ũekeo wa naĩ. Atatũ ma ala Atũmwa ĩkũmi na elĩ ma mbee–Vetelo, Yakovo, na Yoana–nĩmatũngĩie
  ũtũme na mbungũo sya ũtonyi wa ũthembi. Angĩ nĩmookie, vamwe na Eliya, ũla watũngĩie ũtonyi wa kũkwatan’ya
  mĩsyĩ vamwe nthĩnĩ wa ngwatanĩo ya tene na tene ĩla ĩvĩtũkĩte kĩkw’ũ.
- 'Ĩngĩ nĩtũũkũsĩĩa kana Joseph Smith nĩwanengiwe kĩnengo na vinya wa Ngai wa kũalyũla maandĩko ma tene:
  Ĩvuku ya Momoni–Ũkũsĩ Ũngĩ wa Yesũ Klĩsto. Mathangũ ma maandĩko aa matheu nĩvamwe na ũmanyĩsyo wa ũthũkũmi
  wa Yesũ Klĩsto mwene katĩ wa andũ ma nthĩ sya ũthũĩlonĩ wa syũa ĩvinda ĩkuvĩ ĩtina wa Kũthayũũka Kwake.
  Nĩmanyĩasya vata wa thayũ na nĩyĩmanyĩasya ũmanyĩsyo wa Klĩsto, ũla nĩw’o wa vata nthĩnĩ wa ũmanyĩsyo
  ũũ. Ta maandĩko matheu ngũsĩ ya Mbivilia, Ĩvuku ya Momoni nĩyĩkũsĩĩaa kana andũ onthe nĩ ana ma Asa
  wa Ĩtunĩ ũmendete, na kana Ethĩawa na walan’yo mũtheu kwondũ wa mathayũ maitũ, na kana Mwana Wake, Yesũ
  Klĩsto, nũneenaa ũmũnthĩ ota mĩthenya ya tene.'
- Nĩtũũweta kana Ĩkanisa ya Yesũ Klĩsto ya Atheu ma Mĩthenya ya Mũminũkĩlyo, nĩyambĩlĩlw’e matukũ 6, Mwei
  wa Kana 1830, nĩ Ĩkanisa ya Ũtianĩo Mweũ ya Klĩsto ĩtũngĩe. Ĩkanisa yĩĩ yakĩtwe thayũnĩ mũlũngalu wa
  ĩvia yayo ĩnene ya kĩkotonĩ,Yesũ Klĩsto, na ũnene wa Wĩw’anĩthyo Wake na ũw’o wa Ũthayũũkyo Wake. Yesũ
  Klĩsto ĩngĩ nĩwĩtĩte Atũmwa na nũmanengete ũtonyi wa ũthembi. Nũtũthoketye ithyonthe tũke Kwake na Ĩkanisanĩ
  Yake, kũkwata Veva Mũtheu, maũtw’ĩo ma ũtangĩĩo, na kũkwata ũtanu wa kwĩkala.
- Myaka maana elĩ yu nĩmĩthelu kuma yĩla Ũtũngĩo wambĩlĩlw’e nĩ Ngai Asa na Mwana Wake Mwendwa, Yesũ Klĩsto.
  Mamilioni nthĩ yonthe nĩmetĩkĩlĩte ũmanyi wa maũndũ aa mathane.
- Kwa ũtanu nĩtũũweta kana watho wa Ũtũngĩo nĩũendeee na mbee kwĩsĩla kũendeea kwa ũvuan’yo. Nthĩ ndikethĩwa
  ũu ĩngĩ, nũndũ Ngai “akatũngĩanĩa syĩndũ syonthe nthĩnĩ wa Klĩsto” (Aeveso 1:10).
