title: အသက်ရှင်တော်မူသောခရစ်တော်
subtitle: တမန်တော်များ၏ သက်သေခံချက်
author: ''
paragraphs:
- လွန် လေပြီးသော နှစ်ပေါင်းနှစ်ထောင်ကျော်က မွေးဖွါးခဲ့သော ယေရှခရစ်တော်၏ မွေးနေ့မြတ်အားကျင်းပရာတွင်၊ အတုမဲ့
  သော သူ၏သက်တော်စဉ် နှင့်၊ အဆုံးမဲ့သော သူ၏ ပေးဆပ်တော်မူခြင်း ကို ကျွန်ုပ်တို့အထူးသက်သေခံပါသည်၊၊ ဤလောက၌
  ရှိကြကုန်သော သက်ရှိအပေါင်းနှင့်၊နောင်လာလတ္တံ့သောသက်ရှိအပေါင်းတို့၏အသက် တာ၌ ယေရှုခရစ်တော်ကဲ့သို့ ထူခြားသော
  ပြောင်းလဲခြင်းကို ပေးနိုင်သူ အဘယ်သူမျှမရှိပါ၊၊
- သူသည် ဓမ္မဟောင်း၏ ယေဟောပါ ဖြစ်ပြီး၊ ဓမ္မသစ်၏ကယ်တင်ရှင် လည်းဖြစ်သည်၊၊ခမည်းတော်၏ မှာကြားချက်အတိုင်း ဤလောကကို
  ဖန်းဆင်းခဲ့သူလည်းဖြစ်သည်၊၊ “နှုတ်ကပတ်တော်သည်ခပ်သိမ်းသော အရာတို့ကို ဖန်ဆင်းတော်မူ၏၊၊ ဖန်ဆင်းတော်မူခြင်းနှင့်
  ကင်းလွတ် လျက်ဖြစ်သော အရာတစ်စုံတစ်ခုမျှ မရှိ၊၊” (ရှင်ယောဟန် ၁း၃)၊၊ အပြစ် နှင့် ကင်းသည့်တိုင် ဖြောင့်မတ်ခြင်းတရား
  အလုံးစုံအား ပြည့်စုံစေရန် နှစ်ခြင်းမင်္ဂလာကို သူခံယူခဲ့သည်၊၊ “ကောင်းမှုကို အစဉ်ပြုသော်လည်း” သူတစ်ပါး၏ညှင်းဆဲခြင်းကို
  ခံခဲ့ရသည် (တမန်တော်ပတ္ထု ၁ပး၃၈)၊၊ ငြိမ်သက်ခြင်း၊ ကောင်းမြတ်ခြင်းနှင့် စပ်ဆိုင်သော ဧဂံဂေလိတရား တော်ကို
  သူ ဟောကြားခဲ့သည်၊၊ သူ၏ ပုံဥပမာအတိုင်း အသက်ရှင်ရန် အယောက်တိုင်းကို မေတ္တာထား ဖိတ်ခေါ်ခဲ့သည်၊၊ ပါလစ်စတိုင်းပြည်
  တစ်လျောက်၌ မကျန်းမာသောသူအား ကျန်းမာခြင်း၊ မျက်ကွယ်သူ အားမြင်စေခြင်းနှင့်၊ သေသူအားရှင်ပြန်ထမြောက်ခြင်းကို
  ပေးခဲ့သူ လည်းဖြစ်သည်၊၊ ထာပရ သမ္မာတရားကို သင်ကြားကာ၊ ကျွန်ုပ်တို့ါ၏ အတိတ်ဘပတည်ရှိခဲ့ကြောင်းကို ၄င်း၊
  ယခုဘပ၌ အသက်ရှင်ရခြင်း၏ အဓိပ္ပါယ်နှင့်၊ ဘုရားသားသမီးများဖြစ်သော ကျွန်ုပ်တို့၏ တောက်ပ သော နှောင်ဘ၀အကြောင်းများကိုလည်း
  သွန်သင်ခဲ့သည်၊၊
- သူ၏ ကြီးမားသောပေးဆပ်တော်မူခြင်းကို အောက့်မေ့သတိရစေရန် အလို့ငှါ၊ ပွဲတော်မင်္ဂလာကိုလည်း စတင်တည်ခဲ့သည်၊၊
  ဒုစရိုက်ပြုသူ များတို့၏အလိုတိုင်း၊ ဖမ်းဆီး နှိပ်စက်ခြင်းကို ခံကာ၊ ကာရာနီတောင် ကုန်းပေါ်တွင် ကားတိုင်ထက်၌
  အသေခံခဲ့သည်၊၊ လူသားများ၏အပြစ် အတွက်ပေးဆပ်ရန်မိမိ၏သက်တော်ကိုစွန့်ခဲ့သူလည်းဖြစ်သည်၊၊သူပြု သောအရာကား လောကီလူသားအာလုံးတွက်
  အစားထိုးပေးဆပ် ခြင်းဖြစ်ပေသည်၊၊
- လူ့သမိုင်းကြောင်း၏အချုပ်အခြာ ဖြစ်သော သူ၏ သက်တော်စဉ်သည်၊ ဗက်လဟင်မြို့ငယ်နှင့် ကာရာနီတောင်ကုန်းထက်မက တည်မြဲသည်
  ကို အလေးနက်ထားကာ ကျွန်ုပ်တို့ သက်သေခံပါသည်၊၊ သူသည် ခမည်းတော်၏ အဦးသီးသော၊ တစ်ပါးတည်းသော သားတော်ဖြစ်၍၊
  လောက၏ ကယ်တင်ရှင်လည်းဖြစ်သည်၊၊
- သင်္ချိုင်းတွင်းမှ ထမြောက်၍ “အိပ်ပျော်သောသူတို့တွင် အဦးသီးသော အသီးဖြစ်တော်မူ၏” (ကောရိန္တု သြပါဒစာ ပထမစာစောင်
  ၁၅း၂ပ)၊၊ ရှင်ပြန်ထမြောက်တော်မူပြီးနောက် မိမိနှင့်အတူ အသက်ရှင်ခဲ့သော၊ သူချစ်သောသူများထံသို့တဖန်ကြွရောက်ခဲ့ပါသည်၊၊သူ၏“အခြားသိုး”
  သူဘိသိတ်ထားတော်မူသောတမန်တော်များဖြစ်သော ကျွန်ုပ်တို့သည် ယေရှုသည် အသက်ရှင်တော်မူသော ခရစ်တော်ဖြစ်၍၊ ဘုရားသခင်
  ၏ သားတော်ဖြစ်သည်ကို သက်သေခံပါသည်၊၊ သူသည်ဧမာနွေလ ဘုရင်ဖြစ်ပြီး၊ ခမည်းတော်၏ လက်ယာတော်ဘက်၌ ရပ်နေသူလည်း
  များရှိရာ ရှေးအမေရိကတိုက်၌လည်း သာသနာပြုခဲ့ သည် (ရှင်ယော ဟန် ၁ပး၁၆)၊၊ မျက်မှောက်ကာလတွင် ခမည်းတော်နှင့်အတူ
  ဂတိပြု ထားတော်မူသော “ကာလအချိန် စေ့စုံခြင်း တရားကို” အစပြုရင်း၊ သူငယ် ဂျိုဇက်စမစ်သ်ထံသို့ ကိုယ်ထင်ပြသခဲ့ပါသည်
  (ဧဖက်သြပါဒစာ ၁း၁ပ)၊၊
- အသက်ရှင်တော်မူသော ခရစ်တော်အကြောင်း ပုရောဖက်ဂျိုးဇက် စမစ်သ်ဆိုခဲ့သည်မှာ.. “မျက်လုံးအစုံသည် မီးတောက်ပမာဖြစ်၍၊
  ဆံတော်သည်ကားနှင်းပွင့်သဖွယ်ဖြစ်သည်၊ မျက်နှာတော်သည်၊ နေ ထက်သာ၍ တောက်ပပေသည်၊ အသံတော်ကား အရှိန်အဟုန်ဖြင့်
  စီးသောမြစ်ချောင်းသဖွယ်ဖြစ်ပြီး၊ ယေဟောပါ၏ အသံတော်ပင် ဖြစ်ကာ..
- “ငါသည် အစဖြစ်၍ အဆုံးလည်းဖြစ်၏၊ ငါအသက်ရှင်တော်မူသည်၊ ငါသည်အသေသတ်ခြင်းကို ခံသောသူဖြစ်သည်၊ ငါသည် သင့်အတွက်
  ခမည်းတော်ထံအသနားခံသောသူဖြစ်သည်” (ယုံကြည်ခံယူချက်ကျမ်း ၁၁ပး၃-၄)၊၊
- သူ၏ အကြောင်းပုရောဖက်ကြွေးကြော်ခဲ့သည်မှာ၊ “ယခုမူကား၊များစွာ သော သက်သေခံချက်များရှိခဲ့ပြီးသည့်နောက်၊ ထပ်မံ၍
  နောက်ဆုံး သက်သေခံချက်အားဖြင့် သူ့အကြောင်း ကျွန်ုပ်တို့သက်သေခံသည် မှာ.. သူအသက်ရှင်သည်၊၊
- “အကြောင်းမူကား၊ထိုသူသည်ဘုရားသခင်၏လက်ယာတော်၌ရှိသည် ကို ကျွန်ုပ်တို့မြင်တွေ့ပြီး၊ ဤသူကားငါ၏ တစ်ပါးတည်းသောသားတော်
  ဖြစ်သည်ဟုဆိုသောခမည်းတော်၏အသံတော်ကို ငါတို့ကြားကြသည်၊၊
- “သူ့အားဖြင့် များဝွာသော လောကတို့သည် ဖန်ဆင်းခြင်းကိုခံရကာ၊ ထိုလောကအပေါင်း၌ ရှိသောသူ အပေါင်းတို့သည်လည်း
  ဘုရားသခင် ပိုင်ဆိုင်သော သားသမီးများဖြစ်ကြသည်” (ယုံကြည်ခံယူချက် ကျမ်း ၇၆း ၂၂-၂၄)၊၊
- သူ၏ယဇ်ပုရောဟိတ်အခွင့် နှင့် သူ၏အသင်းတော်သည် ကမ္ဘာမြေကြီး ပေါ်တွင် တဖန်ပြည်လည်တည်ထောင်ပြီးဖြစ်ပြီး “တမန်တော်များတို့
  မှစ၍ ပုရောဖက်များတည်းဟူသော တိုက်မြစ်အပေါ်၌ တည်ဆောက် ကာ၊ တိုက်ထောက်အမြစ်ကျောက်ဖြစ်သော ယေရှုခရစ်တော်ပေါ်၌”
  တည်ဆောက်ထား သည် (ဧဖက်သြပါဒစာ ၂:၂ပ)၊ ဖြစ်ကြောင်းကို လေးနက်စွာ ကျွန်ုပ်တို့သက်သေခံပါသည်၊၊
- တနေ့တွင် ဤကမ္ဘာမြေကြီးသို့ သူတဖန်ကြွဆင်းလာမည့်အကြောင်း ကျွန်ုပ်တို့သက်သေခံပါသည်၊၊ “ထာပရဘုရား၏ ဘုန်းတော်ပေါ်ထွန်း၍
  လူအပေါင်းတို့သည် အတူမြင်ရကြလတံ့” (ဟေရှာယအနာဂတ္တိကျမ်း ၄ပး၅)၊၊ ဘုရင်တကာဘုရင်၊အရှင်တကာအရှင်အဖြစ်စိုးစံအုပ်ချုပ်ကာ၊
  လူအပေါင်း ဒူးထောက်ပြပ်ပပ်လျက် သူ့ကိုချီးမွမ်းမည်ဖြစ်သည်၊၊ ကျွန်ုပ်တို့တစ်ဦးချင်းစီလည်း သူ၏ မျက်မှောက်တော်တွင်
  မိမိတို့ပြုခဲ့ ကျင့်ခဲ့သည်အတိုင်း တရားစီရင်ခြင်းကို ခံရပေမည်၊၊
- ဖြစ်သည်၊၊ သူသည် လောက၏အလင်း၊ အသက်နှင့်မျှော်လင့်ခြင်းလည်း ဖြစ်သည်၊၊ သူ၏လမ်းသည် ယခုဘပနှင့် နောင်ဘပအတွက်ပျော်ရွှင်ခြင်း
  ကိုဦးတည်သောလမ်းဖြစ်သည်၊၊ သားတော်၏အနိုင်းမဲ့ ပေးဆပ်တော်မူ သော ဆုကျေးဇူးကြောင့် ထာပရဘုရား၏ ဘုန်းတော် ချီးမွမ်းခြင်းရှိပါစေ။
date: ဇန်နပါရီလ ၁ရက်၊ ၂ပပပခုနှစ်
