title: ယေရှုခရစ်တော်၏ဧဝံဂေလိတရားတော် အပြည့်အစုံကို ပြန်လည်ဆောင်ယူခြင်း၊
subtitle: လောကသို့ အနှစ်နှစ်ရာမြောက်နှစ်ပတ်လည်ကြေညာချက်
author: ယေရှုခရစ်တော်၏ နောက်ပိုင်းကာလသန့်ရှင်းသူများအသင်းတော်မှ ပထမဥက္ကဌအဖွဲ့နှင့် တမန်တော်တစ်ဆယ်နှစ်ပါးအတိုင်ပင်ခံအဖွဲ့
note: ရိုသေခြင်းနှင့် ကျေးဇူးတင်ခြင်းတို့ဖြင့်၊ ကောင်းကင်ဘုံများ ဖွင့်ထားတော်မူကြောင်း—ကျွန်တော်တို့သိသကဲ့သို့—သိကြစေရန်၊
  ကျွန်တော်တို့ သူ၏တမန်တော်များအနေဖြင့် ခပ်သိမ်းသောသူတို့ကို ဖိတ်ခေါ်ပါသည်။ ဘုရားသခင်က သူ၏ချစ်စွာသောသားများနှင့်သမီးများအတွက်
  သူ၏အလိုတော်ကို ဖော်ပြတော်မူလျက်ရှိကြောင်းကို ကျွန်တော်တို့အတည်ပြုပါသည်။ ပြန်လည်ဆောင်ယူခြင်းသတင်းစကားကို
  ဆုတောင်းခြင်းထက်သန်စွာဖြင့်ဖတ်၍၊ ယုံကြည်ခြင်းဖြင့် ဆောင်ရွက်ကြသူများသည် ထိုဆောင်ယူခြင်း၏ မြင့်မြတ်ခြင်း
  အကြောင်း၊ ထို့အတူ ကျွန်တော်တို့၏ကိုယ်တော်ရှင်နှင့်ကယ်တင်ရှင်၊ ယေရှုခရစ်တော်၏ ကတိတော်လာ ဒုတိယအကြိမ်ကြွလာတော်မူခြင်းအတွက်
  လောကကို ပြင်ဆင်ရန် ထိုဆောင်ယူခြင်း၏ရည်ရွယ်ချက်အကြောင်း သူတို့၏ ကိုယ်ပိုင်သက်သေကိုရရှိရန် ကောင်းချီးခံစားကြရမည်ဖြစ်ကြောင်း
  ကျွန်တော်တို့ သက်သေခံကြပါသည်။
paragraphs:
- ဘုရားသခင်သည် လောကနိုင်ငံတိုင်းရှိ သူ၏သားသမီးများကို ချစ်တော်မူကြောင်း ကျွန်တော်တို့ အလေးအနက်ကြေညာပါသည်။
  အဘဘုရားသခင်သည် ကျွန်တော်တို့အား မြင့်မြတ်သောမွေးဖွားခြင်း၊ အတုမရှိသောဘဝ၊ ထို့အတူ သူ၏ချစ်သား၊ ယေရှုခရစ်တော်၏
  အတိုင်းမသိသောအပြစ်ဖြေခြင်းယဇ်တို့ကို ပေးထားတော်မူခဲ့ပါသည်။ အဘ၏တန်ခိုးတော်အားဖြင့်၊ ယေရှုသည် တစ်ဖန်ထမြောက်၍
  သေခြင်းကို အောင်နိုင်ခဲ့ပါသည်။ သူသည် ကျွန်တော်တို့၏ ကယ်တင်ရှင်၊ ကျွန်တော်တို့၏ပုံသက်သေရှင်၊ ထို့အတူ
  ကျွန်တော်တို့၏ ရွေးနှုတ်ရှင်ဖြစ်ပါသည်။
- လွန်ခဲ့သောနှစ်ပေါင်းနှစ်ရာက၊ ၁၈၂၀ ခုနှစ်၏ လှပသောနွေဦးနံနက်ခင်းတစ်ခုတွင်၊ လူငယ်လေးဂျိုးဇက်သည်၊ မည်သည့်အသင်းတော်နှင့်
  ပူးပေါင်းရမည်ကို သိရန်ကြိုးစားလျက်၊ ယူအက်စ်အေ၊ နယူးယောက်ပြည်နယ်အထက်ပိုင်း ရှိ သူ့အိမ်အနီး တောတန်းထဲသို့
  ဝင်သွားခဲ့ပါသည်။ သူ့စိတ်ဝိညာဉ်၏ ကယ်တင်ခြင်းနှင့်စပ်လျဉ်းသည့် မေးခွန်များ သူ့၌ရှိခဲ့ပါသည်၊ သူ့ကို ဘုရားသခင်လမ်းညွှန်တော်မူလိမ့်မည်ကိုလည်း
  သူယုံကြည်စိတ်ချခဲ့ပါသည်။
- သူ့ဆုတောင်းခြင်း၏အဖြေအဖြစ်၊ အဘဘုရားသခင်နှင့် ယေရှုခရစ်တော် ဂျိုးဇက်စမစ်ထံသို့ ပေါ်လာတော်မူခဲ့ပြီး၊ သမ္မာကျမ်း၌
  ကြိုတင်ဟောပြောခဲ့သည့်အတိုင်း “အလုံးစုံသောအရာတို့ကို အသစ်ပြုပြင်တော်မူခြင်း” (တမန်တော်ဝတ္ထု ၃း၂၁) ကိုခမ်းခမ်းနားနားစတင်ခဲ့ကြောင်း၊
  ကျွန်တော်တို့နှိမ့်ချစွာကြေညာပါသည်။ ဤရူပါရုံ၌၊ သူသိခဲ့ရသည့်အကြောင်းမှာ မူလတမန်တော်များ သေပြီးနောက် ခရစ်တော်၏
  ဓမ္မသစ်အသင်းတော်မှာ မြေကြီးမှ ပျောက်ဆုံးသွားခဲ့သည့် အကြောင်းဖြစ်ပါသည်။ ဂျိုးဇက်သည် ထိုအသင်းတော်ပြန်ရောက်လာခြင်း၌
  အရေးပါသောသူဖြစ်လိမ့်မည်။
- ခမည်းတော်နှင့်သားတော်၏လမ်းညွှန်မှုအောက်၌ ကောင်းကင်တမန်တော်များသည် ဂျိုးဇက်စမစ်ကို လမ်းညွှန်ရန်နှင့်
  ယေရှုခရစ်တော်၏အသင်းတော်ကို ပြန်လည်တည်ထောင်ရန် ကြွရောက်လာခဲ့ကြကြောင်း ကျွန်တော်တို့ အတည်ပြုပါသည်။ အပြစ်များမှလွှတ်ခြင်းအတွက်
  ရေနှစ်မြှုပ်ခြင်းအားဖြင့် ဗတ္တိဇံပေးရန်အခွင့်အာဏာကို ရှင်ပြန်ထမြောက်သော နှစ်ခြင်းဆရာယောဟန်က ပြန်လည်ပေးအပ်ခဲ့ပါသည်။
  မူလတမန်တော်များထဲမှ သုံးဦး—ပေတရု၊ ယာကုပ်နှင့် ယောဟန်—တို့က တမန်တော်ဖြစ်ခြင်းနှင့် ယဇ်ပုရောဟိတ်အခွင့်သော့များကို
  ပြန်လည်ပေးအပ်ခဲ့ပါသည်။ သေခြင်းကိုကျော်လွန်သည့် ထာဝရဆက်သွယ်မှု၌ မိသားစုများကာလအစဉ်အဆက် အတူတကွပေါင်းစည်းရန်
  အခွင့်အာဏာကို ပြန်လည်ပေးအပ်ခဲ့သူ ဧလိယအပါအဝင်၊ အခြားသူများလည်း ကြွရောက်လာခဲ့ကြပါသည်။
- ဂျိုးဇက်စမစ်အား ရှေးမှတ်တမ်း၊ မော်မုန်ကျမ်း—ယေရှုခရစ်တော်အကြောင်း တခြားသော သက်သေခံချက်ကို ဘာသာပြန်ရန်
  ဘုရားသခင်၏ဆုကျေးဇူးနှင့် တန်ခိုးတော်ကို ပေးခဲ့ကြောင်းကိုလည်း ကျွန်တော်တို့ထပ်လောင်း၍ သက်သေခံကြ ပါသည်။
  ဤသန့်ရှင်းမွန်မြတ်သော စာသားစာမျက်နှာများတွင် ယေရှုခရစ်တော် ရှင်ပြန်ထမြောက်ပြီး မကြာမီ၌ ကမ္ဘာအနောက်ဘက်ခြမ်းရှိ
  လူမျိုးတို့၌ သူ၏ ကိုယ်တိုင်အမှုတော်ဆောင်ခြင်း အကြောင်း မှတ်တမ်းတစ်ခု ပါဝင်ပါသည်။ ထိုကျမ်းက ဘဝ၏ရည်ရွယ်ချက်အကြောင်းကို
  သွန်သင်ပေးပါသည်၊ ထိုရည်ရွယ်ချက်၏အဓိကကျောရိုးဖြစ်သည့် ခရစ်တော်၏ဩဝါဒကိုလည်း ရှင်းပြပါသည်။ သမ္မာကျမ်းနှင့်တွဲဘက်
  ကျမ်းစာအဖြစ်၊ မော်မုန်ကျမ်းက လူသားအားလုံးသည် ကောင်းကင်ဘုံရှိချစ်စွာသောအဘ၏ သားများနှင့် သမီးများဖြစ်ကြကြောင်း၊
  ကျွန်တော်တို့ဘဝများအတွက် မြင့်မြတ်သောအစီအစဉ်တစ်ခု သူ့၌ရှိကြောင်း၊ ထို့အတူ သူ၏သားတော်၊ ယေရှုခရစ်တော်သည်
  ရှေးနေ့ရက်များကကဲ့သို့ ယနေ့၌လည်း ဟောပြောတော်မူကြောင်း သက်သေခံပါသည်။
- ၁၈၃၀ ခုနှစ်၊ ဧပြီလ ၆ ရက်နေ့၌ ဖွဲ့စည်းခဲ့သည့် ယေရှုခရစ်တော်၏ နောက်ပိုင်းကာလ သန့်ရှင်းသူများ အသင်းတော်သည်
  ခရစ်တော်၏ ပြန်လည်ဆောင်ယူထားသော ဓမ္မသစ်အသင်းတော်ဖြစ်ကြောင်း ကျွန်တော်တို့ကြေညာပါသည်။ ဤအသင်းတော်သည် မိမိအဓိကထောင့်ကျောက်၊
  ယေရှုခရစ်တော်၊ ထို့အတူ သူ၏အတိုင်းမသိသောအပြစ်ဖြေခြင်းမင်္ဂလာနှင့် မှန်သောရှင်ပြန်ထမြောက်ခြင်းတို့၏ စုံလင်သောဘဝ၌
  စွဲမြဲထားပါသည်။ ယေရှုခရစ်တော်က တမန်တော်များကို နောက်တစ်ဖန်ခေါ်သွင်းတော်မူခဲ့ပြီး၊ ယဇ်ပုရောဟိတ်အခွင့်အာဏာကိုလည်း
  ပေးတော်မူခဲ့ပါသည်။ သူက ကျွန်တော်တို့အားလုံးကို သူနှင့် သူ့အသင်းတော်သို့ လာကြရန်၊ သန့်ရှင်းသော ဝိညာဉ်တော်၊
  ကယ်တင်ခြင်းဘိသိက်မင်္ဂလာများကို လက်ခံရရှိကြရန်နှင့် တည်မြဲသော ဝမ်းမြောက်ခြင်းတို့ကို ရယူကြရန်ဖိတ်ခေါ်ပါသည်။
- ဤပြန်လည်ဆောင်ယူခြင်းကို အဘဘုရားသခင်နှင့် သူ့ချစ်သား၊ ယေရှုခရစ်တော်တို့ အစပြုခဲ့ပြီးကတည်းက ယခုတွင် နှစ်ပေါင်းနှစ်ရာကုန်လွန်သွားခဲ့ပါပြီ။
  ဤပရောဖက်ပြုဟောခဲ့သောအဖြစ်အပျက်များအကြောင်း အသိပညာကို ကမ္ဘာတစ်ဝန်းရှိ သန်းပေါင်းများစွာသောသူတို့က ထွေးပွေ့ကြပါသည်။
- ကတိတော်လာပြန်လည်ဆောင်ယူခြင်းသည် ဆက်တိုက်ဗျာဒိတ်တော်အားဖြင့် ရှေ့သို့တိုးတက်နေကြောင်း ကျွန်တော်တို့ဝမ်းမြောက်စွာကြေညာပါသည်။
  ဘုရားသခင်က “ခပ်သိမ်းသောအရာတို့ကို ခရစ်တော်၌ တစ်လုံးတစ်ဝတည်း အတူတကွစုဝေးတော်မူ” (ဧဖက်ဩဝါဒစာ ၁း၁၀) မည်ဖြစ်သောကြောင့်၊
  မြေကြီးသည် အဘယ်တော့မျှ ယခင်ကကဲ့သို့ ဖြစ်တော့မည်မဟုတ်ပါ။
