title: Obitelj
subtitle: Proglas svijetu
author: Prvo predsjedništvo i Vijeće dvanaestorice apostola Crkve Isusa Krista svetaca posljednjih dana
note: Ovaj je proglas pročitao predsjednik Gordon B. Hinckley kao dio svoje poruke na Općem sastanku Potpornog
  društva održanog 23. rujna 1995. u Salt Lake Cityju, Utah.
paragraphs:
- Mi, Prvo predsjedništvo i Vijeće dvanaestorice apostola Crkve Isusa Krista svetaca posljednjih dana
  svečano proglašavamo da je Bog ustanovio brak između muškarca i žene te da je obitelj u središtu Stvoriteljeva
  nauma za vječnu sudbinu njegove djece.
- Sva su ljudska bića – muškarci i žene – stvorena na sliku Boga. Svatko je ljubljeni duhovni sin ili
  kći nebeskih roditelja i kao takav svatko ima božansku narav i sudbinu. Spol je osnovna karakteristika
  svačije predsmrtne, smrtne i vječne osobnosti i svrhe.
- U predsmrtnome obitavalištu, duhovni sinovi i kćeri poznavali su i štovali Boga kao svojega Vječnog
  Oca te su prihvatili njegov naum po kojem njegova djeca mogu zadobiti fizičko tijelo i steći zemaljsko
  iskustvo kako bi napredovala prema savršenstvu i konačno ostvarila svoju božansku sudbinu kao baštinici
  vječnog života. Božanski naum sreće omogućuje da se obiteljske veze nastave i nakon smrti. Svete uredbe
  i savezi dostupni u svetim hramovima omogućuju pojedincima vratiti se u nazočnost Boga, a obiteljima
  da budu vječno ujedinjene.
- Prva se zapovijed koju je Bog dao Adamu i Evi odnosila na njihovu mogućnost roditeljstva kao muža i
  žene. Mi izjavljujemo da Božja zapovijed njegovoj djeci – da se množe i napuče Zemlju – ostaje na snazi.
  Nadalje izjavljujemo kako je Bog zapovjedio da se sveta moć stvaranja koristi samo između muškarca i
  žene, zakonski vjenčanih kao muž i žena.
- Izjavljujemo da je način na koji se stvara smrtni život božanski određen. Potvrđujemo svetost života
  i njegovu važnost u Božjemu vječnom naumu.
- Muž i žena imaju uzvišenu odgovornost voljeti se i brinuti jedno za drugo, a i za svoju djecu. »Djeca
  su Jahvina baština« (Psalmi 127:3). Roditelji imaju svetu dužnost podizati svoju djecu u ljubavi i pravednosti,
  ispunjavati im fizičke i duhovne potrebe, učiti ih međusobno se voljeti i služiti si, vršiti Božje zapovijedi
  i biti građani koji poštuju zakone gdje god žive. Muževe i žene – majke i očeve – držat će se odgovornima
  pred Bogom za izvršavanje tih obveza.
- Bog je ustanovio obitelj. Brak između muškarca i žene osnova je njegova vječnog nauma. Djeca imaju pravo
  biti rođena u savezu braka te da ih odgajaju otac i majka koji u potpunoj vjernosti poštuju bračni zavjet.
  Sreća će se u obiteljskom životu najprije doseći kada se temelji na učenjima Gospodina Isusa Krista.
  Uspješni brakovi i obitelji uspostavljeni su i održavaju se na načelima vjere, molitve, pokajanja, opraštanja,
  poštivanja, ljubavi, sućuti te kroz rad i zdrave rekreativne aktivnosti. Po božanskoj zamisli, očevi
  trebaju predsjedavati u svojim obiteljima u ljubavi i pravednosti te su odgovorni pribavljati sve neophodno
  za život i zaštitu svojih obitelji. Majke su primarno odgovorne za odgoj svoje djece. U tim svetim odgovornostima,
  očevi i majke obvezatni su pomagati jedno drugome kao ravnopravni partneri. Nemoć, smrt ili druge okolnosti
  mogu zahtijevati pojedinačna prilagođavanja. Kada je potrebno, šira bi obitelj trebala pružiti pomoć.
- Upozoravamo da će pojedinci koji krše saveze ćudorednosti, koji zlostavljaju bračnog druga ili potomstvo,
  ili koji zakažu u izvršavanju obiteljske odgovornosti jednoga dana stajati odgovorni pred Bogom. Nadalje,
  upozoravamo da će raspad obitelji donijeti na pojedince, zajednice i narode nedaće koje su navijestili
  drevni i suvremeni proroci.
- Sve odgovorne građane i vladine službenike pozivamo da promiču one mjere koje su osmišljene podržati
  i ojačati obitelj kao osnovnu jedinicu društva.
