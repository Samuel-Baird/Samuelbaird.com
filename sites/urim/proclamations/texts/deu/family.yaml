title: Die Familie
subtitle: Eine Proklamation an die Welt
author: Die Erste Präsidentschaft und der Rat der Zwölf Apostel der Kirche Jesu Christi der Heiligen der
  Letzten Tage
note: Diese Proklamation wurde von Präsident Gordon B. Hinckley im Rahmen seiner Ansprache bei der Allgemeinen
  Versammlung der Frauenhilfsvereinigung verlesen, die am 23. September 1995 in Salt Lake City stattfand.
paragraphs:
- Wir, die Erste Präsidentschaft und der Rat der Zwölf Apostel der Kirche Jesu Christi der Heiligen der
  Letzten Tage, verkünden feierlich, dass die Ehe zwischen Mann und Frau von Gott verordnet ist und dass
  im Plan des Schöpfers für die ewige Bestimmung seiner Kinder die Familie im Mittelpunkt steht.
- Alle Menschen – Mann und Frau – sind als Abbild Gottes erschaffen. Jeder Mensch ist ein geliebter Geistsohn
  oder eine geliebte Geisttochter himmlischer Eltern und hat dadurch ein göttliches Wesen und eine göttliche
  Bestimmung. Das Geschlecht ist ein wesentliches Merkmal der individuellen vorirdischen, irdischen und
  ewigen Identität und Lebensbestimmung.
- Im vorirdischen Dasein kannten und verehrten die Geistsöhne und -töchter Gott als ihren ewigen Vater
  und nahmen seinen Plan an, nach dem seine Kinder einen physischen Körper erhalten und die Erfahrungen
  des irdischen Lebens machen konnten, um sich auf die Vollkommenheit hin weiterzuentwickeln und letztlich
  als Erben ewigen Lebens ihre göttliche Bestimmung zu verwirklichen. Durch den göttlichen Plan des Glücklichseins
  können die Familienbeziehungen über das Grab hinaus Bestand haben. Heilige Verordnungen und Bündnisse,
  die in einem heiligen Tempel zugänglich sind, ermöglichen es dem Einzelnen, in die Gegenwart Gottes
  zurückzukehren, und der Familie, auf ewig vereint zu sein.
- Das erste Gebot, das Gott Adam und Eva gab, bezog sich darauf, dass sie als Ehemann und Ehefrau Eltern
  werden konnten. Wir verkünden, dass Gottes Gebot für seine Kinder, sich zu vermehren und die Erde zu
  bevölkern, noch immer in Kraft ist. Weiterhin verkünden wir, dass Gott geboten hat, dass die heilige
  Fortpflanzungskraft nur zwischen einem Mann und einer Frau angewandt werden darf, die rechtmäßig miteinander
  verheiratet sind.
- Wir verkünden, dass die Art und Weise, wie sterbliches Leben erschaffen wird, von Gott so festgelegt
  ist. Wir bekräftigen, dass das Leben heilig und in Gottes ewigem Plan von wesentlicher Bedeutung ist.
- Mann und Frau tragen die feierliche Verantwortung, einander und ihre Kinder zu lieben und zu umsorgen.
  „Kinder sind eine Gabe des Herrn.“ (Psalm 127:3; Einheitsübersetzung 1980.) Eltern haben die heilige
  Pflicht, ihre Kinder in Liebe und Rechtschaffenheit zu erziehen, sich ihrer physischen und geistigen
  Bedürfnisse anzunehmen und sie zu lehren, dass sie einander lieben und einander dienen, die Gebote Gottes
  beachten und gesetzestreue Bürger sein sollen, wo immer sie leben. Mann und Frau – Mutter und Vater
  – werden vor Gott darüber Rechenschaft ablegen müssen, wie sie diesen Verpflichtungen nachgekommen sind.
- Die Familie ist von Gott eingerichtet. Die Ehe zwischen Mann und Frau ist wesentlich für seinen ewigen
  Plan. Kinder haben ein Recht darauf, im Bund der Ehe geboren zu werden und in der Obhut eines Vaters
  und einer Mutter aufzuwachsen, die die Ehegelübde in völliger Treue einhalten. Ein glückliches Familienleben
  kann am ehesten erreicht werden, wenn die Lehren des Herrn Jesus Christus seine Grundlage sind. Erfolgreiche
  Ehen und Familien gründen und sichern ihren Bestand auf den Prinzipien Glaube, Gebet, Umkehr, Vergebungsbereitschaft,
  gegenseitige Achtung, Liebe, Mitgefühl, Arbeit und sinnvolle Freizeitgestaltung. Gott hat es so vorgesehen,
  dass der Vater in Liebe und Rechtschaffenheit über die Familie präsidiert und dass er die Pflicht hat,
  dafür zu sorgen, dass die Familie alles hat, was sie zum Leben und für ihren Schutz braucht. Die Mutter
  ist in erster Linie für das Umsorgen und die Erziehung der Kinder zuständig. Vater und Mutter müssen
  einander in diesen heiligen Aufgaben als gleichwertige Partner zur Seite stehen. Behinderung, Tod und
  sonstige Umstände mögen eine individuelle Anpassung erforderlich machen. Bei Bedarf leisten die Angehörigen
  Hilfe.
- Wir weisen warnend darauf hin, dass jemand, der die Keuschheitsbündnisse verletzt, der seinen Ehepartner
  oder seine Nachkommen misshandelt oder missbraucht oder seinen familiären Verpflichtungen nicht nachkommt,
  eines Tages vor Gott Rechenschaft ablegen muss. Weiter warnen wir davor, dass der Zerfall der Familie
  über die Menschen, Länder und Völker das Unheil bringen wird, das in alter und neuer Zeit von den Propheten
  vorhergesagt worden ist.
- Wir rufen die verantwortungsbewussten Bürger und Regierungsvertreter in aller Welt auf, solche Maßnahmen
  zu fördern, die darauf ausgerichtet sind, die Familie als Grundeinheit der Gesellschaft zu bewahren
  und zu stärken.
