title: Иса Мәсіхтің Соңғы Замандағы Әулиелері Шіркеуінің Дін Рәміздері
subtitle: ''
author: ''
verses:
- n: 1
  text: Құдайға, Мәңгілік Әкеге, Оның Ұлы Иса Мәсіхке және Киелі Рухқа біз сенеміз.
- n: 2
  text: Адамдардың Адамның күнәға батқаны үшін емес, өздерінің күнәлары үшін жазаға тартылатынына біз
    сенеміз.
- n: 3
  text: Мәсіхтің өтелуі арқылы барлық адамзат Інжіл заңдары мен арнау рәсімдеріне бағына отырып құтқарылатынына
    біз сенеміз.
- n: 4
  text: 'Інжіл ілімінің ұстанымдары мен арнау рәсімдерінің негіздері ол: біріншіден - Иеміз Иса Мәсіхке
    сену; екіншіден - Тәубеге келу; үшіншіден - Күнәлардан арылу үшін су рәсімінен өту; төртіншіден -
    адамның басына қолды жайлап басып, Киелі Рухты тарту ететініне біз сенеміз.'
- n: 5
  text: Інжіл дінін үгіттеп, арнау рәсімі жұмысын атқару үшін, пайғамбарлық арқылы әулиелік билігіне иеленгендердің
    қолы адамның басына жайлап басылып, адам Құдай арқылы шақырылатынына біз сенеміз.
- n: 6
  text: 'Біз ең әуелгі Шіркеуде болған ұйымға сенеміз, дәлірек айтқанда: апостолдарға, пайғамбарларға,
    пасторларға, ұстаздарға, Інжіл дінін таратушыларға және тағы басқасына.'
- n: 7
  text: Тіл дарындылығына, пайғамбарлыққа, аяндарға, терең зеректікке, сауықтыру күшіне, тіл аударма қабілетіне
    және тағы басқа да сыйына біз сенеміз.
- n: 8
  text: Киелі Кітапта Құдайдың сөзі жазылып, шамамен дұрыс аударылғанына біз сенеміз; тағы біз Мормон
    Кітабы Құдай сөзі деп сенеміз.
- n: 9
  text: Құдай ашқан барлық ашылымдарға, Оның қазіргі ашылымдарының бәріне біз сенеміз және Оның әлі де
    Құдай Патшалығына қатысты талай ұлы және маңызды нәрселер ашатынына да біз сенеміз.
- n: 10
  text: Исраилдің дәлме-дәл жиналатынына және Он Буынның қалпына келетініне; Сионның (Жаңа Иерусалим)
    Америка континентінде орнығатынына; Мәсіхтің жер бетінде тікелей патшалық құратынына және жер жаңарып,
    өзінің жұмақтық даңқына бөленетініне біз сенеміз.
- n: 11
  text: 'Біз Құдіреті күшті Құдайға өзіміздің ар-ожданымыздың үніне сәйкес бас ие алатын артықшылығымыз
    бар екенін жар сала етеміз және барлық адамдарға дәл сол артықшылықты береміз: олардың қалай, қайда
    және неге болсын бас ию өз еркі.'
- n: 12
  text: Біз патшаларға, президенттерге, басқарушыларға, сот өкіметі басқармасына бағыну керектігін және
    заңды кұрмет етіп, ұстанып, қолдайтынымызға сенеміз.
- n: 13
  text: Біз адал, шынайы, пәк, қайырымды, ізгілікті болуға және барлық адамдарға жақсылық жасауға тиіс
    екенімізге сенеміз; шын мәнінде біз Пауылдың өсиеттерін ұстанамыз деп айта аламыз; біз бәріне сенеміз,
    бәріне үміт артамыз; біз көп нәрсені басымыздан өткердік және біз бәріне де төзетінімізге сенеміз.
    Егер ізгілікті, ғажап, құрмет етуге лайық немесе мақтауға тұрарлық бір нәрсе болса, біз соған ұмтылатын
    боламыз.
signature: Жозеф Смит
