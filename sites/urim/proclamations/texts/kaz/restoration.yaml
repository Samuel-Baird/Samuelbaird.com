title: Иса Мәсіхтің Толық Інжілін қалпына келтіру
subtitle: Әлемге екі жүзжылдық туралы хабарлау
author: Иса Мәсіхтің Соңғы Замандағы Әулиелер Шіркеуінің Он екі Апостолдарының Кеңесі мен Бірінші Президенттігі
note: Біз Оның Апостолдары ретінде құрметпен және ризашылықпен барлығын аспан ашық екенін білуге шақырамыз.
  Біз Құдай өзінің сүйікті ұлдары мен қыздары үшін өз еркін білдіретіндігін растаймыз. Біз куәлік етеміз,
  қалпына келтіру хабарды мінажат арқылы танып білетіндер мен сеніммен әрекет ететіндер оның құдайлығы
  туралы өздерінің куәліктерін алып бақытты болады және оның мақсаты-әлемді Иеміз бен Құтқарушымыз Иса
  Мәсіхтің уәде етілген екінші келуіне дайындау.
paragraphs:
- Біз әлемнің кез келген елінде Құдай өз балаларын жақсы көретінін салтанатты түрде жариялаймыз. Құдай
  Әке бізге сүйікті Ұлы Иса Мәсіхтің құдайлық туылуын, теңдесі жоқ өмірін және шексіз төлем құрбандығын
  берді. Әкенің күшімен Иса қайта тіріліп, өлімді жеңді. Ол біздің Құтқарушымыз, біздің Үлгіміз және біздің
  Өтемшіміз.
- Екі жүз жыл бұрын, 1820 жылы көктемнің тамаша ерте таңында, Жозеф Смит қай шіркеуге қосылатынын білгісі
  келіп, АҚШ-тың Нью-Йорк штатындағы үйінің жанында дұға ету үшін орманға барады. Ол өзінің жанын құтқаруға
  қатысты сұрақтары болды және Құдай оны бағыттайды деп сенді.
- Кішіпейілділікпен біз оның дұғасына жауап ретінде Әкеміз Құдай және оның Ұлы Иса Мәсіх Жозефке көрініп,
  Киелі кітапта алдын-ала айтылған барлық нәрсені қалпына келтірудің (Елшіл. Істері 3:21 қара) ұлықтағанын
  мәлімдейміз. Бұл көріністе ол алғашқы Апостолдар қайтыс болғаннан кейін Мәсіхтің Жаңа Өсиет Шіркеуі
  жер бетінен жоғалып кеткенін білді. Оның қайтып келуіне Жозефтің көмегі зор.
- Біз Әке мен Ұлдың басшылығымен көктегі хабаршылар Жозефке нұсқау беріп, Иса Мәсіхтің шіркеуін қайта
  құруға келгенін растаймыз. Су рәсімін орындаушы Жақия күнәлардың кешірілуі үшін су рәсімінен өткен билікті
  қалпына келтірді. Бастапқы он екі Апостолдың үшеуі – Петір, Жақып және Жохан – апостолдықты және діни
  қызметкерлер билігінің кілттерін қалпына келтірді. Басқалары да келді, соның ішінде Ілияс өлімді еңсеретін
  мәңгілік қарым-қатынаста отбасыларды мәңгілікке біріктіру күшін қалпына келтірді.
- 'Ежелгі жазбаларды аудару үшін, Жозеф Смитке Құдайдың сыйы мен күші берілгеніне куәлік етеміз: Мормон
  кітабы – Иса Мәсіхтің тағы бір куәлігі. Осы қасиетті мәтіннің парақтарына Иса Мәсіхтің қайта тірілгеннен
  кейін, көп ұзамай, Батыс жарты шардағы адамдар арасындағы жеке қызметі туралы баяндау кіреді. Ол өмірдің
  мақсаты туралы үйретеді және осы мақсат үшін маңызды болып табылатын Мәсіхтің ілімін түсіндіреді. Киелі
  кітапты толықтыратын Мормон кітабы барлық адамдар сүйіспеншілікке толы Көктегі Әкенің ұлдары мен қыздары
  екенін, Оның біздің өмірімізге арналған құдайлық жоспары бар екенін және Оның Ұлы Иса Мәсіх бұрынғы
  күндердегідей бүгінде сөйлейтініне куәлік етеді.'
- Біз 1830 жылы 6 сәуірде ұйымдастырылған Иса Мәсіхтің Соңғы Замандағы Әулиелер Шіркеуі қалпына келтірілген
  Мәсіхтің Жаңа Өсиеті деп жариялаймыз. Бұл шіркеу оның негізгі ірге тасы Иса Мәсіхтің мінсіз өміріне
  және Оның шексіз Кешіріміне және тура тірілуіне негізделген. Иса Мәсіх тағы бір рет Апостолдарды шақырып,
  оларға діни қызметкерлердің билігін берді. Ол бәрімізді Өзіне және Оның Шіркеуіне келуге, Киелі Рухты,
  құтқару рәсімдерін қабылдауға және тұрақты қуанышқа ие болуға шақырады.
- Осы қалпына келтіруді Құдай Әке мен Оның сүйікті Ұлы Иса Мәсіх бастағаннан бері екі жүз жыл өтті. Әлемдегі
  миллиондаған адамдар осы пайғамбарлық оқиғалар туралы білімді қабылдады.
- Біз уәде етілген қалпына келтіру жалғасқан аян арқылы жүріп жатқанын қуана мәлімдейміз. Құдай ешқашан
  бұрынғыдай болмайды, өйткені Құдай барлық нәрселерді Мәсіхке біріктіреді (Ефестіктерге 1:10 қара).
