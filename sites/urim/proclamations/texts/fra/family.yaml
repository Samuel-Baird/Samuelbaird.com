title: La famille
subtitle: Déclaration au monde
author: La Première Présidence et le Conseil des douze apôtres de l’Église de Jésus-Christ des Saints
  des Derniers Jours
note: Cette déclaration a été lue par Gordon B. Hinckley, président de l’Église, au cours de son discours
  prononcé lors de la réunion générale de la Société de Secours qui s’est déroulée le 23 septembre 1995
  à Salt Lake City.
paragraphs:
- Nous, Première Présidence et Conseil des douze apôtres de l’Église de Jésus-Christ des Saints des Derniers
  Jours, déclarons solennellement que le mariage de l’homme et de la femme est ordonné de Dieu et que
  la famille est essentielle au plan du Créateur pour la destinée éternelle de ses enfants.
- Tous les êtres humains, hommes et femmes, sont créés à l’image de Dieu. Chacun est un fils ou une fille
  d’esprit aimé de parents célestes et, à ce titre, chacun a une nature et une destinée divines. Le genre
  masculin ou féminin est une caractéristique essentielle de l’identité et de la raison d’être individuelle
  prémortelle, mortelle et éternelle.
- Dans la condition prémortelle, les fils et les filles d’esprit connaissaient et adoraient Dieu, leur
  Père éternel. Ils acceptèrent son plan selon lequel ses enfants pourraient obtenir un corps physique
  et acquérir de l’expérience sur la terre de manière à progresser vers la perfection, et réaliser en
  fin de compte leur destinée divine en héritant la vie éternelle. Le plan divin du bonheur permet aux
  relations familiales de perdurer au-delà de la mort. Les ordonnances et les alliances sacrées que l’on
  peut accomplir dans les saints temples permettent aux personnes de retourner dans la présence de Dieu,
  et aux familles d’être unies éternellement.
- Le premier commandement que Dieu a donné à Adam et Ève concernait leur potentiel de parents, en tant
  que mari et femme. Nous déclarons que le commandement que Dieu a donné à ses enfants de multiplier et
  de remplir la terre reste en vigueur. Nous déclarons également que Dieu a ordonné que les pouvoirs sacrés
  de procréation ne doivent être employés qu’entre l’homme et la femme, légitimement mariés.
- Nous déclarons que la manière dont la vie dans la condition mortelle est créée a été ordonnée par Dieu.
  Nous affirmons le caractère sacré de la vie et son importance dans le plan éternel de Dieu.
- Le mari et la femme ont la responsabilité solennelle de s’aimer et de se chérir et d’aimer et de chérir
  leurs enfants. « Les enfants sont un héritage de l’Éternel » (Psaumes 127:3, traduction littérale de
  la King James Version, N.d.T.). Les parents ont le devoir sacré d’élever leurs enfants dans l’amour
  et la droiture, de subvenir à leurs besoins physiques et spirituels, et de leur apprendre à s’aimer
  et à se servir les uns les autres, à observer les commandements de Dieu et à être des citoyens respectueux
  des lois, où qu’ils vivent. Les maris et les femmes (les mères et les pères) seront responsables devant
  Dieu de la manière dont ils se seront acquittés de ces obligations.
- La famille est ordonnée de Dieu. Le mariage entre l’homme et la femme est essentiel à son plan éternel.
  Les enfants ont le droit de naître dans les liens du mariage et d’être élevés par un père et une mère
  qui honorent leurs vœux de mariage dans la fidélité totale. On a le plus de chance d’atteindre le bonheur
  en famille lorsque celle-ci est fondée sur les enseignements du Seigneur Jésus-Christ. La réussite conjugale
  et familiale repose, dès le départ et constamment, sur la foi, la prière, le repentir, le pardon, le
  respect, l’amour, la compassion, le travail et les divertissements sains. Par décret divin, le père
  doit présider sa famille dans l’amour et la droiture, et a la responsabilité de pourvoir aux besoins
  vitaux et à la protection de sa famille. La mère a pour première responsabilité d’élever ses enfants.
  Dans ces responsabilités sacrées, le père et la mère ont l’obligation de s’aider en qualité de partenaires
  égaux. Un handicap, la mort ou d’autres circonstances peuvent nécessiter une adaptation particulière.
  La famille élargie doit apporter son soutien quand cela est nécessaire.
- 'Nous lançons une mise en garde : les personnes qui enfreignent les alliances de la chasteté, qui font
  subir des sévices à leur conjoint ou à leurs enfants, ou qui ne s’acquittent pas de leurs responsabilités
  familiales devront un jour en répondre devant Dieu. Nous faisons également cette mise en garde : la
  désagrégation de la famille attirera sur les gens, les collectivités et les nations les calamités prédites
  par les prophètes d’autrefois et d’aujourd’hui.'
- Nous appelons les citoyens responsables et les dirigeants des gouvernements de partout à promouvoir
  des mesures destinées à sauvegarder et à fortifier la famille dans son rôle de cellule de base de la
  société.
