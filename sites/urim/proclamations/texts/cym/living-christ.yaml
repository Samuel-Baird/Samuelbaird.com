title: Y Crist Byw
subtitle: Tystiolaeth yr Apostolion
author: Eglwys Iesu Grist Saint y Dyddiau Diwethaf
paragraphs:
- Wrth i ni goffáu genedigaeth Iesu Grist ddwy fil o flynyddoedd yn ôl, rhoddwn ein tystiolaeth o wirionedd
  Ei fywyd digymar a nerth anfeidrol Ei aberth mawr a gymodol. Ni chafodd neb arall ddylanwad mor ddwfn
  ag Ef ar bob un sydd wedi byw, ac a fydd yn fyw ar y ddaear.
- Ef oedd Jehofa Mawr yr Hen Destament, ac Eneiniog y Testament Newydd. Dan gyfarwyddyd Ei Dad, Ef a greodd
  y byd. “Daeth pob peth i fod trwyddo ef; hebddo ef ni ddaeth un dim sydd mewn bod.” (Ioan 1:3). Er ei
  fod yn ddibechod, Fe’i bedyddiwyd i gyflawni pob cyfiawnder. “Aeth ef oddi amgylch gan wneud daioni”
  (Actau 10:38), ond cafodd Ei ddirmygu o’i herwydd. Neges o heddwch ac ewyllys da oedd Ei efengyl. Erfyniodd
  ar bob un i ddilyn Ei esiampl. Cerddodd ar hyd ffyrdd Palesteina gan iacháu’r cleifion, gwneud i’r deillion
  weld, ac atgyfodi’r meirw. Dysgodd wirioneddau tragwyddol, gwirionedd ein bodolaeth gynddaearol, pwrpas
  ein bywyd daearol, a’r posibiliadau sydd ar gael i feibion a merched Duw yn y bywyd nesaf.
- Sefydlodd y sacrament i’n hatgoffa o’i aberth mawr a chymodol. Cafodd Ei arestio ar gyhuddiadau di-sail,
  Ei euogfarnu er mwyn bodloni’r dorf, a’i ddedfrydu i farw ar y groes yng Nghalfarî. Rhoddodd Ei fywyd
  i gymodi dros bechodau’r holl ddynolryw. Rhoddodd ei rodd ddirprwyol ar ran pob un sydd wedi byw ac
  a fydd yn fyw.
- Tystiwn yn ddwys na chychwynnodd Ei fywyd, sydd yn ganolog i holl hanes dynol, ym Methlehem, ac na ddaeth
  i ben yng Nghalfarî. Ef oedd Cyntaf-anedig y Tad, yr Unig-anedig yn y cnawd, Gwaredwr y byd.
- Cododd oddi wrth y meirw, “yn flaenffrwyth y rhai sydd wedi huno” (1 Corinthiaid 15:20). Fel yr Arglwydd
  Atgyfodedig, ymwelodd â’r rhai a garodd yn ystod Ei fywyd. Gweinyddodd ymhlith Ei “ddefaid eraill” (Ioan
  10:16) yn yr Hen Amerig. Yn y byd modern, ymddangosodd Ef a’i Dad i’r bachgen Joseph Smith, gan gychwyn
  “goruchwyliaeth cyflawnder yr amseroedd” (Effesiaid 1:10) fel yr addawyd.
- 'Am y Crist Byw, ysgrifennodd y Proffwyd Joseph: “Yr oedd ei lygaid fel fflam dân; gwallt ei ben yn
  wyn fel yr eira pur; ei wyneb yn disgleirio mwy na disgleirdeb yr haul; a’i lais fel sŵn dyfroedd mawr
  yn rhuthro, hyd yn oed llais Jehofa, yn dweud:'
- “Myfi yw’r cyntaf a’r diwethaf; myfi yw ef sydd yn byw, myfi yw ef a lladdwyd; myfi yw eich eiriolwr
  gyda’r Tad” (Athrawiaeth a Chyfamodau 110:3–4).
- 'Amdano Ef, datganodd y Proffwyd ymhellach: “Ac yn awr, wedi’r tystiolaethau lawer a roddwyd amdano
  ef, hon yw’r dystiolaeth, y ddiwethaf oll a roddwn ni amdano ef: Ei fod ef yn fyw!'
- “Canys gwelsom ef, hyd yn oed ar ddeheulaw Duw, a chlywsom y llais yn dwyn tystiolaeth mai ef yw Unig-anedig
  y Tad—
- “Mai ganddo ef, a thrwyddo ef, ac ohono ef y mae ac y cafodd y bydoedd eu creu, a bod eu trigolion yn
  feibion a merched cenedledig i Dduw” (Athrawiaeth a Chyfamodau 76:22–24).
- Datganwn yn ddwys bod Ei offeiriadaeth a’i Eglwys wedi’u hadfer ar y ddaear—wedi’u hadeiladu “ar sylfaen
  yr apostolion a’r proffwydi, a’r conglfaen yw Crist Iesu ei hun” (Effesiaid 2:20).
- Tystiwn y bydd Ef yn dychwelyd i’r ddaear un dydd. “Datguddir gogoniant yr Arglwydd, a phawb ynghyd
  yn ei weld” (Eseia 40:5). Teyrnasa Ef fel Brenin brenhinoedd ac Arglwydd arglwyddi, ac iddo Ef y bydd
  pob glin yn plygu, a phob tafod yn Ei foliannu yn addoliad. Bydd pob un ohonom yn sefyll o’i flaen er
  mwyn iddo Ef ein barnu yn ôl ein gweithredoedd ac ewyllys ein calonnau.
- Tystiwn, fel Ei Apostolion a ordeiniwyd yn briodol—mai Iesu yw’r Crist Byw, Mab anfarwol Duw. Ef yw’r
  Brenin mawr Immanuel, sydd yn sefyll heddiw ar ddeheulaw Ei Dad. Ef yw goleuni, bywyd a gobaith y byd.
  Ei ffordd Ef yw’r llwybr sydd yn arwain at hapusrwydd yn y bywyd hwn a bywyd tragwyddol yn yr oes sydd
  i ddod. Diolch i Dduw am rodd ddigymar Ei Fab dwyfol.
