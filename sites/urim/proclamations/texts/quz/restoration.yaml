retrieved: '2026-11-02'
title: Jesucristoq llumpʼa Evangelion hukmanta Hatarichiynin
subtitle: Iskay pachak watanpi Teqsi Muyuntimpaq huk Rimarimuy
author: Qhepa Pʼunchaykunapi Chanin Runakunaq Jesucristoq Iglesianpi Ñaupaq kaq Umalleqkuna, Chunka Iskayniyuq
  Apostolkunapiwan
note: Umalleq Russel M. Nelsonmi kay rimaykunata ñawincharan 190 Hatun Huñunakuypi, 5 pʼunchay abril killapi
  2020 watapi, Salt Lake City llaqtapi, Utah, EE. UU suyupi.
paragraphs:
- Yupaychaywan rimariyku llapan tecsi muyuntimpi wawankunata Diosqa munakun. Dios Taytaqa willka paqariyta
  qowanchis, Jesucristo churimpa llumpʼa kausayninta mana tukukuq ñakʼariynintapas. Taytaq atipayninwan,
  Jesucristo kausarimuran, wañuytataq atiparan. Paymi qespichiqninchis, paypa ruwasqanta ruwananchis.
  Huchanchiq kacharichiqpiwan.
- Iskay pachaq watañan kan haqay munay pʼunchay 1820 watapi, José Smith wayna ima iglesiaman huñukuyta
  yachayta munaspa, mallkikuna ukhuman haykuspa mañakuran Nueva York suyupi, Estados Unidospi. Paymi nunampa
  qespinanmanta tapukuyta munaran, Diospa pusarinata suyaran.
- Lampʼo rimaywan niyku, chay mañakuyninta kutichinampaq Dios Tayta churin Jesucristopiwan Joséman rikhuriranku,
  hinaspa lliu ruwaykunata hukmanta hatarichiyta qallarichispa (Hechos 3:21) Bibliapi nisqan hina. Chay
  qawariypi José yacharan Apostolkunaq wañusqanku qhepataqa, mosoq testamentopi Cristoq Iglesianqa kay
  pachapi chinkaran, Paytaq kutichimunampaq imaymanakunata ruwanqa.
- Niyku, Taytaq Churinpiwan pusariyninkuwanmi hanaq pachamanta mensajerokuna hamuranku, Joséta yachachinankupaq,
  Jesucristoq Iglesianta hukmanta hatarichinankupaq, Juan Bautista, kausariq runahina, unupi chinkayuspa
  huchakuna pampachanapaq ununchanapaq atipayta kutichimuran, Kinsa Apostolkuna – Pedro, Santiago, Juanpiwan
  – hukmanta hatarichinku apostoladoq sacerdocioq autoridadninta llavenkunata. Hukunapas hamuranku, Elias
  Profetapapas, wasi ayllukuna wiñaypaq wañusqan qhepatapas huñusqalla kanankupaq.
- Sutʼinchaykutaqmi José Smithman Diospa atipayninta qoranku, huk ñaupa qelqakunata tʼikranampaq; Mormon
  Taparata, Otro Testamento de Jesucristo nisqata. Kay willka qhelqa raphikunapi kan Jesucristoq kay emisferio
  occidental nisqapi kausarisqan qhepata ima ruwasqankunamanta willakun. Kay taparan yachachin imapaq
  kay kausaypi kasqanchista, Cristoq doctrinanmantapas yachachiwanchis. Tapara canónico hina Bibliawan
  kuska, Mormon taparaqa sutʼinchan llapanchispa khuyakuq Hanaq Pachapi Taytaq churinkuna ususinkuna kasqanchista,
  kausaynischispaq payqa plan divino kasqanta Ruwan, churin Jesucristotaq kunan rimapaywanchis, ñaupa
  pʼunchaykunapi hina.
- Rimariykun Qhepa Pʼunchaykunapi Chanin Runakunaq Jesucristoq Iglesianqa, hatarichisqa 6 pʼunchay abril
  killapi 1830 watapi, Cristoq Iglesianmi hukmanta hatarichisqa Mosoq Testamentopi kasqanman hina. Kay
  Iglesiaqa Jesucristopi chanin kauysaynimpi qʼemikun kʼiti rumiq hina, mana tukukuq expiaciónnin, cheqaq
  kausayriyninpiwan. Jesucriston huqmanta Apostolkunata waqhan, hinaspa Sacerdocioq atipayninta qon. Paymi
  llapanchista waqhariwanchis Iglesianman hamunanchispaq, Espiritu Santo qespichiq ordenanzakunata chaskinanchispaq,
  wiñaypaq qʼochurikuyta tarinanchispaq.
- Ñan iskay pachaq wataña Dios Tayta, munasqan churin Jesucristopiwan, kay hukmanta hatarichiyta qallarichisqanku.
  Teqsi muyuntimpi askha runakunaña kay ñaupaq rimarisqa yachaykunata chaskinku.
- Qʼochurikuywan niyku hukmanta hatarichisqa purishanmi qati qati Diospa willakuyninwan. Kay pachaqa manan
  haykʼaqpas kikillan kanmanchu, Dios lliuta Cristopi huñusqan rayku. (Efesios 1:10).
- Apostolninkuna hina Yupaychaywan, añaywan, llipinta waqhariyku – ñoqayku yachasqaykuman hina – hanaq
  pachaqa kicharisqan kashan. Niykun Diosmi munasqanta qhawachishan, munasqan churinkunaman ususinkunamanpas.
  Sutʼinchaykun espirituwan mañakuspa Restauracionmanta willakuykunata ñawinchaqkunaqa iñiywan puriqkunapas
  saminchasqan kanqaku, paykunapaq sutʼinchayta chaskinqaku willkasqa kasqanmanta, kay pachata allchaspa
  Wiraqocha Qespichiq Jesucristo hukmanta kutimunampaq.
