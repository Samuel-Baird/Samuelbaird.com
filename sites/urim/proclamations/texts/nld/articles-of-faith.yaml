title: De geloofsartikelen
subtitle: van De Kerk van Jezus Christus van de Heiligen der Laatste Dagen
author: ''
verses:
- n: 1
  text: Wij geloven in God, de eeuwige Vader, en in zijn Zoon, Jezus Christus, en in de Heilige Geest.
- n: 2
  text: Wij geloven dat de mens zal worden gestraft voor zijn eigen zonden en niet voor Adams overtreding.
- n: 3
  text: Wij geloven dat door de verzoening van Christus de gehele mensheid kan worden gered door gehoorzaamheid
    aan de wetten en verordeningen van het evangelie.
- n: 4
  text: 'Wij geloven dat de eerste beginselen en verordeningen van het evangelie zijn: ten eerste, geloof
    in de Heer Jezus Christus; ten tweede, bekering; ten derde, doop door onderdompeling tot vergeving
    van zonden; ten vierde, handoplegging voor de gave van de Heilige Geest.'
- n: 5
  text: Wij geloven dat iemand door God moet worden geroepen, door profetie en door handoplegging van
    hen die daartoe het gezag bezitten, om het evangelie te prediken en de verordeningen ervan te bedienen.
- n: 6
  text: 'Wij geloven in dezelfde organisatie die in de vroegchristelijke kerk bestond, namelijk: apostelen,
    profeten, herders, leraars, evangelisten enzovoort.'
- n: 7
  text: Wij geloven in de gave van talen, profetie, openbaring, visioenen, gezondmaking, uitleg van talen
    enzovoort.
- n: 8
  text: Wij geloven dat de Bijbel het woord van God is, voor zover die juist is vertaald; wij geloven
    ook dat het Boek van Mormon het woord van God is.
- n: 9
  text: Wij geloven alles wat God heeft geopenbaard, alles wat Hij nu openbaart, en wij geloven dat Hij
    nog vele grote en belangrijke dingen over het koninkrijk van God zal openbaren.
- n: 10
  text: Wij geloven in de letterlijke vergadering van Israël en in de herstelling van de tien stammen;
    dat Zion (het Nieuw Jeruzalem) op het Amerikaanse continent zal worden gebouwd; dat Christus persoonlijk
    op aarde zal regeren; en dat de aarde zal worden vernieuwd en haar paradijselijke heerlijkheid zal
    ontvangen.
- n: 11
  text: 'Wij eisen het goed recht de almachtige God te aanbidden volgens de stem van ons eigen geweten,
    en kennen alle mensen hetzelfde goed recht toe: laat hen aanbidden hoe, waar of wat zij willen.'
- n: 12
  text: Wij geloven dat wij het gezag van koningen, presidenten, regeerders en magistraten moeten erkennen
    door de wet te gehoorzamen, eerbiedigen en hoog te houden.
- n: 13
  text: 'Wij geloven eerlijk te moeten zijn, trouw, kuis, welwillend, deugdzaam, en goed te moeten doen
    aan alle mensen; ja, we mogen zeggen dat we de aansporing van Paulus volgen: wij geloven alles, wij
    hopen alles, wij hebben veel verdragen en hopen alles te kunnen verdragen. Als er iets deugdzaam,
    liefelijk, of eerzaam of prijzenswaardig is, dan streven wij dat na.'
signature: Joseph Smith.
