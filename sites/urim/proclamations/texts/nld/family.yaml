title: Het gezin
subtitle: Een proclamatie aan de wereld
author: Het Eerste Presidium en de Raad der Twaalf Apostelen van De Kerk van Jezus Christus van de Heiligen
  der Laatste Dagen
note: Deze proclamatie heeft president Gordon B. Hinckley op 23 september 1995 in de algemene bijeenkomst
  van de zustershulpvereniging in Salt Lake City (Utah, VS) voorgelezen.
paragraphs:
- Wij, het Eerste Presidium en de Raad der Twaalf Apostelen van De Kerk van Jezus Christus van de Heiligen
  der Laatste Dagen, verklaren plechtig dat het huwelijk tussen man en vrouw door God is ingesteld en
  dat het gezin centraal staat in het plan van de Schepper voor de eeuwige bestemming van zijn kinderen.
- Ieder mens – man of vrouw – is geschapen naar het beeld van God. Ieder is een geliefde geestzoon of
  -dochter van hemelse Ouders, en als zodanig heeft ieder een goddelijke aard en bestemming. Het geslacht
  is een essentieel kenmerk van iemands voorsterfelijke, sterfelijke en eeuwige identiteit en doel.
- In het voorsterfelijke leven kenden en aanbaden geestzonen en -dochters God als hun eeuwige Vader. Zij
  aanvaardden zijn plan waardoor zijn kinderen een stoffelijk lichaam konden krijgen. Daardoor konden
  ze op aarde ervaringen opdoen en vooruitgang maken op weg naar volmaking om uiteindelijk hun goddelijke
  bestemming als erfgenaam van het eeuwige leven te verwezenlijken. Het goddelijk plan van geluk maakt
  het mogelijk dat familiebanden ook na de dood blijven bestaan. Heilige verordeningen en verbonden die
  in heilige tempels beschikbaar zijn, maken het mogelijk dat de mens in de tegenwoordigheid van God terugkeert
  en dat het gezin voor eeuwig verenigd wordt.
- Het eerste gebod dat God aan Adam en Eva gaf, had betrekking op hun vermogen om als man en vrouw kinderen
  te krijgen. Wij verklaren dat Gods gebod aan zijn kinderen om talrijk te worden en de aarde te vervullen
  van kracht blijft. Wij verklaren ook dat God geboden heeft dat het heilige voortplantingsvermogen alleen
  gebruikt mag worden tussen een man en een vrouw die wettig met elkaar gehuwd zijn.
- Wij verklaren dat de wijze waarop het sterfelijk leven tot stand komt door God is voorgeschreven. Wij
  bevestigen de heiligheid van het leven en het belang ervan in Gods eeuwige plan.
- Man en vrouw hebben de plechtige taak om van elkaar en van hun kinderen te houden, en voor elkaar en
  hun kinderen te zorgen. Kinderen ‘zijn het eigendom van de Heere’ (Psalmen 127:3). Ouders hebben de
  heilige plicht om hun kinderen in liefde en rechtschapenheid op te voeden, te voorzien in hun stoffelijke
  en geestelijke behoeften, en ze te leren dat ze elkaar moeten liefhebben en helpen, de geboden van God
  moeten naleven, en gezagsgetrouwe burgers behoren te zijn, waar ze zich ook bevinden. De huwelijkspartners
  – de moeder en vader – zullen door God verantwoordelijk worden gehouden voor het nakomen van deze verplichtingen.
- Het gezin is door God ingesteld. Het huwelijk van man en vrouw is van essentieel belang in zijn eeuwige
  plan. Kinderen hebben er recht op om binnen het huwelijk geboren te worden, en te worden opgevoed door
  een vader en een moeder die de huwelijksgelofte met volledige trouw eren. De kans op een gelukkig gezinsleven
  is het grootst als de leringen van de Heer Jezus Christus eraan ten grondslag liggen. Een geslaagd huwelijk
  en een hecht gezin worden gegrondvest op, en in stand gehouden met, de beginselen van geloof, gebed,
  bekering, vergeving, respect, liefde, mededogen, werk en gezonde ontspanning. Volgens het goddelijk
  plan behoort de vader zijn gezin in liefde en rechtschapenheid te presideren. Hij heeft tot taak te
  voorzien in de levensbehoeften en de bescherming van zijn gezin. De taak van de moeder is op de eerste
  plaats de zorg voor de kinderen. Vader en moeder hebben de plicht om elkaar als gelijkwaardige partners
  met deze heilige taken te helpen. Invaliditeit, overlijden of andere omstandigheden kunnen individuele
  aanpassing noodzakelijk maken. Andere familieleden behoren zo nodig steun te verlenen.
- Wij waarschuwen degenen die het verbond van huwelijkstrouw schenden, hun partner of kinderen mishandelen,
  of hun taken in het gezin niet nakomen, dat zij op een dag aan God rekenschap moeten afleggen. Verder
  waarschuwen wij ervoor dat het verval van het gezin de rampen voor personen, gemeenschappen en volken
  tot gevolg zal hebben die de profeten van vroeger en nu voorzegd hebben.
- Wij doen een beroep op burgers en overheidsdienaren met verantwoordelijkheidsbesef overal ter wereld
  om maatregelen te bevorderen die erop gericht zijn het gezin als de fundamentele eenheid van de maatschappij
  te handhaven en te versterken.
