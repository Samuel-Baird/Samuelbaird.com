title: Hɛ̌nnù
subtitle: Gbètàkɛn sɛ́ dó gbɛ̀ ɔ́
author: Nukɔntɔ́zɔ́watɔ́ Nùkɔ̀nnùkɔ̀ntɔ̀n Lɛ́ kpódó Wěɖegbɛ́ Mɛsɛ́dó Wéwé Lɛ́ tɔn kpó Agùn Jezu Klísu
  tɔn Mɛ Mìmɛ́ Azǎn Gǔdógúdó tɔn Lɛ́ tɔn kpó
note: Nukɔntɔ́ Gordon B. Hinckley, wɛ̀ xà gbetà élɔ ɖò xógbé tɔn ɖěe é ná ɖò kplé tɛnmɛ̀ ɖaxó Kplékplé
  Alɔdídó tɔn é nyí bìbló ɖò azàn 23 Zôsùn ɔ́ tɔn mɛ̀ ɖò 1995 ɖò Salt Lake City e.
paragraphs:
- Mǐ, Nukɔntɔ́zɔ́watɔ́ Nùkɔ̀nnùkɔ̀ntɔ̀n Lɛ́ kpódó Wěɖegbɛ́ Mɛsɛ́dó Wéwé Lɛ́ tɔn Agùn Jezu Klísu tɔn Mɛ
  Mìmɛ́ Azǎn Gǔdógúdó tɔn Lɛ́ tɔn kpó, zě gbè yí ji bó ɖɔ̀ kpó dó kándéjí kpó ɖɔ̀ lé alɔwliwlí súnnù kpódó
  nyɔ̌nù kpó tɔn ɔ́ nyí sɛ́n Mǎwǔ tɔn lobɔ hɛ̌nnù ɔ́ ɖò tàji nú tuto Gbɛɖotɔ́ ɔ́ tɔn nú hɛ̀ndowà mavɔmavɔ
  vǐ tɔn lɛ́ tɔn.
- Gbɛtɔ́ lɛ́ bí, súnnù kpó nyɔ̌nù kpó, nyí biblo ɖó akpàjlɛ Mǎwǔ tɔn mɛ̀. Mɛ ɖokpó ɖokpó nyí vǐ súnnù
  kpó vǐ nyɔ̌nù yɛswí mɛ̀ tɔn yǐ wàn nà mɛjítɔ́ sɛ́wxé tɔn lɛ́ tɔn, bɔ, ɖó mɔ wú ɔ́, mɛ ɖokpó ɖokpó ɖò
  ninɔmɛ̀ kpódó hɛndówá ná dó cí Mǎwǔ dɔhùn. Súnnù alǒ nyɔ̌nù nyínyí ɔ́ ninɔmɛ̀ taji mɛbǔnɔ̀ tɔn wɛ é
  nyí, bo lɛ́ nyí nǔ e zɔ́n bɔ mǐ mɛ dokpo dokpo nyí yɛ̀, cobɔ mǐ jɔwa ayihɔn mɛ̀, bo na lɛ́ wá yí gbɛ̀
  mavɔmavɔ e.
- Cobɔ mǐ ná jɔwa ayihɔn mɛ̀ ɔ́, vǐ súnnù kpó vi nyɔ̌nù kpó ko tunwun bó ko nɔ̀ sɛ̀n Mǎwǔ Tɔ́ Mavɔmavɔ
  yětɔn. Yě ko yígbé nú tutomɛ tɔn e jló ɖɔ̀ vǐ tɔn lɛ́ ná mɔ agbazà lànnɔ̀ kpodó jɔdɔmɛwù kpó yí ɖò ayǐkúngbán
  jí bo ná sixú yì nukɔn ɖò nùvɔ́déwú sìn alì jí, bó ná dó wà bló hɛndówá ná dó nyí Mǎwǔ dɔhùn dó gbɔ̀n
  gbɛ̀ mavɔmavɔ sín gǔ ɖùɖù mɛ̀. Tutomɛ fɛ́nú tɔn ɖěe Mǎwǔ bló ɔ́ nɔ̀ hɛn kàn cicà hɛ̌nnù tɔn lɛ́ do té
  kaka sɔ́yi kú gǔdo. Sɛ́nnúwiwà kpódó akɔ̀jijɛ̀ mìmɛ́ lɛ́ ɖěe è nɔ bló ɖò tɛ́mpli mìmɛ́ lɛ́ mɛ̀ ɔ́ nɔ́
  zɔ̀n bɔ mɛ lɛ́ nɔ sixú lɛ́kɔ yi Mǎwǔ sín nùkɔn, bɔ hɛ̌nnù lɛ́ nɔ́ sixú nɔ̀ kpɔ́ kaka sɔ́yi mavɔmavɔ.
- Sɛ́n nùkɔntɔ̀n, ɖěe Mǎwǔ ná Adámu kpó Ɛvu kpó ɔ́ kàn mɛjitɔ́ nyí nyí yětɔn, ɖi asú kpó asì kpó. Mǐ ɖe
  gbetà ɖɔ̀ sɛ́n ɖěe Mǎwǔ ná vǐ tɔn lɛ́ ɖɔ̀ yě ni jǐgbà bó gɔ́ ayǐkúngbàn jí ɔ́ kpó ɖò azɔ̌ nú. Mǐ lɛ́vɔ
  ɖe gbetà ɖɔ̀ Mǎwǔ degbé ɖɔ̀ súnnù kpó nyɔ̌nù kpó, ɖěe ko dà yě ɖé lɛ́ ɖò sɛ́n nukɔ̀n ɔ́ kɛdɛ wɛ̀ ɖó
  ná zǎn acɛ vǐjíjí tɔn.
- Mǐ ɖè gbetà ɖɔ̀ alɔkpà ɖěe gbɛ̀ agbazamɛ tɔn nyí dídá gbɔ̀n ɔ́ Mǎwǔ wɛ̀ ɖégbé tɔn. Mǐ ɖekúnnu ɖɔ̀ nǔ
  mìmɛ́ wɛ̀ é nyí bó nyí tají ɖò tutomɛ mavɔmavɔ Mǎwǔ tɔn mɛ̀.
- Asú kpódó asì kpó dó nà yí wàn nù yě ɖé lɛ́, bó bɔ́ɖɔ́ yě ɖé lɛ́, yě ɖó ná lɛ́ yí wàn ná bó bɔ́ɖɔ́ vǐ
  yětɔn lɛ́ ɖò dàndàn mɛ̀. « Vǐ lɛ́ ɔ́ gǔɖúɖú Aklúnɔ tɔn wɛ̀ yě nyí » (Ɖɛhan 127:3, lilɛdógbeɖevomɛ sɔgbe
  xá tlɔ̀lɔ̀ vɔbló glɛnsígbè Axɔ́sú Jaki tɔn). E ɖò dàndàn mɛ̀ ɖɔ̀ mɛjitɔ́ lɛ́ ní kplɔ́n vǐ yětɔn lɛ́
  ɖò wànyíyí kpó jlɔ̌jlɔ́ kpó mɛ̀, bó kpénùkún hǔdònù yětɔn agbàzamɛ tɔn kpódó yɛswí mɛ̀ tɔn lɛ́ kpó wú,
  bó kplɔ́n yě nà dó yí wàn nú yěɖee lɛ́ bó d’alɔ̀ yěɖee lɛ́, nà dó nyì sɛ́n Mǎwǔ tɔn lɛ́ bó nyí tòví
  sɛ́n nyí tɔ́ lɛ́, ɖò fí ɖěbǔ e yě sáxwé dó e. Asú lɛ́ kpódó asì lɛ́ kpó (vǐnɔ̀ kpódó vǐtɔ̀ kpó) ná ɖó
  gbè nú Mǎwǔ dǒ alɔkpà ɖěe yě wà dandanzɔ́ yětɔn nɛ́ lɛ́ gbɔ̀n e wú.
- Hɛ̌nnù ɔ́ sɛ́n sɔ́ ɖǒ ayǐ Mǎwǔ tɔn wɛ̀. Alɔwlíwlí ɖò súnnù kpódó nyɔ̌nù kpó tɛ́ntin ɔ́ ɖò tají nú tuto
  tɔn mavɔmavɔ. Vǐ lɛ́ ɖó ná jɔ̀ ɖò kàn cicà alɔwlíwlí tɔn mɛ̀ bó nà yí kplɔ́n ɖò tɔ́ kpódó nɔ̀ é nɔ nɔ̀
  gbedjí nú alɔwlíwlí yětɔn ɖò nùgbó kpíkpé mɛ̀ lɛ́ sí. È ɖǒ taɖagbe hǔgǎn bó ná dó mɔ nyɔ̌na ɖò hɛ̌nnù
  mɛ̀ nú è sɔ́ ɛ lídǒ ɖó nǔkplɔ́nmɛ Aklúnɔ Jezu Klísu tɔn lɛ́ jí ɔ́. Alɔwlíwlí xó, kpódó hɛ̌nnù xó kpó
  ná kpà mɛ sín bibɛmɛ kaka sɔ́yi ɔ́ é ɖó ná jíjɔ́n nǔɖíɖí, ɖɛ̀xixo, hwɛ̀vɛ́númɛ, hwɛ̀sɔkɛ̀mɛ, sísí, wànyíyí,
  nǔbláwúkúnúmɛ, azɔ̌wíwà kpódó ayihúndídà mímɛ̀ lɛ́ kpó jí. Gbɔ̀n gbètàsɛ́n Mǎwǔ tɔn mɛ̀ ɔ́, tɔ́ ɖó ná
  kpà acɛ̀ ɖó hɛ̌nnù tɔn ji ɖò wànyíyí kpódó jlɔ̌jlɔ́ kpó mɛ̀ bó ɖóná lɛvɔ kpé nùkún gbɛ̀hǔdó kpó alɔcíɔndó
  yě tɔn kpó wú. Nɔ̀ sìn dandanzɔ nukɔntɔ̀n ɔ́ wɛ̀ nyí ɖɔ̀ é ná kplɔ́n vǐ tɔn lɛ́. Ɖò dandanzɔ yětɔn énɛ
  lɛ́ mɛ̀ ɔ́, tɔ́ kpódó nɔ̀ kpó ɖó ná d’alɔ̀ yěɖee lɛ́ ɖi nùwàɖokpòtɔ́ zɛnzɛn ɖɔ́hùn. Wɔ̀ngblě, kú alǒ
  nǔwàmɛ ɖěvó lɛ́ sixú zɔ́n bɔ tuto élɔ lɛ́ nà ɖyɔ́. Hɛ̌nnù ɖaxó ɔ́ ɖó ná d’alɔ̀ hwenu e è ná byɔ́ dó
  ɔ́.
- 'Mǐ ná akpágbánúmɛ ɖɔ̀ : mɛ ɖěe nɔ gbà alɛnù alɔjínìnɔ̀ tɔn lɛ́, bó nɔ dó wǔvɛ lanmɛ̀ nú asú, asì alǒ
  vǐ yětɔn lɛ́ ɔ́, alǒ ɖěe mɔ̀ nɔ̀ wà dandanzɔ hɛ̌nnù mɛ̀ tɔn yě tɔn lɛ́ ǎ ɔ́, ná wá ɖógbè gbèdókpó nú
  Mǎwǔ. Mǐ lɛ́vɔ́ ná akpágbánúmɛ élɔ ɖɔ̀ : hɛ̌nnù hɛ̌ngblé ɔ́ ná dɔ̀n awěxomɛ e gbeyíɖɔ̀ xóxó lɛ́ kpó
  égbe tɔn lɛ́ kpó kó ɖɔ̀ɖayí e ɖó mɛ lɛ́ jí, hɛ̌nnùmɔ lɛ́ jí kpódó tó lɛ́ jí.'
- Mǐ dó gbè hwán nyì dó tòví ɖagbe lɛ́ kpódó acɛ̀kpikpà tò lɛ́ bǐ tɔn kpó wɛ̀ ɖɔ̀, yě ní wà vlɔ̌n kàn
  nú jlɛ̌ kpódó sɛ́n e nɔ hwlɛ̌n hɛ̌nnù gǎn bó nɔ̀ dó gàn nì ɖò, azìnkan dódó tókpikplé tɔn sín azɔ̌ tɔn
  mɛ̀ ɔ́.
