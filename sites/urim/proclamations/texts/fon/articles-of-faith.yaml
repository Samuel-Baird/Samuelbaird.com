title: sín Nǔɖíɖíxó lɛ́
subtitle: Agùn Jezu Klísu tɔn Mɛ Mìmɛ́ Azǎn Gǔdógúdó tɔn Lɛ́ tɔn
author: ''
verses:
- n: 1
  text: Mǐ ɖìnǔ nú Mǎwǔ, Tɔ́ Mavɔmavɔ, bó ɖìnǔ nú Vǐ tɔn Jezu Klísu bó lɛ́ ɖìnǔ nú Yɛ̀sinsɛ̀n Mìmɛ́.
- n: 2
  text: Mǐ ɖìnǔ ɖɔ̀ è nǎ ɖɔ̀ hwɛ̀ xá gbɛtɔ́ lɛ́ bǐ ɖó hwɛ̀ yě désúnɔ̀ tɔn lɛ́ wú, bɔ é nyí Adámu sín sɛ́n
    gbigba ǎ.
- n: 3
  text: Mǐ ɖìnǔ ɖɔ̀, gbɔ̀n fɛ́nú hwɛ̀xɔ́súsú Klísu tɔn mɛ̀ ɔ́, gbɛtɔ́ lɛ́ bǐ sixú mɔ̀ hwlɛ̌ngán gbɔ̀n
    tónúsise nú sɛ́n lɛ́ kpódó sɛ́nnúwiwà Wɛ̀nɖagbe ɔ́ tɔn lɛ́ kpó.
- n: 4
  text: 'Mǐ ɖìnǔ ɖɔ̀ nǔgbódòdó lɛ́ kpódó sɛ́nnúwiwà Wɛ̀nɖagbe ɔ́ tɔn lɛ́ kpó wɛ̀ nyí : nukɔntɔn ɔ́ nǔɖíɖí
    nú Aklúnɔ Jezu Klísu ; wegɔ́ ɔ́ hwɛ̀vɛ́númɛ ; atɔngɔ́ yɛ̀hwèsinlilɛ̀ bó búta bǐ do mɔ̀ hwɛ̀ sɔ́ kɛ
    ; ɛnɛ̀gɔ́ alɔ̀ sɔ́ ɖó ta nú mɛ dó yí nǔnámɛ Yɛ̀sinsɛ̀n Mìmɛ́ tɔn.'
- n: 5
  text: Mǐ ɖìnǔ ɖɔ̀ Mǎwǔ ɖó na ylɔ́ mɛ gbɔ̀n gbeyíɖɔ̀tɔ́ jí, kpódó alɔ̀ sɔ́ ɖó ta nú mɛ yě mɛ e ɖó acɛgbè
    Mǎwǔ tɔn lɛ́ tɔn, bó ná dó jlá Wɛ̀nɖagbe ɔ́ alǒ bó ná dó bló sɛ́nnúwiwà Wɛ̀nɖagbe ɔ́ tɔn lɛ́ nú mɛ
    děvo.
- n: 6
  text: 'Mǐ ɖìnǔ nú tito ɖokpó ɔ́ ɖěe ko ɖè ɖò Agùn xóxó ɔ́ hwenu ɔ́, do tunwun : mɛsɛ́dó, gbeyíɖɔ̀, lɛ̀ngbɔ́nyítɔ́,
    nǔkplɔ́nmɛtɔ́, wɛ̀nɖagbejlátɔ́ lɛ́, kpó yě mɛ ɖěe kpò lɛ́ kpó.'
- n: 7
  text: Mǐ ɖìnǔ nú nǔnámɛ gbè tɔn lɛ́, gbeyíɖɔ̀tɔ́ lɛ́, nǔɖéxlɛ́mɛ lɛ́, nǔmimɔ lɛ́, azɔngbigbɔ lɛ́, gbetímɛtɔ́
    lɛ́, kpó ɖěe kpò lɛ́ kpó.
- n: 8
  text: Mǐ ɖìnǔ ɖɔ̀ Biblu ɔ́ Mǎwǔ xó wɛ̀ é nyí nú è tínmɛ̀ bɔ é sɔ̀gbè ɔ́ ; mǐ ɖìnǔ ɖésú ɖɔ̀ Mɔlmɔ́ɔwémà
    ɔ́ Mǎwǔ xó wɛ̀ é nyí.
- n: 9
  text: Mǐ ɖìnǔ nú nǔmimɔ e Mǎwǔ ɖéxlɛ́ lɛ́ bǐ, nǔ ɖěe é ɖéxlɛ́ wɛ̀ é ɖè din lɛ́, bɔ mǐ lɛ́ ɖi nǔ nú nǔ
    gègé ɖěe é ná wá ɖéxlɛ́ mǐ lɛ́, nǔ ɖaxó lɛ́ kpó nǔ tají e kan axɔ́súɖuto Mǎwǔ tɔn lɛ́ e.
- n: 10
  text: Mǐ ɖìnǔ nú kpíkplé Izlayɛ́li tɔn kpódó kpíkplé akɔta wǒ lɛ́ tɔn kpó. Mǐ ɖìnǔ ɖɔ̀ è ná sáxwé nú
    Sinyɔ́ɔ (Jeluzalɛ́mu Yɔ́yɔ́) ɔ́ ɖó Amelika sín ayǐkúngban ɔ́ jí, bɔ Klísu ɔ́ ɖésú ná ɖu axɔ́sú ɖò
    ayǐkúngban ɔ́ jí, bɔ ayǐkúngban ɔ́ ná húzú bó yí susu sɛ́xwétɔn.
- n: 11
  text: 'Mǐ ɖɔ̀ mǐ ɖó acɛ̀ e sɛ̀n Mǎwǔ Nǔbǐwùkpétɔ́ ɔ́ gbɔ̀n lěe ayi mǐtɔn lin gbɔ̀n ɔ́ bó tunwun ɖɔ̀
    gbɛtɔ́ lɛ́ bǐ ɖó acɛ̀ énɛ ɔ́ : ɖɔ̀ è sɛ̀n ɖěe jlǒ mɛ gbɔ̀n, fí e jlǒ mɛ ɖè, ɖěe è ba gbɔ̀n è ɖè ɔ́.'
- n: 12
  text: Mǐ ɖìnǔ ɖɔ̀ mǐ ɖó ná sɔ́ mǐɖěe hwè nú axɔ́sú lɛ́, to nukɔntɔ́ lɛ́, kpódó sɛ́nkplɔ́nmɛtɔ́ lɛ́ kpó,
    bɔ mǐ ɖó na ɖó sísí bó wlǐ yɛ̀yí bó jɛ̀ ahwàn dó sɛ́n lɛ́ jí.
- n: 13
  text: 'Mǐ ɖìnǔ ɖɔ̀ mǐ ɖó ná nyí ayi jlɔ́jlɔ́nɔ̀, gbejínɔtɔ́, alɔjínɔtɔ́, wàlɔ̀ ɖagbenɔ̀, jijɔɖagbenɔ̀,
    bɔ mǐ ɖó ná wa ɖagbe nú gbɛtɔ́ lɛ́ bǐ ; mǐ hɛ̀n ɔ́, mǐ ná ɖɔ̀ nǔkplɔ́nmɛ Pɔ́lu tɔn xwedó wɛ̀ mǐ ɖè
    : mǐ ɖìnǔ nú nǔ bǐ, mǐ ɖò nukúnɖíɖó mɛ̀ nú nǔ bǐ, mǐ kpan akɔ́n ɖò nǔ gègé nukɔn bɔ mǐ ɖò nukúnɖíɖó
    mɛ̀ ná sixú lɛ́ kpankɔn ɖò nǔ bǐ mɛ̀. Mǐ nɔ́ ba nǔ e è nǎ ɖó sísí ná é, bó jɛ xá susu e, abǐ nǔ e
    nyì kpipkanɔ̀, bó nyɔ́ ɖɛkpɛ e.'
signature: Joseph Smith.
