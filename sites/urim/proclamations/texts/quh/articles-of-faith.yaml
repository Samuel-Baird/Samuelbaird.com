title: Aqllasqa Iñiykuna
subtitle: Jesucristoq Iglesian Allin Kawsaqkunapaq Qhipa Qhipa Pʼunchaykunapi
author: ''
verses:
- n: 1
  text: Ñuqayku creeyku Wiñay kawsayniyuk Tata Diospi, Jesucristo Churinpi, Espíritu Santopiwan.
- n: 2
  text: Creeyku qharikuna jasutʼisqas kanankuta juchasninkurayku, mana Adanpaq juchasninkuraykuchu.
- n: 3
  text: Creeyku Cristoq expiacionninrayku, tukuy runakuna salvakuyta atinku, leyesta, llimphu ruwaykunata
    ima, evangeliomanta kasuspa.
- n: 4
  text: 'Creeyku ñawpaq kaq ruwaykuna chanta llimphu ruwaykuna evangeliomanta kanku: ñawpaq kaq, Iñiy
    Señor Jesucristupi; iskay kaq, Pisachikuy; kimsa kaq; Bautismo pʼultispa juchasta pampachanapaq; tawa
    kaq, Makista churaspa Espiritu Santuqpata quyninta willanapaq.'
- n: 5
  text: Creeyku qhari Diosrayku waqyasqa kananta, profeciarayku, makista churaspa ima, mayqinkunachus
    atiyniyuk kaqkunawan, evangeliota predicananpaq chanta llimphu ruwaykunata apaykachananpaq.
- n: 6
  text: 'Creeyku kikin imaynatachus wakichisqa karqa ñawpa Iglesia, kaytaq: apostoleswan, profetaswan,
    pastoreswan, maestroswan, evangelistaswan, tukuy imawan ima.'
- n: 7
  text: Creeyku tukuy qallupi parlanapaq, profeciapi, revelacionpi, visionespi, sanidadespi, tukuy qalluta
    sutʼinchanapaq, tukuy chaykunata ima.
- n: 8
  text: Creeyku Biblia Diospaq qillqasqan kasqanta, maykamachus chiqan tikrasqa kaqtin; chantapis creellaykutaq
    Mormonpaq Pʼanqan Diospaq qillqasqa kasqanta.
- n: 9
  text: Creeyku Diospaq tukuy imatachus sutʼincharqa, kunan pʼunchaypi tukuy imatachus sutʼinchasqanta,
    creellaykutaq sutʼinchananta astawan achkha jatuchik chanta ancha yupasqata imachus kasqanta Diospaq
    reynonmanta.
- n: 10
  text: Creeyku Israel llaqta qutuchakunanta kikin imaynatachus nirqanku, chanta chunka tribus kutirimunankuta;
    Siontaq (Musuq Jerusalen) sayarichisqa kanqa America jatun suyupi, Cristotaq paypuni kamachinqa jallpʼa
    patapi chanta jallpʼa musuqchasqa kanqa japʼinqataq janaq pacha glorianta.
- n: 11
  text: Mañakuykutaq atiyta qunawaykuta may atiyniyuq Diosta yupaychanaykupaq, imaynatachus sunqunchikmanjina
    juntʼaspa, ajinallataq quyku tukuy runasman kikinta yupaychanankupaq imaynatapis, maypillapis mana
    chay paykuna munasqankuta.
- n: 12
  text: Creeyku kasuspa kanaykuta reyespi, kamachiqkunapi, jatun kamachiqkunapi, juecespi ima, leyta kasunapaq,
    japʼinapaq, yupaychanapaq ima.
- n: 13
  text: Creeyku mana suwas kanaykuta, mana llullakuq, llimphu kaysayniyuq, khuyayniyuq, allin kawsaypi
    ima kanapaq, allinta ruwaspa tukuy runakunaman, chiqanpi niykuman qhatipayasqaykuta Pabloq kamachiyninta.
    Tukuy imata creeykyu, tukuy imata suyayku, tukuy imaykunata ñakʼariyku chanta suyallaykutaq tukuy
    imaykunaspi ñakʼariyta, ichapis allin kawsay, mana chay may kʼacha, mana chay allin qhawasqa, mana
    chay yupaychasqa kanman, chayman chayayta munayku.
signature: José Smith.
