title: Yawar masi
subtitle: Juk Jatun willaykuna kay pachapaq
author: Ñawpaq kaq kuraq Kamachiqkuna, Chunka iskayniyuq Apostolesmanta Qutu ima, Jesucristoq Iglesianmanta
  allin kawsaqkunapaq qhipa qhipa pʼunchaykunapi
note: Gordon B. Hinckley kuraq kamachiq iglesiamanta ñawirirqa kay jatun willayta rakʼiyninjina khuyapayanapaq
  jatun qotunpi Mayqinchus apakurqa 23 de septiembre de 1995, en Salt Lake City, Utah, EE. UU.
paragraphs:
- Ñuqayku, Ñawpaq kaq kuraq Kamachiqkuna, Chunka iskayniyuq Apostolesmanta Qutu ima, Jesucristoq Iglesianmanta
  allin kawsaqkunapaq qhipa qhipa pʼunchaykunapi, willaykutaq jatun raymipijina Dios kamachin qhari warmiwan
  kasaranankuta, yawar masitaq allinpaq qhawasqa Diospaq wakichisqanpi pachakamaq wawasninpaq wiñay kawsayman
  chayanankupaq.
- Tukuy runakuna, qharikuna, warmikuna ima, Diosman rischʼasqas ruwasqas kanku. Sapa juk sumaq munasqa
  qhari wawa mana chay warmi wawa kan mirasqa espiritujina janaq pachapi tatasninrayku, chayraykutaq,
  sapa jukpata kapun kaynin maymanchus chayananpaq janaq pachapi. Qhari kay mana chay warmi kay kanan
  tiyan pichus kasqanta.
- Ñawpaq kawsaypi, qhari wawakuna, warmi wawakuma ima, mirachisqas espirirusjina, Diosta riqsirqanku,
  yupaycharqanku Wiñay Tatantajina, ari nispa Wakichisqanta, chay niqta wawasninku juk kurputa atinkuman
  japʼiyta, jinapi yachaqaspa chiqan rinanpaq sumaq kayninta taripananpaq, chanta chayaspa wiñay kawsayta
  japʼinanpaq Diospaq wawanjina. Diospaq kusikunapaq wakichisqan yawar masikunaq ruwaykunansnin kuwachamanta
  astawan jaqayman kananpaq. Llimphu ruwaykunas chanta sumaq juntʼaykunasnin ima mayqinkunachus santo
  Templopi kachkanku runakuna Diosman kutinankupaq atinku ruwayta, chantapis yawarmasikuna japʼinasqas
  wiñay wiñaypaq kanankupaq.
- Ñawpaq kaq kamachiyta Adanman, Evamanwan Dios qurqa kaytaq tatakuna atiywan chayanankupaq karqa, qhari
  warmijina. Willaykutaq Diospaq wawasnin miranankuta chanta juntʼachinankuta jallpʼata chay kamachiynin
  kasunapaqraq kachkan. Chantapis willayku Dios kamachisqanta llimphu atiykunata miranapaq qhariwan chanta
  warmillawan ruwakunanpaq kasarasqas kaspa qusajina chanta warmijina liyta juntʼaqtinku.
- Willayku mayqinkunachus kawsay wañuqta ruwanapaq Diosninchik Churarqa. Willallaykutaq llimphu kawsay
  kasqanta chanta sumaq allin wiñay wiñaypaq wakichiynin Diospata.
- Qusa chanta warmi munanakunanku tiyan chanta jarkʼanakunanku tiyan paykuna pura, wawasninkuta ima. “Wawakunaqa
  Tata Diospa qusqanmin kanku,” (Salmo 127:3). Tatakunaqtaqa allin ruwanan kapun, wawasninkuta uywananku
  tiyan munakuspa, chiqan kawsaypi ima. Quspa imatachus kawsanankupaq chanta allin kawsaypi Diospaq ñawpaqinpi
  kanankupaq, yachachsq munanakuspa, yanapanakuspa paykuna pura, Diospaq kamachiykunasninta kasuspa, leyta
  juntʼaspa maypillapis tiyakuspa. Qusakuna chanta warmikuna, tatakuna chanta mamakuna, kamachiywan kanku
  juntʼakunanpaq kay kamachiykunata Diospaq ñawpaqinpi.
- Diospaq churasqan yawar masiqa. qhari warmiwan kasarakunanku allinpaq kan wiñay wiñaypaq Diospaq wakichiyninpaq.
  Wawakuna paqarinanku tiyan kasarakuy uqhupi chanta uywasqas juk tatawan, juk mamawan ima piqkunachus
  jallchʼanku imatachus jallchʼananku karqa kasarakusaspa sapa juk qhuskamanta sumaqta munanakuspa. Yawar
  masi ukhupi kusikunaqa astawan atikun taripakuyta señor Jesucristoq yachachiykunasninpi. Kasarakuqkuna,
  yawar masikuna ima ñawpaqman rinku, allinpi chanta unaypaq kanku iñiywan, mañakuspa, qhispichiywan,
  pʼanpachaywan, munanakuywan, khuyakuywan, llamkʼaywan, wiñanapaq sumaq pukllakunaswan. Diospaq kamachisqanrayku
  tataqa kamachiq kanan tiyan yawar masi ukhupi munanakuypi, chiqanpi ima, chantapis pay qunan tiyan imatachus
  mistasqanmanjina yawar masi kawsayninpi chantapis sumaq jallchʼayta jaywaspa. Mamaqa kamchisqa wawasninta
  qhawananpaq kay llimphu ruwaykunaspi. Tatawan, mamawan uqllapis kankumanjina kamachisqas kanku yanapanakunankupaq.
  Mana imatapis ruwayta atiqtin, Wañuypi waq imakunapi ima yanapanata rawana kaqtin uqpaqWaq yawarmasikuna
  yanapananku tiyan yanapana kaqtin.
- Willayku piqkunachus runakunamanta mana juntʼaqkuna, llimphu kayninta jallchʼakunkuchu, maqanku mana
  chay allquchanku warminta, qusankuta mana chay wawankuta, mana juntʼaqtinku yawar masiqkuna kamachiyninta
  juk pʼunchay Diosman kutichinanku tiyan. Astawanpis, willayku yawar masi tʼaqanakuqtin apamunqa runakunaman,
  ayllusman, suyusman ima, apamunqanku ima ñakʼariytachus willarqanku ñawpaq kaq profetas chanta kunan
  kaq profetas ima.
- Ruwayku juk waqyayta allin lllaqtamasikunata chanta suyupi kamachiqkuna tukuyniqpi yanapanaku tiyan
  jaqay allin runakunata chanta suyupi kamachiqkunata tucuyniqmanta yanapanankutiyan chay churasqa kamachiykunata
  chanta kallpachaspa llawarmasikunata.
