title: Kawsayniyuq Cristo
subtitle: Apostolespaq kawsayninpaq willaynin
author: Jesucristoq Iglesian Allin Kawsaqkunapaq Qhipa Qhipa Pʼunchaykunapi
paragraphs:
- Yuyarispa iskay waranqa watata Jesucristo paqarisqanta, willayku kawsayniykuq willayninta, Allin llimphu
  kawsayninmanta kasqanmanjina chanta mana tukukuyniyuq llimphu kaynin jatun kaq qhispichiy ñakʼariyninmanta.
  Mana karqachu nitaq kanqachu nipi sumaq yachachiyniyuq Payjina kay pacha patapi.
- Pay karqa Jatun Jehova Mawkʼa Testamentomanta, qhispichiq Musuq Testamentomanta. Tatampaq kamachiyninwan,
  Pay karqa kay pachata ruwaq. “Diostaq tukuy imata payniqta ruwarqa, ruwasqa kaqmantataq mana Paywanqa
  mana imapis ruwasqachu karqa”. (Juan 1:3) Mana juchayuq kaqtinpis, bautisakurqa tukuy justiciata juntʼananpaq.
  Pay “allinkunata ruwaspa purirqa” (Hechos 10:38) Jina kaqtinpis chiqnisqa karqa, Evangelionqa juk willay
  mana chʼaqwapaqchu, allin kawsaypaq ima karqa. Pay mañarqa tukuyta chiqan kawsayninta qhatinankuta.
  Palestinaq yankunasninta purirqa, unqusqasta jampispa, mana rikhuqkunata rikhuchispa, wañusqasta kawsarichispa,
  Yachachirqa wiñay wiñaymanta chiqankunasninta, ñawpa kawsayninchikmanta, sutʼinchaspa imapaqchus kawsayninchik
  kay pachapi, chanta maykamachus chayayta atinchik, Diospaq qhari wawasnin, warmi wawasnin ima kay jamuq
  kawsaypi.
- Kamachirqa Santa Cenata yuyarinanchikpaq jatun ñaqʼariyninta, Expiacionnimanta. Wisqʼarqanku chanta
  juchacharqanku llullakuspa, juchayuqta tariparqanku runa qututa munayninta ruwaspa, chanta willarqanku
  Calvariopi chakatasqa wañunanpaq. Pay kawsayninta qurqa tukuy runakunaqta juchasninta qhispichinanpaq.
  Kawsaynin jatun jayway piqkunapaqchus kawsananku karqa kay pachapi.
- Willaykutaq jatunyachispa Paypaq kawsayninta, Paypaq kawsaynin allin sumaq qillqakama runakunaqta, mana
  Belenpichu qallarikurqa nitaq Calvariopichu tukukurqa. Pay karqa ñawpaq kaq wawan Tataqta, aychapi juk
  kʼata Wawan, kay pachata qhispichiq.
- Jatarimurqataq kuwachamanta “Pay wañuqkunamanta ñawpaqta kawsarimuq kaspa” (1 Corintios 15:20) Señorninchik
  kawsarisqajina, kawsayninpi pikunatachus munakurqa. chaykunawan purirqa. Chantapis yachachirqa” waq
  uwijaninpi” (Juan 10:16) ñawpa Americapi. Kay pʼunchaykunapitaq. Pay, Tatanwan rikhurirqanku waynuchu
  José Smithman, ajinamanta qallarikunanpaq imatachus juntʼakunanta niwarqanchik “ kay qhipa kaq dispensación
  juntʼasqa kananpaq” (Efesios 1:10).
- 'Kawsaq Cristomanta, Profeta Jose Smith qillqarqa: “Ñawisnin nina lawrayjina karqa, umanpaq chukchan
  yuraq llimphu ritʼijina karqa; uyantaq lliphiq intimanta astawan lliphiriq; rimaynintaq jatun achkha
  yakuq qhapariyninjina karqa, ari, Jehovaq rimariynin, nirqataq:'
- “Ñawpaq kaq chanta qhipa kaq kani; pichus kawsaq kani; pichus wañurqa kani; amachaqniykichik Tataq ñawpaqinpi
  kani” (KJ 110:3–4).
- 'Paymanta, chantapis Profeta nirqa: “Kunantaq, jinamanta achkha kawsay willaykuna qukusqan Paymanta,
  kay willay kawsay kan, qhipa kaq tukuymanta, ñuqayku quyku Paymanta: Pay kawsakusan!'
- “Imaqtinchus rikhurqayku, ari, Diospaq paña kinrayninpi; chanta uyarirqayku juk rimay willay kawsayta
  Pay Tataq juk kʼata Churin kasqanta—
- “payniqta, payrayku, chanta paypata pachakuna kanku, ruwasqa ima kanku, runakunaqa mirasqa kanku qhari
  wawakuna, warmi wawakuna ima Diospaq” (KJ 76:22–24).
- Niykutaq jatun raymipijina sacerdocionqa chanta Iglesian ima, kay pacha pataman kutirimunku. “Iglesiamanta
  tukuy kaqkunaqa juk wasijina kanchik, chay wasitaq Jesuspa kuraq kachankunaq, jinataq Diosmanta sutʼinchaqkunaq
  yachachisqankupi sayachisqa kachkan. Chay wasiq sumaq esquina rumintaq Jesucristomin.” (Efesios 2:20)
- Willallaykutaq Pay juk pʼunchay kay pachaman kutimunanta. “Chanta Tata Diospa jatun kayninpa lliphipiynin
  rikhurinqa, tukuy runataq chayta rikhunqanku, imaraykuchus chayta Tata Diospuni nin, nispa”. (Isaías
  40:5). Pay kamachinqa kamachiqkunawan Jatun Kamachiqjina. Wiraquchakunawan Jatun Wiraquchajina, tukuy
  qunqurchakunqanku. Tukuytaq rimarinqanku Payta yupaychaspa. Tukuy ñuqanchiktaq yuyanchasqas kasunchik
  Paywan khusqachasqas ruwasqanchismanjina chanta sunqunchik munasqanchismanjina.
- Quyku kawsayniykuk willayninta, Apostolesjinarayku chiqamanta aqllasqas, Jesustaq kawsaq Cristo kasqanta,
  mana wañuq Diuspaq Churin, Paytaq jatun kamachiq Emanuel, kunantaq kachkan Tatanpaq paña kinrayninpi,
  Pay k´anchay, kawsay chanta iñiy kay pachamanta. Yannintaq pusawanchiq kusikuyman kay kawsaypi chanta
  wiñay kawsayman jamuq kawsaypi. Pachirasqa kachun Diosman, chay juk kʼata wawanta qusqanrayku.
