title: Mfundo za Chikhulupiliro za Mpingo wa Yesu Khristu wa Oyera Mtima M’masiku Otsiriza
subtitle: ''
author: ''
verses:
- n: 1
  text: Timakhulupilira mwa Mulungu, Atate Wamuyaya, ndi mwa mwana Wake, Yesu Khristu, ndi mwa Mzimu Woyera.
- n: 2
  text: Timakhulupilira kuti anthu adzalangidwa chifukwa cha machimo awo osati chifukwa cha zolakwitsa
    za Adamu.
- n: 3
  text: Timakhulupilira kuti kudzera mu Chiyanjanitso cha Khristu, anthu onse akhoza kudzapulumutsidwa
    pakumvera malamulo ndi miyambo ya Uthenga Wabwino.
- n: 4
  text: 'Timakhulupilira kuti ziphunzitso ndi miyambo yoyambilira ya uthenga wabwino ndi: choyambilira,
    chikhulupiliro mwa Ambuye Yesu Khristu; chachiwiri, Kulapa; chachitatu, Ubatizo wonyikidwa mmadzi
    pochotsa machimo; chachinayi Kusanjika Manja kuti tilandire Mmphatso ya Mzimu Woyera.'
- n: 5
  text: Timakhulupilira kuti munthu ayenera kuitanidwa ndi Mulungu, kudzera mu uneneri, komanso kusanjikidwa
    manja kuchokera kwa adindo, kuti alalikire uthenga wabwino ndikuyendetsa miyambo ya Mpingo.
- n: 6
  text: Timakhulupilira ndondomeko za bungwe limene linalipo mu Mpingo wa Yesu Khristu wakale, monga,
    Atumwi, Aneneri, Abusa, Aphunzitsi, Alaliki ndi ena.
- n: 7
  text: Timakhulupilira mu mphatso za malilime, uneneri, vumbulutso, masomphenya, machiritso, kutanthauzira
    malilime, ndi zina zambiri.
- n: 8
  text: Timakhulupilira kuti Baibulo ndi mau a Mulungu kufikira kuti alitanthauzira molondola; timakhulupiliranso
    kuti Buku la Mormoni ndi mau a Mulungu.
- n: 9
  text: Timakhulupilira zonse zimene Mulungu anavumbulutsa, zonse zimene amavumbulutsa, pano, komanso
    timakhulupilira kuti adzapitilizabe kuvumbulutsa zinthu zazikulu zambiri zofunikira mu ufumu wa Mulungu.
- n: 10
  text: Timakhulupilira mu kusonkhana kwenikweni kwa mtundu wa Israeli ndi kubwenzeretsa kwa mitundu khumi;
    kuti Zion (Yerusalemu Watsopano) adzamangidwa ku Amerika; kuti Khristu adzalamulira dziko lapansi;
    komanso, kuti dziko lapansi lidzasandulidwa kukhala latsopano ndikulandila ulemelero wake wa paradiso.
- n: 11
  text: Timafunsa mwayi wopembedza Mulungu Wamphamvuzonse ndi mmene chikumbumtima chathu chimatidziwitsa,
    ndipo timalola anthu onse mwayi womwewo, aloleni iwo adzipembedza mmene iwo afunira, paliponse komanso
    chimene akufuna.
- n: 12
  text: Timakhulupilira kumvera mafumu, atsogoleri a dziko, olamula, komanso ozenga milandu, pakumvera,
    kulemekeza, ndikutsatira lamulo.
- n: 13
  text: Timakhulupilira kukhala achilungamo, onena zoona, oyera, wokoma mtima, woyeletsedwa, komanso kuchita
    zabwino kwa anthu onse. Indetu timakhulupilira malangizo a Mtumiki Paulo, timakhulupilira zonse, tili
    ndi chiyembekezo chonse, tapilira mu zambiri, tidzapilira mu zonse, ngati kuli zoyeretsedwa, zokondeka,
    za mbiri yabwino, komanso zotamandika, ife timafunafuna zimenezo.
signature: Joseph Smith.
