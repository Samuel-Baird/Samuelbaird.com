retrieved: '2026-11-02'
title: Chibwezeretso cha Uthenga wabwino Wonse wa Yesu Khristu
subtitle: Chilengezo ku Dziko lapansi cha Mazana awiri
author: Atsogoleri Oyamba ndi Bungwe la Atumwiwo Khumi ndi Awiri a Mpingo wa Yesu Khristu wa Oyera Mtima
  M’masiku Otsiriza
note: Mwa ulemu ndi kuthokoza, ife monga Atumwi ake tikukuitanani nonse kuti mudziwe—ngati ife tidziwira—kuti
  kumwamba nkotsekula. Tikutsimikiza kuti Mulungu akudziwitsa chifuniro Chake kwa ana Ake okondedwa aamuna
  ndi aakazi. Ife tikuchitira umboni kuti iwo amene awerenga mwapemphero uthenga wa Chibwenzeretso ndi
  kuchita mwa chikhulupiliro adzadalitsidwa ndikudzapeza umboni wawo wa chi mulungu ndi cholinga chake
  chokonzekeretsa dziko lapansi pa lonjezo la kubweranso kwachiwiri kwa Ambuye ndi Mpulumutsi wathu Yesu
  Khristu.
paragraphs:
- Tikulengeza motsimikiza kuti Mulungu amakonda ana Ake mu maiko onse pa dziko lapansi. Mulungu Atate
  watipatsa ife kubadwa kwa umulungu, moyo wosayelekezeka, ndi msembe yachipulumutso yopanda malire ya
  Mwana Wake Okondedwa, Yesu Khristu. Ndi mphamvu ya Atate, Yesu adaukanso ndi kupindura chigonjetso pa
  imfa. Iye ndi Mpulumutsi wathu, Chitsanzo chathu, ndi Muomboli wathu.
- Zaka mazana awiri zapitazo, mmawa wa tsiku lokongola la m’nyengo ya masika mu 1820, m’nyamata Joseph
  Smith, pofuna kudziwa za mpingo oti alowe, adapita mthengo kukapemphera moyandikana kunyumba kwake mu
  dera la New York, USA. Adali ndi mafunso okhudzana ndi chipulumutso cha moyo wake ndipo adakhulupilira
  kuti Mulungu amutsogolera iye.
- Modzichepetsa, tikulengeza kuti poyankha pemphero lake, Mulungu Atate ndi Mwana Wake, Yesu Khristu,
  adaonenekera kwa Joseph ndi kutsegulira “chibwezeretso cha zinthu zonse” (Machitidwe 3:21) monga momwe
  Baibulo lidaloserera. Mu masomphenya ake, iye adaphunzira kuti kutsatira imfa za Atumwi oyamba, Mpingo
  wa Chipangano Chatsopano wa Khristu udasowa pa dziko lapansi. Joseph adzakhala wothandiza pa kuubwenzeretsa.
- Ife tikutsimikiza kuti motsogozedwa ndi Atate ndi Mwana, amithenga akumwamba adabwera kudzaphunzitsa
  Joseph ndi kukhazikitsanzo Mpingo wa Yesu Khristu. Yohane Mbatizi oukitsidwa adabwenzeretsa ulamuliro
  wobatiza pomizitsa kuti machimo akhululukidwe. Atatu mwa Atumwi khumi ndi awiri oyamba—Peturo, Yakobo,
  ndi Yohane—adabwezeretsa upositoli ndi mfungulo za ulamuliro wa unsembe. Enanso adabwera, kuphatikizapo
  Eliya, amene adabwenzera ulamuliro womanga mabanja kwamuyaya mu ubale wamoyo osatha kuposera pa imfa.
- 'Timaperekanso umboni kuti Joseph Smith adapatsidwa mphatso ndi mphamvu ya Mulungu kuti amasulire uthenga
  wakale: Buku la Morimoni—Chipangano china cha Yesu Khristu. Masamba amalemba opatulikawa akuphatikizaponso
  nkhani yokhudza utumiki wa Yesu Khristu mwini pakati pa anthu Okhala kumadzulo atangoukitsidwa kumene.
  Limaphunzitsa za cholinga cha moyo ndi kulongosola chiphunzitso cha Khristu, chimene ndi thunthu la
  cholinga. Monga lemba lothandizana ndi Baibulo, Buku la Morimoni likuchitira umboni kuti anthu onse
  ndi ana aamuna ndi aakazi a Atate achikondi Akumwamba, kuti ali ndi dongosolo la umulungu pa moyo wathu,
  ndi kuti Mwana Wake, Yesu Khristu, amayankhulanso lero ngati m’masiku akale.'
- Ife tikulengeza kuti Mpingo wa Yesu Khristu wa Woyera Mtima a M’masiku Otsiriza, Okhazikitsigwa pa Epulo
  6, 1830, ndi Mpingo wa Chipangano Chatsopano wa Khristu wobwenzeretsedwa. Mpingo uwu, wakhazikika pa
  ngodya za moyo wamngwiro wa Yesu Khristu, ndipo mu Chiyanjanitso chake chopanda malire ndi kuuka kwathunthu.
  Yesu Khristu waitananso Atumwi ndikuwapatsa ulamuliro wa unsembe. Iye akuyitana ife tonse kuti tibwere
  kwa iye ndi Mpingo Wake, kuti tidzalandire Mzimu Woyera, miyambo ya chipulumutso ndi kupeza chimwemwe
  chosatha.
- Zaka mazana awiri zatha tsopano kuchokera pamene chibwenzeretso chimenechi chidayambika ndi Mulungu
  Atate ndi mwana Wake okondedwa Yesu Khristu. Zikwi za wanthu mu dziko lonse lapansi adakumbatira n’kuzindikira
  zochitika m’mauneneri amenewa.
- Ife mokondwera tikulengeza kuti malonjezo a chibwezeretso akupitilira kudzera mu mabvumbulutso opitilira.
  Dziko lapansi silidzakhalanso chimodzimodzi, chifukwa Mulungu “adzasonkhanitsa pamodzi zinthu zonse
  mwa Khristu” (Aefeso 1:10).
