title: Banja
subtitle: Kulengeza ku Dziko la Pansi
author: ''
note: Chilengezo ichi chidawerengedwa ndi Mtsogoleri Gordon B Hinckley ngati mbali imodzi ya uthenga wake
  pa Msokhano wa Bungwe la Azimayi omwe udachitika pa 23 Seputembala 1995, ku Salt Lake City, Utah.
paragraphs:
- Ife, Atsogoleri Oyamba ndi Bungwe la Atumwiwo Khumi ndi Awiri a Mpingo wa Yesu Khristu wa Oyera Mtima
  M’masiku Otsiriza, tikulengeza motsindikiza kuti ukwati wapakati pa mwamuna ndi mkazi ndiwodalitsidwa
  ndi Mulungu ndipo kuti banja ndithunthu la dongosolo la Mlengi mu kukhalamuyaya kwa ana ake.
- Anthu onse—amuna ndi akazi—ndiwolengedwa m’chifaniziro cha Mulungu. Aliyense ndi mwana wamwamuna kapena
  wamkazi muuzimu wamakolo akumwamba, ndipo, pakutero, aliyense ali ndi umulungu ndichiikiko. Chibadwidwe
  ndi chikhalidwe chofunika kwambiri pa munthu asanabadwe, alimoyo, komanso kudziwika ku moyo wosatha
  ndi cholinga.
- M’dzikolakale, mizimu ya ana aamuna ndi akazi inkamudziwa ndikumulambira Mulungu ngati Tate wao wa Muyaya
  ndipo idavomereza dongosolo lake limene ana Ake adzalandira thupi ndikukhalanawo moyo wadziko lapansi
  kuti akakhale wangwiro ndinso kuti adzazindikire tsogolo lawo la umulungu monga olowa kumoyo wosatha.
  Dongosolo la umulungu la chimwemwe limapangitsa ubale wamabanja kukhala wopitilira ku imfa. Miyambo
  yauzimu ndi mapangano amene amapezeka mu kachisi woyera amapangitsa izi kukhala zotheka kwa anthu kuti
  abwerele pamaso pa Mulungu ndipo mabanja awo kulumikizana mpaka muyaya.
- Lamulo loyamba lomwe Mulungu adapatsa Adamu ndi Hava lidakhudza mu kukhala makolo ngati mwamuna ndi
  mkazi wake. Ife tikunenetsa kuti lamulo la Mulungu kwa ana Ake kuti achulukane ndikudzadzana pa dziko
  lidakali ndi mphamvu. Tikunenanso kuti Mulungu adalamula kuti mphamvu za kubala ana zikuyenera kugwiritsidwa
  pakati pa mzibambo ndi mzimayi amene amanga ukwati ngati mwamuna ndi mkazi wake.
- Tikulengeza kuti njira yomwe moyo wamunthu umalengedwera ndi maitanidwe a umulungu. Tikutsimikiza chiyero
  cha moyo ndi kufunika kwa dongosolo la muyaya la Mulungu.
- Mwamuna ndi mkazi wake alindi udindo wokonda ndi kusamalirana wina ndi mzake ndinso ana awo. “Ana ndi
  cholowa cha Ambuye” (Masalimo 127:3). Makolo ali ndi ntchito ya uzimu yolera ana awo mwa chikondi komanso
  mwa chiyero, ndi kuwapatsa zofuna zawo za thupi ndi uzimu, ndi kuwaphunzitsa kukondana ndinso kutumikirana
  wina ndi mzake, kuchita malamulo a Mulungu ndiponso kukhala mzika zasunga malamulo akumene iwo akukhala.
  Mwamuna ndi mkazi wake—amayi ndi abambo—adzayankha pamaso pa Mulungu mmene adagwirira ntchito yawo.
- Banja ndilodalitsidwa ndi Mulungu. Ukwati wapakati pa mwamuna ndi mkazi ndiofunikira padongosolo Lake
  la muyaya. Ana alioyenera kubabwa mu banja lomwe lili lokwatitsa, ndikuleledwa ndi bambo ndi mayi amene
  amalemekeza malonjezo a ukwati podzisunga kwathunthu. Chimwemwe cha m’banja chikhonza kukhala makamaka
  likakhazikika paziphunzitso za Ambuye Yesu Khristu. Maukwati ndi mabanja opambana amamangidwa ndikukhazikika
  pa msanamira za chikhulupiliro, pemphero, kulapa, kukhululuka, ulemu, chikondi, chifundo, ntchito ndinso
  masewera amsangulutso. Mwadongosolo la umulungu, abambo ayenera kutsogolera pabanja lawo mwa chikondi
  komanso mwa chiyero ndipo ndi udindo wawo kupereka zofunika pamoyo ndikuteteza mabanja awo. Amayi makamaka
  ndi udindo wawo kusamala ana awo. Mu maudindo auzimu amenewa, abambo ndi amayi ali ndi udindo othandizana
  chimodzimodzi. Ulumali, imfa kapena nyengo zina zimangofunika kuzivomereza. Achibale ayenera kuthandiza
  ngati pali koyenera kutero.
- Tikuchenjeza anthu amene amaswa mapangano a kudzisunga, amene amazunza banja lawo kapena ana awo, kapena
  kulephera kuyang’anira banja lawo, tsikulina adzayankha pamaso pa Mulungu. Moonjezera apo, tikuchenjeza
  kuti kupasula banja kudzabweretsa pa munthu, mudzi ndi maiko zilango zomwe adanenera aneneri akale komanso
  atsopano.
- Tikumema mzika ndi adindo a boma kwina kulikonse kuphunsitsa njira zoikidwa kuti asunge ndikulimbitsa
  mabanja ngati nsanamira ya dziko.
