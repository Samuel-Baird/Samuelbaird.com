title: Te Mesia Ora
subtitle: Te ’itera’a pāpū o te mau ’āpōsetolo
author: Te ’Ēkālesia a Iesu Mesia i te Feiā Mo’a i te mau Mahana Hope’a nei
paragraphs:
- ’A fa’ahanahana ai tātou i te fānaura’a o Iesu Mesia a piti miliniuma i teienei, tē pūpū atu nei mātou
  i tō mātou ’itera’a pāpū nō ni’a i te huru mau o tōna orara’a fāito ’ore ’e te mā ’e te mana mure ’ore
  o tāna tusia tāra’ehara rahi. ’Aita atu e mana tei ha’aputapū hōhonu i ni’a i te mau ta’ata ato’a ’o
  tei ora a’ena ’e ’o tē ora ā i ni’a i te fenua.
- ’O ’oia taua Iehova Teitei roa o te Faufa’a Tahito ra, te Mesia o te Faufa’a ’Āpī. I raro a’e i te arata’ira’a
  a tōna Metua i te ao ra, ’o ’oia tei hāmani i te fenua. « Nāna i hāmani te mau mea ato’a nei, ’aore
  roa ē, e ’ere ’oia i te hō’ē mea i hāmanihia » (Ioane 1:3). Noa atu ē ’aita tāna e hara, ’ua bāpetizohia
  ra ’oia nō te fa’atupura’a i te parauti’a ato’a. ’Ua haere noa ’oia ma te « hāmani maita’i » (Te ’Ohipa
  10:38), noa atu rā, ’ua fa’ahapahia ’oia nō te reira. Tāna ’evanelia ’o te hō’ē ïa poro’i nō te hau
  ’e te hāmani maita’i. ’Ua tītau ’oia i te tā’āto’ara’a ’ia pe’e i tōna huru. ’Ua haere ’oia nā ni’a
  i te mau ’ē’a o Palesetina, ’ua fa’aora ’oia i te feiā ma’i, ’ua ’ite te matapō, ’ua fa’ati’a i tei
  pohe. ’Ua ha’api’i ’oia i te parau mau nō te ora mure ’ore, i te huru mau o tō tātou orara’a nā mua
  a’e i teie orara’a, i te tumu o tō tātou orara’a i ni’a i te fenua nei ’e i te faufa’a nō te mau tamāroa
  ’e te mau tamāhine a te Atua nō te orara’a a muri a’e.
- ’Ua ha’amau ’oia i te ’ōro’a mo’a ’ei ha’amana’ora’a i tāna tusia tāra’ehara rahi. ’Ua tāpe’ahia ’oia
  ’e ’ua fa’autu’ahia i ni’a i te mau parira’a ha’avare nō te ha’amāuruuru i te hō’ē pupu ta’ata ’ī’ino
  ’e ’ua fa’autu’ahia ’ia pohe i ni’a i te tātauro i Kalavari. ’Ua hōro’a ’oia i tōna ora nō te fa’a’ore
  i te mau hara a te ta’ata nei. ’O ’oia te hōro’a rahi roa a’e nō te feiā ato’a ’o tē haere mai e ora
  i ni’a i te fenua nei.
- Tē ha’apāpū maita’i nei mātou ē tōna ora, i fa’atumuhia ai te ’ā’amu o te ta’ata nei, ’aita ïa i ha’amata
  i Betelehema ’aita ho’i i hope i Kalavari. ’O ’oia te Fānau tahi a te Metua i te ao ra, te Tamaiti hō’ē
  roa i roto i te tino, te Fa’aora o te ao nei.
- ’Ua ti’a mai ’oia mai roto mai i te mēnema ’ia « riro ’ei mātāmua nō te feiā i ma’iri i te ta’oto ra
  » (1 Korinetia 15:20). ’Ei Fatu tei ti’afa’ahou, ’ua haere ’oia i rotopū i te feiā tāna i here i roto
  i te orara’a nei. ’Ua haere ato’a ’oia i rotopū i tāna mau « māmoe ’ē atu » (Ioane 10:16) i te fenua
  Amerika tahito ra. I roto i te ’anotau ’āpī nei, ’ua fâ mai ’oia ’e tōna Metua i te tamaiti ra ia Iosepha
  Semita, te ha’amatara’a ïa o te tohu maoro ē, « ’ia tae i te tu’ura’a parau i te hope’ara’a mau o te
  mau tau ra » (Ephesia 1:10).
- '’Ua pāpa’i te peropheta Iosepha nō te Mesia Ora : « ’E tōna nā mata mai te auahi ura ; te rouru o tōna
  upo’o ra, e mea teatea roa ïa mai te hiona mā roa ra ; tōna hōho’a mata ’ua hau a’e i te ’ana’ana o
  te mahana ; ’e tōna reo ra, mai te haruru ïa o te mau pape rahi i te tahe-pūai-ra’a, ’oia te reo o Iehova,
  i te nā-’ō-ra’a mai ē :'
- « ’O vau nei te mātāmeha’i ’e te fa’ahope’a ; ’o vau teie e ora nei, ’o vau ïa ’o tei taparahihia ;
  ’o vau nei ho’i tō ’outou ti’a i mua i te Metua » (H&F 110:3–4).
- '’Ua parau ā te peropheta nōna ē : « ’E i teienei, i muri mai i te mau ’itera’a pāpū e rave rahi ’o
  tei hōro’ahia nōna ra, ’o teie ho’i te ’itera’a pāpū hope’a roa ’o tā māua e fa’a’ite atu nei nōna ra
  : ’Oia ho’i, tē ora nei ’oia !'
- « Nō te mea ’ua ’ite mata atu ra māua iāna, i te pae ’atau o te Atua ; ’e ’ua fa’aro’o māua i te reo
  i te fa’a’itera’a mai ē, ’o ’oia ana’e te Fānau tahi a te Metua—
- « ’E nāna, ’e nā roto iāna, ’e nōna ho’i, te mau ao e hāmanihia nei ’e i hāmanihia ai ho’i, ’e te mau
  ta’ata ho’i nō reira e mau tamari’i tamāroa ’e e mau tamari’i tamāhine fānau ho’i rātou nā te Atua »
  (H&F 76:22–24).
- Tē fa’a’ite nei mātou nā roto i te mau parau ’ū’ana ’oia ho’i, ’ua fa’aho’ihia mai tōna autahu’ara’a
  ’e tāna ’Ēkālesia i ni’a i te fenua nei—« patuhia i ni’a iho i […] te mau ’āpōsetolo ’e te mau peropheta,
  ’e ’o Iesu Mesia iho te tihi rahi » (Ephesia 2:20).
- Tē fa’a’ite pāpū nei mātou ē e ho’i mai ’oia i te hō’ē mahana i ni’a i te fenua nei. « E fa’a’itehia
  mai te hanahana o Iehova, e ’ite pā’āto’a te ta’ata » (Isaia 40:5). E fa’atere ’oia ’ei Ari’i nō te
  mau Ari’i ’e e parahi mai ’ei Fatu nō te mau Fatu, ’e e pi’o ho’i te mau turi o te mau ta’ata ato’a
  i raro ’e e fā’i ho’i te mau vaha ato’a i roto i te ha’amorira’a i mua iāna. E ti’a tātou tāta’itahi
  ’ia ha’avāhia e āna mai te au i tā tātou mau ’ohipa ’e te mau hina’aro o tō tātou ’ā’au.
- Tē fa’a’ite pāpū nei mātou, ’ei ’āpōsetolo nāna i fa’atōro’a-mau-hia ē—’o Iesu te Mesia Ora, te Tamaiti
  tāhuti ’ore a te Atua. ’O ’oia te Ari’i rahi ’o Emanuela, ’o tē ti’a nei i teie mahana i te pae ’atau
  o tōna ra Metua. ’O ’oia te māramarama, te ora, ’e te ti’aturira’a o tō te ao nei. Tōna haere’a ’o te
  ’ē’a ïa ’o tē arata’i atu i te ’oa’oa i roto i teie orara’a ’e i te ora mure ’ore i roto i te ao e haere
  mai nei. ’Ia ha’amāuruuruhia te Atua nō te hōro’a fāito ’ore o tāna Tamaiti hanahana.
