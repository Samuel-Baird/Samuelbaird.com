title: Te mau hiroa faaroo
subtitle: a te Ekalesia a Iesu Mesia i te Feia Moʻa i te mau Mahana Hopea Nei
author: ''
verses:
- n: 1
  text: Te tiaturi nei matou i te Atua, te Metua Mure Ore, e i Taʼna tamaiti ia Iesu Mesia, e i te Varua
    Maitai hoi.
- n: 2
  text: Te tiaturi nei matou e, e faautuʻahia te taata no taʼna iho mau hara, eiaha râ no ta Adamu ofatiraa
    i te ture.
- n: 3
  text: Te tiaturi nei matou e, na roto i te Taraehara a te Mesia e tia ai i te taata atoa ia faaorahia,
    na roto i te haapaoraa i te mau tura e te mau oroʻa o te Evanelia.
- n: 4
  text: 'Te tiaturi nei matou e, o teie te mau parau tumu matamua e te mau oroʻa matamua o te Evanelia:
    te matamua ra, o te Faaroo ïa i te Fatu ra ia Iesu Mesia; te piti ra, o te Tatarahaparaa ïa; te toru
    ra, o te Bapetizo-utuhi-raa ïa ia matara te hara; te maha ra, o te Tuuraa Rima ïa no te horoaraa a
    te Varua Maitai.'
- n: 5
  text: Te tiaturi nei matou e, hou te taata e aʻo ai i te Evanelia e hou oia e faatere ai i te mau oroʻa
    no te reira, e mea tia iaʼna ia maitihia e te Atua na roto i te tohu e te tuuraa rima o te feia i
    haamanahia.
- n: 6
  text: Te tiaturi nei matou i te tuuraa o te mau toroʻa i roto i te Ekalesia nei, mai tei tuuhia mai
    i roto i te Ekalesia i mutaa ihora; oia hoi, te mau aposetolo, te mau peropheta, te mau tiai, te mau
    haapii, te mau haapii evanelia, e te tahi atu â mau toroʻa.
- n: 7
  text: Te tiʻaturi nei matou i teie mau horoaraa, oia hoi, te parauraa i te mau reo ĕê, te tohu, te heheuraa,
    te mau orama, te faaoraraa i te maʻi, te iritiraa i te mau reo ĕê, e te tahi atu â mau horoaraa.
- n: 8
  text: Te tiaturi nei matou e, o te Bibilia ra o te parau ïa a te Atua, ia tia te iritiraahia; e te tiaturi
    atoa nei matou e, o te Buka a Moromona ra, o te parau ïa a te Atua.
- n: 9
  text: Te tiaturi nei matou i te mau mea atoa i heheuhia mai e te Atua, te mau mea atoa o Taʼna e heheu
    mai nei i teie nei, e te tiaturi nei hoi matou e, e heheu mai â Oia e rave rahi atu â mau mea maitai
    e te faufaa rahi no Toʼna ra basileia.
- n: 10
  text: Te tiaturi nei matou e, e haaputuputuhia Iseraela e e faahoʻihia mai na opu tino ahuru e faatiahia
    Ziona oia hoi te Ierusalema Apî i nia i te fenua Marite; e parahi tino mai hoi te Mesia ei arii i
    nia iho i te fenua nei; e e faaapîhia hoi te fenua nei e e farii oia i toʼna hanahana paradaiso.
- n: 11
  text: Te tiaturi nei matou e, e tiaraa to matou ia haamori i te Atua Mana-Hope mai te au i to matou
    iho hinaaro, e e tiaraa hoi to te mau taata atoa ia haamori ratou noaʼtu te huru, te vahi e te mea
    ta ratou i hinaaro.
- n: 12
  text: Te tiaturi nei matou e, e mea tia ïa ia auraro i te mau arii, te mau peresideni, te mau faatere
    hau, e te mau haava, e ia haapao, ia faatura, e ia paturu i te mau ture o te fenua.
- n: 13
  text: 'Te tiaturi nei matou e, e mea tia i te taata ia ora ma te parau-tia, ma te haavare ore, ma te
    viivii ore, ma te aau maitai, ma te haapao maitai e ma te hamani maitai i te mau taata atoa. Te pee
    nei hoi matou i te aʻoraa a Paulo: Te tiaturi nei matou e te tiai nei hoi i te mau mea atoa. E rave
    rahi te mau mea i faaoromaʻihia e matou, e te hinaaro nei hoi matou ia faaoromaʻi i te mau mea atoa.
    E mai te mea te vai atura te mau mea maitai, te mau mea faahiahia, te mau mea roo maitai, e te mau
    mea poupouhia ra, e titau ïa matou i te reira.'
signature: Iosepha Semita
