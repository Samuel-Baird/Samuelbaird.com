title: A család
subtitle: Kiáltvány a világhoz
author: Az Utolsó Napi Szentek Jézus Krisztus Egyházának Első Elnöksége és Tizenkét Apostolának Tanácsa
note: Ezt a kiáltványt Gordon B. Hinckley elnök olvasta fel üzenete részeként a Segítőegylet általános
  gyűlésén, melyet 1995. szeptember 23-án tartottak a Utah állambeli Salt Lake Cityben.
paragraphs:
- Mi, Az Utolsó Napi Szentek Jézus Krisztus Egyházának Első Elnöksége és Tizenkét Apostolának Tanácsa
  ünnepélyesen kijelentjük, hogy a férfi és nő közötti házasságot Isten rendelte el, és a család központi
  szerepet tölt be a Teremtőnek a gyermekei örökkévaló rendeltetésére vonatkozó tervében.
- Minden emberi lény – férfi és nő – Isten képmására teremtetett. Mindegyikük mennyei szülők szeretett
  lélekfia vagy lélekleánya, és mint ilyenek, isteni természetük és rendeltetésük van. Az ember neme alapvető
  jellemvonása az egyén halandóság előtti, halandó és örök kilétének és céljának.
- A halandóság előtti birodalomban a lélekfiak és lélekleányok Mennyei Atyjukként ismerték Istent és hódoltak
  Neki, valamint elfogadták tervét, mely által fizikai testhez és földi tapasztalatokhoz juthatnak azért,
  hogy a tökéletesség felé fejlődhessenek, és végül az örök élet örököseiként elérjék isteni rendeltetésüket.
  A boldogság isteni terve lehetővé teszi, hogy a családi kapcsolatok a síron túl is fennmaradjanak. A
  szent templomokban elérhető szent szertartások és szövetségek lehetővé teszik az egyének számára, hogy
  visszatérjenek Isten színe elé, a családok számára pedig, hogy az örökkévalóságra egyesüljenek.
- Az első parancsolat, melyet Isten Ádámnak és Évának adott, arra a bennük rejlő lehetőségre vonatkozott,
  hogy ők egyszer férjként és feleségként szülőkké váljanak. Kijelentjük, hogy Istennek a gyermekei számára
  adott azon parancsolata, mely szerint sokasodjanak és töltsék be a földet, továbbra is érvényben van.
  Kijelentjük továbbá, hogy Isten megparancsolta, hogy a szent nemzőerő csak olyan férfi és nő között
  használható, akik férjként és feleségként törvényes házasságot kötöttek.
- Kijelentjük, hogy a halandó élet megteremtésének módját Isten jelölte ki. Megerősítjük az élet szent
  voltát, valamint fontosságát Isten örök tervében.
- A férjnek és feleségnek komoly felelősségük, hogy szeretettel és gondoskodással viseltessenek egymás
  és a gyermekeik iránt. „Az Úrnak öröksége a gyermekek” (vö. Zsoltárok 127:3). Szent kötelessége a szülőknek,
  hogy gyermekeiket szeretetben és igazlelkűségben neveljék, gondoskodjanak fizikai és lelki szükségleteikről,
  valamint arra tanítsák őket, hogy szeressék és szolgálják egymást, tartsák be Isten parancsolatait,
  és legyenek törvénytisztelő állampolgárok, bárhol is éljenek. A férjek és feleségek – anyák és apák
  – felelni fognak Isten előtt e kötelezettségek teljesítéséért.
- A családot Isten rendelte el. A férfi és nő közötti házasság nélkülözhetetlen az Ő örök tervéhez. A
  gyermekeknek joguk van ahhoz, hogy a házasság kötelékén belül szülessenek meg, és hogy olyan apa és
  anya nevelje fel őket, akik teljes hűséggel megtartják házassági fogadalmaikat. Boldogság leginkább
  akkor érhető el a családi életben, ha az az Úr Jézus Krisztus tanításain alapszik. A sikeres házasságok
  és családok a hit, az ima, a bűnbánat, a megbocsátás, a tisztelet, a szeretet, az együttérzés, a munka
  és a tartalmas szabadidős tevékenységek tantételeire épülnek, és azok által tartatnak fenn. Isteni terv
  szerint az apáknak szeretetben és igazlelkűségben kell a családjukban elnökölniük, valamint felelősséggel
  tartoznak azért, hogy gondoskodjanak a család létszükségleteiről és megóvásáról. Az anyák elsősorban
  gyermekeik gondozásáért felelősek. Az anyák és az apák kötelesek egyenlő társakként segíteni egymást
  e szent feladatok ellátásában. Fogyatékosság, halál vagy más körülmények szükségessé tehetik e szerepek
  egyéni átalakítását. Szükség esetén a tágabb család nyújtson segítséget.
- Felhívjuk a figyelmet, hogy azok az egyének, akik megszegik a nemi erkölcsösség szövetségeit, akik bántalmazzák
  házastársukat vagy gyermeküket, illetve akik nem látják el családi kötelezettségeiket, egy napon felelni
  fognak Isten előtt. Figyelmeztetünk arra is, hogy a családok széthullása az ősi és újkori próféták által
  megjövendölt csapásokat fogja hozni az egyénekre, közösségekre és nemzetekre.
- Felhívjuk mindenhol a felelős állampolgárokat és kormányzati tisztviselőket, hogy mozdítsák elő azokat
  az intézkedéseket, melyek célja a családnak mint a társadalom alapegységének a fenntartása és megerősítése.
