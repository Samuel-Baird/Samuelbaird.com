title: A Hittételek
subtitle: Az Utolsó Napok Szentjeinek Jézus Krisztus Egyházában
author: ''
verses:
- n: 1
  text: Hiszünk Istenben, az Örökkévaló Atyában, és az Ő Fiában, Jézus Krisztusban, valamint a Szentlélekben.
- n: 2
  text: Hisszük, hogy az emberek saját bűneikért lesznek megbüntetve, nem pedig Ádám vétkéért.
- n: 3
  text: Hisszük, hogy Krisztus Engesztelése által az egész emberiség megszabadulhat, ha engedelmeskednek
    az Evangélium törvényeinek és szertartásainak.
- n: 4
  text: 'Hisszük, hogy ezek az Evangélium első tantételei és szertartásai: első, az Úr Jézus Krisztusba
    vetett Hit; második, Bűnbánat; harmadik, alámerítéssel történő Keresztelés a bűnök bocsánatára; negyedik,
    Kézrátétel a Szentlélek ajándékáért.'
- n: 5
  text: Hisszük, hogy az embert Istennek kell elhívnia, prófécia, valamint felhatalmazással rendelkezők
    kézrátétele által, hogy prédikálhassa az Evangéliumot és szolgálhasson annak szertartásaiban.
- n: 6
  text: 'Hiszünk ugyanabban a szervezetben, ami az Ősi Egyházban is létezett, név szerint: apostolok,
    próféták, pásztorok, tanítók, evangélisták és így tovább.'
- n: 7
  text: Hiszünk a nyelvek, a prófécia, a kinyilatkoztatás, a látomások, a gyógyítás, a nyelvek fordításának
    ajándékában, és így tovább.
- n: 8
  text: Hisszük, hogy a Biblia Isten szava, amennyiben fordítása helyes; azt is hisszük, hogy a Mormon
    könyve Isten szava.
- n: 9
  text: Hiszünk mindabban, amit Isten kinyilatkoztatott, mindabban, amit most nyilatkoztat ki, és hisszük,
    hogy ezután is ki fog nyilatkoztatni sok nagyszerű és fontos dolgot Isten királyságát illetően.
- n: 10
  text: Hiszünk Izráel szó szerinti összegyűjtésében és a Tíz Törzs helyreállításában; hogy Sion (az Új
    Jeruzsálem) az amerikai földrészen fog felépülni; hogy Krisztus személyesen uralkodik majd a földön;
    és hogy a föld megújul és elnyeri paradicsomi dicsőségét.
- n: 11
  text: Igényt tartunk arra a kiváltságra, hogy saját lelkiismeretünk parancsai szerint hódoljunk a Mindenható
    Istennek, és minden embernek megadjuk ugyanezt a kiváltságot, hadd hódoljanak úgy, ott és annak, ahogy,
    ahol és aminek akarnak.
- n: 12
  text: Hiszünk a királyoknak, elnököknek, uralkodóknak és elöljáróknak való alárendeltségben, a törvény
    iránti engedelmességben, annak tiszteletében és támogatásában.
- n: 13
  text: Hiszünk abban, hogy tisztességesnek, igaznak, erkölcsösnek, jóakaratúnak, erényesnek kell lennünk,
    és minden emberrel jót kell cselekednünk; tulajdonképpen mondhatnánk, hogy Pál intését követjük –
    Mindent hiszünk, mindent remélünk, sok mindent elviseltünk már, és reméljük, hogy mindent el tudunk
    majd viselni. Ha van bármi, ami erényes, szép, jónak mondott vagy dicséretre méltó, akkor törekszünk
    azokra a dolgokra.
signature: Joseph Smith.
