title: O Le Toefuata’iga o le Atoatoaga o le Talalelei a Iesu Keriso
subtitle: O Se Folafolaga o le Faamanatuina o le Lua Seneturi i le Lalolagi
author: O Le Au Peresitene Sili ma le Aufono a Aposetolo e Toasefululua O Le Ekalesia a Iesu Keriso o
  le Au Paia o Aso e Gata Ai
note: O lenei folafolaga sa fofogaina e Peresitene Russell M. Nelson o se vaega o lana savali i le Konafesi
  Aoao Faaletausaga Lona 190, i le aso 5 o Aperila, 2020, i le Aai o Sate Leki, Iuta.
paragraphs:
- Matou te folafola atu ma le faamaoni e alofa le Atua i Lana fanau i atunuu uma o le lalolagi. Ua foa’i
  mai e le Atua le Tamā ia i tatou le soifua mai ma le paia, le soifuaga lē mafaatusalia, ma le taulaga
  togiola lē i’u a Lona Alo Pele, o Iesu Keriso. E ala i le mana o le Tamā, na toetu mai ai Iesu ma maua
  le manumalo i le oti. O Ia o lo tatou Faaola, lo tatou Faataitaiga Sili, ma lo tatou Togiola.
- I le luaselau tausaga talu ai, i se taeao matagofie o le tautotogo i le 1820, a o sailiili le taule’ale’a
  o Iosefa Samita e fiailoa po o le a le ekalesia e auai ai, sa alu ai e tatalo i le togāvao e lata ane
  i lona aiga i le setete o Niu Ioka, ISA. Sa i ai ni ana fesili e faatatau i le faaolataga o lona agaga
  ma sa faatuatua o le a ta’ita’i o ia e le Atua.
- I le lotomaualalo, matou te tautino atu ai e faapea i le tali mai i lana tatalo, sa faaali mai ai le
  Atua le Tamā ma Lona Alo, o Iesu Keriso ia Iosefa ma amatalia ai loa le “toefuata’iga o mea uma” (Galuega
  3:21) e pei ona valo’ia mai i le Tusi Pa’ia. I lenei faaaliga, sa ia a’oa’o ai, e faapea, ina ua mavae
  le maliliu o ulua’i Aposetolo, sa leiloa ai le Ekalesia a Keriso o le Feagaiga Fou mai le lalolagi.
  O le a avea Iosefa ma meafaigaluega i le toe fo’i mai o le Ekalesia.
- Matou te faamautū atu, e faapea, i lalo o le ta’ita’iga a le Tamā ma le Alo, na ō mai ai avefe’au faalelagi
  e a’oa’o Iosefa ma toe-atia’e le Ekalesia a Iesu Keriso. Sa toefuata’i mai e Ioane le Papatiso le pule
  e papatiso ai e ala i le faatofuina mo le faamagaloga o agasala. O le to’atolu o ulua’i Aposetolo—o
  Peteru, Iakopo, ma Ioane—sa toe fuata’imaia le tofi faa’aposetolo ma ki o le pule o le perisitua. Sa
  ō mai fo’i isi, e aofia ai Elia, o lē na toe fuata’i maia le pule e faamau faatasi ai aiga e faavavau
  i mafutaga e faavavau i talaatu o le oti.
- 'Matou te molimau atu fo’i o Iosefa Samita na tu’u i ai le meaalofa ma le mana o le Atua e faaliliu
  ai se faamaumauga anamua: le Tusi a Mamona—O Se Tasi Molimau ia Iesu Keriso. O loo aofia ai i itulau
  o lenei anotusi pa’ia se tala e uiga i le galuega patino a Iesu Keriso i tagata i le Lalolagi i Sisifo
  i le faato’ā mavae ai o Lona Toetu. O loo a’oa’o mai ai le faamoemoega o le olaga ma faamalamalama mai
  ai le mata’upu faavae a Keriso, lea e faatotonugalemū i ai lena faamoemoega. I le avea ai o se tusitusiga
  paia e soa ma le Tusi Paia, o loo molimau mai ai le Tusi a Mamona e faapea, o tagata soifua uma o ni
  atalii ma ni afafine o se Tama i le Lagi alofa, ua i ai ia te Ia se fuafuaga pa’ia mo ō tatou olaga,
  ma o Lona Alo, o Iesu Keriso, o loo fetalai mai i aso nei e pei fo’i ona i ai i aso anamua.'
- Matou te tautino atu O Le Ekalesia a Iesu Keriso o le Au Paia o Aso e Gata Ai, sa faatulagaina i le
  aso 6 o Aperila, 1830, o le Ekalesia lava lea a Keriso o le Feagaiga Fou ua toefuata’iina. O lenei Ekalesia
  ua taula i le soifuaga ato’atoa o lona ma’a tulimanu, o Iesu Keriso, ma i Lana Togiola lē i’u ma le
  Toetu moni mai. Ua toe vala’auina e Iesu Keriso ia Aposetolo ma tu’u atu ia i latou le pule o le perisitua.
  Ua Ia vala’aulia i tatou uma ia ō mai ia te Ia ma Lana Ekalesia, ia maua le Agaga Pa’ia, o sauniga o
  le faaolataga, ma ia maua le olioli tumau.
- Ua mou atu nei le luaselau tausaga talu ona amatalia lenei Toefuata’iga e le Atua le Tamā ma Lona Alo
  Pele, o Iesu Keriso. Ua ōpomau e le faitau miliona i le lalolagi atoa se malamalama’aga o nei mea na
  tutupu sa valo’iaina.
- Matou te ta’utino atu ma le fiafia e aga’i pea i luma le Toefuata’iga folafolaina e ala i faaaliga faifai
  pea. O le a lē toe tutusa lava le lalolagi, auā o le a “faapotopoto faatasi [e le Atua] mea uma ia tasi
  ia Keriso” (Efeso 1:10).
- Faatasi ai ma le migao ma le lotofaafetai, i le avea ai ma Ana Aposetolo, matou te vala’aulia ai tagata
  uma ia iloa—e pei ona matou iloa—o loo matala le lagi. Matou te faamautū atu o loo faailoa mai e le
  Atua Lona finagalo mo Ōna atalii ma afafine pele. Matou te molimau atu o i latou e su’esu’e ma le agaga
  tatalo i le sāvali o le Toefuata’iga ma galulue i le faatuatua o le a faamanuiaina e maua ā latou lava
  molimau e uiga i lona pa’ia ma lona faamoemoega e saunia le lalolagi mo le Afio Mai Faalua o lo tatou
  Alii ma le Faaola, o Iesu Keriso, ua folafola mai.
