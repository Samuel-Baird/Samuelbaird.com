title: O Le Aiga
subtitle: O Se Folafolaga i le Lalolagi
author: O Le Au Peresitene Sili ma le Aufono a Aposetolo e Toasefululua O Le Ekalesia a Iesu Keriso o
  le Au Paia o Aso e Gata Ai
note: Sa fofogaina lenei folafolaga e le Susuga a Peresitene Gordon B. Hinckley, o se vaega o lana savali
  i le Sauniga Aoao a le Aualofa sa faia i le aso 23 o Setema, 1995 i le Aai o Sate Leki, Iuta.
paragraphs:
- O i matou, o le Au Peresitene Sili ma le Aufono a Aposetolo e Toasefululua O Le Ekalesia a Iesu Keriso
  o le Au Paia o Aso e Gata Ai, matou te ta’utino atu ma le faamaoni, o le faaipoipoga i le va o se alii
  ma se tamaitai, ua faauuina e le Atua, ma o le aiga o le totonugalemu lea o le fuafuaga a Lē Foafoa,
  mo le taunuuga e faavavau o Lana fanau.
- O tagata uma —tane ma le fafine—ua foafoaina i le faatusa o le Atua. O i latou taitoatasi o se atalii
  po o se afafine agaga faapelepele a ni matua faalelagi, ma, o lea ua tofu ai ma se natura paia ma se
  taunuuga. O le tulaga tane po o le fafine [o le tagata] o se vaega taua lea o le mua’i olaga, olaga
  faitino, ma le faasinomaga e faavavau ma le faamoemoega.
- I le muai olaga, sa iloa ma tapua’i atalii ma afafine agaga i le Atua o lo latou Tama e Faavavau ma
  sa [latou] talia Lana fuafuaga e mafai ai e Lana fanau ona maua se tino faaletino ma maua le tomai faalelalolagi
  latou te maua ai le atoatoaga ma iloatino ai lo latou taunuuga paia o ni suli o le ola e faavavau. O
  le fuafuaga paia o le fiafia, ua mafai ai ona faaauau fegalegaleaiga faaleaiga i tala atu o le tuugamau.
  Ua mafai i sauniga paia ma feagaiga ua maua i malumalu paia ona toe foi atu ai tagata taitoatasi i le
  afioaga o le Atua ma toe faatasia ai aiga e faavavau.
- O le uluai poloaiga na tuuina e le Atua ia Atamu ma Eva, e faatatau i lo la agavaa mo le tulaga faamātua,
  o se tane ma se ava. Matou te ta’utino atu o le poloaiga a le Atua i Lana fanau ia fanafanau ma uluuluola
  ai le lalolagi, ua faamalosia ma faatumauina. Matou te toe ta’utino atu foi ua poloai mai le Atua, o
  mana paia o le foafoaina o fanau, ua na o le va lava o le alii ma le tamaitai ua faaipoipoina faaletulafono,
  o se tane ma le ava, e tatau ona faaaogaina ai.
- Matou te ta’utino atu o le ala ua foafoaina ai le ola faitino, ua faatuina i le finagalo paia. Matou
  te faamaonia le paia o le ola ma lona taua i le fuafuaga e faavavau a le Atua.
- O le tane ma le ava ua i ai se tiutetauave paia e alofa ma tausi e le tasi le isi ma a la fanau. “O
  fanau o le tofi lea mai le Alii” (Salamo 127:3). Ua i ai i matua se tiute paia e tausia a latou fanau
  i le alofa ma le amiotonu, ia tuuina atu i ai mea e manaomia faaletino ma le faaleagaga, ma ia aoao
  i latou e alolofa ma feauaunaa’i, ia tausia poloaiga a le Atua ma avea ma tagatanuu usiusitai i tulafono
  i soo se mea latou te nonofo ai. O tane ma ava—tina ma tamā—o le a latou tali atu i le Atua mo le faataunuuina
  o nei mea e ao ona faia.
- O le aiga ua faauuina e le Atua. O le faaipoipoga i le va o le alii ma le tamaitai e taua i Lana fuafuaga
  e faavavau. E tatau ona fanauina fanau i totonu o feagaiga o le faaipoipoga, ma ia tausia e se tamā
  ma se tina o ē ua faamamaluina ma le faamaoni atoatoa feagaiga faaleulugalii. E maua le fiafia i le
  olaga faaleaiga pe a faavae i aoaoga a le Alii o Iesu Keriso. O faaipoipoga ma aiga manuia, e faavae
  ma tumau i mataupu faavae o le faatuatua, tatalo, salamo, faamagaloga, faaaloalo, alofa, agalelei, galuega,
  ma gaoioiga faafiafia tuufaatasi. I le fuafuaga paia, e tatau ona pulefaamalumalu tamā i o latou aiga
  i le alofa ma le amiotonu ma o i latou e tuuina atu mea e manaomia o le olaga ma le puipuiga mo o latou
  aiga. O le uluai matafaioi a tina o le faafaileleina lea o a latou fanau. O nei matafaioi paia, e ao
  i tamā ma tina ona fesoasoani le tasi i le isi o se paaga tutusa. O mea e faaletonu, oti, po o nisi
  mea e tula’i mai, e alagatatau ai ona fetuutuunai tagata taitoatasi. E tatau i aiga lautele ona tuuina
  atu le lagolago pe a manaomia.
- Matou te lapata’i atu o tagata taitoatasi o ē ua solia feagaiga o le ola mama, o ē faasaunoa i taitoalua
  po o fanau, o ē ua faatalalē i le faataunuuina o tiutetauave faaleaiga, o le a i ai se aso tou te tutū
  atu ai e tali atu i luma o le Atua. E le gata i lea, matou te lapata’i atu foi, o le faamalepeina o
  le aiga o le a aumai ai i tagata taitoatasi, alaalafaga, ma malo, faafanoga ia na ulua’i ta’u mai e
  perofeta anamua ma aso nei.
- Matou te valaau atu i tamalii ma failauga ma taitai o malo i soo se mea ina ia faalauiloa atu na fuafaatatau
  ua fuafuaina ina ia faatumauina ma faamalosia le aiga o se iunite faavae o malo.
