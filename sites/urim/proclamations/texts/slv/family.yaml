title: Družina
subtitle: Razglas svetu
author: Prvo predsedstvo in svet dvanajstih apostolov Cerkve Jezusa Kristusa svetih iz poslednjih dni
note: Predsednik Gordon B. Hinckley je ta razglas prebral kot del svojega sporočila na generalnem sestanku
  Društva za pomoč, ki je potekal 23. septembra 1995 v Salt Lake Cityju v Utahu.
paragraphs:
- Prvo predsedstvo in svet dvanajstih apostolov Cerkve Jezusa Kristusa svetih iz poslednjih dni svečano
  razglašamo, da je zakonsko zvezo med možem in ženo posvetil Bog in da je družina osrednji del Stvarnikovega
  načrta za večno usodo njegovih otrok.
- Vsi ljudje – moški in ženske – so ustvarjeni po Božji podobi. Vsak je ljubljeni duhovni sin oziroma
  hči nebeških staršev in vsak ima kot tak božansko naravo in usodo. Spol je bistvena lastnost posameznikove
  predzemeljske, zemeljske in večne istovetnosti ter namena.
- V predzemeljskem obstoju so duhovni sinovi in hčere Boga poznali in ga častili kot svojega večnega Očeta
  in sprejeli njegov načrt, po katerem njegovi otroci lahko dobijo snovno telo in imajo zemeljske izkušnje,
  da napredujejo k popolnosti in naposled uresničijo svojo božansko usodo dediča večnega življenja. Božanski
  načrt sreče omogoča, da se družinski odnosi po smrti nadaljujejo. Svete uredbe in zaveze, ki so na voljo
  v svetih templjih, posameznikom omogočajo, da se vrnejo v Božjo navzočnost, družinam pa, da se združijo
  za večno.
- Prva zapoved, ki jo je Bog dal Adamu in Evi, se je nanašala na njuno zmožnost, da kot mož in žena postaneta
  starša. Izjavljamo, da Božja zapoved njegovim otrokom, naj se množijo in napolnijo Zemljo, še vedno
  velja. Nadalje izjavljamo, da je Bog zapovedal, da sveto zmožnost ustvarjanja življenja lahko uporabljata
  le moški in ženska, ki sta zakonito poročena kot mož in žena.
- Izjavljamo, da je način, s katerim se na Zemlji ustvarja življenje, določil Bog. Potrjujemo, da je v
  večnem Božjem načrtu življenje sveto in pomembno.
- Mož in žena imata resno odgovornost, da skrbita za in ljubita drug drugega ter svoje otroke. Otroci
  so Gospodova dediščina (gl. Psalmi 127:3). Starši imajo sveto dolžnost, da otroke vzgajajo ljubeče in
  pravično, da skrbijo za njihove telesne in duhovne potrebe ter jih učijo, naj imajo druge radi in jim
  služijo, izpolnjujejo Božje zapovedi in so poslušni zakonom države, kjer koli živijo. Možje in žene
  – matere in očetje – bodo glede izpolnjevanja teh dolžnosti odgovarjali pred Bogom.
- Družino je posvetil Bog. Zakon med moškim in žensko je bistveni del njegovega večnega načrta. Otroci
  imajo pravico, da se rodijo znotraj zakonskih vezi in da jih vzgajata oče in mati, ki v celoti zvesto
  spoštujeta zakonske obljube. Srečo v družinskem življenju bomo najverjetneje dosegli, če bo le–to temeljilo
  na naukih Gospoda Jezusa Kristusa. Uspešni zakoni in družine so osnovani in ohranjeni po načelih vere,
  molitve, kesanja, odpuščanja, spoštovanja, ljubezni, sočutja, dela in zdravih rekreativnih dejavnosti.
  Po Božjem načrtu morajo očetje družino voditi ljubeče in pravično in so odgovorni, da poskrbijo za življenjske
  potrebe in zaščito družine. Matere so prvenstveno odgovorne, da otroke vzgajajo. Očetje in matere so
  si kot enakopravni partnerji pri izpolnjevanju teh svetih odgovornosti dolžni pomagati. Lahko se zgodi,
  da se bo moral posameznik zaradi invalidnosti, smrti ali drugih okoliščin prilagoditi. Po potrebi bi
  morala pomagati tudi širša družina.
- Opozarjamo, da bodo tisti posamezniki, ki kršijo zaveze čistosti, ki zlorabljajo zakonca ali naraščaj
  ali ki ne izpolnjujejo družinskih odgovornosti, nekega dne za to odgovarjali pred Bogom. Nadalje opozarjamo,
  da bodo posameznike, skupnosti in narode zaradi razpada družine prizadejale nadloge, ki so jih napovedali
  starodavni in sodobni preroki.
- Vse odgovorne državljane in vladne uslužbence vsepovsod pozivamo, naj spodbujajo tiste ukrepe, ki so
  bili zasnovani, da ohranjajo in krepijo družino kot osnovno enoto družbe.
