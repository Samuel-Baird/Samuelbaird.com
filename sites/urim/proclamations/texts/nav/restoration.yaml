title: Jesus Christ Bina’nitin T’áá Át’é Ninályáhígíí
subtitle: 200 Nááhaigo Nihokáá’ Dine’é Hane’ Ílį́įgo Bee Ha’oodzíí’
author: Jesus Christ Bisodizin Dííshjį́įdí Yá Naazínígíí biTáá’go Alą́ąjį’ Naat’áanii dóó Hastóí Naakitsʼáadah
  Bik’ihodiinii’ígíí
note: Hodilzin dóó ahééh ílį́, nihí Hastóí Naakitsʼáadah Nihik’ihdahodiinii’ígíí nihił béédahódoozį́į́ł
  dadiiní—nihígi át’áo—éí yá’ąąshdę́ę́’ ąą’ ádahoot’é. T’áá aaníí ádadii’ní Diyin God biye’ké dóó bitsi’ké
  yił yinízinígíí ííshjání í’doolííł. T’áá aaníí ádadii’ní sodizin Ninályá hane’ yaa sodadilzingo ńdeiłkááh
  bida’oodlą’ yee ádaat’į́į́go bik’idahojidoodlííł áko dadiyinígíí t’áá bí bił béédahódoozįįł dóó nihokáá’
  dine’é Bohólníihii, Yisdá’iiníiłii, Jesus Christ Náádoodááłgo bee nahoot’ánéé yích’į’ hasht’e’ada’dilnééh.
paragraphs:
- Doo naaki nihił danilíigo nihił béédahózin Diyin God ba’áłchíní ayóó áyó’ní nihokáá’ adahwiis’áágóó.
  Diyin God aTaa’ BiYe’ Ayóó’áyó’níinii, Jesus Christ, nihich’į’ aal’a’. Éí diyingo yizhchį́, ts’ídá t’áadoo
  bináłt’ééhgóó be’iina’ áyiilaa, dóó ti’hooznii’go ahool’áágóó niná’nídlá. ATaa’ bibee’adziilii bee,
  Jesus nááhii’na’ dóó anoonééł yik’ehdeesdlį́į́’. NihiYisdá’iiníiłii, bich’į’ dadíníít’į́į’ii, dóó nihá
  niná’nídláii nilį́.
- Naakidi neeznádiin nááhaidą́ą́’, daango 1820 yiihah y̨ę̨́ę́dą́ą́’ hózhónóo ha’íí’ą́, tsíłkéí Joseph
  Smith, sodizin báhooghan yididoogááł hainitáo, bighan t’áá áyídígóó tsintahgi sodi’niilzin New York
  hódahjí ha’hoodzohdi, USAdi. Bii’sizíinii yisdá’doogááł bíne’ nilǫ́ǫ yína’ídiłkid dóó Diyin God bíł
  ííshj́ą́ą́ íídoolííłgo yaa ya’oozli’.
- Hojooba’ daniidzingo, sodilzingo na’ídiłkidę́ę bił ííshjání ályaa dadii’ní, Diyin God aTaa’ dóó BíYe’,
  Jesus Christ, Joseph yaa ní’áázh áádóó bee hodeesh’zhiizh “t’áá ałtsoní hasht’édidoo’nííł” (Acts 3:21)
  Diyin God Bizaad bii’ ch’ét’ánígi’ át’áo. Díí ííshją́ą́’ ályaaígíí bii’ bił bééhoozin, áłk’idą̨́ą́ Hastóí
  Naakitsʼáadah Bik’ihodiinii’ę́ę́ daneeznádóó bik’ijį’, Christ Bisodizin Aha’deet’ą́ Ániidii bii’ baa
  halne’ígíí nahasdzáán bikáá’ ałdó’ doo bééhoozin da. Joseph binahjį’ éí háádidoo’nííl.
- Nihí t’áá aaníi dadii’níigo éí aTaa’ dóó aYe’ bik’éhgo, diyingo nidaal’a’ii Joseph yínideineestą́ą́’
  dóó Jesus Christ biSodizin ánályaa. John the Baptist bits’íís yiih nádzáago tó ak’idiilkǫǫhgo bee alzį́į̨́h
  bee bąąhági át’éii yóó’adidoot’ááł éí bee óhólníihii néinídlá. Hastóí Naakitsʼáadah Bik’ihodiinii’ígíí
  ałk’idą̨́ą̨́’ bik’ihdahodiinii’ę̨́ę̨́ táá’go nákai—Peter, James, dóó John—Hastóí Naakitsʼáadah Bik’ihodiinii’
  yę̨́ę́ dóó Diyin be’adziilii bee ada’al’ínígíí ninádeesdlá Ła’ ałdó’ nináádaheeskai, Elijah éí atah,
  amá dóó azhe’é, dóó áłchíní ahwiis’áo ahił hólǫ́ bee óholníih ninéídláo bii’ hool’áago ahił keedahat’į́įgo
  áhool’áa doo.
- 'T’áá aaníí ádadii’níigo éí Joseph Smith Diyin God bibee a’iilyéii dóó bee’adziil beiyílyá éí ałk’idą́ą́’
  nidá’háasdzoyę́ę yik’i’diit’ą́ągo néíyíizoh: Naaltsoos Mormon Wolyéhígíí—Jesus Christ T’áá Aaníigo Yaa
  Nááhalne’. Díí baa dahasti’ ałkéé’ nídahaasdzohígíí Jesus Christ Náádiidzáádóó bik’ijį’ E’e’áahjí Kéyah
  yikáá’ dine’é néíneezt’ą́ą́’go baa hane’. Éí iiná biniyéhígíí yína’níłtin dóó Christ bina’nítin hazhó’ó
  yaa halne’, éí ts’ídá íyisíí biníí’gi silá. Diyin God Bizaad yił t’áá’łá’í nilį́, éí Naaltsoos Mormon
  Wolyéhígíí díí bina’nitin nihiTaa’ Yá’ąąshdi Hólóonii ayóó ánhó’níinii éí t’áá ałtso bíla’ashdla’ii
  biye’ dóó bitsi’ danilį́, áko nihe’íina’ diyingo yá hoo’ááł, dóó BiYe’, Jesus Christ, éí t’áá ałk’idą́ą́’
  yáłti’í yę́ęgi át’áo dííjį́įdi t’ahdii t’áá ákóní.'
- Jesus Christ Bisodizin Dííshjį́įdí Yá Naazínígíí T’ą́ą́chil 6, 1830 yę́ę́dą́ą́ hadilyaa, éí Christ Bisodizin
  Aha’deet’ą́ Ániidii bii’ baa halne’ígíí Ninályá dadii’ní. Díí Sodizin tsé bee naaná’ástł’in hadíłt’éi
  yee niłdzil, éí Jesus Christ, dóó ahool’áágóó Nihaniná’ídlá dóó t’áá aníí Náádiidzá. Jesus Christ éí
  Hastóí Naakitsʼáadah yik’ihnáádiilnii’ dóó diyin bibee’adziil yaa nááyiisdlá. T’áá áníiltso hóshdę́ę́’
  shaa hoohkááh nihiłní dóó biSodizin bidoohkááh, Ii’sizį́ Diyinii nídidoolééł, bee yisdá’iildééh o’ool’įįłii,
  dóó ił hózhǫ́ diná’ii ńdidoołééł.
- Diyin God aTaa’ nilíinii dóó BíYe’ Ayóó’ayó’níi, Jesus Christ bina’nitin nináinídláádóó k’ad 200 náhaidą́ą́’
  hayiyííłwod. Dikwiishį́į́di míiltsoh nihokáá’ dine’é díidi ádahoozahígíí yaa ákodaniizį́į́’go deiyiłtsood.
- Baa nihił dahózhǫ́ǫgo ádadii’ní díí Na’nitin Ninéinídláhígíí Diyingo ííshją́ą́’ é’él’ínígíí t’ah bił
  hoolzhish. Nahasdzáán át’éhée k’ad ts’ídá łahgo át’ée doo, Diyin God “t’áá ałtso Christ yee ahiih nídooldah“
  (Ephesians 1:10).
