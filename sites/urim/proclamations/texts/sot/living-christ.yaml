title: Kreste ea Phelang
subtitle: Bopaki ba Baapostola
author: ''
paragraphs:
- Ha re hopola tlhaho ea Jesu Kreste lilemo tse likete li peli tse fetileng, re fana ka bopaki ba rona
  ka bo-’nete ba bophelo ba hae bo sa lekangoeng le bokhabane bo sa feleng ba sehlabelo sa hae se seholo
  sa topollo. Ha hona mang kapa mang ea bileng le ts’usumetso e tebileng hakalo holima bohle ba ileng
  ba phela le bohle bao e leng hona ba tla phela lefats’eng.
- E ne e le Jehova e Moholo oa Testamente ea Khale, Messia oa e Ncha. Tlasa tataiso ea Ntata’e, e ne e
  le ’mopi oa lefats’e. “Lintho tsohle li entsoe ke eena; ’me har’a lintho tsohle tse teng ha ho letho
  le teng le entsoeng ka ntle ho eena” (Johanne 1:3). Le ha a ne a se na sebe, O ile a kolobetsoa e le
  ho phetha ho loka hohle. O “ne a tsamea hohle a ntse a etsa hantle” (Liketso 10:38), le ha a ne a nyelisetsoa
  ho etsa joalo. Evangeli ea hae e ne e le molaetsa oa khotso le kamohelo. O kopile bohle ho latela mohlala
  oa hae. O tsamaile litsela tsa Palestina, a folisa ba kulang, a etsa hore lifofu li bone, ’me a tsosa
  le ba shoeleng. O rutile li ’nete tsa bosafeleng, bonnete ba boteng ba rona pele ho bophelo ba ho shoa,
  morero oa bophelo ba rona lefats’eng, le bokhoni bakeng sa bara le barali ba Molimo bophelong bo tlang.
- O ile a qala selallo e le sehopotso sa sehlabelo se seholo sa hae sa topollo. O ile a ts’oaroa ’me a
  nyatsoa ka liqoso tsa boqhekanyetsi, a qosoa e le ho khotsofatsa lets’oele, ’me a ahloleloa ho shoa
  sefapanong sebakeng sa Lehata. O fane ka bophelo ba hae ho hlakola libe tsa batho bohle. Ea hae e ne
  e le mpho e kholo ea boemeli lebitsong la bohle ba tlang ho phela holima lefats’e.
- Re paka ka ’nete hore bophelo ba hae, bo leng khubung ea nalane eohle ea batho, ha bo a qala Bethlehema
  kapa ho fella sebakeng sa Lehata. E ne e le eena letsibolo la Ntate, Mora ea Tsoetsoeng a I’nots’i nameng,
  Molopolli oa lefats’e.
- O ile a tsoha lebitleng ho “behoa thakangoaha ea ba robetseng” (Ⅰ Ba-Korinthe 15:20). Ha e se e le Morena
  ea Tsohileng, O ile a etela har’a bao a ileng a ba rata bophelong. Hape O ile a sebeletsa har’a “linku
  tse ling” (Johanne 10:16) tsa hae Amerika ea boholoholo. Lefats’eng la mehla ea kajeno, Eena le Ntate
  oa hae ba ile ba itlhahisa ho moshanyana Joseph Smith, ho khakola e ileng ea ts’episoa khale “nako ea
  ho phethahala ha linako” (Ba-Efese 1:10).
- 'Ka Kreste ea Phelang, moporofeta Joseph Smith o ngotse a re: “Mahlo a hae e ne e ka lelakabe la mollo;
  moriri oa hlooho ea hae o ne o le mosoeu joalo ka lehloa le hloekileng; sefahleho sa hae se ne se khanya
  ho feta khanya ea letsatsi; ’me lentsoe la hae e ne e ka molumo oa metsi a maholo a phallang, esita
  lentsoe la Jehova, a re:'
- “Ke oa pele ’me ke oa ho qetela; ke eena ea phelang, ke eena ea hlabiloeng; ke ’muelli oa hau le Ntate”
  (D&C 110:3–4)
- 'Ka eena moporofeta o ile a phatlalatsa hape: “’Me joale kamora mapaki a mangata a fanoeng ka eena,
  bona ke bopaki, ba ho felella, boo re bo fanang ka eena: Hore o oa phela!'
- “Hobane re ’mone, esita ka letsohong le letona la Molimo; ’me re utloile lentsoe le pakahatsa hore ke
  ea Tsoetsoeng a I’notsi oa Ntate—
- “Hore ka eena, ’me ke eena, le ka eena, mafats’e a leng teng ’me a ileng a hloloa, le baahi ba teng
  ke bara le barali ba tsoetsoeng ho Molimo” (D&C 76:22–24).
- Re phatlalatsa ka mantsoe a ’nete hore boprista ba hae le kereke ea hae li tsosolotsoe holima lefats’e—“li
  theuoe holima motheo oa … baapostola le baporofeta, Jesu Kreste eena e leng lejoe la ntlha” (Ba-Efese
  2:20)
- Rea paka hore ka letsatsi le leng o tla khutlela lefats’eng. “’Me khanya ea Morena e tla bonahala, ’me
  nama eohle e tla e bona hammoho” (Esaia 40:5). O tla busa e le Khosi ea Likhosi ’me a rene e le Morena
  oa Marena, ’me lengoele le leng le le leng le tla kobeha, ’me leleme le leng le le leng le tla bua le
  ho khumama kapele ho eena. E mong le emong oa rona u tla ema ho ahloloa ke eena ho latela mesebetsi
  ea rona le litakatso tsa lipelo tsa rona.
- Rea pakahatsa, joalo ka Baapostola ba hae ba hlomamisitsoeng hantle—hore Jesu ke Kreste ea Phelang,
  mor’a Molimo ea sa shoeng. Ke Khosi e kholo Emmanuele, ea emeng kajeno letsohong le letona la Ntata’e.
  Ke khanya, bophelo, le ts’epo ea lefats’e. Tsela ea hae ke tsela e isang thabong bophelong bona le bophelo
  ba bosafeleng lefats’eng le tlang. Molimo a bokoe ka mpho e sa lekangoeng ea bo-molimo ea Mora oa hae.
