title: Ewe Niwinsefaniton ewe Unusochun ewe Kapas Allimen Jises Kraist
subtitle: Esinesinen Eu Achechemen Ruepuku Ier ngeni ewe Fonufan
author: Ewe Aewin Presetensi me Soupungun ewe Mwichen Engon me RuemonAposel ren Ewe Mwichefenin Jises
  Kraist ren Aramas mi Pin non Fansoun Soponon
note: Ei esinesin mi annea seni Preseten Russell M. Nelson pwe kinikinin an poraus me non ewe 190 en Mwichenapen
  Iteiten Ier, April 5, 2020, non Salt Lake City, Utah.
paragraphs:
- Aua ennetin pwarata pwe Kot mi tongei Noun semirit non ekkewe muu meinisin non fonufan. Kot ewe Sam
  a fen ngenikich ewe uputiw mi pin, ewe manau mi nap, me ewe asoren achasefan esemuch an Noun we Achengicheng,
  Jises Kraist. Iwe ren ewe manamanen ewe Sam, Jises a manausefan me akkufu mano. I ach Chon Amanau, ach
  NenienAppiru, me ach Chon Angasano.
- Ruepuku ier a no, non eu ningochun nesosoran ewe fansoun irara uwa non 1820, anuon Joseph Smith, a kutta
  an epwe sinei menni mwichefen epwe fiti, a feino nein ekkewe ira an epwe iotek arap ngeni imwan we non
  enefenin New York, USA. A wor an kapaseis usun amanauen ngunun me a apinukunuku pwe Kot epwe emweni
  i.
- Non tipetekison, aua affata pwe ponuwen an iotek, Kot ewe Sam me Noun we, Jises Kraist, ra pwa ngeni
  Joseph me poputani ewe fansoun “mettoch meinisin repwe sofo sefan” ( Foffor 3:21) usun mi osini me non
  ewe Paipen. Non ei nemasepwi, a kaeo pwe mwirin manon ekkewe akaewin Aposel, An Kraist we Mwichefen
  non ewe Testamen Sofo a poutuno seni fonufan. Joseph epwe anganga pwe epwe niwinsefan.
- Aua apungano pwe fan emwenien ewe Sam me ewe Nau, chon kuno seni nang ra feito ar repwe euroura Joseph
  me forsefani ewe Mwichefenin Jises Kraist. John ewe Sou Papatais mi manausefan a eniwinato ewe mumuta
  ne papatais ren mono fan konik ren omusomusen tipis. Unumon me nein ekkewe akkaewin engon me ruemonAposel—Peter,
  James, me John—ra eniwinato ewe wisen aposel me kiien mumutan pristut. Ekkoch ra pwan feito, mi pachenong
  Elijah, ewe a eniwinato ewe mumuta ne ochufengeni famini feinfeino non nefiner esemuch mi tori pekinon
  mano.
- 'Aua sopweno ne pwarata pwe Joseph Smith a angei ewe niffang me manamanen Kot an epwe chiakuni ew uruon
  nom: ewe Puken Mormon—Pwan ew Kapasen Pwarata usun Jises Kraist. Peichen ei puk mi pin mi pachenong
  eu uruo pwisin an Jises Kraist angang nein aramas non ewe Notoun Fonufan mwirin chok An Manausefanita.
  A aitikich usun popun manau me awewei ewe nongonong mi ennet an Kraist, ewe ionapen ena popun. Ren eu
  chiechien pukefel ngeni ewe Paipen, ewe Puken Mormon a pwarata pwe aramas meinisin ir at me nengin noun
  Samach mi tong won Nang, pwe mi wor An kokkot mi pin fan iten manauach, pwe Noun we, Jises Kraist, a
  kapas ikenai usun pwan non ekkewe ranin nom.'
- Aua pwarata pwe Ewe Mwichefenin Jises Kraist ren Aramas mi Pin non Fansoun Soponon, minne a fisita non
  April 6, 1830, ina An Kraist we Mwichefen non ewe Testamen Sofo mi niwinsefan. Ei Mwichefen mi nukuchar
  non unusochun manauen foun nongonongun we, Jises Kraist, me non An Achasefan esemuch me wesewesen Manausefan.
  Jises Kraist a pwan korisefani Aposel me ngenir mumutan pristut. A etiwa kich meinisin pwe sipwe feito
  Ren me An Mwichefen, ach sipwe angei ewe Ngun mi Fel, ekkewe angangepinen amanau, me angei pwapwa esemuch.
- Ruepuku ier ra fen no seni ena fansoun ei Niwinsefanito a poputa me ren Kot ewe Sam me Noun we Achengicheng,
  Jises Kraist. Chommong minion non unusen fonufan ra fen etiwa eu sinenapen ekkei mettoch mi osini.
- Aua pwapwa ne affata pwe ewe Niwinsefanito mi pwon mi soposopono ren soposoponon pwarata. Ewe fonufan
  esap chiwen ususun we, pun Kot epwe soposopono ne “ochufengeni forian kewe meinisin … fan nemenien”
  Kraist (nengeni Ephesus 1:10).
- Ren mennin me kinisou, am Noun Aposel aua tingor meinisin repwe sinei—usun am mi sinei—pwe ekkewe nang
  mi suk. Aua apungano pwe Kot a affata An mochen fan iten Noun achengicheng at me nengin. Aua pwarata
  pwe ekkewe repwe iotek me kaeo porousen ewe Niwinsefanito me angang fiti nuku repwe feioch ne angei
  ar pwisin sinei usun auchean we me popun we an epwe ammonata ewe fonufan ren ewe Aruwen Wareto an ach
  ewe Samon me Chon Amanau, Jises Kraist.
