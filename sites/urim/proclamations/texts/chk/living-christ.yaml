title: Ewe Kraist Mi Manau
subtitle: Ewe Kapasen Pwarata An Ekkewe Aposel
author: Ewe Mwichefenin Jises Kraist Ren Aramas Mi Pin Non Fansoun Soponon
paragraphs:
- Nupwen sia fori achechemen uputiwen Jises Kraist ewe ruu ngorou ier a no, sia awora ach kapasen pwarata
  ren ennetin Manauan ese wor tappin me ewe nimenimoch esemuch ren An ewe watten asoren achasefan. Ese
  wor emon epwe wor an netipetong ne fori ei ngeni meinisin ion kewe rafen nom me ekkewe repwe pwan nom
  won ei fonufan.
- I ewe Siowa mi Napanap ren ewe Testament Noom, ewe Messiah ren ewe Testament Sofo. Fan emwenien Saman
  we, I ewe chon fori ewe fonufan. “Kot a fen forata mettoch meinisin ren ewe kapas, wewen pwe Kot ese
  mo fori och mettoch me nukun i” (John 1:3). Inamo ika ese wor tipisin, I a papatais ren an epwe ounusochuono
  mettoch meinisin mi wenechar. I a “fein fetan ekis meinisin o fori an angang mi murinno” (Foffor 10:38),
  nge a fen kuna koput ren. An kapas allim a fen ew porousen kinamwe me pwapwa. I a tingorei meinisin
  ar repwe tapweno mwirin An nenien appiru. I a fetan won ekkewe anen Palestine, a echikara ekkewe mi
  samwau, fori an kewe mi chun repwe kuna, me amanauata ekkewe mi mano. I a osukuna ekkewe ennet ussun
  fansoun esemuch, ewe ennet ussun manauach me mwen ach sipwe feittiw won fonufan, ewe popun ach manau
  won ei fonufan, me ewe tufich ngeni noun Kot kewe nengin me at non ewe manau epwe feito.
- I a fori ewe sakrament pwe achechemen An ewe asoren achasefan mi napanap. Ra aresini me etipisi won
  niwinin tipis mi mwaken, raetipisi ar repwe emenemenochu ew mwichen chon efeiengaw, me epwe mano won
  ewe irapengesin Calvary. I a fangeno Manauan an epwe achasefani ekkewe tipis an aramas meinisin. Manauan
  a ew wachemuken ekesiwinin niffang fan asengesin meinisin ion mi nom won ei fonufan.
- Aua ennetin pwarata pwe Manauan, minne a nom nukanapen uruon aramas meinisin, ese poputa non Bethlehem
  ika sopono won Calvary. I ewe mwen noun ewe Sam, Noun we Anamon non futuk, ewe Chon Angasano fonufan.
- I a fen manausefanita seni mano an epwe “winiti minen pwarata pwe ir ekkewe ra mano repwe pwan manausefan”
  (1 Corinth 15:20). Pokiten I we Samon a fen manaueta, I a churi ekkewe I atonger non fansoun an manau
  won fonufan. A pwan iamwiri Noun “kewe ekkoch siip” (John 10:16) non Merika me nom. Non ei fonufan iei,
  I me Saman we ra pwa ngeni ewe at Joseph Smith, ra poputani ewe fansoun kich mi ewitiwitinon fansoun
  nakatam ren ewe “tapin fansoun mi unus” (Ephesians 1:10).
- 'Ren ewe Kraist mi Manau, ewe Soufos Joseph a makkei: “Mesan ra ussun ew ngeten ekei; meten mokuran
  mi pwechepwech ussun nimenimochun ewe snow; won mesan a saram seni saramen ewe akkar; me mongungun a
  ussun ngingin mwitirin chonupupun kewe konik mi napanap, pwan mo mongungun Siowa, a apasa:'
- “Ngang ewe nepoputan me ewe soponon; Ngang i ewe mi manau, Ngang i ewe aninino; Ngang noumi chon peni
  me ren ewe Sam” (D&C 110:3–4).
- 'Ren I ewe Soufos a pwan affata: “Iwe iei, mwirin ekkewe chommong kapasen pwarata minne ra fen kawor
  fan iten i, iei ewe kapasen pwarata, omuchunon me nein meinisin, minne sia ngeni i: Pwe i mi manau!'
- “Pun aua fen kuna I, pwan mo me ren peniemwanin Kot; me aua rong ewe mongungu a pwarata pwe i ewe Anamon
  Noun ewe Sam—
- “Iwe ren i, me non i, me seni i, kewe fonufan ra fen foruta akkom me iei, me ekkewe aramas non ir noun
  Kot at me nengin” (D&C 76:22–24).
- Aua affata non ekkewe kapas ennet pwe An ewe pristut me An ewe Mwichefen ra fen niwinsefanito won ei
  fonufan—“ra kouta won ewe nongonong meren … kewe aposel me soufos, nge ewe foun nongonong pwisin Jises
  Kraist” (Ephesians 2:20).
- Aua pwarata pwe ew ran I epwe niwinsefan ngeni fonufan. “Iwe ningen ewe Samon epwene pwano o aramas
  meinisin repwe kuna fengeni” (Isaiah 40:5). I epwe Nemenem pwe epwe Kingen ekkewe King me Samonun ekkewe
  Samon, me pwuku meinisin repwe fotopukutiw me channaw meinisin repwe kapas non me fel ngeni I. Emon
  me emon kich sipwe uta pwe I epwe apungu kich anongonong won ach kewe angang me mochenin netipach.
- Aua apasa am kapasen pwarata, ussun Noun Aposel mi ennetin epinipinino—pwe Jises i ewe Kraist mi Manau,
  ewe Noun Kot ese tongeni epwe mano. I ewe King napanap King Immanuel, ewe a uta peniemwanin Saman ewe
  ikenai. I ewe saram, ewe manau, me ewe epinukunukun ewe fonufan. An ewe an ina ewe an a emwen ngeni
  pwapwa non ei manau me manau esemuch non ewe fonufan epwe feitto. Kinisou ngeni Kot ren Noun we, ewe
  niffang ese wor tappin.
