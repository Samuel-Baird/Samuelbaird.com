title: خێزان
subtitle: بڵاوكراوەيەك بۆ جیهان
author: سەرۆكايەتی يەكەم و ئەنجومەنی دوانزە پەيامبەرەكەی كڵێسای یەسوعی مەسیح بۆ پیرۆزانی ڕۆژانی دواتر
note: سەرۆك گوردن بی هينكڵی ئەم ڕاگەياندراوەی خوێندەوە وەك بەشێك لە پەيامەكەی لە كۆبونەوەی (جمعية الإعانة)
  كۆمەڵەی هاوكاری بۆ ساڵی ٢٣ی ئەيلولی ١٩٩٥ لە سۆڵت لەيك ستي/ يوتاە.
paragraphs:
- ئێمە وەك سەرۆكايەتی يەكەم وئەنجومەنی دوانزە پەيامبەرەكەی كڵێسای یەسوعی مەسیح بۆ پیرۆزانی ڕۆژانی دواتر،
  بە ئاشكراو بە فەرمی رايدەگەيەنين، كە هاوسەرگيری لەنێوان ژن وپياودا خودا دەستنيشانی كردووە، وە خێزان
  كرۆكی ئەو پلانەيە كە ئافرێنەر داينا بۆ چارەنوسی هەتايی بۆ ڕۆڵەكانی.
- هەموو ئادەميزادێك خودا ئەفراندويەتی بە نێر و مێ وە لەسەر شێوەی خۆی. هەريەكەيان بە نێر و مێ وە كوڕ وكچی
  خۆشەويستی باوك و دايكی ئاسمانين وەبەم تايبەت مەنديەوە هەموو تاكێك سروشت و چارەنووسی خودايی هەيە. وەڕەگەزی
  نێر يان مێ تايبەت مەنديەكی سەرەكيە بۆ ناسنامەی تاك وە هۆكاری بوونی لە پێش سەر زەوی وە لەسەر زەوی وە
  لە هەتاهەتايدا.
- لەژيانی پێش سەر زەوی كوڕ وكچە ڕەوانيەكان خودايان ناسيوە و پەرستويانە وەك باوكێكی هەميشەيی و هەتاهەتايی،
  وە ئەو پلانەی خودايان پەسەندكرد بەوەی كە ڕۆڵەكانی بتوانن جەستەيەك وەربگرن لە گۆشت و خوێن وئەزمونێك وەربگرن
  لەسەر زەوی بە ئامانجی گەشەسەندنيان بەرەو كامل بوون و بەدەستهێنانی چارەنوسی خوداييان و بە ميرات گرتنی
  ژيانی هەميشەيی لە كۆتايی ڕێگاكەدا. پلانی خۆشبەختی خودايی وادەكات كە پەيوەندی خێزانی بەردەوام بێت لە
  دوای مردنيش. ئەو بۆنەو دەستنيشان كردن و پەيمان نامەپيرۆزانەی كە ئەنجام ئەدرێت لە پەرستگا (هيكل) پيرۆزەكان
  وادەكات كە تاكەكان بگەڕێنەوە بۆلای خودا، وەڕێدەدرێت كە خێزانەكان پێكەوەبن (يەكگرتووبن) بۆ هەتاهەتاییە.
- يەكەم ڕاسپاردە كە خودا بەخشی بە ئادەم و حەوا پەيوەستدار بوو بە تواناو ئەزموون كردنيان وەك باوك ودايك.
  ئێمە پێتان ڕادەگەيەنين كە ڕاسپاردەی خودا بۆ ڕۆڵەكانی سەبارەت بە بەرداربوون و زۆربوون پڕكردنی زەوی تا
  ئێستا كارپێكراوە. هەروەها ڕايدەگەيەنين كە خودا ڕايسپاردوين بە پەيڕەو كردنی توانای ئافراندنی پيرۆز تەنها
  لە نێوان ژن و پياوێك كە لە ڕێی هاوسەرگيريەوە بەيەك گەيشتوون.
- ئێمە ڕايدەگەيەنين كە ئەو ڕێگەيەی ژيانی پێ ئافرێنرێت لەسەر زەوی ئەوە ئەو ڕێگەيەيە كە خودا دايناوە. جەخت
  دەكەينەوە لەسەر پيرۆزی ژيان و گرنگيەكەی لە پلانی هەميشەی خودادا.
- بەر پرسياريەتيەكی جدی پيرۆز لە ئەستۆی ژن و مێردە بەوەی يەكتريان خۆش بوێت و گرنگی بە يەكتری بدەن وهەروەها
  منداڵەكانيان خۆش بوێت وگرنگيان پێ بدەن. ”منداڵان میراتن لە خوداوە“ (زەبووری ١٢٧‏:٣). ئەركێكی پيرۆز ئەكەوێتە
  ئەستۆی دايك و باوك بەوەی ڕۆڵەكانيان پەروەردە بكەن بە خۆشەويستی و بە چاكە، بە دابينكردنی پێداويستیە جەستەی
  و ڕوانيەكانيان و فێركردنی خۆشەويستی وخزمەتكردنی يەكتری بە پاراستنی ڕاسپاردنەكانی خودا، وە ڕەفتاركردن
  وەك هاونيشتمانيەك كە ڕێزی ياسا بگرن لە هەرجێيەك كە لێی بژين. ژن و مێرد — باوك و دايك — بەرپرس دەبن لە
  بەردەم لێپێچينەوەی خودا لەسەر بە ئەنجام گەياندنی ئەم ئەركانە.
- خێزانەكە خودا بنيادیناوە. هاوسەرگيريش لە نێوان ژن و پياوێك توخمێكی بنچينەييە لە پلانە هەميشەييەكەدا.
  منداڵان مافی ئەوەيان هەيە كە لە دايك ببن لە نێوەندی هاوسەرگيریدا وە پەروەردەبكرێن لە لايەن باوك و دايكێك
  كە ڕێزی پەيماننامەی هاوسەرگيری بگرن بە وەفاداريەكی تەواوەوە. دەرفەتی بە ديهاتنی بەختەوەری لە ژيانی خێزانی
  دا زياتر دەبێت ئەگەر ئەم خێزانە بنيات نرابێت لەسەر فێركاريەكانی يەسوعی مسيح. هاوسەرگيری و خێزانی سەركەوتوو
  هەر لەسەرەتاوە و بەبەردەوامی سەرنج دەخەنە سەر بنەماكانی باوەڕ و نوێژ و تۆبەكردن و لێخۆشبوون و ڕێزگرتن
  و خۆشەويستی و ميهرەبانی و كاركردن و چالاكيە تەرفيهيە بەسودەكان. بە پێی پلانەكەی خودا دەبێت باوك سەرۆكايەتی
  خێزانەكەی بكات بە خۆشەويستى و چاكە و بەرپرسياريشە لە دابينكردنی پێداويستيە سەرەكيەكانی ژيان و پاراستنی
  خێزان. بەرپرسياريەتی سەرەكی دايكيش پەروەردەكردنی ڕۆڵەكانە. لەساتی بە ئەنجام ئەم كارە پيرۆزانەدا دەبێت
  باوك و دايك هاوكارى يەكتر بن، وەك دوو هاوبەشی يەكسان. لە هەر بارودۆخێكی ناچاری وەك (كەم ئەندامی — مردن
  — يان هەردۆخێكی تر) دەگونجێت بەرپرسياريەتيەكان تاك لايەنانە بەڕێوە ببرێت. پێويستە كەسە نزيكەكانی تر
  پاڵپشتی پێشكەش بكەن لەكاتی پێويستی دا.
- ئێمە ئاگاداری ئەو كەسانە دەكەينەوە كە سەرپێچی دەكەن لە شكاندنی پەيمان نامەی پاكيزەیی ئازارى هاوسەر و
  ڕۆلەكانيان دەدەن يان پابەند نين بە بەرپرسياريەتيەكانی خێزانەوە ئەوانە لە بەردەم خودا دەوەستێنرێن بۆ
  لێپێچينەوە. هۆشداری دەدەين كە هەڵوەشانەوەی خێزان كارەسات جێدەهێڵێ لەسەر تاكەكان و كۆمەڵگاكان و نەتەوەكان
  كە پێغەمبەرانی پێشتر و ئێستاش پێشبينيان كردووە.
- ئێمە داوا دەكەين كە هەموو هاونيشتمانيەكی بەرپرسيار و هەموو بەرپرسێك لە دەسەڵاتدا لە هەرشوێنێكن هەموو
  ئەو ڕێ و شوێنانە هان بدەن كە ئامانج لێي پاراستنی خێزان و پشتگيری كردنيەتی وەك يەكەيەكی سەرەكی لە كۆمەڵگادا.
