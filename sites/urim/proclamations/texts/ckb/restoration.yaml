title: گەڕاندنەوەی پڕی ئینجیلی یەسوعی مەسیح
subtitle: ڕاگەیاندنێکی دوو سەدەمین ساڵەی بۆ جیهان
author: سەرۆکایەتی یەکەم و ئەنجومەنی دوانزە پەيامبەرەكەی كڵێسای یەسوعی مەسیح بۆ پیرۆزانی ڕۆژانی دواتر
note: ئەم ڕاگەیاندنە لەلایەن سەرۆک ڕوسیل ئێم نیلسۆن وەک بەشێک لە پەیامەکەی لە ١٩٠هەمین کۆنفرانسی گشتی
  ساڵانەی ٥ی نیسانی ٢٠٢٠ لە شاری سالت لەیک سیتی لە ویلایەتی یوتا خوێندرایەوە.
paragraphs:
- ئێمە بە ڕێزەوە ڕایدەگەیەنین کە خودا لە هەموو نەتەوەیەکی جیهاندا منداڵەکانی خۆشدەوێت. خودای باوک لەدایکبوونی
  خودایی و ژیانی بێهاوتای و قوربانی کەفارەتی بێکۆتایی کوڕە خۆشەویستەکەی یەسوعی مەسیحی پێبەخشیوین. بە هێزی
  باوک یەسوع هەستایەوە و سەرکەوتنی بەسەر مردندا بەدەستهێنا. ئەو ڕزگارکەر و نموونەیی و ڕزگارکەرمانە.
- دوو سەد ساڵ لەمەوبەر، لە بەیانییەکی جوانی بەهاردا لە ساڵی ١٨٢٠، جۆزێف سمیس گەنج کە هەوڵی دەدا بزانێت
  بەشداری کام کڵێسا بکات، چووە ناو دارستانەکانەوە بۆ نوێژکردن لە نزیک ماڵەکەی لە باکووری ویلایەتی نیویۆرک
  لە ئەمریکا. پرسیاری هەبوو سەبارەت بە ڕزگاری ڕۆحی و متمانەی هەبوو کە خودا ئاراستەی دەکات.
- بە خۆبەزلزانینەوە ڕایدەگەیەنین کە لە وەڵامی دوعاکەیدا، خودای باوک و کوڕەکەی، یەسوعی مەسیح، بۆ جۆزێف
  دەرکەوتن و دەستیان بە ”چاککردنەوەی هەموو شتێک“ کرد (کردار ٣‏:٢١) وەک لە کتێبی پیرۆزدا پێشبینی کراوە.
  لەم بینینەدا فێری ئەوە بوو کە دوای مردنی نێردراوانی ڕەسەن، كڵێسای مەسیحی پەیمانی نوێی لە زەوی ون بووە.
  جۆزێف ئامرازی گەڕانەوەی دەبوو.
- ئێمە دووپاتی دەکەینەوە کە لە ژێر ڕێنمایی باوک و کوڕدا، نێردراوانی ئاسمانی هاتبوون بۆ ڕێنماییکردنی جۆزێف
  و دامەزراندنەوەی كڵێسای یەسوعی مەسیح. یۆحەنای زیندووبووەوە دەسەڵاتی مەعمودی بە نوقمکردن گەڕاندەوە بۆ
  لێخۆشبوونی گوناهەکان. سێ لە دوانزە نێردراوی سەرەتایی — پەترۆس، یاقوب و یۆحەنا — نێردراویبوون و کلیلی
  دەسەڵاتی کاهینایەتییان گەڕاندەوە. هەندێکی تریش هاتنە ناوەوە، لەنێویاندا ئیلیا کە دەسەڵاتی گەڕاندەوە
  بۆ ئەوەی خێزانەکان بۆ هەمیشە پێکەوە ببەستنەوە لە پەیوەندییە هەمیشەییەکان کە لە مردن تێدەپەڕن.
- 'ئێمە زیاتر شایەتحاڵی ئەوە دەبین کە جۆزێف سمیس بەخشش و هێزی خودای پێدراوە بۆ وەرگێڕانی تۆمارێکی کۆن:
  کتێبی مۆرمون — پەیمانێکی دیکەی یەسوعی مەسیح. لاپەڕەکانی ئەم دەقە پیرۆزە باسێک لە خزمەتکردنی کەسی یەسوعی
  مەسیح لە نێوان خەڵکی نیوەگۆی ڕۆژئاوادا لەخۆدەگرێت کە بەم زووانە دوای زیندووبوونەوەی. فێری ئامانجی ژیان
  دەکات و عەقیدەی مەسیح ڕوون دەکاتەوە کە ناوەندی ئەو مەبەستەیە. وەک کتێبی پیرۆز وەک هاوڕێی کتێبی پیرۆز،
  کتێبی مۆرمون شایەتحاڵی ئەوە دەدات کە هەموو مرۆڤەکان کوڕ و کچی باوکێکی خۆشەویستن لە ئاسمان، کە ئەو پلانێکی
  خودایی هەیە بۆ ژیانمان، و کوڕەکەی، یەسوعی مەسیح، ئەمڕۆش قسە دەکات وەک لە ڕۆژانی کۆن.'
- ئێمە ڕایدەگەیەنین کە كڵێسای یەسوعی مەسیح بۆ پیرۆزانی ڕۆژانی دواتر کە لە ٦ی نیسانی ١٨٣٠ ڕێکخراوە، کڵێسای
  مەسیحی پەیمانی نوێی کە نۆژەن کراوەتەوە. ئەم کڵێسایە لە ژیانی تەواوەتی بەردی بناغەی سەرەکی خۆیدا، یەسوعی
  مەسیح، و لە کەفارەتی بێکۆتایی و زیندووبوونەوەی ڕستەیی ئەودا لەنگەری گرتووە. یەسوعی مەسیح جارێکی تر بانگی
  نێردراوانی کردووە و دەسەڵاتی کاهینایەتی پێبەخشیون. ئەو هەموومان بانگهێشت دەکات کە بێینە لای ئەو و کڵێساکەی،
  ڕۆحی پیرۆز و ڕێوڕەسمەکانی ڕزگاربوون وەربگرین و خۆشییەکی بەردەوام بەدەست بهێنین.
- ئێستا دوو سەد ساڵ تێپەڕیوە بەسەر دەستپێکردنی ئەم گەڕاندنەوەیە لەلایەن خودای باوک و کوڕە خۆشەویستەکەیەوە،
  یەسوعی مەسیح. ملیۆنان کەس لە سەرانسەری جیهاندا زانیارییەکیان لەم ڕووداوە پێشبینیکراوانەی لە باوەش گرتووە.
- ئێمە بە خۆشحاڵیەوە ڕایدەگەیەنین کە نۆژەنکردنەوەی بەڵێندراو لە ڕێگەی ئاشکراکردنی بەردەوامەوە بەرەو پێشەوە
  دەڕوات. زەوی هەرگیز وەک جاران نابێتەوە، وەک چۆن خودا ”هەمۆ شتێک لە زەوی و ئاسمان لەژێر دەسەڵاتی مەسیحدا“
  (ئەفەسۆس ١‏:١٠).
- بە ڕێز و سوپاسەوە، ئێمە وەک نێردراوانی بانگهێشتی هەمووان دەکەین بۆ ئەوەی بزانن — وەک چۆن دەیزانین —
  کە ئاسمانەکان کراوەن. ئێمە دووپاتی دەکەینەوە کە خودا ویستی خۆی بۆ کوڕ و کچە خۆشەویستەکانی ئاشکرا دەکات.
  ئێمە شایەدی ئەوە دەدەین کە ئەوانەی بە نوێژەوە پەیامی گەڕاندنەوە دەخوێننەوە و بە ئیمانەوە کار دەکەن،
  بەختەوەر دەبن کە شایەتحاڵی خۆیان لەسەر خوداییبوونی و ئامانجەکەی بۆ ئامادەکردنی جیهان بۆ هاتنی دووەمی
  بەڵێندراوی پەروەردگار و ڕزگارکەرمان، یەسوعی مەسیح بەدەستبهێنن.
