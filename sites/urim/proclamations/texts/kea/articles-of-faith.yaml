title: Regras di Fé di Igreja di Jezus Kristu di Santus di Últimus Dias
subtitle: ''
author: ''
verses:
- n: 1
  text: Nu ta kridita na Deus, Pai Itérnu, y na Si Fidju, Jezus Kristu, y na Spíritu Santu.
- n: 2
  text: Nu ta kridita ma ómis ta ser punidu pa ses própi pekadu, y non pa transgrison di Adon.
- n: 3
  text: Nu ta kridita ma pur meiu di Spiason di Kristu, tudu umanidadi podi ser salvu, pa obidiénsia a
    leis y ordenansas di Ivanjélhu.
- n: 4
  text: 'Nu ta kridita ma prumerus prinsípius y ordenansas di Ivanjélhu é: prumeru, Fé na Sinhor Jezus
    Kristu; sugundu, Rapendimentu; tirseru, Batismu pa imerson pa rimison di pekadus; kuartu, Inpuzison
    di mô pa don di Spiritu Santu.'
- n: 5
  text: Nu ta kridita ma un ómi debi ser txomadu pa Deus, pa prufesia, y pa inpuzison di mo pa kenha ki
    ten autoridadi, pa prega Ivanjélhu y pa adiministra si ordenansas.
- n: 6
  text: Nu ta kridita na mésmu organizason ki ta izistiba na Igreja Primitivu, nomiadamenti, apóstulus,
    prufétas, pastoris, profesores, ivanjelistas, etc.
- n: 7
  text: Nu ta kridita na don di línguas, prufesia, rivelason, vizons, kura, intirpretason di línguas,
    etc.
- n: 8
  text: Nu ta kridita ma Biblia é palavra di Deus désdi k’e sta traduzidu kuretamenti; tanbe nu ta kridita
    ma Livru di Mórmon é palavra di Deus.
- n: 9
  text: Nu ta kridita na tudu ki Deus dja rivela, na tudu ki El sta ta rivela gósi, y nu ta kridita ma
    inda El ta rivela txeu kuzas grandi y inpurtanti sobri Reinu di Deus.
- n: 10
  text: Nu ta kridita na koligason literal di Israel y na ristorason di Dés Tribus; ma Sion (Novu Jeruzalén)
    ta ser konstruídu na kontinenti Amerikanu; ma Kristu ta ben reina psualmenti na téra; y, ma téra ta
    ser rinovadu y ta resebi si glória paradizíaku.
- n: 11
  text: Nu ta reivindika privilégiu di adora Deus Tudu-Puderozu di akordu ku nos própri konsiénsia y nu
    ta da tudu ómi es mésmu privilégiu, p’es adora modi, undi ô kuzé k’es kre.
- n: 12
  text: Nu ta kridita na submison a reis, prizidentis, governantis, majistradus, na obidesi, onra y apoia
    lei.
- n: 13
  text: Nu ta kridita na ser onestu, verdaderu, kastu, binivolenti, virtuozu, y na fazi ben pa tudu ómi;
    na rialidadi, nu podi fla ma nu ta sigi admuestason di Paulu — Nu ta kridita na tudu kuza, nu ta spera
    na tudu kuza, dja nu suporta txeu kuza, y nu ta spera ma nu ta ser kapás di suporta tudu kuza. Si
    tiver kalker kuza virtuozu, amável, di bon fama ô louvável nu ta prukura-s.
signature: Josefe Smit.
