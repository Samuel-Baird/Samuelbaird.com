title: Die Herstelling van die Volheid van die Evangelie van Jesus Christus
subtitle: ’n Tweehonderdjarige Proklamasie aan die Wêreld
author: Die Eerste Presidensie en Raad van die Twaalf Apostels van die Kerk van Jesus Christus van die
  Heiliges van die Laaste Dae
note: Hierdie proklamasie is deur President Russell M. Nelson gelees as deel van sy boodskap by die 190ste
  Jaarlikse Algemene Konferensie, 5 April 2020, in Salt Lake City, Utah.
paragraphs:
- Ons verklaar plegtig dat God sy kinders in elke nasie van die wêreld liefhet. God die Vader het ons
  die goddelike geboorte, die onvergelyklike lewe, en die oneindige soenoffer van sy Geliefde Seun, Jesus
  Christus, gegee. Deur die mag van die Vader, het Jesus weer opgestaan en die dood oorwin. Hy is ons
  Saligmaker, ons Voorbeeld, en ons Verlosser.
- Tweehonderd jaar gelede, op ’n pragtige lente-oggend in 1820, het Joseph Smith na die woud naby sy huis
  in noordelike New York, VSA, gegaan om te bid om te weet by watter kerk hy moes aansluit. Hy het vrae
  gehad aangaande die heil van sy siel en het vertrou dat God hom sou lei.
- Ons verklaar in nederigheid dat God die Vader en sy Seun, Jesus Christus, in antwoord op sy gebed aan
  Joseph verskyn het en die “wederoprigting van alle dinge” (Handelinge 3:21) ingelui het soos in die
  Bybel voorspel is. Hy het in hierdie visioen geleer dat Christus se Nuwe Testamentiese Kerk ná die dood
  van die oorspronklike Apostels ophou bestaan het op die aarde. Joseph sou instrumenteel wees in die
  terugkeer daarvan.
- Ons bevestig dat onder die leiding van die Vader en die Seun, hemelse boodskappers gekom het om Joseph
  te onderrig en die Kerk van Jesus Christus te hervestig. Die herrese Johannes die Doper het die gesag
  om te doop deur onderdompeling vir die vergifnis van sondes herstel. Drie van die oorspronklike twaalf
  Apostels—Petrus, Jakobus en Johannes—het die apostelskap en sleutels van priesterskapsgesag herstel.
  Andere het ook gekom, insluitend Elía, wat die gesag om families vir ewig in ewige verhoudings te bind
  wat die dood transendeer.
- 'Ons getuig verder dat Joseph Smith die gawe en mag van God gegee is om ’n antieke kroniek: die Boek
  van Mormon—Nog ’n Testament van Jesus Christus, te vertaal. ’n Deel van hierdie heilige teks sluit in
  ’n verslag van die persoonlike bediening van Jesus Christus onder die mense in die Westelike Halfrond
  kort ná sy Opstanding. Dit leer omtrent die doel van die lewe en verduidelik die leer van Christus,
  wat sentraal tot dié doel is. As ’n meegaande skriftuur tot die Bybel, getuig die Boek van Mormon dat
  alle mense seuns en dogters van ’n liefdevolle Hemelse Vader is, dat Hy ’n goddelike plan vir ons lewens
  het, en dat sy Seun, Jesus Christus, vandag spreek net soos in die dae van ouds.'
- Ons verklaar dat die Kerk van Jesus Christus van die Heiliges van die Laaste Dae, georganiseer op 6
  April 1830, Christus se herstelde Kerk van die Nuwe Testament is. Hierdie Kerk is geanker in die volmaakte
  lewe van sy hoof hoeksteen, Jesus Christus, en in sy oneindige Versoening en letterlike Opstanding.
  Jesus Christus het weer eens Apostels geroep en hulle priesterskapsgesag gegee. Hy nooi ons almal om
  na Hom en sy Kerk te kom, om die Heilige Gees, en die ordinansies van heil te ontvang, en om ewigdurende
  vreugde te ontvang.
- Tweehonderd jaar het nou verbygegaan sedert hierdie Herstelling deur God die Vader en sy Geliefde Seun,
  Jesus Christus, begin is. Miljoene dwarsoor die wêreld het ’n kennis van hierdie voorspelde gebeure
  aangegryp.
- Ons verklaar met vreugde dat die beloofde Herstelling voortgaan deur voortdurende openbaring. Die wêreld
  sal nooit weer dieselfde wees nie, omdat God “alle dinge onder een hoof in Christus [sal] verenig” (Efésiërs
  1:10).
- Met eerbied en dankbaarheid nooi ons as sy Apostels almal om te weet—soos ons—dat die hemele geopen
  is. Ons bevestig dat God sy wil vir sy geliefde seuns en dogters bekendmaak. Ons getuig dat diegene
  wat die boodskap van die Herstelling biddend bestudeer en in geloof optree, geseënd sal wees om hul
  eie getuienis van die goddelikheid en doel daarvan te ontvang om die wêreld voor te berei vir die beloofde
  Tweede Koms van ons Here en Saligmaker, Jesus Christus.
