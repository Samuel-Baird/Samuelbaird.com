title: Die Geloofsartikels
subtitle: van die Kerk van Jesus Christus van die Heiliges van die Laaste Dae
author: ''
verses:
- n: 1
  text: Ons glo in God, die Ewige Vader, en in sy Seun, Jesus Christus, en in die Heilige Gees.
- n: 2
  text: Ons glo dat die mens vir sy eie sondes gestraf sal word, en nie vir Adam se oortreding nie.
- n: 3
  text: Ons glo dat deur die Versoening van Christus, die ganse mensdom gered mag word, deur gehoorsaamheid
    aan die wette en ordinansies van die Evangelie.
- n: 4
  text: 'Ons glo dat die eerste beginsels en ordinansies van die Evangelie is: eerstens, Geloof in die
    Here Jesus Christus; tweedens, Bekering; derdens, Doop deur onderdompeling vir die vergifnis van sondes;
    vierdens, Oplegging van hande vir die gawe van die Heilige Gees.'
- n: 5
  text: Ons glo dat ’n man deur God geroep moet word, deur profesie, en deur die oplegging van hande deur
    diegene wat gesag besit, om die Evangelie te predik en die ordinansies daarvan te bedien.
- n: 6
  text: Ons glo in dieselfde organisasie wat bestaan het in die Primitiewe Kerk, naamlik, apostels, profete,
    herders, leraars, evangeliste, ensovoorts.
- n: 7
  text: Ons glo in die gawe van tonge, profesie, openbaring, visioene, genesing, uitlegging van tonge,
    ensovoorts.
- n: 8
  text: Ons glo dat die Bybel die woord van God is in soverre dit korrek vertaal is; ons glo ook dat die
    Boek van Mormon die woord van God is.
- n: 9
  text: Ons glo alles wat God geopenbaar het, alles wat Hy nou openbaar, en ons glo dat Hy nog vele groot
    en belangrike dinge betreffende die Koninkryk van God sal openbaar.
- n: 10
  text: Ons glo in die letterlike versameling van Israel en in die herstelling van die Tien Stamme; dat
    Sion (die Nuwe Jerusalem) op die Amerikaanse kontinent gebou sal word; dat Christus persoonlik op
    die aarde sal heers; en, dat die aarde vernuwe sal word en haar paradyslike heerlikheid sal ontvang.
- n: 11
  text: Ons eien ons die voorreg toe om die Almagtige God te aanbid ooreenkomstig die stem van ons eie
    gewete, en gun alle mense dieselfde voorreg, laat hulle aanbid hoe, waar, of wat hulle wil.
- n: 12
  text: Ons glo daarin om onderworpe te wees aan konings, presidente, heersers en magistrate, deur die
    wet te gehoorsaam, te eer en te onderskraag.
- n: 13
  text: Ons glo daarin om eerlik, getrou, kuis, welwillend en deugsaam te wees, en om goed te doen aan
    alle mense; inderdaad mag ons sê dat ons die vermaning van Paulus navolg—Ons glo alle dinge, ons hoop
    alle dinge, ons het baie dinge verduur, en hoop om in staat te wees om alle dinge te verduur. Indien
    daar enigiets is wat deugsaam, lieflik, of van goeie berig of prysenswaardig is, strewe ons na daardie
    dinge.
signature: Joseph Smith.
