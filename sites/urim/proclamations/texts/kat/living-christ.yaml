title: ცოცხალი ქრისტე
subtitle: მოციქულების დამოწმება
author: უკანასკნელ დღეთა წმინდანთა იესო ქრისტეს ეკლესია
paragraphs:
- როდესაც აღვნიშნავთ იესო ქრისტეს დაბადებიდან ორი ათას წლისთავს, ჩვენ ვმოწმობთ მისი ცხოვრების შეუდარებელი
  სიცოცხლის რეალობისა და დიადი გამომსყიდველი მსხვერპლშეწირვის უსაზღვრო სათნოების შესახებ. არავის ჰქონია
  ასეთი სიღრმისეული გავლენა ნებისმიერ ადამიანზე, რომელსაც უცხოვრია და მომავალში იცხოვრებს დედამიწაზე.
- იგი ძველი აღთქმის დიდი იეჰოვა და ახალი აღთქმის მესია იყო. თავისი მამის მითითებით იგი გახდა დედამიწის
  შემქმნელი. „ყოველივე მის მიერ შეიქმნა და უიმისოდ არაფერი შექმნილა, რაც კი შექმნილა“ (იოანე 1:3). იყო
  უმანკო, მაგრამ მოინათლა, რომ სამართლიანობა აღედგინა. იგი „დადიოდა, ქველმოქმედებდა“ (საქმეები 10:38),
  თუმცა ამისთვის იყო მოძულებული. მისი სახარება მშვიდობის და კეთილი ნების გზავნილი იყო. იგი ყველას მოუწოდებდა,
  მიებაძათ მისი მაგალითისთვის. დადიოდა პალესტინის გზებზე, სნეულებს კურნავდა, ბრმებს თვალს უხელდა და გარდაცვლილებს
  აცოცხლებდა. ასწავლიდა მარადიულობის ჭეშმარიტებას, ჩვენი წინამიწიერი არსებობის სინამდვილის, ამქვეყნად
  ჩვენი ცხოვრების მიზნისა და მომავალ ცხოვრებაში ღმერთის ძეთა და ასულთა შესაძლებლობების შესახებ.
- მან დააწესა ზიარების წეს-ჩვეულება, როგორც სახსოვარი თავისი დიდი გამომსყიდველი მსხვერპლშეწირვისა. იგი
  ყალბი ბრალდებებით შეიპყრეს, გაასამართლეს, დააკმაყოფილეს ბრბოს მოთხოვნები და გოლგოთაზე ჯვარზე გაკვრა
  მიუსაჯეს. მან თავისი სიცოცხლე კაცობრიობის ცოდვებს შესწირა. ეს იყო დიდი ძღვენი ყველასთვის, ვინც კი ოდესმე
  იცხოვრებდა დედამიწაზე.
- ჩვენ საზეიმოდ ვმოწმობთ, რომ მისი ცხოვრება, რომელსაც განსაკუთრებული მნიშვნელობა აქვს კაცობრიობის ისტორიისათვის,
  არც ბეთლემში დაწყებულა და არც გოლგოთაზე დასრულებულა. იგი მამის პირმშო, მხოლოდშობილი ხორციელი ძე და სამყაროს
  გამომსყიდველი იყო.
- იგი მკვდრეთით აღდგა და გახდა „განსვენებულთა ნათავარი“ (1 კორინთელთა 15:20). როგორც აღმდგარი უფალი იგი
  ეწვია მათ, ვინც ამქვეყნიურ ცხოვრებაში უყვარდა. იგი ასევე ემსახურა თავის „სხვა ცხვრებ[ს]“ (იოანე 10:16)
  ძველ ამერიკაში. თანამედროვე სამყაროში იგი და თავისი მამა გამოეცხადნენ ყმაწვილ ჯოზეფ სმითს და ამით დიდი
  ხნის წინ დაპირებული „ჟამთა აღვსებ[ა]“ (ეფესელთა 1:10) დაიწყო.
- 'ცოცხალ ქრისტეზე წინასწარმეტყველმა ჯოზეფ სმითმა ასე დაწერა: „მისი თვალები იყო, ვითარცა ალი ცეცხლისა,
  თმები მის თავზე იყო სპეტაკი, როგორც სუფთა თოვლი; სახე უბრწყინავდა მზეზე უფრო მეტად და ხმა მისი იყო აღელვებული
  დიდი წყლების ხმასავით, იეჰოვას ხმა, რომელიც ამბობდა:'
- მე ვარ პირველი და უკანასკნელი, მე ვარ ის, რომელიც ცოცხალია, მე ვარ ის, რომელიც მოკლეს, მე ვარ თქვენი
  ქომაგი მამასთან“ (მ.ა. 110:3–4).
- 'წინასწარმეტყველმა ასევე განაცხადა: „და ახლა, მრავალი დამოწმების შემდეგ, რომლებიც მასზე მიღებულ იქნა,
  ეს არის ყველაზე ბოლო დამოწმება, რომელსაც მასზე ვიძლევით: იგი ცოცხალია!'
- ვინაიდან, ვიხილეთ იგი, თვით ღმერთის მარჯვენა მხარეს და მოვისმინეთ ხმა დამმოწმებელი, რომ იგი არის მამის
  მხოლოდშობილი –
- რადგან მის მიერ, მისი მეშვეობით და მისგან არის და იყო სამყაროები შექმნილი და მათი მცხოვრებნი არიან ღვთის
  ძენი და ასულნი“ (მ.ა. 76:22–24).
- ჩვენ საზეიმოდ ვაცხადებთ, რომ მისი მღვდლობა და მისი ეკლესია აღდგენილ იქნა დედამიწაზე – დაშენებული „მოციქულთა
  და წინასწარმეტყველთა საძირკველზე, სადაც თვითონ ქრისტე იესოა ქვაკუთხედი“ (ეფესელთა 2:20).
- ჩვენ ვმოწმობთ, რომ დადგება დღე, როდესაც იგი დაბრუნდება დედამიწაზე. „გამოჩნდება უფლის დიდება და იხილავს
  მას ყველა ხორციელი ერთიანად“ (ესაია 40:5). იგი მართავს, ვითარცა მეუფეთა მეუფე და იმეფებს, ვითარცა უფალთა
  უფალი. და მის წინაშე ყოველი მუხლი მოიდრიკება და ყოველი ენა აღიარებს ღმერთს. ყოველი ჩვენგანი მის წინაშე
  დადგება გასასამართლებლად ჩვენ მიერ ჩადენილი საქმეებისა და ჩვენი გულის წადილის გამო.
- ჩვენ, როგორც სათანადო წესით ხელდასხმული მისი მოციქულები ვმოწმობთ, რომ იესო ცოცხალი ქრისტეა, ღმერთის
  უკვდავი ძე. იგი დიდი მეფე ემანუელია, რომელიც დღეს თავისი მამის მარჯვენა მხარეს დგას. იგი სამყაროს სინათლე,
  სიცოცხლე და იმედია. მისი გზა არის ბილიკი, რომელიც ამ ცხოვრებაში მიგვიძღვის ბედნიერებისკენ და მომავალ
  სამყაროში – მარადიული სიცოცხლისკენ. დიდება ღმერთს მისი უბადლო ძღვენის – ღვთიური ძისთვის.
