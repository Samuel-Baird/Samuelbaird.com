retrieved: '2026-11-02'
title: იესო ქრისტეს სახარების სისრულის აღდგენა
subtitle: ორასი წლისადმი მიძღვნილი მოწოდება მსოფლიოს
author: უკანასკნელ დღეთა წმინდანთა იესო ქრისტეს ეკლესიის პირველი პრეზიდენტობა და თორმეტ მოციქულთა საბჭო
note: ეს მოწოდება წაკითხულ იქნა პრეზიდენტ რასელ მ. ნელსონის მიერ 2020 წ. 5 აპრილს, სოლთ-ლეიქ სითიში, იუტაში,
  190-ე გენერალურ კონფერენციაზე სიტყვით გამოსვლის დროს.
paragraphs:
- ჩვენ საზეიმოდ ვაცხადებთ, რომ ღმერთს უყვარს თავისი შვილები მსოფლიოს ყველა ხალხში. მამა ღმერთმა გვიბოძა
  ღვთიური დაბადება, შეუდარებელი სიცოცხლე და თავისი საყვარელი ძის, იესო ქრისტეს, უსაზღვრო გამომსყიდველი
  მსხვერპლი. მამის ძალის მეშვეობით იესო კვლავ აღდგა და გაიმარჯვა სიკვდილზე. ის არის ჩვენი გამომსყიდველი,
  მაგალითი და მხსნელი.
- ორასი წლის წინ, 1820 წ. გაზაფხულის ლამაზ დილას, ახალგაზრდა ჯოზეფ სმითი წავიდა სახლთან ახლოს მდებარე
  ტყეში, აშშ-ს ნიუ-იორკის შტატის ჩრდილოეთ მხარეს, რათა ელოცა და გაეგო, რომელ ეკლესიას შეერთებოდა. მას
  ჰქონდა საკუთარი სულის ხსნასთან დაკავშირებული კითხვები და სწამდა, რომ ღმერთი მიუთითებდა გზას.
- მორჩილებით ვაცხადებთ, რომ პასუხად ამ ლოცვაზე მამაღმერთი და მისი ძე, იესო ქრისტე, მოევლინნენ ჯოზეფს და
  დაიწყო ბიბლიაში ნაწინასწარმეტყველები „ყველაფრის აღდგენა“ (საქმეები 3:21). ამ ხილვაში მან შეიტყო, რომ
  თავდაპირველი მოციქულების სიკვდილის შემდეგ ქრისტეს ახალი აღთქმის ეკლესია აღარ არსებობდა დედამიწაზე. ჯოზეფი
  იქნებოდა მისი დაბრუნების იარაღი.
- ჩვენ ვამტკიცებთ, რომ მამისა და ძის ხელმძღვანელობით ჯოზეფს მოევლინნენ ზეციური მაცნეები მითითებების მისაცემად
  და იესო ქრისტეს ეკლესიის აღსადგენად. აღმდგარმა იოანე ნათლისმცემელმა აღადგინა წყალში სრული ჩაძირვით ცოდვების
  მისატევებელი ნათლობის უფლებამოსილება. პირველთაგან სამმა მოციქულმა – პეტრემ, იაკობმა და იოანემ აღადგინეს
  მოციქულობა და მღვდლობის გასაღებები. ასევე მოევლინნენ სხვებიც, ელიას ჩათვლით, რომელმაც აღადგინა ოჯახების
  სამუდამოდ გაერთიანების უფლებამოსილება მარადიულ ურთიერთობებში, რაც სცდება სიკვდილის ჩარჩოებს.
- 'ჩვენ ასევე ვმოწმობთ, რომ ჯოზეფ სმითს ებოძა ღვთის ძალა და ძღვენი, ეთარგმნა უძველესი ჩანაწერი – მორმონის
  წიგნი: კიდევ ერთი დამოწმება იესო ქრისტეს შესახებ. ამ წმინდა ტექსტის ფურცლები მოიცავს აღდგომიდან მალევე
  დასავლეთ ნახევარსფეროში იესო ქრისტეს პირადი მსახურების ჩანაწერს. იგი ასწავლის ცხოვრების აზრის შესახებ
  და გვიხსნის ქრისტეს მოძღვრებას, რომელიც წარმოადგენს ამ აზრის ცენტრალურ ნაწილს. მორმონის წიგნი არის რა
  ბიბლიის თანმხლები, მოწმობს, რომ ყოველი ადამიანი არის მოსიყვარულე ზეციური მამის ძე ან ასული, რომ მას
  აქვს ღვთიური გეგმა ჩვენი ცხოვრებისთვის და რომ მისი ძე, იესო ქრისტე, დღესაც გვესაუბრება ისევე, როგორც
  ძველ დროში.'
- ჩვენ ვაცხადებთ, რომ უკანასკნელ დღეთა წმინდანთა იესო ქრისტეს ეკლესია, რომელიც დაარსდა 1830 წ. 6 აპრილს,
  არის ქრისტეს ახალი აღთქმის აღდგენილი ეკლესია. ეკლესიამ მყარად დაისადგურა თავისი ქვაკუთხედის, იესო ქრისტეს,
  სრულყოფილ ცხოვრებაში, მის გამომსყიდველ ძალასა და მის აღდგენაში, ამ სიტყვის სრული მნიშვნელობით. იესო
  ქრისტემ კიდევ ერთხელ მოიხმო მოციქულები და უბოძა მათ მღვდლობის უფლებამოსილება. იგი გვიწვევს ყველას, მივიდეთ
  მასთან და მის ეკლესიასთან, რათა მივიღოთ სულიწმინდა, ხსნის წეს-ჩვეულებები და ხანგრძლივი სიხარული.
- ორასი წელი გავიდა მას შემდეგ, რაც მამა ღმერთმა და მისმა საყვარელმა ძემ, იესო ქრისტემ, დაიწყეს აღდგენა.
  მილიონობით ადამიანმა მთელს მსოფლიოში მიიღო ამ ნაწინასწარმეტყველები მოვლენების ცოდნა.
- ჩვენ სიხარულით ვაცხადებთ, რომ დაპირებული აღდგენა გრძელდება უწყვეტი გამოცხადებების მეშვეობით. დედამიწა
  აღარ იქნება ისეთივე, რადგან ღმერთი „ქრისტეში მოუყრის თავს ყოველივეს“ (შეადარეთ ეფესელთა 1:10).
- მადლიერებითა და მოწიწებით ჩვენ, უფლის მოციქულები, გიწვევთ ყველას, შეიტყოთ, რამეთუ ჩვენ ეს ვიცით, რომ
  ზეცა გახსნილია. ჩვენ ვამტკიცებთ, რომ ღმერთი აცხადებს თავის ნებას თავის საყვარელ ძეთა და ასულთა მიმართ.
  ჩვენ ვმოწმობთ, რომ ისინი, ვინც ლოცვით სწავლობენ აღდგენის გზავნილს და რწმენით მოქმედებენ, იქნებიან დალოცვილნი
  და იპოვიან საკუთარ მოწმობას მის ღვთიურობასა და დანიშნულებაზე – მოამზადოს სამყარო ჩვენი უფლისა და მხსნელის,
  იესო ქრისტეს დაპირებული მეორე მოსვლისთვის.
