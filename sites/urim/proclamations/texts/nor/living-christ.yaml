title: Den levende Kristus
subtitle: Apostlenes vitnesbyrd
author: Jesu Kristi Kirke av Siste Dagers Hellige
paragraphs:
- Idet vi minnes Jesu Kristi fødsel for to tusen år siden, bærer vi vårt vitnesbyrd om realiteten av hans
  uforlignelige liv og den uendelige kraft i hans store sonoffer. Ingen annen har hatt så dyptgripende
  innflytelse på alle som har levet og kommer til å leve på jorden.
- Han var Det gamle testamentes store Jehova og Det nye testamentes Messias. Under ledelse av sin Fader
  var han jordens Skaper. “Alt er blitt til ved ham, og uten ham er ikke noe blitt til av alt som er blitt
  til” (Johannes 1:3). Selv om han var syndfri, ble han døpt for å fullbyrde all rettferdighet. Han “gikk
  omkring og gjorde vel” (Apostlenes gjerninger 10:38), men likevel ble han foraktet for det. Hans evangelium
  var et budskap om fred og velvilje. Han oppfordret alle til å følge hans eksempel. Han vandret på Palestinas
  veier, helbredet de syke, fikk de blinde til å se og oppvekket de døde. Han forkynte evighetens sannheter,
  realiteten av vår førjordiske tilværelse, hensikten med vårt liv på jorden og Guds sønners og døtres
  muligheter i det kommende liv.
- Han innstiftet nadverden som en påminnelse om sitt store sonoffer. Han ble arrestert og fordømt på falske
  anklager, erklært skyldig for å tilfredsstille en mobb og dømt til døden på Golgatas kors. Han ga sitt
  liv for å sone for hele menneskehetens synder. Hans offer var en stor stedfortredende gave til beste
  for alle som noen gang vil ha levet på jorden.
- Vi vitner høytidelig om at hans liv, som er sentralt i hele menneskehetens historie, hverken begynte
  i Betlehem eller ble avsluttet på Golgata. Han var Faderens førstefødte, den enbårne Sønn i kjødet,
  verdens Forløser.
- Han oppsto fra graven for å bli “førstegrøden av dem som er sovnet inn” (Paulus’ første brev til korinterne
  15:20). Som den oppstandne Herre besøkte han dem som han hadde kjær i livet. Han betjente også de “andre
  får” (Johannes 10:16) i oldtidens Amerika. I nyere tid viste han og hans Fader seg for gutten Joseph
  Smith og innledet den lenge lovede “husholdning i tidenes fylde” (Paulus’ brev til efeserne 1:10).
- 'Om den levende Kristus skrev profeten Joseph: “Hans øyne var som en ildslue, håret på hans hode var
  hvitt som nyfallen sne, hans åsyn skinte klarere enn solen, og hans stemme var som lyden av mektige
  fossefall, ja, endog Jehovas røst som sa:'
- ‘Jeg er den første og den siste, jeg er han som lever, jeg er han som ble slått ihjel, jeg er deres
  talsmann hos Faderen’” (L&p 110:3–4).
- 'Profeten erklærte også om ham: “Og nå, etter de mange vitnesbyrd som er gitt om ham, er dette vitnesbyrd
  som vi gir om ham, det siste av dem alle: At han lever!'
- For vi så ham, ja, ved Guds høyre hånd, og vi hørte røsten bære vitnesbyrd om at han er Faderens Enbårne,
- at ved ham og gjennom ham og av ham blir og ble verdener skapt, og deres innbyggere er født sønner og
  døtre av Gud” (L&p 76:22–24).
- Vi erklærer høytidelig at hans prestedømme er gjengitt og hans kirke gjenopprettet på jorden – “bygd
  opp på apostlenes og profetenes grunnvoll, og hjørnesteinen er Kristus Jesus selv” (Paulus’ brev til
  efeserne 2:20).
- Vi vitner om at han en dag vil komme tilbake til jorden. “Herrens herlighet skal åpenbares, og alt kjød
  skal sammen se … [det]” (Jesaja 40:5). Han vil regjere som kongers Konge og herrers Herre, og ethvert
  kne skal bøye seg, og hver tunge skal prise ham. Enhver av oss skal stå for å bli dømt av ham etter
  våre gjerninger og vårt hjertes ønsker.
- Som hans rettmessig ordinerte apostler bærer vi vitnesbyrd om at Jesus er den levende Kristus, Guds
  udødelige Sønn. Han er den store kong Immanuel, som i dag står ved sin Faders høyre hånd. Han er verdens
  lys, liv og håp. Hans vei er den sti som fører til lykke i dette liv og evig liv i den kommende verden.
  Gud være lovet for hans guddommelige Sønns uforlignelige gave.
