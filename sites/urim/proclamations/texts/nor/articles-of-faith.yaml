title: Trosartiklene
subtitle: i Jesu Kristi Kirke av Siste Dagers Hellige
author: ''
verses:
- n: 1
  text: Vi tror på Gud den evige Fader og på hans Sønn Jesus Kristus og på Den hellige ånd.
- n: 2
  text: Vi tror at menneskene vil bli straffet for sine egne synder og ikke for Adams overtredelse.
- n: 3
  text: Vi tror at hele menneskeheten kan bli frelst gjennom Kristi forsoning ved å adlyde evangeliets
    lover og ordinanser.
- n: 4
  text: 'Vi tror at evangeliets første prinsipper og ordinanser er: for det første, tro på Herren Jesus
    Kristus, for det annet, omvendelse, for det tredje, dåp ved nedsenkning til syndenes forlatelse, for
    det fjerde, håndspåleggelse for Den hellige ånds gave.'
- n: 5
  text: Vi tror at en mann må kalles av Gud, ved profeti og ved håndspåleggelse av dem som har myndighet,
    for å kunne forkynne evangeliet og forrette dets ordinanser.
- n: 6
  text: Vi tror på den samme organisasjon som fantes i den opprinnelige Kirke, nemlig apostler, profeter,
    hyrder, lærere, evangelister osv.
- n: 7
  text: Vi tror på tungemålsgaven, profeti, åpenbaring, syner, helbredelse, tydning av tunger osv.
- n: 8
  text: Vi tror at Bibelen er Guds ord så langt som den er riktig oversatt. Vi tror også at Mormons bok
    er Guds ord.
- n: 9
  text: Vi tror på alt som Gud har åpenbart, alt som han nå åpenbarer, og vi tror at han fortsatt vil
    åpenbare mange store og viktige ting angående Guds rike.
- n: 10
  text: Vi tror på Israels innsamling i bokstavelig forstand og på gjenopprettelsen av de ti stammer,
    at Sion (det nye Jerusalem) vil bli bygget på det amerikanske kontinent, at Kristus personlig vil
    regjere på jorden, og at jorden vil bli fornyet og få sin paradisiske herlighet.
- n: 11
  text: Vi fordrer rett til å dyrke Den Allmektige Gud i overensstemmelse med vår egen samvittighet, og
    innrømmer alle mennesker den samme rett. La dem tilbe hva som helst, hvor som helst og på hvilken
    som helst måte de ønsker.
- n: 12
  text: Vi tror at vi må innordne oss under konger, presidenter, fyrster og øvrighetspersoner og at vi
    må adlyde, hedre og oppholde lovene.
- n: 13
  text: Vi tror at vi må være ærlige, pålitelige, kyske, kjærlige, dydige og at vi må gjøre godt mot alle
    mennesker. Vi kan i sannhet si at vi følger Paulus’ formaning – vi tror alt, vi håper alt, vi har
    tålt meget, og vi håper å bli istand til å utholde alt. Vi trakter etter alt som er dydig, skjønt,
    prisverdig og godt.
signature: Joseph Smith.
