title: Familien
subtitle: En erklæring til verden
author: Det første presidentskap og De tolv apostlers råd i Jesu Kristi Kirke av Siste Dagers Hellige
note: Denne erklæringen ble lest av president Gordon B. Hinckley som en del av hans budskap på Hjelpeforeningens
  fellesmøte 23. september 1995 i Salt Lake City, Utah.
paragraphs:
- Vi, Det første presidentskap og De tolv apostlers råd i Jesu Kristi Kirke av Siste Dagers Hellige, erklærer
  høytidelig at ekteskap mellom mann og kvinne er innstiftet av Gud, og at familien står sentralt i Skaperens
  plan for hans barns evige fremtid.
- Alle mennesker – menn og kvinner – er skapt i Guds bilde. Hver især er en elsket ånd, sønn eller datter
  av himmelske foreldre, og har som sådan en guddommelig natur og et guddommelig potensial. Kjønn er en
  grunnleggende del av enkeltmenneskets førjordiske, jordiske og evige identitet og hensikt.
- I den førjordiske tilværelse kjente og tilba Guds åndelige sønner og døtre ham som sin evige Fader og
  aksepterte hans plan hvorved hans barn kunne få et fysisk legeme og høste jordisk erfaring for å utvikle
  seg mot fullkommenhet og til sist virkeliggjøre sitt guddommelige potensial som arvinger til evig liv.
  Den guddommelige plan for lykke muliggjør en fortsettelse av familieforholdet på den andre siden av
  graven. Hellige ordinanser og pakter som er tilgjengelige i hellige templer, gjør det mulig for enkeltmennesker
  å vende tilbake til Guds nærhet og for familier å bli evig forenet.
- Den første befaling Gud ga til Adam og Eva, gjaldt deres mulighet, som mann og hustru, til å bli foreldre.
  Vi erklærer at Guds befaling til sine barn om å bli mange og fylle jorden fortsatt står ved makt. Vi
  erklærer videre at Gud har befalt at formeringsevnens hellige kraft utelukkende skal brukes mellom en
  mann og en kvinne som er lovlig viet som ektemann og hustru.
- Vi erklærer at den måte hvorved jordisk liv blir skapt, er guddommelig forordnet. Vi stadfester livets
  hellighet og dets betydning i Guds evige plan.
- Mann og hustru har et høytidelig ansvar for å elske og ha omsorg for hverandre og for sine barn. “Barn
  er en gave fra Herren” (Salmenes bok 127:3). Foreldre har en hellig plikt til å oppdra sine barn i kjærlighet
  og rettferdighet, til å dekke deres fysiske og åndelige behov, til å lære dem å elske og tjene hverandre,
  til å overholde Guds bud og å være lovlydige borgere hvor de enn bor. Ektemenn og hustruer – mødre og
  fedre – vil bli holdt ansvarlige for Gud når det gjelder å oppfylle disse forpliktelsene.
- Familien er forordnet av Gud. Ekteskap mellom mann og kvinne er helt avgjørende for hans evige plan.
  Barn har rett til å bli født innenfor ekteskapets bånd og til å bli oppdratt av en far og en mor som
  hedrer ekteskapsløftene med fullstendig troskap. Lykke i familien oppnås med størst sannsynlighet når
  den er grunnlagt på vår Herre Jesu Kristi læresetninger. Gode ekteskap og familier opprettes og opprettholdes
  når de bygger på prinsippene tro, bønn, omvendelse, tilgivelse, respekt, kjærlighet, medfølelse, arbeid
  og sunne aktiviteter. Etter guddommelig forordning skal fedre presidere over sin familie i kjærlighet
  og rettferdighet, og de er ansvarlige for å sørge for livets nødvendigheter og beskyttelse for sin familie.
  En mor er først og fremst ansvarlig for å ha omsorg for sine barn. I disse hellige ansvarsoppgaver er
  fedre og mødre forpliktet til å hjelpe hverandre som likeverdige partnere. Uførhet, død eller andre
  forhold kan nødvendiggjøre individuell tilpasning. Andre slektninger skulle gi sin støtte når det er
  behov for det.
- Vi advarer og sier at den som bryter sin kyskhetspakt, mishandler sin ektefelle eller sine barn, eller
  unnlater å oppfylle sine familieforpliktelser, en dag vil stå til ansvar overfor Gud. Videre advarer
  vi og sier at oppløsningen av familien vil påføre enkeltmennesker, lokalsamfunn og nasjoner de ulykker
  som er forutsagt av profeter i oldtiden og i nyere tid.
- Vi ber inntrengende ansvarsbevisste borgere og myndigheter overalt om å fremme tiltak for å bevare og
  styrke familien som samfunnets grunnleggende enhet.
