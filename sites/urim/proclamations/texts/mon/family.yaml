title: Гэр бүл
subtitle: Дэлхий дахинаа өргөх тунхаг
author: Есүс Христийн Хожмын Үеийн Гэгээнтнүүдийн Сүмийн Тэргүүн зөвлөл ба Арван хоёр төлөөлөгчийн зөвлөл
note: Энэхүү тунхгийг 1995 оны 9-р сарын 23-нд Юта мужийн Солт Лэйк Сити хотноо болсон Халамжийн нийгэмлэгийн
  ерөнхий хуралдаан дээр ерөнхийлөгч Гордон Б.Хинкли захиасныхаа нэгэн хэсэг болгон уншжээ.
paragraphs:
- Есүс Христийн Хожмын Үеийн Гэгээнтнүүдийн Сүмийн Тэргүүн зөвлөл, Арван хоёр төлөөлөгчийн зөвлөлийнхөн
  бид эрэгтэй, эмэгтэй хүмүүсийн хоорондын гэрлэлт нь Бурханаас заяагддаг бөгөөд гэр бүл нь Түүний хүүхдүүдийн
  мөнхийн хувь заяаны төлөөх Бүтээгчийн төлөвлөгөөний төвд байдгийг албан ёсоор тунхаглаж байна.
- Эрэгтэй, эмэгтэй—бүх хүн төрөлхтөн Бурханы дүр төрхөөр бүтээгдсэн. Хүн бүр Тэнгэрлэг Эцэг Эхийн хайртай
  сүнсэн хүү, охин бөгөөд бурханлаг мөн чанар, хувь тавилантай. Хүйс бол хувь хүний мөнх бус байдлын өмнөх,
  мөнх бус болон мөнхийн мөн чанар, зорилгын амин чухал шинж юм.
- Мөнх бус байдлын өмнөх амьдралд сүнсэн охид, хөвгүүд Бурханыг өөрсдийнх нь Мөнхийн Эцэг гэдгийг мэдэж,
  бишрэн шүтдэг байсан ба төгс төгөлдөр болохын тулд хөгжин дэвжиж, эцэст нь мөнх амьдралыг өвлөн авах
  тэнгэрлэг хувь заяандаа хүрэхийн тулд бие махбодтой болж, энэ дэлхийн амьдралыг туулах Түүний төлөвлөгөөг
  хүлээн зөвшөөрсөн. Аз жаргалын тэнгэрлэг төлөвлөгөө нь гэр бүлийн холбоог насан эцэслэсний дараа ч мөнхжүүлдэг.
  Ариун сүмийн ёслол, гэрээнүүд нь хувь хүмүүст Бурханы оршихуйд эргэн очих мөн гэр бүлүүдэд мөнхөд нэгдэх
  боломжийг олгодог.
- Бурханы Адам, Ева хоёрт өгсөн анхны зарлиг нь эхнэр нөхрийн хувьд эцэг эх болох талаар байлаа. Өдгөө
  бид Бурханы хүүхдүүддээ өгсөн, “өсөн нэмэгдэж, өнөр өтгөн болж, газар дэлхийг дүүргэ” хэмээх зарлиг
  хүчин төгөлдөр байгааг тунхаглаж байна. Түүнчлэн бид “үр удмаа үлдээх энэхүү нандин хүч нь зөвхөн хууль
  ёсоор гэрлэн, эхнэр нөхөр болсон эрэгтэй, эмэгтэй хүмүүсийн хооронд байх ёстой” хэмээх Бурханы зарлигийг
  тунхаглаж байна.
- Мөнх бус амьдралыг бүтээх энэхүү арга замыг тэнгэрээс тодорхойлсон гэдгийг бид тунхаглаж байна. Бид
  амьдралын ариун нандин чанар, Бурханы мөнхийн төлөвлөгөөн дэх үүний ач холбогдлыг баталж байна.
- Эхнэр, нөхөр хоёр бие биеэ болон үр хүүхдээ хайрлан халамжлах чанд хариуцлага хүлээнэ. “Үр хүүхэд Эзэнээс
  ирэх өв” (Дуулал 127:3). Эцэг эхчүүд үр хүүхдээ хайр, зөв шударга байдлаар өсгөн хүмүүжүүлж; бие бялдар,
  сүнслэг байдлынх нь хэрэгцээг хангаж; бие биеэ хайрладаг, нэг нэгэндээ үйлчилдэг, Бурханы зарлигуудыг
  дагадаг, хаана ч амьдарсан хуулиа хүндэтгэн сахидаг иргэд байхыг зааж сургах ариун нандин үүрэгтэй.
  Эхнэр нөхрүүд—эцэг эхчүүд эдгээр үүргээ хэрхэн биелүүлснээрээ Бурханы өмнө хариуцлага хүлээнэ.
- Гэр бүл Бурханаас заяагддаг. Эрэгтэй, эмэгтэй хүний хоорондын гэрлэлт нь Түүний мөнхийн төлөвлөгөөний
  зайлшгүй нэгэн хэсэг юм. Хүүхэд гэрлэлтийн хүрээнд төрж, гэрлэлтийн тангаргаа үнэнч сахидаг эцэг эхээр
  өсгүүлэх эрхтэй. Их Эзэн Есүс Христийн сургаалд суурилсан гэр бүл аз жаргалд хүрнэ гэдэгт итгэж болно.
  Аз жаргалтай гэрлэлт, гэр бүлүүд нь итгэл, залбирал, наманчлал, уучлал, хүндэтгэл, хайр, өрөвч нинжин
  сэтгэл, хөдөлмөр, үр бүтээлтэй мөн эерэг үйл ажиллагааны зарчмууд дээр үндэслэгдэж, оршин тогтнодог.
  Тэнгэрийн загвараар эцэг хүн гэр бүлээ хайр, зөв шударга ёсоор тэргүүлэн удирдаж, хэрэгцээт зүйлсээр
  нь хангаж, хамгаалах үүрэгтэй. Эх хүний үндсэн үүрэг бол хүүхдээ хайраар өсгөн хүмүүжүүлэх явдал юм.
  Энэхүү нандин үүргээ биелүүлэхдээ эцэг эхчүүд тэгш эрхтэй хамтрагчдын хувиар бие биедээ туслах ёстой.
  Хөгжлийн бэрхшээлтэй болох, нас нөгчих болон бусад нөхцөл байдалд хувь хүн зайлшгүй дасан зохицох шаардлага
  гарч болно. Төрөл төрөгсөд нь шаардлагатай үед туслан дэмжих ёстой.
- Ариун явдлын гэрээгээ зөрчдөг; хань ижил, үр хүүхдээ хүчирхийлдэг; гэр бүлийнхээ өмнө хүлээсэн үүргээ
  биелүүлдэггүй хувь хүн хэзээ нэг өдөр Бурханы өмнө хариуцлага хүлээх болно гэдгийг бид анхааруулж байна.
  Түүнчлэн гэр бүл салалт нь эрт, эдүгээгийн бошиглогчдын зөгнөн хэлснээр улс үндэстэн, нийгэм, хувь хүнд
  гай гамшиг авчрах болно гэдгийг бид сануулж байна.
- Бид газар бүрийн итгэл хүлээсэн иргэд, төрийн албан хаагчдыг нийгмийн үндсэн нэгж болох гэр бүлийг дэмжиж,
  хүчирхэгжүүлэх эдгээр арга замыг түгээн дэлгэрүүлэхэд уриалан дуудаж байна.
