title: Амьд Христ
subtitle: Төлөөлөгчдийн гэрчлэл
author: Есүс Христийн Хожмын Үеийн Гэгээнтнүүдийн Сүм
paragraphs:
- Есүс Христийг хоёр мянган жилийн өмнө мэндэлснийг дурсан хүндэтгэхдээ бид Түүний зүйрлэшгүй амьдрал,
  агуу цагаатгах золиослолын хязгааргүй хүчний бодит үнэнийг гэрчилдэг. Дэлхий дээр амьдарч байсан ба
  амьдрах бүх хүнд ийм хүчтэй нөлөөг хэн ч үзүүлж байгаагүй.
- Тэр бол Хуучин Гэрээний Агуу Иехова, Шинэ Гэрээний Мессиа билээ. Тэр бол Эцэгийнхээ удирдлаган доор
  дэлхийг бүтээсэн Бүтээгч. “Бүх юм Түүгээр буй болсон. Буй болсон юмсаас Түүнгүйгээр буй болсон юмс гэж
  нэг ч үгүй” (Иохан 1:3). Нүгэлгүй ч Тэрээр бүх зөв шударга байдлыг гүйцэлдүүлэхээр баптисм хүртсэн.
  Түүнийг “сайныг үйлдэж явсан” (Үйлс 10:38)–ых нь төлөө үзэн ядаж байсан. Түүний сайн мэдээ амар амгалан,
  сайн сайхны захиас байсан. Тэр чин сэтгэлээсээ бүгдийг өөрийнх нь жишээг дагахыг хүссэн билээ. Тэрээр
  Палестины замаар алхаж, өвчтөнийг анагааж, сохрыг хараатай болгож, үхсэнийг амилуулж байв. Тэрээр мөнхийн
  үнэн, мөнх бус байдлын өмнөх оршихуйн бодит байдал, дэлхий дээрх бидний амьдралын зорилго болон ирэх
  амьдрал дахь Бурханы охид, хөвгүүдийн чадавхын тухай заасан.
- Тэрээр Өөрийн агуу их цагаатгах золиослолыг сануулахаар ариун ёслолыг тогтоосон. Түүнийг баривчилж,
  гүтгэлгээр яллаж, цугларагсдын бахыг ханган шийтгэж, Түүнд Калварийн загалмай дээр үхэх ял оноосон юм.
  Тэрээр бүх л хүн төрөлхтний нүглийг цагаатгахын төлөө амиа өгсөн. Энэ бол дэлхий дээр амьдарч байсан,
  амьдарч байгаа, амьдрах бүх хүнд зориулсан Түүний агуу бэлэг билээ.
- Бүх хүн төрөлхтний түүхийн төв болох Түүний амьдрал Бэтлэхэмд эхлээгүй, Калварид ч төгсөөгүй гэдгийг
  бид албан ёсоор гэрчилж байна. Тэр бол Эцэгийн Ууган, махбод дахь Төрсөн Ганц Хүү, дэлхийн Гэтэлгэгч
  юм.
- Тэр “нойрсогсдоос анхны үр жимс” (1 Коринт 15:20) болохын тулд үхэгсдээс амилсан юм. Тэрээр амилсан
  Их Эзэний хувьд амьдралдаа хайрлаж байсан хүмүүс дээрээ ирсэн. Тэрээр бас эртний Америкт буй “өөр хоньд”
  (Иохан 10:16)-доо тохинуулсан юм. Орчин үед эртнээс амласан “цагийн дүүрлийг” эхлүүлэхээр Тэр Эцэгийн
  хамт Иосеф Смит хүүд үзэгдсэн юм (Ефес 1:10).
- 'Амьд Христийн тухай Бошиглогч Иосеф Смит “Түүний нүд галын дөл мэт, толгойн үс нь цас мэт цагаан, царай
  нь нарны туяа мэт гэрэлтэж байв. Мөн түүний дуу хоолой агуу их усны шуугин урсах чимээ мэт. Мөн Иехова
  өөрийн дуу хоолойгоор хэлрүүн:'
- Би бол анхных ба сүүлчийнх; Би бол амьд, Би бол алагдсан нэгэн; Би бол Эцэгийн хамт та бүхний өмгөөлөгч
  билээ” (С ба Г 110:3–4) хэмээсэн юм.
- 'Түүний талаар Бошиглогч мөн ийн тунхаглажээ: “Мөн эдүгээ, Түүний талаар өгөгдсөн олон гэрчлэлүүдийн
  дараа бидний Түүнийг гэрчлэх сүүлийн гэрчлэл энэ бөлгөө: Тэр бол амьд!'
- Учир нь бид түүнийг Бурханы баруун гар талд байхыг харсан ба Тэр бол Эцэгийн Цорын Ганц Төрсөн Хүү хэмээн
  гэрчлэх дуу хоолойг бид сонссон юм—
- Түүгээр дамжуулан, Түүнээс дэлхий ертөнцүүд бүтээгдсэн бөгөөд бүтээгддэг, тэдгээрийн оршин суугчид нь
  Бурханд төрсөн охид, хөвгүүд нь болдог юм” (С ба Г 76:22–24).
- “Элч нар болон эш үзүүлэгчдийн суурин дээр босгогдож … Христ Есүс Өөрөө булангийн чулуу нь” (Ефес 2:20)
  болсон Түүний Сүм болон санваар нь дэлхий дээр сэргээгдсэн гэж бид баттай тунхаглаж байна.
- Түүнийг хэзээ нэгэн цагт дэлхий дээр эргэж ирнэ гэдгийг бид гэрчилж байна. “Ингээд ЭЗЭНий цог жавхлан
  илэрч, махбодтой бүхэн хамтдаа үзэх болно” (Исаиа 40:5). Тэрээр Хаадын Хааны хувьд удирдан, Эзэдийн
  Эзэний хувьд захирах ба өвдөг бүхэн сөгдөж, хэл бүхэн Түүнийг шүтэн ярих болно. Хүн бүр Түүний өмнө
  хийсэн үйлсийнхээ дагуу болон зүрх сэтгэлийн хүслийнхээ дагуу шүүгдэхээр зогсох болно.
- Бид Түүний албан ёсоор томилогдсон төлөөлөгчдийнх нь хувьд —Есүс бол Амьд Христ, Бурханы үхэшгүй Хүү
  хэмээн гэрчилж байна. Тэр бол өнөөдөр Эцэгийнхээ баруун гар талд зогсож буй агуу Иммануэл Хаан. Тэр
  бол дэлхийн гэрэл, амь ба найдвар юм. Түүний зам бол энэ амьдралд аз жаргал руу, ирэх дэлхийд мөнхийн
  амьдрал руу хөтлөх жим юм. Зүйрлэшгүй бэлэг болох тэнгэрлэг Хүүгийнх нь төлөө Бурхандаа талархъя.
