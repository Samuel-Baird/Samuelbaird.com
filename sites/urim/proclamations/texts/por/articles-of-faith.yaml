title: Regras de Fé
subtitle: de A Igreja de Jesus Cristo dos Santos dos Últimos Dias
author: ''
verses:
- n: 1
  text: Cremos em Deus, o Pai Eterno, e em Seu Filho, Jesus Cristo, e no Espírito Santo.
- n: 2
  text: Cremos que os homens serão punidos por seus próprios pecados e não pela transgressão de Adão.
- n: 3
  text: Cremos que, por meio da Expiação de Cristo, toda a humanidade pode ser salva, pela obediência
    às leis e ordenanças do Evangelho.
- n: 4
  text: 'Cremos que os primeiros princípios e ordenanças do Evangelho são: primeiro, Fé no Senhor Jesus
    Cristo; segundo, Arrependimento; terceiro, Batismo por imersão para a remissão de pecados; quarto,
    Imposição de mãos para o dom do Espírito Santo.'
- n: 5
  text: Cremos que um homem deve ser chamado por Deus, por profecia, e pela imposição de mãos, por quem
    possua autoridade, para pregar o Evangelho e administrar as suas ordenanças.
- n: 6
  text: Cremos na mesma organização que existia na Igreja Primitiva, isto é, apóstolos, profetas, pastores,
    mestres, evangelistas, etc.
- n: 7
  text: Cremos no dom de línguas, profecia, revelação, visões, cura, interpretação de línguas, etc.
- n: 8
  text: Cremos ser a Bíblia a palavra de Deus, desde que esteja traduzida corretamente; também cremos
    ser o Livro de Mórmon a palavra de Deus.
- n: 9
  text: Cremos em tudo o que Deus revelou, em tudo o que Ele revela agora, e cremos que Ele ainda revelará
    muitas coisas grandiosas e importantes relativas ao Reino de Deus.
- n: 10
  text: Cremos na coligação literal de Israel e na restauração das Dez Tribos; que Sião (a Nova Jerusalém)
    será construída no continente americano; que Cristo reinará pessoalmente na Terra; e que a Terra será
    renovada e receberá a sua glória paradisíaca.
- n: 11
  text: Pretendemos o privilégio de adorar a Deus Todo-Poderoso de acordo com os ditames de nossa própria
    consciência; e concedemos a todos os homens o mesmo privilégio, deixando-os adorar como, onde, ou
    o que desejarem.
- n: 12
  text: Cremos na submissão a reis, presidentes, governantes, e magistrados; na obediência, honra, e manutenção
    da lei.
- n: 13
  text: 'Cremos em ser honestos, verdadeiros, castos, benevolentes, virtuosos, e em fazer o bem a todos
    os homens; na realidade, podemos dizer que seguimos a admoestação de Paulo: Cremos em todas as coisas,
    confiamos em todas as coisas, suportamos muitas coisas e esperamos ter a capacidade de tudo suportar.
    Se houver qualquer coisa virtuosa, amável, de boa fama ou louvável, nós a procuraremos.'
signature: Joseph Smith.
