retrieved: '2026-11-02'
title: A Restauração da Plenitude do Evangelho de Jesus Cristo
subtitle: Uma Proclamação do Bicentenário ao Mundo
author: A Primeira Presidência e o Conselho dos Doze Apóstolos de A Igreja de Jesus Cristo dos Santos
  dos Últimos Dias
note: Esta proclamação foi lida pelo presidente Russell M. Nelson no dia 5 de abril de 2020 como parte
  de sua mensagem na 190ª Conferência Geral Anual, em Salt Lake City, Utah, EUA.
paragraphs:
- Solenemente proclamamos que Deus ama Seus filhos de todas as nações do mundo. Deus, o Pai, deu-nos o
  nascimento divino, a incomparável vida e o infinito sacrifício expiatório de Seu Filho Amado, Jesus
  Cristo. Pelo poder do Pai, Jesus ressuscitou e conquistou a vitória sobre a morte. Ele é nosso Salvador,
  nosso Exemplo e nosso Redentor.
- Há duzentos anos, em uma linda manhã de primavera em 1820, o jovem Joseph Smith, procurando saber a
  qual igreja se unir, dirigiu-se a um bosque perto de sua casa, ao norte de Nova York, EUA, para orar.
  Ele tinha algumas dúvidas relativas à salvação de sua alma e teve a confiança de que Deus o orientaria.
- Com humildade, declaramos que, em resposta à sua oração, Deus, o Pai, e Seu Filho, Jesus Cristo, apareceram
  a Joseph e deram início à “restauração de todas as coisas” (Atos 3:21) conforme foi predito na Bíblia.
  Nessa visão, ele aprendeu que, após a morte dos primeiros apóstolos, a Igreja de Cristo da época do
  Novo Testamento deixou de existir na Terra. Joseph foi um instrumento fundamental para o retorno dela.
- Declaramos que, sob a orientação do Pai e do Filho, mensageiros celestiais vieram instruir Joseph e
  restabelecer a Igreja de Jesus Cristo. João Batista, ressuscitado, restaurou a autoridade para batizar
  por imersão para a remissão de pecados. Três dos primeiros doze apóstolos — Pedro, Tiago e João — restauraram
  o apostolado e as chaves da autoridade do sacerdócio. Outros também vieram, inclusive Elias, o Profeta,
  que restaurou a autoridade para unir as famílias para sempre em relacionamentos eternos que transcendem
  a morte.
- 'Também testemunhamos que a Joseph Smith foram dados o dom e o poder de Deus para traduzir um registro
  antigo, o Livro de Mórmon: Outro Testamento de Jesus Cristo. Páginas desse texto sagrado incluem um
  relato do ministério pessoal de Jesus Cristo entre o povo do Hemisfério Ocidental logo após Sua Ressurreição.
  O livro ensina sobre o propósito da vida e explica a doutrina de Cristo, que é essencial para esse propósito.
  Sendo um companheiro da Bíblia como livro de escrituras, o Livro de Mórmon testifica que todos os seres
  humanos são filhos e filhas de um Pai Celestial amoroso, que Ele tem um plano divino para nossa vida
  e que Seu Filho, Jesus Cristo, manifesta-Se hoje assim como o fez no passado.'
- Declaramos que A Igreja de Jesus Cristo dos Santos dos Últimos Dias, organizada no dia 6 de abril de
  1830, é a Igreja de Cristo da época do Novo Testamento restaurada. Essa Igreja está alicerçada na vida
  perfeita de sua principal pedra de esquina, Jesus Cristo, em Sua Expiação infinita e em Sua Ressurreição
  literal. Jesus Cristo chamou novamente apóstolos e deu-lhes a autoridade do sacerdócio. Ele convida
  todos nós a nos achegarmos a Ele e à Sua Igreja, a recebermos o Espírito Santo e as ordenanças de salvação
  e a obtermos alegria duradoura.
- Já se passaram duzentos anos desde que Deus, o Pai, e Seu Filho Amado, Jesus Cristo, deram início a
  essa Restauração. Milhões de pessoas no mundo todo aceitaram de boa vontade o conhecimento desses eventos
  que foram profetizados.
- Com alegria declaramos que a Restauração prometida segue adiante por meio de revelação contínua. A Terra
  jamais será a mesma, à medida que Deus “congregar em Cristo todas as coisas” (Efésios 1:10).
- Com reverência e gratidão, como apóstolos Dele, convidamos todos a saber — assim como nós sabemos —
  que os céus estão abertos. Afirmamos que Deus está desvendando Sua vontade para Seus amados filhos e
  filhas. Testificamos que aqueles que em oração estudarem a mensagem da Restauração e agirem com fé serão
  abençoados com a aquisição de seu próprio testemunho da divindade da Restauração e do propósito que
  ela tem de preparar o mundo para a prometida Segunda Vinda de nosso Senhor e Salvador, Jesus Cristo.
