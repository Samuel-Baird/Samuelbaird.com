title: A Família
subtitle: Proclamação ao Mundo
author: A Primeira Presidência e o Conselho dos Doze Apóstolos de A Igreja de Jesus Cristo dos Santos
  dos Últimos Dias
note: Esta proclamação foi lida pelo presidente Gordon B. Hinckley como parte de sua mensagem na Reunião
  Geral da Sociedade de Socorro, realizada em 23 de setembro de 1995 em Salt Lake City, Estado de Utah,
  EUA.
paragraphs:
- Nós, a Primeira Presidência e o Conselho dos Doze Apóstolos de A Igreja de Jesus Cristo dos Santos dos
  Últimos Dias, solenemente proclamamos que o casamento entre homem e mulher foi ordenado por Deus e que
  a família é essencial ao plano do Criador para o destino eterno de Seus filhos.
- Todos os seres humanos — homem e mulher — foram criados à imagem de Deus. Cada indivíduo é um filho
  (ou filha) gerado em espírito por pais celestiais que o amam e, como tal, possui natureza e destino
  divinos. O sexo (masculino ou feminino) é uma característica essencial da identidade e do propósito
  pré-mortal, mortal e eterno de cada um.
- Na esfera pré-mortal, os filhos e filhas que foram gerados em espírito conheciam e adoravam a Deus como
  seu Pai Eterno e aceitaram Seu plano, segundo o qual Seus filhos poderiam obter um corpo físico e adquirir
  experiência terrena a fim de progredirem rumo à perfeição, terminando por alcançar seu destino divino
  como herdeiros da vida eterna. O plano divino de felicidade permite que os relacionamentos familiares
  sejam perpetuados além da morte. As ordenanças e os convênios sagrados dos templos santos permitem que
  as pessoas retornem à presença de Deus e que as famílias sejam unidas para sempre.
- O primeiro mandamento dado a Adão e Eva por Deus referia-se ao potencial de tornarem-se pais, na condição
  de marido e mulher. Declaramos que o mandamento dado por Deus a Seus filhos, de multiplicarem-se e encherem
  a Terra, continua em vigor. Declaramos também que Deus ordenou que os poderes sagrados de procriação
  sejam empregados somente entre homem e mulher, legalmente casados.
- Declaramos que o meio pelo qual a vida mortal é criada foi estabelecido por Deus. Afirmamos a santidade
  da vida e sua importância no plano eterno de Deus.
- O marido e a mulher têm a solene responsabilidade de amar-se mutuamente e amar os filhos, e de cuidar
  um do outro e dos filhos. “Os filhos são herança do Senhor” (Salmos 127:3). Os pais têm o sagrado dever
  de criar os filhos com amor e retidão, atender a suas necessidades físicas e espirituais, ensiná-los
  a amar e servir uns aos outros, guardar os mandamentos de Deus e ser cidadãos cumpridores da lei, onde
  quer que morem. O marido e a mulher — o pai e a mãe — serão considerados responsáveis perante Deus pelo
  cumprimento dessas obrigações.
- A família foi ordenada por Deus. O casamento entre o homem e a mulher é essencial para Seu plano eterno.
  Os filhos têm o direito de nascer dentro dos laços do matrimônio e de ser criados por pai e mãe que
  honrem os votos matrimoniais com total fidelidade. A felicidade na vida familiar é mais provável de
  ser alcançada quando fundamentada nos ensinamentos do Senhor Jesus Cristo. O casamento e a família bem-sucedidos
  são estabelecidos e mantidos sob os princípios da fé, da oração, do arrependimento, do perdão, do respeito,
  do amor, da compaixão, do trabalho e de atividades recreativas salutares. Segundo o modelo divino, o
  pai deve presidir a família com amor e retidão, tendo a responsabilidade de atender às necessidades
  de seus familiares e de protegê-los. A responsabilidade primordial da mãe é cuidar dos filhos. Nessas
  atribuições sagradas, o pai e a mãe têm a obrigação de ajudar-se mutuamente, como parceiros iguais.
  Enfermidades, falecimentos ou outras circunstâncias podem exigir adaptações específicas. Outros parentes
  devem oferecer ajuda quando necessário.
- Advertimos que as pessoas que violam os convênios de castidade, que maltratam o cônjuge ou os filhos,
  ou que deixam de cumprir suas responsabilidades familiares, deverão um dia responder perante Deus pelo
  cumprimento dessas obrigações. Advertimos também que a desintegração da família fará recair sobre pessoas,
  comunidades e nações as calamidades preditas pelos profetas antigos e modernos.
- Conclamamos os cidadãos e governantes responsáveis de todo o mundo a promoverem as medidas designadas
  para manter e fortalecer a família como a unidade fundamental da sociedade.
