title: Gyedie mu Nsɛnhia no
subtitle: ma Yesu Kristo Asɔre a Ɛwɔ hɔ ma Nna a Ɛdi Akyire Ahotefoɔ no
author: ''
verses:
- n: 1
  text: Yɛgye Onyankopɔn Ɔnniawieɛ Agya no, ne ne Ba Yesu Kristo ne Sunsum Kronkron no di.
- n: 2
  text: Yɛgye di sɛ wɔbɛtwe nnipa aso fa wɔn ankasa wɔn bɔne ho na ɛnyɛ Adam mmarato.
- n: 3
  text: Yɛgye di sɛ wɔ Kristo mpata no mu, adasamma nyina ara bɛnya ɔgyeɛ, nam sotie wɔ nsɛmpa no mmara
    ne n’ayɛyɛdeɛ ho.
- n: 4
  text: Yɛgye di sɛ Nsɛmpa no nkyerɛkyerɛ ne ayɛyɛdeɛ yɛ; ɛdi kan, Gyedie wɔ Awurade Yesu kristo mu; mmienu,
    ahonu; mmiɛnsa, dɔ asukɔ asubɔ ma bɔne fafiri; nan, Nsagusoɔ ma Sunsum Kronkron akyɛdeɛ no.
- n: 5
  text: Yɛgye di sɛ ɛsɛ sɛ Onyankopɔn frɛ nipa nam nkɔmhyɛ so, ne wɔn a tumi hyɛ wɔn nsa nsagusoɔ, sɛ
    wɔka nsɛmpa no kyerɛkyerɛ n’ayɛyɛdeɛ a eka ho.
- n: 6
  text: Yɛgye ahyehyɛdeɛ korɔ di sɛnea na ɛte wɔ Asɔre no mu berɛ a na ɛnkɔɔ n’anim biara no, sɛ ebia,
    asomafoɔ, nkɔmhyɛfoɔ, asɔfoɔ, akyerɛkyerɛfoɔ, nsɛmpakafoɔ, ne nea ɛkeka ho.
- n: 7
  text: Yɛgye kasa horoɔ akyɛdeɛ di, nkɔmhyɛ, adiyisɛm, ani- so- adehunu, ayaresa, kasa horoɔ nkyerɛaseɛ,
    ne nea ɛkeka ho.
- n: 8
  text: Yɛgye Twerɛsɛm no di sɛ ɛyɛ Onyankopɔn asɛm mpɛn dodoɔ a ne nkyerɛaseɛ yɛ nea ɛtene; yɛsan nso
    gye Mormon Nwoma no di sɛ ɛyɛ Onyankopɔn asɛm.
- n: 9
  text: Yɛgye biribiara a Onyankopɔn ada no adi akyerɛ di, nea ɔda so seesei da no adi kyerɛ nyina ara,
    na yɛgye di sɛ ɔbɛkɔ so ada nnoɔma akɛseɛ a eho hia yie adi a ɛfa Onyankopɔn aheman no ho.
- n: 10
  text: Yɛgye Israel anoboaboa no ankasa di wɔ Abusuakuo Du no nsane mmae bio no; sɛ Sion (Yerusalem Foforɔ
    no) wɔbɛsi wɔ Amerika asaasetam no so; sɛ Kristo ankasa bɛdi hene wɔ asaase so; na ɛno nti asaase
    no bɛyɛ foforɔ na anya ne paradiso animuonyam.
- n: 11
  text: Yɛwɔ ho akwanya sɛ yɛsom Otumfoɔ Nyankopɔn wɔ sɛnea yɛn ankasa tiboa hyɛ yɛn, na yɛma nnipa nyina
    ara saa akwanya korɔ no, ma wɔnsom sɛnea wɔpɛ, beaeɛ, anaa nea wɔpɛ biara.
- n: 12
  text: Yɛgye di sɛ ɛsɛ sɛ yɛbrɛ yɛn ho ase ma nhemfo, amanmpanin, amansodifoɔ ne atɛmuafoɔ, wɔ sɛ yɛyɛ
    sotie ma mmara, sɔ mu na yɛdi no ni.
- n: 13
  text: Yɛgye di sɛ ɛsɛ sɛ yɛyɛ nokorɛfoɔ, di nokorɛ, bɔ kronkron abrabɔ, ayamyɛ, ahoteɛ na yɛyɛ papa
    ma nnipa nyina ara; nokorɛ, yɛka sɛ yɛdi Paul—afotuo no akyi—Yɛgye nnoɔma nyina ara di, wɔ anidasoɔ
    ma nnoɔma nyina ara, yɛnya abodwokyerɛ nnoɔma pii mu, wɔ anidasoɔ sɛ yɛbɛtumi anya abodwokyerɛ nnoɔma
    nyina ara mu. Sɛ biribi wɔ hɔ a ɛhoteɛ, ɛyɛ fɛ, anaa asɛm papa, anaa wɔkamfo a, yɛhwehwɛ saa nnoɔma
    yi akyiri kwan.
signature: Joseph Smith.
