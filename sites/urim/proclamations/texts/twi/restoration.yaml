slug: restoration
language: twi
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=twi
retrieved: '2026-11-02'
title: Yesu Kristo Asɛmpa no Mayɛ Mmaeɛ bio
subtitle: Mfeɛ Ahanu Dawurubɔ ma Wiase
author: Titenafoɔ a Wɔdi Kan ne Asomafoɔ Dummienu Agyinatufoɔ ma Yesu Kristo Asɔre a ɛwɔ hɔ ma Nna a Ɛdi
  Akyire Ahotefoɔ
note: Titeneni Russell M. Nelson na ɔkenkanee saa dawurubɔ yi sɛ ne nkratoɔ no mu bi wɔ 190 Amansan Afenhyia
  Nhyiamu ase wɔ Oforisuo 5, 2020 mu wɔ Salt Lake City, Utah.
paragraphs:
- Yɛbɔ dawuro wɔ ɔdwoɔ mu sɛ Onyankopɔn dɔ ne mma a wɔwɔ ewiase aman nyinaa mu. Onyankopɔn Agya no ama
  yɛn awoɔ kronkron no, nkwa a yɛrentumi mfa ntoto biribiara ho, Ne Ba Yesu Kristo wuma afɔrebɔ no a ɛtoɔ
  ntwa da no. Ɛnam Agya no tumi so, Yesu Kristo sɔree bio na ɔdii owuo so nkonim. Ɔno ne yɛn Agyenkwa,
  yɛn Nhwɛsoɔ, ne yɛn Gyefoɔ.
- Mfeɛ ahanu ni wɔ fefɛberɛ anɔpa fɛfɛɛfɛ bi wɔ afe 1820 mu no, abarimaa Joseph Smith, rehwehwɛ Asɔre
  a ɛsɛ sɛ ɔdɔm ahunu no, ɔkɔɔ nnuakuo a na ɛbɛn ne fie wɔ New York, wɔ USA. Na ɔwɔ nsɛmmisa fa ne kraa
  ho na ɔgyediiɛ sɛ Onyankopɔn bɛma no akwankyerɛ.
- Wɔ ahobraseɛ mu, yɛpae mu ka sɛ, wɔ ne mpaebɔ mmuaeɛ mu no, Onyankopɔn ne Ne Ba, Yesu Kristo, yii wɔn
  ho adi kyerɛɛ Joseph na ɔdaa nneɛma nyinaa adi a ɛwɔ sɛ ɛda n’akwan mu’ (Asomafoɔ 3:21) sɛdeɛ Twerɛ
  Kronkron no kaaeɛ no. Wɔ saa yikyerɛ yi mu no, ɔhunuu sɛ, Asomafoɔ a wɔhyɛɛ aseɛ no wuo akyiri no, Kristo
  Apam Foforɔ Asɔre no yeraa wɔ asase so. Na Joseph bɛyɛ adwinneɛ wɔ ne ba a ɔbɛsan aba no mu.
- Yɛsi so dua sɛ wɔ Agya no Ne Ɔba no akwankyerɛ so, ɔsoro asomafoɔ bɛkyerɛkyerɛɛ Joseph na wasan atintim
  Yesu Kristo Asɔre no. Yohane Osubɔni no a wasɔre afiri awufoɔ mu no sane de tumi a wɔnam nsuwura mu
  bɔ asu de hohoro bɔne no baaeɛ. Asomafoɔ Dummienu a wɔhyɛɛ aseɛ no mu mmiɛnsa—Petro, Yakobo ne Yohane—sane
  de Asomafodie ne asɔfodie tumi nsafoa no baae. Afoforɔ nso baae, a Elia, sane de tumi a wɔde ka mmusua
  bɔ mu daapem wɔ ɛnni awieɛɛ asetena a ɛtra owuo no baaeɛ.
- 'Yɛkɔ so di adanseɛ sɛ Wɔmaa Joseph Smith Onyankopɔn akyɛdeɛ ne ne tumi sɛ ɔmfa nkyerɛkyerɛ tete twerɛtohɔ
  bi ase: Mormon Nwoma No—Yesu Kristo ho Adanseɛ Baako Nso. Nkratafa a ɛwɔ saa asɛm no mu bi yɛ nsɛm a
  ɛfa Yesu Kristo no ara ahennie wɔ nkorɔfoɔ a wɔwɔ Atɔeɛ fam wɔ Ne Wusɔreɛ akyiri no mu. Ɛkyerɛ asetena
  mu botae na ɛkyerɛkyerɛ Yesu Kristo nkyerɛkyerɛ a ɛgyina saa botaeɛ no so. Sɛ twerɛnsɛm a ɛka Twerɛ
  Kronkron ho no, Mormon Nwoma no di adanseɛ sɛ nnipa nyinaa yɛ Agya dɔfoɔ bi a ɔwɔ ɔsoro mma mmarima
  ne mma mmaa, na ɔwɔ ɔsoro nhyehyɛeɛ bi ma yɛn abrabɔ, na afei Ne Ba, Yesu Kristo, kasa kyerɛ yɛn nnɛ
  te sɛ tete mmerɛ no mu.'
- Yɛpae mu ka sɛ Yesu Kristo Asɔre a Ɛwɔ hɔ ma Nna A Ɛdi Akyire Ahotefoɔ no, a wɔhyehyɛɛ no wɔ Oforisuo
  6, 1830, mu no yɛ Kristo Apam Foforɔ Asɔre no a asane aba bio no. Asɔre yi gyina n’abrabɔ pɛyɛ ne tweatiboɔ
  hene, Yesu Kristo, ne Ne Mpata a ɛnni awieeɛ ne Ne Owusɔreɛ no so. Yesu Kristo asane afrɛ Asomafoɔ bio
  a wama wɔn asɔfodie tumi. Ɔto nsa frɛ yɛn nyinaa sɛ yɛmmra Ɔne N’asɔre nkyɛn na yɛmmɛ gye Honhom Kronkron
  no, nkwagyeɛ ayɛyɛdeɛ no, na yɛadi dɛ a ɛnsa da.
- Mfeɛ ahanu atwam ɛfiri berɛ a Onyankopɔn ne Ne Dɔ Ba Yesu Kristo hyɛɛ Mmaeɛ bio yi aseɛ. Ɔpepepee a
  wɔwɔ ewiase mu nyinaa agye nimdeɛ a ɛwɔ saa nkɔmhyɛ nneɛma a ɛsisiiɛ yi ato mu.
- Yɛde anigyeɛ pae mu ka sɛ Mmaeɛ bio no bɔhyɛ no kɔ n’anim nam adiyisɛm a ɛrekɔ soɔ mu. Asase no nsane
  nyɛ sɛdeɛ ɛteɛ no bio, berɛ a Onyankopɔn “bɛboaboa nneɛma nyinaa ano baako wɔ Kristo mu” (Efesofoɔ 1:10).
- Nidie ne aseda mu no, yɛn, sɛ N’Asomafoɔ to nsa frɛ obiara sɛ ɔnhunu—sɛdeɛ yɛhunu no—sɛ ɔsoro abue.
  Yɛsi so dua sɛ Onyankopɔn reda Ne pɛ adi akyerɛ Ne mma mmaa ne mmarima. Yɛdi adanseɛ sɛ wɔn a wɔde mpaebɔ
  sua Mmaeɛ bio nkratoɔ no na wɔde gyedie tu anammɔn no bɛnya nhyira a ɛbɛma wɔn anya wɔn ara wɔn adansedie
  a ɛfa ne kronkronyɛ ne ne botaeɛ ho na ɛsiesie ewiase ma yɛn Awurade ne Agyenkwa, Yesu Kristo mmaeɛ
  a ɛtɔ so mmienu no.
