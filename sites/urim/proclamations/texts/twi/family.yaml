title: Abusua no
subtitle: Dawubɔ ma Wiase
author: Titenafoɔ a Wɔdi Kan ne Asomafoɔ Dummienu Agyinatufoɔ ma Yesu Kristo Asɔre a ɛwɔ hɔ ma Nna a Ɛdi
  Akyire Ahotefoɔ
note: President Gordon B. Hinckley na ɔkenkanee saa dawubɔ yi sɛ ne nkratoɔ no mu bi wɔ “Relief Society”
  Nhyiamu kɛseɛ a ɛkɔɔ so wɔ Ɛbɔ 23, 1995 wɔ Salt Lake City, Utah.
paragraphs:
- Yɛn Titenafoɔ a Wɔdi Kan ne Asomafoɔ Dummienu Agyinatufoɔ ma Yesu Kristo Asɔre a ɛwɔ hɔ ma Nna a Ɛdi
  Akyire Ahotefoɔ, bɔ dawuro aniberɛ so sɛ ɔbarima ne ɔbaa awareɛ yɛ Onyankopɔn ahyehyɛdeɛ, ne saa nti
  abusua yɛ nnyinasoɔ wɔ ɔbɔadeɛ no nhyehyɛeɛ mu wɔ ɔnniawieeɛ hyɛberɛ ma Ne mma.
- Nnipa nyinaa—ɔbarima ne ɔbaa—wɔbɔɔ wɔn sɛ Onyankopɔn sɛso. Wɔn mu biara yɛ ɔsoro awofoɔ honhom mu dɔba-barima
  anaa ɔbaa, ne saa nti, wɔn mu biara wɔ bɔsu ne hyɛberɛ a ɛyɛ nyamesu. Bɔberɛ yɛ su titiriw ma ankoroankoro
  ansana asase so asetena, ne enniawieeɛ ahyɛnso ne botae.
- Ansana asase so asetena tebea mu no, na honhom mu mma mmarima ne mmaa nim na wɔsomm Onyankopɔn sɛ wɔn
  ɔnniawieeɛ Agya na wɔgyee ne nhyehyɛeɛ too mu a, ɛnam so bɛma ne mma atumi anya honamdua na wɔanya asase
  yi so suahunu a wɔde bɛtu mpɔn akɔ pɛpɛyɔ mu na ne korakora no wanya nyamesu hyɛberɛ sɛ daa nkwa diadefoɔ.
  Nyamesu anigyeɛ nhyehyɛeɛ boa abusua nkutahodie ma no tra damena. Ayɛyɛdeɛ kronkron ne apam wɔ tɛmpol
  ahoroɔ kronkron mu boa ankorankoro sɛ wɔbɛtumi asan akɔ Onyankopɔn anim na abusua nso anya nkabom a
  enniawieeɛ.
- Mmaransɛm a edi kan a Onyankopɔn de maa Adam ne Hawa fa wɔn tumi a wɔn wɔ ma awofoyɛ sɛ ɔkunu ne ɔyere
  ho. Yɛpae mu ka sɛ Onyankopɔn mmaransɛm ma ne mma sɛ wɔnnɔre na wɔnhyɛ asaase so ma no gu so reyɛ adwuma.
  Yɛkɔ so pae mu ka sɛ Onyankopɔn ahyɛ mmara sɛ tumi kronkron a wɔde woɔ no, ɛsɛ sɛ ɛyɛ adwuma wɔ ɔbarima
  ne ɔbaa a wɔaware wɔ mmara kwan so sɛ ɔkunu ne ɔyere nko ara ntam.
- Yɛpae mu ka sɛ kwan a wɔfa so bɔ nnipadua a ɛwuo no nyɛ nyamesu. Yɛsi asetena kronkron so dua, ne ho
  hia a ɛhia wɔ Onyankopɔn nhyehyɛeɛ a ɛnniawieeɛ mu.
- Okunu ne ɔyere wɔ asɛdeɛ a ɛmu yɛden sɛ wɔdɔ na wɔhwɛ wɔn ho ne wɔn mma. “Mma yɛ Awurade no agyapadeɛ”
  (Nnwom 127:3). Awofoɔ wɔ asɛdeɛ kronkron sɛ wɔtete wɔn mma wɔ ɔdɔ ne trenee mu, ma wɔn deɛ ehia honam
  ne honhom mu, kyerɛkyerɛ wɔn ma wɔdɔ na wɔsom wɔn ho, di Onyankopɔn mmarasɛm so, na wɔyɛ Ɔman mma pa
  di mmara so babiara a wɔbɛtena. Okununom ne yerenom—ɛnanom ne agyanom—bɛbu akonta wɔ Onyankopɔn anim
  wɔ kwan a, wɔfaa so yɛɛ saa asɛdeɛ yi.
- Abusua no Onyankopɔn na wahyehyɛ. Obarima ne ɔbaa ntam awareɛ yɛ ade titire wɔ Ne nhyehyɛeɛ a ɛnniawieeɛ
  no mu. Mma wɔ akwanya sɛ wɔwo wɔn wɔ awareɛ mmara mu, na agya ne ɛna a wɔde nokorɛdie mmapa di wɔn awareɛ
  bɔhyɛ no ni no tete wɔn. Abusua asetena mu anigyeɛ bɛtumi awie pɛyɛ wɔ berɛ a ne fapem gyina Awurade
  Yesu Kristo no so. Awareɛ ne mmusua mu nkɔsoɔ ne emu nsiesie ba mu wɔ nnyinasoɔ a ɛyɛ gyidie, mpaebɔ,
  adwensakyera, bɔnefakyɛ, obuo, ɔdɔ, tema, adwuma ne agodie ahodoɔ a ɛho teɛ. Nyamesu nhyehyɛeɛ mu no,
  ɛsɛ sɛ agyanom tena wɔn abusua ti wɔ ɔdɔ ne tenenee mu na ɛyɛ wɔn asɛdeɛ sɛ wɔde asetena mu adehiadeɛ
  ne bammɔ ma wɔn mmusua. Ɛnanom asɛdeɛ a ɛdi kan ne sɛ wɔbɛtete wɔn mma wɔ saa asɛdeɛ kronkron yi mu
  no yɛ ɔhyɛ ma agyanom ne ɛnanom sɛ wɔboa wɔn ho sɛ ahokafoɔ atipɛnfoɔ. Dɛmdie, owuo, anaasɛ tebea foforɔ
  bɛtumi de ankorankoro akɔ yɔbea foforɔ mu. Ɛsɛ sɛ mmusua tɛtrɛtɛ no yɛ mmoa berɛ a ɛhia.
- Yɛbɔ kɔkɔ sɛ ankorankora a wɔsɛe ɔbra korɔgyee apam, wɔteetee ɔhokani anaasɛ ɔnni abusua ahyɛdeɛ soɔ
  bɛgyina Onyankopɔn anim abu nkonta da bi. Bio, yɛbɔ kɔkɔ sɛ abusua ntetemu de amanehunu bɛberɛ ankorankoro,
  nkuro ne aman sɛnea tete ne nnɛ mmerɛ yi mu nkɔmhyɛfoɔ hunu kaeɛ no.
- Yɛse aman mma pa ne aban mu asomfoɔ a wɔwɔ babiara sɛ wɔmpagya saa nhyehyɛeɛ a wɔahyehyɛ sɛ abusua bɛgyina
  na ahyɛ den sɛ ɔman kuo ketewa fapem.
