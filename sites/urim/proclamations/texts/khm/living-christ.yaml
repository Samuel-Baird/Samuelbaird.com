title: ព្រះគ្រីស្ទ​ដ៏​មាន​ព្រះ​ជន្ម​រស់
subtitle: ទីបន្ទាល់​នៃ​ពួក​សាវក
author: សាសនាចក្រ​នៃ​ព្រះយេស៊ូវ​គ្រីស្ទ​នៃ​ពួក​បរិសុទ្ធ​ថ្ងៃ​ចុង​ក្រោយ
paragraphs:
- នៅ​ពេល​យើង​ប្រារព្ធ​ពិធី​រំឭក​ចំពោះ​ថ្ងៃ​ប្រសូត​របស់​ព្រះយេស៊ូវ​គ្រីស្ទ កាលពី​ពីរ​សហសវត្ស​កន្លង​ទៅ នោះ​ពួក​យើង​សូម​ថ្វាយ​ទីបន្ទាល់​របស់​ពួក​យើង​អំពី​តថភាព​ពិត​នៃ​ព្រះជន្ម​ដ៏​ឥត​ប្រៀប​ផ្ទឹម​របស់​ទ្រង់
  និង​គុណធម៌​ដ៏​និរន្ដ​នៃ​ពលិកម្ម​ធួន​ដ៏​មហិមា​របស់​ទ្រង់ ។ ពុំ​មាន​នរណា ដែល​មាន​ឥទ្ធិពល​ដ៏​ខ្លាំង​មហិមា​មក​លើ​មនុស្ស​ដែល​បាន​រស់នៅ
  ហើយ​ដែល​នឹង​រស់នៅ​លើ​ផែនដី​នេះ​ដូចជា​ទ្រង់​ឡើយ ។
- ទ្រង់​គឺ​ជា​ព្រះ​យេហូវ៉ា​ដ៏​មហិមា​នៅ​ក្នុង​គម្ពីរ​សញ្ញា​ចាស់ ហើយ​ជា​ព្រះ​មែស៊ី​នៅ​ក្នុង​គម្ពីរ​សញ្ញា​ថ្មី
  ។ នៅ​ក្រោម​ការ​ដឹកនាំ​របស់​ព្រះវរបិតា​ទ្រង់ នោះ​ទ្រង់​គឺ​ជា​អង្គ​បង្កបង្កើត​នៃ​ផែនដី ។ « គ្រប់​របស់​ទាំង​អស់​បាន​កើត​មក​ដោយ​សារ​ទ្រង់
  ហើយ​ក្នុង​បណ្ដា​របស់​ដែល​បាន​កើត​មក​ទាំង​ប៉ុន្មាន នោះ​គ្មាន​អ្វី​ណា​មួយ​កើត​មក​ក្រៅ​ពី​ទ្រង់​ឡើយ » (
  យ៉ូហាន ១:៣ )។ ទោះ​ជា​ទ្រង់​គ្មាន​បាប​ក្ដី ក៏​ទ្រង់​បាន​ទទួល​បុណ្យ​ជ្រមុជទឹក​ដើម្បី​បំពេញ​នូវ​គ្រប់​អស់​ទាំង​សេចក្ដី​សុចរិត​ដែរ
  ។ ទ្រង់ « បាន​យាង​ចុះ​ឡើង​ធ្វើការ​ល្អ » ( កិច្ចការ ១០:៣៨ ) ប៉ុន្តែ​ត្រូវ​គេ​ស្អប់​ទៅ​វិញ ។ ដំណឹងល្អ​របស់​ទ្រង់​គឺជា​សារ​នៃ​សេចក្ដី​សុខសាន្ដ
  និង​សុជនភាព ។ ទ្រង់​បាន​ទទូច​អង្វរ​មនុស្ស​គ្រប់​រូប​ឲ្យ​ធ្វើ​តាម​គំរូ​ទ្រង់ ។ ទ្រង់​បាន​យាង​តាម​ផ្លូវ​ស្រុក​ភីលីស្ទីន
  ព្យាបាល​អ្នក​ឈឺ ប្រោស​អ្នក​ខ្វាក់​ឲ្យ​មើល​ឃើញ និង​ប្រោស​មនុស្ស​ស្លាប់​ឲ្យ​រស់​ឡើង​វិញ ។ ទ្រង់​បាន​បង្រៀន​សេចក្ដី​ពិត​នៃ​ភាព​អស់កល្ប​ជានិច្ច
  តថភាព​ពិត​នៃ​ជីវិត​មុន​ជីវិត​នៅលើ​ផែនដី​របស់​យើង គោលបំណង​នៃ​ជីវិត​របស់​យើង​នៅ​លើ​ផែនដី និង​សក្ដានុពល​សម្រាប់​បុត្រា​បុត្រី​នៃ​ព្រះ​នៅ​ក្នុង​បរលោកនាយ
  ។
- ទ្រង់​បាន​តាំង​ពិធី​សាក្រាម៉ង់ឡើង ទុក​ជាការ​រំឭក​ចាំ​ដល់​ពលិកម្ម​ធួន​ដ៏​មហិមា​របស់​ទ្រង់ ។ ទ្រង់​ត្រូវ​គេ​ចាប់ព្រះកាយ
  ហើយ​ចោទប្រកាន់​ដោយ​មិន​ត្រឹមត្រូវ ត្រូវគេ​ថ្កោល​ទោស​ដើម្បី​បំពេញ​ចិត្ត​មនុស្ស ហើយ​កាត់ទោសឲ្យ​សុគត​នៅលើ​ឈើ​ឆ្កាង​ត្រង់​ភ្នំ​កាល់វ៉ារី
  ។ ទ្រង់​បាន​លះបង់​ព្រះជន្ម​របស់ទ្រង់ ដើម្បី​ធ្វើឲ្យ​ធួន​នឹង​អំពើបាប​នៃ​មនុស្ស​លោក ។ ព្រះជន្ម​របស់ទ្រង់​គឺជា​អំណោយ​ដ៏​មហិមា​ជំនួសឲ្យ​មនុស្ស​ទាំងអស់​ដែល​ធ្លាប់​រស់នៅលើ​ផែនដី
  ។
- ពួកយើង​សូម​ថ្លែង​ទីបន្ទាល់​ជា​ឧឡារិក​ថា ព្រះជន្ម​ទ្រង់មានសារៈសំខាន់​បំផុត​នៅក្នុង​ប្រវត្តិសាស្ត្រ​នៃមនុស្ស
  ដែលវាពុំ​បាន​ចាប់ផ្ដើម​តែនៅក្នុង​ភូមិ​បេថ្លេហិម ហើយ​បញ្ចប់​នៅ​ត្រង់​ភ្នំ​កាល់វ៉ារី​នោះទេ ។ ទ្រង់​គឺជា​បុត្រាច្បង​នៃ​ព្រះវរបិតា
  ជា​ព្រះរាជបុត្រា​បង្កើត​តែមួយ​នៅក្នុង​សាច់ឈាម ជា​ព្រះប្រោសលោះ​នៃ​ពិភពលោក ។
- ទ្រង់​បានក្រោក​ចេញ​ពី​ផ្នូរ​ដោយ​មានព្រះជន្មរស់​ឡើងវិញ ដើម្បី​ក្លាយ​ជា « ផល​ដំបូង​ពី​ពួក​អ្នក​ដែល​បាន​ដេក​លក់​ទៅហើយ
  » ( កូរិនថូស ទី ១ ១៥:២០ ) ។ នៅពេល​ព្រះអម្ចាស់បាន​មាន​ព្រះជន្ម​រស់ឡើងវិញ ទ្រង់​បាន​យាង​ទៅ​ជួប​ពួកអ្នក​ដែល​ទ្រង់​ស្រឡាញ់
  កាល​ពី​ទ្រង់​ពុំទាន់សុគតនោះ ។ ទ្រង់​ក៏​បាន​ផ្ដល់​ការងារ​បម្រើ​នៅក្នុង​ចំណោម « ចៀម​ឯ​ទៀត » របស់ទ្រង់
  ( យ៉ូហាន ១០:១៦ ) នៅទ្វីប​អាមេរិក​ពី​ជំនាន់​បុរាណ ។ នៅ​ក្នុង​ពិភព​លោកនៃ​ជំនាន់​ថ្មី ទ្រង់ និង​ព្រះវរបិតា​ទ្រង់​បាន​យាងមកជួប​នឹង​យុវជន
  យ៉ូសែប ស្ម៊ីធ ដើម្បី​នាំ​មកនូវ « ការ​កាន់កាប់ត្រួតត្រា​ក្នុងកាល​ដែលពេល​ពេញ​កំណត់បាន​មកដល់ » ដូចដែលបាន​សន្យា​ទុក​ជាយូរ​មក​ហើយ​នោះ
  ( អេភេសូរ ១:១០ ) ។
- ព្យាការី​យ៉ូសែប បាន​សរសេរ​អំពី​ព្រះគ្រីស្ទ​ដ៏​មាន​ព្រះជន្ម​រស់​ថា ៖ « ព្រះនេត្រ​របស់​ទ្រង់​ដូចជា​អណ្ដាត​ភ្លើង
  ព្រះកេសា​របស់​ទ្រង់​ស ដូចជា​ហិមៈសុទ្ធ ព្រះភ័ក្ត្រ​របស់ទ្រង់​ភ្លឺ​ជាង​ពន្លឺ​ថ្ងៃ ហើយ​សំឡេង​របស់ទ្រង់​ដូចជា​សូរ​នៃ​ទឹក​ច្រើន
  គឺ​សំឡេង​នៃ​ព្រះយេហូវ៉ា ដោយ​មាន​ព្រះបន្ទូលថា ៖
- « យើង​ជា​ដើម ហើយ​ជា​ចុង យើង​ជា​ព្រះអង្គ​ដែល​មាន​ព្រះជន្ម​រស់​នៅ យើងជា​អង្គ​ដែល​ត្រូវ​គេ​ធ្វើ​គត យើងជា​ព្រះគាំទ្រ​របស់​អ្នក​ជាមួយ​ព្រះវរបិតា
  » ( គ. និង ស. ១១០:៣–៤ ) ។
- ព្យាការីរូបនេះក៏​បាន​ប្រកាស​អំពី​ទ្រង់​ផងដែរ​ថា ៖ « ហើយ​ឥឡូវ​នេះ បន្ទាប់ពី​ទីបន្ទាល់​ជាច្រើន​ដែល​បាន​ថ្លែង​អំពី​ទ្រង់
  នេះ​គឺជា​ទីបន្ទាល់​ចុង​ក្រោយ​បង្អស់ ដែល​យើងខ្ញុំ​សូមថ្លែង​អំពី​ទ្រង់ ៖ គឺ​ថា​ទ្រង់​មាន​ព្រះជន្ម​រស់នៅ
  !
- « ដ្បិត​យើង​ខ្ញុំ​បាន​ឃើញ​ទ្រង់​គង់​នៅ​ខាង​ស្ដាំ​ព្រះហស្ដ​នៃ​ព្រះ ហើយ​យើង​ខ្ញុំ​បាន​ឮ​សំឡេង ដែល​ថ្លែង​ទីបន្ទាល់​ថា
  ទ្រង់​គឺជា​បុត្រា​បង្កើត​តែមួយ​នៃ​ព្រះវរបិតា—
- « ថា​ដោយសារ​ព្រះអង្គ និង​តាមរយៈ​ព្រះអង្គ ហើយ​ពីព្រះអង្គ នោះ​ពិភពលោក​ទាំងឡាយ​មាន​ឡើង ហើយ​បាន​បង្កើត​មក
  ហើយ​បណ្ដា​ជន​នៅ​ទីនោះ គឺជា​បុត្រា​បុត្រី​បង្កើត​ចំពោះ​ព្រះ » ( គ. និង ស. ៧៦:២២–២៤ ) ។
- ពួកយើង​សូម​ប្រកាសជាឧឡារិក​ថា បព្វជិតភាព​របស់ទ្រង់ និង​សាសនាចក្រ​របស់ទ្រង់ ត្រូវ​បាន​ស្ដារ​ឡើងវិញ​នៅលើ​ផែនដី—
  « ដែល​បាន​ស្អាង​ឡើង​លើ​ជើង​ជញ្ជាំង​នៃ … ពួក​សាវក និង​ពួក​ព្យាការី ហើយ​ព្រះយេស៊ូវ​គ្រីស្ទ​នោះឯង ទ្រង់​ជា​ថ្ម​ជ្រុង​យ៉ាងឯក
  » ( អេភេសូរ ២:២០ ) ។
- ពួកយើង​សូម​ធ្វើ​ទីបន្ទាល់​ថា ទ្រង់​នឹង​យាង​មក​ផែនដី​វិញ​នៅ​ថ្ងៃណា​មួយ ។ « នោះ​សិរីល្អ​នៃ​ព្រះយេហូវ៉ា​នឹង​សម្ដែង​មក
  គ្រប់​មនុស្ស​ទាំងឡាយ​នឹង​បាន​ឃើញ​ព្រមគ្នា » ( អេសាយ ៤០:៥ ) ។ ទ្រង់​នឹង​គ្រប់គ្រង​ជា​ស្ដេច​លើ​អស់ទាំង​ស្ដេច
  ហើយ​សោយរាជ្យ​ជា​ព្រះអម្ចាស់​លើ​អស់​ទាំង​ព្រះអម្ចាស់ ហើយ​គ្រប់​ទាំងជង្គង់​ត្រូវ​លុត​ចុះ ហើយ​គ្រប់​ទាំង​អណ្ដាត​នឹង​ថ្លែង​ថ្វាយ​បង្គំ​ទ្រង់
  ។ យើង​ម្នាក់ៗ​នឹង​ត្រូវ​ឈរ​ទទួល​ការ​ជំនុំ​ជម្រះ​ពី​ទ្រង់ ស្រប​តាម​កិច្ចការ និង​សេចក្ដី​ប៉ង​ប្រាថ្នា​ទាំងឡាយ​នៃ​ដួងចិត្ត​របស់​យើង
  ។
- ក្នុង​នាម​ជា​ពួក​សាវករបស់ទ្រង់​ដែល​បាន​តែងតាំង​ឡើង​ដោយ​ត្រឹមត្រូវ ពួកយើង​សូម​ថ្លែង​ទីបន្ទាល់​ថា—ព្រះយេស៊ូវគឺជា​ព្រះ​គ្រីស្ទ​ដ៏​មាន​ព្រះជន្ម​រស់
  និង​ជា​ព្រះរាជបុត្រា​អមតភាព​របស់​ព្រះ ។ ទ្រង់​គឺជា​ព្រះរាជា​អេម៉ាញូអែល​ដ៏​មហិមា ដែល​សព្វថ្ងៃនេះ​គង់​នៅ​ខាង​ស្ដាំ​ព្រះហស្ដ​នៃ​ព្រះ​វរបិតា​របស់ទ្រង់
  ។ ទ្រង់​គឺជា​ពន្លឺ ជា​ជីវិត ហើយ​ជា​សេចក្ដីសង្ឃឹម​នៃ​ពិភពលោក ។ មាគ៌ា​របស់ទ្រង់​គឺជា​មាគ៌ា​ដែល​នាំ​ទៅរក​សុភមង្គល​នៅក្នុង​ជីវិត​នេះ
  និង​ជីវិត​ដ៏​នៅ​អស់កល្ប​ជានិច្ច​ក្នុង​បរលោក​នាយ ។ សូម​ថ្វាយ​អំណរ​ព្រះគុណ​ចំពោះ​ព្រះ​សម្រាប់​ព្រះរាជបុត្រា​ដ៏​ទេវភាព​របស់ទ្រង់
  ដែល​ជា​អំណោយ​ដ៏​ឥតប្រៀបផ្ទឹម​បាន ៕ ៚
