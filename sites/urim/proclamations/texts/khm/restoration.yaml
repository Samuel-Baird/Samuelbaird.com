title: ការស្ដារ​ឡើងវិញ​នៃ​ភាពពេញលេញ​នៃ​ដំណឹងល្អ​របស់​ព្រះយេស៊ូវគ្រីស្ទ
subtitle: ការប្រកាស​ដល់​ពិភពលោក​នៃ​ខួប​លើក​ទី​ពីររយ​ឆ្នាំ
author: គណៈប្រធាន​ទីមួយ និង​ក្រុមប្រឹក្សា​នៃ​ពួក​សាវក​ដប់ពីរនាក់​នៃ​សាសនាចក្រ​នៃ​ព្រះយេស៊ូវគ្រីស្ទ​នៃ​ពួកបរិសុទ្ធ​ថ្ងៃចុង​ក្រោយ
note: ការប្រកាស​នេះ​ត្រូវបាន​អាន​ដោយ​ប្រធាន រ័សុល អិម ណិលសុន ជាផ្នែកមួយ​នៃ​សារលិខិត​របស់​លោក​នៅក្នុង​សន្និសីទ​ទូទៅ​ប្រចាំ​ឆ្នាំ​លើក​ទី
  ១៩០ ​នៅថ្ងៃ​ទី ៥ ខែ មេសា ឆ្នាំ ២០២០ នៅក្នុង​ទីក្រុង​សលត៍ លេក រដ្ឋយូថាហ៍ ។
paragraphs:
- យើង​សូម​ប្រកាស​ជា​ឧឡារិក​ថា ព្រះ​ស្រឡាញ់​បុត្រាបុត្រីរបស់ទ្រង់​គ្រប់​ជាតិសាសន៍​នៅក្នុង​ពិភពលោក​នេះ ។
  ព្រះ​ជា​ព្រះបិតា បាន​ប្រទានដល់​យើង​នូវ​កំណើត​ដ៏ទេវភាព ជា​ជីវិត​ដែល​ឥត​ប្រៀបផ្ទឹម និង​ពលិកម្ម​ធួន​ដ៏​និរន្ដរ៍​នៃ​ព្រះរាជបុត្រា​សំណព្វរបស់​​ទ្រង់
  គឺ​ព្រះយេស៊ូវគ្រីស្ទ ។ ដោយ​ព្រះចេស្ដា​នៃ​ព្រះបិតា នោះ​ព្រះយេស៊ូវ​បាន​រស់ឡើងវិញ​ម្ដងទៀត ហើយ​បាន​ទទួលជ័យ​ជម្នះ​លើ​សេចក្ដីស្លាប់
  ។ ទ្រង់​គឺ​ជា​ព្រះអង្គសង្គ្រោះ​របស់​យើង ជាគំរូ​របស់​យើង និង​ជា​ព្រះ​ប្រោសលោះ​របស់​យើង ។
- ពីរ​រយ​ឆ្នាំ​កន្លង​ទៅ នៅ​ព្រឹក​និទាឃរដូវ​ដ៏​ស្រស់ស្អាត​មួយ​ក្នុង​ឆ្នាំ ១៨២០ យុវជន​យ៉ូសែប ស្ម៊ីធ កំពុង​ស្វែងរក​ដោយចង់​ដឹង​ថា​គួរ​ចូលរួម​ព្រះវិហារ​មួយណា
  គាត់​បាន​ចេញ​ទៅ​ក្នុង​ព្រៃ​នៅ​ជិត​ផ្ទះ​គាត់ នៅប៉ែកខាងជើង​រដ្ឋនូវយ៉ោក​សហរដ្ឋអាមេរិក​ដើម្បី​អធិស្ឋាន ។
  គាត់​បាន​សួរសំណួរ​ទាក់ទង​ទៅនឹង​សេចក្ដីសង្គ្រោះ​នៃ​ព្រលឹង​គាត់ ហើយ​ទុកចិត្ត​ថា​ព្រះ​នឹង​ដឹកនាំ​គាត់ ។
- យើង​សូម​ប្រកាស​ដោយរាបសា​ថា នៅ​ក្នុង​ចម្លើយ​ចំពោះ​ការ​អធិស្ឋាន​របស់​គាត់ ព្រះជាព្រះបិតា និង​ព្រះរាជបុត្រា​ទ្រង់
  ព្រះយេស៊ូវគ្រីស្ទ បានលេច​មក​ជួប​យ៉ូសែប ហើយ​បាន​ផ្ដើម « តាំង​របស់​ទាំង​អស់​ឡើង​វិញ »​ ( កិច្ចការ ៣:២១
  ) ដូច​បាន​ទាយទុក​ក្នុង​ព្រះគម្ពីរ​ប៊ីប ។ នៅ​ក្នុង​ការ​និមិត្ត​នេះ គាត់​បាន​រៀន​ថា បន្ទាប់ពី​ការ​ស្លាប់​របស់​ពួក​សាវក​ជំនាន់​ដើម
  នោះ​ព្រះវិហារ​​របស់​ព្រះគ្រីស្ទ​ក្នុង​​សញ្ញាថ្មី​ត្រូវ​បាន​បាត់បង់​ពី​ផែនដី ។​ យ៉ូសែប​នឹង​ធ្វើ​ជា​ឧបករណ៍​ក្នុង​ការ​នាំ​វា​ត្រឡប់មកវិញ
  ។
- យើង​សូម​អះអាង​ថា នៅក្រោម​ការ​ដឹកនាំ​របស់​ព្រះបិតា និង​ព្រះរាជបុត្រា នោះ​សារទូតសួគ៌ា​បាន​យាង​មក​បង្រៀន​ដល់​យ៉ូសែប
  ហើយ​បាន​ស្ថាបនា​សាសនាចក្រ​នៃ​ព្រះយេស៊ូវគ្រីស្ទ​ឡើងវិញ ។ យ៉ូហានបាទីស្ទ​ដែល​បាន​រស់ឡើងវិញ​បាន​ស្ដារ​សិទ្ធិអំណាច​ដើម្បី​ធ្វើពិធី​បុណ្យជ្រមុជទឹក​ដោយ​ការ​ពន្លិច​សម្រាប់​ការ​ផ្ដាច់​បាប
  ។ ពួកសាវកបី​នាក់​ក្នុង​ចំណោម​ពួកសាវក​ដប់ពីរ​នាក់កាលពី​ដើម—ពេត្រុស យ៉ាកុប និង​យ៉ូហាន—បាន​ស្ដារភាព​ជា​សាវក
  និង​កូនសោ​នៃ​សិទ្ធិអំណាច​បព្វជិតភាព​ឡើងវិញ ។ អ្នក​ផ្សេងទៀត​បាន​យាងមក​ផងដែរ រួមមានទាំង អេលីយ៉ា ដែល​បានស្ដារ​សិទ្ធិអំណាច​ដើម្បី​ចងភ្ជាប់​ក្រុមគ្រួសារ​ជាមួយគ្នា​ជា​រៀងរហូត​នៅ​ក្នុង​ទំនាក់ទំនង​​ដ៏​អស់កល្ប​ជានិច្ច​ដែល​ហួស​ពី​សេចក្ដីស្លាប់
  ។
- យើង​សូម​ធ្វើ​ជា​សាក្សី​បន្ថែម​ថា យ៉ូសែប ស៊្មីធ ត្រូវ​បាន​ប្រគល់​អំណោយទាន និង​អំណាច​នៃ​ព្រះ​ដើម្បី​បកប្រែ​កំណត់ត្រា​ពី​បុរាណ​គឺ​ព្រះ​គម្ពីរ​មរមន—សក្ខីបទ​មួយ​ទៀត​អំពី​ព្រះ​យេស៊ូវ​គ្រីស្ទ
  ។ ទំព័រ​នៃ​អត្ថបទ​ពិសិដ្ឋ​នេះ រួមមាន​នូវ​ដំណើររឿង​នៃ​ការ​បម្រើ​ដោយផ្ទាល់​របស់​ព្រះយេស៊ូវគ្រីស្ទ​នៅ​ក្នុង​ចំណោម​រាស្ត្រ​នៅ​អឌ្ឍគោលខាងលិច​ភ្លាមៗ​បន្ទាប់ពី​ការមាន​ព្រះជន្ម​រស់ឡើងវិញ​របស់​ទ្រង់
  ។ វា​បង្រៀន​អំពី​គោលបំណង​នៃជីវិត ហើយ​ពន្យល់​អំពី​គោលលទ្ធិ​នៃ​ព្រះគ្រីស្ទ ដែល​សំខាន់​ចំពោះ​គោលបំណង​នោះ
  ។ ជា​ដៃគូ​គម្ពីរ​ទៅនឹង​គម្ពីរ​ប៊ីប ព្រះគម្ពីរ​មរមន​ថ្លែង​ទីបន្ទាល់​ថា មនុស្ស​គ្រប់រូប​គឺជា​បុត្រា​បុត្រី​នៃ​ព្រះបិតា​សួគ៌​ជា​ទីស្រឡាញ់
  ថា​ទ្រង់​មានផែនការ​ដ៏​ទេវភាព​សម្រាប់​ជីវិត​របស់​យើង ហើយ​ថា​ព្រះរាជបុត្រា​របស់​ទ្រង់ ព្រះយេស៊ូវគ្រីស្ទ
  មាន​បន្ទូល​នៅ​សព្វថ្ងៃនេះ ក៏ដូចជា​ពី​ជំនាន់​មុនដែរ ។
- យើង​សូម​ប្រកាសថា សាសនាចក្រ​នៃ​ព្រះយេស៊ូវគ្រីស្ទ​ នៃ​ពួក​បរិសុទ្ធ​ថ្ងៃ​ចុង​ក្រោយ ដែល​បាន​រៀបចំឡើង​នៅ​ថ្ងៃទី
  ៦ ខែ មេសា ឆ្នាំ ១៨៣០ គឺជា​ព្រះវិហារ​​របស់​ព្រះគ្រីស្ទ​ក្នុង​​សញ្ញាថ្មី​ដែល​បាន​ស្ដារឡើងវិញ ។ សាសនាចក្រ​នេះ​គឺ​ជា​យុថ្កា​នៅ​ក្នុង​ជីវិត​ដ៏​ឥតខ្ចោះ​នៃ​ថ្មជ្រុង​យ៉ាងឯក
  គឺ​ព្រះយេស៊ូវគ្រីស្ទ និង​នៅក្នុង​ដង្វាយធួន​ដ៏​និរន្ដរ៍ និង​ការ​រស់ឡើងវិញ​ដ៏ពិត​របស់ទ្រង់ ។ ព្រះ​យេស៊ូវ​គ្រីស្ទ​បាន​ហៅ​ពួកសាវក​ជា​ថ្មី​ម្ដងទៀត
  ហើយ​បាន​ប្រគល់​សិទ្ធិអំណាច​បព្វជិតភាព​ដល់ពួកគេ ។ ទ្រង់​អញ្ជើញ​យើង​ទាំងអស់​គ្នា​ឲ្យ​មក​រកទ្រង់ និង​សាសនាចក្រ​របស់​ទ្រង់
  ដើម្បី​ទទួល​ព្រះវិញ្ញាណបរិសុទ្ធ ពិធីបរិសុទ្ធ​នៃ​សេចក្ដីសង្គ្រោះ និង​ដើម្បី​ទទួល​បាន​អំណរ​ដ៏​ខ្ជាប់ខ្ជួន
  ។
- ពីរ​រយឆ្នាំ​បាន​កន្លង​ហួស​ទៅ​ហើយ ចាប់តាំង​ពី​ការស្ដារ​ឡើងវិញ​ត្រូវ​បាន​ចាប់​ផ្ដើម​ដោយ​ព្រះ​ជា​ព្រះបិតា
  និង​ព្រះរាជបុត្រា​សំណព្វ​របស់ទ្រង់ គឺ​ព្រះយេស៊ូវគ្រីស្ទ ។ មានមនុស្ស​រាប់លាន​នាក់​នៅ​ទូទាំង​ពិភពលោក បាន​ឱប​ក្រសោប​យក​ចំណេះដឹង​មួយ​នៃ​ព្រឹត្តការណ៍​ដែល​បាន​ព្យាករ​ទុក​ទាំងនេះ
  ។
- យើង​រីករាយ​នឹង​ប្រកាស​ថា ការស្ដារឡើងវិញ​ដែលបាន​សន្យា​នោះ បន្ដ​ឆ្ពោះទៅមុខ​តាមរយៈ​វិវរណៈ​ជា​បន្ដបន្ទាប់
  ។ ផែនដី​នឹង​ពុំ​នៅ​ដដែល​ឡើយ នៅពេល​ព្រះ​នឹង « បំព្រួម​គ្រប់​ទាំង​អស់​ក្នុង​ព្រះគ្រីស្ទ » ( អេភេសូរ ១:១០
  ) ។
- ដោយ​គារវភាព និង​ការ​ដឹងគុណ ពួក​យើង​ជា​សាវក​របស់ទ្រង់ សូម​អញ្ជើញ​មនុស្ស​ទាំងអស់​ឲ្យ​បាន​ដឹង—ដូចជា​យើងបានដឹង—ថា​ស្ថានសួគ៌​បាន​បើក
  ។ យើង​អះអាង​ថា ព្រះ​កំពុង​បង្ហាញ​ព្រះឆន្ទៈ​របស់ទ្រង់​ចំពោះ​បុត្រាបុត្រី​ជា​ទីស្រឡាញ់​របស់ទ្រង់ ។ យើង​ថ្លែង​ទីបន្ទាល់​ថា
  អស់​អ្នក​ដែល​សិក្សា​សារលិខិត​អំពី​ការ​ស្ដារឡើងវិញ​នេះ​ប្រកប​ដោយ​ការ​អធិស្ឋាន ហើយ​ធ្វើ​សកម្មភាព​ដោយជំនឿ
  នឹង​ត្រូវ​ប្រទានពរ​ឲ្យ​ទទួល​បាន​សាក្សី​ផ្ទាល់ខ្លួន​អំពី​ទេវភាព និង​គោលបំណង​របស់​វា​នៅ​ក្នុង​ការរៀបចំ​ពិភពលោក​សម្រាប់​ការយាង​មក​ជាលើក​ទីពីរ​របស់ព្រះអម្ចាស់
  និង​ព្រះអង្គសង្គ្រោះ ព្រះយេស៊ូវ​គ្រីស្ទ​របស់​យើង ដូច​ដែល​បាន​សន្យា ។
