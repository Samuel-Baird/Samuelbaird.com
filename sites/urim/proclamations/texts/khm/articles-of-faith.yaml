title: មាត្រា​នៃ​សេចក្ដី​ជំនឿ នៃ​សាសនាចក្រ​នៃ​ព្រះ​យេស៊ូវ​គ្រីស្ទ​នៃ​ពួក​បរិសុទ្ធ​ថ្ងៃ​ចុង​ក្រោយ
subtitle: ''
author: ''
verses:
- n: 1
  text: យើង​ខ្ញុំ​ជឿ​ដល់​ព្រះ គឺ​ព្រះ​វរបិតា​ដ៏​គង់នៅ​អស់​កល្ប​ជានិច្ច និង​ដល់​ព្រះ​រាជ​បុត្រា​ទ្រង់ គឺ​ព្រះ​យេស៊ូវ​គ្រីស្ទ
    ហើយ​ដល់​ព្រះ​វិញ្ញាណ​បរិសុទ្ធ។
  label: ១
- n: 2
  text: យើង​ខ្ញុំ​ជឿ​ថា មនុស្ស​ទាំង​អស់​នឹង​ត្រូវ​ទទួល​ទោស​ចំពោះ​អំពើ​បាប​របស់​ខ្លួន​ផ្ទាល់ គឺ​មិនមែន​ចំពោះ​អំពើ​រំលង​របស់​លោក​អ័ដាម​ទេ។
  label: ២
- n: 3
  text: យើង​ខ្ញុំ​ជឿ​ថា តាម​រយៈ​ដង្វាយ​ធួន​នៃ​ព្រះ​គ្រីស្ទ នោះ​មនុស្ស​លោក​ទាំង​អស់​អាច​បាន​សង្គ្រោះ ដោយ​សារ​ការ​គោរព​តាម​ក្រឹត្យ​វិន័យ
    និង​ពិធីបរិសុទ្ធ​ទាំង​ឡាយ​នៃ​ដំណឹង​ល្អ។
  label: ៣
- n: 4
  text: យើង​ខ្ញុំ​ជឿ​ថា គោលការណ៍​ទី​មួយ និង​ពិធីបរិសុទ្ធ​ទាំង​ឡាយ​នៃ​ដំណឹង​ល្អ​គឺ ៖ ទី​មួយ សេចក្ដី​ជំនឿ​ជឿ​ដល់​ព្រះ​អម្ចាស់​យេស៊ូវ​គ្រីស្ទ
    ទី​ពីរ ការ​ប្រែ​ចិត្ត ទី​បី បុណ្យ​ជ្រមុជ​ទឹក ដោយ​ការ​ពន្លិច​សម្រាប់​ការ​ផ្ដាច់​បាប ទី​បួន ការ​ដាក់​ដៃ​លើ​សម្រាប់​អំណោយទាន​ជា​ព្រះ​វិញ្ញាណ​បរិសុទ្ធ។
  label: ៤
- n: 5
  text: យើង​ខ្ញុំ​ជឿ​ថា មនុស្ស​ត្រូវ​តែ​បាន​ហៅ​ពី​ព្រះ ដោយ​ការ​ព្យាករណ៍ និង​ដោយ​ការ​ដាក់​ដៃ​លើ ដោយ​អស់​អ្នក​ណា​ដែល​មាន​សិទ្ធិ​អំណាច
    ដើម្បី​នឹង​ផ្សាយដំណឹង​ល្អ ហើយ​ប្រព្រឹត្ត​ពិធីបរិសុទ្ធ​ទាំង​ឡាយ​នៃ​ដំណឹង​ល្អ។
  label: ៥
- n: 6
  text: យើង​ខ្ញុំ​ជឿ​ចំពោះ​ការ​រៀបចំ​ដូច​គ្នា ដូចដែល​មាន​នៅ​ក្នុង​សាសនាចក្រ​ពី​អតីតកាល ដូច​ជា ពួក​សាវក
    ពួក​ព្យាការី ពួក​គ្រូ គង្វាល ពួក​គ្រូ ពួក​គ្រូ​ផ្សាយដំណឹង​ល្អ​ជាដើម។
  label: ៦
- n: 7
  text: យើង​ខ្ញុំ​ជឿ​ដល់​អំណោយទាន​ខាង​ភាសា ការ​ព្យាករណ៍ វិវរណៈ ការ​និមិត្ត ការ​ប្រោស​ឲ្យ​ជា ការ​បកប្រែ​ភាសា​ជាដើម។
  label: ៧
- n: 8
  text: យើង​ខ្ញុំ​ជឿ​ថា ព្រះ​គម្ពីរ​ប៊ីប គឺជា​ព្រះ​បន្ទូល​នៃ​ព្រះ បើ​សិន​ជា​បាន​បកប្រែ​ត្រឹម​ត្រូវ យើង​ខ្ញុំ​ក៏​ជឿ​ដែរ​ថា
    ព្រះ​គម្ពីរ​មរមន​ជា​ព្រះ​បន្ទូល​នៃ​ព្រះ។
  label: ៨
- n: 9
  text: យើង​ខ្ញុំ​ជឿ​ចំពោះ​ការណ៍​ទាំង​អស់ ដែល​ទ្រង់​បាន​បើក​សម្ដែង​មក និង​ការណ៍​ទាំង​អស់ ដែល​ទ្រង់​បើក​សម្ដែង​នៅ​ពេល​ឥឡូវ​នេះ
    ហើយ​យើង​ខ្ញុំ​ជឿ​ថា ទ្រង់​នឹង​បើក​សម្ដែង​នូវ​ការណ៍​ដ៏​ធំ និង​សំខាន់ៗ​ជា​ច្រើន ដែល​ទាក់​ទង​ទៅ​នឹង​នគរ​នៃ​ព្រះ។
  label: ៩
- n: 10
  text: យើង​ខ្ញុំ​ជឿ​ចំពោះ​ការ​ប្រមូល​ដ៏​ពិតប្រាកដ​នៃ​សាសន៍​អ៊ីស្រាអែល និង​ចំពោះ​ការ​សាង​ឡើង​វិញ​នូវ​ពូជ​ទាំង​១០
    អំបូរ ថា​ក្រុង​ស៊ីយ៉ូន (ក្រុង​យេរូសាឡិម​ថ្មី) នឹង​ត្រូវ​បាន​ស្ថាបនា​នៅ​លើ​ទ្វីប​អាមេរិក ថា​ព្រះ​គ្រីស្ទ​នឹង​គ្រង​រាជ្យ​នៅ​លើ​ផែនដី​ផ្ទាល់
    ហើយ​ថា​ផែនដី​នឹង​បាន​ផ្លាស់​ប្ដូរ​សារ​ជា​ថ្មី ហើយ​នឹង​ទទួល​សិរី​ល្អ​ដ៏​ប្រកប​ដោយ​ភាព​បរមសុខ។
  label: ១០
- n: 11
  text: យើង​ខ្ញុំ​សូម​អះអាង​យក​សិទ្ធិ​ក្នុង​ការ​ថ្វាយ​បង្គំ​ព្រះ​ដ៏​មាន​មហិទ្ធិឫទ្ធិ ស្រប​តាម​ការ​ណែនាំ​នៃ​សម្បជញ្ញៈ​របស់​យើង​ខ្ញុំ
    ហើយ​សូម​បណ្ដោយ​ឲ្យ​មនុស្ស​ទាំង​អស់​មាន​សិទ្ធិ​ដូច​គ្នា ចូរ​ឲ្យ​គេ​ថ្វាយ​បង្គំ​តាម​របៀប​ណា នៅ​ទីណា
    ឬ​អ្វី​ក៏​ដោយ​ដែល​គេ​ប្រាថ្នា។
  label: ១១
- n: 12
  text: យើង​ខ្ញុំ​ជឿ​ចំពោះ​ការ​នៅ​ក្រោម​អំណាច​ស្ដេច ប្រធានាធិបតី អ្នក​គ្រប់​គ្រង និង​ចៅក្រម​ទាំង​ឡាយ ក្នុង​ការ​គោរព
    ការ​ប្រតិបត្តិ និង​ការ​គាំទ្រ​ច្បាប់។
  label: ១២
- n: 13
  text: យើង​ខ្ញុំ​ជឿ​លើ​ការ​ប្រព្រឹត្ត​ដោយ​ទៀងត្រង់ ត្រឹម​ត្រូវ បរិសុទ្ធ សប្បុរស គុណធម៌ ហើយ​លើ​ការ​ធ្វើ​ល្អ​ដល់​មនុស្ស​ទាំង​អស់
    ពិតមែន​ហើយ យើង​ខ្ញុំ​អាច​និយាយ​បាន​ថា យើង​ខ្ញុំ​ដើរ​តាម​សេចក្ដី​ដាស់តឿន​របស់​ប៉ុល — យើង​ខ្ញុំ​ជឿ​ដល់​អ្វីៗ​ទាំង​អស់
    យើង​ខ្ញុំ​សង្ឃឹម​ដល់​អ្វីៗ​ទាំង​អស់ យើង​ខ្ញុំ​បាន​ទ្រាំទ្រ​អ្វីៗ​ជា​ច្រើន ហើយ​សង្ឃឹម​ថា​នឹង​អាច​ទ្រាំទ្រ​អ្វីៗ​ទាំង​អស់​បាន​ដែរ។
    ហើយ​បើ​សិន​ជា​មាន​អ្វី​ណា​មួយ ដែល​ប្រកប​ដោយ​គុណធម៌ គួរ​ស្រឡាញ់ ឬ​ឈ្មោះ​ល្អ ឬ​ក៏​គួរ​ឲ្យ​សរសើរ នោះ​យើង​ខ្ញុំ​ស្វែងរក​របស់​ផង​ទាំង​នេះ​ហើយ។
  label: ១៣
signature: យ៉ូសែប ស៊្មីធ
