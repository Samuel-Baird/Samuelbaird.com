retrieved: '2026-11-02'
title: Ang Pagpahiuli sa Kahingpitan sa Ebanghelyo ni Jesukristo
subtitle: Usa ka Pamahayag ngadto sa Kalibotan sa Ikaduhang Siglo nga Kasaulogan
author: Ang Unang Kapangulohan ug Konseho sa Napulog Duha ka Apostoles sa Ang Simbahan ni Jesukristo sa
  mga Santos sa Ulahing mga Adlaw
note: Kini nga pamahayag gibasa ni Presidente Russell M. Nelson isip kabahin sa iyang mensahe sa ika-190
  nga Tinuig nga Kinatibuk-ang Komperensiya, Abril 5, 2020, sa Siyudad sa Salt Lake, Utah.
paragraphs:
- Kami sa maligdong nga paagi mopahayag nga ang Dios nagmahal sa Iyang mga anak sa matag nasod sa kalibotan.
  Ang Dios nga Amahan mihatag kanato sa balaanong pagkatawo, walay sama nga kinabuhi, ug walay kinutoban
  nga maulaong sakripisyo sa Iyang Pinalanggang Anak, si Jesukristo. Pinaagi sa gahom sa Amahan, si Jesus
  mibangon pag-usab ug nakaangkon og kadaogan batok sa kamatayon. Siya ang atong Manluluwas, atong Ehemplo,
  ug atong Manunubos.
- Duha ka gatos ka tuig na ang milabay, sa usa ka matahom nga buntag sa tingpamulak niadtong 1820, ang
  batan-ong si Joseph Smith, nagtinguha nga masayod kon hain nga simbahan ang apilan, miadto sa kakahoyan
  aron mag-ampo duol sa iyang panimalay sa amihanang bahin sa New York, USA. Aduna siyay mga pangutana
  kalabot sa kaluwasan sa iyang kalag ug misalig nga ang Dios mogiya kaniya.
- Uban sa kamapainubsanon, kami mopahayag nga agi og tubag sa iyang pag-ampo, ang Dios nga Amahan ug ang
  Iyang Anak, si Jesukristo, mipakita kang Joseph ug mipasiugda sa “pagpabalik sa tanang butang” (Mga
  Buhat 3:21) sama sa gipanagna diha sa Biblia. Dinhi niini nga panan-awon, iyang nakat-onan nga human
  mamatay ang orihinal nga Apostoles, ang Simbahan ni Kristo sa Bag-ong Tugon nawala sa kalibotan. Si
  Joseph ang himoon nga instrumento sa pagbalik niini.
- Kami momatuod nga ubos sa direksyon sa Amahan ug sa Anak, ang langitnon nga mga mensahero mianhi aron
  sa pagtudlo kang Joseph ug sa pag-establisar og usab sa Simbahan ni Jesukristo. Ang nabanhaw nga si
  Juan Bautista mipahiuli sa awtoridad sa pagbunyag pinaagi sa pagpaunlod alang sa kapasayloan sa mga
  sala. Tulo sa orihinal nga napulog duha ka Apostoles—si Pedro, Santiago, ug Juan—mipahiuli sa pagka-apostol
  ug sa mga yawe sa awtoridad sa pagkapari. Ang uban mianhi usab, lakip ni Elijah, kinsa mipahiuli sa
  awtoridad sa paghiusa sa mga pamilya hangtod sa kahangtoran diha sa mahangtoron nga mga pakigrelasyon
  nga molungtad lapas sa kamatayon.
- 'Dugang kaming mosaksi nga si Joseph Smith gihatagan sa gasa ug gahom sa Dios sa paghubad sa usa ka
  karaan nga rekord: ang Basahon ni Mormon—Lain nga Tugon ni Jesukristo. Ang mga pahina niining sagrado
  nga teksto naglakip og usa ka asoy sa personal nga pagpangalagad ni Jesukristo taliwala sa katawhan
  sa Kasadpang Bahin sa Kalibotan human gayod sa Iyang Pagkabanhaw. Nagtudlo kini sa katuyoan sa kinabuhi
  ug nagpasabot sa doktrina ni Kristo, nga mahinungdanon alang niana nga katuyoan. Isip kauban nga kasulatan
  sa Biblia, ang Basahon ni Mormon nagpamatuod nga ang tanang tawhanong nilalang mga anak nga lalaki ug
  mga anak nga babaye sa usa ka mahigugmaong Amahan sa Langit, nga Siya adunay balaanon nga plano alang
  sa atong kinabuhi, ug nga ang Iyang Anak, si Jesukristo, namulong karon sa samang paagi sa karaang panahon.'
- Kami mopahayag nga Ang Simbahan ni Jesukristo sa mga Santos sa Ulahing mga Adlaw, nga giorganisar niadtong
  Abril 6, 1830, mao ang Simbahan ni Kristo sa Bag-ong Tugon nga gipahiuli. Kini nga Simbahan nakaangkla
  sa hingpit nga kinabuhi sa ulohang bato sa pamag-ang niini, si Jesukristo, ug diha sa Iyang walay kinutoban
  nga Pag-ula ug literal nga Pagkabanhaw. Si Jesukristo nagtawag usab og Apostoles ug naghatag kanila
  og awtoridad sa pagkapari. Siya nagdapit kanatong tanan sa pagduol ngadto Kaniya ug sa Iyang Simbahan,
  sa pagdawat sa Espiritu Santo, sa mga ordinansa sa kaluwasan, ug sa pag-angkon og malungtarong kalipay.
- Duha ka gatos ka tuig na ang milabay sukad nga gipasiugdahan sa Dios nga Amahan ug sa Iyang Pinalanggang
  Anak, si Jesukristo, kini nga Pagpahiuli. Minilyon sa tibuok kalibotan ang mihangop sa kahibalo mahitungod
  niining gipanagna nga mga panghitabo.
- Malipayon kaming mopahayag nga ang gisaad nga Pagpahiuli padayon nga mahitabo pinaagi sa nagpadayon
  nga pagpadayag. Ang kalibotan dili na gayod mahimong sama kaniadto, tungod kay ang Dios “[mo]hiusa diha
  kang Kristo sa tanang butang” (Mga Taga-Efeso 1:10).
- Uban sa balaang pagtahod ug pagpasalamat, kami isip Iyang mga Apostol modapit sa tanan aron masayod—sama
  kanamo—nga ang kalangitan bukas. Kami momatuod nga ang Dios mipahibalo sa Iyang kabubut-on alang sa
  Iyang pinalanggang mga anak nga lalaki ug mga anak nga babaye. Kami mopamatuod nga kadtong mainampoong
  magtuon sa mensahe sa Pagpahiuli ug molihok inubanan sa hugot nga pagtuo mapanalanginan nga makaangkon
  og ilang kaugalingong pagsaksi sa kabalaan niini ug sa katuyoan niini sa pag-andam sa kalibotan alang
  sa gisaad nga Ikaduhang Pag-anhi sa atong Ginoo ug Manluluwas, si Jesukristo.
