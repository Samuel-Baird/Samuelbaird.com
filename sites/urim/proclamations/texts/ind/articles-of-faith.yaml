title: Pasal-Pasal Kepercayaan
subtitle: Gereja Yesus Kristus dari Orang-Orang Suci Zaman Akhir
author: ''
verses:
- n: 1
  text: Kami percaya kepada Allah, Bapa Yang Kekal, dan kepada Putra-Nya, Yesus Kristus, dan kepada Roh
    Kudus.
- n: 2
  text: Kami percaya bahwa manusia akan dihukum karena dosa-dosa mereka sendiri, dan bukan karena pelanggaran
    Adam.
- n: 3
  text: Kami percaya bahwa melalui Pendamaian Kristus, seluruh umat manusia boleh diselamatkan, melalui
    kepatuhan pada hukum dan tata cara Injil.
- n: 4
  text: 'Kami percaya bahwa asas dan tata cara pertama Injil adalah: pertama, Iman kepada Tuhan Yesus
    Kristus; kedua, Pertobatan; ketiga, Baptisan melalui pencelupan untuk pengampunan akan dosa-dosa;
    keempat, Penumpangan tangan untuk karunia Roh Kudus.'
- n: 5
  text: Kami percaya bahwa seseorang mesti dipanggil oleh Allah, melalui nubuat, dan melalui penumpangan
    tangan oleh mereka yang berwenang, untuk mengkhotbahkan Injil dan melaksanakan tata caranya.
- n: 6
  text: Kami percaya pada organisasi yang sama yang ada di dalam Gereja Zaman Dahulu, yaitu, rasul, nabi,
    gembala, pengajar, pemberita Injil, dan sebagainya.
- n: 7
  text: Kami percaya pada karunia bahasa, nubuat, wahyu, penglihatan, penyembuhan, penafsiran bahasa,
    dan sebagainya.
- n: 8
  text: Kami percaya Alkitab adalah firman Allah sejauh diterjemahkan secara benar; kami juga percaya
    Kitab Mormon adalah firman Allah.
- n: 9
  text: Kami percaya segala yang telah Allah ungkapkan, segala yang sekarang Dia ungkapkan, dan kami percaya
    bahwa Dia masih akan mengungkapkan banyak hal yang besar dan penting berkaitan dengan Kerajaan Allah.
- n: 10
  text: Kami percaya pada pengumpulan harfiah Israel dan pada pemulihan Sepuluh Suku; bahwa Sion (Yerusalem
    Baru) akan dibangun di Benua Amerika; bahwa Kristus akan memerintah secara pribadi di atas bumi; dan,
    bahwa bumi akan diperbarui dan menerima kemuliaan firdausnya.
- n: 11
  text: Kami menuntut hak istimewa untuk menyembah Allah Yang Mahakuasa menurut suara hati nurani kami
    sendiri, dan memperkenankan semua orang hak istimewa yang sama, biarlah mereka menyembah bagaimana,
    di mana, atau apa yang mereka kehendaki.
- n: 12
  text: Kami percaya pada sikap tunduk kepada raja, presiden, penguasa, dan pejabat hukum, dalam mematuhi,
    menghormati, dan mendukung hukum.
- n: 13
  text: Kami percaya pada sikap jujur, benar, suci, baik hati, bajik, dan melakukan kebaikan kepada semua
    orang; sesungguhnya, kami boleh berkata bahwa kami mengikuti petuah Paulus—Kami percaya segala hal,
    kami mengharap segala hal, kami telah bertahan dalam banyak hal, dan berharap sanggup bertahan dalam
    segala hal. Jika ada apa pun yang bajik, indah, atau dikatakan baik atau layak dipuji, kami mengupayakan
    hal-hal ini.
signature: Joseph Smith.
