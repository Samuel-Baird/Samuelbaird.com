title: విశ్వాస ప్రమాణాలు
subtitle: యేసు క్రీస్తు యొక్క కడవరి దిన పరిశుద్ధుల సంఘము
author: ''
verses:
- n: 1
  text: నిత్యుడగు తండ్రియైన దేవుడిని, ఆయన కుమారుడైన యేసు క్రీస్తును, పరిశుద్ధాత్మను మేము నమ్ముచున్నాము.
- n: 2
  text: మనుష్యులు వారి స్వంత పాపముల కొరకు శిక్షింపబడుదురు, కానీ ఆదాము యొక్క అతిక్రమము కొరకు కాదని మేము
    నమ్ముచున్నాము.
- n: 3
  text: క్రీస్తు యొక్క ప్రాయశ్చిత్తము ద్వారా సువార్త నియమములకు, విధులకు విధేయత చూపుట వలన మనుష్యజాతి యావత్తు
    రక్షింపబడునని మేము నమ్ముచున్నాము.
- n: 4
  text: 'సువార్త యొక్క మొదటి నియమములు, విధులు: మొదటిది, యేసు క్రీస్తు నందు విశ్వాసము; రెండవది పశ్చాత్తాపము;
    మూడవది, పాపక్షమాపణ కొరకు ముంచుట ద్వారా బాప్తిస్మము; నాల్గవది, పరిశుద్ధాత్మ వరము కొరకు హస్తనిక్షేపణము
    అని మేము నమ్ముచున్నాము.'
- n: 5
  text: సువార్తను బోధించుటకు, దాని విధులను నిర్వహించుటకు ఒక మనుష్యుడు దేవుని వలన మరియు ప్రవచనముచేత మరియు
    అధికారములోనున్న వారి హస్తనిక్షేపణముచేత పిలువబడవలెనని మేము నమ్ముచున్నాము.
- n: 6
  text: అపొస్తలులు, ప్రవక్తలు, కాపరులు, ఉపదేశకులు, సువార్తికులు మొదలైనవారిగా పిలువబడి, ప్రాచీన సంఘములో
    ఉన్న ఆ వ్యవస్థనే మేము నమ్ముచున్నాము.
- n: 7
  text: భాషలు మాట్లాడు వరము, ప్రవచనము, బయల్పాటు, దర్శనములు, స్వస్థత, భాషల అనువాదము మొదలగు వాటిని మేము
    నమ్ముచున్నాము.
- n: 8
  text: తప్పులు లేకుండా అనువదించబడినంత వరకు బైబిలు దేవుని వాక్యమని మేము నమ్ముచున్నాము; మోర్మన్ గ్రంథము
    కూడా దేవుని వాక్యమని మేము నమ్ముచున్నాము.
- n: 9
  text: దేవుడు బయలుపరచిన సమస్తమును, ఇప్పుడు ఆయన బయలుపరచు సమస్తమును మేము నమ్ముచున్నాము, దేవుని రాజ్యమునకు
    సంబంధించిన గొప్ప మరియు ముఖ్యమైన సంగతులనేకము ఆయన ఇంకా బయలుపరచునని మేము నమ్ముచున్నాము.
- n: 10
  text: ఇశ్రాయేలీయులు వాస్తవముగా సమకూర్చబడుటను, పది గోత్రముల పునఃస్థాపనను; సీయోను (నూతన యెరూషలేము) అమెరికా
    ఖండములో నిర్మించబడునని; భూమి మీద క్రీస్తు స్వయముగా పరిపాలించునని; భూమి నూతనపరచబడి, పరదైసు మహిమను పొందునని
    మేము నమ్ముచున్నాము.
- n: 11
  text: మా మనస్సాక్షి నిర్దేశించిన ప్రకారం సర్వశక్తిమంతుడైన దేవుడిని ఆరాధించు విశేషాధికారమును కలిగియుండుటను
    మేము హక్కుగా కోరుచున్నాము మరియు సమస్త మానవులకు ఏవిధంగానైనా, ఎక్కడనైనా, దేనినైనా ఆరాధించే అట్టి విశేషాధికారాన్ని
    కలిగియుండే అవకాశమివ్వబడాలని కోరుచున్నాము.
- n: 12
  text: చట్టమును గైకొనుట, గౌరవించుట, సమర్థించుటలో రాజులకు, అధ్యక్షులకు, అధికారులకు, న్యాయాధిపతులకు లోబడియుండుటను
    మేము నమ్ముచున్నాము.
- n: 13
  text: నిజాయితీగా, యథార్థముగా, పవిత్రముగా, ఉదారముగానుండి, సుగుణముతో సర్వ మానవాళికి మేలు చేయుటను మేము
    నమ్ముచున్నాము; నిజానికి, పౌలు ఉపదేశమును మేము అనుసరించుచున్నామని చెప్పవచ్చును—మేము అన్నిటిని నమ్ముచున్నాము,
    అన్నిటిని నిరీక్షించుచున్నాము, అనేకమైన వాటిని సహించియున్నాము, సమస్తమును సహించగలమని ఆశించుచున్నాము.
    పవిత్రమైనది, రమ్యమైనది, ఖ్యాతిగలది లేదా పొగడదగినది ఏదైనా ఉన్నయెడల, వాటిని కూడా మేము వెదికెదము.
signature: జోసెఫ్ స్మిత్.
