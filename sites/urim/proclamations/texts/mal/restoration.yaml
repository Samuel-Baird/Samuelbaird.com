retrieved: '2026-11-02'
title: യേശുകൃസ്തുവിന്റെ പരിപൂർണ്ണമായ സുവിശേഷത്തിന്റെ പുനസ്ഥാപനം
subtitle: ലോകത്തിനുവേണ്ടി ഒരു ഇരുന്നൂറാമത്തെ പ്രഖ്യാപനം
author: അന്ത്യകാലത്തെ വിശുദ്ധന്മാരുടെ യേശുകൃസ്തുവിന്റെ സഭയുടെ ഒന്നാമത്തെ അദ്ധ്യക്ഷതയും പന്ത്രണ്ടു അപ്പൊസ്തലന്മാരുടെ
  കൌൺസിലും
note: ഏപ്രിൽ 5, 2020ൽ യൂട്ടായിലെ സാൾട്ട് ലേക്ക് സിറ്റിയിൽ നടന്ന 190-മത് വാർഷിക പൊതുസമ്മേളനത്തിൽ അവന്റെ
  സന്ദേശത്തിന്റെ ഭാഗമായി പ്രസിഡന്റ് റസ്സെൽ എം. നെൽസൺ ഈ പ്രഖ്യാപനം വായിച്ചു.
paragraphs:
- ലോകത്തിലെ എല്ലാ ദേശത്തിലെയും അവന്റെ മക്കളെ ദൈവം സ്നേഹിക്കുന്നുവെന്നു ഞങ്ങൾ ദൃഡമായി പ്രഖ്യാപിക്കുന്നു.
  ദൈവീകമായ ജനനവും, താരതമ്യപെടുത്താനാവാത്ത ജീവിതവും, അവന്റെ പ്രിയപ്പെട്ട പുത്രനായ യേശുകൃസ്തുവിന്റെ അനന്തമായ
  പാപപരിഹാരവും നമ്മുടെ പിതാവായ ദൈവം നമുക്കു നൽകിയിരിക്കുന്നു. പിതാവിന്റെ ശക്തിയാൽ യേശു വീണ്ടും ഉയർത്തെഴുന്നേൽക്കുകയും,
  മരണത്തിന്മേൽ വിജയം നേടുകയും ചെയ്തു. അവൻ നമ്മുടെ കർത്താവും, നമ്മുടെ മാതൃകയും, നമ്മുടെ രക്ഷകനും ആകുന്നു.
- ഇരുന്നൂറു വർഷങ്ങൾക്കു മുമ്പ് ഒരു മനോഹരമായ ശിശിരകാലത്തെ പ്രഭാതത്തിൽ 1820ൽ ബാലനായ ജോസഫ് സ്മിത്ത് ഏത് സഭയിൽ
  ചേരണമെന്ന് അറിയാൻ ശ്രമിക്കുമ്പോൾ, അവന്റെ വീടിന്റെ അടുത്ത് യുണൈറ്റഡ് സ്റ്റേറ്റ്സ് അമേരിക്കയിലെ നൂയോർക്കു
  വടക്കൻ ഭാഗത്തെ വനത്തിലേക്ക് പ്രാർത്ഥിക്കുവാൻ പോയി. അവന്റെ ആത്മാവിന്റെ രക്ഷണത്തിനു വേണ്ടിയുള്ള ചോദ്യങ്ങൾ
  അവനുണ്ടായിരുന്നു. ദൈവം അവനെ മാർഗ്ഗത്തിലേക്ക് നടത്തുവെന്നു അവൻ വിശ്വസിച്ചു.
- അവന്റെ പ്രാർത്ഥനയുടെ ഉത്തരമായി, പിതാവായ ദൈവവും, അവന്റെ പുത്രനായ യേശുകൃസ്തുവും, ജോസഫിനു പ്രത്യക്ഷരാവുകയും,
  ബൈബിളിൽ മുന്നറിയിപ്പായി പറഞ്ഞിട്ടുള്ള “എല്ലാ കാര്യങ്ങളുടെയും പുനസ്ഥാപനം ഉദ്ഘാടനം ചെയ്യുകയും” (പ്രവൃത്തികൾ
  3:21) ചെയ്തുവെന്നു ഞങ്ങൾ താഴ്മയോടെ പ്രഖ്യാപിക്കുന്നു. ആദ്യത്തെ അപ്പൊസ്ഥലന്മാരുടെ മരണത്തെ തുടർന്നു കൃസ്തുവിന്റെ
  പുതിയ നിയമത്തിലെ സഭ ഭൂമിയിൽനിന്നു ഇല്ലാതായെന്നു ഈ ദർശനത്തിൽ നിന്നു അവൻ മനസ്സിലാക്കി. അതിന്റെ തിരിച്ചെടുക്കലിനു
  ജോസഫ് പ്രധാന പങ്കുവഹിക്കും.
- പിതാവിന്റെയും പുത്രന്റെയും നിർദ്ദേശത്താൽ, സ്വർഗ്ഗീയ ദൂതന്മാർ വന്നു ജോസഫിനെ നിർദ്ദേശിക്കുകയും, യേശുകൃസ്തുവിന്റെ
  സഭ വീണ്ടും പുനസ്ഥാപിക്കുകയും ചെയ്തുവെന്നു ഞങ്ങൾ തീർച്ചയായും പറയുന്നു. ഉയർത്തെഴുന്നേറ്റ സ്നാപകനായ യോഹന്നാൻ
  പാപപരിഹാരത്തിനു വേണ്ടി വെള്ളത്തിൽ മുങ്ങി ജ്ഞാനസ്നാനം ചെയ്യിക്കുവാനുള്ള അധികാരം പുനസ്ഥാപിച്ചു. ആദ്യകാലത്തെ
  അപ്പൊസ്തലന്മാരിൽ മൂന്നു പേർ — പത്രൊസ്, യാക്കോബ്, യോഹന്നാൻ, അപ്പൊസ്തലത്വവും, പൌരോഹിത്യത്തിന്റെ അധികാരത്തിന്റെ
  താക്കോലുകളും പുനസ്ഥാപിച്ചു. ഏലിയാ ഉൾപ്പടെ വേറെ ചിലരും വന്നു. മരണത്തിനപ്പുറം കുടുംബങ്ങളെ ഒന്നിച്ചു ചേർക്കുവാനുള്ള
  അധികാരം ഏലിയാവു പുനസ്ഥാപിച്ചു.
- ഒരു പുരാതന റെക്കോർഡ് മോർമൊൺ ഗ്രന്ഥം — യേശുകൃസ്തുവിന്റെ ഇനിയൊരു സാക്ഷ്യം — തർജ്ജമ ചെയ്യാനുള്ള വരവും,
  ദൈവത്തിൽ നിന്നുള്ള അധികാരവും ജോസഫ് സ്മിത്തിനു നൽകിയിരിക്കുന്നു എന്നു ഞങ്ങൾ വീണ്ടും സാക്ഷ്യം പറയുന്നു.
  പടിഞ്ഞാറൻ അർദ്ധഗോളത്തിലെ ജനങ്ങൾക്കിടയിൽ അവന്റെ പുനരുദ്ധാനത്തിനു ശേഷം ഉടൻ യേശുകൃസ്തുവിന്റെ വ്യക്തിപരമായ
  ശുശ്രൂഷയുടെ ഒരു വിവരണം ഈ വിശുദ്ധ ഗ്രന്ഥത്തിന്റെ താളുകളിൽ ഉൾപ്പെടുന്നു. അത് ജീവിതത്തിന്റെ ഉദ്ദേശം പഠിപ്പിക്കുകയും,
  ആ ഉദ്ദേശത്തിന്റെ കേന്ദ്രമായ കൃസ്തുവിന്റെ ഉപദേശങ്ങളെ വിശദീകരിക്കുകയും ചെയ്യുന്നു. എല്ലാ മനുഷ്യരും സ്വർഗ്ഗത്തിലെ
  സ്നേഹവാനായ പിതാവിന്റെ പുത്രന്മാരും പുത്രിമാരും ആണെന്നും, നമ്മുടെ ജീവിതത്തെ കുറിച്ച് അവനൊരു ദൈവീകമായ
  പദ്ധതി ഉണ്ടെന്നും, അവന്റെ പുത്രനായ യേശുകൃസ്തു പഴയകാലത്തെ പോലെ ഇന്നും സംസാരിക്കുന്നുവെന്നും ബൈബിളിന്റെ
  ഒരു സഹചരഗ്രന്ഥം എന്ന നിലയിൽ, മോർമൊൺ ഗ്രന്ഥം സാക്ഷ്യപ്പെടുത്തുന്നു.
- ഏപ്രിൽ 6, 1830ൽ സംഘടിപ്പിച്ച അന്ത്യകാലത്തെ വിശുദ്ധന്മാരുടെ യേശുകൃസ്തുവിന്റെ സഭ, കൃസ്തുവിന്റെ പുനസ്ഥാപിക്കപ്പെട്ട
  സഭയാണെന്നു ഞങ്ങൾ പ്രസ്താവിക്കുന്നു. ഈ സഭ അതിന്റെ പ്രധാന മൂലകല്ലായ യേശുകൃസ്തുവിന്റെ പരിപൂർണ്ണമായ ജീവിതത്തിലും,
  അവന്റെ അനന്തമായ പാപപരിഹാരത്തിലും, യഥാർത്ഥത്തിലുളള ഉയിർത്തെഴുന്നേൽപ്പിലും നങ്കൂരമിട്ടിരിക്കുന്നു. യേശുകൃസ്തു
  ഒരിക്കൽ കൂടി അപ്പൊസ്തലന്മാരെ വിളിക്കുകയും, അവർക്കു പൌരോഹിത്യ അധികാരം നൽകുകയും ചെയ്തു. പരിശുദ്ധാത്മാവിനെ
  സ്വീകരിക്കുവാനും, രക്ഷയുടെ നിയമങ്ങളെ സ്വീകരിക്കുവാനും, ശാശ്വതമായ സന്തോഷം നേടുവാനും, അവന്റെയും അവന്റെ
  സഭയുടെയും അടുക്കൽ വരുവാൻ അവൻ നമ്മെ എല്ലാവരെയും ക്ഷണിക്കുന്നു.
- പിതാവായ ദൈവവും, അവന്റെ പ്രിയപ്പെട്ട പുത്രൻ യേശുകൃസ്തുവും ചേർന്ന് ഈ പുനസ്ഥാപനം ആരംഭിച്ചിട്ട് ഇരുന്നൂറ്
  വർഷങ്ങൾ കഴിഞ്ഞിരിക്കുന്നു. ലോകമെമ്പാടുമുള്ള ദശലക്ഷക്കണക്കിന് ആളുകൾ ഈ പ്രവചിക്കപ്പെട്ട സംഭവങ്ങളെ കുറിച്ചുള്ള
  അറിവ് സ്വീകരിച്ചു.
- വാഗ്ദാനം ചെയ്യപ്പെട്ട പുനസ്ഥാപനം തുടർച്ചയായ വെളിപാടിലൂടെ മുന്നോട്ട് പോകുന്നുവെന്ന് ഞങ്ങൾ സന്തോഷത്തോടെ
  പ്രഖ്യാപിക്കുന്നു. ഭൂമി ഇനി ഒരിക്കലും പഴയത് പോലെ ആയിരിക്കുകയില്ല, ദൈവം “എല്ലാം ക്രിസ്തുവിൽ ഒന്നായിച്ചേർക്കും”
  (എഫെസ്യർ 1:10).
- ഞങ്ങൾ അവന്റെ അപ്പൊസ്തലന്മാർ എന്ന നിലയിൽ, സ്വർഗ്ഗം തുറന്നിരിക്കുന്നുവെന്ന് അറിയുവാൻ — ഞങ്ങൾക്കു അറിയാവുന്നതു
  പോലെ — ബഹുമാനത്തോടും, നന്ദിയോടും കൂടി ഞങ്ങൾ എല്ലാവരെയും ക്ഷണിക്കുന്നു. ദൈവം തന്റെ പ്രിയപ്പെട്ട പുത്രന്മാർക്കും,
  പുത്രിമാർക്കും വേണ്ടി തന്റെ ഇഷ്ടം അറിയിക്കുകയാണെന്ന് ഞങ്ങൾ ഉറപ്പിച്ചു പറയുന്നു. പുനസ്ഥാപനത്തിന്റെ സന്ദേശം
  പ്രാർത്ഥനാപൂർവ്വം പഠിക്കുകയും, വിശ്വാസത്തിൽ പ്രവൃത്തിക്കുകയും ചെയ്യുന്നവർ, അതിന്റെ ദൈവീകതയെയും, അതിന്റെ
  ഉദ്ദേശ്യത്തെയും കുറിച്ച്, അവരുടെ സ്വന്തമായി സാക്ഷ്യം നേടുന്നതിലൂടെ, നമ്മുടെ കർത്താവും രക്ഷകനുമായ യേശുക്രിസ്തുവിന്റെ
  വാഗ്ദാനം ചെയ്യപ്പെട്ട രണ്ടാം വരവിനായി ലോകത്തെ ഒരുക്കുന്നതിലൂടെ അവർ അനുഗ്രഹിക്കപ്പെടുമെന്ന് ഞങ്ങൾ സാക്ഷ്യം
  വഹിക്കുന്നു.
