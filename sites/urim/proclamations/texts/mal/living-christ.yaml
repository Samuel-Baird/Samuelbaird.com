title: ജീവിക്കുന്ന ക്രിസ്തു
subtitle: അപ്പൊസ്തലന്മാരുടെ സാക്ഷ്യം
author: അന്ത്യകാലത്തെ വിശുദ്ധന്മാരുടെ യേശുക്രിസ്തുവിന്റെ സഭ
paragraphs:
- നമ്മൾ രണ്ടായിരം വർഷങ്ങൾക്കു മുൻപ് യേശുക്രിസ്തുവിന്റെ ജനനത്തെ അനുസ്മരിക്കുന്നതു പോലെ, അവന്റെ അദ്വിതീയമായ
  ജീവിതത്തിന്റെ യാഥാർത്ഥ്യത്തെ കുറിച്ചും, അവന്റെ പ്രായശ്ചിത്തത്തിന്റെ അനന്തമായ ശക്തിയെ കുറിച്ചും ഞങ്ങൾ
  സാക്ഷ്യം വഹിക്കുന്നു. ഭൂമിയിൽ ജീവിക്കുകയും, ഇനിയും ജീവിക്കുവാൻ പോകുന്ന ആരുടെയും മേൽ ഇത്രയും വലിയ അഗാധമായ
  സ്വാധീനം വേറെ ആർക്കും ഉണ്ടായിട്ടില്ല.
- അവൻ പഴയ നിയമത്തിലെ യഹോവ ആയിരുന്നു, പുതിയ നിയമത്തിലെ മിശിഹയാകുന്നു. അവന്റെ പിതാവിന്റെ നിർദേശപ്രകാരം അവൻ
  ഭൂമിയുടെ സൃഷ്ടികർത്താവായിരുന്നു. “സകലതും അവൻ മുഖാന്തിരം ഉളവായി; ഉളവായതൊന്നും അവനെ കൂടാതെ ഉളവായതല്ല”
  (യോഹന്നാൻ 1:3). പാപരഹിതനായിരുന്നുവെങ്കിലും, സകലനീതിയും നിവർത്തിക്കുവാനായി അവൻ ജ്ഞാനസ്നാനം ഏറ്റു. “അവൻ
  നന്മ ചെയ്തു” (പ്രവൃത്തികൾ 10:38), എന്നിട്ടും ആ കാരണത്താൽ തിരസ്ക്കരിക്കപ്പെട്ടു. അവന്റെ സുവിശേഷം ശാന്തിയുടെയും,
  സൌമനസ്യതയുടെയും സന്ദേശമായിരുന്നു. അവൻ എല്ലാവരെയും അവന്റെ മാതൃുക പിൻതുടരുവാനായി പ്രോത്സാഹിപ്പിച്ചു. അവൻ
  പാലസ്തീനയുടെ വീഥികളിൽ നടന്നു കൊണ്ടു രോഗികളെ സൌഖ്യമാക്കുകയും, കുരുടന്മാർക്കു കാഴ്ച നൽകുകയും, മരിച്ചവരെ
  ഉയർപ്പിക്കുകയും ചെയ്തു. നിത്യതയുടെ സത്യങ്ങളും, നമ്മുടെ മർത്യതയ്ക്കു മുൻപുള്ള ജീവിതത്തിന്റെ യഥാർത്ഥ്യവും,
  ഭൂമിയിലെ നമ്മുടെ ജീവിതത്തിന്റെ ഉദ്ദേശവും, വരാനിരിക്കുന്ന ജീവിതത്തിൽ ദൈവത്തിന്റെ പുത്രന്മാരും പുത്രിമാരും
  ആകുവാനുള്ള കഴിവുകളെയും അവൻ പഠിപ്പിച്ചു.
- അവന്റെ പ്രായശ്ചിത്തത്തിന്റെ ത്യാഗത്തിന്റെ ഓർമ്മപ്പെടുത്തലായി അവൻ കർത്താവിൻറെ അത്താഴം ആരംഭിച്ചു. അവൻ
  അറസ്റ്റു ചെയ്യപ്പെട്ടു, ഒരു ജനസമൂഹത്തെ സന്തുഷ്ടവാന്മാരാക്കുവാൻ വ്യാജമായ ചാർജുകൾക്കു അപരാധിയായി മാറ്റപ്പെട്ടു,
  കൽവരിയുടെ ക്രൂസിൽ മരിക്കുവാനായി വിധിക്കപ്പെട്ടു. സകല മനുഷ്യരാശികളുടെ പാപങ്ങൾക്കു പ്രായശ്ചിത്തമായി അവൻ
  തന്റെ ജീവൻ അർപ്പിച്ചു. അവന്റെതു ഭൂമിയിൽ എപ്പോഴും ജീവിക്കുന്ന എല്ലാവരുടെയും ബഹുമാനാർത്ഥമായ ഒരു വലിയ ശ്രേഷ്ടമായ
  ദാനമായിരുന്നു.
- സകല മനുഷ്യ ചരിത്രത്തിനും കേന്ദ്രീയമാകുന്ന അവന്റെ ജീവിതം ബേത്ലേഹെമിൽ ആരംഭിച്ചിട്ടില്ലെന്നും കൽവരിയിൽ
  അവസാനിച്ചിട്ടുമില്ലെന്നും ഞങ്ങൾ സത്യനിഷ്ടതയോടെ സാക്ഷ്യം പറയുന്നു. അവൻ പിതാവിന്റെ ആദ്യജാതനായിരുന്നു,
  ജഡപ്രകാരമുള്ള ഏകജാതനും, ലോകത്തിന്റെ വീണ്ടെടുപ്പുകാരനും ആകുന്നു.
- അവൻ കല്ലറയിൽ നിന്നു ഉയിർത്തെഴുന്നേറ്റതു “നിദ്രകൊണ്ടവരിൽ ആദ്യഫലം” ആകുവാനായിരുന്നു (1 കൊരിന്തി 15:20).
  ഉയിർത്തെഴുന്നേറ്റ കർത്താവായി അവന്റെ ജീവിതത്തിൽ അവൻ സ്നേഹിച്ചവരുടെ ഇടയിൽ ആദ്യം സന്ദർശിച്ചു. പുരാതന അമേരിക്കയിൽ
  അവന്റെ “വേറെ ആടുകളുടെ” (യോഹന്നാൻ 10:16) ഇടയിൽ കൂടി അവൻ ശുശ്രൂഷ ചെയ്തു. ദീർഘകാലമായി വാഗ്ദാനം ചെയ്യപ്പെട്ടിരുന്ന
  “കാലസമ്പൂർണ്ണതയിലെ വ്യവസ്ഥയിൽ” (എഫെസ്യർ 1:10) പ്രവേശിക്കുവാനായി ആധുനിക ലോകത്തിൽ അവനും അവന്റെ പിതാവും
  ബാലനായ ജോസഫ് സ്മിത്തിനു പ്രത്യക്ഷപ്പെട്ടു.
- 'ജീവിച്ചിരിക്കുന്ന ക്രിസ്തുവിനെ കുറിച്ച് പ്രവാചകൻ ജോസഫ് സ്മിത്ത് എഴുതി: “അവന്റെ കണ്ണുകൾ അഗ്നിജ്വാല പോലെയും,
  അവന്റെ തല മുടികൾ ശുദ്ധമായ മഞ്ഞുപോലെ വെളുത്തതും, അവന്റെ മുഖഭാവം സൂര്യന്റെ പ്രകാശത്തെക്കാൾ കൂടുതൽ തിളങ്ങുന്നതും
  ആയിരുന്നു. അവന്റെ സ്വരം പെരുവെള്ളത്തിന്റെ ഇരെച്ചൽ പോലെയും ആയിരുന്നു. യഹോവയുടെ സ്വരം പറഞ്ഞു:'
- “ഞാൻ ആദ്യനും അന്ത്യനും ആകുന്നു; ഞാൻ ജീവിക്കുന്നവനാണു, ഞാൻ കൊല്ലപ്പെട്ടവനായിരുന്നു; ഞാൻ പിതാവിന്റെ അടുക്കൽ
  നിങ്ങളുടെ വക്കീലാകുന്നു” (ഉപദേശങ്ങളും നിയമങ്ങളും 110:3–4).
- 'അവനെ കുറിച്ചു പ്രവാചകൻ കൂടി ഇങ്ങനെ പ്രഖ്യാപിച്ചു: “ഇപ്പോൾ അവനെ കുറിച്ചു നൽകിയിരിക്കുന്ന അനേകം സാക്ഷ്യങ്ങളിൽ
  അവസാനമായി ഞങ്ങൾ അവനെകുറിച്ചു നൽകുന്ന സാക്ഷ്യം ഇതാകുന്നു: അവൻ ജീവിക്കുന്നു!'
- “ഞങ്ങൾ അവനെ ദൈവത്തിന്റെ വലത്തു ഭാഗത്തിൽ കണ്ടു; അവൻ പിതാവിന്റെ ഏകജാതനാണെന്നുള്ള രേഖ വഹിക്കുന്ന സ്വരം
  ഞങ്ങൾ കേട്ടു —
- “അവനാൽ, അവനിൽ കൂടി, അവൻതന്നെ, ഈ ലോകങ്ങളെല്ലാം സൃഷ്ടിച്ചു, സൃഷ്ടിക്കപ്പെട്ടിരിക്കുന്നു, അതിലുള്ള എല്ലാ
  നിവാസികളും ദൈവത്തിന്റെ പ്രിയപ്പെട്ട പുത്രന്മാരും, പുത്രിമാരും ആണെന്നുമുള്ള സ്വരം ഞങ്ങൾ കേട്ടു” (ഉപദേശങ്ങളും
  നിയമങ്ങളും 76:22–24).
- യേശുക്രിസ്തു തന്നെ പ്രധാന “മൂലക്കല്ലായിരിക്കെ അപ്പൊസ്തലന്മാരും പ്രവാചകന്മാരും എന്ന അടിസ്ഥാനത്തിൽ” നിർമ്മിക്കപ്പെട്ടിരിക്കുന്ന
  (എഫെസ്യർ 2:20) അവന്റെ പൌരോഹിത്യവും അവന്റെ സഭയും ഭൂമിയിൽ പുനഃസ്ഥാപിക്കപ്പെട്ടിരിക്കുന്നുവെന്നു ഞങ്ങൾ
  സഗൌരവത്തോടെ പ്രഖ്യാപിക്കുന്നു.
- അവൻ ഒരു ദിവസം ഭൂമിയിലേയ്ക്കു തിരിച്ചുവരുമെന്നു ഞങ്ങൾ സാക്ഷ്യം പറയുന്നു. “യഹോവയുടെ മഹത്വം വെളിപ്പെടും,
  സകലജഡവും ഒരുപോലെ അതിനെ കാണും” (യെശയ്യാ 40:5). അവൻ രാജാക്കന്മാരുടെ രാജാവായി വാഴുകയും, പ്രഭുക്കന്മാരുടെ
  പ്രഭുവായി ഭരണം നടത്തുകയും ചെയ്യും. അവന്റെ മുൻപിൽ സകല മുഴങ്കാലും മടങ്ങുകയും എല്ലാ നാവും അവനെ സ്തുതിക്കുകയും
  ചെയ്യും. നമ്മുടെ പ്രവൃത്തികളുടെയും, നമ്മുടെ ഹ്രദയത്തിലെ മോഹങ്ങളുടെയും പ്രകാരം നമ്മൾ ഓരോരുത്തരും ന്യായവിധിക്കു
  വേണ്ടി അവന്റെ മുൻപിൽ നിൽക്കും.
- ദൈവത്തിന്റെ അനശ്വരനായ പുത്രനായ യേശു ജീവിക്കുന്ന ക്രിസ്തു ആകുന്നു എന്നു അവന്റെ മുറപ്രകാരം നിയമിക്കപ്പെട്ട
  അപ്പൊസ്തലന്മാരായ ഞങ്ങൾ സാക്ഷ്യം വഹിക്കുന്നു. അവൻ ഇന്നു അവന്റെ പിതാവിന്റെ വലത്തു ഭാഗത്തു നിൽക്കുന്ന മഹാനായ
  രാജാവു ഇമ്മാന്യുവേൽ ആകുന്നു. ലോകത്തിന്റെ വെളിച്ചവും, ജീവനും, പ്രത്യാശയും അവൻ ആകുന്നു. ഈ ജീവിതത്തിന്റെയും,
  വരുവാനുള്ള ലോകത്തിൽ നിത്യജീവന്റെയും സന്തോഷത്തിലേയ്കു അവന്റെ മാർഗ്ഗം വഴികാണിക്കുന്നു. അവന്റെ ദൈവീകപുത്രന്റെ
  അദ്വതീയ ദാനത്തിനു വേണ്ടി ദൈവത്തിനു നന്ദി പറയട്ടെ.
date: ജനുവരി 1, 2000
