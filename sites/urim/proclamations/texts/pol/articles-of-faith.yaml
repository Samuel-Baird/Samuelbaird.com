title: Artykuły wiary
subtitle: Kościoła Jezusa Chrystusa Świętych w Dniach Ostatnich
author: ''
verses:
- n: 1
  text: 1. Wierzymy w Boga, Wiecznego Ojca, i w Jego Syna, Jezusa Chrystusa, i w Ducha Świętego.
- n: 2
  text: 2. Wierzymy, że ludzie zostaną ukarani za swe własne grzechy, a nie za wykroczenie Adama.
- n: 3
  text: 3. Wierzymy, że dzięki Zadośćuczynieniu Chrystusa cała ludzkość może dostąpić zbawienia poprzez
    posłuszeństwo prawom i obrzędom ewangelii.
- n: 4
  text: '4. Wierzymy, że podstawowymi zasadami i obrzędami ewangelii są: po pierwsze, wiara w Pana Jezusa
    Chrystusa; po drugie, pokuta; po trzecie, chrzest przez zanurzenie dla odpuszczenia grzechów; po czwarte,
    nałożenie rąk dla otrzymania daru Ducha Świętego.'
- n: 5
  text: 5. Wierzymy, że człowiek musi być powołany przez Boga, przez proroctwo i nałożenie rąk przez tych,
    którzy mają upoważnienie, aby głosić ewangelię i udzielać jej obrzędów.
- n: 6
  text: 6. Wierzymy w tę samą organizację, jaka istniała w pierwotnym Kościele, tj. apostołów, proroków,
    pasterzy, nauczycieli, ewangelistów i tak dalej.
- n: 7
  text: 7. Wierzymy w dar języków, proroctwa, objawienia, wizji, uzdrawiania, tłumaczenia języków i tak
    dalej.
- n: 8
  text: 8. Wierzymy, że Biblia jest słowem Bożym, o ile jest poprawnie przetłumaczona. Wierzymy także,
    że Księga Mormona jest słowem Bożym.
- n: 9
  text: 9. Wierzymy we wszystko, co Bóg objawił, we wszystko, co teraz objawia, i wierzymy, że objawi
    On jeszcze wiele wielkich i istotnych rzeczy w odniesieniu do Królestwa Bożego.
- n: 10
  text: 10. Wierzymy, że nastąpi dosłowne zgromadzenie Izraela i przywrócenie Dziesięciu Plemion. Wierzymy,
    że Syjon (Nowa Jerozolima) zostanie zbudowany na kontynencie amerykańskim, że Chrystus będzie osobiście
    królował na ziemi; i że ziemia zostanie odnowiona i otrzyma swą rajską chwałę.
- n: 11
  text: 11. Domagamy się przywileju oddawania czci Wszechmocnemu Bogu zgodnie z tym, co nam dyktuje nasze
    sumienie i przyznajemy ten sam przywilej wszystkim ludziom; niech oddają cześć jakkolwiek, gdziekolwiek
    i czemukolwiek pragną.
- n: 12
  text: 12. Wierzymy w podporządkowanie się królom, prezydentom, włodarzom i sędziom; w przestrzeganie,
    poszanowanie i poparcie dla prawa.
- n: 13
  text: '13. Wierzymy w bycie uczciwym, wiernym, cnotliwym, uczynnym, szlachetnym i dobroczynnym wobec
    wszystkich ludzi; w istocie możemy powiedzieć, że kierujemy się upomnieniem Pawła: Wierzymy we wszystko,
    we wszystkim mamy nadzieję, wytrwaliśmy wiele i mamy nadzieję wytrwać we wszystkim. Jeśli coś jest
    cnotą, zaletą, uznane za dobre czy godne pochwały, dążymy do tego.'
signature: Józef Smith.
