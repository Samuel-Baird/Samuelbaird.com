title: Przywrócenie pełni ewangelii Jezusa Chrystusa
subtitle: Proklamacja dla świata z okazji dwusetlecia
author: Pierwsze Prezydium i Rada Dwunastu Apostołów Kościoła Jezusa Chrystusa Świętych w Dniach Ostatnich
note: Niniejsza proklamacja została przeczytana przez Prezydenta Russella M. Nelsona jako część jego przesłania
  podczas 190. Wiosennej Konferencji Generalnej, 5 kwietnia 2020 roku w Salt Lake City w stanie Utah.
paragraphs:
- Uroczyście ogłaszamy, że Bóg kocha Swoje dzieci w każdym narodzie świata. Bóg Ojciec dał nam boskie
  narodzenie Swego Umiłowanego Syna, Jezusa Chrystusa, Jego niezrównane życie i nieskończoną ofiarę Zadośćuczynienia.
  Dzięki mocy Ojca Jezus powstał z martwych i odniósł zwycięstwo nad śmiercią. Jest naszym Zbawicielem,
  naszym Wzorem i naszym Odkupicielem.
- Dwieście lat temu, w piękny wiosenny poranek 1820 roku, młody Józef Smith, chcąc dowiedzieć się, do
  którego kościoła powinien przystąpić, udał się do lasu w pobliżu swojego domu, w północnej części stanu
  Nowy Jork w Stanach Zjednoczonych, aby tam się pomodlić. Miał pytania dotyczące zbawienia swojej duszy
  i ufał, że Bóg nim pokieruje.
- Pokornie oświadczamy, że w odpowiedzi na jego modlitwę Bóg Ojciec i Jego Syn, Jezus Chrystus, ukazali
  się mu i zapoczątkowali „[odnowienie] wszechrzeczy” (Dzieje Apostolskie 3:21), jak przepowiedziano to
  w Biblii. Podczas tej wizji Józef dowiedział się, że po śmierci pierwszych Apostołów znany z Nowego
  Testamentu Kościół Chrystusa zniknął z powierzchni ziemi. Józef miał być narzędziem w jego powrocie.
- Potwierdzamy, że pod kierownictwem Ojca i Syna przybyli niebiańscy posłańcy, aby pouczyć Józefa i ponownie
  ustanowić Kościół Jezusa Chrystusa. Zmartwychwstały Jan Chrzciciel przywrócił upoważnienie do dokonywania
  chrztu przez zanurzenie dla odpuszczenia grzechów. Trzej z pierwszych dwunastu Apostołów — Piotr, Jakub
  i Jan — przywrócili apostolstwo i klucze upoważnienia kapłańskiego. Przybyli także inni, w tym Eliasz,
  który przywrócił upoważnienie do łączenia rodzin na zawsze w wiecznych relacjach, które wykraczają poza
  śmierć.
- Jesteśmy ponadto świadkami, że Józef Smith otrzymał dar i moc Boga, aby przetłumaczyć pradawny zapis
  — Księgę Mormona. Kolejne świadectwo o Jezusie Chrystusie. Strony tego świętego tekstu obejmują opis
  osobistej posługi Jezusa Chrystusa pośród ludzi żyjących na półkuli zachodniej, wkrótce po Jego Zmartwychwstaniu.
  Księga ta uczy o celu życia i wyjaśnia doktrynę Chrystusa, która jest centralną częścią tego celu. Jako
  towarzyszące Biblii pismo święte, Księga Mormona świadczy o tym, że wszystkie istoty ludzkie są synami
  i córkami kochającego Ojca w Niebie, że ma On Boski plan dotyczący naszego życia i że Jego Syn, Jezus
  Chrystus, przemawia również dziś, tak jak za dawnych dni.
- Oświadczamy, że Kościół Jezusa Chrystusa Świętych w Dniach Ostatnich, zorganizowany 6 kwietnia 1830
  roku, jest przywróconym Kościołem Chrystusa, znanym z Nowego Testamentu. Kościół ten jest zakotwiczony
  w doskonałym życiu swojego głównego kamienia węgielnego, Jezusa Chrystusa, oraz w Jego nieskończonym
  Zadośćuczynieniu i dosłownym Zmartwychwstaniu. Jezus Chrystus po raz kolejny powołał Apostołów i przekazał
  im upoważnienie kapłańskie. Zaprasza nas wszystkich, abyśmy przyszli do Niego i Jego Kościoła, przyjęli
  Ducha Świętego i obrzędy zbawienia oraz uzyskali trwałą radość.
- Upłynęło dwieście lat, odkąd to Przywrócenie zostało zainicjowane przez Boga Ojca i Jego Umiłowanego
  Syna, Jezusa Chrystusa. Miliony ludzi na całym świecie przyjęły wiedzę o tych prorokowanych wydarzeniach.
- Z radością oświadczamy, że obiecane Przywrócenie rozwija się poprzez ciągłe objawienie. Ziemia już nigdy
  nie będzie taka sama, ponieważ Bóg „w Chrystusie [zgromadzi] w jedną całość wszystko” (List do Efezjan
  1:10).
- Z czcią i wdzięcznością my, jako Jego Apostołowie, zapraszamy wszystkich, aby dowiedzieli się — tak
  jak my to wiemy — że niebiosa są otwarte. Potwierdzamy, że Bóg objawia Swoją wolę Swoim umiłowanym synom
  i córkom. Świadczymy, że ci, którzy z modlitwą studiują przesłanie Przywrócenia i działają z wiarą,
  zostaną pobłogosławieni uzyskaniem własnego świadectwa o jego boskości i celu, jakim jest przygotowanie
  świata na obiecane Drugie Przyjście naszego Pana i Zbawiciela, Jezusa Chrystusa.
