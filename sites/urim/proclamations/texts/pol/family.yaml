title: Rodzina
subtitle: Proklamacja dla świata
author: Pierwsze Prezydium i Rada Dwunastu Apostołów Kościoła Jezusa Chrystusa Świętych w Dniach Ostatnich
note: Niniejsza proklamacja została przeczytana przez Prezydenta Gordona B. Hinckleya jako część jego
  przesłania podczas Generalnego Spotkania Stowarzyszenia Pomocy, 23 września 1995 roku w Salt Lake City
  w stanie Utah.
paragraphs:
- My, Pierwsze Prezydium i Rada Dwunastu Apostołów Kościoła Jezusa Chrystusa Świętych w Dniach Ostatnich,
  uroczyście ogłaszamy, że małżeństwo między mężczyzną a kobietą jest ustanowione przez Boga i że rodzina
  zajmuje centralne miejsce w planie Stworzyciela dotyczącym wiecznego przeznaczenia Jego dzieci.
- Wszystkie istoty ludzkie — mężczyźni i kobiety — są stworzone na obraz Boga. Każdy jest umiłowanym duchowym
  synem lub córką niebiańskich rodziców, i dlatego każdy posiada boską naturę i przeznaczenie. Płeć stanowi
  zasadniczą cechę indywidualnej przedziemskiej, doczesnej i wiecznej tożsamości i celu istnienia.
- W przedziemskiej sferze duchowi synowie i duchowe córki znali i czcili Boga jako swojego Wiecznego Ojca
  i przyjęli Jego plan, dzięki któremu Jego dzieci mogą otrzymać fizyczne ciało i zdobyć doświadczenia
  podczas życia na ziemi, aby czynić postępy ku doskonałości i ostatecznie osiągnąć swoje boskie przeznaczenie
  jako dziedzice życia wiecznego. Boski plan szczęścia umożliwia, aby relacje rodzinne trwały nadal po
  śmierci. Święte obrzędy i przymierza dostępne w świętych świątyniach umożliwiają indywidualnym osobom
  powrót do obecności Boga, a rodzinom zjednoczenie na wieczność.
- Pierwsze przykazanie, jakie Bóg dał Adamowi i Ewie, nawiązywało do ich rodzicielskiego potencjału jako
  męża i żony. Oświadczamy, że przykazanie Boga dla Jego dzieci, aby się rozmnażały i zapełniały ziemię,
  pozostaje w mocy. Oświadczamy także, iż Bóg nakazał, aby święta moc prokreacji była wykorzystywana tylko
  pomiędzy mężczyzną a kobietą, prawnie zaślubionymi jako mąż i żona.
- Oświadczamy, że sposób, w jaki powstaje życie na ziemi, jest wyznaczony przez Boga. Potwierdzamy świętość
  życia i jego ważność w wiecznym planie Boga.
- Mąż i żona mają solenny obowiązek, aby kochać i dbać o siebie nawzajem oraz o swoje dzieci. „Oto dzieci
  są darem Pana” (Ks. Psalmów 127:3). Rodzice mają świętą powinność wychowywania swoich dzieci w miłości
  i prawości, zaspokajania ich potrzeb fizycznych i duchowych, nauczania ich miłości i służby wzajemnej,
  zachowywania przykazań Boga i bycia przestrzegającymi prawa obywatelami, niezależnie od tego, gdzie
  mieszkają. Mężowie i żony — matki i ojcowie — zostaną pociągnięci do odpowiedzialności przed Bogiem
  za wypełnianie tych zobowiązań.
- Rodzina jest ustanowiona przez Boga. Małżeństwo pomiędzy mężczyzną a kobietą stanowi zasadniczą część
  Jego wiecznego planu. Dzieci mają prawo do tego, aby przyjść na świat w prawnie zaślubionym związku
  i być wychowywane przez ojca i matkę, którzy szanują przysięgę małżeńską i są jej całkowicie wierni.
  Szczęście w życiu rodzinnym może być najpewniej osiągnięte, kiedy opiera się na naukach Pana Jezusa
  Chrystusa. Udane małżeństwa i rodziny powstają i trwają w oparciu o zasady wiary, modlitwy, pokuty,
  przebaczenia, szacunku, miłości, współczucia, pracy i zdrowej rekreacji. Według boskiego zamysłu ojcowie
  mają przewodniczyć swoim rodzinom w miłości i prawości, i są odpowiedzialni za zapewnienie swoim rodzinom
  niezbędnych środków do życia i ochrony. Głównym obowiązkiem matek jest dbałość o rozwój dzieci. W tych
  świętych obowiązkach ojcowie i matki są zobowiązani pomagać sobie wzajemnie jako równi partnerzy. Niepełnosprawność,
  śmierć lub inne okoliczności mogą wymagać przystosowania do konkretnej sytuacji. W razie potrzeby powinna
  służyć pomocą dalsza rodzina.
- Ostrzegamy, że osoby, które łamią przymierze czystości moralnej, które stosują przemoc wobec współmałżonka
  albo potomstwa, lub które nie wypełniają swoich obowiązków rodzinnych, pewnego dnia zostaną za to pociągnięte
  do odpowiedzialności przed Bogiem. Ostrzegamy ponadto, że dezintegracja rodziny sprowadzi na poszczególne
  osoby, społeczeństwa i narody nieszczęścia przepowiedziane przez pradawnych i współczesnych proroków.
- Wzywamy odpowiedzialnych obywateli i członków rządów na całym świecie, aby promowali takie zasady, które
  mają na celu zachowanie i wzmacnianie rodziny jako podstawowej jednostki społeczeństwa.
