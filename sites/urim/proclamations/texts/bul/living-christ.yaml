title: Живият Христос
subtitle: Свидетелството на Апостолите
author: Църквата на Исус Христос на светиите от последните дни
paragraphs:
- Докато отбелязваме раждането на Исус Христос преди две хилядолетия, ние даваме своето свидетелство за
  реалността на Неговия несравним живот и безкрайната добродетел на Неговата велика единителна жертва.
  Никой друг не е оказвал толкова дълбоко влияние върху всички хора, които някога са живели или които
  тепърва ще живеят на тази земя.
- Той беше Великият Йехова на Стария завет, Месията на Новия завет. Под ръководството на Своя Отец, Той
  бе Създателят на земята. „Всичко това стана чрез Него; и без Него не е станало нищо от това, което е
  станало“ (Йоан 1:3). Въпреки че беше безгрешен, Той бе кръстен, за да изпълни всичко, що е право. Той
  „обикаляше да прави благодеяния“ (Деянията на апостолите 10:38), а беше презиран за това. Неговото Евангелие
  беше послание за мир и добра воля. Той настоятелно молеше всички да следват Неговия пример. Той вървя
  по пътищата на Палестина, като изцеляваше болните, правеше слепите да прогледнат и вдигаше мъртвите.
  Той учеше за истините на вечността, за реалността на нашето доземно съществуване, за целта на нашия
  живот на земята и за възможностите за синовете и дъщерите Божии в идния живот.
- Той въведе причастието, което да напомня за Неговата велика единителна жертва. Той беше заловен и осъден
  по фалшиви обвинения, обявен за виновен, за да е доволна тълпата, и осъден да умре на кръста на Голгота.
  Той даде Своя живот, за да извърши Единението за греховете на цялото човечество. Неговият дар бе велик
  дар в полза на всички, които са живели, живеят сега или ще живеят на земята.
- Ние тържествено свидетелстваме, че Неговият живот, който заема централно място в човешката история,
  нито започна във Витлеем, нито завърши на Голгота. Той беше Първородният на Отца, Единородният Син в
  плътта, Изкупителят на света.
- Той възкръсна от гроба, за да стане „първият плод от починалите“ (1 Коринтяните 15:20). Като възкръснал
  Господ, Той отиде сред тези, които беше обичал през живота Си. Той също така служи сред Своите „други
  овце“ (Йоан 10:16) в Древна Америка. В последните дни Той и Неговият Отец се явиха на момчето Джозеф
  Смит, поставяйки началото на отдавна обещаната епоха, когато ще се „изпълнят времената“ (Ефесяните 1:10).
- 'Пророкът Джозеф пише за Живия Христос: „Очите Му бяха като пламък от огън, косата на главата Му беше
  бяла като чист сняг, лицето Му светеше повече от яркостта на слънцето, а гласът Му беше като звука на
  връхлитащи големи води, тъкмо гласът на Йехова, казвайки:'
- Аз съм първият и последният; Аз съм Този, Който живее, Аз съм Този, Който беше убит, Аз съм вашият Застъпник
  пред Отца“ (У. и З. 110:3–4).
- 'За Него Пророка също така заявява: „И сега, след многото свидетелства, които са били дадени за Него,
  това е свидетелството, последното от всички, което ние даваме за Него: Той живее!'
- Защото ние Го видяхме, тъкмо от дясната страна на Бога и чухме гласа, който дава свидетелство, че Той
  е Единородният на Отца,
- че чрез Него, и посредством Него, и от Него световете съществуват и бяха създадени, и че жителите им
  са родни синове и дъщери Божии“ (У. и З. 76:22–24).
- Ние тържествено заявяваме, че Неговото свещеничество и Църквата Му са възстановени на земята – „съградени
  върху основата на апостолите и пророците, като крайъгълен камък е сам Христос Исус“ (Ефесяните 2:20).
- Ние свидетелстваме, че някой ден Той ще се върне на земята. „И славата Господна ще се яви, и всички
  твари заедно ще я видят“ (Исайя 40:5). Той ще управлява като Цар на Царете и ще царува като Господар
  на Господарите, и всяко коляно ще се преклони пред Него, и всеки език ще Го славослови. Всеки един от
  нас ще застане пред Него, за да бъде съден според делата си и според желанията на сърцето си.
- Ние даваме свидетелство като Негови апостоли, поставени по надлежния ред, че Исус е Живият Христос,
  безсмъртният Божий Син. Той е великият цар Емануил, Който днес стои от дясната страна на Своя Отец.
  Той е светлината, животът и надеждата на света. Неговият път е пътеката, която води към щастие в този
  живот и към вечен живот в идния свят. Да благодарим на Бог за несравнимия дар на Неговия божествен Син.
