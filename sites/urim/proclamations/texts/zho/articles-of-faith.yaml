title: 信條
subtitle: 耶穌基督後期聖徒教會
author: ''
verses:
- n: 1
  text: 我們信神，永恆的父，和祂的兒子耶穌基督，及聖靈。
- n: 2
  text: 我們信人會為自己的罪受懲罰，並不是為亞當的違誡。
- n: 3
  text: 我們信經由基督的贖罪，全人類都可以藉著服從福音的律法和教儀而得救。
- n: 4
  text: 我們信福音的首要原則和教儀是：第一，對主耶穌基督的信心；第二，悔改；第三，為罪的赦免的浸沒洗禮；第四，為聖靈恩賜的按手禮。
- n: 5
  text: 我們信人必須蒙神召喚，藉著預言和有權柄者的按手禮，才可以傳講福音和執行其教儀。
- n: 6
  text: 我們信存在於原始教會中的同樣組織，即：使徒、先知、牧師、教師、傳福音的人等等。
- n: 7
  text: 我們信說方言、預言、啟示、異象、治病、譯方言的恩賜等等。
- n: 8
  text: 我們信翻譯正確的《聖經》是神的話；我們也信《摩爾門經》是神的話。
- n: 9
  text: 我們信神已經啟示的一切，及祂現在啟示的一切，我們也信祂仍要啟示許多有關神國度的偉大而重要的事。
- n: 10
  text: 我們信以色列的真正聚集和十支派的復興；錫安（新耶路撒冷）會建立在美洲大陸上；基督會親自在大地上統治；並且，大地會被更新且獲得其樂園的榮耀。
- n: 11
  text: 我們要求有特權可依照自己良心的指引，崇拜全能的神，並容許所有的人都有同樣的特權，讓他們自行選擇崇拜的方式、處所或對象。
- n: 12
  text: 我們信要服從國王、總統、統治者、和有執法權的長官，要服從、敬重和維護法律。
- n: 13
  text: 我們信要誠實、真誠、貞潔、仁慈、有品德，並為所有的人做有益的事；的確，我們可以說我們聽從保羅的訓誡——我們凡事相信、凡事盼望，我們已忍受了許多事情，希望凡事都能忍受。任何有品德、美好、受好評或值得讚揚的事，我們皆追求之。
signature: 約瑟·斯密。
