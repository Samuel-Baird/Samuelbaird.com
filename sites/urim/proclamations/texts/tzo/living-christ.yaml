title: Kuxul Kristo
subtitle: Yalojik ta Jamal Jtakboliletik
author: Ta Schʼulna Jesukristo ta Chʼul Jchʼunolajeletik ta Slajebal Kʼakʼal
paragraphs:
- Stael ta naʼel svokʼel Jesukristo ta cha mil jabil xae, ta xkalkutik ta jamal ti skuxleje jaʼ ta melel
  mu xuʼ xichʼ koltsanel xchiʼuk ti slekil kʼusitik la spase, muʼyuk spajeb ti svokole. Muʼyuk bochʼo
  yan yakʼoj slekil yutsil yoʼnton ta skotol bochʼotik ikuxiik xchiʼuk ta bochʼotik ta xkuxiik ta sba
  banamil.
- Jaʼ mukʼta Jehova ta Pokʼo Testamento xchiʼuk jaʼ ti Mesias ta Achʼ Testamento. Ta skʼop Stot, jaʼ la
  spas banamil. “Skotol kʼusitik oye jaʼ la spas, ti manchuke muʼyuk kʼusi pasbil ti jechuke.” (kʼelo
  Juan 1:3). Akʼo muʼyuk smul ti stuke, la yichʼ voʼ la schʼun skotol chaʼpanel. “Jaʼ noʼox ti stuke la
  spas kʼusitik lek” (kʼelo Hechos 10:38), ti ta vaʼye jaʼ jech muʼyuk la yichʼ kʼanel. Ti mantaletik
  yuʼune jaʼ jun chanubtasel ta lekilal xchiʼuk ta kʼusitik lek x-ayan. Jaʼ Stuk la skʼan ti akʼo jtsʼaklintik
  spasel ti kʼusi la spase. Ixano ta sbetak Palestina, la spoxta jchameletik, la yakʼbe yil osil maʼsat
  xchiʼuk la schaʼ kuxes animaetik. Ichanubtasban ta kʼusitik jaʼ ta melel ta sbatel osil, kuxlejal ta
  melel kʼalal skʼanto ox xi vokʼ ta banamil, kʼusi stu ti jkuxlejtik liʼ ta banamil xchiʼuk ti xuʼ xi
  jkʼot ta skeremetik xchiʼuk ta stsebetik Riox ta kuxlejal ta tsʼakale.
- La yakʼ chʼul vaj xchiʼuk chʼul voʼ ti jaʼ staubil ta naʼel ti mukʼ svokol la sta ta jkojtike. La yichʼ
  tsʼakel xchiʼuk inopbat smul, oy smul la yichʼ tael kʼuxi xkʼot ta pasel ti kʼusi ta skʼanik ti bochʼotik
  oyike xchiʼuk jaʼ jech la yichʼ akʼel ta kʼabal ta milel ta kurus ta Kalvario. La yakʼ skuxlej jech
  la skuchbe smul skotol jchʼiel kʼopojel. Ti skuxleje jaʼ kʼuxubinel yuʼun ta skotol bochʼo ta skuxiik
  ta banamil.
- Ta xkalkutik ta jamal ta lekilal ti Skuxleje, jaʼ tsots skʼoplal ta skʼotol yechʼemal skuxlej jchʼiel
  kʼopojel, mu jaʼuk te ilik ta Belen schiʼuk mu jaʼuk te ilaj ta vits Kalvario. Jaʼ Baʼyuk Nichʼonil
  yuʼun Jtotik, Jun Noʼox Nichʼonil ta bekʼtalil, Jpojvanej ta svejel banamil.
- Ilik ta mukinal jech “jaʼ baʼyuk ikʼot ta bochʼotik vayemik” (1 Corintios 15:20). Jech kʼuchaʼal Chaʼkuxem
  Kajvaltike, te la schiʼinik ti bochʼotik skʼanoj to ox kʼalal kuxule. Xchiʼuk la skʼel la stukʼulan
  xchiʼuk “yantik schijtak” (Juan 10:16) ta pokʼo America. Ta achʼ banamil liʼ ta orae, jaʼ stuk xchiʼuk
  Stot la yakʼ sbaik ta ilel ta stojol kerem Jose Smith, jaʼ jech ilik ti kʼusi jal xa ox albil skʼoplal
  “kuxlej ta skotol ta xkʼot ta pasel liʼ ta kʼakʼal orae” (Efesios 1:10).
- 'Ta Kuxul Kristo, jvaʼlej yuʼun Riox Jose la stsʼiba: “Ti sattakʼe jaʼ jech cha kʼuchaʼal stilemal kʼokʼ;
  stsotsil sjole sak jech kʼuchaʼal batsʼi sakil bot; yan ti sate stsʼayayet jech kʼuchaʼal sat kʼakʼal;
  xchiʼuk ti yechʼal yee jech kʼuchaʼal ta xbakʼ epal voʼetik, jech, ti yechʼal ye Jehovae, jech la yal:'
- “Vuʼun slikebun xchiʼik slajebun; vuʼun ti kuxulune, vuʼun ti li chame; vuʼun jpojvanejun avuʼun ta
  stojolal Totil” (Chanubtasel xchiʼuk Akʼbil Yeilaltak 110:3–4).
- 'Ta sventa, ti jvaʼlej yuʼun Riox la yal: “Liʼ tana, ta skotol kʼusitik albil ta jamal ta stojole, liʼe
  jaʼ xa slajeb ta xkalkutik ta jamal ta sventa: ¡Ti kuxule!'
- “Yuʼun jech la kilkutik, te ta sbatsʼi kʼob Riox; xchiʼuk la kaʼaykutik yechʼal eil la yal ta jamal
  ti jaʼ Jun Noʼox Snichʼon Totile;
- “jaʼ ta yuʼun, jaʼ ta sventa la spas xchiʼuk jaʼ ta yuʼun ipas banamiletik xchiʼuk la yichʼan pasel,
  jnaklejetik jaʼ skerem xchiʼuk stseb ti Rioxe” (Chanubtasel xchiʼuk Akʼbil Yeilaltak 76:22–24).
- Ta xkalkutik ta jamal ta lekilal ti Stsatsal xchiʼuk Schʼulnae chaʼ likesbil xa ta sba banamil, “xokʼibil
  ta slikeb ta […] jtakboliletik xchiʼuk jvaʼlejetik yuʼun Riox, Jesukristo stuk jaʼ baʼyuk ton ta skujkujil”
  (kʼelo Efesios 2:20).
- Ta xkalkutik ta jamal ti ta sta kʼakʼalil ti Stuke ta sut talel ta banamil. “Xchiʼuk ta xakʼ ta ilel
  ti xojobal Jehovae, xchiʼuk skotol bekʼet jmoj ta xilik” (kʼelo Isaias 40:5). Jaʼ ta xkom ta Ajvalil
  yuʼun ajvaliletik xchiʼuk jaʼ mukʼta Jpasmantal yuʼun jpasmantaletik, xchiʼuk skotol sjol akanil ta
  skejan sba, xchiʼuk skotol okʼil ta xal yichʼel ta mukʼ ta Stojol. Jkotoltik vuʼutike ta xi jtalutik
  ta stojol ta chapanel jech kʼuchaʼal la jpas kabteltik xchiʼuk kʼusi la skʼan koʼntontike.
- Ta xkalkutik ta jamal, ti vuʼunkutik jtakbolilunkutike akʼbil kabtelkutik, ti Jesuse jaʼ Kuxul Kristo,
  ti kuxul sbatel osil Snichʼon Riox. Jaʼ ti mukʼta Ajvalil Emanuele, liʼ tanae te oy ta sbatsʼi kʼob
  Stot. Jaʼ sakil osil, jaʼ kuxlejal, jaʼ patub oʼntonil ta banamil. Sbee jaʼ be ta x-ikʼvan batel ta
  kuxetel oʼntonil liʼ ta jkuxlejetik xchiʼuk ta kuxlejal sbatel osil ta banamil ta xtale. Kol iyal ti
  jech ta x-albat yuʼun Riox ta skoj smukʼul skʼuxul yoʼnton bu mu xkʼolaj kʼu x-elan la yakʼ Schʼul nichʼone.
