title: Nailil
subtitle: Aʼyej loʼil albil ta sventa sbejel banamil
author: Ti Bankilal Peserenteetik xchiʼuk ti Lajchab Volol Tsobolik Jtakboliletik ta Schʼulna Jesukristo
  ta Chʼul Jchʼunolajeletik ta Slajebal Kʼakʼal
note: Peserente Gordon B. Hinckley ta skomtsan liʼ aʼyej loʼil jaʼ jech x-elan yaʼ yej sloʼil la yal ta
  mukʼ ta sobajel yuʼun antsetik, bu ikʼot ta pasel ta skʼakʼalil yoxibal xchaʼvinik yualil septiembre
  ta sjabilal 1995, ta Salt Lake City, Utah, EE. UU.
paragraphs:
- Vuʼunkutik ti Bankilal Peserenteetik xchiʼuk ti Lajchab Volol Tsobolik Jtakboliletik ta Schʼulna Jesukristo
  ta Chʼul Jchʼunolajeletik ta Slajebal Kʼakʼal, ta lekilal ta utsilal ta xkalkutik ti nupiel tsʼakiel
  ta vinik xchiʼuk antse jaʼ yaloj stuk Riox xchiʼuk ti jun nailile jaʼ tsots skʼoplal jech kʼu x-elan
  xchapanoj stuk Jpasvanej ta kʼu x-elan skuxlej ta sbatel osil yalab snichʼnabtab.
- Skotol jchʼiel jkʼopojeletik, vinik xchiʼuk antsetik, jaʼ pasbilik ta slokʼol sbisol Riox. Ta jujuntal
  kʼanbilik ta skerem ta stseb pasbilik ta espíritu ta jtotik ta vinajel xchiʼuk xtok, oy lek tsots stuik
  ta sbatel osil ta jujuntal. Ti jech vinik spasel yakʼel o ants spasel yakʼele jaʼ jech x-elan jelelik
  kʼuxi stakʼik otkinel xchiʼuk jaʼ jech sjam smelol o noʼox ta kʼalal muʼyuk to ox ta xvokʼik, ta xvokʼik
  ta banamil xchiʼuk ta sbatel osil chʼiel kʼopojel.
- Ti ta banamil bu to ox oyike, skeremetik xchiʼuk stsebetik, pasbilik kʼuchaʼal espíritu, la yotkinik
  Riox xchiʼuk la yichʼik ta mukʼ jech kʼuchaʼal stotik ta sbatel osil, xchiʼuk la schʼunbeik ti kʼusi
  xchapanoj ta sventa yalab snichʼnab kʼuxi staik sbekʼtal stakipalik xchiʼuk kʼuxi staik sbijilik ta
  banamil kʼuxi xlekubik s-utsibik ta lekil utsilal xchiʼuk kʼuxi staik skulejalik ta sbatel osil ta slajebale.
  Ta kʼu x-elan chapanbil lekil kuxetel oʼntonil ta xakʼ volel tsobel ta nailile ti maʼuk noʼox te ta
  xpaj ta mukinalile. Ti spasel mantaletik xchiʼuk ti kʼusitik chʼul akʼbil yeilal ta schʼul natak Rioxe
  jaʼ jech x-elan stakʼ x-akʼatik sutel ta stojolal Riox xchiʼuk ti nailile jaʼ jech volol tsobolik ta
  sbatel osil.
- Ti baʼyuk mantal la yakʼ Riox ta Adan xchiʼuk Evae jaʼ koʼol sba xchiʼuk bu kʼalal xuʼ yuʼnik ti jech
  malalilik xchiʼuk kʼalal ajnililike, ta xkʼotik ta totil meʼiletik, ta xkalkutik ti smantal Riox ta
  sventa yalab snichʼnab ti jech x-epajik xchiʼuk ti ta snojesik banamile jech to oy o yichʼel ta mukʼ.
  Xchiʼuk xtok ta xkalkutik ti Rioxe spasoj mantal ti chʼul vuʼelil ta bolesvaneje jaʼ noʼox stakʼ xkʼot
  ta pasel ta vinik xchiʼuk ants bochʼotik nupul tsʼakalik smalal yajnil sbaik ta lekilale.
- Ta xkalkutik ti kʼu x-elan pasbil akʼbil bekʼtalil snaʼ xchame jaʼ albil skʼoplal ta vinajel, ta xkalkutik
  ti schʼul lekil yutsil chʼiel kʼopojel xchiʼuk ti kʼu x-elan tsots skʼolal kuxlejale jaʼ jech x-elan
  schapanoj ta sbatel osil Riox.
- Ti malalil xchiʼuk ajnilale jaʼ ta sbaik skʼelel stukʼulanel ta lekilal ta jujuntal, xchiʼuk jech kʼuchaʼal
  yol snichʼonik, (Salmo 127:3). Ti totil meʼile jaʼ ta schʼul baik schʼitesel skʼopojesel yol snichʼonik
  ta skʼanulajel oʼntonil xchiʼuk ta kʼusi lekilal, yakʼbelik ti kʼusi ta xtun yuʼnik ta sventa sbekʼtalik
  xchiʼuk ta schʼulelike, xchiʼuk ta xchanubtaselik ta skʼanel sbaik xchiʼuk ta skoltael sbaik ta jujuntal,
  ta xchʼunel smantaltak Riox xchiʼuk lekil jchʼiel jkʼopojeletikuk ta yichʼel ta mukʼ mantal vunetik
  ta vuuk noʼox chʼiem kʼopojemikuk. Ti malaliletik xchiʼuk ajnilaletik, meʼiletik xchiʼuk totiletike,
  jaʼ ta sbaik ta svat ta yelov Riox spasel ti vaʼay kʼusi jaʼ ta sbaik spasele.
- Ti jnaklume jaʼ skʼeloj schapanoj stuk Riox. Ti nupiel tsʼakiel ta vinik xchiʼuk antse jaʼ lek jech
  kʼu x-elan schapanoj ta sbatel osil stuk Riox. Ti alab nichʼnabe ta skʼan ta xvokʼ ta x-ayanik ta bochʼotik
  lek nupul tsʼakalik xchiʼuk tsʼitesbilik kʼopojesbilik ta totil ta meʼil bochʼotik yichʼojik lek ta
  mukʼ xchiʼuk ta lek ta uts ti kʼu x-elan nupul tsʼakalike. Ti lekil utsilal ta skuxlej jun jnaklume
  jaʼ lek ta xkʼot ta pasel me jaʼ jech x-elan ta xichʼ pasel jech kʼu x-elan ta xchanubtasvan Kajvaltik
  Jesukristoe. Ti bochʼotik nupul tsʼakalik xchiʼuk nailalil ta xilik lekil utsilale ta xkʼot ta pasel
  xchiʼuk jaʼ te oyik ta kʼu x-elan smantalil xchʼunolajel oʼntonil, ta skʼopanel jtotik, ta sutesub oʼntonil.
  Ta tsʼikumajel, ta ichʼel ta mukʼ, ta kʼan bail, ta yaʼaybel smelol,ta abtel xchiʼuk ta kʼusitik chichʼanan
  pasel ti jaʼ ta xtun ta lekilale. Jaʼ albil tal ta vinajel, ti totil jaʼ ta sba skʼelel snitel ti nailalil
  ta kʼanbail xchiʼuk ta stukʼiluk xchiʼuk jaʼ ta sba skʼelel stukʼulanel xchiʼuk yakʼbel kʼusi ta xtun
  yuʼun tas venta skuxlej ta snailal xchiʼuk ta skʼelel ta stukʼulanel mu kʼusi spasik snuptanik. Ti meʼile
  jaʼ ta sba skʼelel stukʼulanel ti yalabtake. Ti liʼ kʼusi ta chʼul bail spasele, ti totil xchiʼuk meʼile,
  jaʼ koʼol schiʼil sbaik, oy sujelik ta skolta sbaik ta jujuntal. Ta vokolil ta bekʼtal takipalil, la
  jel o me ta yan kʼusi ta xkʼot ta pasel stakʼ skʼelik kʼusi stakʼ pasel ta jujuntal. Stakʼ xichʼik koltael
  ta yan utsʼ alal ti me yuʼun jaʼ jech ta xtune.
- Ta xkalkutik ti jchʼiel jkʼopojeletik bochʼotik ta xixtanik ti kʼu x-elan yakʼoj yeik ta spasel kʼusi
  lek, ta xilbajinik o me ta x-echʼik ta stojolal snup xchiʼilik o me ta yalab snichʼnabike, me muʼyuk
  ta spasik ti kʼusi jaʼ ta sbaik spasel ta snailalike, ta jun kʼakʼal ta xalbeik ta stojolal Riox. Xchiʼuk
  xtok ta xkalkutik ti vokʼel chʼakel ta nailalile ta xikʼ talel ta stojolalik jchʼiel jkʼopojel, ta jnaklumetik
  xchiʼuk ta mukʼtikil lum skotol kʼusitik chopolik jech kʼu x-elan albil skʼoplal ta pokoʼ xchiʼuk ta
  achʼ jvaʼlejetik yuʼun Riox.
- Ta xkalbekutik ti jchʼiel jkʼopojeletik bochʼotik ta sbaik skʼelel xchiʼuk jtunel j-abteletik ta sbejal
  banamil kʼuxi saʼbeik lek smelol kʼuxi xlekub nailalil ta sveta kʼuxi jaʼ uk yipal stsatsal ta lekilal
  ta volel tsobel ta komon.
