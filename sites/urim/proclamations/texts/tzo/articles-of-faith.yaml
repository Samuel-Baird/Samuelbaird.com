title: Yaʼyejaltak Schʼunolajel Oʼntonil
subtitle: Ta Schʼulna Jesukristo ta Chʼul Jchʼunolajeletik ta Slajebal Kʼakʼal
author: ''
verses:
- n: 1
  text: Vuʼtik jchʼunojtik Riox, Totil ta Sbatel Osil, xchiʼuk Snichʼon, Jesukristo, xchiʼuk Chʼul Espiritu.
- n: 2
  text: Jchʼunojtik ti jchʼiel jkʼopojeletike ta xichʼik svokolik ta smul stukik, maʼuk ta skoj muʼyuk
    la schʼun mantal Adan.
- n: 3
  text: Jchʼunojtik ti ta jaʼ kʼu x-elan la stoj mulil Kristo, skotol jchʼiel jkʼopojeletik xuʼ ta xkolik
    ta skoj xchʼunel mantal xchiʼuk spasel smantalil Mantaletik.
- n: 4
  text: 'Jchʼunojtik slikeb chanubtasel xchiʼuk spasel smantalil Mantaletike, jaʼik: slikeb, Schʼunolajel
    Oʼntonil ta Kajvaltik Jesukristo; schibal, Sutesub Oʼntonil; yoxibal, Ich Voʼ ta mukbil kʼuxi xchʼay
    muliletik; xchanibal, Yakʼel kʼobil ta jolil kʼuxi xichʼ akʼel stsatsal Chʼul Espiritu.'
- n: 5
  text: Jchʼunojtik ti jchʼiel jkʼopojele ta skʼan ikbiluk yuʼun Riox, tujbiluk xchiʼuk ta xichʼ akʼel
    kʼobil ta sjol, ta xakʼik bochʼotik oy yabtelik, kʼuxi xuʼ scholik batel mantal xchiʼuk yabtelanel
    ti mantaletike.
- n: 6
  text: Jchʼunojtik ku x-elan volol tsobol Chʼulna ta Slikebal, ti vaʼ aye jaʼik, jtakboliletik, jvaʼlejetik
    yuʼun Riox, jchabivanejetik, jchanubtasvanejetik, j-alkʼopetik, xchiʼuk yantik.
- n: 7
  text: Jchʼunojtik ti kʼopojel ta yantik kʼope, yalel kʼusitik ta xkʼot ta spasel, yaʼyel kʼusi ta xkʼot
    ta spasel, yilel kʼusi ta xkʼot ta spasel, skoltaʼel vokoliletik, yaʼybel smelol yantik kʼopetik,
    xchiʼuk yantik.
- n: 8
  text: Jchʼunojtik ti Bibliae jaʼ skʼop Riox jaʼ to ti bu kʼalal jelubtasbil lek ta yan kʼope; xchiʼuk
    xtok jchʼunojtik ti Svun Mormone jaʼ skʼop Riox.
- n: 9
  text: Jchʼunojtik skotol kʼusitik Riox yakʼoj ta aʼyel, skotol kʼusitik ta xakʼ ta aʼyel, xchiʼuk jchʼunojtik
    ti ep to kʼusitik ta xakʼ ta aʼyel mukʼtik xchiʼuk kʼusitik tsotsik stu bu ta spas mantal Riox.
- n: 10
  text: Jchʼunojtik ti svolel stsobel slumal Israel xchiʼuk ti ta slikesel ta achʼ ti Lajunchop Tsʼunubalile;
    ti Sion (Achʼ Jerusalen) ta xichʼ likesel li ta yosil sbanamil America; ti Kristo jaʼ ta spas mantal
    stuk ti ta sba banamile, ti banamile ta xichʼ pasel ta achʼ xchiʼuk ta xichʼ slekil yutsil vinajel.
- n: 11
  text: Ta xkaltik ti ichʼel ta mukʼ yichʼel ta mukʼ Riox Bochʼo Tsots Xuʼ Yuʼune, jechʼ ku x-elan ta
    xkaʼaytik ta jol koʼntontik, xchiʼuk jaʼuk jechʼikuk ek ti yantik jchiʼel kʼopojeletik ta xichʼik
    ta mukʼ kʼu x-elan, bu xchiʼuk jechʼ kʼu x-elan ta skʼanike.
- n: 12
  text: Jchʼunojtik ti tsakalutik ta mukʼta ajvaliletik, peserenteetik, mukʼta jtunel jvuʼeletik xchiʼuk
    jchapanvanejetik; ta schʼunel, yichʼel ta mukʼ xchiʼuk skoltael ti mantal vune.
- n: 13
  text: 'Jchʼunojtik muʼyukuk loʼlael, tukʼuk spasel bail, lekuk spasel bail, kʼusitik lek uts, xchiʼuk
    spasel skotol kʼusi lek ta skotol jchʼiel jkʼopojeletik; ta batsʼimelel, stakʼ xkaltik ti jaʼ ta jtsʼaklintik
    ti kʼu x-elan ichanubtasvan Pablo: Skotol jchʼunojtik, skotol ta jmalatik; kilojtik xa ep jvokoltik,
    xchiʼuk ta jmalatik yilel jvokoltik ta skotol kʼusitik oy. Ti me oy kʼusitik lek uts, o alakʼ sba,
    lekil talelil, o kʼusi lek stakʼ ichʼel ta mukʼ, ti vaʼ aye jaʼ ta jsaʼtik.'
signature: Jose Smith.
