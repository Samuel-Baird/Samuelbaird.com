title: Ol Toktok blong Bilif blong
subtitle: Jos Ia blong Jisas Kraes blong Ol Lata-dei Sent
author: ''
verses:
- n: 1
  text: Mifala i biliv long God, Papa we I No Save Finis, mo long Pikinini blong Hem, Jisas Kraes, mo
    long Tabu Spirit.
- n: 2
  text: Mifala i biliv we ol man bae oli kasem panis from ol sin blong olgetawan nomo, be i no from wanem
    we Adam i bin foldaon long hem.
- n: 3
  text: Mifala i biliv we tru long Atonmen blong Kraes, bae Kraes i sevem evri man taem oli stap obei
    long ol loa mo olgeta odinens blong Gospel.
- n: 4
  text: 'Mifala i biliv we ol fas prinsipol mo odinens blong Gospel oli: nambawan, Fet long Lod Jisas
    Kraes; nambatu, Fasin blong Sakem Sin; nambatri, Kasem Baptaes andanit long wota blong kam klin aot
    long ol sin; nambafo, Putum han antap long hed blong man blong kasem presen we i Tabu Spirit.'
- n: 5
  text: Mifala i biliv we God i mas singaotem wan man, tru long profesi, mo tru long ol man we oli gat
    atoriti blong putum han antap long hed blong hem, blong hem i prijim Gospel mo mekem ol odinens we
    oli stap.
- n: 6
  text: Mifala i biliv long semfala oganaesesen ia we i bin stap long Jos blong Bifo, we i gat ol aposol,
    ol profet, ol pasta, ol tija, ol ivanjelis, mo ol narafala moa.
- n: 7
  text: Mifala i biliv long presen blong toktok long ol lanwis, presen blong profesi, presen blong revelesen,
    presen blong luk ol visen, presen blong hilim sik, presen blong fasin blong talem mining blong ol
    lanwis, mo ol narafala moa.
- n: 8
  text: Mifala i biliv we Baebol i toktok blong God sapos oli transletem i stret gud; mifala i biliv tu
    we Buk blong Momon i toktok blong God.
- n: 9
  text: Mifala i biliv long evri toktok we God i bin talemaot finis, evri toktok we Hem i stap talemaot
    naoia, mo mifala i biliv we bambae Hem i talemaot yet plante bigfala mo impoten samting abaot kingdom
    blong God.
- n: 10
  text: Mifala i biliv we Isrel bambae i mas kambak tugeta mo Olgeta Ten Traeb bambae oli kambak bakegen;
    we Saeon (Niu Jerusalem), bambae oli bildim long graon blong Amerika; we Kraes Hemwan bambae i rul
    wetem paoa long wol ia; mo, wol ia bambae i kam niufala, mo bambae i kasem glori blong hem olsem paradaes.
- n: 11
  text: Mifala i talemaot we mifala i gat raet blong wosipim Hae God long wei we tingting blong mifala
    i wantem, mo mifala i letem evri man blong gat sem raet ia; letem olgeta blong wosip long fasin we
    oli wantem, long weaples we oli wantem, o wanem we oli wantem.
- n: 12
  text: Mifala i biliv we mifala i mas obei long ol king, ol presiden, ol lida, mo ol jaj, blong folem,
    givim ona, mo sapotem loa.
- n: 13
  text: Mifala i biliv blong mas stap ones, talem trutok, stap klin, stap kaen, stap stret mo gud, mo
    mekem gudfala fasin long evri man; blong talem stret, mifala i stap talemaot se mifala i stap folem
    wanem we Pol i bin tijim—Mifala i biliv long evri samting, mifala i hop long evri samting, mifala
    i bin winim plante samting, mo mifala i hop blong winim evri samting. Sapos i gat samting we i klin,
    i luk naes, o i gudfala mo i nambawan tru, mifala i lukaotem ol samting ia.
signature: Josef Smit.
