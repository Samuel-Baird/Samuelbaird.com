title: Li Yo’yookil Kristo
subtitle: Lix Ch’olob’ahomeb’ li Apostol
author: Lix Iglees li Jesukristo reheb’ laj Santil Paab’anel sa’ Roso’jikeb’ li Kutan
paragraphs:
- Naq naqanima lix yo’lajik li Jesukristo wiib’ mil chihab’ chaq anajwan, naqak’e li qach’olob’ahom chirix
  lix yaalil lix yu’am li maak’a’ xjuntaq’eetankil, ut chirix li wankilal li maak’a’ roso’jik re lix nimal
  ru mayej re xtojb’al rix li maak. Maajun chik junaq wanjenaq xwankil chixtoch’b’al xyu’ameb’ chixjunil
  li ani xe’wan ut li toj te’wanq sa’ li ruchich’och’.
- A’an chaq li xnimal ru Jehova re li Najter Chaq’rab’, ut li Mesias re li Ak’ Chaq’rab’. Chi b’eresinb’il
  xb’aan lix Yuwa’, a’an kiyo’ob’tesink re li ruchich’och’. “Chixjunil ki’uxmank sa’ xk’ab’a’ a’an, ut
  maak’a’ k’a’ re ru kiwank chi maak’a’ ta a’an” (Jwan 1:3). Us ta kiwan chi maak’a’ lix maak, a’an kikub’e
  xha’ re xtz’aqob’resinkil ru chixjunil li tiikilal. A’an “kinume’k yalaq b’ar” chixb’aanunkil li chaab’ilal
  (Hechos 10:38), us ta xik’ ki’ile’ xb’aan a’an. Lix evangelio, a’an chaq jun esilal re tuqtuukilal ut
  re chaab’il ajom. Kixtz’aama chiru chixjunileb’ naq te’xb’aanu li kixb’aanu a’an. Kib’eek chiruheb’
  li b’e sa’ Palestina chixk’irtesinkileb’ li yaj, xk’eeb’aleb’ li mutz’ chi ilok, ut xwaklesinkileb’
  li kamenaq. Kixk’ut li yaalil na’leb’ re junelik q’e kutan, xyaalil li qawanjik naq maji’ nokoyo’la,
  li rajb’al li qayu’am sa’ li ruchich’och’, ut li te’ruuq wi’ chi wulak li ralal ut lix rab’in li Dios
  sa’ li yu’am chalel.
- A’an kixk’ojob’ li loq’laj wa’ak jo’ jun xjultikankil li xnimal ru mayej re xtojb’al rix li maak. A’an
  kichape’ ut kijite’ chiru chaq’rab’ rik’in b’alaq’il jitok, kik’ehe’ tojb’a-maak sa’ xb’een yal re xsahob’resinkil
  xch’ool jun teep, ut kiq’axtesiik chi kamk chiru li krus re Calvario. A’an kixk’e lix yu’am re xtojb’aleb’
  rix lix maak chixjunileb’ li winq. Li kixb’aanu, a’an jun xnimal ru maatan b’aanunk uuchil, choq’ reheb’
  chixjunil li ani te’wanq sa’ xb’een li ruchich’och’.
- Naqach’olob’ xyaalal chi tiik ru li qaatin naq lix yu’am a’an, li naxe’enk re chixjunil lix wanjikeb’
  li winq, moko kitikla ta aran Belen chi moko kiraqe’ sa’ Calvario. A’an li Xb’een Yo’lajenaq chiru li
  Yuwa’b’ej, a’an li K’ajolb’ej Junaj Chirib’il sa’ li tz’ejwalej, laj Tojol rix li ruchich’och’.
- Kiwakli chaq sa’ li muqleb’aal re naq “taawanq choq’ li xb’een ruuchinihom li ani xe’war” (1 Korintios
  15:20). Jo’ li Qaawa’ Waklijenaq, a’an kib’eek sa’ xyanqeb’ li ani kixraheb’ chaq sa’ lix yu’am. Jo’kan
  ajwi’ kixk’ut xk’anjel sa’ xyanqeb’ li “jalan chik xkarneer” (Jwan 10:16) sa’ li najteril America. Sa’
  li qakutankil anajwan, A’an ut lix Yuwa’ ke’xk’utb’esi rib’ chiru li saaj aj Jose Smith, xtikib’ankil
  chi jo’kan xk’ojlajik li najter yeechi’inb’il, lix “tz’aqlojik ru li kutan” (Efesios 1:10).
- 'Chirix li Yo’yookil Kristo, li Profeet aj Jose kixtz’iib’a: “Lix naq’ ru chanchan raq’ xam; li rismal
  xjolom saq chanchan li tz’aqal saqb’ach; li rilob’aal q’axal wi’chik nalemtz’un chiru xlemtz’unkil li
  saq’e; ut lix yaab’ xkux chanchan xyaab’ li k’iila ha’ neke’jub’ub’nak, a’ xyaab’ xkux ajwi’ li Jehova,
  li kixye:'
- “Laa’in li xb’een ut li xraqik; laa’in li yo’yo, laa’in li kikamsiik; laa’in laj aatinanel cherix chiru
  li Yuwa’b’ej” (Tzol’leb’ ut Sumwank 110:3–4).
- 'Chirix A’an li Profeet kixye ajwi’: “Ut anajwan, chirix li k’iila ch’olob’ank xyaalal li k’eeb’il chaq
  chirix a’an, a’in li ch’olob’ank xyaalal, xraqikeb’ chixjunil, li naqak’e chirix: Naq yo’yo!'
- “Xb’aan naq kiqil, sa’ ajwi’ lix nim uq’ li Dios; ut kiqab’i lix yaab’ kuxej chixch’olob’ankil xyaalal
  naq a’an li Junaj Yo’lajenaq chiru li Yuwa’b’ej—
- “Naq xb’aan a’an, ut rik’in a’an, ut sa’ xk’ab’a’ a’an, neke’yiib’aman ut ke’yiib’aman chaq li ruchich’och’,
  ut li ani wankeb’ chi sa’ yo’lajenaqeb’ choq’ alalb’ej ut rab’inb’ej chiru li Dios” (Tzol’leb’ ut Sumwank
  76:22–24).
- Laa’o naqach’olob’ rik’in aatin re tiik ruhil k’a’uxlej naq lix tijonelil a’an ut lix Iglees a’an, ak
  xe’k’ojob’aak wi’chik sa’ xb’een li ruchich’och’ chi kab’lanb’il “sa’ xb’een xxe’ileb’ li apostol ut
  eb’ li profeet, ut li xnimal ru pek sa’ xxuk a’an li Jesukristo ajwi’” (Efesios 2:20).
- Naqach’olob’ xyaalal naq sa’ junaq kutan a’an taasutq’iiq chaq sa’ li ruchich’och’. “Toja’ naq taak’utunq
  lix loq’al li Qaawa’, ut chixjunileb’ li tz’ejwalej te’ril sa’ komonil” (Isaias 40:5). A’an taataqlanq
  jo’ xReyeb’ li rey ut taa’awa’b’ejinq jo’ Qaawa’ reheb’ li qaawa’, ut chixjunqal li xb’een aqej taawiq’laaq
  ut chixjunqal li ru’uj aq’ej taa’aatinaq re loq’onink chiru. Chiqajunqal tooxaqliiq re taaraaqe’q aatin
  chiqix xb’aan a’an a’ yal jo’ chanru li qak’anjel ut li rajom li qach’ool.
- Naqak’e qach’olob’ahom, jo’ lix Apostol li tz’aqal k’ojob’anb’ilo, naq li Jesus a’an li Yo’yookil Kristo,
  li Ralal li Dios, maak’a’ xkamik. A’an li xnimal ru Rey Emmanuel, li k’ojk’o anajwan sa’ lix nim uq’
  lix Yuwa’. A’an lix saqen, lix yu’am, ut lix yo’onihom li ruchich’och’. Lix b’e A’an, a’an li b’e nak’amok
  sa’ li sahil ch’oolejil sa’ li yu’am a’in, ut sa’ li junelik yu’am sa’ li ruchich’och’ toj chalel. B’antioxinb’ilaq
  taxaq re li Dios li maatan li maak’a’ xjuntaq’eetankil li kixk’e chaq rik’in lix choxahil Alal.
