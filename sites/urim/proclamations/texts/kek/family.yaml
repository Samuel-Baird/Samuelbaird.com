title: Li Junkab’al
subtitle: Jun Jek’inb’il Aatin choq’ re li Ruchich’och’
author: Li Xb’eenil Awa’b’ejil ut lix Ch’utameb’ li Kab’laju chi Apostol re Lix Iglees li Jesukristo reheb’
  laj Santil Paab’anel sa’ Roso’jikeb’ li Kutan
note: Li Awa’b’ej Gordon B. Hinckley kixyaab’asi li aatin a’in jo’ xtz’aqob’ li raatin li kixk’e sa’ lix
  Jolomil Ch’utam li Komonil re Tenq’ank li ki’ux sa’ rox xka’k’aal xb’e li po septiembre, 1995, sa’ li
  tenamit Lago Salado, Utah.
paragraphs:
- Laa’o, li Xb’eenil Awa’b’ejil ut lix Ch’utameb’ li Kab’laju chi Apostol re lix Iglees li Jesukristo
  reheb’ laj Santil Paab’anel sa’ Roso’jikeb’ li Kutan, naqach’olob’ chi tiik li qaatin naq lix sumlajik
  li winq rik’in li ixq k’ojob’anb’il xb’aan li Dios, ut naq li junkab’al q’axal aajel ru sa’ lix k’uub’anb’il
  na’leb laj Yo’ob’tesinel choq’ rehaq lix k’ulumeb’ li ralal xk’ajol sa’ li junelik q’e kutan.
- Chixjunileb’ li yo’lajenaqeb’—li teelom ut li ixq—yo’ob’tesinb’ileb’ jo’ chanru xjalam-uuch li Dios.
  Li junjunq a’aneb’ raab’ileb’ musiq’ejil alalb’ej malaj rab’inb’ej chiru choxahil na’b’ej yuwa’b’ej,
  ut xb’aan a’an, li junjunq wan xchoxahilal li ak xk’am chaq, ut li toj taareechani. Li winqilal ut ixqilal
  a’an aajel ruhil eetalil chirix aniho ut k’a’ut naq wan li junjunq, naq maji’ nayo’la, sa’ li yu’am
  a’in, ut sa’ li junelik q’e kutan.
- Sa’ li wanjik naq maji’ neke’yo’la, li musiq’ejil alalb’ej ut rab’inb’ej ke’xnaw ru ut ke’xloq’oni li
  Dios jo’ xJunelik Yuwa’, ut ke’xk’ulub’a lix k’uub’anb’il na’leb’, li te’ruuq wi’ li ralal xk’ajol A’an
  chixk’ulb’al xjunxaqalileb’ re tz’ejwalej, ut rik’in li te’xk’ul sa’ li ruchich’och’, chixk’amb’al li
  b’e li naxik sa’ li tz’aqalil re ru, ut chixtawb’al sa’ roso’jik li choxahilal li te’ruuq chixk’ulb’al
  jo’ aj eechanihom re li junelik yu’am. Li choxahil k’uub’anb’il na’leb’ re sahil ch’oolejil naxkanab’
  naq li komonil wank sa’ junkab’alej taaruuq chi kanaak chirix li kamk. Sa’ xk’ab’a’eb’ li loq’laj k’ojob’anb’il
  k’anjel ut li sumwank li neke’tawman sa’eb’ li santil ochoch, naru naq li junjunq taasutq’iiq b’ar wi’
  wan li Dios, ut naq eb’ li junkab’al te’junajimanq chi junelik.
- Li xb’een taqlahom kixk’e li Dios re laj Adan ut li xEva na’aatinak chirix lix wankilaleb’ chi k’iresink
  jo’ b’eelomej ut ixaqilb’ej. Naqach’olob’ naq lix taqlahom li Dios naq eb’ li ralal xk’ajol te’k’ihanq
  ut te’xnujob’resi li ruchich’och’, toj xaqxo xwankil. Naqach’olob’ ajwi’ naq li Dios kixtaqla naq li
  loq’laj wankilal re yo’ob’tesink alalb’ej ka’ajwi’ taa’oksimanq b’ar wi’ wan jun winq ut jun ixq, sumsuukeb’
  sa’ li chaq’rab’ jo’ b’eelomej ut ixaqilb’ej.
- Naqach’olob’ naq li b’e natikla wi’ li yu’am sa’ li ruchich’och’, k’ojob’anb’il xb’aan li Dios. Naqajultika
  xyaalal naq li yu’amej wan xloq’al, ut naq aajel ru sa’ lix junelik k’uub’anb’il na’leb’ li Dios.
- Eb’ li b’eelomej ut li ixaqilb’ej q’axal tento sa’ xb’eeneb’ naq te’xra rib’ ut te’xtenq’a rib’ chirib’ileb’
  rib’, jo’ ajwi’ eb’ lix kok’al. “Eb’ li alal k’ajolb’ej a’aneb’ eechanihomej re li Qaawa’” (Salmos 127:3).
  Eb’ li na’b’ej yuwa’b’ej wan jun li teneb’anb’il loq’ sa’ xb’eeneb’, naq te’xk’iiresiheb’ lix kok’al
  rik’in rahok ut tiikilal, naq te’xk’e li k’a’ru nak’anjelak reheb’ sa’ tz’ejwalej ut sa’ musiq’ej, ut
  naq te’xk’ut chiruheb’ xraab’al rib’ ut xtenq’ankil rib’ chirib’ileb’ rib’, xpaab’ankileb’ lix taqlahom
  li Dios, ut roxloq’inkil lix chaq’rab’ li tenamit yalaq ta b’ar wankeb’. Eb’ li b’eelomej ut li ixaqilb’ej—li
  na’b’ej ut yuwa’b’ej—teneb’anb’ilaq sa’ xb’eeneb’ xsumenkil chiru li Dios chanru naq ke’xb’aanu li k’anjel
  a’in.
- 'Li junkab’al k’ojob’anb’il xb’aan li Dios. Lix sumlajik li winq rik’in li ixq aajel ru sa’ lix junelik
  k’uub’anb’il na’leb a’an. Eb’ li kok’al xk’ulub’eb’ naq te’yo’laaq rub’el xb’ak’leb’ li sumlaak, ut
  te’k’iiresiiq xb’aan jun li na’b’ej ut jun li yuwa’b’ej li neke’paab’ank re xchaq’rab’il li sumlaak
  rik’in tz’aqal tiikilal. Li sahil ch’oolejil sa’ li junkab’al, k’a’jo’ wi’chik naq taatawmanq naq k’ojob’anb’il
  sa’ xb’een li na’leb’ k’utb’il xb’aan li Qaawa’ Jesukristo. Eb’ li sumsu ut li junkab’al li neke’usaak,
  wankeb’ chi xaqab’anb’il ut k’uulanb’il rik’in li na’leb’ a’in: li paab’aal, li tijok, li jalb’a-k’a’uxlej,
  li kuyuk maak, li oxloq’ink, li rahok, li toq’ob’ank-u, li k’anjelak, ut li chaab’il sahil ch’oolejil
  li nab’aanuman sa’ komonil. Chi taqlanb’il xb’aan li Dios, eb’ li yuwa’b’ej tento te’xjolomi lix junkab’al
  rik’in rahok ut tiikilal, ut tento sa’ xb’eeneb’ xk’eeb’al li k’a’ru na’ajman ru re li yu’am a’in, ut
  xk’eeb’al xkolb’aleb’ rix lix junkab’al. Eb’ li na’b’ej teneb’anb’il xb’een wa sa’ xb’eeneb’ lix k’iiresinkileb’
  li ralal xk’ajol. Sa’eb’ li loq’laj teneb’ank a’in, eb’ li na’b’ej ut yuwa’b’ej, jo’ rochb’eeneb’ rib’
  chi junaqikeb’ xwankil, tento sa’ xb’eeneb’ xtenq’ankil rib’ chirib’ileb’ rib’. Wan naq xmaak li yajel,
  li kamk, ut k’a’aq chik ru taak’ulmanq, taa’aje’q xsik’b’al xyaalal chanru taa’uxmanq a’in. Eb’ li ech’alalb’ej
  tento naq te’tenq’anq jo’q’e na’ajman.'
- Naqaye chi rub’eetal naq eb’ li ani neke’q’etok re li sumwank chirix li saq ru ch’oolejil, eb’ li neke’rahob’tesink
  re lix sum aatin malaj eb’ li ralal xk’ajol, ut li ink’a’ neke’xb’aanu li teneb’anb’il sa’ xb’eeneb’
  sa’ li junkab’al, sa’ jun kutan te’xaqab’aaq xsumenkil resil lix b’aanuhomeb’ chiru li Dios. Naqaye
  ajwi’ chik chi rub’eetal naq lix sachik li junkab’alej, tixk’am chaq sa’ xb’eeneb’ li winq ut li ixq,
  li jar tenamit, ut li jar ch’och’, li rahilal yeeb’il resil xb’aaneb’ li profeet najter ut sa’ li kutan
  a’in.
- Naqak’e xb’oqb’aleb’ li komonil ut laj awa’b’ejinel xb’een tenamit yalaq ta b’ar, li tiikeb’ xk’a’uxl,
  naq te’xxaqab’ xwankil li jar paay chi na’leb’ li tuqub’anb’il re xkolb’al rix ut xkawob’resinkil li
  junkab’al jo’ li ch’utam li wan choq’ roqechal li tenamit.
