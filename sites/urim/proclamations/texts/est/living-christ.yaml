title: Elav Kristus
subtitle: Apostlite tunnistus
author: Viimse Aja Pühade Jeesuse Kristuse Kirik
paragraphs:
- Tähistades Jeesuse Kristuse sündi kaks tuhat aastat tagasi, anname oma tunnistuse Tema võrratu elu tõelisusest
  ja Tema suure lepitava ohverduse lõpmatust väest. Kellelgi teisel ei ole olnud niivõrd sügavat mõju
  kõigile neile, kes on elanud või hakkavad veel elama maa peal.
- Tema oli Vana Testamendi Vägev Jehoova, Uue Testamendi Messias. Oma Isa juhendamise all sai Temast Maa
  looja. „Kõik on tekkinud tema läbi, ja ilma temata ei ole tekkinud midagi, mis on tekkinud” (Johannese
  1:3). Kuigi Ta oli patuta, ristiti Ta selleks, et täita kõike õigust. Ta „käis mööda maad ja tegi head”
  (Apostlite teod 10:38), olles siiski selle eest põlatud. Tema evangeelium oli sõnum rahust ja heatahtlikkusest.
  Ta palus, et kõik järgiksid Tema eeskuju. Ta kõndis Palestiina teedel, tehes terveks haigeid, pannes
  pimedaid nägema ja äratades surnuid. Ta õpetas igavikulisi tõdesid meie surelikule elule eelneva olemasolu
  tõelisusest, meie maapealse elu eesmärgist ning Jumala poegade ja tütarde võimalustest tulevases elus.
- Ta pani aluse sakramenditalitusele kui meeldetuletusele oma suurest lepitavast ohverdusest. Ta vahistati
  ja mõisteti hukka valesüüdistuste alusel, mõisteti süüdi rahvahulga rahulduseks ning Tal lasti surra
  ristil Kolgatal. Ta andis oma elu, et teha lepitus kogu inimkonna pattude eest. Tema oli lepitusanniks
  kõigi nende eest, kes eales on maa peal elanud või hakkavad elama.
- Me tunnistame pühalikult, et Tema elu, mis on kogu inimajaloo keskmeks, ei saanud alguse Petlemmas ega
  lõppenud Kolgatal. Ta oli Isa Esmasündinu, Ainusündinud Poeg lihas, maailma Lunastaja.
- Ta tõusis hauast, et saada „esmaseks nende seast, kes on läinud hingama” (1. korintlastele 15:20). Ülestõusnud
  Issandana külastas Ta neid, keda oli armastanud oma elu ajal. Samuti teenis Ta oma „teiste lammaste”
  seas (Johannese 10:16) muistses Ameerikas. Kaasaja maailmas ilmusid Tema ja Ta Isa poisile nimega Joseph
  Smith, juhatades sisse ammu tõotatud „aegade täiuse korralduse” (Efeslastele 1:10).
- 'Prohvet Joseph kirjutas Elavast Kristusest: „Tema silmad olid kui tuleleek, tema juuksed valged nagu
  puhas lumi, tema pale säras eredamalt kui päike ja tema hääl oli kui suurte vete kohin, nimelt Jehoova
  hääl, mis ütles:'
- Mina olen esimene ja viimane; mina olen see, kes elab, mina olen see, kes surmati; mina olen teie ceestkostja
  Isa ees.” (Õpetus ja Lepingud 110:3–4).
- 'Temast kuulutas prohvet samuti: „Ja nüüd, pärast paljusid tunnistusi, mis temast antud on, see on tunnistus,
  viimane kõikidest, mille meie temast anname: et ta elab!'
- Sest me nägime teda, nimelt Jumala paremal käel, ja me kuulsime häält tunnistamas, et tema on Isa Ainusündinu
  –
- et tema kaudu, tema läbi ja temast on ja on loodud maailmad, ja nende elanikud on Jumalale sündinud
  pojad ja tütred.” (Õpetus ja Lepingud 76:22–24).
- 'Me teatame pühalikult, et Tema preesterlus ja Tema Kirik on taastatud maa peale: „rajatud apostlite
  ja prohvetite alusele, kus Kristus Jeesus ise on nurgakivi” (Efeslastele 2:20).'
- Me tunnistame, et Ta tuleb ühel päeval maa peale tagasi. „Siis ilmub Jehoova au ja kõik liha näeb seda
  üheskoos” (Jesaja 40:5). Tema valitseb kui kuningate Kuningas ja isandate Isand ning iga põlv nõtkub
  ja iga keel tunnistab austuses Tema ees. Igaüks meist seisab Tema ees, et Ta mõistaks meie üle kohut
  vastavalt meie tegudele ja südame soovidele.
- Meie kui Tema korra järgi pühitsetud apostlid tunnistame, et Jeesus on Elav Kristus, Jumala surematu
  Poeg. Tema on suur Kuningas Immaanuel, kes seisab oma Isa paremal käel. Tema on maailma valgus, elu
  ja lootus. Tema tee on rada, mis juhatab õnnele selles elus ja igavesse ellu tulevases maailmas. Jumal
  olgu tänatud oma jumaliku Poja võrreldamatu anni eest.
