title: u usuartiklid
subtitle: Viimse Aja Pühade Jeesuse Kristuse Kirik
author: ''
verses:
- n: 1
  text: Me usume Jumalasse, Igavesse Isasse, ja Tema Pojasse Jeesusesse Kristusesse ning Pühasse Vaimu.
- n: 2
  text: Me usume, et inimesi karistatakse nende endi pattude ja mitte Aadama üleastumise eest.
- n: 3
  text: Me usume, et Kristuse lepituse läbi võib saada päästetud kogu inimkond, kui nad kuuletuvad evangeeliumi
    seadustele ja talitustele.
- n: 4
  text: 'Me usume, et evangeeliumi esimesed põhimõtted ja talitused on: esiteks usk Issandasse Jeesusesse
    Kristusesse, teiseks meeleparandus, kolmandaks ristimine vee alla kastmise teel pattude andekssaamiseks,
    neljandaks Püha Vaimu anni andmine käte pea peale panemise teel.'
- n: 5
  text: Me usume, et selleks, et jutlustada evangeeliumi ja sooritada selle talitusi, peab inimene olema
    kutsutud Jumala poolt prohvetliku kuulutamise ja käte pealepanemise läbi nende poolt, kes on selleks
    volitatud.
- n: 6
  text: Me usume samasse organisatsiooni, mis oli algkirikus, nimelt apostlid, prohvetid, karjased, õpetajad,
    evangeeliumi kuulutajad ja nii edasi.
- n: 7
  text: Me usume keelte, prohvetliku kuulutamise, ilmutuste, nägemuste, tervekstegemise, keelte tõlgitsemise
    ja teistesse andidesse.
- n: 8
  text: Me usume, et Piibel on Jumala sõna sel määral, kui see on tõlgitud õigesti; me usume samuti, et
    Mormoni Raamat on Jumala sõna.
- n: 9
  text: Me usume kõike, mida Jumal on ilmutanud, kõike, mida Ta ilmutab praegu, ja me usume, et Ta ilmutab
    veel palju suuri ja tähtsaid Jumala kuningriiki puutuvaid asju.
- n: 10
  text: Me usume tegelikku Iisraeli kogumisse ja kümne suguharu taastamisse; et Siion (Uus Jeruusalemm)
    ehitatakse Ameerika mandrile; et Kristus saab isiklikult valitsema maa peal ja et maa uuendatakse
    ning saab paradiisliku hiilguse.
- n: 11
  text: Me nõuame õigust kummardada Kõigevägevamat Jumalat meie oma südametunnistuse järgi ja lubame sama
    õiguse kõikidele inimestele, kummardagu nad kuidas, kus või mida nad soovivad.
- n: 12
  text: Me usume, et tuleb olla alluvad kuningatele, presidentidele, valitsejatele ja võimukandjatele,
    kuuletudes seadustele neid austades ja toetades.
- n: 13
  text: Me usume, et tuleb olla ausad, ustavad, kõlbeliselt puhtad, heatahtlikud, vooruslikud ja teha
    head kõikidele inimestele; tõesti, me võime öelda, et me järgime Pauluse manitsust – me usume kõigesse,
    me loodame kõike, me oleme talunud palju ja loodame, et me oleme võimelised taluma kõike. Kui on midagi
    vooruslikku, armast või märkimis- või kiiduväärset, siis me püüdleme kõige selle poole.
signature: Joseph Smith.
