title: Shinapachami Yuyaykuna Jesucristopaj Iglesiapaj Apunchipaj Agllashcacunapaj tucurimui punllacunapi
subtitle: ''
author: ''
verses:
- n: 1
  text: Ñukanchikka, Achill-Tayta Tukui Pachakunapak Yayatapish, paypak Churi Jesucritotapish, Achill-Kausak-Samaytapish
    shinapacha yuyanchikmi.
- n: 2
  text: Tucui kaypi kausakkunapakpacha kʼuchacunamantallami, imatapishchaskinka yuyanchikmi, mana Adan
    rurashkakunamantaka.
- n: 3
  text: Cristo kishpichinkapak rurashkamanta, tukui kay allpa pachapi kausakkunaka kishpi ushnmi, paypak
    katichunpacha sakishkakunata katishpa, shinallata kishpichinkapak yachachishkapi ruranakunata rurashpaka.
- n: 4
  text: 'Shinapacha yuyanchikmi, kishpichinkapak yachachishkapi kallarik yuyanakunapish ruranakunapish,
    kaykunami, shuk: Apunchik-Tayta Jesucristota shinapachami yuyana; ishkay katik: Kʼuchakunamanta nanarina;
    kimsa katik: Yakupi-washakʼuna, kʼuchakunata pʼichankapak; chusku katik: Makikunata umapi churana
    Achill-Kausak-Samaypak karayta chaskichingapak.'
- n: 5
  text: Shinapacha yuyanchikmi kʼarikuanaka Achill-Tayta kayachishkami kana, kaya-mincha-tianata willashkamanta,
    shinallata makikunata churaymanta, Achill-Taytapak ushayta charikkunamanta, kishpichinkapak yachachiskapi
    tiashkata yachachinkapakpish achill ruranakunata rurankapakpish.
- n: 6
  text: 'Shinapacha yuyanchikmi ima shina chayrak kallarik tantanakʼushka kashkata, kaykuna: Akllashka
    willakkuna, kaya-mincha-tianata willakkuna, michikkuna, yachachikkuna, yachay taytakuna, kutishukkunapish.'
- n: 7
  text: Shinapacha yuyanchikmi shimi rimay ushachimui karayta, kaya-mincha-tianata willachimui karayta,
    Achill-Kausak-Samaywan willachimui karayta, rikurishpa willachimui karayta, jampimui karayta, shimikuna
    nikʼukta yachay ushanata karayta, shinallata shukkunatapish.
- n: 8
  text: Shinapacha yuyanchikmi, Bibliaka Achill-Taytapak shimimi shuk shimiman allí yallichishka kakpika,
    shinallata Mormon Killkashkapish Achill-Taytapakpacha shimimi.
- n: 9
  text: Shinapacha yuyanchikmi Achill-Tayta willachimushkakunata, shinallata kunan Achill-Tayta willachimuikunatapish,
    shinallata shinapacha yuyanchikmi payka ashtawan paypak tantanakʼushka katikkunapak ninan allikunata
    willachimunkarakmi.
- n: 10
  text: Shinapacha yuyanchikmi Israel tantachishka kanatapacha, shinallata Chunka Ayllukunapish kutin
    allí shayachishka kanata; chayka Sionka (Mushuk Jerusalen) kay llaktakunapi America nishka shayachishka
    kankami; chayka Cristoka paypachami kay allpapi apunka; shinallata chayka allpaka kutin mushukyachishka
    kankami, shinashpa kay allpaka paypak allipacha puncha pampayayta chaskinkami.
- n: 11
  text: 'Ñukanchikka Achill-Tayta tukuitapacha ushakta kʼuyay ushankapak mañanchikmi, ima shina ñukanchikpak
    uku-yuyay nishkata katishpa, shinallata tukuillaman chay ushaytallata sakinchikmi: paykuna ima shina
    munashpapish, maypi munashpapish, imata munashpapish kʼuyachun.'
- n: 12
  text: Shinapacha yuyanchikmi, tukuita kachakta, llaktakunapak apukkunata, apukkunatapish; paykuna nishkata
    katishpa, nishkata rurashpapish, katishpapish, shinchiyachishpapish rurana kanchik yuyanchikmi.
- n: 13
  text: 'Shinapacha yuyanchikmi, ama llullanata, shinapacha kashkatalla ninata, ama waynayashpa kausanata,
    tukuiwan allí kanata, allitalla katishpa kausanata, shinallata tukuillaman allitalla ruranata; ni
    ushanchikpachami, ñukanchikka Pablo nishkata katinchikmi: Tukuitami shinapacha yuyanchik, tukuitami
    shuyanchik; ashtaka llakikunata yallishkanchikmi, shinallata tukuitapish yalli ushankapak shuyanchikmi.
    Imapish allipacha, kʼuyaylla, allipacha nishka, na kashpapish allipi churankapak allí kakpika, chaytami
    maskanchik.'
