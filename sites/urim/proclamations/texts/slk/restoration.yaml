retrieved: '2026-11-02'
title: Znovuzriadenie plnosti evanjelia Ježiša Krista
subtitle: Dvojstoročnicové prehlásenie svetu
author: Prvé predsedníctvo a Rada dvanástich apoštolov Cirkvi Ježiša Krista Svätých neskorších dní
note: Toto prehlásenie prečítal prezident Russell M. Nelson ako súčasť svojho posolstva na 190. výročnej
  generálnej konferencii 5. apríla 2020 v Salt Lake City v Utahu.
paragraphs:
- Slávnostne prehlasujeme, že Boh miluje Svoje deti v každom národe sveta. Boh Otec nám dal božské zrodenie,
  neporovnateľný život a nekonečnú zmiernu obeť Jeho Milovaného Syna Ježiša Krista. Mocou Otca Ježiš znova
  vstal a zvíťazil nad smrťou. Je to náš Spasiteľ, náš Príklad a náš Vykupiteľ.
- Pred dvesto rokmi, počas krásneho jarného rána v roku 1820, odišiel mladý Joseph Smith, ktorý nevedel,
  ku ktorej cirkvi sa má pripojiť, do lesa, aby sa modlil blízko svojho domu v americkom štáte New York.
  Mal otázky týkajúce sa spásy svojej duše a veril, že ho Boh bude viesť.
- V pokore vyhlasujeme, že Boh Otec a Jeho Syn Ježiš Kristus sa v odpovedi na jeho modlitbu zjavili Josephovi
  a slávnostne uviedli znovuzriadenie všetkých vecí (pozri Skutky 3:21), ako to bolo predpovedané v Biblii.
  V tomto videní sa dozvedel, že po smrti pôvodných apoštolov bola Kristova novozákonná cirkev stratená
  zo zeme. Joseph mal byť nápomocný pri jej návrate.
- Potvrdzujeme, že pod vedením Otca a Syna prišli nebeskí poslovia, aby Josepha poučili a znova založili
  Cirkev Ježiša Krista. Vzkriesený Ján Krstiteľ obnovil právomoc krstiť ponorením na odpustenie hriechov.
  Traja z pôvodných dvanástich apoštolov – Peter, Jakub a Ján – znovuzriadili apoštolstvo a kľúče kňazskej
  právomoci. Prišli aj iní, vrátane Eliáša, ktorý znovuzriadil právomoc spojiť rodiny spolu navždy vo
  večných vzťahoch, ktoré presahujú smrť.
- 'Ďalej svedčíme o tom, že Joseph Smith obdržal Boží dar a moc na preloženie starodávneho záznamu: Knihy
  Mormonovej – Ďalšieho svedectva o Ježišovi Kristovi. Na stranách tohto posvätného textu je popis osobnej
  služby Ježiša Krista medzi ľuďmi na západnej pologuli krátko po Jeho vzkriesení. Učí o účele života
  a vysvetľuje náuku Kristovu, ktorá je pre tento účel ústredná. Kniha Mormonova ako spoločník k Biblii
  svedčí o tom, že všetky ľudské bytosti sú synmi a dcérami milujúceho Otca v nebi, že má božský plán
  pre naše životy a že Jeho Syn Ježiš Kristus k nám dnes hovorí tak ako v dobách za stara.'
- Vyhlasujeme, že Cirkev Ježiša Krista Svätých neskorších dní, zorganizovaná 6. apríla 1830, je obnovená
  Kristova novozákonná Cirkev. Táto Cirkev je zakotvená v dokonalom živote jej uholného kameňa Ježiša
  Krista a v Jeho nekonečnom uzmierení a doslovnom vzkriesení. Ježiš Kristus opäť povolal apoštolov a
  dal im kňazskú právomoc. Vyzýva nás všetkých, aby sme prišli k Nemu a Jeho Cirkvi, aby sme prijali Ducha
  Svätého, spásne obrady a získali trvalú radosť.
- Od tohto znovuzriadenia, ktoré bolo iniciované Bohom Otcom a Jeho Milovaným Synom Ježišom Kristom, uplynulo
  už dvesto rokov. Milióny z celého sveta prijali vedomosť o týchto prorokovaných udalostiach.
- S potešením vyhlasujeme, že sľúbené znovuzriadenie pokračuje skrze pokračujúce zjavenie. Zem už nikdy
  nebude rovnaká, pretože Boh v Kristovi zjednotí všetko (pozri Efezským 1:10).
- S úctou a vďačnosťou pozývame ako Jeho apoštoli všetkých, aby vedeli – tak ako my – že nebesá sú otvorené.
  Potvrdzujeme, že Boh prejavuje Svoju vôľu pre Svojich milovaných synov a dcéry. Svedčíme, že tí, ktorí
  s modlitbou študujú posolstvo znovuzriadenia a konajú vo viere, budú požehnaní, aby získali svoje vlastné
  svedectvo o jeho božskosti a účele pripraviť svet na sľúbený druhý príchod nášho Pána a Spasiteľa Ježiša
  Krista.
