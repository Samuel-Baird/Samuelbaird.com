title: Rodina
subtitle: Prehlásenie svetu
author: Prvé predsedníctvo a Rada dvanástich apoštolov Cirkvi Ježiša Krista Svätých neskorších dní
note: Toto prehlásenie prečítal prezident Gordon B. Hinckley ako súčasť svojho posolstva na Generálnej
  konferencii Združenia pomoci, ktorá sa konala 23. septembra 1995 v Salt Lake City v Utahu.
paragraphs:
- My, Prvé predsedníctvo a Rada dvanástich apoštolov Cirkvi Ježiša Krista Svätých neskorších dní, slávnostne
  prehlasujeme, že manželstvo medzi mužom a ženou je ustanovené Bohom a že rodina je stredobodom Stvoriteľovho
  plánu pre večné určenie Jeho detí.
- Všetky ľudské bytosti – muži i ženy – sú stvorené na obraz Boží. Každý je milovaným duchovným synom
  alebo dcérou nebeských rodičov a, ako taký, má božské vlastnosti a určenie. Pohlavie je základnou charakteristikou
  jednotlivca, jeho predpozemskej, pozemskej a večnej totožnosti a zámeru.
- V predpozemskej ríši duchovní synovia a dcéry poznali a uctievali Boha ako svojho Večného Otca a prijali
  Jeho plán, pomocou ktorého môžu Jeho deti obdržať hmotné telo a získať pozemské skúsenosti, aby postúpili
  bližšie k dokonalosti a nakoniec naplnili svoje božské určenie ako dedičia večného života. Božský plán
  šťastia umožňuje, aby rodinné vzťahy pokračovali večne, i za hrob. Posvätné obrady a zmluvy dosiahnuteľné
  vo svätých chrámoch umožňujú jednotlivcom vrátiť sa do Božej prítomnosti a rodinám umožňujú, aby boli
  zjednotené na večnosť.
- Prvé prikázanie, ktoré Boh dal Adamovi a Eve sa týkalo ich možnosti byť rodičmi ako manžel a manželka.
  Prehlasujeme, že prikázanie, ktoré Boh dal Svojim deťom, aby sa rozmnožovali a naplnili zem, je stále
  v platnosti. Ďalej prehlasujeme, že Boh prikázal, aby boli posvätné sily plodenia používané len medzi
  mužom a ženou, ktorí sú zákonne zosobášení ako manžel a manželka.
- Prehlasujeme, že spôsob, ktorým je tvorený smrteľný život je božsky určený. Potvrdzujeme posvätnosť
  života a jeho dôležitosť vo večnom Božom pláne.
- Manžel i manželka majú posvätnú zodpovednosť milovať a starať sa jeden o druhého a o svoje deti. „Dedičstvom
  od Hospodina sú synovia“ (Žalmy 127:3). Rodičia majú posvätnú povinnosť vychovávať svoje deti v láske
  a spravodlivosti, starať sa o ich telesné a duchovné potreby, učiť ich vzájomne sa milovať a navzájom
  si slúžiť, dodržiavať Božie prikázania a byť občanmi dodržujúcimi zákony, nech žijú kdekoľvek. Manželia
  i manželky – matky a otcovia – sa budú zodpovedať pred Bohom za nesplnenie týchto povinností.
- Rodina je ustanovená Bohom. Manželstvo medzi mužom a ženou je základom Jeho večného plánu. Deti majú
  právo na to, aby sa narodili v manželskom zväzku a boli vychovávané otcom a matkou, ktorí si ctia manželské
  sľuby s bezvýhradnou vernosťou. Šťastie v rodinnom živote je najpravdepodobnejšie možné dosiahnuť vtedy,
  keď je založené na učeniach Pána Ježiša Krista. Úspešné manželstvá a rodiny sú založené a udržiavané
  na zásadách viery, modlitby, pokánia, odpustenia, úcty, lásky, súcitu, práce a prospešných oddychových
  činností. Podľa božského vzoru, otcovia predsedajú svojim rodinám v láske a spravodlivosti a sú zodpovední
  za to, že sa postarajú o životné potreby a ochranu svojich rodín. Matky sú predovšetkým zodpovedné za
  výchovu svojich detí. V týchto posvätných zodpovednostiach sú otcovia a matky povinní pomáhať si jeden
  druhému ako rovnocenní partneri. Postihnutie, smrť alebo iné okolnosti si môžu vyžiadať individuálne
  úpravy. Keď je to potrebné, majú pomoc poskytnúť ďalší príbuzní.
- Varujeme jednotlivcov, ktorí porušujú zákony morálnej čistoty, ktorí zneužívajú partnera alebo svojich
  potomkov, či tí, ktorí si neplnia rodinné povinnosti, že sa jedného dňa budú zodpovedať pred Bohom.
  Ďalej varujeme, že rozpad rodiny privedie na jednotlivcov, obce a národy pohromy predpovedané dávnymi
  i súčasnými prorokmi.
- Vyzývame zodpovedných občanov a vládnych úradníkov, nech sú kdekoľvek, aby podporovali tie kroky, ktoré
  sú určené na udržanie a posilnenie rodiny ako základnej jednotky spoločnosti.
