title: Články viery
subtitle: Cirkvi Ježiša Krista Svätých neskorších dní
author: ''
verses:
- n: 1
  text: Veríme v Boha, Večného Otca, a v Jeho Syna, Ježiša Krista, a v Ducha Svätého.
- n: 2
  text: Veríme, že ľudia budú potrestaní za svoje vlastné hriechy, a nie za priestupok Adamov.
- n: 3
  text: Veríme, že skrze uzmierenie Kristovo môže byť spasené celé ľudstvo, skrze poslušnosť zákonov a
    obradov evanjelia.
- n: 4
  text: 'Veríme, že prvými zásadami a obradmi evanjelia sú: po prvé, viera v Pána Ježiša Krista; po druhé,
    pokánie; po tretie, krst ponorením na odpustenie hriechov; po štvrté, kladenie rúk pre dar Ducha Svätého.'
- n: 5
  text: Veríme, že muž musí byť povolaný Bohom, skrze proroctvo a skrze kladenie rúk tých, ktorí majú
    právomoc, aby kázal evanjelium a vykonával jeho obrady.
- n: 6
  text: Veríme v rovnakú organizáciu, ktorá existovala v prvotnej Cirkvi, menovite v apoštolov, prorokov,
    pastierov, učiteľov, evanjelistov, a tak ďalej.
- n: 7
  text: Veríme v dar jazykov, proroctva, zjavenia, videní, uzdravovania, vykladania jazykov, a tak ďalej.
- n: 8
  text: Veríme, že Biblia je slovo Božie, pokiaľ je preložená správne; veríme tiež, že Kniha Mormonova
    je slovo Božie.
- n: 9
  text: Veríme všetkému, čo Boh zjavil, všetkému, čo teraz zjavuje, a veríme, že ešte zjaví mnohé veľké
    a dôležité veci týkajúce sa kráľovstva Božieho.
- n: 10
  text: Veríme v doslovné zhromaždenie Izraela a v znovuzriadenie desiatich kmeňov; že Sion (Nový Jeruzalem)
    bude vybudovaný na americkom kontinente; že Kristus bude vládnuť osobne na zemi; a že zem bude obnovená
    a obdrží svoju rajskú slávu.
- n: 11
  text: Domáhame sa výsady uctievať Všemohúceho Boha podľa príkazov svojho vlastného svedomia a umožňujeme
    všetkým ľuďom rovnakú výsadu, nech uctievajú akokoľvek, kdekoľvek alebo čokoľvek si vyvolia.
- n: 12
  text: Veríme, že máme byť podriadení kráľom, prezidentom, vládcom a občianskym sudcom, v poslušnosti
    zákona, a že ho máme ctiť a podporovať.
- n: 13
  text: Veríme, že máme byť čestní, pravdiví, cudní, dobrotiví, cnostní a že máme činiť dobro všetkým
    ľuďom; vskutku, dalo by sa povedať, že nasledujeme napomenutie Pavlovo – veríme všetkým veciam, dúfame
    vo všetky veci, vytrvali sme v mnohých veciach a dúfame, že budeme schopní vytrvať vo všetkých veciach.
    Ak je čokoľvek cnostné, príjemné alebo dobrej povesti alebo chvályhodné, snažíme sa o to.
signature: Joseph Smith.
