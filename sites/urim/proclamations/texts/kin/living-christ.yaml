title: Kristo Uriho
subtitle: Ubuhamya bw’Intumwa
author: Itorero rya Yesu Kristo ry’Abera b’Iminsi ya Nyuma
paragraphs:
- Mu gihe twizihiza ivuka rya Yesu Kristo hashize ibinyagihumbi bibiri, dutanze ubuhamya bwacu bw’ugufatika
  kw’ubuzima Bwe butagereranywa n’ububasha budashira bw’igitambo Cye cy’impongano gikomeye. Nta wundi
  wigeze agira uruhare rwimbitse rutyo ku bantu babayeho ndetse n’abazabaho ku isi.
- Yari Yehova Ukomeye w’Isezerano rya Kera, Mesiya w’Irishya. Ayobowe na Se, yabaye umuremyi w’isi. “Ibintu
  byose byaremwe na we, kandi mu byaremwe byose nta na kimwe kitaremwe na we” (Yohana 1:3). Nubwo atagiraga
  icyaha, yarabatijwe kugira ngo yuzuze ubukiranutsi bwose. “Yagendaga agirira abantu neza” (Ibyakozwe
  n’Intumwa 10:38), ariko yarabisuzuguriwe. Inkuru nziza ye yari ubutumwa bw’amahoro n’ineza. Yingingiraga
  bose gukurikiza urugero Rwe. Yagenze mu mihanda ya Palestina, akiza abarwayi, atuma impumyi zibona,
  kandi ahagurutsa abapfuye. Yigishije ukuri kw’ubuzima buhoraho, ugufatika kw’ubuzima bwacu bwa mbere
  y’ivuka, n’intego y’ubuzima bwacu ku isi, n’ubushobozi bw’abahungu n’abakobwa b’Imana mu buzima buzaza.
- Yashyizeho isakaramentu nk’urwibutso rw’igitambo Cye cy’impongano gikomeye. Yarafashwe kandi acirwaho
  iteka ashinjwa ibinyoma, yemezwa icyaha ngo bashimishe abanyamvururu, nuko akatirwa gupfira ku musaraba
  i Nyabihanga. Yatanze ubuzima Bwe ngo ahongere ibyaha by’inyokomuntu yose. Impano ye ikomeye yatanzwe
  mu kigwi cy’abashobora bose kuzabaho igihe icyo ari cyo cyose ku isi.
- Turahamya ku mugaragaro ko ubuzima Bwe, ari bwo huriro ry’amateka ya muntu yose, butatangiriye i Betelehemu
  cyangwa ngo butanarangiriye i Nyabihanga. Yabaye Imfura ya Data, Umwana w’Ikinege mu mubiri, Umucunguzi
  w’isi.
- Yahagurutse mu mva ngo “abe umuganura w’abasinziriye” (1 Abakorinto 15:20). Nka Nyagasani Wazutse, yasuye
  abo yari yarakunze mu buzima. Yakoze kandi imirimo ku “zindi ntama Ze” (Yohana 10:16) muri Amerika ya
  kera. Muri iyi si ya none, We na Se babonekeye umuhungu Yozefu Smith, bitangiza ubusonga bw’ubwuzure
  bw’ibihe bwasezeranyijwe igihe kirekire (Abefeso 1:10).
- 'Kuri Kristo Uriho, Umuhanuzi Yozefu yaranditse ati: Amaso ye yari nk’ibishashi by’umuriro; umusatsi
  w’umutwe we wari umweru nk’urubura rukeye; mu maso he harabengeranaga kurusha ukurabagirana kw’izuba;
  n’ijwi rye rimeze nk’umuriri w’amazi magari asuma, ndetse ijwi rya Yehova rivuga riti:'
- Ndi uwa mbere n’uw’iherezo; ndi uriho, ndi uwishwe, ndi umuvugizi wanyu kuri Data (Inyigisho n’Ibihango
  110:3–4).
- 'Umuhanuzi kandi yamutangajeho ati: Kandi ubu, nyuma y’ubuhamya bwinshi bwamutanzweho, ubu nibwo buhamya,
  busoza ubundi bwose tumutanzeho: Ko ariho!'
- Kuko twaramubonye, ndetse iburyo bw’Imana; kandi twumvise ijwi rihamya ko ari Umwana w’Ikinege wa Data—
- Ko ku bwe, kandi binyuze muri we, no kuri we, amasi ariho kandi yararemwe, kandi abayatuyeho ni abahungu
  n’abakobwa b’Imana (Inyigisho n’Ibihango 76:22–24).
- Dutangaje ku mugaragaro ko ubutambyi Bwe n’Itorero Rye byagaruwe ku isi—“byubatse ku rufatiro … rw’intumwa
  n’abahanuzi, ariko Yesu Kristo ubwe ni we buye rikomeza imfuruka” (Abefeso 2:20).
- Turahamya ko umunsi umwe azagaruka ku isi. “Maze ikuzo rya Nyagasani rizahishurwa, kandi abantu bose
  bazaribonera rimwe” (Yesaya 40:5). Azategeka nk’Umwami w’Abami kandi azaba ku ngoma nka Nyagasani wa
  ba Nyagasani, kandi buri vi rizapfukama na buri rurimi ruzavuga ruramiriza imbere Ye. Buri wese muri
  twe azahagarara ngo acirwe urubanza na We hakurikijwe imirimo yacu n’ibyifuzo by’imitima yacu.
- Turahamya, nk’Intumwa ze zimitswe bikwiye—ko Yesu ari Kristo Uriho, Umwana w’Imana udapfa. Ni Umwami
  ukomeye Imanweli, uhagaze uyu munsi iburyo bwa Se. Ni urumuri, ubuzima, n’ibyiringiro by’isi. Inzira
  Ye ni yo nzira ijyana ku byishimo muri ubu buzima no mu buzima buhoraho mu isi izaza. Imana ishimwe
  kubera impano ntagereranywa y’Umwana Wayo mutagatifu.
