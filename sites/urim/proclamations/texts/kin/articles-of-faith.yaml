title: Ingingo z’Ukwizera
subtitle: z’ Itorero rya Yesu Kristo ry’Abera b’Iminsi ya Nyuma
author: ''
verses:
- n: 1
  text: Twemera Imana, Data Uhoraho, n’Umwana Wayo, Yesu Kristo, na Roho Mutagatifu.
- n: 2
  text: Twemera ko abantu bazahanwa kubera ibyaha byabo bwite, atari ukubera igicumuro cya Adamu.
- n: 3
  text: Twemera ko binyuze mu Mpongano ya Kristo, inyokomuntu yose ishobora kuzakizwa, kubw’ukumvira amategeko
    n’imigenzo by’Inkuru nziza.
- n: 4
  text: 'Twemera ko amahame n’imigenzo by’ibanze by’Inkuru nziza ari: icya mbere Ukwizera Nyagasani Yesu
    Kristo; icya kabiri, Ukwihana; icya gatatu, Umubatizo wo kwibizwa mu mazi kugira ngo hakurweho ibyaha;
    icya kane, Kurambikwaho ibiganza kugira ngo hatangwe impano ya Roho Mutagatifu.'
- n: 5
  text: Twemera ko umuntu agomba guhamagarwa n’Imana, kubw’ubuhanuzi, no kubw’ukurambikwaho ibiganza n’abafite
    ubushobozi, kugira ngo abwirize Inkuru Nziza kandi ayobore imigenzo yayo.
- n: 6
  text: Twemera imiyoborere imwe nk’iyabayeho mu Itorero rya kera, ari yo, intumwa, abahanuzi, abungeri,
    abigisha, ababwirizabutumwa, n’abandi.
- n: 7
  text: Twemera impano y’indimi, ubuhanuzi, uguhishurirwa, amayerekwa, ugukizwa indwara, ugusobanura indimi,
    n’ibindi.
- n: 8
  text: Twemera ko Bibiliya ari ijambo ry’Imana igihe cyose isemuwe neza; twemera kandi ko Igitabo cya
    Morumoni ari ijambo ry’Imana.
- n: 9
  text: Twemera ibyo Imana yahishuye byose, ibyo ihishura byose muri iki gihe kandi twemera ko izakomeza
    guhishura ibintu byinshi by’ingenzi kandi bikomeye byerekeye Ubwami bw’Imana.
- n: 10
  text: Twemera ikoranyirizwa hamwe nyaryo rya Isirayeli n’ukugarurwa kw’Imiryango Cumi; ko Siyoni (Yerusalemu
    Nshya) izubakwa ku mugabane wa Amerika; ko Kristo azaba ku ngoma ubwe ku isi; kandi, ko isi izahindurwa
    nshya kandi ikakira ikuzo ryayo rya paradizo.
- n: 11
  text: Twemeza uburenganzira bwo kuramya Imana Ishobora Byose dukurikije ibyo umutimanama wacu bwite
    utubwira, kandi twemerera abantu bose ubwo burenganzira, tukabareka bakaramya uko bashaka, aho bashaka,
    n’ibyo bashaka.
- n: 12
  text: Twemera kugengwa n’abami, abaperezida, abategetsi, n’abacamanza, mu kubumvira, kububaha, no gushyigikira
    itegeko.
- n: 13
  text: Twemera kuba inyangamugayo, abanyakuri, abaziranenge, abagiraneza, abakiranutsi, no gukorera ibyiza
    abantu bose; mu by’ukuri, dushobora kuvuga ko dukurikiza impanuro ya Pawulo—Twemera ibintu byose,
    twiringira ibintu byose, twihanganiye ibintu byinshi, kandi twiringira ko dushobora kwihanganira ibintu
    byose. Niba hariho ikintu cy’ubukiranutsi, cy’urukundo, cyangwa kivugwa neza, cyangwa gishimwa duharanira
    ibyo bintu.
signature: Yozefu Smith.
