slug: restoration
language: kin
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=kin
retrieved: '2026-11-02'
title: Ukugarurwa kw’Ubwuzure bw’Inkuru Nziza ya Yesu Kristo
subtitle: Itangazo ku Isi ry’Imyaka Magana Abiri
author: Ubuyobozi bwa Mbere n’Inteko y’Intumwa Cumi n’Ebyiri b’Itorero rya Yesu Kristo ry’Abera b’Iminsi
  ya Nyuma
note: Iri tangazo ryasomwe n’Umuyobozi Russell M. Nelson nk’igice cy’ubutumwa bwe mu Giterane Rusange
  Ngarukamwaka cya 190 kuwa 5 Mata 2020, mu Mujyi wa Salt Lake, Utah.
paragraphs:
- Dutangaje ku mugaragaro ko Imana ikunda abana Bayo muri buri bwoko bw’isi. Imana Data yaduhaye ukuvuka
  gutagatifu, ubugingo butagereranywa, n’igitambo cy’impongano kidashira cy’Umwana We Akunda, Yesu Kristo.
  Ku bw’ ububasha bwa Data, Yesu yongeye guhaguruka maze aronka intsinzi ku rupfu. Ni Umukiza wacu, Intangarugero
  yacu n’Umucunguzi wacu.
- Mu myaka magana abiri ishize, mu gitondo cyiza cy’umuhindo mu 1820, Yozefu Smith muto, ubwo yashakishaga
  kumenya itorero yayoboka, yagiye mu ishyamba gusenga hafi y’iwabo mu majyaruguru ya New York, Leta Zunze
  Ubumwe z’Amerika. Yari afite ibibazo birebana n’agakiza k’ubugingo bwe kandi yizeraga ko Imana izamuyobora.
- Mu bwiyoroshye, turatangaza ko mu gisubizo cy’isengesho rye, Imana Data n’Umwana Wayo, Yesu Kristo,
  babonekeye Yozefu nuko batangiza “isubiranywa ry’ibintu byose” (Ibyakozwe n’Intumwa 3:21) nk’uko byari
  byaravuzwe mbere muri Bibiliya. Muri iri yerekwa yamenye ko nyuma y’urupfu rw’Intumwa za mbere, Itorero
  ry’Isezerano Rishya rya Kristo ryazimiye mu isi. Yozefu yagombaga kuba igikoresho mu igaruka ryaryo.
- Turashimangira ko ziyobowe na Data na Mwana, intumwa zo mu ijuru zaje guha amabwiriza Yozefu no kongera
  gushyiraho Itorero rya Yesu Kristo. Yohana Umubatiza wazutse yagaruye ubushobozi bwo kubatiza bibiza
  kugira ngo hakurweho ibyaha. Batatu mu Ntumwa cumi n’ebyiri za mbere—Petero, Yakobo, na Yohana—bagaruye
  ukuba intumwa n’imfunguzo z’ubushobozi bw’ubutambyi. Abandi na bo baje, barimo Eliya, wagaruye ubushobozi
  bwo komatanya imiryango ubuziraherezo mu mibanire ihoraho itsinda urupfu.
- 'Turahamya kandi ko Yozefu Smith yahawe impano n’ububasha by’Imana byo gusemura inyandiko ya kera: Igitabo
  cya Morumoni—Irindi Sezerano rya Yesu Kristo. Impapuro z’iyi nyandiko ntagatifu zikubiyemo umurimo w’umwihariko
  wa Yesu Kristo mu bantu bo mu Gice cy’Uburengerazuba bw’isi nyuma gato y’Umuzuko We. Cyigisha iby’intego
  y’ubuzima kandi kigasobanura inyigisho ya Kristo, ari yo shingiro ry’uwo mugambi. Nk’icyanditswe cy’ingenzi
  cya Bibiliya, Igitabo cya Morumoni gihamya ko ibiremwa muntu byose ari abahungu n’abakobwa ba Data udukunda
  wo mu Ijuru, ko afite umugambi w’ubumana ku buzima bwacu, kandi ko Umwana We, Yesu Kristo, avuga uyu
  munsi nk’uko yabikoze mu minsi ya kera.'
- Turamenyekanisha ko Itorero rya Yesu Kristo ry’Abera b’Iminsi ya Nyuma, ryashyizweho kuwa 6 Mata 1830,
  ari Itorero ry’Isezerano Rishya rya Kristo ryagaruwe. Iri Torero rishingiye ku buzima butunganye bw’
  ibuye rikomeza imfuruka, Yesu Kristo, no ku Mpongano Ye idashira n’Umuzuko nyawo. Yesu Kristo yongeye
  kandi guhamagara Intumwa kandi aziha ubushobozi bw’ubutambyi. Aradutumirira twese kumusanga n’Itorero
  rye, kugira ngo twakire Roho Mutagatifu, imigenzo y’agakiza, kandi tubone umunezero urambye.
- Imyaka magana abiri ubu irahise kuva uku Kugarurwa gutangijwe n’Imana Data n’Umwana Wayo ikunda, Yesu
  Kristo. Amamiliyoni mu isi hose yakiriye ubumenyi bw’ibi bikorwa byahanuwe.
- Dushimishijwe no kumenyekanisha ko Ukugarurwa kwasezeranyijwe kujyana n’ihishurirwa rikomeza. Isi ntizongera
  kuba uko yahoze, nk’uko Imana “izakoranyiriza hamwe muri kimwe ibintu byose muri Kristo” (Abefeso 1:10).
- Hamwe n’icyubahiro n’ishimwe, twebwe nk’Intumwa Ze turatumirira bose kumenya—nk’uko tuzi—ko amajuru
  afunguye. Turashimangira ko Imana irimo kumenyesha ugushaka Kwayo abahungu n’abakobwa Bayo ikunda. Turahamya
  ko abigira mu isengesho ubutumwa bw’Ukugarurwa kandi bagakorera mu kwizera bazahabwa umugisha wo kuronka
  ubuhamya bwabo bwite bw’ubumana bwako n’umugambi wako wo gutegurira isi Ukuza kwa Kabiri kwasezeranyijwe
  kwa Nyagasani n’Umukiza wacu, Yesu Kristo.
