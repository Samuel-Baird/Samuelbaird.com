title: குடும்பம்
subtitle: உலகிற்கு ஓர் பிரகடனம்
author: பிற்காலப் பரிசுத்தவான்களின் இயேசு கிறிஸ்து சபையின் பிரதான தலைமையும் பன்னிரு அப்போஸ்தலர் குழுமமும்
note: இந்தப் பிரகடனமானது, யூட்டாவிலுள்ள சால்ட் லேக் சிட்டியில் 1995 செப்டம்பர் 23ல் நடந்த பொது ஒத்தாசைச்
  சங்கச் கூட்டத்தில், தலைவர் கார்டன் பி. ஹிங்க்லியால் அவரது செய்தியின் ஒரு பாகமாக வாசிக்கப்பட்டது.
paragraphs:
- பிற்காலப் பரிசுத்தவான்களின் இயேசு கிறிஸ்து சபையின் பிரதான தலைமையும் பன்னிரு அப்போஸ்தலர் குழுமமுமாகிய
  நாங்கள், ஓர் ஆணுக்கும் பெண்ணுக்குமிடையேயான திருமணமானது தேவனால் நியமிக்கப்பட்டது என்றும், தம்முடைய பிள்ளைகளின்
  நித்திய இலக்குக்கான சிருஷ்டிகரின் திட்டத்திற்கு குடும்பம்தான் மையமாயிருக்கிறது என்றும், பயபக்தியுடன்
  பிரகடனம் செய்கிறோம்.
- ஆணும் பெண்ணுமான, எல்லா மனுஷரும் தேவசாயலாய் சிருஷ்டிக்கப்பட்டிருக்கிறார்கள். ஒவ்வொருவரும் பரலோகப் பெற்றோர்களுக்கு
  பிரியமான ஆவிகுமாரனாகவோ அல்லது குமாரத்தியாகவோ இருப்பதால், ஒவ்வொருவருக்கும் தெய்வீகத் தன்மையும் இலக்கும்
  உண்டு. அநித்தியத்திற்கு முந்தைய, அநித்திய மற்றும் நித்திய அடையாளம் மற்றும் நோக்கத்திற்கு பாலினம் ஒருவருடைய
  முக்கிய தன்மையாய் இருக்கிறது.
- அநித்தியத்திற்கு முந்தைய இராஜ்யத்தில் ஆவி குமாரர்களும், குமாரத்திகளும் தேவனை தங்களது நித்திய பிதாவாக
  அறிந்து, அவரை ஆராதித்தார்கள். மேலும் அவருடைய பிள்ளைகள் மாம்ச சரீரத்தைப் பெற்று, பரிபூரணத்தை நோக்கி முன்னேறும்படி
  பூமியின் அனுபவத்தைப் பெற்று இறுதியாக, நித்திய ஜீவனின் சுதந்தரவாளிகளாக, தம்முடைய தெய்வீக இலக்கை அடையவும்,
  அவரது திட்டத்தை ஏற்றுக் கொண்டார்கள். தெய்வீக மகிழ்ச்சியின் திட்டம், குடும்ப உறவுகள் கல்லறைக்கு அப்பாலும்
  நீடித்திருக்கும்படி சாத்தியமாக்குகிறது. பரிசுத்த ஆலயங்களில் நடைபெறும் பரிசுத்த நியமங்களும், உடன்படிக்கைகளும்,
  ஒவ்வொருவரும் தேவ சமுகத்துக்குத் திரும்பிச் செல்வதற்கும், குடும்பங்கள் நித்தியமாய் இணைக்கப்படவும் சாத்தியமாக்குகின்றன.
- ஆதாமுக்கும் ஏவாளுக்கும் தேவன் கொடுத்த முதல் கட்டளை, கணவனும் மனைவியுமாக பெற்றோரத்துவத்துக்கான அவர்களது
  தகுதி சம்மந்தமானதாகும். பலுகிப் பெருகி பூமியை நிரப்புமாறு அவருடைய பிள்ளைகளுக்கு இடப்பட்ட தேவனின் கட்டளை
  இன்னமும் நடைமுறையில் உள்ளது என நாங்கள் அறிவிக்கிறோம். சந்ததியை விருத்தி செய்கிற பரிசுத்தமான வல்லமை,
  சட்டப்படி திருமணமான கணவனும் மனைவியுமாகிய ஆணுக்கும் பெண்ணுக்குமிடையில் மட்டுமே பிரயோகிக்கப்பட வேண்டும்
  என்று தேவன் கட்டளையிட்டிருக்கிறார் என மேலும் நாங்கள் அறிவிக்கிறோம்.
- அநித்திய ஜீவன் சிருஷ்டிக்கப்படும் வழிகள் தெய்வீகத்தால் நியமிக்கப்பட்டது என்று நாங்கள் அறிவிக்கிறோம்.
  தேவனுடைய நித்திய திட்டத்திலுள்ள வாழ்க்கையின் பரிசுத்தத்தையும் அதனுடைய முக்கியத்துவத்தையும் நாங்கள் உறுதிப்படுத்துகிறோம்.
- கணவனும் மனைவியும் ஒருவரிலொருவரும் மற்றும் அவர்களது பிள்ளைகளிடத்திலும் அன்புகூர்ந்து, பராமரிக்கும்படியான
  பயபக்தியான பொறுப்பைக் கொண்டிருக்கின்றனர். “பிள்ளைகள் கர்த்தரால் வரும் சுதந்தரம்” (சங்கீதம் 127:3) தங்கள்
  பிள்ளைகளை அன்பிலும் நீதியிலும் வளர்க்கும்படியும், அவர்களுடைய சரீரப்பிரகார மற்றும் ஆவிக்குரிய தேவைகளை
  அளிக்கும்படியும், ஒருவரையொருவர் நேசித்து, ஒருவருக்கொருவர் சேவை செய்யவும், தேவனுடைய கட்டளைகளைக் கைக்கொள்ளவும்,
  அவர்கள் எங்கு வசித்தாலும் அங்குள்ள சட்டத்தைப் பின்பற்றும் ஜனமாக இருக்கவும், கற்றுக் கொடுக்கும்படியான
  ஓர் பரிசுத்த கடமை பெற்றோர்களுக்கு உண்டு. இந்த கடமைகளை நிறைவேற்றுவதில் கணவன்களும், மனைவிகளும், தாய் தந்தையரும்
  தேவனுக்கு முன்பாக உத்தரவாதிகளாயிருப்பார்கள்.
- குடும்பம் தேவனால் நியமிக்கப்பட்டிருக்கிறது. ஆணுக்கும் பெண்ணுக்குமிடையேயான திருமணம், அவருடைய நித்திய
  திட்டத்துக்கு இன்றியமையாததாகும். திருமண பந்தத்துக்குள்ளேயே பிறக்கவும், முழுமையான இணக்கமுடன் திருமண உறுதிமொழிகளை
  மதிக்கிற தகப்பனாலும் தாயாலும் வளர்க்கப்படவும், பிள்ளைகள் உரிமை பெற்றுள்ளனர். குடும்ப ஜீவியத்தின் மகிழ்ச்சி,
  கர்த்தராகிய இயேசுகிறிஸ்துவின் போதனைகளின் அடிப்படையில் அமைக்கப்படும்போதுதான் அடையப்படக் கூடும். விசுவாசம்,
  ஜெபம், மனந்திரும்புதல், மன்னித்தல், மரியாதை, அன்பு, இரக்கம், வேலை மற்றும் ஆரோக்கியமான பொழுதுபோக்கு நிகழ்ச்சிகள்
  போன்ற கொள்கைகளின் மீது வெற்றிகரமான திருமணங்களும், குடும்பங்களும் ஸ்தாபிக்கப்பட்டு பராமரிக்கப்படுகிறது.
  தெய்வீக வடிவமைப்பில் தந்தையர் தங்கள் குடும்பங்களுக்கு அன்பிலும், நீதியிலும் தலைமைதாங்க வேண்டுமென்பதும்
  வாழ்க்கைக்கான தேவைகளையும், தங்களது குடும்பங்களுக்கான பாதுகாப்பையும், அளிக்க பொறுப்புள்ளவர்களாய் இருக்க
  வேண்டும். தாய்மார்கள், அவர்களது பிள்ளைகளைப் போஷித்தலில் பிரதான பொறுப்புடையவர்கள். இந்தப் பரிசுத்த பொறுப்புகளில்
  தாய் தந்தையர் ஒருவருக்கொருவர் சமபங்குடையவர்களாக உதவுவதற்கு கடமைப்பட்டவர்கள். ஊனம், மரணம் அல்லது பிற
  சூழ்நிலைகள் தனிப்பட்ட மாற்றங்களைச் செய்யும் தேவையை ஏற்படுத்தலாம். பிற உறவினர்கள், தேவைப்படும்பொழுது
  ஆதரவு அளிக்க வேண்டும்.
- கற்புடைமை உடன்படிக்கையை மீறுகிறவர்களும், துணைவரையோ அல்லது பிள்ளைகளையோ துர்ப்பிரயோகம் செய்கிறவர்களும்,
  அல்லது குடும்பப் பொறுப்பை நிறைவேற்றத் தவறுகிறவர்களும், ஒருநாள் தேவனுக்கு முன்பாக பொறுப்பேற்க வேண்டுமென்று
  நாங்கள் எச்சரிக்கிறோம். பூர்வகால மற்றும் தற்கால தீர்க்கதரிசிகள் முன்னறிவித்தபடி, குடும்பச் சிதைவு, தனிப்பட்டவர்கள்,
  சமுதாயங்கள் மற்றும் தேசங்கள் மீதும் சேதங்களை விளைவிக்கும் என்று நாங்கள் மேலும் எச்சரிக்கிறோம்.
- சமுதாயத்தின் அடிப்படை அங்கமாக குடும்பத்தைப் பராமரித்து பெலப்படுத்தவும், வடிவமைக்கப்பட்ட நடவடிக்கைகளை
  ஊக்குவிக்குமாறு எங்கெங்குமுள்ள பொறுப்புள்ள பிரஜைகளையும், அரசாங்க அதிகாரிகளையும் நாங்கள் அழைக்கிறோம்.
