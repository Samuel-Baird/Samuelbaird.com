title: யின் விசுவாசப் பிரமாணங்கள்
subtitle: பிற்காலப் பரிசுத்தவான்களின் இயேசு கிறிஸ்து சபை
author: ''
verses:
- n: 1
  text: நித்திய பிதாவாகிய தேவனையும், அவருடைய குமாரனாகிய இயேசு கிறிஸ்துவையும், பரிசுத்த ஆவியையும் நாங்கள்
    விசுவாசிக்கிறோம்.
- n: 2
  text: தங்களுடைய பாவங்களுக்கேயன்றி, ஆதாமின் மீறுதலுக்காக மனுஷர்கள் தண்டிக்கப்படமாட்டார்களென நாங்கள் விசுவாசிக்கிறோம்.
- n: 3
  text: சுவிசேஷத்தின் பிரமாணங்களுக்கும், நியமங்களுக்கும் கீழ்ப்படிவதனால் கிறிஸ்துவின் பாவநிவர்த்தி மூலமாக
    முழுமனுக்குலமும் இரட்சிக்கப்படுமென நாங்கள் விசுவாசிக்கிறோம்.
- n: 4
  text: முதலாவதாக கர்த்தராகிய இயேசு கிறிஸ்துவை விசுவாசித்தல், இரண்டாவதாக மனந்திரும்புதல், மூன்றாவதாக பாவங்களின்
    மீட்பிற்காக முழுக்கு ஞானஸ்நானம் பெறுதல், நான்காவதாக பரிசுத்த ஆவியின் வரத்திற்காக கைகள் வைக்கப்படுதல்,
    சுவிசேஷத்தின் முதல் கொள்கைகளாகவும் நியமங்களாகவும் இருக்கின்றன என நாங்கள் விசுவாசிக்கிறோம்.
- n: 5
  text: தீர்க்கதரிசனத்தாலும், சுவிசேஷத்தைப் பிரசங்கிக்கவும் அதிலுள்ள நியமங்களை நிர்வகிக்கவும் அதிகாரமுள்ளவர்களால்
    கைகள் வைக்கப்படுவதாலும், ஒரு மனுஷன் தேவனால் அழைக்கப்படவேண்டுமென நாங்கள் விசுவாசிக்கிறோம்.
- n: 6
  text: அப்போஸ்தலர்கள், தீர்க்கதரிசிகள், சுவிசேஷகர்கள், மேய்ப்பர்கள், போதகர்கள் முதலியோர் ஆதிகால சபையில்
    இருந்ததைப்போன்ற அதே ஸ்தாபனத்தை நாங்கள் விசுவாசிக்கிறோம்.
- n: 7
  text: பாஷைகளின் வரங்கள், தீர்க்கதரிசனம், வெளிப்படுத்தல், தரிசனம், குணமாக்குதல், பாஷைகளின் வியாக்கியானம்
    மற்றும் அவற்றைப் போன்றவற்றையும் நாங்கள் நம்புகிறோம்.
- n: 8
  text: வேதாகமம் சரியாக மொழிபெயர்க்கப்பட்டவரை அது தேவனின் வார்த்தையாயிருக்கிறதென நாங்கள் விசுவாசிக்கிறோம்;
    மார்மன் புஸ்தகம் தேவனின் வார்த்தையாயிருக்கிறது எனவும் நாங்கள் விசுவாசிக்கிறோம்.
- n: 9
  text: தேவன் வெளிப்படுத்திய சகலத்தையும், இப்பொழுது அவர் வெளிப்படுத்துகிற சகலத்தையும் நாங்கள் விசுவாசிக்கிறோம்,
    இன்னும் அவர் வெளிப்படுத்தப்போகிற தேவ ராஜ்யத்திற்கு சம்பந்தப்பட்ட அநேக மகத்தான முக்கியமான காரியங்களையும்
    நாங்கள் விசுவாசிக்கிறோம்.
- n: 10
  text: இஸ்ரவேலின் நேரடியான கூடுகையையும், பத்து கோத்திரத்தாரின் திரும்பிவருதலையும், அமெரிக்க கண்டத்தின்மேல்
    சீயோன் (புதிய எருசலேம்) கட்டப்படுமெனவும்; பூமியின்மேல் கிறிஸ்து தானே ஆளுகை செய்வாரெனவும்; பூமி புதுப்பிக்கப்பட்டு
    தன் பரதீசின் மகிமையைப் பெறுமெனவும்; நாங்கள் விசுவாசிக்கிறோம்.
- n: 11
  text: எங்கள் சொந்த மனசாட்சியின் சுயாதீனப்படி சர்வ வல்லமையுள்ள தேவனை ஆராதிக்கும் சிலாக்கியத்தையும் நாங்கள்
    உரிமை கோருகிறோம், சகல மனுஷருக்கும் அதே சிலாக்கியத்தை அனுமதிக்கிறோம், எவ்விதமாயும், எங்கேயும் அல்லது
    எதையும் அவர்கள் விரும்புகிறபடி ஆராதிப்பார்களாக.
- n: 12
  text: கீழ்ப்படிதலிலும், கனம்பண்ணுவதிலும், சட்டத்தை ஆதரிப்பதிலும் ராஜாக்களுக்கும், ஜனாதிபதிகளுக்கும்,
    அதிபதிகளுக்கும், நீதிபதிகளுக்கும் கீழ்ப்படிந்திருத்தலை நாங்கள் விசுவாசிக்கிறோம்.
- n: 13
  text: நேர்மையாயும், உண்மையாயும், கற்புடமையாயும், நன்மை செய்பவர்களாயும், நற்குணமுள்ளவர்களாயிருப்பதையும்,
    சகல மனுஷர்களுக்கும் நன்மை செய்வதையும், நாங்கள் விசுவாசிக்கிறோம், உண்மையில் பவுலின் எச்சரிக்கையை நாங்கள்
    பின்பற்றுகிறோமென நாங்கள் சொல்லக்கூடும், சகல காரியங்களையும் நாங்கள் விவாசிக்கிறோம், சகல காரியங்களையும்
    நாங்கள் நம்புகிறோம், அநேகக் காரியங்களை நாங்கள் சகித்துக்கொள்கிறோம், சகல காரியங்களையும் தாங்கிக்கொள்ள
    முடியுமென நம்புகிறோம். உத்தமமானவை, அழகானவை அல்லது, நற்கீர்த்தியுள்ளவை அல்லது, புகழத்தக்கவை எதாவதிருந்தால்
    அந்தக் காரியங்களை நாங்கள் நாடுகிறோம்.
signature: ஜோசப் ஸ்மித்.
