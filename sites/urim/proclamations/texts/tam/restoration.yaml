title: இயேசு கிறிஸ்துவின் சுவிசேஷத்தின் முழுமையின் மறுஸ்தாபிதம்
subtitle: உலகிற்கு ஓர் இருநூற்றாண்டு பிரகடனம்
author: பிற்காலப் பரிசுத்தவான்களின் இயேசு கிறிஸ்து சபையின் பிரதான தலைமையும் பன்னிரு அப்போஸ்தலர் குழுமமும்.
note: ஏப்ரல் 5, 2020ல் சால்ட் லேக் சிட்டி, யூட்டாவில் நடைபெற்ற 190வது வருடாந்தர பொது மாநாட்டில், தலைவர்
  ரசல் எம். நெல்சனின் செய்தியின் பகுதியாக இந்த பிரகடனம் வாசிக்கப்பட்டது.
paragraphs:
- உலகத்தின் ஒவ்வொரு தேசத்திலுமுள்ள தமது பிள்ளைகளையும் தேவன் நேசிக்கிறாரென நாங்கள் பயபக்தியோடே பிரகடனம்
  செய்கிறோம். தெய்வீக பிறப்பையும், ஒப்பிடமுடியாத ஜீவியத்தையும், அவருடைய நேச குமாரனாகிய இயேசு கிறிஸ்துவின்
  எல்லையில்லா பாவநிவாரண பலியையும் பிதாவாகிய தேவன் நமக்குக் கொடுத்திருக்கிறார். பிதாவின் வல்லமையினால் இயேசு
  மீண்டும் உயிர்த்தெழுந்து மரணத்தின்மேல் ஜெயம் கொண்டார். அவரே நமது இரட்சகர், நமது உதாரணர், நமது மீட்பர்.
- இருநூறு ஆண்டுகளுக்கு முன், 1820வது ஆண்டில், ஒரு அழகான வசந்தகால காலையில், இளம் ஜோசப் ஸ்மித் எந்த சபையில்
  சேருவதென்பதை அறிய, அ.ஐ.நாட்டின் நியூயார்க்கின் புறநகரில் அவருடைய வீட்டிற்கருகிலுள்ள, காட்டுக்கு ஜெபிக்க
  சென்றார். தன் ஆத்துமாவின் இரட்சிப்பைப்பற்றிய கேள்விகள் அவரிடம் இருந்தன, மற்றும் தேவன் தம்மை வழிநடத்துவாரென்று
  நம்பினார்.
- அவருடைய ஜெபத்திற்குப் பதிலாக, பிதாவாகிய தேவனும் அவருடைய குமாரனாகிய இயேசு கிறிஸ்துவும் ஜோசப்புக்குத்
  தரிசனம் தந்து, வேதாகமத்தில் முன்னறிவிக்கப்பட்டபடி “நிறைவேறித்தீரும் காலங்களை” (அப்போஸ்தலருடைய நடபடிகள்
  3:21) தொடங்கி வைத்தனர் என்றும் நாங்கள் தாழ்மையோடு அறிவிக்கிறோம். இந்த தரிசனத்தில், முதல் அப்போஸ்தலர்களின்
  மரணத்தைத் தொடர்ந்து, கிறிஸ்துவின் புதிய ஏற்பாட்டு சபை பூமியிலிருந்து காணாமற்போனது என்பதை, அவர் அறிந்தார்.
  அது திரும்ப வருவதற்கு ஜோசப் கருவியாயிருப்பார்.
- பிதா மற்றும் குமாரனின் வழிகாட்டுதலின் கீழ், ஜோசப்புக்கு அறிவுறுத்தவும், இயேசு கிறிஸ்துவின் சபையை மறுபடியும்
  நிறுவவும் பரலோக தூதுவர்கள் வந்தார்களென்று நாங்கள் உறுதியளிக்கிறோம். பாவங்களின் மன்னிப்புக்காக முழுக்கு
  ஞானஸ்நானம் கொடுக்கும் அதிகாரத்தை உயிர்த்தெழுந்த யோவான் ஸ்நானன் மறுஸ்தாபிதம் செய்தான். முதல் பன்னிரு
  அப்போஸ்தலர்களில் மூவரான பேதுரு, யாக்கோபு மற்றும் யோவான், அப்போஸ்தலத்துவத்தையும், ஆசாரியத்துவ அதிகாரத்தின்
  திறவுகோல்களையும் மறுஸ்தாபிதம் செய்தார்கள். மரணத்தைக் கடந்த நித்திய உறவுகளில் குடும்பங்களை என்றென்றும்
  ஒன்றாக இணைக்க, அதிகாரத்தை மறுஸ்தாபிதம் செய்த எலியா உள்ளிட்ட பிறரும் வந்தனர்.
- இயேசு கிறிஸ்துவின் மற்றொரு ஏற்பாடாகிய மார்மன் புஸ்தகம் என்னும் பூர்வகால பதிவேட்டை மொழிபெயர்க்க தேவனுடைய
  வரமும் வல்லமையும் ஜோசப் ஸ்மித்துக்குக் கொடுக்கப்பட்டது என மேலும் நாங்கள் சாட்சியமளிக்கிறோம். அவரது உயிர்த்தெழுதலுக்குப்
  பின் உடனேயே, மேற்கு கோளத்திலுள்ள ஜனங்களுக்கு மத்தியில் இயேசு கிறிஸ்துவின் தனிப்பட்ட ஊழியத்தைப்பற்றிய
  விவரத்தையும் இந்த பரிசுத்த ஆவணத்தின் பக்கங்கள் உள்ளடக்கியுள்ளன. இது வாழ்க்கையின் நோக்கத்தை போதித்து,
  அந்த நோக்கத்திற்கு மையமாயிருக்கிற கிறிஸ்துவின் கோட்பாட்டை விளக்குகிறது. வேதாகமத்துக்கு இணை வேதமாக, மார்மன்
  புஸ்தகம், மனுஷர் யாவரும் அன்பான பரலோக பிதாவின் குமாரர்கள் மற்றும் குமாரத்திகள் எனவும், நமது வாழ்க்கைக்கு
  அவரிடம் ஒரு தெய்வீகத் திட்டமிருக்கிறதென்றும், பழங்காலத்தைப் போலவே, இன்றும் அவருடைய குமாரனாகிய இயேசு
  கிறிஸ்து பேசுகிறாரென்றும் சாட்சியமளிக்கிறது.
- ஏப்ரல் 6, 1830ல் அமைக்கப்பட்ட பிற்காலப் பரிசுத்தவான்களின் இயேசு கிறிஸ்து சபை, மறுஸ்தாபிதம் செய்யப்பட்ட
  கிறிஸ்துவின் புதிய ஏற்பாட்டு சபை என நாங்கள் பிரகடனம் செய்கிறோம். இந்த சபை அதன் பிரதான மூலைக்கல்லான இயேசு
  கிறிஸ்துவின் பரிபூரண ஜீவியத்திலும், அவருடைய எல்லையற்ற பாவநிவர்த்தியிலும் நிதர்சனமான உயிர்த்தெழுதலிலும்
  நங்கூரமிடப்பட்டுள்ளது. மீண்டும் ஒருமுறை இயேசு கிறிஸ்து அப்போஸ்தலர்களை அழைத்து அவர்களுக்கு ஆசாரியத்துவ
  அதிகாரத்தைக் கொடுத்திருக்கிறார். பரிசுத்த ஆவியையும், இரட்சிப்பின் நியமங்களையும் பெறவும், நிலையான சந்தோஷத்தை
  அடையவும், அவரிடத்திலும் அவருடைய சபையினிடத்திலும் வர நம் அனைவரையும் அவர் அழைக்கிறார்.
- பிதாவாகிய தேவனாலும், அவருடைய நேச குமாரனாகிய இயேசு கிறிஸ்துவாலும் இந்த மறுஸ்தாபிதம் ஆரம்பிக்கப்பட்டதிலிருந்து
  இப்போது இருநூறு ஆண்டுகள் கடந்துவிட்டன. இந்த தீர்க்கதரிசனமுரைக்கப்பட்ட நிகழ்வுகள் குறித்த அறிவை உலகமுழுவதிலுமுள்ள
  மில்லியன் கணக்கானோர் தழுவிக்கொண்டுள்ளனர்.
- தொடர்ச்சியான வெளிப்படுத்தல் மூலமாக வாக்குத்தத்தம் செய்யப்பட்ட மறுஸ்தாபிதம் முன்னோக்கி செல்கிறது என நாங்கள்
  மனமகிழ்ச்சியுடன் பிரகடனம் செய்கிறோம். தேவன் “சகலமும் கிறிஸ்துவுக்குள்ளே கூட்டப்படும்போது” (எபேசியர்
  1:10) பூமி மீண்டும் ஒருபோதும் இப்போது போலிருக்காது.
- பரலோகங்கள் திறந்திருக்கின்றன என நாங்கள் அறிந்திருப்பதைப்போல அனைவரும் அறிய அவருடைய அப்போஸ்தலர்களாக பயபக்தியுடனும்
  நன்றியுணர்வுடனும் நாங்கள் அழைக்கிறோம். அவருடைய நேச குமாரர்களுக்கும் குமாரத்திகளுக்குமான தம்முடைய சித்தத்தை
  தேவன் தெரியப்படுத்துகிறார் என்பதை நாங்கள் உறுதியளிக்கிறோம். மறுஸ்தாபிதத்தின் செய்தியை ஜெபத்துடன் படித்து
  விசுவாசத்தில் செயல்படுகிறவர்கள், அதன் தெய்வீகத்தைப்பற்றியும் நம்முடைய கர்த்தரும் இரட்சகருமான இயேசு கிறிஸ்துவின்
  வாக்குத்தத்தம் செய்யப்பட்ட இரண்டாம் வருகைக்காக உலகத்தை ஆயத்தப்படுத்தும் அதன் நோக்கத்தைப்பற்றியும் தங்களுடைய
  சொந்த சாட்சியைப் பெறுவார்கள் என நாங்கள் சாட்சியமளிக்கிறோம்.
