title: ቤተሰብ
subtitle: ለአለም የተላለፈ አዋጅ
author: የኋለኛው ቀን ቅዱሳን የኢየሱስ ክርስቶስ ቤተክርስትያን ቀዳሚ አመራር እና አስራ ሑለት ሐዋሪያት ሸንጎ
note: ይህ አዋጅ በሶልት ሌክ ከተማ፣ ዩታ በመስከረም 23፣ 1995 (እ.አ.አ) በተካሄደው በአጠቃላይ የሴቶች መረዳጃ ማህበር ስብሰባ ውስጥ እንደ ንግግራቸው
  ክፍል በፕሬዘደንት ጎርደን ቢ. ሒንክሊ የተነበበ ነበር።
paragraphs:
- እኛ፣ የኋለኛው ቀን ቅዱሳን የኢየሱስ ክርስቶስ ቤተክርስቲያን ቀዳሚ አመራር እና የአስራ ሁለቱ ሐዋርያት ሸንጎ፣ በእርጋታ በወንድ እና በሴት መካከል የሚፈጸም
  ጋብቻ በእግዚአብሔር ስርዓት የተመሰረተ እንደሆነ እና ቤተሰብም ፈጣሪው ለልጆቹ ላለው ዘለአለማዊ እጣ ፈንታ አላማ ዋና ክፍል እንደሆነም እንገልጻለን።
- የሰው ልጆች በሙሉ—ወንዶችና ሴቶች—የተፈጠሩት በእግዚአብሔር አምሳል ነው። እያንዳንዱም በሰማይ ወላጆች የተወደዱ የመንፈስ ሴት እና ወንድ ልጆች ናቸው፣ እናም
  ይህ ስለሆነም፣ እያንዳንዱ መለኮታዊ ተፈጥሮ እና ፍጻሜ አላቸው። ጾታም አስፈላጊ የሆነ የግለሰብ ቅድመ ምድራዊ፣ ምድራዊና ዘለአለማዊ ማንነት መለያ እንዲሁም አላማ
  እና ባህሪ ነው።
- በቅድመ ምድራዊ ህይወት ውስጥ፣ የመንፈስ ወንድ እና ሴት ልጆች እግዚአብሔርን እንደ ዘለአለማዊ አባታቸው ያውቁትም ያመልኩትም ነበር፣ እንዲሁም ልጆቹ ስጋዊ አካልን
  አግኝተው ምድራዊ ተሞክሮዎችን በማግኘት ወደ ፍጹምነት ለማደግ እና በመጨረሻም እርሱ ወይም እርሷ እንደ መለኮታዊ እጣቸው ዘለአለማዊ ህይወትን ወራሽ እንዲሆኑ የሚያደርግ
  አላማውን ተቀብለው ነበር። መለኮታዊው የደስታ እቅድ የቤተሰብ ግንኙነቶች ከመቃብር ባሻገር እንዲቀጥሉም ያስችላል። በቅዱስ ቤተመቅደሶች የሚገኙትም ቅዱስ ስርዓቶች
  እና ቃል ኪዳኖች፣ ግለሰቦች ወደ እግዚአብሔር ፊት እንዲመለሱ እና ቤተሰቦችም ለዘለአለም እንዲጣመሩ ያስችሏቸዋል።
- እግዚአብሔር ለአዳም እና ለሔዋን የሰጠው የመጀመሪያው ትእዛዝ እንደ ባልና ሚስት ያላቸውን የወላጅነት አቅም የሚመለከት ነበር። እግዚአብሔር ልጆቹ እንዲባዙ እና
  ምድርን እንዲሞሉ የሰጠው ትእዛዝ አሁንም ተግባራዊ ነው ብለን እናውጃለን። የተቀደሱት የመዋለድ ሀይሎች እንደ ባልና ሚስት በህግ በተጋቡ ወንዶች እና ሴቶች መካከል
  ብቻ መፈጸም እንዳለበትም እግዚአብሔር እንዳዘዘ ጨምረን እናውጃለን።
- ሟች ህይወት የሚፈጠርበት መንገድም በመለኮታዊ የተወሰነ እንደሆነም እናውጃለን። የህይወትን ቅድስና እና በእግዚአብሔር ዘለአለማዊ እቅድ ውስጥ ያለውን አስፈላጊነትም
  እናረጋግጣለን።
- ባል እና ሚስት አንዳቸው ሌላውን እንዲሁም ልጆቻቸውን የመውደድ እና የመንከባከብ ሀላፊነት አለባቸው። “ልጆች የእግዚአብሔር ስጦታ ናቸው” (መዝሙር 127፥3)።
  ወላጆች ልጆቻቸውን በፍቅር እና በፅድቅ የማሳደግ፣ እንዲሁም የስጋዊ እና የመንፈሳዊ ፍላጎታቸውን የማሟላት፣ እርስ በርስ እንዲዋደዱ እና እንዲያገለግሉ፣ የእግዚአብሔርን
  ትእዛዛት እንዲያከብሩ እና በሚኖሩበት ቦታ ህግ አክባሪ ዜጎች እንዲሆኑ የማስተማር ሀላፊነት አለባቸው። ባሎች እና ሚስቶች—እናቶች እና አባቶች—እነዚህን ኃላፊነቶች
  በመወጣት ረገድ በእግዚአብሔር ፊት ተጠያቂዎች ይሆናሉ።
- ቤተሰብ በእግዚአብሔር ስርዓት የተመሰረተ ነው። በወንድ እና ሴት መካከል የሚፈጸም ጋብቻ በዘለአለማዊ እቅዱ ውስጥ በጣም አስፈላጊ ነው። ልጆችም በጋብቻ ጥምረቶች
  ውስጥ የመውለድ፣ እንዲሁም የጋብቻ ቃል ኪዳናቸውን በሙሉ ታማኝነት በሚያከብሩ አባት እና እናት የማደግ መብት አላቸው። በቤተሰብ ህይወት ውስጥ ደስታ የሚገኘው፣
  ቤተሰብ በጌታ ኢየሱስ ክርስቶስ ትምህርት በኩል ሲገነባ ነው። ስኬታማ ጋብቻዎች እና ቤተሰቦች የሚመሰረቱት እና የሚጸኑት በእምነት፣ በጸሎት፣ ንስሀ በመግባት፣
  በምህረት፣ በክብር፣ በፍቅር፣ በርህራሄ፣ በስራ እና ጤናማ በሆኑ የመዝናኛ እንቅስቃሴዎች መሰረት በኩል ነው። በመለኮታዊ እቅድ፣ አባቶች በፍቅር እና በፅድቅ ቤተሰቦቻቸውን
  ያስተዳድራሉ እንዲሁም ለቤተሰቦቻቸው ለመኖር አስፈላጊ የሆኑ ፍላጎቶችን የማሟላት እና ጥበቃ የማድረግ ሀላፊነት አለባቸው። እናቶች በቀደምትነት ልጆቻቸውን የመንከባከብ
  ሀላፊነት አለባቸው። በእነዚህ ቅዱስ ሀላፊነቶችም፣ አባቶች እና እናቶች በእኩል አጋርነታቸው የመረዳዳት ሀላፊነት አለባቸው። የአካል ጉዳት፣ ሞት ወይም ሌሎች ሁኔታዎች
  አንድ ግለሠብ ማስተካከያ እንዲያደርግ ሊያስገድዱት ይችላሉ። የቅርብ ዘመዶችና ቤተሰቦችም አስፈላጊ ሲሆን እርዳታ መስጠት ይገባቸዋል።
- የንፅህና ህግ ቃል ኪዳንን የሚጥሱ፣ ባለቤቶቻቸውን ወይም ልጅቻቸውን የሚበድሉ፣ ወይም የቤተሰብ ሀላፊነታቸውን የማይወጡ ሁሉ አንድ ቀን በእግዚአብሔር ፊት ተጠያቂ
  እንደሚሆኑ እናስጠነቅቃለን። በተጨማሪም፣ የቤተሰብ መፈራረስ በግለሰብ፣ በህብረተሰብ፣ እናም በአገራት ላይ በጥንት እና በዘመኑ ነቢያት አስቀድመው የተነገሩትን
  ጥፋቶች እንደሚያመጡባቸውም እናስጠነቅቃለን።
- በየትም ስፍራ ላሉ ሀላፊነት ላለባቸው ዜጎች እና የመንግስት ባለስልጣናት ቤተሰብ የማህብረሰብ ዋና መሰረታዊ ክፍል እንዲሆን እና እንዲጠናከር እርምጃዎችን እንዲወስዱም
  ጥሪ እናቀርባለን።
