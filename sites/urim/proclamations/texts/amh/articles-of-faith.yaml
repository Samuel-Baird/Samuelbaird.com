title: የእምነት አንቀጾች
subtitle: የኋለኛው ቀን ቅዱሳን የኢየሱስ ክርስቶስ ቤተክርስቲያን
author: ''
verses:
- n: 1
  text: በዘለአለማዊ አባት እግዚአብሔር፣ በልጁ ኢየሱስ ክርስቶስ፣ እናም በመንፈስ ቅዱስ እናምናለን።
  label: ፩
- n: 2
  text: በአዳም መተላለፍ ሳይሆን፣ ሰዎች በራሳቸው ኃጢአት እንደሚቀጡ እናምናለን።
  label: ፪
- n: 3
  text: የወንጌሉን ህግጋትና ስርዓቶችን በማክበር፣ የሰው ዘር ሁሉ በክርስቶስ የኃጢአት ክፍያ አማካይነት መዳን እንደሚችሉ እናምናለን።
  label: ፫
- n: 4
  text: የወንጌሉ ቀዳሚ መሰረታዊ መርሆችና ስርዓቶች፥ አንደኛ፣ በጌታ ኢየሱስ ክርስቶስ እምነት፤ ሁለተኛ፣ ንስሐ መግባት፤ ሶስተኛ፣ ለኃጢአት ስርየት በመጥለቅ
    መጠመቅ፤ አራተኛ፣ የመንፈስ ቅዱስን ስጦታ ለመስጠት እጆችን መጫን እንደሆኑ እናምናለን።
  label: ፬
- n: 5
  text: ሰው ወንጌሉን ለመስበክና በወንጌሉ ስርዓትም ለማገልገል በትንቢትና ስልጣን ባላቸው ሰዎች እጆችን በመጫን በእግዚአብሔር መጠራት እንዳለበት እናምናለን።
  label: ፭
- n: 6
  text: በጥንቷ ቤተክርስቲያን እንደነበረው አንድ አይነት ድርጅት፣ በስምም በሐዋርያት፣ በነቢያት፣ በአገልጋዮች፣ በአስተማሪዎች፣ በወንጌል ሰባኪዎችና፣ በሌሎችም፣
    እናምናለን።
  label: ፮
- n: 7
  text: በልሳን ስጦታ፣ በትንቢት፣ በራዕይ፣ በመገለጥ፣ በመፈወስ፣ ልሳንን በመተርጎም፣ እናም፤ በመሳሰሉት ስጦታዎችም እናምናለን።
  label: ፯
- n: 8
  text: በትክክል እስከተተረጎመ ድረስ፣ መፅሐፍ ቅዱስ የእግዚአብሔር ቃል እንደሆነ እናምናለን፤ ደግሞም መፅሐፈ ሞርሞንም የእግዚአብሔር ቃል እንደሆነ እናምናለን።
  label: ፰
- n: 9
  text: እግዚአብሔር እስካሁን በገለጣቸው ሁሉ፣ አሁንም በሚገልጣቸው ሁሉ እናምናለን፣ እናም የእግዚአብሔርን መንግስት በተመለከተ ወደፊትም እርሱ በሚገልጣቸው
    ታላቅና አስፈላጊ ነገሮችም እናምናለን።
  label: ፱
- n: 10
  text: ስለእስራኤል መሰብሰብና ስለ አስሩ ነገዶች ዳግሞ መመለስ፣ ፅዮንም (አዲሲቷ ኢየሩሳሌም) በአሜሪካ ክፍለ አህጉር እንደምትገነባ፣ ክርስቶስ እራሱም በምድር
    ላይ እንደሚነግስ፣ እናም ምድርም ታድሳ ገነታዊ ክብሯን እንደምትቀበልም እናምናለን።
  label: ፲
- n: 11
  text: ሁሉን የሚገዛው እግዚአብሔርን ህሊናችን እንደሚመራን የማምለክ መብት እንዳለን እናረጋግጣለን፣ እናም ሁሉም ሰዎች እንዴትም፣ የትም፣ ወይም ምንም የፈለጉትን
    ምንም እንዲያመልኩ እንደዚህ አይነት መብት እንዳላቸውም እንቀበላለን።
  label: ፲፩
- n: 12
  text: ለንጉሶች፣ ለፕሬዘደንቶች፣ ለገዢዎች፣ እናም ለዳኞች ታዛዦች በመሆን፣ ህግን በመታዘዝ፣ በማክበርና በመደገፍ እናምናለን።
  label: ፲፪
- n: 13
  text: በታማኝነት፣ በእውነተኛነት፣ በንፅህና፣ በቸርነት፣ በምግባረ መልካምነት፣ እናም ለሁሉም ሰዎች በጎ ነገሮችን አድራጊ በመሆን እናምናለን፤ በርግጥም የጳውሎስን
    ምክርም እንከተላለን ለማለት እንችላለን—በሁሉም ነገሮች እናምናለን፣ በሁሉም ነገሮች ተስፋ እናደርጋለን፣ በብዙ ነገሮች ፀንተናል፣ እና በሁሉም ነገሮች መፅናት
    ስለመቻል ተስፋ አለን። ምግባረ መልካም፣ የሚያስደስት፣ ወይም መልካም ሀተታ ወይም ምስጋና የሚገባው ምንም ነገር ቢኖር፣ እኛም እነዚህን እንሻለን።
  label: ፲፫
signature: ጆሴፍ ስሚዝ።
