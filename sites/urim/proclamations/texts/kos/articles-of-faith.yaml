title: Ip Yohk ke Luhlahlfongi
subtitle: ke Alu luhn Jisus Kraist luhn Mwet Luhlahlfongi ke Lwen-sahflah
author: ''
verses:
- n: 1
  text: Kuht luhlahlfongi ke God, Pahpah Ma Pahtpaht, ac ke Wen Nahtuhl, Jisus Kraist, ac ke Nguhn Muhtahl.
- n: 2
  text: Kuht luhlahlfongi muh mwet uh ac fah kaiyuck ke ma koluk lalos sifacna, ac tiac ke tahfonglac
    lal Adam.
- n: 3
  text: Kuht luhlahlfongi muh ke Iwaclah luhn Kraist, mwet nuhkwewa kuh in moullac, ke ahkostwen nuh ke
    masap ac akwuck ke Wosasuc.
- n: 4
  text: 'Kuht luhlahlfongi muh ip yohk se emet ac akwuck ke Wosasuc pa: ma se emet, Luhlahlfongi ke Leum
    Jisus Kraist; ahkluo, Auliyak; aktolu, Pacptaislac ke tihli otyak in elah ma koluk; ahkahkosr, Fihliyac
    paho nuh ke mwe sang luhn Nguhn Muhtahl.'
- n: 5
  text: Kuht luhlahlfongi muh sie mwet el enenuh in pahngpahng sin God, ke pahluh, ac ke fihliyac paho
    sin elos suc oasr kuh la, in luti ke Wosasuc ac karihngihn akwuck ma oasr kac.
- n: 6
  text: Kuht luhlahlfongi ke kain akwuck se na ma tuh oasr ke Alu Yohsac, ma ekihn, mwet sap, mwet pahluh,
    mwet sropo, mwet luti, mwet sulkackihn pweng wo, ac kuhtuh pac sahyac.
- n: 7
  text: Kuht luhlahlfongi ke mwe sang ke kahs, pahluh, fwackyuck, aruhruhma, ahkkweyelah mas, ahkuhtweyac
    ke kalmen kahs, ac kuhtuh pac sahyac.
- n: 8
  text: Kuht luhlahlfongi ke Bible muh kahs luhn God fin lwenglac pwacye; kuht oacyacpac luhlahlfongi
    ke Puk luhn Mormon muh kahs luhn God.
- n: 9
  text: Kuht luhlahlfongi kwewa ma God El ahkkahlwemye tari, kwewa ma El tuhfahna ahkkahlwemye, ac kuht
    luhlahlfongi muh El ac tuhfah ahkkahlwemye ma wowo pucspucs ac yohk srihpac nuh ke Tohkohsrahi luhn
    God.
- n: 10
  text: Kuht luhlahlfongi ke fahsrweni luhn Israel ac ke fohlohkyak luhn Sruf Singucul; muh Zion (Jerusalem
    Sasuc) ac fah muhsahiyucklac fin acn America; muh Kraist El fah sifacna kol fin facluh; ac, facluh
    fah ahksasucyeyucklac ac eis wolacna luhn pacruhtais.
- n: 11
  text: Kuht eis suwohs lasr in alu nuh sin God Kuhlacna oacna ke akwuck ma kuht nuhnkuh tuh pwacye, ac
    lwelah mwet nuhkwewa in eis suwohs sepacna inge, lwelah elos in alu ke ohiyac, acn, kuh oacna ke ma
    elos luhngse.
- n: 12
  text: Kuht luhlahlfongi in ahkfuhlwactye tohkohsrah, prestuhn, mwet leum, ac sifen acn an, in ahkos,
    kaksakihn, ac ahkkweye masap.
- n: 13
  text: Kuht luhlahlfongi in oruh ma suwohs, pwacye, moul nwacsnwacs, kuhlwacng, wo, ac in oruh ma wo
    nuh sin mwet nuhkwewa; pwacyena, kuht kuh in fahk muh kuht ukwe kaiyuck lal Paul—Kuht luhlahlfongi
    ma nuhkwewa, kuht finsrak ke ma nuhkwewa, kuht muhtweng ke ma pucspucs, ac finsrak in kuh in muhtweng
    ke ma nuhkwewa. Fin oasr kuhtwena ma wo, kahto, kuh ke pweng wo kuh ma fal in kaksakihnyuck, kuht
    suk ma inge.
signature: Joseph Smith.
