title: Sucu
subtitle: Sie Mwe Fahkwack nuh fin Facluh
author: Prestuhnsi Se Met Ac Mwet Kahsruh Luhn Mwet Sap Singucul Luo ke Alu luhn Jisus Kraist luhn Mwet
  Luhlahlfongi ke Lwen-sahflah
note: Mwe fahkwack se inge ritiyuck sel Prestuhn Gordon B. Hinckley in sie ip ke pweng lal ke miting luhn
  Un Muhtwacn in Kahsruh orek ke Septempuh 23, 1995, fin acn Salt Lake City, Utah.
paragraphs:
- Kuht, Prestuhnsi Se Met ac Mwet in Kahsruh luhn Mwet Sap Singucul Luo ke Alu luhn Jisus Kraist luhn
  Mwet Luhlahlfongi ke Lwen-sahflah, ke fahkwack muhtahllacna lah macruht inmahsrlon sie mukul ac sie
  muhtwacn ma ahkkweyeyucklac sin God ac tuh sucu uh pa yohk srihpac ke plwacn luhn El suc orwaclah nuh
  ke moul nwe tok luhn tuhlihk Nahtuhl uh.
- Mwet nuhkwewa—mukul ac muhtwacn—oreklac ke luhman God. Kais sie pa tuhlihk mukul nguhn ac tuhlihk muhtwacn
  nguhn wolacna nuhtin pahpah ac ninac inkuhsrao, ac, kais sie eis luhman God ac in kuh in oacna God.
  Sie mwet el kuh in oruh mukul se kuh muhtwacn se ma el eis ke moul se el muhta we met liki el tuhkuh
  nuh facluh ah, ac moul se inge ac moul nwe tok ma pahtpaht.
- Ke moul se met liki moul se facluh inge, tuhlihk mukul nguhn ac tuhlihk muhtwacn nguhn uh elos etuh
  ac alu nuh sin God muh Pahpah ma Pahtpaht tuhmwaclos uh ac lwelah plwacn Lal suc ma sang tuhlihk Nahtuhl
  in eis mahno ac srah ac in puhlakihn ohiyac fin facluh in ahkwot nuh ke wolacna ac in eis akihlenyacn
  oreklac lalos uh ma som nuh ke moul ma pahtpaht. Plwacn luhn God nuh ke moul ma pahtpaht uh oruh sucu
  uh in kahlwem kac lah e fah sifilpac sikyak tukun kuht misac uh. Akwuck muhtahl ac olwelah uh kuh in
  orek ke tempuhl muhtahl uh ac oruh mwet se in kuh in fohlohk nuh yurin God ac nuh sin sucu uh in tuhkweni
  nwe tok.
- Masap se met ma God el sang nuh sel Adam ac Eve pa in kuh in oruh sie mukul ac muhtwacn in oruh sie
  pahyuck. Kuht ahkkweyelah masap luhn God nuh sin tuhlihk Nahtuhl uh in puhseni ac nwacklah facluh uh
  srwackna fahsr. Kuht oacyacpac ahkkweye lah God el sapkihn lah kuh muhtahl in orwaclah tuhlihk uh enenuh
  in tuhkuh yurin mukul ac muhtwacn pahyuck se muhkwena.
- Kuht ahkkweyelah lah moul se inge oreklac ke kohkoh luhn God. Kuht ahkpwacyei lah moul uh muhtahl ac
  yohk srihpac ke plwacn ke moul ma pahtpaht luhn God uh.
- Mukul ac muhtwacn pahyuck oasr kunohkohn muhtahl lalos in luhngse ac karihngihn sie sin sie ac tuhlihk
  nahtuhlos. “Tuhlihk uh mwe usru sin Leum God me” (Psalm 127:3). Oasr kunohkohn muhtahl se luhn pahpah
  ac ninac in tuhfahlah tuhlihk nahtuhlos ke luhngse ac suwohswohs, in sang enenuh lalos ke ip luhn mahno
  ac nguhn, ac in lotwelos in luhngse ac in kuhlwacnsapuh sie sin sie, in akihlen masap luhn God ac in
  karihngihn masap ke oacna sie acn elos muhta we. Mukul ac muhtwacn pahyuck—ninac ac pahpah—fah nuhnuhnkweyuck
  ye muhtuhn God ke tiac orwaclah laltahl ke ma inge.
- Sucu uh ma ahkkweyeyucklac sin God. Pahyuck inmahsrlon sie mukul ac sie muhtwacn pa sie ip yohk srihpac
  ke plwacn nwe tok Lal. Tuhlihk uh oasr suwohs lalos in isuslac sin pahpah ac ninac ma pahyuck, ac in
  tuhfweyucklac sin pahpah se ac ninac se suc ahok kuhnlah ac ahkos moul luhn sie pahyuck. Engan ke moul
  in sucu kuh in wo fin sucu uh moulkihn luti luhn Leum Jisus Kraist. Pahyuck ac sucu wowo uh oreklac
  ac fahsrkihn ip yohk ke luhlahlfongi, pruhe, auliyak, nuhnak muhnahs, ahkfuhlwactye, luhngse, pahkomuhta,
  orekma, ac kain in mukwikwi wo sahyac pac. Ke plwacn luhn God, pahpah uh nuhnuhnkuh fin sucu laltahl
  ke luhngse ac suwohswohs ac in fosrngahkihn in sang enenuh luhn moul ac karihngihn sucu. Ninac el enenuh
  na in tuhfahlah tuhlihk nahtuhlos. Ke kunohkohn muhtahl inge, pahpah ac ninac enenuh in kahsruh sie
  sin sie in oacna sie. Suhkahpahs, misac, kuh kuhtwena ohiyac kuh in orwaclah eklac ke ma kunacn kais
  sie nuh ke karihngihnyacn sucu. Sucu lasr uh kuh in kahsruh pac ke pacl enenweyuck uh.
- Sensenkackihnyuck nuh sesr lah sie mwet suc kuhnahoslah olwelah luhn tiac kosro, suc ahkkolukye nuh
  sin muhtwacn kiac kuh mukul tuhma kuh tuhlihk nahtuhlos, kuh suc tiac ahkfalye ma kunwacl nuh sin sucu
  fah sie lwen tu nuhnuhnkweyuck ye muhtuhn God. Oacyacpac, sensenkihnyuck nuh sesr lah fahsrwelihk luhn
  sucu uh e oruh kais sie, mura se, ac muhtuhn facl se in puhlakihn ohiyac koluk oacna fwackyuck sin mwet
  pahluh met ac mwet pahluh mihsenge uh.
- Kuht pahng nuh sin mwet ma e fal nuh se ac mwet kol luhn kafucrmacn yen nuhkwewa in kwacfe in orekmakihn
  ma inge in sang karihngihn ac ahkkweye sucu in pa u se ma yohk e met ke acn se uh.
