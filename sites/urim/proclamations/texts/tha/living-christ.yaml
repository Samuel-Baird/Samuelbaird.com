title: พระคริสต์ผู้ทรงพระชนม์
subtitle: ประจักษ์พยานของอัครสาวก
author: ศาสนจักรของพระเยซูคริสต์แห่งวิสุทธิชนยุคสุดท้าย
paragraphs:
- ขณะที่เราเฉลิมฉลองเพื่อรำลึกถึงการประสูติของพระเยซูคริสต์เมื่อสองพันปีที่ผ่านมา เราขอมอบประจักษ์พยานถึงความเป็นจริงเกี่ยวกับพระชนม์ชีพอันหาที่เปรียบมิได้และพระพลานุภาพอันหาที่สุดมิได้ของการพลีพระชนม์ชีพเพื่อการชดใช้อันยิ่งใหญ่ของพระองค์
  ไม่มีใครอื่นใดที่มีอิทธิพลลึกซึ้งถึงเพียงนี้ต่อบรรดาผู้ที่เคยมีชีวิตและจะมีชีวิตบนแผ่นดินโลก
- พระองค์ทรงเป็นพระเยโฮวาห์ผู้ยิ่งใหญ่แห่งพันธสัญญาเดิม พระเมสสิยาห์แห่งพันธสัญญาใหม่ ภายใต้การชี้แนะจากพระบิดา
  พระองค์ทรงเป็นผู้สร้างแผ่นดินโลก “พระเจ้าทรงสร้างสรรพสิ่งขึ้นมาโดยพระวาทะ ในบรรดาสิ่งที่เป็นอยู่นั้น
  ไม่มีสักสิ่งเดียวที่เป็นอยู่นอกเหนือพระวาทะ” (ยอห์น 1:3) แม้จะปราศจากบาป แต่พระองค์ทรงรับบัพติศมาเพื่อทำความชอบธรรมให้ครบถ้วนทุกประการ
  พระองค์ “เสด็จไปทำคุณประโยชน์” (กิจการของอัครทูต 10:38) กระนั้นก็ยังทรงถูกเกลียดชังจากการนั้น พระกิตติคุณของพระองค์เป็นข่าวสารแห่งสันติและไมตรี
  พระองค์ทรงวิงวอนให้ทุกคนทำตามแบบอย่างของพระองค์ พระองค์ทรงพระดำเนินไปตามถนนในปาเลสไตน์ ทรงรักษาคนเจ็บไข้
  ทรงทำให้คนตาบอดมองเห็น และทรงชุบชีวิตคนตาย พระองค์ทรงสอนความจริงนิรันดร์ ความเป็นจริงในการดำรงอยู่ก่อนเกิดของเรา
  จุดประสงค์ของชีวิตเราบนแผ่นดินโลก และศักยภาพสำหรับบุตรและธิดาของพระผู้เป็นเจ้าในชีวิตที่จะมาถึง
- พระองค์ทรงจัดตั้งศีลระลึกไว้เตือนใจเราถึงการพลีพระชนม์ชีพเพื่อการชดใช้อันยิ่งใหญ่ของพระองค์ ทรงถูกจับกุมและถูกประณามด้วยข้อกล่าวหาเท็จ
  ทรงต้องโทษเพื่อสนองความพอใจให้ฝูงชน และทรงถูกตัดสินลงโทษประหารชีวิตบนกางเขนแห่งคัลวารี พระองค์ทรงสละพระชนม์ชีพเพื่อชดใช้บาปของมนุษยชาติทั้งปวง
  สิ่งที่ทรงมอบให้คือของประทานอันล้ำค่าที่ทรงกระทำแทนเพื่อทุกคนที่เคยมีชีวิตอยู่บนแผ่นดินโลกไม่ว่าช่วงเวลาใด
- เราเป็นพยานอย่างจริงจังว่าพระชนม์ชีพของพระองค์ซึ่งเป็นศูนย์กลางของประวัติศาสตร์มวลมนุษย์นั้นหาได้เริ่มต้นที่เบธเลเฮมและจบลงที่คัลวารีไม่
  พระองค์ทรงเป็นพระบุตรหัวปีของพระบิดา พระบุตรองค์เดียวที่ถือกำเนิดในเนื้อหนัง พระผู้ไถ่ของโลก
- พระองค์ทรงฟื้นขึ้นมาจากสุสานเพื่อ “เป็นผลแรกของพวกที่ล่วงหลับไป” (โครินธ์ ฉบับที่หนึ่ง 15:20) ในฐานะพระเจ้าผู้ฟื้นคืนพระชนม์
  พระองค์เสด็จไปเยี่ยมผู้ที่พระองค์ทรงรักเมื่อครั้งยังทรงพระชนม์ นอกจากนี้ยังทรงปฏิบัติศาสนกิจท่ามกลาง
  “แกะอื่น” (ยอห์น 10:16) ของพระองค์ในอเมริกาสมัยโบราณ ในโลกปัจจุบัน พระองค์กับพระบิดาทรงปรากฏต่อเด็กหนุ่มโจเซฟ
  สมิธเพื่อเริ่มต้น “สมัยการประทานความสมบูรณ์แห่งเวลา” (ดู เอเฟซัส 1:10) ที่ทรงสัญญาไว้เนิ่นนาน
- 'ท่านศาสดาพยากรณ์โจเซฟเขียนเกี่ยวกับพระคริสต์ผู้ทรงพระชนม์ว่า: “พระเนตรของพระองค์ดังเปลวไฟ; พระเกศาบนพระเศียรของพระองค์ขาวเหมือนหิมะบริสุทธิ์;
  สีพระพักตร์ส่องสว่างเหนือความเจิดจ้าของดวงอาทิตย์; และสุรเสียงของพระองค์ราวกับเสียงเชี่ยวกรากของผืนน้ำอันกว้างใหญ่,
  แม้สุรเสียงของพระเยโฮวาห์, ซึ่งตรัสว่า:'
- “เราเป็นต้นและปลาย; เราคือเขาผู้นั้นที่มีชีวิต, เราคือเขาผู้นั้นที่ถูกประหาร; เราคือผู้วิงวอนพระบิดาแทนเจ้า”
  (คพ. 110:3–4)
- 'ท่านศาสดาพยากรณ์ประกาศเกี่ยวกับพระองค์ด้วยว่า: “และบัดนี้, หลังจากประจักษ์พยานจำนวนมากที่ให้ไว้ถึงพระองค์,
  นี่คือประจักษ์พยาน, สุดท้ายของทั้งหมด, ซึ่งเราให้ไว้ถึงพระองค์: ว่าพระองค์ทรงพระชนม์อยู่!'
- “เพราะเราเห็นพระองค์, แม้ทางพระหัตถ์ขวาของพระผู้เป็นเจ้า; และเราได้ยินเสียงรับสั่งคำพยานว่าพระองค์ทรงเป็นพระองค์เดียวที่ถือกำเนิดจากพระบิดา—
- “ว่าโดยพระองค์, และโดยผ่านพระองค์, และจากพระองค์, โลกต่างๆ สร้างขึ้นมาและเคยสร้างขึ้นมาแล้ว, และผู้อยู่อาศัยในนั้นเป็นบุตรและธิดาที่ถือกำเนิดของพระผู้เป็นเจ้า”
  (คพ. 76:22–24)
- เราประกาศด้วยถ้อยคำจริงจังว่าฐานะปุโรหิตของพระองค์และศาสนจักรของพระองค์ได้รับการฟื้นฟูมายังแผ่นดินโลก—“ก่อร่างสร้างขึ้นบนรากฐานของบรรดาอัครทูตและบรรดาผู้เผยพระวจนะ
  มีพระเยซูคริสต์เป็นศิลาหัวมุม” (เอเฟซัส 2:20)
- เราเป็นพยานว่าวันหนึ่งพระองค์จะเสด็จกลับมายังแผ่นดินโลก “และพระสิริของพระเจ้าจะปรากฏ แล้วมนุษย์ทุกคนจะมองเห็นด้วยกัน”
  (ดู อิสยาห์ 40:5) พระองค์จะทรงปกครองในฐานะกษัตริย์เหนือกษัตริย์ทั้งหลายและจะทรงครองราชย์ในฐานะเจ้านายเหนือเจ้านายทั้งหลาย
  ทุกเข่าจะย่อลงและทุกลิ้นจะกล่าวนมัสการต่อพระองค์ เราแต่ละคนจะยืนรับคำพิพากษาจากพระองค์ตามงานของเราและความปรารถนาของใจเรา
- เราแสดงประจักษ์พยานในฐานะอัครสาวกที่ได้รับแต่งตั้งอย่างถูกต้องของพระองค์—ว่าพระเยซูทรงเป็นพระคริสต์ผู้ทรงพระชนม์
  พระบุตรอมตะของพระผู้เป็นเจ้า พระองค์ทรงเป็นกษัตริย์อิมมานูเอลผู้ยิ่งใหญ่ ผู้ทรงยืนอยู่เบื้องขวาพระหัตถ์ของพระบิดาทุกวันนี้
  พระองค์ทรงเป็นความสว่าง ชีวิต และความหวังของโลก ทางของพระองค์คือเส้นทางที่นำไปสู่ความสุขในชีวิตนี้และชีวิตนิรันดร์ในโลกที่จะมาถึง
  พระผู้เป็นเจ้าคือผู้ที่เราพึงขอบพระทัยสำหรับของประทานอันหาที่เปรียบมิได้ นั่นคือพระบุตรแห่งสวรรค์ของพระองค์
date: 1 มกราคม 2000
