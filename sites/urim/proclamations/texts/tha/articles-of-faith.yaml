title: หลักแห่งความเชื่อ ของ
subtitle: ศาสนจักรของพระเยซูคริสต์แห่งวิสุทธิชนยุคสุดท้าย
author: ''
verses:
- n: 1
  text: เราเชื่อในพระผู้เป็นเจ้า, พระบิดานิรันดร์, และในพระบุตรของพระองค์, พระเยซูคริสต์, และในพระวิญญาณบริสุทธิ์.
- n: 2
  text: เราเชื่อว่ามนุษย์จะได้รับโทษเพราะบาปของตน, และมิใช่เพราะการล่วงละเมิดของอาดัม.
- n: 3
  text: เราเชื่อว่าโดยผ่านการชดใช้ของพระคริสต์, มนุษยชาติทั้งมวลจะรอดได้, โดยการเชื่อฟังกฎและศาสนพิธีทั้งหลายของพระกิตติคุณ.
- n: 4
  text: 'เราเชื่อว่าหลักธรรมและศาสนพิธีเบื้องต้นของพระกิตติคุณคือ: หนึ่ง, ศรัทธาในพระเจ้า พระเยซูคริสต์;
    สอง, การกลับใจ; สาม, บัพติศมาโดยลงไปในน้ำทั้งตัวเพื่อการปลดบาป; สี่, การวางมือเพื่อของประทานแห่งพระวิญญาณบริสุทธิ์.'
- n: 5
  text: เราเชื่อว่ามนุษย์ต้องได้รับการเรียกจากพระผู้เป็นเจ้า, โดยการพยากรณ์, และโดยการวางมือโดยผู้มีสิทธิอำนาจ,
    เพื่อสั่งสอนพระกิตติคุณและปฏิบัติศาสนพิธีของพระกิตติคุณนั้น.
- n: 6
  text: เราเชื่อในการวางระเบียบอย่างเดียวกับที่ดำรงอยู่ในศาสนจักรสมัยต้น, นั่นคือ, อัครสาวก, ศาสดาพยากรณ์,
    ศิษยาภิบาล, ผู้สอน, ผู้ประกาศข่าวประเสริฐ, และอื่นๆ.
- n: 7
  text: เราเชื่อในของประทานแห่งการพูดภาษา, การพยากรณ์, การเปิดเผย, นิมิต, การบำบัดรักษา, การแปลภาษา, และอื่นๆ.
- n: 8
  text: เราเชื่อว่าพระคัมภีร์ไบเบิลเป็นพระคำของพระผู้เป็นเจ้าตราบเท่าที่แปลไว้อย่างถูกต้อง; เราเชื่อด้วยว่าพระคัมภีร์มอรมอนเป็นพระคำของพระผู้เป็นเจ้า.
- n: 9
  text: เราเชื่อทุกสิ่งที่พระผู้เป็นเจ้าทรงเปิดเผยมาแล้ว, ทุกสิ่งที่พระองค์ทรงเปิดเผยขณะนี้, และเราเชื่อว่าพระองค์จะยังทรงเปิดเผยเรื่องสำคัญและยิ่งใหญ่อีกหลายเรื่องเกี่ยวกับอาณาจักรของพระผู้เป็นเจ้า.
- n: 10
  text: เราเชื่อในการรวมกันอย่างเป็นรูปธรรมของอิสราเอลและในการนำกลับคืนมาของเผ่าทั้งสิบ; ว่าไซอัน (เยรูซาเล็มใหม่)
    จะสร้างขึ้นในทวีปอเมริกา; ว่าพระคริสต์จะทรงปกครองแผ่นดินโลกด้วยพระองค์เอง; และ, ว่าแผ่นดินโลกจะกลับคืนสู่สภาพเดิมและรับรัศมีภาพแห่งเมืองบรมสุขเกษม.
- n: 11
  text: เราอ้างเอกสิทธิ์แห่งการนมัสการพระผู้เป็นเจ้าผู้ทรงฤทธานุภาพตามการวินิจฉัยจากมโนธรรมของเราเอง,
    และยอมให้มนุษย์ทั้งปวงมีเอกสิทธิ์เช่นเดียวกัน, ให้พวกเขานมัสการโดยวิธีใด, ณ สถานที่ใด, หรือสิ่งใดก็ได้ที่พวกเขาจะนมัสการ.
- n: 12
  text: เราเชื่อในการอยู่ใต้อาณัติของกษัตริย์, ประธานาธิบดี, ผู้ปกครอง, และฝ่ายปกครองของรัฐ, ในการเชื่อฟัง,
    การยกย่อง, และการสนับสนุนกฎหมาย.
- n: 13
  text: เราเชื่อในการเป็นคนซื่อสัตย์, แน่วแน่, บริสุทธิ์, มีเมตตา, มีคุณธรรม, และในการทำดีต่อมนุษย์ทั้งปวง;
    โดยแท้แล้ว, เราอาจกล่าวได้ว่าเราทำตามคำแนะนำของเปาโล—เราเชื่อทุกสิ่ง, เราหวังทุกสิ่ง, เรายืนหยัดมาแล้วหลายสิ่ง,
    และหวังว่าจะสามารถยืนหยัดได้ทุกสิ่ง. หากมีสิ่งใดที่เป็นคุณธรรม, งดงาม, หรือกล่าวขวัญกันว่าดี หรือควรค่าแก่การสรรเสริญ,
    เราแสวงหาสิ่งเหล่านี้.
signature: โจเซฟ สมิธ.
