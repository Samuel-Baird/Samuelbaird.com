title: ครอบครัว
subtitle: ถ้อยแถลงต่อโลก
author: ฝ่ายประธานสูงสุดและสภาอัครสาวกสิบสองของศาสนจักรของพระเยซูคริสต์แห่งวิสุทธิชนยุคสุดท้าย
note: ถ้อยแถลงนี้อ่านโดยประธานกอร์ดอน บี. ฮิงค์ลีย์ ในข่าวสารของท่านที่การประชุมสมาคมสงเคราะห์สามัญเมื่อวันที่
  23 กันยายน ค.ศ. 1995 ในซอลท์เลคซิตี้ ยูทาห์
paragraphs:
- เราในฐานะฝ่ายประธานสูงสุดและสภาอัครสาวกสิบสองของศาสนจักรของพระเยซูคริสต์แห่งวิสุทธิชนยุคสุดท้าย ขอประกาศอย่างเป็นทางการว่าการแต่งงานระหว่างชายกับหญิงได้รับแต่งตั้งจากพระผู้เป็นเจ้าและว่าครอบครัวเป็นศูนย์กลางต่อแผนของพระผู้สร้างเพื่อจุดหมายปลายทางนิรันดร์ของบุตรธิดาของพระองค์
- มนุษย์ทั้งปวง—ชายและหญิง—ได้รับการสร้างในรูปลักษณ์ของพระผู้เป็นเจ้า แต่ละคนคือวิญญาณที่เป็นปิยบุตรหรือปิยธิดาของพระบิดาพระมารดาบนสวรรค์
  และด้วยเหตุนี้แต่ละคนจึงมีธรรมชาติและจุดหมายปลายทางแบบพระผู้เป็นเจ้า เพศเป็นลักษณะพิเศษโดยเนื้อแท้อันบ่งบอกถึงอัตลักษณ์และจุดประสงค์ของปัจเจกบุคคลก่อนชีวิตมรรตัย
  ในชีวิตมรรตัย และในนิรันดร
- ในดินแดนก่อนเกิด บุตรและธิดาในสภาพวิญญาณรู้จักและนมัสการพระผู้เป็นเจ้าในฐานะพระบิดานิรันดร์และยอมรับแผนของพระองค์
  ซึ่งโดยแผนนั้นบุตรธิดาของพระองค์จะได้รับร่างกายทางกายภาพและได้ประสบการณ์ทางโลกเพื่อก้าวหน้าไปสู่ความดีพร้อม
  และบรรลุจุดหมายปลายทางแบบพระผู้เป็นเจ้าในฐานะทายาทชีวิตนิรันดร์ได้ในที่สุด แผนแห่งความสุขของพระผู้เป็นเจ้าทำให้ความสัมพันธ์ครอบครัวสามารถดำเนินต่อไปหลังความตาย
  ศาสนพิธีและพันธสัญญาศักดิ์สิทธิ์ที่มีอยู่ในพระวิหารอันศักดิ์สิทธิ์ทำให้เป็นไปได้สำหรับแต่ละบุคคลที่จะกลับไปยังที่ประทับของพระผู้เป็นเจ้าและสำหรับครอบครัวที่จะรวมเป็นหนึ่งเดียวกันชั่วนิรันดร์
- พระบัญญัติข้อแรกที่พระผู้เป็นเจ้าประทานแก่อาดัมและเอวาเกี่ยวข้องกับศักยภาพของทั้งสองคนในการเป็นบิดามารดาในฐานะสามีภรรยา
  เราขอประกาศว่าพระบัญญัติของพระผู้เป็นเจ้าที่ให้บุตรธิดาของพระองค์ขยายเผ่าพันธุ์และเพิ่มพูนให้เต็มแผ่นดินโลกยังมีผลบังคับ
  เราขอประกาศเพิ่มเติมว่าพระผู้เป็นเจ้าทรงบัญชาไว้ว่าอำนาจศักดิ์สิทธิ์แห่งการให้กำเนิดจะต้องใช้ระหว่างชายกับหญิงที่แต่งงานกันตามกฎหมายในฐานะสามีภรรยาเท่านั้น
- เราขอประกาศว่าวิธีสร้างชีวิตมรรตัยกำหนดโดยพระผู้เป็นเจ้า เรายืนยันถึงความศักดิ์สิทธิ์ของชีวิตและความสำคัญของเรื่องนี้ในแผนนิรันดร์ของพระผู้เป็นเจ้า
- สามีและภรรยามีหน้าที่รับผิดชอบสำคัญในการรักและดูแลกันรวมทั้งบุตรธิดาของตน “บุตรทั้งหลายเป็นมรดกจากพระเจ้า”
  (ดู สดุดี 127:3) บิดามารดามีหน้าที่ศักดิ์สิทธิ์ในการเลี้ยงดูบุตรธิดาด้วยความรักและความชอบธรรม จัดหาปัจจัยสนองความต้องการทางร่างกายและทางวิญญาณ
  ตลอดจนสอนให้พวกเขารักและรับใช้กัน ปฏิบัติตามพระบัญญัติของพระผู้เป็นเจ้า และเป็นพลเมืองที่เคารพกฎหมายไม่ว่าอาศัยอยู่ที่ใด
  สามีและภรรยา—บิดาและมารดา—จะถือว่ามีความรับผิดชอบต้องชี้แจงต่อพระผู้เป็นเจ้าในการปฏิบัติหน้าที่ตามภาระผูกพันเหล่านี้
- ครอบครัวได้รับแต่งตั้งจากพระผู้เป็นเจ้า การแต่งงานระหว่างชายกับหญิงเป็นส่วนสำคัญยิ่งต่อแผนนิรันดร์ของพระองค์
  บุตรมีสิทธิ์ถือกำเนิดภายในพันธะแห่งการสมรส และได้รับการเลี้ยงดูจากบิดาและมารดาที่รักษาคำปฏิญาณของการแต่งงานด้วยความชื่อสัตย์อย่างสมบูรณ์
  ความสุขในชีวิตครอบครัวมีโอกาสเกิดขึ้นได้มากที่สุดเมื่อมีพื้นฐานอยู่บนคำสอนของพระเจ้าพระเยซูคริสต์ ชีวิตแต่งงานและครอบครัวที่ประสบความสำเร็จตั้งมั่นและดำรงอยู่บนหลักธรรมแห่งศรัทธา
  การสวดอ้อนวอน การกลับใจ การให้อภัย ความเคารพ ความรัก ความเห็นอกเห็นใจ การทำงาน และกิจกรรมนันทนาการที่ดีงาม
  ตามการออกแบบของพระผู้เป็นเจ้า บิดาต้องเป็นหัวหน้าดูแลครอบครัวด้วยความรักความชอบธรรมและรับผิดชอบในการจัดหาปัจจัยในการดำรงชีวิตและให้ความคุ้มครองครอบครัว
  มารดามีหน้าที่รับผิดชอบหลักในการอบรมเลี้ยงดูบุตรธิดา ในหน้าที่รับผิดชอบศักดิ์สิทธิ์เหล่านี้ บิดาและมารดามีพันธะต้องช่วยเหลือกันในฐานะหุ้นส่วนเท่าๆ
  กัน ทั้งนี้อาจจำเป็นต้องปรับให้เหมาะสมในแต่ละกรณีเมื่อมีความทุพพลภาพ ความตาย หรือสภาวการณ์อื่นๆ เกิดขึ้น
  ญาติพี่น้องควรยื่นมือช่วยเหลือเมื่อจำเป็น
- เราขอเตือนว่าผู้ใดที่ฝ่าฝืนพันธสัญญาเรื่องความบริสุทธิ์ทางเพศ ผู้ที่กระทำทารุณกรรมคู่ครองหรือบุตรหลาน
  หรือผู้ที่ไม่ได้กระทำหน้าที่รับผิดชอบต่อครอบครัว วันหนึ่งจะต้องยืนชี้แจงต่อพระผู้เป็นเจ้า นอกจากนี้
  เราขอเตือนว่าการแตกสลายของครอบครัวจะนำหายนะมาสู่ตัวบุคคล ประชาคม และประชาชาติดังที่ศาสดาพยากรณ์สมัยโบราณและสมัยปัจจุบันทำนายไว้
- เราขอเรียกร้องให้พลเมืองและเจ้าหน้าที่รัฐผู้มีความรับผิดชอบทุกหนแห่งส่งเสริมมาตรการต่างๆ ที่มีขึ้นเพื่อธำรงและเสริมสร้างความเข้มแข็งให้ครอบครัวในฐานะหน่วยพื้นฐานของสังคม
