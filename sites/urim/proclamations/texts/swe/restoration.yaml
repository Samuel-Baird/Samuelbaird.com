title: Återställelsen av Jesu Kristi evangeliums fullhet
subtitle: Ett tillkännagivande för världen vid 200-årsjubileet
author: Första presidentskapet och de tolv apostlarnas råd i Jesu Kristi Kyrka av Sista Dagars Heliga
note: Detta tillkännagivande lästes upp av president Russell M. Nelson som en del av hans budskap vid
  den 190:e årliga generalkonferensen den 5 april 2020 i Salt Lake City, Utah, USA.
paragraphs:
- Vi tillkännager högtidligen att Gud älskar sina barn i varje nation på jorden. Gud Fadern har gett oss
  sin älskade Sons Jesu Kristi gudomliga födelse, ojämförliga liv och obegränsade försoningsoffer. Genom
  Faderns makt uppstod Jesus och vann seger över döden. Han är vår Frälsare, vårt Föredöme och vår Återlösare.
- För 200 år sedan, en vacker vårmorgon 1820, gick den unge Joseph Smith, som ville veta vilken kyrka
  han skulle ansluta sig till, in i skogen nära sitt hem i norra New York, USA för att be. Han hade frågor
  angående sin själs frälsning och litade på att Gud skulle leda honom.
- Vi förkunnar i ödmjukhet att Gud Fadern och hans Son Jesus Kristus visade sig för Joseph som svar på
  hans bön och inledde återupprättelsen av allt (se Apostlagärningarna 3:21) liksom Bibeln förutsagt.
  I denna syn fick han veta att Kristi nytestamentliga kyrka försvann från jorden efter de ursprungliga
  apostlarnas död. Joseph skulle ha en nyckelroll i dess återkomst.
- Vi förkunnar att himmelska budbärare under Faderns och Sonens ledning kom för att undervisa Joseph och
  återupprätta Jesu Kristi kyrka. Den uppståndne Johannes Döparen återställde myndigheten att döpa genom
  nedsänkning till syndernas förlåtelse. Tre av de ursprungliga tolv apostlarna – Petrus, Jakob och Johannes
  – återställde apostlaskapet och nycklar till prästadömsmyndighet. Det kom också andra, däribland Elia
  som återställde myndigheten att förena familjer för alltid i eviga relationer som överbryggar döden.
- 'Vi vittnar vidare att Joseph Smith gavs Guds gåva och kraft att översätta en forntida uppteckning –
  Mormons bok: Ännu ett testamente om Jesus Kristus. Denna heliga boks sidor innefattar en redogörelse
  för Jesu Kristi personliga verksamhet bland folket på det västra halvklotet strax efter sin uppståndelse.
  Den undervisar om livets syfte och förklarar Kristi lära, som är central i detta syfte. Som helig skrift
  tillsammans med Bibeln vittnar Mormons bok om att alla människor är söner och döttrar till en kärleksfull
  Fader i himlen, att han har en gudomlig plan för våra liv och att hans Son Jesus Kristus talar i dag
  likaväl som i forna dagar.'
- Vi förkunnar att Jesu Kristi Kyrka av Sista Dagars Heliga, som organiserades den 6 april 1830, är Kristi
  nytestamentliga kyrka som återställts. Denna kyrka är förankrad i sin hörnstens Jesu Kristi fullkomliga
  liv och i hans obegränsade försoning och bokstavliga uppståndelse. Jesus Kristus har åter kallat apostlar
  och gett dem prästadömsmyndighet. Han inbjuder oss alla att komma till honom och hans kyrka, ta emot
  den Helige Anden, frälsningens förrättningar och vinna bestående glädje.
- 200 år har nu gått sedan denna återställelse inleddes av Gud Fadern och hans älskade Son Jesus Kristus.
  Miljontals människor världen över har omfamnat kunskapen om dessa av profeter förutsagda händelser.
- Vi förkunnar med glädje att den utlovade återställelsen fortskrider genom fortlöpande uppenbarelse.
  Jorden kommer aldrig igen att bli densamma, då Gud samlar allt till ett i Kristus (jfr Efesierbrevet
  1:10).
- I vördnad och tacksamhet inbjuder vi som hans apostlar alla att veta – liksom vi gör – att himlarna
  är öppna. Vi intygar att Gud tillkännager sin vilja för sina älskade söner och döttrar. Vi vittnar om
  att de som under bön studerar återställelsens budskap och handlar i tro välsignas med att få ett eget
  vittnesbörd om dess gudomlighet och dess syfte att förbereda världen för vår Herre och Frälsare Jesu
  Kristi utlovade återkomst.
