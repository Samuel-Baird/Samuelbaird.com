title: Bese
subtitle: Gwauhedinarai Tanobada Enai
author: Hegunalai Ginigunana bona Aposetolo Gwauta-rua osi edia hegogo Iesu Keriso ena Dubu Ekalesia Helagadia
  Dina Gabediai
note: Ina gwaulasi be Hegunalai Gordon B Hinckley ese e duahia ia ena sivarai kaha ta General Relief Society
  Hebouna e heabi lalonai September 23, 1995, Salt Lake City, Utah ai.
paragraphs:
- Ita, Hegunalai Ginigunana bona Aposetolo Gwauta-rua osi eda hebou Iesu Keriso ena Dubu Ekalesia Helagadia
  dina Gabediai, hemataurai ai ta gwau hedinaraimu tau bona hahine edia headava na Dirava ese e hahelagaia
  bona bese na Ia ena gaukara dalana ihuanai ikarada Diravana natuna iboudiai edia mauri hanaihanai gabuna.
- Taunimanima iboudiai—mamaruanedia bona hahinedia na ekaradia Dirava heidaidanai. Ta ta na Ia ena lalokau
  laumana maruanena bona hahinena Basileia tama bona sina edia amo, bona, unu bamona, ta ta na mai ena
  tomadiho gabuna namona bona mauri hanaihanai gabuna. Maruanena eiava hahinena be taunimanima ta ta oromana
  lauma ai do asi tavara ai, tavara ai bona noho hanaihanai oromana bona badina.
- Lauma edia noho gabuna lalonai, lauma mamaruanedia bona hahinedia ediba bona noho hanaihanai Diravana
  e tomadiho henia bona ena palani e abia dae Ia natuna ese tauani do bae abia bona tanobada maurina bae
  dibaia, kara maoromaoro bae gavaia bena vaira kahana ilaoheninai bae goevadae bona dokona kahanai bae
  diba edia ura namona gabuna bona idia na mauri hanaihanai iabina taudia. Moale hanaihanai dalanai ese
  bese hetadikakana mase murinai na dounu baine hesiriu. Helaga gaukaradia bona gwauhamatadia na tempolo
  lalonai mia, ini ese e haragaiamu ta ta balou Dirava vairana bona bese bae haboudia ela hanaihanai.
- Gwauhamata ginigunana Dirava ese Adamu bona Eva e henidia danu dibaka edia sina bona tama gaukaradia,
  headava tauna bona hahinena enai. Ita ta gwau hedinaraimu Dirava ena gwauhamata Ia natuna na bae hutuma
  bona tanobada bae ha honua na emiamu. Ita ma ta gwau hedinaraimu Dirava ese eha ganidamu natu ihavarana
  na tau bona hahine sibodia ehenidia edia headava taravatuna lalonai.
- Ita ta gwau hedinaraimu ede bamonai tauani maurina ekaraia na do baine helaga. Ita ese taha momokaniamu
  maurina helaga bona gau badahereana Dirava ena mia hanaihanai dalanai.
- Headava tauna bona hahinena na mai edia lalokau bona kara namo raruosi ediai bona natudia ediai. “Natu
  maragidia na Lohiabada dihina” (Salamo 127:3). Sina bona tama edia gaukara helagana be natudia bae naridia
  lalokau bona maoromaoro ai, tauani bona lauma ai bae havara henidia, bona bae hadibadia bae helalokau
  bona heduru heheni, Dirava ena taravatu bae badina, bona taravatu ibadinana taunimanimadiai baela edia
  noho gabudia ta ta lalodiai. Headava tataudia bona hahinedia—sina bona tama—Dirava vairanai edia kara
  nahuadia bae toho ini gaukara bae karadia lalodiai.
- Bese na eha helagadia Dirava ena. Tau bona hahine edia headava na gau bada hereana Ia ena mia hanaihanai
  dalanai. Natudia na mai edia maoro bae vara headava noho hebouna maurina lalonai, bona bae naridia tama
  bona sina ese daidia be headava hematauraina gwauhamatana mai abidadama guguruna ida. Bese maurina lalonai
  moale na beheabi momokanimu bema Lohiabada Iesu Keriso ena hahedibadiba latanai bedavariamu neganai.
  Ekwalimumu headavadia bona besedia na taravatu eiava kara namo abidadamanai eginimu bona emiamu, guriguri,
  helalokerehai, kara dika idavautuna, hemataurai, lalokau, maduna ihua hebouna, gaukara, bona tauani
  ibalaheni namonamona gaukarana asi henilaona. Dirava ena ura hegeregerenai, tama iboudiai na edia bese
  bae badinadia lalokau bona maoromaoro bona bae havara henidia mauri helaoreana ai bona edia bese ireguna
  dalanai. Sina iboudiai edia helaorea ginigunana be natudia iregudia bona iubudia. Ini helaga gaukaradia
  iboudiai, tama bona sina edia gaukara na raruosi bae heduru heheni, bae hegeregere. Asi e vara namonamo
  taudia, mase, eiava gau haida ai ese sibona baine ha hegaegaea namonamo. Bese varavara ese danu heduru
  bae henia bema euramu neganai.
- Ita ese taunimanima ta ta baita hereva auka henidia daika be sihari gwauhamatadia etata utumu, daika
  danu be headava tauna eiava hahinena eiava natudia edia mauri ehadikaiamu, eiava daika na emorumu bese
  gaukaradia iha gugurudiai be dina ta Dirava vairanai beginimu davana iabina totona. Bona danu, ita ese
  baita hamaoroa bese iha pararana ese dika bada herea bae mailaidia taunimanima ta ta, orea, bona tanobada
  momo latadiai, guna bona harihari peroveta taudia ese vada egwauraia.
- Ita ta boimu abi hidi taunimanimadia ediai bona gavamani gaukara taudia gabu iboudiai bese igwaurai
  hedinaraina, idogotaona, iha goadana, bona unu hahetoho e toredia be gau bada hereadia taunimanima oreadia
  ediai.
