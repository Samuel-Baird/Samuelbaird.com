title: Abidadama Herevadia,
subtitle: Iesu Keriso Ena Dubu Ekalesia Helagadia Dina Gabediai
author: ''
verses:
- n: 1
  text: Ita ese Dirava Tamada noho hanaihanai, ta hamomokaniamu, bona Ia Natuna, Iesu Keriso, bona Lauma
    Helaga.
- n: 2
  text: Ita ese ta hamomokaniamu, taunimanima na sibodia edia dika daidiai bae hisihisi, to dia Adamu
    ena kara havara dainai.
- n: 3
  text: Ita ese ta hamomokaniamu Keriso ena hisihisi, mase bona toreisi lou amo, taunimanima iboudiai
    na do bae mauri, taravatu ikamonai henidiai bona Sivarai Namo gaukara helagadiai.
- n: 4
  text: 'Ita ese ta hamomokaniamu hereva badadia ginigunadia bona Sivarai Namo gaukaradia helagadia be:
    matamana, Abidadama Lohiabada Iesu Keriso enai; iha ruana, Helalo kerehai; iha toina, Babatiso ai
    ranu lalonai edihomu, dika ikokina; iha hanina, Ima latai e ato kaumu lauma Helaga hariharina iabina
    dainai.'
- n: 5
  text: Ita ese ta hamomokaniamu taunimanima ta na Dirava ese eboiria, peroveta ai, bona ima eato kaumu
    ai, unu daidia be mai edia maoro eiava siahu, Sivarai Namo bae haroro laia bona bae gaukara laia,
    gaukara helagadia iboudiai lalodiai.
- n: 6
  text: Ita ese ta hamomokaniamu ina gaukara tamona lalonai, edena be emia sene negana Dubuna ai, ladadia,
    aposetolo, peroveta taudia, haroro taudia, hahediba, evanelia bona ma haida.
- n: 7
  text: Ita ese ta hamomokaniamu gado idau idau hariharina, peroveta, iha hedinaraina, mata hanai, hahenamo-gado
    iha hanaidia bona ma haida.
- n: 8
  text: Ita ese ta hamomokaniamu Buka Helaga na Dirava ena hereva, bema e hahanaia maoromu neganai, ita
    ese danu Mormon Bukana ta hamomokaniamu Dirava ena hereva.
- n: 9
  text: Ita ese ta hamomokaniamu Dirava ese gau iboudiai e hahedinaraidia, gau boudiai Ia ese ina hari
    e hahedinaraidia, bona ita ese ta hamomokaniamu Ia ese danu ma gau bada hereadia momo be hahedinaraidiamu,
    Dirava ena Basileia ai.
- n: 10
  text: Ita ese ta hamomokaniamu Isaraela besena be baine hebou, bona Iduhu Gwauta osi danu bae gini lou,
    Siona (Ierusalema Matamatana) na baine gini Amerika tanobada latanai; bena Keriso sibona na baine
    Lohia tanobada latanai, bona, tanobada na baine matamata bona ena paradaiso hairaina baine abia.
- n: 11
  text: Ita na mai eda maoro Dirava Lohiabada baita toma diho henia, laloda ese e hadibadamu hegeregerenai,
    bona taunimanima iboudiai danu maoro tamona lalonai bae toma diho, ede bamona, edeseniai bona dahaka
    bae guriguri henia.
- n: 12
  text: Ita ese ta hamomokaniamu tanobada pavapavadia, lohia, bona hegunalai idau idau, bona kota enarimu
    taudia henudiai baita noho bona idia ese ekara taravatudia bait a badinadia bona matauraidia.
- n: 13
  text: Ita ese ta hamomokaniamu kara maoromaoro be namo, tauramu danu hereva momokani mo baita herevalaia,
    kara idau idau haida basita kara, namo mo baita kara taunimanima iboudiai ediai; momokani aita gwau
    Paulo ena sisiba murinai baita raka, gau iboudiai baita abi dae, talalomu gaudia iboudiai danu do
    bevaramu, taha heaukamu gau momo daidiai, bona talalomu gaudia iboudiai danu baita haheauka lai diba.
    Bema gau haida na nanamo bona mai hairaidia, bona taunimanima ese eheagi laidiamu, ini gau danu atahudiamu.
signature: Iosepa Smit.
