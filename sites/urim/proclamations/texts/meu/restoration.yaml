retrieved: '2026-11-02'
title: Iesu Keriso ena Sivarai Namo Guguruna Hamauri lou ai
subtitle: Lagani Sinahu-rua Gwaulasina Tanobada ena
author: Hegunalai orea ginigunana bona Aposetolo Gwauta-rua osi edia hegogo Iesu Keriso ena Dubu Ekalesia
  Helagadia Dina Gabediai
note: Ina gwaulasi be President Russell M. Nelson ese eduahia ia ena hereva lalonai 190th Hebou Badana,
  April 5, lagani 2020, lalonai, Damena Gohuna Taonina, Utah, ai e abia.
paragraphs:
- Mai hematauraimai ida agwaulasimu Dirava ese natuna iboudiai e lalokau henidiamu tanobada iboudiai.
  Dirava ita Tamada ese Ia hegeregerena e havarada, mauri asi iha hegeregerena, bona Ia Natuna Lalokauna,
  Iesu Keriso, ena mauri ita eda dika ahunai ela asi dokona. Tamana ena siahu amo, Iesu e toreisilou bona
  kwalimu e abia mase e hadarerea. Ia na ita eda Ahemauri Tauna, eda Aheitalai, bona ita Ihamaurida Diravana.
- Lagani sinahu-rua vada elao bubuni, daba herea daena ta lagani 1820 lalonai, eregabe Iosepa Smith, e
  hetahuva e urava baine diba edena dubu ai baine vareai, ela uda lalona ena noho gabuna New York atai
  kahanai, USA ai, baine guriguri dainai. Ia na mai ena henanadai laumana ihamaurina kahanai bona e abiadaeva
  Dirava ese baine duanai henia.
- Hemataurai ai, ita na ta gwau lasimu ia ena guriguri haherenai, Tamada Dirava bona Ia Natuna, Iesu Keriso,
  ehedinarai Iosepa enai bona “gau iboudiai e loulai gabudia korikoriai e atodia” (Aposetolo Edia Kara
  3:21) ese vada e gwauraia Buka Helaga lalonai. Ina matahanai lalonai, ia na e diba Aposetolo ginigunadia
  e mase murinai Keriso ena Taravatu Matamatana Dubuna vada e boio tanobada amo. Iosepa be hegunalai ina
  gaukara baine loulaia.
- Ita ese ta hamomokaniamu Tamana bona Natuna edia hegunalai henunai, guba amo gwaukau iloalaidia taudia
  ema Iosepa bae hadibaia bona Iesu Keriso ena Dubu bae haginia lou. Ioane Bapatiso ese bapatiso e hamauria
  lou, taunimanima tauanina na idoinai baine diho ranu lalonai bena ena dika ibounai na bae ore. Aposetolo
  ginigunadia toi—Petero, Iakobo bona Ioane—Aposetolo oreana bona hahelaga dagi biaguna edia siahu kidia
  e hamauri lou. Haida danu ma ema, Elaisa, daika be siahu ehenia bese baine haboudia lou tamona ela hanaihanai
  mauri gabenai mase danu eha hanaia.
- 'Ita ese ma ta hahebadelaiamu danu Iosepa Smith be harihari bona siahu Dirava ese e henia nega gunadiai
  pepa ai e toredia gaudia baine hanaidia: Momon Bukana—Iesu Keriso ena Taravatu Matamatana ta. Ina e
  hahelagaia sirina raudia lalonai Iesu Keriso sibona ena sivarai namo gaukaradia e kara gaudia e herevalai
  Amerika tanobada laurina kahana taunimanimadia ediai, mase amo e toreisilou murinai. Mauri badina bona
  Keriso ena gwauhamata e hahedibalaia bona e haheitalaia, edena be e kara gaudia iboudiai ihuanai. Revareva
  Helaga na Buka Helaga turana, Momon Bukana ese e hamomokaniamu, taunimanima iboudiai na Tamada lalokauna
  Guba ai e nohomu natuna mamaruanedia bona hahinedia, edena be Ia na mai ena palani helagadia ita eda
  mauri lalonai, bona Ia Natuna, Iesu Keriso, e hereva harihari bona nega gunadiai danu.'
- Ita ta gwau hedinaraimu Iesu Keriso ena Dubu Ekalesia Helagadia Dina Gabediai, April 6, lagani 1830
  lalonai ekaraia, na Keriso ena Dubu Matamatana e haginia lou. Ina Dubu e haginia na mauri herea daena
  ai bona lada badana nadigini, Iesu Keriso, bona Ia ena mase ita eda dika ahunai ela asi ia hegeregerena
  bona Toreisilou danu. Iesu Keriso ese Aposetolo ma e boiridia lou bona dagi helaga siahuna e henidia.
  Ia ese iboudai evavedamu baitala Ia dekena bona Ia ena Dubu, Lauma Helaga iabina, ahemauri taravatu
  helagadia, bona moale hanaihanai baita abia.
- Lagani sinahu-rua vada elao bubuni amo ina hamauri lou gaukarana e matamaia Tamada Dirava ese bona Ia
  Natuna Lalokauna, Iesu Keriso, ida. Gerebu momo tanobada hegegemadai ese ini peroveta taudia edia aonega
  herevadia e gugubadia tao.
- Ita na mai moaleda ida ta gwau hedinaraimu hamauri lou gwauhamatana elao gunamu iha hedinaraina gaukaradia
  eheaumu lalonai. Tanobada na ma basine loumu gabuna, badina Dirava ese “gau iboudiai baine haboudia
  gabu tamonai Keriso lalonai” (Efeso 1:10).
- Mai hematauraida bona moaleda ida, ita Ia ena Aposetolo ese iboudiai baita vavedia bena bae diba guba
  basileia na hekeho. Ita ese ta hamomokaniamu Dirava ese ena ura e hamomokaniamu Ia natuna lalokaudia
  mamaruanedia bona hahinedia daidiai. Ita ese ta hamomokaniamu daidia guriguri ai hamauri lou sivaraina
  eha heroamu bona abidadama ai kara e karamu neganai na hahenamodia bae abi sibodia edia hahebade ena
  kara helagadia dainai bona ena gaukara tanobadai bae ha hegaegaea ita eda Lohiabada bona Ahemauri Tauna,
  Iesu Keriso, ena Lou Mai Iharuana gwauhamatana dainai.
