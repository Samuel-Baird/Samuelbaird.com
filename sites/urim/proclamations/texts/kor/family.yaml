slug: family
language: kor
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-family-a-proclamation-to-the-world/the-family-a-proclamation-to-the-world?lang=kor
retrieved: '2026-11-02'
title: 가족
subtitle: 세상에 전하는 선언문
author: 예수 그리스도 후기 성도 교회 제일회장단 및 십이사도 평의회
note: 본 선언문은 1995년 9월 23일 유타주 솔트레이크시티에서 열린 상호부조회 총회에서 고든 비 힝클리 회장이 말씀의 일부로 낭독한 것이다.
paragraphs:
- 우리 예수 그리스도 후기 성도 교회의 제일회장단과 십이사도 평의회는 남녀 간의 결혼은 하나님이 제정하여 주신 것이며 가족은 창조주께서 그의 자녀들의 영원한 운명을 위하여 마련하신
  계획의 중심이라는 것을 엄숙하게 선언한다.
- 모든 인간, 즉 남자와 여자는 하나님의 형상대로 창조되었다. 사람은 모두 하늘 부모의 사랑하는 영의 아들과 딸이며, 따라서 각각 신성한 품성과 운명을 지니고 있다. 남녀의 성별은
  각 개인의 전세와 현세와 영원에 걸친 정체성과 목적을 결정하는 본질적인 특성이다.
- 전세에서 영의 아들과 딸들은 하나님을 그들의 영원하신 아버지로 알고 경배하였으며, 그의 계획을 받아들였다. 그 계획에 의하여 그의 자녀들은 육신을 얻고 지상 생활의 경험을 통하여
  완전을 향해 발전하여 궁극적으로 영생의 상속자로서 자신의 신성한 운명을 실현할 수 있게 되었다. 하나님의 행복의 계획은 가족 관계를 무덤 너머까지 계속되게 한다. 거룩한 성전에서
  행해지는 신성한 의식과 성약은 개개인을 하나님의 면전으로 돌아갈 수 있게 하며 가족을 영원히 하나로 결속시켜 준다.
- 하나님께서 아담과 이브에게 주셨던 최초의 계명은 그들이 남편과 아내로서 부모가 될 수 있는 잠재력에 관한 것이었다. 우리는 하나님께서 자녀들에게 번성하여 땅에 충만하라고 명하신 계명이
  여전히 유효함을 선언한다. 더 나아가서 우리는 하나님께서 출산의 신성한 능력은 남편과 아내로서 합법적으로 결혼한 남자와 여자 사이에서만 사용되어야 한다고 명하셨음을 선언한다.
- 우리는 필멸의 생명을 창조하는 방법을 하나님께서 정하여 주셨음을 선언한다. 우리는 생명이 성스러운 것이며, 하나님의 영원한 계획에서 그 사실이 중요하다는 것을 분명히 밝힌다.
- 남편과 아내는 배우자와 자녀들을 사랑하고 돌보아야 할 엄숙한 책임을 지니고 있다. “자식들은 여호와의 기업”이다.(시편 127:3) 부모는 자녀를 사랑과 의로움으로 양육하고, 그들에게
  물질적으로나 영적으로 필요한 사항을 충족시켜 주며, 그들이 서로 사랑하고 봉사하며 하나님의 계명을 지키고 어디서 살든지 법률을 준수하는 시민이 되도록 가르쳐야 할 거룩한 의무를 지니고
  있다. 남편과 아내, 곧 어머니와 아버지는 이 의무의 이행에 대해 하나님 앞에 책임을 지게 될 것이다.
- 가족은 하나님께서 제정하여 주신 것이다. 남녀 간의 결혼은 그의 영원한 계획에서 반드시 필요한 요소이다. 자녀들은 결혼의 테두리 안에서 태어나 결혼 서약을 온전히 충실하게 지키는
  부모에게 양육받을 권리가 있다. 가족생활의 행복은 주 예수 그리스도의 가르침에 근거를 둘 때 가장 잘 성취될 수 있다. 성공적인 결혼과 가족은 신앙, 기도, 회개, 용서, 존경,
  사랑, 동정심, 일 그리고 건전한 오락 활동의 원리 위에서 이루어지고 유지된다. 하나님의 계획에 의하여 아버지는 자신의 가족을 사랑과 의로움으로 감리해야 하며, 생활에 필요한 것들을
  마련하고 가족을 보호할 책임이 있다. 어머니의 주된 책임은 자녀를 양육하는 것이다. 이러한 신성한 책임을 수행할 때 아버지와 어머니는 동등한 동반자로서 서로를 도울 의무가 있다.
  장애나 죽음이나 기타 상황에 따라 이러한 역할을 개별적으로 조정해야 할 수 있다. 필요한 경우, 친척이 도움을 주어야 한다.
- 우리는 순결에 관한 성약을 어기거나, 배우자나 자녀를 학대하거나, 가족의 책임을 이행하지 않는 사람들은 언젠가 하나님 앞에 책임지게 되리라는 것을 경고한다. 더 나아가서 우리는 가족이
  붕괴될 때 개인과 지역 사회와 국가에 고대와 현대의 선지자들이 예언했던 재난이 닥칠 것이라는 사실을 경고한다.
- 우리는 온 세상의 책임 있는 시민과 정부 관리들에게 가족을 사회의 기본 단위로서 유지하고 강화하기 위한 방안들을 추진하여 줄 것을 요청한다.
