title: 살아 계신 그리스도
subtitle: 사도들의 간증
author: 예수 그리스도 후기 성도 교회
paragraphs:
- 이천 년 전에 있었던 예수 그리스도의 탄생을 기념하며, 그분의 비길 데 없는 삶의 실재와 그분의 위대한 속죄 희생의 무한한 가치에 관해 간증드립니다. 지금까지 지상에 살았고 또 앞으로
  살게 될 모든 사람들에게 어느 누구도 그토록 심오한 영향을 미치지는 못했습니다.
- 그분은 구약의 위대한 여호와였고 신약의 메시야이셨습니다. 그분은 아버지의 지시에 따라 지구를 창조하셨습니다. “만물이 그로 말미암아 지은 바 되었으니 지은 것이 하나도 그가 없이는
  된 것이 없느니라.”(요한복음 1:3) 그분은 아무런 죄도 없으셨지만 모든 의를 이루시기 위해 침례 받으셨습니다. 그분은 “두루 다니시며 선한 일을 행하”셨고(사도행전 10:38)
  오히려 그 때문에 멸시당하셨습니다. 그분의 복음은 평화와 선의의 메시지였습니다. 그분은 모든 사람들에게 그분이 보이신 모범대로 행하라고 간곡하게 말씀하셨습니다. 팔레스타인의 길을
  걸으며 병자를 치유하고, 눈먼 자를 보게 하고, 죽은 자를 살리셨습니다. 그분은 영원한 진리와, 전세의 실재와, 지상 생활의 목적과, 내세에서의 하나님의 아들과 딸들로서의 잠재력에
  대해 가르치셨습니다.
- 그분은 자신의 위대한 속죄 희생을 기억하도록 성찬을 제정하셨습니다. 그분은 체포되어 거짓된 혐의로 정죄받고 폭도들의 원대로 유죄 판결을 받았으며, 갈보리의 십자가에서 사형을 당하는
  선고를 받으셨습니다. 그분은 온 인류의 죄를 속죄하시려고 목숨을 내주셨습니다. 그분의 희생은 지상에 살게 되어 있는 모든 사람들을 위한 위대한 대속의 선물이었습니다.
- 우리는 온 인류 역사의 중심이 되시는 그분의 삶이 베들레헴에서 시작되지도 않았고 갈보리에서 끝나지도 않았다는 사실을 엄숙하게 간증합니다. 그분은 아버지의 장자였고 육신을 입은 독생자였으며
  세상의 구속주이셨습니다.
- 그분은 무덤에서 일어나시어 “잠자는 자들의 첫 열매가 되셨”습니다.(고린도전서 15:20) 부활하신 주님은, 지상에 계시는 동안 사랑하셨던 사람들을 방문하셨으며, 고대 미 대륙에
  살고 있던 그분의 “다른 양들”에게도(요한복음 10:16) 성역을 베푸셨습니다. 현대에도, 주님은 아버지와 함께 소년 조셉 스미스에게 나타나시어 오래전부터 약속된 “때가 찬 경륜”의(에베소서
  1:9) 시대를 여셨습니다.
- 선지자 조셉은 살아 계신 그리스도에 대해 이렇게 기록했습니다. “그의 눈은 불꽃같고 그의 머리털은 깨끗한 눈같이 희고 그의 얼굴은 해보다 더 밝게 빛나고, 그의 음성은 큰 물의 격류
  소리 같으니, 곧 여호와의 음성이라. 이르시기를,
- 나는 처음과 마지막이라, 나는 살아 있는 자요, 죽임을 당하였던 자니, 나는 아버지께 대한 너희의 변호자니라.”(교리와 성약 110:3~4)
- 이 선지자는 그분에 관해 또 이렇게 선언했습니다. “그리고 이제, 그에 대하여 드린 많은 간증 다음에 마지막으로 우리가 그에 대하여 드리는 간증은 이러하니, 곧 그는 살아 계시다는
  것이니라.
- 이는 우리가 실로 하나님의 우편에 계신 그를 보았고 또 그는 아버지의 독생자라 증거하는 음성을 들었음이니－
- 곧 그로 말미암아, 그를 통하여, 그에게서 여러 세상이 현재와 과거에 창조되었고, 그 곳의 주민은 하나님께로 태어난 아들과 딸들이라 하더라.”(교리와 성약 76:22~24)
- 우리는 그분의 신권과 교회가 지상에 회복되었으며 그분의 교회가 “사도들과 선지자들의 터 위에 세우심을 입[었으며] 그리스도 예수께서 친히 모퉁잇돌이 되셨”다는(에베소서 2:20)
  것을 엄숙하게 선언합니다.
- 우리는 그분이 언젠가 지상에 돌아오시리라는 것을 간증합니다. “여호와의 영광이 나타나고 모든 육체가 그것을 함께 보리라.”(이사야 40:5) 그분은 만왕의 왕으로서 다스리실 것이며
  만주의 주로서 통치하실 것입니다. 또한 모든 무릎이 무릎을 꿇고 모든 혀가 그분 앞에 경배의 말을 하게 될 것입니다. 우리는 저마다 그분 앞에 서서 우리의 행위와 마음속의 소망에
  따라 심판받게 될 것입니다.
- 합당하게 성임받은 그분의 사도로서 우리는 예수님이 살아 계신 그리스도시요 하나님의 불멸의 아들이라는 사실을 간증드립니다. 그분은 위대한 왕인 임마누엘이시며 오늘날 아버지의 우편에
  서 계십니다. 그분은 세상의 빛이요 생명이요 소망이십니다. 그분의 길은 이 생에서는 행복으로 인도하고 장차 올 세상에서는 영생으로 인도하는 길입니다. 그 어느 것에도 비길 데 없는
  선물로서 거룩한 아들을 주신 하나님께 감사드립시다.
