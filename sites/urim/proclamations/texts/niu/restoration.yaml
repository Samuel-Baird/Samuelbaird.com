retrieved: '2026-11-02'
title: Ko e Liuakiamaiaga ko e Fakakatoatoaaga he Evagelia ha Iesu Keriso
subtitle: Ko e Fakailoaaga ke lata mo e ua e teau tau tau (200) ke he Lalolagi.
author: Ko e Matakau Takitaki Fakamua mo e Matakau he tau Aposetolo Toko Hogofulu ma ua he Lotu a Iesu
  Keriso ma e tau Tagata Tapu ke he tau Aho Fakamui Nei
note: Ko e fakailoaaga nei ne totou ai he Takitaki ko Russell M. Nelson, taha vala he haana lauga he Konefelenisi
  lahi he aho 5 ia Apelila, 2020, ki Salt Lake City, Utah.
paragraphs:
- Kua fakamooli fakalahi a mautolu kua fakaalofa e Atua ke he Haana a tau fānau he tau kautū oti he lalolagi.
  Ne foaki mai he Atua, ko e Matua, e fanauaga tapu, ko e moui nākai fai fakatataiaga, mo e lukutotoaga
  tukulagi he Haana a Tama Fakahele ko Iesu Keriso. Ha ko e pule malolō he Matua, ne liu tū mai mo e kautū
  a Iesu he mate. Ko Ia ko e ha tautolu a Fakamoui, ha tautolu a Fakafifitakiaga, ko e ha tautolu a Laveakiaga.
- Ua e teau tau tau kua mole, ke he taha pogipogi fulufuluola he vaha tau tupu, tau taha e afe valu e
  teau mo e uafulu (1820) ne kumikumi e fuata ko ko Iosefa Samita ke iloa ko e lotu fē ke tutaki a ia
  ki ai, ne finatu a ia ke he uluvao motua tata atu ke he haana kaina ke he faahi Tokelau ha Niu Ioka
  i Amelika. Loga haana a hūhū hagaao ia ke he laveakiaga he haana a agaaga, kua tua mo e falanaki foki
  a ia ke he Atua ke fakakite mo e hataki atu ki a ia.
- Ko e tau loto holoilalo, manako a mautolu ke fakapūloa atu ne e tali ke he haana a liogi, ne haele mai
  Atua ko e Matua mo e Haana Tama ko Iesu Keriso ki a Iosefa mo e tuku atu ki a ia e “fakafoouaga ke he
  tau mena oti kana” (Gahua 3:21) tuga ne kua tohia ki loto he Tohi Tapu. Mai he fakakiteaga ia, ne iloa
  fakaako ai e ia, ne momole atu ai e tau aposetolo fakamua, ka oti ia ti galo foki e Lotu ha Keriso he
  Maveheaga Foou mai he lalolagi. To eke a Iosefa mo puhala ke he liuakimaiaga he Haana finagalo.
- Kua fakamooli a mautolu ki lalo hifo he takitakiaga he Matua mo e Tama, ne o hifo mai e tau uta fekau
  mai he lagi ke fakailoa ki a Iosefa e tau puhala ke liu fakatū aki e Lotu ha Iesu Keriso. Ne liu tu
  mai a Ioane Papateiso, ko ia foki ne liuaki mai e malolō mo e tonuhiaaga ke he papateisoaga ke tanumia
  ke he vai ma e fakamagaloaga he tau agahala. Toko tolu mai he tau Aposetolo toko hogofulu ma ua fakamua
  ko Peteru, Iakopo mo Ioane ne liuaki mai e kotafaaga Apesetolo mo e tonuhiaaga he pule malolō he feua
  ekepoa. Fai foki a lautolu ne kua o hifo mai, tuga a Elia, ne liuaki mai e tonuhiaaga malolō ke fakamatutaki
  fakalataha e tau magafaoa ke he tukulagi, ke he tau fakafetuiaga tukulagi mo e kautū mai he mate.
- 'Ne matutaki atu ke kitia mo e fakamooli ke he foakiaga he mena fakaalofa ki a Iosefa Samita ko e pule
  malolō he Atua ke fakaliliu e taha tohi mai tuai: Ko e Tohi Moromona—Ko e taha fakamooliaga ki a Iesu
  Keriso. Loga e tohiaaga tapu ke he moui fekafekau ha Iesu Keriso ke he tau tagata he Faahi Lalo he lalolagi
  nakai leva he Haana Liutumai. Ne fakaako e kakano ke he tau momoui mo e fakamaama e tau fakaakoaga ha
  Keriso, kua fakafai kakano ke he tau talahauagan nei. Ko e taha fakamooliaga ke he Tohi Tapu, ne fakamooli
  mai he Tohi Moromona, ko e tau tagata momoui oti, taane po ke fifine ko e tau fanau he Matua mitaki
  ha ha he Lagi, fai fakatokatokaaga mahuiga foki a Ia ke lata mo e tau momoui ha tautolu, mo e ko e Haana
  Tama, ko Iesu Keriso, kua vagahau mai ki a tautolu ke he vaha nei tuga foki ke he tau aho i tuai.'
- Kua fakailoa atu e mautolu ne fakatū ai e Lotu ha Iesu Keriso ma e tau Tagata Tapu ke he tau Aho Fakamui
  Nei ke he aho 6 ia Apelila, tau taha e afe valu e teau mo e tolugofulu (1830), ko e Lotu ha Keriso ke
  he Maveheaga Foou. Ko e Lotu nei kua mauokafua e fakaveaga ke tuga ni a Ia ko e Takitaki ko Iesu Keriso,
  moui tūtūtonu, ko e malokuaga tukulagi, mo e Haana Lukutotoaga mo e Liu Tūmai. Ne liu foki a Iesu Keriso
  ke uiina mo e kotofa e tau Aposetolo mo e foaki age e tonuhia malolō he Feua Ekepoa. Kua uiina foki
  e Ia a tautolu oti ke o mai ki a Ia mo e Haana a Lotu, ke moua e Agaaga Tapu, ko e tau fakamonuinaaga
  ke lata mo e Laveakiaga, ke moua e fiafia tukulagi.
- Kua molea e ua teau he tau tau tali mai he Liuakiamaiaga, ne fakatokatoka ai he Atua ko e Matua mo e
  Haana Tama Fuataha, ko Iesu Keriso. Molea e Miliona ke he lalolagi katoa kua fakaheke ke he tau lotomatala
  ke lata mo e tau perofetaaga nei.
- Kua fiafia lahi a mautolu ke fakailoa, ko e maveheaga ke he Liuakimaiaga to fakatolomaki ki mua ke he
  tau fakakiteaga. To nakai liu e lalolagi ke tatai, to fakamaopoopo fakalataha he Atua e tau mena oti
  ki a Keriso. (Efeso 1:10).
- Ha mautolu a fakalilifuaga mo e tau manatu fakaaue, manako a mautolu ko e Haana tau Aposetolo ke uiina
  atu ki a mutolu oti ke moua e iloaaga nai tuga he iloa e mautolu—kua mahafagi mai e lagi. Kua fakamooli
  foki a mautolu ke he Haana manako ke fakailoa Haana finagalo ke he Haana tau fanau taane mo e tau fanau
  fifine. Fakamooli atu foki ma lautolu ne liogi mo e kumikumi ke he tau fakaakoaga ke he Liutumai, kua
  gahua mo e tua, to fakamonuina a lautolu, ke maeke ia lautolu ke kitia ni e lautolu ha lautolu a tau
  fakamooliaga mo e tau kakano uho ke mau tauteute e lalolagi ke lata mo e maveheaga ke he Liutumai ke
  Lagaua aki he ha tautolu a Iki ko e Fakamoui, ko Iesu Keriso.
