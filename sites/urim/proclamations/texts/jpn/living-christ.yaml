title: 生けるキリスト
subtitle: 使徒たちの証
author: 末日聖徒イエス・キリスト教会
paragraphs:
- 2000年前のイエス・キリストの降誕を祝うに当たり、わたしたちはイエス・キリストの比類ない生涯が現実のものであり、この御方の偉大な贖いの犠牲が無限の力を有することを証します。これまでに地上に生を受けた人々およびこれから生を受けるすべての人々に対して、この御方以上に深遠な影響を及ぼしてきた人物は存在しません。
- イエス・キリストは旧約の大いなるエホバであり、新約のメシヤでした。御父の指示の下に、イエス・キリストは地球を創造されました。「すべてのものは、これによってできた。できたもののうち、一つとしてこれによらないものはなかった」のです（ヨハネによる福音書1章3節）。イエス・キリストは罪がなかったにもかかわらず、すべての義を成就するためにバプテスマをお受けになりました。イエス・キリストは「よい働きをしながら……巡回」されましたが（使徒行伝10章38節）、そのためにさげすまれました。イエス・キリストの福音は平和と善意のメッセージでした。イエス・キリストはすべての人々に、御自身が示す模範に従うよう熱心に勧められました。イエス・キリストは病人を癒し、目の不自由な人々の目を見えるようにし、死人をよみがえらせながら、パレスチナの道を歩まれました。また、永遠の真理と、前世が実際に存在すること、この世での人生の目的、および神の息子や娘が持つ来世における可能性についてお教えになりました。
- イエス・キリストは、御自分の偉大な贖いの犠牲を思い起こすためのものとして、聖餐をお定めになりました。イエス・キリストは捕らえられ、偽りの訴えによってとがめられ、暴徒の意に応じて有罪とされ、カルバリの十字架上での死刑を宣告されました。そして、全人類の罪を贖うために命をささげられました。イエス・キリスト御自身が、地上に生を受けるすべての人々のための偉大な身代わりの贈り物となられたのです。
- わたしたちは、全人類の歴史の中心であるイエス・キリストの生涯が、ベツレヘムで始まったのでもなければカルバリで終わったのでもないことを厳かに証します。イエス・キリストは御父の長子、肉における独り子、世の救い主でした。
- イエス・キリストは「眠っている者の初穂として」墓からよみがえられました（コリント人への第一の手紙15章20節）。そして復活された主として、地上での生涯において愛した人々のもとをお訪ねになりました。また、古代アメリカの「他の羊」の間でもお教えになりました（ヨハネによる福音書10章16節）。現代においては、御父とともに少年ジョセフ・スミスに御姿を現されました。こうして、長い間約束されてきた「時の満ちる」神権時代が到来したのです（エペソ人への手紙1章10節）。
- 生けるキリストについて、預言者ジョセフはこのように記しています。「その目は燃える炎のようであり、その頭髪は清らかな雪のように白く、その顔は太陽の輝きに勝って光り輝いていた。また、その声、すなわちエホバの声は大水の奔流のとどろきのようで、このように言われた。
- 『わたしは最初であり、最後である。わたしは生きている者であり、殺された者である。わたしは父に対するあなたがたの弁護者である。』」（教義と聖約110章3－4節）
- イエス・キリストについて、預言者ジョセフはまた次のように宣言しています。「そして今、小羊についてなされてきた多くの証の後、わたしたちが最後に小羊についてなす証はこれである。すなわち、『小羊は生きておられる。』
- わたしたちはまことに神の右に小羊を見たからである。また、わたしたちは証する声を聞いた。すなわち、『彼は御父の独り子であり、
- 彼によって、彼を通じて、彼から、もろもろの世界が現在創造され、また過去に創造された。そして、それらに住む者は神のもとに生まれた息子や娘となる』と。」（教義と聖約76章22－24節）
- わたしたちは、イエス・キリストの神権とイエス・キリストの教会が地上に回復されたこと、そしてその教会は「使徒たちや預言者たちという土台の上に建てられ……キリスト・イエスご自身が隅のかしら石である」ことを厳粛に宣言します（エペソ人への手紙2章20節）。
- わたしたちは、イエス・キリストがいつの日か地上に戻って来られることを証します。「こうして主の栄光があらわれ、人は皆ともにこれを見る」のです（イザヤ書40章5節）。イエス・キリストは王の王として治め、主の主として統治されます。イエス・キリストの前にすべてのひざがかがみ、すべての舌がイエス・キリストを賛美することでしょう。わたしたち一人一人は将来、自分の行いと心の望みについて裁きを受けるためにイエス・キリストの前に立つことになります。
- わたしたちは正式に聖任を受けたイエス・キリストの使徒として証します。イエスは生けるキリスト、不死不滅の状態にある神の御子です。イエス・キリストは今日、大いなる王、インマヌエルとして御父の右に立っておられます。イエス・キリストは世の光、命、そして希望です。イエス・キリストの道は、この世においては幸福に、後の世においては永遠の命に至る道です。わたしたちは御子という比類ない贈り物を授けてくださった神に感謝しています。
