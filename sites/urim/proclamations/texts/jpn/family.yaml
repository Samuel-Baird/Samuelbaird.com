title: 家族
subtitle: 世界への宣言
author: 末日聖徒イエス・キリスト教会大管長会ならびに十二使徒評議会
note: この宣言は、1995年9月23日、ユタ州ソルトレーク・シティーで開催された中央扶助協会集会において、ゴードン・B・ヒンクレー大管長により、メッセージの一部として読み上げられたものです。
paragraphs:
- わたしたち、末日聖徒イエス・キリスト教会の大管長会と十二使徒評議会は、男女の間の結婚は神によって定められたものであり、家族は神の子供たちの永遠の行く末に対する創造主の計画の中心を成すものであることを、厳粛に宣言します。
- すべての人は、男性も女性も、神の形に創造されています。人は皆、天の両親から愛されている霊の息子、娘です。したがって、人は皆、神の属性と神聖な行く末とを受け継いでいます。そして性別は、人の前世、現世および永遠の状態と目的にとって必須の特性なのです。
- 前世で、霊の息子、娘たちは神を知っていて、永遠の御父として神を礼拝し、神の計画を受け入れました。その計画によって、神の子供たちは肉体を得ることができ、また、完成に向かって進歩して、最終的に永遠の命を受け継ぐ者としての神聖な行く末を実現するために、地上での経験を得られるようになったのです。神の幸福の計画は、家族関係が墓を超えて続くことを可能にしました。聖なる神殿において得られる神聖な儀式と聖約は、わたしたちが個人として神のみもとに帰り、また家族として永遠に一つとなることを可能にするのです。
- 神がアダムとエバに授けられた最初の戒めは、彼らが夫婦として親になる能力を持つことに関連したものでした。わたしたちは宣言します。すなわち、増えよ、地に満ちよ、という神の子供たちに対する神の戒めは今なお有効です。またわたしたちは宣言します。生殖の神聖な力は、法律に基づいて結婚した夫婦である男女の間においてのみ用いるべきです。
- わたしたちは宣言します。この世に命をもたらす手段は、神によって定められたものです。わたしたちは断言します。命は神聖であり、神の永遠の計画の中で重要なものです。
- 夫婦は、互いに愛と関心を示し合うとともに、子供たちに対しても愛と関心を示すという厳粛な責任を負っています。「子供たちは神から賜わった嗣業であり」（詩篇127篇3節）とあります。両親には、愛と義をもって子供たちを育て、物質的にも霊的にも必要なものを与え、また互いに愛し合い仕え合い、神の戒めを守り、どこにいても法律を守る市民となるように教えるという神聖な義務があります。夫と妻、すなわち父親と母親は、これらの責務の遂行について、将来神の御前で報告することになります。
- 家族は神によって定められたものです。男女の間の結婚は、神の永遠の計画に不可欠なものです。子供たちは結婚のきずなの中で生を受け、結婚の誓いを完全な誠意をもって尊ぶ父親と母親により育てられる権利を有しています。家庭生活における幸福は、主イエス・キリストの教えに基づいた生活を送るときに達成されるに違いありません。実りある結婚と家庭は、信仰と祈り、悔い改め、赦し、尊敬、愛、思いやり、労働、健全な娯楽活動の原則にのっとって確立され、維持されます。神の計画により、父親は愛と義をもって自分の家族を管理しなければなりません。また、生活必需品を提供し、家族を守るという責任を負っています。また母親には、子供を養い育てるという主要な責任があります。これらの神聖な責任において、父親と母親は対等のパートナーとして互いに助け合うという義務を負っています。心身の障害や死別、そのほか様々な状況で、個々に修正を加えなければならないことがあるかもしれません。また、必要なときに、親族が援助すべきです。
- わたしたちは警告します。純潔の律法を犯す人々、伴侶や子供を虐待する人々、家族の責任を果たさない人々は、いつの日か、神の御前に立って報告することになります。またわたしたちは警告します。家庭の崩壊は、個人や地域社会、国家に、古今の預言者たちが預言した災いをもたらすことでしょう。
- わたしたちは、全地の責任ある市民と政府の行政官の方々に、社会の基本単位である家族を維持し、強めるために、これらの定められた事柄を推し進めてくださるよう呼びかけるものであります。
