title: Ol Bilip bilong
subtitle: Sios bilong Jisas Krais bilong ol Seint long Las de
author: ''
verses:
- n: 1
  text: Mipela i bilip long God, Papa bilong Oltaim Oltaim, na long Pikinini bilong Em, Jisas Krais, na
    long Holi Spirit.
- n: 2
  text: Mipela i bilip olsem ol man bai kisim pen long pasin nogut bilong ol yet, na i no long pasin nogut
    bilong Adam.
- n: 3
  text: Mipela i bilip olsem long pen bilong Krais, olgeta manmeri bai stap gut, sapos ol i bihainim ol
    lo na ol odinens bilong Gutnius.
- n: 4
  text: 'Mipela i bilip olsem ol namba wan toktok na ol odinens bilong Gutnius em i: namba wan, Bilip
    lo Jisas Krais; namba tu, Tanim bel; namba tri, Kisim baptais em long go aninit tru long wara long
    rausim ol pasin nogut; namba po, Putim han long het long kisim Holi Spirit.'
- n: 5
  text: Mipela i bilip olsem God i mas singautim wanpela man long tok profet, na husat man igat atoriti
    long putim han antap long het, long telimautim Gutnius na wokim ol odinens.
- n: 6
  text: Mipela i bilip long wankain wok i bin kamap long olpela Sios, olsem, ol aposel, ol profet, ol
    pasto, ol tisa, ol ivanjelis, na olsem.
- n: 7
  text: Mipela i bilip long presen bilong ol kain kain tokples, tok profet, telimautim, driman, mekim
    oraitim sik, tanim tokples, na olsem.
- n: 8
  text: Mipela i bilip olsem Baibel em i tok bilong God sapos olgeta hap ol i bin tanim gut; mipela i
    bilip tu olsem Buk bilong Momon em i tok bilong God.
- n: 9
  text: Mipela i bilip long olgeta samting God i soim pinis, olgeta samting Em i wok long soim nau, na
    mipela i bilip olsem Em bai soim yet planti bikpela samting long Kingdom bilong God.
- n: 10
  text: Mipela i bilip long bung wantaim gen bilong Isrel na kamapim gen bilong Tenpela Lain Famili; na
    Saion (Nupela Jerusalem) bai kamap long Amerika; Krais yet bai stap bikman long graun; na, graun bai
    kamap nupela gen na kisim glori bilong paradais.
- n: 11
  text: Mipela i bilip mipela i gat rait long lotuim bikpela God long we na tingting bilong mipela yet,
    na larim ol arapela man long lotu long wanem wei, long wanem hap, o wanem ol i laik.
- n: 12
  text: Mipela i bilip long stap aninit long ol king, ol presiden, ol bosman, na ol loman, long bihainim,
    rispektim, na sapotim lo.
- n: 13
  text: Mipela i bilip long toktok stret, stap tru, klin, gutpela, na mekim gutpela pasin long olgeta
    manmeri; olsem mipela i tok mipela i bihainim skul bilong Pol—Mipela i bilip long olgeta samting,
    mipela i wetim olgeta samting, mipela i daunim pinis planti samting, na ting mipela inap long daunim
    olgeta samting. Sapos i gat samting i stap klin, nais tru, o i gat gutnem o i gutpela tru, mipela
    i wok long painim ol dispela samting.
signature: Joseph Smith.
