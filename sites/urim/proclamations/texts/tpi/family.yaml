title: Famili
subtitle: Tokaut i go long Wol
author: Nambawan Presidensi na Kaunsel bilong ol Twelpela Aposel bilong Sios bilong Jisas Krais bilong
  ol Seint long Las de
note: Dispela tokaut em Presiden Gordon B Hinckley i bin ridim olsem hap toksave bilong em long Generol
  Relif Sosaiti miting ol i bin holim long Septemba 23, 1995, long Salt Lake City, Utah.
paragraphs:
- Mipela, ol Nambawan Presidensi na ol Kaunsel bilong ol Twelpela Aposel bilong Sios bilong Jisas Krais
  bilong ol Seint long Las de, i sanap wantaim na givim bikpela tokaut tru olsem marit namel long wanpela
  man na wanpela meri em God i blesim na famili em i stap namel insait long plen bilong Em husat i wokim
  olgeta samting long kamapim dispela laip oltaim na stap bilong ol pikinini bilong Em.
- Olgeta lain—man na meri—God i mekim ol long piksa bilong Em. Wanwan i stap olsem spirit pikinini man
  o meri bilong papa na mama i stap long heven husat i laikim ol tumas na olsem wanwan inap gat rot bilong
  stap oltaim. Kamap bilong wanwan olsem man o meri em i impoten moa na i stap long laip bipo, na long
  laip nau, na aidentiti na wok bilong em oltaim oltaim.
- Insait long primotol laip pastaim long yumi kam long ples graun, olgeta spirit pikinini man na meri
  i save long God na i lotuim Em olsem Papa bilong Oltaim Oltaim na i wanbel wantaim plen bilong Em we
  ol pikinini bilong Em bai kisim bodi na ekspiriens long ples graun na wok long kamap olsem gutpela moa
  na luksave olsem ol tu inap kamap olsem God. Dispela plen bilong hamamas i halivim famili long stap
  wantaim oltaim bihain long dai. Ol holi odinens na kavanen insait long ol holi temple i givim wei olsem
  wanwan man na meri inap go bek long ai bilong God na ol famili inap stap wantaim oltaim oltaim.
- Nambawan komanmen God em i givim long Adam na Eve i bin stap olsem tupela bai kamap olsem man na meri
  na kamap papa na mama. Mipela i tokaut olsem em i komanmen bilong God long ol pikinini bilong Em long
  kamap planti na pulumapim ples graun i stap strong yet. Mipela i tokaut moa olsem God i tok strong olsem
  ol sekred pawa bilong kamapim pikinini i mas kamap tasol namel long man na meri husat i marit aninit
  long lo.
- Mipela i tokaut olsem God i makim rot bilong kamapim laip. Mipela i tok strong olsem laip i holi na
  em i inpoten long plen bilong God.
- Man na meri bilong em i gat bikpela wok long lavim na lukautim tupela yet na ol pikinini bilong tupela.
  “Ol pikinini i kam long Bikpela” (Song 127:3). Ol papa na mama i gat sekred wok long lukautim ol pikinini
  bilong ol wantaim lav na stretpela pasin, long lukautim nid bilong bodi na spirit bilong ol, na long
  lainim ol long lavim wanpela narapela, bihainim ol komanmen bilong God, na bihainim lo bilong graun
  long wanem hap ol i stap. Ol man na meri bilong ol—ol mama na papa—ol bai sanap long kot bilong God
  na tokaut long olgeta wok bilong ol.
- Famili em God i odenim. Marit namel long man na meri em i bikpela tumas long plen bilong oltaim oltaim.
  Ol pikinini i mas kamap insait long banis bilong marit, na bai kamap bikpela aninit long lukaut bilong
  papa na mama husat i honarim na stap tru long promis bilong marit bilong tupela. Hamamas insait long
  famili em inap kamap long ol tok bilong Bikpela Jisas Krais. Ol gutpela marit na ol gutpela famili bai
  kamap sapos ol i bihainim lo bilong feit, beten, pasin bilong tanim bel, fogiv, rispek, lav, sore, wok,
  na ol gutpela bung bilong hamamas. Long plen bilong God, ol papa i mas lukautim ol famili bilong ol
  wantaim lav na stretpela pasin na ol i mas givim samting bilong stap laip na lukautim ol famili bilong
  ol. Ol mama i gat wok long lukautim ol pikinini bilong ol. Insait long ol dispela holi wok, ol papa
  na ol mama i gat wok long halivim wanpela narapela olsem tupela i wankain long marit bilong ol. Bagarap
  long bodi, dai na ol narapela kain samting i nap halivim man long senisim sindaun bilong em. Ol narapela
  famili na kandere inap halivim sapos i gat nid.
- Mipela i tokaut olsem ol wanwan man husat i burukim lo bilong klinpela pasin, husat i bagarapim man
  o meri bilong em o pikinini bilong em o husat i no mekim wok bilong em long lukautim famili olsem ol
  bai sanap long kot long ai bilong God. Moa yet, mipela i tok lukaut olsem buruk bilong famili bai bagarapim
  ol wanwan man o meri long komuniti na ol nesen na dispela em ol bikpela hevi ol profet bilong bipo na
  nau i tokaut pinis long en.
- Mipela i singaut long olgeta sitisen husat i bihainim lo bilong graun na ol opisa bilong gavman long
  olgeta hap long promotim ol wei bilong lukautim na strongim ol famili olsem bikpela unit bilong sosaiti.
