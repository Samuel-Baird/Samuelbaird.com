title: s Ticības apliecinājumi
subtitle: Pēdējo Dienu Svēto Jēzus Kristus Baznīca
author: ''
verses:
- n: 1
  text: Mēs ticam Dievam, Mūžīgajam Tēvam, un Viņa Dēlam Jēzum Kristum, un Svētajam Garam.
- n: 2
  text: Mēs ticam, ka cilvēkus sodīs par viņu pašu grēkiem un nevis par Ādama pārkāpumu.
- n: 3
  text: Mēs ticam, ka caur Kristus veikto Izpirkšanu visa cilvēce var tikt izglābta, ja tā paklausīs evaņģēlija
    likumiem un priekšrakstiem.
- n: 4
  text: 'Mēs ticam, ka evaņģēlija vadošie principi un priekšraksti ir: pirmais — ticība Tam Kungam Jēzum
    Kristum; otrais — grēku nožēlošana; trešais — kristīšana, iegremdējot ūdenī, grēku piedošanai; ceturtais
    — roku uzlikšana Svētā Gara dāvināšanai.'
- n: 5
  text: Mēs ticam, ka cilvēkam jātiek Dieva aicinātam caur pravietojumu un uzliekot viņam rokas, ko dara
    tie, kam piešķirtas pilnvaras, lai viņš sludinātu evaņģēliju un izpildītu tā priekšrakstus.
- n: 6
  text: Mēs ticam tai pašai organizācijai, kas pastāvēja agrīnajā baznīcā, proti, — apustuļiem, praviešiem,
    mācītājiem, skolotājiem, evaņģēlistiem un tā tālāk.
- n: 7
  text: Mēs ticam valodu, pravietojumu, atklāsmju, vīziju, dziedināšanas, valodu tulkošanas un citām dāvanām.
- n: 8
  text: Mēs ticam, ka Bībele ir Dieva vārds, ciktāl tā ir pareizi pārtulkota; mēs arī ticam, ka Mormona
    Grāmata ir Dieva vārds.
- n: 9
  text: Mēs ticam visam, ko Dievs ir atklājis, visam, ko Viņš tagad atklāj, un mēs ticam, ka Viņš vēl
    atklās daudz ko diženu un svarīgu attiecībā uz Dieva Valstību.
- n: 10
  text: Mēs ticam burtiskai Israēla sapulcināšanai un Desmit cilšu atjaunošanai; ka Ciāna (Jaunā Jeruzaleme)
    tiks uzcelta Amerikas kontinentā; ka Kristus personīgi valdīs uz Zemes un ka Zeme tiks atjaunota un
    saņems savu paradīzes godību.
- n: 11
  text: Mēs pieprasām privilēģiju pielūgt Visuvareno Dievu saskaņā ar mūsu sirdsapziņu un atvēlam visiem
    cilvēkiem to pašu privilēģiju, lai viņi pielūdz kā, kur vai ko tie vēlas.
- n: 12
  text: Mēs ticam, ka jāpakļaujas karaļiem, prezidentiem, valdniekiem un miertiesnešiem, paklausot, godājot
    un atbalstot likumu.
- n: 13
  text: 'Mēs ticam, ka jābūt godīgiem, patiesiem, šķīstiem, labvēlīgiem, tikumīgiem un jādara labais visiem
    cilvēkiem; patiesi, mēs varam teikt, ka sekojam Pāvila pamācībai: mēs ticam visam, mēs ceram uz visu,
    mēs esam daudz izturējuši un ceram, ka spēsim izturēt visu. Ja kaut kur ir jebkas tikumīgs, jauks,
    labi novērtēts vai uzslavas vērts, mēs šādas lietas meklējam.'
signature: Džozefs Smits.
