title: Ģimene
subtitle: Vēstījums pasaulei
author: Pēdējo Dienu Svēto Jēzus Kristus Baznīcas Augstākais prezidijs un Divpadsmit apustuļu padome
note: Šo vēstījumu prezidents Gordons B. Hinklijs nolasīja kā daļu no savas uzrunas Palīdzības biedrības
  vispārējā sapulcē, kas notika 1995. gada 23. septembrī Soltleiksitijā, Jūtas štatā.
paragraphs:
- Mēs, Pēdējo Dienu Svēto Jēzus Kristus Baznīcas Augstākais prezidijs un Divpadsmit apustuļu padome, svētsvinīgi
  paziņojam, ka laulība starp vīrieti un sievieti ir Dieva iedibināta un ka ģimenei ir centrālā loma Radītāja
  iecerē attiecībā uz Viņa bērnu mūžīgo sūtību.
- Visi cilvēki — gan vīrieši, gan sievietes — ir radīti pēc Dieva tēla un līdzības. Ikviens ir Debesu
  vecāku mīlēts gara dēls vai meita, un tādējādi katrs ir apveltīts ar dievišķu dabu un sūtību. Dzimumpiederība
  ir ļoti būtiska iezīme — indivīda pirmslaicīgās, laicīgās un mūžīgās identitātes un mērķa sastāvdaļa.
- Pirmslaicīgajā dzīvē gara dēli un meitas pazina un pielūdza Dievu kā savu Mūžīgo Tēvu un pieņēma Viņa
  ieceri, saskaņā ar kuru Viņa bērni varēja iegūt fizisko ķermeni un dzīves pieredzi uz Zemes, lai pilnveidotos
  un galu galā īstenotu savu dievišķo sūtību, kļūstot par mūžīgās dzīves mantiniekiem. Dievišķā laimes
  iecere ļauj ģimenes attiecībām turpināties arī pēc nāves. Svētajos tempļos pieejamie svētie priekšraksti
  un derības dod cilvēkiem iespēju atgriezties Dieva klātbūtnē un būt mūžīgi vienotiem ar savu ģimeni.
- Pirmais bauslis, ko Dievs deva Ādamam un Ievai, tika attiecināts uz viņu, vīra un sievas, iespēju kļūt
  par vecākiem. Mēs pasludinām, ka bauslis, ko Dievs deva Saviem bērniem, — vairoties un piepildīt Zemi
  — vēl arvien ir spēkā. Turklāt mēs paziņojam, ka Dievs ir pavēlējis, ka svēto dzīvības radīšanas spēku
  drīkst izmantot vienīgi vīrietis un sieviete, kuri ir likumīgi laulāti kā vīrs un sieva.
- Mēs paziņojam, ka spēja radīt laicīgo dzīvību ir Dieva piešķirta. Mēs apliecinām, ka dzīvība ir svēta
  un ka tai ir nozīmīga loma Dieva mūžīgajā iecerē.
- Vīram un sievai ir svēts pienākums mīlēt un rūpēties vienam par otru un par saviem bērniem. „Bērni ir
  Tā Kunga dāvana” (Psalmi 127:3). Vecākiem ir svēts pienākums audzināt savus bērnus mīlestībā un taisnīgumā,
  rūpēties par viņu fiziskajām un garīgajām vajadzībām, mācīt viņus mīlēt citam citu un savstarpēji kalpot,
  pildīt Dieva baušļus un būt likumpaklausīgiem pilsoņiem, lai kur viņi dzīvotu. Vīriem un sievām — mātēm
  un tēviem — būs jāatbild Dieva priekšā par šo pienākumu izpildi.
- Ģimene ir Dieva iedibināta. Laulībai starp vīrieti un sievieti ir ļoti būtiska loma Viņa mūžīgajā iecerē.
  Bērniem ir tiesības dzimt laulības ietvaros, un tie jāaudzina tēvam un mātei, kuri godā un pilnīgā uzticībā
  pilda laulības solījumus. Vislielākā iespēja izveidot laimīgu ģimenes dzīvi ir tad, ja tā ir balstīta
  uz Tā Kunga, Jēzus Kristus, mācībām. Veiksmīga laulība un ģimenes dzīve tiek dibināta un saglabāta,
  balstoties uz tādiem principiem kā ticība, lūgšana, grēku nožēlošana, piedošana, cieņa, mīlestība, līdzjūtība,
  darbs un veselīga atpūta. Saskaņā ar dievišķo ieceri, tēvam ir jāvada ģimene mīlestībā un taisnīgumā,
  un viņa pienākums ir rūpēties par ģimenes ikdienas vajadzību apmierināšanu un tās aizsardzību. Mātes
  primārā atbildība ir savu bērnu audzināšana. Pildot šos svētos pienākumus, tēvam un mātei ir savstarpēji
  jāpalīdz kā līdzvērtīgiem partneriem. Nespējas, nāves vai citu apstākļu gadījumā var būt nepieciešama
  individuāla pielāgošanās. Vajadzības gadījumā vecākiem būtu jāsaņem radinieku palīdzība.
- Mēs brīdinām, ka cilvēkiem, kuri pārkāpj šķīstības derības, izturas vardarbīgi pret savu dzīvesbiedru
  vai bērniem vai arī nepilda savus pienākumus pret ģimeni, kādu dienu nāksies par to atbildēt Dieva priekšā.
  Turklāt mēs brīdinām, ka ģimenes sairšana atnesīs cilvēkiem, sabiedrībai un tautām postu, ko ir pareģojuši
  sendienu un mūsdienu pravieši.
- Mēs aicinām atbildīgus pilsoņus un valdību amatpersonas visā pasaulē mērķtiecīgi sekmēt ģimenes kā sabiedrības
  pamatvienības saglabāšanu un stiprināšanu.
