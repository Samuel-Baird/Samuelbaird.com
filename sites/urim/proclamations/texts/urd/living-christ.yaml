title: زِندَہ مسِیح
subtitle: رسُولوں کی گواہی
author: کلِیسیائے یِسُوع مسِیح برائے مُقدّسینِ آخِری ایّام
paragraphs:
- یِسُوع مسِیح کی پَیدایش کے دو ہزار سال گُزر جانے کی یادگاری مناتے ہُوئے، ہم اُس کی بے نظیر زِندگی اور
  عظیم کفّارہ بخش قُربانی کی لامحدُود قُدرت کی گواہی پیش کرتے ہیں۔ وہ تمام جو اِس زمین پر بَسیرا کر چُکیں
  ہیں یا کریں گے اتنا گہرا اثر نہ کِسی اور کا تھا نہ ہی ہو سکتا ہے۔
- وہ پُرانے عہد نامے کا عظیم یہوواہ اور نئے عہد نامے کا مَمسُوح ہے۔ اپنے باپ کی زیرِ ہدایت، وہ زمِین کا
  خالق بنا۔ ”سب چیزیں اُس کے وسیلہ سے پَیدا ہُوئیں؛ اور جو کُچھ پَیدا ہُوا ہے اُس میں سے کوئی چیز بھی
  اُس کے بغیر پَیدا نہیں ہُوئی“ (یُوحنّا ۱‏:۳)۔ اگر چہ وہ بے گناہ تھا، لیکن ساری راست بازی کو پُورا کرنے
  کے لیے اُس نے بپتِسما لِیا۔ وہ ”بھلائی کرتا تھا“ (اعمال ۱۰‏:۳۸)، تو بھی اُسے حقیِر جانا گیا۔ اُس کی
  اِنجِیل اَمن اور خلُوص کا پیغام تھی۔ اُس نے سب کو اپنی پیروی کرنے کی تاکید کی۔ فلسطِین کی راہوں سے گُزرتے
  ہُوئے، اُس نے بیماروں کو شفا، اندھوں کو آنکھیں اور مرُدوں کو زِندگی بخشی۔ اُس نے اَبَدیت کی سچّائی،
  اِس زِندگی سے پہلے ہمارے وجُود کی حقیقت، زمِین پر ہماری زِندگی کا مقصد اور آیندہ زِندگی میں خُدا کے
  بیٹے اور بیٹیوں کے مَقدور کی تعلیم دی۔
- اپنی عظیم کفّارہ بخش قُربانی کی یادگاری کے لیے اُس نے عِشائے ربانی کی رسم کا آغاز کِیا۔ وہ پکڑا گیا
  اور اُس پر جُھوٹے اِلزامات لگائے گئے، ہُجوم کو مُطمئن کرنے کے لیے اُسے مُجرم ٹھہر ایا گیا اور اُسے کلوری
  پر صلیبی موت کی سزا دی گئی۔ اُس نے ساری اِنسانیت کے گُناہوں کے کفّارے کے لیے اپنی جان دی۔ اُن تمام کے
  لیے جو اِس زمِین پر بَسیرا کریں گے یہ اُس کا عظیم نیابتی تحفّہ تھا۔
- ہم باضابطہ گواہی دیتے ہیں کہ اُس کی زِندگی، جو کہ تمام تاریخِ اِنسانی کا مرکز ہے، نہ تو بیت لحم میں
  شُروع ہُوئی اور نہ کلوری پر ختم ہو گئی۔ وہ باپ کا پہلوٹھا، جسم کے لحاظ سے اِکلوتا بیٹا، جہان کا مُخلصی
  دینے والا تھا۔
- وہ قبر میں سے جی اُٹھا تاکہ ”سو جانے والوں میں سے پہلا پھل ہو“ (اکرنتھیوں ۱۵‏:۲۰)۔ وہ جی اُٹھے خُداوند
  کی حیثیت سے، اُن کے پاس گیا جِنھیں وہ زِندگی میں پیار کرتا تھا۔ وہ قد یم امریکہ میں اپنی ”دُوسری بھیڑوں
  “ (یُوحنّا ۱۰‏:۱۶) کے پاس بھی گیا۔ جدید زمانے میں، قدیم سے کیے گئے وعدے ”زمانوں کے پُورا ہونے“ (اِفِسیوں
  ۱‏:۱۰) کے آغاز کا بتانے کے لیے وہ اور اُس کا باپ لڑکے جوزف سمِتھ پر ظاہر ہُوئے۔
- 'زِندَہ مسِیح کی بابت نبی جوزف لکھتا ہے:” اُس کی آنکھیں آگ کے شُعلے کی سی تھیں؛ اور اُس کے سر کے بال
  خالِص برف کی مانِند سفید تھے؛ اُس کی صُورت سُورج کی چمک سے زیادہ مُنوّر تھی؛ اور اُس کی آواز بہتے ہُوئے
  بڑے پانیوں کی آواز کی سی تھی، یعنی یہوواہ کی آواز، جو یہ فرماتی تھی:'
- مَیں اَوّل اور آخِر ہُوں؛ مَیں وہ ہُوں جو زِندَہ ہے، مَیں وہ ہُوں جو مارا گیا تھا؛ مَیں باپ کے ساتھ
  تُمھارا وکیل ہُوں“ (عقائد اور عہُود ۱۱۰‏:۳–۴)۔
- 'اُس کی بابت نبی نے یہ بھی بتایا: ” اور اب، اُس کے بارے میں پہلے جتنی گواہیاں دی جا چُکی ہیں، یہ سب
  سے آخِری گواہی ہے، جو ہم اُس کی بابت دیتے ہیں: کہ وہ زِندَہ ہے!'
- ”پَس ہم نے اُس کو دیکھا، یعنی باپ کے داہنے ہاتھ کی طرف؛ اور ہم نے آواز سُنی جو شہادت دے رہی تھی کہ وہ
  باپ کا اِکلوتا ہے—
- ” کہ اُس نے، اور اُس کے وسِیلے سے، اور اُس کے لیے، دُنیائیں خلق ہوتی ہیں اور خلق کی گئیں ہیں اور اُن
  کے باشِندے خُدا کے موالید بیٹے اور بیٹیاں ہیں “ (عقائد اور عہُود ۷۶‏:۲۲–۲۴)۔
- ہم نہایت سنجیدگی سے اِعلان کرتے ہیں کہ اُس کی کہانت اور اُس کی کلِیسیا زمِین پر بحّال ہو چُکی ہے—”اور
  رسُولوں اور نبیوں کی نیو پر جِس کے کونے کے سِرے کا پتھر خُود مسِیح یِسُوع ہے … تعمیر کی گئی ہے“ (اِفِسیوں
  ۲‏:۲۰)۔
- ہم گواہی دیتے ہیں کہ وہ ایک دِن زمِین پر واپس آئے گا۔ ”اور خُداوند کا جلال آشکارا ہو گا اور تمام بشر
  اُس کو دیکھے گا“ (یسعیاہ ۴۰‏:۵)۔ اور وہ بادِشاہوں کے بادِشاہ اور خُداوندوں کے خُداوند کی حیثیت سے حُکُومت
  کرے گا اور ہر ایک گُھٹنا جُھکے گا اور ہر زُبان اُس کی پرستش کرے گی۔ ہم میں سے ہر کوئی اپنے اَعمال اور
  اپنے دِلوں کی خواہشوں کے مُطابق اپنی عدالت کے لیے اُس کے سامنے کھڑا ہو گا۔
- اُس کے باضابطہ مُقرّر شُدہ رسُولوں کی حیثیت سے ہم گواہی دیتے ہیں—کہ یِسُوع زِندَه مسِیح، خُدا کا لافانی
  بیٹا ہے۔ وہ عظیم بادِشاہ عمانوایل ہے، جو آج اپنے باپ کے دہنے ہاتھ کھڑا ہے۔ وہ دُنیا کا نُور ، زِندگی
  اور اُمید ہے۔ اُس کا طریق وہ واحد راستہ ہے جو اِس زِندگی میں خُوشی اور آئندہ دُنیا میں اَبَدی زِندگی
  کی طرف لے جاتا ہے۔ اُس کے اِلہٰی بیٹے کی بے مِثل نعمت کے لیے خُدا کا شُکر ہو۔
date: یکم جنوری،۲۰۰۰
