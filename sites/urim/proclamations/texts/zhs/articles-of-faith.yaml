title: 信条
subtitle: 耶稣基督后期圣徒教会
author: ''
verses:
- n: 1
  text: 我们信神，永恒的父，和祂的儿子耶稣基督，及圣灵。
- n: 2
  text: 我们信人会为自己的罪受惩罚，并不是为亚当的违诫。
- n: 3
  text: 我们信经由基督的赎罪，全人类都可以借着服从福音的律法和教仪而得救。
- n: 4
  text: 我们信福音的首要原则和教仪是：第一，对主耶稣基督的信心；第二，悔改；第三，为罪的赦免的浸没洗礼；第四，为圣灵恩赐的按手礼。
- n: 5
  text: 我们信人必须蒙神召唤，借着预言和有权柄者的按手礼，才可以传讲福音和执行其教仪。
- n: 6
  text: 我们信存在于原始教会中的同样组织，即：使徒、先知、牧师、教师、传福音的人等等。
- n: 7
  text: 我们信说方言、预言、启示、异象、治病、译方言的恩赐等等。
- n: 8
  text: 我们信翻译正确的《圣经》是神的话；我们也信《摩尔门经》是神的话。
- n: 9
  text: 我们信神已经启示的一切，及祂现在启示的一切，我们也信祂仍要启示许多有关神国度的伟大而重要的事。
- n: 10
  text: 我们信以色列的真正聚集和十支派的复兴；锡安（新耶路撒冷）会建立在美洲大陆上；基督会亲自在大地上统治；并且，大地会被更新且获得其乐园的荣耀。
- n: 11
  text: 我们要求有特权可依照自己良心的指引，崇拜全能的神，并容许所有的人都有同样的特权，让他们自行选择崇拜的方式、处所或对象。
- n: 12
  text: 我们信要服从国王、总统、统治者、和有执法权的长官，要服从、敬重和维护法律。
- n: 13
  text: 我们信要诚实、真诚、贞洁、仁慈、有品德，并为所有的人做有益的事；的确，我们可以说我们听从保罗的训诫——我们凡事相信、凡事盼望，我们已忍受了许多事情，希望凡事都能忍受。任何有品德、美好、受好评或值得赞扬的事，我们皆追求之。
signature: 约瑟·斯密。
