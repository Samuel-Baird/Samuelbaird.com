slug: restoration
language: lua
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=lua
retrieved: '2026-11-02'
title: Dipinguluja dia Tshiwudi tshia Lumu Luimpa lua Yezu Kilisto
subtitle: Dimanyisha dia Bidimu Nkama Ibidi kudi Buloba Bujima
author: Bulombodi Bukulu bua Kumpala ne Tshipangu tshia Bapostolo Dikumi ne Babidi ba Ekelezia wa Yezu
  Kilisto wa Bansantu ba Matuku a Ndekelu
note: Dimanyisha edi divua dibadibua kudi Mulombodi Mukulu Russell M. Nelson bu tshitupa tshia mukenji
  wenda mu Mpungilu Munena wa ku Tshidimu wa 190, Ngondo Muinayi 5, 2020, mu Salt Lake City, Utah.
paragraphs:
- Tudi tumanyisha ne moyo mushindama ne, Nzambi udi munanga bana Benda mu ditunga dionsu dia pa buloba
  bujima. Nzambi Tatu wakatupesha diledibua dia bunzambi, moyo udi kawuyi kufuanyikija, ne mulambu wa
  bupikudi udi kawuyi ndekelu wa Muanenda Munanga, Yezu Kilisto. Ku bukola bua Tatu, Yezu wakabika ku
  lufu kabidi ne kupetaye butshimunyi pa lufu. Udi Mupandishi wetu, Tshilejelu tshietu, ne Musungidi wetu.
- Kudi bidimu nkama ibidi bipita, mu dinda dilenga dia printemps mu 1820, nsonga Joseph Smith, ukeba kumanya
  ekelezia kayi wa yeya kubuela, wakaya mu dîtu bua kusambila pabuipi ne nzubu wenda ku mutu wa tshimenga
  tshia New York, USA. Uvua ne makonka atangila lupandu lua anyima wenda ne uvua mutuishibua ne Nzambi
  udi umuludika.
- Mu didipuekesha, tudi tumanyisha ne, mu diandamuna ku disambila dienda, Nzambi Tatu ne Muanenda, Yezu
  Kilisto, bakamuenekela Joseph ne kutuadijabu “dipingaja dia bintu bionsu” (Bienzedi 3:21) bumuvuabi
  bidianjila kuamba mu Bibiliya. Mu tshimônyi etshi, wakalonga ne, panyima pa lufu lua Bapostolo ba ntuadijilu,
  Ekelezia wa Kilisto wa mu Dipungila Dipia-Dipia wakajimina pa buloba. Joseph neikala nkatshi-nkatshi
  mu mudimu wa dialukila dienda.
- Tudi tujadika ne, ku buludiki bua Tatu ne Muana, batumibua ba mu diûlu bakalua bua kulongesha Joseph
  ne kuibakulula Ekelezia wa Yezu Kilisto. Yone Mutambuishi, mubika ku lufu, wakapinguluja bukôkeshi bua
  kutambuisha ku dinyisha bua dijimijibua dia mibi. Basatu ba ku Bapostolo ba ntuadijilu—Petelo, Yakobo,
  ne Yone—bakapinguluja bupostolo ne nsapi ya bukôkeshi bua buakuidi. Bakuabu bakalua pabu, munkatshi
  muabu Eliya, wakapinguluja bukôkeshi bua kusangisha mêku pamua bua kashidi mu malanda a tshiendelela
  adi matamba lufu.
- 'Tudi tujadika kabidi ne, Joseph Smith uvua mupeshibua dipa ne bukola bua Nzambi bua kuandamuna miandiku
  ya kala: Mukanda wa Molomo—Bujadiki Bukuabu bua Yezu Kilisto. Mabeji a mifundu eyi ya tshijila adi ne
  mulubu wa mudimu wa nkaya wa Yezu Kilisto munkatshi mua bantu ba ku Luseka lua Mbuelelu wa Diba mu tshitupa
  tshikesa panyima pa Dibika ku Lufu Dienda. Udi ulongesha kipatshila ka moyo ne umvuija malongesha a
  Kilisto, adi mikala munkatshi mua kipatshila aku. Bu mifundu milunda ya Bibiliya, Mukanda wa Molomo
  udi ujadika ne bantu bonsu badi bana baluma ne bakaji ba Tatu udi mu Diûlu wa dinanga, ne Yeya udi ne
  dilongolola dia bunzambi bua mioyo yetu, ne ne Muanenda, Yezu Kilisto, udi wakula lelu bifuanangana
  ne mu matuku a kala.'
- Tudi tumanyisha ne Ekelezia wa Yezu Kilisto wa Bansantu ba Matuku a Ndekelu, mulongolola mu matuku 6
  a Ngondo Muinayi, 1830, udi Ekelezia wa Kilisto wa mu Dipungila Dipia-Dipia, mupingulujibua. Ekelezia
  ewu udi musuikibua ku moyo mujalama wa dibua dienda dinena dia mu ditumba, Yezu Kilisto, ne ku Bupikudi
  Buenda bua kashidi ne Dibika Dienda dilelela dia ku lufu. Yezu Kilisto udi kabidi mubikila Bapostolo
  ne udi mubapesha bukôkeshi bua buakuidi. Udi utubikila bonsu bua tulua kudiye ne ku Ekelezia Wenda,
  bua tuangata Nyuma wa Tshijila, milulu ya lupandu, ne tupeta disanka dia kashidi.
- Bidimu nkama ibidi bikadi bipita mpindiewu katshia Dipinguluja edi dienjibua kudi Nzambi Tatu ne Muanenda
  Munanga, Yezu Kilisto. Mbombo ya mu buloba bujima yakupukila dimanya dia malu mamba ku Nyuma â.
- Tudi tumanyisha ne disanka ne, Dipinguluja dilaya didi diya kumpala mu njila wa dibululuila didi ditungunuka.
  Buloba kabuakuikala kabidi momumua nansha, bualu Nzambi “[nea]sangisha bintu bionsu mu Kilisto” (Efeso
  1:10).
- Mu dinemeka ne dianyisha, tuetu bu Bapostolo Benda tudi tubikila bonsu bua bamanya—bu mutudi bamanya—ne,
  diûlu didi diunzuluka. Tudi tujadika ne Nzambi udi umanyisha disua Dienda bua bana Benda baluma ne bakaji
  bananga. Tudi tujadika ne aba bonsu badi balonga mu kusambila ngumu wa Dipinguluja, ne badi benza mu
  ditabuija, nebabeneshibua bua kupeta buabu bujadiki bua bunzambi buadi ne bua kipatshila kadi ka kulongolola
  buloba bua Dilua Dibidi dilaya dia Mukalenga ne Mupandishi wetu, Yezu Kilisto.
