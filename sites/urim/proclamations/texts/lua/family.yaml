title: Dîku
subtitle: Dimanyisha kudi ba pa Buloba
author: Bulombodi Bukulu bua Kumpala ne Tshipangu tshia Bapostolo Dikumi ne Babidi ba Ekelezia wa Yezu
  Kilisto wa Bansantu ba Matuku a Ndekelu
note: Dimanyisha edi divua dikala dibadibua kudi Mulombodi Mukulu Gordon B. Hinckley munda mua diyisha
  dienda dia mu Tshisangilu Tshinena tshia Tshisumbu Tshikuatshishi tshienza mu Ngondu wa tshitema 23,
  1995, ku Salt Lake City, Utah.
paragraphs:
- Tuetu, Bulombodi Bukulu bua Kumpala ne Tshipangu tshia Bapostolo Dikumi ne Babidi ba Ekelezia wa Yezu
  Kilisto wa Bansantu ba Matuku a Ndekelu, tudi tumanyisha ne moyo mushindama ne dibaka pankatshi pa muntu
  muluma ne muntu mukaji didi dijidila kudi Nzambi ne dîku didi pankatshi pa bulongolodi bua Mufuki bua
  mpungilu wa tshiendelela wa bana Benda.
- Bantu bonsu—baluma ne bakaji—badi bafukibua mu tshimfuanyi tshia Nzambi. Muntu yonsu udi muana wa nyuma
  wa muluma anyi wa mukaji munangibua wa baledi ba mu diûlu, ne, bu nanku, muntu yonsu udi ne ngikadilu
  ne mpungilu wa bunzambi. Buluma ne bukaji bidi bikala mushindu wa mushinga wa nsungulujilu wa bantu
  mu bumuntu ne kipatshila bia muntu yonsu, kumpala kua kulua pa buloba, mu matuku a lufu, ne mu tshiendelela.
- Kumpala kua kulua pa buloba, nyuma ya bana ba baluma ne ba bakaji ivua mimanya Nzambi ne ivua imukukuila
  bu Tatu wabu wa Tshiendelela. Yakitaba bulongolodi Buenda buvua bana Benda ne bua kupetela mubidi wa
  musunyi ne kupeta dimanya mu dienza dia malu pa buloba, bua kuya kumpala batangila ku buakana ne ku
  ndekelu, kupeta mpungilu wabu wa bunzambi bu bapianyi ba moyo wa tshiendelela. Bulongolodi bua Nzambi
  bua disanka budi bufila njila bua malanda a mu dîku atungunuka dia muamua dia lufu. Milulu ne bipungidi
  bia tshijila bia mu ntempelo minsantu bidi bienza bua bantu bapingana ku mesu kua Nzambi ne bua mêku
  adisangisha bua tshiendelela.
- Mukenji wa kumpala uvua Nzambi mupesha Adama ne Eva uvua utangila dikumbana diabu dia buledi bu muluma
  ne mukaji. Tudi tumanyisha ne mukenji wa Nzambi bua bana Benda bavulangana ne bûja buloba utshidiku
  ne bukola buawu. Tudi tumanyisha kabidi ne Nzambi mmufila mukenji wa ne bukola bua tshijila bua lulelu
  budi ne bua kuenzeka amu pankatshi pa muntu muluma ne mukaji, basedibua bilondeshila ku mikenji bu muluma
  ne mukaji.
- Tudi tumanyisha ne mushindu udi moyo wa pa buloba ufukibua udi mujidila kudi Nzambi. Tudi tujadika tshijila
  tshia moyo ne mushinga wawu mu bulongolodi bua tshiendelela bua Nzambi.
- Muluma ne mukaji badi ne bujitu bushindama bua kunangangana ne kuambuluishangana ne kukuba bana babu.
  “Bana badi bupianyi bufuma kudi Mukalenga” (Misambu 127:3). Baledi badi ne mudimu wa tshijila wa kukolesha
  bana babu mu dinanga ne mu buakana, kukumbaja majinga abu a mu mubidi ne a mu nyuma ne kubalongesha
  mua kunangangana ne kusadilangana, kulama mikenji ya Nzambi, ne kuikala bena ditunga badi balama mikenji
  miaba yonsu idibu basombela. Baluma ne Bakaji—bamamu ne batatu—nebikala mu tshilumbu kumpala kua Nzambi
  pikalabu kabayi bandamuna ku majitu â.
- Dîku didi dijidila kudi Nzambi. Dibaka pankatshi pa muntu muluma ne muntu mukaji didi dishikaminu mu
  bulongolodi Buenda bua tshiendelela. Bana badi ne bunema bua kuledibua munda mua milayi ya mu dibaka,
  ne bua kukoleshibua kudi tatu ne mamu badi banemeka malaya a mu dibaka ne lulamatu lonsu. Disanka dia
  mu nsombelu wa mu dîku didi mua kupeteka menamena mu dieyemena ku malongesha a Mukalenga Yezu Kilisto.
  Mabaka ne mêku adi aya kumpala, adi masombeshibua ne malamibua pa mayisha a ditabuija, disambila, dikudimuna
  dia mutshima, difuilangana lusa, kanemu, dinanga, moyo muimpa, mudimu, ne manaya mimpa a kumbusha nawu
  lutetuku. Ku ndongoluelu wa Nzambi, batatu badi ne bua kulombola mêku abu mu dinanga ne mu buakana ne
  badi ne bujitu bua kuandamuna ku majinga ne kukuba mêku abu. Bamamu badi nangananga ne bujitu bua bundeji
  bua bana babu. Mu majitu a tshijila â, batatu ne bamamu badi ne bua kuambuluishangana bu bakuatshishanganyi
  ba momumua. Bulema, lufu, anyi malu makuabu adi mua kukengela dîbidila dia dîku ne dîku. Dîku dinena
  didi ne bua kuambuluisha padiku dijinga.
- Tudi tudimuisha ne bantu badi bashipa bipungidi bia bunonoka, badi bakengesha babakibu nabu anyi bana
  babu balela, anyi kabayi bakumbaja majitu abu a mu dîku, nebimana dimua dituku kumpala kua Nzambi bua
  kuandamuna ku malu â. Tudi kabidi tudimuisha ne dinyangakaja dia dîku nedituala makenga mapita bukola
  madianjila kuamba kudi bambi ba kala ne ba lelu pa mutu pa bantu, pa nsangilu ne pa matunga.
- Tudi tubikila bena matunga bakana ne balombodi ba makalenga a miaba yonsu bua batangalaja lumu lua bipiminu
  bimana kulongolola ebi bua kulama ne kukankamika dîku bu tshibambalu tshikulu tshia mu bu kua bantu.
