title: A Restauração da Plenitude do Evangelho de Jesus Cristo
subtitle: Uma Proclamação Bicentenária ao Mundo
author: A Primeira Presidência e o Conselho dos Doze Apóstolos d’A Igreja de Jesus Cristo dos Santos dos
  Últimos Dias
note: Esta proclamação foi lida pelo Presidente Russell M. Nelson como parte da sua mensagem na 190.ª
  Conferência Geral Anual, a 5 de abril de 2020, em Salt Lake City, Utah.
paragraphs:
- Proclamamos solenemente que Deus ama os Seus filhos em todas as nações do mundo. Deus, o Pai, deu-nos
  o nascimento divino, a vida incomparável e o sacrifício expiatório infinito do Seu Filho Amado, Jesus
  Cristo. Pelo poder do Pai, Jesus ressuscitou e conquistou a vitória sobre a morte. Ele é o nosso Salvador,
  o nosso Exemplo e o nosso Redentor.
- Há duzentos anos, numa linda manhã de primavera em 1820, o jovem Joseph Smith, ao procurar saber a qual
  igreja se deveria filiar, foi a um bosque orar, perto da sua casa, no norte do Estado de Nova Iorque,
  nos EUA. Ele tinha perguntas sobre a salvação da sua alma e confiava que Deus o iria orientar.
- Com humildade, declaramos que, em resposta à sua oração, Deus, o Pai, e o Seu Filho, Jesus Cristo, apareceram
  a Joseph e inauguraram a “restauração de todas as coisas” (Atos 3:21), conforme predito na Bíblia. Nesta
  visão, ele aprendeu que, após a morte dos primeiros Apóstolos, a Igreja de Cristo do Novo Testamento
  tinha desaparecido da Terra. Joseph seria fundamental para o regresso da mesma.
- Afirmamos que, sob a orientação do Pai e do Filho, mensageiros celestes vieram instruir Joseph e restabelecer
  a Igreja de Jesus Cristo. João Batista ressuscitado restaurou a autoridade para batizar por imersão
  para a remissão de pecados. Três dos primeiros doze Apóstolos — Pedro, Tiago e João — restauraram o
  apostolado e as chaves da autoridade do sacerdócio. Outros vieram também, inclusive Elias, o profeta,
  que restaurou a autoridade para unir as famílias para sempre, em relacionamentos eternos que transcendem
  a morte.
- 'Testemunhamos também que Joseph Smith recebeu o dom e o poder de Deus para traduzir um registo antigo:
  o Livro de Mórmon — Outro Testamento de Jesus Cristo. As páginas deste texto sagrado incluem um relato
  do ministério pessoal de Jesus Cristo entre o povo do Hemisfério Ocidental, logo após a Sua Ressurreição.
  Este livro ensina o propósito da vida e explica a doutrina de Cristo, que é essencial para esse propósito.
  Enquanto livro de escritura que acompanha a Bíblia, o Livro de Mórmon testifica que todos os seres humanos
  são filhos e filhas de um Pai Celestial amoroso, que Ele tem um plano divino para a nossa vida e que
  o Seu Filho, Jesus Cristo, fala nos nossos dias tal como nos tempos antigos.'
- Declaramos que A Igreja de Jesus Cristo dos Santos dos Últimos Dias, organizada a 6 de abril de 1830,
  é a Igreja de Cristo do Novo Testamento que foi restaurada. Esta Igreja está ancorada na vida perfeita
  d’Aquele que é a sua principal pedra de esquina, Jesus Cristo, e na Sua Expiação infinita e Ressurreição
  literal. Uma vez mais, Jesus Cristo chamou Apóstolos e deu-lhes a autoridade do sacerdócio. Ele convida-nos
  a todos a vir a Ele e à Sua Igreja, para receber o Espírito Santo e as ordenanças de salvação, e para
  obter alegria duradoura.
- Decorreram duzentos anos desde que Deus, o Pai, e o Seu Filho Amado, Jesus Cristo, deram início a esta
  Restauração. Milhões de pessoas, pelo mundo fora, aceitaram o conhecimento destes eventos profetizados.
- Temos a alegria de declarar que a Restauração prometida prossegue através de revelação contínua. A Terra
  nunca mais será a mesma, dado que Deus irá “congregar em Cristo todas as coisas” (Efésios 1:10).
- Com reverência e gratidão, nós, como Seus Apóstolos, convidamos todos a saber — tal como nós sabemos
  — que os Céus estão abertos. Afirmamos que Deus está a dar a conhecer a Sua vontade para os Seus amados
  filhos e filhas. Testificamos que quem estudar a mensagem da Restauração, em espírito de oração, e agir
  com fé, será abençoado com a obtenção do seu próprio testemunho da divindade da Restauração e do seu
  propósito de preparar o mundo para a prometida Segunda Vinda do nosso Senhor e Salvador, Jesus Cristo.
