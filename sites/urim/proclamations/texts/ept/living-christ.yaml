title: O Cristo Vivo
subtitle: O Testemunho dos Apóstolos
author: A Igreja de Jesus Cristo do Santos dos Últimos Dias
paragraphs:
- Ao comemorarmos o nascimento de Jesus Cristo, ocorrido há dois milénios, oferecemos o nosso testemunho
  da realidade da Sua vida incomparável e do poder infinito do Seu grande sacrifício expiatório. Nenhum
  outro teve uma influência tão profunda sobre todos os que já viveram e ainda hão de viver sobre a Terra.
- Ele foi o Grande Jeová do Velho Testamento e o Messias do Novo Testamento. Sob a direção do Seu Pai,
  Ele foi o criador da Terra. “Todas as coisas foram feitas por ele, e sem ele nada do que foi feito se
  fez” (João 1:3). Ainda que sem pecado, Ele foi batizado para cumprir toda a justiça. Ele “andou fazendo
  o bem” (Atos 10:38), mas foi desprezado por isso. O Seu evangelho era uma mensagem de paz e boa vontade.
  Pediu a todos que seguissem o Seu exemplo. Andou pelas ruas da Palestina, a curar os doentes, a dar
  visão aos cegos e a levantar os mortos. Ensinou as verdades da eternidade, a realidade da nossa existência
  pré-mortal, o propósito da nossa vida na Terra e o potencial dos filhos e filhas de Deus na vida vindoura.
- Ele instituiu o sacramento como uma lembrança do Seu grande sacrifício expiatório. Foi preso e alvo
  de acusações falaciosas, declarado culpado para satisfazer uma multidão enfurecida e sentenciado a morrer
  na cruz do Calvário. Ele deu a Sua vida para expiar pelos pecados de toda a humanidade. D’Ele viria
  uma grande dádiva vicária em benefício de todos os que viveriam na Terra.
- Testificamos solenemente que a Sua vida, que é o ponto central de toda a história da humanidade, não
  começou em Belém nem terminou no Calvário. Ele foi o Primogénito do Pai, o Filho Unigénito na carne,
  o Redentor do mundo.
- Ele ergueu-se do túmulo para ser “as primícias dos que dormem” (1 Coríntios 15:20). Como Senhor Ressurreto,
  visitou aqueles que tinha amado em vida. Ele também ministrou às Suas “outras ovelhas” (João 10:16)
  na América antiga. No mundo moderno, Ele e o Seu Pai apareceram ao jovem Joseph Smith, dando início
  à tão prometida “dispensação da plenitude dos tempos” (Efésios 1:10).
- 'Do Cristo Vivo, o Profeta Joseph escreveu: “Os seus olhos eram como uma labareda de fogo; os cabelos
  [da] sua cabeça eram brancos como a pura neve; o seu semblante resplandecia mais do que o brilho do
  sol; e a sua voz era como o ruído de muitas águas, sim, a voz de Jeová, que dizia:'
- Eu sou o primeiro e o último; sou o que vive, sou o que foi morto; eu sou [o] vosso advogado junto ao
  Pai” (D&C 110:3–4).
- 'D’Ele o Profeta também declarou: “E agora, depois dos muitos testemunhos que se prestaram dele, este
  é o testemunho, último de todos, que nós damos dele: Que ele vive!'
- Porque o vimos, sim, à direita de Deus; e ouvimos a voz testificando que ele é o Unigénito do Pai —
- Que por ele e [através] dele e dele os mundos são e foram criados; e [os] seus habitantes são filhos
  e filhas gerados para Deus” (D&C 76:22–24).
- Declaramos solenemente que o Seu sacerdócio e a Sua Igreja foram restaurados na Terra — “edificados
  sobre o fundamento dos apóstolos e dos profetas, de que Jesus Cristo é a principal pedra [de] esquina”
  (Efésios 2:20).
- Testificamos que Ele um dia voltará à Terra. “E a glória do Senhor se manifestará, e toda a carne juntamente
  a verá…” (Isaías 40:5). Ele governará como o Rei dos Reis e reinará como o Senhor dos Senhores, e todo
  o joelho se dobrará e toda a língua confessará em adoração diante d’Ele. Todos nós compareceremos para
  ser julgados por Ele, segundo as nossas obras e os desejos do nosso coração.
- Prestamos testemunho, como Seus Apóstolos devidamente ordenados, de que Jesus é o Cristo Vivo, o Filho
  imortal de Deus. Ele é o grande Rei Emanuel, que hoje se encontra à direita do Seu Pai. Ele é a luz,
  a vida e a esperança do mundo. O Seu caminho é aquele que conduz à felicidade nesta vida e à vida eterna
  no mundo vindouro. Graças demos a Deus pela incomparável dádiva do Seu Filho divino.
