title: Os Artigos de Fé
subtitle: d’A Igreja de Jesus Cristo dos Santos dos Últimos Dias
author: ''
verses:
- n: 1
  text: Cremos em Deus, o Pai Eterno, e no Seu Filho, Jesus Cristo, e no Espírito Santo.
- n: 2
  text: Cremos que os homens serão punidos pelos seus próprios pecados e não pela transgressão de Adão.
- n: 3
  text: Cremos que através da Expiação de Cristo, toda a humanidade pode ser salva, pela obediência às
    leis e ordenanças do Evangelho.
- n: 4
  text: 'Cremos que os primeiros princípios e ordenanças do Evangelho são: primeiro, Fé no Senhor Jesus
    Cristo; segundo, Arrependimento; terceiro, Batismo por imersão para a remissão de pecados; quarto,
    Imposição de mãos para o dom do Espírito Santo.'
- n: 5
  text: Cremos que um homem deve ser chamado por Deus, por profecia e pela imposição de mãos daqueles
    que estão autorizados, para pregar o Evangelho e administrar as suas ordenanças.
- n: 6
  text: Cremos na mesma organização que existia na Igreja Primitiva, nomeadamente, apóstolos, profetas,
    pastores, mestres, evangelistas e assim por diante.
- n: 7
  text: Cremos no dom de línguas, profecia, revelação, visões, cura, interpretação de línguas e assim
    por diante.
- n: 8
  text: Cremos que a Bíblia é a palavra de Deus, desde que traduzida corretamente; cremos também que o
    Livro de Mórmon é a palavra de Deus.
- n: 9
  text: Cremos em tudo o que Deus já revelou, em tudo o que Ele revela agora, e cremos que Ele ainda revelará
    muitas coisas grandiosas e importantes referentes ao Reino de Deus.
- n: 10
  text: Cremos na congregação literal do povo de Israel e na restauração das Dez Tribos; que Sião (a Nova
    Jerusalém) será construída no continente americano; que Cristo reinará pessoalmente sobre a Terra;
    e que a Terra será renovada e receberá a sua glória paradisíaca.
- n: 11
  text: Reivindicamos o privilégio de adorar o Deus Todo-Poderoso de acordo com os ditames da nossa própria
    consciência, e permitimos a todos o mesmo privilégio, deixando-os adorar como, onde ou o que pretenderem.
- n: 12
  text: Cremos em estar sujeitos a reis, presidentes, governantes e magistrados; em obedecer, honrar e
    apoiar a lei.
- n: 13
  text: 'Cremos em ser honestos, verdadeiros, castos, benevolentes, virtuosos e em fazer o bem a todos
    os homens; de facto, podemos dizer que seguimos a admoestação de Paulo: Cremos em todas as coisas,
    confiamos em todas as coisas, temos suportado muitas coisas e esperamos ter a capacidade de tudo suportar.
    Se houver alguma coisa virtuosa, amável, de boa fama ou louvável, nós a procuraremos.'
signature: Joseph Smith.
