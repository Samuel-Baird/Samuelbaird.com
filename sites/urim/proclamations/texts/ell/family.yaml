title: Η οικογένεια
subtitle: Μία επίσημη διακήρυξη προς όλο τον κόσμο
author: Η Πρώτη Προεδρία και το Συμβούλιο των Δώδεκα Αποστόλων της Εκκλησίας του Ιησού Χριστού των Αγίων
  των Τελευταίων Ημερών
note: Η παρούσα διακήρυξη ανεγνώσθη από τον Πρόεδρο Γκόρντον Χίνκλυ ως μέρος του μηνύματός του στη Γενική
  Συνέλευση της Εταιρείας Αρωγής, η οποία έγινε στις 23 Σεπτεμβρίου 1995, στη Σωλτ Λέηκ Σίτυ της Γιούτας.
paragraphs:
- Εμείς, η Πρώτη Προεδρία και το Συμβούλιο των Δώδεκα Αποστόλων της Εκκλησίας του Ιησού Χριστού των Αγίων
  των Τελευταίων Ημερών, διακηρύττουμε πανηγυρικά ότι ο γάμος μεταξύ του άνδρα και της γυναίκας έχει ορισθεί
  από τον Θεό προς τους ανθρώπους και ότι η οικογένεια αποτελεί στοιχείο υψίστης σπουδαιότητος στο σχέδιο
  του Δημιουργού για τον αιώνιο προορισμό των τέκνων Του.
- Όλα τα ανθρώπινα πλάσματα –άρρενα και θήλεα– έχουν δημιουργηθεί κατά την εικόνα του Θεού. Ο κάθε άνθρωπος
  είναι ένας αγαπημένος γυιος-πνεύμα ή θυγατέρα-πνεύμα ουράνιων γονέων και, ως τέτοιος, διαθέτει μία θεία
  φύση και έναν θείο προορισμό. Το φύλο είναι ένα σπουδαιότατο χαρακτηριστικό της προγήινης, γήινης και
  αιώνιας ταυτότητας και σκοπού του κάθε ατόμου.
- Κατά την προγήινη ζωή, οι γυιοι-πνεύματα και οι θυγατέρες-πνεύματα γνώριζαν και λάτρευαν τον Θεό ως
  τον Αιώνιο Πατέρα τους, εδέχθησαν δε το σχέδιό Του, βάσει του οποίου τα τέκνα Του θα μπορούσαν να αποκτήσουν
  ένα υλικό σώμα από σάρκα και οστά, καθώς και γήινες εμπειρίες για να προαχθούν προς την τελείωση και
  τελικά να πραγματώσουν τον θείο προορισμό τους ως κληρονόμων της αιώνιας ζωής. Το αιώνιο σχέδιο της
  ευδαιμονίας καθιστά δυνατή την ύπαρξη των οικογενειακών σχέσεων και μετά θάνατον. Ιερές διατάξεις και
  διαθήκες, τελούμενες εντός των ιερών ναών, δίνουν τη δυνατότητα σε κάθε άνθρωπο να επιστρέψει στην παρουσία
  του Θεού, και στις οικογένειες να μείνουν ενωμένες στην αιωνιότητα.
- Η πρώτη εντολή την οποία ο Θεός έδωσε στον Αδάμ και στην Εύα αναφερόταν στη δυνατότητα την οποία είχαν
  ως σύζυγοι να γίνουν γονείς. Διακηρύττουμε ότι η εντολή του Θεού προς τα παιδιά Του να πολλαπλασιασθούν
  και να κατακυριεύσουν τη Γη ισχύει και στο παρόν. Διακηρύττουμε περαιτέρω ότι ο Θεός έχει δώσει εντολή
  να χρησιμοποιούνται οι ιερές δυνάμεις της τεκνοποιίας μόνο μεταξύ ενός άνδρα και μίας γυναίκας, που
  έχουν τελέσει νόμιμο γάμο ως σύζυγοι.
- Διακηρύττουμε ότι η δημιουργία της θνητής ζωής εδώ στη Γη έχει θεϊκή προέλευση. Δίνουμε τη διαβεβαίωση
  ότι η ζωή είναι ιερή και ότι έχει μεγίστη σημασία στο αιώνιο σχέδιο του Θεού.
- Οι σύζυγοι έχουν την ιερή υποχρέωση να αγαπούν και να φροντίζουν τόσο ο ένας τον άλλον όσο και τα παιδιά
  αυτών. «Κληρονομιά από τον Κύριο είναι τα παιδιά» (Ψαλμοί 127:3). Οι γονείς έχουν ιερό καθήκον να αναθρέψουν
  τα παιδιά τους με αγάπη και χρηστότητα, να παράσχουν τα αναγκαία για την ικανοποίηση των σωματικών και
  ψυχικών τους αναγκών και να τα διδάξουν να αγαπούν και να υπηρετούν αλλήλους, να τηρούν τις εντολές
  του Θεού και να είναι νομοταγείς πολίτες, όπου και αν ζουν. Οι σύζυγοι –μητέρα και πατέρας– θα κληθούν
  να λογοδοτήσουν ενώπιον του Θεού, εάν παραμελήσουν αυτές τους τις υποχρεώσεις.
- Η οικογένεια έχει δοθεί ως διάταξη από τον Θεό. Ο γάμος μεταξύ ενός άνδρα και μίας γυναίκας είναι πολύ
  σημαντικός για το αιώνιο σχέδιό Του. Τα παιδιά έχουν το δικαίωμα να γεννηθούν από γονείς, οι οποίοι
  έχουν νυμφευθεί, και να ανατραφούν από έναν πατέρα και μία μητέρα που τιμούν τον γαμήλιο όρκο τους εν
  πλήρει πίστει. Η ευτυχία της ζωής μέσα στην οικογένεια μπορεί να επιτευχθεί με μεγαλύτερη ευκολία, όταν
  στηρίζεται στις διδαχές του Κυρίου Ιησού Χριστού. Οι επιτυχημένοι γάμοι και οι επιτυχημένες οικογένειες
  βασίζονται και διατηρούνται επί των αρχών της πίστεως, της προσευχής, της μετάνοιας, της συγχώρησης,
  του σεβασμού, της αγάπης, της συμπόνιας, της εργασίας και των εποικοδομητικών ψυχαγωγικών δραστηριοτήτων.
  Βάσει του θεϊκού σχεδίου, οι πατέρες οφείλουν να ηγούνται των οικογενειών με αγάπη και χρηστότητα, έχουν
  δε την ευθύνη να παράσχουν τα αναγκαία για τη ζωή και την προστασία των οικογενειών τους. Οι μητέρες
  έχουν την πρωταρχική ευθύνη της ανατροφής των παιδιών. Στις ιερές αυτές υποχρεώσεις, οι δύο σύζυγοι
  είναι υποχρεωμένοι να βοηθούν εξίσου ο ένας τον άλλον, ως γονείς. Αναπηρία, θάνατος ή άλλες περιστάσεις
  ίσως δημιουργήσουν την ανάγκη εφαρμογής των κανόνων αυτών από τον έναν μόνο γονέα. Ο ευρύτερος οικογενειακός
  κύκλος έχει την υποχρέωση της προσφοράς βοηθείας, όταν οι περιστάσεις απαιτούν κάτι τέτοιο.
- Προειδοποιούμε όσους παραβαίνουν διατάξεις αφορώσες στην αγνότητα, βιαιοπραγούν επί των συζύγων ή των
  παιδιών τους ή δεν εκπληρώνουν τις οικογενειακές τους υποχρεώσεις, ότι κάποια ημέρα θα σταθούν ενώπιον
  του Θεού και θα δώσουν λόγο. Επίσης, προειδοποιούμε ότι η διάλυση της οικογένειας θα επιφέρει στα άτομα,
  στην κοινωνία και τα έθνη τις φοβερές καταστροφές, για τις οποίες έχουν μιλήσει οι αρχαίοι και σύγχρονοι
  προφήτες.
- Κάνουμε έκκληση προς τους υπεύθυνους πολίτες και τους αξιωματούχους των κυβερνήσεων σε όλο τον κόσμο
  να δημιουργήσουν τις κατάλληλες προϋποθέσεις για την εφαρμογή αυτών των αρχών, οι οποίες υπάρχουν για
  να στηρίξουν και να ενδυναμώσουν την οικογένεια ως θεμέλια μονάδα της κοινωνίας.
