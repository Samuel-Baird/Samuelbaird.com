title: Η Αποκατάσταση της πληρότητας του Ευαγγελίου του Ιησού Χριστού
subtitle: Μία δισεκατονταετής διακήρυξη προς τον κόσμο
author: Η Πρώτη Προεδρία και το Συμβούλιο των Δώδεκα Αποστόλων της Εκκλησίας του Ιησού Χριστού των Αγίων
  των Τελευταίων Ημερών
note: Η παρούσα διακήρυξη ανεγνώσθη από τον Πρόεδρο Ράσσελ Μ. Νέλσον ως μέρος του μηνύματός του στην 190ή
  Εαρινή Γενική Συνέλευση στις 5 Απριλίου 2020, στη Σωλτ Λέηκ Σίτυ της Γιούτας.
paragraphs:
- Διακηρύσσουμε επισήμως ότι ο Θεός αγαπά τα τέκνα Του σε κάθε έθνος του κόσμου. Ο Θεός Πατέρας μάς έχει
  δώσει τη θεία γέννηση, την απαράμιλλη ζωή και την άπειρη εξιλεωτική θυσία του Αγαπημένου Του Υιού, Ιησού
  Χριστού. Με τη δύναμη του Πατέρα, ο Ιησούς αναστήθηκε και κέρδισε τη νίκη επί του θανάτου. Είναι ο Σωτήρας
  μας, το Παράδειγμά μας και ο Λυτρωτής μας.
- Πριν από διακόσια χρόνια, ένα όμορφο ανοιξιάτικο πρωί το 1820, ο νεαρός Τζόζεφ Σμιθ, αναζητώντας να
  μάθει σε ποια εκκλησία να προσχωρήσει, πήγε στο δάσος για να προσευχηθεί κοντά στο σπίτι του στο βόρειο
  τμήμα της πολιτείας της Νέας Υόρκης των Η.Π.Α. Είχε ερωτήματα σχετικώς με τη σωτηρία της ψυχής του και
  ευελπιστούσε ότι ο Θεός θα τον κατηύθυνε.
- Με ταπεινότητα, διακηρύσσουμε ότι σε απάντηση της προσευχής του, ο Θεός Πατέρας και ο Υιός Του, Ιησούς
  Χριστός, εμφανίσθηκαν στον Τζόζεφ και εγκαινίασαν την «αποκατάσταση, για όλα» (Πράξεις 3:21) όπως προελέχθη
  στη Βίβλο. Σε αυτό το όραμα, έμαθε ότι μετά τον θάνατο των πρώτων Αποστόλων, η Εκκλησία του Χριστού
  κατά την Καινή Διαθήκη χάθηκε από τη Γη. Ο Τζόζεφ θα συντελούσε τα μέγιστα στην επιστροφή της.
- Διαβεβαιώνουμε ότι υπό την καθοδήγηση του Πατέρα και του Υιού, επουράνιοι αγγελιαφόροι ήλθαν για να
  δώσουν οδηγίες στον Τζόζεφ και για να επανιδρύσουν την Εκκλησία του Ιησού Χριστού. Ο ανεστημένος Ιωάννης
  ο Βαπτιστής αποκατέστησε την εξουσία να βαπτίζουμε για άφεση των αμαρτιών. Τρεις από τους αρχικούς δώδεκα
  Αποστόλους –ο Πέτρος, ο Ιάκωβος και ο Ιωάννης– αποκατέστησαν την αποστολική ιδιότητα και τα κλειδιά
  της εξουσίας της ιεροσύνης. Άλλοι ήλθαν επίσης, συμπεριλαμβανομένου του Ηλιού του Θεσβίτου, ο οποίος
  αποκατέστησε την εξουσία να ενώνουμε οικογένειες μαζί για πάντα σε αιώνιες σχέσεις που υπερβαίνουν τον
  θάνατο.
- 'Μαρτυρούμε περαιτέρω ότι στον Τζόζεφ Σμιθ εδόθη το χάρισμα και η δύναμη από τον Θεό να μεταφράσει ένα
  αρχαίο χρονικό: το Βιβλίο του Μόρμον–Άλλη μία μαρτυρία για τον Ιησού Χριστό. Σελίδες αυτού του ιερού
  κειμένου περιλαμβάνουν μία αφήγηση για την προσωπική διακονία του Ιησού Χριστού στους ανθρώπους στο
  δυτικό ημισφαίριο λίγο μετά την Ανάστασή Του. Διδάσκει για τον σκοπό της ζωής και εξηγεί τη διδαχή του
  Χριστού, η οποία είναι κεντρική σε αυτόν τον σκοπό. Ως συνοδευτική γραφή της Βίβλου, το Βιβλίο του Μόρμον
  καταθέτει μαρτυρία ότι όλοι οι άνθρωποι είναι υιοί και θυγατέρες του στοργικού Πατέρα στους Ουρανούς,
  ότι Εκείνος έχει ένα θείο σχέδιο για τη ζωή μας και ότι ο Υιός Του, Ιησούς Χριστός, μιλά σήμερα όπως
  και στην αρχαία εποχή.'
- Δηλώνουμε ότι η Εκκλησία του Ιησού Χριστού των Αγίων των Τελευταίων Ημερών, που οργανώθηκε στις 6 Απριλίου
  1830, είναι η Εκκλησία του Χριστού κατά την Καινή Διαθήκη που αποκαταστάθηκε. Αυτή η Εκκλησία είναι
  αγκυροβολημένη στην τέλεια ζωή του κυρίου ακρογωνιαίου λίθου της, του Ιησού Χριστού, και στην άπειρη
  Εξιλέωση και κυριολεκτική Ανάστασή Του. Ο Ιησούς Χριστός έχει καλέσει για άλλη μια φορά Αποστόλους και
  τους έχει δώσει την εξουσία της ιεροσύνης. Μας καλεί όλους να έλθουμε σε Εκείνον και στην Εκκλησία Του,
  να λάβουμε το Άγιο Πνεύμα, τις διατάξεις της σωτηρίας και να κερδίσουμε ακατάλυτη χαρά.
- Έχουν περάσει διακόσια χρόνια από τότε που ξεκίνησε αυτή η Αποκατάσταση από τον Θεό Πατέρα και τον Αγαπημένο
  Του Υιό, Ιησού Χριστό. Εκατομμύρια σε όλον τον κόσμο έχουν ασπασθεί τη γνώση γι’ αυτά τα προφητευθέντα
  γεγονότα.
- Δηλώνουμε ασμένως ότι η υπεσχημένη Αποκατάσταση προχωρεί μέσω συνεχούς αποκάλυψης. Η Γη δεν θα είναι
  ποτέ πια η ίδια, καθώς ο Θεός θα «ανακεφαλαιώσει τα πάντα στον Χριστό» (Προς Εφεσίους 1:10).
- Με ευλάβεια και ευγνωμοσύνη, εμείς ως Απόστολοί Του καλούμε όλους να γνωρίσουν –όπως γνωρίζουμε εμείς–
  ότι οι ουρανοί είναι ανοικτοί. Διαβεβαιώνουμε ότι ο Θεός γνωστοποιεί το θέλημά Του για τους αγαπημένους
  υιούς και τις αγαπημένες θυγατέρες Του. Καταθέτουμε μαρτυρία ότι όσοι μελετούν με προσευχή το μήνυμα
  της Αποκατάστασης και ενεργούν με πίστη θα ευλογηθούν να αποκτήσουν τη δική τους μαρτυρία της θειότητάς
  της και του σκοπού της, για να προετοιμάσουν τον κόσμο για την υπεσχημένη Δευτέρα Παρουσία του Κυρίου
  και Σωτήρος μας, Ιησού Χριστού.
