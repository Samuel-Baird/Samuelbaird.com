title: Τα Άρθρα της Πίστεως
subtitle: της Εκκλησίας του Ιησού Χριστού των Αγίων των Τελευταίων Ημερών
author: ''
verses:
- n: 1
  text: Πιστεύουμε στον Θεό, τον Αιώνιο Πατέρα, και στον Υιό Του, Ιησού Χριστό, και στο Άγιο Πνεύμα.
- n: 2
  text: Πιστεύουμε ότι οι άνθρωποι θα τιμωρηθούν για τις δικές τους αμαρτίες και όχι για το παράπτωμα
    του Αδάμ.
- n: 3
  text: Πιστεύουμε ότι μέσω της Εξιλέωσης του Χριστού, όλη η ανθρωπότητα μπορεί να σωθεί δια της υπακοής
    στους νόμους και τις διατάξεις του Ευαγγελίου.
- n: 4
  text: 'Πιστεύουμε ότι οι πρώτες αρχές και διατάξεις του Ευαγγελίου είναι: πρώτον, Πίστη στον Κύριο Ιησού
    Χριστό, δεύτερον, Μετάνοια, τρίτον, Βάπτισμα για την άφεση των αμαρτιών, τέταρτον, Χειροθεσία για
    τη δωρεά του Αγίου Πνεύματος.'
- n: 5
  text: Πιστεύουμε ότι ένας άνθρωπος πρέπει να καλείται από τον Θεό, με προφητεία και με χειροθεσία από
    εκείνους που κατέχουν την εξουσία, για να κηρύττει το Ευαγγέλιο και να τελεί τις διατάξεις του.
- n: 6
  text: Πιστεύουμε στην ίδια οργάνωση που υπήρχε στην Πρώτη Εκκλησία, δηλαδή, σε αποστόλους, προφήτες,
    ιερείς, διδασκάλους, ευαγγελιστές και τα λοιπά.
- n: 7
  text: Πιστεύουμε στο χάρισμα των γλωσσών, της προφητείας, της αποκάλυψης, των οραμάτων, της ίασης, της
    διερμηνείας γλωσσών και τα λοιπά.
- n: 8
  text: Πιστεύουμε ότι η Αγία Γραφή είναι ο Λόγος του Θεού στον βαθμό που μεταφράζεται σωστά. Πιστεύουμε
    επίσης ότι το Βιβλίο του Μόρμον είναι ο Λόγος του Θεού.
- n: 9
  text: Πιστεύουμε σε όλα αυτά που ο Θεός έχει αποκαλύψει, όλα αυτά που τώρα αποκαλύπτει και πιστεύουμε
    ότι θα αποκαλύψει ακόμα πολλά, μεγάλα και σημαντικά πράγματα που αφορούν τη Βασιλεία του Θεού.
- n: 10
  text: Πιστεύουμε στην κυριολεκτική συνάθροιση του Ισραήλ και στην αποκατάσταση των Δέκα Φυλών, ότι η
    Σιών (η Νέα Ιερουσαλήμ) θα χτιστεί επάνω στην Αμερικανική ήπειρο, ότι ο Χριστός θα βασιλεύσει προσωπικά
    επάνω στη γη, και ότι η γη θα ανανεωθεί και θα λάβει την παραδείσια δόξα της.
- n: 11
  text: Αξιούμε το προνόμιο να λατρεύουμε τον Παντοδύναμο Θεό σύμφωνα με τις υπαγορεύσεις της συνείδησής
    μας και άναγνωρίζουμε σε όλους τους ανθρώπους το ίδιο προνόμιο, ας λατρεύουν όπως, όπου και ό,τι επιθυμούν.
- n: 12
  text: Πιστεύουμε ότι υποκείμεθα σε βασιλιάδες, προέδρους, κυβερνήτες και δικαστές, τηρώντας, τιμώντας
    και υποστηρίζοντας τον νόμο.
- n: 13
  text: Πιστεύουμε ότι πρέπει να είμαστε έντιμοι, ειλικρινείς, αγνοί, καλοπροαίρετοι, ενάρετοι, και να
    κάνουμε καλό σε όλους τους ανθρώπους. Πράγματι, μπορούμε να πούμε ότι ακολουθούμε την προτροπή του
    Παύλου-Τα πάντα πιστεύουμε, τα πάντα ελπίζουμε, έχουμε υπομείνει πολλά και ελπίζουμε να είμαστε σε
    θέση να αντέξουμε τα πάντα. Εάν υπάρχουν ενάρετα, ωραία ή αξιόλογα ή αξιέπαινα πράγματα, αυτά και
    επιδιώκουμε.
signature: Τζόζεφ Σμιθ.
