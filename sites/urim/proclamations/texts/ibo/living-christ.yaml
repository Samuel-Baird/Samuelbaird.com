title: Kraịst Ahụ Dị ndụ
subtitle: Ama nke Ndị ozi
author: Nzukọ nsọ Ahụ nke Jizọs Kraịst nke Ndị nsọ Ụbọchị ikpeazụ a
paragraphs:
- Dị ka anyị na-echeta ọmụmụ nke Jizọs Kraịst puku afọ abụọ gara aga, anyị na-enye ama anyị nke eziokwu
  nke ndụ Ya na-enweghi atụ na eziokwu nke nnukwu aja mgbaghara mmehie Ya na-enweghị ọgwụgwụ. E nweghị
  onye ọzọ nweworo oke mmetụta n’isi ndị niile biworo ma ka ga-ebi n’elu ụwa.
- Ọ bụ Nnukwu Jehova nke Agba Ochie, Mezaya nke Agba Ọhụrụ. N’okpuru ntuziaka nke Nna Ya, Ọ bụ onye okike
  nke ụwa. “E sitere na ya kee ihe niile; ma o dighikwa ihe ọbụla e kere eke nke a na-ekeghị site na ya”
  (Jọn 1:3). Na-agbanyeghi enweghi mmehie, e mere Ya baptizim iji mejuputa ezi omume niile. O “jegharịrị
  na-eme ihe ọma” (Ọlụ Ndị-ozi 10:38), ma a kpọọ Ya asị maka ya. Ozi ọma Ya bụ ozi nke udo na uche ọma.
  Ọ rịọrọ ndị niile isoro ọmụmaatụ Ya. Ọ jere ije n’okporo ụzọ niile nke Palestin, na-agwọ ndị ọrịa, na-eme
  ka ndị kpuru isi hụ ụzọ, ma na-akpọlite ndị nwụrụ anwụ. Ọ kuziri eziokwu niile nke ebighị ebi, eziokwu
  nke ndụ tutu a bịa n’ụwa, ebumnoobi nke ndụ anyị n’ụwa, na ike mmepụta nke ụmụ ndị nwoke na ụmụ ndị
  nwanyị nke Chineke n’ụwa nke na-abịa abịa.
- O hiwere oriri nsọ dị ka ihe ncheta nke nnukwu aja mgbaghara mmehie Ya. A nwụchiri Ya ma maa Ya ikpe
  n’elu ebubo ụgha niile, maa ya ikpe iji mee ihe igwe mmadụ chọrọ, ma maa ikpe ọnwụ n’obe nke Kalvarị.
  O nyere ndụ Ya iji chụọ aja maka mmehie niile nke ụmụ mmadụ. Nke Ya bụ nnukwu onyinye nnọchite anya
  n’aha nke ndị niile ga-ebi oge ọbụla n’elu ụwa.
- Anyị n’olu dị nsọ na-agba ama na ndụ Ya, nke dị n’etiti agụgụala nke ụmụ mmadụ, ọbụghị na O bidoro na
  Betlehem ma ọ bụghị ịgwụ na Kalvarị. Ọ bụ Nwa mbụ nke Nna, Ọkpara A Mụrụ Naanị Ya n’anụ ahụ, Onye mgbapụta
  nke ụwa.
- 'O bilitere site n’ili “ịghọ mkpụrụ mbụ nke ndị daworo n’ụra ọnwụ” (1 Ndị Kọrịnt 15:20). Dị ka Onyenwe
  anyị nke Biliteworo, O jere nleta n’etiti ndị Ọ hụworo naanya n’oge ndụ Ya. Ọ jekwara ozi n’etiti “atụrụ
  Ya ndị ọzọ” (Jọn 10:16) n’Amerika mgbe ochie: Niime ụwa ugbu a, Ya na Nna Ya pụtakwutere nwata nta nwoke
  Josef Smith, iji dubata “ọgbọ ozuzu oge a kara aka” e kwere nkwa ya ogologo oge. (Ndị Efesọs 1:10)'
- 'Gbasara Kraịst ahụ Dị Ndụ, Onye amụma Josef dere: “Anya ya abụọ dị ka ire ọkụ nke ọkụ; agịrị isi ya
  na-acha ọcha dị ka ezi snow; mbara ihu ya na-enwu karịa mmụke nke anyanwụ; na olu ya dị ka ụda nnukwu
  mmiri niile na-asọ asọ, ọbụna olu nke Jehova, na-asị:'
- “A bụ m onye mbụ na onye ikpe azụ; a bụ m onye ahụ na-adị ndụ, a bụ m ya onye ahụ egburu egbu; a bụ
  m onye nkwuchịte unu n’ebe Nna nọ.” (OznỌd. 110:3–4)
- 'Gbasara Ya Onye amụma makwara ọkwa: “Ma ugbụ a, mgbe e nyesịworo ọtụtụ ama nke e nyeworo gbasara ya,
  nke a bụ ama ahụ, nke ikpeazu niime ha niile, nke anyị na-enye gbasara ya: Na ọ dị ndụ!'
- “Niihi na anyị hụrụ ya, ọbụna n’aka nri nke Chineke; ma anyị nụrụ olu na-agba ama na ọ bụ Onye ahụ Amụrụ
  Naanị ya nke Nna—
- “Na site n’aka ya, ma site na ya, ma na nke ya, ụwa niile ahụ dị, ma e kere ha, ma ndị bi n’ebe ahụ
  bụ ụmụ ndị nwoke na ụmụ ndị nwanyị ndị a mụrụ nye Chineke.” (OznỌd. 76:22–24)
- Anyị na-ama ọkwa na mkpụrụ okwu niile nke ịdị nsọ na ọkwa nchụaja Ya na Nzukọ nsọ Ya ka ewetaghachiteworo
  n’elu ụwa—“ewukwasịrị n’elu ntọala nke … ndị ozi na ndị amụma, Jizọs Kraịst n’onwe ya a bụrụ isi nkuku
  ụlọ ahụ” (Ndị Efesọs 2:20)
- Anyị na-agba ama na Ọ ga otu ụbọchị laghachite n’ụwa. “Ma a ga-ekpughere ụwa ebube nke Onyenwe anyị,
  ma anụ ahụ niile ga-ahụkọta ya” (Aịsaịa 40:5) Ọ ga-achị dị ka Eze kachasị ndị Eze ma chịa dị ka Onyenwe
  anyị kachasị Ndị Nwenu, ma ikpere niile ga-egbu ala ma ire ọbụla ga-ekwụpụta kwa n’ife ofufe n’ihu ya.
  Onye ọbụla niime anyị ga-eguzoro ka Ọ kpee anyị ikpe dị ka otu ọrụ anyị na ọchịchọ niile nke obi anyị
  siri dị.
- Anyị na-agba ama, dị ka Ndị ozi Ya echiziri echichi—na Jizọs bụ Kraịst ahụ Dị Ndu, Ọkpara nke Chineke
  na-apụghị ịnwụ anwụ. Ọ bụ nnukwu Eze Immanuel, onye guzooro taa n’aka nri nke Nna Ya. Ọ bụ ìhè ahụ,
  ndụ ahụ, na olileanya nke ụwa. Ụzọ Ya bụ ụzọ ahụ na-eduba n’obi ụtọ na ndụ nke a na ndụ ebighị ebi n’ụwa
  na-abịa abịa. Ekele dịrị Chineke maka onyinye na-enweghi atụ nke Ọkpara Ya dị nsọ.
