title: 耶穌基督圓滿福音的復興
subtitle: 兩百週年致全世界文告
author: 耶穌基督後期聖徒教會總會會長團及十二使徒議會
note: 本文告由羅素·納爾遜會長於2020年4月5日在猶他州鹽湖城舉行的第190週年上半年總會大會上宣讀，是其信息的一部分。
paragraphs:
- 我們鄭重宣告，神愛祂在世界各國的兒女。父神賜給了我們祂的愛子耶穌基督的神聖誕生、無與倫比的生平和無限的贖罪犧牲。耶穌藉著父的力量復活了，戰勝了死亡。祂是我們的救主、典範和救贖主。
- 兩百年前，1820年的一個美麗春天早晨，在美國紐約州北部地區，少年約瑟·斯密很想知道該加入哪個教會，他走進住家附近的樹林裡祈禱。他對於關乎自己靈魂救恩的事有所疑問，也信賴神會給他指示。
- 我們謙卑地宣告，父神和祂的兒子耶穌基督回答了約瑟的祈禱，向他顯現，開啟了聖經中所預言的「萬物復興」（使徒行傳3：21）。在這個異象中，約瑟獲知，在最初的使徒們死亡後，基督在新約時代的教會便不復存在於世上，而且他會成為復興基督教會的重要工具。
- 我們申明，在父與子的指示下，天上的使者曾前來指導約瑟，再次建立耶穌基督的教會。復活的施洗約翰復興了為罪的赦免的浸沒洗禮的權柄。最初十二位使徒裡的三位——彼得、雅各和約翰——復興了使徒的職分和聖職權柄的權鑰。包括以來加在內的其他天上使者也來到；以來加復興了使家人能永遠在一起、讓家庭關係能超越死亡而持續到永恆的權柄。
- 我們進一步作證，約瑟·斯密蒙得神的恩賜和能力，翻譯了一部古代紀錄：摩爾門經——耶穌基督的另一部約書。這部神聖紀錄的篇章中，含有耶穌基督在復活後不久，到西半球的人民中親自施助的記載。摩爾門經教導關於人生的目的，闡明基督的教義，而這教義正是人生目的之核心所在。摩爾門經與聖經相輔相成，摩爾門經見證：所有人類都是慈愛天父的兒女；天父為我們的生活制定了一項神聖計畫；祂的兒子耶穌基督今日對世人說話，就如同祂在古代那樣。
- 我們宣告，1830年4月6日成立的耶穌基督後期聖徒教會，是基督在新約時代教會的復興。這教會是牢牢奠基在其主要的房角石——耶穌基督——完美的一生、祂無限的贖罪和真實的復活上。耶穌基督再度召喚了使徒，並賜給了他們聖職權柄。祂邀請我們所有的人歸向祂和祂的教會，接受聖靈和救恩的教儀，享有恆久的喜樂。
- 自從父神和祂的愛子耶穌基督開啟福音的復興，至今已經過了兩百年。世界各地千百萬人誠摯地相信了先知們所預言的這些事件。
- 我們欣然宣告，神所應許的福音復興正透過不斷的啟示向前開展。大地會變得極為不同，因為神會「使一切所有的都在基督裏面同歸於一」（以弗所書1：10）。
- 身為祂的使徒，我們懷著虔敬和感激之情，邀請所有的人都能知道諸天已開啟，就如同我們知道一樣。我們申明，神正在顯明對祂心愛兒女的旨意。我們見證，凡透過祈禱研讀福音復興的信息，並憑信心採取行動的人，都會蒙得祝福，對福音復興的神聖性和目的獲得個人見證——該目的乃是幫助世人準備好，迎接神所應許的我們的主和救主耶穌基督的第二次來臨。
