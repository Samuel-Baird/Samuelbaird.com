title: El Crist Vivent
subtitle: El Testimoni dels Apòstols
author: L’Església de Jesucrist dels Sants dels Darrers Dies
paragraphs:
- Mentre commemorem el naixement de Jesucrist fa dos mil·lennis, oferim el nostre testimoni de la realitat
  de la Seva vida incomparable i la virtut infinita del Seu gran sacrifici expiatori. Ningú ha tingut
  una influència tan profunda sobre tots els que han viscut i viuran a la Terra.
- Ell va ser el Gran Jehovà de l’Antic Testament i el Messies del Nou Testament. Sota la direcció del
  Seu Pare, Ell va ser el creador de la Terra. “Per [Ell] tot ha vingut a l’existència, i res del que
  existeix no hi ha vingut sense [Ell]” (Joan 1:3). Sense pecat, Ell va ser batejat per complir tota rectitud.
  Ell “va passar fent el bé” (Fets 10:38), encara que va ser rebutjat per això. El Seu evangeli va ser
  un missatge de pau i bona voluntat. Va demanar a tothom que seguís el Seu exemple. Va recórrer els camins
  de Palestina guarint els malalts, fent que els cecs hi veiessin i ressuscitant els morts. Va ensenyar
  les veritats eternes, la realitat de la nostra existència premortal, el propòsit de la nostra vida a
  la Terra i el potencial dels fills i filles de Déu a la vida que vindrà.
- Va instituir el Sant Sopar com a recordatori del Seu gran sacrifici expiatori. Va ser arrestat i condemnat
  injustament, declarat culpable per satisfer la multitud i sentenciat a morir a la creu del Calvari.
  Ell va donar la Seva vida per expiar els pecats de tota la humanitat. La Seva expiació va ser un gran
  do vicari a favor de tots els que viurien a la Terra.
- Testifiquem amb solemnitat que la Seva vida, que és fonamental per la història de tota la humanitat,
  no va començar a Betlem ni va concloure al Calvari. Ell va ser el Primogènit del Pare, el Fill Unigènit
  a la carn, el Redemptor del món.
- Es va aixecar del sepulcre “com a primícia de tots els qui han mort” (1 Corintis 15:20). Com a Senyor
  Ressuscitat, va visitar a aquells a qui havia estimat en vida. També va ministrar a les Seves “altres
  ovelles” (Joan 10:16) a l’antiga Amèrica. Al món modern, Ell i el Seu Pare van aparèixer al jove Josep
  Smith i van començar la dispensació llargament promesa de la “plenitud dels temps” (Efesis 1:10).
- 'Del Crist Vivent, el profeta Josep va escriure: “Els seus ulls eren com una flama de foc; [els cabells]
  del seu cap [eren blancs] com la neu pura; el seu semblant resplendia més que l’esclat del sol; i la
  seva veu tenia un so com d’un corrent tumultuós d’aigües, la veu de Jehovà mateix, que deia:'
- “Sóc el primer i el darrer; sóc aquell que viu, el qui fou mort; sóc el vostre advocat amb el Pare”
  (DiA 110:3–4).
- 'D’Ell, el Profeta també va declarar: “I ara, després dels molts testimoniatges que s’han donat d’ell,
  aquest és el testimoniatge, l’últim de tots, que nosaltres donem d’ell: Que viu!'
- “Perquè el veiérem, àdhuc a la dreta de Déu; i sentírem la veu tot testimoniant que ell és l’Unigènit
  del Pare;
- “que per ell, i mitjançant ell, i d’ell els mons són i foren creats, i els seus habitants són fills
  i filles engendrats per a Déu” (DiA 76:22–24).
- Declarem amb paraules solemnes que el Seu sacerdoci i la Seva Església han estat restaurats sobre la
  Terra, “construït[s] sobre el fonament dels apòstols i els profetes, que té el mateix Jesucrist per
  pedra angular” (Efesis 2:20).
- Testifiquem que algun dia Ell tornarà a la Terra. “Llavors apareixerà la glòria del Senyor, i tothom
  [la] veurà alhora” (Isaïes 40:5). Ell regirà com a Rei de reis i regnarà com a Senyor de senyors, tot
  genoll es doblegarà i tota llengua farà lloança davant Seu. Tots compareixerem per ser jutjats per Ell
  segons les nostres obres i els desitjos del nostre cor.
- Donem testimoni, en qualitat dels Seus Apòstols degudament ordenats, que Jesús és el Crist Vivent, l’immortal
  Fill de Déu. Ell és el gran Rei Emmanuel, que avui està a la dreta del Seu Pare. Ell és la llum, la
  vida i l’esperança del món. El Seu camí és el que porta a la felicitat en aquesta vida i la vida eterna
  en el món futur. Lloat sigui Déu pel do incomparable del Seu Fill diví.
