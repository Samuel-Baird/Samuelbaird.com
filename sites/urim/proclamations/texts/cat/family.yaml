title: La família
subtitle: Una proclamació per al món
author: La Primera Presidència i el Consell dels Dotze Apòstols de l’Església de Jesucrist dels Sants
  dels Darrers Dies
note: El president Gordon B. Hinckley va llegir aquesta proclamació com a part del seu missatge a la Reunió
  General de la Societat de Socors duta a terme el 23 de setembre de 1995 a Salt Lake City, Utah.
paragraphs:
- Nosaltres, la Primera Presidència i el Consell dels Dotze Apòstols de l’Església de Jesucrist dels Sants
  dels Darrers Dies, solemnement proclamem que el matrimoni entre un home i una dona està ordenat per
  Déu i que la família és essencial en el pla del Creador per al destí etern dels Seus fills.
- Tots els éssers humans, homes i dones, són creats a imatge de Déu. Cadascun de nosaltres és un fill
  estimat o una filla estimada espiritual de pares celestials i, com a tal, tenim una naturalesa i un
  destí divins. El gènere és una característica essencial de la identitat i el propòsit preterrenals,
  terrenals i eterns de la persona.
- En el reialme preterrenal, els fills i filles, com a esperits, coneixien i adoraven Déu com al seu Pare
  Etern i van acceptar el Seu pla amb què els Seus fills podrien obtenir un cos físic i aconseguir l’experiència
  terrenal que els permetria progressar cap a la perfecció i, finalment, atènyer el seu destí com a hereus
  de la vida eterna. El pla diví de felicitat permet que les relacions familiars perdurin més enllà de
  la tomba. Les ordenances i aliances sagrades disponibles als sants temples fan possible que les persones
  tornin a la presència de Déu i que les famílies s’uneixin eternament.
- El primer manament que Déu va donar a Adam i a Eva estava relacionat amb el seu potencial de ser pares
  com a marit i muller. Declarem que el manament de Déu per als Seus fills de multiplicar-se i omplir
  la terra continua vigent. També declarem que Déu ha manat que els poders sagrats de la procreació s’emprin
  només entre l’home i la dona legalment casats com a espòs i esposa.
- Declarem que els mitjans per crear la vida mortal són establerts de manera divina. Afirmem la santedat
  de la vida i la seva importància en el pla etern de Déu.
- L’espòs i l’esposa tenen la responsabilitat solemne d’estimar-se i cuidar-se mútuament i d’estimar i
  cuidar els seus fills. “L’herència del Senyor són els fills” (Salms 127:3). Els pares tenen el deure
  sagrat de criar els seus fills amb amor i justícia, de proveir per les seves necessitats físiques i
  espirituals; també d’ensenyar-los a estimar-se i servir-se els uns als altres, a observar els manaments
  de Déu i a ser ciutadans respectuosos amb la llei on sigui que visquin. Els esposos i esposes, mares
  i pares, seran responsables davant Déu pel compliment d’aquestes obligacions.
- La família és ordenada per Déu. El matrimoni entre l’home i la dona és essencial en el Seu pla etern.
  Els fills tenen el dret de néixer dins dels lligams del matrimoni i de ser criats per un pare i una
  mare que honorin els vots matrimonials amb completa fidelitat. És més probable aconseguir la felicitat
  a la vida familiar quan està fonamentada en les ensenyances del Senyor Jesucrist. Els matrimonis i famílies
  exitosos estan establerts i mantinguts sobre principis de fe, oració, penediment, perdó, respecte, amor,
  compassió, treball i activitats recreatives saludables. Per designi diví, els pares han de presidir
  les seves famílies amb amor i justícia i són responsables de proveir per a les necessitats de la vida
  i la protecció per a les seves famílies. Les mares són les principals responsables de la criança dels
  seus fills. En aquestes responsabilitats sagrades, els pares i les mares estan obligats a ajudar-se
  l’un a l’altre com a companys iguals. La discapacitat, la mort o altres circumstàncies poden requerir
  una adaptació particular. La família extensa hauria de donar suport quan fos necessari.
- Advertim que les persones que violen les aliances de castedat, els que abusen del cònjuge o dels fills
  o els que no compleixen amb les responsabilitats familiars un dia en seran responsables davant Déu.
  A més, advertim que la desintegració de la família portarà les calamitats anunciades pels profetes antics
  i moderns als individus, les comunitats i les nacions.
- Fem una crida als ciutadans responsables i als dirigents dels governs d’arreu del món perquè promoguin
  aquestes mesures dissenyades per a mantenir i enfortir la família com a unitat fonamental de la societat.
