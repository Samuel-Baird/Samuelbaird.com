title: Ang Mga Saligan ng Pananampalataya
subtitle: ng Ang Simbahan ni Jesucristo ng mga Banal sa mga Huling Araw
author: ''
verses:
- n: 1
  text: Naniniwala kami sa Diyos, ang Amang Walang Hanggan, at sa Kanyang Anak, na si Jesucristo, at sa
    Espiritu Santo.
- n: 2
  text: Naniniwala kami na ang mga tao ay parurusahan dahil sa kanilang sariling mga kasalanan, at hindi
    dahil sa paglabag ni Adan.
- n: 3
  text: Naniniwala kami na sa pamamagitan ng Pagbabayad-sala ni Cristo, ang buong sangkatauhan ay maaaring
    maligtas, sa pamamagitan ng pagsunod sa mga batas at ordenansa ng Ebanghelyo.
- n: 4
  text: 'Naniniwala kami na ang mga pangunahing alituntunin at ordenansa ng Ebanghelyo ay: una, Pananampalataya
    sa Panginoong Jesucristo; pangalawa, Pagsisisi; pangatlo, Pagbibinyag sa pamamagitan ng paglulubog
    para sa kapatawaran ng mga kasalanan; pang-apat, Pagpapatong ng mga kamay para sa kaloob na Espiritu
    Santo.'
- n: 5
  text: Naniniwala kami na ang tao ay kinakailangang tawagin ng Diyos, sa pamamagitan ng propesiya, at
    ng pagpapatong ng mga kamay ng mga yaong may karapatan, upang ipangaral ang Ebanghelyo at mangasiwa
    sa mga ordenansa niyon.
- n: 6
  text: Naniniwala kami sa samahan ding yaon na umiral sa Sinaunang Simbahan, alalaong baga’y mga apostol,
    propeta, pastor, guro, ebanghelista, at iba pa.
- n: 7
  text: Naniniwala kami sa kaloob na mga wika, propesiya, paghahayag, mga pangitain, pagpapagaling, pagbibigay-kahulugan
    sa mga wika, at iba pa.
- n: 8
  text: Naniniwala kami na ang Biblia ay salita ng Diyos hangga’t ito ay nasasalin nang wasto; naniniwala
    rin kami na ang Aklat ni Mormon ay salita ng Diyos.
- n: 9
  text: Naniniwala kami sa lahat ng ipinahayag ng Diyos, sa lahat ng Kanyang ipinahahayag ngayon, at naniniwala
    rin kami na maghahayag pa Siya ng maraming dakila at mahahalagang bagay hinggil sa Kaharian ng Diyos.
- n: 10
  text: Naniniwala kami sa literal na pagtitipon ng Israel at sa pagpapanumbalik ng Sampung Lipi; na ang
    Sion (ang Bagong Jerusalem) ay itatayo sa lupalop ng Amerika; na maghahari si Cristo sa mundo; at,
    ang mundo ay babaguhin at matatanggap nito ang malaparaisong kaluwalhatian.
- n: 11
  text: Inaangkin namin ang natatanging karapatang sambahin ang Pinakamakapangyarihang Diyos alinsunod
    sa mga atas ng aming sariling budhi, at pinahihintulutan ang lahat ng tao ng gayon ding karapatan,
    hayaan silang sumamba, kung paano, kung saan, kung anuman ang ibig nila.
- n: 12
  text: Naniniwala kami sa pagpapasailalim sa mga hari, pangulo, namamahala, at hukom, sa pagsunod, paggalang
    at pagtataguyod ng batas.
- n: 13
  text: Naniniwala kami sa pagiging matapat, tunay, malinis, mapagkawanggawa, marangal, at sa paggawa
    ng mabuti sa lahat ng tao; sa katotohanan, maaari naming sabihing sinusunod namin ang payo ni Pablo—Naniniwala
    kami sa lahat ng bagay, umaasa kami sa lahat ng bagay, nakapagtiis kami ng maraming bagay, at umaasang
    makapagtitiis sa lahat ng bagay. Kung may anumang bagay na marangal, kaaya-aya, o magandang balita,
    o maipagkakapuri, hinahangad namin ang mga bagay na ito.
signature: Joseph Smith.
