title: Ang Pagpapanumbalik ng Kabuuan ng Ebanghelyo ni Jesucristo
subtitle: Isang Proklamasyon sa Mundo para sa Ika-200 Taong Anibersaryo
author: Ang Unang Panguluhan at Kapulungan ng Labindalawang Apostol ng Ang Simbahan ni Jesucristo ng mga
  Banal sa mga Huling Araw
note: Ang proklamasyon na ito ay binasa ni Pangulong Russell M. Nelson bilang bahagi ng kanyang mensahe
  sa Ika-190 Taunang Pangkalahatang Kumperensya na ginanap noong ika-5 ng Abril 2020, sa Salt Lake City,
  Utah.
paragraphs:
- Taimtim naming ipinapahayag na minamahal ng Diyos ang Kanyang mga anak sa bawat bansa sa mundo. Ipinagkaloob
  sa atin ng Ama sa Langit ang banal na pagsilang, ang walang katumbas na buhay, at ang walang-katapusang
  sakripisyo ng pagbabayad-sala ng Kanyang Pinakamamahal na Anak, na si Jesucristo. Sa pamamagitan ng
  kapangyarihan ng Ama, nabuhay muli si Jesus at nakamit ang tagumpay laban sa kamatayan. Siya ang ating
  Tagapagligtas, ang ating Halimbawa, at ang ating Manunubos.
- Dalawang daang taon na ang nakalipas, isang magandang umaga ng tagsibol noong 1820, ang batang si Joseph
  Smith, na naghahangad na malaman kung anong simbahan ang dapat niyang sapian, ay nagtungo sa kakahuyan
  na malapit sa kanyang tahanan sa may hilagang bahagi ng New York, USA upang manalangin. May mga tanong
  siya tungkol sa kaligtasan ng kanyang kaluluwa at naniwala na gagabayan siya ng Diyos.
- Mapagpakumbaba naming ipinapahayag na bilang kasagutan sa kanyang dalangin, nagpakita ang Diyos Ama
  at ang Kanyang Anak, na si Jesucristo kay Joseph at pinasimulan ang “pagpapanumbalik ng lahat ng bagay”
  (Mga Gawa 3:21) tulad ng ibinadya sa Biblia. Sa pangitaing ito, nalaman niya na kasunod ng pagkamatay
  ng mga orihinal na Apostol, ang Simbahan ni Cristo na nakatala sa Bagong Tipan ay nawala sa lupa. Magiging
  kasangkapan si Joseph sa pagbabalik nito.
- Ipinapahayag namin na sa ilalim ng direksyon ng Ama at ng Anak, dumating ang mga sugo mula sa langit
  upang turuan si Joseph at muling itatag ang Simbahan ni Jesucristo. Ipinanumbalik ni Juan Bautista,
  na nabuhay na mag-uli, ang awtoridad na magbinyag sa pamamagitan ng paglulubog sa tubig para sa kapatawaran
  ng mga kasalanan. Ipinanumbalik ng tatlo sa orihinal na labindalawang Apostol—nila Pedro, Santiago,
  at Juan—ang pagka-apostol at mga susi ng awtoridad ng priesthood. Dumating din ang iba pa, kabilang
  si Elijah, na nagpanumbalik ng awtoridad na magbuklod ng mga pamilya magpakailanman sa isang walang
  hanggang ugnayan na napagtagumpayan ang kamatayan.
- 'Nagpapatotoo rin kami na binigyan si Joseph Smith ng kaloob at kapangyarihan ng Diyos na magsalin ng
  isang sinaunang talaan: ang Aklat ni Mormon—Isa Pang Tipan ni Jesucristo. Kabilang sa mga nasusulat
  sa mga sagradong pahina nito ang tala tungkol sa personal na ministeryo ni Jesucristo sa mga tao sa
  kanlurang bahagi ng mundo pagkatapos ng Kanyang Pagkabuhay na Mag-uli. Itinuturo nito ang layunin ng
  buhay at ipinaliliwanag ang doktrina ni Cristo, na siyang sentro ng layuning iyon. Bilang katuwang na
  banal na kasulatan ng Biblia, nagpapatotoo ang Aklat ni Mormon na ang lahat ng tao ay mga anak ng isang
  mapagmahal na Ama sa Langit, na Siya ay may banal na plano para sa ating buhay, at ang Kanyang Anak,
  na si Jesucristo, ay nagsasalita sa atin ngayon katulad noong sinaunang panahon.'
- Ipinapahayag namin na Ang Simbahan ni Jesucristo ng mga Banal sa mga Huling Araw, na itinatag noong
  ika-6 ng Abril 1830, ang ipinanumbalik na Simbahan ni Cristo na nakatala sa Bagong Tipan. Nakasalig
  ang Simbahang ito sa sakdal na buhay ng pangunahing batong-panulok nito, na si Jesucristo, at sa Kanyang
  walang katapusang Pagbabayad-sala at literal na Pagkabuhay na Mag-uli. Muling tumawag si Jesucristo
  ng mga Apostol at pinagkalooban sila ng awtoridad ng priesthood. Inaanyayahan Niya tayong lahat na lumapit
  sa Kanya at sa Kanyang Simbahan, upang tumanggap ng Espiritu Santo, ng mga ordenansa ng kaligtasan,
  at magkamit ng walang maliw na kagalakan.
- May dalawang daang taon na ngayon ang nakalipas mula nitong Pagpapanumbalik na pinasimulan ng Diyos
  Ama at ng Kanyang Pinakamamahal na Anak, na si Jesucristo. Milyun-milyong tao na sa mundo ang tumanggap
  sa mga iprinopesiyang pangyayaring ito.
- Malugod naming ipinapahayag na ang ipinangakong Pagpapanumbalik ay sumusulong sa pamamagitan ng patuloy
  na paghahayag. Kailanman ay hindi na magiging katulad nang dati ang mundo, sapagkat ang Diyos ay “ti[ti]punin
  ang lahat ng mga bagay kay Cristo” (Mga Taga-Efeso 1:10).
- Lakip ang lubos na paggalang at pasasalamat, kami bilang Kanyang mga Apostol ay nag-aanyaya sa lahat
  na malaman—tulad ng pagkakaalam namin—na bukas ang kalangitan. Ipinapahayag namin na ipinababatid ng
  Diyos ang Kanyang kalooban sa Kanyang mga minamahal na anak. Nagpapatotoo kami na yaong mga mapanalanging
  pag-aaralan ang mensahe ng Pagpapanumbalik at kikilos nang may pananampalataya ay pagpapalaing magkamit
  ng kanilang sariling patotoo sa kabanalan nito at sa layunin nitong ihanda ang mundo para sa ipinangakong
  Ikalawang Pagparito ng ating Panginoon at Tagapagligtas, na si Jesucristo.
