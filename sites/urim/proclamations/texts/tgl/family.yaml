title: Ang Mag-anak
subtitle: Isang Pagpapahayag sa Mundo
author: Ang Unang Panguluhan at Kapulungan ng Labindalawang Apostol ng Ang Simbahan ni Jesucristo ng mga
  Banal sa mga Huling Araw
note: Ang pagpapahayag na ito ay binasa ni Pangulong Gordon B. Hinckley bilang bahagi ng kanyang mensahe
  sa General Relief Society Meeting na ginanap noong Setyembre 23, 1995, sa Salt Lake City, Utah.
paragraphs:
- Kami, ang Unang Panguluhan at ang Kapulungan ng Labindalawang Apostol ng Ang Simbahan ni Jesucristo
  ng mga Banal sa mga Huling Araw, ay taimtim na nagpapahayag na ang kasal sa pagitan ng isang lalaki
  at ng isang babae ay inorden ng Diyos at ang mag-anak ang sentro ng plano ng Tagapaglikha para sa walang
  hanggang tadhana ng Kanyang mga anak.
- Lahat ng tao—lalaki at babae—ay nilalang sa larawan ng Diyos. Bawat isa ay minamahal na espiritung anak
  na lalaki o anak na babae ng mga magulang na nasa langit, at bilang gayon, bawat isa ay may katangian
  at tadhana na tulad ng sa Diyos. Ang kasarian ay mahalagang katangian ng pagkakakilanlan at layunin
  ng isang tao sa kanyang buhay bago pa ang buhay niya sa mundo, sa buhay niyang mortal, at sa walang
  hanggan.
- Sa buhay bago pa ang buhay sa mundo, kilala at sinamba ng mga espiritung anak na lalaki at anak na babae
  ang Diyos bilang kanilang Amang Walang Hanggan at tinanggap ang Kanyang plano na naglaan sa Kanyang
  mga anak na magkaroon ng pisikal na katawan at magtamo ng karanasan sa mundo upang umunlad tungo sa
  kaganapan at sa huli ay makamtan ang kanilang banal na tadhana bilang tagapagmana ng buhay na walang
  hanggan. Ang plano ng kaligayahan ng Diyos ang nagpapahintulot sa mga ugnayan ng mag-anak na magpatuloy
  sa kabilang buhay. Ang mga banal na ordenansa at tipan na makukuha sa mga banal na templo ang nagbibigay
  ng pagkakataon sa mga tao na makabalik sa kinaroroonan ng Diyos at upang ang mga mag-anak ay magkasama-sama
  sa walang hanggan.
- Ang unang kautusan na ibinigay ng Diyos kina Adan at Eva ay tungkol sa kanilang potensiyal na maging
  magulang bilang mag-asawa. Ipinapahayag namin na ang kautusan ng Diyos sa Kanyang mga anak na magpakarami
  at kalatan ang lupa ay nananatiling may bisa. Ipinapahayag din namin na ang banal na kapangyarihang
  lumikha ng bata ay nararapat lamang gamitin ng lalaki at babae na ikinasal bilang mag-asawa ayon sa
  batas.
- Ipinapahayag namin na ang paraan ng paglikha ng buhay na mortal ay itinakda ng Diyos. Pinagtitibay namin
  ang kabanalan ng buhay at ang kahalagahan nito sa walang hanggang plano ng Diyos.
- Ang mag-asawa ay may banal na tungkuling mahalin at kalingain ang bawat isa at ang kanilang mga anak.
  “Ang mga anak ay mana na mula sa Panginoon” (Mga Awit 127:3). Ang mga magulang ay may banal na tungkuling
  palakihin ang kanilang mga anak sa pagmamahal at kabutihan, maglaan para sa kanilang pisikal at espirituwal
  na mga pangangailangan, turuan silang magmahalan at maglingkod sa isa’t isa, sundin ang mga kautusan
  ng Diyos, at maging masunurin sa batas saanman sila naninirahan. Ang mga mag-asawa—ang mga ama at ina—ay
  pananagutin sa harap ng Diyos sa kanilang pagtupad sa mga tungkuling ito.
- Ang mag-anak ay inorden ng Diyos. Ang kasal sa pagitan ng lalaki at babae ay mahalaga sa Kanyang walang
  hanggang plano. Ang mga anak ay may karapatang isilang sa loob ng matrimonyo, at palakihin ng isang
  ama at isang ina na gumagalang nang buong katapatan sa pangakong kanilang ginawa nang sila ay ikasal.
  Ang kaligayahan sa buhay ng mag-anak ay lalong higit na makakamit kapag isinalig sa mga turo ng Panginoong
  Jesucristo. Ang mga matagumpay na buhay mag-asawa at mag-anak ay itinatatag at pinananatili sa mga alituntunin
  ng pananampalataya, panalangin, pagsisisi, pagpapatawad, paggalang, pagmamahalan, awa, gawa, at kapaki-pakinabang
  na mga gawaing panlibangan. Sa plano ng Diyos, ang mga ama ang mangungulo sa kanilang mga mag-anak sa
  pagmamahal at kabutihan at ang may tungkuling maglaan para sa mga pangangailangan sa buhay at kaligtasan
  ng kanilang mga mag-anak. Ang mga ina ang may pangunahing tungkulin na mag-aruga sa kanilang mga anak.
  Sa mga banal na tungkuling ito, ang mga ama at ina ay may pananagutang magtulungan bilang magkasama
  na may pantay na pananagutan. Ang pagkakaroon ng kapansanan, ang kamatayan, o iba pang kalagayan ay
  maaaring magpabago sa mga takdang tungkulin ng bawat isa sa pagkalinga sa mag-anak. Ang mga kamag-anak
  ay dapat magbigay ng tulong kung kinakailangan.
- Kami ay nagbababala na ang mga taong lumalabag sa mga tipan ng kalinisang-puri, nang-aabuso ng asawa
  o anak, o bigo sa pagtupad ng kanilang mga tungkulin sa mag-anak ay mananagot balang-araw sa harap ng
  Diyos. At gayon din, kami ay nagbababala na ang pagkakawatak-watak ng mag-anak ay magdudulot sa mga
  tao, mga komunidad, at mga bansa ng mga kapahamakang sinabi na noon pa ng mga sinauna at makabagong
  propeta.
- Kami ay nananawagan sa mga responsableng mamamayan at mga pinuno ng gobyerno sa lahat ng dako na magtatag
  ng mga pamamaraan upang mapanatili at mapalakas ang mag-anak bilang pangunahing yunit ng lipunan.
