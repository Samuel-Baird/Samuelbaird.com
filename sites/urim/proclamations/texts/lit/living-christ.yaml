title: Gyvasis Kristus
subtitle: Apaštalų liudijimas
author: Pastarųjų Dienų Šventųjų Jėzaus Kristaus Bažnyčia
paragraphs:
- Minėdami dutūkstantąsias Jėzaus Kristaus gimimo metines, liudijame apie neprilygstamo Jo gyvenimo realumą
  ir nesibaigiančią Jo didžiosios apmokančios aukos galią. Niekas kitas taip giliai nepaveikė visų žemės
  žmonių – tiek gyvenusių, tiek dar gyvensiančių.
- Jis buvo Didysis Senojo Testamento Jehova, Naujojo Mesijas. Vadovaujamas savo Tėvo, Jis sukūrė žemę.
  „Visa per Jį atsirado, ir be Jo neatsirado nieko, kas yra atsiradę“ (Jono 1:3). Nors buvo be nuodėmės,
  Jis pasikrikštijo, kad atliktų visa, kas reikalinga teisumui. Jis „vaikščiojo, darydamas gera“ (Apaštalų
  darbų 10:38), tačiau buvo niekinamas už tai. Jo Evangelija buvo taikos ir geranoriškumo žinia. Jis karštai
  kvietė visus sekti savo pavyzdžiu. Jis vaikščiojo Palestinos keliais, gydydamas ligonius, teikdamas
  regėjimą akliesiems ir prikeldamas mirusiuosius. Jis mokė amžinybės tiesų apie mūsų ikimirtingojo egzistavimo
  tikrumą, mūsų gyvenimo žemėje prasmę ir apie Dievo sūnų bei dukterų galimybes būsimajame gyvenime.
- Jis įsteigė sakramentą kaip savo didžiosios apmokančios aukos priminimą. Jis buvo suimtas ir apkaltintas
  nebūtais dalykais, pripažintas kaltu, norint įtikti miniai, ir pasmerktas mirti ant Kalvarijos kryžiaus.
  Jis atidavė savo gyvybę, kad apmokėtų žmonijos nuodėmes. Tai buvo didi Jo išpirka už visus žemės gyventojus.
- Iškilmingai liudijame, kad Jo gyvenimas, reikšmingiausias visoje žmonių istorijoje, neprasidėjo Betliejuje
  ir nesibaigė Kalvarijoje. Jis buvo Tėvo Pirmagimis, Viengimis Sūnus kūne, pasaulio Išpirkėjas.
- Jis prisikėlė iš kapo kaip „pirmasis iš užmigusiųjų“ (1 Korintiečiams 15:20). Kaip prisikėlęs Viešpats,
  Jis aplankė tuos, kuriuos mylėjo gyvenime. Jis taip pat mokė „kitas avis“ (Jono 10:16) senovės Amerikoje.
  Šiais laikais Jis ir Jo Tėvas pasirodė berniukui Džozefui Smitui, pradėdami seniai pažadėtą amžių pilnatvės
  Evangelijos laikotarpį (žr. Efeziečiams 1:10).
- 'Apie gyvąjį Kristų pranašas Džozefas rašė: „Jo akys buvo tarsi ugnies liepsna; Jo galvos plaukai buvo
  balti tarsi tyras sniegas; Jo veidas spindėjo skaisčiau už saulę; ir Jo balsas buvo lyg didžių vandenų
  šniokštimas, būtent Jehovos balsas, sakantis:'
- „Aš esu pirmasis ir paskutinysis; Aš esu Tas, kuris gyvena, Aš esu Tas, kuris buvo nužudytas; Aš esu
  jūsų užtarėjas pas Tėvą“ (DS 110:3–4).
- 'Apie Jį pranašas taip pat skelbė: „Ir dabar, po daugelio liudijimų, pateiktų apie Jį, šis yra visų
  paskiausias liudijimas, kurį pateikiame apie Jį: kad Jis gyvas!'
- Nes mes Jį matėme, būtent Dievo dešinėje; ir girdėjome balsą, liudijantį, kad Jis – Tėvo Viengimis,
- kad Juo, per Jį ir iš Jo sukuriami ir buvo sukurti pasauliai ir jų gyventojai – Dievui užgimę sūnūs
  ir dukros“ (DS 76:22–24).
- Iškilmingai skelbiame, kad žemėje buvo atkurta Jo kunigystė ir Jo Bažnyčia – pastatyta ant apaštalų
  ir pranašų pamato, turinti kertiniu akmeniu patį Kristų Jėzų (žr. Efeziečiams 2:20).
- Liudijame, kad vieną dieną Jis sugrįš į žemę. „Viešpaties šlovė bus apreikšta, visi kūnai tai matys“
  (Izaijo 40:5). Jis valdys kaip karalių Karalius ir viešpačių Viešpats, kiekvienas kelis klaupsis prieš
  Jį ir kiekvienas liežuvis garbins Jį. Kiekvienas iš mūsų stosime prieš Jį, kad būtume teisiami pagal
  savo darbus ir širdies troškimus.
- Mes, kaip deramai įšventinti Jo apaštalai, liudijame, kad Jėzus yra gyvasis Kristus, nemirtingasis Dievo
  Sūnus. Jis yra didysis karalius Emanuelis, kuris šiandien stovi savo Tėvo dešinėje. Jis yra pasaulio
  šviesa, gyvybė ir viltis. Jo kelias – tai kelias, vedantis į laimę šiame gyvenime ir į amžinąjį gyvenimą
  ateinančiame pasaulyje. Dėkokime Dievui už neprilygstamą Jo dieviško Sūnaus dovaną.
