title: Šeima
subtitle: Pareiškimas pasauliui
author: Pastarųjų Dienų Šventųjų Jėzaus Kristaus Bažnyčios Pirmoji Prezidentūra ir Dvylikos Apaštalų Taryba
note: Šis pareiškimas yra dalis prezidento Gordono B. Hinklio pranešimo, 1995 metų rugsėjo 23 dieną perskaityto
  visuotiniame Paramos bendrijos susirinkime Solt Leik Sityje
paragraphs:
- Mes, Pastarųjų Dienų Šventųjų Jėzaus Kristaus Bažnyčios Pirmoji Prezidentūra ir Dvylikos Apaštalų Taryba,
  iškilmingai pareiškiame, kad santuoka tarp vyro ir moters yra paskirta Dievo ir kad šeima yra Kūrėjo
  plano Jo vaikų amžinajam likimui šerdis.
- Visos žmogiškos esybės – vyrai ir moterys – sukurti pagal Dievo atvaizdą. Kiekvienas yra mylimas dvasinis
  dangiškųjų tėvų sūnus ar dukra, ir, kaip toks, kiekvienas turi dievišką prigimtį ir paskirtį. Lytis
  yra esminė asmens ikimirtingojo, mirtingojo ir būsimo amžinojo savitumo bei paskirties charakteristika.
- Ikimirtingojoje karalystėje dvasiniai sūnūs ir dukterys pažinojo ir garbino Dievą kaip savo Amžinąjį
  Tėvą ir priėmė Jo planą, dėl kurio Jo vaikai gali gauti fizinį kūną ir įgyti žemiškos patirties, kad
  galėtų tobulėti ir galų gale realizuoti savo, kaip amžinojo gyvenimo paveldėtojų, dieviškąją paskirtį.
  Dieviškasis laimės planas leidžia išsaugoti šeimos ryšius ir po mirties. Šventose šventyklose vykdomos
  šventos apeigos ir sudaromos sandoros suteikia žmonėms galimybę grįžti Dievo akivaizdon ir šeimoms būti
  amžinai suvienytoms.
- Pirmas Dievo įsakymas Adomui ir Ievai yra susijęs su jų, kaip vyro ir žmonos, galimybe būti tėvais.
  Skelbiame, kad Dievo įsakymas savo vaikams daugintis ir pripildyti žemę tebegalioja. Be to, skelbiame,
  jog Dievas yra įsakęs, kad šventos dauginimosi galios būtų naudojamos tik tarp vyro ir moters, kurie
  oficialiai sutuokti kaip vyras ir žmona.
- Skelbiame, kad priemonės, kuriomis kuriama mirtingoji gyvybė, yra paskirtos Dievo. Tvirtiname, kad Dievo
  amžinajame plane gyvybė yra šventa ir svarbi.
- Vyras ir žmona turi šventą atsakomybę mylėti ir rūpintis vienas kitu bei savo vaikais. Vaikai yra Viešpaties
  dovana (Psalmyno 127:3). Tėvų šventa pareiga – išauklėti savo vaikus su meile ir teisumu, patenkinti
  jų fizinius bei dvasinius poreikius, mokyti juos mylėti ir tarnauti vienas kitam, laikytis Dievo įsakymų
  ir būti įstatymus gerbiančiais piliečiais, kad ir kur jie gyventų. Vyrai ir žmonos – motinos ir tėvai
  – turės atsakyti prieš Dievą už šių pareigų vykdymą.
- Šeimą įsteigė Dievas. Santuoka tarp vyro ir moters yra esminė Jo amžinojo plano dalis. Vaikai turi teisę
  gimti santuokoje ir būti auginami tėvo ir motinos, kurie ištikimai laikosi santuokos įžadų. Laimė šeiminiame
  gyvenime geriausiai pasiekiama, kai grindžiama Viešpaties Jėzaus Kristaus mokymais. Sėkmingos santuokos
  ir šeimos sukuriamos ir palaikomos, remiantis tikėjimo, maldos, atgailos, atlaidumo, pagarbos, meilės,
  užuojautos, darbo ir turiningo poilsio principais. Pagal dievišką planą tėvai turi pirmininkauti savo
  šeimoms su meile ir teisumu ir yra atsakingi už savo šeimų aprūpinimą būtiniausiomis gyvenimo priemonėmis
  ir apsauga. Motinos visų pirma yra atsakingos už savo vaikų ugdymą. Vykdydami šias šventas pareigas,
  tėvai ir motinos privalo padėti vienas kitam kaip lygūs partneriai. Dėl negalios, mirties ar kitų aplinkybių
  gali tekti atitinkamai prisitaikyti. Esant reikalui turėtų padėti giminės.
- Įspėjame, kad asmenys, kurie pažeidžia skaistybės sandoras, smurtauja prieš sutuoktinį ar vaikus arba
  nevykdo savo šeiminių pareigų, vieną dieną turės atsakyti prieš Dievą. Be to, įspėjame, kad šeimos ardymas
  sukels senovės ir šiuolaikinių pranašų išpranašautas nelaimes pavieniams asmenims, bendruomenėms ir
  tautoms.
- Kviečiame atsakingus piliečius ir vyriausybės pareigūnus visur paremti šias priemones, skirtas palaikyti
  ir stiprinti šeimą – pagrindinį visuomenės padalinį.
