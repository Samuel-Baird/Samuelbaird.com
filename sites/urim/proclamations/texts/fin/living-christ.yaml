title: Elävä Kristus
subtitle: Apostolien todistus
author: Myöhempien Aikojen Pyhien Jeesuksen Kristuksen Kirkko
paragraphs:
- Viettäessämme juhlaa Jeesuksen Kristuksen syntymän muistoksi, josta on kulunut kaksituhatta vuotta,
  me lausumme oman todistuksemme Hänen vertaansa vailla olevan elämänsä todellisuudesta ja Hänen suurenmoisen
  sovitusuhrinsa äärettömästä voimasta. Kenelläkään muulla ei ole ollut niin syvällistä vaikutusta kaikkiin
  niihin, jotka ovat eläneet ja jotka vielä tulevat elämään maan päällä.
- Jeesus Kristus oli Vanhan testamentin suuri Jehova, Uuden testamentin Messias. Isänsä johdolla Hän oli
  maan Luoja. ”Kaikki syntyi Sanan voimalla. Mikään, mikä on syntynyt, ei ole syntynyt ilman häntä.” (Joh.
  1:3.) Vaikka Hän oli synnitön, Hänet kastettiin kaiken vanhurskauden täyttämiseksi. Hän ”kulki ympäri
  maata, teki hyvää” (Ap. t. 10:38), ja kuitenkin Häntä halveksittiin sen vuoksi. Hänen evankeliuminsa
  oli rauhan ja hyvän tahdon sanoma. Hän pyysi hartaasti kaikkia seuraamaan esimerkkiään. Hän kulki Palestiinan
  teitä parantaen sairaita, tehden sokeat näkeviksi ja herättäen kuolleita. Hän opetti iankaikkisuuden
  totuuksia, kuolevaisuutta edeltävän olemassaolomme todellisuutta, maanpäällisen elämämme tarkoitusta
  ja Jumalan poikien ja tyttärien mahdollisuuksia tulevassa elämässä.
- Jeesus Kristus asetti sakramentin muistuttamaan suuresta sovitusuhristaan. Hänet vangittiin ja Häntä
  syytettiin valheellisesti, Hänet tuomittiin syylliseksi vihaisen väkijoukon tyydyttämiseksi ja tuomittiin
  kuolemaan Golgatan ristillä. Hän antoi henkensä sovittaakseen koko ihmiskunnan synnit. Hänen suuri lahjansa
  oli sijaistyö kaikkien niiden edestä, jotka koskaan eläisivät maan päällä.
- Me todistamme juhlallisesti, että Hänen elämänsä, jolla on keskeinen asema koko ihmiskunnan historiassa,
  ei alkanut Betlehemissä eikä päättynyt Golgatalla. Hän oli Isän Esikoinen, ainosyntyinen Poika lihassa,
  maailman Lunastaja.
- Hän nousi haudasta, ”esikoisena niiden joukosta jotka ovat kuolleet” (1. Kor. 15:20). Hän vieraili ylösnousseena
  Herrana niiden luona, joita Hän oli rakastanut elämässä. Hän palveli myös muiden lampaidensa (ks. Joh.
  10:16) keskuudessa muinaisessa Amerikassa. Hän ja Hänen Isänsä ilmestyivät nykymaailmassa nuorelle Joseph
  Smithille aloittaen kauan luvatun aikojen täyttymisen taloudenhoitokauden (ks. Ef. 1:10, englanninkielinen
  kuningas Jaakon raamatunkäännös).
- 'Profeetta Joseph kirjoitti elävästä Kristuksesta: ”Hänen silmänsä olivat kuin tulenliekki; hänen päänsä
  hiukset olivat valkoiset kuin puhdas lumi; hänen kasvonsa loistivat kirkkaammin kuin aurinko; ja hänen
  äänensä oli kuin suurten vesien pauhu, nimittäin Jehovan ääni, joka sanoi:'
- Minä olen ensimmäinen ja viimeinen; minä olen hän, joka elää, minä olen hän, joka surmattiin; minä olen
  teidän puolustajanne Isän luona.” (OL 110:3–4.)
- 'Profeetta julisti Hänestä myös näin: ”Ja nyt, niiden monien todistusten jälkeen, jotka hänestä on annettu,
  tämän todistuksen, kaikista uusimman, me annamme hänestä, että hän elää!'
- Sillä me näimme hänet, tosiaankin Jumalan oikealla puolella; ja me kuulimme äänen todistavan, että hän
  on Isän Ainosyntyinen –
- että juuri hän on luonut nykyiset ja menneet maailmat ja että niiden asukkaat ovat Jumalalle syntyneitä
  poikia ja tyttäriä.” (OL 76:22–24.)
- Me julistamme juhlallisin sanoin, että Hänen pappeutensa ja Hänen kirkkonsa on palautettu maan päälle
  – kirkko, ”jonka perustuksena ovat apostolit ja profeetat ja jonka kulmakivenä on itse Kristus Jeesus”
  (Ef. 2:20).
- Me todistamme, että jonakin päivänä Hän palaa maan päälle. ”Herran kunnia ilmestyy, kaikki saavat sen
  nähdä” (Jes. 40:5). Hän on hallitseva kuninkaiden Kuninkaana ja vallitseva herrojen Herrana, ja Hänen
  edessään jokainen polvi on notkistuva ja jokainen kieli on ylistävä Jumalaa ja palveleva Häntä. Jokainen
  meistä on seisova Hänen tuomittavanaan tekojensa ja sydämensä halujen mukaan.
- Hänen asianmukaisesti asetettuina apostoleinaan me todistamme, että Jeesus on elävä Kristus, Jumalan
  kuolematon Poika. Hän on suuri kuningas Immanuel, joka seisoo tällä hetkellä Isänsä oikealla puolella.
  Hän on maailman valkeus, elämä ja toivo. Hänen tiensä on se polku, joka johtaa onneen tässä elämässä
  ja iankaikkiseen elämään tulevassa maailmassa. Jumalalle kiitos Hänen jumalallisen Poikansa vertaansa
  vailla olevasta lahjasta.
