title: Perhe
subtitle: julistus maailmalle
author: Myöhempien Aikojen Pyhien Jeesuksen Kristuksen Kirkon ensimmäinen presidenttikunta ja kahdentoista
  apostolin neuvosto
note: Presidentti Gordon B. Hinckley luki tämän julistuksen osana sanomaansa yleisessä Apuyhdistyksen
  kokouksessa 23. syyskuuta 1995 Salt Lake Cityssä Utahissa.
paragraphs:
- Me, Myöhempien Aikojen Pyhien Jeesuksen Kristuksen Kirkon ensimmäinen presidenttikunta ja kahdentoista
  apostolin neuvosto, julistamme juhlallisesti, että avioliitto miehen ja naisen välillä on Jumalan säätämä
  ja että perhe on keskeisellä sijalla Luojan suunnitelmassa Hänen lastensa iankaikkiseksi päämääräksi.
- Kaikki ihmiset – miehet ja naiset – on luotu Jumalan kuvaksi. Jokainen heistä on taivaallisten vanhempien
  rakas henkipoika tai -tytär, ja sellaisena jokaisella on jumalallinen luonne ja päämäärä. Sukupuoli
  on yksilön kuolevaisuutta edeltävän, kuolevaisuuden aikaisen ja iankaikkisen identiteetin ja tarkoituksen
  oleellinen ominaisuus.
- Kuolevaisuutta edeltävässä maailmassa henkipojat ja -tyttäret tunsivat Jumalan iankaikkisena Isänään
  ja palvelivat Häntä sellaisena sekä hyväksyivät Hänen suunnitelmansa, jonka mukaan Hänen lapsensa voivat
  saada fyysisen ruumiin ja saada maanpäällistä kokemusta edistyäkseen kohti täydellisyyttä ja toteuttaakseen
  lopulta jumalallisen päämääränsä iankaikkisen elämän perillisinä. Jumalallinen onnensuunnitelma tekee
  mahdolliseksi perhesuhteiden jatkumisen haudan tuolla puolen. Pyhissä temppeleissä tarjolla olevat pyhät
  toimitukset ja liitot suovat yksilöille mahdollisuuden palata Jumalan kasvojen eteen ja perheille mahdollisuuden
  tulla liitetyksi yhteen iankaikkisuudeksi.
- Ensimmäinen käsky, jonka Jumala antoi Aadamille ja Eevalle, koski heidän mahdollisuuttaan aviomiehenä
  ja vaimona tulla vanhemmiksi. Me julistamme, että Jumalan lapsilleen antama käsky lisääntyä ja täyttää
  maa on yhä voimassa. Me julistamme tämän lisäksi Jumalan määränneen, että pyhiä lisääntymisen voimia
  tulee käyttää ainoastaan miehen ja naisen kesken, jotka on laillisesti vihitty aviomieheksi ja vaimoksi.
- Me julistamme, että keino, jolla kuolevainen elämä luodaan, on Jumalan säätämä. Me vahvistamme, että
  elämä on pyhä ja että se on tärkeä Jumalan iankaikkisessa suunnitelmassa.
- Aviomiehellä ja vaimolla on vakava velvollisuus rakastaa toinen toistaan ja huolehtia toisistaan sekä
  rakastaa lapsiaan ja huolehtia heistä. ”Lapset ovat Herran lahja” (Ps. 127:3). Vanhemmilla on pyhä velvollisuus
  kasvattaa lapsensa rakkaudessa ja vanhurskaudessa, huolehtia heidän fyysisistä ja hengellisistä tarpeistaan
  ja opettaa heitä rakastamaan ja palvelemaan toisiaan, noudattamaan Jumalan käskyjä ja olemaan lainkuuliaisia
  kansalaisia, missä tahansa he asuvatkin. Aviomiehiä ja vaimoja – äitejä ja isiä – pidetään Jumalan edessä
  tilivelvollisina näiden velvollisuuksien täyttämisestä.
- Perhe on Jumalan säätämä. Hänen iankaikkisessa suunnitelmassaan on olennaista miehen ja naisen välinen
  avioliitto. Lapsilla on oikeus syntyä avioliitossa ja saada kasvatuksensa sellaiselta isältä ja äidiltä,
  jotka pitävät avioliittolupaukset kunniassa olemalla täysin uskollisia. Perhe-elämän onni saavutetaan
  todennäköisimmin silloin, kun sen perustana ovat Herran Jeesuksen Kristuksen opetukset. Onnistuneet
  avioliitot ja perheet perustuvat uskon, rukouksen, parannuksen, anteeksiannon, kunnioituksen, rakkauden,
  myötätunnon, työn ja tervehenkisen virkistystoiminnan periaatteille ja säilyvät näitä periaatteita noudattamalla.
  Jumalallisen suunnitelman mukaan isän on määrä johtaa perhettään rakkaudessa ja vanhurskaudessa, ja
  hän on velvollinen suojelemaan perhettään ja huolehtimaan sen toimeentulosta. Äiti on ensisijaisesti
  vastuussa lastensa hoivaamisesta. Näissä pyhissä tehtävissä isillä ja äideillä on velvollisuus auttaa
  toisiaan tasavertaisina kumppaneina. Vamma, kuolema tai muut olosuhteet saattavat vaatia yksilöllisiä
  sovellutuksia. Sukulaisten tulisi tarvittaessa antaa tukeaan.
- Me varoitamme siitä, että ne, jotka rikkovat siveyden liittoja, jotka kohtelevat pahasti puolisoaan
  tai jälkeläisiään tai jotka jättävät perhevelvollisuudet täyttämättä, seisovat eräänä päivänä tilivelvollisina
  Jumalan edessä. Varoitamme edelleen, että perheen hajoaminen tuo yksilöille, yhteisöille ja kansakunnille
  ne onnettomuudet, joista muinaiset ja nykyiset profeetat ovat ennustaneet.
- Me vetoamme vastuuntuntoisiin kansalaisiin ja viranhaltijoihin kaikkialla sellaisten toimenpiteiden
  edistämiseksi, joiden tarkoituksena on ylläpitää ja vahvistaa perhettä yhteiskunnan perusyksikkönä.
