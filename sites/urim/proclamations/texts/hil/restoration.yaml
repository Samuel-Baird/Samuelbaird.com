retrieved: '2026-11-02'
title: Ang Pagpanumbalik sang Kabug-osan sang Ebanghelyo ni Jesucristo
subtitle: Ika-duha ka Gatos ka Tuig nga Anibersaryo nga Proklamasyon sa Kalibutan
author: Ang Unang Pangulohan kag ang Konseho sang Dose ka Apostoles sang Ang Simbahan ni Jesucristo sang
  mga Santos sa Ulihing mga Adlaw
note: Ini nga proklamasyon ginbasa ni Pangulong Russell M. Nelson bilang bahin sang iya mensahe sa ika-190
  nga Tuigan nga Pangkabilogan nga Komperensya, Abril 5, 2020, sa Siyudad sang Salt Lake, Utah.
paragraphs:
- Hugot namon nga ginapahayag nga palangga sang Dios ang Iya mga anak sa tagsa ka nasyon sang kalibutan.
  Ang Dios nga Amay naghatag sa aton sang diosnon nga pagkabun-ag, sang indi matupungan nga kabuhi, kag
  sang wala dulunan nga nagabayad-sala nga halad sang Iya Hinigugma nga Anak, nga si Jesucristo. Paagi
  sa gahum sang Amay, si Jesus nabanhaw liwat kag nag-angkon sang kadalag-an batok sa kamatayon. Sia amo
  ang aton Manluluwas, ang aton Ehemplo, kag ang aton Manunubos.
- Duha ka gatos ka tuig ang nagligad, sa isa ka matahum nga aga sang tigpamulak sang 1820, ang lamharon
  nga si Joseph Smith, nga nagahandum nga mahibal-an kon sa diin nga simbahan magpasakop, nagkadto sa
  kakahuyan agud magpangamuyo malapit sa iya puluy-an sa naaminhan nga New York, USA. May mga pamangkot
  sia nahanungod sa kaluwasan sang iya kalag kag nagsalig nga ang Dios magagiya sa iya.
- Upod ang pagpaubos, amon ginapahayag nga bilang sabat sa iya pangamuyo, ang Dios nga Amay kag ang Iya
  Anak, nga si Jesucristo, nagpakita kay Joseph kag ginsugdan ang “pagpanumbalik sang tanan nga butang”
  (Mga Binuhatan 3:21) suno sa ginpropesiya sa Biblia. Sa sining panan-awon, nahibal-an niya nga pagkatapos
  sang kamatayon sang orihinal nga mga Apostoles, ang Bag-ong Katipan nga Simbahan ni Cristo nadula na
  sa kalibutan. Nahibal-an man ni Joseph nga sia mangin instrumento sa pagpanumbalik sini.
- Ginapanindugan namon nga sa idalom sang direksyon sang Amay kag sang Anak, ang langitnon nga mga mensahero
  nagkari sa pagtudlo kay Joseph kag sa pagpasad liwat sang Simbahan ni Jesucristo. Ang nabanhaw nga si
  Juan Bautista nagpanumbalik sang awtoridad sa pagbunyag paagi sa pagtugmaw para sa kapatawaran sang
  mga sala. Tatlo sa orihinal nga dose ka mga Apostoles—nga sanday Pedro, Santiago, kag Juan—ang nagpanumbalik
  sang pagka-apostoles kag sang mga yabi sang awtoridad sang pagkapari. Ang iban nag-alabot man, lakip
  na si Elias, nga nagpanumbalik sang awtoridad nga bugkuson ang mga pamilya sa katubtuban sa wala katapusan
  nga mga kaangtanan nga nagalampuwas sang kamatayon.
- 'Dugang kami nga nagasaksi nga si Joseph Smith ginhatagan sang dulot kag gahum sang Dios sa paglubad
  sang dumaan nga kasulatan: ang Libro ni Mormon—Isa pa ka Katipan nahanungod kay Jesucristo. Ang mga
  pahina sining sagrado nga kasulatan nagalakip sang kasaysayan sang personal nga pag-alagad ni Jesucristo
  sa katawhan sa Nakatundan nga Bahin sang Kalibutan pagkatapos sang Iya Pagkabanhaw. Nagatudlo ini sang
  katuyuan sang kabuhi kag nagapaathag sang doktrina ni Cristo, nga sentro sinang katuyuan. Bilang kaupod
  nga balaan nga kasulatan sang Biblia, ang Libro ni Mormon nagapamatuod nga ang tanan nga tawo mga anak
  nga lalaki kag mga anak nga babayi sang isa ka mapinalanggaon nga Amay sa Langit, nga Sia may diosnon
  nga plano para sa aton mga kabuhi, kag ang Iya Anak, nga si Jesucristo, nagahambal sa karon pareho sang
  sa dumaan nga panahon.'
- Amon ginapahayag nga Ang Simbahan ni Jesucristo sang mga Santos sa Ulihing mga Adlaw, nga gin-organisar
  sang Abril 6, 1830, amo ang Bag-ong Katipan nga Simbahan ni Cristo nga ginpanumbalik. Ang ining Simbahan
  napasad sa perpekto nga kabuhi sang iya pangulong pundasyon nga bato, nga si Jesucristo, kag sa Iya
  wala dulunan nga Pagbayad-Sala kag literal nga Pagkabanhaw. Si Jesucristo sa liwat nagtawag sang mga
  Apostoles kag ginhatagan sila sang awtoridad sang pagkapari. Ginaagda Niya kita tanan nga magkari sa
  Iya kag sa Iya Simbahan, sa pagbaton sang Balaan nga Espiritu, sang mga ordinansa sang kaluwasan, kag
  sa pag-angkon sang nagadugay nga kalipay.
- Duha ka gatos ka tuig na karon ang naglabay sumugod sang ang ining Pagpanumbalik ginsugdan sang Dios
  nga Amay kag sang Iya Hinigugma nga Anak, nga si Jesucristo. Minilyon na sa bilog nga kalibutan sa karon
  ang nagbaton sang ihibalo sining ginpropesiya nga mga hitabo.
- Malipayon namon nga ginapahayag nga ang ginpromisa nga Pagpanumbalik nagaidog paabante paagi sa nagapadayon
  nga rebelasyon. Ang duta indi na mangin pareho sadto, bangud kay ang Dios “magatingub sang tanan nga
  butang kay Cristo” (Mga Taga-Efeso 1:10).
- Upod ang pagtahod kag pagpasalamat, kami bilang Iya mga Apostoles nagaagda sa tanan sa paghibalo—pareho
  sa amon—nga ang kalangitan bukas. Amon ginapabakod nga ang Dios nagapahibalo sang Iya pagbuot para sa
  Iya hinigugma nga mga anak nga lalaki kag mga anak nga babayi. Nagapamatuod kami nga yadtong mga mainampuon
  nga nagatuon sang mensahe sang Pagpanumbalik kag nagagiho nga may pagtuo pagabugayan agud maangkon ang
  ila kaugalingon nga saksi sang pagkadiosnon sini kag sang katuyuan sini sa paghanda sang kalibutan para
  sa Ika-duha nga Pagkari sang aton Ginuo kag Manluluwas, nga si Jesucristo.
