title: Ang Buhi nga Cristo
subtitle: Ang Testimonya sang mga Apostoles
author: Ang Simbahan ni Jesucristo sang mga Santos sa Ulihing mga Adlaw
paragraphs:
- Samtang ginasaulog naton ang pagkabun-ag ni Jesucristo sang nagligad nga duha ka milenya, ginadulot
  namon ang amon testimonya sang pagkamatuodtuod sang Iya indi matupongan nga kabuhi kag sang wala’y dulonan
  nga birtud sang Iya dako nga nagabayad-sala nga halad. Wala na sing iban pa nga may subong nga indi-matungkad
  nga impluwensya sa tanan nga nagkabuhi kag magakabuhi pa sa ibabaw sang duta.
- Sia ang Dakong si Jehova sang Daan nga Katipan, ang Mesias sang Bag-ong Katipan. Sa idalom sang direksyon
  sang Iya Amay, Sia ang tagtuga sang duta. “Ang tanan nga butang ginhimo niya, kag sa wala sia wala’y
  bisan ano nga nahimo sang ginhimo” (Juan 1:3). Bisan pa nga wala’y sala, ginbunyagan Sia sa pagtuman
  sang bug-os nga pagkamatarong. Sia “naglibot nga nagahimo sing kaayuhan” (Mga Binuhatan 10:38), apang
  gintamay tungod sini. Ang Iya ebanghelyo isa ka mensahe sang paghidaet kag maayong kabubut-on. Naga-agda
  Sia sa tanan sa pagsunod sang Iya halimbawa. Naglatas Sia sa mga dalanon sang Palestina nga nagapang-ayo
  sang mga masakiton, nagatuga sang mga bulag nga makakita, kag nagapabalik sang mga minatay sa kabuhi.
  Nagpanudlo Sia sang mga kamatuoran sang wala’y katapusan, sang pagkamatuodtuod sang aton pagkabuhi sang
  wala pa kita mabun-ag, sang katuyuan sang aton kabuhi sa duta, kag sang ikasangkol para sa mga anak
  nga lalaki kag mga anak nga babayi sang Dios sa kabuhi nga magaabot.
- Ginsugdan Niya ang [ordinansa sang] sakramento bilang pahanumdom sang Iya dako nga nagabayad-sala nga
  halad. Gindakop Sia kag ginpamatbatan sa butig nga mga panumbongon, ginhukman sa paglipay sang magamo
  nga kadam-an, kag ginpamatbatan nga mamatay sa krus sa Kalbaryo. Ginhatag Niya ang Iya kabuhi sa pagbayad
  para sa mga sala sang tanan nga tawo. Ang Iya ginhimo isa ka dako nga salili nga dulot para sa tanan
  nga magakabuhi pa sa ibabaw sang duta.
- Maligdong nga nagasaksi kami nga ang Iya kabuhi, nga amo ang sentro sang tanan nga kasaysayan sang tawo,
  wala magsugod sa Betlehem ukon nagtapos sa Kalbaryo. Sia ang Panganay sang Amay, ang Bugtong nga Inanak
  sa unod, ang Manunubos sang kalibutan.
- Nabanhaw Sia gikan sa lulubngan agud “mangin panganay sang mga nagakatulog” (1 Mga Taga-Corinto 15:20).
  Bilang Nabanhaw nga Ginuo, nagduaw Sia sa tunga sadtong ginpalangga Niya sa kabuhi. Nag-alagad man Sia
  sa tunga sang Iya “iban pa nga mga karnero” (Juan 10:16) sa dumaan nga Amerika. Sa moderno nga kalibutan,
  Sia kag ang Iya Amay nagpakita sa lamharon nga si Joseph Smith, nga nagpasugod sang madugay na nga ginpanaad
  nga “dispensasyon sang kabug-usan sang panahon” (Mga Taga-Efeso 1:10).
- 'Parte sa Buhi nga Cristo, ang Propeta nga si Joseph nagsulat: “Ang iya mga mata pareho sang dabadaba
  sang kalayo; ang buhok sa iya ulo puti pareho sang puraw nga niyebe; ang iya nawong nagasilak labaw
  pa sa kasanag sang adlaw; kag ang iya tingug pareho sang tunog sang daganas sang dalagko nga mga katubigan,
  bisan pa ang tingug ni Jehova nga nagasiling:'
- “Ako ang una kag ang katapusan; ako sia nga nagakabuhi, ako sia nga napatay; ako ang inyo mananabang
  sa Amay” (D&K 110:3–4).
- 'Ang Propeta nagpahayag man parte sa Iya: “Kag karon, pagkatapos sing madamo nga testimonya nga ginhatag
  parte sa iya, ini ang testimonya nga pinakaulihi sa tanan nga ginhatag namon parte sa iya: Nga buhi
  sia!'
- “Kay nakita namon sia sa tuo nayon nga kamot sang Dios; kag nabatian namon ang tingug nga nagapamatuod
  nga sia ang Bugtong nga Anak sang Amay—
- “Nga sa iya, kag paagi sa iya, kag halin sa iya, ginatuga kag gintuga ang mga kalibutan, kag ang mga
  pumuluyo sini ginbun-ag nga mga anak nga lalaki kag babayi sang Dios” (D&K 76:22–24).
- Ginapahayag namon sa mga pulong nga maligdong nga ang Iya pagkapari kag ang Iya Simbahan napanumbalik
  na sa duta—“ginpatindog sa sadsaran sang … mga apostoles kag mga propeta, kag si Cristo Jesus gid mismo
  amo ang pamusod nga bato” (Mga Taga-Efeso 2:20).
- Nagasaksi kami nga sa pila ka adlaw magabalik Sia sa duta. “Dayon ang himaya sang Ginuo igapahayag,
  kag ang tanan nga mga tawo makakita sini” (Isaias 40:5). Magadumala Sia bilang Hari sang mga Hari kag
  magagahum bilang Ginuo sang mga Ginuo, kag ang tagsa ka tuhod magaluhod kag ang tagsa ka dila magadayaw
  sa pagsimba sa atubang Niya. Ang tagsa sa aton magatindog agud hukman Niya suno sa aton mga binuhatan
  kag sa mga handum sang aton mga tagipusuon.
- Nagapahayag kami sang testimonya, bilang Iya nagakaigo nga gin-ordinan nga mga Apostoles—nga si Jesus
  amo ang Buhi nga Cristo, ang wala’y kamatayon nga Anak sang Dios. Sia ang dako nga Haring Emmanuel,
  nga nagatindog karon sa tuo nayon nga kamot sang Iya Amay. Sia ang kasanag, ang kabuhi, kag ang paglaum
  sang kalibutan. Ang Iya alagyan amo ang banas nga nagapadulong sa kalipayan sa sini nga kabuhi kag kabuhi
  nga wala’y katapusan sa kalibutan nga magaabot. Pasalamatan naton ang Dios tungod sa indi matupongan
  nga dulot sang Iya diosnon nga Anak.
