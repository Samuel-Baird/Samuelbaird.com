title: Ang Mga Artikulo sang Pagtuo sang
subtitle: Ang Simbahan ni Jesucristo sang mga Santos sa Ulihing mga Adlaw
author: ''
verses:
- n: 1
  text: Nagapati kami sa Dios, ang Wala’y Katapusan nga Amay, kag sa Iya Anak, si Jesucristo, kag sa Balaan
    nga Espiritu.
- n: 2
  text: Nagapati kami nga ang mga tawo pagasilutan tungod sa ila kaugalingon nga mga sala, kag indi tungod
    sa paglapas ni Adan.
- n: 3
  text: Nagapati kami nga paagi sa Pagpasag-uli ni Cristo, ang tanan nga katawhan sarang maluwas, paagi
    sa pagtuman sang mga kasuguan kag mga ordinansa sang Ebanghelyo.
- n: 4
  text: 'Nagapati kami nga ang una nga mga pagsulundan kag mga ordinansa sang Ebanghelyo amo ang: una,
    Pagtuo sa Ginuong Jesucristo; ika-duha, Paghinulsol; ika-tatlo, Bunyag paagi sa pagtugmaw para sa
    kapatawaran sang mga sala; ika-apat, Pagtakdong sang mga kamot para sa dulot sang Balaan nga Espiritu.'
- n: 5
  text: Nagapati kami nga ang isa ka tawo kinahanglan pagatawgon sang Dios, paagi sa panagna, kag paagi
    sa pagtakdong sang mga kamot nila nga yara sa pagbulut-an, sa pagwali sang Ebanghelyo kag pagdumala
    sa mga ordinansa sini.
- n: 6
  text: Nagapati kami sa amo man nga organisasyon nga nagluntad sa Unang Simbahan, nga ginahingadlan,
    mga apostoles, mga manalagna, mga pastor, mga manunudlo, mga evangelista, kag madamo pa.
- n: 7
  text: Nagapati kami sa dulot sang mga hambal, panagna, bugna, mga palanan-awon, pagpang-ayo, paglubad
    sang mga hambal, kag madamo pa.
- n: 8
  text: Nagapati kami sa Biblia nga pulong sang Dios kon ini ginlubad sing husto; nagapati man kami sa
    Libro ni Mormon nga pulong sang Dios.
- n: 9
  text: Nagapati kami sa tanan nga ginpahayag sang Dios, sa tanan nga Iya ginapahayag karon, kag nagapati
    kami nga Sia magapahayag pa sang madamo nga dalagko kag importante nga mga butang nahanungod sa Ginharian
    sang Dios.
- n: 10
  text: Nagapati kami sa matuod nga pagtipon sang Israel kag sa pag-uli sang Napulo ka mga Tribo; nga
    ang Sion (Ang Bag-ong Jerusalem) igatukod sa kontinente sang Amerika; nga si Cristo personal nga magagahum
    diri sa duta; kag, nga ang duta pagabag-uhon kag magabaton sang iya paraisuhanon nga himaya.
- n: 11
  text: Nagaangkon kami sang pribelihiyo sa pagsimba sa Dios nga Makagagahum suno sa mga dikta sang amon
    kaugalingon nga konsensya, kag nagatugot sa tanan nga mga tawo sang amo man nga pribelihiyo, nagatugot
    sa ila sa pagsimba kon paano, sa diin, ukon ano man sila.
- n: 12
  text: Nagapati kami sa pagpaidalom sa mga hari, mga pangulo, mga manggagahum, kag mga hukom, sa pagtuman,
    pagtahod kag pagsakdag sang layi.
- n: 13
  text: Nagapati kami sa pagkatampad, pagkamatuod, pagkaputli, pagkamaluluy-on, pagkatakos, kag sa pagbuhat
    sang maayo sa tanan nga mga tawo; sa pagkamatuod, sarang kami makasiling nga amon ginasunod ang laygay
    ni Pablo—Nagapati kami sa tanan nga mga butang, nagalaum sa tanan nga mga butang, nag-antos sang madamo
    nga mga butang, kag nagalaum nga masarangan sa pag-antos ang tanan nga mga butang. Kon may bisan ano
    nga butang nga takos, matahum, ukon maayo nga ibantala ukon angay dayawon, kami nagapangita sini nga
    mga butang.
signature: Joseph Smith.
