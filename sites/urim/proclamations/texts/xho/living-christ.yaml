title: UKrestu oPhilayo
subtitle: UBungqina babaPostile
author: Ibandla likaYesu Krestu labaNgcwele beMihla yokuGqibela
paragraphs:
- Njengokuba sikhumbula ukuzalwa kukaYesu Krestu kwiminyaka engamawaka amabini adlulayo, sinika ubungqina
  benyaniso ngobomi baKhe obungalinganisekiyo kwaye nokulunga kwakhe okungapheliyo bokuncama ngentlawulo
  yaKhe enkulu. Akekho omnye oye waba nempembelelo enzulu phezu kwabo bonke abaphilileyo kwaye abasezakuphila
  phezu komhlaba.
- WayenguYehova omkhulu weTestamente Endala, uMesiya weNtsha. Ngaphantsi kwenkokhelo kaBawo waKhe, Wayengu
  mdali womhlaba. “Zonke izinto zenziwa nguye; kwaye ngaphandle kwakhe kwakungekho nto yenziweyo eyenziwayo”
  (UYohane 1:3). Nangona wayengenaso isono, Wabhaptizwa ukuzalisekisa bonke ubulungisa. Wa “hamba - hamba
  esenza okulungileyo” (Izenzo 10:38), kodwa wacatshukelwa ngenxa yoko. Ivangeli laKhe yayingumyalezo
  woxolo namandla wobulungisa. Wacela bonke ukuba balandele umzekelo waKhe. Wahamba kwiindlela zasePalestine,
  ephilisa abagulayo, ebanga iimfama ukuba zibone, kwaye evusa abafileyo. Wasifundisa iinyaniso zanaphakade,
  ubunene bobomi bethu bangaphimbili, injongo yobomi bethu emhlabeni, kwaye namandla apheleleyo oonyana
  namantombazana kaThixo ebomini obuzayo.
- Waqalisa umthendeleko njengesikhumbuzo seNtlawulo yaKhe enkulu engumnikelo. Wabanjwa kwaye waqalekiswa
  ngamatyala angekhoyo, wagwetywa ukwanelisa ibubu, kwaye wagwetywa ngokufa emnqamlezweni eKhalvari. Wanikela
  ngobomi baKhe ukuhlawula izono zoluntu lonke. Okwakhe yayisisipho sothunyiweyo esenzela bonke abo abayakuphila
  emhlabeni.
- Siyangqina ngokusulungekileyo ukuba ubomi baKhe, obusesidikidikini kwembali yonke yoluntu, obungazange
  buqale eBhetelehem futhi abagqitywa eKhalvari. Waye ngumntana wokuqala kaBawo, Oyena Ekukuphela kwakhe
  okhethiweyo uNyana osenyameni, uMkhululi wehlabathi
- Wavuka engcwabeni ukuze “abe ziziqhamo zokuqala zabo bonke abaleleyo” (Ⅰ KwabaseKorinte 15:20). NjengeNkosi
  Evukileyo, Wandwendwela phakathi kwabo Wayebathanda emhlabeni. Kwaye washumayeza phakathi kwezaKhe “ezinye
  iimvu” (UYohane 10:16) eMelika yamandulo. Kwihlabathi elitsha, Yena noBawo waKhe bavela enkwenkweni
  uJoseph Smith, esandulela isithembiso esenziwa kudala “sexesha lokuzakaliseka kwamaxesha” (Kwabase-Efese
  1:10).
- 'NgoKrestu oPhilayo, uMprofeti Joseph wabhala: “Amehlo ayo ayenjengedangatye lomlilo; iinwele zentloko
  yayo zazimhlophe njengekhephu elisulungekileyo; imbonakalo yayo iqaqambe ngaphezu kokuqaqamba kwelanga;
  nelizwi layo lalinjengesandi samanzi amaninzi angxamileyo, nkqu ilizwi likaYehova, lisithi:'
- “Ndisisiqalo nesiphelo; ndinguye lowo uphilayo, ndinguye lowo wabulawayo; ndingumthetheleli wenu kunye
  noBawo” (I&M 110:3–4).
- 'Ngaye uMprofeti kwakhona wabhengeza: “Kwaye ngoku, emva kobungqina obuninzi obunikiweyo ngaye, obu
  bubungqina bokugqibela babo bonke, esibunika ngaye: Bokokuba uyaphila!'
- “Kuba sambona, nkqu ekunene kukaThixo; kwaye saliva ilizwi linika ubungqina ukuba uKuphela koZelweyo
  kaBawo—
- “Okokuba ngaye, nangaye, nangokukokwakhe, amahlabathi akho kwaye adalwa, nabemi bawo bangoonyana neentombi
  ezizelweyo kuThixo” (I&M 76:22–24).
- Siyanazisa ngamazwi asulungekileyo ukuba ububingeleli baKhe kunye neCawa yaKhe zibuyisiwe emhlabeni—“zakhiwe
  phezu kwesiseko sa … bapostile kunye nabaprofeti, uYesu Krestu yena ngobuqu lilitye lekona elikhulu
  eliyinkosi” (Kwabase-Efese 2:20).
- Siyangqina ukuba Uyakubuyela emhlabeni ngenye imini. “Kwaye uzuko lweNkosi luyakutyhilwa, kwaye yonke
  imizimba yenyama iyakulubona kunye” (UIsaya 40:5). Uyakulawula njengeKumkani yooKumkani kwaye aphathe
  njengeNkosi yeeNkosi, kwaye lonke idolo liyakugoba kwaye onke amalwimi ayakuthetha enqula phambi kwaKhe.
  Umntu ngamnye kuthi uyakumela ukugwetywa nguYe ngokwemisebenzi yethu kwaye neminqweno yeentliziyo zethu.
- Siyangqina, njengabaPostile baKhe abamiswe nguYe—ukuba uYesu unguKrestu oPhilayo, uNyana wanaPhakade
  kaThixo. UnguKumkani omkhulu uImanyuwel, oma namhlanje kwisandla sasekunene sikaThixo. Ukukukhanya,
  ubomi, kunye nethemba lehlabathi. Indlela yaKhe yindlela ekhokelela elonwabeni kobu bomi kwaye nakubomi
  banaphakade kunye noThixo kwihlabathi elizayo. UThixo makabulelwe ngesiphiwo esingalinganisekiyo esinguNyana
  waKhe wezulu.
