title: USapho
subtitle: ISibhengezo kwiHlabathi
author: UBongameli bokuQala neQumrhu laBapostile abaLishumi elineSibini leBandla likaYesu Krestu labaNgcwele
  beMihla yokuGqibela
note: Esi sibhengezo sasifundwe nguMongameli Gordon B. Hinckley njengenxalenye yomyalezo wakhe kuMhlangano
  woMbutho waMamanina owawubanjwe kweyoMsintsi 23, 1995, kwiSixeko saseSalt Lake, Utah.
paragraphs:
- Thina, uBongameli bokuQala neQumrhu laBapostile abaLishumi elineSibini leBandla likaYesu Krestu labaNgcwele
  beMihla yokuGqibela, ngokundilisekileyo siyabhengeza ukuba umtshato phakathi kwendoda nomfazi umiselwe
  nguThixo kwaye nokokuba usapho lubaluleke kakhulu kwicebo loMdali lolwazelelo lwanaphakade lwabantwana
  baKhe.
- Wonke umntu—indoda nomfazi—udalwe ngokomfanekiselo kaThixo. Omnye ngamnye uyintandane engunyana okanye
  eyintombi ngokwasemoyeni yabazali basezulwini, kwaye, ngokunjalo, umntu ngamnye unemvelo yobuThixo nolwazelelo.
  Isini siluphawu olubalulekileyo somntu ngamnye sobomi bangaphambili, sobomi basemhlabeni, kunye nesazisi
  sanaphakade nenjongo.
- Ebomini bangaphambili, oonyana neentombi zomoya babemazi kwaye babemnqula uThixo njengoYise wabo onguNaphakade
  kwaye babelamkele icebo laKhe elalibonelela ukuba abantwana baKhe babenokufumana umzimba wenyama kwaye
  bazuze amava asemhlabeni ukuze baqhubekele kwingqibelelo kwaye nasekugqibeleni bafikelele kulwazelelo
  lwabo njengeendlalifa zobomi banaphakade. Icebo lobuThixo lovuyo lenza ubudlelwane beentsapho ukuba
  budlulele ngapha kwengcaba. Imimiselo engcwele neminqophiso efumaneka kwiitempile ezingcwele yenza abantu
  bakwazi ukubuyela kubukho bukaThixo kunye neentsapho ukuba zimanywe ngonaphakade.
- Umyalelo wokuqala uThixo owawunika uAdam noEva wawumayelana nokokuba babenokuba ngabazali njengendoda
  nomfazi. Siyabhengeza ukuba umthetho kaThixo ebantwaneni baKhe wokuba bande bawuzalise umhlaba usasebenza.
  Siyabhengeza ngakumbi ukuba uThixo uye wayalela okokuba ulwabelwano lwesondo lunyulu kumele lusetyenziswe
  phakathi kwendoda nomfazi, abatshate ngokusemthethweni njengomyeni nenkosikazi.
- Siyabhengeza ukuba indlela ubomi emhlabeni obudalwe ngayo buhleliwe nguThixo. Siyangqina ngobungcwele
  bobomi kunye nokubaluleka kwabo kwicebo likaThixo lanaphakade.
- Umyeni nenkosikazi banoxanduva olundilisekileyo lokokuba bathandane kwaye bakhathalelane kunye nabantwana
  babo. “Abantwana balilifa leNkosi” (thelekisa IiNdumiso 127:3). Abazali banomsebenzi ongcwele wokukhulisa
  abantwana babo ngothando nangobulungisa, bababonelele ngeemfuno zokwenyama nezokomoya, kwaye babafundise
  ukuba bathandane bancedane, baqwalasele imithetho kaThixo, kwaye babengabemi abathobela imithetho yalapho
  bahlala khona. Abayeni namakhosikazi—oomama nootata—baya kuziphendulela phambi kukaThixo ngokufezekisa
  olu xanduva.
- Usapho lumiselwe nguThixo. Umtshato phakathi kwendoda nomfazi uyinxalenye ebalulekileyo kwicebo laKhe
  lanaphakade. Abantwana banelungelo lokuzalelwa ebazalini abatshatileyo, kwaye bakhuliswe ngutata nomama
  abahlonipha izifungo zomtshato ngokunyaniseka okugqibeleleyo. Ulonwabo kubomi losapho lungaphunyezwa
  ngokugqibeleleyo xa lusekelwe phezu kweemfundiso zeNkosi uYesu Krestu. Imitshato neentsapho eziphumeleleyo
  zisekwa kwaye zilondolozwa kwimigaqo yomthandazo, yokholo, yenguquko, yoxolelwano, yentlonipho, yothando,
  yemfesane, yomsebenzi, kunye nemisebenzi yokuzonwabisa enempilo. Ngecebo likaThixo, ootata kumele bongamele
  kwiintsapho zabo ngothando nangobulungisa kwaye banoxanduva lokubonelela ngeemfuneko zobomi nokhuselo
  lweentsapho zabo. Uxanduva loomama olungundoqo kukondla abantwana babo. Ootata noomama, kolu xanduva
  banyanzelekile ukuba bancedane njengamaqabane alinganayo. Ukukhubazeka, ukufa, okanye ezinye iimeko
  zingenza kube yimfuneko yokuba niziqhelanise nazo ekukhathaleleni usapho. Ezinye izalamane kumele zincede
  xa kunemfuneko yoko.
- Siyalumkisa ukuba abantu abathi bophule iminqophiso yobunyulu, baxhaphaze abalingane babo okanye abantwana
  babo, okanye abathi bohluleke ukuzalisekisa uxanduva losapho baya kuziphendulela kuThixo ngenye imini.
  Ngaphezulu koko, siyalumkisa ukuba uqhekeko losapho luya kwehlisa izihelegu ebantwini, eluntwini, nasemazweni
  ezazixelwe kwangaphambili ngabaprofeti bamandulo nabanamhlanje.
- Simema abemi abanenkathalo kunye namagosa karhulumente kuyo yonke indawo ukuba bakhuthaze loo manyathelo
  awacwangciselwa ukugcina nokomeleza usapho njengelungu elisisiseko soluntu.
