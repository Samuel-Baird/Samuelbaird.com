title: IziVumo zoKholo
subtitle: zeBandla likaYesu Krestu labaNgcwele beMihla yokuGqibela
author: ''
verses:
- n: 1
  text: Sikholelwa kuThixo, uBawo wanaPhakade, nakuNyana Wakhe, uYesu Krestu, nakuMoya oyiNgcwele.
- n: 2
  text: Sikholwa ekubeni abantu baya kohlwayelwa izono ezizezabo, kwaye ingabi kukukreqa kuka-Adam.
- n: 3
  text: Sikholwa ekubeni ngeNtlawulelo kaKrestu, lonke uluntu lunokusindiswa, ngokuthobela imithetho nemimiselo
    yeVangeli.
- n: 4
  text: 'Sikholwa ekubeni imigaqo yokuqala nemimiselo yeVangeli yile: okokuqala, uKholo eNkosini uYesu
    Krestu; okwesibini, ukuGuquka; okwesithathu, uBhaptizo ngontywiliselo lokuxolelwa kwezono; okwesine;
    ukuBekelwa izandla isipho soMoya oyiNgcwele.'
- n: 5
  text: Sikholwa ekubeni indoda imele ukubizwa nguThixo ngesiprofetho, nangokubekwa kwezandla ngabo basemagunyeni,
    ukuze ishumayele iVangeli ize ilungiselele kwimimiselo yayo.
- n: 6
  text: Sikholelwa kwa kulungiselelo olwalukho kwiBandla laMandulo, ababizwa ngolu hlobo, abapostile,
    abaprofeti, abelusi, abafundisi, abavangeli nanjalo-njalo.
- n: 7
  text: Sikholelwa kwisipho seelwimi, sokuprofetha, sesityhilelo, imibono, ukuphilisa, ukucaciswa kweelwimi,
    na njalo-njalo.
- n: 8
  text: Sikholwa ukuba iBhayibhile ekubeni lilizwi likaThixo njengoko iguqulelwe ngokuchanekileyo; kanjalo
    sikholwa ukuba iNcwadi kaMormoni ibe ililizwi likaThixo.
- n: 9
  text: Sikholwa kuko konke akutyhilileyo uThixo, konke akutyhila ngoku, kwaye sikholwa kukuba usaya kutyhila
    izinto ezininzi ezinkulu nezibalulekileyo ngokuphathelele eBukumkanini bukaThixo.
- n: 10
  text: Sikholelwa ekuhlanganisweni ncam kukaSirayeli nasekubuyiselweni kweZizwe eziLishumi; kuba iZiyon
    (iYerusalem eNtsha) iya kwakhiwa phezu kwelizwekazi iAmerika; kuba uKrestu uya kulawula ubuqu phezu
    komhlaba; nokuba, umhlaba uya kwenziwa mtsha uze ufumane ubuqaqawuli bawo beparadesi.
- n: 11
  text: Sibanga ilungelo elilodwa lokunqula uThixo uSomandla ngokolawulo lwesazela esisesethu, size sivumele
    bonke abantu ilungelo elilodwa elikwafanayo, sibavumela ukukhonza ngokokuzikhethela, apho banokuzikhethela,
    okanye oko banokuzikhethela.
- n: 12
  text: Sikholelwa ekubeni phantsi kwezikumkani, oomongameli, abalawuli, noomantyi, ngokuthobela, ukubeka,
    nokuxhasa umthetho.
- n: 13
  text: Sikholelwa ekunyanisekeni, kwinene, ebumsulweni, ekubeni nesisa, ekulungeni kanye, nasekwenzeni
    ukulunga kubo bonke abantu; ngenene, sinokuthi okokuba silandela isiyalo sikaPawulos—Sikholwa zizinto
    zonke, sithemba iinto zonke, sinyamezele iinto ezininzi, size sithembe ekubeni nako ukunyamezela iinto
    zonke. Ukuba kukho nakuphina ukulunga kanye, ubuhle, okanye ingxelo elungileyo okanye okuncomekayo,
    sifuna ezi zinto.
signature: Joseph Smith.
