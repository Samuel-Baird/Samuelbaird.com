slug: restoration
language: xho
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=xho
retrieved: '2026-11-02'
title: UBuyiselo Olupheleleyo lweVangeli kaYesu Krestu
subtitle: ISibhengezo esiseMthethweni seSikhumbuzo seMinyaka engaMakhulu Amabini kwiHlabathi
author: UBongameli bokuQala neBhunga laBapostile abaLishumi elineSibini leBandla likaYesu Krestu labaNgcwele
  beMihla yokuGqibela
note: Esi sibhengezo sisemthemthweni sasifundwe nguMongameli Russell M. Nelson njengenxalenye yomyalezo
  wakhe kwiNkomfa yaJikelele yemiNyaka eli-190, ngosuku lwesi-5 kuTshazimpunzi ka-2020, eSalt Lake City,
  Utah.
paragraphs:
- Ngokundilisekileyo siyabhengeza ukuba uThixo uyabathanda abantwana baKhe kwizizwe zonke zehlabathi.
  UThixo uYise usinike ukuzalwa okusulungekileyo, ubomi obungenakuthelekiswa nanto, kunye nedini lentlawulelo
  elingenasiphelo loNyana waKhe oyiNtanda, uYesu Krestu. Ngamandla kaYise, uYesu wavuka kwakhona kwaye
  wazuza uloyiso ngapha kokufa. UnguMsindisi wethu, unguMzekelo kuthi, kunye noMkhululi wethu.
- Kwiminyaka engamakhulu amabini eyadlulayo, kwintsasa emyoli yentwasahlobo ka-1820, uJoseph Smith omncinane,
  efuna ukwazi ukuba azibandakanye naliphi na ibandla, waye wayokuthandaza kwihlathana elibumgama nakowabo
  kumantla weNew York, USA. Yena wayenemibuzo malunga nentsindiso yomphefumlo wakhe kwaye wayethemba ukuba
  uThixo wayeya kumkhombisa.
- Ngokuzithoba, siyabhengeza ukuba kwimpendulo yomthandazo wakhe, uThixo uYise kunye noNyana waKhe, uYesu
  Krestu, baye bazibonakalisa kuJoseph kwaye basungula “ukubuyiswa kweento zonke” (Izenzo 3:21) njengoko
  kwakuxeliwe kwangaphambili eBhayibhileni. Kulo mbono, waye wafunda okokuba emva kokufa kwaBapostile
  bokuqala, iBandla likaKrestu leTestamente eNtsha laye lalahleka emhlabeni. UJoseph wayeya kuba sisixhobo
  ekubuyisweni kwalo.
- Siyaqinisekisa ukuba ngaphantsi kwesikhokelo sikaYise noNyana, izithunywa zezulu zeza kuyalela uJoseph
  kwaye zaseka kwakhona iBandla likaYesu Krestu. UYohane uMbhaptizi ovukileyo kwabafileyo wabuyisa igunya
  lokubhaptiza ngontywiliselo ukuze kuxolelwe izono. Abathathu baBapostile bakuqala—uPetros, noYakobi,
  kunye noYohane—baye babuyisa ubupostile kunye nezitshixo zegunya lobubingeleli. Nabanye beza kananjalo,
  kuquka noEliya owaye wabuyisa igunya lokuhlanganisa iintsapho ngonaphakade kubudlelwane banaphakade
  obuthi budlule ngaphaya kokufa.
- 'Siyangqina kwakhona ukuba uJoseph Smith waye wanikwa isipho kunye namandla kaThixo wokokuba aguqule
  uxwebhu lwamandulo: iNcwadi kaMormoni—Enye iTestamente kaYesu Krestu. Amaphepha walombhalo ungcwele
  aquka ingxelo yolungiselelo yabuqu lukaYesu Krestu phakathi kwabantu kwiCala laseNtshona loMhlaba kamsinya
  emva koVuko lwaKhe kwabafileyo. Yona ifundisa ngenjongo yobomi kwaye icacisa imfundiso kaKrestu, esembindini
  kuloo njongo. Njengesibhalo esingcwele esihambelana neBhayibhile, iNcwadi kaMormoni iyangqina ukuba
  bonke abantu bangoonyana neentombi zoYise onothando oseZulwini, okokuba Yena unecebo elisikelelekileyo
  ngobomi bethu, kwaye nokokuba uNyana waKhe, uYesu Krestu, uyathetha namhlanje ngokufanayo nakwiintsuku
  zamandulo.'
- Siyabhengeza ukuba iBandla likaYesu Krestu labaNgcwele beMihla yokuGqibela, elasekwa ngomhla we-6 kuTshazimpunzi,
  1830, liBandla likaKrestu leTestamente eNtsha elibuyisiweyo. Eli Bandla lisekwe phezu kobomi obugqibeleleyo
  belitye lalo lembombo, uYesu Krestu, nakwiNtlawulelo yaKhe engenasiphelo nakuVuko lwakhe kwabafileyo.
  UYesu Krestu uye waphinda wabiza kwakhona aBapostile kwaye ubanike igunya lobubingeleli. Yena uyasimema
  sonke ukuba size kuYe nakwiBandla laKhe, ukuze sifumane uMoya oyiNgcwele, nemimiselo yosindiso, kwakunye
  nokuzuza uvuyo olungapheliyo.
- Iminyaka engamakhulu amabini ngoku igqithile kusukela oko uBuyiselo lwaluqalwe nguThixo uBawo kunye
  noNyana waKhe oyiNtanda, uYesu Krestu. Izigidi ngezigidi kwihlabathi liphela ziye zalwamkela ulwazi
  lwezi ziganeko zaziprofethiwe.
- Sibhengeza ngovuyo okokuba uBuyiselo olwaluthenjisiwe luyaqhubekela phambili ngesityhilelo esiqhubekayo.
  Umhlaba awusoze uphinde ufane kwakhona, njengoko uThixo eya “kuhlanganisela zonke izinto kuye uKrestu”
  (Kwabase-Efese 1:10).
- Ngentlonelo nangombulelo, thina njengaBapostile baKhe simema bonke ukuba bazi—njengoko nathi sisazi—ukuba
  amazulu avulekile. Siyangqina ukuba uThixo wazisa ngentando yaKhe koonyana neentombi zaKhe eziyintanda.
  Siyangqina ukuba abo bafunda benomthandazo umyalezo woBuyiselo kwaye bathabathe amanyathelo benokholo
  baya kusikelelwa ukuze bazuze ubungqina obubobabo bobukho bukaThixo kuwo nenjongo yalo ukulungiselela
  ihlabathi ukuBuya kweSibini okwakuthenjisiwe kweNkosi yethu noMsindisi wethu, uYesu Krestu.
