title: සභාවේ ඇදහිල්ලේ කරුණු
subtitle: යේසුස් ක්‍රිස්තුස්වහන්සේගේ පසුදවස් වල ශුද්ධවන්තයන්ගෙන් යුත්
author: ''
verses:
- n: 1
  text: සදාකාලික පියාණන් වන දෙවියන්වහන්සේ කෙරෙහිද, උන්වහන්සේගේ පුත්‍රයාණන් වන යේසුස් ක්‍රිස්තුස්වහන්සේ
    කෙරෙහිද, ශුද්ධාත්මයාණන්වහන්සේ කෙරෙහිද අපි විශ්වාස කරන්නෙමු.
- n: 2
  text: ආදම්ගේ වරද නිසා නොව, තම තමන්ගේ පාප නිසා, මනුෂ්‍යයින් දඬුවම් ලබන බව අපි විශ්වාස කරන්නෙමු.
- n: 3
  text: ශුභාරංචියේ අඩංගු නීති සහ නියෝගයන්ට කීකරු වීමෙන්, සියලු මනුෂ්‍ය වර්ගයාට යේසුස් ක්‍රිස්තුස්වහන්සේගේ
    වන්දිගෙවීම තුළින්, ගැලවීම ලබාගත හැකි බව අපි විශ්වාස කරන්නෙමු.
- n: 4
  text: 'ශුභාරංචියේ පළමු මූලධර්ම සහ නියෝග වන්නේ: පළමුව, ස්වාමින්වහන්සේ වූ යේසුස් ක්‍රිස්තුස්වහන්සේ කෙරෙහි
    ඇදහිල්ලද; දෙවනුව, පසුතැවිල්ලද; තුන්වෙනුව, පව් කමාව සඳහා ගිල්වීමේ බව්තීස්මයද; සතරවනුව, අත් තැබීම ශුද්ධාත්මයාණන්වහන්සේගේ
    දීමනාව ලබාදීම බවද අපි විශ්වාස කරන්නෙමු.'
- n: 5
  text: ශුභාරංචිය දේශනා කිරීමට සහ එහි අඩංගු නියෝග මෙහෙයවීම සඳහා, යම් මනුෂ්‍යයෙකු දෙවියන්වහන්සේ විසින්,
    අනාවැකි මගින්, සහ අධිකාරී බලය ඇති අය විසින් එම පුද්ගලයාගේ හිස මත දෑත් තැබීමෙන් කැඳවීමක් ලැබිය යුතුම
    බව අපි විශ්වාස කරන්නෙමු.
- n: 6
  text: ප්‍රේරිතවරු, අනාගතවක්තෘවරු, සභා පාලකයන්, ගුරුවරු, ශුභාරංචිය ප්‍රකාශ කරන්නන් සහ එවැනි අයගෙන් සමන්විත
    වූ ප්‍රාක්තම සභාව හා සමාන සංවිධානයක් අපට ඇතැයි අපි විශ්වාස කරන්නෙමු.
- n: 7
  text: අන්‍ය භාෂා කතාකිරීමේ, අනාවැකි කීමේ, එළිදරව්, දර්ශන, සුවකිරීම්, භාෂා තේරුම්කර දීම යනාදී දීමනා ගැන
    අපි විශ්වාස කරන්නෙමු.
- n: 8
  text: බයිබලය නිවැරදිව පරිවර්තනය කර තිබෙන තාක්, එය දෙවියන්වහන්සේගේ වචනය බව අපි විශ්වාස කරන්නෙමු; එසේම
    මොර්මොන්ගේ පොතද, දෙවියන්වහන්සේගේ වචනය බව අපි විශ්වාස කරන්නෙමු.
- n: 9
  text: දෙවියන්වහන්සේ විසින් එළිදරව් කරන ලද සියල්ලද, උන්වහන්සේ දැන් එළිදරව් කරන සියල්ලද, අපි විශ්වාස කරන්නෙමු,
    තවද දෙවියන්වහන්සේගේ රාජ්‍යය හා සම්බන්ධ ඉතා උතුම් හා වැදගත් දේවල් බොහොමයක් උන්වහන්සේ අනාගතයේදී එළිදරව්
    කරන බවද අපි විශ්වාස කරන්නෙමු.
- n: 10
  text: ඉශ්‍රායෙල් ජනතාව සත්‍යයෙන්ම රැස්වෙන බව සහ ගෝත්‍ර දහය නැවත පිහිටුවන බවද; එමෙන්ම සයොනය (නව යෙරුසලම)
    අමෙරිකා මහාද්වීපයෙහි ගොඩනගන බවද; එසේම ක්‍රිස්තුස්වහන්සේ පෞද්ගලිකවම පොළොවෙහි රජකම් කරන බවද; තවද, පොළොව
    අලුත් කරනු ලැබ, එය පාරාදීසයක මහිමය ලබාගන්නා බවද අපි විශ්වාස කරන්නෙමු.
- n: 11
  text: අපගේ හෘදසාක්ෂියේ අණකිරීම අනුව සර්වබලධාරී දෙවියන්වහන්සේව නමස්කාර කිරීමේ වරප්‍රසාදය අපටද, එසේම කෙබඳු
    ආකාරකින්, කොතැනකදී හෝ කිනම් දෙයක් හෝ නමස්කාර කිරීම, සියලු මනුෂ්‍යයන් සතු වරප්‍රසාදයක් බවටද අපි හිමිකම්
    කියන්නෙමු.
- n: 12
  text: රජවරු, ජනපතිවරු, පාලකයන්, සහ මහේස්ත‍්‍රාත්වරුන් යටතේ, නීතියට කීකරුව, ගෞරව කරමින්, එය අනුමත කළ
    යුතු බවද අපි විශ්වාස කරන්නෙමු.
- n: 13
  text: අවංක ලෙසද, සත්‍ය ලෙසද, පිරිසිඳුවද, කරුණාවන්තවද, ගුණගරුකවද, සියලු මිනිසුන් හට යහපත කරමින් ජීවත්වීම
    පිළිබඳ අපි විශ්වාස කරන්නෙමු; එවිට ඇත්තවශයෙන්ම, අපි පාවුල්ගේ උපදෙස් අනුව ජීවත්වන බව අපට කිව හැකිය—අපි
    සෑම දෙයක් තුළම විශ්වාස කරන්නෙමු, අපි සෑම දෙයක් තුළම බලාපොරොත්තු වන්නෙමු, අපි බොහෝ දේවල් දරා සිටියෙමු,
    එමෙන්ම සෑමදෙයක්ම දරා සිටීමට හැකිවෙතැයිද බලාපොරොත්තු වන්නෙමු. ගුණවත් වූද, ප්‍රේමනීය වූද, එමෙන්ම සම්භාවනීය
    වූ හෝ ප්‍රසංසාවට යෝග්‍ය වූ යමක් තිබේද, අපි මේ සියල්ල සොයන්නෙමු.
signature: ජෝසෆ් ස්මිත්.
