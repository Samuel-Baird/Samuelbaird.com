retrieved: '2026-11-02'
title: පවුල
subtitle: ලෝකයට ප්‍රකාශනයකි
author: යේසුස් ක්‍රිස්තුස්වහන්සේගේ පසුදවස්වල ශුද්ධවන්තයන්ගෙන් යුත් සභාවේ පළමු සභාපතිත්වය සහ ප්‍රේරිතවරුන්
  දොළොස්දෙනාගේ මන්ත්‍රණ සභාව
note: මෙම ප්‍රකාශනය, 1995 සැප්තැම්බර් 23 වන දින, යූටා, සෝල්ට් ලේක් නගරයෙහි පවත්වන ලද සහන සමිතියේ ප්‍රධාන
  රැස්වීමේදී සභාපති ගෝර්ඩන් බී. හින්ක්ලි විසින් ඔහුගේ පණිවිඩයේ කොටසක් ලෙස කියවන ලදි.
paragraphs:
- අපි, යේසුස් ක්‍රිස්තුස්වහන්සේගේ පසුදවස්වල ශුද්ධවන්තයන්ගෙන් යුත් සභාවේ පළමු සභාපතිත්වය සහ ප්‍රේරිතවරුන්
  දොළොස්දෙනාගේ මන්ත්‍රණ සභාව වශයෙන්, ගරු ගාම්භීරව ප්‍රකාශ කරන්නේ, පිරිමියෙකු සහ කාන්තාවක අතර විවාහය දෙවියන්වහන්සේගේ
  නියමයක් බවත් එමෙන්ම උන්වහන්සේගේ දරුවන්ගේ සදාකාලික දිව්‍යමය ඉරණම සඳහා මැවුම්කරුවාණන්ගේ සැලැස්මේ කේන්ද්‍රස්ථානය
  වන්නේ පවුල බවත් ය.
- සියලුම මනුෂ්‍යයන්—පිරිමි සහ ගැහැණු—දෙවියන්වහන්සේගේ ප්‍රතිරූපයෙන් මවා ඇත. සෑම කෙනෙක්ම ස්වර්ගික දෙමාපියන්ගේ
  ආදරණීය ආත්මික පුත්‍රයෙකු සහ දියණියක වන අතර, එමෙන්ම, එලෙස, සෑම කෙනෙකුටම දිව්‍යමය ස්වභාවයක් සහ ඉරණමක්
  ඇත. පුද්ගලයන්ගේ පෙර ආත්මික ජීවිතය, මෙලොව ජීවිතය සහ සදාකාලික අනන්‍යතාවය සහ අරමුණ උදෙසා ස්ත්‍රී පුරුෂ
  භාවය යනු අත්‍යාවශ්‍ය ගුණාංගයකි.
- පෙර ආත්මික ලෝකය තුළ, ආත්මික පුතුන් සහ දියණියන් දෙවියන්වහන්සේ ඔවුන්ගේ සදාකාලික පියාණන් බව දැන සිටි අතර
  උන්වහන්සේට නමස්කාර කළහ, තවද උන්වහන්සේගේ දරුවන් හට භෞතික ශරීරයක් ලබාගෙන පරිපූර්ණත්වය කරා දියුණුවීමට සහ
  අවසානයේදී සදාකාල ජීවනයේ උරුමක්කරුවන් ලෙස ඔවුන්ගේ දිව්‍යමය ඉරණම තේරුම්ගැනීමට හැකියාව ලබාදෙන උන්වහන්සේගේ
  සැලැස්ම ද පිළිගත්හ. ප්‍රීතියේ මෙම දිව්‍යමය සැලැස්ම මගින් පවුල් සබඳතාවලට සොහොනෙන් ඔබ්බට පැවතීමට හැකියාව
  ලබාදෙයි. ශුද්ධ වූ දේවමාළිගා තුළදී ලබාගත හැකි පූජනීය නියෝග සහ ගිවිසුම් මගින් පුද්ගලයන් හට දෙවියන්වහන්සේ
  වෙතට නැවත යාමටද, පවුල්වලට සදාකාලිකවම එක්වීමටද හැකියාව ලබාදෙයි.
- දෙවියන්වහන්සේ විසින් ආදම් සහ ඒවට ලබාදුන් ප්‍රථම ආඥාව, ස්වාමිපුරුෂයා සහ බිරිඳ වශයෙන් දෙමාපියන් වීමට ඔවුන්ට
  ඇති හැකියාව සමඟ සම්බන්ධ ය. දෙවියන්වහන්සේ උන්වහන්සේගේ දරුවන්ට බෝ වී වැඩිවෙමින් පොළොව පූර්ණ කිරීමට දුන්
  නියෝගය තවදුරටත් වළංගුව පවතින බවට අපි ප්‍රකාශ කරන්නෙමු. දරුවන් බිහිකිරීමේ ශුද්ධ වූ බලය, ස්වාමිපුරුෂයා
  සහ බිරිඳ ලෙස නීත්‍යානුකූලව විවාහ වූ, පුරුෂයා සහ ගැහැණිය අතර පමණක් ක්‍රියාත්මක විය යුතු බව දෙවියන්වහන්සේ
  ආඥා කර තිබෙන බව අපි තවදුරටත් ප්‍රකාශ කරන්නෙමු.
- ලෞකික ජීවිතය මැවීමේ ආකාරය දිව්‍යමය වශයෙන් නියම කර ඇති බව අපි ප්‍රකාශ කරන්නෙමු. ජීවිතයේ පවිත්‍රත්වය සහ
  දෙවියන්වහන්සේගේ සදාකාලික සැලැස්ම තුළ එයට ඇති වැදගත්කම ගැනද අපි තහවුරු කරන්නෙමු.
- ස්වාමිපුරුෂයාට සහ භාර්යාවට ඔවුන් එකිනෙකාට මෙන්ම ඔවුන්ගේ දරුවන්ට ආදරය කිරීමට සහ සැලකිලිමත් වීමට උදාර
  වගකීමක් තිබේ. “දරුවෝ ස්වාමින්වහන්සේ දෙන උරුමයක් ය” (ගීතාවලිය 127:3). සිය දරුවන්ව ආදරයෙන් සහ ධර්මිෂ්ඨව
  ඇති දැඩි කිරීමටත්, ඔවුන්ගේ ශාරීරික සහ අධ්‍යාත්මික අවශ්‍යතාවයන් සැපයීමටත්, එමෙන්ම එකිනෙකාට ආදරය කරමින්
  සේවය කිරීමටද, දෙවියන්වහන්සේගේ ආඥානියෝග පිළිපැදීමට සහ ඔවුන් කොතැනක සිටියත් නීතිගරුක පුරවැසියන් වීමටද
  ඔවුන්ට ඉගැන්වීමටත් දෙමාපියන්ට පූජනීය වගකීමක් ඇත. ස්වාමිපුරුෂයින් සහ භාර්යාවන්—මවුවරුන් සහ පියවරුන්—මෙම
  වගකීම් ඉටුකිරීම සඳහා දෙවියන්වහන්සේ ඉදිරියේ වගකීමෙන් බැඳී සිටිති.
- පවුල දෙවියන්වහන්සේ විසින් නියම කරන ලද්දකි. පිරිමියා සහ ගැහැණිය අතර විවාහය උන්වහන්සේගේ සදාකාලික සැලසුමේ
  වැදගත් අංගයකි. විවාහයේ බැඳීම තුළ ඉපදීමට සහ විවාහ ගිවිසුම්වලට සම්පූර්ණ අවංකභාවයකින් යුතුව ගෞරව කරන පියෙකු
  සහ මවකගෙන් ඇතිදැඩි වීමට දරුවන්ට අයිතියක් ඇත. පවුල් ජීවිතයේ සතුට බොහෝ විට ලඟා කරගැනීමට හැකියාව ලැබෙන්නේ
  එය ස්වාමින් වූ යේසුස් ක්‍රිස්තුස්වහන්සේගේ ඉගැන්වීම් මත ගොඩනගාගත් විටය. සාර්ථක විවාහයන් සහ පවුල් ගොඩනගාගෙන
  පවත්වාගත හැක්කේ, ඇදහිල්ල, යාච්ඤාව, පසුතැවීම, සමාව දීම, ගරු කිරීම, ආදරය, දයානුකම්පාව, වෙහෙස වී වැඩ කිරීම
  සහ යහපත් විනෝදාත්මක ක්‍රියාකාරකම් යන මූලධර්මයන් මතය. දිව්‍යමය සැලස්මට අනුව, පියවරුන් ආදරයෙන් සහ ධර්මිෂ්ඨව
  ඔවුන්ගේ පවුල්වල මූලිකත්වය දරමින්, ජීවිතයේ අවශ්‍යතාවයන් සහ ඔවුන්ගේ පවුල්වලට ආරක්ෂාව ලබාදීමේ වගකීම දරති.
  මවුවරුන් මූලිකවම ඔවුන්ගේ දරුවන්ගේ පෝෂණය පිළිබඳ වගකීම දරති. මෙම පූජනීය වගකීම්වලදී, පියවරුන් සහ මවුවරුන්
  සම සහකරුවන් ලෙස එකිනෙකාට සහය වීමට බැඳී සිටිති. ආබාධිත වීම, මරණයට පත්වීම හෝ එවන් වෙනත් තත්වයන් මත මෙම
  වගකීම් අනුගත කරගැනීම අවශ්‍ය විය හැකිය. අවශ්‍ය විටදී පවුලේ ඥාතීන් විසින් සහය ලබාදිය යුතුය.
- පවිත්‍රබවේ ගිවිසුම් කඩකරන, කලත්‍රයාට හෝ දරුවන්ට හිරිහැර කරන හෝ පවුල් වගකීම පැහැර හරින පුද්ගලයන් යම්
  දිනෙක දෙවියන්වහන්සේ ඉදිරියේ වගකිව යුතු බවට අපි අනතුරු අඟවන්නෙමු. තවදුරටත්, පවුලක් කඩා බිඳ දැමීම මගින්
  පුද්ගලයන්ට, සමාජයන්ට, සහ ජාතීන්ට, පුරාණ සහ නූතන අනාගතවක්තෘවරුන් පවසා ඇති අනාවැකි පරිදි මහත් විපත්ති
  ගෙන එන බවද අපි තවදුරටත් අනතුරු අඟවන්නෙමු.
- සමාජයේ මූලික ඒකකය වන පවුල පවත්වාගෙන ශක්තිමත් කිරීමට සැලසුම් කර ඇති ක්‍රියාදාමයන් දියුණු කරන ලෙස අපි
  වගකිව යුතු පුරවැසියන්ගෙන් සහ රජයේ නිලධාරීන්ගෙන් ඉල්ලා සිටින්නෙමු.
