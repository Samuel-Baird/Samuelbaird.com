title: Mhuri
subtitle: Chiziviso kuNyika
author: Vatungamiri Vokutanga neDare raVaApositora Vane Gumi naVaviri veChechi yaJesu Kristu yaVatendi
  vaMazuva Ekupedzisira
note: Chiziviso ichi chakaverengwa naMutungamiri Gordon B. Hickley sechikamu cheshoko ravo paMusangano
  Mukuru weChita cheRubatsiro wakaitwa musi waGunyana 23, 1995 muSalt Lake City, Utah.
paragraphs:
- Isu, Vatungamiri Vokutanga neDare raVaApositora Vane Gumi neVaviri veChechi yaJesu Kristu yaVatendi
  vaMazuva Ekupedzisira, tinozivisa pamutemo uye norukudzo kuti muchato pakati pemurume nemudzimai wakagadzwa
  naMwari uye kuti mhuri yakakosha zvikurusa kuchirongwa choMusiki chemagumo okusingaperi avana Vavo.
- Vanhu vose—vanhurume nevanhukadzi—vakasikwa nemufananidzo waMwari. Mumwe nomumwe mwanakomana kana mwanasikana
  wemweya anodiwa wavabereki vokudenga, uye, nokudaro, mumwe nomumwe ane hunhu hwehumwari uye nekwaniso
  yohumwari. Kuva munhurume kana munhukadzi chimiro chakakosha zvikuru pakuzivikanwa uye pachinangwa chomunhu
  pachake muupenyu asati azvarwa panyika, muupenyu hunofa hwapanyika uye muupenyu hwokusingaperi.
- Muupenyu vasati vazvarwa panyika, vanakomana nevanasikana vemweya vaiziva uye vainamata Mwari saBaba
  vavo Vokusingaperi uye vakagamuchira chirongwa Chavo icho kuburikidza nacho vana Vavo vaizokwanisa kuwana
  muviri wenyama uye nekuwana ruzivo rwapanyika kuitira kuti vagofambira mberi vakananga kuururami uye
  pokupedzisira vagowana magumo avo ehumwari sevagari venhaka yeupenyu hwokusingaperi. Chirongwa chomufaro
  chohumwari chinoita kuti hukama hwemhuri hwukanise kuenderera mberi mushure mokufa. Zvisungo nezvibvumirano
  zvinoera izvo zvinowanikwa mumatemberi matsvene zvinoita kuti vanhu pachavo vakwanise kudzokera pamberi
  paMwari uye kuti mhuri dzibatanidzwe nokusingaperi.
- Murairo wekutanga uyo Mwari wavakapa kuna Adama naEva waiva maererano nekwaniso yavo yokuva vabereki
  semurume nomukadzi. Tinozivisa pachena kuti murairo waMwari wokuti vana Vavo vabereke, vawande uye vazadze
  nyika uchiripo. Tinozivisa pachena zvakare kuti Mwari vakaraira kuti masimba anoera okusika vana anofanira
  kushandiswa chete pakati pomurume nomudzimai, vakachata zviri pamutemo somurume nomukadzi.
- Tinozivisa pachena kuti nzira iyo upenyu hunofa yahunosikwa nayo yakamiswa nohumwari. Tinosimbisa utsvene
  hweupenyu uye kukosha kwahwo muchirongwa chokusingaperi chaMwari.
- Murume nomukadzi vane basa rakakomba uye rinoera rokuda nokuriritira mumwe nomumwe wavo uye nevana vavo.
  “Vana inhaka inobva kuna Ishe” (Mapisarema 127:3). Vabereki vane basa rinoera rekurera vana vavo murudo
  nomuururami, kuvapa zvidikanwi zvavo zvapanyama nezvapamweya, uye kuvadzidzisa kudanana uye nokushandirana,
  kucherechedza mirairo yaMwari, uye kuva vagari vemunyika vanoteerera mitemo kupi zvako kwavanogara.
  Varume navakadzi—vanaamai namadzibaba—vachazonofanira kuzvidavirira pamberi paMwari maererano nokuzadzikiswa
  kwamabasa iwayo.
- Mhuri yakagadzwa naMwari. Muchato pakati pemurume nomudzimai wakakosha zvikurusa kuchirongwa chokusingaperi
  Chavo. Vana vane kodzero yokuzvarwa muukama hwomuchato, uye kurerwa nababa naamai vanoremekedza mhiko
  dzemuchato noruvimbiko rwakazara. Mufaro muupenyu hwemhuri unonyanya kubudirirwa pauri apo paunenge
  wakamisirwa padzidziso dzaIshe Jesu Kristu. Michato uye nemhuri zvinobudirira zvinomiswa uye nokuchengetedzwa
  pamisimboti yorutendo, munamato, rutendeuko, ruregerero, rukudzo, rudo, mutsa, basa, nezviitwa zvokutandara
  zvakanaka. Kuburikidza nohurongwa hwehumwari, vana baba vanofanira kutungamirira mhuri dzavo murudo
  neururami uye vane basa rokupa zvidikanwi zvoupenyu uye nedziviriro kumhuri dzavo. Vanaamai basa ravo
  guru nderokurera vana vavo. Mumabasa anoera aya, vanababa navanaamai vanosungirwa kubatsirana savaviri
  vanoshanda pamwechete zvakaenzana. Urema, rufu namamwe mamiriro ezvinhu zvinokwanisa kuita kuti shanduro
  ifanire kuvapo pamubereki anoita mabasa aya mune dzimwe mhuri. Hama dzinofanira kubatsira apo pazvinenge
  zvichidikanwa.
- Tinoyambira kuti vanhu vanotyora zvibvumirano zvemutemo wokuzvibata, avo vanoshusha murume kana mukadzi
  wavo kana vana vavo, kana vanotadza kuzadzikisa mabasa emumhuri nerimwe zuva vanozomira kuti vazvidavirire
  pamberi paMwari. Zvakare, tinoyambira kuti kuparara kwemhuri kunozounza kuvanhu pachavo, kunzanga, uye
  kunyika matambudziko makuru ayo akafanotaurwa nezvawo navaporofita vechinyakare uye navanhasi.
- Tinokoka vagari vemunyika navashandi vehurumende kwese kwese vakavimbika kuti vakurudzire zvirongwa
  izvo zvakagadzirirwa kuchengetedza nokusimbisa mhuri sechikamu chakakoshesesa chevanhu.
