slug: restoration
language: sna
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=sna
retrieved: '2026-11-02'
title: Kudzorerwa kweKuzara kweVhangeri raJesu Kristu
subtitle: Chiziviso kuNyika cheMhemberero yeMakore Mazana Maviri
author: Vatungamiri Vokutanga uye Dare raVaApositora vane Gumi naVaviri veChechi yaJesu Kristu yaVatendi
  vaMazuva Ekupedzisira
note: Chiziviso ichi chakaverengwa naMutungamiri Russell M. Nelson sechikamu cheshoko ravo paMusangano
  Mukuru weGore Roga Roga wechizana namakumi mapfumbamwe, Kubvumbi 5, 2020, muSalt Lake City, Utah.
paragraphs:
- Tinozivisa norukudzo kuti Mwari vanoda vana Vavo mundudzi dzose dzapanyika. Mwari Baba vakatipa kuzvarwa
  kwehumwari, upenyu husingaenzaniswi, uye kuzvipira kwerudzikinuro rwomunhu wose kweMwanakomana Anodiwa
  Wavo, Jesu Kristu. Kuburikidza nesimba raBaba, Jesu akamuka zvakare uye akawana rukundo pamusoro porufu.
  Ndiye Muponesi wedu, Muenzaniso wedu, uye Mununuri wedu.
- Makore makumi maviri akapfuura ayo, pamangwanani emuchirimo akanaka muna 1820, Joseph Smith muduku,
  achitsvaka kuziva kuti wopinda chechi ipi, akaenda musango kunonamata pedyo nemusha wake nechokuchamhembe
  kwedunhu reNew York, USA. Akanga aine mibvunzo maererano noruponeso rwomweya wake uye aivimba kuti Mwari
  vaizomutungamira.
- Mukuzvininipisa, tinozivisa pachena kuti mumhinduro kuminamato yake, Mwari Baba uye Mwanakomana Wavo,
  Jesu Kristu vakazviratidza kuna Joseph uye vakavamba “kudzorerwa kwezvinhu zvose” (Mabasa aVaApositora
  3:21) sokufanotaurwa kwazvaiva zvaitwa muBhaibheri. Muchiratidzo ichi, akadzidza kuti mushure mokufa
  kwavaApositora vokutanga, Chechi yaKristu yeTestamente Itsva yakarasika kubva panyika. Joseph aizova
  mudziyo wakakosha zvikuru mukudzoka kwayo.
- Tinosimbisa kuti pasi pohutungamiri hwaBaba neMwanakomana, vatumwa vokudenga vakauya kuzoraira Joseph
  uye nokumisazve Chechi yaJesu Kristu. Johane Mubhabhatidzi uyo aiva amuka kuvakafa akadzorera mvumo
  yokubhabhatidza nokunyudza munhu zvakazara kuitira ruregerero rwezvivi. Vatatu vaVaApositora vane gumi
  navaviri vokutanga—Petro, Jakobo, naJohane—vakadzorera huapositora uye makii emvumo yehupirisita. Vamwe
  vakauyawo, kusanganisira Eria, uyo akadzorera mvumo yokubatanidza mhuri pamwechete nariinhi nariinhi
  muhukama hwokusingaperi uhwo hwunoenderera kudarika rufu.
- 'Tinopupura zvakare kuti Joseph Smith akapuwa chipo uye simba raMwari kuti adudzire rondedzero yechinyakare:
  Bhuku raMormoni—Imwe Testamente yaJesu Kristu. Mapeji echinyorwa chinoyera ichi anosanganisira tsananguro
  yehushumiri hwaJesu Kristu pachake pakati pavanhu muNyika dzoKumadokero chinguva chidiki mushure moKumuka
  Kuvakafa Kwake. Rinodzidzisa nezve chinangwa choupenyu uye rinotsanangura dzidziso yaKristu, iyo yakakosha
  zvikurusa kuchinangwa ichocho. Segwaro dzvene rinofambirana neBhaibheri, Bhuku raMormoni rinopupura
  kuti vanhu vose vanakomana navanasikana vaBaba Vokudenga vane rudo, kuti Vane chirongwa chohumwari choupenyu
  hwedu, uye kuti Mwanakomana Wavo, Jesu Kristu, anotaura nhasi nenzira imwecheteyo yaaiita mumazuva echinyakare.'
- Tinozivisa pachena kuti Chechi yaJesu Kristu yaVatendi vaMazuva Ekupedzisira, iyo yakarongwa pamusi
  waKubvumbi 6, 1930, ndiyo Chechi yakadzorerwa yaKristu yeTestamente Itsva. Chechi iyi yakamisirwa zvakasimba
  muupenyu hwakarurama hweibwe rapakona gurusa, Jesu Kristu, uye muRudzikinuro Rwake rwomunhu wose uye
  muKumuka Kuvakafa Kwake chaiko. Jesu Kristu zvakare akadaidza vaApositora uye akavapa mvumo yohupisirita.
  Anokoka isu tose kuti tiuye kwaAri uye kuChechi Yake, kuti tizogamuchira Mweya Mutsvene, zvisungo zveruponeso,
  uye kuzowana mufaro unoenderera kwenguva refu.
- Makore mazana maviri zvino akapfuura kubvira apo Kudzorerwa uku pakwakatangwa naMwari Baba uye noMwanakomana
  Anodiwa Wavo, Jesu Kristu. Mamiriyoni napanyika pose akagamuchira ruzivo rwezviitiko zvakaporofitwa
  izvi.
- Tinozivisa pachena nomufaro kuti Kudzorerwa kwakavimbiswa kunoenderera mberi kuburikidza nezvakazarurwa
  zvinoenderera mberi. Pasi hapazombofi pakava sezvapaiva pari kare zvakare, nokuti Mwari “vanozounganidza
  pamwechete zvinhu zvose muna Kristu” (VaEfeso 1:10).
- Noruremekedzo uye nokuvonga, isu savaApositora Vavo tinokoka vose kuti vazive—samaziviro atinoita—kuti
  matenga akavhurika. Tinosimbisa kuti Mwari vari kuzivisa chido Chavo chavanakomana navanasikana vanodiwa
  Vavo. Tinopupura kuti avo vanonzvera nomunamato shoko roKudzorerwa uye voita zvinhu murutendo vanozoropafadzwa
  kuwana uchapupu hwavo pachavo hwehumwari hwaro uye hwechinangwa charo chokugadzirira nyika Kuuya kweChipiri
  kwakavimbiswa kwaIshe neMuponesi wedu, Jesu Kristu.
