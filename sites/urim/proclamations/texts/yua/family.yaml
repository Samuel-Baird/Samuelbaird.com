title: Le Láakʼtsilil
subtitle: Tsʼáaj Ojéetbil utiaʼal Yóokʼolkab
author: Le Yáax Noj Poolil yéetel U Múuchʼil le Kaʼalajun Apostoloʼob tiʼ U Najil Jesucristo tiʼ le Maʼalob
  Wíinikoʼob tiʼ le Tsʼook Kʼiinoʼob
note: Le noj pool Gordon B. Hinckley tu xokáaj le tsʼáaj ojéetbilaʼ tiʼ u chuukil u tʼaan tiʼ Múuchʼtalil
  tiʼ Tuláakal u Láakʼiloʼob Áantaj, yaanchaj tiʼ 23 tiʼ bolon wiʼinal tiʼ 1995 teʼ Salt Lake City, Utah,
  teʼ EE. UU.
paragraphs:
- Toʼoneʼ, Le Yáax Noj Poolil yéetel U Múuchʼil le Kaʼalajun Apostoloʼob tiʼ U Najil Jesucristo tiʼ le
  Maʼalob Wíinikoʼob tiʼ le Tsʼook Kʼiinoʼob, jach kik tsʼáaik ojéetbil le tsʼoʼokobel tiʼ xíib yéetel
  chʼuup tsʼáajaʼan tuméen Yuumtsil, le láakʼtsilil xanoʼ kʼanaʼan utiaʼal u tuukul le Aj Makʼantajoʼ
  utiaʼal le kuxtalil minaʼan u xuul tiʼ U paalaloʼob.
- Tuláakal wíinik, wa xíib wa chʼuup, makʼantaʼanoʼob jeʼel bix bey Yuumtsil. Jujuntúulil paalal yaabiltaʼan
  yéetel makʼantaʼan bey pixanoʼob tuméen jkaʼanil yuumoʼob, le beetikeʼ jujuntúuleʼ yaan u kʼujul chúun
  chʼiʼibal yéetel u kʼujul xuul kuxtalil. Wa xíib, wa chʼuupeʼ, ku yeʼesik u noy u yoochel, beyxan tiʼ
  u tuukul kaʼalikil le kuxtalaʼ, tiʼ le kʼiin kuxtalaʼ yéetel tiʼ u kuxtalil xmaʼ kíimil tiʼ wíinik.
- Teʼ kúuchil kaʼalikil síijiloʼ, paalaloʼoboʼ makʼantaʼan bey pixanoʼobeʼ, tu kʼajóoltoʼob Yuumtsil kaʼ
  tu kʼultoʼob bey u Taataʼob Minaʼan u Xuuleʼ, kaʼ tu kʼamoʼob u tuukul yoʼosak beyoʼ U paalaloʼobeʼ
  jeʼel u beytal u yaantal tiʼob jumpʼéel wíinkilileʼ, yéetel u yantal u náajalil u kuxtal utiaʼal u bin
  táanil utiaʼal u jach tojtaloʼob, ken tsʼoʼokok u náajmaltikoʼob u kʼujul xuul utiaʼal u kʼamkoʼob le
  kuxtal minaʼan u xuuloʼ. Le kʼujul tuukul tiʼ kiʼimak óolaloʼ ku chaʼaik le láakʼtsilil kuxtalil ku
  beytal kaʼ yanak ku bin kʼiin kex kíimik. Le kʼuyel tsolmeyajoʼob yéetel le núuptʼaanoʼob yaan teʼ noj
  templo ku beykunsik u kaʼ suutoʼob tu táan Yuumtsil yéetel u yaantal núupʼil tiʼ le láakʼtsilil tiichʼkʼiin.
- Le yáax túuxtalil tu tsʼáaj Yuumtsil tiʼ Adan yéetel Evaeʼ, ku tsaytal yéetel u páajtalil kaʼ beyak
  u yantal u paalaloʼob bey íichantsil yéetel atantsil. Ik aʼalik u túuxtalil Yuumtsil utiaʼal U paalaloʼob
  kaʼ yáabchajkoʼob yéetel kaʼ u chupoʼob le luʼumoʼ layliʼ yanikeʼ. Ik aʼalik xaneʼ Yuumtsileʼ tu túuxtal
  le kʼuyel páajtaliloʼob u yantal paalaloʼoboʼ kʼaʼanan u yúuchul chéen tiʼ xíib yéetel chʼuup jach tsʼokaʼan
  u beeloʼob bey íichantsil yéetel atantsil.
- Ik aʼalik bix u taal le kuxtalil yóokʼolkabaʼ tsʼáajaʼan bey kʼujuliʼ. Kik jaajkuntik le kuxtaloʼ kʼujul
  yéetel u páaybeʼenil tiʼ u tuukul minaʼan u xuul Yuumtsil.
- Le íichantsil yéetel le atantsiloʼ yaan u noj kuuch u yáabiltkubaʼob yéetel u kanáantkubaʼob, bey xan
  u paalaloʼob. Le paalaloʼoboʼ u síibal Yuumtsil (Xookeʼex Salmo 127:3). Le taatatsiloʼoboʼ yaan u kʼuyel
  kuuchoʼob u tséentik u paalaloʼob yéetel yaakunaj yéetel toojil, u tsʼáaik tuláakal baʼax kʼanaʼan utiaʼal
  u wíinkililoʼob yéetel u pixanoʼob, yéetel u kaʼansiktiʼob u yaakuntkubaʼob yéetel u yáantikubaʼob ichiloʼob,
  u beetoʼob u túuxtʼaanoʼob Yuumtsil yéetel kaʼ u yuʼuboʼob le aʼalmajtʼaanoʼob jeʼel tuʼux kaʼ kaajlakoʼobeʼ.
  Le íichantsil yéetel le atantsiloʼ, le taatatsil bey le naʼatsiloʼ, yaan tiʼob u kuuchil tu táan Yuumtsil
  u beetaʼal le baʼaloʼobaʼ.
- Le láakʼtsilil tsʼáajaʼan tuméen Yuumtsil. Le núupul ichil xíib yéetel chʼuup kʼanaʼan utiaʼal U tuukul
  minaʼan u xuul. Le paalaloʼoboʼ kʼabéet u síijiloʼob ichil le núupul tsʼoʼokaʼan u beeloʼoboʼ yéetel
  u tséentaʼaloʼob tuméen u taatáa yéetel u naʼ bey uts kajaʼaniloʼobeʼ yéetel uts u biskubaʼob. Le kiʼimak
  óolal kuxtalil ichil le láakʼtsililoʼ yaan u bin maʼalob tiʼob wa ku yuʼubikoʼob U kaʼansajil Kʼuj Jesucristo.
  Le núupuloʼob yéetel le láakʼtsilil ku bin maʼalob tiʼoboʼ ku jetsʼtaloʼob yéetel ku yantaloʼob yóokʼol
  u chuunil oksajóolal, le payalchiʼoʼ, le yajóolaloʼ, le saʼasiloʼ, le chíimpoloʼ, le yaakunajoʼ, le
  chʼaʼootsililoʼ, le meyaj yéetel utsil baaxaloʼoboʼ. Túuxtaʼan kʼujuliʼ, le taataoʼ ku pooltik u láakʼtsilil
  yéetel yáabil, toojil. U kaʼakaʼaj xan u tsʼáaik le baʼaloʼob kʼabéet utiaʼal u kuxtal u láakʼtsilil
  yéetel u kanáantej. Le naʼoʼ u kuucheʼ u kanáantik yéetel u tséentik u paalaloʼob. Tiʼ le kʼuyel kuuchiloʼobaʼ,
  le taataoʼ yéetel le naʼoʼ bey paaklan núupuloʼobeʼ, kʼanaʼan u yáantikubaʼob ichiloʼob. Le maʼ páajtalil,
  le kíimilil, wa u láakʼ maʼ maʼalobileʼ kʼabéet u kaanik kuxtal yoʼosak le baʼaloʼobaʼ. U láakʼ laákʼtsiloʼobeʼ
  kʼabéet u yáantikubaʼob wa kʼanaʼan.
- Kik aʼalik le máaxoʼob ku kʼaaskuntik le cheʼenil núuptʼaanoʼob yéetel ku beetik núupkʼebaneʼ, wa ku
  loobiltik u núupul wa u paalaloʼobeʼ, wa maʼ ku tsʼáaik baʼax kʼaʼanaʼan tiʼ u láakʼtsilileʼ, yaan u
  kʼuchul u kʼiinil u tsolik tu táan Yuumtsil. Bey xan, kik aʼalikeʼ le maʼ u bin utsil tiʼ láakʼtsililoʼ
  ku taasik le toopiloʼob yóokʼol wíinikoʼob, le kaajoʼob yéetel le múuchʼ kaajoʼoboʼ, jeʼel bix aʼalaʼan
  tuméen le úuchben yéetel le túumben aj bóobatoʼoboʼ.
- Kik kʼáatik teʼ wíinikoʼob wéet kaajaliloʼob yaan tiʼob maʼalob óolaloʼ yéetel le pooliloʼob tiʼ tuláakal
  tuʼux kaajalil, utiaʼal u beetikoʼob tuláakal baʼax kʼaʼanaʼan utiaʼal u yantal mukʼóolalil tiʼ láakʼtsilil
  yéetel u jetsʼtal bey u chúun le wéet kaajaloʼoboʼ.
