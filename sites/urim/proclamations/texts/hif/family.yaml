title: Parivaar
subtitle: Duniya mein Susamachaar ki Ek Aupchaarik Ghoshna
author: ''
note: Yeh ghoshna Pradhaan Gordon B. Hinckley dwara padhi gayi thi Maha Sahayak Sanstha Sabha jo September
  23, 1995, Salt Lake City, Utah mein jo unke sandesh ka ek bhaag tha.
paragraphs:
- Hum, Pratham Adhyakshta aur Barah Purohiton ke Parishad Ishu Masiha ka Girjaghar Antim-dinon ke Santon
  ka, aupchaarik aur pavitra rup se aupchaarik ghoshna karte hain ki purush aur aurat ke beech vivah Ishwar
  ki niyukti hay aur parivaar avashyak hay Shrishtikarta ke yojna ke anusaar taaki anant manzil ki praapti
  ho unke bachchon ko.
- Sabhi maanav—purush aur aurat—Ishwar ki chaaya mein banaae gaye hain. Har ek aatmic putra ya putri swargiye
  pita-maata ke liye priye hay, aur, isi kaaran, har ek ke paas Ishwariye gun ya swabhav hay aur Ishwariye
  kismet. Purush ya Aurat avashyak visheshta hay vyakti ke maranshil se pahle, maranshil aur anant jivan
  ki pahchaan aur prayojan ke liye.
- Maranshil jeevan mein, aatmik putra aur putriyaan jaante the aur Ishwar ki upaasna karte the apne Swargiye
  Pita ki tarah aur unki yojna ko swikaar karte the jisse, unke bachche maanav jiwan praapt karein aur
  prithvi ke anubhav praapt karein taaki pragati kar sakein purti ke liye aur ant mein apne Ishwariye
  bhaagye ya kismat praapt kar sakein anant jiwan ke raajye ke liye. Kushiyaali ki divye yojna paarivaarik
  sambandhon ko mrityu ke baad bhi kaayam rakhti hay. Pavitra dharamvidhiyaan aur vaade jo pavitra mandiron
  se uplabdh hain logon ke liye sambhav kar dete hain Ishwar ke samaksh lautne ke liye aur parivaaron
  ko anant rup se ektaa me laate hain.
- Ishwar ne Adam aur Hauwa ko pratham adesh jo diya tha woh tha unke pati-patni hote hue maata-pita banne
  ki chamta. Hum ghoshna karte hain ki Ishwar ke adesh unke bachchon ke liye ki unki sankhya badhe aur
  bharpur rahe prithvi par aaj bhi laagu hain. Hum aur bhi yah ghoshna karte hain ki Ishwar ki pavitra
  shaktiyaan ki rachna sirf purush aur aurat ko di jaati hay, jo kaanooni rup se vivaah karein pati aur
  patni ki tarah.
- Hum ghoshit karte hain ki kis tarah se prithvi par maranshil jiwan ki shrishti ki jaati hay woh Ishwar
  ke nirdesh dwara hay. Hum pushti karte hain ki jiwan pavitra hay aur Ishwar ki anant yojna mein mahatva
  rakhta hay.
- Pati aur Patni ke paas pavitra zimmedaari hay pyaar karne ki, ek doosre ki dekhbhaal ki aur unke bachchon
  ke liye. “Bachchen Ishwar ke viraasat hain” (Psalm 127:3). Maata-pita ke paas pavitra kartavye hay apne
  bachchon ki parvarish karein pyaar aur imaandaari se, unke shaaririk aur aatmik zarooraton ke liye pradaan
  karna, unhein sikhlaaye ek doosre se pyaar karein aur ek doosre ki sewa karein, Ishwar ke adeshon ka
  aadar karein, desh ke kaanoonon ka adar karne waale naagrik banein chahe jahan bhi woh rahein. Pati
  aur patniyaan—maata aur pita—Ishwar ke samaksh uttardayi rahenge in zimmedaariyon ki purti karne mein..
- Parivaar Ishwar dwara niyukt kiye jaate hain. Uski anant yojna ke liye purush aur mahila ke beech viwaah
  avashyak hay. Bachchon ka adhikaar hay ki woh vivaahit maata-pita se janam le, aur un maata-pita dwara
  unki parvarish ho jo vivaah ke vaadon ko pure vishwaas se maane aur paalan karein. Khushiyaan paarivaarik
  jiwan mein tab praapt ho sakti hay jab Ishu Masiha ke sikh par aadhaarit ho. Kaamyaab vivaah aur parivaar
  ki sthaapna vishwaas ke siddhaant, prarthna, pashchataap, maafi, aadar, pyaar, daya, karma, aur pure
  manoranjan sambandhi gatvidhiyaan par nirbhar hay. Ishwar ki yojna dwara, pita apne parivaaron mein
  pyaar aur imaandaari se adhyakshta karein aur apne parivaaron ke jiwan ke avashyak cheezon ko pradaan
  karne aur unki raksha karne ke liye zimmedaar hay. Maataen khaaskar bachchon ke paalan-poshan ke liye
  zimmedaar rahti hain. In pavitra zimmedaariyon mein, pita aur maata ek dusre ki madad karte hain barabar
  ke zimmedaariyaan hain dono ki. Ayogyata, maut, ya anye stithiyaan yeh avashyak kar sakti hay ki woh
  in bhumikaaon ko badal kar parivaar ki dekhbhaal karein. Parivaar ke anye sadasye ko madad karni chahiye
  jab avashyak ho.
- Hum un vyaktiyon ko chetaaoni dete hain jo naytik shuddhtta ke vaadon ko bhang karte hain, jo apne saathiyon
  aur bachchon par atyachaar karte hain, ya jo parivaar ki zarooraton ki purti karne mein asafal ho jaate
  hain ek din Ishwar ke samaksh utardaayi rahenge. Aur, chetaaoni di jaati hay ki jo vyakti, samaaj, ya
  desh parivaar ko todenge unpar bahut musibatein ayengi jo prachin aur aaj ke bhavishyevaktaaon dwara
  batae gaye hain.
- Hum un sabhi zimmedaar naagrik aur sarkaar ke afsaron se kehte hain ki logon se un cheezon ko karne
  ko kaho jisse parivaar ko kaayam aur majboot rakha ja sake samaaj ke mul ang bana kar.
