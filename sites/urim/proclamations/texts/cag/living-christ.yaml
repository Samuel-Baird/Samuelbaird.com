title: Cristo Mônlha
subtitle: Ca taʼnôĉlitesh capi vatʼeyĵatsĵanĵas
author: ''
paragraphs:
- Ti yaychavalhchʼe pa lhavaatĵayash pa Jesucristo ti 2000 chʼe pava yinĉopes. Na ĵaniyiteshelh ti jatônôĉlitshelh
  yivaʼachshelh ti lhech yijoquʼe, ômpa ĉa lhjunashajulh shi ti lhech yivoʼyeshchʼe nintʼos shane ti uĵ
  ti vatĉloyitʼapeʼe joʼom. Ômpa ĉa elhchaʼa nivaĉle ĉa nasnatesh na yaychavalhey ti yaʼash ti toĵeyshi
  yômʼapeʼe pan tʼajôʼôj papi vatvaneʼelh shi ĵayu shta papi nijoʼoylha yiʼe na cotsĵaʼat.
- Pa lhech lhapesh uĵ jaʼam Jehova yiʼshi nava vatjutsa vatasinoĉ lhey shta Mesias yiʼshi shta naʼ nichʼa
  vatasino yiʼshicham cʼoya pa lhtata. Pa lhech yivĉlanĵat na cotsĵaʼat. “Lhaĉomʼa nava matas tôʼlha pa
  lhech ti yivĉlanĵat, ĉa ôma lhon pa lhech tanĉa navĉlan taĵ nava vaĉlan” (ovalhelhei Juan 1:3). lhaʼma
  ti ômpa lhsaschʼea, chiynaĵayan ĉa ĵaspa nomʼapeʼ na yivoʼyeshchʼe. Pa lhech tʼotayesh na yivoʼyeshchʼe”
  (ovalhelhei Hechos 10:38), taĵ ti monlheʼesh nitjuʼyesh pa chitʼajuyeshjulh. Na lhayôjiĵat tasinoyesh
  pa vatpiʼiyash pa yivoʼyeshchʼe tʼefenĵayash. Pa lhech vatantsaĉlansha lhaĉômʼô papu ca nivoʼojquʼe
  can lhfanishlhavach. Tifeshʼe lhnôyshay ca Palestina; yilhĵenshaʼne capi ôʼôytesʼin nôqueʼe capi taĉluĵuy
  yovalhĵatvatshamʼin, yinenĵachishamchʼe shta capi vafshaʼne, vanq̂ʼeyĵatsĵanesh nava nintʼôsshane ti
  ĵôjiclay shtavatvaneshelh na casmônlhaĵayash. Na yaychavalhey joom ĉasmonlhaĵayashʼe na costsĵaʼat shi
  ĉa chiniyitsĵat napi vataĉles yitsjôy, ôĉĵeclôy na nichʼa vatmonlhaĵayash ti vaĉlan tôlhey pa Dios.
- Yivĉlanĵat joʼom ca lhasnoyech vatsaĉcunĵayash ĵaspa shtaychavalheshchʼe ti vatĉloyit, vatjutjoʼom,
  chitʼacumʼe vatam, pa chiychaʼaĵ chiynôlhjanchatesh pa ĉa natmeneshlhavach ĉa ĵaspa ĉoʼoseʼem papi aĉloĵ,
  pa chiyetôna ĉa chinĉlon ĉa chineshchisham lhpa cruz yiʼe pa vatcômclavat pa lhech yijut pa lhamônlhaĵayash
  ti vatĉloyitem pava lhsaschʼeshane na tʼajoj napi nivaĉle. Na chi natsoʼotĵatesh uĵjaʼam ti atsʼôtesh
  ti nôcôyôĵey pa lhech pa lhacômʼa napi yiʼe na cotsjaʼat.
- Nasheʼesh ti shtatônôĉlitesh ca lhamonlhaĵayash ti lhtatsuquʼesh lhech tôlhʼeshicham ti chiychayeshchʼe
  cʼôya napi nivaĉle tanĉa nitôʼlheshʼe Belen ni lhecheʼesh shta ĉa nivôʼômji ti yiey ca vatĉomĉlovat.
  Pa lhech vatjutsa ti nivatʼaĵ tôlhey pa lhtata velha lhôʼôs ti ĉaʼaĵ pa lhavuvat vanĉavoyĵatvatichʼe
  yisĉlanvatichʼe nan tucʼaʼe na cotsĵatiyish.
- Pa lhech nechshaʼam ti tôlhcheʼ pa nivalhech, vatjutsaʼesh cʼoya papʼelh ĵôjiĉlay yimôquʼeshane (ovalhelhei
  1 Corintios 15:20). Nan lhjunash pa lhĉaʼanvaĉle nechshaʼam tʼôtaʼayshi papi lhech papi ôpis ti yijutem
  pa lhencheyash ti monlha. Pa yisĉlanvatichʼe shta pavʼelhcha lhclôy tashinshtas (ovalhelhei Juan 10:16)
  yiʼe pa vatjutsa vatsitenĵavat. Na nichʼa chiyʼeshi pa lhech, shi pa lhtata tanoĉlitem pa nichʼayech
  Jose Smith, ti lhech tolheshʼe na pʼalha ti nifaĉlem ti tʼacumelhʼin ĵayu pa nômemʼapeʼe pa ĉa tʼeʼelhtaĵeʼesh
  (ovalhelhei Efesios 1:10).
- Pa Cristo Mônlha, pa chiytôyĵata pava vaĉlan José yiʼseshʼe ĵava lhtosĵey lhjunashjulh ja itoĵ tʼachʼaĉlech
  ĵava lhayeʼesja lhshatech climsham jum lhjunashjulh ja yiĉleshe ĵa yinoʼot ti tʼôʼôy, lhech, ja tʼôjôj
  pa Jehová ti yitʼesh.
- Ya lhech ĵavatjutsa pa ĵanjoʼoylha shta ya lhech ti yamônlha, ya lhech shta ti ĵavaf pa ya lhech ti
  ĵayvayelhʼam ĵatolhey ĵa tata (ovalhelhei D y C 110:3–4)
- Pa lhech, pa chiytoyĵata pava ti vaĉlan nifaĉchʼe pa noq̂ueʼesh ôpis ti nojeshchʼe ĵava aĉloĵ chitanôĉliteshem
  pa lhech nôq̂ue chitanôĉlitesh, ti yojeshʼeshane ti ĉasvaʼatsha shtajutem pa lhech ti monlha.
- Lhayaʼash ti shtavan, ech, ti yiʼjop pa Dios ti ôpis ti shtapeya pa tʼôjôj ti nifaĉ pa lhech ti lhech
  velha lhôʼôs tolha pa lhtata;
- Pa lhech, chitôlhajop pa lhech na nalhuyish lhechesh ti chiyivĉlanjat pa chiyisnatesh shta napi yachaĵʼapeʼeʼin
  na cotsĵat pa vatĉlonatʼe shta napi lhĉles yitsotʼaĵesh pa Dios (ovalhelhei D y C 76:22–24).
- Nava yaʼĉlishay ĵanfaĉleelh shta ti ôpis ti chivatpeyaʼesh ca vatcumĵayash yivoyeshchʼe shi shta na
  lhishĵanĵavat ôpis ti chinachaĵa cotsĵaʼat chiyanʼe lha lhtatsucʼesh napi vatʼeyĵatsĵanĵas shi napi
  chiytoyĵata pava ti vaĉlan nan ôpis ti vanôyinesh cʼoya ti lhech lhja utej chiytʼesha pa Jesucristo
  lhavatsha (ovalhelhei Efesios 2:20).
- Ĵanfaĉleelh shta pa lhech tapeĉley ĵayu na cotsĵaʼat “pa ĉa tʼelhtaĵeʼesh pa lhech lhĉanvaĉleesh cʼôya
  ĵayu nan tʼajoʼoj napi ussham lhcaanvaĉles pa chiyinvaĉleyan cʼoya ĵayu napi chiyinvaĉleyanshane” (ovalhelhei
  Isaías 40:5), pa lhacômʼa ĵayu ĉa nitʼaĉĵatsuyʼe tʼajuyish shi ti lhacômʼô ĵayu napi na tʼônashvatcʼôya
  tʼaʼlha ĵayu pa yieshʼe tʼajuyish ĵayu shta pa lhech, pa ĉaslhaĉômʼa ĵayu ĉa shiniyʼôschʼe pa ĉasjunashchʼe
  yiey pan lhjunash ti shtasnatesh shi pa shtaychavalheyʼin tôlhshaʼam lhpa ĉaslhiʼivte.
- Shtajutem ĉa shtatôʼnôĉlitshem. Na lhasnôycheyash tôʼlha papi tʼeyĵatsĵanĵas, papi lhech ôpis ti yisĉlanshaʼne,
  pa lhech Jesus lhech pa Cristo mônlha, tanĉa nivaf paʼcatʼelheʼesh lhôʼôs pa Dios pa lhech uĵ lhĉanvaĉle
  Emanuel, ti noq̂ueʼesh pʼalha ti yijop pa lhtata. Pa lhech vatq̂uʼisjuyaĵesh, pa vatmônlhaĵayash shi
  ti ĉaĉlecʼoya nan tucʼaʼe na côtsĵatiyish.
