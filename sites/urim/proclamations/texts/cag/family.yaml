title: Na vatjôjʼesham
subtitle: Veʼlha Chinfaĉ Nantuʼcʼaʼe na Cotsjatiyish
author: ''
note: Pa lhĉaanvaĉle Gordon B. Hinckley yetônchʼe na chiʼtasinôyesh ti nôyôĵem ĵapi yômey ca veʼlhasham
  in vatcʼayashvaʼne tôlhshaam japi tʼacuʼmeshvaʼne ti vanq̂uʼefen, chiʼyisnatesh ti 23 ja shnôvôp ti
  1995, yiʼeshʼe ja Salt Lake City, Utah, EE.UU.
paragraphs:
- Yivaʼachsheʼelh, ĵatôʼlhelhsham na vatjutsaʼ vatvaĉleyash pa shiʼ shta ĵapi vatĉasinô tôlhshaʼam ĵapi
  doce vatʼeyĵatsĵanĵas tôlhshaʼam Na lhishĵanĵavat pa Jesucristo shi papi niĉacuĵanĵasa nava yôjʼesha
  ne nalhus, vatculhesh ĉa chinanfaĉʼin na vataĵayayash ti tôlha pa yitsuuj shi lhpa ôĉĵeĉlô ôpis ti yisĉlanchʼe
  pa Dios pa nôq̂ueʼe na vatĵôjʼesham lhtatsuquʼesh ti pʼalhachʼen ti yisĉlanvatichʼe pa shtômjey pa shnôvʼe
  jayu ayĵôlhayechʼe yiʼe papi lhĉlesesh.
- Lhaĉômʼa napi chiyvan, nivaĉle, nivaĉchey chiyivĉlanĵat, yijoneshlhachʼe pan lhjunash pa Dios. Velheʼe
  tsʼivee ti lhnenĵasesh vatôôs shi ti vatôse pʼalha ti vaĉlan ti vatsoĉôĉlitʼesh tôlha papi vatanavot
  yiey pa vôôs shi, ti velhee tsivee pa lhjuneshaʼne pa nôq̂uee pa yieʼ lhasnôyechʼe. Papu ti nivaĉleesh
  shi ti nivaĉcheesh chintôfaʼclesh ti chiyvenchateshaʼne ti jaspa chintôfaʼĉlesh ti vaĉlan, vaf shi ĉa
  ayĵôlhayechʼaesh papu.
- Pa vatjutsa chitôlhʼe, vataĉles yitsjôy, vataĉles ôĉĵeĉlôy, vatsôĉʼoĉtesesh ti nichʼa, nitôfaĉlesh pa
  Dios pa tʼalhaʼan shta tsʼivee pa lhtata ôyĵôlhayech, shi ti yivoʼyemjulh tsʼivee pan ôpis ti yôyinemchʼe
  papi lhĉles pa lhfanishlhavach ĵayu, tôlhʼejop ti ĉaaĵem ĵayu pa lhavuʼvat ĉa ĵaspa nômʼa pee pava vantoyiteshʼe
  ĵayu na cotsĵaat jôʼtaney ĉa lhech nitôʼlheshʼe ĉa nivatvoyĵateshchʼe pa nômjey shi ti isjop ĉa nômjey
  pa chiyetone lhasnôyechʼe seĉʼesh ĉa ninoyaĵeshi pa lhamônlhaĵayash ôyĵôlhayech.
- Na vatjutsaʼ vatyôjiĵat ti yijutey pa Dios pa Adan nôq̂ueʼe lhpa Eva yômjulh ti tʼunaĵesh ĉa lhtaĵayaseesh,
  pa vatanavotʼesh ĵayu shta. Shtanfaĉ na lhayôjiĵat pa Dios tʼajuya napi lhĉles ĉa nivatĉlonatʼe pa nitifʼapee
  shta na cotsĵatiyish ĉa noveshʼe pa lhĉʼusiyashʼin. Shtanfaĉ shta ti nichen pa Dios pa nivaĉle shi lhpa
  nivaĉche nava lhasnôyĵes yiʼshi pa tʼunaĵ ĉa ĵaspa yijôachʼe jum ĉa nôôvatcop ĉa lhtâĵayasaʼesh.
- Shtanfaĉleelh nava tʼajuya ti isjop ĉa chinchenesh chiyivĉlanĵatshi na vatmônlhaĵayash ôpis ti chiyvaĉlhitesh.
  Shtanvoyeshvatjulh shta na is vatmônlhaĵayash ti yaʼshesh ti tajulhey ti yivaĉlhicham pa Dios.
- Pa vataĵaya shi lhpa vataĵaya yitsotʼaĵshi tsʼivee ĉa nenshaʼne shi ti yitsotʼaĵshi ĉa ninujumatsenlhavach
  pa nôq̂uee papi lhĉles… “nôyôĵeshi pa Jehová lhech napi lhĉles” (ovalhelhei Salmo 127:3). Napi vatanavot
  ĉaaĵem na is ĉa ninôyôĵem papi lhĉles pa vatencheyash shiʼ pa vatvoyĵayasheshchʼe, pa neyĵatsĵanesh
  pa ischʼe papi lhĉles ĉa nenshaʼne pa nivoʼyeshchʼe shta. Ĉa ĵaspa nijutem pava suyshemshi pa neyĵatsĵanesh
  pa tôôlhchishamnee pa nefen papʼelhcha, shtovalhshaʼne na lhayôjiĵat pa Dios pa shtanvaĉleyan pa yitsaat
  ti shnôôvji, shtaviʼĵatanjulh pa vatyôjiĵat pa ĉa shnôôvtaĵʼe. Papi yitsjôy vataĵayas nôq̂uee papi ôĉĵeĉlôy
  vataĵayas, papi vatamimiĉ shi papi vatataĉ, tantsôôtĵayesh pava chiyjuteem ĉa niyôjeesha pa nômʼa pee
  cʼoya pa Dios. Pa vatjojʼesham yiyitsĵat pa Dios.
- Pa vataĵayayash chiyjutem pa nivaĉle shi lhpa nivaĉche, chiyvaĉlhitesh ti isjop ĉa ayĵôlhayechʼa. Papi
  vataĉles isjop ĉa nôveshi pa vataĵayayash ĉa ĵaspa nitônitĵat pa lhtata shi lhpa lhamimi, tôlhʼejop
  ti yiʼshi ti vaʼniseshʼe pa tʼajuya ti lhtaĵayasesh shi ti isjop ĉa niviʼĵatanchʼe shta. Na lhĉʼusiyashʼin
  pa vatjôjʼe sham ĉaaĵ na camômeshʼe cʼôya ĉa nômʼapee nanlhjunash ĉa nitôôlhtaĵajop cava vanq̂uʼeyĵatsĵanesh
  pa lhĉaanvaĉle Jesucristo. Papi lhtaĵayas shi pa vatjôjʼesham is ti yômʼa pee pava chiyôjiʼsha pa mônlhaʼesh
  ti yaychavalha nava tôlha pa nivatĉacuĵayasha pa vatʼalhĵayash, pa vatatvaychʼaĉlayĵayash papu ti chiyvômĵatemchʼe,
  ti chiyviĵatanjulh, pa vatencheyash, pa vatĉavtsʼaĉlayĵayash, pa vatcumĵayash, noq̂uee pava chiyĉlôquiʼ.
  Pava chiyaychavalhey yivoʼyeshchʼe, pa vatata vatsavat cʼoya pa tʼajôjʼesham ĉa nenshaʼne shi ti isjop
  ĉa nivatvoyĵateshchʼe pa yitsôtʼaĵshi ĉa nijutem pava suyshemshi matas yiʼey pa yôjʼe pa lhamônlhaĵayasheshʼe
  pa tʼajôôjam shi isjop ĉa ninujumatsenesh. Yaʼshesh cʼoya lhpa vatamimi ti isjop ĉa ninujumatsenesh
  pa tʼajôôj papi lhĉles navôq̂ue isis tantsôôtĵayesh, pa vatata shi lhpa vatamimi, ti lhavaachsha tsʼivee
  taʼnefenesh ti tanyôjiĵayesh. Papu ti niysaʼlhavach, pa vatvafĵayash shi pavʼelhcha, pa isjop ti chiyvenchatvatcʼoya.
- Papʼelh vatjôjʼesham isjop ĉa ninôĉlitem pa tʼefenĵayasha papʼelhcha nanlhjunash ĉa suytaĵeeshi. Shtashanatesh
  napi yiĉlôqui cava lhanyôjiĵatesjop ĉa nitaasĉlaneshi papu, papi niysaʼ pa lhfanishesh shi ti yiĉloqui
  lhpa lhchʼaĉfa jôtaĵesh papi lhĉles shi shta ti ninômʼapee pava tayôjiĵanesh pa vatjôjʼesham, pa nalhu
  ĵayu ĉa nômtaĵeyjop yitôʼya pa ĉa tʼônashtaĵeeshem pa Dios. Ĉaaĵ neʼelhcha shta shtashanateshelh papi
  vatjut cʼoya pa tʼajôôjam natʼapee ĵayu cavôq̂ue papu, yômjam ĵayu pa yitsaat.
- Ĵasnachshelh na ĵayôjiʼeshelhʼapee tantsôôtĵaʼyeesh napi tsitenas pa nôq̂uee napi lhĉavos na uĵjaam
  yiʼey pan tʼajôôjam ĉa ĵaspa niyitsjatesh nava chiyvaĉlhichsham chiʼtayôjiĵanesh tʼajuya ĉa nunitĵatesh
  nava vatjôjʼesham ĉa niʼnaĉʼoyeesh pa velhasham nan lhjunash ti lhtachifasesh.
