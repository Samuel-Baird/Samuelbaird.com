retrieved: '2026-11-02'
title: Ti chiʼnachaĵchisham na lhavoyĵayasheshchʼe na is yaʼclishesh pa Jesucristo.
subtitle: Ti chiʼtasinôyesh pa tʼaplhuquʼe na tucʼaʼe na cotsĵatiyish.
author: Napi vatjutsa lhĉaanvaĉlesesh pa nôqueʼe napi Doce vatʼeyĵatsĵanĵas yiʼshi na Lhishĵanĵavat pa
  Jesucristo shi napi Niĉacuĵanĵasa nava yôjʼeshaʼne nalhus.
note: Lhechelhʼeyam pa Dios ti nijutelhyam ĉa nastôyeʼlha na lhĉacumĵayash ti yijutem napi yenshaʼne lhĉles.
  ĵatônôĉlitshelhem napʼelh ĉa ĵaspa nineyĵatsĵanesh pa Espíritu ĉa nitʼalhesh na vatfaĉlechʼesh ti chiʼnachaĵchisham
  shi ĉa ninvatĉacuʼaʼesh ĵaspa chinefenesh ĉa niĉaaĵem pa ĉa nitônôĉlitesh yivoʼyeshchʼe shi ĉa naychavalha
  pava lhasnôyĵes, pa nitaasĉlaneyshane ĵayu pa napuʼeyshi lhnômĵayash nifaĉ pa Ĉasĉaʼanvaĉle shi pa Lhavquʼilhĵenaĵ,
  Jesucristo.
paragraphs:
- Vaĉalhsham jô ti ĵanfaĉleelh pa Dios yen lhacômʼa napi lhĉlesesh ti yiʼe tsʼivee na tucʼaʼe na cotsĵatiyish.
  Dios vatata nijutjooy na yivoyeshchʼe lhavaʼatĵayash na vatmônlhaĵayash ômpa ca lhjunashajulh, shi na
  nintʼôsshaʼne lhniyitsĵayash ti vatĉloyit pa lhenach lhôôs, Jesucristo. Pa tʼunaĵ pa lhtata, Jesus nechshaam
  pa yômʼa pee shta pa lhavafĵayash. Pa lhech ĉaslhavquilhĵenaĵ, vanôyin jacʼoya shi ti vatvayĵatjoom.
- Doscientos chʼe pava yinĉôpeschʼe, pa lhech lhasnôyech nalhu ti shnôvôpʼesh ti 1820, pa nichʼayech José
  Smith, tanachanesh ĉa nitôya ta yiʼe pa vatishĵanĵavat ĉa nôcjaam lhechesh pa yich ĉa nitʼaalh yiʼey
  pa yitaʼ shalheʼema pa lhajpôyich fchenaĵjulh yiʼshi pa yitsôtajesh pa Nueva York, Estados Unidos. Pa
  lhech ĉaaj pava tayʼôtsĵanesh tôlhʼejop ti nichaʼvayey pa lhsôcʼôĉlit ti chiyilhĵen pa ninvatĉacuʼesh
  ti lhech pa Dios ti vôquʼe.
- Na vatantsʼaĉlanĵayashesh, janooĉlhanitelhchʼe, pa tʼalhĵayash yicuulhjulh, pa Dios tiʼlhtata shi pa
  lhôôs Jesucristo papi lhech tanôĉlitem pa José ti lhech tôlhʼeshicham ĵayu ti chinachaĵchisham lhaĉômʼô
  nava matas (ovalhelheishi ja Hechos 3:21) na lhjunash ti yitʼesha lha Biblia. Côque chiyvaney, José
  pʼalha ti iseshaʼne ti meʼelh ti vafshane papi vatʼeyĵatsĵanĵas, na lhishĵanĵavat pa Cristo, tʼaplhuquʼejulh
  ti vaĉlan na Nichʼa Vatfaĉleech, ti tayʼe na cotsĵaat, pa lhech vatsôôtĵatesh ti tôʼlheshlhavne ĉa ninachaĵnee
  cum shta.
- ĵayeʼechshelh vatam ti, tôlhʼeychisham pa Ĉatsitataʼelh shi pa lhôôs, nômʼin papi vanqueʼeyĵat tôôlhchishamneʼe
  ĵaspa niyôjiʼeshemchʼe pa Jose shi ĉa nachaĵeshchʼe na Lhishĵanĵavat pa Jesucristo. Juan vanĉanaĵayan,
  nan lhjunash ti nechshaam, yanʼe na vatvaĉleyashesh papu ĉa chinaĵayan jôtaney ĉa nivômemchʼe pava lhsaschʼeshane.
  Puʼjana papi yijôquʼe ti vatʼeyĵatsĵanĵasesh-Pedro, Santiago shi pa Juan-nachaĵchisham papu ti vatʼeyĵatsĵanachʼesh
  shi ti nicʼatey na tʼunaĵesh ca yaashchisham vatvaĉleyash. Nômʼin shta papʼelhcha tʼajôôj jô, yiʼshi
  pa Elias chiytoĵata pava vaĉlan, pa lhech nachaĵchisham na lhanvaĉleyashesh nava vatjoʼeshamshaʼne ĉa
  yaĵateʼesh ĉa nômvatjulh yinjôt nômjey pa vatfafĵayash.
- 'Ĵatôʼnoĉlitshelh shta ca lhech Jose Smith chiyjuteʼem ca lhtôycheyashesh shi ca tʼunaĵ pa Dios ĉa ĵaspa
  ninôyôĵquʼe na nôôĉlheʼesha pantʼelhesh: Na Lhquʼisĵayanach pa Mormon, lhech naelh vatfaĉlechʼesh pa
  Jesucristo. Nava yinôôĉlhaniteyshi na is chiʼyiʼseshʼe chiyvanshi na chiychayeshchʼe ca lhcumĵayash
  lhavaatsha pa Jesucristo yiey pa chishamneʼe julh ti niʼcajuʼachʼe ti nechshaʼam. Na vatquʼisĵayanach
  yaychavalha ti vanquʼeyĵatsĵanesh na vatmônlhaĵayash shi ti yashinitĵatchʼe nava tôʼlha pa Cristo, lhtatsuquʼesh
  côque ti yaychavalha. Nanlhjunash nôque vatquʼisĵayanach voquʼeʼetsham neelh yaʼĉlish, na Lhquʼisĵayanach
  pa Mormon yinôôĉlanita ti lhaĉômʼô napi nivaĉlesesh lhech ti lhĉlesesh pa lhech vanquen Ĉatsitata Lhasnôyech,
  pa lhech ĉaaĵ pa pʼalha ti yivaĉlhitsham pa lhasnôyechʼe tʼajuya na casmônlhaĵayash shi pa Lhôôs, Jesucristo,
  nôqueʼeshchʼe ti nifaĉjoom, yiey pa lhfanishesh pava vatjutsa nalhus.'
- ĵanfaĉleelh na Lhishĵanĵavat pa Jesucristo shi napi niʼĉacuĵanĵasa nava yôjʼeshane nalhus, vaniʼisĉlanchʼe
  ti 6 ĵa abril ti 1830, lhech na Lhishĵanĵavat nachaĵneʼe pa Cristo, yiey ĵan tʼaplhuquʼe ti vaĉlan na
  Nichʼa Vatfaĉleʼech. Nôque vatishĵanĵavat chiytsemaʼaĵshi na yivoʼyeshchʼe vatmônlhaĵayash ti lhtatsuquʼesh
  lhjunashjulh lhpa uteĵ, Jesucristo yaychavalhjoʼo ti vatvayĵatjoʼom yaĵatesh shi ti netshaʼam jacʼoya.
  Jesucristo velheʼesh cum tôney papi tʼeyĵatsĵanĵasesh shi ĉa nijutem pa lhanvaĉleyashesh yaashchisham.
  Nifaĉjoʼom ĉaslhaĉômʼa ĉa shtanachelhey pa lhech shi na Lhishĵanĵavat, ĉa ĵaspa shtatsʼôteyesh pa Espíritu
  Santo, nava tantsôôtĵayesh pa vatnilhĵenĵayash shi ĉa niĉaaj joom pa uĵ ĉasĉʼusiyasheshʼin. Ti nôjeshchʼe
  pava doscientos yinĉôpes tôlheshʼe pa Dios ĉatsitata shi pa lhenach Lhôôs, Jesucristo, lhech yijutem
  ĉa nitôlheshʼe ti isjop ĉa ninachaĵchisham.
- Ti nôjeshchʼe pava doscientos yinĉôpes tôlheshʼe pa Dios ĉatsitata shi pa lhenach Lhôôs, Jesucristo,
  lhech yijutem ĉa nitôʼlheshʼe ti isjop ĉa ninachaĵchisham.
- Acloj jum papi nivaĉle tifʼapeʼe na cotsĵatiyish tculhĵanesh cava chiytôyʼeche cava vaĉlan ti paʼlhachʼeʼen
  ti chinfaĉjulh lhapesh. Na vatshamitĵayashesh ĵanfaĉleelh ti chiʼnachaĵchisham nôque ti chinfaĉʼin lhetipa
  ti yichshaʼne nava chiʼnôclit. Na cotsĵaat tanĉa nôpecleyjop ĉa lhetlha lhjunashachʼe, lhayaʼash pa
  Dios ‘nayĵatvaʼne ĵayu lhaĉomʼa nava matas tôlhʼejôp pa Cristo’ (ovalhelheishi ja Efesios 1:10).
