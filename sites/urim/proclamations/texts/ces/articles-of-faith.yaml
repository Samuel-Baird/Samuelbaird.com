title: Články víry
subtitle: Církve Ježíše Krista Svatých posledních dnů
author: ''
verses:
- n: 1
  text: Věříme v Boha, Věčného Otce, a v Jeho Syna, Ježíše Krista, a v Ducha Svatého.
- n: 2
  text: Věříme, že lidé budou potrestáni za své vlastní hříchy, a ne za přestupek Adamův.
- n: 3
  text: Věříme, že skrze usmíření Kristovo může býti spaseno veškeré lidstvo, skrze poslušnost zákonů
    a obřadů evangelia.
- n: 4
  text: 'Věříme, že prvními zásadami a obřady evangelia jsou: za prvé víra v Pána Ježíše Krista; za druhé
    pokání; za třetí křest ponořením na odpuštění hříchů; za čtvrté vkládání rukou pro dar Ducha Svatého.'
- n: 5
  text: Věříme, že muž musí býti povolán Bohem, skrze proroctví a skrze vkládání rukou těch, kteří mají
    pravomoc, aby kázal evangelium a vykonával jeho obřady.
- n: 6
  text: Věříme v tutéž organisaci, jež existovala v prvotní Církvi, totiž v apoštoly, proroky, pastýře,
    učitele, evangelisty a tak dále.
- n: 7
  text: Věříme v dar jazyků, proroctví, zjevení, vidění, uzdravování, vykládání jazyků a tak dále.
- n: 8
  text: Věříme, že Bible je slovo Boží, nakolik je přeložena správně; také věříme, že Kniha Mormonova
    je slovo Boží.
- n: 9
  text: Věříme všemu, co Bůh zjevil, všemu, co nyní zjevuje, a věříme, že ještě zjeví mnohé veliké a důležité
    věci týkající se království Božího.
- n: 10
  text: Věříme v doslovné shromáždění Izraele a ve znovuzřízení deseti kmenů; že Sion (Nový Jeruzalém)
    bude vybudován na americkém kontinentu; že Kristus bude vládnouti osobně na zemi; a že země bude obnovena
    a obdrží svou rajskou slávu.
- n: 11
  text: Domáháme se výsady uctívati Všemohoucího Boha podle příkazů svého vlastního svědomí a dopřáváme
    všem lidem stejnou výsadu, nechť uctívají jakkoli, kdekoli nebo cokoli si vyvolí.
- n: 12
  text: Věříme, že máme býti podřízeni králům, presidentům, vládcům a veřejným zástupcům, že máme býti
    poslušni zákona, že ho máme ctíti a podporovati.
- n: 13
  text: Věříme, že máme býti čestní, pravdiví, cudní, dobrotiví, ctnostní a že máme činiti dobro všem
    lidem; vskutku, můžeme říci, že následujeme nabádání Pavlovo – věříme všem věcem, doufáme ve všechny
    věci, snášeli jsme mnohé věci a doufáme, že budeme schopni snésti všechny věci. Je-li cokoli ctnostné,
    milé nebo dobropověstné nebo chvályhodné, o to usilujeme.
signature: Joseph Smith.
