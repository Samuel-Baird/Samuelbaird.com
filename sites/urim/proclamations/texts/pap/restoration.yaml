retrieved: '2026-11-02'
title: E Restourashon di e Plenitut di e Evangelio di JesuCristu
subtitle: Un Proklamashon Bisentenario na e Mundu
author: E Promé Presidensia i e Konseho di e Diesdos Apòstelnan di E Iglesia di JesuCristu di e Santunan
  di e Delaster Dianan
note: Ku reverensia i gratitut, nos komo Su Apòstelnan ta invitá tur pa sa—manera nos sa—ku e shelunan
  ta habrí. Nos ta konfirmá ku Dios ta hasi Su boluntat konosí na Su yunan hòmber i yunan muhé stimá.
  Nos ta testifiká ku esnan ku den orashon ta studia e mensahe di e Restourashon i aktua den fe lo wòrdu
  bendishoná pa haña nan propio testimonio di su dibinidat i di su propósito pa prepará e mundu pa e di
  Dos Binida primintí di nos Señor i Salbador, JesuCristu.
paragraphs:
- Solemnemente nos ta proklamá ku Dios ta stima Su yunan den tur nashon di e mundu. Dios e Tata a duna
  nos e nasementu dibino, e bida inkomparabel, i e sakrifisio ekspiatorio infinito di Su Yu Stimá, JesuCristu.
  Pa medio di e poder di e Tata, Jesus a bolbe lanta i a gana e viktoria riba morto. E ta nos Salbador,
  nos Ehèmpel, i nos Redentor.
- Dosshen aña pasá, riba un mainta bunita di primavera na 1820, e hóben José Smith, buskando pa sa na
  kual iglesia e mester a uni, a bai pa hasi orashon den mondi serka di su kas den e estado di New York,
  Estados Unidos. E tabatin preguntanan tokante e salbashon di su alma i a konfia ku Dios lo gui’é.
- Ku humildat, nos ta deklará ku komo kontesta riba su orashon, Dios e Tata i Su Yu, JesuCristu, a aparesé
  na José i a inougurá e “restitushon di tur kos” (Echonan 3:21) manera predesí den Beibel. Den e vishon
  aki, el a siña ku despues di e morto di e Apòstelnan original, Cristu Su Iglesia di Tèstamènt Nobo a
  bai pèrdí for di tera. José lo bira un parti krusial den su regreso.
- Nos ta afirmá ku bou di direkshon di e Tata i e Yu, mensaheronan selestial a bini pa instruí José i
  restablesé e Iglesia di JesuCristu. Juan Boutista ku a resusitá a restourá e outoridat pa boutisá dor
  di imershon pa remishon di pikánan. Tres di e diesdos Apòstelnan original —Pedro, Santiago i Juan—a
  restourá e apostolado i e yabinan di e outoridat di saserdosio. Otronan tambe a bini, inkluso Elías,
  ku a restourá e outoridat pa uni famianan huntu pa semper den relashonnan eterno ku ta superá morto.
- 'Nos ta duna testimonio tambe ku a wòrdu duná na José Smith e outoridat i poder di Dios pa tradusí un
  registro antiguo: e Buki di Mormon—Otro Tèstamènt di JesuCristu. Páginanan di e teksto sagrado aki ta
  inkluí un relato di e ministerio personal di JesuCristu entre e pueblo di e Hemisferio Oksidental poko
  despues di Su Resurekshon. E ta siña e propósito di bida i ta splika e doktrina di Cristu, ku ta sentral
  pa e propósito aki. Komo buki kanóniko ku ta kompañá e Beibel, e Buki di Mormon ta testifiká ku tur
  ser humano ta yunan hòmber i yunan muhé di un Tata Selestial amoroso, ku E tin un plan dibino pa nos
  bida, i ku Su Yu, JesuCristu, ta papia awendia ku nos meskos ku den antigwedat.'
- Nos ta deklará ku E Iglesia di JesuCristu di e Santunan di e Delaster Dianan, organisá dia 6 di aprel
  1830, ta e Iglesia restourá di Cristu, di e tempu di e Tèstamènt Nobo. E Iglesia aki ta ankrá den e
  bida perfekto di su piedra angular, JesuCristu, i den Su Ekspiashon infinito i Resurekshon literal.
  JesuCristu un biaha mas a yama Apòstelnan i a duna nan outoridat di saserdosio. E ta invitá nos tur
  pa bini na DjE i Su Iglesia, pa risibí e Spiritu Santu, e ordenansanan di salbashon, i pa haña goso
  duradero.
- Awor dosshen aña a pasa for di tempu ku e Restourashon aki a wòrdu inisiá pa Dios e Tata i Su Yu Stimá,
  JesuCristu. Miones rònt mundu a brasa e konosementu di e susesonan profetisá aki.
- Ku alegria nos ta deklará ku e Restourashon primintí ta bai dilanti pa medio di revelashon kontinuo.
  E tera nunka mas lo no ta meskos, pasó Dios lo “reuní tur kos den Cristu” (Efesionan 1:10).
