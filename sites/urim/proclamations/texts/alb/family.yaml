retrieved: '2026-11-02'
title: Familja
subtitle: Një Proklamatë drejtuar Botës
author: Presidenca e Parë dhe Këshilli i Dymbëdhjetë Apostujve të Kishës së Jezu Krishtit të Shenjtorëve
  të Ditëve të Mëvonshme
note: Kjo proklamatë u lexua nga Presidenti Gordon B. Hinkli si pjesë e mesazhit të tij në Mbledhjen e
  Përgjithshme të Shoqatës së Ndihmës të zhvilluar më 23 shtator 1995, në Solt-Lejk-Siti, Jutë.
paragraphs:
- Ne, Presidenca e Parë dhe Këshilli i Dymbëdhjetë Apostujve të Kishës së Jezu Krishtit të Shenjtorëve
  të Ditëve të Mëvonshme, solemnisht shpallim se martesa midis një burri dhe një gruaje shugurohet nga
  Perëndia dhe se familja është thelbësore në planin e Krijuesit për destinacionin e përjetshëm të fëmijëve
  të Tij.
- Të gjitha qeniet njerëzore, meshkuj dhe femra, janë krijuar sipas shëmbëlltyrës së Perëndisë. Secili
  është një bir ose bijë shpirtërore e dashur e prindërve qiellorë dhe, si i tillë, secili ka një natyrë
  dhe destinacion hyjnor. Gjinia është një karakteristikë thelbësore e identitetit dhe qëllimit të jetës
  para lindjes, të jetës në vdekshmëri dhe jetës së përjetshme të individit.
- Në mbretërinë paratokësore, bijtë dhe bijat shpirtërore e njihnin dhe e adhuronin Perëndinë si Atin
  e tyre të Amshuar dhe e pranuan planin e Tij, me anë të të cilit fëmijët e Tij mund të merrnin një trup
  fizik dhe të fitonin përvojë tokësore për të përparuar drejt përsosjes dhe përfundimisht të arrinin
  destinacionin e tyre hyjnor si trashëgimtarë të jetës së përjetshme. Plani hyjnor i lumturisë mundëson
  që marrëdhëniet familjare të vazhdojnë përtej varrit. Ordinancat dhe besëlidhjet e shenjta që janë në
  dispozicion në tempujt e shenjtë, bëjnë të mundur që individët të kthehen në praninë e Perëndisë dhe
  që familjet të bashkohen përjetësisht.
- Urdhërimi i parë që Perëndia i dha Adamit dhe Evës, kishte lidhje me potencialin e tyre si bashkëshort
  e bashkëshorte për të qenë prindër. Ne deklarojmë se urdhërimi i Perëndisë për fëmijët e Tij që të shumohen
  dhe ta mbushin tokën, mbetet i vlefshëm. Ne më tej deklarojmë se Perëndia ka urdhëruar që fuqitë e shenjta
  të krijimit të jetës duhet të përdoren vetëm midis burrit dhe gruas, ligjërisht të martuar si bashkëshort
  e bashkëshorte.
- Ne deklarojmë se mënyra me anë të së cilës krijohet jeta e vdekshme, është caktuar në mënyrë hyjnore.
  Ne pohojmë shenjtërinë e jetës dhe rëndësinë e saj në planin e përjetshëm të Perëndisë.
- Bashkëshorti dhe bashkëshortja kanë një përgjegjësi solemne të duan dhe të kujdesen për njëri-tjetrin
  dhe për fëmijët e tyre. “Bijtë janë një trashëgimi që vjen nga Zoti” (Psalmeve 127:3). Prindërit kanë
  një detyrë të shenjtë për t’i rritur fëmijët e tyre me dashuri dhe drejtësi, për t’ua plotësuar nevojat
  e tyre fizike dhe shpirtërore dhe për t’i mësuar ata ta duan e t’i shërbejnë njëri-tjetrit, të zbatojnë
  urdhërimet e Perëndisë dhe të jenë qytetarë që u binden ligjeve kudo që jetojnë. Bashkëshortët dhe bashkëshortet,
  nënat dhe etërit, do të mbahen përgjegjës përpara Perëndisë për plotësimin e këtyre detyrimeve.
- Familja shugurohet nga Perëndia. Martesa midis burrit dhe gruas është thelbësore në planin e Tij të
  përjetshëm. Fëmijët kanë të drejtën të linden nga prindër brenda lidhjeve të martesës dhe të rriten
  nga një atë dhe një nënë të cilët i nderojnë me besnikëri të plotë betimet e martesës. Lumturia në jetën
  familjare ka më shumë të ngjarë të arrihet më mirë kur bazohet te mësimet e Zotit Jezu Krisht. Martesat
  dhe familjet e suksesshme ngrihen dhe ruhen mbi parimet e besimit, lutjes, pendimit, faljes, respektit,
  dashurisë, dhembshurisë, punës dhe aktiviteteve të shëndosha argëtuese. Sipas planit hyjnor, etërit
  duhet t’i kryesojnë familjet e tyre me dashuri e drejtësi dhe janë përgjegjës për të siguruar gjërat
  e nevojshme të jetës dhe mbrojtje për familjet e tyre. Nënat janë kryesisht përgjegjëse për edukimin
  e fëmijëve të tyre. Në këto përgjegjësi të shenjta, etërit dhe nënat kanë detyrimin ta ndihmojnë njëri-tjetrin
  si partnerë të barabartë. Aftësia e kufizuar, vdekja ose rrethana të tjera mund të bëjnë të nevojshme
  përshtatjen individuale. Rrethet e gjera familjare duhet të japin përkrahje kur nevojitet.
- Ne paralajmërojmë se individët që i shkelin besëlidhjet e dëlirësisë, që i keqtrajtojnë bashkëshorten
  apo bashkëshortin ose pasardhësit apo që nuk arrijnë t’i përmbushin përgjegjësitë familjare, do të qëndrojnë
  një ditë përgjegjës përpara Perëndisë. Për më tepër, ne paralajmërojmë se shpërbërja e familjes do të
  sjellë mbi individët, komunitetet dhe kombet fatkeqësitë e parathëna nga profetët e lashtë dhe modernë.
- Ne u bëjmë thirrje qytetarëve dhe zyrtarëve të përgjegjshëm të qeverive kudo që janë, të nxitin ato
  masa të krijuara për të ruajtur dhe forcuar familjen si njësia themelore e shoqërisë.
