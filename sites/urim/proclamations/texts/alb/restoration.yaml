slug: restoration
language: alb
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=alb
retrieved: '2026-11-02'
title: Rivendosja e Plotësisë së Ungjillit të Jezu Krishtit
subtitle: Një Proklamatë në Dyqindvjetor drejtuar Botës
author: Presidenca e Parë dhe Këshilli i Dymbëdhjetë Apostujve të Kishës së Jezu Krishtit të Shenjtorëve
  të Ditëve të Mëvonshme
note: Kjo proklamatë u lexua nga Presidenti Rasëll M. Nelson si pjesë e mesazhit të tij në Konferencën
  e Përgjithshme Vjetore të 190-të, më 5 prill 2020, në Solt-Lejk-Siti, Jutë.
paragraphs:
- Ne shpallim solemnisht se Perëndia i do fëmijët e Tij në çdo komb të botës. Perëndia, Ati, na ka dhënë
  lindjen hyjnore, jetën e pakrahasueshme dhe flijimin e pafundmë shlyes të Birit të Tij të Dashur, Jezu
  Krishtit. Me anë të fuqisë së Atit, Jezusi u ngrit përsëri dhe korri fitore mbi vdekjen. Ai është Shpëtimtari
  ynë, Shembulli ynë dhe Shëlbuesi ynë.
- Dyqind vjet më parë, një mëngjes të bukur pranvere në vitin 1820, i riu Jozef Smith, duke kërkuar ta
  dinte se me cilën kishë të bashkohej, shkoi që të lutej në pyllin pranë shtëpisë së tij, në rrethinat
  në veri të Nju-Jorkut në SHBA. Ai kishte pyetje lidhur me shpëtimin e shpirtit të tij dhe mirëbesoi
  se Perëndia do ta drejtonte.
- Me përulësi, ne shpallim se në përgjigje ndaj lutjes së tij, Perëndia, Ati, dhe Biri i Tij, Jezu Krishti,
  iu shfaqën Jozefit dhe përuruan “ripërtëritje[n e] të gjitha gjërave” (Veprat e Apostujve 3:21) siç
  u paratha në Bibël. Në këtë vegim, ai mësoi se pas vdekjes së Apostujve të parë, Kisha e Krishtit e
  kohës së Dhiatës së Re, humbi nga toka. Jozefi do të ishte mjet vendimtar për kthimin e saj.
- Ne pohojmë se, nën drejtimin e Atit dhe të Birit, lajmëtarë qiellorë erdhën për ta udhëzuar Jozefin
  dhe për ta rithemeluar Kishën e Jezu Krishtit. Gjon Pagëzori, i ringjallur, rivendosi autoritetin për
  të pagëzuar me anë të zhytjes për heqjen e mëkateve. Tre nga dymbëdhjetë Apostujt e parë – Pjetri, Jakobi
  dhe Gjoni – rivendosën detyrën e Apostullit dhe çelësat e autoritetit të priftërisë. Erdhën edhe të
  tjerë, përfshirë Elijan, i cili rivendosi autoritetin për t’i bashkuar familjet së bashku përgjithmonë
  në marrëdhënie të përjetshme që e kapërcejnë vdekjen.
- 'Ne dëshmojmë më tej se Jozef Smithit iu dha dhurata dhe fuqia e Perëndisë për të përkthyer një anal
  të lashtë: Librin e Mormonit – Një Dëshmi Tjetër e Jezu Krishtit. Faqet e këtij teksti të shenjtë përfshijnë
  një rrëfim të shërbesës vetjake të Jezu Krishtit mes njerëzve në Hemisferën Perëndimore pak kohë pas
  Ringjalljes së Tij. Ai jep mësim për qëllimin e jetës dhe shpjegon doktrinën e Krishtit, që është qendrore
  për atë qëllim. Si shkrim i shenjtë shoqërues për Biblën, Libri i Mormonit dëshmon që të gjitha qeniet
  njerëzore janë bij e bija të një Ati të dashur në Qiell, që Ai ka një plan hyjnor për jetën tonë dhe
  që Biri i Tij, Jezu Krishti, flet sot ashtu si në kohët e vjetra.'
- Ne shpallim se Kisha e Jezu Krishtit e Shenjtorëve të Ditëve të Mëvonshme, e organizuar më 6 prill 1830,
  është Kisha e Krishtit e kohës së Dhiatës së Re e rivendosur. Kjo Kishë është e ankoruar në jetën e
  përkryer të gurit të saj kryesor të qoshes, Jezu Krishtit, dhe në Shlyerjen e pafundme dhe Ringjalljen
  e mirëfilltë të Tij. Jezu Krishti edhe një herë ka thirrur Apostuj dhe u ka dhënë atyre autoritetin
  e priftërisë. Ai na fton që të gjithë ne që të vijmë tek Ai dhe Kisha e Tij, të marrim Frymën e Shenjtë,
  ordinancat e shpëtimit dhe të fitojmë gëzim të qëndrueshëm.
- Dyqind vjet kanë kaluar tani që kur kjo Rivendosje u fillua nga Perëndia, Ati, dhe Biri i Tij i Dashur,
  Jezu Krishti. Miliona njerëz kudo në botë kanë përqafuar një njohuri për këto ngjarje të profetizuara.
- Ne me gëzim shpallim se Rivendosja e premtuar shkon përpara nëpërmjet zbulesës së vazhdueshme. Toka
  kurrë më nuk do të jetë e njëjta, teksa Perëndia do “t’i s[jellë] në një krye të vetëm, në Krishtin,
  të gjitha gjërat” (Efesianëve 1:10).
- Me nderim dhe mirënjohje, ne, si Apostujt e Tij, i ftojmë të gjithë që ta dinë – ashtu siç e dimë ne
  – që qiejt janë hapur. Ne pohojmë se Perëndia po e bën të njohur vullnetin e Tij për bijtë dhe bijat
  e Tij të dashura. Ne dëshmojmë se ata që me lutje e studiojnë mesazhin e Rivendosjes dhe veprojnë me
  besim, do të bekohen që të fitojnë vetë dëshminë e tyre për hyjnueshmërinë e saj dhe qëllimin e saj
  për ta përgatitur botën për Ardhjen e Dytë të premtuar të Zotit dhe Shpëtimtarit tonë, Jezu Krishtit.
