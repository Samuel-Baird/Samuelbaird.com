title: Kristus Yang Hidup
subtitle: Kesaksian Para Rasul
author: Gereja Yesus Kristus Orang Suci Zaman Akhir
paragraphs:
- Semasa kita memperingati kelahiran Yesus Kristus dua ribu tahun lalu, kami memberikan kesaksian kami
  tentang kenyataan hidup-Nya yang tiada bandingnya dan kuasa korban tebusan-Nya yang tidak terhingga.
  Tiada seorang pun mempunyai pengaruh yang begitu mendalam kepada semua orang yang pernah dan akan hidup
  di bumi ini.
- Dialah Yehovah dari Perjanjian Lama, Mesias dari Perjanjian Baru. Dia adalah pencipta bumi ini di bawah
  arahan Bapa-Nya. “Tuhan menjadikan segala sesuatu melalui Dia. Tiada sesuatu pun di alam semesta ini
  yang dijadikan tanpa Dia” (Yohanes 1:3). Walaupun tanpa dosa, Dia dibaptiskan untuk menggenapi segala
  kesolehan. Dia “pergi ke serata tempat untuk berbuat baik” (Kisah Rasul-rasul 10:38), tetapi dia dihina.
  Injil-Nya adalah satu pesanan yang damai dan muhibah. Dia memohon semua orang untuk mengikuti teladan-Nya.
  Dia berjalan kaki ke seluruh Filistea, memulihkan mereka yang sakit, membuka mata mereka yang buta,
  dan membangkitkan mereka yang sudah mati. Dia mengajar tentang kebenaran abadi, kenyataan kewujudan
  prafana kita, tujuan hidup kita di bumi, dan potensi bagi para putera dan puteri Tuhan Bapa dalam dunia
  yang akan datang.
- Dia memulakan sakramen sebagai satu peringatan tentang korban tebusan-Nya. Dia ditangkap dan dikutuk
  kerana tuduhan-tuduhan palsu, dikutuk untuk memuaskan tuntutan dari kumpulan perusuh, dan dihukum mati
  di atas salib pada tempat yang dipanggil Kalvari. Dia berikan nyawa-Nya untuk menebus semua dosa manusia.
  Dia adalah satu kurnia wakilan pada pihak semua orang yang pernah hidup di bumi.
- Kami bersaksi dengan bersungguh-sungguhnya bahawa hidup-Nya, iaitu pusat sejarah semua manusia, tidak
  bermula di Betlehem atau tamat di Kalvari. Dia adalah Anak Sulung dan Putera Tunggal Bapa Tuhan yang
  bertubuh badan, Penebus dunia ini.
- Dia bangkit dari kubur untuk “[menjadi orang pertama yang] dibangkitkan daripada kematian” (1 Korintus
  15:20). Sebagai Tuhan yang sudah bangkit, Dia mengunjungi mereka yang Dia kasihi. Dia juga melayani
  di kalangan “domba-domba lain” (Yohanes 10:16 ) di Amerika purba. Dalam dunia terbaru, Dia dan Bapa-Nya
  muncul kepada Joseph Smith, membawa masuk kegenapan zaman keagamaan (lihat Efesus 1:10) yang sudah lama
  dijanjikan.
- 'Nabi Joseph menulis tentang Kristus yang hidup: “Mata-Nya bagaikan nyalaan api; rambut kepala-Nya putih
  bagaikan salji yang murni; air muka-Nya bersinar melebihi keterangan matahari; dan suara-Nya bagaikan
  bunyi deru perairan yang luas, bahkan suara Yehova, memfirmankan:'
- “Akulah yang pertama dan yang terakhir; Akulah Dia yang hidup, Aku lah Dia yang dibunuh; Akulah pembelamu
  dengan Bapa” (A&P 110:3–4).
- 'Nabi Joseph juga mengisytiharkan bahawa: “Dan sekarang, selepas begitu banyak kesaksian yang telah
  diberikan tentang Dia, inilah kesaksiannya, yang terakhir dari kesemuanya, yang kami berikan terhadap
  Dia: Bahawa Dia hidup!'
- “Kerana kami melihat-Nya, bahkan pada tangan kanan Tuhan; dan kami mendengar suara yang memberikan kesaksian
  bahawa Dia ialah Anak Tunggal Bapa—
- “Bahawa oleh Dia, dan melalui Dia, dan daripada Dia, dunia-dunia ada dan diciptakan, dan para penduduknya
  adalah para putera dan puteri yang dilahirkan bagi Tuhan” (A&P 76:22–24).
- Kami mengumum dengan takzim bahawa Imamat-Nya dan Gereja-Nya sudah dipulihkan di bumi ini—“dibina di
  atas asas … para rasul dan nabi, dengan Yesus Kristus sebagai batu asasnya” (Efesus 2:20).
- Kami bersaksi bahawa Dia akan kembali ke bumi satu hari nanti. “Lalu keagungan Tuhan akan dinyatakan,
  dan segenap umat manusia akan menyaksikannya” (Yesaya 40:5). Dia akan memerintah sebagai Raja yang Terutama
  dan Tuhan yang Agung, dan setiap lutut akan berlutut dan setiap lidah akan mengaku di hadapan-Nya. Kita
  setiap orang akan berdiri di hadapan-Nya untuk diadili oleh Dia menurut kerja-kerja dan keinginan hati
  kita.
- Sebagai para rasul yang ditahbis dengan sepatutnya, kami bersaksi—bahawa Yesus adalah Kristus yang Hidup,
  Putera Tuhan Bapa yang abadi. Dia adalah Raja Imanuel, yang berdiri di sebelah kanan Tuhan Bapa pada
  hari ini. Dia adalah cahaya, hidup, dan harapan dunia. Jalan-Nya menghala ke kedamaian di bumi ini dan
  hidup yang kekal di dunia akan datang. Bersyukur kepada Tuhan Bapa kerana kurnia Putera-Nya yang tiada
  bandingnya.
