title: Fasal-Fasal Kepercayaan dari
subtitle: Gereja Yesus Kristus Orang Suci Zaman Akhir
author: ''
verses:
- n: 1
  text: Kami percaya kepada Tuhan, Bapa Yang Abadi, dan kepada Putera-Nya, Yesus Kristus, dan kepada Roh
    Kudus.
- n: 2
  text: Kami percaya bahawa manusia akan dihukum kerana dosa-dosa mereka sendiri, dan bukan kerana pelanggaran
    Adam.
- n: 3
  text: Kami percaya bahawa melalui Korban Tebusan Kristus, seluruh umat manusia boleh diselamatkan, melalui
    kepatuhan pada hukum-hukum dan tatacara-tatacara Injil.
- n: 4
  text: 'Kami percaya bahawa asas-asas dan tatacara-tatacara pertama Injil adalah: pertama, Iman kepada
    Tuhan Yesus Kristus; kedua, Pertaubatan; ketiga, Pembaptisan melalui pencelupan untuk pengampunan
    dosa-dosa; keempat, Perletakan tangan untuk kurnia Roh Kudus.'
- n: 5
  text: Kami percaya bahawa seorang lelaki mesti dipanggil oleh Tuhan, melalui nubuat, dan melalui perletakan
    tangan oleh mereka yang berwewenang, untuk mengkhutbahkan Injil dan melaksanakan tatacara-tatacaranya.
- n: 6
  text: Kami percaya kepada organisasi yang sama yang ada di dalam Gereja Purba, iaitu, para rasul, nabi,
    gembala, pengajar, pemberita Injil, dan seterusnya.
- n: 7
  text: Kami percaya kepada kurnia-kurnia bahasa, nubuat, wahyu, penglihatan, penyembuhan, penafsiran
    bahasa, dan seterusnya.
- n: 8
  text: Kami percaya Alkitab adalah firman Tuhan sejauh mana ianya diterjemahkan dengan betul; kami juga
    percaya Kitab Mormon adalah firman Tuhan.
- n: 9
  text: Kami percaya segala yang Tuhan telah wahyukan, segala yang Dia wahyukan sekarang, dan kami percaya
    bahawa Dia akan mewahyukan hal-hal yang besar dan penting berkaitan dengan Kerajaan Tuhan.
- n: 10
  text: Kami percaya kepada pengumpulan harfiah Israel dan kepada pemulihan Sepuluh Suku; bahawa Sion
    (Yerusalem Baru) akan dibangunkan di atas benua Amerika; bahawa Kristus sendiri akan memerintah di
    atas bumi; dan, bahawa bumi akan diperbaharui dan menerima kemuliaan firdausnya.
- n: 11
  text: Kami menuntut hak untuk menyembah Tuhan Yang Maha Kuasa menurut ketetapan suara hati kami, dan
    memberikan hak yang sama kepada semua orang, biarlah mereka menyembah bagaimana, di mana, atau apa
    pun yang mereka mahu.
- n: 12
  text: Kami percaya untuk tunduk kepada raja-raja, presiden, para pemerintah, dan majistret, dalam mematuhi,
    menghormati, dan menjunjung undang-undang.
- n: 13
  text: Kami percaya harus jujur, benar, murni, baik hati, berhemah, dan dalam melakukan kebaikan kepada
    semua orang; tentunya, kami boleh mengatakan bahawa kami mengikuti peringatan Paulus—Kami percaya
    segala hal, kami mengharapkan segala hal, kami telah melalui banyak hal, dan berharap untuk mampu
    bertahan akan segala hal. Jika terdapat apa-apa pun yang berhemah, indah, atau dikatakan baik atau
    layak dipuji, kami mencari hal-hal sebegini.
signature: Joseph Smith.
