title: Pemulihan Kegenapan Injil Yesus Kristus
subtitle: Perisytiharan Ulang Tahun Kedua Ratus kepada Dunia
author: Presidensi Utama dan Majlis Dua Belas Rasul dari Gereja Yesus Kristus Orang Suci Zaman Akhir
note: Perisytiharan ini dibaca oleh Presiden Russell M. Nelson sebagai bahagian dari pesanannya di Persidangan
  Umum Tahunan ke-190, 5 April 2020, di Salt Lake City, Utah.
paragraphs:
- Kami sesungguhnya mengisytiharkan bahawa Tuhan Bapa mengasihi anak-anak-Nya dalam setiap bangsa di dunia
  ini. Tuhan Bapa telah memberikan kita kelahiran ilahi, kehidupan yang tiada bandingannya, dan korban
  tebusan yang tidak terhingga oleh Putera-Nya Yang Dikasihi, Yesus Kristus. Dengan kuasa Bapa, Yesus
  telah bangkit kembali dan memperoleh kemenangan atas kematian. Dia ialah Juruselamat kita, Teladan kita,
  dan Penebus kita.
- Dua ratus tahun yang lalu, di waktu pagi musim bunga pada tahun 1820, Joseph Smith yang masih muda,
  ingin mengetahui gereja manakah yang harus diikuti, telah pergi ke dalam hutan untuk berdoa berdekatan
  dengan rumahnya di bahagian utara New York, Amerika Syarikat. Dia mempunyai persoalan tentang keselamatan
  jiwanya dan percaya bahawa Tuhan akan membimbingnya.
- Dengan rendah hati, kami mengisytiharkan bahawa sebagai jawapan kepada doanya, Tuhan Bapa dan Putera-Nya,
  Yesus Kristus, telah muncul kepada Joseph dan memulakan pemulihan segala sesuatu (lihat Kisah Rasul-rasul
  3:21) seperti yang dinubuatkan dalam Alkitab. Dalam penglihatan itu, dia mempelajari bahawa selepas
  kematian para Rasul yang asal, Gereja Perjanjian Baru Kristus telah hilang dari muka bumi. Joseph akan
  menjadi alat dalam mengembalikannya.
- Kami mengesahkan bahawa di bawah bimbingan Bapa dan Putera, para utusan syurgawi telah datang untuk
  mengarahkan Joseph dan menubuhkan semula Gereja Yesus Kristus. Yohanes Pembaptis yang sudah bangkit
  telah memulihkan wewenang untuk membaptis melalui pencelupan untuk pengampunan dosa-dosa. Tiga daripada
  dua belas Rasul yang asal—Petrus, Yakobus, dan Yohanes—telah memulihkan kerasulan dan kunci-kunci kuasa
  imamat. Ada yang lain juga telah datang, termasuklah Elia, yang telah memulihkan hak kuasa untuk menyatukan
  keluarga bersama selamanya dalam hubungan-hubungan kekal yang melampaui kematian.
- 'Kami seterusnya bersaksi bahawa Joseph Smith telah diberikan kurnia dan kuasa daripada Tuhan untuk
  menterjemahkan sebuah catatan kuno—Kitab Mormon: Satu Lagi Kesaksian Tentang Yesus Kristus. Halaman-halaman
  catatan kudus ini mengandungi sebuah laporan mengenai pelayanan peribadi Yesus Kristus di kalangan orang-orang
  di Hemisfera Barat sejurus selepas Kebangkitan-Nya. Ia mengajarkan tujuan kehidupan dan menjelaskan
  ajaran Kristus, yang merupakan pusat utama tujuan tersebut. Sebagai sebuah gandingan tulisan suci pada
  Alkitab, Kitab Mormon bersaksi bahawa semua umat manusia ialah putera dan puteri bagi seorang Bapa Di
  Syurga yang penyayang, bahawa Dia mempunyai rancangan ilahi bagi kehidupan kita, dan bahawa Putera-Nya,
  Yesus Kristus, berbicara hari ini seperti di zaman dahulu.'
- Kami mengisytiharkan bahawa Gereja Yesus Kristus Dari Orang Suci Zaman Akhir, yang telah diorganisasikan
  pada 6 April 1830, adalah Gereja Perjanjian Baru Kristus yang telah dipulihkan. Gereja ini ditambatkan
  pada kehidupan sempurna batu penjurunya, Yesus Kristus, dan dalam Korban Tebusan-Nya yang tidak terhingga
  dan kebangkitan-Nya yang nyata. Yesus Kristus sekali lagi telah memanggil para Rasul dan memberikan
  kepada mereka kuasa imamat. Dia menjemput kita semua untuk datang kepada Dia dan Gereja-Nya, untuk menerima
  Roh Kudus, tatacara-tatacara keselamatan, dan mendapatkan kebahagiaan yang berterusan.
- Dua ratus tahun telah berlalu sejak Pemulihan ini dimulakan oleh Tuhan Bapa dan Putera-Nya Yang Dikasihi,
  Yesus Kristus. Berjuta orang di dunia ini telah menerima pengetahuan tentang kejadian-kejadian yang
  telah dinubuatkan ini.
- Kami dengan gembiranya mengisytiharkan bahawa Pemulihan yang telah dijanjikan ini akan terus maju melalui
  wahyu yang berterusan. Bumi tidak akan pernah sama lagi, kerana Tuhan akan “menyatukan segala sesuatu
  dengan Kristus” (Efesus 1:10).
- Dengan penuh takzim dan kesyukuran, kami sebagai Para Rasul-Nya mengundang semua untuk mengetahui—seperti
  kami juga tahu—bahawa syurga itu terbuka. Kami mengesahkan bahawa Tuhan sedang memberitahu kehendak-Nya
  kepada para putera dan puteri-Nya yang dikasihi. Kami bersaksi bahawa mereka yang mengkaji pesanan Pemulihan
  dengan penuh doa dan bertindak dengan iman akan diberkati untuk memperoleh kesaksian mereka sendiri
  tentang ketuhanan dan matlamatnya untuk menyediakan dunia bagi Kedatangan Kedua Tuhan dan Juruselamat
  kita Yesus Kristus.
