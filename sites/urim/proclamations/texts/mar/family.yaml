title: कुटुंब
subtitle: जगासाठी एक घोषणा
author: अखेरच्या काळातील संतांचे, येशू ख्रिस्ताचे चर्च चे पहिले अध्यक्षपद आणि बारा प्रेषितांची परिषद
note: ही घोषणा अध्यक्ष गॉर्डन बी. हिंकले यांनी २३ सप्टेंबर १९९५ रोजी सॉल्ट लेक सिटी, युटा, येथे झालेल्या
  जनरल रिलीफ सोसायटीच्या बैठकीत त्यांच्या संदेशाचा एक भाग म्हणून वाचली होती.
paragraphs:
- आम्ही, अखेरच्या काळातील संतांचे, येशू ख्रिस्ताचे चर्च चे प्रथम अध्यक्षपद आणि बारा प्रेषितांची परिषद,
  गंभीरपणे घोषित करतो की स्त्री आणि पुरुष यांच्यातील विवाह हा परमेश्वर ह्यांची नियुक्त केलेले आहे आणि
  कुटुंब हे त्यांच्या मुलांच्या शाश्वत नशिबासाठी, निर्माणकर्त्याच्या योजनेचे केंद्रस्थान आहे.
- सर्व मानव—पुरुष आणि स्त्री—परमेश्वर ह्यांच्या प्रतिमेत निर्माण झाले आहेत. प्रत्येकजण स्वर्गातील पालकांचा
  प्रिय आत्मिक पुत्र किंवा मुलगी आहे आणि त्याप्रमाणे, प्रत्येकाचा दैवी स्वभाव आणि नशीब आहे. लिंग हे वैयक्तिक
  अपूर्व, नश्वर आणि शाश्वत ओळख आणि उद्देशाचे एक आवश्यक वैशिष्ट्य आहे.
- नश्‍वर-पूर्व क्षेत्रात, आत्मिक पुत्र-पुत्री परमेश्वर ह्यांना त्यांचा शाश्वत पिता म्हणून ओळखले आणि त्यांची
  उपासना केली आणि त्यांची योजना स्वीकारली ज्याद्वारे त्यांची मुले भौतिक शरीर प्राप्त करू शकतील आणि परिपूर्णतेकडे
  प्रगती करण्यासाठी पृथ्वीवरील अनुभव प्राप्त करू शकतील, आणि शेवटी शाश्वत जीवनाचे वारस म्हणून त्यांचे दैवी
  नशीब जाणू शकतील. आनंदाची दैवी योजना कौटुंबिक नातेसंबंधांना कबरेच्या पलीकडे कायम ठेवण्यास सक्षम करते.
  पवित्र मंदिरांमध्ये उपलब्ध पवित्र नियम आणि करारांमुळे व्यक्तींना परमेश्वर ह्यांच्या उपस्थितीकडे परत
  जाणे आणि कुटुंबांना अनंतकाळसाठी एकत्र येणे शक्य करते.
- परमेश्वर ह्यांनीआदाम आणि हव्वेला दिलेली पहिली आज्ञा पती आणि पत्नी या नात्याने, त्यांच्या पालकत्वाच्या
  संभाव्यतेशी संबंधित होती. आम्ही घोषित करतो की परमेश्वर ह्यांनी त्यांच्या मुलांसाठी पृथ्वीची संख्या वाढवण्याची
  आणि भरून काढण्याची दिलेली आज्ञा कायम आहे. आम्ही पुढे घोषित करतो की परमेश्वर ह्यांनीआज्ञा दिली आहे की
  संततीची पवित्र शक्ती केवळ पती-पत्नी म्हणून कायदेशीररित्या विवाहित असलेल्या पुरुष आणि स्त्रीमध्येच वापरली
  जावी.
- ज्या साधनांद्वारे नश्वर जीवन निर्माण केले जाते, ते दैवी नियुक्त असल्याचे, आम्ही घोषित करतो. आम्ही परमेश्वर
  ह्यांच्या शाश्वत योजनेत जीवनाच्या पवित्रतेची आणि त्याच्या महत्त्वाची पुष्टी करतो.
- पती पत्नीवर, त्यांच्या मुलांनवर आणि एकमेकांवर प्रेम आणि काळजी घेण्याची गंभीर जबाबदारी आहे. “मुले हे
  परमेश्वराचे वारस आहेत” (स्तोत्र १२७:३). पालकांचे पवित्र कर्तव्य आहे की त्यांनी आपल्या मुलांचे प्रेम
  आणि नीतिमत्तेत पालन करावे, त्यांच्या शारीरिक आणि आध्यात्मिक गरजा पूर्ण कराव्यात आणि त्यांना एकमेकांवर
  प्रेम करायला आणि त्यांची सेवा करायला शिकवावे, परमेश्वर ह्यांच्या आज्ञा पाळायला हव्यात आणि ते जिथे जिथे
  राहतील तिथे कायद्याचे पालन करणारे नागरिक बनावे. या जबाबदाऱ्या पूर्ण करण्यासाठी पती-पत्नी-आई आणि वडील,
  परमेश्वर ह्यांच्या समोर जबाबदार असतील.
- कुटुंब परमेश्वर ह्यांनी नियुक्त केले आहे. पुरुष आणि स्त्री यांच्यातील विवाह, परमेश्वर ह्यांच्या शाश्वत
  योजनेसाठी आवश्यक आहे. मुलांना, विवाहाच्या बंधनात जन्म घेण्याचा, आणि पूर्ण निष्ठेने वैवाहिक प्रतिज्ञा
  पाळणाऱ्या वडिलांकडून आणि आईकडून पालन करण्याचा अधिकार आहे. प्रभु येशू ख्रिस्ताच्या शिकवणींवर आधारित कौटुंबिक
  जीवनात आनंद मिळण्याची शक्यता जास्त असते. यशस्वी विवाह आणि कुटुंबे विश्वास, प्रार्थना, पश्चात्ताप, क्षमा,
  आदर, प्रेम, करुणा, कार्य आणि आरोग्यदायी मनोरंजनात्मक क्रियाकलापांच्या तत्त्वांवर स्थापित आणि राखली जातात.
  दैवी रचनेनुसार, वडिलांनी प्रेम आणि नीतिमत्तेने त्यांच्या कुटुंबांचे नेतृत्व करावे आणि त्यांच्या कुटुंबांसाठी
  जीवनाच्या गरजा आणि संरक्षण प्रदान करावे. आपल्या मुलांच्या पालनपोषणाची जबाबदारी प्रामुख्याने मातांवर
  असते. या पवित्र जबाबदाऱ्यांमध्ये, वडील आणि माता एकमेकांना समान भागीदार म्हणून मदत करण्यास बांधील आहेत.
  अपंगत्व, मृत्यू किंवा इतर परिस्थितींना वैयक्तिक रुपांतराची आवश्यकता असू शकते. जेव्हा गरज असेल तेव्हा
  विस्तारित कुटुंबांनी आधार द्यावा.
- आम्ही चेतावणी देतो की जे लोक पवित्रतेच्या कराराचे उल्लंघन करतात,जे जोडीदार किंवा संततीचा गैरवर्तन करतात,
  किंवा कौटुंबिक जबाबदाऱ्या पूर्ण करण्यात अयशस्वी ठरतात ते एके दिवशी परमेश्वर ह्यांच्या समोर जबाबदार धरले
  जातील. पुढे, आम्ही चेतावणी देतो की कुटुंबाचे विभाजन—व्यक्ती, समुदाय, आणि राष्ट्रांवर, प्राचीन आणि आधुनिक
  संदेष्ट्यांनी भाकीत केलेल्या संकटांना आणेल.
- आम्ही सर्वत्र जबाबदार नागरिक आणि सरकारी अधिकाऱ्यांना—कुटुंबाला समाजाचे मूलभूत एकक म्हणून राखण्यासाठी,
  आणि मजबूत करण्यासाठी तयार केलेल्या उपाययोजनांना प्रोत्साहन देण्याचे आवाहन करतो.
