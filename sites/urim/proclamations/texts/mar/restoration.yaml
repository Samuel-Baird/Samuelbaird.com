title: येशू ख्रिस्ताच्या सुवार्तेच्या परिपूर्णतेची पुनर्स्थापना
subtitle: जगासाठी द्विशताब्दी घोषणा
author: अखेरच्या काळातील संतांचे येशू ख्रिस्ताचे चर्चचे बारा प्रेषितांचे प्रथम अध्यक्षपद आणि परिषद
note: ही जाहीर घोषणा अध्यक्ष रसेल एम. नेल्सन यांनी १९० व्या वार्षिक सर्वसाधारण परिषदेत, ५ एप्रिल २०२०
  रोजी, सॉल्ट लेक सिटी, युटा येथे दिलेल्या त्यांच्या संदेशाचा एक भाग म्हणून वाचून दाखवली.
paragraphs:
- आपण प्रामाणिकपणे जाहीर करतो की परमेश्वर जगातील प्रत्येक राष्ट्रातील त्यांच्या मुलांवर प्रेम करतात. पिता
  परमेश्वर ह्यांनीआपल्याला दैवी जन्म, अतुलनीय जीवन आणि त्यांचे प्रिय पुत्राचे अनंत प्रायश्चित्त बलिदान
  दिले आहे. येशू ख्रिस्त. पिता ह्यांच्या सामर्थ्याने, येशू पुन्हा उठला आणि त्याने मृत्यूवर विजय मिळवला.
  तो आपला तारणहार, आपला आदर्श आणि आपला उद्धारकर्ता आहे.
- दोनशे वर्षांपूर्वी, १८२० मध्ये वसंत ऋतूच्या एका सुंदर सकाळी, तरुण जोसेफ स्मिथ, कोणत्या चर्चमध्ये सामील
  व्हायचे हे जाणून घेण्यासाठी, अमेरिकेतील न्यूयॉर्कमधील ग्रामीण भाग त्याच्या घराजवळ प्रार्थना करण्यासाठी
  जंगलात गेला. त्याच्या आत्म्याच्या तारणाविषयी त्याला प्रश्न होते आणि परमेश्वर त्याला मार्गदर्शन करतील
  असा त्याला विश्वास होता.
- नम्रतेने, आपण घोषित करतो की त्याच्या प्रार्थनेला उत्तर म्हणून, पिता परमेश्वर आणि त्यांचा पुत्र, येशू
  ख्रिस्त यांनी, जोसेफला दर्शन दिले आणि “सर्व गोष्टींच्या पुनर्संचयनाचे” उद्घाटन केले (प्रेषितांची कृत्ये
  ३:२१). पवित्र शास्त्रामध्ये भाकीत केल्याप्रमाणे. या दृष्टान्तात, त्याला कळले की मूळ प्रेषितांच्या मृत्यूनंतर,
  ख्रिस्ताचे नवीन करार आणि चर्च पृथ्वीवरून नष्ट झाले. त्याच्या परतफेडीत जोसेफ महत्त्वाची भूमिका बजावेल.
- आपण पुष्टी करतो की पिता आणि पुत्राच्या मार्गदर्शनाखाली, स्वर्गीय संदेशवाहक जोसेफला सूचना देण्यासाठी
  आणि येशू ख्रिस्ताच्या चर्चची पुनर्स्थापना करण्यासाठी आले. पुनरुत्थित बाप्तिस्मा करणाऱ्या योहानाने पापांच्या
  क्षमेसाठी बुडवून बाप्तिस्मा देण्याचा अधिकार पुनर्संचयित केला. मूळ बारा प्रेषितांपैकी तीन—पेत्र, याकोब
  आणि योहान—यांनी प्रेषितपद आणि याजकपदाच्या अधिकाराच्या किल्ल्या पुनर्संचयित केल्या. इतरही आले, ज्यात
  एलियासह, ज्याने मृत्यूच्या पलीकडे असलेल्या शाश्वत नातेसंबंधांमध्ये कुटुंबांना कायमचे एकत्र आणण्याचा
  अधिकार पुनर्संचयित केला
- 'आपण पुढे साक्षीदार आहोत की जोसेफ स्मिथला एका प्राचीन नोंदीचे भाषांतर करण्यासाठी परमेश्वर ह्यांची देणगी
  आणि शक्ती देण्यात आली होती: मॉर्मनचे पुस्तक—येशू ख्रिस्ताचा आणखी एक करार या पवित्र शास्त्रातल्या पानांमध्ये
  येशू ख्रिस्ताच्या पुनरुत्थानानंतर लगेचच पश्चिम गोलार्धातील लोकांमध्ये त्याच्या वैयक्तिक सेवेचा वृत्तान्त
  समाविष्ट आहे. ते जीवनाच्या उद्देशाबद्दल शिकवते आणि ख्रिस्ताच्या शिकवणीचे स्पष्टीकरण देते. जे त्या उद्देशाच्या
  केंद्रस्थानी आहे पवित्र शास्त्रामध्ये एक सहयोगी शास्त्रवचन म्हणून, मॉर्मनचे पुस्तक साक्ष देते की सर्व
  मानव हे स्वर्गातील प्रेमळ पिता ह्यांचे पुत्र आणि कन्या आहेत, की त्याच्याजवळ आपल्या जीवनासाठी दैवी योजना
  आहे आणि त्यांचे पुत्र, येशू ख्रिस्त, आजही तसेच प्राचीन काळातही बोलतो.'
- आपण जाहीर करतो की ६ एप्रिल १८३० रोजी आयोजित केलेले अखेरच्या काळातील संतांचे येशू ख्रिस्ताचे चर्च हे
  पुनर्संचयित नवीन कराराचे चर्च आहे. हे चर्च त्यांच्या मुख्य कोनशिला, येशू ख्रिस्ताच्या परिपूर्ण जीवनात
  आणि त्याच्या अनंत प्रायश्चित्त आणि शाब्दिक पुनरुत्थानात स्थित आहे. येशू ख्रिस्ताने पुन्हा एकदा प्रेषितांना
  बोलावले आहे आणि त्यांना याजकपदाचा अधिकार दिला आहे. तो आपल्या सर्वांना त्याच्याकडे आणि त्याच्या चर्चकडे
  येण्याचे आमंत्रण देतो, पवित्र आत्मा प्राप्त करण्यासाठी, उद्धाराचे विधी आणि शाश्वत आनंद प्राप्त करण्यासाठी.
- पिता परमेश्वर आणि यांचा प्रिय पुत्र येशू ख्रिस्त यांनी या पुनरुज्जीवनाची सुरुवात करून आता दोनशे वर्षे
  उलटून गेली आहेत. जगभरातील लाखो लोकांनी या भाकीत केलेल्या घटनांचे ज्ञान स्वीकारले आहे.
- आपण आनंदाने जाहीर करतो की वचन दिलेली पुनर्स्थापना सतत प्रकटीकरणाद्वारे पुढे जाते. परमेश्वर “ख्रिस्तामध्ये
  सर्व काही एकत्र करेल” म्हणून पृथ्वी पुन्हा कधीही पूर्वीसारखी राहणार नाही (इफिसकर १:१०).
- आदर आणि कृतज्ञतेने, आपण त्याचे प्रेषित या नात्याने सर्वांना आमंत्रित करतो की स्वर्ग उघडा आहे हे जाणून
  घ्या—जसे आपण करतो—आपण पुष्टी करतो की परमेश्वर त्यांचे प्रिय पुत्र आणि कन्यांकरिता त्यांची इच्छा प्रकट
  करत आहे. आपण साक्ष देतो की जे प्रार्थनापूर्वक पुनर्स्थापनेच्या संदेशाचा अभ्यास करतात आणि विश्वासाने
  कार्य करतात त्यांना त्याच्या दिव्यतेची आणि आपल्या प्रभु आणि तारणकर्ता येशू ख्रिस्ताच्या वचन दिलेल्या
  दुसऱ्या आगमनासाठी जगाला तयार करण्याच्या त्याच्या उद्देशाची स्वतःची साक्ष मिळवण्यासाठी आशीर्वाद मिळेल.
