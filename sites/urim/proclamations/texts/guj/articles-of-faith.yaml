title: શ્રદ્ધા વિષેના લેખો અંતિમ કાળ ના સંતોની ઈસુ ખ્રિસ્તની ગિરજાનો
subtitle: ''
author: ''
verses:
- n: 1
  text: અમે ભગવાન, અનંત પિતા, અને તેમના પુત્ર, ઈસુ ખ્રિસ્ત અને પવિત્ર આત્મામાં માનીએ છીએ.
  label: ૧
- n: 2
  text: અમે માનીએ છીએ કે માણસોને તેમના પોતાના પાપો માટે સજા મળશે, આદમના ઉલ્લંઘન માટે નહિ.
  label: ૨
- n: 3
  text: અમે માની એ છીએ કે ખ્રિસ્તના પ્રાયશ્ચિત દ્વારા, આખી માનવ જાતિને શુભસંદેશ ના નિયમો અને ધાર્મિક વિધિઓ
    દ્વારા પાલન કરીને બચાવી શકાય છે.
  label: ૩
- n: 4
  text: 'અમે માનીએ છીએ કે શુભસંદેશના પ્રથમ સિદ્ધાંતો અને ધાર્મિક વિધિઓ આ છે: પ્રથમ, પ્રભુ ઈસુ ખ્રિસ્તમાં
    વિશ્વાસ કરવો; બીજું, પસ્તાવો; ત્રીજું, પાપોની માફી માટે પાણીમાં ડુબાડીને બાપ્તિસ્મા લેવું; ચોથું,
    પવિત્ર આત્માની ભેટ માટે હાથ મૂકવો.'
  label: ૪
- n: 5
  text: અમે માનીએ છીએ કે માણસે ઈશ્વરની પ્રબોધવાણી દ્વારા, અને અધિકૃત દ્વારા હાથ મૂકવાથી, શુભસંદેશ નો પ્રચાર
    કરવા અને એમની ધાર્મિક વિધિઓને સંપન્ન કરવા માટે વહીવટ કરવો જોઈએ.
  label: ૫
- n: 6
  text: અમે એ જ સંગઠનમાં માનીએ છીએ જે પ્રાચીન ગિરજામાં અસ્તિત્વમાં હતી, એટલે કે પ્રેરિતો, પ્રબોધકો, પાદરીઓ,
    શિક્ષકો, શુભસંદેશના પ્રચારકો, અને વગેરે.
  label: ૬
- n: 7
  text: અમે ભાષાઓની ભેટ, પ્રબોધવાણી, પ્રકટીકરણ, દર્શનો, સાજા કરવા, ભાષાઓના અર્થઘટન વગેરેમાં માનીએ છીએ.
  label: ૭
- n: 8
  text: અમે માનીએ છીએ કે બાઇબલ એ ઈશ્વરનો શબ્દ છે જ્યાં સુધી તેનો યોગ્ય રીતે અનુવાદ થયો છે; અમે એ પણ માનીએ
    છીએ કે ર્મોમોન નું પુસ્તક એ ઈશ્વરનો શબ્દ છે.
  label: ૮
- n: 9
  text: ઈશ્વરેજે કંઈ પ્રગટ કર્યું છે, જે કંઈ તેઓ અત્યારે પ્રગટ કરે છે, તે બધું જ અમે માનીએ છીએ, અને અમે
    માનીએ છીએ કેતેઓ હજુ પણ ઈશ્વરના રાજ્યને લગતી ઘણી મહાન અને મહત્વપૂર્ણ બાબતો પ્રગટ કરશે.
  label: ૯
- n: 10
  text: અમે ઇઝરાયલના શાબ્દિક ભેગા થવામાં અને દસ વંશજોના પુનઃસ્થાપનમાં માનીએ છીએ; કે સિયોન (નવું યરુશાલેમ)
    અમેરિકન ખંડ પર બાંધવામાં આવશે; કે ખ્રિસ્ત પૃથ્વી પર વ્યક્તિગત રીતે રાજ કરશે; અને, કે પૃથ્વી નવીકરણ
    થશે અને તેની સ્વર્ગીય મહિમા પ્રાપ્ત કરશે.
  label: ૧૦
- n: 11
  text: અમે અમારા પોતાના અંતઃકરણના નિર્દેશો પ્રમાણે સર્વસમર્થ ઈશ્વરની ઉપાસના કરવાનો વિશેષાધિકાર માનીએ
    છીએ, અને બધા માણસોને એ જ વિશેષાધિકાર આપીએ છીએ, તેઓ કેવી રીતે, ક્યાં અથવા જે પણ હોય તેની ઉપાસના કરવા
    દો.
  label: ૧૧
- n: 12
  text: અમે રાજાઓ, પ્રમુખો, શાસકો અને ન્યાયાધીશોને આધીન રહેવામાં, કાયદાનું પાલન કરવામાં, તેનું સન્માન
    કરવા અને તેમાં સહયોગ કરવામાં માનીએ છીએ.
  label: ૧૨
- n: 13
  text: અમે ઈમાનદાર, સત્ય, જાતીય શુદ્ધ, પરોપકારી, સદાચારી અને સર્વ માણસો માટે ભલું કરવામાં માનીએ છીએ;
    ખરેખર, અમે એમ કહી શકીએ કે અમે પાઉલની સલાહને અનુસરીએ છીએ — અમે સર્વ બાબતોમાં વિશ્વાસ રાખીએ છીએ, અમે
    સર્વ બાબતોમાં આશા રાખીએ છીએ, અમે ઘણી બાબતો સહન કરી છે, અને આશા છે કે અમે સર્વ બાબતો સહન કરી શકીએ છીએ.
    જો કોઈ સદાચારી, સુંદર, કે સન્માનનીય કે પ્રશંસાપાત્ર હોય તો આપણે એ તમામ બાબતોને શોધતા રહીએ છીએ.
  label: ૧૩
signature: જોસેફ સ્મિથ.
