title: Сімʼя
subtitle: Проголошення світові
author: Перше Президентство і Рада Дванадцятьох Апостолів Церкви Ісуса Христа Святих Останніх Днів
note: Це проголошення було зачитано Президентом Гордоном Б. Хінклі як частину його звернення на генеральних
  зборах Товариства допомоги, що відбулися 23 вересня 1995 року в Солт-Лейк-Сіті, шт. Юта, США.
paragraphs:
- Ми, Перше Президентство і Рада Дванадцятьох Апостолів Церкви Ісуса Христа Святих Останніх Днів, урочисто
  проголошуємо, що шлюб між чоловіком і жінкою встановлено Богом і що сімʼя є центральною частиною Творцевого
  плану для вічної долі Його дітей.
- Усі люди — чоловіки й жінки — створені за образом Бога. Кожна людина є улюбленим духовним сином або
  улюбленою духовною дочкою небесних батьків і, будучи такою, має божественну природу і долю. Стать є
  невідʼємною властивістю кожної особи у доземному, смертному і вічному житті, і саме нею обумовлюється
  її призначення.
- У доземному житті духовні сини й дочки знали Бога як свого Вічного Батька, поклонялися Йому і прийняли
  Його план, за яким Його діти могли отримувати фізичні тіла й набувати земного досвіду, щоб розвиватися
  до досконалості і зрештою реалізувати свою божественну долю спадкоємців вічного життя. Божественний
  план щастя уможливлює продовження сімейних стосунків після смерті. Священні обряди, які виконуються
  у святих храмах, і священні завіти, які там укладаються, дають можливість людям повернутися у присутність
  Бога, а сімʼям — обʼєднатися навічно.
- Перша заповідь, яку Бог дав Адамові та Єві, стосувалася здатності бути батьками, яку вони мали як чоловік
  і дружина. Ми проголошуємо, що Божа заповідь Його дітям — розмножуватися і наповнювати землю — залишається
  в силі. Більш того, ми проголошуємо, що Бог заповідав, аби священні сили породження застосовувалися
  тільки між чоловіком і жінкою, законно одруженими як чоловік і дружина.
- Ми проголошуємо, що шлях, яким створюється смертне життя, встановлено Богом. Ми заявляємо про священність
  життя і його важливість у Божому вічному плані.
- Чоловік і дружина мають урочисту відповідальність любити одне одного та своїх дітей і піклуватися одне
  про одного, а також про своїх дітей. “Діти — спадщина Господня” (Псалом 127:3). Батьки мають священний
  обовʼязок виховувати своїх дітей у любові й праведності, забезпечувати їхні фізичні й духовні потреби
  і вчити їх любити одне одного й служити одне одному, дотримуватися заповідей Божих і бути законослухняними
  громадянами, де б вони не жили. Чоловіки і дружини — матері і батьки — будуть відповідати перед Богом
  за виконання цих зобовʼязань.
- Сімʼю встановлено Богом. Шлюб між чоловіком і жінкою є невідʼємною частиною Його вічного плану. Діти
  мають право народжуватися в узах шлюбу і виховуватися батьком і матірʼю, які з цілковитою вірністю шанують
  шлюбні обітниці. Щастя в сімейному житті найпевніше досягається, якщо жити за вченнями Господа Ісуса
  Христа. Запорукою успішності і збереження шлюбів та сімей є дотримання принципів віри, молитви, покаяння,
  прощення, поваги, любові, співчуття, праці, а також здорового відпочинку. За божественним задумом, батько
  має головувати над своєю сімʼєю в любові й праведності; він відповідає за забезпечення своєї сімʼї всім
  необхідним та її захист. Мати насамперед відповідальна за виховання їхніх дітей. Як рівноправні партнери,
  матері і батьки зобовʼязані допомагати одне одному у виконанні цих священних обовʼязків. Через недієздатність,
  смерть чи інші обставини може виникнути потреба в індивідуальній адаптації цих їхніх ролей. Близькі
  родичі мають надавати підтримку, коли в цьому виникає необхідність.
- Ми попереджаємо, що особи, які порушують завіти цнотливості, які жорстоко поводяться зі своїм подружжям
  чи дітьми або які не виконують своїх сімейних обовʼязків, одного дня будуть відповідати за це перед
  Богом. Більш того, ми попереджаємо, що руйнування сімʼї принесе окремим людям, суспільствам і народам
  біди, які провіщали давні й сучасні пророки.
- Ми закликаємо свідомих громадян та відповідальних урядових службовців усього світу сприяти заходам,
  спрямованим на збереження і зміцнення сімʼї як основного осередку суспільства.
