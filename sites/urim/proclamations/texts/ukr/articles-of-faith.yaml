title: Уложення віри
subtitle: Церкви Ісуса Христа Святих Останніх Днів
author: ''
verses:
- n: 1
  text: Ми віримо в Бога, Вічного Батька, і в Його Сина Ісуса Христа, і в Святого Духа.
- n: 2
  text: Ми віримо, що людей буде покарано за їхні власні гріхи, а не за Адамову провину.
- n: 3
  text: Ми віримо, що завдяки Спокуті Христа все людство може бути спасенним через послушність законам
    і обрядам євангелії.
- n: 4
  text: 'Ми віримо, що основними принципами і обрядами євангелії є: перше—віра в Господа Ісуса Христа;
    друге—покаяння; третє—хрищення зануренням для відпущення гріхів; четверте—рукопокладання для надання
    дару Святого Духа.'
- n: 5
  text: Ми віримо, що чоловік мусить бути покликаний Богом через пророцтво й рукопокладання тих, хто має
    повноваження, щоб проповідувати євангелію і виконувати її обряди.
- n: 6
  text: 'Ми віримо в той самий устрій, що був у первинній Церкві, а саме: в апостолів, пророків, пасторів,
    учителів, євангелістів і так далі.'
- n: 7
  text: Ми віримо в дар мов, пророцтва, одкровення, видінь, зцілення, тлумачення мов і так далі.
- n: 8
  text: Ми віримо, що Біблія—це слово Боже настільки, наскільки правильно її перекладено; ми також віримо,
    що Книга Мормона—це слово Боже.
- n: 9
  text: Ми віримо всьому, що Бог відкрив, усьому, що Він відкриває тепер, і ми віримо, що Він відкриє
    ще багато великого і важливого стосовно Царства Божого.
- n: 10
  text: Ми віримо в дійсне збирання Ізраїля і відновлення Десяти колін; що Сіон (Новий Єрусалим) буде
    побудовано на Американському континенті; що Христос буде особисто царювати на Землі, і що Землю буде
    відновлено, і вона одержить свою райську славу.
- n: 11
  text: 'Ми залишаємо за собою право поклонятися Всемогутньому Богові так, як нам каже власна совість,
    і визнаємо за всіма людьми те саме право: нехай вони поклоняються як, де і чому вони хочуть.'
- n: 12
  text: Ми віримо в підлеглість монархам, президентам, правителям і урядовцям, дотримуючись закону, шануючи
    і підтримуючи його.
- n: 13
  text: 'Ми віримо, що повинні бути чесними, вірними, цнотливими, доброзичливими, чеснотними і творити
    добро всім людям; справді, ми можемо сказати, що слідуємо настановленню апостола Павла: ми віруємо
    в усе, сподіваємося всього; ми багато чого перетерпіли і сподіваємося, що зможемо перетерпіти все.
    Якщо є щось чеснотне, чудове, славнозвісне, гідне похвали—ми прагнемо цього.'
signature: Джозеф Сміт.
