title: Biteni ya Bondimi
subtitle: ya Eklezia ya Yesu Klisto ya Basantu ba Mikolo mya Nsuka
author: ''
verses:
- n: 1
  text: Tondimelaka Nzambe, Tata ya Seko, mpe Mwana na Ye, Yesu Klisto, mpe Molimo Mosantu.
- n: 2
  text: Tondimaka ete bato bakozwa etumbu mpo na masumu na bango moko, kasi mpo na bobuki mobeko ya Adama
    te.
- n: 3
  text: Tondimaka ete na nzela ya Bomikabi ya Klisto, bato nyonso bakoki kobikisama, na kotosaka mibeko
    mpe makuli ya Nsango malamu.
- n: 4
  text: 'Tondimaka ete mabongisi mpe makuli ya yambo ya Nsango malamu ezali: ya yambo, Bondimi na Nkolo
    Yesu Klisto; ya mibale, Boyamboli; ya misato, Libatisi na bozindisi na mai mpo na bolimbisi ya masumu;
    ya minei, kotiama maboko mpo na likabo ya Molimo Mosantu.'
- n: 5
  text: Tondimaka ete moto asengeli kobiangama na Nzambe, na nzela ya lisakoli, mpe na kotiama maboko
    na baoyo bazali na likoki, mpo na koteya Nsango malamu mpe kosala makuli na yango.
- n: 6
  text: Tondimaka eyangeli se moko oyo ezalaki kati na Eklezia ya Kala, elingi koloba, bapostolo, baprofeta,
    bakengeli, bateyi, balakisi, mpe bongo na bongo.
- n: 7
  text: Tondimaka likabo ya koloba minoko, bosakoli, emoniseli, mamoni, kobikisa bokono, kolimbola minoko,
    mpe bongo na bongo.
- n: 8
  text: Tondimaka ete Biblia ezali liloba ya Nzambe soki ebongolami malamu; tondimaka lisusu ete Buku
    ya Mormon ezali liloba ya Nzambe.
- n: 9
  text: Tondimaka oyo nyonso Nzambe asila kobimisa, nyonso oyo Azali kobimisa sikawa, mpe tondimaka ete
    Akobimisa lisusu makambo minene mpe ya motuya matali Bokonzi ya Nzambe.
- n: 10
  text: Tondimaka bosangani mpenza ya Yisalaele mpe bozongisi ya Mabota Zomi; ete Siona (Yelusaleme ya
    Sika) ekotongama na mokili ya Amerika; ete Klisto ye moko akoyangela likolo ya mabele; mpe, ete mabele
    makozongisama sika mpe makozwa nkembo na yango ya paladiso.
- n: 11
  text: Tosengi litomba na biso ya kokumbamela Nzambe ya Bokasi bonso engebene na masengami ya mayele
    ya motema na biso moko, mpe kopesaka nzela ya litomba se moko wana na bato nyonso, ete tika bakumbamela
    na lolenge, na esika, mpe nini bakoki kopona.
- n: 12
  text: Tondimaka kozala na nse ya bokonzi ya bakonzi, bakambi, bayangeli, mpe basambisi, na kotosaka,
    kokumisaka, mpe kosungaka mobeko.
- n: 13
  text: Tondimaka kozala sembo, solo, peto, boboto, malamu, mpe kosalaka bolamu na bato nyonso; zambi,
    tokoki koloba ete tozali kolanda mabondeli ya Paulo—Tondimaka makambo nyonso, tolikyi makambo nyonso,
    toyikaki mpiko na makambo ebele, mpe tolikyi ete tozali na makoki ya kotia molende na makambo nyonso.
    Soki ezali na eloko ya malamu, to ya kitoko to ya lisolo malamu to ya lokumu, tokoluka biloko oyo.
signature: Joseph Smith.
