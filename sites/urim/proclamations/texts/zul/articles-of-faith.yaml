title: ImiBhalo yoKholo
subtitle: yeBandla likaJesu Kristu labaNgcwele beziNsuku zokuGcina
author: ''
verses:
- n: 1
  text: Sikholwa ku Nkulunkulu, uBaba waPhakade, nakuyo iNdodana Yakhe, uJesu Kristu, naku Moya oNgcwele.
- n: 2
  text: Sikholwa wukuthi abantu bayojeziswa nge zono zabo uqobo, futhi hhayi ngesiphambeko sika-Adamu.
- n: 3
  text: Sikholwa wukuthi nge Nhlawulo kaKristu, bonke abantu banga sindiswa, ngoku hlonipha imithetho
    ne zimiso zeVangeli.
- n: 4
  text: 'Sikholwa wukuthi imigomo ne zimiso zokuqala zeVangeli yilezi: okokuqala, wuKholo eNkosini uJesu
    Kristu; okwesibili, wukuPhenduka; okwesithathu, ukuBhabhadiswa ngokucwiliswa ukuze ku thethelelwe
    izono; okwesine, ukuBekwa izandla ukuze uthole isipho soMoya oNgcwele.'
- n: 5
  text: Sikholwa wukuthi indoda kufanele ibizwe ngokukaNkulunkulu, ngokwe siphrofetho, nangokubekwa izandla
    yilabo abase gunyeni, ukuba ishumayele iVangeli futhi yenze izimiso zalo.
- n: 6
  text: Sikholelwa ohlelweni olufanayo nalolo olwalukhona eBandleni laseNdulo, okungukuthi, abaphostoli,
    abaphrofethi, abashumayeli, abafundisi, abavangeli, njalo njalo.
- n: 7
  text: Sikholelwa esiphweni se zilimi, soku phrofetha, se sambulo, se mibono, soku philisa, soku hunyushwa
    kwezilimi, njalo njalo.
- n: 8
  text: Sikholwa wukuthi iBhayibheli li yizwi likaNkulunkulu kangangoba lihunyushwe ngokuyikho; sikholwa
    futhi wukuthi iNcwadi kaMormoni iyizwi likaNkulunkulu.
- n: 9
  text: Siyakukholwa konke lokho uNkulunkulu asekwa mbulile, konke lokho Yena akwembula manje, futhi sikholwa
    wukuthi Yena usazo kwembula izinto eziningi nezinkulu nezibalulekile ngokuphathelene noMbuso kaNkulunkulu.
- n: 10
  text: Sikholelwa ekuqoqweni kwangempela kuka-Israyeli nasekubuyiselweni kwe Zizwana eziyiShumi; ukuthi
    iSiyoni (iJerusalema eNtsha) izokwakhiwa phezu kwezwekazi iMelika; ukuthi uKristu uzo busa yena uqobo
    emhlabeni; futhi, nokuthi umhlaba uzo kwenziwa musha futhi ube ne simo esifana ne paradesi.
- n: 11
  text: Sazi ukuthi ilungelo lokukhonza uNkulunkulu uMninimandla Onke ngoku tshelwa ngo nembeza bethu
    lingelethu, futhi sivumela bonke abantu ukuba babe nelungelo elifanayo, banga khonza ngendlela abathanda
    ngayo, nalapho bethanda khona, noma lokho abakuthandayo.
- n: 12
  text: Sikholelwa ekubeni ngaphansi kwamakhosi, omongameli, ababusi, futhi nezimantshi, ekuthobeleni,
    ekuhlonipheni, nasekusekeleni umthetho.
- n: 13
  text: Sikholelwa ekubeni sithembeke, ekubeni neqiniso, ebumsulweni, ekubeni mnene, ekulungeni, nase
    kwenzeni okuhle kubo bonke abantu; impela, singasho ukuthi silandela umyalelo kaPawulu—Sikholwa ezintweni
    zonke, sethemba izinto zonke, sesi bekezelele izinto eziningi, futhi sethemba ukuthi sizokwazi uku
    bekezelela zonke izinto. Uma kukhona noma yini elungile, ethandekayo, noma enobuntu noma encomekayo,
    sizama ukuzithola lezi zinto.
signature: Joseph Smith.
