title: Umndeni
subtitle: Isimemezelo Emhlabeni Wonke
author: UbuMongameli bokuQala noMkhandlu wabaPhostoli abayiShumi naMbili beBandla likaJesu Kristu labaNgcwele
  beziNsuku zokuGcina
note: Lesi simemezelo safundwa nguMongameli uGordon B. Hinckley njengengxenye yenkulumo yakhe ngoMhlangano
  oMkhulu weNhlangano yoSizo yabesiFazane owawubanjelwe eSalt Lake City ngomhlaka 23 kuSepthemba, 1995.
paragraphs:
- Thina, njengobuMongameli bokuQala noMkhandlu wabaPhostoli abayiShumi naMbili beBandla likaJesu Kristu
  labaNgcwele beziNsuku zokuGcina, sikwazisa ngesizotha ukuthi umshado phakathi kwendoda nomfazi umiswe
  nguNkulunkulu nokuthi umndeni ubaluleke kakhulu ngokuphathelene nohlelo loMdali lwalokho abantwana Bakhe
  abadalelwe kona ingunaphakade.
- Bonke abantu—owesilisa nowesifazane—badalwe ngomfanekiso kaNkulunkulu. Umuntu ngamunye uyindodana noma
  yindodakazi ethandekayo yomoya ezalwa ngabazali basezulwini, futhi njengamadodana namadodakazi anobunjalo
  bukaNkulunkulu futhi kunokwenzeka babe njeNgaye. Ubulili buyisimilo esifunekayo somuntu ngamunye empilweni
  eyandulela eyasemhlabeni, eyasemhlabeni, nokuba yibo uqobo kwaphakade nenhloso.
- Empilweni eyandulela eyasemhlabeni, amadodana namadodakazi omoya ayemazi futhi emkhonza uNkulunkulu
  njengoYise waPhakade futhi emukela uhlelo Lwakhe okuthi ngalo, abantwana Bakhe babengathola umzimba
  wenyama namathambo futhi bazuze ukuzibonela nokuzizwela ngokwabo emhlabeni ukuze baqhubekele phambili
  baze bapheleliswe futhi ekugcineni bakwazi ukufeza lokho abadalelwe khona ngokukaNkulunkulu njengezindlalifa
  zokuphila okuphakade. Uhlelo lukaNkulunkulu lwenjabulo luvumela ubudlelwano bomndeni buqhubeke emva
  kokufa. Izimiso nezivumelwano ezingcwele ezitholakala emathempelini angcwele zenza ukuba umuntu ngamunye
  akwazi ukubuyela lapho kukhona khona uNkulunkulu futhi nokuthi imindeni ihlanganiswe ingunaphakade.
- Umyalelo wokuqala uNkulunkulu awunika u-Adamu no-Eva wawuhlangene nalokho okwakungenzeka ukuba babe
  ngabazali njengendoda nomfazi. Siyasho ukuthi umyalelo kaNkulunkulu wabantwana Bakhe wokuba bande bagcwalise
  umhlaba usamile namanje. Siyasho futhi ukuthi uNkulunkulu uyale ukuthi amandla angcwele okwenza abantwana
  kufanele asetshenziswe kuphela phakathi kwendoda nowesifazane abashade ngokusemthethweni njengendoda
  nomfazi.
- Siyasho ukuthi indlela impilo yasemhlabeni edalwe ngayo imiswe nguNkulunkulu. Siyaqinisekisa ukuthi
  impilo ingcwele futhi nokuthi lobo bungcwele bubalulekile ngokuphathelene nohlelo lwaphakade lukaNkulunkulu.
- Indoda nomfazi banomthwalo ongcwele wokuba bathandane futhi banakekelane ngokunjalo nabantwana babo.
  “Abantwana bayifa elivela kuJehova” (AmaHubo 127:3). Abazali banesibopho esingcwele sokukhulisa abantwana
  babo ngothando nangokulunga, sokubanika izidingo zabo zenyama nezomoya, futhi nesokubafundisa ukuthandana
  nokusizana, bagcine imiyalelo kaNkulunkulu, futhi nokuba bahloniphe imithetho yezwe labo noma yikuphi
  lapho behlala khona. Abayeni nabafazi—omama nobaba—kuyodingeka baziphendulele kuNkulunkulu mayelana
  nokufeza lezi zibopho.
- Umndeni umiswe nguNkulunkulu. Umshado phakathi kwendoda nowesifazane ubaluleke kakhulu ngokuphathelene
  nohlelo Lwakhe lwaphakade. Abantwana banelungelo lokuzalelwa emshadweni, nokuba bakhuliswe ngabazali
  abahlonipha izifungo zomshado ngokwethembeka okuphelele. Injabulo empilweni yomndeni kunokwenzeka ibe
  khona uma inesisekelo sezimfundiso zeNkosi uJesu Kristu. Imishado nemindeni enempumelelo imiswa futhi
  igcinwe ngezimfundiso zokukholwa, umkhuleko, ukuphenduka, ukuxolelana, ukuhloniphana, uthando, ukuzwelana,
  ukusebenza ngokunjalo nezindlela ezinhle zokuziphumulela. NgokukaNkulunkulu, obaba kufanele bengamele
  imindeni yabo ngothando nangokulunga futhi banomthwalo wokondla imindeni yabo ngezidingo zempilo nokuyivikela.
  Omama banomthwalo omkhulu wokukhulisa abantwana. Kulemithwalo engcwele, obaba nomama banesibopho sokuba
  basizane njengabaganene abalinganayo. Ukukhubazeka, ukufa, noma ezinye izimo zingadinga kube noshintsho
  mayelana nalemithwalo. Ezinye izihlobo nazo kufanele zelekelele uma kunesidingo.
- Siyexwayisa ukuthi labo abephula izivumelwano zobumsulwa, abaphatha kabi labo abaganene nabo noma abantwana,
  noma abehlulekayo ukufeza imithwalo eqondene nomndeni ngelinye ilanga kuyofanele baziphendulele phambi
  kukaNkulunkulu. Siyexwayisa futhi ukuthi ukuhlakazeka komndeni kuzoletha usizi olubikezelwe ngabaphrofethi
  basendulo nabamanje kumuntu ngamunye, emiphakathini nasezizweni.
- Sinxusa zonke izakhamuzi nabaphathi zikhundla kohulumeni zonke izindawo ukuba bathuthukise leyo mizamo
  okuhloswe ngayo ukuba kugcinwe futhi kuqiniswe umndeni njengengxenye ebalulekile yesizwe.
