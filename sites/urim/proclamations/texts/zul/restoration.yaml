slug: restoration
language: zul
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=zul
retrieved: '2026-11-02'
title: UkuBuyiselwa kweVangeli likaJesu Kristu ngokuPhelele
subtitle: IsiMemezelo semiNyaka engamaKhulu amaBili esibhekiswe emHlabeni
author: UbuMongameli bokuQala nomKhandlu wabaPhostoli abaliShumi naMbili weBandla likaJesu Kristu labaNgcwele
  beziNsuku zokuGcina
note: Lesi simemezelo safundwa nguMongameli uRussell M. Nelson njengengxenye yomyalezo wakhe weNgqungquthela
  Jikelele yeminyaka yonke ye-190, ngo-Ephreli 5, 2020, eSalt Lake City, e-Utah.
paragraphs:
- Sikwazisa ngesizotha ukuthi uNkulunkulu uyabathanda abantwana Bakhe bezizwe zonke zomhlaba. UNkulunkulu
  uBaba usinikeze ukuzalwa kwasezulwini, impilo engenakufaniswa nalutho, nomnikelo ohlawulayo ongenakuphela
  weNdodana Yakhe eThandekayo, uJesu Kristu. Ngamandla kaBaba, uJesu wavuka futhi wanqoba ukufa. UnguMsindisi
  wethu, uyisiBonelo sethu, noMhlengi wethu.
- Eminyakeni engamakhulu amabili edlule, ngokusa kwentwasahlobo yangonyaka ka-1820, uJoseph Smith esemncane,
  efuna ukwazi ukuthi wayengalandela liphi ibandla, waya ehlathini ukuyokhuleka maduzane nakubo esifundeni
  saseNew York esisenyakatho, eMelika. Wayenemibuzo emayelana nokusindiswa komphefumulo wakhe futhi wayethemba
  ukuthi uNkulunkulu wayezomnika umyalelo ngalokho.
- Ngesizotha, siyakwazisa ukuthi ukuphendula umbuzo wakhe, uNkulunkulu uBaba neNdodana Yakhe, uJesu Kristu,
  bavela kuJoseph futhi baqala “[u]kubuyiselwa kwakho konke” (IzEnzo 3:21) njengoba kubikezeliwe eBhayibhelini.
  Kulombono, wafunda ukuthi emva kokufa kwabaPhostoli bokuqala, iBandla likaKristu leThestamente Elisha
  lalahleka emhlabeni. UJoseph wayezoba wusizo ekubuyiselweni kwalo.
- Siyakuqinisekisa ukuthi ngaphansi kokuyalelwa nguBaba neNdodana, izithunywa zasezulwini zeza ukuzoyala
  uJoseph nokuzomisa kabusha iBandla likaJesu Kristu. UJohane umBhabhadisi osevukile kwabafileyo wabuyisela
  igunya lokubhabhadisa ngokucwiliswa ukuze kuthethelelwe izono. AbaPhostoli abathathu kulabo bokuqala—uPetru,
  uJakobe noJohane—babuyisela ubuphostoli nezikhiye zegunya lobuphristi. Nabanye bafika futhi, okubalwa
  kubo u-Eliya, owabuyisela igunya lokuhlanganisa imindeni ndawonye ingunaphakade kubudlelwano baphakade
  obudlula ukufa.
- 'Siyafakaza futhi ukuthi uJoseph Smith wanikezwa isipho namandla kaNkulunkulu ukuba ahumushe umbhalo
  wasemandulo: iNcwadi kaMormoni—Elinye iThestamente likaJesu Kristu. Amakhasi alombhalo ongcwele aqukethe
  indaba yobufundisi bukaJesu Kristu phakathi kwabantu ababeseNtshonalanga emva koVuko Lwakhe. Lendaba
  ifundisa ngenhloso yempilo futhi ichaza imfundiso kaKristu, okuyiyona ebalulekile kuleyo nhloso. Njengombhalo
  ongcwele ohambisana neBhayibheli, iNcwadi kaMormoni ifakaza ngokuthi bonke abantu bangamadodana namadodakazi
  kaBaba oseZulwini onothando, nokuthi unoHlelo lwasezulwini ngezimpilo zethu, nokuthi iNdodana Yakhe,
  uJesu Kristu, iyakhuluma namuhla njengasezinsukwini zakudala.'
- Siyasho ukuthi IBandla likaJesu Kristu labaNgcwele beziNsuku zokuGcina, elahlelwa ngo-Ephreli 6, 1830,
  yiBandla likaKristu leThestamente Elisha elibuyiselwe. Leli Bandla lizinze empilweni kaJesu Kristu enokulunga
  okuphelele, oyitshe legumbi leBandla, nakwiNhlawulo Yakhe enganakuphela nasoVukweni Lwakhe lwangempela.
  UJesu Kristu usephinde wabiza abaPhostoli futhi wabanikeza igunya lobuphristi. Usimema sonke ukuba size
  Kuye naseBandleni Lakhe, ukuba siphiwe uMoya oNgcwele, izimiso zensindiso, nokuba sithole intokozo engapheli.
- Sekudlule iminyaka engamakhulu amabili manje selokhu ukuBuyiselwa kwaqalwa nguNkulunkulu uBaba neNdodana
  Yakhe eThandekayo, uJesu Kristu. Izigidi emhlabeni wonke zilamukele ulwazi lwalezi zehlakalo okwaphrofethwa
  ngazo.
- Sikusho ngenjabulo ukuthi ukuBuyiselwa okwakuthenjisiwe kuyaqhubheka ngesambulo esiqhubekayo. Umhlaba
  awusoze uphinde ufane, ngoba uNkulunkulu “[uzo]hlanganis[a] ndawonye kuKristu konke” (Kwabase-Efesu
  1:10).
- Ngenhlonipho nangokubonga, thina njengabaPhostoli Bakhe simema bonke ukuba bazi—njengoba nathi sazi—ukuthi
  amazulu avulekile. Siyaqinisekisa ukuthi uNkulunkulu wazisa intando Yakhe ngamadodana nangamadodakazi
  Akhe athandekayo. Siyafakaza ukuthi labo abafunda umyalezo wokuBuyiselwa ngomkhuleko futhi benze abakwenzayo
  ngokholo bazobusiswa ngokuthola ubufakazi bokuthi lokhu kuBuyiselwa kungokwasezulwini nokuthi inhloso
  yakho wukulungiselela umhlaba ukuba ulungele ukuZa kwesiBili kweNkosi noMsindisi wethu, uJesu Kristu.
