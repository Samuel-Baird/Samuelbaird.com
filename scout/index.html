<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1115">
<title>Scout Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.6 var(--font-sans)}
a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}
.rail{max-width:56rem;margin:0 auto;padding:32px 16px 64px}
h1{font:600 clamp(1.8rem,5vw,2.6rem)/1.15 var(--font-serif);margin:0 0 8px}
.eyebrow{color:var(--accent);margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 8px}
select,label{font:500 .95rem var(--font-sans);color:var(--foreground)}
select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;min-height:40px}
.summary{color:var(--muted);margin:0 0 24px}
.lead{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--radius);padding:14px;margin:0 0 12px}
@media (min-width:640px){.lead{grid-template-columns:140px minmax(0,1fr);gap:18px;padding:16px 18px}}
.thumb{display:block;text-decoration:none;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:var(--muted-soft);border:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;width:100%;height:100%;color:var(--muted);font:600 1.6rem var(--font-serif);text-align:center}
.ph small{display:block;font:500 .68rem var(--font-sans);margin-top:2px}
.lead.dead{opacity:.6}
.sec{margin:28px 0 0}
.sec>h2{display:flex;align-items:baseline;gap:10px;font:600 1.35rem/1.2 var(--font-serif);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sec>h2 small{font:500 .85rem var(--font-sans);color:var(--muted)}
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;margin:0 0 8px}
.lead.alert{border-left-color:var(--honey)}
.lead h3{font:600 1.15rem/1.3 var(--font-serif);margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;color:var(--muted);margin:0 0 6px}
.price{color:var(--foreground);font-weight:600}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-right:6px}
.tag.al{border-color:var(--honey);color:var(--honey)}
.tag.uv{border-color:#8a5a5a;color:#d99}
.tag.ok{border-color:#4f7d5a;color:#9c9}
.notes{margin:6px 0 0;font-size:.92rem}
.links{margin:6px 0 0;font-size:.9rem}
#extra h3{font:600 .82rem var(--font-sans);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:32px 0 8px}
ul.plain{margin:0;padding-left:20px;color:var(--muted)}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main class="rail">
<p class="eyebrow">Collector scout</p>
<h1>Leads of the day</h1>
<div class="bar"><label for="day">Day</label><select id="day"></select><label><input type="checkbox" id="alerts"> Alerts only</label></div>
<p class="summary" id="summary">Loading…</p>
<div id="list"></div>
<div id="extra"></div>
</main>
<script>
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=(u)=>/^https?:\/\//i.test(u)?esc(u):'#';
let DATA;
const ORDER=['Deseret Alphabet','LDS sacrament ware','Early LDS print','Anti-Mormon literature','Portuguese-language LDS','LDS relics & art','Luther & Reformation','Historic Christianity','Communion vessels (pre-1900)','Wants'];
const DEAD=new Set(['sold','gone','ended']);
const STATUS={sold:'Sold',gone:'Listing gone',ended:'Ended',live:'Live'};
const initials=(c)=>String(c||'?').split(/[^A-Za-z]+/).filter(Boolean).slice(0,2).map((w)=>w[0]).join('').toUpperCase();
function card(l){
  const ph=`<span class="ph"><span>${esc(initials(l.category))}<small>no photo</small></span></span>`;
  const img=l.image&&/^https:\/\//i.test(l.image)?`<img src="${esc(l.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createRange().createContextualFragment(this.dataset.ph))" data-ph="${esc(ph)}">`:ph;
  const st=DEAD.has(l.status)?`<span class="tag uv">${esc(STATUS[l.status]||l.status)}</span>`:(l.verified?'<span class="tag ok">Verified live</span>':'<span class="tag uv">Unverified</span>');
  return `<article class="lead${l.alert?' alert':''}${DEAD.has(l.status)?' dead':''}">
    <a class="thumb" href="${safe(l.url)}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true">${img}</a>
    <div>
    <div>${l.alert?'<span class="tag al">Alert</span>':''}${st}</div>
    <h3><a href="${safe(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a></h3>
    <p class="meta"><span class="price">${esc(l.price)}</span><span>${esc(l.seller)}</span>${l.date?`<span>${esc(l.date)}</span>`:''}${l.action?`<span>Suggested: ${esc(l.action)}</span>`:''}</p>
    ${l.notes?`<p class="notes">${esc(l.notes)}</p>`:''}
    ${(l.more_urls||[]).length?`<p class="links">Also: ${l.more_urls.map((u)=>`<a href="${safe(u)}" target="_blank" rel="noopener noreferrer">${esc(u.replace(/^https?:\/\/(www\.)?/,''))}</a>`).join(' · ')}</p>`:''}
    </div>
  </article>`;
}
function render(){
  const run=DATA.runs.find((r)=>r.date===$('#day').value);
  if(!run){$('#summary').textContent='No runs yet.';return;}
  const only=$('#alerts').checked;
  const leads=(run.leads||[]).filter((l)=>!only||l.alert);
  $('#summary').textContent=`${run.summary||''}${run.searches?` · ${run.searches} searches`:''}`;
  const groups=new Map();
  ORDER.forEach((c)=>groups.set(c,[]));
  leads.forEach((l)=>{const c=l.category||'Other';if(!groups.has(c))groups.set(c,[]);groups.get(c).push(l);});
  const rank=(l)=>(DEAD.has(l.status)?2:0)+(l.alert?0:1);
  const secs=[...groups].filter(([,v])=>v.length).map(([c,v])=>[c,v.sort((a,b)=>rank(a)-rank(b))]);
  const slug=(c)=>c.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  $('#list').innerHTML=secs.length?`<nav class="toc">${secs.map(([c,v])=>`<a href="#${slug(c)}">${esc(c)} (${v.length})</a>`).join('')}</nav>`+secs.map(([c,v])=>`
  <section class="sec" id="${slug(c)}"><h2>${esc(c)} <small>${v.length}</small></h2>${v.map(card).join('')}</section>`).join(''):'<p class="empty">No leads for this day.</p>';
  let x='';
  if((run.nothing_found||[]).length)x+=`<h3>Searched, nothing found</h3><ul class="plain">${run.nothing_found.map((s)=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  if((run.coverage_gaps||[]).length)x+=`<h3>Couldn't read</h3><ul class="plain">${run.coverage_gaps.map((s)=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  if(run.issue)x+=`<h3>Issue</h3><p><a href="${safe(run.issue)}" target="_blank" rel="noopener noreferrer">${esc(run.issue)}</a></p>`;
  $('#extra').innerHTML=x;
}
fetch('/scout/leads.json',{cache:'no-store'}).then((r)=>r.json()).then((d)=>{
  DATA=d; d.runs.sort((a,b)=>b.date.localeCompare(a.date));
  $('#day').innerHTML=d.runs.map((r)=>`<option value="${esc(r.date)}">${esc(r.date)} · ${(r.leads||[]).length} leads</option>`).join('');
  const want=new URLSearchParams(location.search).get('date');
  if(want&&d.runs.some((r)=>r.date===want))$('#day').value=want;
  render();
}).catch(()=>{$('#summary').textContent='Could not load leads.json.';});
$('#day').addEventListener('change',render);$('#alerts').addEventListener('change',render);
</script>
</body>
</html>
