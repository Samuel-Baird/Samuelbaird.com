# Master reference list of every language churchofjesuschrist.org offers a
# site in, with the "site code" the Church's own ?lang= query parameter uses
# for that language. Scraped from https://www.churchofjesuschrist.org/languages?lang=eng
# on 2026-07-12 (150 languages at that time) -- re-scrape and update this
# file if the Church adds or removes a language, rather than hand-editing
# entries beyond that.
#
# This is a reference list, not a status list: appearing here means the
# Church offers a site in that language, not that the vault has started
# work on it. See progress/languages/registry.yaml for which languages the
# vault is actively tracking (a small subset of this list), and
# progress/languages.md for the human-readable dashboard built from both.
#
# `site_code` is the exact code used in ?lang=<code> on the Church site and
# is what talks/<language>/**/*.md's `language:` frontmatter field should
# use. It is NOT always the same as the 2-letter "tool code" used by
# schema/glossary/glossary-<lang>.md, npm run quote, and the parallel corpus (e.g.
# Portuguese is site_code "por" but tool code "pt") -- see
# "Two codes, one language" in docs/translation.md.
#
# name is the Church's own in-language site name, exactly as it appears in
# the language picker -- not translated, not transliterated.
#
# SIGNED LANGUAGES ARE OUT OF SCOPE. American Sign Language (ase), Auslan
# (asf), and British Sign Language (bfi) below are marked `signed: true` --
# do not scrape, translate, or otherwise bootstrap them. See "Signed
# languages are out of scope" in docs/translation.md for why: a signed
# language has no standard written orthography, so any conference-talk page
# scraped as running prose "in" one of these codes is not real content in
# that language -- it is the Church's English-caption/subtitle text served
# alongside the interpreted video (this vault previously discovered and
# removed 279 files wrongly committed as Auslan on this basis; see
# progress/languages/registry.yaml history). If the Church adds another
# signed language to its site list, mark it `signed: true` here too instead
# of registering it in progress/languages/registry.yaml.

