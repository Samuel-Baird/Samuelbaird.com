title: विश्वास के अनुच्छेद
subtitle: अंतिम-दिनों के संतों का यीशु मसीह का गिरजा
author: ''
verses:
- n: 1
  text: हम अनंत पिता, परमेश्वर, और उसके पुत्र, यीशु मसीह, और पवित्र आत्मा में विश्वास करते हैं ।
- n: 2
  text: हम विश्वास करते हैं कि मनुष्य अपने स्वंय के पापों की सजा भोगेगा न कि आदम के उल्लंघन की ।
- n: 3
  text: हम विश्वास करते हैं कि मसीह के प्रायश्चित द्वारा, सारी मानव जाति, सुसमाचार की व्यवस्था के प्रति
    आज्ञाकारिता और विधियों के द्वारा बचाई जा सकती है ।
- n: 4
  text: हम विश्वास करते हैं कि सुसमाचार के मुख्य सिद्धांत और विधियां पहला, प्रभु यीशु मसीह में विश्वास;
    दूसरा, पश्चाताप; तीसरा, पापों की क्षमा के लिए डूबोकर बपतिस्मा लेना; चौथा, हाथ रख कर पवित्रात्मा का
    उपहार पाना हैं ।
- n: 5
  text: हम विश्वास करते हैं कि मनुष्य परमेश्वर की तरफ से, भविष्यवाणी द्वारा, और जो अधिकृत हैं उनके हाथ
    रखने के द्वारा, सुसमाचार पढ़ाने के लिए और उसकी विधियों को संपन्न करने के लिए नियुक्त किया जाना चाहिए
    ।
- n: 6
  text: हम उसी संगठन पर विश्वास करते हैं जो प्राचीन गिरजे में थे, जैसे, प्रेरित, भविष्यवक्ता, पादरी, शिक्षक,
    सुसमाचार प्रचारक, और इत्यादि ।
- n: 7
  text: हम भाषाओं के उपहार, भविष्यवाणी, प्रकटीकरण, दिव्यदर्शन, चंगाई, भाषाओं के अनुवाद, और इत्यादि पर
    विश्वास करते हैं ।
- n: 8
  text: हम विश्वास करते हैं कि बाइबल परमेश्वर का वचन है जहां तक इसका अनुवाद सही हुआ है, हम यह भी विश्वास
    करते हैं कि मॉरमन की पुस्तक परमेश्वर का वचन है ।
- n: 9
  text: हम उन सब पर विश्वास करते हैं जो परमेश्वर ने प्रकट किया है, और जो वह अब प्रकट करता है, और हम विश्वास
    करते हैं कि वह आगे भी बहुत सी महान और महत्वपूर्ण बातें जो कि परमेश्वर के राज्य से संबंधित हैं प्रकट
    करेगा ।
- n: 10
  text: हम, इस्राएल के वास्तविक इक्ट्ठा होने और दस जातियों की पुनःस्थापना होने, कि सिय्योन (नया यरूशलेम)
    अमरीकी महाद्वीप पर पर बनेगा, कि मसीह पृथ्वी पर स्वंय शासन करेगा, और, कि पृथ्वी नई बनेगी और अपनी स्वर्गलोक
    की महिमा पाएगी, में विश्वास करते हैं ।
- n: 11
  text: हम सर्वशक्तिमान परमेश्वर की आराधना को अपने स्वंय के विवेकानुसार करने के विशेषाधिकार का दावा करते
    हैं, और सभी व्यक्तियों को वही विशेषाधिकार देते हैं कि, वे जैसे चाहे, जहां चाहे या जिसकी चाहे आराधना
    करें ।
- n: 12
  text: हम राजाओं, राष्ट्रपतियों, शासनकारियों और अधिकारियों के शासन में, व्यवस्था का पालन करने में, सम्मान
    देने में, और सहयोग देने में, विश्वास करते हैं ।
- n: 13
  text: हम ईमानदार, सच्चे, शुद्ध, दानशील, सदाचारी होने और सब लोगों के लिए भलाई करने में विश्वास करते हैं,
    वास्तव में, हम यह कह सकते हैं कि हम पौलुस के आग्रह को मानते हैं—हम सब बातों में विश्वास करते हैं,
    हम सब बातों की आशा करते हैं, हमने बहुत सी बातें सहन की और सब बातों को सहने की आशा रखते हैं । अगर कोई
    बात जो सदाचारी, प्रिय, या उत्तम लेख या प्रशंसनीय हो तो हम उसे पाने का प्रयत्न करते हैं ।
signature: जोसफ स्मिथ
