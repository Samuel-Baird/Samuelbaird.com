title: यीशु मसीह के सुसमाचार की परिपूर्णता की पुनःस्थापना
subtitle: दुनिया के लिए द्विशतवार्षिक घोषणा
author: अंतिम-दिनों के संतों के यीशु मसीह के गिरजे की प्रथम अध्यक्षता और बारह प्रेरितों की परिषद
note: इस घोषणा को 190वें वार्षिक महा सम्मेलन में अध्यक्ष रसल एम. नेल्सन द्वारा उनके संदेश के रूप में 5
  अप्रैल 2020 को सॉल्ट लेक सिटी, यूटाह में पढ़ा गया था।
paragraphs:
- हम सत्यनिष्ठा से घोषणा करते हैं कि परमेश्वर दुनिया के प्रत्येक देश में अपनी सभी संतानों से प्रेम करता
  है। परमेश्वर पिता ने हमें दिव्य जन्म, अद्वितीय जीवन, और अपने प्रिय पुत्र, यीशु मसीह का असीमित प्रायश्चित
  बलिदान दिया है। पिता की शक्ति से, यीशु फिर से जी उठा था और उस ने मृत्यु पर विजय प्राप्त की थी। वह हमारा
  उद्धारकर्ता, हमारा आदर्श और हमारा मुक्तिदाता है।
- दो सौ वर्ष पहले, 1820 में एक सुंदर वसंत की सुबह, युवा जोसफ स्मिथ, यह जानने के लिए कि किस गिरजे के साथ
  जुड़ना चाहिए, उत्तरी न्यूयॉर्क, संयुक्त राज्य अमेरिका में अपने घर के निकट जगंल में प्रार्थना करने गया
  था। उसके मन में अपनी आत्मा के उद्धार के संबंध में प्रश्न था और उसे भरोसा था कि परमेश्वर उसे मार्ग दिखाएगा।
- विनम्रता से, हम घोषणा करते हैं कि जोसफ की प्रार्थना के जवाब में, पिता परमेश्वर और उसका पुत्र, यीशु मसीह,
  उसे दिखाई दिए थे और “सब बातों के सुधार” (प्रेरितों के काम 3:21) को आरंभ किया था जैसा बाइबिल में भविष्यवाणी
  की गई थी। इस दिव्यदर्शन में, उसने जाना था कि आरंभिक प्रेरितों की मृत्यु के बाद, मसीह का नया नियम का
  गिरजा पृथ्वी से लुप्त हो गया था। जोसफ इसकी वापसी का साधन बनेगा।
- हम पुष्टि करते हैं कि पिता और पुत्र के निर्देशन में, स्वर्गीय दूत जोसफ को निर्देश देने और यीशु मसीह
  के गिरजे को पुन:स्थापित करने के लिए आए थे। पुनर्जीवित यूहन्ना बपतिस्मा देने वाले ने पापों की क्षमा के
  लिए डुबकी द्वारा बपतिस्मा देने के अधिकार को पुन:स्थापित किया था। आरंभिक बारह प्रेरितों में से तीन—पतरस,
  याकूब और यूहन्ना ने प्रेरित-पद और पौरोहित्य अधिकार की कुंजियों को पुन:स्थापित किया था। अन्य लोग भी आए,
  जिनमें एलिय्याह भी शामिल था, जिसने मृत्यु के बाद अनंत संबंधों में परिवारों को हमेशा के लिए जोड़ने के
  अधिकार को पुन:स्थापित किया था।
- 'हम यह भी गवाही देते हैं कि जोसफ स्मिथ को एक प्राचीन अभिलेख: मॉरमन की पुस्तक—यीशु मसीह का अन्य नियम,
  का अनुवाद करने के लिए परमेश्वर का उपहार और शक्ति दी गई थी। इस पवित्र पुस्तक के पृष्ठों में उसके पुनरुत्थान
  के तुरंत बाद पश्चिमी गोलार्द्ध में लोगों के मध्य यीशु मसीह की व्यक्तिगत सेवकाई का एक वर्णन भी शामिल
  है। यह जीवन के उद्देश्य को सिखाती और मसीह के सिद्धांत को समझाती है, जो उस उद्देश्य के लिए महत्वपूर्ण
  है। बाइबिल के एक सह-धर्मशास्त्र के रूप में, मॉरमन की पुस्तक गवाही देती है कि सभी मनुष्य स्वर्ग में प्रिय
  पिता के बेटे और बेटियां हैं, कि उसके पास हमारे जीवन के लिए एक दिव्य योजना है, और उसका पुत्र, यीशु मसीह,
  आज भी उसी प्रकार बात करता है जैसा अतीत में करता था।'
- हम घोषणा करते हैं कि 6 अप्रैल 1830 को संगठित किया गया अंतिम-दिनों के संतों का यीशु मसीह का गिरजा, मसीह
  का नया नियम का पुन:स्थापित गिरजा है। यह गिरजा इसके कोने के पत्थर, यीशु मसीह के परिपूर्ण जीवन, और उसके
  अनंत प्रायश्चित और वास्तविक पुनरुत्थान में स्थापित किया गया है। यीशु मसीह ने एक बार फिर प्रेरितों को
  नियुक्त किया है और उन्हें पौरोहित्य अधिकार दिया है। वह हम सभी को उसके पास और उसके गिरजे में आने, पवित्र
  आत्मा, उद्धार की विधियों को ग्रहण करने, और अनंत आनंद प्राप्त करने का निमंत्रण देता है।
- अब दो सौ साल बीत चुके हैं जब पिता परमेश्वर और उसके प्रिय पुत्र, यीशु मसीह, ने इस पुनःस्थापना को आरंभ
  किया था। दुनिया भर में लाखों लोगों ने इन भविष्यवाणी की गई घटनाओं के ज्ञान को अपनाया है।
- हम प्रसन्नता से घोषणा करते हैं कि प्रतिज्ञा की गई यह पुनःस्थापना निरंतर प्रकटीकरण के द्वारा आगे बढ़ती
  जाती है। पृथ्वी फिर कभी वैसी नहीं होगी, क्योंकि परमेश्वर “सब कुछ … मसीह में एकत्र करेगा” (इफिसियों 1:10)।
- श्रद्धा और कृतज्ञता के साथ, हम उसके प्रेरितों के रूप में सभी को जानने के लिए आमंत्रित करते हैं—जैसा
  कि हम जानते हैं—कि आकाश खुले हैं। हम पुष्टि करते हैं कि परमेश्वर अपने प्रिय बेटों और बेटियों को अपनी
  इच्छा प्रकट करता है। हम पुष्टि करते हैं कि जो प्रार्थनापूर्वक पुनःस्थापना के संदेश का अध्ययन करते और
  विश्वास में कार्य करते हैं वे इसकी दिव्यता और हमारे प्रभु और उद्धारकर्ता, यीशु मसीह के वादा किए गए द्वितीय
  आगमन के लिए दुनिया को तैयार करने के इसके उद्देश्य की अपनी गवाही प्राप्त करने के लिए आशीषित किए जाएंगे।
