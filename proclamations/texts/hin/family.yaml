title: परिवार
subtitle: दुनिया के लिए एक घोषणा
author: अन्तिम-दिनों के सन्तों के यीशु मसीह के गिरजे की प्रथम अध्यक्षता और बारह प्रेरितों के परिषद
note: यह घोषणा अध्यक्ष गोर्डन बी. हिंकली द्वारा 23 सितंबर 1995 को सॉल्ट लेक सिटी, यूटाह में, जनरल सहायता
  संस्था की सभा में उनके सन्देश के एक हिस्से के रूप में पढ़ी गई थी।
paragraphs:
- हम, अन्तिम-दिनों के सन्तों का यीशु मसीह के गिरजे की प्रथम अध्यक्षता एवं बारह प्रेरितों की परिषद, औपचारिक
  रूप से घोषणा करते हैं कि पुरुष और स्त्री के बीच विवाह परमेश्वर द्वारा नियुक्त किया हुआ है और यह कि उसके
  बच्चों के अनन्त नियति के लिए परिवार सृष्टिकर्ता की योजना में आवश्यक है।
- सारी मानवजाति—पुरुष और स्त्री—की सृष्टि परमेश्वर के प्रतिरूप में हुई है। प्रत्येक स्वर्गीय माता-पिता
  का आत्मिक प्रिय बेटा और बेटी है, और उन्हीं के समान, प्रत्येक के पास परमेश्वर तुल्य बनने का गुण तथा सम्भावित
  योग्यता है। व्यक्ति के नश्वरता-पूर्व जीवन, नश्वर जीवन, और अनन्त पहचान और उद्देश्य का लिंग एक आवश्यक
  गुण है।
- नश्वरता-पूर्व राज्य में, आत्मिक बेटे और बेटियां परमेश्वर को उनके अनन्त पिता के रूप में जानते और उपासना
  करते थे और उसकी योजना को स्वीकार किया था जिसके द्वारा उनके बच्चे पार्थिव शरीर प्राप्त कर सकें और परिपूर्णता
  की ओर प्रगति करने के लिए सांसारिक अनुभवों को प्राप्त करें और अंत में अपने अनन्त जीवन के वारिस के रूप
  में अपनी दिव्य नियति को प्राप्त करें। परमेश्वर की सुख की पवित्र योजना पारिवारिक सम्बन्धों को मृत्यु
  के बाद भी जारी रखने में समर्थ बनाती है। पवित्र मन्दिरों में उपलब्ध पवित्र विधियां और अनुबन्ध व्यक्ति
  को परमेश्वर की उपस्थिति में वापस जाने और परिवारों को अनन्तता के लिए इकठ्ठा रहना सम्भव करती हैं।
- पहली आज्ञा जो कि परमेश्वर ने आदम और हव्वा को दी थी वह पति और पत्नी के रूप में उनके माता-पिता होने की
  सम्भावना के सम्बन्ध में दी थी। हम घोषणा करते हैं कि परमेश्वर की अपने बच्चों के लिए आज्ञा कि संख्या में
  बढ़ो और पृथ्वी को भरो अभी भी वैध है। हम ये भी घोषणा करते हैं कि परमेश्वर ने आज्ञा दी है कि प्रजनन की
  पवित्र शक्ति सिर्फ कानूनी तौर से विवाहित पति और पत्नी के रूप में पुरुष और स्त्री के द्वारा ही उपयोग
  की जानी चाहिए।
- हम उसकी घोषणा करते हैं जिससे पृथ्वी पर पार्थिव जीवन की सृष्टि की दिव्य नियुक्ति हुई है। हम जीवन की पवित्रता
  और परमेश्वर की योजना में उसके महत्व को दृढ़तापूर्वक कहते हैं।
- पति और पत्नी पर एक दूसरे को और अपने बच्चों को प्रेम और देखभाल करने की विधिवत जिम्मेदारी है। “बच्चे प्रभु
  की सम्पत्ति हैं” (भजन संहिता 127:3)। माता-पिता का पवित्र कर्तव्य है अपने बच्चों का प्यार और नेकता में
  पालन-पोषण करना, उनकी शारीरिक और आत्मिक जरूरतें उपलब्ध कराना, और उन्हें एक दूसरे को प्यार और सेवा करने
  की, परमेश्वर की आज्ञाओं को मानने और कानून से जुड़े नागरिक बनने की शिक्षा देना चाहे वे कहीं भी रहें।
  पति और पत्नी—माता और पिता—इन कर्तव्यों से पीछे हटने पर परमेश्वर के सम्मुख उत्तरदायी ठहराए जाएंगे।
- 'परिवार परमेश्वर द्वारा नियुक्त किया गया है। पुरुष और स्त्री के बीच विवाह उसकी अनन्त योजना के लिए आवश्यक
  है। विवाह संस्कार के बंधन में जन्म लेने का बच्चों का अधिकार है और उनका उस पिता और माता द्वारा पालन-पोषण
  होना चाहिए जो वैवाहिक प्रतिज्ञा का पूरी ईमानदारी के साथ सम्मान करते हैं। पारिवारिक जीवन में सुख तब प्राप्त
  होने की सबसे अधिक संभावना है जब इसे प्रभु यीशु मसीह की शिक्षाओं पर स्थापित किया जाता है। सफल विवाह और
  परिवार विश्वास के नियम, प्रार्थना, पश्चाताप, क्षमा, सम्मान, प्यार, दया, कार्य, सुखकर मनोरंजक गतिविधियों
  पर स्थापित किये और संभाले जाते हैं। पवित्र उद्देश्य द्वारा, पिता अपने परिवार पर प्यार और नेकता से अध्यक्षता
  करता है और अपने परिवार के जीवन की जरूरतों को और रक्षा उपलब्ध कराने के लिए जिम्मेदार होता है। माताएं
  मुख्यत: अपने बच्चों का पालन-पोषण करने के लिए जिम्मेदार होती हैं। इन पवित्र जिम्मेदारियों में, पिता और
  माता बराबर के साथ एक दूसरे को मदद करने के लिए वचनबद्ध होते हैं। अयोग्यता, मृत्यु, या अन्य परिस्थितियां
  व्यक्ति की भूमिका में अनुकूल परिवर्तन के लिए विवश कर सकती हैं। जब जरूरत हो रिश्तेदारों द्वारा सहायता
  मिलनी चाहिए।'
- हम उन व्यक्तियों को चेतावनी देते हैं जो यौन शुद्धता के अनुबन्धों को तोड़ते हैं, जो पति या पत्नी, या
  बच्चों के साथ दुर्व्यवहार करते हैं, या उन्हें जो परिवार की जिम्मेदारियों को पूरा करने में असफल होते
  हैं, परमेश्वर के सम्मुख उत्तरदायी ठहराए जाएंगे। इसके अलावा, हम चेतावनी देते हैं कि परिवार से अलगाव व्यक्तियों,
  समुदायों, और राष्ट्रों पर वह संकट लाएगा जिनके विषय में प्राचीन और आधुनिक भविष्यवक्ताओं ने बताया था।
- हम सर्वत्र जिम्मेदार नागरिकों और सरकार के अधिकारियों से उन कार्यों को करने का आग्रह करते हैं जो परिवार
  को समाज की मौलिक इकाई के रूप में समर्थन व बल देने के लिए बढ़ावा देते हैं।
