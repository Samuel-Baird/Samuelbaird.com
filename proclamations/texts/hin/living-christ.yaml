title: जीवित मसीह
subtitle: प्रेरितों की गवाही
author: अन्तिम-दिनों के सन्तों का यीशु मसीह का गिरजा
paragraphs:
- जब हम दो हजार वर्ष पूर्व यीशु मसीह के जन्म का स्मरणोत्सव मनाते हैं, तो हम उसके अद्वितीय जीवन और उसके
  महान प्रायश्चितकारी बलिदान की अनंत पवित्रता के प्रति अपनी गवाही देते हैं। इस पृथ्वी पर जो जिये हैं और
  अभी जियेंगे उन सब पर किसी अन्य का इतना गहरा प्रभाव नहीं पड़ा है।
- वह पुराने नियम का महान यहोवा, नये नियम का मसीहा था। अपने पिता के निर्देशानुसार वह इस पृथ्वी का सृष्टिकर्ता
  था। “सब कुछ उसी के द्वारा उत्पत्र हुआ और जो कुछ उत्पत्र हुआ है, उसमें से कोई भी वस्तु उसके बिना उत्पत्र
  न हुई” (यूहन्ना 1:3)। निषपापी होने पर भी, उसने सारी धार्मिकता को पूरा करने के लिए बपतिस्मा लिया था।
  वह “भलाई करता था” (प्रेरितों के काम 10:38), फिर भी इसके कारण उसका तिरस्कार किया गया। उसका सुसमाचार शान्ति
  और सदूभावना का संदेश था। उसने सबसे गंभीरतापूर्वक कहा कि वे उसके उदाहरण पर चलें। वह फिलस्तीन की सड़कों
  पर चलते हुए बीमारों को चंगा करता था, अन्धों को दृष्टि दान देता था, और मरे हुओं को जीवित करता था। वह
  अनन्तता की सच्चाइयां, हमारे नश्वरता-पूर्व जीवन की वास्तविकता, पृथ्वी पर हमारे जीवन का उद्देश्य, और आने
  वाले जीवन में परमेश्वर के बेटे और बेटियों के लिए संभावनाओं की शिक्षा देता था।
- उसने प्रभु-भोज अपने महान प्रायश्चितकारी बलिदान के स्मारक के रूप में शुरू किया। उसे झूठे आरोपों के आधार
  पर बंदी बनाया गया और निन्दित किया गया और एक भीड़ को संतुष्ट करने के लिए अपराधी सिद्ध किया गया, और कलवरी
  की सूली पर मौत की सजा दी गई। उसने सारी मानवजाति के पापों का प्रायश्चित करने के लिए अपना जीवन दिया। वह
  यह उसका उन सबकी ओर से जो कभी पृथ्वी पर रहे एक महान प्रतिनिधिक उपहार था।
- हम सन्यनिष्ठा से गवाही देते हैं कि उसका जीवन, जो संपूर्ण मानव इतिहास में प्रमुख हैं, न तो बैतलहम से
  आरंभ हुआ और न ही कलवरी पर समाप्त हुआ। वह पिता का पहलौठा पुत्र था, मानव शरीर में इकलौता प्रिय पुत्र दुनिया
  का मुक्तिदाता।
- “जो सो गए हैं, उनमें पहिला फल बनने के लिए” (1 कुरिथिंयों 15:20) वह क्रब से जी उठा । पुनर्जीवित प्रभु
  के रूप में वह उनके बीच में गया जिनको वह अपने जीवन में प्यार करता था। प्राचीन अमेरिका में भी उसने अपनी
  “दूसरी भेड़ों” (यूहन्ना 10:16) का आत्मिक मार्गदर्शन किया। आधुनिक दुनिया में वह और उसका पिता बालक जोसफ
  स्मिथ को, लंबे समय से प्रतिज्ञा किए गए “समयों के पूरे होने के प्रबन्ध” (इफिसियों 1:10) को आरंभ करने
  के लिए प्रकट हुए थे।
- 'जीवित मसीह के बारे में, भविष्यवक्ता जोसफ स्मिथ ने लिखा था: “उसकी आंखें अग्नि की ज्वाला के समान थी;
  उसके बाल शुद्ध बर्फ के समान सफेद थे; उसका चेहरा सूर्य की कड़ी धूप से अधिक चमक रहा था; और उसकी वाणी बहते
  हुए विशाल जल के समान थी, अर्थात यहोवा की वाणी, कहते हुए:'
- “मैं प्रथम और अंतिम हूं; मैं वह जो जीवित है, मैं वह जो मारा गया था; मैं पिता के पास तुम्हारा सहायक हूं”
  (सिऔरअ 110:3–4)।
- 'भविष्यवक्ता ने यह घोषणा भी की: “और अब, उसके बारे में कई गवाहियां दिए जाने के पश्चात, यह वह गवाही है,
  सबसे अंतिम, जिसे हम उसके विषय में देते हां: कि वह जीवित है!'
- “क्योंकि हमने उसे देखा था, परमेश्वर के दाहिने ओर; और हमने गवाही देती हुए वाणी को सुना कि यही पिता का
  एकलौता पुत्र है—
- “कि उसके द्वारा, और उसके माध्यम से, और उससे, संसारों की सृष्टि हुई है और हुई थी, और उनके निवासी परमेश्वर
  के प्रिय बेटे और बेटियां हैं” (सिऔरअ 76:22–24)।
- हम गंभीरतापूर्वक घोषणा करते हैं कि उसका पौरोहित्य और उसका गिरजा पृथ्वी पर पुनः स्थापित किया गया है—“प्रेरितों
  और भविष्यवक्ताओं की नींव पर, जिसके कोने का पत्थर यीशु मसीह स्वयं ही हैं” (इफिसियों 2:20)।
- हम गवाही देते है कि वह किसी दिन पृथ्वी पर वापस आएगा। “तब प्रभु का तेज प्रगट होगा और सब प्राणी उसको एक
  संग देखेंगे” (यशायाह 40:5)। वह राजाओं के राजा की तरह शासन करेगा और प्रभुओं के प्रभु की तरह राज्य करेगा,
  और उपासना करने के लिए उसके सामने हर घुटना झुकेगा और हर जबान बोलेगी। हम में से प्रत्येक का हमारे कार्यों
  और हमारे हृदयों की इच्छाओं के अनुसार उसके समक्ष न्याय किया जाएगा।
- हम उसके विधिवत नियुक्त प्रेरितों के रूप में गवाही देते हैं—कि यीशु जीवित मसीह हैं, परमेश्वर का अमर पुत्र।
  वह महान राजा इम्मानूएल हैं, जो आज अपने पिता के दाहिने हाथ पर खड़ा हैं। वह दुनिया का प्रकाश, जीवन और
  आशा हैं। उसका रास्ता वह मार्ग है जो इस जीवन में सुख की ओर ले जाता है और आने वाली दुनिया में अनन्त जीवन
  की ओर ले जाता हैं। उसके दिव्य पुत्र के अद्वितीय उपहार के लिए परमेश्वर का धन्यवाद किया जाना चाहिए।
