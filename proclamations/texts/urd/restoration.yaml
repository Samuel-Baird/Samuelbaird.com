title: یِسُوع مسِیح کی مَعمُوریِ اِنجیل کی بحالی
subtitle: دُنیا کے لیے دو صد سالہ اِعلان
author: کلِیسیائے یِسُوع مسِیح برائے مُقدّسینِ آخِری ایّام کی صدارتِ اَوّل اور بارہ رسُولوں کی جماعت
note: اِس اِعلان کو صدر رسل ایم نیلسن نے ۵ اپریل، ۲۰۲۰، کو سالٹ لیک سٹی، یُوٹاہ، میں ۱۹۰ ویں سالانہ مجلسِ
  عامہ میں اپنے پیغام کے حصّے کے طور پر بیان کیا۔
paragraphs:
- ہم پُوری سنجیدگی سے یہ اِعلان کرتے ہیں کہ خُدا دُنیا کی ہر قَوم میں اپنے بچّوں سے محبّت رکھتا ہے۔ خُدا
  باپ نے ہمیں اِلہٰی جنم، لاثانی زِندگی، اور اپنے پیارے بیٹے، یِسُوع مسِیح کے لامحدود کفّارے کی قُربانی
  عطا کی ہے۔ باپ کی قُدرت کے وسِیلے سے، یِسُوع دُوبارہ زِندہ ہُوا اور موت پر فتح پائی۔ وہ ہمارا نجات دہندہ،ہمارا
  مثالی نمونہ، اور ہمارا فدیہ دینے والا ہے۔
- دو سو برس قبل، ۱۸۲۰ کے موسمِ بہار کی خُوب صُورت صبح کو، نوجوان جوزف سمِتھ، یہ جاننے کی کوشش کر رہا تھا
  کہ کون سی کلِیسیا میں شامِل ہو، اِس لیے وہ ریاست ہائے مُتحدہ امریکہ کے شہر نیویارک کے بالائی حِصّے میں
  اپنے گھر کے قریب جنگل میں دُعا کرنے کے لیے گیا۔ اُس نے اپنی جان کی نجات کے بارے میں سوال کرنے تھے اور
  اُس کا توّکل تھا کہ خُدا اُس کی ہدایت فرمائے گا۔
- فروتنی کے ساتھ، ہم اِعلان کرتے ہیں کہ اُس کی دُعا کے جواب میں، خُدا باپ اور اُس کا بیٹا، یِسُوع مسِیح،
  جوزف پر ظاہر ہُوئے اور کلامِ مُقدّس میں پیش گوئی کے مطابق، ”سب چِیزیں بحال“ (اعمال ۳‏:۲۱) کرنے کا باضابطہ
  آغاز کِیا۔ اِس رویا میں، اُسے عِلم ہُوا کہ اِبتدائی رسُولوں کی وفات کے بعد، مسِیح کے عہدِ جدید کی کلِیسیا
  کو زمِین پر سے اُٹھا لِیا گیا تھا۔ جوزف اُس کی واپسی کے لیے وسیلہ ہوگا۔
- ہم اِقرار کرتے ہیں کہ باپ اور بیٹے کی زیرِ ہدایت، آسمانی پیامبر جوزف کو تعلیم دینے اور یِسُوع مسِیح
  کی کلِیسیا کو پھر سے قائم کرنے کے لیے نازِل ہُوئے۔ جی اُٹھے یُوحنّا بپتِسما دینے والے نے گُناہوں کی
  مُعافی کے واسطے غوطے کے ذریعے سے بپتِسما دینے کا اِختیار بحال کِیا۔ اِبتدائی بارہ رسُولوں میں سے تین—پطرس،
  یعقُوب، اور یُوحنّا—نے رسالت اور کہانت کی کُنجیوں کا اِختیار بحال کِیا۔ دُوسرے بھی نازِل ہُوئے، بشمول
  اَیلیاہ، جِس نے خاندانوں کو موت سے ماورا اَبَدی رِشتوں میں ہمیشہ کے لیے اِکٹھے پیوستہ کرنے کا اِختیار
  بحال کیا۔
- 'ہم مزید گواہی دیتے ہیں کہ جوزف سمِتھ کو قدیم صحِیفہ: مورمن کی کِتاب—یِسُوع مسِیح کی بابت ایک اور عہدنامہ
  کا ترجمہ کرنے کے لیے خُدا کی قُدرت اور نَعمت عطّا کی گئی تھی۔ اِس مُقدّس صحِیفے کے صفحات میں یِسُوع
  مسِیح کی مغربی کُرہِ ارض کے باشِندوں کے درمیان میں اپنے جی اُٹھنے کے فوراً بعد شخصی خِدمت کا احوال شامل
  ہے۔ یہ مقصدِ حیات کی تعلیم دیتا ہے اور مسِیح کی تعلیم کی وضاحت کرتا ہے، جو اُس مفہوم کا مرکز ہے۔ کلامِ
  مُقدّس کے رفیقِ کار کی حیثیت سے، مورمن کی کِتاب گواہی دیتی ہے کہ کُل بنی نوع اِنسان پیارے آسمانی باپ
  کے بیٹے اور بیٹیاں ہیں، کہ ہماری زِندگیوں کے واسطے اُس کے پاس اِلہٰی مَنصُوبہ ہے، اور کہ اُس کا بیٹا،
  یِسُوع مسِیح، قدیم ایّام کی مانِند آج بھی کلام کرتا ہے۔'
- ہم اِعلان کرتے ہیں کہ ۶ اپریل، ۱۸۳۰ کو مُنظم کی گئی، کلِیسیائے یِسُوع مسِیح برائے مُقدّسینِ آخِری ایّام،
  مسِیح کی نئے عہد نامے کی بحال شُدّہ کلِیسیا ہے۔ یہ کلِیسیا اپنے کونے کے سِرے کے پتھّر، یِسُوع مسِیح،
  کی کامِل زِندگی، اور اُس کے لامحُدود کفّارے اور حقیقی قیامت میں لنگر انداز ہے۔ یِسُوع مسِیح نے ایک بار
  پھر رسُولوں کو بُلایا ہے اور کہانتی اِختیار اُن کو عطّا کِیا ہے۔ وہ ہم سب کو اپنے اور اپنی کلِیسیا کے
  پاس آنے، رُوحُ القُدس پانے، نجات کی رُسُوم، اور دائمی راحت پانے کی دعوت دیتا ہے۔
- خُدا باپ اور اُس کے پیارے بیٹے، یِسُوع مسِیح، کی جانب سے اِس بحالی کے آغاز کے بعد سے اب تک دو سو برس
  بیت چُکے ہیں۔ پُوری دُنیا میں لاکھوں اَفراد نے اِن نبُوّت کیے گئے واقعات کا عِلم قبول کرلیا ہے۔
- ہم بڑی مُسرت کے ساتھ اِعلان کرتے ہیں کہ موعُودہ بحالی کا سِلسِلہ پیہم مُکاشفہ کے وسِیلے سے آگے بڑھتا
  ہے۔ یہ زمِین پھر کبھی دُوبارہ ویسی نہ ہوگی، جب خُدا ”مسِیح میں سب چِیزوں کا مجمُوعہ“ کرے گا (اِفِسیوں
  ۱‏:۱۰)۔
- عقِیدت اور احترام کے ساتھ، بحیثیتِ رسُول ہم سب کو یہ جاننے کی دعوت دیتے ہیں—جیسے ہم جانتے ہیں—کہ آسمان
  کے درِیچے کُھُلے ہیں۔ ہم اِقرار کرتے ہیں کہ خُدا اپنے پیارے بیٹوں اور بیٹیوں کے واسطے اپنی مرضی ظاہر
  کر رہا ہے۔ ہم اِقرار کرتے ہیں کہ جو دُعاگو ہو کر بحالی کے پیغام کا مُطالعہ کرتے اور اِیمان کے ساتھ عمل
  کرتے ہیں وہ اِس کے اِلہامی ہونے اور اِس کے مقصد یعنی اِس زمِین کو ہمارے خُداوند اور نجات دہندہ، یِسُوع
  مسِیح، کی موعُودہ آمدِ ثانی کے لیے تیار کرنے کے واسطے اپنی اپنی ذاتی گواہی پائیں گے۔
