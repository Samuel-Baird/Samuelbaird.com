title: خاندان
subtitle: دُنیا کے لیے اِعلان
author: کلِیسیائے یِسُوع مسِیح برائے مُقدّسینِ آخِری ایّام کی صدارتِ اَوّل اور بارہ رسُولوں کی جماعت
note: یہ اِعلان صدر گورڈن بی ہنکلی نے ۲۳ ستمبر، ۱۹۹۵، کو سالٹ لیک سٹی، یُوٹاہ، میں مُنعقد ہونے والے عمومی
  انجمنِ خواتین کے اجلاس میں اپنے پیغام کے حِصّہ کے طور پر پڑھا تھا۔
paragraphs:
- ہم، کلِیسیائے یِسُوع مسِیح برائے مُقدّسینِ آخِری ایّام کی صدارتِ اَوّل اور بارہ رسُولوں کی جماعت، باضابطہ
  طور پر اِعلان کرتے ہیں کہ مَر داور عورت کے درمیان بیاہ خُدا کی طرف سے مُقرر کِیا گیا ہے اور خالق کے
  منُصوبے میں اپنے بچّوں کی اَبَدی منزل کے لیے خاندان مرکزی حیثیت رکھتا ہے۔
- کُل بنی نوع انسان—مَرد اور عورت—خُدا کی شبیہ پر تخلیق کیے گئے ہیں۔ ہر ایک اپنے آسمانی والدین کا پیارا
  رُوحانی بیٹا یا بیٹی ہے اور یُوں ہر ایک کو اپنی اِلہٰی فطرت اور منزل حاصل ہے۔ جِنس قبل اَز فانی، فانی،
  اور اَبَدی شناخت اور مقصد کے لیے فرد کی لازمی صِفت ہے۔
- قبل اَز فانی عالم میں، رُوحانی بیٹے اور بیٹیاں خُدا کو جانتے اور اُس کی اپنے اَبَدی باپ کی حیثیت سے
  پرستش کرتے تھے، اور اُس کے منُصوبے کو اُنھوں نے قبُول ِکیا، جِس سے اُس کے بچّے جسمانی بدن حاصل کر سکتے
  ہیں اور کاملِیت کی طرف بڑھنے کے لیے زمینی تجر بہ حاصل کرتے اور بالآخر اَبَدی زِندگی کے وارث ہونے کی
  اپنی اِلہٰی منزل کو پہچان سکتے ہیں۔ خُوشی کا اِلہٰی منصُو بہ خاندانی تعلقات کو قبر کے بعد تک بھی قائم
  رکھنے کے قابل بناتا ہے۔ افراد کے واسطے خُدا کی حُضُوری میں واپس لوٹنے اور خاندانوں کے اَبَدی طور سے
  مُتحد ہونے کو مُمکن بنانے کے لیے پاک ہَیکلوں میں مُقدّس رُسُوم اور عہُو د دستیاب ہیں۔
- پہلا حُکم جوخُدانے آدم اور حوّا کو شوہر اور بیوی ہونے کے ناطے دِیا تھا وہ والدین بننے کے اِمکان سے تعلُق
  رکھتا تھا۔ ہم اِس بات کا اِعلان کرتے ہیں کہ زمین پر پھلنے پھُولنے اور اِسے معُمور کرنے کا خُدا کا حُکم
  آج بھی نافِذ ہے۔ ہم مزید اِعلان کرتے ہیں کہ خُدا نے حُکم دِیا ہے کہ مَرد و زن کے درمیان افزائشِ نسل
  کی مُقدّس قُوتیں، صرف قانُونی طور پر بیاہ شُدّہ شوہر اور بیوی کی حیثیت سے ہی اِستعمال کی جائیں۔
- ہم اَ علان کرتے ہیں کہ جِن ذرائع سے فانی زِندگی تخلِیق ہوتی ہے وہ اِلہٰی طور سے مُقرر کیے گئے ہیں۔ ہم
  زِندگی کے تَقدُّس اور خُدا کے منصُوبے میں اِس کی اہمیت کی تائید کرتے ہیں۔
- شوہر اور بیوی کی مُقدّس ذِمہ داری ہے کہ وہ ایک دُوسرے سے اور اپنے بچّوں سے پیار کریں اور ایک دُوسرے
  اور اپنے بچّوں کا خیال رکھیں۔”اولا د خُداوند کی طرف سے میراث ہے“ (زبُور ۱۲۷‏:۳)۔ اپنے بچّوں کی محبّت
  اور راستی میں پرورش، اُن کی جسمانی اور رُوحانی ضرُوریات کی فراہمی، اُنھیں ایک دُوسرے سے محبّت رکھنا
  اور خِدمت کرنا، خُدا کے احکام ماننا اور جہاں بھی وہ رہتے ہوں وہاں کے قانون کی پاسداری کرنے والے شہری
  بننے کی بابت سِکھانا، والد ین کا مُقدّس فریضہ ہے۔ شوہر اور بیویاں—مائیں اور باپ—اِن ذمہ داریوں کی ادائیگی
  کے واسطے خُدا کے سامنے جواب دہ ہوں گے۔
- خاندان خُدا کی طرف سے مُقرّر کردہ ہے۔ اُس کے اَبَدی منصُوبے میں مَرد اور عورت کا بیاہ لازم ہے۔ بچّے،
  اَزدواجیت کے بندھن میں پَیدایش اور اُس باپ اور ماں کی طرف سے پرورش کا حق رکھتے ہیں جو پُوری وفاداری
  سے اَزدواجی عہد کا احترام کرتے ہیں۔ جب اِس کی بنُیاد خُداوند یِسُوع مسِیح کی تعلیمات پر رکھی جاتی ہے
  تو خاندانی زِندگی میں خُوشی حاصل کرنے کا زیادہ اِمکان ہوتا ہے۔ کامیاب بیاہ اور خاندان اِیمان، دُعا،
  توبه، مُعانی، احترام، محبّت، ہمدردی، کام اورصحت مندانہ سرگرمیوں کے اُصُولوں پر قائم اور برقرار رہتے
  ہیں۔ اِلہیٰ نَمُونَے کے مُطابق، والد صاحبان کو اپنے خاندانوں کی سربراہی محبّت اور راستی سے کرنی ہے اور
  اپنے خاندانوں کو ضروریاتِ زِندگی اور تحفُظ فراہم کرنا اِن کی ذِمہ داری ہے۔ مائیں بُنیادی طور پر اپنے
  بچّوں کی پرورش کی ذِمہ دار ہیں۔ اِن مُقدّس ذِمہ داریوں میں، والد صاحبان اور ماؤں پر مساوی حِصّہ دار
  ہونے کی حیثیت سے ایک دُوسرے کی مدد کرنے کی ذِمہ داری عائد ہے۔ معذُوری، موت یا دیگر حالات میں اِنفرادی
  موافقت ضرُوری ہو سکتی ہے۔ بوقتِ ضرُورت رشتہ دار خاندانوں کو معاونت کرنی چاہیے۔
- ہم خبر دار کرتے ہیں کہ وہ افراد جو پاک دامنی کے عہُود کی خلاف ورزی کرتے ہیں، جو شریکِ حیات یا اولاد
  کے ساتھ زیادتی کرتے ہیں، یا خاندانی ذِمہ داریوں کو پُورا کرنے میں ناکام ہو جاتے ہیں وہ خُدا کے سامنے،
  ایک دِن جواب دہ ہوں گے۔ ہم مزید خبر دار کرتے ہیں کہ خاندان کا بِکھرنا افراد، مُعاشروں، اور قَوموں پر
  وہ آفتیں نازل کرے گا جِن کی پشِین گوئی قدیم اور جدِید نبیوں نے کی ہے۔
- ہم ہر جگہ کے ذِمہ دار شہریوں اور حکُومتی عُہدہ داروں کو کہتے ہیں کہ وہ خاندان کو مُعاشرے کی بُنیاوی
  اکائی کے طور پر، مضبُوط اور قائم رکھنے سے مُتعلق پروگراموں کو فروغ دیں۔
