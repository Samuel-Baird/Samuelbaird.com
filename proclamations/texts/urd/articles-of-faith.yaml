title: کے اِیمان کے اَرکان
subtitle: کلِیسیائے یِسُوع مسِیح برائے مُقَدَّسِینِ آخِری ایّام
author: ''
verses:
- n: 1
  text: ہم خُدا، اَبَدی باپ پر، اور اُس کے بیٹے یِسُوع مسِیح پر، اور رُوحُ القُدس پر اِیمان لاتے ہیں۔
  label: ۱
- n: 2
  text: ہم اِیمان لاتے ہیں کہ اِنسان اپنے گناہوں کے سزاوار ہوں گے، اور آدم کی خطا کے نہیں۔
  label: ۲
- n: 3
  text: ہم اِیمان لاتے ہیں کہ اِنجِیل کے قوانین اور رُسُوم کی فرمان برداری سے، کُل بنی نوع اِنسان مسِیح
    کے کفّارہ کے وسِیلے سے نجات پائیں گے۔
  label: ۳
- n: 4
  text: 'ہم اِیمان لاتے ہیں کہ اِنجِیل کے مُقَدّم اُصُول اور رُسُوم یہ ہیں: پہلا، خُداوند یِسُوع مسِیح
    پر اِیمان؛ دُوسرا، توبہ؛ تِیسرا، گُناہوں کی مُعافی کے لیے غوطے کا بپتسما؛ چوتھا، رُوحُ القُدس کی نعمت
    کے لیے ہاتھوں کا رکھا جانا۔'
  label: ۴
- n: 5
  text: ہم اِیمان لاتے ہیں کہ ہر اِنسان کو خُدا کی طرف سے، اِنجِیل کی مُنادی اور اُس کی رُسُوم ادا کرنے
    کے لیے بُلایا گیا ہے، نبُوّت کے وسِیلے سے اور اُن کے ہاتھوں کے رکھے جانے سے جو صاحبِ اِختیار ہیں۔
  label: ۵
- n: 6
  text: ہم اِیمان لاتے ہیں ہُو بہُو اَیسی تنظیم پر جو اِبتدائی کلِیسیا میں موجود تھی، یعنی کہ، رسُول،
    نبی، چرواہے، اُستاد، مُبشر، اور علاوہ ازیں۔
  label: ۶
- n: 7
  text: ہم اِیمان لاتے ہیں، زبانوں کی نعمت، نبُوّت، مُکاشفہ، رویائیں، شِفا، زبانوں کے ترجمے پر، اور علاوہ
    ازیں۔
  label: ۷
- n: 8
  text: ہم اِیمان لاتے ہیں کہ بائِبل خُدا کا کلام ہے بشرطِ کہ اُس کا ترجمہ دُرست ہُوا ہو؛ اور ہم یہ اِیمان
    بھی لاتے ہیں کہ مورمن کی کِتاب خُدا کا کلام ہے۔
  label: ۸
- n: 9
  text: ہم اِیمان لاتے ہیں ہر اُس بات پر جو خُدا نے آشکارا کی ہے، ہر اُس بات پر جو وہ اب آشکار کرتا ہے،
    اور ہم اِیمان لاتے ہیں کہ وہ ہنوز خُدا کی بادِشاہی کے مُتعلّق کئی عظیم اُلشان اور اَہم باتیں آشکار
    کرے گا۔
  label: ۹
- n: 10
  text: ہم اِسرائیل کے حرف بہ حرف اِکٹھے ہونے پر اور دس قبِیلوں کی بحالی پر اِیمان لاتے ہیں؛ کہ صِیُّون
    (نیا یرُوشلیم) براعظم اَمریکہ میں قائم ہو گا، کہ مسِیح آپ زمِین پر سلطنت کرے گا؛ اور کہ زمِین کی تجدِید
    ہو گی اور اپنا فردوسی جلال پائے گی۔
  label: ۱۰
- n: 11
  text: ہم اپنے ضمیر کے تقاضوں کے مُطابق قادِرِ مُطلق خُدا کی عِبادت کرنے کے حق کا مُطالبا کرتے ہیں، اور
    سارے لوگوں کے اِسی حق کو مانتے ہیں، اُنھیں جَیسے، جہاں اور جِس کی وہ چاہیں عِبادت کرنے دیا جائے۔
  label: ۱۱
- n: 12
  text: ہم بادِشاہوں، صدُروں، حُکم رانوں، اور حاکموں کے اطاعت گُزار ہونے، قانون کو ماننے، قانون کا اَحترام
    کرنے، اور قانون کے ساتھ تعاون کرنے پر اِیمان لاتے ہیں۔
  label: ۱۲
- n: 13
  text: ہم دیانت دار، سچّے، پاک دامن، خیر اَندیش، نیکو کار ہونے، اور تمام لوگوں کے ساتھ نیکی کرنے پر اِیمان
    لاتے ہیں؛ درحقیقت ہم یہ کہہ سکتے ہیں کہ ہم پولُس کی ہدایت کی تقلید کرتے ہیں—ہم سب باتوں پر اِیمان
    لاتے ہیں، ہم سب باتوں کی اُمید کرتے ہیں، ہم نے بُہت سی باتیں برداشت کی ہیں، اور اُمید کرتے ہیں کہ
    سب باتیں برداشت کرنے کے قابل ہوں۔ اگر کوئی بات پاکِیزہ، پسندِیدہ، یا دِل کش یا قابلِ آفریں ہو تو،
    ہم اَیسی باتوں کی تلاش میں رہتے ہیں۔
  label: ۱۳
signature: جوزف سمِتھ۔
