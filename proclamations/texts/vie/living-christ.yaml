title: Đấng Ky Tô Hằng Sống
subtitle: Chứng Ngôn của Các Sứ Đồ
author: Giáo Hội Các Thánh Hữu Ngày Sau của Chúa Giê Su Ky Tô
paragraphs:
- Trong khi chúng ta tưởng niệm ngày giáng sinh của Chúa Giê Su Ky Tô cách đây hai thiên niên kỷ, chúng
  tôi xin đưa ra chứng ngôn của mình về sự xác thực của cuộc sống độc nhất vô nhị của Ngài và quyền năng
  vô hạn của sự hy sinh chuộc tội lớn lao của Ngài. Không ai có được một ảnh hưởng sâu xa như thế trên
  tất cả mọi người đã sống và sẽ sống trên thế gian.
- Ngài là Đấng Giê Hô Va Vĩ Đại của Kinh Cựu Ước, Đấng Mê Si của Kinh Tân Ước. Dưới sự hướng dẫn của Cha
  Ngài, Ngài là Đấng sáng tạo thế gian. “Muôn vật bởi Ngài làm nên, chẳng vật chi đã làm nên mà không
  bởi Ngài” (Giăng 1:3). Mặc dù vô tội, nhưng Ngài chịu phép báp têm để làm cho trọn mọi việc công bình.
  Ngài “đi từ nơi nọ qua chỗ kia làm phước” (Công Vụ Các Sứ Đồ 10:38), tuy nhiên vẫn bị miệt khinh vì
  điều đó. Phúc âm của Ngài là một sứ điệp của hòa bình và thiện chí. Ngài khẩn thiết kêu gọi mọi người
  noi theo gương Ngài. Ngài đi trên các con đường của xứ Phi Li Tin, chữa lành người bệnh, khiến người
  mù thấy được, và kẻ chết sống lại. Ngài giảng dạy lẽ thật của vĩnh cửu, sự xác thực của cuộc sống tiền
  dương thế, mục đích của cuộc sống của chúng ta trên thế gian, và tiềm năng cho các con trai và con gái
  của Thượng Đế trong cuộc sống mai sau.
- Ngài thiết lập Tiệc Thánh như một nhắc nhở về sự hy sinh chuộc tội lớn lao của Ngài. Ngài bị bắt giữ
  và bị kết án theo những lời cáo gian, để đám đông được hài lòng, và chịu án chết trên cây thập tự ở
  Calvary. Ngài đã phó mạng sống của Ngài để chuộc tội lỗi cho tất cả nhân loại. Mạng sống của Ngài là
  một món quà vĩ đại thay cho tất cả mọi người từng sống trên thế gian.
- Chúng tôi long trọng làm chứng rằng cuộc sống của Ngài là trọng tâm của tất cả lịch sử nhân loại, không
  phải bắt đầu nơi Bết Lê Hem cũng chẳng kết thúc nơi Calvary. Ngài là Con Đầu Lòng của Đấng Cha, Con
  Độc Sinh trong xác thịt, Đấng Cứu Chuộc của thế gian.
- Ngài sống lại từ ngôi mộ để “là trái đầu mùa của những kẻ ngủ” (1 Cô Rinh Tô 15:20). Là Chúa Phục Sinh,
  Ngài viếng thăm những người Ngài đã yêu mến trong cuộc sống. Ngài cũng phục sự giữa các “chiên khác”
  của Ngài (Giăng 10:16) ở Mỹ Châu thời xưa. Trong thế giới hiện đại, Ngài và Cha Ngài hiện đến cùng thiếu
  niên Joseph Smith, khởi đầu cho gian kỳ dài đã hứa “của kỳ mãn” (Ê Phê Sô 1:10).
- 'Về Đấng Ky Tô Hằng Sống, Tiên Tri Joseph đã viết: “Đôi mắt Ngài rực rỡ như ánh lửa; tóc trên đầu của
  Ngài trắng như tuyết mới rơi; nét mặt Ngài sáng hơn cả ánh sáng mặt trời; và tiếng nói của Ngài tợ như
  tiếng nước lớn cuộn chảy, đó là tiếng nói của Đức Giê Hô Va phán truyền rằng:'
- “Ta là đầu tiên và cuối cùng; ta là Đấng đã sống, ta là Đấng đã bị giết chết; ta là Đấng biện hộ cho
  các ngươi với Đức Chúa Cha” (GLGƯ 110:3–4).
- 'Về Ngài, Vị Tiên Tri đã tuyên bố: “Và giờ đây, sau bao nhiêu chứng ngôn mà đã được nói về Ngài, thì
  đây là chứng ngôn, gần đây nhất trong tất cả các chứng ngôn, mà chúng tôi nói về Ngài: Rằng Ngài hằng
  sống!'
- “Vì chúng tôi đã trông thấy Ngài, ngay cả ở bên tay phải của Thượng Đế; và chúng tôi đã nghe được tiếng
  nói làm chứng rằng Ngài là Con Độc Sinh của Đức Chúa Cha—
- “Rằng, bởi Ngài, qua Ngài và do Ngài mà các thế giới đã và đang được sáng tạo, và dân cư trên ấy là
  con trai và con gái của Thượng Đế sinh ra” (GLGƯ 76:22–24).
- Chúng tôi xin tuyên bố bằng những lời long trọng rằng chức tư tế của Ngài và Giáo Hội của Ngài đã được
  phục hồi trên thế gian—“đã được dựng lên trên nền của … các sứ đồ cùng các đấng tiên tri, chính Đức
  Chúa Giê Su Ky Tô là đá góc nhà” (Ê Phê Sô 2:20).
- Chúng tôi xin làm chứng rằng một ngày nào đó Ngài sẽ trở lại thế gian. “Bấy giờ sự vinh hiển của Đức
  Giê Hô Va sẽ hiện ra, và mọi xác thịt đều sẽ xem thấy” (Ê Sai 40:5). Ngài sẽ cai trị như Vua của Các
  Vua và trị vì như Chúa của Các Chúa, và mọi đầu gối sẽ quỳ trước mặt Ngài và mọi lưỡi sẽ ngợi khen thờ
  phượng Ngài. Mỗi người chúng ta sẽ đến đứng trước mặt Ngài để chịu sự phán xét theo những việc làm của
  mình và ước muốn của lòng mình.
- Chúng tôi xin làm chứng, với tư cách là các Sứ Đồ được chính thức sắc phong của Ngài—rằng Chúa Giê Su
  là Đấng Ky Tô Hằng Sống, Vị Nam Tử bất diệt của Thượng Đế. Ngài là vị Vua Em Ma Nu Ên cao trọng, ngày
  nay đứng bên tay phải của Cha Ngài. Ngài là sự sáng, sự sống và hy vọng của thế gian. Con đường của
  Ngài là lối đi dẫn đến hạnh phúc trong cuộc sống này và cuộc sống vĩnh cửu trong thế giới mai sau. Chúng
  tôi xin tạ ơn Thượng Đế cho món quà độc nhất vô nhị của Vị Nam Tử thiêng liêng của Ngài.
