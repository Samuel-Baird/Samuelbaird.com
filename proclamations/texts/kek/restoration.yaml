retrieved: '2026-11-02'
title: Lix K’ojob’ankil Wi’chik lix Tz’aqalil lix Evangelio li Jesukristo
subtitle: Jun jek’inb’il aatin re wiib’ cient chihab’ choq’ re li ruchich’och’
author: Li Xb’eenil Awa’b’ejil ut lix Ch’utameb’ li Kab’laju chi Apostol re Lix Iglees li Jesukristo reheb’
  laj Santil Paab’anel sa’ Roso’jikeb’ li Kutan
note: Kiyaab’asiik li jek’inb’il aatin a’in xb’aan li Awa’b’ej Russell M. Nelson sa’ li jolomil ch’utub’aj-ib’
  190, sa’ 5 Abril 2020, sa’ Lago Salado, Utah.
paragraphs:
- Naqach’olob’ rik’in tiik ruhil aatin naq li Dios naxraheb’ li ralal xk’ajol sa’ chixjunileb’ li tenamit
  re li ruchich’och’. Li Dios Yuwa’b’ej ak xk’e qe lix choxahil yo’lajik, lix yu’am maak’a’ xjuntaq’eetankil,
  ut li junelikil mayej re lix tojb’al rix li maak xb’aan lix Raarookil Alal, li Jesukristo. Xb’aan lix
  wankil li Yuwa’b’ej, li Jesukristo kiwakli wi’chik ut kixq’ax ru li kamk. A’an qaKolonel, aj K’amol
  qab’e, ut aj Tojol qix.
- Wiib’ cient chihab’ chaq, sa’ jun eq’la ch’ina-us sa’ xtiklajik li saq’ehil re 1820, li saaj aj Jose
  Smith, li kiraj xnawb’al b’arwan li iglees tixjunaji wi’ rib’, xko’o sa’ k’iche’ chi tijok, nach’ rik’in
  li rochoch sa’ li estado Nueva York, EUA. Wankeb’ xpatz’om chirix lix kolb’al li raam, ut kixpaab’ naq
  li Dios tixb’eresi.
- Rik’in xtuulanil qach’ool, naqach’olob’ naq re xsumenkil lix tij, li Dios Yuwa’b’ej ut li Jesukristo,
  li Ralal, ke’xk’ut rib’ chiru laj Jose ut ke’xtikib’ “rak’ob’resinkil chixjunil li k’a’aq re ru” (Hechos
  3:21) jo’ yeeb’il junxil sa’ li Santil Hu. Sa’ li k’utb’esink a’in, laj Jose kixtzol naq chirix lix
  kamikeb’ li najteril apostol, lix Iglees li Kristo sa’ li Ak’ Chaq’rab’ kisache’ chaq sa’ li ruchich’och’.
  Laj Jose taawanq choq’ k’anjeleb’aal re xsutq’isinkil wi’chik.
- Naqaye resil naq chi b’eresinb’il xb’aan li Yuwa’b’ej ut li K’ajolb’ej, eb’ li choxahil aj k’amol esil
  ke’chal re xk’eeb’al xna’leb’ laj Jose ut re xxaqab’ankil wi’chik lix Iglees li Jesukristo. Laj Jwan
  aj Kub’sihom Ha’, chi waklijenaq chi yo’yo, kixk’ojob’ wi’chik li wankilal re kub’sink ha’ chi sub’b’il
  rub’el ha’ re risinkileb’ li maak. Oxib’ reheb’ li najteril kab’laju chi apostol—laj Pedro, laj Santiago,
  ut laj Jwan—ke’xk’ojob’ wi’chik li apostolil ut xlaawil lix wankil li tijonelil. Ke’chal xkomoneb’ chik,
  jo’ laj Elias, li kixk’ojob’ wi’chik li wankilal re xjunajinkileb’ li junkab’al chi junelik, sa’ junelikil
  komonil li nakana chirix li kamk.
- 'Naqach’olob’ ajwi’ xyaalal naq kik’eeman re laj Jose Smith lix maatan ut lix wankilal li Dios re xjaltesinkil
  ru jun li najteril esil: lix Hu laj Mormon—Jun chik Ch’olob’anb’il Esil chirix li Jesukristo. Sa’eb’
  lix perelil li loq’laj hu a’in wan resil lix k’anjel li Jesukristo sa’ xyanqeb’ li tenamit sa’ li nimla
  ch’och’ America, ka’ch’inaq xnumik lix waklijik chi yo’yo. Naxk’ut k’a’ru li rajom li yu’am a’in, ut
  naxch’olob’ li tzol’leb’ re li Kristo, li wan sa’ xch’oolil li ajom a’an. Jo’ jun loq’laj hu rochb’een
  li Santil Hu, lix Hu laj Mormon naxk’ut xyaalal naq chixjunileb’ li yo’lajenaqeb’, a’aneb’ ralal ut
  xrab’in jun Yuwa’b’ej aj rahonel sa’ Choxa, naq a’an wan jun xk’uub’anb’il na’leb’ choq’ re li qayu’am,
  ut naq li Jesukristo, li Ralal, na’aatinak anajwan jo’ sa’ najter kutan.'
- Naqach’olob’ naq Lix Iglees li Jesukristo reheb’ laj Santil Paab’anel sa’ Roso’jikeb’ li Kutan, li k’uub’anb’il
  sa’ 6 xb’e li po abril re 1830, a’an lix Iglees li Jesukristo sa’ li Ak’ Chaq’rab’, chi k’ojob’anb’il
  wi’chik. Li Iglees a’in wan chi xaqxo sa’ lix tz’aqal re ru yu’am li xnimal ru pek sa’ xxuk, a’ li Jesukristo,
  ut sa’ lix tojb’al rix li maak xb’aan a’an, ut lix waklijik a’an chi yo’yo. Li Jesukristo ak xb’oqeb’
  wi’chik li apostol ut ak xk’e xwankil li tijonelil reheb’. A’an nokoxb’oq chiqajunilo chi chalk rik’in
  a’an ut rik’in lix Iglees, chixk’ulb’al li Santil Musiq’ej, eb’ li k’ojob’anb’il k’anjel re li kolb’a-ib’,
  ut chixtawb’al li sahil ch’oolejil li ink’a’ na’oso’.
- Ak numenaq wiib’ cient chihab’ naq kitikib’aak li k’ojob’ank wi’chik a’in xb’aan li Dios Yuwa’b’ej ut
  lix Raarookil Alal, li Jesukristo. K’iila millon sa’ chixjunil li ruchich’och’ ak xe’xk’ul xnawom chirixeb’
  li na’leb’ a’in li yeeb’ileb’ resil chi junxilaj xb’aaneb’ profeet.
- Naqach’olob’ chi sa qach’ool naq li k’ojob’ank wi’chik naxik chi uub’ej rik’in li k’utb’esink li toj
  yoo chi k’ulmank. Li ruchich’och’ maajo’q’e taakanaaq jo’ chanru kiwan, xb’aan naq li Dios “tixch’utub’
  sa’ junajil chixjunil li k’a’aq re ru rik’in li Kristo” (Efesios 1:10).
- Rik’in oxloq’ink ut b’antioxink, laa’o jo’ lix apostol naqab’oqeb’ chixjunil chixnawb’al—jo’ naqanaw
  laa’o—naq teeto ru li choxa. Naqaye xyaalal naq li Dios yoo chixk’eeb’al chi nawmank li rajom xch’ool
  choq’ reheb’ lix raarookil alal ut rab’in. Naqach’olob’ xyaalal naq eb’ li neke’xtz’il rix rik’in tijok
  li esilal chirix li k’ojob’ank wi’chik ut neke’xk’anjela li paab’aal te’osob’tesiiq chixk’ulb’al xnawomeb’
  xch’ool chirix lix choxahilal ut chirix li rajom, a’an xkawresinkil li ruchich’och’ choq’ re li xkab’
  xk’ulunik li Qaawa’ ut li qaKolonel Jesukristo, li ak yeechi’inb’il chaq.
