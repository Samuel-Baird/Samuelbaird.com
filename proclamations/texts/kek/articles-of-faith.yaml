title: Eb’ lix Raqalil li Paab’aal
subtitle: re Lix Iglees li Jesukristo reheb’ laj Santil Paab’anel sa’ Roso’jikeb’ li Kutan
author: ''
verses:
- n: 1
  text: Laa’o naqapaab’ li Dios, li Junelik Yuwa’b’ej, ut li Jesukristo, li Ralal, ut li Santil Musiq’ej.
- n: 2
  text: Laa’o naqapaab’ naq eb’ li winq te’k’ehe’q xtojb’a-maak xb’aan tz’aqal lix maakeb’ a’an, ut moko
    xb’aan ta li q’etok aatin re laj Adan.
- n: 3
  text: Laa’o naqapaab’ naq sa’ xk’ab’a’ lix tojb’al rix li maak xb’aan li Kristo, chixjunileb’ li winq
    neke’ru chi kole’k, rik’in ab’ink chiru li chaq’rab’ ut k’ojob’anb’il k’anjel re li Evangelio.
- n: 4
  text: 'Laa’o naqapaab’ naq li xb’een raqal chi na’leb’ ut k’ojob’anb’il k’anjel re li Evangelio a’aneb’:
    xb’een, Xpaab’ankil li Qaawa’ Jesukristo; xkab’, Li jalb’a-k’a’uxlej; rox, Li kub’iha’ chi sub’b’il
    choq’ re risinkil li maak; xkaa, Xk’eeb’al li uq’ej choq’ re li maatan re li Santil Musiq’ej.'
- n: 5
  text: Laa’o naqapaab’ naq jun li winq tento taab’oqe’q xb’aan li Dios, rik’in profeetil aatin, ut rik’in
    xk’eeb’al li uq’ej xb’aaneb’ li k’eeb’ileb’ xwankil, re tixjultika li Evangelio ut tixk’anjela li
    k’ojob’anb’il k’anjel li wan chi sa’.
- n: 6
  text: Laa’o naqapaab’ li Iglees jo’ chanru ajwi’ naq k’uub’anb’il chaq najter, a’an rik’ineb’ li apostol,
    li profeet, laj k’aak’alenel, laj tzolonel, laj osob’tesinel, ut xkomoneb’ chik.
- n: 7
  text: Laa’o naqapaab’ naq wan li maatan re li jalanil aatinob’aal, li profeetil aatin, li k’utb’esink,
    li k’utb’esinb’il matk’, li k’irtesink, xk’utb’al xyaalal li jalanil aatinob’aal, ut xkomoneb’ chik.
- n: 8
  text: Laa’o naqapaab’ naq li Santil Hu a’an raatin li Dios a’ yaal jo’ jaltesinb’il ru chi tiik; naqapaab’
    ajwi’ naq lix Hu laj Mormon a’an raatin li Dios.
- n: 9
  text: Laa’o naqapaab’ chixjunil li ak xk’utb’esi li Dios, chixjunil li naxk’utb’esi anajwan, ut naqapaab’
    naq toj tixk’utb’esi k’iila na’leb’ li xninqaleb’ ru ut ninqeb’ xwankil chirix lix Awa’b’ejihom li
    Dios.
- n: 10
  text: Laa’o naqapaab’ naq taach’utub’amanq Israel chi yaal, ut naq te’k’ojob’amanq wi’chik li Lajeeb’
    Teepal; naq Sion (li Ak’ Jerusalen) taakab’lamanq sa’ xb’een li nimla ch’och’ America; naq li Kristo
    ajwi’ taa’awa’b’ejinq sa’ xb’een li ruchich’och’, ut naq li ruchich’och’ taa’ak’ob’resiiq ru ut tixk’ul
    lix choxahil loq’al.
- n: 11
  text: Laa’o naqaye naq wan li qak’ulub’ xloq’oninkil li Nimajwal Dios jo’ chanru naxtaqla tz’aqal li
    reek’ob’aal li qach’ool, ut naqak’e xk’ulub’eb’ chixjunil li winq chixb’aanunkil chi jo’kan, maak’a’
    naxye chanru, b’ar, ut k’a’ru neke’xloq’oni.
- n: 12
  text: Laa’o naqapaab’ naq na’ajman wank rub’el xwankileb’ li rey, li awa’b’ej, laj taqlanel, ut laj
    k’anjenel re poopol, jo’ ajwi’ xpaab’ankil, roxloq’inkil, ut xwaklesinkil li chaq’rab’.
- n: 13
  text: Laa’o naqapaab’ naq tento naq maak’a’aq qab’alaq’, yaalaqo, saqaq ru qach’ool, aj k’ehonelaqo,
    chaab’ilaq qayu’am, ut naq taqab’aanu li chaab’ilal re chixjunileb’ li winq; chi yaal naru naqaye
    naq naqataaqe lix yehom laj Pablo—Chixjunil naqapaab’, chixjunil naqayo’oni, ak xqakuy naab’al li
    k’a’aq re ru, ut naqaj ruhank chixkuyb’al chixjunil li k’a’aq re ru. Wi wan k’a’ruhaq li saq ru, li
    chaq’al ru, li chaab’il esil yeeb’il chirix malaj nimajel ru, naqasik’ li k’a’aq re ru a’in.
