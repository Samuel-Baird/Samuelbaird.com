slug: restoration
language: hmn
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=hmn
retrieved: '2026-11-02'
title: Kev Muab Yexus Khetos Txoj Moo Zoo uas Muaj Txhij Txhua Txum Tim Rov Qab Los
subtitle: Ib zaj Lus Tshaj Tawm rau lub Ntiaj Teb Nco txog Ob Puas Xyoo Tas Los
author: Thawj Pawg Thawj Tswj Hwm thiab Pawg Kaum Ob tug Thwj Tim ntawm Yexus Khetos lub Koom Txoos ntawm
  Tsoom Haiv Neeg Ntseeg hauv Hnub Nyoog Kawg
note: Thawj Tswj Hwm Russell M. Nelson tau nyeem zaj lus tshaj tawm no ua ib feem ntawm nws zaj lus hais
  nyob ntawm lub Tuam Rooj Sab Laj thib 190, lub Plaub Hlis Ntuj hnub tim 5, 2020, nyob hauv Salt Lake
  City, Utah.
paragraphs:
- Peb tshaj tawm tias Vajtswv hlub Nws cov me nyuam nyob hauv txhua lub teb chaws hauv lub ntiaj teb.
  Vajtswv tus uas yog Leej Txiv tau muab Nws Leej Tub, Yexus Khetos, txoj kev yug los, Nws lub neej, thiab
  Nws txoj kev txi theej txhoj pub rau peb. Los ntawm Leej Txiv lub hwj chim, Yexus tau sawv rov los thiab
  kov yeej kev tuag. Nws yog peb tus Cawm Seej, peb tus Yam Ntxwv, thiab peb tus Txhiv Dim.
- Ob puas xyoo tas los, yog ib tag kis sawv ntxov zoo nkauj hauv lub caij nplooj ntoo hlav rau xyoo 1820,
  Joseph Smith yog ib tug tub hluas uas xav paub seb nws yuav tsum koom lub koom txoos twg, nws thiaj
  li mus thov Vajtswv hauv hav zoov ze nws lub tsev nyob hauv lub xeev New York, lub Teb Chaws Amelikas.
  Nws xav paub seb nws puas yuav txais kev cawm seej thiab nws tso siab tias Vajtswv yuav coj nws txoj
  hau kev.
- Peb txo hwj chim tshaj tawm hais tias xwv kom teb nws tej lus thov, Vajtswv tus uas yog Leej Txiv thiab
  Nws Leej Tub, Yexus Khetos, tau tshwm sim rau Joseph thiab qhib kev rau “kev muab txhij txhua txum tim
  rov qab los” (Tes Hauj Lwm 3:21) raws li hais nyob hauv phau Npaivnpaum. Nyob hauv txoj kev ua yog toog
  no, nws kawm tias tom qab cov Thwj Tim tau tuag tas lawm, Khetos lub Koom Txoos hauv Phau Tshiab twb
  ploj mus thiaj tsis nyob hauv lub ntiaj teb no ntxiv lawm. Joseph yuav pab muab lub Koom Txoos no txum
  tim rov qab los.
- Peb qhia tseeb tias raws li Leej Txiv thiab Leej Tub tau qhia, cov tub xa xov saum ntuj tau los qhia
  Joseph thiab rov qab txhim tsa Yexus Khetos lub Koom Txoos. Yauhas tus uas Muab Neeg Ua Kev Cai Raus
  Dej tau sawv rov los thiab tau muab txoj cai txum tim rov qab los txoj cai ua kev cai raus dej kom zam
  txim rau tej kev txhaum. Peb tug ntawm Yexus kaum ob tug Thwj Tim thaum ub—Petus, Yakaunpaus, thiab
  Yauhas—tau muab kev ua thwj tim thiab cov yawm sij ntawm txoj cai pov thawj hwj txum tim rov qab los.
  Muaj lwm tus uas nqis los thiab, xws li Eliyas, uas muab txoj cai txum tim rov qab los kom khi tsev
  neeg ua ke mus ib txhis dhau kev tuag.
- 'Peb kuj ua tim khawv tias tau muab Vajtswv lub txiaj ntsim thiab lub hwj chim txhais lus rau Joseph
  Smith kom txhais ib phau ceev xwm txheej uas sau puag thaum ub—Phau Ntawv Maumoos: Ib zaj Tim Khawv
  Ntxiv txog Yexus Khetos. Nyob hauv cov ntawv dawb ceev no muaj ib zaj lus uas hais txog Yexus Khetos
  txoj kev qhuab qhia rau ib co neeg nyob hauv lub Ntiaj Teb Sab Hnub Poob tsis ntev tom qab Nws txoj
  Kev Sawv Rov Los. Phau no qhia txog lub hom phiaj ntawm lub neej no thiab piav txog Khetos cov lus qhuab
  qhia, uas tseem ceeb kawg nkaus rau lub hom phiaj ntawd. Yog cov vaj lug kub uas koom ua ke nrog phau
  Npaivnpaum, Phau Ntawv Maumoos ua tim khawv tias txhua tus neeg yog cov tub thiab cov ntxhais ntawm
  ib Leej Txiv Saum Ntuj uas muaj siab hlub, Nws muaj ib txoj hau kev rau peb lub neej, thiab Nws Leej
  Tub, Yexus Khetos, hais lus rau peb niaj hnub no ib yam li Nws tau hais puag thaum ub.'
- Peb tshaj tawm hais tias Yexus Khetos lub Koom Txoos ntawm Tsoom Haiv Neeg Ntseeg hauv Hnub Nyoog Kawg,
  uas tau txhim tsa thaum lub Plaub Hlis Ntuj hnub tim 6, xyoo 1830, yog Khetos lub Koom Txoos hauv Phau
  Tshiab uas Nws tau muab txum tim rov qab los. Lub Koom Txoos yeej txheem rau Yexus Khetos lub neej zoo
  tag nrho, uas yog lub Koom Txoos tus ncej zeb tag, thiab txheem rau Nws txoj Kev Theej Txhoj uas kav
  ib txhis thiab Nws txoj Kev Sawv Rov Los. Yexus Khetos twb tau rov qab hu cov Thwj Tim thiab tau muab
  txoj cai pov thawj hwj rau lawv. Nws caw peb txhua tus los cuag Nws thiab Nws lub Koom Txoos, txais
  tus Vaj Ntsuj Plig Dawb Huv, cov kab ke cawm seej, thiab muaj kev xyiv fab uas kav ib txhis.
- Ob puas xyoo twb dhau mus tom qab Vajtswv tus uas yog Leej Txiv thiab Nws Leej Tub uas Nws Hlub, Yexus
  Khetos, tau qhib Kev Muab Txoj Moo Zoo Txum Tim Rov Qab Los no. Tib neeg coob heev nyob thoob plaws
  lub ntiaj teb twb tau tso siab plhuav rau tej xwm no uas cov yaj saub tau hais txog.
- Peb zoo siab tshaj tawm tias lub Caij Nyoog Txum Tim Rov Qab Los no tseem muaj mus tom ntej los ntawm
  kev tshwm sim uas tsis tu tsis tseg. Lub ntiaj teb yeej yuav tsis zoo li qub, vim Vajtswv yuav “sau
  txhua yam los ua ib ke rau Khetos ua tus thawj” (Efexus 1:10).
- Nrog kev tswm seeb thiab kev ris txiaj, peb cov uas yog Nws cov Thwj Tim caw kom txhua tus paub—ib yam
  li peb paub—hais tias rooj ntug twb qhib plho lawm. Peb qhia tseeb tias Vajtswv qhia Nws lub siab nyiam
  rau Nws cov tub thiab cov ntxhais uas Nws hlub. Peb ua tim khawv tias cov uas thov Vajtswv thaum lawv
  kawm txog lub Caij Nyoog Txum Tim Rov Qab Los thiab muab siab rau ntseeg lawv yuav txais kev ua tim
  khawv tias zaj no los saum ntuj los thiab muaj lub hom phiaj kom npaj lub ntiaj teb rau peb tus Tswv
  thiab tus Cawm Seej, Yexus Khetos, txoj Kev Los Zaum Ob.
