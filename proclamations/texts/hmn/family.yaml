title: Tsev Neeg
subtitle: Ib zaj Lus Tshaj Tawm rau lub Ntiaj Teb
author: Thawj Pawg Thawj Tswj Hwm thiab Pawg Kaum Ob tug Thwj Tim ntawm Yexus Khetos lub Koom Txoos ntawm
  Tsoom Haiv Neeg Ntseeg hauv Hnub Nyoog Kawg
note: Thawj Tswj Hwm Gordon B. Hinckley tau nyeem zaj lus tshaj tawm no ua ib feem ntawm nws zaj lus hais
  nyob ntawm Koom Haum Niam Tsev lub Tuam Rooj Sib Ntsib uas muaj lub Cuaj Hlis Ntuj hnub tim 23, 1995,
  hauv Salt Lake City, Utah.
paragraphs:
- Peb, uas yog Thawj Pawg Thawj Tswj Hwm thiab Pawg Kaum Ob tug Thwj Tim ntawm Yexus Khetos lub Koom Txoos
  ntawm Tsoom Haiv Neeg Ntseeg hauv Hnub Nyoog Kawg, tshaj tawm tiag tiag hais tias txoj kev ua txij ua
  nkawm ntawm ib tug txiv neej thiab ib tug poj niam yog Vajtswv tsa los thiab hais tias tsev neeg yog
  lub ntsiab ntawm Leej Tsim txoj hau kev rau Nws cov me nyuam txoj hmoov nyob mus ib txhis li.
- Txhua txhia tus tib neeg—txiv neej thiab poj niam—yog Vajtswv tsim kom muaj yam ntxwv zoo li Nws. Txhua
  tus yog leej niam leej txiv saum ntuj ceeb tsheej ib tug tub ntsuj plig los yog ib tug ntxhais ntsuj
  plig uas nkawd hlub, thiab, vim yog li ntawd, txhua tus muaj ib tug cwj pwm thiab txoj hmoov los saum
  ntuj los. Qhov uas yus yog ib tug poj niam los yog ib tug txiv neej yog ib yam tseem ceeb ntawm ib tug
  neeg tus xeeb ceem thiab lub ntsiab, nyob hauv lub neej ua ntej yug los, lub neej no, thiab lub neej
  nyob mus ib txhis li.
- Nyob rau lub neej ua ntej yug los, tej tub ntsuj plig thiab tej ntxhais ntsuj plig tau paub thiab teev
  tiam Vajtswv ua lawv Leej Txiv uas Nyob Mus Ib Txhis Li thiab lawv tau txais yuav Nws txoj hau kev uas
  tau npaj tseg lawm hais tias Nws cov me nyuam yuav txais tau ib lub cev nqaij daim tawv thiab yuav muaj
  ib lub sij hawm hauv lub ntiaj teb no kom xyaum ua neeg zoo tag nrho thiab thaum kawg txais tau lawv
  txoj hmoov los saum ntuj los ua cov uas txais txoj sia nyob mus ib txhis ua lawv tug. Los ntawm txoj
  hau kev zoo siab los saum ntuj los, kev ua niam ua txiv, ua tub ua ntxhais, ua kwv ua tij, ua neej ua
  tsa thiaj nyob tau mus li tom qab lub neej no. Tej kab ke thiab tej kev khi lus dawb ceev uas muaj hauv
  tej tuam tsev dawb huv ua rau tib neeg rov qab mus nyob tau ntawm Vajtswv lub xub ntiag thiab ua rau
  tsev neeg nyob tau ua ke mus ib txhis li.
- Thawj txoj lus txib uas Vajtswv txib kom Adas thiab E-vas ua hais ntsig txog nkawd txoj kev ua niam
  ua txiv. Peb tshaj tawm hais tias Vajtswv txoj lus txib uas hais kom nws cov me nyuam huaj vam mus puv
  tas lub ntiaj teb tseem muaj ceem li qhov qub. Tsis tas li ntawd xwb, peb tshaj tawm ntxiv hais tias
  Vajtswv tau txib kom tej hwj chim dawb ceev ntawm txoj kev muaj tub muaj ki yuav tsum siv tsuas yog
  ntawm ib tug txiv neej thiab ib tug poj niam xwb, uas tau sib yuav raws li kev cai lij choj ua niam
  ua txiv.
- Peb tshaj tawm hais tias Vajtswv yog tus uas tau tsa txoj kev uas yus tsim tau txoj sia hauv ntiaj teb
  no. Peb pom zoo rau qhov uas ib tug neeg txoj sia yog ib yam tseem ceeb dawb ceev thiab qhov uas nws
  tseem ceeb rau Vajtswv txoj hau kev nyob mus ib txhis li.
- Ib khub niam txiv twg los muaj ib txoj kev lav ris tseem ceeb kom ib tug hlub thiab saib xyuas ib tug
  thiab kom hlub thiab saib xyuas nkawd cov me nyuam. “Me nyuam yog tej paj tshab uas tus Tswv pub rau
  neeg” (Phau Ntawv Nkauj 127:3). Niam txiv muaj ib lub luag hauj lwm dawb ceev kom cob qhia nkawd cov
  me nyuam raws li kev hlub thiab kev ncaj ncees, kom npaj muab raws li cov me nyuam xav tau ntawm sab
  nqaij daim tawv thiab sab ntsuj plig, thiab kom qhia lawv sib hlub thiab sib pab, kom ua raws li Vajtswv
  tej lus txib, thiab kom ua pej xeem uas ua raws li kev cai lij choj, txawm nyob qhov twg los xij. Tej
  txiv thiab poj niam—niam tsev thiab txiv tsev—yuav muaj ib hnub uas lawv yuav los lav lees rau Vajtswv
  saib lawv puas tau ua tej kev lav ris no tiav lawm.
- Vajtswv yog tus uas tsa tsev neeg. Txoj kev sib yuav ntawm ib tug txiv neej thiab ib tug poj niam tseem
  ceeb heev rau Nws txoj hau kev nyob mus ib txhis li. Tsim nyog uas cov me nyuam yug los raws li txoj
  kev sib khi ntawm txoj kev sib yuav, thiab tsim nyog muaj niam muaj txiv, uas ua ib siab hawm tej lus
  cog tseg ntawm txoj kev sib yuav, cob lawv loj hlob. Ib tse neeg twg haj yam yuav txais tau kev zoo
  siab hauv lawv lub neej no thaum tus Tswv Yexus Khetos cov lus qhuab qhia yog lawv lub hauv paus. Tej
  kev sib yuav thiab tej tsev neeg uas kav ntev tau mus tsa thiab nyob mus li los ntawm tej kev cai xws
  li kev ntseeg, kev thov Vajtswv, kev hloov siab lees txim, kev zam txim, kev sib hwm, kev hlub, kev
  khuv leej, kev ua hauj lwm, thiab kev ua si uas tsim nyog ua. Los ntawm lub tswv yim los saum ntuj los,
  cov txiv tsev yuav tsum kav lawv tsev neeg los ntawm kev hlub thiab kev ncaj ncees thiab lav ris npaj
  ua kom muaj tej yam uas lawv tsev neeg yuav tsum muaj kom thiaj ua neej tau thiab txais tau kev pov
  hwm rau lawv tsev neeg. Cov niam tsev txoj kev lav ris thib ib yog tu lawv cov me nyuam. Nyob rau tej
  kev lav ris tseem ceeb dawb ceev no, tej niam tsev txiv tsev yuav tsum sib pab xws li nkawd nyob sib
  txig. Tej zaum kev mob nkeeg, kev tuag, los yog lwm yam yuav ntxim ua txawv tej lus no. Thaum twg ib
  tsev neeg xav tau kev pab ces tsim nyog tej kwv tij neej tsa cev tes mus pab thiab.
- Peb ceeb toom hais tias cov neeg uas ua txhaum tej kev khi lus ntawm kev coj dawb huv, cov uas tsim
  txom lawv tus khub los yog lawv cov me nyuam, los yog cov uas tsis ua raws li tej kev lav ris rau lawv
  tsev neeg yuav muaj ib hnub twg uas lawv yuav lav ris txog tej no rau ntawm Vajtswv lub xub ntiag. Tsis
  tas li ntawd xwb, peb ceeb toom hais tias txoj kev puas tsuaj ntawm tsev neeg yuav coj tej kev kub ntxhov
  uas cov yaj saub thaum ub thiab niaj hnub nim no hais txog los raug tej tib neeg, zej zog, thiab teb
  chaws.
- Peb hais kom cov pej xeem zoo thiab cov nom tswv ntawm tseem fwv nyob txhua qhov txhia chaw txhawb nqa
  tej kev lis kev cai uas tsim kom yug thiab ntxiv dag zog rau tsev neeg kom tsev neeg thiaj ua tau lub
  sawm fem pawg neeg tseem ceeb tshaj plaws.
