title: Tus Khetos uas Muaj Txoj Sia Nyob
subtitle: Cov Thwj Tim Tej Lus Tim Khawv
author: Yexus Khetos lub Koom Txoos ntawm Tsoom Haiv Neeg Ntseeg hauv Hnub Nyoog Kawg
paragraphs:
- Thaum peb nco txog Yexus Khetos txoj kev yug los hauv ntiaj teb uas tau muaj ob txhiab xyoos tas los
  lawm, peb hais peb tej lus tim khawv txog Nws lub neej uas zoo tshaj plaws thiab txog Nws txoj kev theej
  txhoj uas muaj hwj chim tsis txawj kawg. Tsis tau muaj leej twg uas tau pab cov neeg uas nyob hauv ntiaj
  teb no npaum li Nws tau pab.
- Nws yog tus Yehauvas Zoo Kawg Nkaus hauv Phau Qub, tus Mexiyas hauv Phau Tshiab. Nws yog tus tsim lub
  ntiaj teb no los ntawm Nws Leej Txiv txoj kev txib. “Nws tsim ib puas tsav yam huv tib si; ib puas tsav
  yam ntawd, tsis muaj ib yam twg uas tsis yog nws tsim li” (Yauhas 1:3). Txawm yog Nws tsis muaj txim
  txhaum hlo li, Nws tau ua kev cai raus dej kom muaj raws li tag nrho kev ncaj ncees. Nws “mus thoob
  plaws txhua qhov chaw … ua hauj lwm zoo” (Tes Hauj Lwm 10:38), tiam sis tseem muaj neeg ntxub Nws vim
  Nws tau ua tej ntawd. Nws tau taug tej kev hauv lub teb chaws Filitees, kho cov neeg mob, ua rau cov
  dig muag pom kev, thiab tsa cov neeg uas tuag lawm sawv rov los. Nws tau qhia tej lus tseeb txog kev
  nyob mus ib txhis, qhia tias peb lub qub neej zoo li cas, qhia tias lub ntsiab ntawm lub neej no yog
  dab tsi, thiab qhia tias Vajtswv cov tub thiab cov ntxhais yuav tau dab tsi hauv lub neej tom ntej no.
- Nws tau ua lub cim nco txog kom peb nco txog Nws txoj kev theej txhoj uas zoo kawg nkaus. Nws raug kaw
  thiab raug txim rau tej yam Nws tsis tau ua, tau raug liam txim kom ib pab neeg siab phem thiaj txaus
  siab, thiab Nws tau raug tua tuag ntawm ib tug ntoo khaub lig saum lub roob Khaulakhauthas. Nws muab
  Nws txoj sia theej noob neej tag nrho tej kev txog kev txhaum. Nws lub txiaj ntsim zoo kawg nkaus no
  yog kom pab txhua tus neeg uas yuav nyob hauv ntiaj teb.
- Peb ua tim khawv tias Nws lub neej, uas tseem ceeb rau kev suav xyoo hauv ntiaj teb, tsis tau pib hauv
  lub nroog Npelehees los sis tsis tau kaw saum lub roob Khaulakhauthas. Nws yog Leej Txiv Thawj Tug Yug,
  Vajtswv Tib Leeg Tub, thiab lub ntiaj teb tus Cawm Seej.
- Nws tau sawv hauv lub qhov ntxa los kom ua thawj tug uas sawv hauv qhov tuag rov qab los (saib 1 Kauleethaus
  15:20). Tom qab tus Tswv tau sawv rov los, Nws tau mus xyuas cov uas Nws hlub hauv Nws lub neej. Nws
  kuj mus xyuas Nws lwm pab yaj (saib Yauhas 10:16) hauv teb chaws Amelikas thaum ub. Hauv lub caij nyoog
  kawg no, Nws thiab Nws Txiv tau mus xyuas tus tub hluas Joseph Smith, kom pib lub caij nyoog tso txoj
  cai uas muaj txhij txhua (saib Efexus 1:10) uas tau cog lus tseg lawm.
- 'Tus Yaj Saub Joseph Smith tau hais txog tus Khetos uas Muaj Txoj Sia Nyob hais tias: “Nws ob lub qhov
  muag zoo li ib tug nplaim hluav taws; cov plaub ntawm nws lub taub hau dawb zoo li cov tseem daus; nws
  lub ntsej muag ci tshaj qhov lub hnub ci; thiab nws lub suab zoo li lub suab dej tsaws tsag loj loj,
  twb yog lub suab ntawm Yehauvas, hais tias:'
- “Kuv yog tus thawj thiab tus kawg; kuv yog tus uas muaj sia nyob, kuv yog tus uas raug tua tuag; kuv
  yog tus sawv cev uas daws nej zaj ntawm Leej Txiv” (Q&K 110:3–4).
- 'Tus Yaj Saub kuj tau hais tias: “Thiab nim no, tom qab tej lus tim khawv ntau uas tau hais txog nws
  lawm, zaj no yog zaj lus tim khawv, zaj kawg nkaus, uas wb hais txog nws: Hais tias nws muaj txoj sia
  nyob!'
- “Vim wb pom nws, nyob ntawm Vajtswv sab tes xis; thiab wb hnov lub suab ua tim khawv tias nws yog Leej
  Txiv Tib Leeg Tub—
- “Hais tias los ntawm nws, thiab vim yog nws, thiab yog ntawm nws, tej ntuj los muab tsim thiab tau muab
  tsim tas los, thiab cov neeg uas nyob rau hauv tej lub ntuj ntawd yog cov tub thiab cov ntxhais uas
  yug los rau Vajtswv” (Q&K 76:22–24).
- Peb muaj lub siab mos siab muag tshaj tawm hais tias Nws lub pov thawj hwj thiab Nws lub Koom Txoos
  muaj rov qab los nyob hauv ntiaj teb no lawm—los ua rau saum tej ncej …uas yog cov thwj tim thiab cov
  yaj saub, Yexus Khetos kiag yog tus ncej tas (saib Efexus 2:20).
- Peb ua tim khawv tias yuav muaj ib hnub twg uas Nws yuav rov qab los nyob hauv ntiaj teb. “Thaum ntawd
  tus Tswv yuav muab nws lub hwj chim ci ntsa iab nthuav qhia rau neeg ntiaj teb txhua tus pom” (Yaxayas
  40:5). Nws yog tus vaj ntxwv uas kav tag nrho tej vaj ntxwv thiab tus Tswv uas kav tag nrho tej tswv,
  thiab txhua lub hauv caug yuav tsum tau txhos thiab txhua tus nplaig yuav tau pe hawm tab meeg Nws.
  Peb txhua tus yuav sawv ntawm Nws lub xub ntiag los raug txiav txim raws li peb tej hauj lwm thiab raws
  li peb lub siab tej kev xav.
- Peb ua Nws cov Thwj Tim uas Nws tau tsa li kev cai hais lus tim khawv—hais tias Yexus yog tus Khetos
  uas muaj txoj sia nyob, Vajtswv Leej Tub uas tsis txawj tuag. Nws yog tus Vaj Ntxwv Emanu-es zoo, uas
  niaj hnub sawv ntawm Nws Leej Txiv sab tes xis. Nws yog txoj kev kaj, yog txoj sia, thiab kev cia siab
  rau lub ntiaj teb. Nws txoj kev yeej yog txoj kev uas coj peb mus rau txoj kev zoo siab hauv lub neej
  no thiab rau txoj sia nyob mus ib txhis hauv lub neej tom ntej no. Peb ua Vajtswv tsaug rau Nws lub
  txiaj ntsim zoo tshaj plaws uas yog Nws Leej Tub.
