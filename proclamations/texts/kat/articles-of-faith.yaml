title: რწმენის სიმბოლოები
subtitle: უკანასკნელ დღეთა წმინდანთა იესო ქრისტეს ეკლესიის
author: ''
verses:
- n: 1
  text: ჩვენ გვწამს ღმერთის, მარადიული მამის, და მისი ძის, იესო ქრისტესი და სულიწმინდის.
- n: 2
  text: ჩვენ გვწამს, რომ ადამიანი დაისჯება თავისი ცოდვების გამო და არა ადამის შეცოდებისათვის.
- n: 3
  text: ჩვენ გვწამს, რომ ქრისტეს გამოსყიდვის მეშვეობით შეიძლება მთელი კაცობრიობის ხსნა, სახარების კანონებისა
    და წეს-ჩვეულებების დაცვით.
- n: 4
  text: 'ჩვენ გვწამს, რომ სახარების უპირველესი პრინციპები და წეს-ჩვეულებებია: პირველი – რწმენა უფალ იესო
    ქრისტეში; მეორე – მონანიება; მესამე – წყალში ჩასვლით ნათლობა ცოდვების მისატევებლად; მეოთხე – ხელდასხმა
    სულიწმინდის ძღვენის მისაღებად.'
- n: 5
  text: ჩვენ გვწამს, რომ ადამიანი მოწოდებული უნდა იყოს ღმერთის მიერ, წინასწარმეტყველებით და უფლებამოსილი
    ადამიანების მიერ ხელდასხმით, რათა იქადაგოს სახარება და შეასრულოს მისი წეს-ჩვეულებები.
- n: 6
  text: 'ჩვენ გვწამს იგივე წყობა, რაც არსებობდა პირველყოფილ ეკლესიაში, სახელდობრ: მოციქულები, წინასწარმეტყველები,
    პასტორები, მასწავლებლები, ევანგელისტები და ა.შ.'
- n: 7
  text: ჩვენ გვწამს სხვადასხვა ენებზე ლაპარაკის, წინასწარმეტყველების, გამოცხადების, ხილვების, განკურნების,
    ენების თარგმნის ძღვენისა და ა.შ.
- n: 8
  text: ჩვენ გვწამს, რომ ბიბლია არის ღმერთის სიტყვა, რამდენადაც იგი სწორად არის თარგმნილი; ჩვენ ასევე
    გვწამს, რომ მორმონის წიგნი ღმერთის სიტყვაა.
- n: 9
  text: ჩვენ გვწამს ყოველივე, რაც ღმერთმა გამოაცხადა, ყოველივე, რასაც ის ახლა აცხადებს და ჩვენ გვწამს,
    რომ ის კიდევ გამოაცხადებს ბევრ დიად და მნიშვნელოვანს, რაც ღვთის სასუფეველს ეხება.
- n: 10
  text: ჩვენ გვწამს ისრაელის ნამდვილი შეკრებისა და ათი ტომის აღდგენის; რომ სიონი (ახალი იერუსალიმი) დაფუძნდება
    ამერიკის კონტინენტზე; რომ ქრისტე თვით იმეფებს დედამიწაზე; და რომ დედამიწა განახლდება და მიიღებს სამოთხისებურ
    დიდებას.
- n: 11
  text: ჩვენ ვაცხადებთ უფლებას, საკუთარი სინდისის თანახმად თაყვანი ვცეთ ყოვლადძლიერ ღმერთს და ყველას ვრთავთ
    ნებას, ჰქონდეთ იგივე უფლება, თაყვანი სცენ რასაც სურთ, როგორც სურთ და სადაც სურთ.
- n: 12
  text: ჩვენ გვწამს, რომ უნდა ვემორჩილებოდეთ მეფეებს, პრეზიდენტებს, სახელმწიფო მმართველებს და მოსამართლეებს,
    კანონების დაცვით, პატივისცემითა და მხარდაჭერით.
- n: 13
  text: ჩვენ გვწამს, რომ უნდა ვიყოთ პატიოსანნი, მართალნი, უბიწონი, კეთილმოსურნენი, მაღალზნეობრივნი და
    ვაკეთოთ სიკეთე ყველას მიმართ; ჭეშმარიტად, ჩვენ შეგვიძლია ვთქვათ, რომ ჩვენ მივდევთ პავლე მოციქულის
    შეგონებას, ჩვენ გვწამს ყველაფერი, ყველაფრის იმედი გვაქვს, ჩვენ ბევრი გადავიტანეთ და ვიმედოვნებთ, რომ
    ყველაფერს გადავიტანთ. თუ არსებობს რაიმე კეთილი, მშვენიერი, ქებისა და პატივისცემის ღირსეული, ჩვენ ვესწრაფვით
    ყოველივე ამას.
signature: ჯოზეფ სმითი.
