title: ოჯახი
subtitle: მოწოდება მსოფლიოს
author: უკანასკნელ დღეთა წმინდანთა იესო ქრისტეს ეკლესიის პირველი პრეზიდენტობა და თორმეტ მოციქულთა საბჭო
note: ეს მოწოდება არის მოწყალების საზოგადოების გენერალურ კონფერენციაზე პრეზიდენტ გორდონ ბ. ჰინკლის სიტყვით
  გამოსვლის ნაწილი, 1995 წლის 23 სექტემბერს, სოლთ-ლეიქ სითიში, იუტაში.
paragraphs:
- ჩვენ, პირველი პრეზიდენტობა და თორმეტ მოციქულთა საბჭო, რომელიც ეკუთვნის უკანასკნელ დღეთა წმინდანთა იესო
  ქრისტეს ეკლესიას, საჯაროდ ვაცხადებთ, რომ ქორწინება კაცსა და ქალს შორის დაწესებულია ღმერთის მიერ და ოჯახი
  არის შემქმნელის გეგმის მთავარი ნაწილი, მისი შვილების მარადიულ დანიშნულებაში.
- ყოველი ადამიანი – მამაკაცი და ქალი – ღმერთმა შექმნა თავის ხატად. თითოეული არის ზეციერი მშობლების საყვარელი
  სულიერი ძე ან ქალიშვილი, რის გამოც ყოველ მათგანს გააჩნია ღვთაებრივი ბუნება და დანიშნულება. სქესი არის
  პიროვნების ძირითადი დამახასიათებელი ნიშანი, მისი წინამიწიერი, მიწიერი და მარადიული სიცოცხლის დანიშნულების
  და მიზნისათვის.
- წინამიწიერ ცხოვრებაში სულიერი ვაჟიშვილები და ქალიშვილები იცნობდნენ და თაყვანს სცემდნენ ღმერთს, როგორც
  თავიანთ მარადიულ მამას და აღიარეს მისი გეგმა, რომლის მიხედვით მის შვილებს ეძლევათ შესაძლებლობა, მიიღონ
  ფიზიკური სხეული და ამქვეყნიერი, მიწიერი გამოცდილება, რათა გახდნენ სრულყოფილნი და მიაღწიონ თავიანთ ღვთაებრივ
  დანიშნულებას, როგორც მარადიული სიცოცხლის მემკვიდრენი. ბედნიერების ღვთიური გეგმა საშუალებას აძლევს ოჯახურ
  ურთიერთობებს იმისათვის, რომ ისინი გაგრძელდნენ სიკვდილის შემდეგ. ტაძრებში შესაძლებელია წმინდა წეს-ჩვეულებების
  და აღთქმების მიღება, რომლებიც პიროვნებას აძლევს უფლის სასუფეველში დაბრუნების საშუალებას და მარადიულად
  აერთიანებს ოჯახებს.
- 'პირველი მცნება, რომელიც ღმერთმა ადამს და ევას მისცა, ეს იყო შესაძლებლობა იმისა, რომ მათ, როგორც ქმარს
  და ცოლს, გამხდარიყვნენ მშობლები. ჩვენ ვაცხადებთ, რომ ღმერთის მცნება მისი შვილებისათვის: ინაყოფიერეთ
  და იმრავლეთ, კვლავ ძალაშია. ჩვენ ასევე ვაცხადებთ, რომ ღმერთის ბრძანებით შთამომავლობის გაჩენის წმინდა
  ძალა უნდა გამოყენებული იყოს მხოლოდ იმ მამაკაცისა და ქალის მიერ, რომლებიც არიან კანონიერად დაქორწინებული,
  როგორც ცოლი და ქმარი.'
- ჩვენ ვაცხადებთ, რომ წესი, რომლის მიხედვითაც არის მოკვდავი ცხოვრება შექმნილი, დადგენილია უფლის მიერ.
  ჩვენ ვამტკიცებთ ცხოვრების სიწმინდეს და მის მნიშვნელობას ღმერთის მარადიულ გეგმაში.
- ქმარსა და ცოლს აკისრიათ წმინდა მოვალეობები, რომ უყვარდეთ და ზრუნავდნენ ერთმანეთზე, თავიანთ შვილებზე.
  „აჰა, მემკვიდრეობა უფლისგან-შვილები“ (ფსალმუნები 126:3). მშობლებს აქვთ წმინდა მოვალეობა, რომ აღზარდონ
  ბავშვები სიყვარულით და სამართლიანად, უზრუნველყონ ისინი ფიზიკური და სულიერი საჭიროებებით, ასევე ასწავლონ
  მათ ერთმანეთის მიმართ ზრუნვა და სიყვარული, დაიცვან ღვთის მცნებები და იყვნენ კანონის მოშიშარი მოქალაქეები,
  სადაც არ უნდა ცხოვრობდნენ. ქმრები და ცოლები – დედები და მამები – პასუხისმგებლები არიან ღმერთის წინაშე
  ამ ვალდებულების შესასრულებლად.
- ოჯახი დადგენილია ღმერთის მიერ. მამაკაცსა და ქალს შორის ქორწინება მისი მარადიული გეგმის ძირითადი ნაწილია.
  ბავშვები უნდა გაჩნდნენ კანონიერი ქორწინების შედეგად, ისინი უნდა აღიზარდონ მამის და დედის მიერ, რომლებიც
  გულახდილად აღიარებენ და დაემორჩილებიან ქორწინების ფიცს. ოჯახში ბედნიერება შეიძლება მიღწეული იყოს მხოლოდ
  მაშინ, როდესაც ოჯახური ცხოვრება დაფუძნებულია უფლის, იესო ქრისტეს, სწავლებებზე. წარმატებული ქორწინებები
  და ოჯახები ყალიბდება და ეფუძნება რწმენის, ლოცვის, მონანიების, შენდობის, პატივისცემის, სიყვარულის და
  ჯანმრთელი ცხოვრების კანონებზე. ღვთაებრივი გეგმის მიხედვით მამებმა უნდა უხელმძღვანელონ თავიანთ ოჯახებს
  სიყვარულით და სამართლიანად, ისინი პასუხისმგებლები არიან თავიანთი ოჯახის დაცვაზე და ცხოვრებისეული საჭიროებების
  უზრუნველყოფაზე. დედების უმთავრესი მოვალეობა არის შვილების აღზრდა. ამ წმინდა მოწოდებით მამები და დედები
  ვალდებულები არიან ერთნაირად, თანაბრად გაინაწილონ და დაეხმარონ ერთმანეთს. ინვალიდობამ, სიკვდილმა ან სხვა
  გარემოებებმა შესაძლოა შეცვალოს ოჯახზე ზრუნვასთან დაკავშირებული ვალდებულებები. ახლობლებმა და ნათესავებმა
  საჭიროების შემთხვევაში უნდა გაუწიონ დახმარება.
- ჩვენ ვაფრთხილებთ იმ პიროვნებებს, ვინც არღვევენ უბიწოების აღთქმებს, ცუდად ეპყრობიან თავიანთ მეუღლეებს
  ან შვილებს ან ვინც არ ასრულებს საოჯახო ვალდებულებებს, ისინი ოდესმე ღმერთის წინაშე აგებენ პასუხს. ჩვენ
  ასევე ვაფრთხილებთ, რომ ოჯახის დანგრევა ადამიანებს, საზოგადოებებს და ერებს მოუტანს უბედურებებს, როგორც
  იყო ნათქვამი ძველი ნაწინასწარმეტყველების და თანამედროვე წინასწარმეტყველების მიერ.
- ჩვენ მოვუწოდებთ ამაზე პასუხისმგებელ ყველა მოქალაქეს და სახელმწიფო მოხელეს, რათა ჩაატარონ ყველა საჭირო
  ღონისძიება, რომელიც მხარს დაუჭერს და გააძლიერებს ოჯახს, როგორც საზოგადოების ძირითად შემადგენელ ნაწილს.
