title: Kilisto wa Moyo
subtitle: Bujadiki bua Bapostolo
author: Ekelezia wa Yezu Kilisto wa Bansantu ba Matuku a Ndekelu
paragraphs:
- Bu mutudi tuvuluka diledibua dia Yezu Kilisto divua dilua bidimu binunu bibidi kumpala, tudi tufila
  bujadiki buetu butangila bushuwa bua moyo Wenda udi kawuyi kufuanyikija, ne bukola budi kabuyi ndekelu
  bua mulambu Wenda munena wa bupikudi. Kakuena mukuabu udi ne bukoki bunena nunku pa bonsu bavua ne moyo
  ne bikala ne moyo pa buloba bu Yeya to.
- Uvua Yehowa Munena wa mu Dipungila Dikulukulu, Mashiya wa mu Dipia-dipia. Ku buludiki bua Tatuenda,
  Uvua mufuki wa buloba. “Bintu bionsu biakafukibua kudiye; ne kakuena tshintu tshiakafukibua kudi mukuabu,
  anu kudiye” (Yone 1:3). Nansha kayi ne mibi, Wakatambuishibua bua kukumbaja buakana bonsu. “Wakaya ku
  muaba ne muaba wenza malu mimpa” (Bienzedi 10:38), kadi wakalenguludibua buatshi. Lumu luimpa Luenda
  luvua mukenji wa ditalala ne moyo muimpa. Wakalomba bonsu bua balonda tshilejelu Tshienda. Wakenda mu
  njila ya Peleshete, ondopa babêdi, utabeja bafofu, ne ujula bafua. Wakalongesha bulelela bua tshiendelela,
  bushuwa bua moyo wetu wa kumpala kua kulua pa buloba, kipatshila ka moyo wetu pa buloba, ne mudi bana
  ba baluma ne ba bakaji ba Nzambi mua kulua mu moyo ulualua.
- Wakenza biakudia bia tshijila bu tshivulukidi tshia mulambu Wenda munena wa bupikudi. Wakakuatshibua
  ne wakapishibua bua mafunda a mafi, wakapeshibua tshibawu bua kusankisha musumba wa bantu, ne wakakoseshibua
  lufu pa mutshi mutshiamakana wa muaba wa Kabalubalu ka Mutu. Wakafila moyo Wenda bua kupikula mibi ya
  bukua bantu. Dienda dipa divua dipa dinena pa muaba wa bonsu bikala ne moyo pa buloba.
- Tudi tujadika ne moyo mushindama ne moyo Wenda, udi muikala mu nkatshi-nkatshi mua tshivulukilu tshia
  malu onsu a kala a bantu bonsu, kavua mubanga mu Beteleheme ne kavua mushikila mu muaba wa Kabalubalu
  ka Mutu to. Uvua Muana wa Buta wa Tatu, Muana Umuepela Mulela mu musunyi, Musungidi wa ba pa buloba.
- Wakajuka ku lukita bua “kulua mamuma a kumpala a bavua balala” (1 Kolinto 15:20). Bu Mukalenga Mubika,
  wakakumbula bavuaye munanga pavuaye ne moyo. Wakakuatshila mudimu kabidi munkatshi mua “mikoku [Yenda]
  mikuabu” (Yone 10:16) ku Amelika wa ku kala. Mu matuku â, Yeya ne Tatuenda bakamuenekela muana wa baluma
  Joseph Smith, babuejelamu “tshipungu tshia tshiwudi tshia bikondu” tshivua tshilayibua kalakala (Efeso
  1:10).
- 'Bitangila Kilisto wa Moyo, Muambi Joseph wakafunda ne: “Mesu enda avua bu ludimi lua kapia; nsuki ya
  ku mutu kuenda ivua mitoka bu mudi neige mukezuka; mpala wenda wengelela mupita diengeleka dia diba;
  ne dîyi dienda divua bu tshiona tshia mpuekelu wa mâyi manena, dîyi mena dia Yehowa, diamba ne:'
- “Ndi wa diambedi ne wa ndekelu; ndi yeya udi ne moyo, ndi yeya uvua mushipibua; ndi muakuidi wenu kudi
  Tatu” (D&B 110:3–4).
- 'Bimutangila, Muambi wakamanyisha kabidi ne: “Ne mpindiewu, kunyima kua majadiki a bungi avua mafidibua
  bimutangila, ebu budi bujadiki, kunyima kua onsu, butudi tufila bimutangila ne: Udi ne moyo!'
- “Bualu tuakamumona, mena ku tshianza tshia baluma tshia Nzambi; ne tuakumvua dîyi dijadikilamu ne udi
  Umuepela Mulela wa Tatu—
- “Ne kudiye, ne ku njila wenda, ne mu yeya, maloba adiku ne avua mafukibua, ne benawu badi bana ba baluma
  ne ba bakaji balela ba Nzambi” (D&B 76:22–24).
- Tudi tumanyisha ne miaku mitua ne buakuidi Buenda ne Ekelezia Wenda bidi bipingulujibua pa mutu pa buloba—“bibakibua
  pa mutu pa tshishimikidi tshia … bapostolo ne bambi, Yezu Kilisto nkayenda muikala dibua dia ditumba
  dikulu” (Efeso 2:20).
- Tudi tujadika ne Neapingana pa buloba dimua dituku. “Ne butumbi bua Mukalenga nebubuludibua, ne bantu
  bonsu nebabumona diatshimua” (Yeshaya 40:5). Neakôkesha bu Mfumu wa Bamfumu ne neatumba bu Mukalenga
  wa Bakalenga, ne tshinu tshionsu netshidikonya, ne ludimi lonsu neluakula mu dikukuila kumpala Kuenda.
  Muntu ne muntu wa kutudi neimana bua kulumbuluishibua kudiye bilondeshila ku midimu yetu ne majinga
  a mitshima yetu.
- Tudi tufila bujadiki, bu Bapostolo Benda bajidila mu bushuwa—ne Yezu udi Kilisto wa Moyo, Muana wa Nzambi
  udi kayi ufua. Udi Mfumu Emanuele munena, udi muimana lelu ku tshianza tshia baluma tshia Tatuenda.
  Udi bukenka, moyo, ne ditekemena bia ba pa buloba. Mushindu wenda udi njila udi ulombola ku disanka
  mu moyo ewu ne moyo wa tshiendelela mu muaba ulualua. Tuasakidila kudi Nzambi bua dipa didi kadiyi kufuanyikija
  dia Muanenda wa bunzambi.
