title: Tunungu tua Ditabuja
subtitle: tua Ekelezia wa Yezu Kilisto wa Bansantu ba Matuku a Ndekelu
author: ''
verses:
- n: 1
  text: Tudi tuitabuja Nzambi, Tatu wa Tshiendelela, ne Muanenda, Yezu Kilisto, ne Nyuma wa Tshijila.
- n: 2
  text: Tudi tuitabuja ne bantu nebanyokibua bua mibi yabu nkayabu, kadi bua disambuka dia mikenji dia
    Adama to.
- n: 3
  text: Tudi tuitabuja ne kupitshila ku Bupikudi bua Kilisto, bukua bantu bonsu budi mua kupandishibua,
    ku ditumikila dia mikenji ne milulu ya Lumu Luimpa.
- n: 4
  text: 'Tudi tuitabuja ne mayisha ne milulu ya kumpala ya Lumu Luimpa bidi: diambedi, Ditabuja Mukalenga
    Yezu Kilisto; dibîdi, Dikudimuna dia mutshima; disâtu, Ditambula ku dinyishibua bua dilekedibua dia
    mibi; dinâyi, Ditenteka dia bianza bua dipa dia Nyuma wa Tshijila.'
- n: 5
  text: Tudi tuitabuja ne muntu udi ne tshia kubikidibua kudi Nzambi, kupitshila ku dîyi dia buprofete,
    ne ku ditenteka dia bianza kudi badi ne bukôkeshi, bua kuyisha Lumu Luimpa ne kuenzeja milulu yalu.
- n: 6
  text: Tudi tuitabuja bulongolodi bua momumua buvua mu Ekelezia wa Bangabanga, tutela, bapostolo, baprofete,
    balami, balongeshi, batangadiki, ne bakuabu.
- n: 7
  text: Tudi tuitabuja dipa dia miakulu, buprofete, dibuluila, bimônyi, londapu, diandamuna dia miakulu,
    ne bikuabu.
- n: 8
  text: Tudi tuitabuja ne Bibiliya udi dîyi dia Nzambi padiyi diandamunyibua bilengela; tudi kabidi tuitabuja
    ne Mukanda wa Molomo udi dîyi dia Nzambi.
- n: 9
  text: Tudi tuitabuja bionsu bidi Nzambi mubuluila, bionsu bidiye ubuluila mpindiewu, ne tudi tuitabuja
    ne neatshiakubuluila malu a bungi manena ne a mushinga bitangila Bukalenga bua Nzambi.
- n: 10
  text: Tudi tuitabuja disangishibua menamena dia Isalele ne dipingaja dia Bîsa Dikumi; ne Siyona (Yelushalema
    Mupia-mupia) neashibua mu bulaba bua Amelika; ne Kilisto neakôkesha nkayenda pa buloba; ne, buloba
    nebupingajibua bupia-bupia ne nebupeta butumbi buabu bua mu mpaladiso.
- n: 11
  text: Tudi tulombolola bunema bua kutendelela Nzambi wa Bukitu Bonsu bilondeshila bulombodi bua meji
    etu, ne tudi tulekelela bantu bonsu bunema bua momumua, batendelela munyi, penyi, anyi tshidibu basua.
- n: 12
  text: Tudi tuitabuja kuikala bakôkedi kudi bamfumu, balombodi ba matunga, bakôkeshi, ne ba magistrat,
    mu ditumikila, dinemeka, ne dibandisha dia mikenji.
- n: 13
  text: Tudi tuitabuja kuikala katuyi mashimi, kuikala balelela, banonoka, bambuluishanganyi, bena nsombelu
    mulenga, ne mu dienza bimpa kudi bantu bonsu; bulelela, tudi mua kuamba ne tudi tulonda didimuisha
    dia Paulo—Tudi tuitabuja bintu bionsu, tudi tutekemena bintu bionsu, tudi bananuka mu bintu bia bungi,
    ne tudi ne ditekemena dia kunanuka mu bintu bionsu. Bikalaku tshintu tshimpa, tshilengela, anyi tshia
    lumu luimpa, anyi tshidi ne ditumbishibua, tudi tukeba bintu ebi.
signature: Joseph Smith.
