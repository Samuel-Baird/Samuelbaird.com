title: Ny Fianakaviana
subtitle: Fanambarana ho an’izao tontolo izao
author: Ny Fiadidiana Voalohany sy ny Filankevitry ny Apôstôly Roambinifolo ao amin’ny Fiangonan’i Jesoa
  Kristy ho an’ny Olomasin’ny Andro Farany
note: Ity fanambarana ity dia novakin’ny Filoha Gordon B. Hinckley ho anisan’ny hafatra tamin’ny fivoriamben’ny
  Fikambanana Ifanampiana izay natao tamin’ny 23 Septambra 1995, tany Salt Lake City, Utah.
paragraphs:
- Izahay, Fiadidiana Voalohany sy ny Filankevitry ny Apôstôly Roambinifolo ao amin’ny Fiangonan’i Jesoa
  Kristy ho an’ny Olomasin’ny Andro Farany, dia manambara amim-boninahitra fa ny fanambadiana eo amin’ny
  lehilahy iray sy ny vehivavy iray dia tendrin’Andriamanitra, ary ny fianakaviana dia fototry ny drafitry
  ny Mpahary ho an’ny anjara mandrakizain’ny zanany.
- Ny olombelona rehetra—ny lahy sy ny vavy—dia noharina araka ny endrik’Andriamanitra. Ny tsirairay dia
  fanahy izay zanakalahy sy zanakavavy malalan’ny ray aman-dreny any an-danitra, ary araka izany, ny tsirairay
  dia samy manana toetra sy anjara araka an’Andriamanitra. Ny maha-lahy na maha-vavy dia toetra fototra
  iray mamaritra ny maha-izy azy ny olona tsirairay sy ny tanjony tany amin’ny fiainana talohan’ny nahaterahana,
  sy amin’izao fiainana an-tany izao, ary any amin’ny mandrakizay.
- Tany amin’ny fanjakana talohan’ny nahaterahana, ireo fanahy izay zanakalahy sy zanakavavy dia nahafantatra
  sy nanompo an’Andriamanitra tahaka ny Rainy mandrakizay ary nanaiky ny drafiny izay ahafahan’ireo zanany
  hahazo vatana sy hahazo traikefa ety ambonin’ny tany mba handrosoany mankany amin’ny fahatanterahana
  ary hahatratrarany any amin’ny farany ny anjarany tahaka an’Andriamanitra amin’ny maha mpandova ny fiainana
  mandrakizay azy. Ny drafitra masin’ny fahasambarana no ahafahan’ny fifandraisana eo amin’ny fianakaviana
  haharitra mandrakizay any ankoatry ny fasana. Ireo ôrdônansy sy fanekempihavanana masina misy any amin’ny
  tempoly masina no ahafahan’ny tsirairay hiverina eo anatrehan’Andriamanitra sy ahafahan’ny fianakaviana
  ho iray mandrakizay.
- Ny didy voalohany izay nomen’Andriamanitra an’i Adama sy i Eva dia momba izay mety haha-ray aman-dreny
  azy amin’ny maha-mpivady azy. Ambaranay fa ny didin’Andriamanitra ho an’ny zanany ny mba hitombo ka
  hameno ny tany dia mbola manan-kery. Ambaranay ihany koa fa Andriamanitra dia nandidy fa ny lehilahy
  sy ny vehivavy nivady ara-dalàna ihany no tokony hampiasa ny fahefana masin’ny fananahana.
- Ambaranay fa ny fomba namoronana ny fiainana an-tany dia tendrin’Andriamanitra. Hizingizininay ny fahamasinan’ny
  fiainana sy ny maha-zava-dehibe izany eo amin’ny drafitra mandrakizay an’Andriamanitra.
- Ny mpivady dia manana andraikitra feno voninahitra mba hifankatia sy hifampikarakara ary hanao toy izany
  koa amin’ny zanany. “Lova avy amin’i Jehovah ny zanaka maro” (Salamo 127:3). Manana andraikitra masina
  ny ray aman-dreny ny hitaiza ireo zanany amim-pitiavana sy amim-pahamarinana, ny hanome izay filàna
  ara-batana sy ara-panahin’izy ireo, ary ny hampianatra azy mba hifankatia sy hifanompo, sy hitandrina
  ny didin’Andriamanitra ary ho olom-pirenena vanona na aiza na aiza hitoerany. Ny mpivady—ireo reny sy
  ireo ray—dia raisina ho tompon’andraikitra eo anatrehan’Andriamanitra amin’ny fanatanterahana izany
  adidy izany.
- Ny fianakaviana dia tendrin’Andriamanitra. Ny fanambadiana eo amin’ny lehilahy sy ny vehivavy dia tena
  ilaina eo amin’ny drafitra mandrakizainy. Natao ho teraka ao anatin’ny fanambadiana ny ankizy, ary hotezain’ny
  ray sy ny reny izay manaja ny voady nataony tamin’ny fanambadiana amim-pahatokiana tanteraka. Ny fahasambarana
  ao amin’ny fiainam-pianakaviana dia azo tratrarina kokoa raha miorina amin’ny fampianaran’i Jesoa Kristy
  Tompo. Ny fanambadiana sy ny fianakaviana mahomby dia aorina sy voatahiry araka ny fitsipiky ny finoana,
  ny vavaka, ny fibebahana, ny famelan-keloka, ny fanajana, ny fitiavana, ny fiantrana, ny asa, ary ny
  fialam-boly mahasoa ny tena sy ny fanahy. Araka ny drafitr’Andriamanitra, ny ray no tokony hitarika
  ny fianakaviany amim-pitiavana sy amim-pahamarinana ary tompon’andraikitra amin’ny fanomezana izay ilaina
  eo amin’ny fiainana sy ny fiarovana ny fianakaviany. Ny reny dia tompon’andraikitra voalohany eo amin’ny
  fitaizana ny zanany. Manoloana izany andraikitra masina izany, ny ray sy ny reny dia tsy maintsy mifanampy
  amin’ny maha-mpiara-miasa mitovy lenta azy ireo. Ny kilema, ny fahafatesana, na ny toe-javatra hafa
  dia mety ilàna fifandaminana hafa. Ireo havana dia tokony hanome fanampiana raha ilaina.
- Mampitandrina izahay fa ireo izay mandika ny fanekempihavanan’ny fahadiovam-pitondrantena, ireo izay
  mamono ny vadiny sy ny taranany, na ireo izay tsy mahatanteraka ny andraikiny ao amin’ ny fianakaviana
  dia hijoro ho tompon’andraikitra eo anatrehan’Andriamanitra indray andro any. Ankoatr’izany, dia mampitandrina
  koa izahay fa ny faharavan’ny fianakaviana dia hitondra eo amin’ny tsirairay, eo amin’ny fiaraha-monina,
  ary eo amin’ny firenena ireo loza izay efa nambaran’ireo mpaminany teo aloha sy ankehitriny.
- Manainga ireo olom-pirenena rehetra mahatsiaro ny adidiny sy ireo olona ao amin’ny fitondram-panjakana
  na aiza na aiza misy azy izahay, mba hampandroso ireo fepetra natao hiarovana sy hanamafisana orina
  ny fianakaviana amin’ny maha-rafitra fototra azy eo amin’ny fiaraha-monina.
