title: Ireo Fanekem-pinoana
subtitle: Ny Fiangonan’i Jesoa Kristy ho an’ny Olomasin’ny Andro Farany
author: ''
verses:
- n: 1
  text: Mino an’ Andriamanitra, ilay Ray Mandrakizay isika, ary mino an’i Jesoa Kristy Zanany sy ny Fanahy
    Masina.
- n: 2
  text: Mino isika fa hofaizina noho ny fahotany ihany ny olona fa tsy noho ny fandikan-dalàna nataon’i
    Adama.
- n: 3
  text: Mino isika fa noho ny Sorompanavotana nataon’i Kristy, dia azo vonjena ny olombelona rehetra,
    amin’ny fankatoavana ireo lalàna sy ôrdônansin’ny filazantsara.
- n: 4
  text: 'Mino isika fa ireo fitsipika sy ôrdônansy fototra amin’ny filazantsara dia: voalohany, ny Finoana
    an’i Jesoa Kristy Tompo; faharoa, ny Fibebahana; fahatelo, ny Batisa asitrika ho famelana ny fahotana;
    fahefatra, ny Fametrahan-tanana ho fanomezana ny Fanahy Masina.'
- n: 5
  text: Mino isika fa tsy maintsy voantson’ Andriamanitra amin’ny alalan’ny faminaniana sy amin’ny alalan’ny
    fametrahan-tanana, ataon’ireo izay manana fahefana ny olona iray, vao mitory sy manatanteraka ny ôrdônansin’ny
    Filazantsara.
- n: 6
  text: Mino ny fandaminana mitovy amin’izay nisy tao amin’ny Fiangonana voalohany isika, dia ny apôstôly,
    mpaminany, mpiandry, mpampianatra, evanjelistra, sns—
- n: 7
  text: Mino ny fanomezam-pahasoavana amin’ny fiteny isika, ny faminaniana, ny fanambarana, ny fahitana,
    ny fanasitranana, ny fandikan-teny, sns—
- n: 8
  text: Mino ny Baiboly ho tenin’ Andriamanitra isika araka ny maha-marina ny dikanteny; mino koa isika
    fa tenin’ Andriamanitra ny Bokin’i Môrmôna.
- n: 9
  text: Mino ny zava-drehetra izay efa nambaran’ Andriamanitra isika, izay ambarany ankehitriny, ary mino
    isika fa Izy dia mbola hanambara zavatra lehibe sy manan-danja maro mikasika ny Fanjakan’ Andriamanitra.
- n: 10
  text: Mino isika fa hangonina ara-bakiteny ny Isiraely ary hampodiana indray ny Foko Folo; fa i Ziona
    (ilay Jerosalema Vaovao) dia haorina eo amin’ny kaontinanta Amerikana; fa i Kristy tenany mihitsy
    no hanjaka ety an-tany; fa hohavaozina ny tany ka handray ny voninahitry ny paradisany.
- n: 11
  text: Isika dia mitaky ny zo hanompo an’ Andriamanitra Tsitoha araka ny baikon’ny fieritreretantsika
    ary miaiky fa manana izany zo izany ny olon-drehetra, ka aoka izy hanompo, na manao ahoana na manao
    ahoana, na aiza na aiza, ary na inona na inona sitrany.
- n: 12
  text: Mino ny fanoavana ny mpanjaka isika, ny filoha, ny mpanapaka ary ny mpitsara, amin’ny fankatoavana,
    ny fanajana ary ny fanohanana ny lalàna.
- n: 13
  text: Mino isika fa tokony ho marina, ho mahatoky, ho madio fitondrantena, ho antra olona, ho mendrika
    ary hanao soa amin’ny olon-drehetra; afaka milaza marina tokoa isika fa manaraka ny fananaran’i Paoly
    manao hoe—Isika dia mino ny zavatra rehetra, manantena ny zavatra rehetra, efa niaritra zavatra maro
    ary manantena ny ho afaka hiaritra ny zavatra rehetra. Raha toa ka misy zavatra mendrika, maha-te
    ho tia, tsara na mendri-piderana dia mikatsaka ireny zavatra ireny isika.
signature: Joseph Smith.
