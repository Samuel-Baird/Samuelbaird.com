slug: restoration
language: ces
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=ces
retrieved: '2026-11-02'
title: Znovuzřízení plnosti evangelia Ježíše Krista
subtitle: Prohlášení světu při příležitosti dvoustého výročí
author: První předsednictvo a Rada Dvanácti apoštolů Církve Ježíše Krista Svatých posledních dnů
note: Toto prohlášení přečetl president Russell M. Nelson jako součást svého poselství na 190. výroční
  generální konferenci, která se konala 5. dubna 2020 v utažském Salt Lake City.
paragraphs:
- Slavnostně prohlašujeme, že Bůh miluje své děti v každém národě světa. Bůh Otec nám dal božské narození
  svého Milovaného Syna Ježíše Krista, Jeho jedinečný život a Jeho nekonečnou smírnou oběť. Ježíš skrze
  moc Otcovu opět vstal a dosáhl vítězství nad smrtí. On je náš Spasitel, náš Příklad a náš Vykupitel.
- Před dvěma sty lety, jednoho krásného jarního rána roku 1820, odešel mladý Joseph Smith ve snaze zjistit,
  do které církve má vstoupit, do lesa poblíž svého domova v severní části státu New York v USA, aby se
  pomodlil. Měl otázky ohledně spasení své duše a důvěřoval tomu, že Bůh mu poskytne vedení.
- S pokorou prohlašujeme, že se Josephovi v odpověď na jeho modlitbu zjevili Bůh Otec a Jeho Syn Ježíš
  Kristus a slavnostně zahájili „napravení všech věcí“ (Skutkové 3:21), jak je to předpovězeno v Bibli.
  V tomto vidění se dozvěděl, že po smrti původních apoštolů se Kristova novozákonní Církev ze země ztratila.
  Joseph měl napomoci jejímu návratu.
- Potvrzujeme, že pod vedením Otce a Syna přišli nebeští poslové, aby Josephovi předali ponaučení a aby
  znovuzaložili Církev Ježíše Krista. Vzkříšený Jan Křtitel znovuzřídil pravomoc křtít ponořením na odpuštění
  hříchů. Tři z původních dvanácti apoštolů – Petr, Jakub a Jan – znovuzřídili apoštolství a klíče kněžské
  pravomoci. Přišli i další, včetně Eliáše, který znovuzřídil pravomoc spojovat rodiny na věky ve věčných
  vztazích, jež přesahují smrt.
- 'Dále svědčíme o tom, že Joseph Smith obdržel dar a moc Boží přeložit dávný záznam: Knihu Mormonovu
  – další svědectví o Ježíši Kristu. Stránky tohoto posvátného textu obsahují záznam o osobní službě Ježíše
  Krista mezi lidmi na západní polokouli krátce po Jeho Vzkříšení. Tato kniha učí o účelu života a vysvětluje
  nauku Kristovu, která v onom účelu zaujímá ústřední místo. Kniha Mormonova, jakožto písmo, které doprovází
  Bibli, svědčí o tom, že všechny lidské bytosti jsou synové a dcery milujícího Otce v nebi, že Otec má
  pro náš život božský plán a že Jeho Syn Ježíš Kristus promlouvá dnes, stejně jako promlouval i ve dnech
  dávných.'
- Prohlašujeme, že Církev Ježíše Krista Svatých posledních dnů, zorganizovaná 6. dubna 1830, je znovuzřízenou
  Kristovou novozákonní Církví. Tato Církev je ukotvena v dokonalém životě svého hlavního úhelného kamene,
  Ježíše Krista, a v Jeho nekonečném Usmíření a doslovném Vzkříšení. Ježíš Kristus znovu povolal apoštoly
  a předal jim kněžskou pravomoc. Vyzývá nás všechny, abychom přišli k Němu a do Jeho Církve, abychom
  přijali Ducha Svatého a obřady týkající se spasení a abychom získali trvalou radost.
- Od doby, kdy Bůh Otec a Jeho Milovaný Syn Ježíš Kristus zahájili toto Znovuzřízení, nyní uplynulo dvě
  stě let. Miliony lidí po celém světě získaly poznání o těchto prorokovaných událostech.
- S potěšením prohlašujeme, že zaslíbené Znovuzřízení postupuje kupředu skrze pokračující zjevení. Země
  již nebude nikdy stejná, neboť Bůh „v jedno [shromáždí] všecko v Kristu“ (Efezským 1:10).
- Jakožto Jeho apoštolové s úctou a vděčností zveme všechny, aby poznali – jako to víme my – že nebesa
  jsou otevřena. Potvrzujeme, že Bůh zjevuje svou vůli pro své milované syny a dcery. Svědčíme o tom,
  že ti, kteří budou s modlitbou studovat poselství o Znovuzřízení a jednat s vírou, budou požehnáni tím,
  že získají vlastní svědectví o jeho božskosti a o jeho účelu připravit svět na zaslíbený Druhý příchod
  našeho Pána a Spasitele Ježíše Krista.
