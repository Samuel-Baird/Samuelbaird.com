title: Žijící Kristus
subtitle: Svědectví apoštolů
author: Církev Ježíše Krista Svatých posledních dnů
paragraphs:
- Zatímco si připomínáme narození Ježíše Krista před dvěma tisíci lety, předkládáme své svědectví o skutečnosti
  Jeho nesrovnatelného života a o nekonečné moci Jeho veliké smírné oběti. Nikdo jiný neměl tak hluboký
  vliv na všechny ty, kteří žili, žijí či ještě budou žít na zemi.
- Byl velikým Jehovou Starého zákona a Mesiášem zákona Nového. Pod vedením svého Otce byl stvořitelem
  země. „Všecky věci skrze [něho] učiněny jsou, a bez něho nic není učiněno, což učiněno jest.“ (Jan 1:3.)
  Ačkoli byl bez hříchu, byl pokřtěn, aby naplnil veškerou spravedlivost. „Chodil, dobře čině“ (Skutkové
  10:38), a přesto byl za to opovrhován. Jeho evangelium bylo poselstvím pokoje a dobré vůle. Naléhavě
  všechny žádal, aby následovali Jeho příklad. Kráčel po cestách Palestiny, uzdravoval nemocné, způsoboval,
  že slepí viděli, a pozvedal k životu mrtvé. Učil pravdám věčnosti, skutečnosti naší předsmrtelné existence,
  účelu našeho života na zemi a potenciálu synů a dcer Božích v životě, který přijde.
- Ustanovil svátost jako připomínku své veliké smírné oběti. Byl zatčen a souzen na základě falešných
  obvinění, uznán vinným, aby se uspokojil dav, a odsouzen k smrti na kříži Kalvárie. Obětoval život,
  aby usmířil hříchy celého lidstva. Přinesl veliký zástupný dar pro všechny ty, kteří kdy žili, žijí
  či budou žít na zemi.
- Slavnostně svědčíme, že Jeho život, který je ústředním bodem celé lidské historie, nezačal v Betlémě
  ani neskončil na Kalvárii. Byl Prvorozeným Otcovým, Jednorozeným Synem v těle, Vykupitelem světa.
- Povstal z hrobu, aby se stal „[prvotinou] těch, kteříž zesnuli“ (1. Korintským 15:20). Jako vzkříšený
  Pán navštívil ty, které za života miloval. Také sloužil mezi svými „jinými ovcemi“ (viz Jan 10:16) v
  dávné Americe. V novodobém světě se se svým Otcem zjevili chlapci Josephu Smithovi, čímž uvedli dlouho
  zaslíbenou dispensaci „plnosti časů“ (Efezským 1:10).
- 'Prorok Joseph o žijícím Kristu napsal: „Oči jeho byly jako plamen ohně; vlasy na hlavě jeho byly bílé
  jako čistý sníh; tvář jeho zářila nad jas slunce; a hlas jeho byl jako zvuk valících se velikých vod,
  to jest hlas Jehovův, řkoucí:'
- Já jsem první i poslední; jsem ten, kdo žije, jsem ten, kdo byl zabit; jsem přímluvcem vaším u Otce.“
  (NaS 110:3–4.)
- 'Prorok o Něm také prohlásil: „A nyní, po mnohých svědectvích, jež o něm byla vydána, toto je svědectví,
  poslední ze všech, jež o něm vydáváme my: Že on žije!'
- Neboť jsme ho viděli, vpravdě na pravici Boží; a slyšeli jsme hlas vydávající svědectví, že je Jednorozeným
  Otcovým –
- Že jím a skrze něho a od něho světy jsou a byly stvořeny a obyvatelé jejich jsou syny a dcerami Bohu
  zplozenými.“ (NaS 76:22–24.)
- S vážností prohlašujeme, že Jeho kněžství a Jeho Církev byly na zemi znovuzřízeny – postaveny „na základ
  apoštolský a prorocký, kdež jest gruntovní úhelný kámen sám Ježíš Kristus“ (Efezským 2:20).
- Svědčíme, že se jednoho dne vrátí na zemi. „Nebo se zjeví sláva Hospodinova, a uzří [to] všeliké tělo
  spolu.“ (Izaiáš 40:5.) Bude panovat jako Král králů a vládnout jako Pán pánů a každé koleno se skloní
  a každý jazyk promluví před Ním v uctívání. Každý z nás stane, aby Jím byl souzen podle svých skutků
  a přání svého srdce.
- Jako Jeho řádně vysvěcení apoštolové vydáváme svědectví, že Ježíš je žijící Kristus, nesmrtelný Syn
  Boží. Je oním velikým králem Immanuelem, který dnes stojí po pravici svého Otce. Je světlem, životem
  a nadějí světa. Jeho cesta je cestou, která vede ke štěstí v tomto životě a k věčnému životu ve světě,
  který přijde. Buď Bohu dík za nesrovnatelný dar Jeho božského Syna.
