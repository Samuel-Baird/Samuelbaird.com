title: Rodina
subtitle: Prohlášení světu
author: První předsednictvo a Rada Dvanácti apoštolů Církve Ježíše Krista Svatých posledních dnů
note: Toto prohlášení přečetl president Gordon B. Hinckley v rámci svého poselství na generálním shromáždění
  Pomocného sdružení, které se konalo 23. září 1995 v Salt Lake City v Utahu.
paragraphs:
- My, První předsednictvo a Rada Dvanácti apoštolů Církve Ježíše Krista Svatých posledních dnů, slavnostně
  prohlašujeme, že manželství mezi mužem a ženou je ustanoveno Bohem a že rodina je ústředním bodem ve
  Stvořitelově plánu pro věčné určení Jeho dětí.
- Všechny lidské bytosti – muži a ženy – jsou stvořeny podle obrazu Božího. Každý je milovaný duchovní
  syn nebo milovaná duchovní dcera nebeských rodičů, a jako takový má každý božskou podstatu a určení.
  Pohlaví je základní charakteristikou předsmrtelné, smrtelné a věčné identity a účelu jednotlivce.
- V předsmrtelné říši duchovní synové a dcery znali a uctívali Boha jako svého Věčného Otce a přijali
  Jeho plán, podle kterého mohou Jeho děti obdržet fyzické tělo a získat pozemskou zkušenost, aby mohly
  pokročit směrem k dokonalosti a nakonec naplnit své božské určení jakožto dědicové věčného života. Božský
  plán štěstí umožňuje, aby rodinné vztahy trvaly věčně, až za hrob. Posvátné obřady a smlouvy dostupné
  ve svatých chrámech umožňují jednotlivcům vrátit se do přítomnosti Boží a rodinám být sjednoceny na
  věky.
- První přikázání, které dal Bůh Adamovi a Evě, se týkalo jejich možnosti být rodiči jakožto manžel a
  manželka. Prohlašujeme, že přikázání, které Bůh dal svým dětem, aby se množily a naplnily zemi, je stále
  v platnosti. Dále prohlašujeme, že Bůh přikazuje, aby se posvátné moci plození používaly pouze mezi
  mužem a ženou, kteří jsou zákonně oddáni jako manžel a manželka.
- Prohlašujeme, že způsob, kterým je tvořen smrtelný život, je božsky určený. Potvrzujeme posvátnost života
  a jeho důležitost v Božím věčném plánu.
- Manžel a manželka mají posvátnou zodpovědnost navzájem se milovat a pečovat jeden o druhého a o své
  děti. „Dědictví od Hospodina jsou dítky.“ (Žalm 127:3.) Rodiče mají posvátnou povinnost vychovávat své
  děti v lásce a spravedlivosti, zaopatřovat jejich fyzické a duchovní potřeby a učit je mít se navzájem
  rády a sloužit si, zachovávat přikázání Boží a být občany dodržujícími zákony, ať žijí kdekoli. Manželé
  a manželky – matky a otcové – se budou před Bohem zodpovídat z toho, jak tyto povinnosti plnili.
- Rodina je ustanovena Bohem. Manželství mezi mužem a ženou je pro Jeho věčný plán zásadní. Děti mají
  právo na to, aby se narodily v manželském svazku a byly vychovávány otcem a matkou, kteří s naprostou
  věrností ctí manželské sliby. Štěstí v rodinném životě lze s největší pravděpodobností dosáhnout tehdy,
  když je založen na učení Pána Ježíše Krista. Úspěšná manželství a rodiny jsou založeny a udržovány na
  zásadách víry, modlitby, pokání, odpuštění, úcty, lásky, soucitu, práce a hodnotných odpočinkových činností.
  Podle božského záměru mají otcové v lásce a spravedlivosti předsedat své rodině a jsou zodpovědni za
  zaopatřování základních životních potřeb a ochrany své rodiny. Matky jsou v prvé řadě zodpovědny za
  péči o své děti. V těchto posvátných zodpovědnostech jsou otcové a matky povinni si navzájem pomáhat
  jako rovnocenní partneři. Postižení, úmrtí či jiné okolnosti mohou vyžadovat individuální úpravy. V
  případě potřeby má poskytnout podporu širší rodina.
- Varujeme, že jedinci, kteří porušují smlouvy cudnosti, kteří týrají či zneužívají manželského partnera
  nebo potomstvo nebo kteří neplní rodinné zodpovědnosti, se jednoho dne budou zodpovídat před Bohem.
  Dále varujeme, že rozklad rodiny přivede na jednotlivce, obce a národy pohromy předpovězené dávnými
  i novodobými proroky.
- Vyzýváme zodpovědné občany a státní úředníky, ať jsou kdekoli, aby prosazovali taková opatření, jejichž
  záměrem je zachovat a posilovat rodinu jakožto základní jednotku společnosti.
