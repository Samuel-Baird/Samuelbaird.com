title: Baam̧le Eo
subtitle: Juon Naan in Kean̄ n̄an Laļ in
author: Būreejtōnji eo Kein Kajuon im Doulul eo an Rijilōk ro Jon̄oulruo an Kabun̄ eo an Jisōs Kraist
  im Armej ro Rekwōjarjar ilo Raan Ko Āliktata
note: Naan in Kean̄ in ekar itok jān Būreejtōn Gordon B. Hinckley āinwōt m̧ōttan eo an ennaan eo ilo Kweiļok
  eo Eļap an Doulul eo Eutiej an Kōrā ro kar kōm̧m̧an ilo Jebtōm̧ba 23, 1995, ilo Salt Lake City, Utah.
paragraphs:
- Kōm, Būreejtōnji eo Kein Kajuon im Doulul eo an Rijilōk ro Jon̄oulruo an Kabun̄ eo an Jisōs Kraist im
  Armej ro Rekwōjarjar ilo Raan Ko Āliktata, pen ilo kwaļo̧k bwe m̧are ikōtaan juon em̧m̧aan im juon kōrā
  ej kapit jān Anij im bwe baam̧le eo ej dilepen karōk eo an Rikōm̧anm̧an eo n̄an jipadpad eo n̄an mour
  indeeo an ajri ro Nejin.
- Aolep armej otemjej—em̧m̧aan im kōrā—kar kōm̧anm̧an ilo nememein wōt Anij. Kajjojo ej juon jetōb jitōnbōro
  likao im jiron̄ nejin jined im jemed ilan̄, im, ilo āinwōt, kajjojo ewōr juon mour kwōjarjar im jibadbad
  ippān. Oktak in ānbwinid jān doon ej juon jōkjōk eo eaorōk n̄an kwaļo̧k kadkad in kajjojo ilo mour eo
  m̧okta, im kadkad in kajjojo ilo mour in, im kadkad eo ejjeļok jemļokin im unleplepin.
- Ilo jikin eo ilo mour eo m̧okta, jetōb likao ro im jiron̄ ro raar jeļā im kabun̄jar n̄an Anij āinwōt
  eo Jemeer Indeeo im kar errā ilo karōk eo An eo me ajri ro Nejin remaron̄ kar bōk juon ānbwinin kanniōk
  im mour ioon laļ n̄an aer eddōkļo̧k n̄an aer weeppān im kile jemļo̧k eo aer ekwōjarjar āinwōt rijolete
  mour indeeo. Karōk in m̧ōņōņō eo ekwōjarjar ej kōmaron̄ kōtaan ko ilo baam̧le n̄an eļļā ioon lōb. Ewōr
  kain̄i ko im bujen ko rekwōjarjar rej kōm̧m̧an ilo tampeļ ko n̄an kapidodo n̄an kajjojo n̄an aer jepļaak
  n̄an im̧aan mejen Anij im n̄an baam̧le ko n̄an aer koba ippān doon n̄an indeeo.
- Kien eo m̧oktata me Anij eaar leļo̧k n̄an Adam im Iv kar ikkijeen aer maron̄ ro jined im jemed āinwōt
  ļeo im lio pālele. Kōmij kwaļo̧k bwe kien eo an Anij ej bwe ajri ro Nejin ren timo̧o̧n im wōrļok ioon
  laļ ejjan̄in oktak. Kōmij bar kwaļo̧k bwe Anij eaar kakien bwe kajoor ko rekwōjarjar n̄an ejaak mour
  rej aikuj kar jerbal ikōtaan wōt ļeo ak lio, Em̧ōj kōmālimi āinwōt ļeo ak lio pālele.
- Kōmij kwaļo̧k bwe jekjek ko me mour in ej ejaak jāni rej ijjitōn̄ jān lan̄. Kōmij kapenļo̧k bwe ekwōjarjar
  eo an mour im aorōk in karōk eo an Anij indeeo.
- Ļeo im lio pālele ewōr juon aer eddo n̄an iakwe im kōjparok doon im ajri ro nejier. “Ajri ro rej jolet
  jān Irooj” (Sam Ko 127:3). Ro jineer im jemeer ewōr juon aer eddo ekwojarjar n̄an kōkkaajririik ajri
  ro ilo iakwe im jim̧we, n̄an kabwe aikuj ko aer ilo jetōb im kanniōk, im n̄an katakin er n̄an iakwe
  im jerbal n̄an doon, kōjparok kien ko an Anij, im armej ro rej mour kōn kien ko ijoko rej mour ie. Ļōm̧aro
  im limaro pālele—ro jinen im jemen—naaj ņaruwier im̧aan Anij ilo aer jab kōm̧m̧ane eddo kein aer.
- Baam̧le eo ej ekkapit jān Anij. M̧are eo kōtaan em̧m̧aan im kōrā eļap tokjān n̄an karōk eo An indeeo.
  Ajri ro rej maron̄ ļotak ilo korak in m̧are ko, im kōkkaajririik er jān juon jemen im jinen ro me rej
  kautiej kallim̧ur in m̧are ko ilo ejjeļo̧k irļok. M̧ōņōņō ilo mour in baam̧le ej maron̄ tōprak eļan̄n̄e
  ej pedped wōt ioon katakin an Irooj Jisōs Kraist. M̧are ko reppen aer rub im baam̧le ko rej ejaak wōt
  ioon pedped ko an tōmak, jar, ukweļo̧k, jeorļok bōd, kautiej, iakwe, jeļā ņae doon, jerbal, im m̧akūtkūt
  ko rem̧m̧an n̄an kōkm̧anm̧anļok doon. Jān jōkjōk eo ekwōjarjar, ro jemen rej tōl ioon baam̧le ko aer
  ilo iakwe im jim̧we im ej aer eddo n̄an kōpooj menin aikuj ko an mour im kōjparok baam̧le ko aer. Ro
  jineer eddo eo aer eaorōk ej n̄an kōkkaajririik ajri ro nejier. Ilo eddo kein rekwōjarjar, ro jemen
  im jinen rej kallim̧ur n̄an jipan̄ doon āinwōt m̧ōttā ro rej juon wōt. M̧ōjņo̧ in ānbwin, mej, ak jōkjōk
  ko jet maron̄ aikuji n̄an oktak ko kajjojo. Ro nukid ilo baam̧le ko rej aikuj leļo̧k jipan̄ n̄e emenin
  aikuj.
- Kōmij kakkōl bwe jabdewōt ro rej rube bujen ko an kien erreo, ro rej kakkure pāleen ak ro nejin, ak
  ro rej likjab in kōtōprak eddo ko an baam̧le eo naaj juon raan ņaruwier im̧aan Anij. Barāinwōt, kōmij
  kakkōl bwe ejeblōklōk in baam̧le eo enaaj bōktok ioer kajjojo, jukjukinpād ko, im laļ ko būrom̧ōj ko
  kōnono kaki m̧oktaļok jān rikanaan ro m̧okta im rikanaan ro kiiō.
- Kōmij kūr ioon ro aer eddo im opija ro an kien ijoko jabdewōt n̄an iuun m̧aanļok kakien ko ļami n̄an
  kōjparok im kōkajoorļo̧k baam̧le eo āinwōt pedped in ekkal eo an juon jukjukun.
