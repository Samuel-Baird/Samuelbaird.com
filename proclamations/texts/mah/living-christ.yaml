title: Kraist Eo Emour
subtitle: Naan in Kam̧ool an Rijilōk ro
author: Kabun̄ eo An Jisōs Kraist im Armej ro Rekwōjarjar ilo Raan Ko Āliktata
paragraphs:
- Ilo ad kakeememej ļotak eo an Jisōs Kraist ruo taujin iiō ko remootļo̧k, kōmij lewaj naan in kam̧ool
  eo am kōn lukkuun mour eo An ejej uwaan im kōn wānōk eo ejjeļo̧k jem̧ļo̧kin an pinmuur in en̄taan eo
  An eļap. Ejjeļo̧k bar juon armej ekajoor an jelōt mour ko an aolep ro rekar mour ioon laļ im ro renaaj
  mour tok ālik.
- E eo ekar Jeova Eļap ilo Kallim̧ur M̧okta, im Messaia ilo Kallim̧ur Ekāāl. Ium̧win tōl eo an Jemen,
  E eo ekar rikōm̧anm̧an laļ. “Eaar kōm̧m̧an men otemjej; im ejjeļo̧k men eo Eaar jab kōm̧m̧ane, men eo
  em̧ōj kōm̧anm̧ane” (Jon 1:3). Men̄e eaar jab jerawiwi, Eaar peptaij bwe en kakūrm̧ool jim̧we otemjej.
  E ekar “etetal im kōm̧anm̧an em̧m̧an” (Jerbal 10:38), mekarta eaar jab jemļo̧k aer matōrtōr E. Gospel
  eo An ekar juon ennaan in aenōm̧m̧an im jokane ilo jemjerā. Eaar rōjan̄ kōj otemjej bwe jān ļoor waanjon̄ak
  ko An. Eaar etetal ilo iaļ ko an Palestine, Eaar kemour ro renan̄inmij, kōm̧m̧an bwe ro repilo ren loļo̧kjeņ,
  im kōjerkak ro raar mej. E ekar katakin m̧ool ko an mour indeeo, m̧ool eo an mour eo ad m̧okta, im unin
  mour eo ad ioon laļ in, im kōjatdikdik eo n̄an m̧aan ro im kōrā ro nejin Anij ilo mour eo ej itok.
- Eaar jino kwojkwoj eo āinwōt juon kakeememej kōn pinmuur in en̄taan eo An eļap. Ekar kalibuuj im kar
  liaakļo̧k kōn bwōd ko rej jab m̧ool, kar ņa ruōn n̄an kam̧ōņōņōik ro rekar matōrtōre, im leļo̧k n̄an
  mej ioon debwāāl ilo Calvary. E ekar wujlepļo̧k mour eo An n̄an pinmuur kōn jerawiwi ko an armej otemjej.
  E ekar juon menin letok eo eļap ilo etan aolep armej ro rekar, rej, im renaaj mour ioon laļ in.
- Kōmij lukkuun kam̧ool bwe mour eo An, eo ej ioļapļap in bwebwenato an aolep armej, eo ekar jab ijjino
  ilo Betleem ak jaab jemļo̧k ioon Calvary. E eo ekar M̧aanje eo m̧oktata Nejin Jemen, Ej Make Wōt Nejin
  M̧aan Jitōnbōro ilo kanniōk, Rilo̧mo̧o̧r eo an laļ in.
- E ekar jerkak jān lōb eo n̄an “erom leen m̧oktata iaan ro rej kiki” (1 RiKorint 15:20). Āinwōt juon
  Irooj eo em̧ōj An jerkakpeje, Eaar loļo̧k ro eaar iakwe ke eaar mour ioon laļ. Eaar barāinwōt jerbal
  in karejar n̄an “bar jet An sip (Jon 10:16) ilo Amedka etto. Ilo laļ rainin, E im Jemen raar waļo̧kļo̧k
  n̄an ļaddik eo Josep Smith, n̄an jino ilo kallim̧ur eo aitok an “iien ko re jejjet” (RiEpesōs 1:10).
- 'Kōn Kraist Eo Emour, Rikanaan Josep eaar je: “Mejān rekar āinwōt urur in kijeek; kooļan bōran ekar
  mour āinwōt sno erreo; turin mejān eaar romaak ilōn̄inļo̧k meram eo an al; im ainikien eaar āinwōt ainikien
  ibeb in dān ko reļļap, em̧ool ainikien eo an Jeova, ej ba:'
- “N̄aij eo m̧oktata im eo āliktata; N̄aij E eo ej mour, N̄aij E eo kar m̧ane; N̄aij ami rijojomar ippān
  Jemān” (K&B 110:3–4).
- 'Kōn E Rikanaan eo ekar bārāinwōt kean̄: “Im kiiō, ālikin elōn̄ naan in kam̧ool ko me kar letok kōn
  E, en̄in ej naan im kam̧ool eo, āliktata in aolep, eo me kōmij lewōj kōn E: Bwe E emour!'
- “Bwe kōm ar lo E, em̧ool ituanbwijmaron̄ in Anij; im kōm ar ron̄ ainikien eo ej kam̧ool bwe E ej eo
  Nejin Emake Keotak in Jemān—
- “Bwe jān E, im kōn E, im ilo E, laļ ko rej im rekar ejaak, im ro rej pād ie rej m̧aan im kōrā ro nejin
  keotak n̄an Anij” (K&B 76:22–24).
- Kōmij kwaļo̧k ilo naan ko rem̧ool bwe priesthood eo An im Kabun̄ eo An emōj aer bar jepļaaktok n̄an
  ioon laļ in—“kalōk ion foundesōn an … rū jelōk im kab ri Kanaan, Kraist Jisōs e make lukkuun dem̧an
  em” (RiEpesōs 2:20).
- Kōm̧ij kam̧ool bwe E enaaj juon raan bar ro̧o̧ltok n̄an laļ in, “Im naaj kwaļo̧k aiboojoj an Jeova,
  im kanniōk otemjej enaaj jim̧or loe” (Aiseia 40:5). Enaaj kakien āinwōt Kiin̄ in Kiin̄ ro im irooj āinwōt
  Irooj in Irooj ro, im bukwe otemjej renaaj bukwelōlō im lo otemjej renaaj kōnono ilo kabun̄jar imaan
  Mejān. Kōjwōj kajjojo naaj jutak n̄an ekajet jān E ekkar n̄an jerbal ko ad im ikideelel ko an būruwōd.
- Kōm̧ij kwaļo̧k am naan in kam̧ool, āinwōt Rijilōk ro An kar kapit er—bwe Jisōs ej Kraist eo Emour, eo
  Nejin Anij eban bar mej. E ej Kiin̄ Immanuel eo eļap, eo ej jutak ituanbwijmaron̄ in Jemen rainin. E
  ej meram eo, mour eo, im ej kōjatdikdik eo an laļ in. Jenok eo jenkwan ej iaļ eo ej tōlļo̧k n̄an m̧ōņōņō
  ilo mour in im mour indeeo ilo laļ eo ej itok. Kam̧m̧oolol Anij kōn men in letok eo ejjeļo̧k uwaan ikkijeen
  eo Nejin ekwojarjar.
