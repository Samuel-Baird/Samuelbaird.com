slug: restoration
language: mah
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=mah
retrieved: '2026-11-02'
title: Jepļaaktok eo an Tarlep in Gospel eo an Jisōs Kraist
subtitle: Juon Naan in Kean̄ n̄an Laļ in Kōn Rūbukwi Iiō in Jepļaaktok eo
author: Būreejtōnji eo Kein Kajuon im Doulul eo an Jon̄oulruo Rijilōk ro ilo Kabun̄ eo an Jisōs Kraist
  im Armej ro Rekwōjarjar ilo Raan Ko Āliktata
note: Naan in Kean̄ in kar riiti jān Būreejtōn Russell M. Nelson āinwōt m̧ōttanļo̧k ennaan eo an ilo Kweiļok
  eo Eļap, Eprōļ 5, 2020, ilo Salt Lake City, Utah.
paragraphs:
- Kōmij kean̄ bwe Anij ej iakwe ajri ro Nejin ilo aolepān laļ in. Anij Jemed ekar letok n̄an kōj kwōjarjar
  in ļotak, mour eo jab maron̄ keidi, im katok in pinmuur eo eļap an eo Nejin Ejitōnbōro, Jisōs Kraist.
  Kōn kajoor eo an Jemān, Jisōs ekar bar jerkakpeje im bōk anjo̧ ioon mej. E ej ad Rilo̧mo̧o̧r, ad Riwaanjon̄ok,
  im ad Ripinmuur.
- Rūbukwi iiō ko rem̧ootļo̧k, ilo juon jibbon̄ in jibūriin̄ ilo 1820, likao Josep Smith, ej kappukot n̄an
  jeļā ewi wōt kabun̄ eo n̄an kobaļo̧k ie, ekar etal n̄an būkwin wōjke ko im jar iturin m̧weo im̧ōn ilo
  New York, USA. Ekar wōr an kajjitōk ikkijeen lo̧mo̧o̧r n̄an jetōb eo an im ekar lōke bwe Anij enaaj
  tōl e.
- Ilo ettā, kōmij kwaļo̧k bwe uwaak n̄an jar eo an, Anij Jemed im Nejin, Jisōs Kraist, raar waļo̧k n̄an
  Josep im kar jinoe iien ko “iien karōk men otemjej” (Jerbal 3:21) āinwōt kar kanaan kake ilo Baibōļ.
  Ilo visōn in, ekar ekkatak bwe ālkin kar mej eo an Rijilōk ro jinointata, Kabun̄ eo an Kraist ilo Kallim̧ur
  Ekāāl ekar jako jān laļ in. Josep enaaj erom̧ juon kein jerbal ilo jepļaaktok in.
- Kōmij kam̧ool bwe ium̧win tōl eo an Jemān im Nejin, ribōktok ennaan ro jān lan̄ rekar itok n̄an katakin
  Josep im bar ejaake Kabun̄ eo an Jisōs Kraist. Jon Ripeptaij eo me ekar jerkakpeje ekar kōjepļaaktok
  mālim eo n̄an peptaij kōn tuļo̧k ilo dān n̄an bōk jeo̧rļo̧k in jerawiwi. Jilu iaan Rijilōk ro jon̄oulruo
  jinointata—Piter, Jemes, im Jon—kar kōjepļaaktok tōl eo an rikaļoor im kii ko an mālim in priesthood.
  Ro jet rekar itok, ekoba Ilaija, eo me ekar kōjepļaaktok mālim eo n̄an kakobaik baam̧le ko n̄an indeeo
  ilo jem̧jerā eo n̄an indeeo me ej eļļāļo̧k jān mej.
- Kōmij kam̧ool bwe Josep Smith ekar bōk menin letok im kajoor an Anij n̄an ukot rekoot ko etto—Bok in
  Mormon—Bar Juon Kallim̧ur kōn Jisōs Kraist. Peij ko ilo jeje in ekwōjarjar ekoba iien kwaļo̧k eo an
  Jisōs Kraist ilubwiljin armej ro ilo Western Hemisphere ejjab to ālkin Jekakpeje eo An. Ej katakin kōj
  kōn jibadbad eo an mour in im ej kōmeļeļeik kōn katak ko an Kraist, eo ej dilepen jibadbad eo. Āinwōt
  m̧ōttan ļo̧k Baibōļ eo, Bok in Mormon ej kam̧ool bwe aolep armej rej ļaddik im leddik ro nejin Jemedwōj
  Ilan̄ eo ej iakwe kōj, bwe E ewōr juon an karōk ekwōjarjar n̄an mour ko ad, im bwe Eo Nejin, Jisōs Kraist,
  ej kōnono rainin āinwōt an kar kōnono etto.
- Kōmij kwaļo̧k bwe Kabun̄ eo an Jisōs Kraist im Armej ro Rekwojarjar ilo Raan Ko Āliktata, kar ejaake
  ilo Eprōļ 6, 1830, ej Kabun̄ eo an Kraist ilo kar Kallim̧ur Ekāāl em̧ōj an bar jepļaaktok. Kabun̄ in
  ej emjak ilo mour eo ewānōk an lukkuun ejm̧aan in jabōn em̧, Jisōs Kraist, im ilo Pinmuur eo An eļap
  im Jerkakpeje eo em̧ool. Jisōs Kraist ekar bar juon alen kūr Rijilōk ro im kar leļo̧k n̄an er mālim
  an priesthood. Ej karuwaineneik kōj aolep n̄an itok n̄an E im Kabun̄ eo An, n̄an bōk Jetōb Kwojarjar,
  kain̄i ko an lo̧mo̧o̧r, im bōk lan̄lōn̄ eo ejjeļo̧k jem̧ļo̧kin.
- Rūbukwi iiō ko rej mootļo̧k ej kiiō eļļāļo̧k wōt jān tōre eo Jepļaaktok in ekar ijjino jān Anij Jemed
  im Eo Nejin Ejitōnbōro, Jisōs Kraist. Elōn̄ milien armej ro ipeļaakin laļ in em̧ōj aer bōk im kaorōk
  jeļāļo̧kjeņ in kōn m̧akūtkūt kein kar kanaan kaki.
- Kōmij lukkuun m̧ōņōņō in kwaļo̧k bwe Jepļaaktok eo kar kallim̧ur kake ej wōnm̧aanļo̧k wōt kōn revelesōn
  ko rejjab jem̧ļo̧k. Laļ in eban bar āinwōt m̧okta, āinwōt an Anij naaj “kobaik men otemjej ilo Kraist”
  (RiEpesōs 1:10).
- Kōn kautiej im kam̧m̧oolol, kōm āinwōt Rijilōk ro An kōmij karuwaineneik aolep n̄an jeļā—āinwōt am bar
  jeļā—bwe lan̄ ko repeļļo̧k. Kōmij kapene bwe Anij ej kalikkar Ankilaan n̄an ļaddik im leddik ro Nejin
  rejitōnbōro. Kōmij kam̧oole kean̄ in bwe ro rej jar im ekkatak ennaan eo an Jepļaaktok eo im jerbale
  ilo tōmak renaaj jeraam̧m̧an n̄an bōk kam̧ool eo aer make kōn kwojarjar in im jibadbad eo an n̄an kōpooj
  laļ in n̄an Itok eo Kein Karuo an Irooj im Rilo̧mo̧o̧r, Jisōs Kraist me kar kallim̧ur kake.
