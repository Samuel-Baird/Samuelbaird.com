title: Laajrak in Tōmak ko
subtitle: an Kabun̄ eo an Jisōs Kraist im Armej ro Rekwōjarjar ilo Raan ko Āliktata
author: ''
verses:
- n: 1
  text: Kōmij tōmak ilo Anij, Jemān Indeeo, im ilo Nejin, Jisōs Kraist, im ilo Jetōb Kwōjarjar.
- n: 2
  text: Kōmij tōmak bwe armej renaaj bōk kaje kōn jero̧wiwi ko aer make, im jab kōn bōd eo an Adam.
- n: 3
  text: Kōmij tōmak bwe kōn Pinmuur eo an Kraist, aolep armej remaron̄ bōk lo̧mo̧o̧r, jān pokake kien
    ko im kain̄i ko an Gospel eo.
- n: 4
  text: 'Kōmij tōmak bwe pedped ko im kain̄i ko m̧oktata an Gospel eo rej: kein kajuon, Tōmak ilo Irooj
    Jisōs Kraist; kein karuo, Ukeļo̧k; kein kajilu, Peptaij jān tulo̧k n̄an jeorļo̧k jero̧wiwi ko; kein
    kāāmen, Likūt pā ko ioon n̄an bōk mennin letok eo an Jetōb Kwōjarjar.'
- n: 5
  text: Kōmij tōmak bwe juon em̧m̧aan eaikuj bōk an kūr jān Anij, jān kanaan, im jān likūt pā ko ioon
    jān ro ewōr aer maron̄, n̄an kwaļo̧k Gospel eo im kōm̧m̧ani kain̄i ko ie.
- n: 6
  text: Kōmij tōmak ilo ejja doulul eo wōt im eaar pād ilo Kabun̄ eo Etto, erkein, rijjilōk ro, rikanaan
    ro, pastor ro, rikaki ro, rievanjel, im ro eierļo̧k wōt.
- n: 7
  text: Kōmij tōmak ilo mennin letok in lo ko, kanaan, revelesōn, visōn ko, kōmour, ukok in lo ko, im
    ko eierļo̧k wōt.
- n: 8
  text: Kōmij tōmak bwe Baibōļ eo ej naan an Anij toun wōt an jim̧we ukok eo an; kōmij barāinwōt tōmak
    bwe Bok in Mormon eo ej naan an Anij.
- n: 9
  text: Kōmij tōmak aolep men ko em̧ōj an Anij kwaļo̧ki, aolep men ko E ej kwaļo̧ki kiiō, im kōmij tōmak
    bwe Enaaj kwaļo̧k elōn̄ men ko reļļap im aorōk im rej ekkejelļo̧k n̄an Aelōn̄ in Anij.
- n: 10
  text: Kōmij tōmak ilo lukkuun kuktok eo an Israel im ilo jepļaaktok eo an Bwij ko Jon̄oul; bwe Zaion
    (Jerusalem eo Ekāāl) naaj kalōke ioon kontinent in Amedka; bwe Kraist enaaj irooj make ioon laļ; im,
    bwe laļ enaaj kōkāāl im bōk aiboojoj in paredais eo an.
- n: 11
  text: Kōmij kwaļo̧k bwe ewōr am jim̧we in kabun̄-jar n̄an Anij Ekajoor Bōtata ekkar n̄an bōklōkōt ko
    an koļmānļo̧kijeņ ko am make, im kōtļo̧k aolep armej ejja jim̧we in wōt, er ren kabun̄-jar ilo wāween
    eo, jikin eo, ak ta eo rej kāālete.
- n: 12
  text: Kōmij tōmak ilo tōl an kiin̄ ro, president ro, ripepe ro, im riekajet ro, ilo pokake, kautieje,
    im rejetake kien eo.
- n: 13
  text: Kōmij tōmak ilo jejjet, m̧ool, erreo ilo ānbwin, jouj, wānōk, im ilo kōm̧m̧an em̧m̧an n̄an aolep
    armej; em̧ool, kōm maron̄ ba bwe kōmij ļoore wōt kapilōk eo an Paul—Kōmij tōmak men ko otemjeļo̧k,
    kōmij kōjatdikdik kōn men ko otemjeļo̧k, kōm ar kijejeto ilo elōn̄ men ko, im kōjatdikdik n̄an maron̄
    kijejeto ilo men ko otemjeļo̧k. Eļan̄n̄e ewōr jabdewōt men wānōk, karbōb, ak em̧m̧an ekkōnono kake
    ak nebare, kōmij kappukoti men kein.
signature: Josep Smith.
