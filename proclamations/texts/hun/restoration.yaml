title: Jézus Krisztus evangéliuma teljességének visszaállítása
subtitle: Bicentenáriumi kiáltvány a világhoz
author: Az Utolsó Napi Szentek Jézus Krisztus Egyházának Első Elnöksége és Tizenkét Apostolának Tanácsa
note: Ezt a kiáltványt Russell M. Nelson elnök olvasta fel üzenete részeként a 190. éves általános konferencián,
  2020. április 5-én, a Utah állambeli Salt Lake Cityben.
paragraphs:
- Ünnepélyesen kijelentjük, hogy Isten szereti gyermekeit a világ minden nemzetében. Az Atyaisten megadta
  nekünk az Ő Szeretett Fia, Jézus Krisztus isteni születését, páratlan életét és végtelen engesztelő
  áldozatát. Az Atya hatalma által Jézus feltámadt és győzelmet aratott a halál felett. Ő a mi Szabadítónk,
  Példaképünk és Megváltónk.
- Kétszáz évvel ezelőtt, 1820-ban, egy gyönyörű tavaszi reggelen az ifjú Joseph Smith, arra törekedve,
  hogy megtudja, melyik egyházhoz csatlakozzon, imádkozni ment az otthona közelében lévő erdőbe, az Amerikai
  Egyesült Államok New York államának északi részén. Kérdései voltak a lelke szabadulását illetően, és
  bízott abban, hogy Isten utat fog mutatni neki.
- Alázatosan kijelentjük, hogy imájára válaszként az Atyaisten és Fia, Jézus Krisztus megjelentek Josephnek,
  és megkezdték mindenek helyreállítását (lásd Apostolok cselekedetei 3:21), amint azt a Bibliában megjövendölték.
  E látomás során Joseph megtudta, hogy az eredeti apostolok halálát követően Krisztus újszövetségi egyháza
  elveszett a földről, és hogy neki kulcsfontosságú szerepe lesz annak visszatérésében.
- Megerősítjük, miszerint az Atya és a Fiú irányítása alatt mennyei hírnökök érkeztek, hogy oktassák Josephet
  és újra megalapítsák Jézus Krisztus egyházát. A feltámadt Keresztelő János visszaállította a felhatalmazást
  az alámerítéssel, bűnök bocsánatára végzett keresztelésre. Az eredeti tizenkét apostol közül hárman
  – Péter, Jakab és János – visszaállították az apostolságot és a papsági felhatalmazás kulcsait. Mások
  is eljöttek, köztük Illés, aki visszaállította a felhatalmazást a családok olyan múlhatatlan kapcsolatokban
  való örök összekötésére, amelyek a halál után is fennmaradnak.
- Tanúságot teszünk továbbá, miszerint Joseph Smithnek megadatott Isten ajándéka és hatalma, hogy lefordítson
  egy ősi feljegyzést, mely a Mormon könyve – egy másik tanúbizonyság Jézus Krisztusról. E szent szöveg
  lapjai beszámolót tartalmaznak többek között Jézus Krisztus személyes szolgálattételéről, melyet a nyugati
  féltekén élő emberek között végzett, röviddel a feltámadása után. A könyv tanít az élet céljáról, és
  kifejti Krisztus tanát, amely központi helyen áll ebben a célban. A Biblia társszentírásaként a Mormon
  könyve bizonyságot tesz arról, hogy minden emberi lény egy szerető Mennyei Atya fia vagy leánya; hogy
  Neki isteni terve van az életünkre vonatkozóan; és hogy az Ő Fia, Jézus Krisztus ma is szól hozzánk,
  csakúgy mint a régmúlt időkben.
- Kijelentjük, hogy Az Utolsó Napi Szentek Jézus Krisztus Egyháza, mely 1830. április 6-án lett megszervezve,
  Krisztus visszaállított újszövetségi egyháza. Ez az egyház Jézus Krisztusnak, az egyház fő szegletkövének
  tökéletes életéhez, valamint az Ő végtelen engeszteléséhez és szó szerinti feltámadásához van horgonyozva.
  Jézus Krisztus újra elhívott apostolokat, és papsági felhatalmazást adott nekik. Mindannyiunkat hív,
  hogy jöjjünk Őhozzá és az Ő egyházába, fogadjuk be a Szentlelket, részesüljünk a szabadítás szertartásaiban,
  és tegyünk szert tartós örömre.
- Immár 200 év telt el azóta, hogy az Atyaisten és Szeretett Fia, Jézus Krisztus megkezdték ezt a visszaállítást.
  Világszerte milliók fogadták már be e megjövendölt események ismeretét.
- Örömmel jelentjük ki, hogy a megígért visszaállítás folyamatos kinyilatkoztatás által tovább halad előre.
  A föld már soha nem lesz ugyanolyan, mert Isten „egybeszerkeszt magának mindeneket a Krisztusban” (Efézusbeliek
  1:10).
- Az Ő apostolaiként tiszteletteljesen és hálásan hívunk mindenkit, hogy tudja meg – ahogyan mi is tudjuk
  –, miszerint a mennyek nyitva állnak. Megerősítjük, hogy Isten tudatja az Ő szeretett fiaira és leányaira
  vonatkozó akaratát. Bizonyságot teszünk arról, miszerint akik imádságosan tanulmányozzák a visszaállítás
  üzenetét és hittel cselekszenek, meg fognak áldatni azzal, hogy saját tanúságot nyernek annak isteni
  mivoltáról és azon céljáról, hogy felkészítse a világot a mi Urunk és Szabadítónk, Jézus Krisztus megígért
  második eljövetelére.
