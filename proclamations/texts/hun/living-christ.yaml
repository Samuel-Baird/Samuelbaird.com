title: Az élő Krisztus
subtitle: Az apostolok bizonysága
author: Az Utolsó Napi Szentek Jézus Krisztus Egyháza
paragraphs:
- Amint megemlékezünk Jézus Krisztus kétezer évvel ezelőtti születéséről, bizonyságunkat tesszük az Ő
  páratlan életének valóságáról, valamint nagyszerű engesztelő áldozatának végtelen hatalmáról. Senki
  más nem volt hasonlóan mély hatással mindazokra, akik a földön éltek, és akik még ezután fognak élni.
- Ő volt az Ószövetség nagy Jehovája és az Újszövetség Messiása. Atyjának irányítása alatt Ő volt a föld
  teremtője. „Minden ő általa lett és nála nélkül semmi sem lett, a mi lett” (János 1:3). Bár bűntelen
  volt, megkeresztelkedett, hogy minden igazlelkűséget betöltsön. „Széjjeljárt jót tévén” (Apostolok cselekedetei
  10:38), mégis megvetették érte. Evangéliuma a béke és a jóakarat üzenete volt. Mindenkit arra kért,
  hogy kövessék példáját. Beteget gyógyítva, vakot látóvá téve és holtat feltámasztva járta Palesztina
  útjait. Az örökkévalóság igazságairól, a halandóság előtti létünk valóságáról, földi életünk céljáról,
  valamint Isten fiainak és leányainak az elkövetkező életben való lehetőségeiről tanított.
- Nagyszerű engesztelő áldozatának emlékeztetőjeként bevezette az úrvacsorát. Hamis vádak alapján letartóztatták
  és ítélkeztek felette, bűnösnek mondták ki, hogy lecsillapítsák a tömeget, s arra ítélték, hogy meghaljon
  a Kálvária keresztjén. Életét adta, hogy kiengeszteljen az egész emberiség bűneiért. Nagyszerű, helyettes
  általi ajándékot adott mindazok javára, akik valaha is a földön élnek.
- Ünnepélyesen bizonyságunkat tesszük arról, hogy élete, amely az egész emberi történelem középpontjában
  áll, nem Betlehemben kezdődött, és nem a Kálvárián ért véget. Ő volt az Atya Elsőszülötte, az Egyszülött
  Fiú a testben, a világ Megváltója.
- Feltámadt a sírból, hogy „zsengéjök” legyen „azoknak, kik elaludtak” (1 Korinthusbeliek 15:20). Feltámadt
  Úrként ellátogatott azok közé, akiket az életben szeretett. Az Ő „más juhai” (János 10:16) között is
  szolgált az ősi Amerikában. Az újkori világban Ő és Atyja megjelentek a gyermek Joseph Smithnek, ezzel
  megnyitva a régen megígért „idők teljességének rendjét” (Efézusbeliek 1:10).
- 'Joseph Próféta ezt írta az Élő Krisztusról: „Szemei olyanok voltak, mint a tűz lángja; fején a haj
  fehér, mint a tiszta hó; arca ragyogott, meghaladva a nap fényességét; hangja pedig olyan volt, akár
  a nagy vizek zúgásának hangzása, méghozzá Jehova hangja, modván:'
- Én vagyok az első és az utolsó; én vagyok az, aki él; én vagyok az, aki megöletett; én vagyok a ti szószólótok
  az Atyánál” (T&Sz 110:3–4).
- 'Azt is kijelentette Róla a Próféta: „És most, a sok tanúság után, amely őróla adatott, ez a legutolsó
  tanúság, amelyet mi adunk róla: Hogy ő él!'
- Mert láttuk őt, méghozzá Isten jobb kezénél; és hallottuk a hangot, amely bizonyságot tett arról, hogy
  ő az Atya Egyszülöttje –
- Hogy általa, rajta keresztül és őtőle teremtetnek és teremtettek a világok, és azok lakói Istennek született
  fiak és leányok” (T&Sz 76:22–24).
- Ünnepélyes szavakkal jelentjük ki, hogy az Ő papsága és egyháza visszaállíttatott a földre – „fölépíttet[ve]
  az apostoloknak és prófétáknak alapkövén, lévén a [fő] szegletkő maga Jézus Krisztus” (Efézusbeliek
  2:20).
- Tanúságot teszünk, hogy egy napon visszatér majd a földre. „És megjelenik az Úr dicsősége, és minden
  test látni fogja azt” (Ésaiás 40:5). Királyok Királyaként fog kormányozni és Urak Uraként uralkodni,
  és minden térd meg fog hajolni, és minden nyelv hódolattal szól majd Őelőtte. Mindegyikünk ott fog állni,
  hogy cselekedeteink és szívünk vágyai szerint megítéljen minket.
- Megfelelően elrendelt apostolaiként bizonyságot teszünk arról, hogy Jézus az Élő Krisztus, Isten halhatatlan
  Fia. Ő a nagy Immánuel király, aki ma az Ő Atyjának jobbján áll. Ő a világ világossága, élete és reménysége.
  Az Ő útja az az ösvény, amely ebben az életben boldogsághoz, az elkövetkezőben pedig örök élethez vezet.
  Köszönet Istennek az Ő isteni Fia páratlan ajándékáért!
