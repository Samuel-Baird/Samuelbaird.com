title: Żyjący Chrystus
subtitle: Świadectwo Apostołów
author: Kościół Jezusa Chrystusa Świętych w Dniach Ostatnich
paragraphs:
- Kiedy obchodzimy rocznicę narodzin Jezusa Chrystusa, które miały miejsce dwa tysiące lat temu, ofiarowujemy
  nasze świadectwo o prawdziwości Jego niezrównanego życia oraz nieskończonej czystości Jego wielkiej
  zadość czyniącej ofiary. Żadna inna osoba nie miała tak doniosłego wpływu na wszystkich, którzy żyli
  dotąd i będą jeszcze żyli na ziemi.
- Był On Wielkim Jehową Starego Testamentu, Mesjaszem Nowego. Pod kierownictwem Swojego Ojca był Stworzycielem
  ziemi. „Wszystko przez [Niego] powstało, a bez [Niego] nic nie powstało, co powstało” (Ew. Jana 1:3).
  Choć był bezgrzeszny, został ochrzczony, aby wypełniła się wszelka prawość. „Chodził, czyniąc dobrze”
  (Dzieje Apostolskie 10:38), a mimo to pogardzano Nim za to. Jego ewangelia była przesłaniem pokoju i
  dobrej woli. Nawoływał wszystkich, aby podążali za Jego przykładem. Chodził drogami Palestyny, uzdrawiając
  chorych, powodując, że niewidomi widzieli i wskrzeszając zmarłych. Nauczał prawd wieczności, o realności
  naszej przedziemskiej egzystencji, celu naszego życia na ziemi oraz o potencjale synów i córek Boga
  w życiu przyszłym.
- Ustanowił sakrament jako przypomnienie Jego wielkiej zadość czyniącej ofiary. Został pojmany i potępiony
  na podstawie fałszywych oskarżeń, skazany, aby zadowolić tłum oraz wydany na śmierć na krzyżu na Kalwarii.
  Oddał Swoje życie, aby zadośćuczynić za grzechy całej ludzkości. To On ofiarował wielki zastępczy dar
  za wszystkich, którzy kiedykolwiek będą żyli na ziemi.
- Uroczyście świadczymy, że Jego życie, które jest w centrum ludzkiej historii, ani nie rozpoczęło się
  w Betlejem, ani nie zakończyło się na Kalwarii. Był On Pierworodnym Ojca, Jednorodzonym Synem w ciele,
  Odkupicielem świata.
- Powstał z grobu, aby być „pierwiastkiem tych, którzy zasnęli” (Ⅰ List do Koryntian 15:20). Jako Powstały
  Pan odwiedzał tych, których kochał za życia. Czynił także posługę pośród Swoich „innych owiec” (Ew.
  Jana 10:16) w pradawnej Ameryce. We współczesnym świecie On i Jego Ojciec ukazali się chłopcu Józefowi
  Smithowi, wprowadzając od dawna obiecywaną „pełnię czasów” (List do Efezjan 1:10).
- 'O Żyjącym Chrystusie Prorok Józef Smith napisał: „Oczy Jego niczym płomień ognia, włosy na głowie białe
  niczym nieskalany śnieg, oblicze Jego jaśniało ponad blask słońca, a głos Jego był niczym odgłos rozpędzonych
  wielkich wód, sam głos Jehowy, mówiący:'
- Jam jest pierwszy i ostatni, Jam jest Ten, który żyje, Jam jest Ten, którego zabito, Jam jest waszym
  orędownikiem u Ojca” (DiP 110:3–4).
- 'Prorok oznajmił o Nim również: „A teraz, po licznych świadectwach, jakie o Nim dano, oto świadectwo
  najnowsze ze wszystkich, które o Nim składamy: Że On żyje!'
- Bowiem ujrzeliśmy Go po samej prawicy Boga; i słyszeliśmy głos dający świadectwo, że jest Jednorodzonym
  Ojca —
- Że dzięki Niemu, przez Niego i z Niego światy są i były tworzone, a ich mieszkańcy są rodzonymi synami
  i córkami Boga” (DiP 76:22–24).
- Oświadczamy uroczystymi słowy, że Jego kapłaństwo i Jego Kościół zostały przywrócone na ziemi — zbudowane
  „na fundamencie apostołów i proroków, którego [głównym] kamieniem węgielnym jest sam Chrystus Jezus”
  (List do Efezjan 2:20).
- Świadczymy, że pewnego dnia On powróci na ziemię. „I objawi się chwała Pańska, i ujrzy to wszelkie ciało
  pospołu” (Ks. Izajasza 40:5). Będzie panował jako Król królów i królował jako Pan panów, każde kolano
  ugnie się i wszelki język będzie Go czcił. Każdy z nas stanie, aby być przez Niego osądzonym według
  naszych uczynków i pragnień naszych serc.
- Składamy świadectwo, jako Jego należycie ustanowieni Apostołowie — że Jezus jest Żyjącym Chrystusem,
  nieśmiertelnym Synem Boga. Jest wielkim Królem Immanuelem, który stoi dzisiaj po prawicy Swojego Ojca.
  Jest światłem, życiem i nadzieją świata. Jego droga jest ścieżką, która prowadzi do szczęścia w tym
  życiu i w życiu wiecznym w świecie, który nastanie. Bogu niech będą dzięki za niezrównany dar Jego boskiego
  Syna.
