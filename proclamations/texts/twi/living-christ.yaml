title: Kristo Teasefoɔ No
subtitle: Asomafoɔ no Adansedie
author: Yesu Kristo Asɔre a ɛwɔ hɔ ma Nna a Ɛdi Akyire Ahotefoɔ
paragraphs:
- Berɛ a yɛrekae Yesu Kristo awoɔ a ɛsii mfeɛ mpennu a atwa mu kɔ no, yɛdi adanseɛ nokorɛ mu fa N’abrabɔ
  pa a ɛnni nsɛsoɔ ne papayɛ a ɛnni ano wɔ Ne mpata afɔrebɔ kɛseɛ no ho. Onipa biara nni hɔ a wanya nkɛtɛnsoɔ
  kɛseɛ wɔ obiara a wɔatena ase na wɔbɛkɔ so atena ase wɔ asase yi so.
- Ɔne Yehowa a ɔyɛ Kɛseɛ wɔ Apam Dada no mu, ne Apam foforɔ mu Mesaia no. Wɔ N’Agya akwankyerɛ ase no,
  Ɔno na ɔbɔɔ asase no. “Ɛnam ne so na wɔyɛɛ nneɛma nyinaa; na wɔankwati no anyɛ biribiara a wɔyɛɛeɛ”
  (Yohane 1:3). Ɛwom sɛ na bɔne nni ne ho, wɔbɔɔ No asu sɛ teneneeyɛ nyinaa bɛba mu. “Ɔkyini yɛɛ ade papa”
  (Asomafoɔ 10:38), nanso wɔbuu No ɛho animtia. Na N’asɛmpa no yɛ asomdwoeɛ ne anisɔ nkrasɛm. Ɔsrɛɛ obiara
  sɛ wɔnni Ne nhwɛsoɔ akyiri. Ɔnante faa Palestine akwan so, saa nyarewa, maa anifirafoɔ hunuu adeɛ, na
  Ɔnyanee awufoɔ. Ɔkyerɛkyerɛɛ daapem mu nokorɛ, yɛn asetena ankasa ansa na wiase reba, botaeɛ fa yɛn
  wiase abrabɔ ho, ne nkɔsoɔ ma Onyankopɔn mma mmarima ne mma mmaa wɔ abrabɔ a ɛbɛba no mu.
- Ɔhyɛɛ adidi kronkron no ase sɛ nkaeɛ ma Ne mpata afɔrebɔ kɛseɛ no. Wɔkyeree no na wɔde ntwatosoɔ buu
  No fɔ, buu no fɔ sɛ ɛbɛsɔ kwasampafoɔkuo ani, na wɔbuu no atɛn sɛ ɔnkɔwu wɔ Calvary asɛnnua so. Ɔde
  Ne nkwa maaeɛ de pataa adasamma nyinaa bɔne. Ne deɛ no yɛ akyɛdeɛ kɛseɛ a ɔyɛ de gyinaa ananmu maa obiara
  a ɔbɛtena asase yi so.
- Yɛdi adanseɛ kann sɛ Ne nkwa, a ɛho hia yie ma nnipa nyinaa abakɔsɛm no, anhyɛ aseɛ wɔ Bethlehem na
  anwie wɔ Calvary. Ɔne Agya no Abakan, Ɔbabarima a ɔwoo no korɔ wɔ honam mu, ewiase Gyefoɔ no.
- Ɔnyane firii damena mu de “bɛyɛɛ wɔn a wɔadeda no mu aduaba a ɛdi kan” (1 Korintofoɔ 15:20). Sɛ Awurade
  a Wasɔreɛ no, ɔkɔsraa wɔn a wɔadɔ wɔn wɔ ne honam asetena mu no. Afei nso ɔkɔsomm wɔ Ne “nnwan afoforɔ”
  no (Yohane 10:16) a wɔwɔ tete Amerika no ntam. Ɛnnɛ wiase yi mu, Ɔne N’Agya ayi wɔn ho adi akyerɛ abarimaa
  Joseph Smith, ama “asɛmpa berɛ mu mahyɛ no” (Efesofoɔ 1:10) a wɔahyɛ ho bɔ dada no ahyɛ aseɛ.
- 'Ɛfa Kristo Teasefoɔ ho no, Nkɔmhyɛni Joseph twerɛɛ sɛ: “Na N’ani te sɛ ogya gyaframa; nwi a ɛwɔ Ne
  tiri so yɛ fitaa te sɛ sukyerɛma korɔgyenn; N’anim hwɛbea hyerɛn boro sɛdeɛ owia hyerɛn; na Ne nne te
  sɛ asuo akɛseɛ twibɔ nnyegyeɛ, mpo Yehowa nne, a ɛreka sɛ:'
- “Mene deɛ ɔdikan ne deɛ ɔtwa toɔ no; Mene ɔno a ɔte ase no, Mene ɔno a wɔkumm no no; Mene mo dimafoɔ
  wɔ Agya no nkyɛn” (Nkyerɛkyerɛ ne Apam 110:3–4).
- '“Ɛfa Ne ho no nso Nkɔmhyɛni no de too dwa sɛ: “Na afei, akyire yi adanseɛ dodoɔ a wɔadi afa ne ho no,
  yei ne adanseɛ a ɛtwa ne nyinaa to, a yɛde ma ɛfa ne ho: Sɛ ɔte ase!'
- “Ɛfiri sɛ yɛhunuu no, mpo wɔ Onyankopɔn nsa nifa so; na yɛtee ɛnne no sɛ ɛredi adanseɛ sɛ ɔne ɔno a
  Wɔwoo no korɔ maa Agya no—
- “Na ɛfiri Ɔno, na ɛnam Ne so, na ɛwɔ ne mu na wiase wɔ hɔ na wɔbɔɔeɛ, na ɛsotefoɔ a wɔwɔ mu no yɛ mma
  mmarima ne mma mmaa a wɔawo wɔn ama Onyankopɔn” (Nkyerɛkyerɛ ne Apam 76:22–24).
- Yɛde nsɛm nokorɛ kann de to dwa sɛ N’asɔfodie ne N’Asɔre asan aba asaase so bio—” a wɔasi wɔ fapem a
  ɛyɛ … asomafoɔ ne nkɔmhyɛfoɔ so, a Yesu Kristo no ankasa yɛ tweatiboɔ titire no” (Efesofoɔ 2:20).
- Yɛdi adanseɛ sɛ da bi Ɔbɛsan aba asase so bio. “Na Awurade animuonyam bɛyi ne ho adi, na honam nyinaa
  bɛbɔ mu ahunu” (Yesaia 40:5). Ɔbɛdi tumi sɛ Ahene mu Hene na wadi hene sɛ Awuranom mu Awurade, kotodwe
  biara bɛkoto no na tɛkyerɛma biara bɛkasa de asom no wɔ N’anim. Yɛn mu biara bɛgyina hɔ ama wɔabu yɛn
  atɛn sɛdeɛ yɛn nnwuma ne yɛn akoma mu apɛdeɛ teɛ.
- Yɛdi adanseɛ, sɛ N’Asomafoɔ a wɔahyɛ yɛn asɔfoɔ nokorɛ kwan so—sɛ Yesu ne Kristo Teasefoɔ no, Onyankopɔn
  Babarima a ɔrenwu da no. Ɔne Ɔhene kɛseɛ Imanuel no, a ɛnnɛ yi Ɔgyina N’Agya nsa nifa so no. Ɔne hann
  no, nkwa no, ne ɛwiase anidasoɔ. Ne kwan yɛ anammɔn kwan a ɛkyerɛ kwan kɔ anigyeɛ mu wɔ saa asetena
  yi mu ne daa nkwa wɔ wiase a ɛbɛba no mu. Aseda nka Onyankopɔn wɔ akyɛdeɛ a ɛnni nsɛsoɔ a ɛyɛ Ne Ba
  kronkron no.
