title: Den Levende Kristus
subtitle: Apostlenes vidnesbyrd
author: Jesu Kristi Kirke af Sidste Dages Hellige
paragraphs:
- Nu, hvor vi mindes Jesu Kristi fødsel for to tusind år siden, bærer vi vores vidnesbyrd om, at han virkelig
  levede et enestående liv, og at hans store sonoffer rummer uendelig kraft. Ingen anden har haft så vidtrækkende
  indflydelse på alle, der har levet, eller som vil komme til at leve på jorden.
- Han var Det Gamle Testamentes store Jahve og Det Nye Testamentes Messias. Under sin Faders ledelse skabte
  han jorden. »Alt blev til ved ham, og uden ham blev intet til af det, som er« (Joh 1:3). Skønt han var
  uden synd, lod han sig døbe for at opfylde al retfærdighed. Han »færdedes overalt og gjorde vel« (ApG
  10:38), men blev foragtet for det. Hans evangelium var et budskab om fred og velvilje. Han opfordrede
  alle til at følge sit eksempel. Han vandrede ad Palæstinas veje, hvor han helbredte de syge, gjorde
  de blinde seende og opvakte de døde. Han forkyndte evighedens sandheder, vitterligheden af vores førjordiske
  tilværelse, formålet med vores liv på jorden og Guds sønners og døtres muligheder i det kommende liv.
- Han indstiftede nadveren som en påmindelse om sit store sonoffer. Han blev pågrebet og anklaget på falsk
  grundlag, kendt skyldig i at stille pøblen tilfreds og dømt til at dø på et kors på Golgata. Han gav
  sit liv for at sone for hele menneskehedens synder. Hans stedfortrædende offer var en storslået gave
  for alle mennesker, der nogensinde kommer til at leve på jorden.
- Vi bærer højtideligt vidnesbyrd om, at hans liv, der spiller en central rolle i menneskets historie,
  hverken begyndte i Betlehem eller endte på Golgata. Han var Faderens Førstefødte, den Enbårne Søn i
  kødet, verdens Forløser.
- Han opstod fra graven som »førstegrøden af dem, der er sovet hen« (1 Kor 15:20). Som den opstandne Herre
  besøgte han dem, han havde elsket i dette liv. Han virkede også blandt sine »andre får« (Joh 10:16)
  i oldtidens Amerika. I vore dage viste han og hans Fader sig for drengen Joseph Smith og indvarslede
  som lovet »tidernes fylde« (Ef 1:10).
- 'Om den levende Kristus skrev profeten Joseph: »Hans øjne var som en ildslue, håret på hans hoved var
  hvidt som ren sne, hans ansigt strålede klarere end solen, og hans røst var som lyden af bruset fra
  vældige vande, ja, Jahves røst, som lød:'
- »Jeg er den første og den sidste; jeg er den, som lever, jeg er den, som blev slået ihjel; jeg er jeres
  talsmand over for Faderen« (L&P 110:3-4).
- 'Om Kristus sagde profeten også: »Og se, efter de mange vidnesbyrd, som er blevet givet om ham, er dette
  det vidnesbyrd, det seneste af dem alle, som vi giver om ham: At han lever!'
- For vi så ham, ja, ved Guds højre hånd; og vi hørte røsten aflægge vidnesbyrd om, at han er Faderens
  Enbårne –
- at ved ham og gennem ham og af ham, bliver og blev verdenerne skabt, og deres indbyggere er født som
  Guds sønner og døtre« (L&P 76:22-24).
- Vi erklærer i al højtidelighed, at hans præstedømme og hans kirke er blevet gengivet til jorden – »bygget
  på apostlenes og profeternes grundvold med Kristus Jesus selv som hovedhjørnesten« (Ef 2:20).
- Vi bærer vidnesbyrd om, at han en dag vil vende tilbage til jorden. »Herrens herlighed skal åbenbares,
  og alle mennesker skal se den« (Es 40:5). Han skal herske som Kongernes Konge og regere som Herrernes
  Herre, og hvert knæ skal bøje sig og hver tunge skal tilbede ham. Enhver af os skal fremstilles for
  Gud for at blive dømt efter vores gerninger og vores hjertes ønsker.
- Vi bærer, som hans behørigt indsatte apostle, vidnesbyrd om, at Jesus er den levende Kristus, Guds udødelige
  Søn. Han er den store kong Immanuel, som i dag står ved sin Faders højre hånd. Han er verdens lys, liv
  og håb. Hans vej er den sti, der fører til glæde i dette liv og evigt liv i den kommende verden. Vi
  takker Gud for den enestående gave, som han gav os i form af sin guddommelige Søn.
