title: Familien
subtitle: En proklamation til verden
author: Det Første Præsidentskab og De Tolv Apostles Råd i Jesu Kristi Kirke af Sidste Dages Hellige
note: Denne proklamation blev oplæst af præsident Gordon B. Hinckley ved Hjælpeforeningens årlige møde
  den 23. september 1995 i Salt Lake City i Utah.
paragraphs:
- Vi, Det Første Præsidentskab og De Tolv Apostles Råd i Jesu Kristi Kirke af Sidste Dages Hellige, erklærer
  højtideligt, at ægteskab mellem mand og kvinde er indstiftet af Gud, og at familien er af afgørende
  betydning i Skaberens plan for sine børns evige skæbne.
- Alle mennesker – mænd og kvinder – er skabt i Guds billede. Hver enkelt er en højt elsket søn eller
  datter af himmelske forældre, og som sådan besidder hver enkelt guddommelige egenskaber og muligheder.
  En persons køn er et fundamentalt særkende ved den enkeltes førjordiske, jordiske og evige identitet
  og mål.
- I den førjordiske verden kendte og tilbad Guds åndelige sønner og døtre Gud som deres evige Fader og
  accepterede hans plan for, hvordan hans børn kunne få et fysisk legeme og opnå jordiske erfaringer for
  at udvikle sig frem mod fuldkommenhed og til sidst realisere deres guddommelige skæbne som arvinger
  til evigt liv. Den guddommelige plan for lykke gør bevarelsen af familiebånd mulig på den anden side
  af graven. Hellige ordinancer og pagter, der er tilgængelige i hellige templer, gør det muligt for enkeltpersoner
  at vende tilbage til Guds nærhed og for familier at være forenet for evigt.
- Den første befaling, som Gud gav til Adam og Eva, vedrørte deres mulighed for som ægtemand og hustru
  at blive forældre. Vi erklærer, at Guds befaling til sine børn om at mangfoldiggøre sig og opfylde jorden
  stadig er gældende. Vi erklærer endvidere, at Gud har befalet, at formeringens hellige kraft kun må
  anvendes mellem en mand og en kvinde, der er lovformeligt viet som ægtemand og hustru.
- Vi erklærer, at den måde, hvorved det jordiske liv skabes, er guddommeligt bestemt. Vi bekræfter livets
  hellighed og vigtigheden af det i Guds evige plan.
- Ægtemand og hustru har et stort ansvar for at elske og vise omsorg for hinanden og for deres børn. »Sønner
  [børn] er en gave fra Herren« (Sl 127:3). Forældre har en hellig pligt til at opdrage deres børn i kærlighed
  og retskaffenhed, til at sørge for deres fysiske og åndelige behov, til at lære dem at elske og tjene
  hinanden, til at overholde Guds bud og til at være lovlydige samfundsborgere, uanset hvor de bor. Ægtemænd
  og hustruer – mødre og fædre – vil over for Gud blive holdt ansvarlige for udførelsen af disse pligter.
- Familien er indstiftet af Gud. Ægteskabet mellem mand og kvinde er grundlæggende i hans evige plan.
  Børn har ret til at blive født inden for ægteskabets rammer og blive opdraget af en far og en mor, som
  ærer deres ægteskabsløfter med fuldstændig troskab. Lykke i familielivet vil med størst sandsynlighed
  opnås, når det baseres på Herren Jesu Kristi lærdomme. Velfungerende ægteskaber og familier opbygges
  og bevares ved tro, bøn, omvendelse, tilgivelse, respekt, kærlighed, barmhjertighed, arbejde og sunde
  fritidsbeskæftigelser. I henhold til den guddommelige plan skal fædre lede deres familier i kærlighed
  og retskaffenhed og de har ansvaret for at sørge for livets fornødenheder og beskytte deres familier.
  Mødre har primært ansvaret for at drage omsorg for deres børn. I disse hellige ansvar er fædre og mødre
  forpligtet til at hjælpe hinanden som jævnbyrdige partnere. Uarbejdsdygtighed, dødsfald eller andre
  omstændigheder kan nødvendiggøre individuelle tilpasninger. Den øvrige familie bør hjælpe til, når der
  er behov herfor.
- Vi advarer om, at personer, som bryder deres løfte om troskab, som misbruger deres ægtefælle eller deres
  børn, eller som ikke opfylder ansvaret i familien, en dag skal stå til ansvar over for Gud. Vi advarer
  endvidere om, at familiens opløsning vil påføre enkeltpersoner, lokalsamfund og nationer ulykke, som
  det er forudsagt af fordums og nutidige profeter.
- Vi opfordrer ansvarlige borgere og offentlige ansatte overalt til at fremme tiltag, der har til hensigt
  at bevare og styrke familien som samfundets grundlæggende enhed.
