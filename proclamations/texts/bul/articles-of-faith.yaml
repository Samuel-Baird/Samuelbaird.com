title: Символът на вярата
subtitle: на Църквата на Исус Христос на светиите от последните дни
author: ''
verses:
- n: 1
  text: Ние вярваме в Бога, Вечния Отец, и в Сина Му, Исус Христос, и в Светия Дух.
- n: 2
  text: Ние вярваме, че хората ще бъдат наказани за собствените си грехове, а не за Адамовото прегрешение.
- n: 3
  text: Ние вярваме, че чрез Единението Христово цялото човечество може да бъде спасено чрез подчинение
    на законите и обредите на Евангелието.
- n: 4
  text: 'Ние вярваме, че първите принципи и обреди на Евангелието са: първо, вяра в Господ Исус Христос;
    второ, покаяние; трето, кръщение чрез пълно потапяне за опрощение на греховете; четвърто, полагане
    на ръце за даване дара на Светия Дух.'
- n: 5
  text: Ние вярваме, че за да проповядва Евангелието и да отслужва обредите му, човек трябва да бъде призован
    от Бога чрез пророчество и чрез полагане на ръце от тези, които имат власт.
- n: 6
  text: 'Ние вярваме в същата организация, която е съществувала в първоначалната Църква, а именно: апостоли,
    пророци, пастири, учители, благовестители и тъй нататък.'
- n: 7
  text: Ние вярваме в дара за езици, пророчество, откровение, видения, изцеляване, тълкуване на езици
    и тъй нататък.
- n: 8
  text: Ние вярваме, че Библията е словото Божие, доколкото е преведена правилно; вярваме също, че и Книгата
    на Мормон е словото Божие.
- n: 9
  text: Ние вярваме във всичко, което Бог е разкрил, във всичко, което понастоящем разкрива, и вярваме
    също, че Той все още ще разкрива много велики и важни неща, отнасящи се до царството Божие.
- n: 10
  text: Ние вярваме в буквалното събиране на Израил и във възстановяването на десетте племена; че Сион
    (Новият Йерусалим) ще бъде изграден на американския континент; че Христос ще царува лично на земята
    и че земята ще бъде обновена и ще получи райската си слава.
- n: 11
  text: Ние претендираме за правото да се покланяме на Всемогъщия Бог според както диктува собствената
    ни съвест и даваме на хората същата привилегия; и нека те се покланят както, където и на каквото си
    искат.
- n: 12
  text: Ние вярваме в това, че сме поданици на крале, президенти, управници и съдии, в подчинението, уважението
    и подкрепянето на закона.
- n: 13
  text: 'Вярваме в това да сме честни, истинни, непорочни, любезни, добродетелни и в правенето на добро
    на всички хора; ние наистина можем да кажем, че следваме съвета на Павел: Вярваме във всичко, надяваме
    се на всичко, устояли сме на много неща и се надяваме да бъдем способни да устоим на всичко. И ако
    има нещо добродетелно, хубаво или достойно за похвала, ние го търсим.'
signature: Джозеф Смит.
