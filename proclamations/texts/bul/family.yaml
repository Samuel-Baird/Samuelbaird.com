title: Семейството
subtitle: Прокламация към света
author: Първото президентство и Съветът на дванадесетте апостоли на Църквата на Исус Христос на светиите
  от последните дни
note: Тази прокламация бе прочетена от президент Гордън Б. Хинкли като част от неговото послание на общото
  събрание на Обществото за взаимопомощ, състояло се на 23 септември 1995 г. в Солт Лейк Сити, Юта.
paragraphs:
- Ние, Първото президентство и Съветът на дванадесетте апостоли на Църквата на Исус Христос на светиите
  от последните дни, тържествено провъзгласяваме, че бракът между мъжа и жената е постановен от Бог и
  че семейството заема централно място в плана на Твореца за вечната съдба на Неговите чеда.
- Всички човешки същества – мъже и жени – са създадени по образа на Бог. Всички те са възлюбени духовни
  синове или дъщери на Небесни родители и като такива всички имат божествена същност и съдба. Полът е
  съществена характеристика на доземната, земната и вечната идентичност и цел на човека.
- В доземния свят духовните синове и дъщери познавали и почитали Бог като свой Вечен Отец и приели Неговия
  план, чрез който чедата Му могат да получат физически тела и да придобият земен опит, за да напредват
  към съвършенство и в крайна сметка да постигнат своята божествена съдба като наследници на вечен живот.
  Божественият план на щастие позволява семейните връзки да продължат отвъд смъртта. Свещените обреди
  и завети, достъпни в светите храмове, дават възможност на отделните хора да се завърнат в присъствието
  на Бог, а на семействата да бъдат свързани за вечността.
- Първата заповед, която Бог дал на Адам и Ева, се отнася до възможността им, като съпруг и съпруга, да
  станат родители. Ние заявяваме, че заповедта на Бог към Неговите чеда да се плодят и да изпълват земята
  остава в сила. Също така заявяваме, че Бог е заповядал свещените сили за създаване на потомство да се
  използват само между мъж и жена, законно свързани като съпруг и съпруга.
- Ние заявяваме, че начинът, по който земният живот се създава, е божествено постановен. Ние потвърждаваме
  светостта на живота и неговата важност във вечния план на Бог.
- Съпругът и съпругата имат важната отговорност да се обичат и да се грижат един за друг и за своите деца.
  „Наследство от Господа са чедата“ (Псалми 127:3). Родителите имат свещения дълг да отглеждат децата
  си в любов и праведност, да се грижат за техните физически и духовни нужди, да ги учат да се обичат
  и да си служат, да съблюдават заповедите Божии и да бъдат граждани, спазващи закона, където и да живеят.
  Съпрузите и съпругите, майките и бащите, ще бъдат отговорни пред Бог за самоосвобождаването от тези
  свои задължения.
- Семейството е постановено от Бог. Бракът между мъжа и жената е съществен елемент в Неговия вечен план.
  Отредено е децата да се раждат в рамките на брачната връзка и да бъдат отглеждани от баща и майка, които
  изцяло почитат брачните завети. Щастието в семейния живот е най-вероятно да се постигне, когато се гради
  върху ученията на Господ Исус Христос. Успешните бракове и семейства се установяват и поддържат върху
  принципите вяра, молитва, покаяние, прошка, уважение, обич, състрадание, работа и благотворни, развлекателни
  дейности. По божествен проект бащите трябва да водят своите семейства с любов и праведност и са отговорни
  да осигуряват необходимото за живота и защитата на семействата си. Майките са отговорни предимно за
  отглеждането на децата си. В тези свещени отговорности бащите и майките са задължени да си помагат като
  равностойни партньори. Недееспособност, смърт или други обстоятелства могат да изискват индивидуално
  приспособяване. Роднините трябва да оказват помощ при необходимост.
- Ние предупреждаваме тези, които нарушават заветите за целомъдрие, които упражняват тормоз над брачния
  партньор или детето си, или които не изпълняват семейните си задължения, че един ден ще бъдат отговорни
  пред Бог за това. Също така предупреждаваме, че разпадането на семейството ще донесе на отделните хора,
  общностите и нациите бедствията, предсказани от древните и от съвременните пророци.
- Ние призоваваме отговорните граждани и държавните служители навсякъде по света да подкрепят мерките,
  предназначени да запазят и укрепят семейството като основна единица на обществото.
