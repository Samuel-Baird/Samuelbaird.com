title: Възстановяването на пълнотата на Евангелието на Исус Христос
subtitle: Прокламация към света по случай двестагодишнината
author: Първото президентство и Съветът на дванадесетте апостоли на Църквата на Исус Христос на светиите
  от последните дни
note: Тази прокламация бе прочетена от президент Ръсел М. Нелсън като част от неговото послание по време
  на 190-ата годишна обща конференция, състояла се на 5 април 2020 г. в Солт Лейк Сити, Юта.
paragraphs:
- Тържествено провъзгласяваме, че Бог обича Своите чеда от всеки народ по света. Бог Отец ни е дал божественото
  раждане, несравнимия живот и безпределната единителна жертва на Своя Възлюбен Син Исус Христос. Чрез
  силата на Отца, Исус се вдигнал от гроба и победил смъртта. Той е нашият Спасител, Пример и Изкупител.
- Преди двеста години в щата Ню Йорк, САЩ, през една красива пролетна утрин на 1820 г. младият Джозеф
  Смит отива в една близка до дома си горичка да се моли, за да узнае към коя църква да се присъедини.
  Той има въпроси относно спасението на душата си и вярва, че Бог ще му даде напътствие.
- Със смирение заявяваме, че в отговор на неговата молитва Бог Отец и Неговият Син Исус Христос се явяват
  на Джозеф и поставят началото на предреченото в Библията време, когато „ще се възстанови всичко“ (Деянията
  на апостолите 3:21). С това видение той научава, че след смъртта на първоначалните апостоли новозаветната
  Христова Църква е била изгубена от земята. Чрез Джозеф тя щяла да бъде възстановена.
- Потвърждаваме, че под ръководството на Отца и Сина, небесни пратеници наставляват Джозеф и отново установяват
  Църквата на Исус Христос. Възкресеният Йоан Кръстител възстановява властта за извършване на кръщения
  чрез пълно потапяне за опрощение на греховете. Трима от първоначалните апостоли – Петър, Яков и Йоан
  – възстановяват апостолската власт и ключовете на свещеничеството. Има и други пратеници, сред които
  Илия, който възстановява властта за свързване на семействата завинаги във взаимоотношения, неподвластни
  на смъртта и продължаващи във вечността.
- 'Също така свидетелстваме, че на Джозеф Смит са дадени дара и силата Божии, за да преведе древен летопис
  – Книгата на Мормон: още едно свидетелство за Исус Христос. Този свещен летопис включва разказ за личното
  служение на Исус Христос сред жителите на Западното полукълбо скоро след Неговото Възкресение. В него
  е описана целта на живота и е обяснено учението на Христос, което има ключово значение за осъществяването
  на тази цел. Като том с Писания, допълващ Библията, Книгата на Мормон свидетелства, че всички човешки
  същества са синове и дъщери на любящ Отец в Небесата, че Той има божествен план за живота ни и че Неговият
  Син Исус Христос говори днес, както е говорил и в древността.'
- Заявяваме, че Църквата на Исус Христос на светиите от последните дни, организирана на 6 април 1830 г.,
  е възстановената новозаветна Христова Църква. В основата на тази Църква стоят съвършеният живот на главния
  крайъгълен камък Исус Христос, Неговото безпределно Единение и действителното Му Възкресение. Исус Христос
  отново е призовал апостоли и им е дал свещеническа власт. Той кани всички нас да дойдем при Него и да
  се присъединим към Неговата Църква, да приемем Светия Дух и спасителните обреди и да получим трайна
  радост.
- Вече са изминали двеста години от началото на това Възстановяване, поставено от Бог Отец и Неговия Възлюбен
  Син Исус Христос. Милиони по света са получили знание за тези предречени в пророчества събития.
- С радост заявяваме, че обещаното Възстановяване напредва чрез продължаващи откровения. Земята никога
  вече няма да бъде същата, защото Бог ще „събере в Христос всичко“ (Ефесяните 1:10).
- Като Негови апостоли, с благоговение и благодарност каним всички да узнаят, както ние сме узнали, че
  небесата са отворени. Потвърждаваме, че Бог изявява волята Си за Своите възлюбени синове и дъщери. Свидетелстваме,
  че онези, които с молитва изучават посланието на Възстановяването и действат с вяра, ще бъдат благословени
  да получат собствено свидетелство за неговата божественост и за неговата цел да подготвя света за обещаното
  Второ пришествие на нашия Господ и Спасител Исус Христос.
