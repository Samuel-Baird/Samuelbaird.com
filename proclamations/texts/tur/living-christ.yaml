title: Yaşayan Mesih
subtitle: Havarilerin Tanıklığı
author: İsa Mesih’in Son Zaman Azizler Kilisesi
paragraphs:
- İsa Mesih’in iki bin yıl önceki doğumunun yıldönümünü kutlarken, O’nun eşsiz yaşamının gerçekliği ve
  kefaret amacıyla kurban oluşunun sonsuz erdemi hakkında tanıklığımızı sunuyoruz. Başka hiç kimsenin,
  yeryüzünde yaşamış ve yaşayacak olan bütün insanlar üzerinde bu kadar önemli bir etkisi olmamıştır.
- O, Eski Antlaşma’nın Büyük Yehovası, Yeni Antlaşma’nın Mesihi’dir. Babasının yönetimi altında yeryüzünün
  yaratıcısı oldu. “Her şey O’nun aracılığıyla var oldu, var olan hiçbir şey O’nsuz olmadı” (Yuhanna 1:3).
  Günahsız olduğu halde, bütün doğrulukları yerine getirmek için vaftiz oldu. Böyle yaptığı için hor görülmesine
  rağmen, “iyilik yaparak her yeri dolaştı” (Elçilerin İşleri 10:38). O’nun sevindirici haberi huzur,
  barış ve iyi niyet mesajıydı. O, herkesi kendi örneğini takip etmeye çağırdı. O, hastaları iyileştirerek,
  körlerin görmesini sağlayarak ve ölüleri dirilterek Filistin yollarında yürüdü. Sonsuzluğun gerçeklerini,
  ölümlülük öncesi varoluşumuzun gerçekliğini, bu dünyadaki yaşamımızın amacını ve Tanrı’nın oğullarının
  ve kızlarının gelecek yaşamdaki potansiyelini öğretti.
- Kendisinin kefaret amacıyla kurban oluşunun bir hatırlatıcısı olarak, Rab’bin sofrasını kurdu. Tutuklandı
  ve yalan suçlamalarla yargılanarak, çete oluşturmuş bir kalabalığı memnun etmek üzere suçlanarak Kafatası
  çarmıhında öldürülmeye mahkum edildi. O, tüm insanlığın günahlarının kefaretini ödemek için hayatını
  verdi. Onun armağanı, yeryüzünde yaşayacak olan herkesin adına vekaleten verilmiş büyük bir armağandı.
- O’nun bütün insanlık tarihinin merkezi olan hayatının Beytlehem’de başlamadığına ve Kafatası denilen
  yerde son bulmadığına dair ciddi bir şekilde tanıklık ederiz. O Baba’nın İlk Evladı, bedende doğmuş
  Biricik Oğul, dünyanın Fidye ile Kurtarıcısı idi.
- O “ölmüş olanların ilk örneği olarak” mezardan çıkarak dirildi (1. Korintliler 15:20). Dirilen Rab olarak,
  yaşadığı sürece sevmiş olduğu insanları ziyaret etti. Ayrıca eski Amerika’da yaşayan “diğer koyunlarına
  da” (Yuhanna 10:16) hizmet etti. Günümüz dünyasında, O ve Babası, uzun zaman önce vaat edilen “zamanların
  dolduğu düzenleme dönemini” (Efesliler 1:10) açarak, genç Joseph Smith’e göründü.
- 'Yaşayan Mesih ile ilgili olarak, Peygamber Joseph şöyle yazmıştır: “O’nun gözleri ateşin alevi gibiydi;
  başının saçı tertemiz kar gibi beyazdı; yüzü güneşin parlaklığından daha çok parlıyordu ve sesi büyük
  suların çağlayışının sesi gibiydi, hatta Yehova’nın sesiydi, şöyle diyordu:'
- İlk ve son Ben’im; diri olan Ben’im, öldürülmüş olan Ben’im; Baba’nın yanında sizin savunucunuz Ben’im
  (Ö&A 110:3–4).
- 'O’nun hakkında Peygamber de şunu bildirmiştir: “Ve şimdi, O’nun hakkında verilmiş olan birçok tanıklıktan
  sonra, O’nun hakkında verdiğimiz bu tanıklık, bütün tanıklıkların sonuncusu olan tanıklıktır: Öyle ki
  O yaşıyor!'
- “Çünkü biz O’nu gördük, hatta Tanrı’nın sağında; ve biz O’nun Baba’nın Biricik Doğmuş Çocuğu olduğuna
  dair tanıklık eden sesi duyduk;
- “Öyle ki O’nun tarafından ve O’nun aracılığıyla ve O’ndan dünyalar yaratılır ve yaratılmıştır ve oralarda
  yaşayanlar Tanrı’nın oğulları ve kızları olarak doğarlar” (Ö&A 76:22–24).
- O’nun rahipliğinin ve Kilisesi’nin yeryüzünde iade edildiğini, “havariler ile peygamberlerin temeli
  … üzerine kurulduğunu, İsa Mesih’in kendisinin başköşe taşı olduğunu” ciddi bir şekilde beyan ederiz
  (Efesliler 2:20).
- O’nun bir gün dünyaya geri döneceğine tanıklık ediyoruz. “Ve Rab’bin yüceliği görünecek ve bütün insanlar
  hep birlikte bunu görecekler” (Yeşaya 40:5). O, Kralların Kralı olarak yönetecek ve Rablerin Rabbi olarak
  hüküm sürecek ve her diz O’nun önünde çökerek, her dil O’na kulluk eden sözler söyleyecektir. Her birimiz,
  işlerimize ve yüreklerimizdeki arzulara göre O’nun tarafından yargılanmak üzere duracağız.
- O’nun kaidelerine uygun olarak atanan Havarileri olarak, İsa’nın Yaşayan Mesih ve Tanrı’nın ölümsüz
  Oğlu olduğuna dair tanıklığımızı sunuyoruz. O, bugün Babası’nın sağında duran büyük Kral İmmanuel’dir.
  O dünyanın ışığı, yaşamı ve umududur. O’nun yolu, bu yaşamda mutluluğa ve öbür dünyada ebedi hayata
  götüren yoldur. Tanrı’ya, İlahi Oğlu’nun eşsiz armağanı için şükürler olsun.
