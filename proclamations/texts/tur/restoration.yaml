title: İsa Mesih’in Sevindirici Haberi’nin Tamamının İade Edilişi
subtitle: Bütün Dünyaya İki Yüzüncü Yıl Dönümü Bildirisi
author: İsa Mesih’in Son Zaman Azizler Kilisesi’nin Birinci Başkanlığı ve Oniki Havariler Meclisi
note: Bu bildiri, 5 Nisan 2020’de Utah-Salt Lake City’de düzenlenen 190. Yıllık Genel Konferansı’nda,
  Başkan Russell M. Nelson tarafından mesajının bir parçası olarak okundu.
paragraphs:
- Biz Tanrı’nın, dünyanın her ulusunda olan çocuklarını sevdiğini ciddiyetle ilan ederiz. Tanrı Baba,
  bize Sevgili Oğlu İsa Mesih’in ilahi doğumunu, eşsiz hayatını ve sonsuz kefaret edici kurban oluşunu
  bahşetti. Baba’nın gücüyle, İsa dirildi ve ölüme karşı zafer kazandı. O bizim Kurtarıcımız, Örneğimiz
  ve Fidye ile Kurtaranımız’dır.
- İki yüz yıl önce, 1820’de güzel bir bahar sabahı, hangi kiliseye katılacağını bilmek isteyen genç Joseph
  Smith, ABD’nin Kuzey New York’ta bulunan evinin yakınındaki ormana dua etmek için gitti. Canının kurtuluşu
  ile ilgili soruları vardı ve Tanrı’nın onu yönlendireceğine güveniyordu.
- Biz, Joseph’ın duasına cevap olarak, Tanrı Baba’nın ve Oğlu İsa Mesih’in ona göründüğünü ve Kutsal Kitap’ta
  önceden bildirildiği gibi “her şeyin iadesini” (Elçilerin İşleri 3:21) resmi olarak başlattığını alçakgönüllülükle
  beyan ederiz. Bu görümde Joseph, ilk Havariler’in ölümünden sonra, Mesih’in Yeni Antlaşma’daki Kilisesi’nin
  dünyadan kaybolduğunu öğrendi. Joseph, Kilise’nin geri dönüşüne aracı olacaktı.
- Biz, Baba ve Oğul’un yönetimi altında ilahi habercilerin Joseph’a talimat vermek ve İsa Mesih’in Kilisesi’ni
  yeniden kurmak için geldiğini teyit ediyoruz. Dirilmiş Vaftizci Yahya, günahların bağışlanması için
  suya daldırılarak yapılan vaftiz etme yetkisini iade etti. İlk oniki Havariler’den üçü; Petrus, Yakup
  ve Yuhanna, havarilik görevini ve rahiplik yetkisinin anahtarlarını iade etti. Ölümü aşan ebedi ilişkilerde
  aileleri sonsuza kadar birleştirme yetkisini iade eden İlya dahil olmak üzere, başka haberciler de geldi.
- 'Biz ayrıca, Joseph Smith’e “Mormon Kitabı: İsa Mesih Hakkında Başka Bir Tanıklık” olan eski kayıtları
  tercüme etmesi için Tanrı’nın armağanının ve gücünün verildiğine şahitlik ederiz. Bu kutsal metnin sayfaları,
  Diriliş’inden kısa bir süre sonra İsa Mesih’in Batı Yarımküre’deki insanlar arasında verdiği kişisel
  hizmetin bir kaydını içerir. Mormon Kitabı, hayatın amacını öğretir ve bu amacın merkezi olan Mesih’in
  öğretisini açıklar. Mormon Kitabı, Kutsal Kitap’a eşlik eden bir kutsal yazı olarak, tüm insanların
  Cennet’teki sevgi dolu bir Baba’nın oğulları ve kızları olduğuna, O’nun hayatlarımız için ilahi bir
  planı olduğuna ve Oğlu İsa Mesih’in eski günlerde olduğu gibi bugünlerde de konuştuğuna tanıklık eder.'
- Biz, 6 Nisan 1830’da kurulan İsa Mesih’in Son Zaman Azizler Kilisesi’nin, iade edilen “Mesih’in Yeni
  Antlaşma’daki Kilisesi” olduğunu beyan ederiz. Bu Kilise, baş köşe taşı olan İsa Mesih’in kusursuz yaşamına
  ve O’nun sonsuz Kefareti’ne ve gerçek Dirilişi’ne demirlenmiştir. İsa Mesih bir kez daha Havariler’i
  hizmete çağırdı ve onlara rahiplik yetkisi verdi. O hepimizi, O’na ve O’nun Kilisesi’ne gelmeye, Kutsal
  Ruh’u, kurtuluşun kutsal törenlerini almaya ve kalıcı sevince kavuşmaya davet ediyor.
- Bu İade Ediliş, Tanrı Baba ve Sevgili Oğlu İsa Mesih tarafından başlatıldığından beri, bugüne dek iki
  yüz yıl akıp geçti. Dünyanın her yerinde milyonlarca insan, bu peygamberlik edilmiş olan olaylar hakkındaki
  bilgilere kucak açmaktadır.
- Biz vaat edilen İade Ediliş’in, devam eden vahiy yoluyla ilerlediğini sevinçle beyan ederiz. Dünya bir
  daha asla eskisi gibi olmayacak, çünkü Tanrı “her şeyi Mesih’te birleştirecektir” (Efesliler 1:10).
- Saygı ve minnettarlıkla, O’nun Havarileri olarak herkesi, bizim bildiğimiz gibi, göklerin açık olduğunu
  bilmeye davet ediyoruz. Biz, Tanrı’nın sevgili oğulları ve kızları için Kendi isteğini bildirdiğini
  teyit ediyoruz. Biz, İade Ediliş’in mesajını dua ederek inceleyenlerin ve imanla hareket edenlerin,
  bu mesajın ilahiliği hakkında ve dünyayı Rabbimiz ve Kurtarıcımız olan İsa Mesih’in vaat edilen İkinci
  Gelişi’ne hazırlamaya yönelik amacı hakkında kendi tanıklıklarını elde etmek üzere kutsanacaklarına
  tanıklık ederiz.
