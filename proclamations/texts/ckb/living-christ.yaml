title: مەسیحی زیندوو
subtitle: شایەتحاڵی نێردراوان
author: كڵێسای یەسوعی مەسیح بۆ پیرۆزانی ڕۆژانی دواتر
paragraphs:
- لە کاتێکدا یادی لەدایکبوونی یەسوعی مەسیح دوو هەزار ساڵ لەمەوبەر دەکەینەوە، شایەتحاڵی خۆمان پێشکەش دەکەین
  لەسەر واقیعی ژیانی بێهاوتای ئەو و فەزیلەتی بێکۆتایی قوربانییە کەفارەتی گەورەی ئەو. هیچ کەسێکی تر ئەوەندە
  کاریگەرییەکی قووڵی لەسەر هەموو ئەوانەی لەسەر زەوی ژیاون و هێشتا دەژین.
- ئەو یەهۆڤای گەورەی پەیمانی کۆن بوو، مەسیحی نوێ بوو. لە ژێر ڕێنمایی باوکیدا، دروستکەری زەوی بوو. ”هەموو
  شتێک بەو بەدیهاتووە، بێ ئەو هیچ شتێک بەدی نەهاتووە لەوانەی کە بەدیهاتوون“ (یۆحەنا ١‏:٣). هەرچەندە بێ
  گوناه بوو، بەڵام مەعمودی وەرگرت بۆ ئەوەی هەموو ڕاستودروستییەک بەدی بهێنێت. ”دەگەڕا و چاکەی دەکرد“ (کردار
  ١٠‏:٣٨)، بەڵام بەهۆیەوە سووکایەتی پێکرا. ئینجیلەکەی پەیامی ئاشتی و نیازپاکی بوو. داوای لە هەمووان کرد
  کە نموونەی ئەو بکەون. بە ڕێگاکانی فەلەستیندا دەڕۆیشت و نەخۆشەکانی چاک دەکردەوە و نابینایان بینی و مردووەکانی
  زیندوو دەکردەوە. فێری ڕاستییەکانی ئەبەدیەت و واقیعی بوونی پێش مردنمان و ئامانجی ژیانمان لەسەر زەوی و
  پۆتانسێلی کوڕ و کچەکانی خودا لە ژیانی داهاتوودا فێرکرد.
- ئەو نهێنییەکەی وەک بیرهێنانەوەی قوربانییە کەفارەتی گەورەی خۆی دامەزراند. بە تۆمەتی ساختە دەستگیرکرا
  و مەحکوم کرا، بۆ ڕازیکردنی جەماعەتێک سزا درا و سزای مردنی لەسەر خاچی کالڤاری بەسەردا سەپێندرا. ژیانی
  خۆی بەخشی بۆ کەفارەتی گوناهەکانی هەموو مرۆڤایەتی. دیاری ئەو دیارییەکی گەورەی جێگرەوە بوو بەناوی هەموو
  ئەوانەی کە هەرگیز لەسەر زەوی دەژین.
- ئێمە بە ڕێزەوە شایەتحاڵی ئەوە دەدەین کە ژیانی ئەو کە ناوەندی هەموو مێژووی مرۆڤایەتییە، نە لە بەیتولمەقەدەس
  دەستی پێکردووە و نە لە کالڤاری کۆتایی هاتووە. یەکەم لەدایکبووی باوک بوو، تاقانە کوڕی لە جەستەدا، ڕزگارکەری
  جیهان بوو.
- لە گۆڕ هەستا بۆ” بووە نۆبەرەی نوستووان“ (یەکەم کۆرنسۆس ١٥‏:٢٠). وەک پەروەردگاری هەستاوەوە، سەردانی ئەو
  کەسانەی دەکرد کە لە ژیاندا خۆشیان ویستبوو. هەروەها لە نێوان ”مەڕەکانی دیکە“ی خۆیدا (یۆحەنا ١٠‏:١٦) لە
  ئەمریکای کۆن خزمەت دەکات. لە جیهانی مۆدێرن دا، ئەو و باوکی دەرکەوتن بۆ کوڕەکە جۆزێف سمیس، هێنایە ئاراوە
  کە لە مێژە بەڵێندرابوو ”بەجێگەیاندنی لە تەواوی زەمانەدا“ (ئەفەسۆس ١‏:١٠).
- 'سەبارەت بە مەسیحی زیندوو، پێغەمبەر جۆزێف نووسیویەتی: ”چاوەکانی وەک بڵێسەی ئاگر بوون؛ مووی سەری وەک
  بەفری پاک سپی بوو؛ ڕووخساری لە سەرووی ڕووناکی خۆرەوە دەدرەوشایەوە؛ دەنگی وەک دەنگی پەلەقاژەی ئاوە گەورەکان
  بوو، تەنانەت دەنگی یەهۆڤا بوو کە دەیگوت:'
- ”من یەکەم و دواهەمین؛ من ئەو کەسەم کە دەژیم، من ئەو کەسەم کە کوژرام؛ من پارێزەری ئێوەم لەگەڵ باوکد“
  (نەماو پەیماننامەکان ١١٠‏:٣–٤).
- 'هەروەها پێغەمبەر لەبارەی ئەوەوە ڕایگەیاند: ”ئێستاش دوای ئەو شایەتحاڵە زۆرانەی کە لەسەری دراوە، ئەمە
  شایەتحاڵییە، دواهەمین، کە ئێمە لەبارەیەوە دەیدەین: کە ئەو دەژی!'
- ”چونکە ئێمە لە دەستی ڕاستی خودا بینیمان. و گوێمان لەو دەنگە بوو کە شایەتحاڵی ئەوە بوو کە ئەو تاقانە
  لەدایکبووی باوکە —
- کە بەهۆی ئەوەوە و لە ڕێگەی ئەوەوە و لە ڕێگەی ئەوەوە، جیهانەکان دروستکراون و دروستکراون، دانیشتوانیشیان
  کوڕ و کچێکی لەدایکبوون بۆ خودا“ (نەماو پەیماننامەکان ٧٦‏:٢٢–٢٤).
- ئێمە بە وشەی ڕێزلێنان ڕایدەگەیەنین کە کاهینایەتییەکەی و کەنیسەکەی لەسەر زەوی نۆژەن کراوەتەوە — ”لەسەر
  بناغەی نێردراوان و پێغەمبەران بنیاد نراون، یەسوعی مەسیحیش خۆی گرنگترین بەردی بناغەیە“ (ئەفەسۆس ٢‏:٢٠).
- ئێمە شایەتحاڵی ئەوە دەدەین کە ڕۆژێک دێت دەگەڕێتەوە سەر زەوی. ”شکۆمەندی یەزدان دەردەکەوێت و هەموو مرۆڤایەتی
  پێکەوە دەیبینن“ (ئیشایا ٤٠‏:٥). وەک پاشای پاشاکان حوکمڕانی دەکات و وەک پەروەردگاری پەروەردگارەکان حوکمڕانی
  دەکات و هەموو ئەژنۆیەک دەچەمێتەوە و هەموو زمانێک لەبەردەمیدا بە پەرستن قسە دەکات. هەریەکێک لە ئێمە بەپێی
  کارەکانمان و ئارەزووی دڵمان لەلایەن ئەوەوە دادگایی بکرێین.
- ئێمە شایەتحاڵی دەدەین، وەک نێردراوانەکانی کە بەپێی پێویست دەستنیشانکراون — کە یەسوع مەسیحی زیندووە،
  کوڕی نەمری خودایە. ئەو پاشای گەورەیە ئیمانوێل، کە ئەمڕۆ لە دەستی ڕاستی باوکی وەستاوە. ئەو ڕووناکی و
  ژیان و هیوای دونیایە. ڕێگای ئەو ڕێگایە کە لەم ژیانەدا بەرەو بەختەوەری و ژیانی هەتاهەتایی لە جیهانی داهاتوودا
  دەبات. خودا سوپاسی بەخششی بێ هاوتای کوڕە ئیلاهییەکەی بکات.
