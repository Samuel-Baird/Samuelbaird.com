title: Žijúci Kristus
subtitle: Svedectvo apoštolov
author: Cirkev Ježiša Krista Svätých neskorších dní
paragraphs:
- Keď si pripomíname narodenie Ježiša Krista pred dvoma tisícročiami, predkladáme naše svedectvo o skutočnosti
  Jeho jedinečného života a nekonečnej moci Jeho veľkej zmiernej obete. Nikto iný nemal taký hlboký vplyv
  na všetkých, čo žili a ešte budú žiť na zemi.
- Bol veľkým Jehovom Starého zákona a Mesiášom Nového. Pod vedením Svojho Otca bol Stvoriteľom zeme. „Ním
  povstalo všetko a bez Neho nepovstalo nič, čo povstalo“ (Ján 1:3). Aj keď bol bez hriechov, bol pokrstený,
  aby naplnil všetku spravodlivosť. „Chodil, dobre činil“ (Skutky 10:38), a ešte Ním za to opovrhovali.
  Jeho evanjelium bolo posolstvom pokoja a dobrej vôle. Naliehavo všetkých prosil, aby nasledovali Jeho
  príklad. Kráčal po cestách Palestíny, uzdravoval chorých, dal, aby slepí videli a kriesil mŕtvych. Učil
  o pravdách večnosti, skutočnosti našej predpozemskej existencie, o účele nášho života na zemi a potenciáli
  pre synov a dcéry Božie v živote, ktorý príde.
- Ustanovil sviatosť ako pripomienku Svojej veľkej zmiernej obete. Bol uväznený a odsúdený na základe
  falošných obvinení, uznaný vinným, aby bol uspokojený dav a odsúdený na smrť na kríži Kalvárie. Dal
  Svoj život, aby uzmieril hriechy celého ľudstva. Bol veľkým zástupným darom za všetkých, ktorí kedy
  žili na zemi.
- S vážnosťou svedčíme, že Jeho život, ktorý je stredobodom celej ľudskej histórie, nezačal v Betleheme,
  ani neskončil na Kalvárii. On bol Prvorodený Otca, Jednorodený Syn v tele, Vykupiteľ sveta.
- Vstal z hrobu, aby sa stal „prvotin[ou] z umretých“ (1. Korintským 15:20). Ako vzkriesený Pán navštívil
  tých, ktorých miloval počas Svojho života. Slúžil tiež medzi Svojimi inými ovcami (pozri Ján 10:16)
  v starovekej Amerike. V súčasnom svete sa Kristus a Jeho Otec zjavili chlapcovi Josephovi Smithovi,
  aby uviedli dlho zasľúbenú dispenzáciu „plnosti časov“ (Efezským 1:10).
- 'O žijúcom Kristovi prorok Joseph napísal: „Oči jeho boli ako plameň ohňa; vlasy na hlave jeho boli
  biele ako čistý sneh; tvár jeho žiarila nad jas slnka; a hlas jeho bol ako zvuk valiacich sa veľkých
  vôd, dokonca hlas Jehovov, hovoriaci:'
- Ja som prvý a posledný; som ten, kto žije, som ten, kto bol zabitý; som obhajcom vaším u Otca“ (Náuka
  a zmluvy 110:3–4).
- 'Prorok o Ňom tiež prehlásil: „A teraz, po mnohých svedectvách, ktoré o ňom boli vydané, toto je svedectvo
  posledné zo všetkých, ktoré o ňom vydávame: Že on žije!'
- Lebo sme ho videli, dokonca na pravici Božej; a počuli sme hlas vydávajúci svedectvo, že je Jednorodený
  Otcov –
- Že ním a skrze neho, a od neho svety sú a boli stvorené a ich obyvatelia sú synmi a dcérami Bohu splodenými“
  (Náuka a zmluvy 76:22–24).
- S vážnosťou v slovách vyhlasujeme, že Jeho kňazstvo a Jeho Cirkev boli znovuzriadené na zemi – „vybudovan[é]
  na základe apoštolov a prorokov, pričom uholným kameňom je sám Ježiš Kristus“ (Efezským 2:20).
- Svedčíme, že On sa jedného dňa vráti na zem. „Lebo zjaví sa sláva Hospodinova a každý to naraz uvidí“
  (Izaiáš 40:5). Bude kraľovať ako Kráľ kráľov a vládnuť ako Pán pánov, a každé koleno pokľakne, a každý
  jazyk bude velebiť a uctievať pred Ním. Každý z nás bude pred Ním stáť, aby sme Ním boli súdení podľa
  našich skutkov a túžob nášho srdca.
- Vydávame svedectvo, ako Jeho riadne vysvätení apoštolovia, že Ježiš je žijúci Kristus, nesmrteľný Syn
  Boží. Je veľkým kráľom Immanuelom, ktorý dnes stojí po pravici Svojho Otca. Je svetlom, životom a nádejou
  pre svet. Jeho cesta je smerom, ktorý vedie k šťastiu v tomto živote a životu večnému vo svete, ktorý
  príde. Bohu vďaka za jedinečný dar Jeho božského Syna.
