title: Le Christ Vivant
subtitle: Le témoignage des apôtres
author: L’Église de Jésus-Christ des Saints des Derniers Jours
paragraphs:
- Au moment où nous célébrons le deux millième anniversaire de la naissance de Jésus-Christ, nous témoignons
  de la réalité de sa vie sans pareille et du pouvoir infini de son grand sacrifice expiatoire. Personne
  d’autre n’a eu une influence aussi grande que lui sur tous les gens qui ont vécu ou qui vivront un jour
  sur la terre.
- Il était le grand Jéhovah de l’Ancien Testament, le Messie du Nouveau Testament. Sous la direction de
  son Père, il a créé la terre. « Toutes choses ont été faites par [lui], et rien de ce qui a été fait
  n’a été fait sans [lui] » (Jean 1:3). Bien que sans péché, il s’est fait baptiser pour accomplir toute
  justice. Il « allait de lieu en lieu faisant du bien » (Actes 10:38), mais il était méprisé pour cela.
  Son Évangile était un message de paix et de bonne volonté. Il a demandé instamment à tous de suivre
  son exemple. Il a parcouru les routes de Palestine, guérissant les malades, rendant la vue aux aveugles
  et ressuscitant les morts. Il a enseigné les vérités de l’éternité, la réalité de notre existence prémortelle,
  le but de notre vie sur la terre et le potentiel des fils et des filles de Dieu dans la vie à venir.
- Il a institué la Sainte-Cène comme rappel de son grand sacrifice expiatoire. Il a été arrêté et jugé
  sur de fausses accusations, déclaré coupable pour satisfaire la foule et condamné à mourir sur la croix
  du Calvaire. Il a fait don de sa vie pour expier les péchés de tout le genre humain. C’était là un don
  inestimable fait par procuration pour tous les gens qui vivraient sur la terre.
- Nous témoignons solennellement que sa vie, qui est l’élément essentiel de toute l’histoire humaine,
  n’a pas commencé à Bethléhem et ne s’est pas achevée au Calvaire. Il était le Premier-né du Père, le
  Fils unique dans la chair, le Rédempteur du monde.
- Il s’est levé du tombeau pour être « les prémices de ceux qui sont morts » (1 Corinthiens 15:20). En
  qualité de Seigneur ressuscité, il a rendu visite aux gens qu’il aimait lorsqu’il vivait sur la terre.
  Il a aussi rempli son ministère auprès de ses « autres brebis » (Jean 10:16) dans l’Amérique ancienne.
  Dans les temps modernes, son Père et lui sont apparus au jeune Joseph Smith, ouvrant la dispensation
  de la plénitude des temps depuis longtemps promise.
- 'Le prophète Joseph a écrit à propos du Christ vivant : « Ses yeux étaient comme une flamme de feu,
  ses cheveux étaient blancs comme la neige immaculée, son visage était plus brillant que l’éclat du soleil
  et sa voix était comme le bruit du déferlement de grandes eaux, oui, la voix de Jéhovah, disant :'
- « Je suis le premier et le dernier ; je suis celui qui vit, je suis celui qui fut immolé ; je suis votre
  avocat auprès du Père » (D&A 110:3-4).
- 'Le prophète a aussi déclaré à son sujet : « Et maintenant, après les nombreux témoignages qui ont été
  rendus de lui, voici le témoignage, le dernier de tous, que nous rendons de lui : qu’il vit !'
- « Car nous le vîmes, et ce, à la droite de Dieu ; et nous entendîmes la voix rendre témoignage qu’il
  est le Fils unique du Père ;
- « que par lui, à travers lui et en lui, les mondes sont et furent créés, et que les habitants en sont
  des fils et des filles engendrés pour Dieu » (D&A 76:22-24).
- Nous déclarons solennellement que sa prêtrise et son Église ont été rétablies sur la terre et que son
  Église est édifiée « sur le fondement des apôtres et des prophètes, Jésus-Christ lui-même étant la pierre
  angulaire » (Éphésiens 2:20).
- Nous témoignons qu’il reviendra un jour sur la terre. « Alors la gloire de l’Éternel sera révélée, et
  au même instant toute chair la verra » (Ésaïe 40:5). Il gouvernera en Roi des rois et régnera en Seigneur
  des seigneurs, et tout genou fléchira et toute langue confessera qu’il est le Christ. Nous comparaîtrons
  tous pour être jugés par lui selon nos œuvres et les désirs de notre cœur.
- Nous, ses apôtres dûment ordonnés, nous témoignons que Jésus est le Christ vivant, le Fils immortel
  de Dieu. Il est le grand roi Emmanuel qui se tient aujourd’hui à la droite de son Père. Il est la lumière,
  la vie et l’espoir du monde. Ses voies mènent au bonheur dans cette vie et à la vie éternelle dans le
  monde à venir. Dieu soit loué pour le don sans pareil de son Fils divin !
