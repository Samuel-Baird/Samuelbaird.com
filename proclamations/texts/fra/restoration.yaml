retrieved: '2026-11-02'
title: Le rétablissement de la plénitude de l’Évangile de Jésus-Christ
subtitle: Déclaration au monde du bicentenaire
author: La Première Présidence et le Conseil des douze apôtres de l’Église de Jésus-Christ des Saints
  des Derniers Jours
note: Cette déclaration a été lue par Russell M. Nelson, président de l’Église, au cours de son discours
  prononcé lors de la 190e conférence générale, le 5 avril 2020, à Salt Lake City (Utah, États-Unis).
paragraphs:
- Nous déclarons solennellement que Dieu aime ses enfants dans chaque nation du monde. Dieu le Père nous
  a fait don de la naissance divine, de la vie incomparable et du sacrifice expiatoire infini de son Fils
  bien-aimé, Jésus-Christ. Par le pouvoir du Père, Jésus est ressuscité et a remporté la victoire sur
  la mort. Il est notre Sauveur, notre Modèle et notre Rédempteur.
- Il y a deux cents ans, par un beau matin du printemps 1820, le jeune Joseph Smith, cherchant à quelle
  Église se joindre, est allé prier dans les bois près de chez lui, dans le nord de l’État de New York,
  aux États-Unis. Il s’interrogeait sur le salut de son âme et était confiant que Dieu lui montrerait
  la direction à suivre.
- En toute humilité, nous déclarons qu’en réponse à sa prière, Dieu le Père et son Fils, Jésus-Christ,
  sont apparus à Joseph et ont inauguré le « rétablissement de toutes choses » (Actes 3:21), comme prédit
  dans la Bible. Dans cette vision, il a appris qu’après la mort des apôtres originels, l’Église du Christ
  de l’époque du Nouveau Testament était introuvable sur la terre. Joseph jouerait un rôle primordial
  pour qu’elle y soit de nouveau.
- Nous affirmons que sous la direction du Père et du Fils, des messagers divins sont venus instruire Joseph
  et rétablir l’Église de Jésus-Christ. Jean-Baptiste, ressuscité, a rétabli l’autorité de baptiser par
  immersion pour la rémission des péchés. Trois des douze apôtres originels, Pierre, Jacques et Jean,
  ont rétabli l’apostolat et les clés de l’autorité de la prêtrise. D’autres sont également venus, notamment
  Élie, qui a rétabli l’autorité d’unir les familles à jamais dans des relations éternelles transcendant
  la mort.
- 'Nous témoignons encore que Joseph Smith a reçu le don et le pouvoir de Dieu pour traduire des annales
  anciennes : le Livre de Mormon, un autre témoignage de Jésus-Christ. Les pages de ce texte sacré comportent
  un récit du ministère personnel de Jésus-Christ auprès d’un peuple de l’hémisphère occidental peu après
  sa résurrection. Il enseigne le but de la vie et explique la doctrine du Christ, dont elle est l’élément
  central. En tant que livre d’Écritures qui va de pair avec la Bible, le Livre de Mormon atteste que
  tous les êtres humains sont fils et filles d’un Père céleste aimant, qu’il a un plan divin pour nous,
  et que son Fils, Jésus-Christ, parle aujourd’hui tout comme il le faisait dans les temps anciens.'
- Nous déclarons que l’Église de Jésus-Christ des Saints des Derniers Jours, organisée le 6 avril 1830,
  est l’Église du Christ de l’époque du Nouveau Testament, maintenant rétablie. Cette Église est ancrée
  dans la vie parfaite de sa pierre angulaire principale, Jésus-Christ, et dans l’expiation infinie et
  la résurrection littérale de celui-ci. Jésus-Christ a de nouveau appelé des apôtres et leur a conféré
  l’autorité de la prêtrise. Il nous invite tous à venir à lui et à son Église afin de recevoir le Saint-Esprit
  et les ordonnances du salut et d’acquérir la joie durable.
- Deux cents ans ont maintenant passé depuis que ce Rétablissement a commencé sous la direction de Dieu
  le Père et son Fils bien-aimé, Jésus-Christ. Des millions de gens dans le monde ont embrassé la vérité
  grâce à la connaissance de ces événements qui avaient été prophétisés.
- Nous déclarons avec joie que le Rétablissement promis va de l’avant grâce à la révélation continue.
  Cette terre ne sera plus jamais la même à mesure que Dieu va « réunir toutes choses en Christ » (Éphésiens
  1:10).
- Avec révérence et gratitude, nous, ses apôtres, invitons chacun à savoir, comme nous le savons, que
  les cieux sont ouverts. Nous affirmons que Dieu fait connaître sa volonté à l’égard de ses fils et filles
  bien-aimés. Nous témoignons que les personnes qui étudient le message du Rétablissement à l’aide de
  la prière et agissent avec foi auront la bénédiction d’acquérir leur propre témoignage de sa divinité
  et de son but de préparer le monde pour la seconde venue promise de notre Seigneur et Sauveur, Jésus-Christ.
