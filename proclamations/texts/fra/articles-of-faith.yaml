title: Articles de foi
subtitle: de l’Église de Jésus-Christ des Saints des Derniers Jours
author: ''
verses:
- n: 1
  text: Nous croyons en Dieu, le Père éternel, et en son Fils, Jésus-Christ, et au Saint-Esprit.
- n: 2
  text: Nous croyons que les hommes seront punis pour leurs propres péchés, et non pour la transgression
    d’Adam.
- n: 3
  text: Nous croyons que, grâce au sacrifice expiatoire du Christ, tout le genre humain peut être sauvé
    en obéissant aux lois et aux ordonnances de l’Évangile.
- n: 4
  text: 'Nous croyons que les premiers principes et ordonnances de l’Évangile sont : premièrement la foi
    au Seigneur Jésus-Christ, deuxièmement le repentir, troisièmement le baptême par immersion pour la
    rémission des péchés, quatrièmement l’imposition des mains pour le don du Saint-Esprit.'
- n: 5
  text: Nous croyons que l’on doit être appelé de Dieu par prophétie, et par l’imposition des mains de
    ceux qui détiennent l’autorité, pour prêcher l’Évangile et en administrer les ordonnances.
- n: 6
  text: 'Nous croyons à la même organisation que celle qui existait dans l’Église primitive, savoir :
    apôtres, prophètes, pasteurs, docteurs, évangélistes, etc.'
- n: 7
  text: Nous croyons au don des langues, de prophétie, de révélation, de vision, de guérison, d’interprétation
    des langues, etc.
- n: 8
  text: Nous croyons que la Bible est la parole de Dieu dans la mesure où elle est traduite correctement
    ; nous croyons aussi que le Livre de Mormon est la parole de Dieu.
- n: 9
  text: Nous croyons tout ce que Dieu a révélé, tout ce qu’il révèle maintenant, et nous croyons qu’il
    révélera encore beaucoup de choses grandes et importantes concernant le royaume de Dieu.
- n: 10
  text: Nous croyons au rassemblement littéral d’Israël et au rétablissement des dix tribus. Nous croyons
    que Sion (la nouvelle Jérusalem) sera bâtie sur le continent américain, que le Christ régnera en personne
    sur la terre, que la terre sera renouvelée et recevra sa gloire paradisiaque.
- n: 11
  text: 'Nous affirmons avoir le droit d’adorer le Dieu Tout-Puissant selon les inspirations de notre
    conscience et reconnaissons le même droit à tous les hommes : qu’ils adorent comme ils veulent, où
    ils veulent ou ce qu’ils veulent.'
- n: 12
  text: Nous croyons que nous devons nous soumettre aux rois, aux présidents, aux gouverneurs et aux magistrats,
    et que nous devons respecter, honorer et défendre la loi.
- n: 13
  text: 'Nous croyons que nous devons être honnêtes, fidèles, chastes, bienveillants et vertueux, et que
    nous devons faire du bien à tous les hommes ; en fait, nous pouvons dire que nous suivons l’exhortation
    de Paul : nous croyons tout, nous espérons tout, nous avons supporté beaucoup et nous espérons être
    capables de supporter tout. Nous recherchons tout ce qui est vertueux ou aimable, tout ce qui mérite
    l’approbation ou est digne de louange.'
signature: Joseph Smith.
