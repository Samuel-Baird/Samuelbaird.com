title: የኢየሱስ ክርስቶስ ወንጌል ሙላት ዳግም መመለስ
subtitle: ለሁለት መቶኛ አመት መታሰቢያ የሚሆን ለአለም የተላለፈ አዋጅ
author: የኋለኛው ቀን ቅዱሳን የኢየሱስ ክርስቶስ ቤተክርስትያን ቀዳሚ አመራር እና የአስራ ሁለቱ ሐዋሪያት ቡድን
note: ይህ አዋጅ በሶልት ሌክ ስቲ፣ ዩታ ውስጥ በሚያዝያ 5፣ 2020 (እ.አ.አ) በተካሄደው 190ኛው አመታዊ አጠቃላይ ጉባኤ ላይ በፕሬዚዳንት ራስል ኤም. ኔልሰን
  እንደ መልእክታቸው ክፍል የተነበበ ነበር።
paragraphs:
- እግዚአብሔር በሁሉም አገሮች የሚኖሩትን ልጆቹን እንደሚወድ በክብር እናውጃለን። እግዚአብሔር አብም የውድ ልጁን፣ የኢየሱስ ክርስቶስን፣ መለኮታዊ ውልደት፣ የማይነጻጸር
  ህይወት፣ እና ፍጻሜ የሌለው የኃጢያት ክፍያ መስዋዕትን ሰጥቶናል። በአብ ሀይል፣ ኢየሱስ ከሞት እንደገና ተነሳ እናም በሞት ላይ ድልን አገኘ። እርሱ አዳኛችን፣
  ምሳሌአችን፣ እና ቤዛችን ነው።
- ከሁለት መቶ አመታት በፊት፣ በ1820 (እ.አ.አ) በውብ የጸደይ ጠዋት፣ ወጣቱ ጆሴፍ ስሚዝ የየትኛው ቤተክርስቲያን አባል መሆን እንደሚገባው ለማወቅ በመፈለግ፣
  በኒው ዮርክ፣ ዩ.ኤስ.ኤ. ውስጥ በቤቱ አጠገብ ወደነበረው ጫካ ለመጸለይ ገባ። ስለ ነፍሱ ደህንነት በሚመለከት ጥያቄ ነበረው እናም እግዚአብሔር እንደሚመራው አምኖ
  ነበር።
- ለጸሎቱ መልስ እግዚአብሔር አብ እና ልጁ፣ ኢየሱስ ክርስቶስ፣ ለጆሴፍ እንደተገለጡ እና በመጽሐፍ ቅዱስ ውስጥ እንደተተነበየው “[የነገሮች] ሁሉ [መታደስ]” (የሐዋሪያት
  ስራ 3፥21) እንደተጀመሩ በትህትና እናውጃለን። በዚህ ራዕይም፣ የመጀመሪያዎቹ ሐዋሪያትን ሞት ተከትሎ የክርስቶስ የአዲስ ኪዳን ቤተክርስቲያን ከምድር እንደጠፋች
  ተማረ። ጆሴፍ በእርስዋ መመለስ መሳሪያ ይሆናል።
- በአብ እና በኢየሱስ ክርስቶስ አመራር፣ የሰማይ መልእክተኞች ጆሴፍን ለማስተማር እና የኢየሱስ ክርስቶስ ቤተክርስቲያንን እንደገና ለማቋቋም እንደመጡም እናረጋግጣለን።
  በትንሳኤ የተነሳው መጥምቁ ዮሀንስ ለኃጢያት ስርየት በመጥለቅ የማጥመቅን ስልጣን ዳግም መለሰ። ከመጀመሪያዎቹ አስራ ሁለት ሐዋሪያት ሶስቱ—ጴጥሮስ፣ ያዕቆብ፣ እና
  ዮሀንስ—የሐዋሪያነትን እና የክህነት ስልጣን ቁልፎችን ዳግም መለሱ። ኤልያስንም ጨምሮ፣ ሞትን በማሸነፍ ቤተሰቦችን በዘለአለማዊ ግንኙነት ለዘለአለም የማጣመር ስልጣንን
  ዳግም የመለሱት ሌሎችም መጡ።
- በተጨማሪም፣ ጆሴፍ ስሚዝ የጥንት መዝገቦች የሆነውን መፅሐፈ ሞርሞን—ሌላኛው የኢየሱስ ክርስቶስ ምስክርነት—ለመተርጎም የእግዚአብሔር ስጦታ እና ሀይል እንደተሰጠውም
  እንመሰክራለን። የዚህ ቅዱስ ፅሁፍ ገጾችም ኢየሱስ ክርስቶስ በምዕራብ ክፍለ አለም ውስጥ የኖሩትን ሰዎች ከትንሳኤው በኋላ በግል ያገለገለበትን ታሪክ ያካትታሉ።
  ይህም ስለህይወት አላማ ያስተምራል እንዲሁም የዚህ አላማ ማእከላዊ የሆነውን የክርስቶስን ትምህርት ያስተምራል። እንደ መፅሐፍ ቅዱስ ተጓዳኝ ፅሁፍም፣ መፅሐፈ ሞርሞን
  የሰው ዘር በሙሉ የአፍቃሪ የሰማይ አባት ወንድ እና ሴት ልጆች እንደሆኑ፣ እርሱ ለህይወታችን መለኮታዊ እቅድ እንዳለው፣ እና ልጁ ኢየሱስ ክርስቶስ ዛሬም ልክ
  እንደ ጥንት ቀናት እንደሚናገር ይመሰክራል።
- በሚያዝያ 6፣ 1830 (እ.አ.አ) የተደራጀችው የኋለኛው ቀን ቅዱሳን የኢየሱስ ክርስቶስ ቤተክርስቲያን የክርስቶስ ዳግም የተመለሰችው የአዲስ ኪዳን ቤተክርስቲያን
  እንደሆነችም እናውጃለን። ይህችም ቤተክርስቲያን የማዕዘን ራስ ድንጋይ በሆነው በኢየሱስ ክርስቶስ ፍጹም ህይወት እና ፍጻሜ በሌለው የኃጢያት ክፍያውና በእውን ትንሳኤው
  ላይ የተተከለች ናት። ኢየሱስ ክርስቶስ እንደገና ሐዋሪያትን ጠርቷል እንዲሁም ለእነርሱም የክህነት ስልጣንን ሰጥቷቸዋል። እርሱም መንፈስ ቅዱስንና የደህንነት ስርዓቶችን
  ለመቀበል፣ እና የሚጸና ደስታን ለማግኘት እንችል ዘንድ ወደ እርሱ እና ወደ ቤተክርስቲያኑ እንድንመጣ ሁላችንንም ይጋብዛል።
- ይህ ዳግም መመለስ በእግዚአብሔር አብ እና በውድ ልጁ፣ ኢየሱስ ክርስቶስ፣ ከተጀመረ ሁለት መቶ አመታት አልፈዋል። እነዚህ የተተነበዩባቸው ድርጊቶች እውቀትም በአለም
  ዙሪያ የሚገኙ ብዙ ሚልዮን ሰዎች ተቀብለዋቸዋል።
- ቃል የተገባው ዳግም መመለስም በሚቀጥል ራዕይ በኩል ወደፊት እንደሚሄድ በደስታ እናውጃለን። እግዚአብሔር “ያለውን ሁሉ በክርስቶስ [ስለሚጠቀልል]” (ኤፌሶን 1፥10)፣
  ምድርም ቀድሞ እንደነበረችው አትሆንም።
- እኛ እንደምናውቀው፣ ሰማያት ክፍት እንደሆኑ ያውቁ ዘንድ፣ እኛ የእርሱ ሐዋርያት ሁሉንም በአምልኮ እና በምስጋና እንጋብዛለን። እግዚአብሔር ፍላጎቱን ለውድ ወንድ
  እና ሴት ልጆቹ እያሳወቀ እንደሆነ እናረጋግጣለን። የዳግም መመለስ መልዕክትን በጸሎት የሚያጠኑ እና በእምነት የሚተገብሩ ሰዎች ስለዚያ መለኮታዊነት እና ተስፋ
  ለተገባለት ለጌታችን እና ለአዳኛችን ለኢየሱስ ክርስቶስ ዳግም ምፅዓት አለምን ለማዘጋጀት ስላለው እቅድ የራሳቸውን ምስክርነት በማግኘት እንደሚባረኩ እንመሰክራለን።
