title: ህያው ክርስቶስ
subtitle: የሐዋርያት ምስክርነት
author: የኋለኛው ቀን ቅዱሳን የኢየሱስ ክርስቶስ ቤተክርስቲያን
paragraphs:
- ኢየሱስ ክርስቶስ ከሁለት ሺህ አመታት በፊት የተወለደበትን ስናከብር፣ አቻ ስለሌለው ሕይወቱ እውንነት እና ስለእርሱ ታላቅ የኃጢያት ክፍያ መስዋዕት ወሰን የለሽ
  በጎነት እንመሰክራለን። በምድር ላይ በኖሩት እና ገና በሚኖሩት ላይ እንዲህ ያለ ከፍተኛ ተጽዕኖ ያሳደረ ማንም የለም።
- እርሱም የብሉይ ኪዳን ታላቁ ያህዌህ እና የአዲስ ኪዳን መሲህ ነበር። በአባቱ ትዕዛዝ መሠረት ምድርን የፈጠረው እርሱ ነበር። “ሁሉ በእርሱ ሆነ ከሆነውም አንዳች
  ስንኳ ያለ እርሱ አልሆነም” (ዮሐንስ 1፥3)። ምንም እንኳን ኃጢያት የሌለበት ቢሆንም፣ ጽድቅን ሁሉ ይፈጽም ዘንድ ተጠመቀ። “መልካም እያደረገ … ዞረ” (የሐዋርያት
  ስራ 10፥38)፣ ይሁን እንጂ በዚህም ተነቀፈ። ወንጌሉ የሠላም እና የበጎ ፈቃድ መልእክት ነበር። ሁሉም ምሳሌውን ይከተሉ ዘንድ ተማነጸ። በሽተኞችን እየፈወሰ፣
  ለእውሮች ብርሀንን እየሰጠ፣ እና ሙታንን እያስነሳ በፍልስጤም መንገዶች ተመላለሰ። የዘለአለም እውነቶችን፣ በቅድመ ምድር የመኖራችንን እውነታ፣ የምድራዊ ህይወታችንን
  ዓላማ፣ እንዲሁም የእግዚአብሔር ወንዶች እና ሴቶች ልጆች በሚመጣው ህይወት ሊኖራቸው ስለሚችለው አቅም አስተምሯል።
- ለታላቅ የኃጢያት ክፍያ መሥዋዕቱ ማስታወሻ ይሆን ዘንድ ቅዱስ ቁርባንን መሰረተ። እርሱም በሀሰት ክሶች ተይዞና ተወግዞ፣ ህገወጥ ሰዎች ደስ ይሰኙ ዘንድ ተፈርዶበት
  እና በቀራንዮ በመስቀል ላይ ይሞት ዘንድ ተፈርዶበት ነበር። ለሰው ዘር ሁሉ ኃጢያት ቤዛ ይሆን ዘንድ ህይወቱን ሰጠ። በምድር ላይ ለኖሩት እና ለሚኖሩት ሁሉ የተሰጠ
  የውክልና ስጦታ ነበር።
- ለሰው ልጆች ሁሉ ታሪክ ማዕከል የሆነው ህይወቱ በቤተልሔም እንዳልተጀመረ እና በቀራንዮ እንዳላበቃ በክብር እንመሰክራለን። እርሱ የአብ የበኩር ልጅ፣ በስጋ የተገለጠ
  አንድያ ልጅ፣ የአለም አዳኝ ነበር።
- “ላንቀላፉት በኩራት ሆኖ” ከመቃብር ተነስቷል (1 ቆሮንቶስ 15፥20)። ከሞት እንደተነሳም ጌታ፣ በህይወት ዘመኑ የወደዳቸውን ጎበኘ። ደግሞም በጥንታዊ አሜሪካ
  ውስጥ ይኖሩ በነበሩት በእርሱ “ሌሎች በጎች” መሐል (ዮሐንስ 10፥16) አገለገለ። በዘመናዊው አለምም፣ እርሱ እና አባቱ ለረጅም ጊዜ ተስፋ የተደረገበትን “የዘመናት
  ፍጻሜን” (ኤፌሶን 1፥10) በማስተዋወቅ ለብላቴናው ጆሴፍ ስሚዝ ተገለጡ።
- ህያው ክርስቶስን በተመለከተ ነቢዩ ጆሴፍ ስሚዝ እንዲህ ሲል ጽፏል፦ “ዓይኖቹም እንደ እሳት ነበልባል ነበሩ፤ የራሱ ጠጕርም እንደ ንጹህ በረዶም ነጭ ነበሩ፤ ፊቱም
  ከብርቱ የጸሀይ ብርሀን በላይ የሚያበራ ነበር፤ ድምፁም እንዲህ የሚል እንደ ብዙ ውኃዎች ድምፅ፣ እንዲሁም የያህዌህ ድምፅ ነበር፦
- “እኔ ፊተኛውና ኋለኛው ነኝ፤ እኔ ህያውም ነኝ፣ የተገደልኩትም እኔ ነኝ፤ እኔም በአብ ዘንድ አማላጃችሁ ነኝ” (ት. እና ቃ. 110፥3–4)።
- በተጨማሪም ነቢዩ ስለእርሱም እንዲህ አውጇል፦ “እናም አሁን፣ ስለ እርሱ ከተሰጡት ብዙ ምስክሮች በኋላ፣ ይህም በመጨረሻ ስለ እርሱ የምንሰጠው ምስክርነት፦ እርሱ
  ህያው መሆኑን ነው!
- “በእግዚአብሔር ቀኝ አይተነዋልና፤ እናም እርሱ የአብ አንድያ ልጅ እንደሆነም ሲመሰክርም ድምፅ ሰምተናል—
- “አለማትም በእርሱ፣ እናም በእርሱም አማካይነት፣ እናም ከእርሱም ዘንድ ናቸው እናም ተፈጥረዋል፣ እናም ነዋሪዎችዋም የእግዚአብሔር ወንዶችና ሴቶች ልጆች ናቸው”
  (ት. እና ቃ. 76፥22–24)።
- እኛም የእርሱ ክህነት እና ቤተክርስቲያኑ “በሐዋርያት እና በነቢያት መሠረት … [ታንጸው]፣ የማዕዘኑም ራስ ድንጋይ ክርስቶስ ኢየሱስ [ሆኖ]” (ኤፌሶን 2፥20)
  በምድር ላይ በዳግም እንደተመለሱ በክብር እናውጃለን።
- አንድ ቀን ወደ ምድር እንደሚመለስም እንመሠክራለን። “የእግዚአብሔር ክብር ይገለጣል፣ ሥጋ ለባሹም ሁሉ በአንድነት ያየዋል” (ኢሳይያስ 40፥5)። እንደ ነገስታት
  ንጉስ ይገዛል እናም እንደ ጌቶች ጌታ ይነግሳል፣ ጉልበትም ሁሉ ይንበረከካል ምላስም ሁሉ በእርሱ ፊት በአምልኮ ይናገራል። እያንዳንዳችንም እንደ ሥራችን እና እንደ
  ልባችን መሻት በእርሱ ይፈረድብን ዘንድ እንቆማለን።
- በእርሱ በትክክል እንደተሾምን ሐዋርያት፣ ኢየሱስ ህያው ክርስቶስ፣ የእግዚአብሔር የማይሞት ልጅ እንደሆነ እንመሰክራለን። እርሱም ዛሬ በአባቱ ቀኝ የሚገኘው ታላቅ
  ንጉስ አማኑኤል ነው። እርሱም የዓለም ብርሃን፣ ህይወት እና ተስፋ ነው። የእርሱም መንገድ በዚህ ዓለም ወደ ደስታ እና በሚመጣው አለም ወደ ዘለዓለማዊ ህይወት
  የሚመራ ነው። ወደር የለሽ ለሆነ መለኮታዊ ልጁ ስጦታ እግዚአብሔር ይመስገን።
date: ጥር 1 ቀን 2000 (እ.አ.አ)
