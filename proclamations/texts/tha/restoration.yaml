title: การฟื้นฟูความสมบูรณ์แห่งพระกิตติคุณของพระเยซูคริสต์
subtitle: ถ้อยแถลงต่อโลกเนื่องในวาระครบรอบสองร้อยปี
author: ฝ่ายประธานสูงสุดและสภาอัครสาวกสิบสองของศาสนจักรของพระเยซูคริสต์แห่งวิสุทธิชนยุคสุดท้าย
note: ประธานรัสเซลล์ เอ็ม. เนลสันอ่านถ้อยแถลงนี้ในข่าวสารของท่านที่การประชุมใหญ่สามัญประจำปีครั้งที่ 190
  เมื่อวันที่ 5 เมษายน ค.ศ. 2020 ในซอลท์เลคซิตี้ ยูทาห์
paragraphs:
- เราประกาศด้วยความเคารพว่าพระผู้เป็นเจ้าทรงรักบุตรธิดาของพระองค์ในทุกประชาชาติของโลก พระผู้เป็นเจ้าพระบิดาได้ประทานการประสูติอันศักดิ์สิทธิ์
  พระชนม์ชีพอันหาที่เปรียบมิได้ และการพลีพระชนม์ชีพเพื่อการชดใช้อันไม่มีขอบเขตของพระเยซูคริสต์พระบุตรที่รักของพระองค์ให้แก่เรา
  โดยเดชานุภาพของพระบิดา พระเยซูทรงฟื้นขึ้นอีกครั้งและทรงมีชัยชนะเหนือความตาย พระองค์ทรงเป็นพระผู้ช่วยให้รอดของเรา
  พระผู้เป็นแบบอย่างของเรา และพระผู้ไถ่ของเรา
- สองร้อยปีก่อน ในเช้าอันสวยงามของฤดูใบไม้ผลิปี 1820 โจเซฟ สมิธหนุ่มแสวงหาเพื่อให้รู้ว่าควรเข้าร่วมกับศาสนจักรใด
  ท่านเข้าไปสวดอ้อนวอนในป่าใกล้บ้านในเขตทางเหนือของรัฐนิวยอร์ก สหรัฐอเมริกา ท่านมีหลายคำถามเกี่ยวกับความรอดของจิตวิญญาณตนเองและวางใจว่าพระผู้เป็นเจ้าจะทรงนำทาง
- เราประกาศด้วยความนอบน้อมว่าในการตอบคำสวดอ้อนวอนของท่าน พระผู้เป็นเจ้าพระบิดาและพระเยซูคริสต์พระบุตรของพระองค์
  ทรงปรากฏต่อโจเซฟและเริ่ม “การฟื้นฟูสรรพสิ่ง” (กิจการของอัครทูต 3:21) อย่างเป็นทางการตามคำทำนายในพระคัมภีร์ไบเบิล
  ในนิมิตนี้ ท่านเรียนรู้ว่าหลังการสิ้นชีวิตของอัครสาวกดั้งเดิม ศาสนจักรสมัยพันธสัญญาใหม่ของพระคริสต์ได้สูญสิ้นไปจากแผ่นดินโลกแล้ว
  โจเซฟจะเป็นเครื่องมือในการกลับมาของศาสนจักรนั้น
- เรายืนยันว่าภายใต้การกำกับดูแลของพระบิดาและพระบุตร บรรดาผู้ส่งสารจากสวรรค์มาให้คำแนะนำแก่โจเซฟและสถาปนาศาสนจักรของพระเยซูคริสต์อีกครั้ง
  ยอห์นผู้ถวายบัพติศมาซึ่งฟื้นคืนชีวิตแล้วมาฟื้นฟูสิทธิอำนาจการให้บัพติศมาโดยลงไปในน้ำทั้งตัวเพื่อการปลดบาป
  อัครสาวกสิบสองดั้งเดิมสามคน—เปโตร ยากอบ และยอห์น—มาฟื้นฟูความเป็นอัครสาวกและกุญแจทั้งหลายของสิทธิอำนาจฐานะปุโรหิต
  และอีกหลายคนก็มาด้วย รวมทั้งเอลียาห์ ผู้ฟื้นฟูสิทธิอำนาจการรวมครอบครัวไว้ด้วยกันตลอดกาลในสัมพันธภาพนิรันดร์เหนือความตาย
- 'นอกจากนี้ เราเป็นพยานว่าโจเซฟ สมิธได้รับของประทานและอำนาจจากพระผู้เป็นเจ้าให้แปลบันทึกโบราณ: พระคัมภีร์มอรมอน—พยานหลักฐานอีกเล่มหนึ่งของพระเยซูคริสต์
  ในหน้าหนังสือศักดิ์สิทธิ์เล่มนี้มีเรื่องราวการปฏิบัติศาสนกิจส่วนพระองค์ของพระเยซูคริสต์ท่ามกลางผู้คนในซีกโลกตะวันตกภายหลังการฟื้นคืนพระชนม์ของพระองค์ได้ไม่นาน
  พระคัมภีร์มอรมอนสอนจุดประสงค์ของชีวิตและอธิบายหลักคำสอนของพระคริสต์อันเป็นศูนย์รวมต่อจุดประสงค์นั้น
  ในฐานะพระคัมภีร์คู่กับพระคัมภีร์ไบเบิล พระคัมภีร์มอรมอนเป็นพยานว่ามนุษย์ทุกคนเป็นบุตรธิดาของพระบิดาในสวรรค์ผู้ทรงเปี่ยมด้วยความรัก
  ว่าพระองค์ทรงมีแผนศักดิ์สิทธิ์สำหรับชีวิตเรา และว่าพระเยซูคริสต์พระบุตรของพระองค์ตรัสวันนี้ดังเช่นในสมัยโบราณ'
- เราประกาศว่าศาสนจักรของพระเยซูคริสต์แห่งวิสุทธิชนยุคสุดท้าย ซึ่งจัดตั้งขึ้นเมื่อวันที่ 6 เมษายน ค.ศ.
  1830 คือศาสนจักรสมัยพันธสัญญาใหม่ของพระคริสต์ที่ฟื้นฟูกลับมา ศาสนจักรนี้ทอดสมอยึดอยู่กับพระชนม์ชีพอันดีพร้อมของศิลามุมเอกซึ่งคือองค์พระเยซูคริสต์
  และการชดใช้อันไม่มีขอบเขตกับการฟื้นคืนพระชนม์ที่เกิดขึ้นจริงของพระองค์ พระเยซูคริสต์ทรงเรียกอัครสาวกอีกครั้งหนึ่งและประทานสิทธิอำนาจฐานะปุโรหิตแก่พวกเขา
  พระองค์ทรงเชื้อเชิญให้เราทุกคนมาหาพระองค์และศาสนจักรของพระองค์เพื่อรับพระวิญญาณบริสุทธิ์ ศาสนพิธีแห่งความรอด
  และได้มาซึ่งปีติอันยั่งยืน
- สองร้อยปีผ่านไปนับตั้งแต่การฟื้นฟูนี้เริ่มขึ้นโดยพระผู้เป็นเจ้าพระบิดาและพระเยซูคริสต์พระบุตรที่รักของพระองค์
  หลายล้านคนทั่วโลกน้อมรับความรู้เกี่ยวกับเหตุการณ์ตามคำพยากรณ์เหล่านี้
- เราขอประกาศด้วยความยินดีว่าการฟื้นฟูที่สัญญาไว้ก้าวไปข้างหน้าผ่านการเปิดเผยต่อเนื่อง แผ่นดินโลกจะไม่มีวันเหมือนเดิมอีกต่อไป
  เพราะพระผู้เป็นเจ้าจะ “ทรงรวบรวมทุกสิ่ง … ให้อยู่ในพระคริสต์” (เอเฟซัส 1:10)
- ด้วยความคารวะและความสำนึกในพระกรุณาธิคุณ เราในฐานะอัครสาวกของพระองค์ขอเชิญชวนทุกคนมารู้—ดังที่เรารู้—ว่าฟ้าสวรรค์เปิด
  เรายืนยันว่าพระผู้เป็นเจ้าทรงเผยพระประสงค์ของพระองค์ให้เป็นที่รู้แก่บุตรธิดาที่รักของพระองค์ เราเป็นพยานว่าผู้ที่ศึกษาข่าวสารเรื่องการฟื้นฟูร่วมกับการสวดอ้อนวอนและปฏิบัติด้วยศรัทธา
  จะได้รับพรให้ได้รับพยานส่วนตัวถึงความศักดิ์สิทธิ์และจุดประสงค์ของการฟื้นฟูเพื่อเตรียมโลกให้พร้อมรับการเสด็จมาครั้งที่สองตามคำสัญญาของพระเจ้าและพระผู้ช่วยให้รอดของเรา
  พระเยซูคริสต์
