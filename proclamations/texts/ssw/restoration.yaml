slug: restoration
language: ssw
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=ssw
retrieved: '2026-11-02'
title: Kubuyiselwa kweLivangeli leliPhelele laJesu Khristu
subtitle: Simemetelo semiNyaka lengemaKhulu lamaBili lesibhekiswe Emhlabeni
author: Bungameli bekuCala neMkhandlu webaPhostoli labaLishumi naKubili beLibandla laJesu Khristu Lalabangcwele
  Betinsuku Tekugcina
note: Lesi simemetelo safundvwa nguMengameli Russell M. Nelson njengencenye yemyaleto wakhe weMhlangano
  Lomkhulu weminyaka yonkhe ya-190, ngaMabasa 5, 2020, eSalt Lake City, eUtah.
paragraphs:
- Siyamemetela ngesizotsa kutsi Nkulunkulu uyabatsandza bantfwana Bakhe kuto tonkhe tive temhlaba. Nkulunkulu
  Babe usinikete kutalwa kwasezulwini, imphilo lengafananiseki nalutfo, nemhlatjelo Wakhe lohlawulako
  longenakuphela weNdvodzana Yakhe letsandzekako, Jesu Khristu. Ngemandla aBabe, Jesu wavuka futsi wancoba
  kufa. UnguMsindzisi wetfu, uSibonelo setfu, neMhlengi wetfu.
- Eminyakeni lengemakhulu lamabili lendlulile, ekuseni lokuhle kwentfwasahlobo yangemnyaka wa-1820, Joseph
  Smith asemncane, afuna kwati kutsi bekangaba lilunga laliphi libandla, waya ehlatsini kuyothandaza dvutane
  nelikubo esifundzeni saseNew York, lesisenyakatfo, eMelika. Bekanemibuto lemayelana nekusindziswa kwemphefumulo
  wakhe futsi beketsemba kutsi Nkulunkulu bekatomcondzisa.
- Ngekutitfoba, simemetela kutsi kuphendvula umbuto wakhe, Nkulunkulu Babe neNdvodzana Yakhe, Jesu Khristu,
  bavela kuJoseph futsi bacala “kubuyiselwa kwetintfo tonkhe” (buka Imisebenti yebaPhostoli 3:21) njengoba
  kwakubikwe eBhayibhelini. Kulombono, wafundza kutsi emuva kwekufa kwebaPhostoli bekucala, Libandla laKhristu
  leLithestamente leLisha lalahleka emhlabeni. Joseph bekatawuba lusito ekubuyiselweni kwalo.
- Siyacinisekisa kutsi ngekucondziswa nguBabe neNdvodzana, titfunywa tasezulwini teta kutomfundzisa Joseph
  nekutomisa kabusha libandla laJesu Khritsu. Johane uMbhabhatisi losavukile kulabafile wabuyisela ligunya
  lekubhabhatisa ngekucwiliswa kute kutsetselelwe tono. BaPhostoli labatsatfu kulabo bekucala—Petro, Jakobe,
  naJohane—babuyisela buphostoli netikhiya teligunya lebuphristi. Nalabanye bafika futsi, lokufaka ekhatsi
  Eliya, lowabuyisela ligunya lekuhlanganisa imindeni ndzawonye ingunaphakadze ebudlelwaneni baphakadze
  lobundlula kufa.
- 'Siyachubeka nekufakaza kutsi Joseph Smith waniketwa sipho nemandla aNKulunkulu kutsi ahumushe umbhalo
  wasemandvulo: Incwadzi yaMormon—Lelinye liThestamente laJesu Khristu. Emakhasi alombhalo longcwele afaka
  ekhatsi umlandvo webufundisi baJesu Khristu lucobo phakatsi kwebantfu labebaseNkhabave lengaseNshonalanga
  masinyane emuva kwekuvuka kwakhe. Ifundzisa ngenhloso yemphilo futsi ichaza imfundziso yaKhristu, lekungiyo
  lebaluleke kakhulu kuleyo nhloso. Njengembhalo longcwele lohambisana neLibhayibheli, Incwadzi yaMormon
  ifakaza ngekutsi bonkhe bantfu bangemadvodzana nemadvodzakati aBabe loseZulwini lonelutsandzo, nekutsi
  unelisu lasezulwini ngetimphilo tetfu, nekutsi iNdvodzana Yakhe, Jesu Khristu, iyakhuluma namuhla njengase
  tinsukwini takudzala.'
- Siyamemetela kutsi Libandla laJesu Khristu Lalabangcwele Betinsuku Tekugcina, lelahlelwa nga-Mabasa
  6, 1830, Libandla laKhristu leLithestamente leLisha lelibuyiselwe. Lelibandla litinte emphilweni yaJesu
  Khristu lenekulunga lokuphelele, lolitje lelisimise leLibandla, nakuNhlawulo Yakhe lengenakuphela nasekuVukeni
  kwakhe kwangempela. Jesu Khristu sewuphindze wabita baPhostoli waphindze wabanika ligunya lebuPhristi.
  Usimema sonkhe kutsi site Kuye naseBandleni Lakhe, kutsi sitfole uMoya loNgcwele, imisimeto yensindziso,
  siphindze sitfole injabulo lehlala ikhona.
- Sekundlule iminyaka lengemakhulu lamabili nyalo seloku kuBuyiselwa kwacalwa nguNkulunkulu Babe nendvodzana
  Yakhe Letsandzekako, Jesu Khristu. Tigidzi emhlabeni wonkhe tilamukele lwati lwaleti tehlakalo lokwapholofethwa
  ngato.
- Simemetela ngenjabulo kutsi kuBuyiselwa lokwakutsenjisiwe kuyachubeka ngesembulo lesichubekako. Umhlaba
  awuyoke uphindze ufane, ngoba Nkulunkulu “utohlanganisa ndzawonye kuKhristu konkhe” (Kubase-Efesu 1:10).
- Ngenhlonipho nangekubonga, tsine njengebaPhostoli Bakhe simema bonkhe kutsi bati—njengoba natsi sati—kutsi
  emazulu avulekile. Siyacinisekisa kutsi Nkulunkulu watisa intsandvo Yakhe ngemadvodzana nangemadvodzakati
  Akhe latsandzekako. Siyafakaza kutsi labo labafundza umlayeto wekuBuyiselwa ngemthandazo futsi bente
  labakwentako ngelukholo batobusiswa ngekutfola bufakazi babo bekutsi loko kubuyiselwa kwaseZulwini nenhloso
  yako kulungiselela umhlaba kutsi ulungele Kuta kwesiBili kweNkhosi neMsindzisi wetfu, Jesu Khristu.
