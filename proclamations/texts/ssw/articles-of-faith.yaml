title: ImiBhalo yeLukholo
subtitle: ye Libandla laJesu Khristu Lalabangcwele Betinsuku Tekugcina
author: ''
verses:
- n: 1
  text: Sikholwa ku Nkulunkulu, Babe waPhakadze, nakuyo iNdvodzana Yakhe, Jesu Khristu, naku Moya loNgcwele.
- n: 2
  text: Sikholwa kutsi bantfu batawujeziswa ngetono tabo lucobo, hhayi ngesiphambeko saAdamu.
- n: 3
  text: Sikholwa kutsi ngeNhlawulo yaKhristu, bonkhe bantfu bangasindziswa, ngekulalela imitsetfo nemisimeto
    yeliVangeli.
- n: 4
  text: 'Sikholwa kutsi imigomo nemisimeto yekucala yeliVangeli ngulena: kwekucala, luKholo eNkhosini
    Jesu Khristu; kwesibili, kuPhendvuka, kwesitsatfu, kuBhajatiswa ngekucwiliswa kute kutsetselelwe tono;
    kwesine kuBekwa tandla kute utfole sipho saMoya loNgwcele.'
- n: 5
  text: Sikholwa kutsi umuntfu kufanele abitwe ngekukaNkulunkulu, ngesipholofetho, nangekubekwa tandla
    ngulabo labasegunyeni, kutsi ashumayele liVangeli futsi ente imisimeto yalo.
- n: 6
  text: Sikholelwa eluhlelweni lolufanako nalolo lwalukhona eBandleni laseMandvulo, loku, baphostoli,
    bapholofethi, bashumayeli, bafundisi, bavangeli, njalo njalo.
- n: 7
  text: Sikholelwa esiphiweni setilimi, sekupholofetha, sekwembulela, semibono, sekuphilisa, sekuhumusha
    tilimi, njalo njalo.
- n: 8
  text: Sikholwa kutsi liBhayibheli lilivi laNkulunkulu kangangoba lihunyushwe ngalokungiko; siyakholwa
    futsi kutsi iNcwadzi yaMormon ilivi laNkulunkulu.
- n: 9
  text: Siyakukholwa konkhe loko Nkulunkulu lasakwembulile, konkhe loko Yena lakwembulako manje, futsi
    sikholwa kutsi Yena usatokwembula tintfo letiningi letinkhulu naletibalulekile letiphatselene neMbuso
    waNkulunkulu.
- n: 10
  text: Sikholelwa ekugcogceni kwangempela kwaka-Israyeli nasekubuyiselweni kweTivana letiLishumi; kutsi
    Siyoni (iJerusalema leNsha) itokwakhiwa ngetulu kwelivekati leMelika; kutsi Khristu utobusa Yena lucobo
    emhlabeni; futsi, nekutsi umhlaba utokwentiwa kabusha uphindze ube nenkhatimulo lefana neparadesi.
- n: 11
  text: Sati kutsi lilungelo lekukhonta Nkulunkulu uMninimandla Onkhe ngekutjelwa bonembheza betfu lingeletfu,
    futsi sivumela bonkhe bantfu kutsi babe nelilungelo lelifanako, bangakhonta ngendlela labatsandza
    ngayo, nalapho batsandza khona, noma loko labakutsandzako.
- n: 12
  text: Sikholelwa ekubeni ngaphansi kwemakhosi, bengameli, babusi, futsi nabomantji, ekutfobeleni, ekuhlonipheni,
    nasekusekeleni umtsetfo.
- n: 13
  text: Sikholelwa ekubeni sitsembeke, ekubeni neliciniso, ekubeni msulwa, ekubeni mnene, ekulungeni,
    nasekwenteni lokuhle kubo bonkhe banftu; impela, singasho kutsi silandzela umyalo waPawula—Sikholwa
    tonkhe tintfo, sitsemba tintfo tonkhe, sesibeketelele tintfo letiningi, futsi sitsemba kutsi sitokwati
    kubeketelela tonkhe tintfo. Uma kukhona noma yini lelungile, letsandzekako, noma lenebuntfu, noma
    lencomekako, sitama kutitfola leto tintfo.
signature: Joseph Smith.
