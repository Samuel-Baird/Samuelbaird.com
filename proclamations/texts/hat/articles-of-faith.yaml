title: Atik Lafwa
subtitle: yo Legliz Jezikri pou Sen Dènye Jou yo
author: ''
verses:
- n: 1
  text: Nou kwè nan Bondye, Papa Etènèl la, ak Pitit Gason li a, Jezikri, ak Sentespri a.
- n: 2
  text: Nou kwè lèzòm pral resevwa pinisyon pou pwòp peche pa yo, men, pa pou transgresyon Adan an.
- n: 3
  text: Nou kwè, akoz Ekspyasyon Kris la, tout limanite kapab sove, si yo obeyi lalwa ak òdonans Levanjil
    la.
- n: 4
  text: 'Nou kwè premye prensip ak òdonans Levanjil yo se: premyèman, Lafwa nan Senyè a Jezikri; dezyèmman,
    Repantans; twazyèmman, Batèm pa imèsyon pou remisyon peche yo; katriyèmman, Enpozisyon men pou don
    Sentespri a.'
- n: 5
  text: Nou kwè yon nonm dwe resevwa apèl nan men Bondye, pa mwayen pwofesi, epi pa enpozisyon men, nan
    men moun ki gen otorite, pou preche Levanjil la epi pou administre òdonans Levanjil yo.
- n: 6
  text: Nou kwè nan menm òganizasyon ki te egziste nan epòk Legliz Primitif la, ki vle di, apot, pwofèt,
    pastè, enstriktè, evanjelis, eksetera.
- n: 7
  text: Nou kwè nan don lang, pwofesi, revelasyon, vizyon, gerizon, entèpretasyon lang, eksetera.
- n: 8
  text: Nou kwè Bib la se pawòl Bondye toutotan li tradui kòrèkteman; nou kwè Liv Mòmon an se pawòl Bondye
    tou.
- n: 9
  text: Nou kwè tout bagay Bondye te revele, ak tout bagay li revele kounyeya, epi nou kwè li pral revele
    anpil gwo bagay ki enpòtan ankò konsènan Wayòm Bondye a.
- n: 10
  text: Nou kwè nan rasanbleman literal Izrayèl ak restorasyon dis tribi yo; ki vle di, Siyon (Nouvo Jerizalèm
    nan) pral bati sou kontinan Ameriken an; Kris la pral renye pèsonèlman sou tè a; epi tè a pral renouvle
    epi l pral resevwa laglwa paradi li a.
- n: 11
  text: Nou reklame privilèj pou nou adore Bondye Toupisan an daprè lide pwòp konsyans pa nou, epi nou
    akòde tout moun menm privilèj sa a, se pou yo adore nan fason, nan kote, oubyen sa yo kapab.
- n: 12
  text: Nou kwè nou dwe soumèt nou devan wa, prezidan, dirijan, ak majistra, pou obeyi, onore, epi soutni
    lalwa.
- n: 13
  text: Nou kwè nou dwe onèt, vrè, chas byenveyan, gen vèti, epi nan fè byen pou tout moun; gade, nou
    kapab di konsa, nou suiv konsèy Pòl la—Nou kwè tout bagay, nou espere tout bagay, nou te pèsevere
    nan anpil bagay, epi nou espere sipòte nan tout bagay. Si gen nenpòt bagay ki gen vèti, ki emab, oubyen
    ki gen bon rapò oubyen ki atire louwanj, nou chèche bagay sa yo.
signature: Joseph Smith.
