title: Kris Vivan An
subtitle: Temwayaj Apot Yo
author: Legliz Jezikri pou Sen Dènye Jou yo
paragraphs:
- Pandan n ap fete nesans Jezikri ki te fèt sa gen demil ane, n ap ofri temwayaj nou sou reyalite lavi
  san parèy Li a ak vèti enfini gwo sakrifis ekspyatwa Li a. Pa gen pèsonn ki janm gen yon kokenn chenn
  enfliyans konsa sou tout moun ki te viv epi ki ap gen pou viv sou tè a.
- Se Li ki te Gran Jewova Ansyen Testaman an, Mesi Nouvo Testaman an. Sou direksyon Papa Li, se Li ki
  te kreyatè tè a. “Se ak pawòl la Bondye te fè tout bagay. Nan tout sa ki te fèt, pat gen anyen ki te
  fèt san Pawòl la” (Jan 1:3). Malgre Li te san peche, Li te batize pou L te akonpli tout jistis. “Jezi
  mache nan tout peyi a, Li t ap fè byen” (Travay 10:38), malgre yo te meprize Li. Levanjil Li a sete
  yon mesaj lapè ak bòn volonte. Li te envite tout moun pou suiv egzanp Li. Li te mache sou wout Palestin
  yo, ap geri malad, fè avèg wè, epi leve moun ki te mouri. Li te anseye verite letènite yo, reyalite
  egzistans premòtèl nou, bi lavi nou sou tè a, ak potansyèl nou antanke pitit gason ak pitit fi Bondye
  nan lavi k ap vini an.
- Li te tabli òdonans Sentsèn nan kòm yon rapèl gran sakrifis ekspyatwa Li a. Yo te arete Li epi yo te
  kondane Li sou fo akizasyon, yo te deklare L koupab pou yo te satisfè yon popilas, epi yo te ba L santans
  pou L mouri sou bwa Kalvè a. Li te bay lavi Li pou ekspye peche tout limanite. Lavi Li sete yon gwo
  kado ki te bay nan plas pa tout moun ki gen pou viv sou tè a.
- Nou temwaye solanèlman ke lavi Li, ki se sant tout istwa lèzòm, pa t ni kòmanse nan Betleyèm ni fini
  sou Kalvè a. Li se Premye pitit Papa a, Sèl Pitit Gason Literal Li nan lachè, Redanmtè mond lan.
- Li te leve soti nan tonm nan pou L vin “garanti tout moun ki mouri gen pou leve ankò” (1 Korentyen 15:20).
  Antanke Senyè resisite, Li te vizite moun Li te renmen lè L te vivan yo. Li te vin anseye “lòt brebi”
  L yo (Jan 10:16) nan Amerik tan lontan an. Nan mond modèn nan, Li menm ak Papa L te parèt sou yon ti
  gason ki te rele Joseph Smith, konsa “dispansasyon plenitid tan yo te pwomèt depi lontan an te kòmanse”
  (Efezyen 1:10).
- 'Konsènan Kris Vivan an, Pwofèt Joseph te ekri: “Je li yo te tankou yon flanm dife; cheve ki nan tèt
  li te blan tankou lanèj pi; figi li te pi klere pase limyè solèy la; epi vwa li te tankou bri gwo dlo
  k ap deplase, vwa Jewova menm ki te di:'
- “M se premye a ak dènye a; Se mwen menm ki vivan an, se mwen menm yo te touye a; m se avoka ou bò kote
  Papa a” (D&A 110:3–4).
- 'Pwofèt la te deklare tou konsènan Li menm: “Epi kounyeya, apre tout kantite temwayaj ki te rann konsènan
  li, sa a se temwayaj la, dènye nan tout, nou fè konsènan li pou fè konnen: Li vivan!'
- “Paske nou te wè l, bò kote dwat Bondye menm; epi nou te tande vwa a ki t ap rann temwayaj pou fè konnen
  li se Sèl Pitit Literal Papa a—
- “Epi avèk li, epi pa mwayen li, epi nan li mond yo te egziste epi yo te kreye, epi abitan ki nan mond
  yo se pitit gason ak pitit fi Bondye” (D&A 76:22–24).
- Nou deklare nan mo solanèl ke Prètriz Li a ak legliz Li a te retabli sou tè a — “bati sou fondasyon
  … apot yo ak pwofèt yo te poze a, men se Jezikri menm ki gwo wòch ki kenbe tout kò kay la kanpe byen
  fèm” (Efezyen 2:20).
- Nou temwaye yon jou l ap retounen sou tè a. “Senyè a pral fè wè pouvwa Li a! Tout moun pral wè Li menm
  lè a” (Ezayi 40:5). Li pral dirije kòm Wa tout Wa yo epi reye kòm Senyè tout Senyè yo, epi tout jenou
  ap koube devan l, tout lang ap pale pou adore L. Nou chak ap kanpe pou Li jije nou selon zèv nou ak
  dezi kè nou yo.
- Nou rann temwayaj, antanke vrè Apot òdone L yo — ke Jezi se Kris Vivan an, Pitit Gason imòtèl Bondye
  a. Li se gran Wa Emanyèl la, ki kanpe jodi a adwat Papa Li. Li se limyè, lavi ak lespwa mond lan. Chemen
  L lan se wout ki mennen nan bonè nan lavi sa a ak nan lavi etènèl nan mond ki gen pou vini an. Nou di
  Bondye mèsi pou kado Pitit Gason diven Li an, ki se yon kado moun pap ka konpare.
