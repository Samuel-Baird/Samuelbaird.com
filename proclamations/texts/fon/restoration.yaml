retrieved: '2026-11-02'
title: Wɛ̀nɖàgbè Kpíkpé Jezu Klísu tɔn ɔ́ sín Jlǎ ɖǒ
subtitle: Gbètàkɛn sɛ́ dó gbɛ̀ ɔ́ xwè-kpéhwenu afɔwǒ-wegɔ́ ɔ́ tɔn
author: Nukɔntɔ́zɔ̀watɔ́ Nùkɔ̀nnùkɔ̀ntɔ̀n kpódó Wěɖegbɛ́ Mɛsɛ́dó Wéwé Lɛ́ tɔn Agùn Jezu Klísu tɔn Mɛ Mìmɛ́
  Azǎn Gǔdógúdó tɔn Lɛ́ tɔn kpó
note: Nukɔntɔ́ Russell M. Nelson, wɛ xà gbètà élɔ́ ɖó xógbè tɔn ɖěe e nà ɖò kplé tɛnmɛ̀ ɖaxó 190ɔ ɖěe
  nyí bìbló ɖ ɔ́ ò azǎn 5ɔ lìdósùn ɔ́ tɔn ɖò xwè 2020 ɔ́ tɔn mɛ̀ ɖò Salt Lake City, Utah e.
paragraphs:
- Mǐ zě gbè yì jí bó ɖɔ̀ kpó dó kándéjí kpó ɖɔ̀ Mǎwǔ yí wàn nú vǐ Tɔn lɛ́ bǐ ɖó akɔtà gbɛ̀ ɔ́ tɔn ɖokpóɖokpó
  mɛ̀. Mǎwǔ Tɔ́ ɔ́ nǎ mǐ vǐ tɔn sɛ́xwé tɔn ɔ́, gbɛ̀ mà ɖó jlɛ̌ ɖé wǔ ɔ́, vɔ̀sísá hwɛ̀xɔ́súsú tɔn mavɔmavɔ
  Vǐ vìvɛ̀ná Tɔn, Jezu Klísu tɔn ɔ́. Gbɔ̀n Tɔ́ ɔ́ sín hlɔ̀nhlɔ́n mɛ̀ ɔ́, Jezu lɛ́ fɔ́n sín kú bó yí ɖùɖéjí
  ɖo kú sí. É wɛ nyí Mɛhwlɛ́ngántɔ́ mǐtɔn, Kpɔ́ndéwú mǐtɔn, bó lɛ́ nyí Mɛxɔtɔ́ mǐtɔn.
- Xwè afɔɖé gǔdó ɔ́, ɖó xwè 1820 sín avivɔ hwenu zǎnzǎn ɖé ɔ́, dɔ̀nkpɛ́vú Joseph Smith, hwenu ɖěe é ɖò
  agùn ɖěe mɛ̀ é ná yí ɔ́ bà ná tunwùn wɛ ɔ́, e yí atíkánmɛ̀ bó ná dó xò ɖɛ̀ ɖo xwétɔn kpá ɖo New York
  tò taligbé. Nǔkánbyɔ́ gěgé ɖó xò tɔn mɛ̀ kpantà hwlɛngán alíndɔ́n tɔn lobɔ̀ é ɖinǔ ɖɔ̀ Mǎwǔ ná gɔkɔ
  nú é mì.
- Mǐ ɖe gbètà kpódó mɛɖesɔ́hwè kpó ɖɔ̀, ɖó sin ná Nǔkánbyɔ́ tɔn mɛ̀ ɔ́, Mǎwǔ Tɔ́ ɔ́ kpó Vǐ tɔn, Jezu Klísu
  kpó, tɔ́n dǒ Joseph jí bó hùn nù sín « jlà ɖó nǔbǐ tɔn » nu (Mɛsɛ́dó 3:21) ɖi ɖěe è ko ɖɔ́ɖáyi gbɔ̀n
  ɖò Biblu mɛ̀ ɔ́. Ɖó nùmímɔ́ énɛ́ mɛ̀ ɔ́, è ɖɔ̀ n’í ɖɔ̀ ɖó mɛsɛ́dó núkɔntɔ̀n ɔ́ lɛ́ sín kú gǔdó ɔ́, Agùn
  Klísu tɔn Akɔ̀jijɛ̀ Yɔ̀yɔ̀ tɔn ɔ́ bǔ sín ayìkúngban ɔ́ bǐ jí. Joseph ná wá wà azɔ̌ ɖó tají ɖé ɖó kɔlɛ́wá
  tɔn mɛ̀.
- Mǐ ɖɔ̀ ji ɖó kɔ̀gɔnùmɛ Tɔ́ ɔ́ kpódó Vǐ ɔ́ tɔn kpó glɔ̌ ɔ́, wɛnsagùn sɛ́xwé tɔn lɛ́ wá kplɔ́n nǔ Joseph
  bó vɔ̌ Agùn Jezu Klísu tɔn ɔ́ jlǎ ɖǒ. Jǎan Yɛhwesinlɛnúmɛtɔ́ ɔ́ ɖěe fɔ́nsínkú ɔ́ vɔ̌ acɛ̀ yɛ̀hwèsinlilɛ̀
  nú mɛ gbɔ̀n mɛ nylɔ̌ ɖǒ tɔ̀ mɛ̀ nú hwɛ̀xɔ́súsú tɔn jlà dó. Atɔ̀n ɖó Mɛsɛ́dó wéwé lɛ́ mɛ̀—Piyɛ̀ɛ, Jaki,
  kpódó Jǎan kpó—vɔ̌ mɛsɛ́dónyínyí kpódó yɛ̀hwènɔ̀nyìnyí sín cávi kpó jlà dó. Yě mɛ ɖěvo lɛ́ lɛ́vɔ wà,
  ɖì Elíi ɖěe wà jlà acɛ̀ hɛ̌nnú dɔ̀n ɖò kpɔ́ nú tɛgbɛ̀ ɖó kàncícá mavɔmavɔ ɖěe dín zɛ̀ kú wǔ ɔ́.
- 'Mǐ lɛ́vɔ ɖekúnnu ɖɔ̀ Joseph Smith yí nùnámɛ kpódó acɛ̀ Mǎwǔ tɔn kpó nà ɖó lilɛ wémagbó xóxó ɖé dó gbeɖevomɛ
  : Mɔlmɔ́ɔwémà—Kúnnúɖíɖè Jezu Klísu tɔn ɖěvo. Wémanúkúmɛ̀ wiwé wéma énɛ́ tɔn lɛ́ hɛ̀n tàn azɔ̌ Jezu Klísu
  tɔn ɖěe é wa ɖò tógùn gbadahwejí tɔn mɛ̀ fɔ́n sín kú tɔn gǔdó tlóló lɛ́. É nɔ̀ kplɔ́n mɛ gbɛ̀ sín nǔnyawlí
  bó nɔ̀ tínmɛ̀ nùkplɔ́nmɛ dòdó Klísu tɔn, ɖěe sín ajɔxanú kpatakì wɛ̀ é nyí ɔ̀. Ɖí nùwlánwlán e xwè dó
  Biblu ɔ̀ ɖɔhùn ɔ̀, Mɔlmɔ́ɔwémà ɔ̀ ɖekúnnu ɖɔ̀ gbɛtɔ́ lɛ́ bǐ nyí vǐ súnnù kpó ví nyɔ̌nù Tɔ́ wànyìnúmɛtɔ́
  Sɛ́xwé tɔn, ɖɔ̀ É ɖǒ tito nú gbɛ̀ mǐtɔ̀n, lobɔ̀ Vǐ tɔn, Jezu Klísu, ɖò xó ɖɔ̀ wɛ égbé pɛ́ɛ́ ɖí ɖěe é
  ko nyí gbɔ̀n ɖò xóxó hwenu ɔ̀.'
- Mǐ zě gbè yi jǐ bó ɖɔ̀ Agùn Jezu Klísu tɔn Mɛ Mìmɛ́ Azǎn Gǔdógúdó tɔn Lɛ́ tɔn, é e ɖǒ ayǐ azǎn 6ɔ lìdósùn
  xwè 1830 ɔ́ tɔn, wɛ nyí Klísu sín Agùn Akɔ̀jijɛ̀ Yɔ̌yɔ̌ tɔn é e jlà ɖó e. Agùn élɔ́ ɔ̀ lídó ɖó gbɛ̀
  nùvɔ́ɖéwú awǐnyà dòdó Jezu Klísu ɔ́ tɔn jí, kpódó hwɛ̀xɔ́súsú mavɔmavɔ kpódó fɔ́n sín kú tɔn kpó. Jezu
  Klísu lɛ́vɔ ylɔ̌ mɛsɛ́dó lɛ́ bó ná yě yɛ̀hwènɔ̀nyìnyí sín acɛ̀. É byɔ̌ mǐ mɛ bǐ ɖɔ̀ mǐ ní wǎ émi kpódó
  Agùn émi tɔn kpó mɛ̀, bó ná do yí Yɛ̀sinsɛ̀n, sɛ́nnùwíwá hwlɛngán tɔn, bó ná dó mɔ̌ awàjíjɛ́ e nɔ̀ nɔ̀
  así ɔ́ yí.
- Xwè afɔɖé ko wǎ yì gǔdó dìn sín hwenu ɖěe Mǎwǔ Tɔ́ ɔ́ kpódó Vǐ tɔn, Jezu Klísu kpó sɔ́ jlà ɖó ɔ́ ɖòtè
  ɔ́. Gbɛtɔ́ lǐvi mɔ̀kpán gbɔ̀n gbɛ̀ ɔ́ mɛ̀ bǐ yí nùgbó ɔ́ ɖó yě wa tunwùn nùjìjɛ́ élɔ́ ɖěe é ko ɖɔ̀ d’ayi
  lɛ́.
- Mǐ zě gbè yí jǐ bó ɖɔ̀ kpódó awajijɛ kpó ɖɔ̀ jlà ɖó e sín àkpá e ɖǒ nú mǐ ɔ́ ɖo nukɔ̀n yì wɛ gbɔ̀n nǔɖéxlɛ́mɛ
  hwɛhwɛ̀. Ayìkúngban sɔ́ ná cí dókpó ɔ́ gbeɖé ǎ, ɖó Mǎwǔ ná « xǒ nǔ bǐ kplé ɖó Klísu mɛ̀ » (Efɛ́zinu
  lɛ́ 1:10).
- Kpódó mɛɖěe sɔ́ hwe kpó ɖagbe tunwún nú mɛ kpó ɔ́, mì, mɛsɛ́dó tɔn lɛ́, ɖò bǐbyɔ̌ mɛ bǐ wɛ ɖɔ̀ yě ní
  tunwùn—lěe mǐ tunwùn gbɔ̀n ɔ́—ɖɔ̀ sɛ́xwé ɖò nùvò. Mǐ ɖɔ̀ Mǎwǔ ɖò jlǒ tɔn nú vǐ tɔn súnnù kpó vǐ tɔn
  nyɔ̌nù wànyínanɔ kpó ɖɔ̀ wɛ. Mǐ ɖekúnnu ɖɔ̀ mɛ ɖěe nɔ gbèjé wɛ̀n jlà ɖò tɔn ɔ́ ɖò ɖɛ̀ mɛ̀ bó nɔ wà nǔ
  kpó nǔɖíɖí kpó lɛ́ ná mɔ̀ dǒnà dó yǐ kúnnúɖíɖè Mǎwùnyínyí tɔn kpódó nyàwlí tɔn ná dó bló àyǐ dó nú wǐwǎ
  wegɔ̀ Aklúnɔ mǐtɔ̀n, Mɛhwlɛ́ngántɔ́ mǐtɔ̀n Jezu Klísu tɔn.
