title: Klísu Gbɛɖè ɔ́
subtitle: Kúnnúɖíɖè Mɛsɛ́dó lɛ́ tɔn
author: Agùn Jezu Klísu tɔn Mɛ Mìmɛ́ Azǎn Gǔdógúdó tɔn Lɛ́ tɔn
paragraphs:
- Hweɖenu mì ɖǒ xwe-kpéxwenu afɔwó gɔ́ɔ Jezu Klísu tɔn ɖú wɛ ɔ́, mì ɖekúnnu ɖɔ̀ nùgbó ɔ́ gbɛ̀ tɔn kún
  ɖi mɛ ɖěbǔ tɔn ǒ lóbɔ acɛ e ɖó vɔ̀sísá tɔn ɖaxó e sú hwɛ̀ xɔ́ mì tɔn lɛ́ mɛ ɔ́ nyí mavɔ. Mɛ ɖěbǔ ko
  sɔ ɖó zìnzìn ɖaxó mɔ̀húnkɔ tɔn ɖó mɛ e ko nɔ̀ gbɛ̀ alǒ mɛ e ná wà nɔ̀ gbɛ̀ ɖó ayìkúngbànji ɔ́ lɛ́ ji
  zɛ̀ é yɛ wù ǎ.
- É wɛ ko nyí Jèxóvà Akɔjijɛ Xóxó ɔ́ tɔn, Mɛsíya Akɔjijɛ Yɔ̌yɔ́ ɔ́ tɔn. Ɖó kɔgɔnùmɛ Tɔ́ ɔ́ tɔn glɔ́ ɔ́,
  é dá ayìkúngbàn ɔ́. « É jí wɛ è gbɔ̀n bó bló nǔ e ɖò gbɛ̀ ɔ́ mɛ̀ lɛ́ bǐ; è blǒ nǔ ɖěbǔ é mɛ̀ vo ǎ »
  (Jǎan 1:3). É hù hwɛ̀ ɖé ǎ cobɔ é lɛ yɛ̀hwèsin bó ná dó wà hwɛjijɔ bí. É « nɔ́ yí fílɛ filɛ bò nɔ̀ ɖò
  ɖagbè wà wɛ » (Mɛsɛ́dó 10:38), amɔ̀ mɛ lɛ́ gbɛ̌ wan ní ɖó mɔ̌ wú. Wɛ̀nɖagbe tɔn nyí wɛ̀n fífá kpódó
  jlo ɖagbè tɔn kpó. É byɔ̀ mɛ bí tlóló ɖɔ̀ ye ní sɔ afɔ́ ɖó afɔ́dó tɔn mɛ̀. É dan gbɔ̀n Palɛstinú sín
  alì lɛ́ jí, bó gbɔ azɔ̀n nú azinzɔnnɔ̀ lɛ́, bó hùn nùkún nú nùkúntɔnnɔ̀ lɛ́ lóbó fɔ̀n mɛ kúkú lɛ́. É
  kplɔ́n mɛ xó nùgbó gbɛ̀ mavɔmavɔ tɔn lɛ́, é lɛ́ kplɔ́n mǐ ɖɔ̀ gbɛ̀ ɖé tíin jɛ nukɔn nùgbó cobɔ mǐ jɔwa
  ayihɔn mɛ̀, bó lɛ́ kplɔ́n mǐ gbɛ̀ mì tɔn sín nyàwlí ɖó ayìkúngbànji fí kpódó agbɔ̌n vǐ súnnù kpó ví
  nyɔ̌nù Mǎwǔ tɔn kpó ɖó gbɛ̀ e nà wà ɔ́ mɛ̀.
- É zé Aklúnɔ sìn nǔɖúɖu ɖó ayí ɖí flín vɔ̀sísá tɔn ɖaxó e sú hwɛ̀ xɔ́ mǐtɔn lɛ́ ɔ́ tɔn ɖɔhùn. É yí gán
  mɛ̀ ɖó è ɖo nuvú ɖó nù tɔn bɔ è ɖɔ̀ hwɛ́ agɔ̀ n’i bó ná dó nyɔ́ ɖó gbɛtɔ́ lɛ́ sín nukɔ̀n lobó ɖɔ̀ kúhwɛ̀
  n’i ɖɔ̀ è ná hú i ɖó aklúzù jí ɖò Gɔlugɔta. É sɔ gbɛ̀ tɔn jó bó ná dó sú hwɛ̀ xɔ́ mì gbɛtɔ́ lɛ́ bi tɔn
  nà. Nùnámɛ e akwɛ̀ má sixú xɔ ǎ e ɖé wɛ nyí bɔ é sɔ́ afɔdoté bó ná mɛ ɖé ná wá nɔ̀ ayìkúngbànji fí lɛ́
  bi sésé.
- Mǐ ɖekúnnu kpó dó kándéjí kpó ɖɔ̀ gbɛ̀ tɔn, ɖěe nyí ajɔxànù taji ɖó ayìhɔ́n gbɛ̀ ɔ́ bǐ sín tàn mɛ̀ ɔ́,
  kùn bɛ́ ɖó Bɛteleyɛ́mu ó bó kùn lɛ́ fó dó Gɔlugɔta ó. É wɛ nyí Tɔ́ ɔ́ sín Nukɔn-gbeví, Vǐɖókpónɔ́ ɖó
  agbazà mɛ̀, Mɛxɔtɔ́ gbɛ̀ ɔ́ tɔn.
- É fɔ́n cítè sín yɔdò mɛ bó ná dó nyí « nukɔntɔ́ nù mɛ é ko kú lɛ́ » (1 Kɔlɛ́tinu lɛ́ɛ 15:20). Aklúnɔ
  e fɔ́n sín kú ɔ́ ɖɔhùn ɔ́, é yí bà jonɔ̀ mɛ ɖěe é yí wàn ná hwenu ɖěe é ɖò gbɛ̀ ɖò ayìkúngbàn ji ɔ́
  lɛ́. É lɛ́ vɔ wà ɖevízɔ̌ tɔn ɖò « lɛngbɔvú tɔn ɖévó lɛ́ » (Jǎan 10:16) gɔn ɖó Amélika xóxó ɔ́ gbéjí.
  Ɖó hwènu yɔ̀yɔ́ lɛ́ nú ɔ́, Tɔ́ tɔn kpó é kpó tɔ́n ɖo Joseph Smith jí, bó hùnnù sín nǔjíkpɔ́ntɔ́zɔ̀ nùvɔ́ɖéwú
  hwěnu tɔn lɛ́ tɔn, ɖée sín akpá è ko do xóxó ɔ́ tɔn nù.
- 'Gbeyíɖɔ̀ Joseph ɔ́ wlan ɖó Klísu gbɛɖè ɔ́ jí ɖɔ̀ : « Nùkúntɔn lɛ́ cí ɖí myɔɖɛ ɖɔhùn, ɖà tɔn lɛ́ wé
  ɖí glasì sín afùntùntùn maɖóblɔ̀ ɖɔhùn, nùkúnmɛ tɔn nɔ̀ kɔ̀n hu gan hwésívɔ bɔ gbè tɔn cí tɔ ɖaxó sín
  zìnguídí ɖɔhùn, ɛɛn, gbè Jèxóvà tɔn, bó nɔ̀ ɖɔ̀ :'
- « Nyɛ wɛ nyí bíbɛ kpó fífó kpó ; nyɛ wɛ nyí mɛ e ɖó gbɛ̀ ɔ́, nyɛ wɛ nyí mɛ é e sàvɔ ná e ; nyɛ wɛ nyí
  ɖɛ̌mɛnu mítɔn ɖó Tɔ́ ɔ́ kpá » (ND&A 110:3–4).
- 'Gbeyíɖɔ̀ ɔ́ lɛvɔ ɖɔ̀ dó wù tɔn ɖɔ̀ : « Bɔ Lo ɔ́, kúnnúɖiɖè wɔbúwɔbú e ɖé ɖó jí tɔn ɔ́ lɛ́ gǔdó ɔ́,
  kúnnúɖiɖè ɔ́, gǔdógúdó tɔn ɔ́ ɖó bi mɛ̀, ɖé mì ɖé ɖó wú tɔn ɔ́ ɖié : é ɖó gbɛ̀ !'
- « Ɖó mǐ mɔ̌ ɛ, bó mɔ̀ ɛ ɖó Mǎwǔ sín aɖùsí xwé ; lobɔ mì sé gbè ɔ́ ɖekúnnu ɖɔ́ é wɛ nyí Víɖókpónɔ̀ Tɔ́
  ɔ́ tɔn ;
- « Ɖɔ̀ gbɔ̀n éyɛ jí, gbɔ̀n yɛ kàn tɔn mɛ̀ kpó éyɛ mɛ̀ kpó ɔ́, ayìhɔngbɛ lɛ́ nyí bíbló, lobɔ́ mɛ e nɔ̀
  nɔ̀ mɛ̀ lɛ́ ɔ́ ví súnnù kpó ví nyɔ̌nú kpó jí nù Mǎwǔ wɛ yě nyí » (ND&A 76:22–24).
- Mǐ ɖɔ̀ kpó dó kándéjí kpó ɖɔ̀ yɛ̀hwènɔ̀nyìnyí tɔn kpódó Agùn tɔn kpó nyí jlǎ ɖǒ ɖò ayìkúngbànji lobɔ̀
  Agùn tɔn lídó « ɖó dodónù mɛsɛ́dó kpódó gbeyíɖɔ̀ lɛ́ kpó tɔn jí, Jezu Klísu ɖésú wɛ ká nyí awinnya dódó
  ɔ́ » (Efɛ́zinu lɛ́ 2:20).
- Mǐ ɖekúnnu ɖɔ̀ é ná lɛ̌kɔ̀ wà ayìkúngbànji gbè ɖokpó. « Lo ɔ́ guígó Mavɔmavɔ ɔ́ tɔn ná nyí ɖíɖéxlɛ,
  lobɔ̀ tlóló fínɛ́ ɔ́ agbazà lànnɔ́ lɛ́ bi ná mɔ̌ ɛ » (Ezayíi 40:5). É ná kp’acɛ ɖí Axɔsú axɔsú lɛ́ tɔn
  ɖɔhùn bó ná ɖú gǎn ɖí Aklúnɔ aklúnɔ lɛ́ tɔn ɖɔhùn, lobɔ̀ kólí lɛ́ bǐ ná yí dò bɔ ɖɛ lɛ́ bǐ ná xwlé ɖɔ̀
  é wɛ nyí Klísu. Mǐ bǐ ná yí hwɛ̀ núkɔn bó nú é ná ɖɔ̀ hwɛ̀ xà mi lěe azɔ̌ mǐtɔn lɛ́ kpódo jlǒ ayixa
  mǐtɔn lɛ́ tɔn jɛxà gbɔ̀n e.
- Mǐ, mɛsɛ́dó tɔn ɖěe é sɔ́ acɛ ɖó así ná lɛ́, mǐ ɖekúnnu ɖɔ̀ Jezu wɛ nyí Klísu gbɛɖé ɔ́, Ví Mǎwǔ tɔn
  jɔmakú ɔ́. É wɛ nyí axɔsú ɖaxó Emanuwɛ́li ɖěe ɖò Tɔ́ ɔ́ sín aɖùsí xwé ɖó egbè ɔ́. É wɛ nyí wèzízá, gbɛ̀
  kpódó nùkùnɖíɖó gbɛ̀ ɔ́ tɔn kpó. Alì tɔn lɛ́ nɔ̀ kplà mɛ yí nyɔ̌nà mɛ̀ ɖò gbɛ̀ élɔ́ mɛ̀ kpódó gbɛ̀ mavɔmavɔ
  kpó ɖò ayìhɔngbɛ é jawè ɔ́ mɛ̀. É ni kpà Mǎwǔ nú núnámɛ mɔ̀húnkɔ́-má-sɔ-ɖé Ví tɔn mìmɛ́ ɔ́ tɔn !
date: Azan 1ɔ aluúnsùn xwè 2000 tɔn
