retrieved: '2026-11-02'
title: Na Vakalesui Mai ni Taucoko ni Kosipeli i Jisu Karisito
subtitle: A iVakaro ni Yabaki Ruanadrau ki Vuravura
author: Na Mataveiliutaki Taumada kei na Matabose ni iApositolo Le Tinikarua ni Lotu i Jisu Karisito ni
  Yalododonu Edaidai
note: A wiliki na ivakaro oqo me lewe ni nona itukutuku o Peresitedi Russell M. Nelson ena ika 190 ni
  Koniferedi Raraba Vakayabaki, 5 ni Epereli, 2020 mai Salt Lake City, Utah.
paragraphs:
- Keitou sa vakaraitaka yani me kilai ni lomani ira na Luvena e veiyasai vuravura na Kalou. Sa solia vei
  keda na Kalou na Tamada na Luvena lomani ko Jisu Karisito, ka sucu vakalou, sega ni vakatautauvatataki
  rawa na nona bula, kei na nona veisorovaki tawayalani. Ena kaukauwa nei Tamada, e tucake rawa kina o
  Jisu ka rawata na qaqa mai na mate. Sa noda iVakabula, noda iVakaraitaki, kei na noda Dauveivueti.
- Ena rua na drau na yabaki sa oti, ena dua na mataka totoka ni vula itubutubu ni 1820, ena nona vakasaqara
  na cauravou lailai o Josefa Simici na lotu cava me lewena, a lako yani ki na loma ni veikau volekata
  nona vale, ena vualiku kei Niu Ioka, Amerika me masu. E a tiko na nona vakatataro me baleta na vakabulai
  ni yalona ka vakabauta ni na liutaki koya na Kalou.
- Ena yalo ni vakarokoroko, keitou vakaraitaka yani me isau ni nona masu, erau a rairai mai vei Josefa,
  na Kalou na Tamada kei na Luvena, o Jisu Karisito ka tekivutaka na kena “caka tale me vinaka kina na
  ka kecega” (Cakacaka 3:21) me vaka sa tukuni taumada ena iVola Tabu. Ena raivotu oqo, e vulica kina
  o koya, ena gauna era mai mate kina na iApositolo taumada, sa mai yali e vuravura na Lotu ena Veiyalayalati
  Vou nei Karisito. Ena vakayagataki o Josefa me iyaya ena kena vakalesui tale mai.
- Keitou vakadeitaka ena Nodrau veidusimaki na Tamada kei na Luvena, era a lako mai na italai vakalomalagi
  me ra vakaroti Josefa ka tauyavutaka tale na Lotu i Jisu Karisito. E vakalesuya mai o Joni na Dauveipapitaisotaki
  na lewa ni papitaiso ena tabadromuci e wai me bokoci kina na ivalavala ca. E vakalesuya mai e tolu vei
  iratou na tinikarua na iApositolo taumada—o Pita, Jemesa, kei Joni—na itutu vaka iapositolo kei na idola
  ni lewa vakamatabete. Era lako talega mai eso tale, e wili kina o Ilaija, ka vakalesuya mai na dodonu
  me semati vata na matavuvale me tawamudu ena isema tawamudu ka uabaleta na mate.
- 'Keitou vakadinadinataka talega ni a soli vei Josefa Simici na isolisoli kei na kaukauwa ni Kalou me
  vakadewataka e dua na itukutuku makawa: na iVola i Momani—E Dua Tale na iVakadinadina kei Jisu Karisito.
  Na draunipepa ni itukutuku vakatabui oqo e wili kina e dua na itukutuku me baleta na nona veiqaravi
  o Jisu Karisito vei ira na tamata ena Ra ni noda Vuravura ni oti saraga na Nona Tucake tale mai na Mate.
  E vakatavulica na inaki ni bula ka vakamacalataka na ivakavuvuli i Karisito, ka sa iusutu ni Nona inaki.
  Na iVola i Momani e ivolanikalou veitokoni ki na iVola Tabu, e vakadinadinataka ni tamata kece sara
  e luvena yalewa se tagane na Tamada Vakalomalagi dauloloma, ka tiko e dua na Nona ituvatuva vakalou
  ni noda bula, ka vosa tiko vei keda nikua na Luvena, o Jisu Karisto me vaka ena veigauna makawa.'
- Keitou vunautaka yani Na Lotu i Jisu Karisito ni Yalododonu Edaidai, ka tauyavutaki ena 6 ni Epereli,
  1830, sai koya na Lotu ni Veiyalayalati Vou nei Karisito ka sa vakalesui mai. Sa itakele ni Lotu na
  bula uasivi ni vatu ivakadei, o Jisu Karisito, kei na Nona Veisorovaki tawayalani kei na Tucaketale
  mai na Mate. Sa kacivi ira tale ena gauna oqo na iApositolo o Jisu Karisito ka sa solia vei ira na lewa
  ni matabete. Sa sureti keda kece meda lako mai Vua kei na Nona Lotu, ka ciqoma na Yalo Tabu, na cakacaka
  vakalotu ni veivakabulai, ka rawata na reki tawamudu.
- Sa mai sivi e rua na drau na yabaki mai gauna ni Veivakalesui Mai, ka a vakavuna na Kalou na Tamada
  kei na Luvena Lomani, o Jisu Karisito. E milioni e vuravura raraba era sa ciqoma na kila me baleta na
  veigauna ka parofisaitaki oqo.
- Keitou kacivaka kina ena yalomarau ni sa toso tikoga i liu na Veivakalesui mai sa yalataki ena tomani
  tiko ni ivakatakila. Sa na sega tale ni vaka tu ga e liu na vuravura, ni Kalou sa “soqona vata na ka
  kecega vei Karisito” (Efeso 1:10).
- Ena vakarokoroko kei na vakavinavinaka, keitou sa mai veisureti na Nona iApositolo moni kila—me vaka
  keitou sa kila—ni sa tadola tu ko lomalagi. Keitou vakadeitaka ni sa vakatakila tiko na Nona lewa na
  Kalou me baleti ira na luvena tagane kei na yalewa lomani. Keitou vakadinadinataka nio ira sa vulica
  ena masumasu na itukutuku ni Veivakalesui Mai ka cakacaka ena vakabauta, era na vakalougatataki mera
  rawata nodra dui ivakadinadina ena kena vakalou kei na kena inaki, me vakarautaki na vuravura kina iKarua
  ni Lako Mai sa yalataki tu ni noda Turaga ka iVakabula, o Jisu Karisito.
