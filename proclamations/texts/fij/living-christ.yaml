title: Se Bula na Karisito
subtitle: Nodra iVakadinadina na iApositolo
author: Na Lotu i Jisu Karisito ni Yalododonu Edaidai
paragraphs:
- Nida marautaka na ivakananumi e vuravura ni sucu i Jisu Karisito e na ruanaudolu na yabaki sa oti, me
  keitou cauraka mada na neitou ivakadinadina ni kena dina na Nona bula sega ni vakatauvatani kei na savasava
  tawayalani ni Nona isoro cecere ni veivakaduavatataki. E sega tale ni dua me eccere cake na nona veivakayarayarataki
  vei ira era sa bula oti kei ira era na qai mai bula e vuravura .
- Sa i Koya ga oqori o Jiova na Kalou Cecere ni Veiyalayalati Makawa, ka noda Mesaia tale ga e na Veiyalayalati
  Vou. E na veiliutaki ni Tamana, a mai dauniveibuli e vuravura. “Sa cakava na ka kecega ko koya; a sa
  sega e dua na ka sa caka, me sega ni cakava ko koya” (Joni 1:3). E dina ni tamata tawacala, a papitaiso
  ga me vakayacori kina na lewa dodonu. A sa “lako voli ka dau caka vinaka” (Cakacaka 10:38), ia, a vakasewasewani
  kina mai vei ira na tamata. Na nona kosipeli e itukutuku ni bula veisaututaki kei na veilomani. A vakatakekere
  ki na tamata yadua me ra muria na nona ivakarau. A lakova sara na veigaunisala e Palesitaina, me veivakabulai
  vei ira era tauvimate, me ra rai na mataboko, ka ra vakaturicake sara na mate. A dau vunautaka na ivakavuvuli
  dina, ka yavu ni vuravura tawamudu, ka ni da a bula dina mai liu ni se bera na noda mai bula vakayago
  e vuravura oqo, sa dau talaucaka tale ga na inaki dina ni noda bula, kei na sala me da lesu tale kina
  vua na Kalou e na bula ka tarava, oi keda na luvena vakayadua dina ga, eda yalewa se tagane.
- A mai tauyavutaka na sakaramede me dusimaki keda tiko ki na Nona veisorovaki bibi ka cabora e na vukuda.
  A qai veretaki me mate e na vuku ni veibeitaki vakailasu a yaco vua, ka totogimate kina, e na kauveilatai
  e delana o Kalivari. A balemate e na Nona sauma vakaveisosomitaki na itotogi ni ivalavala ca kei vuravura
  kece ga. Me veisosomitaki na nona iloloma, e na vukudra era na bula e vuravura.
- Keitou tukuna kina oqo na neitou ivakadinadina ni Nona bula, ka itakele ni itukutuku kei vuravura e
  na veitabayabaki kece ga, a sega ni tekivu mai Peceliema, ka sega tale ga ni a laki cava e Kalivari.
  Sa i koya ga na Ulumatua nei Tamada, ka Luvena Duabauga vakayago, io, na Dauveivueti kei vuravura.
- A vakaturicake mai na ibulubulu, me “kedra isevu era sa moce tu” (1 Korinica 15:20). Ni sa tucake tale
  na Turaga, a qai laki sikovi ira e dau veitokani kaya e na nodra se bula voli. A laki vunau tale ga
  vei ira na Nona “[sipi] eso tani tale” (Joni 10:16) e na gauna eliu mai Amerika. E na taba gauna oqo,
  a rairai o Koya kei na Tamana vei Josefa Simici na cauravou, me dolava “kina na ka sa lewa ko Koya ni
  sa oti kecega na gauna ka sa lokuca” me vaka sa yalataki makawa mai (raica Efeso 1:10).
- 'Ni vakamacalataki Karisito, a kaya kina o Josefa na Parofita: “A sa vaka na yameyame ni bukawaqa na
  yaloka ni matana; sa vulavula sara na drau ni uluna me vaka na uca cevata; ia na iserau ni kena irairai
  sa uasivi cake mai na rarama ni matanisiga; a rorogo ni domona sa vaka na vadugu ni wailevu; io na domo
  i Jiova sa kaya:'
- “Koi Au na kena ivakatekivu kei na kena ivakataotioti; sai Au sa bula, sai Au tale ga sa vakamatei;
  raica koi Au na nomudou dautataro vei Tamada” (V&V 110:3–4).
- 'A vaka tale ga oqo na vosa a cavuta na Parofita me baleti Koya: “Ia oqo, ni sa oti na ivakadinadina
  kece sara e tukuni me baleti koya, sai koya oqo na ivakadinadina, na kena iotioti me yacova edaidai,
  me keirau tukuna me baleti koya: Ni bula dina tiko!'
- “Ni keirau a raici koya, ni sa tiko ena liga imatau ni Kalou; keirau sa rogoca tale ga na domo sa tukuna
  ni sai koya na Le Duabau ga nei Tamana—
- “Ia na vuravura sa buli mai vua, ena vukuna, ka baleti koya, ka vakatalega kina ni ra sa luvena tagane
  ka luvena yalewa daulomani na Kalou o ira kece sara na lewena” (V&V 76:22–24).
- Me itakele ni neitou itukutuku oqo, ni sa vakalesui tale mai i vuravura na Nona matabete kei na Nona
  Lotu—ka “tara cake e na nodra yavu na i apositolo kei ira na parofita, ia sai koya ko Jisu Karisito
  sa kena ivakadei e na tutunivale” (Efeso 2:20).
- Keitou vakadinadinataka ni na lesu tale mai i vuravura o Koya e na dua na gauna sa voleka mai. “E na
  qai vakarairaitaki mai na iukuuku i Jiova, ka ra na raica vata na tamata kecega” (Aisea 40:5). Ni na
  mai dabe me nodra Tui na Tui, ka nodra Turaga na Turaga, ni na vakarokoroko vua na tamata kece ga, ka
  ra na vakatusai koya na yame vakayadua, ni ra sokalou Vua. Ni da kau me da laki tu e Matana na tamata
  vakayadua, me ra vakatusa na yame vakayadua na cakacaka era sa dui cakava, kei na dui gagadre ni lomada.
- Keitou vakadinadinataka, oi keitou sa tabaki me Nona i Apositolo—ni sai Jisu ga na Karisito ka se bula
  tiko ga, o koya na Luve ni Kalou ka na bula tiko ga me tawamudu, ni sa bula vakatukatuka. Sa i koya
  dina ga na Tui o Imanueli, sa tu edaidai e na ligaimatau nei Tamana. Sa i Koya ga na rarama, na vu ni
  bula, ka inuinui kei vuravura. E dodonu vinaka na nona sala, ka na laki cava e na marau ni bula oqo,
  kei na bula tawamudu e na bula mai muri. Me vakavinavinakataki tiko ga na noda Kalou, e na vuku ni nona
  isolisoli vakaitamera vei keda, na Luvena savasava.
