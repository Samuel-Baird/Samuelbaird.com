title: Na Yavu Ni Vakabauta
subtitle: ni Lotu i Jisu Karisito ni Yalododonu Edaidai
author: ''
verses:
- n: 1
  text: Keimami vakabauta na Kalou, na Tamada Tawamudu, kei na Luvena, ko Jisu Karisito kei na Yalo Tabu.
- n: 2
  text: Keimami vakabauta ni na cudruvi na tamata ena vuku ni nona ivalavala ca, ka segai ena talaidredre
    nei Atama.
- n: 3
  text: Keimami vakabauta ni na vakabulai na tamata kecega ena Veisorovaki nei Karisito, kevaka eda sa
    talairawarawa ki na lawa kei na cakacaka vakalotu ni Kosipeli.
- n: 4
  text: 'Keimami vakabauta ni sa yavu ni ivakavuvuli kei na cakacaka vakalotu ni Kosipeli na: ai matai,
    vakabauta na Turaga ko Jisu Karisito; ai karua, veivutuni; ai katolu, papitaiso ena tabadromuci e
    wai me bokoci kina na ivalavala ca; ai kava, Na veitabaki ni liga me baleta na isolisoli ni Yalo Tabu.'
- n: 5
  text: Keimami vakabauta ni sa kilikili me kacivi na tamata mai vua na Kalou ena parofisai, ka vakakina
    ena veitabaki ni liga mai vei ira e tu vei ira na dodonu, me ra vunautaka kina na kosipeli ka qarava
    na kena veicakacaka vakalotu.
- n: 6
  text: Keimami vakabauta na ivakarau a taurivaki tu ena Lotu Taumada, ka ra a vakaitavi kina na iapositolo,
    na parofita, na italatala, na ivakavuvuli, na dauvunau, kei na veika tale e so.
- n: 7
  text: Keimami vakabauta na isolisoli ni vosataka na vosa tani e so, na parofisai, na ivakatakila, na
    raivotu, na veivakabulai, na vakadewataki ni vosa, kei na veika tale e so.
- n: 8
  text: Keimami vakabauta ni vosa ni Kalou na iVolatabu kevaka e vakadewataki vakadodonu; keimami vakabauta
    tale ga ni vosa ni Kalou na iVola i Momani.
- n: 9
  text: Keimami vakabauta na veika sa vakatakila oti na Kalou, na veika sa vakatakilai mai ena gauna oqo,
    ka keimami vakabauta ni na levu tale na veika cecere ka bibi ena qai vakatakilai mai me baleta tiko
    ga na Matanitu ni Kalou.
- n: 10
  text: Keimami vakabauta ni ra na vakasoqoni vata tale na Isireli kei na nodra vakalesui mai na Yavusa
    e Tini; io ni na tara ko Saioni (na Jerusalemi Vou) ena vanua ko Amerika; ni na mai veiliutaki sara
    ga e vuravura na Karisito; ka na vakavoui na vuravura oqo me rawata na lagilagi kei parataisi.
- n: 11
  text: Keimami kaya ni dodonu me soli na galala ni sokalou vua na Kalou Kaukauwa me vaka na lewa ni dui
    lomada, ka me soli ki na tamata kecega na galala vata oqo, me ra sokalou ena kena ivakarau, ena vanua,
    se ki na cava ga era vinakata.
- n: 12
  text: Keimami vakabauta ni sa kilikili me da vakarorogo vei ira na tui, peresitedi, iliuliu, kei ira
    na turaganilewa, ena noda talairawarawa, rokova, ka tokona na lawa.
- n: 13
  text: Keimami vakabauta ni sa kilikili me da dau dina tikoga, lomadina, bula savasava, caka vinaka,
    ivalavala savasava, ka yalovinaka vei ira na tamata kecega; io, me da kaya beka ni da sa muria na
    vunau nei Paula—Keimami sa vakabauta na ka kecega, keimami sa vakanuinuitaka na ka kecega, keimami
    sa vosota oti na ka e vuqa, ka nuitaka ni na rawa me keimami vosota na ka kecega. A ka kecega e savasava,
    na ka e totoka, se rogorogo vinaka, se daudokai, keimami sa gadreva na veika oqo.
signature: Josefa Simici.
