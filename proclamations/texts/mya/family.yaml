title: မိသားစု
subtitle: လောကသို့ကြေညာချက်
author: ယေရှုခရစ်တော်၏နောက်ပိုင်းကာလသန့်ရှင်းသူများအသင်းတော်၏ ပထမဥက္ကဌအဖွဲ့နှင့် တမန်တော်တစ်ဆယ်နှစ်ပါး
  အတိုင်ပင်ခံအဖွဲ့
note: ဤကြေညာချက်ကို စက်တင်ဘာ ၂၃၊ ၁၉၉၅၊ ဆော့်လိတ်မြို့၊ ယုတ၌ ကျင်းပခဲ့သည့် လူမှုသက်သာရေးအဖွဲ့ အထွေထွေအစည်းအဝေး၌
  ဥက္ကဌ ဂေါဒန် ဘီ၊ ဟင်ကလီက သူ့အမှာစကား၏ တစ်စိတ်တစ်ပိုင်းအဖြစ် ဖတ်ခဲ့ပါသည်။
paragraphs:
- ကျွန်ုပ်တို့၊ ယေရှုခရစ်တော်၏နောက်ပိုင်းကာလသန့်ရှင်းသူများအသင်းတော်၏ ပထမဥက္ကဌအဖွဲ့နှင့်တမန်တော် တစ်ဆယ်နှစ်ပါး
  အတိုင်ပင်ခံအဖွဲ့သည်၊ ယောက်ျားတစ်ဦးနှင့် မိန်းမတစ်ဦး အိမ်ထောင်​ပြုခြင်းမှာ ဘုရားသခင်တည်ထောင်ထားသော​အရာ​ဖြစ်ကြောင်းနှင့်
  မိသားစုမှာ ဖန်ဆင်းရှင်၏သားသမီးတို့၏ ထာဝရကံကြမ္မာအတွက် သူ့အစီအစဉ်၌ ဗဟိုချက်ဖြစ်ကြောင်းလေးနက်စွာကြေညာပါသည်။
- ခပ်သိမ်းသောလူသားတို့—ယောက်ျားနှင့် မိန်းမတို့—ကို ဘုရားသခင်၏ပုံသဏ္ဌာန်နှင့် အညီ ဖန်ဆင်းထားပါသည်။ တစ်ယောက်ချင်းစီတိုင်းသည်
  ကောင်းကင်ဘုံရှင်မိဘတို့၏ ချစ်လှစွာသော ဝိညာဉ်သား သို့မဟုတ် သမီးဖြစ်ပါသည်၊ ထို့အတူ၊ သို့ဖြစ်၍၊ တစ်ယောက်ချင်းစီ၌
  မြင့်မြတ်သောသဘောနှင့် ကံကြမ္မာရှိပါသည်။ ကျား၊ မ ကွဲပြားမှုသည် တစ်ဦးချင်းစီ၏ လူ့ဇာတိမတိုင်မီ၊ လူ့ဇာတိနှင့်
  ထာဝရကာလတို့၌ သတ်မှတ်ချက်နှင့် ရည်ရွယ်ချက်တို့၏ အခြေခံ လက္ခဏာတစ်ရပ် ဖြစ်ပါသည်။
- လူ့ဇာတိမတိုင်မီ နယ်ပယ်တွင်၊ ဝိညာဉ်သားများနှင့် သမီးများသည် ဘုရားသခင်ကို မိမိတို့၏ ထာဝရအဘအဖြစ် သိခဲ့ကြ၊
  ကိုးကွယ်ခဲ့ကြပြီး၊အစီအစဉ်ကို လက်ခံခဲ့ကြပါသည်၊ ထိုအစီအစဉ်အားဖြင့် သူ၏သားသမီးတို့သည် ရုပ်ကိုယ်ခန္ဓာကို
  ရရှိကြ၊ စုံလင်ခြင်းဆီသို့ တိုးတက်သည့် လောကီအတွေ့အကြုံကို ရရှိကြပြီးလျှင်၊ နောက်ဆုံးတွင်၊ သူတို့၏ မြင့်မြတ်သော
  ကံကြမ္မာမှာ ထာဝရအသက်ကို အမွေခံသောသူများဖြစ်ကြရကြောင်း သတိပြုမိကြပါသည်။ မြင့်မြတ်သော ပျော်ရွှင်ခြင်းအစီအစဉ်သည်
  မိသားစုဆက်ဆံရေးများကို သင်္ချိုင်းတစ်ဖက်အထိပင် အစဉ်မပြတ်ရှိနိုင်စွမ်းစေပါသည်။ သန့်ရှင်းသောဗိမာန်တော်များထဲ၌
  ရရှိနိုင်သည့် သန့်ရှင်းမွန်မြတ်သော ဘိသိက်မင်္ဂလာများနှင့် ပဋိညာဉ်များသည် တစ်ကိုယ်ရေတစ်ကာယတို့အတွက် ဘုရားသခင်၏မျက်မှောက်တော်သို့
  ပြန်သွားရန်နှင့် မိသားစုများအတွက် ထာဝရပေါင်းစည်းခြင်းတို့ကို ဖြစ်နိုင်စေပါသည်။
- ဘုရားသခင်မှ အာဒံနှင့် ဧဝတို့အား ပေးသည့် ပထမပညတ်တော်မှာ ခင်ပွန်းနှင့် ဇနီးအဖြစ် သူတို့၏ မိဘအခွင့်ဖြစ်နိုင်စွမ်းနှင့်
  စပ်ဆိုင်ပါသည်။ ဘုရားသခင်၏သားသမီးများအတွက်၊ ပွားများရန်နှင့် မြေကြီးကို ပြည့်စေရန်ဟူသော သူ၏ပညတ်တော်မှာ
  တရားဝင်လျက်ရှိနေကြောင်း ကျွန်ုပ်တို့ကြေညာပါသည်။ မွေးဖွားခြင်းနှင့်စပ်လျဉ်းသည့် သန့်ရှင်းမွန်မြတ်သောစွမ်းအားများကို
  ခင်ပွန်းနှင့် ဇနီးအဖြစ် တရားဝင်လက်ထပ်ထားသည့် ယောက်ျားနှင့် မိန်းမတို့၌သာ အသုံးပြုရမည်ဖြစ်ကြောင်း ဘုရားသခင်မိန့်တော်မူခဲ့သည်ကို
  ကျွန်ုပ်တို့ထပ်၍ ကြေညာပါသည်။
- လူ့ဇာတိဘဝကို ဖန်ဆင်းသည့်နည်းလမ်းကို မြင့်မြတ်စွာလမ်းညွှန်ခဲ့ကြောင်း ကျွန်ုပ်တို့ ကြေညာပါသည်။ ဘုရားသခင်၏ထာဝရအစီအစဉ်၌
  ဘဝ၏သန့်ရှင်းစင်ကြယ်ခြင်းနှင့် ထိုအမှု၏အရေးကြီးခြင်းကို ကျွန်ုပ်တို့ အတည်ပြုပါသည်။
- ခင်ပွန်းနှင့် ဇနီးသည် အချင်းချင်းနှင့် မိမိတို့သားသမီးများကို ချစ်ရန်နှင့် ဂရုစိုက်ရန် လေးနက်သောတာဝန်ရှိပါသည်။
  “သားသမီးတို့သည် ကိုယ်တော်ရှင်၏အမွေဥစ္စာဖြစ်ကြ၏” (ဆာလံကျမ်း ၁၂၇း၃)။ မိဘများ၌ မိမိတို့သားသမီးများကို ချစ်ခြင်းနှင့်
  ဖြောင့်မတ်ခြင်းတို့ဖြင့် ပြုစုစောင့်ရှောက်ရန်၊ သူတို့၏ဇာတိပကတိနှင့် ဝိညာဉ်ပကတိလိုအပ်ချက်များကို ပံ့ပိုးပေးရန်၊
  တစ်ယောက်ကို တစ်ယောက် ချစ်ဖို့နှင့် အစေခံဖို့၊ ဘုရားသခင်၏ပညတ်တော်များကို စောင့်ထိန်းဖို့၊ နေထိုင်သည့်နေရာ၌
  ဥပဒေလိုက်နာသော နိုင်ငံသားများဖြစ်ဖို့ သူတို့ကို သွန်သင်ပေးရန် သန့်ရှင်းမွန်မြတ်သော တာဝန်ရှိပါသည်။ ခင်ပွန်းများနှင့်
  ဇနီးများ—အမိများနှင့် အဘများ—သည် ဤဝတ္တရားများကို ကျေပွန်မှုရှိမရှိ ဘုရားသခင်ရှေ့၌ တာဝန်ရှိလိမ့်မည်။
- မိသားစုသည် ဘုရားသခင်တည်ထောင်ထားသောအရာဖြစ်သည်။ ယောက်ျားနှင့် မိန်းမအိမ်ထောင်ဖက်ပြုခြင်းမှာ သူ၏ထာဝရအစီအစဉ်အတွက်
  မရှိမဖြစ်လိုအပ်ပါသည်။ သားသမီးများကို အိမ်ထောင်ဖက်ပြုထားသောသူများ၌ မွေးဖွားခွင့်ရှိပါသည်၊ အိမ်ထောင်ဖက်
  သစ္စာကတိများ၌ လုံးဝသစ္စာရှိခြင်းဖြင့် အလေးထားလိုက်နာသည့် အဘနှင့် အမိတို့၏ ပြုစု စောင့်ရှောက်ခြင်းကိုလည်း
  ခံရမည်။ မိသားစု၌ ပျော်ရွှင်ခြင်းမှာ ကိုယ်တော်ရှင် ယေရှုခရစ်တော်၏ သွန်သင်မှုများအပေါ် ၌ တည်ဆောက်ထားသောအခါ
  ရရှိနိုင်ခြေအရှိဆုံးဖြစ်ပါသည်။ အောင်မြင်သောအိမ်ထောင်များနှင့် မိသားစုများသည် ယုံကြည်ခြင်း၊ ဆုတောင်းခြင်း၊
  နောင်တရခြင်း၊ ခွင့်လွှတ်ခြင်း၊ လေးစားမှု၊ ချစ်ခြင်း၊ သနားခြင်း၊ အလုပ်၊ ထို့အတူ ကောင်းကျိုးပေးသော အပန်းဖြေရေး
  လှုပ်ရှားမှုများ၏အခြေခံသဘောတရားများဖြင့် တည်ဆောက် ထိန်းသိမ်းထားခြင်း ဖြစ်ပါသည်။ မြင့်မြတ်သော အစီအစဉ်အားဖြင့်၊
  အဘများသည် မိမိတို့မိသားစုများအပေါ် ချစ်ခြင်းနှင့် ဖြောင့်မတ်ခြင်းတို့ဖြင့် ဦးစီးရမည်၊ မိမိတို့မိသားစုများ၏
  ဘဝလိုအပ်ချက်များနှင့် အကာအကွယ်ကို ပံ့ပိုးပေးရန် တာဝန်ရှိပါသည်။ အမိများသည် အဓိကအားဖြင့် မိမိတို့သားသမီးများကို
  ပြုစုစောင့်ရှောက်ခြင်း၌ တာဝန်ရှိပါသည်။ ဤသန့်ရှင်းမွန်မြတ်သောတာဝန်များ၌ အဘများနှင့် အမိများသည်၊ တူညီသောလုပ်ဖော်ကိုက်ဖက်များအဖြစ်
  တစ်ယောက်ကို တစ်ယောက် ကူညီရန်ဝတ္တရားရှိပါသည်။ မသန်မစွမ်းဖြစ်ခြင်း၊ သေခြင်းသို့ မဟုတ် အခြားအခြေအနေများ၌
  သီးခြားညှိယူခြင်း လိုအပ်နိုင်ပါသည်။
- ကာမအပြစ်ကင်းစင်ခြင်းပဋိညာဉ်များကို ချိုးဖောက်သောသူများ၊ အိမ်ထောင်ဖက် သို့မဟုတ် သားသမီးကို နှိပ်စက်သောသူများ၊
  သို့မဟုတ် မိသားစုတာဝန်များကို ကျေပွန်ရန် ပျက်ကွက်သောသူများသည် တစ်နေ့တွင် ဘုရားသခင်ရှေ့၌ တာဝန်ရှိမည်ဖြစ်ကြောင်း
  ကျွန်ုပ်တို့ သတိပေးပါသည်။ ထို့အပြင်၊ မိသားစုပြိုကွဲခြင်းသည် လူများ၊ အစုအဖွဲ့များနှင့် နိုင်ငံများအပေါ်
  ကျရောက်မည်ဖြစ်ကြောင်း၊ ရှေးခေတ်နှင့် ယခုခေတ်ပရောဖက်များ ကြိုတင်ဟောပြောခဲ့သည့် ဘေးဒုက္ခများ လူမျိုးတို့အပေါ်ကျရောက်မည်ဖြစ်ကြောင်း
  ကျွန်ုပ်တို့သတိပေးပါသည်။
- လူ့အဖွဲ့အစည်း၏ အခြေခံအဖွဲ့တစ်ခုအဖြစ် မိသားစုကို ထိန်းသိမ်းခွန်အားဖြည့်ပေးရန် စီစဉ်ထားသည့် ထိုနည်းလမ်းများကို
  အထောက်အကူပြုကြရန် တာဝန်ရှိသောနိုင်ငံသားများနှင့် နေရာတိုင်းရှိ အစိုးရအရာရှိများကို ကျွန်တော်တို့တောင်းဆိုပါသည်။
