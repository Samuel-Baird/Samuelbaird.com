slug: restoration
language: tah
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=tah
retrieved: '2026-11-02'
title: Te Fa’aho’i-fa’ahou-ra’a mai o te ’īra’a o te ’evanelia a Iesu Mesia
subtitle: E poro’i i tō te ao nei nō te piti-hānere-ra’a o te matahiti
author: Te Peresidenira’a Mātāmua ’e te ’Āpo’ora’a nō te Tino ’Ahuru ma Piti ’āpōsetolo nō Te ’Ēkālesia
  a Iesu Mesia i te Feiā Mo’a i te mau Mahana Hope’a nei
note: ’Ua tai’ohia teie poro’i e te peresideni Russell M. Nelson i roto i tāna a’ora’a nō te 190ra’a o
  te ’āmuira’a rahi i te 5 nō ’Ēperēra 2020, i Roto Miti, i Utah.
paragraphs:
- Tē parau pāpū atu nei mātou ē, ’ua here te Atua i tāna mau tamari’i i roto i te mau fenua ato’a o te
  ao nei. ’Ua hōro’a mai te Atua te Metua ia tātou i te fānaura’a hanahana, te ora fāito ’ore ’e te tusia
  tāra’ehara mure ’ore a tāna Tamaiti here, ’o Iesu Mesia. Nā roto i te mana o te Metua, ’ua ti’afa’ahou
  mai Iesu ’e ’ua upo’oti’a i ni’a i te pohe. ’O ’oia tō tātou Fa’aora, tō tātou Hi’ora’a, ’e tō tātou
  Tāra’ehara.
- E piti hānere matahiti i ma’iri, i te hō’ē po’ipo’i nehenene nō te pu’e tau fa’atupura’a rā’au nō te
  matahiti 1820, ’a ’imi ai te tamaiti ’āpī ra ’o Iosepha Semita ’ia ’ite ē, tei hea te ’Ēkālesia e ’āmui
  atu, haere atu ra ’oia i roto i te uru rā’au piri i tōna fare e pure ai, i te pae apato’erau nō te tuha’a
  fenua nō New York, i te Fenua Marite. E mau uira’a tāna nō ni’a i te fa’aorara’a o tōna vārua ’e ’ua
  ti’aturi ē e arata’i te Atua iāna.
- Ma te ha’eha’a, tē parau atu nei mātou ē, ’ei pāhonora’a i tāna pure, ’ua fā mai te Atua te Metua ’e
  tāna Tamaiti, ’o Iesu Mesia ia Iosepha ’e ’ua ’āvari i « te tau e ti’a ai te mau mea ato’a » (Te ’Ohipa
  3:21) mai tei tohuhia i roto i te Bibilia. I roto i te reira ’ōrama, ’ua ha’api’i mai ’oia ē, i muri
  a’e i te pohera’a o te mau ’āpōsetolo mātāmua ra, ’ua mo’e te ’Ēkālesia o te Faufa’a ’Āpī a te Mesia
  i ni’a i te fenua nei. E riro Iosepha ’ei mauha’a nō te fa’aho’i mai i te reira.
- Tē ha’apāpū atu nei mātou ē, i raro a’e i te arata’ira’a a te Metua ’e te Tamaiti, ’ua haere mai te
  mau ve’a o te ra’i e ha’api’i ia Iosepha ’e e fa’anaho fa’ahou i te ’Ēkālesia a Iesu Mesia. ’Ua fa’aho’i
  mai ’o Ioane Bāpetizo tei ti’afa’ahou i te mana nō te bāpetizora’a utuhi ’ia mātara te hara. E toru
  o nā ’āpōsetolo ’ahuru ma piti mātāmua—’o Petero, Iakobo, ’e Ioane—tei fa’aho’i mai i te ti’ara’a ’āpōsetolo
  ’e te mau tāviri nō te mana o te autahu’ara’a. ’Ua haere ato’a mai vetahi atu, mai ia Elia (Eliaha),
  tei fa’aho’i mai i te mana nō te tāhō’ē i te mau ’utuāfare ē a muri noa atu, ’ei autā’atira’a mure ’ore
  e upo’oti’a i ni’a i te pohe.
- 'Tē fa’a’ite pāpū ato’a nei mātou ē, ’ua fāri’i Iosepha Semita i te hōro’a ’e te mana o te Atua nō te
  ’īriti i te hō’ē pāpa’ira’a tahito : Te Buka a Moromona—Te tahi fa’ahou ’ite nō Iesu Mesia. Tē vai nei
  i roto i te mau ’api o teie pāpa’ira’a mo’a te hō’ē parau poto nō te ’ohipa a Iesu Mesia i rotopū i
  te mau ta’ata nō te pae fenua tō’o’a o te rā i muri mai i tōna ti’afa’ahoura’a. Tē ha’api’i nei te reira
  i te fā o te orara’a ’e tē fa’ata’a nei i te haʼapiʼiraʼa tumu a te Mesia, te pū ho’i nō teie fā. ’Ei
  hoa pāpa’ira’a mo’a nō te Bibilia, tē fa’a’ite pāpū nei te Buka a Moromona ē, e mau tamaiti ’e e mau
  tamāhine te mau ta’ata tāhuti ato’a nā te hō’ē Metua here i te ao ra, ’e e ’ōpuara’a hanahana tāna nō
  tō tātou orara’a, ’e tē paraparau noa nei tāna Tamaiti ’o Iesu Mesia i teie mahana, mai i tahito ra.'
- Tē parau nei mātou ē, Te ’Ēkālesia a Iesu Mesia i te Feiā Mo’a i te mau Mahana Hope’a nei, tei fa’ati’ahia
  i te 6 nō ’Ēperēra 1830, ’o te ʼĒkālesia ïa o te Faufa’a ’Āpī a te Mesia tei fa’aho’i-fa’ahou-hia mai.
  ’Ua mau teie ’Ēkālesia i ni’a i te orara’a maita’i roa o tāna ’ōfa’i tihi tumu, ’o Iesu Mesia, ’e i
  ni’a i tāna tāra’ehara mure ’ore ’e tōna ti’afa’ahoura’a mau. ’Ua pi’i fa’ahou Iesu Mesia i te mau ’āpōsetolo
  ’e ’ua hōro’a ia rātou i te mana o te autahu’ara’a. Tē ani manihini nei ’oia ia tātou pā’āto’a ’ia haere
  mai iāna ra ’e i tāna ’Ēkālesia, ’ia fāri’i i te Vārua Maita’i, te mau ’ōro’a nō te fa’aorara’a ’e ’ia
  roa’a ho’i te ’oa’oara’a tāmau.
- ’Ua he’e iho nei e piti hānere matahiti mai te taime ’a fa’atupu ai te Atua te Metua ’e tāna tamaiti
  here, ’o Iesu Mesia, i teie Fa’aho’i-fa’ahou-ra’a mai. E rave rahi mirioni ta’ata ’ati a’e i te ao nei
  tei fāri’i i te ’ite o teie mau ’ohipa i tohuhia ra.
- Tē parau nei mātou ma te ’oa’oa ē, tē tāmau noa nei te Fa’aho’i-fa’ahou-ra’a mai tei parauhia nā roto
  i te heheura’a tāmau. E’ita te ao nei e riro fa’ahou mai tei mātarohia, nō te mea e « ’āmui ai [te Atua]
  i te mau mea ato’a i te Mesia ra » (Ephesia 1:10).
- Ma te fa’atura ’e te māuruuru, tē ani nei mātou, tāna mau ’āpōsetolo, i te tā’āto’ara’a ’ia ’ite—mai
  tā mātou i ’ite ē—’ua vētea te mau ra’i. Tē ha’apāpū atu nei mātou ē, tē fa’a’ite mai nei te Atua i
  tōna hina’aro nō tāna mau tamaiti ’e tāna mau tamāhine here. Tē fa’a’ite pāpū nei mātou ē, ’o rātou
  ’o tē tuatāpapa nā roto i te pure i te poro’i nō te Fa’aho’i-fa’ahou-ra’a mai, ’e ’o tē haere ho’i ma
  te fa’aro’o, e ha’amaita’ihia rātou ’e e noa’a tō rātou iho ’itera’a pāpū nō tō te reira hanahana ’e
  tō te reira fā e fa’aineine i te ao nei nō te Tae-piti-ra’a mai o tō tātou Fatu ’e Fa’aora, ’o Iesu
  Mesia, mai tei parauhia.
