title: Te ’Utuāfare
subtitle: E Poro’i i tō te ao nei
author: Te Peresidenira’a Mātāmua ’e te ’Āpo’ora’a nō te Tino ’Ahuru ma Piti ’āpōsetolo nō Te ’Ēkālesia
  a Iesu Mesia i te Feiā Mo’a i te mau Mahana Hope’a nei
note: ’Ua tai’ohia teie poro’i e te peresideni Gordon B. Hinckley ’ei tuha’a nō tāna a’ora’a i te ’āmuira’a
  rahi a te Sōtaiete Tauturu tei tupu i te 23 nō Tetepa 1995, i Roto Miti, i Utah.
paragraphs:
- Mātou, te Peresidenira’a Mātāmua ’e te ’Āpo’ora’a nō te Tino ’Ahuru ma Piti ’āpōsetolo nō Te ’Ēkālesia
  a Iesu Mesia i te Feiā Mo’a i te mau Mahana Hope’a nei, tē fa’a’ite pāpū nei mātou ē, ’ua ha’amauhia
  te fa’aipoipora’a i rotopū i te tāne ’e te vahine e te Atua ’e ’ua riro te ’utuāfare ’ei tumu nō te
  ’ōpuara’a a Tei Hāmani nō te hope’a mure ’ore o tāna mau tamari’i.
- ’Ua hāmanihia te mau ta’ata ato’a—te tāne ’e te vahine—i te hōho’a o te Atua. ’Ua riro tātou tāta’itahi
  ’ei tamaiti ’e ’ei tamāhine vārua herehia e nā metua i te ra’i ra, ’e nō reira, e huru ’e e hope’a hanahana
  tō tātou tāta’itahi. E tuha’a faufa’a rahi te rirora’a ’ei tāne ’e ’ei vahine nō te ihota’ata ’e nō
  te tumu o te ta’ata tāta’itahi i te ao nā mua a’e, i te tāhuti nei, ’e i te ao a muri atu.
- I roto i te ao nā mua a’e, ’ua ’ite ’e ’ua ha’amori na ho’i te mau tamaiti ’e te mau tamāhine vārua
  i te Atua tō rātou Metua mure ’ore, ’e ’ua fāri’i i tāna fa’anahora’a e ti’a ai i tāna mau tamari’i
  ’ia roa’a i te hō’ē tino ’i’o ’e te ivi ’e ’ia roa’a ho’i te ’itera’a rau i te tāhuti nei, nō te haerera’a
  i mua e tae atu ai i te maita’i-roa-ra’a, ’e ’ia fa’atupu ho’i i tō rātou hope’a hanahana ’ei ta’ata
  ’āi’a nō te ora mure ’ore. E fa’ati’a te fa’anahora’a hanahana nō te ’oa’oa i te mau aufēti’ira’a ’ia
  vai tāmau noa i muri a’e i te pohe. Te mau ’ōro’a ’e te mau fafaura’a mo’a ’o tē ti’a ’ia ravehia i
  roto i te mau hiero mo’a, e fa’ati’a te reira i te mau ta’ata ’ia ho’i fa’ahou atu i mua i te aro o
  te Atua ’e i te mau ’utuāfare ’ia tāhō’ēhia ē a muri noa atu.
- Te ture mātāmua tā te Atua i hōro’a ia Adamu ’e ia Eva ’o tō rāua ïa ti’ara’a ’ei metua, ’ei tāne ’e
  ’ei vahine fa’aipoipo. Tē fa’a’ite pāpū atu nei mātou ē, te fa’auera’a a te Atua i tāna mau tamari’i
  nō te fānau fa’arahi ’e nō te fa’a’ī i te fenua, tē mana noa nei ā ïa. Tē fa’a’ite atu nei ā mātou ē,
  ’ua fa’aue mai te Atua ē, te mana mo’a nō te hāmanira’a i te ta’ata ’ia fa’a’ohipahia ïa i rotopū ana’e
  iho i te tāne ’e i te vahine ’o tei fa’aipoipohia mai te au i te ture.
- Tē fa’a’ite pāpū nei mātou te huru o te hāmanira’a i te ora i te tāhuti nei ’ua ha’amauhia ïa e te Atua.
  Tē ha’apāpū nei mātou i te huru mo’a o te ora ’e tōna faufa’a rahi i roto i te fa’anahora’a mure ’ore
  a te Atua.
- E hōpoi’a hanahana tā te tāne ’e tā te vahine fa’aipoipo i te herera’a ’e i te poiherera’a te tahi ’e
  te tahi ’e tā rāua mau tamari’i. « Te tamari’i ra, e tufa’a ïa nō ’ō mai ia Iehova ra » (Salamo 127:3).
  Tei te mau metua te hōpoi’a mo’a i te aupurura’a i tā rātou mau tamari’i nā roto i te here ’e te parauti’a,
  i te ha’apa’ora’a i tō rātou mau hina’aro i te pae tino ’e i te pae vārua, ’e i te ha’api’ira’a ia rātou
  i te here ’e i te tāvini te tahi i te tahi, te ha’apa’ora’a i te mau fa’auera’a a te Atua, ’e te rirora’a
  ’ei feiā fa’atura i te mau ture o te fenua e fa’aeahia ra e rātou. Te mau tāne ’e te mau vahine fa’aipoipo—te
  mau metua vahine ’e te mau metua tāne—e ha’avāhia ’outou i mua i te aro o te Atua mai te au i tō ’outou
  ha’apa’ora’a i taua mau hōpoi’a ra.
- ’Ua ha’amauhia te ’utuāfare e te Atua. E mea faufa’a te fa’aipoipora’a i rotopū i te tāne ’e i te vahine
  i roto i tāna fa’anahora’a mure ’ore. E ti’ara’a tō te mau tamari’i ’ia fānauhia i roto i te fa’aipoipora’a
  ’e ’ia aupuruhia e te hō’ē metua tāne ’e te hō’ē metua vahine ’o tē fa’atura nei ma te tu’utu’u ’ore
  i te mau fafaura’a nō te fa’aipoipora’a. E mea pāpū a’e te ’oa’oa i roto i te orara’a ’utuāfare ’ia
  fa’atumuhia te reira i ni’a i te mau ha’api’ira’a a te Fatu ra ’o Iesu Mesia. Te manuia o te mau fa’aipoipora’a
  ’e o te mau ’utuāfare ’ua fa’atumuhia ïa ’e ’ua ha’amauhia ïa i ni’a i te mau parau tumu nō te fa’aro’o,
  te pure, te tātarahapa, te fa’a’orera’a hara, te fa’atura, te here, te aroha, te ’ohipa, ’e te mau fa’a’oa’oara’a
  maita’i. Nā roto i te fa’auera’a hanahana, ’ua tītauhia i te mau metua tāne ’ia fa’atere i tō rātou
  ’utuāfare nā roto i te here ’e te parauti’a, ’e e hōpoi’a nā rātou ’ia ’imi i te ora ’e te pārurura’a
  nō tō rātou ’utuāfare. Te hōpoi’a mātāmua roa a te mau metua vahine ’o tē aupurura’a ïa i tā rātou mau
  tamari’i. I roto i teie mau hōpoi’a mo’a, e mea ti’a i te mau metua tāne ’e i te mau metua vahine ’ia
  tauturu te tahi i te tahi ’ei hoa ’aifāito. E riro te huma, te pohe ’e ’aore rā te tahi atu mau ’ati
  e tītauhia i te tahi atu fa’anahonahora’a ta’a ’ē. E mea ti’a i te mau ’utuāfare fēti’i ’ia hōro’a i
  te tauturu mai te mea e hina’arohia.
- Tē fa’aara atu nei mātou i te mau ta’ata ato’a ’o tei ’ōfati i te mau fafaura’a nō te vi’ivi’i ’ore,
  ’o tei hāmani ’ino i tō rātou hoa fa’aipoipo ’e ’aore rā i tā rātou mau tamari’i, ’e ’aore rā tei ’ore
  i rave i tā rātou hōpoi’a ’utuāfare, ’ia tae i te hō’ē mahana e ti’a mau ā rātou i mua i te Atua ’ia
  ha’avāhia. ’Oia ato’a, tē fa’aara nei ā mātou ē, nā te vāvāhira’a o te ’utuāfare e hōpoi mai i ni’a
  i te mau ta’ata tāta’itahi, te mau ’oire, ’e te mau nūna’a i te mau ’ati rahi i tohuhia na e te mau
  peropheta i tahito ra ’e i teie ’anotau.
- Tē ti’aoro atu nei mātou i te huira’atira e ti’ara’a ’e te feiā fa’atere o te hau nā te ao ato’a nei
  ’ia rave i teie mau rāve’a ’o tei fa’a’itehia nō te ha’amau ’e nō te ha’apūai i te ’utuāfare ’ei niu
  mau nō te tōtaiete.
