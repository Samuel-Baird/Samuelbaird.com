title: Khristu Wamoyo
subtitle: Umboni wa Atumwi
author: ''
paragraphs:
- Pamene tikumbukira kubadwa kwa Yesu Khristu zaka zikwi ziwiri zapitazo, tikuperekera umboni wathu wa
  zoona za moyo wake wosayerekezeka ndi mphamvu yopanda malire ya nsembe yake yochotsa machimo. Palibe
  wina amene anali ndi chikoka chakuya chotere kwa onse amene anakhala kapena amene adzakhale padziko
  lapansi.
- Iye anali Yehova wa chipangano chakale, Mesiya wa chipangano chatsopano. Motsogozedwa ndi Atate ake,
  analenga dziko lapansi. “Zinthu zonse zinalengedwa ndi iye; ndipo popanda iye panalibe cholengedwa chikanalengedwa”
  (Yohane 1:3). Ngakhale anali wopanda tchimo, anabatizidwa kuti akwaniritse chilungamo chonse. “Anayenda
  kuchita zabwino” (Machitidwe 10:38), koma ananyozedwa chifukwa cha izo. Uthenga wake unali Uthenga wa
  mtendere komanso wa mafuno abwino. Anapempha onse kuti atsatire chitsanzo chake. Anayenda mmiseu ya
  Palestina, kuchiza wodwala, kupangitsa akhungu kuona komanso kuukisa akufa. Anaphunzitsa zoonadi zamuyaya,
  zoona zake za moyo wathu tisanabwere pa dziko lapansi, cholinga cha moyo wathu padziko lapansi, komanso
  kuthekera kwa ana amuna ndi akazi a Mulungu ku moyo umene uli mkudza.
- Anakhazikitsa Mgonero ngati chikumbutso cha nsembe yayikulu yochotsera machimo. Anamangidwa ndi kutsutsidwa
  ku milandu yabodza, anawerudzidwa kuti asangalatse gulu, anagamulidwa kufera pa mtanda wa kavale. Adapereka
  moyo wake kuti awombole machimo a anthu onse. Yake inali mphatso yaikulu kwambiri m’malo mwa onse amene
  angakhale padziko lapansi.
- Tikuchitira umboni wamphamvu kuti Moyo Wake, womwe ndiofunikira kwambiri m’mbiri yonse ya anthu, sunayambire
  ku Betelehemu kapena kuthela pa Kavale. Anali mwana woyamba wa Atate, wobadwa yekha kuthupi, Mombolo
  wa dziko lapansi.
- Adauka m’manda, “nakhala zipatso zoyamba kwaiwo amene anagona tulo taimfa” (1 Akorinto 15:20). Monga
  Ambuye woukitsidwa, Iye adayendera pakati pa womwe adawakonda m’moyo. Adatumikiranso pakati pa “nkhosa
  zina” (Yohane 10:16) ku Amerika wakale. M’dziko lamakono, Iye ndi Atate ake adaonekera kwa mnyamata
  Joseph Smith, kuyambitsa zomwe zidalonjezedwa kale “nyengo ya chidzalo cha nthawi” (Aefeso 1:10).
- 'Ponena za Khristu Wamoyo, Mneneri Joseph Smith analemba kuti, Maso ake anali ngati lawi la moto; tsitsi
  lake loyera ngati matalala; nkhope yake idawala kuposa kunyezimira kwa dzuwa, mau ake ngati mkokomo
  wamadzi ambiri, ngakhale mau a Yehova nati:'
- Iye ndiye woyamba ndi wotsiriza; Ndiye amene ali wamoyo, Iye ndi wotiimira mulandu wathu ndi Atate (wonani
  CnM 110:3–4).
- 'Mneneriyu adanenanso za Iye kuti, pambuyo pa maumboni ambiri omwe tapatsidwa za Iye, uwu ndi umboni,
  womaliza, womwe mneneriyo adapeleka za Iye: kuti ali wa moyo!'
- Chifukwa mneneriyu adamuwona, ngakhale kudzanja lamanja la Mulungu; ndipo mneneriyo adamva liwu likuchitira
  umboni kuti Iye ndiye wobadwa yekha wa Atate—
- Kuti Mwa iye, komanso kudzera mwa iye, ndi za iye, maiko alipo komanso adalengedwa, ndipo okhalamo ndi
  ana amuna ndi akazi kwa Mulungu (wonani CnM 76:22–24).
- Tikutsindika kuti Unsembe ndi Mpingo Wake zinabwezeretsedwa padziko lapansi—“unamangidwa pamaziko a
  … Atumwi ndi Aneneri, Yesu Khristu mwini kukhala mwala wapangodya” (Aefeso 2:20).
- Timachitira umboni kuti tsiku lina adzabweranso ku dziko lapansi. “Ndipo ulemelero wa Ambuye udzaululidwa,
  ndipo anthu onse adzaona pamodzi” (Yesaya 40:5). Adzalamulira monga mfumu ya mafumu komanso monga Mbuye
  wa Ambuye, ndipo bondo lililonse lidzagwada komanso lilime lina lililonse lidzalankhula popembedza pamaso
  Pake. Aliyense wa ife adzaima ndikuweluzidwa ndi Iye molingana ndi ntchito zathu ndi zokhumba za mitima
  yathu.
- Timachitira umboni, monga Atumwi ake odzozedwa—kuti Yesu ndi Khristu Wamoyo, Mwana wa Mulungu wachikhalire.
  Iye ndi mfumu yaikulu Immanuel, amene waima lero kudzanja lamanja la Atate Wake. Iye ndi kuunika, moyo
  komanso chiyembekezo cha dziko lapansi. Njira yake ndiyo njira yomwe imatsogolera ku chisangalalo m’moyo
  uno ndi moyo wosatha m’dziko lili mkudza. Mulungu ayamikike chifukwa cha mphatso yosayelekezeka ya Mwana
  Wake.
