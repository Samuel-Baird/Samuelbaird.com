title: Famli
subtitle: Wan Ofisol Toktok I Go long Wol
author: Fas Presidensi mo Kaonsel blong Olgeta Twelef Aposol blong Jos Ia blong Jisas Kraes blong Ol Lata-dei
  Sent
note: Presiden Gordon B. Hinckley i bin ridim ofisol toktok ia olsem pat blong mesej blong hem long Jeneral
  Rilif Sosaeti Miting we oli bin holem long 23 Septemba 1995 long Sol Lek Siti, Yuta.
paragraphs:
- Mifala, Fas Presidensi mo Kaonsel blong Olgeta Twelef Aposol blong Jos Ia blong Jisas Kraes blong Ol
  Lata-dei Sent, i stap talemaot tabu tok ia, se God i odenem mared bitwin man mo woman, mo famli hem
  i stap long stamba blong plan ia we Krieta i gat long saed blong fiuja ples we i no save finis, blong
  ol pikinini blong Hem.
- Evri famli blong man—man mo woman—oli mekem olgeta folem imej blong God. Wanwan long olgeta hem i wan
  spirit pikinini boe o spirit pikinini gel blong papa mo mama long heven we oli laekem olgeta tumas,
  mo from we oli olsem wan spirit, wanwan long olgeta i gat gudfala fasin mo oli gat bigfala janis blong
  save kam olsem wan god. Blong stap olsem man o woman, hem i wan stamba samting we i save talem stret
  huia nao yumi olsem man mo woman long laef bifo yumi kam long wol ia, long laef long wol ia, mo long
  laef we bae i kam afta, mo from wanem hem i olsem.
- Long laef bifo laef long wol ia, ol spirit pikinini boe mo ol spirit pikinini gel oli bin save God,
  mo oli bin stap wosipim Hem olsem Papa blong olgeta We I no Save Finis. Oli agri wetem glad hat long
  plan blong Hem, we i talem se ol pikinini blong Hem oli mas gat wan bodi blong mit mo bun, mo kasem
  eksperiens long wol ia blong save kam stret, mo long en, bae oli gat raet blong kasem laef ia we i no
  save finis. Plan blong God blong stap hapi, i mekem se ol rilesensip blong famli oli save gohed afta
  long ded. Ol tabu odinens mo ol kavenan we oli stap insaed long ol tabu tempol oli mekem rod i klia
  blong wanwan man o woman i save gobak long ples blong God, mo blong ol famli oli save joen tugeta kasem
  taem we i no save finis.
- Fasfala komanmen we God i bin givim long Adam mo Iv, hem i blong save kam hasban mo waef, mo tu, olsem
  wan papa mo mama. Mifala i stap talemaot se komanmen blong God long ol pikinini blong Hem blong kam
  plante mo fulumap wol ia, i stap yet naoia. Mifala i stap gohed yet blong talemaot se God i givim komanmen
  ia, se tabu paoa blong mekem pikinini i mas tekem ples nomo bitwin wan man mo wan woman we tufala i
  bin mared folem loa olsem hasban mo waef.
- Mifala i stap talemaot se fasin we oli krietem laef long wol ia, hem i kam long God. Mifala i stap talemaot
  trutok ia, se laef hem i tabu mo hem i impoten insaed long plan ia blong God we i no save finis.
- Hasban mo waef, tufala i gat wan tabu wok blong lavem mo lukaotem gud wanwan long tufala mo ol pikinini
  blong tufala. “Ol pikinini ya blong yumi, hemia wan presen we Hae God i givim long yumi” (Ol Sam 127:3).
  Ol papa mo mama oli gat wan tabu wok blong lukaotem gud pikinini blong olgeta wetem lav mo fasin blong
  stap stret mo gud, mo blong givim long olgeta ol samting we oli nidim long saed blong bodi mo long saed
  blong spirit, blong tijim olgeta blong lavem mo givim seves long wanwan long olgeta, blong folem ol
  komanmen blong God, mo blong kam olsem ol sitisen we oli folem ol loa blong ples we oli stap laef long
  hem. Ol hasban mo ol waef—ol mama mo ol papa,—bambae oli ansa long fored blong God long saed blong ol
  wok ia we oli mas mekem.
- Famli, God nao i odenem. Mared bitwin man mo woman hem i wan mas insaed long plan ia we i no save finis,
  we i blong Hem. Ol pikinini oli gat raet blong oli bon insaed long mared laef blong papa mo mama. Oli
  gat raet tu blong groap long han blong papa mo mama we tufala i ona long ol promes we tufala i bin mekem
  long mared blong tufala, wetem fasin blong stap fetful long tufala oltaem. Hapines insaed long famli
  laef i gat gudfala janis blong kamtru sapos famli i stanap long ol tijing blong Lod Jisas Kraes. I gat
  sakses oltaem long ol mared laef mo famli, taem oli folem ol stamba tingting blong fet, prea, fasin
  blong sakem sin, fasin blong fogiv, respek, lav, fasin blong kea, wok, mo ol samting o pleplei we oli
  gud. Folem plan blong God, ol papa oli mas lidim ol famli blong olgeta wetem lav mo stret mo gud fasin
  oltaem. Oli gat wok ia tu, blong luk se ol famli blong olgeta oli gat evri samting we oli nidim long
  laef, mo oli gat proteksen. Ol fas wok blong wan mama hem i blong givim kaekae long ol pikinini blong
  tufala long saed blong spirit, mo long saed blong bodi. Long ol tabu wok ia, papa mo mama, tufala i
  mas helpem wanwan long tufala, olsem we tufala i ikwol. Disabiliti, ded o ol narafala samting, i save
  mekem se i gat jenis long wanem we wan papa o mama i mekem blong lukaotem famli. Olgeta narafala memba
  blong famli oli mas givim help sapos i gat nid.
- Mifala i givim woning se, olgeta we oli stap brekem ol kavenan blong jastiti, olgeta we oli stap mekem
  nogud long ol man, woman o pikinini blong olgeta, o oli no mekem evri famli wok we oli mas mekem, bambae
  wan dei, oli mas ansa long fored blong God. Mo tu, mifala i givim woning se seraot blong famli bae i
  mekem se wanwan man o woman, ol komiuniti, mo ol kantri bae oli fesem wan taem we i had tumas olsem
  we ol profet blong yumi bifo mo naoia oli stap talem.
- Mifala i askem strong long ol sitisen mo ol wokman blong gavman long evri ples, we oli gat responsabiliti
  ia, blong wok strong moa long ol samting ia we oli stap olsem plan blong holem taet mo mekem famli i
  kam strong olsem stamba yunit ia blong sosaeti.
