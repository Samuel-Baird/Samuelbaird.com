title: Jisas Hem i Kraes we i Laef
subtitle: Testemoni blong olgeta Aposol
author: Jos Ia blong Jisas Kraes blong Ol Lata-dei Sent
paragraphs:
- Long taem we yumi stap tingbaot taem we Jisas Kraes i bon tu taosen yia bifo, mifala i stap givim testemoni
  blong mifala, long saed blong tru laef blong Hem we i no gat wan samting we i semmak long hem. Wan testemoni
  long saed blong bigfala sakrifaes blong Hem blong pemaot man mo paoa ia, i stap oltaem nomo. I no gat
  nara man yet we i bin laef long wol, i gat paoa ia ova long ol man we oli bin laef long wol ia mo olgeta
  we bae oli laef yet long wol.
- Hem i Hae Jehova blong OlTesteman. Mesaea blong Niu Testeman. Folem toktok blong Papa blong Hem, Hem
  i mekem wol ia. “Mo long olgeta samting ia we God i mekem, i nogat wan samting we Tok ya i no mekem”
  (Jon 1:3). Nomata se Hem i no bin gat sin, Hem i kasem baptaes blong fulfilim ol samting we i stret
  mo gud. Hem i go olbaot mo mekem gud (Ol Wok 10:38), be yet oli no laekem Hem. Gospel blong Hem i wan
  mesej blong pis mo gud tingting. Hem i askem strong long ol man blong folem eksampol blong Hem. Hem
  i wokbaot long ol rod blong Palestaen, mo Hem i mekem olgeta we oli sik, oli kam gud bakegen. Hem i
  mekem olgeta we ae blong olgeta i no save lukluk, oli lukluk bakegen, mo Hem i mekem ol dedman oli laef
  bakegen long ded. Hem i bin tijim ol trutok blong ol taem we i no save finis, se hem i tru we yumi bin
  laef fastaem bifo long wol ia, stamba tingting blong laef blong yumi long wol ia, mo wanem samting ol
  pikinini boe mo gel blong God oli gat long laef we bae i kam.
- Hem i statem sakramen olsem wan samting blong mekem yumi tingbaot bigfala sakrifaes blong Hem blong
  pemaot man. Oli bin arestem Hem mo oli jajem Hem from ol rong we i no tru, oli mekem ol giaman samting
  blong faenem Hem i rong, blong mekem wan grup blong ol rabis man oli harem gud, mo oli panisim Hem blong
  Hem i ded long kros long Kalvari. Hem i givim laef blong Hem blong pemaot ol sin blong ol man. Hemia
  nao bigfala presen blong Hem we Hem i givim long olgeta we bae oli kasem laef long wol ia.
- Mifala i testefae strong, se laef blong Hem, we i stap long medel blong histri blong evri man, i neva
  stat long Betlehem mo i neva stop long Kalvari. Hem i Fasbon blong Papa, wan Pikinini blong Hem nomo
  we i bin gat mit mo bun, Hem i Ridima blong wol.
- Hem i laef bakegen long gref blong kam olsem ol fas frut blong olgeta we oli slip (luk long Fas Korin
  15:20). Olsem Lod we i Laef Bakegen, Hem i visitim olgeta we Hem i lavem olgeta long laef blong Hem
  long wol. Hem i bin go tu long olgeta nara sipsip blong Hem (Jon 10:16) long Amerika blong bifo. Long
  taem blong yumi tedei, Hem mo Papa blong Hem i bin kamaot long boe ia Josef Smit, mo soem long hem,
  promes ia blong dispensesen blong ol las dei we i bin stap long taem finis i kam. (Efesas 1:10).
- 'Profet Josef i bin raet olsem, long saed blong Jisas we Hem i Kraes we i Laef: “Ae blong hem i olsem
  faea we i laet; hea blong hed blong hem i waet we i waet olsem klin sno; fes blong hem i saen i bitim
  laet blong san; mo voes blong hem i bigwan olsem noes blong bigfala solwota we i brok long rif, we i
  voes blong Jehova we i stap talem:'
- “Mi mi faswan mo laswan; Mi mi hem ia we i stap laef, mi mi hem we oli bin kilim hem i ded; mi mi loya
  blong yufala long fored blong Papa” (D&K 110:3–4).
- 'Profet i bin talem tu abaot Hem: “Mo nao, afta long plante testemoni we oli bin givim abaot hem, hemia
  i testemoni, laswan long evriwan, we mitufala i givim abaot hem: !Se hem i stap laef!'
- “From we mitufala i bin luk hem, we i stap long raet han blong God; mo mitufala i bin harem voes we
  i testifae se hem i Wan Stret Pikinini Ia Nomo blong Papa—
- “Se from hem, mo tru long hem, mo aot long hem, ol wol oli stap mo oli bin krietem olgeta, mo ol pipol
  we oli stap long hem oli ol stret boe mo gel long God” (D&K 76:22–24).
- Mifala i talem strong se prishud blong Hem mo Jos blong Hem i bin kambak long wol — mo i stanap antap
  long fandesen blong ol … aposol mo profet, Jisas Kraes Hemwan we Hem i jif kona ston (luk long Efesas
  2:20.)
- Mifala i talem testemoni blong mifala se wan dei bae Hem i kambak long wol. Mo glori blong God bae i
  kamaot mo evri man bae i luk Hem wantaem (luk long Aesea 40:5). Bae Hem i rul olsem King blong Ol King
  mo bae i stap long paoa olsem Lod blong Ol Lod, mo evri man bae i nildaon mo evri man bae i toktok blong
  wosip long fored blong Hem. Wanwan long yumi bae i save stanap long fored blong Hem, mo bae Hem i jajem
  yumi folem ol wok blong yumi mo ol tingting blong ol hat blong yumi.
- Mifala i talem testemoni ia, olsem Ol Aposol blong Hem we oli odenem mifala folem stret fasin we Hem
  i mekem—se Jisas Hem i Kraes we i Laef, Pikinini blong God we i no save ded. Hem i bigfala King Imanuel,
  we i stanap tedei long raet han blong Papa blong Hem. Hem i laet, laef, mo hop blong wol. Rod blong
  Hem i rod we i lidim yumi i go long hapines long laef ia mo laef we i no save finis long wol we bae
  i kam. Yumi talem tangkyu long God from presen ia we i Hae Pikinini blong Hem, presen ia we i no gat
  samting moa i semmak long hem.
