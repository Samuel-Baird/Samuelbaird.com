retrieved: '2026-11-02'
title: Restoresen blong Gospel blong Jisas Kraes we I Fulwan
subtitle: Tu Handred Yia Ofisol Toktok I Go long Wol
author: Fas Presidensi mo Kaonsel blong Olgeta Twelef Aposol blong Jos Ia blong Jisas Kraes blong Ol Lata-dei
  Sent
note: Presiden Russell M. Nelson i bin ridim ofisol toktok ia olsem pat blong mesej blong hem long Namba
  190 Yia Jeneral Konfrens, long namba 5 Epril 2020 long Sol Lek Siti, Yuta.
paragraphs:
- Mifala i talem tabu toktok ia, se God i lavem ol pikinini blong Hem long evri nesen blong wol. God Papa
  i bin givim yumi, taem ia we Pikinini we Hem I Lavem Tumas, Jisas Kraes, i bon i kam long wol ia, laef
  blong Hem we i no gat samting blong komperem wetem, mo bigfala sakrifaes blong Hem we i pem praes from
  sin. Tru long paoa blong Papa, Jisas i bin girap bakegen, mo i bin winim ded. Hem i Sevya blong yumi,
  Eksampol blong yumi, mo Ridima blong yumi.
- Tu handred yia i pas, long wan naes Spring moning long 1820, yangfala Josef Smit i bin wantem save wijwan
  jos blong joenem, nao i go long bus blong prea kolosap long hom blong hem antap long Niu Yok, YSA. Hem
  i gat ol kwestin long saed blong fasin blong sevem sol blong hem, mo i bin trastem se bae God i daerektem
  hem.
- Wetem tingting i stap daon, mifala i stap talemaot se, olsem ansa blong prea blong hem, God Papa mo
  Pikinini blong Hem, Jisas Kraes, Tufala i bin kamkamaot long Josef, mo statem wok blong “olgeta samting
  oli kam niuwan bakegen” (Ol Wok 3:21) olsem we oli bin talem finis long Baebol. Long visen ia, hem i
  bin lanem se afta long ded blong ol fasfala Aposol, Niu Testeman Jos blong Kraes i bin lus long wol
  ia. Josef i wan stret tul blong jos ia i kambak.
- Mifala i talemaot se i tru, se anda long daereksen blong Papa mo Pikinini, ol mesenja blong heven oli
  bin kam blong givim instraksen long Josef mo stanemap bakegen Jos Ia blong Jisas Kraes. Jon Baptaes
  we i laef bakegen long ded i bin putumbak atoriti ia blong mekem baptaes andanit long wota blong kam
  klin aot long ol sin. Tri long ol fasfala twelef Aposol—Pita, Jemes, mo Jon—oli bin putumbak wok blong
  ol aposol, mo ol ki blong prishud atoriti. Ol narawan tu oli bin kam, wetem Elaeja, we i bin putumbak
  atoriti ia blong joenem ol famli oli stap tugeta blong oltaem long ol rilesensip we oli no save finis,
  we oli stap afta long ded.
- 'Mifala i witnes tu se, Josef Smit i bin kasem presen mo paoa blong God blong transletem wan histri
  blong bifo: Buk blong Momon—Wan Narafala Testeman blong Jisas Kraes. Ol pej blong ol tabu toktok ia,
  insaed long hem i gat wan histri blong seves blong Jisas Kraes we Hem i bin mekem long medel blong ol
  pipol long Wes Pat blong Wol, stret afta we Hem i bin laef bakegen long ded. Hem i stap tijim abaot
  ol stamba tingting blong laef, mo i stap eksplenem olsem wanem doktrin blong Kraes i stret stamba biaen
  long stamba tingting ia. Olsem wan kampani skripja long Baebol, Buk blong Momon i stap testifae se evri
  man mo woman, oli ol boe mo ol gel blong wan Papa long Heven we i gat lav, se Hem i gat wan tabu plan
  from laef blong yumi, mo we Pikinini blong Hem, Jisas Kraes, i stap toktok i kam tedei, semmak olsem
  long ol taem blong bifo.'
- Mifala i stap talem se Jos Ia blong Jisas Kraes blong Ol Lata-dei Sent, we i bin oganaes long 6 Epril
  1830, i Niu Testeman Jos blong Kraes, we oli bin putumbak. Jos ia i angka long stret laef blong jif
  konaston blong hem, Jisas Kraes, mo long Atonmen blong Hem, we i no gat en, mo long stret Laef Bakegen
  long Ded blong Hem. Wan moa taem bakegen, Jisas Kraes i bin singaotem Ol Aposol, mo i bin givim olgeta
  atoriti ia blong prishud. Hem i stap invaetem yumi evriwan blong go long Hem mo long Jos blong Hem,
  blong kasem Tabu Spirit, ol odinens blong fasin blong sevem man, mo blong kasem glad ia we i stastap.
- Tu handred yia i pas finis stat long Restoresen ia, we God Papa mo Pikinini blong Hem we Hem i Lavem
  Tumas, Jisas Kraes, Tufala i bin statem. Ol milian pipol raon long wol oli bin akseptem wan save ia
  abaot ol taem ia we oli bin talem olsem profesi.
- Mifala i glad blong talemaot se Restoresen we Hem i promesem, i stap go fored tru long revelesen we
  i stap gogohed. Wol ia bae i neva semmak bakegen, from se God bae i ‘putum evri samting i kam joen wanples
  long Kraes.’ (Efesas 1:10).
- Wetem respek mo tangkyu, mifala, olsem Ol Aposol blong Hem, i stap invaetem evriwan blong save—olsem
  we mifala i save—se ol heven oli open i stap. Mifala i stap talem tru se, God i stap talemaot tingting
  blong Hem long ol boe mo gel blong Hem. Mifala i talem tru se olgeta we oli prea mo stadi long mesej
  ia blong Restoresen, mo tekem aksen wetem fet, bae oli gat blesing ia blong kasem wan witnes blong olgetawan
  se hem i tabu mo stamba tingting blong Hem blong mekem wol ia i rere from Seken Kaming blong Lod mo
  Sevya blong yumi, Jisas Kraes, olsem Hem i bin promesem.”
