title: Te Whānau
subtitle: He Whakapuakitanga ki te Ao
author: Te Tumuakitanga Tuatahi me te Kaunihera o ngā Āpōtoro Tekau mā Rua nō Te Hāhi o Ihu Karaiti o
  Te Hunga Tapu o ngā Rā o Muri Nei
note: I pānuitia tēnei whakapuakitanga e Perehitene Gordon B. Hinckley, hei wāhanga o tana kauwhau ki
  te huihuinga a te Roopu Atawhai i tū ai i te 23 Hepetema, 1995, Salt Lake City, Utah.
paragraphs:
- Ko Mātou, te Tumuakitanga Tuatahi me te Kaunihera o ngā Āpōtoro Tekau mā Rua nō Te Hāhi o Ihu Karaiti
  o te Hunga Tapu o ngā Rā o Muri Nei e whakaatu mārika ana nō te Atua te mārenatanga i waenganui i te
  tāne me te wahine, ā, ko te whānau te tino o te mahere a te Atua mō te oranga tonutanga o Āna tamariki.
- Ko ngā tāngata katoa—he tāne, he wahine—e hanga ana i tō te Atua ritenga. He wairua arohaina rawatia
  tō te tamaiti, tō te tamāhine hoki e ngā mātua nō ngā rangi, ā, nā konei he wairua kairangi, he anamata
  hiranga tā tēnā, tā tēnā. Ko te ira tangata, he āhuatanga hirahira e hāngai ana ki tōna pūtaketanga
  oranga tonutanga nō te ao o mua, o naianei me te ao kei te heke tonu mai.
- I te ao o mua, kua mōhiotia, ā kua whakamoemititia Te Atua e ngā wairua tamariki tāne rātou ko ngā tamāhine
  hei Matua Ora Tonu, ā ka whakaaetia Tana mahere kia āhei ai te whakawhiwhinga o te tīnana kikokiko,
  ā ka whakawheakotia i te ao nei me te kokenga atu ki te hē-koretanga, ā hei te mutunga iho, te whakatutukitanga
  o tā rātou anamata kairangi hei tukunga ki te ao mutunga kore. Mā te mahere nui o te hari e taea tonu
  ō tātou hononga ā whānau kei tua o mate. E wātea ana ngā tikanga tapu me ngā kawenata i roto i ngā temepara
  tapu kia āhei ai te whakahokitanga atu o te tangata ki te Atua me te noho tahi ā whānau nei mō ake tonu
  atu.
- Ko te whakahau tuatahi nā te Atua i hoatu ki a Ārama rāua ko Iwi e hāngai ana ki tā rāua mātuatanga,
  hei tāne, hei wahine anō hoki. E whakapuaki ana mātou e tū tonu nei i te ao tā te Atua i whakahau mai
  ai ki āna tamariki kia hua, kia whakakapi anō i te whenua. Hei tāpiri atu, e whakapuaki ana mātou, kua
  whakahaua e te Atua kia whakamahia te mana tapu whakawhānau i waenganui i te ira tāne me te ira wahine,
  koia ērā kua mārena ā ture hei tāne, hei wahine anō hoki.
- E whakapuaki ana mātou nā te Runga Rawa te tukanga hanga i te oranga tangata. E tōaitia ana e mātou
  i te tapu o te oranga tangata me tana hiranga ki te mahere mutunga kore a te Atua.
- Mā te tāne me te wahine te haepapa matua kia arohaina, kia manaakitia hoki ā rāua nei tamariki. “He
  taonga pūmau nā Ihowā ngā tamariki” (Ngā Waiata 127:3). Ko tā ngā mātua haepapa tapu, he hāpai i ā rāua
  tamariki mā roto i te aroha me te tika, he whāngai atu ki a rātou, ā tinana mai, ā wairua mai hoki,
  he ako i a rātou kia aroha, kia mahi hoki tētahi ki tētahi, he pupuri i ngā whakahaunga a te Atua, ā
  he noho tangata whenua i raro i te ture i ō rātou nā kāinga noho.
- E whakawahia ana te whānau e te Atua. He mea whai tikanga te mārenatanga a te tāne me te wahine hei
  tā te Atua mahere mutunga kore. E tika ana kia whānau mai ngā tamariki i raro i te hononga mārena, ā
  ka whakatipuria e te pāpa me te māma, nā rāua anō aua oati mārena i pupuri mārika mai. Kia noho hari
  te whānau, ka tū ki runga i ngā akomanga a te Ariki i a Ihu Karaiti. Ka angitū ngā mārena, ngā whānau
  anō hoki ina tū ki runga i ngā mātāpono pēnei, he whakapono, he karakia, he rīpenata, he murunga hara,
  he kauanuanu, he aroha, he māhaki, he mahi, ā he hākinakina ora hoki. Nā runga i te hanganga Atua, me
  noho tumuaki ngā pāpa i ō rātou whānau i raro i te aroha me te tika, otirā hei tā rātou, he tuku i ngā
  hua o te ora me te whakahaumaru i ō rātou whānau. Hei tā ngā māma haepapa matua, he tiaki i ā rātou
  tamariki. I ēnei haepapa tapu, me mahi tahi a pāpa me māma hei hoa taurite. Mehemea he hauā, he mate,
  he mea kē atu rānei me panoni hei tāna i pai ai. Me tiaki tonu te whānau whānui i te wā e tika ana.
- E whakatūpato ana mātou ki te tangata nāna ēnei kawenata hē-kore i takahi, nāna anō tāna hoa atawhai
  me āna tamariki i tūkino, otirā nāna ēnei haepapa ā whānau i whakakore, ā nāwai rā ka tū whai utu i
  mua i te Atua. Waihoki, e whakatūpato ana mātou ka pā mai ngā parekura kua matekitetia e ngā poropiti
  onamata me ngā mea o naianei ki ngā tāngata, ki ngā hapori me ngā iwi i te wehenga o te whānau.
- E karanga ana mātou ki ngā tāngata tika me ngā āpiha nō ngā kāwanatanga katoa kia whakatairangatia i
  ngā mahi e whakakaha ana i te whānau hei tōpūtanga matua mō te hapori.
