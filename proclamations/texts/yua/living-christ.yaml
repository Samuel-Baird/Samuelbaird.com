title: Le Kuxaʼan Cristo
subtitle: U Tsʼáajaajil le Apostoloʼob
author: U Najil Jesucristo tiʼ le Maʼalob Wíinikoʼob tiʼ le Tsʼook Kʼiinoʼob
paragraphs:
- Utiaʼal kʼimbesik u síijil Jesucristo uchaak kaʼapʼéel mil jaʼaboʼob, ik aʼalik ik tsʼáajaajil tiʼ u
  jach jaajil U kuxtal minaʼan u jeel bixeʼ yéetel tiʼ u yutsilil minaʼan u xuul tiʼ U nojoch toksajil
  táambesaj. Mix u jéel wíinik u beetmaj jumpʼéel maʼalob taan péeksil yóokʼol tuláakal máaxoʼob kuxaʼan
  kaʼacheʼ, beʼoraʼeʼ yéetel máaxoʼob ku kuxtaloʼob yóokʼol le luʼumaʼ.
- Letiʼeʼ leteʼ Nojoch Jehova tiʼ le Úuchben Tsʼíibiltʼaan, u Mesiasiʼ tiʼ le Túumben Tsʼíibiltʼaan. Túuxtaʼan
  tuméen U Yuum, Letiʼ makʼantej le luʼumaʼ. “Tu yoʼolal letiʼeʼ beetaʼabiʼ tuláakal baʼaloʼob. Tiʼ le
  baʼaloʼob yanoʼoboʼ mixbaʼal beetaʼan wa maʼ tu yoʼolal letiʼ” (Juan 1:3). Kex minaʼan u kʼebaneʼ okjaʼanajiʼ
  yoʼolal u beetaʼaj tuláakal baʼal tu beel. “Bix máanik xan letiʼeʼ […] u beetik uts” (Hechos 10:38),
  baʼaleʼ pʼeektaʼabij yoʼosak. U Maʼalob Péeksil jumpʼéel tʼaan jetsʼóolal yéetel maʼalob óolal. Letiʼeʼ
  tu kʼáat óoltaj tiʼ tuláakal kaʼ beetak baʼax tu kaʼansaj. Tu xíimbaltaj u beeliloʼob Palestina, tu
  tsʼakaj kʼojaʼanoʼob, tu beetaj u paakat le chʼoopoʼoboʼ yéetel tu beetaj u líikʼil le kíimenoʼoboʼ.
  Tu kaʼansaj u jaajil mantatsʼ kʼiin, u jaajil kaʼalikil síijil tik kuxtalil, le u baʼax yoʼosak ik kuxtalil
  yóokʼol le luʼumaʼ yéetel le páajtalil yaan tiʼ u paalaloʼob Yuumtsil teʼ kuxtal ku taaloʼ.
- Tu tsʼáaj le Kiliʼich Jaanal bey kʼaʼajsajil tiʼ U nojoch toksajil táambesaj. Kʼaʼaxij yéetel kʼaʼalij
  tuméen taʼak u pool yéetel tuusil, aʼalaʼab yaan u siʼipil yoʼolal u kiʼimakunsaʼal u yóol le múuchʼ
  máakoʼoboʼ, aʼalaʼabeʼ yaan u kíimil teʼ kʼatalcheʼoʼ teʼ Calvario. Letiʼeʼ tu tsʼáaj U kuxtalil yoʼosak
  u luʼukʼsik u kʼebanoʼob tuláakal wíinik. Tu tsʼáaj U kuxtalil bey nojoch síibal utiaʼal u yutsilil
  tuláakal le máaxoʼob ku kuxtal teʼ luʼumaʼ.
- Ik aʼalik jach tu jaajil u kuxtal Letiʼeʼ, kʼambeʼenil tiʼ u tsʼíibil kuxtalil tuláakal wíinik, maʼ
  chúun teʼ Belenoʼ mix tsʼoʼok teʼ Calvarioʼ. Letiʼeʼ u Yáax Paalil Yuum, Juntúuliliʼ Paal tiʼ u bakʼeʼ,
  u Toksajil le yóokʼolkab.
- Letiʼeʼ líikʼ teʼ muknaloʼ u yáaxil tiʼ le kíimenoʼoboʼ (ileʼex 1 Corintios 15:20). Bey le Kʼuj Kaʼ
  Kuxlajiʼ, xíimbalnaj ichil le máax tu yáabiltaj kaʼach kuxaʼaneʼ. Bin u xíimbalt U “láakʼ tamanoʼob”
  (Juan 10:16) tiʼ le úuchben Americaoʼ. Teʼ túumben yóokʼolkabaʼ, Letiʼ yéetel U Yuumeʼ chíikpajoʼob
  tiʼ le táankelem Jose Smith, bey chúunik le baʼax aʼalaʼan yaʼab u tʼéenel tiʼ le kʼiinjaʼaboʼob yaan
  u yúuchul ken kʼuchuk u kʼiinil (ileʼex Efesios 1:10).
- 'Tiʼ le Kuxaʼan Cristoʼ, le aj bóobat Josejoʼ tu tsʼíibtaj: “U yichoʼobeʼ bey chakjopeʼen kʼáakʼeʼ;
  u tsʼoʼotsel u pooleʼ saak bey sen bateʼ; u paakateʼ ku sen letsʼbal mas ket u sáasil le kʼiinoʼ; yéetel
  u tʼaaneʼ bey u yáambal yaʼab jaʼiloʼobeʼ bey u tʼaan Jehova túunoʼ, ku yaʼalik:'
- “Teeneʼ u yáaxil yéetel u tsʼook; kuxaʼanen, kíinsaʼaben; teeneʼ kin wáantikeʼex tu táan Yuum” (K y
  N 110:3–4).
- 'Yoʼolal Letiʼeʼ, tu yaʼalaj xan le Aj bóobatoʼ: “Beʼoraʼeʼ u tsʼook tiʼ yaʼab jaajiltʼaanoʼobeʼ tsʼáajaʼan
  tu yoʼolal leteʼ jaajil tʼaanaʼ, u tsʼook tiʼ tuláakal, kik tsʼáaik tu yoʼolal: ¡Kuxaʼan!'
- “Tuméen tik ilajeʼ, beyoʼ tu noʼoj Yuumtsileʼ; tik uʼuyaj u jaajil tʼaan letiʼeʼ Juntúuliliʼ Paal tiʼ
  u Yuum—
- “yoʼolal letiʼ, tuméen letiʼ, utiaʼal letiʼeʼ yaan le yóokʼolkaboʼoboʼ, máakʼantaʼaboʼob xaneʼ, yéetel
  síijoʼob u kajnáaliloʼob bey paalaloʼob utiaʼal Yuumtsil” (K y N 76:22–24).
- Ik aʼalik tiʼ jach noj tʼaanoʼobeʼ U sacerdocioil yéetel U Najil Kʼujeʼ tsʼokaʼan u kaʼ yaantal yóokʼol
  le luʼumaʼ, beetaʼan yóokʼol u chúunpakʼil tiʼ apostoloʼob yéetel aj bóobatoʼob, u noʼojaʼan tuunichil
  le chuumpakʼoʼ layliʼ Jesucristoeʼ (ileʼex Efesios 2:20).
- Ik tsʼáaik jaajil Letiʼeʼ bíin kaʼ suunak teʼ luʼumaʼ. Yaan u yeʼesik u nojbeʼenil Jehova, yéetel tuláakal
  baʼal kuxaʼaneʼ muuchʼil yaan u yilik (ileʼex Isaias 40:5). Yaan u beetik u nojochil bey Ajaw tiʼ ajawoʼobeʼ,
  yaan u jbejaltik bey Kʼuj tiʼ kʼujoʼobeʼ, yéetel tuláakal píixeʼ yaan u xoltal, yéetel tuláakal waakʼeʼ
  bíin tʼaanak utiaʼal u kúult tu Táan. Tuláakal toʼoneʼ yaan ik yaantal utiaʼal pʼisóoltaʼal tuméen Letiʼ
  yoʼolal baʼax ik beetmaj yéetel baʼax tik tsʼíiboltaj tik puksiʼikʼal.
- Kik tsʼáaik jaajil, bey U apostoloʼon tsʼáajaʼan u kuuchoʼob, Letiʼeʼ Jesus le Kuxaʼan Cristo, le maʼ
  kíimilil Paal tiʼ Yuumtsil. Letiʼeʼ le nojoch Ajaw Emanuel, bejlaʼeʼ tiʼan tu noʼoj U Taataeʼ. Letiʼeʼ
  u sáasilil, u kuxtalil yéetel u yalabóolil yóokʼolkab. U beeleʼ leteʼ ku bisik tiʼ kiʼimak óolal tiʼ
  le kuxtalaʼ yéetel le minaʼan u xuul kuxtalil teʼ yóokʼolkab ku taaloʼ. Níib óolal tsʼáabak tiʼ Yuumtsil
  yoʼosak u tsʼáabilaj minaʼan u jeel bix tiʼ u kʼujul Paal.
