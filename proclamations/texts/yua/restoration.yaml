retrieved: '2026-11-02'
title: Tsʼoʼok u Kaʼayantal u Chukaʼanil u Maʼalob Péeksil Jesucristo
subtitle: Le Tsʼáaj Ojéetbil tiʼ le Yóokʼolkab tiʼ u 200 Jaʼabil
author: Le Yáax Noj Poolil yéetel u Múuchʼil le Kaʼalajun Apostoloʼob tiʼ U Najil Jesucristo tiʼ le Maʼalob
  Wíinikoʼob tiʼ le Tsʼook Kʼiinoʼob
note: Le noj pool Russell M. Nelson tu xokáaj le tsʼáaj ojéetbilaʼ tiʼ u chuukil u tʼaan tiʼ Jaʼabil Tuláakal
  Muchʼtalil 190, yaanchaj tiʼ 5 tiʼ kan wiʼinal tiʼ 2020 teʼ Salt Lake City, Utah, teʼ EE. UU.
paragraphs:
- Jach kik tsʼáaik ojéetbil Yuumtsileʼ u yaakuntmaj U paalaloʼob teʼ tuláakal luʼumil yóokʼolkabaʼ. Yuumtsil
  le Taataoʼ u tsʼáamaj toʼon le kʼujul síijil, le minaʼan u jeel kuxtalil yéetel le toksaj tambesaj minaʼan
  u xuul yoʼolal U Yaakunaj Paal Jesucristo. Yoʼolal u páajtalil le Taataoʼ, Jesuseʼ kaʼa kuxlajiʼ yéetel
  tu wekʼaj le kíimiloʼ. Letiʼeʼ ik Toksajil, ik Weʼesajil yéetel ik Áantajil.
- Tsʼoʼok u máan doscientos jaʼaboʼob, tiʼ jumpʼéel kíichkelem jaʼatskab yáaxkʼiinoʼ tiʼ 1820, le táankelem
  Jose Smithoʼ, taakchaj u yojéeltik tiʼ máakalmáak najil Kʼuj kʼanaʼan u núupkubaj. Bin túun payalchiʼ
  teʼ kʼáax maʼ náach tiʼ u yotoch, tu xamáan tiʼ u luʼumil Nueva York teʼ Estados Unidos, tuméen taak
  u yojéeltik bix jeʼel u toksaʼaj u pixan, u yoojel xan Yuumtsileʼ yaan u yeʼesik tiʼ.
- Yéetel kaambal óolaleʼ, kik aʼalikeʼ u payalchiʼeʼ núukaʼabiʼ, Yuumtsil le Taatáa yéetel U Paal Jesucristoeʼ
  chikpajoʼob tiʼ Jose, beytúun Letiʼobeʼ tu chúunsajoʼob u kaʼa yaantal tuláakal baʼaloʼob (ileʼex Hechos
  3:21) jeʼel bix aʼalaʼab teʼ Bibliaoʼ. Yoʼosak le baʼax tu yilajoʼ, tu yojéeltaj Jose u Najil Cristo
  tiʼ u kʼiinil Túumben Tsʼíibiltʼaaneʼ xuʼul teʼ yóokʼol luʼumaʼ kaʼ tsʼoʼok u kíimil le yáax apostoloʼoboʼ.
  Josejeʼ yaʼab baʼal tu beetaj yoʼolal u kaʼa yaantal.
- Kik jaajkuntik kaʼaten u tʼaan le Taatáa yéetel U Paal, teʼ kaʼanoʼoboʼ taaloʼob taasaj tʼaanoʼob utiaʼal
  u kaʼansikoʼob Jose, utiaʼal xan u jeetsʼkuntikoʼob u Najil Jesucristo. Le kaʼa kuxaʼan Juan Bautista
  tu kaʼa taasaj le páajtalil utiaʼal le okjaoʼ ichil jaʼ utiaʼal u luʼusaj kʼeban. Le óoxtúul tiʼ le
  kaʼalajun yáax apostoloʼob—Pedro, Santiago yéetel Juaneʼ—tu kaʼa taasoʼob le apostolil yéetel le yabeʼob
  tiʼ u páajtalil tiʼ le sacerdocioil. Taal u jeeloʼob xan, ichileʼ tiʼan Elias le Aj bóobatoʼ, le máax
  tu kaʼa taasaj u páajtalil utiaʼal u tsaykubaj láakʼtsilil ku bin kʼiin, ku kʼaxkubaʼob minaʼan u xuul
  kex kíimikoʼ.
- 'Kik tsʼáaik xan jaajiltʼaan tsʼáab tiʼ Jose Smith u síibalil yéetel u páajtalil le Yuumtsil utiaʼal
  u suut tsʼíibtik le úuchben tsʼíiboʼoboʼ: U Áanalteʼil Mormoneʼ, U Láakʼ Tsʼíibiltʼaan Jesucristo. Ichil
  le wáaloʼob tiʼ le kʼuyel tsʼíibaʼ yaan u xookil u kaʼansajil Jesucristo ichil le wíinikoʼob way luʼumeʼ
  tuʼux yaanoʼon bejlaʼeʼ chéen pʼéel U Kaʼakuxtaloʼ. Le áanalteʼoʼ ku kaʼansik u yoʼosakil le kuxtalaʼ
  yéetel ku tsolik u kaʼansajil Cristo, le kaʼansajilaʼ jach kʼabéet utiaʼal le jeʼelaʼ. Bey jumpʼéel
  kʼuyel chuuk tsʼíibil utiaʼal le Bibliaoʼ, le Áanalteʼil Mormonoʼ ku yaʼalikeʼ toʼoneʼ u paalaloʼon
  ik Jkaʼanil Taatáa, ku yáakuntikoʼon. Ku yaʼalik xaneʼ Letiʼeʼ yaan jumpʼéel kʼujul tuukul utiaʼal ik
  kuxtal yéetel U Paal Jesucristoeʼ ku tʼaankoʼon bejlaʼeʼ, bey tu beetaj teʼ úuchben kʼiinoʼoboʼ.'
- Kik aʼalik U Najil Jesucristo tiʼ le Maʼalob Wíinikoʼob tiʼ le Tsʼook Kʼiinoʼob, chúunsabij tiʼ 6 tiʼ
  kan wiʼinal tiʼ 1830, leteʼ u Najil Cristo tsʼáab tu kaʼatéen bey tu kʼiinil Túumben Tsʼíibiltʼaan.
  U Najil Kʼujaʼ makʼantaʼan yóokʼol U toj kuxtalil Jesucristo, Letiʼeʼ u noj tuunichil le chuun pakʼoʼ,
  yóokʼol U Toksajil minaʼan u xuul, yóokʼol U jaajil Kaʼakuxtal. Jesucristoeʼ tu tʼaanaj tu kaʼatéen
  U apostoloʼob kaʼ tu tsʼáaj tiʼob u páajtalil tiʼ le sacerdocio. Letiʼeʼ ku tʼaanik tuláakal kaʼ taakoʼon
  tu Najil utiaʼal ik kʼamik le Kiliʼich Pixanoʼ, u tsolmeyajiloʼob, áantajil yéetel kiʼ óolal minaʼan
  u xuul.
- Tsʼoʼok u máan doscientos jaʼaboʼob, kaʼ tu chunoʼob le Kaʼayantal tuméen Yuumtsil le Taataoʼ yéetel
  U Yaakunaj Paal Jesucristo. Yaʼabkach wíinikoʼob tuláakal yóokʼolkabeʼ tsʼoʼok u kʼamkoʼob u kʼajóolalil
  tiʼ le baʼaloʼob aʼalaʼan úuchilak.
- Yéetel kiʼimak óolal kik aʼalikeʼ le Kaʼayantal aʼalaʼanoʼ túun bíin u nojochtal yéetel yeʼesil tiichʼkʼiin.
  Le luʼumaʼ tsʼoʼok u kʼéexpajal tuméen Yuumtsileʼ yaan u muuchʼkintik tuláakal baʼaloʼob tiʼ Cristo
  (ileʼex Efesios 1:10).
- Yéetel chíimpoolil yéetel níibóolalil, bey U apostoloʼobeʼ kik tʼaanik tuláakal wíinikoʼob kaʼ u yojéeltoʼob—bey
  ik ojel toʼoneʼ—le kaʼanoʼ jekʼaboʼob. Kik kaʼa aʼalik Yuumtsileʼ táan u tsʼáaik ojeltbiʼ U yóolal utiaʼal
  u yaakunaj paalaloʼob. Kik jaajkuntik le máaxoʼob kʼamik yéetel pixanil payalchiʼeʼ u kaʼansajil le
  Kaʼayantal yéetel u beetoʼob yéetel oksajóolal yaan u kiʼikiʼitʼaaniloʼob utiaʼal u kʼamkoʼob u jaajiltʼaanoʼob
  tiʼ le kʼujul yéetel u yoʼosakil utiaʼal u liʼiskubaʼ le yóokʼolkabaʼ utiaʼal le Kaʼa Suut aʼalaʼan
  yóokʼol le Kʼuj ik Toksaj Jesucristo.
