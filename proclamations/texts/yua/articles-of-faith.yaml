title: Le Tsoltsʼíibil Tʼaanoʼob tiʼ Oksaj Óol
subtitle: tiʼ U Najil Jesucristo tiʼ Maʼalob Wíinikoʼob tiʼ le Tsʼook Kʼiinoʼob
author: ''
verses:
- n: 1
  text: Yaantoʼon óolal tiʼ Yuumtsil, Yuum Minaʼan u Xuul, yéetel tiʼ U Paal Jesucristo, yéetel tiʼ le
    Kiliʼich Pixanoʼ.
- n: 2
  text: Yaantoʼon óolal le wíinikoʼoboʼ yaan u toʼopoloʼob yoʼosak u kʼebanoʼob, maʼ tu yoʼolal u maʼ
    uʼuyaj tʼaan Adaniʼ.
- n: 3
  text: Yaantoʼon óolal jeʼel u beytal u yáantikubaʼob tuláakal wíinik yoʼosak u Toksajil Cristo, wa ku
    yuʼubikoʼob tʼaan tiʼ u aʼalmajtʼaanil le Maʼalob Péeksiloʼ yéetel u tsolmeyajiloʼob.
- n: 4
  text: 'Yaantoʼon óolal u yáax chúunpajaliloʼob yéetel tsolmeyajiloʼob tiʼ le Maʼalob Péeksiloʼ leloʼobaʼ:
    yáax, oksajóol tiʼ Kʼuj Jesucristo; kaʼa, yajóolal; óox, okjaʼ ichil jaʼ utiaʼal u luʼusaʼal kʼeban;
    kan, ku tsʼáabal kʼab yóokʼol pool utiaʼal u tsʼáabal u síibal le Kiliʼich Pixanoʼ.'
- n: 5
  text: Yaantoʼon óolal juntúul máakeʼ kʼaʼanaʼan u tʼaʼanaj tuméen Yuumtsil, yéetel ajbóobattʼaanil yéetel
    tsʼáalbil kʼab yóokʼol pool tuméen máax yaan tiʼ u páajtalil yoʼosak u beytal u tseʼektaʼal le maʼalob
    péeksil beyxan u beetaʼal u tsolmeyajiloʼob.
- n: 6
  text: Yaantoʼon óolal tiʼ u wíinkilil Najil Kʼujeʼ bey yaanchaj úuchileʼ, leʼeloʼobaʼ, apostoloʼob,
    aj bóobatoʼob, aj kanan tamanoʼob, aj kaʼansajiloʼob, aj tseʼek péeksiloʼob yéetel u jeeloʼob.
- n: 7
  text: Yaantoʼon óolal tiʼ síibal tʼaanil, ajbóobattʼaanil, weʼesil, náayoʼob, tsʼaakiloʼob, suuttʼaaniloʼob
    yéetel u jeeloʼob.
- n: 8
  text: Yaantoʼon óolal le Bibliaoʼ leteʼ u tʼaan Yuumtsil, tak tuʼux suuttsʼíibtaʼan uts; beyxan yaantoʼon
    óolal le Áanalteʼil Mormonoʼ leteʼ u tʼaan Yuumtsil.
- n: 9
  text: Yaantoʼon óolal tuláakal baʼax eʼesaʼan tuméen Yuumtsileʼ, tuláakal baʼax ku yeʼesik bejlaʼeʼ.
    Beyxan yaantoʼon óolal yaan u yeʼesik yaʼab páaybeʼen nojoch baʼaloʼob tu Ajawil Yuumtsil.
- n: 10
  text: Yaantoʼon óolal yaan u kaʼ muulkintaʼal u kaajil Israel yéetel u yutskintaʼal le Lajun Tribuʼob;
    Sion le Túumben Jerusaleneʼ yaan u liʼisaʼal yóokʼol u luʼumil America; Cristoeʼ yaan u ajbejaltik
    yóokʼol le luʼumaʼ, yaan u túumbenkunsaʼal le luʼumaʼ yéetel yaan u kʼamik u nojbeʼenil bey kiʼichkelem
    luʼumeʼ.
- n: 11
  text: 'Kik kʼáatik u najmalil utiaʼal kultik Yuumtsil, máax yaan tuláakal páajtalil tiʼ jeʼel bix ik
    naʼatik tik wóoleʼ, kik tsʼáaik xan tiʼ tuláakal wíinik layliʼ le najmalilaʼ: kaʼ u kultoʼob jeʼel
    bix u kʼáatoʼobeʼ, jeʼel tuʼuxeʼ wa baʼax u kʼáatoʼobeʼ.'
- n: 12
  text: Yaantoʼon óolal chíimpoltik le ajawoʼob, pooliloʼob, jalachoʼob yéetel poopoʼob; beyxan tiʼ uʼuyaj
    tʼaan, tiʼ tsíik yéetel láatʼ le aʼalmajtʼaanoʼ.
- n: 13
  text: 'Yaantoʼon óolal tiʼ tsíikbeʼenil, tiʼ tsʼáaj jaajil, cheʼenil, maʼalobil, utsilil yéetel beetik
    uts tiʼ tuláakal wíinik; u jaajileʼ, ku beytal ik waʼalikeʼ kik beetik u tʼaan Pablo: Tuláakal kik
    óoltik, kik paʼatik; ik mukʼyajmaj yaʼab baʼaloʼob, kik paʼatik u beytal ik mukʼyajtik tuláakal baʼaloʼob.
    Wa yaan baʼax uts, wa jatsʼuts, wa maʼalob yóoleʼ, wa tsikbeʼen u kiʼikiʼi tʼaʼanleʼ, lelaʼ kik kaxtik.'
signature: Jose Smith.
