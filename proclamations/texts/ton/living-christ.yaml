title: Ko e Kalaisi Moʻuí
subtitle: Ko e Fakamoʻoni ʻa e Kau ʻAposetoló
author: Ko e Siasi ʻo Sīsū Kalaisi ʻo e Kau Māʻoniʻoni ʻi he Ngaahi ʻAho Kimui Ní
paragraphs:
- Iheʻetau fakamanatua hono ʻaloʻi ʻo Sīsū Kalaisi he taʻu ʻe uaafe kuo hilí, ʻoku mau fakahoko atu ai
  ʻemau fakamoʻoni ki he moʻoni ʻo ʻEne moʻui taʻe ma-fakatatauá, pea mo e haohaoa ʻo ʻEne feilaulau fakalelei
  maʻongoʻongá. Kuo teʻeki ke ʻi ai ha taha kuo ʻi ai hano mālohi pehē kia kinautolu kotoa kuo moʻui,
  pe ʻe moʻui he funga ʻo māmaní.
- Ko e Sihova Maʻongoʻonga ia ʻo e Fuakava Motuʻá, ko e Mīsaia ia ʻo e Fuakava Foʻoú. Fakatatau mo e fakahinohino
  ʻa ʻEne Tamaí, naʻá Ne hoko ai ko e Tupuʻanga ʻo e māmaní. “Naʻe ngaohi ʻe ia ʻa e meʻa kotoa pē; pea
  naʻe ʻikai ha meʻa ʻe ngaohi kae ʻiate ia pē” (Sione 1:3). Neongo naʻe ʻikai haʻane angahala, ka naʻe
  papitaiso Ia ke fakakakato ʻa e māʻoniʻoni kotoa pē. Naʻe “faʻa feʻaluaki ʻo fai lelei” (Ngāue 10:38),
  ka naʻe fehiʻanekina ai ia. Ko ʻene ongoongoleleí ko ha pōpoaki ia ʻo e melino mo e ʻaloʻofa. Naʻá ne
  kōlenga ʻa e taha kotoa ke muimui ange ʻi Heʻene sīpingá. Naʻá Ne fononga foki ʻi he ngaahi hala ʻo
  Pālesitainé, fakamoʻui ʻa e mahakí, fakaʻā ʻa e kuí, pea mo fokotuʻu ʻa e maté. Naʻá ne akoʻi hono moʻoni
  ʻo ʻitānití, ʻa hono moʻoni ʻo ʻetau tomuʻa moʻui ki muʻa ʻi he teʻeki ke ʻi ai ʻa e māmaní, ʻa e taumuʻa
  ʻo ʻetau moʻui ʻi he māmaní, pea mo e malava ke tau hoko ko e ngaahi foha mo e ngaahi ʻofefine ʻo e
  ʻOtuá, ʻi he moʻui ka hoko maí.
- Naʻá Ne fokotuʻu ʻa e sākalamēnití ko ha fakamanatu ʻo ʻEne feilaulau fakalelei maʻongoʻongá. Naʻe puke
  pōpula ia pea tukuakiʻi ʻi ha ngaahi meʻa loi, pea tautea ia ke fakatōliaʻi ʻa e kau fakatangá, pea
  tautea ai ke ne pekia ʻi he kolosi ʻi Kalevalé. Ne Ne foaki ʻEne moʻuí ko ha fakalelei ki he ngaahi
  angahala ʻa e faʻahinga ʻo e tangatá kotoa. Ne hoko ia ko ha meʻaʻofa -maʻongoʻonga ko e fakafofonga
  ʻo e kakai kotoa pē ʻe faifaiangé pea moʻui ʻi he funga māmaní.
- ʻOku mau fakamoʻoni ʻi he loto māluʻia ko ʻEne moʻuí, ʻa ia ʻoku mahuʻinga fau ki he hisitōlia kotoa
  ʻo e tangatá, naʻe ʻikai kamata ia ʻi Pētelihema pe ʻosi ʻi Kalevale. Ko e ʻAlo Lahi Taha ia ʻo e Tamaí,
  ko e ʻAlo pē Taha ne Fakatupu ʻi he kakanó, ko e Huhuʻi ʻo e māmaní.
- Naʻe toetuʻu ia mei he faʻitoká ke ne “hoko ia ko e ʻuluaki fua ʻo kinautolu naʻe mohé” (1 Kolinitō
  15:20). ʻI Heʻene hoko ko e ʻEiki kuo Toetuʻú, ne ʻaʻahi ai ki he lotolotonga ʻo kinautolu Ne ʻofa ai
  ʻi he moʻui ní. Naʻe toe ngāue foki ʻi he lotolotonga ʻo ʻEne “fanga sipi kehe” (Sione 10:16) ʻi he
  kuonga muʻá ʻi ʻAmelika. ʻI hotau kuongá ni, ne hā ai mo ʻEne Tamaí ki he kiʻi tamasiʻi ko Siosefa Sāmitá,
  ʻo ne fakafeʻao mai ai ʻa e talaʻofa ko ia ne fai fuoloa ko e “kuonga ʻo e kakato ʻo e ngaahi kuongá”
  (ʻEfesō 1:10).
- 'Naʻe fakamatalaʻi ʻe he Palōfita ko Siosefá ʻa e Kalaisi Moʻuí ʻo pehē: “Naʻe tatau ʻa hono ongo fofongá
  mo e ulo ʻo e afi; naʻe hinehina ʻa e louʻulu ʻo hono ʻulú ʻo hangē ko e sinou maʻa; naʻe ulo ʻa hono
  fofongá ʻo mahulu ange ʻi he ngingila ʻo e laʻaá; pea naʻe tatau ʻa hono leʻó mo e tafe mālohi ʻo e
  ngaahi vai lahi, ʻio ʻa e leʻo ʻo Sihová, ʻoku folofola:'
- “Ko au ko e ʻuluakí mo e ki muí; ko au ia ʻa ia ʻoku moʻuí, ko au ia ʻa ia naʻe fakapōngí; ko au homo
  taukapo ki he Tamaí” (T&F 110:3–4).
- 'Naʻe toe pehē foki ʻe he Palōfitá fekauʻaki mo Ia: “Pea ko ʻeni, hili ʻa e ngaahi fakamoʻoni lahi kuo
  fai ʻo kau kiate iá, ko e fakamoʻoni fakamuimui taha ʻeni, ʻa ia ʻokú ma fai ʻo kau kiate iá: ʻOkú ne
  moʻui!'
- “He naʻá ma mamata kiate ia, ʻio ʻi he toʻukupu toʻomataʻu ʻo e ʻOtuá; peá ma fanongo ki he leʻo ʻoku
  fakamoʻoniʻi ko ia ʻa e ʻAlo pē Taha naʻe Fakatupu ʻo e Tamaí—
- “Pea ʻoku fakatupu pea naʻe fakatupu ʻe ia, pea ʻiate ia, pea meiate ia, ʻa e ngaahi māmá, pea ko hono
  kakai ʻo iá ko e ngaahi foha mo e ngaahi ʻofefine kuo fakatupu ki he ʻOtuá” (T&F 76:22–24).
- ʻOku mau fakahaaʻi ʻi he lea fakamātoato kuo ʻosi fakafoki mai Hono lakanga fakataulaʻeikí mo Hono Siasí
  ki he funga māmaní—“pea kuo fokotuʻu ki he tuʻungá … ʻa e kau ʻaposetolo mo e kau palōfita, ko hono
  fuʻu makatulikí ʻa Sīsū Kalaisi pē” (ʻEfesō 2:20).
- ʻOku mau fakamoʻoni ʻe ʻi ai ʻa e ʻaho ʻe toe hāʻele mai ai ki he māmaní, “Pea ʻe fakahā ʻa e nāunau
  ʻo [e ʻEikí], pea ʻe mamata ki ai ʻa e kakai kotoa pē” (ʻĪsaia 40:5). Te Ne pule ia ko e Tuʻi ʻo e Ngaahi
  Tuʻi mo e ʻEiki ʻo e Ngaahi ʻEiki, pea ʻe peluki ʻa e tui kotoa pē, mo vete ʻa e ʻelelo kotoa ʻi heʻenau
  hū kaite Iá. Te tau tuʻu takitaha kotoa pē ke Ne fakamāuʻi ʻo fakatatau mo ʻetau ngaahi ngāué pea mo
  e ngaahi holi ʻa hotau lotó.
- ʻOku mau fakamoʻoni, ʻi heʻemau hoko ko ʻEne kau ʻAposetolo moʻoni kuo ʻosi fakanofó—ko Sīsuú ko e Kalaisi
  Moʻuí Ia, ko e ʻAlo taʻe faʻamate ʻo e ʻOtuá. Ko e Tuʻi Maʻongoʻonga ia ko ʻImānuelá, ʻoku tuʻu he ʻahó
  ni ʻi he toʻomataʻu ʻo ʻEne Tamaí. Ko Ia ʻa e maama, mo e moʻui, pea mo e ʻamanaki leleiʻanga ʻo e māmaní.
  Ko Hono ʻalungá, ko e hala ia ʻoku fakatau ki he fiefia ʻi he moʻui ko ʻení pea mo e moʻui taʻengata
  ʻi he maama ka hoko maí. Fakafetaʻi ki he ʻOtuá ʻi Heʻene meʻaʻofa taʻe ma-fakatataua mai ʻaki Hono
  ʻAlo fakalangí.
