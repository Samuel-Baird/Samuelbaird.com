retrieved: '2026-11-02'
title: Obnova polnosti evangelija Jezusa Kristusa
subtitle: Razglas svetu ob dvestoletnici
author: Prvo predsedstvo in svet dvanajstih apostolov Cerkve Jezusa Kristusa svetih iz poslednjih dni
note: Predsednik Russell M. Nelson je ta razglas prebral 5. aprila 2020 v delu svojega govora na 190.
  spomladanski generalni konferenci v Salt Lake Cityju v Utahu.
paragraphs:
- Svečano razglašamo, da Bog ljubi svoje otroke vseh narodov sveta. Bog Oče nam je dal božansko rojstvo,
  neprimerljivo življenje in neskončno odkupno žrtvovanje svojega ljubljenega Sina Jezusa Kristusa. Z
  Očetovo močjo je Jezus spet vstal in dosegel zmago nad smrtjo. On je naš Odrešenik, naš Vzornik in naš
  Odkupitelj.
- Mladi Joseph Smith, ki je želel vedeti, kateri cerkvi naj se pridruži, je nekega lepega pomladnega jutra
  leta 1820 pred dvesto leti šel molit v gozd blizu svojega doma v severnem delu države New York v ZDA.
  Imel je vprašanja glede odrešitve svoje duše in zaupal je, da ga bo Bog usmeril.
- Ponižno razglašamo, da sta se Josephu v odgovor na molitev prikazala Bog Oče in njegov Sin Jezus Kristus
  ter vpeljala »obnovo vsega« (gl. Apostolska dela 3:21), kot je bilo napovedano v Svetem pismu. V tem
  videnju je izvedel, da po smrti prvih apostolov Krustusove novozavezne Cerkve na zemlji ni bilo več.
  Joseph naj bi odigral bistveno vlogo pri povrnitvi le-te.
- Potrjujemo, da so pod vodstvom Očeta in Sina prišli nebeški glasniki, da bi poučili Josepha in ponovno
  ustanovili Cerkev Jezusa Kristusa. Vstali Janez Krstnik je obnovil polnomočje za krščevanje s potopitvijo
  za odpuščanje grehov. Trije od prvih dvanajstih apostolov – Peter, Jakob in Janez – so obnovili apostolstvo
  in ključe duhovniškega polnomočja. Prišli so še drugi, vključno z Elijem, ki je obnovil polnomočje,
  da se družine za večno povežejo v večnih odnosih, ki presegajo smrt.
- 'Nadalje pričujemo, da sta bila Josephu Smithu dana Božji dar in moč, da prevede starodavni zapis: Mormonovo
  knjigo – še eno zavezo Jezusa Kristusa. Strani tega svetega besedila vključujejo poročilo o osebnem
  delovanju Jezusa Kristusa med ljudstvi na zahodni polobli kmalu po njegovem vstajenju. Uči o namenu
  življenja in pojasni Kristusov nauk, ki je pri tem namenu osrednji. Mormonova knjiga, ki je tako kot
  Sveto pismo sveti spis, pričuje, da so vsa človeška bitja sinovi in hčere ljubečega Očeta v nebesih,
  da ima Oče božanski načrt za naše življenje in da njegov Sin Jezus Kristus govori danes prav tako, kakor
  je v starodavnih dneh.'
- Izjavljamo, da je Cerkev Jezusa Kristusa svetih iz poslednjih dni, ki je bila ustanovljena 6. aprila
  1830, obnovljena Kristusova novozavezna Cerkev. Ta Cerkev je zasidrana v popolnem življenju svojega
  glavnega vogalnega kamna, Jezusa Kristusa, in v njegovi neskončni odkupni daritvi ter dobesednem vstajenju.
  Jezus Kristus je ponovno poklical apostole in jim dal duhovniško polnomočje. Vse nas vabi, naj pridemo
  k njemu in v njegovo Cerkev, da prejmemo Svetega Duha, odrešilne uredbe in dosežemo trajno radost.
- Zdaj je preteklo dvesto let, odkar sta Bog Oče in njegov ljubljeni Sin Jezus Kristus začela to obnovo.
  Milijoni ljudi po vsem svetu so sprejeli spoznanje o teh prerokovanih dogodkih.
- Z veseljem izjavljamo, da se obljubljena obnova nadaljuje z nadaljnjimi razodetji. Zemlja ne bo nikoli
  več enaka, ker bo Bog »vse osredinil v Kristusu« (gl. Pismo Efežanom 1:10).
- Kot njegovi apostoli s spoštovanjem in hvaležnostjo prosimo vse, naj izvedo – kot vemo mi – da so nebesa
  odprta. Potrjujemo, da Bog razodeva svojo voljo za svoje ljube sinove in hčere. Pričujemo, da bodo tisti,
  ki v duhu molitve preučujejo sporočilo obnove in delujejo v veri, blagoslovljeni, da bodo dobili lastno
  pričevanje o njeni božanskosti in namenu, da svet pripravi na obljubljeni drugi prihod našega Gospoda
  in Odrešenika, Jezusa Kristusa.
