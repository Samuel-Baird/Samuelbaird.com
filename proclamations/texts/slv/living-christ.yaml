title: Živi Kristus
subtitle: Pričevanje apostolov
author: Cerkev Jezusa Kristusa svetih iz poslednjih dni
paragraphs:
- Ko se spominjamo rojstva Jezusa Kristusa pred dvema tisočletjema, pričujemo o dejanskosti njegovega
  neprimerljivega življenja in o neskončni moči njegove velike odkupne žrtve. Nihče drug ni imel tako
  močnega vpliva na vse, ki so živeli in bodo še živeli na zemlji.
- Bil je veliki Jehova Stare zaveze, Mesija Nove. Pod Očetovim vodstvom je bil stvarnik zemlje. »Vse je
  nastalo po [njem] in brez [njega] ni nastalo nič, kar je nastalo.« (Evangelij po Janezu 1:3) Čeprav
  je bil brez greha, se je krstil, da je izpolnil vso pravičnost. »Delal [je] dobra dela« (Apostolska
  dela 10:38), pa vendar so ga zaradi tega zaničevali. Njegov evangelij je bil sporočilo miru in dobre
  volje. Vse je rotil, naj sledijo njegovemu zgledu. Hodil je po poteh Palestine, zdravil bolne, slepim
  vračal vid in obujal mrtve. Učil je resnice večnosti, o dejanskosti predzemeljskega obstoja, o namenu
  življenja na zemlji in o zmožnostih Božjih sinov in hčera v prihodnjem življenju.
- Uvedel je zakrament kot opomin na svojo veliko odkupno žrtev. Prijeli so ga in obsodili z lažnimi obtožbami,
  spoznali za krivega, da bi zadovoljili drhal, in ga obsodili na smrt na kalvarijskem križu. Svoje življenje
  je dal, da bi odkupil grehe vsega človeštva. Njegov veliki posredniški dar je za dobro vseh, ki bodo
  kdaj živeli na zemlji.
- Svečano pričujemo, da se njegovo življenje, ki je osrednje v vsej človeški zgodovini, ni začelo v Betlehemu,
  niti se ni končalo na Kalvariji. Bil je Očetov Prvorojeni, edinorojeni Sin v mesu, Odkupitelj sveta.
- Vstal je iz groba, da bi postal »prvenec tistih, ki so zaspali« (Prvo pismo Korinčanom 15:20). Kot vstali
  Gospod se je prikazal tistim, ki jih je v življenju imel rad. Deloval je tudi med svojimi »drugimi ovcami«
  (gl. Evangelij po Janezu 10:16) v starodavni Ameriki. V sodobnem svetu sta se z Očetom prikazala fantu
  Josephu Smithu in začela dolgo obljubljeno razdobje »polnosti časov« (Pismo Efežanom 1:10).
- 'O živem Kristusu je prerok Joseph zapisal: »Njegove oči so bile kot ognjeni plamen, njegovi lasje so
  bili beli kot beli sneg, njegovo obličje je žarelo bolj kot sijaj sonca in njegov glas je bil kot glas
  šumenja velikih voda, in sicer glas Jehova, rekoč:'
- Jaz sem prvi in zadnji; jaz sem ta, ki živi, jaz sem ta, ki je bil umorjen; jaz sem vaš zagovornik pri
  Očetu.« (Nauk in zaveze 110:3–4)
- 'O njem je prerok prav tako izjavil: »In sedaj, po številnih pričevanjih, s katerimi se je pričevalo
  o njem, je to pričevanje, poslednje od vseh, s katerim pričujeva o njem: Da živí!'
- Kajti videla sva ga, in sicer na Božji desnici; in slišala sva glas, ki je pričeval, da je Očetov Edinorojeni
  –
- da so in so bili z njim in preko njega in zaradi njega ustvarjeni svetovi in prebivalci le-teh so sinovi
  in hčere, rojeni Bogu.« (Nauk in zaveze 76:22–24)
- S svečanimi besedami razglašamo, da sta bila njegovo duhovništvo in njegova Cerkev na zemlji obnovljena
  – sezidana »na temelju apostolov in prerokov. Vogalni kamen pa je sam Kristus Jezus« (Pismo Efežanom
  2:20).
- Pričujemo, da se bo nekega dne vrnil na zemljo. »Razodelo se bo Gospodovo veličastvo in videlo ga bo
  hkrati vse meso.« (Izaija 40:5) Vladal bo kot Kralj kraljev in kraljeval kot Gospod gospodov in vsako
  koleno se bo upognilo in vsak jezik bo s čaščenjem govoril pred njim. Vsak od nas bo stal pred njim,
  da nam bo sojeno po delih in željah našega srca.
- Kot njegovi pravilno posvečeni apostoli pričujemo, da je Jezus živi Kristus, nesmrtni Božji Sin. Je
  veliki kralj Emanuel, ki danes stoji na Očetovi desnici. On je luč, življenje in upanje sveta. Njegova
  pot vodi do sreče v tem življenju in v večno življenje v prihodnem svetu. Bogu hvala za neprecenljivi
  dar njegovega božanskega Sina!
