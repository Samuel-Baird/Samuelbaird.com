title: Členi vere
subtitle: Cerkve Jezusa Kristusa svetih iz poslednjih dni
author: ''
verses:
- n: 1
  text: Verjamemo v Boga, Večnega Očeta, in v njegovega Sina, Jezusa Kristusa, in v Svetega Duha.
- n: 2
  text: Verjamemo, da bodo ljudje kaznovani za svoje grehe in ne zaradi Adamovega prestopka.
- n: 3
  text: Verjamemo, da bo zaradi Kristusove odkupne daritve vse človeštvo lahko odrešeno s poslušnostjo
    evangelijskim zakonom in uredbam.
- n: 4
  text: 'Verjamemo, da so prva evangelijska načela in uredbe: prvič, vera v Gospoda Jezusa Kristusa, drugič,
    kesanje, tretjič, krst s potopitvijo za odpuščanje grehov, četrtič, polaganje rok za dar Svetega Duha.'
- n: 5
  text: Verjamemo, da mora biti človek za pridiganje evangelija in izvajanje uredb le-tega poklican od
    Boga s preroštvom in s polaganjem rok tistih, ki imajo polnomočje.
- n: 6
  text: Verjamemo v enako ureditev, kot je obstajala v prvotni Cerkvi, in sicer v apostole, preroke, pastirje,
    učitelje, evangeliste in tako naprej.
- n: 7
  text: Verjamemo v dar jezikov, prerokovanja, razodetja, videnja, zdravljenja, tolmačenja jezikov in
    tako naprej.
- n: 8
  text: Verjamemo, da je Sveto pismo Božja beseda, kolikor je pravilno prevedeno; verjamemo tudi, da je
    Mormonova knjiga Božja beseda.
- n: 9
  text: Verjamemo vse, kar je Bog razodel, vse, kar razodeva sedaj, in verjamemo, da bo razodel še mnogo
    velikega in pomembnega, kar se nanaša na Božje kraljestvo.
- n: 10
  text: Verjamemo v dobesedno zbiranje Izraela in v obnovo desetih rodov; da bo Sion (Novi Jeruzalem)
    zgrajen na ameriški celini; da bo Kristus osebno kraljeval na zemlji; in da bo zemlja obnovljena in
    bo prejela rajsko slavo.
- n: 11
  text: Lastimo si privilegij, da vsemogočnega Boga častimo po glasu svoje vesti, isti privilegij pa priznavamo
    vsem ljudem, naj častijo kakor, kjer in kar želijo.
- n: 12
  text: Verjamemo, da moramo biti podložni kraljem, predsednikom, vladarjem in sodnikom; v poslušnost,
    spoštovanje in podpiranje zakona.
- n: 13
  text: Verjamemo, da moramo biti pošteni, resnicoljubni, neomadeževani, dobrohotni, krepostni in dobrotni
    do vseh ljudi; resnično lahko rečemo, da sledimo Pavlovemu opominu – vse verjamemo, vse upamo, vzdržali
    smo marsikaj in upamo, da bomo vzdržali vse. Če je kaj krepostnega, lepega ali na dobrem glasu ali
    hvalevrednega, to iščemo.
signature: Joseph Smith.
