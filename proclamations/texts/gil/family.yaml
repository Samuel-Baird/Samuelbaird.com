title: Te Utu
subtitle: Katanoata nakon te Aonaaba
author: Te Moan Beretitentii ao te Kauntira n Abotoro n te Tengaun ma Uoman n Ana Ekaretia Iesu Kristo
  ibukiia Aika Itiaki ni Boong aika Kaitira
note: Te katanoata aei e bon warekaki iroun Beretitenti Gordon B. Hinckley bwa mwakoron ana rongorongo
  n te Bootaki n Aine ni Kabuta ae karaoaki n Tebetembwa 23, 1995, i Salt Lake City, Utah.
paragraphs:
- Ngaira, te Moan Beretitentii ao te Kauntira n Abotoro ake Tengaun ma Uoman n Ana Ekaretia Iesu Kristo
  ibukiia Aika Itiaki ni Boong aika Kaitira, ti katanoata ma te kaantaninga ae tabu bwa te mareaki imarenan
  te mwaane ao te aine e katabuaki iroun te Atua ao te utu bon te bwai ae kakawaki nakon ana babaire te
  Tia Karikibwai ibukin aroia Natina.
- Ni kabane aomata—mwaane ao aine—a karikaki ni katotongan te Atua. Ngaiia n tatabemaniianako bon naati
  mwaane ao aine aika tamnei aika a tangiraki irouia aia karo ake i karawa, ao, n aron anne, ngaiia n
  tatabemania iai aroia ae moan te kakawaki ao te kakannato n aron bairean aroia n te aro n atua. Te Mwaane
  te Aine bon ngaia oin anuan temanna n te maiu n tamnei, n rabwata, ao kinakim ao te kaantaninga ae akea
  tokina.
- N te maiu are imwain te maiu n te aonaaba, naati mwaane ao aine aika tamnei a ataia ao a taromauria
  te Atua bwa Tamaia ae Akea Tokina ao a butimwaai Ana babaire n te aro are Natina a kona ni karekei rabwata
  ao te iriko ma te rara ao ni karekea aia atatai n aonaaba n rikirake nakon te kororaoi ao n tokina ana
  ataa aroia n te anua n Atua bwa ngaiia taani bwaina te maiu ae akea tokina. Ana babaire te Atua ibukin
  te kukurei e karekea te konaa irouia utu ni kateimatoa aia itoman imwiin naba te mate. Otenanti aika
  a tabu, ao berita aika tabu, ake a kona n reke n tembora aika tabu a karekea te anga ibukira n tatabemanira
  ni kona n oki nako rarikin te Atua, ao ibukia utu bwa a na katiteuanaaki n te tai ae akea tokina.
- Te moan tua are e anga te Atua nakon Atam ao Ewa bon ibukin are a na kona n riki ni karo ae mwaanenumwa
  ao ainenumwa. Ti katanoata bwa ana tua te Atua ibukiia Natina are a na rikirake ni mwaiti ao ni kaonrakea
  te aonaaba e teimatoa naba ni bwainaki ngkai. Ti katanoata riki bwa e a tia te Atua n tua bwa te mwaaka
  ae tabu ibukin te aro ni kariki ana ti kabongaki imarenan te mwaane ao te aine, ake a tia ni mareaki
  iaan te tua bwa te mwaanenumwa ao te ainenumwa.
- Ti katanoata aron te maiu ae mamate are e karikaki iai bwa e karaoaki n te mimitong ae tabu. Ti kamatoa
  tabun te maiu ao kakawakina inanon Ana babaire te Atua ae akea tokina.
- Te mwaanenumwa ao te ainenumwa iai tabeia ae mimitong ao n tabu n tangiria ao n tabeakiniia i bon irouia
  ao ibukiia natiia. “Ataei bon ana bwai n tituaraoi te Uea” (Taian Areru 127:3). Iai tabeia kaaro ae
  tabu ni kaikawaia natiia n te tangira ao te kororaoi, ni karekei bwaai ibukin kainnanoia n te aro n
  rabwata ao n tamnei, n reireiniia n tangira ao ni beku (ibukin temanna) i bon ibukiia, ni kawakin ana
  tua te Atua, ao n riki bwa aomata aika a kawakina te tua n taabo ake a maeka iai. Mwaanenumwa ao ainenumwa—tiina
  ao kaaro—a na boni bukintaeka imatan te Atua ibukin karaoan mwiokoaia aikai.
- Te utu e riki n tabu iroun te Atua. Te mare imarenan te mwaane ao te aine e kakawaki ibukin Ana babaire
  ae akea tokina. A bon riai ni bungiaki ataei nakoia kaaro ao tiina ake a tia ni mareaki raoi, ao ni
  kaikawaki iroun te karo ao te tina ake a kawakin aia berita ni mare ma te kakaonimaki ae kororaoi. Te
  kukurei n te maiu n utu e na kona n reke ngkana e aanaki n ana reirei te Uea ae Iesu Kristo. Maare ao
  utu aika nakoraoi a kateaki ao ni kateimatoaki iaon botoniango n te onimaki, te tataro, te rairannano,
  kabwarabure, karinerine, te tangira, te nanoanga, te beku, ao kakibotu aika itiaki. N aron ana babaire
  te Atua, kaaro boni ngaiia ake a na kairiri n te utu n te tangira ao te kororaoi ao bon tabeia ni karekei
  baika a riai ibukin te maiu ao ni kawakinia aia utu. Oin tabeia tiina bon tararuaia natina. Inanon mwiokoakiia
  aika tabu aikai, a katabeaki kaaro ao tiina bwa a na uaia ni ibuobuoki imarenaia bwa rao aika ti te
  arona ngaiia. Te toara, te mate, ke bwaai riki tabeua e kona temanna ni bita arona ni kangaraoia. Kaain
  te utu ake raoia a kona naba n anga aia ibuobuoki ngkana e kainnanoaki.
- Ti kauring bwa naake a urui berita aika tabu ibukin te itiaki, naake a kuaia buia ke natiia, ke naake
  aki kakoroi mwiokoaia ibukin aia utu a na bon bukintaeka ao a na tei n te tai teuana i matan te Atua.
  Ti kauringa riki, bwa uruakin ke maenakon te utu e na karekea nakoiia n tatabeman, bootaki, ao aaba
  n taiani kangaanga ake a kaman taekinaki ngkoa ao ngkai irouia burabeti.
- Ti kanakoa bwanara nakoia aomata ake a onimakinaki ao aobitia n te tautaeka n taabo nako bwa a na karikirakei
  itera aikai ake a karaoaki bwa ana kateimatoai ao ni kamatoa te utu bwa ngaia aan te botanaomata.
