title: Taekan te Onimaki
subtitle: n Ana Ekaretia Iesu Kristo Ibukiia Aika Itiaki Ni Boong Aika Kaitira
author: ''
verses:
- n: 1
  text: Ti kakoaua te Atua, te Tama ae Akea Tokina, ao Natina, ae Iesu Kristo, ao te Tamnei ae Raoiroi.
- n: 2
  text: Ti kakoaua ae a na katuuaeki aomata nako ibukin oin aia bure, ao tiaki ibukin riaoan te tua iroun
    Atam.
- n: 3
  text: Ti kakoaua bwa man Ana Mwakuri ni Kamaiu Kristo, a kona iai aomata nako ni kamaiuaki, n te ongeaba
    nakon tuua ao otenanti n te Euangkerio.
- n: 4
  text: 'Ti kakoaua bwa moan tuua ao otenanti n te Euangkerio bon: te moan, te Onimaki iroun te Uea ae
    Iesu Kristo, te kauoua, te Rairannano, te kateniua, te Bwabetito ni kateboaki i an te ran ibukin kamaunaan
    buure, te kaaua, te Katoka bai ibukin te bwaintituaraoi ae te Tamnei ae Raoiroi.'
- n: 5
  text: Ti kakoaua bwa e riai ni weteaki te aomata iroun te Atua, n te taeka ni burabeti, ao man te katoka
    bai irouia naake a kariaiakaki, bwa e na tataekina te Euangkerio ao ni karaoi taian otenanti ake iai.
- n: 6
  text: Ti kakoaua te botaki naba ae ti te arona ma are iai ngkoa i nanon te Ekaretia ni Kawai, aika,
    abotoro, burabeti, minita, taan reirei, taan tataekina te euangkerio, ao tabeman riki.
- n: 7
  text: Ti kakoaua te bwaintituaraoi n neewe, taeka ni burabeti, kaotioti, mii ni burabeti, katoki aoraki,
    rairan neewe, ao tabeua riki.
- n: 8
  text: Ti kakoaua te Baibara ae ana taeka te Atua ngkana e eti rairana; ti kakoaua naba Ana Boki Moomon
    bwa ana taeka te Atua.
- n: 9
  text: Ti kakoauai bwaai nako ake e a tia ni kaoti te Atua, bwaai ni kabane ake E kaoti ngkai, ao ti
    kakoaua bwa E na manga kaoti bwaai aika mwaiti aika korakora ma ni kakaawaki aika kaineti ma Uean
    te Atua.
- n: 10
  text: Ti kakoaua manga ikotakin Iteraera ao kaokakin Baronga ake Tebwina; bwa Tion (Ierutarem ae Boou)
    e na kateaki i aon te kontenanti ae Amerika; bwa Kristo bon ngaia ae e na tautaeka i aon te aonaba;
    ao, bwa te aonaba e na manga kaboouaki ma ni karekea mimitongina ni bwaretaiti.
- n: 11
  text: Ti tangira te inaomata n taromauria te Atua ae Moan te Mwaaka ni kaineti ma ara iango, ao ni kariaia
    aomata nako te inaomata naba anne, bwa a na taromauri ni kanga, n te tabo ra, ke are a rineia.
- n: 12
  text: Ti kakoaua ae ti kabaeki nakoia uea, beretitenti, taan tautaeka, ao taan moti, n ongotaeka, ni
    karinea, ao ni boutoka te tua.
- n: 13
  text: Ti kakoaua ae ti riai ni kokoaua, n etieti, n itiaki, n akoi, n raoiroi, ao ni kakaraoa ae raoiroi
    nakoia aomata ni kabaneia; e koaua, ti kona n atongnga bwa ti ira ana kauring Bauro—Ti kakoauai bwaai
    ni kabane, ti kantaningai bwaai ni kabane, ti a tia n teimatoa rinanon bwaai aika mwaiti, ao ni kantaningaia
    bwa ti na kona n teimatoa rinanon bwaai ni kabane. Ngkana iai te bwai ae raoiroi, ae kakateke, ke
    ae tamaroa rongorongona, ke e kamoamoaaki, ti na ukoukori bwaai aikai.
signature: Iotebwa Timiti.
