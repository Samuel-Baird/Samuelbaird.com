slug: restoration
language: gil
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=gil
retrieved: '2026-11-02'
title: Kaokan Bwaninin Ana Euangkerio Iesu Kristo
subtitle: Te Katanoata n te Kauabubua n Ririki nakon te Aonaaba
author: Te Moan Beretitentii ao te Kauntira n Abotoro n te Tengaun ma Uoman n Ana Ekaretia Iesu Kristo
  Ibukiia Aika Itiaki ni Boong aika Kaitira
note: Te katanoata aei e warekaki iroun Beretitenti Russell M. Nelson bwa mwakoron ana rongorongo n te
  ka 190 ni Maungatabu ni Kabuta n te Ririki, Eberi 5, 2020, i Salt Lake City, Utah.
paragraphs:
- Ti katanoata ma te nano ni koaua bwa e tangiriia Natina te Atua n taabo nako n te aonaaba. E a tia te
  Atua te Tama n anganiira te bungiaki ae mimitong, te maiu ae akea kabotauana, ao ana anga karea ae akea
  tiana Natina ae Tangiraki, Iesu Kristo. Man mwaakan te Tama, e a tia ni mangauti Iesu ao ni karekea
  te tokanikai iaon te mate. Bon Ngaia ara Tia Kamaiu, ara Banna ni Katooto, ao te Tia Kabooi Maiura.
- Uabubua te ririki n nako, ni moaningabongin te tiburing n 1820, te kairake ae Iotebwa Timiti, e ukoria
  ni kan ataia bwa enga te ekaretia ae na iria, e nakon te buakonikai n tataro irarikin mweengana i New
  York, USA. Iai ana titiraki ni kaineti ma kamaiuan tamneina ao ni kakoaua bwa te Atua e na bon kairia.
- Ma te nanorinano, ti katanoata bwa ni kaekaan ana tataro, te Atua te Tama ao Natina, Iesu Kristo, a
  kaoti nakon Iotebwa ao ni moana “kaokan bwaai ni kabane” (Mwakuri 3:21) n aron are e a kaman taekinaki
  n te Baibara. N te mii ni burabeti aei, e reiakinna bwa imwiin mateia moan Abotoro, Ana Ekaretia Kristo
  n te Nu Tetemanti e bua man te aonaaba. E na riki Iotebwa bwa te bwai ni mwakuri ni kaokana.
- Ti taekinna ni kaotia bwa iaan ana kairiiri te Tama ao Natina, taan uarongorongo mai karawa a roko n
  reireina Iotebwa ao ni manga katea ana Ekaretia Iesu Kristo. Ioane te tia Bwabetito are e a tia ni manga
  kautaki e kaoka te kariaia ni bwabetito man te kateboaki inanon te ran ibukin kabwaraan buure. Teniman
  mai ibuakoia moan Abotoro ake tengaun ma uoman—Betero, Iakobo, ao Ioane—a kaoka te mwakuri n abotoro
  ao kiing n te kariaia n te nakoanibonga. A roko naba tabeman, n raonaki ma Eria, are e kaoka te kariaiakaki
  bwa utu a na ikotaki n akea tokina n te reitaki n te maiu are akea tokina are e riaon te mate.
- 'Ti kakoaua riki bwa Iotebwa Timiti e anganaki te bwaintangira ao mwaakan te Atua n raira te rekooti
  are ngkoa: Ana Boki Moomon—Kakoauan Taekan Iesu Kristo. Inanon baan te koroboki ae tabu aei iai rongorongon
  ana mwakuri Iesu Kristo ibuakoia aomata n iteran te Aonaaba are i Maeao imwiin Mangautina. E reirei
  bukin te maiu aei ao e kabwarabwarai ana reirei Kristo, are e kakawaki nakon te kantaninga anne. Ngkai
  te boki ae tabu ae reitaki ma te Baibara, Ana Boki Moomon e kakoaua bwa aomata ni kabane bon naati mwaane
  ao aine iroun Tamara are i Karawa ae tatangira, ao iai Ana babaire mai ieta ibukin maiura, ao bwa Natina,
  Iesu Kristo, e taetae n te bong aei n aron boong ake rimoa.'
- Ti katanoata bwa Ana Ekaretia Iesu Kristo ibukiia Aika Itiaki ni Boong aika Kaitira, are e kateaki n
  Eberi 6, 1830, bon Ana Ekaretia Kristo are n te Nu Tetemanti ae kaokaki. E boboto te Ekaretia aei iaon
  maiun atibun te maninganinga ae kororaoi, Iesu Kristo, ao Ana Mwakuri ni Kamaiu ae akea tokina ma Mangautina.
  E a tia Iesu Kristo ni manga weteia Abotoro ao e a tia n anganiia te kariaia n te nakoanibonga. E kaoira
  ni kabane bwa ti na Nakoina ao n nakon Ana Ekaretia, ni karekea te Tamnei ae Raoiroi, otenanti ni kamaiu,
  ao ni karekea te kimwareirei ae teimatoa.
- E a nako ngkai uabubua te ririki mai imwiin te tai ngke Kaokan Bwaai e moan kaokaki iroun te Atua te
  Tama ao Natina ae Tangiraki, Iesu Kristo. Mirion ni kabuta te aonaaba a tia ni butimwaea te atatai ni
  baika a riki aikai ake a kaman taetae ni burabetiaki.
- Ti kukurei ni katanoata bwa Kaokan Bwaai ake a tia n taekinaki n te berita ae a bon waaki nako rinanon
  kaotioti aika teimatoa. E aki kona te aonaaba ni manga titebo, ngkai te Atua e na “boti bwaai ni kabane
  i nanoni Kristo” (I-Ebeto 1:10).
- Ma te karinerine ao te kakaitau, ngaira aika Ana Abotoro ti kaoi ngkami bwa kam na ataia—n aron ae ti
  ataia—bwa e kaukaki karawa. Ti kamatoa bwa te Atua e kaota Ana kantaninga ibukiia Natina mwaane ao aine
  aika tangiraki bwa a na ataia. Ti kakoaua bwa naake a tataromwaaka ni kamatebwaia rongorongon Kaokan
  Bwaai ao ni karaoia ma te onimaki a na kakabwaiaaki ni karekei oin aia koaua bwa bon mai iroun te Atua
  ao te kantaninga iai bwa e na katauraoa te aonaaba ibukin manga Kauaokin ara Uea ao ara Tia Kamaiu,
  Iesu Kristo.
