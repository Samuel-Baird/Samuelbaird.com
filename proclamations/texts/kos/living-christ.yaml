title: Kraist Suc Moul
subtitle: Fahkwack Ke Luhlahlfongi Luhn Mwet Sap
author: Alu luhn Jisus Kraist luhn Mwet Luhlahlfongi ke Lwen-sahflah
paragraphs:
- Ke kuht ahkfuhlwactye isuslah luhn Jisus Kraist yac tausin luo som lah ah, kuht usot ke pwacyeiyacn
  fahkwack ke luhlahlfongi lasr lah wacngihn sie oacna moul Lal ac ke kuh yohk Lal in iwaclah mwet uh.
  Wacngihn sie mwet suc muhta met ac ke pacl se inge oacna El.
- El pa Jeova kuhlacna ke Wuhleacng Mahtuh, Messiah ke Wuhleacng Fuhsr. Ke kohkoh luhn Pahpah Tuhmwacl,
  El pa oraclah facluh. “God El orala ma nukewa kacl. Wangin kutena ma orekla saya, fin tia ke Kasa” (John
  1:3). Ne wacngihn ma koluk lal, El pacptaislac in ahkpwacyei ma suwohswohs nuhkwewa. El “forfor in acn
  nukewa ac oru ma wo” (Orekma 10:38), ohinge srukhngacyuck El kac. Wosasuc lal sie mwe fahkwack in mihs
  ac engan. El kwacfe nohfohn in fahsr tukun srihkahsrak Lal. El fuhfahsryucsr Palestine, ahkweyelah mwet
  mas, oruh mwet kun in liye, ac ahkmoulyeack mwet misac. El luti ma pwacye ke moul ma pahtpaht, ma pwacye
  ke moul in nguhn lasr met, srihpen moul lasr fin facluh ac kapkapwack luhn tuhlihk mokul ac tuhlihk
  muhtwacn nuhtin God ke moul se fahsruh uh.
- El oraclah akwuck nuh ke kuhfa luhn Leum in mwe acsmakihn se nuh ke kuhsackuhnlah yohk Lal. El sruhuh
  ac ahkoluhkyeyuck ke mwe looh stuuh, sruhuh ke sap luhn mwet lokoalok, ac wotlac lacn misac ke sahksin
  Calvary. El sang moul Lal in iwaclah ma koluk luhn mwet nuhkwewa. El sie mwe sang yohk in sang aholuhlos
  nuhkwewa suc ac fah muhta fin facluh.
- Kuht ahkpwacyei lah moul Lal, pa yohk srihpac omet ke moul luhn mwet nuhkwewa, tuhsruhk tiac na muhtwacwacack
  Bethlehem ac tiac sahflah Calvary. El pa Fahko Se met Nuhtin Pahpah, Wen Kuloh Se fanna in ikoac, Mwet
  in Molwelah luhn facluh.
- El moulyak liki kulyuck uh ke “fahko se met lalos suh mutul” (Sie Corinth 15:20). Ke El Leum suc moulyak,
  El muhtwacta nuh yohrohlos suc El luhngse ke moul se inge. El oacyacpac luti nuh sin “kuhtwe pac sheep
  Nahtuhl” (John 10:16) fin acn Macrke met. Fin facluh mihsenge, El ac Pahpah Tuhmwacl sikyang nuh sel
  tuhlihk mokul srihsrihk Joseph Smith, ahkkahlwemye sie olwelah kawihl ma ac “fah aksafye ke pacl fal”
  (Ephesus 1:10).
- 'Ke Kraist Suc Moul, Mwet Pahluh Joseph el suhmuhslah fahk: “Muh muhtahl fihrihr oacna sie kahlwem luhn
  e; aunsifacl fasrfasr oacna sno; ngwetngwetwacl sahromrom oacna kahlwem luhn faht; ac puhsracl oacna
  kahsruhsr luhn acsr, finne puhsren Jeova, el fahk:'
- “Nga pa muhtwacwacack ac sahflah; Nga pa el suc moul, nga pa el suc acnwucki; Nga ahohl kowos nuh sin
  Pahpah” (ML&W 110:3–4).
- 'Mwet Pahluh el oacyacpac ahkkahlwemye: “Kacl lah, tukun fahkwack ke luhlahlfongi pucspucs suc oreklac
  kacl, pa inge fahkwack ke luhlahlfongi, ma sahflah se liki nuhkwewa, suc kuht kuh in fahk kacl: Lah
  el moul!'
- “Tuh mwet facluh liyacl, ke lacpo lacyot sin God; ac kuht lohng puhsra se ahkkahlwemye lah El Wen Kuloh
  Se fanna Nuhtin Pahpah—
- “Tuh ke el, ac yohrohl, ac in el, facluh oreklac, ac tuh mwet fac fah tuhlihk mukul ac tuhlihk muhtwacn
  nuhtin God” (ML&W 76:22–24).
- Kuht olwelah in fahk na pwacye lah pristut Lal ac Alu Lal sifil fohlohkihnyuckyak fin facluh— “musaiyukyak
  fin pwelung luhn … mwet sap ac mwet palu, ac Jisus Kraist sifacna pa eot insruwasrik” (Ephesus 2:20).
- Kuht ahkpwacyei lah El ac sie lwen fohlohk nuh facluh. “Na wolana lun Leum God fah akkalemyeyukla, Ac
  mwet e nukewa fah liye” (Isaiah 40:5). El ac fah nuhnuhnkuh in kuh in Tohkohsrah luhn Tohkohsrah ac
  Leum luhn Leum, ac niyac nuhkwewa fah kotkot uh ac lohoh nuhkwewa fah sramsram in alu nuh Sel. Kais
  sie sesr e fah tu nuhnuhnkweyuck Sel in fal nuh ke orekma lasr ac kena luhn insiyacsr.
- Kuht fahkwack ke luhlahlfongi, ekihn Mwet sap ahkkweyeyucklac Lal—lah Jisus pa Kraist Suc Moul, Wen
  Kuloh Nuhtin God ke Nguhn. El pa Tohkohsra Immanuel, suc tu mihsenge ke lwacpo lwacyot sin Pahpah Tuhmwacl.
  El pa kahlwem, moul, ac finsrak luhn facluh. Inkacnek Lal pa kol kuht nuh ke engan ke moul se inge ac
  moul ne tok ma pahtpaht ke facluh se tok uh. Kuloh nuh sin God ke mwe sang yohk se ke Wen kuloh Nahtuhl
  suc wacngihn kihsrucngyacl.
