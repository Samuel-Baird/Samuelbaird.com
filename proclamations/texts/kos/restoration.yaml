slug: restoration
language: kos
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=kos
retrieved: '2026-11-02'
title: Fohlohkihnyuckyak ke Fohnlah luhn Wosasuc luhn Jisus Kraist
subtitle: Sie Mwe Fahkwack in Ahkfuhlwactye Yac Ahk Lofoko nuh fin Facluh
author: Prestuhnsi Se Met Ac Mwet Kahsruh luhn Mwet Sap Singucul Luo ke Alu luhn Jisus Kraist luhn Mwet
  Luhlahlfongi ke Lwen-sahflah
note: Mwe fahkwack se inge ritiyuck sel Prestuhn Russell M. Nelson in sie ip ke pweng lal ke Toeni Luhlahp
  Ahk 190, Eprel 5, 2020, fin acn Salt Lake City, Utah.
paragraphs:
- Kuht ohi in fahkwack lah God El luhngse tuhlihk Nahtuhl ke muhtuhnfacl nuhkwewa fin facluh. God Pahpah
  El use nuh sesr isuslac wolacna, moul ma wacngihn ma oacna, ac kihsac in iwaclah ma wacngihn sahflahiyac
  luhn Wen Kuloh Nahtuhl, Jisus Kraist. Ke kuh luhn Pahpah, Jisus El sifilpac moulyak ac eis kuhtanglah
  liki misac. El pa Mwet Lahngo lasr, Mwet Etahwi lasr, ac Mwet in Molwelah lasr.
- Yac lofoko somlah ah, ke sie litutacng kahto ke spring 1820, Joseph Smith fuhsr, el suk in etuh lah
  piac kac alu elan welah uh, el som nuh insack ah in pruhe sisken lohm sel ah an nuh acir fin acn New
  York, USA. Oasr kihsensiyuck lal ke molwelah luhn nguhnal ac luhlahlfongi lah God El ac kohlohl.
- Ke puhsisacl, kuht fahkwack lah in topuk pruhe se lal ah, God Pahpah ac Wen Nahtuh, Jisus Kraist, Elos
  sikyang nuh sel Joseph ac ahkfahsrye “aksasuyeyuk ma nukewa” (Orekma 3:21) oacna ke tuh palyeiyuck ke
  Bible ah. Ke aruhruhma se inge, el lotwelah lah tukun misac luhn Mwet Sap emet ah, Alu ke Wuhlweacng
  Sasuc luhn Kraist tuhlac liki facluh. Joseph el orekmakihnyuck ke fohlohkihnyuckme la an.
- Kuht ahkkweye lah ye kohkoh luhn Pahpah ac Wen, mwet utuck pweng inkuhsrao elos tuhkuh in lotwel Joseph
  ac sifilpac akiyac Alu luhn Jisus Kraist. John Pacptais suc sifilpac moulyak el tuh fohlohkohnwack wal
  in pacptais ke tili otyak ke kof nuh ke iyucklac luhn ma koluk. Tolu sin Mwet Sap singucul luo emet
  ah—Peter, James, ac John—elos fohlohkohnwack kunohkohn luhn mwet sap ac ki ke wal luhn pristut. Mwet
  sahyac tuhkuh pac, weluhlwacng Elijah, suc tuh fohlohkohnwack kuh in kapsriyac sucu an nuh sie ne tok
  ma pahtpaht ke inmahsrlo ma wacngihn sahflahiyac ma som ahluhkwelah misac.
- 'Kuht tahfwelah in ahklohye lah tuh ituckyang nuh sel Joseph Smith mwe sang ac kuh luhn God in luhngaslah
  sie ma sihmlac mahtuh: Puk luhn Mormon—Siepac Wuhlweacng ke Jisus Kraist. Sra puk ke ma sihmlac muhtahl
  se inge pa sie sramsram ke luti luhn Jisus Kraist inmahsrlon mwet ke Lacfahl Rohtoh tiac paht tukun
  El Sifilpac Moulyak ah. Ma inge luti ke srihpac luhn moul uh ac ahkuhtweyac mwe luti luhn Kraist, suc
  yohk srihpac nuh ke srihpac se ingacn. Oacna sie ma suhmuhslah ma weacng Bible, Puk luhn Mormon uh fahkwack
  lah mwet nuhkwewa pa wen ac acn nuhtin Pahpah Luhng Inkuhsrao, lah oasr plwacn muhtahl Lal nuh ke moul
  lasr uh, ac lah Wen Nahtuh, Jisus Kraist, El sramsram misenge oacna ke pacl mahtuh met ah.'
- Kuht fahkwack lah Alu luhn Jisus Kraist luhn Mwet Luhlahlfongi ke Lwen-sahflah, tuh akwucki ke Eprel
  6, 1830, pa Alu ke Wuhlweacng Sasuc luhn Kraist ma sifilpac fohlohkihnyuckyak. Alu se inge kawuhki ke
  moul suwohswohs luhn eot in sruhwasrihk, Jisus Kraist, ac ke Iwaclah ma pahtpaht ac Sifilpac Moulyak
  na pwacye. Jisus Kraist El sifilpac pahngon Mwet Sap ac sang nuh selos wal luhn pristut. El suli kuht
  nohfohn in tuhkuh nuh Yohrohl ac Alu Lal, in eis Nguhn Muhtahl, akwuck luhn molwelah, ac in eis engan
  ma wacngihn sahflahiyac.
- Yac lofoko somlah inge ke Fohlohkihnyuckyak se ma tuh ahkfahsryeyuck sin God Pahpah ac Wen Kuloh Nahtuhl,
  Jisus Kraist. Million mwet fin facluh elos eis etwacack ke pacl palyeiyuck inge.
- Kuht engan in sulkackihn lah Fohlohkihnyuckyak ma tuh uliyuck ah ahkwot na nuh met ke fahfahlacna luhn
  fwackyuck. Facluh ac fah tiac sifilpac oacna met ah, ke God El ac fah “eisani ma orekla nukewa nu sie
  … ke … Christ” (Ephesus 1:10).
- Ke suhnak ac srui, kuht suc ekihn Mwet Sap Lal suli mwet nuhkwewa in etuh—oacna kuht etuh—lah inkuhsrao
  ikacklah. Kuht ahkpwacyeye lah God El oruh in etweyuck luhngse Lal nuh sin wen ac acn kuloh Nahtuhl.
  Kuht fahkwack lah elos suc pruhe lutlut ke pweng ke Fohlohkihnyuckyak ac mukwikwi ke luhlahlfongi ac
  fah ahkinsewowoyeyuck in eis mwe loh lalos sifacna ke muhtahliyac ac ke srihpac la in ahkolah facluh
  nuh ke uliyuck luhn Tuhkuh Ahkluo luhn Leum ac Mwet Lahngo lasr, Jisus Kraist.
