title: ಜೀವಂತ ಕ್ರಿಸ್ತನು
subtitle: ಅಪೋಸ್ತಲರ ಸಾಕ್ಷಿ
author: ಯೇಸು ಕ್ರಿಸ್ತನ ಕಡೆ ದಿನಗಳ ಸಂತರ ಸಭೆ
paragraphs:
- ಎರಡು ಸಹಸ್ರಮಾನಗಳ ಹಿಂದೆ ಯೇಸು ಕ್ರಿಸ್ತನ ಜನನವನ್ನು ಸ್ಮರಿಸುತ್ತಾ, ಯಾರಿಗೂ ಸರಿ ಸಾಟಿಯಿಲ್ಲದ ಜೀವನದ ವಾಸ್ತವಿಕತೆಯನ್ನು
  ಮತ್ತು ಅವರ ಮಹಾನ್ ಪ್ರಾಯಶ್ಚಿತ್ತ ತ್ಯಾಗದ ಅನಂತ ಸದ್ಗುಣದ ಬಗ್ಗೆ ನಾವು ನಮ್ಮ ಸಾಕ್ಷಿಯನ್ನು ಅರ್ಪಿಸುತ್ತೇವೆ. ಭೂಮಿಯ ಮೇಲೆ
  ಇದುವರೆಗೂ ಜೀವಿಸಿದ್ದ ಮತ್ತು ಇನ್ನುಮುಂದೆ ಜೀವಿಸಲಿರುವ ಎಲ್ಲರ ಮೇಲೂ ಬೇರೆ ಯಾರೂ ಇಷ್ಟು ಗಾಢವಾದ ಪ್ರಭಾವವನ್ನು ಬೀರಿದವರು
  ಮತ್ತಾರೂ ಇಲ್ಲ.
- ಅವರು ಹಳೆಯ ಒಡಂಬಡಿಕೆಯಲ್ಲಿ ಮಹಾನ್ ಯೆಹೋವನಾಗಿದ್ದರು, ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಮೆಸ್ಸೀಯನಾಗಿದ್ದರು. ತಮ್ಮ ತಂದೆಯ ಮಾರ್ಗದರ್ಶನದಲ್ಲಿ,
  ಅವರು ಭೂಮಿಯ ಸೃಷ್ಟಿಕರ್ತರಾಗಿದ್ದರು. “ಅವರ ಮೂಲಕವಾಗಿ ಸಮಸ್ತವು ಉಂಟಾಯಿತು; ಉಂಟಾಗಿರುವ ವಸ್ತುಗಳಲ್ಲಿ ಆತನಿಲ್ಲದೆ ಒಂದಾದರೂ
  ಉಂಟಾಗಲಿಲ್ಲ” (ಯೋಹಾನ 1:3), ಪಾಪರಹಿತರಾದರೂ, ಎಲ್ಲಾ ನೀತಿಯನ್ನು ನೆರವೇರಿಸಲು ಅವರು ದೀಕ್ಷಾಸ್ನಾನ ಪಡೆದರು. “ಅವರು ಉಪಕಾರಗಳನ್ನು
  ಮಾಡುವುದಕ್ಕಾಗಿ ಮುಂದಾದರು” (ಅಪೊಸ್ತಲರ ಕೃತ್ಯಗಳು 10:38), ಆದರೂ ಅದಕ್ಕಾಗಿ ತಿರಸ್ಕರಿಸಲ್ಪಟ್ಟರು, ಅವರ ಸುವಾರ್ತೆಯು ಶಾಂತಿಯ
  ಮತ್ತು ಸೌಹಾರ್ದತೆಯ ಸಂದೇಶವಾಗಿತ್ತು. ಅವರು ಎಲ್ಲರಿಗೂ ತಮ್ಮ ಮಾದರಿಯನ್ನು ಅನುಸರಿಸಲು ವಿನಂತಿಸಿದರು. ಅವರು ಫಿಲಿಷ್ಟಿಯನ
  ರಸ್ತೆಗಳ ಮೇಲೆ ನಡೆಯುತ್ತಾ, ರೋಗಿಗಳನ್ನು ಗುಣಪಡಿಸಿದರು, ಕುರುಡರಿಗೆ ದೃಷ್ಟಿ ನೀಡಿದರು ಮತ್ತು ಸತ್ತವರನ್ನು ಬದುಕಿಸಿದರು.
  ಅವರು ಶಾಶ್ವತನಿತ್ಯತೆಯ ಸತ್ಯಾಂಶವನ್ನು ಕಲಿಸಿದರು, ನಮ್ಮ ಪೂರ್ವ ಮರ್ತ್ಯದ ಅಸ್ತಿತ್ವವದ ನಿಜಾಂಶವನ್ನು, ಭುವಿಯ ಮೇಲಿನ ನಮ್ಮ
  ಜೀವನದ ಉದ್ದೇಶವನ್ನು, ಹಾಗು ಮುಂಬರುವ ಜೀವನದಲ್ಲಿನ ದೇವರ ಪುತ್ರರು ಮತ್ತು ಪುತ್ರಿಯರಾಗುವ ಸಾಮರ್ತ್ಯವನ್ನು ಕಲಿಸಿದರು.
- ಅವರು ತಮ್ಮ ಮಹೋನ್ನತ ಪ್ರಾಯಶ್ಚಿತ್ತ ತ್ಯಾಗದ ಜ್ಞಾಪನೆಯಾಗಿ ಕರ್ತನ ಭೋಜನವನ್ನು ಸ್ಥಾಪಿಸಿದರು. ಅವರು ಸುಳ್ಳು ಆರೋಪಗಳ ಮೇರೆಗೆ
  ನಿಂದಿಸಲ್ಪಟ್ಟು ಬಂದಿಸಲ್ಪಟ್ಟರು, ದೊಂಬಿ ಸಮೂಹದ ತೃಪ್ತಿ ಪಡಿಸಲು ದೋಷಿತನಾದರು, ಅಪರಾದಿಯಾಗಿ ಗೊಲ್ಗೊಥಾ ಶಿಲುಬೆಯ ಮೇಲೆ
  ಮರಣದಂಡನೆಗೆ ಗುರಿಯಾದರು. ಅವರು ಎಲ್ಲಾ ಮಾನವಜಾತಿಯ ಪಾಪಗಳಿಗೆ ಪ್ರಾಯಶ್ಚಿತ್ತವಾಗಲು ತಮ್ಮ ಜೀವನವನ್ನು ಕೊಟ್ಟರು. ಭೂಮಿಯ
  ಮೇಲೆ ಜೀವಿಸುವಂತಹ ಎಲ್ಲರ ಪರವಾಗಿ ಅವರದು ಒಂದು ಮಹಾ ಪ್ರಾತಿನಿಧಿಕ ಕೊಡುಗೆಯಾಗಿದೆ.
- ಎಲ್ಲಾ ಮಾನವ ಇತಿಹಾಸಕ್ಕೆ ಕೇಂದ್ರೀಯವಾಗಿದ್ದು, ಅವರ ಜೀವನವು ಬೇತ್ಲೆಹೇಮ್ನಲ್ಲಿ ಆರಂಭವಾಗಲಿಲ್ಲ ಅಥವಾ ಗೊಲ್ಗೊಥಾದಲ್ಲಿ ಮುಕ್ತಾಯಗೊಂಡಿಲ್ಲ
  ಎಂದು ನಾವು ಗಂಭೀರವಾಗಿ ಸಾಕ್ಷಿ ಹೇಳುತ್ತೇವೆ, ಅವರು ತಂದೆಯ ಮೊದಲ ಹುಟ್ಟಿದವರು, ಶರೀರದಲ್ಲಿ ಜನಿಸಿದ ಏಕೈಕ ಪುತ್ರ, ಮತ್ತು
  ಪ್ರಪಂಚದ ವಿಮೋಚಕನಾಗಿದ್ದರು.
- “ನಿದ್ರೆಹೋದವರಲ್ಲಿ ಪ್ರಥಮಫಲವಾಗಲು” ಅವರು ಸಮಾದಿಯಿಂದ ಎದ್ದುಬಂದರು (1 ಕೊರಿಂಥದವರಿಗೆ 15:20) ಪುನರುತ್ಥಾನಗೊಂಡ ಕರ್ತನಾಗಿ,
  ಅವರು ಜೀವನದಲ್ಲಿ ಪ್ರೀತಿಸಿದವರನ್ನು ಭೇಟಿ ಮಾಡಿದರು. ಅವರು ಪ್ರಾಚೀನ ಅಮೆರಿಕದಲ್ಲಿ ತಮ್ಮ “ಬೇರೆ ಕುರಿಗಳ” ನಡುವೆಯೂ ಸೇವೆ
  ಸಲ್ಲಿಸಿದರು (ಯೋಹಾನ 10:16) ಆಧುನಿಕ ಪ್ರಪಂಚದಲ್ಲಿ, ಅವರು ಮತ್ತು ಅವರ ತಂದೆಯು ಬಾಲ ಜೊಸೆಪ್‌ ಸ್ಮಿತ್‌ನಿಗೆ ಪ್ರತ್ಯಕ್ಷವಾಗಿ,
  ದೀರ್ಘಕಾಲದಿಂದ ವಾಗ್ದಾನಗೊಂಡ “ಕಾಲಗಳ ಪರಿಪೂರ್ಣತೆಯ” ವಿತರಣೆಯನ್ನು ಆರಂಭಿಸಿದರು (ಎಫೆಸದವರಿಗೆ 1:10).
- 'ಜೀವಂತ ಕ್ರಿಸ್ತನ ಕುರಿತಾಗಿ ಪ್ರವಾದಿ ಜೋಸೆಫ್ ಸ್ಮಿತ್‌ ಬರಹ: “ಅವರ ಕಣ್ಣುಗಳು ಅಗ್ನಿಯ ಜ್ವಾಲೆಯಂತಿದ್ದವು; ಅವರ ತಲೆಯ
  ಕೂದಲು ಶುದ್ಧ ಹಿಮದಂತೆ ಬೆಳ್ಳಗಿತ್ತು; ಅವರ ಮುಖವು ಸೂರ್ಯನ ಹೊಳಪಿಗಿಂತ ಹೆಚ್ಚಾಗಿ ಹೊಳೆಯುತಿತ್ತು; ಮತ್ತು ಅವರ ಕಂಠಧ್ವನಿ
  ಮಹಾ ಜಲಪ್ರವಾಹದ ಶಭ್ದದಂತಿತ್ತು, ಯೆಹೋವನ ದ್ವನಿಯು, ಹೀಗೆಂದು:'
- “ಮೊದಲು ನಾನೇ ಹಾಗು ಕಡೆಯೂ ನಾನೇ; ಜೀವಂತದಿಂದಿರುವವನು ನಾನೇ, ಕೊಲ್ಲಲ್ಪಟ್ಟವನು ನಾನೇ; ತಂದೆಯೊಡನೆ ನಿನ್ನ ನ್ಯಾಯವಾದಿ ನಾನೇ”
  (ಉಪದೇಶ ಮತ್ತು ಒಡಂಬಡಿಕೆಗಳು 110:3–4).
- 'ಅವರ ಬಗ್ಗೆ ಪ್ರವಾದಿಯೂ ಹೀಗೆ ಘೋಷಿಸಿದರು: “ಈಗ, ಅವರ ಬಗ್ಗೆ ನೀಡಲಾದ ಅನೇಕ ಸಾಕ್ಷಿಗಳ ನಂತರ, ನಾವು ಕೊನೆಯದಾಗಿ ನೀಡುವ
  ಈ ಸಾಕ್ಷಿಯೇನಂದರೆ—ಅವರು ಜೀವಂತವಾಗಿದ್ದಾರೆ!'
- “ಇದಾಗಿ ನಾವು ಅವರನ್ನು ದೇವರ ಬಲಗಡೆಯಲ್ಲಿ ನೋಡಿದೆವು; ಮತ್ತು ಅವರು ತಂದೆಯ ಏಕೈಕ ಪುತ್ರನೆಂದು ಸಾಕ್ಷಿ ಹೇಳುವ ಧ್ವನಿಯನ್ನು
  ನಾವು ಕೇಳಿದೆವು—
- “ಅವರ ಮೂಲಕ, ಅವರಿಂದ, ಮತ್ತು ಅವರಲ್ಲಿ, ಪ್ರಪಂಚಗಳು ಸೃಷ್ಟಿಯಾಗಿವೆ ಮತ್ತು ಸೃಷ್ಟಿಸಲ್ಪಟ್ಟವು; ಹೀಗಾಗಿ ಅದರ ನಿವಾಸಿಗಳು
  ದೇವರ ಪುತ್ರರು ಮತ್ತು ಪುತ್ರಿಯರಾಗುತ್ತಾರೆ” (ಉಪದೇಶ ಮತ್ತು ಒಡಂಬಡಿಕೆಗಳು 76:22–24).
- ಅವರ ಯಾಜಕತ್ವ ಮತ್ತು ಅವರ ಸಭೆ ಭೂಮಿಯ ಮೇಲೆ ಪುನಃಸ್ಥಾಪಿಸಲ್ಪಟ್ಟಿದೆ—ಅಪೋಸ್ತಲರು ಮತ್ತು ಪ್ರವಾದಿಗಳ … “ಅಸ್ತಿವಾರದ ಮೇಲೆ
  ನಿರ್ಮಿಸಲಾಗಿದೆ ಯೇಸು ಕ್ರಿಸ್ತನೇ ಮುಖ್ಯವಾದ ಮೂಲೆಗಲ್ಲು” ಎಂದು ನಾವು ಗಂಭೀರವಾದ ಮಾತುಗಳಲ್ಲಿ ಘೋಷಿಸುತ್ತೇವೆ (ಎಫೆಸದವರಿಗೆ
  2:20).
- ಅವರು ಒಂದು ದಿನ ಭೂಮಿಗೆ ಹಿಂತಿರುಗುತ್ತಾರೆಂದು ನಾವು ಸಾಕ್ಷಿ ಹೇಳುತ್ತೇವೆ. “ಯೆಹೋವನ ಮಹಿಮೆಯು ಗೋಚರವಾಗುವದು, ಎಲ್ಲಾ ಮನುಷ್ಯರೂ
  ಒಟ್ಟಿಗೆ ಅದನ್ನು ಕಾಣುವರು” (ಯೆಶಾಯ 40:5). ಅವರು ರಾಜಾಧಿರಾಜನಾಗಿ ಮತ್ತು ಕರ್ತರ ಕರ್ತನಾಗಿ ಆಳುವರು, ಮತ್ತು ಪ್ರತಿಯೊಂದು
  ಮೊಣಕಾಲು ಬಾಗುವದು ಮತ್ತು ಪ್ರತಿಯೊಂದು ನಾಲಿಗೆಯು ಅವರ ಮುಂದೆ ಅರಿಕೆ ಸಲಹುವಂತೆ ಮಾತನಾಡುವದು. ನಮ್ಮಲ್ಲಿ ಪ್ರತಿಯೊಬ್ಬರೂ
  ನಮ್ಮ ಕೃತ್ಯಗಳ ಮತ್ತು ನಮ್ಮ ಹೃದಯದ ಆಸೆಗಳ ಪ್ರಕಾರ ಆತನಿಂದ ನ್ಯಾಯತೀರ್ಪಿಗಾಗಿ ನಿಲ್ಲುತ್ತೇವೆ.
- ಆತನಿಂದ ನೇಮಿಸಲ್ಪಟ್ಟ ಅಪೊಸ್ತಲರಾಗಿ ನಾವು ಸಾಕ್ಷಿ ನೀಡುತ್ತೇವೆ—ಯೇಸುವೇ ಜೀವಂತ ಕ್ರಿಸ್ತನು ಕ್ರಿಸ್ತನೆಂದು, ದೇವರ ಅಮರ
  ಪುತ್ರ. ಅವರು ಮಹಾ ರಾಜನಾದ ಇಮ್ಮಾನುವೇಲ್ಲನು, ಇಂದು ದೇವರ ಬಲಗಡೆಯಲ್ಲಿ ನಿಂತಿರುವರು. ಈವರೇ ಪ್ರಪಂಚದ ಬೆಳಕು, ಜೀವವು ಮತ್ತು
  ಭರವಸೆ. ಅವರ ಮಾರ್ಗವು ಈ ಜೀವನದಲ್ಲಿ ಸಂತೋಷಕ್ಕೆ ಮತ್ತು ಮುಂಬರುವ ಪ್ರಪಂಚದಲ್ಲಿ ನಿತ್ಯ ಜೀವನಕ್ಕೆ ಮುನ್ನಡೆಸುವ ಹಾದಿಯಾಗಿದೆ.
  ದೈವಿಕ ಮಗನಿಂದಾಗಿ ಸರಿಸಾಟಿಯಲ್ಲದ ಉಡುಗೊರೆಗಾಗಿ ದೇವರಿಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸೋಣ.
date: ಜನವರಿ 1, 2000
