title: ಕುಟುಂಬ
subtitle: ಪ್ರಪಂಚಕ್ಕೆ ಒಂದು ಘೋಷಣೆ
author: ಯೇಸು ಕ್ರಿಸ್ತನ ಕಡೆ ದಿನಗಳ ಸಂತರ ಸಭೆಯ ಪ್ರಥಮ ಅಧ್ಯಕ್ಷತೆ ಮತ್ತು ಹನ್ನೆರಡು ಆಪೊಸ್ತಲರ ಮಂಡಳಿ
note: ಈ ಘೋಷಣೆಯನ್ನು ಸೆಪ್ಟಂಬರ್ 23, 1995 ರಂದು ಅಧ್ಯಕ್ಷ ಗಾರ್ಡನ್ ಬಿ. ಹಿಂಕ್ಲಿಯವರು ಸಾಲ್ಟ್ ಲೇಕ್ ಸೀಟಿ, ಯೂಟದಲ್ಲಿ
  ಅವರ ಸಂದೇಶವಾಗಿ ಸರ್ವಸದಸ್ಯರ ಪರಿಹಾರ ಸಂಘದ ಕೂಟದಲ್ಲಿ ಇದನ್ನು ಓದಿದರು.
paragraphs:
- ನಾವು, ಆಂದರೆ ಯೇಸು ಕ್ರಿಸ್ತನ ಕಡೆ ದಿನಗಳ ಸಂತರ ಸಭೆಯ ಪ್ರಥಮ ಅಧ್ಯಕ್ಷತೆ ಮತ್ತು ಹನ್ನೆರಡು ಆಪೊಸ್ತಲರ ಮಂಡಳಿಯವರು ಗೌರವಪೂರ್ವಕವಾಗಿ
  ಘೋಷಿಸುತ್ತೇವೆ, ಒಬ್ಬ ಪುರುಷ ಮತ್ತು ಸ್ತ್ರೀಯ ನಡುವಿನ ವಿವಾಹವು ದೇವರಿಂದ ನಿಯಮಿಸಲ್ಪಟ್ಟಿದೆ ಮತ್ತು ಸೃಷ್ಟಿಕರ್ತನ ಯೋಜನೆಗೆ
  ತನ್ನ ಮಕ್ಕಳ ನಿತ್ಯ ನಿಯತಿಗೆ ಕುಟುಂಬವು ಪ್ರಧಾನವಾಗಿದೆ.
- ಎಲ್ಲಾ ಮನುಷ್ಯ ಕುಲದವರು—ಗಂಡು ಮತ್ತು ಹೆಣ್ಮು—ದೇವರ ರೂಪದಲ್ಲಿ ಸೃಷ್ಟಿಸಲ್ಪಟ್ಟಿದ್ದಾರೆ. ಪ್ರತಿಯೊಬ್ಬರು ನಮ್ಮ ಪರಲೋಕದ
  ತಂದೆ ತಾಯಿಯ ಪ್ರೀತಿಯ ಆತ್ಮಪುತ್ರ ಅಥವಾ ಪುತ್ರಿಯರಾಗಿದ್ದಾರೆ, ಮತ್ತು, ಇದರ ನಿಮಿತ್ತ, ಪ್ರತಿಯೊಬ್ಬರೂ ದೈವಿಕ ಸ್ವಭಾವ ಮತ್ತು
  ನಿಯತಿ ಹೊಂದಿದ್ದಾರೆ. ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಪೂರ್ವಮರ್ತ್ಯ, ಮರ್ತ್ಯ ಮತ್ತು ನಿತ್ಯ ಗುರುತು ಮತ್ತು ಉದ್ದೇಶಕ್ಕಾಗಿ ಲಿಂಗ ಗುಣಲಕ್ಷಣಗಳು
  ಅವಶ್ಯ.
- ಪೂರ್ವಮರ್ತ್ಯ ಲೋಕದಲ್ಲಿ, ಅತ್ಮ ಪುತ್ರರು ಮತ್ತು ಪುತ್ರಿಯರಿಗೆ ದೇವರು ಅವರ ನಿತ್ಯ ತಂದೆಯೆಂದು ತಿಳಿದಿದ್ದರು ಮತ್ತು ಆತನನ್ನು
  ಅರಾಧಿಸಿದರು ಮತ್ತು ಅತನ ಯೋಜನೆಯನ್ನು ಸ್ವೀಕರಿಸಿದರು ಅದರ ಮೂಲಕ ಅವರ ಮಕ್ಕಳು ದೈಹಿಕ ಶರೀರವನ್ನು ಹೊಂದಬಹುದು ಮತ್ತು ಪರಿಪೂರ್ಣತೆಯತ್ತ
  ಮುನ್ನಡೆಯಲು ಭೂಲೋಕದ ಅನುಭವಗಳನ್ನು ಪಡೆಯಬಹುದು ಮತ್ತು ಅಂತಿಮವಾಗಿ ನಿತ್ಯ ಜೀವನದ ವಾರಸುದಾರರಾಗಿ ಅವರ ದೈವಿಕ ನಿಯತಿಯಿಂದ
  ಅರಿತುಕೊಳ್ಳಬಹುದು. ದೈವಿಕವಾದ ಸಂತೋಷದ ಯೋಜನೆಯಿಂದ ಮರಣದ ನಂತರವೂ ಕುಟುಂಬ ಸಂಬಂಧಗಳನ್ನು ಶಾಶ್ವತಗೊಳ್ಳಲು ಸಾಧ್ಯವಾಗಿಸುತ್ತದೆ.
  ಪರಿಶುದ್ಧ ಪವಿತ್ರಾಲಯದಲ್ಲಿ ದೊರಕುವ ಪವಿತ್ರ ಅಜ್ಞಾವಿಧಿಗಳು ಮತ್ತು ಒಡಂಬಡಿಕೆಗಳು ಮನುಷ್ಯರನ್ನು ದೇವರ ಸನ್ನಿಧಿಗೆ ಹಿಂದಿರುಗಿಸುವುದು
  ಮತ್ತು ಕುಟುಂಬಗಳು ಶಾಶ್ವತವಾಗಿ ಒಂದಾಗಲು ಸಾಧ್ಯವಾಗಿಸುತ್ತದೆ.
- ಗಂಡ ಮತ್ತು ಹೆಂಡತಿಯಾಗಿ ಅವರ ಪೋಷಕರ ಸಾಮರ್ಥ್ಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದ್ಧ ಮೊದಲ ಆಜ್ಞೆಯನ್ನು ದೇವರು ಅದಾಮ ಮತ್ತು ಹವ್ವಳಿಗೆ ನೀಡಿದರು.
  ದೇವರು ತನ್ನ ಮಕ್ಕಳಿಗೆ ಬಹುಸಂತಾನವುಳ್ಳವರಾಗಿ ಹೆಚ್ಚಿ ಭೂಲೋಕದಲ್ಲೆಲ್ಲಾ ತುಂಬಿಕೊಳ್ಳಿರಿ ಎಂದು ಕೊಟ್ಟಿರುವ ಆಜ್ಞೆವು ಇನ್ನೂ
  ಪ್ರಭಾವದಲ್ಲಿದೆ ಎಂಬುದನ್ನು ನಾವು ಘೋಷಿಸುತ್ತೇವೆ. ಇಷ್ಟೆ ಅಲ್ಲದೆ ಸಂತಾನೋತ್ಪತಿಯ ಪವಿತ್ರ ಶಕ್ತಿಯನ್ನು ಕಾನೂನುಬದ್ಧವಾಗಿ
  ಗಂಡ ಮತ್ತು ಹೆಂಡತಿಯಾಗಿ ವಿವಾಹವಾದ ಪುರುಷ ಮತ್ತು ಸ್ತ್ರೀಯ ಮಧ್ಯ ಮಾತ್ರ ಬಳಸಬೇಕೆಂದು ದೇವರ ಆಜ್ಞೆಯನ್ನು ಸಹ ನಾವು ಘೋಷಿಸುತ್ತೇವೆ.
- ಮರ್ತ್ಯ ಜೀವನವನ್ನು ಸೃಷ್ಟಿಸುವ ವಿಧಾನಗಳನ್ನು ದೈವಿಕವಾಗಿ ನೇಮಿಸಲಾಗಿದೆ ಎಂದು ನಾವು ಘೋಷಿಸುತ್ತೇವೆ. ಜೀವನದ ಪವಿತ್ರತೆಯನ್ನು
  ಮತ್ತು ದೇವರ ನಿತ್ಯ ಯೋಜನೆಯ ಪ್ರಾಮುಖ್ಯತೆಯನ್ನು ನಾವು ಸ್ಥಿರಪಡಿಸುತ್ತೇವೆ.
- ಗಂಡ ಮತ್ತು ಹೆಂಡತಿ ಪರಸ್ಪರ ಮತ್ತು ತಮ್ಮ ಮಕ್ಕಳನ್ನು ಪ್ರೀತಿಸುವ ಮತ್ತು ಕಾಳಜಿ ವಹಿಸುವ ಮಹತ್ವಪೂರ್ಣ ಜವಾಬ್ದಾರಿಯನ್ನು
  ಹೊಂದಿದ್ದಾರೆ. “ಮಕ್ಕಳು ಯೊಹೋವನಿಂದ ಸಿಕ್ಕಿದ ಸ್ವಾಸ್ಥ್ಯವಾಗಿದ್ದಾರೆ” (ಕೀರ್ತನೆ 127:3). ಪೋಷಕರು ತಮ್ಮ ಮಕ್ಕಳನ್ನು ಪ್ರೀತಿ
  ಮತ್ತು ನೀತಿಯಲ್ಲಿ ಬೆಳೆಸುವುದು, ಅವರ ದೈಹಿಕ ಮತ್ತು ಆಧ್ಯಾತ್ಮಿಕ ಅಗತ್ಯಗಳನ್ನು ಒದಗಿಸಬೇಕು, ಮತ್ತು ಒಬ್ಬರನ್ನೊಬ್ಬರು ಪ್ರೀತಿಸಲು
  ಮತ್ತು ಸೇವೆ ಮಾಡಲು ಕಲಿಸುವುದು, ದೇವರ ಆಜ್ಞೆಗಳನ್ನು ಪಾಲಿಸುವುದು ಮತ್ತು ಅವರು ಎಲ್ಲೆ ವಾಸಿಸಿದರು ಕಾನೂನು ಪಾಲಿಸುವ ನಾಗರಿಕರಾಗಿರುವುದು
  ಪವಿತ್ರ ಕರ್ತವ್ಯವಾಗಿದೆ. ಗಂಡ ಮತ್ತು ಹೆಂಡತಿಯರು—ತಾಯಿ ಮತ್ತು ತಂದೆಯವರು—ಈ ಬಾಧ್ಯತೆಗಳ ನಿರ್ವಹಣೆಗಾಗಿ ದೇವರ ಮುಂದೆ ಹೊಣೆಗಾರರಾಗಿರುತ್ತಾರೆ.
- ಕುಟುಂಬವು ದೇವರಿಂದ ನೇಮಿಸಲ್ಪಟ್ಟಿದೆ. ಅವರ ನಿತ್ಯ ಯೋಜನೆಗೆ ಪುರುಷ ಮತ್ತು ಸ್ತ್ರೀಯ ನಡುವೆ ವಿವಾಹವು ಅತ್ಯಂತ ಅವಶ್ಯಕವಾಗಿದೆ.
  ಮಕ್ಕಳು ವಿವಾಹದ ಬಂಧಗಳೊಳಗೆ ಜನಿಸಲು ಮತ್ತು ವೈವಾಹಿಕ ಪ್ರತಿಜ್ಞೆಗಳನ್ನು ಸಂಪೂರ್ಣ ನಿಷ್ಠೆಯಿಂದ ಗೌರವಿಸುವ ತಂದೆ ಮತ್ತು
  ತಾಯಿಯಿಂದ ಪೋಷಣೆ ಹೊಂದುವ ಅರ್ಹರಾಗಿರುತ್ತಾರೆ. ಕರ್ತನಾದ ಯೇಸು ಕ್ರಿಸ್ತನ ಬೋಧನೆಗಳ ಮೇಲೆ ಸ್ಥಾಪಿಸಿದಾಗ ಕುಟುಂಬ ಜೀವನದಲ್ಲಿ
  ಸಂತೋಷ ಬಹುಶಃ ಹೆಚ್ಚಾಗಿ ಸಾಧಿಸುವ ಸಾಧ್ಯತೆಯಿದೆ. ವಿಶ್ವಾಸ, ಪ್ರಾರ್ಥನೆ, ಪಶ್ಚಾತ್ತಾಪ, ಕ್ಷಮಾಪಣೆ, ಗೌರವ, ಪ್ರೀತಿ, ದಯೆ,
  ಕೆಲಸ, ಮತ್ತು ಆರೋಗ್ಯಕರ ಮನರಂಜನೆಯ ಚಟುವಟಿಕೆಗಳು ಈ ಮೂಲತತ್ವಗಳಿಂದ ಯಶಸ್ಸಿನ ವಿವಾಹ ಮತ್ತು ಕುಟುಂಬಗಳ ಸ್ಥಾಪಿಸಲ್ಪಟ್ಟು
  ನಿರ್ವಹಿಸಲ್ಪಡುತ್ತವೆ. ದೈವಿಕ ಯೋಜನೆಯಿಂದ ತಂದೆಯರು ತಮ್ಮ ಕುಟುಂಬದ ಮೇಲೆ ಪ್ರೀತಿ ಮತ್ತು ನೀತಿಯಿಂದ ಅಧ್ಯಕ್ಷತೆ ವಹಿಸಬೇಕು
  ಮತ್ತು ಅವರು ತಮ್ಮ ಕುಟುಂಬಗಳ ಜೀವನದ ಅವಶ್ಯಗಳನ್ನು ಮತ್ತು ರಕ್ಷಣೆ ನೀಡಲು ಅವರು ಜವಾಬ್ದಾರಿಯನ್ನು ಹೊಂದಿರುತ್ತಾರೆ. ತಾಯಂದಿರು
  ತಮ್ಮ ಮಕ್ಕಳ ಪೋಷಣೆಗೆ ಪ್ರಾಥಮಿಕವಾಗಿ ಜವಾಬ್ದಾರರಾಗಿರುತ್ತಾರೆ. ಈ ಪವಿತ್ರ ಜವಾಬ್ದಾರಿಗಳನ್ನು, ತಂದೆ ಮತ್ತು ತಾಯಿಯರು ಈ
  ಕರ್ತವ್ಯಗಳನ್ನು ಸಮಾನ ಪಾಲುದಾರರಾಗಿ ಒಬ್ಬರಿಗೊಬ್ಬರು ಸಹಾಯ ಮಾಡಲು ಬದ್ಧರಾಗಿರುತ್ತಾರೆ. ಅಂಗವಿಕಲತೆ, ಮರಣ, ಅಥವಾ ಇತರ ಪರಿಸ್ಥಿತಿಗಳಿಗೆ
  ವೈಯಕ್ತಿಕ ಹೊಂದಾಣಿಕೆಗಳಿಗೆ ಕಡ್ಡಾಯವಾಗಬಹುದು. ಸಹಾಯ ಬೇಕಾದಾಗ ಹತ್ತಿರದ ಸಂಬಂಧಿಕರು ಬೆಂಬಲ ನೀಡಬೇಕು.
- ಲೈಂಗಿಕ ಪರಿಶುದ್ಧತೆಯ ಒಡಂಬಡಿಕೆಗಳನ್ನು ಉಲ್ಲಂಘಿಸಿದರೆ, ಸಂಗಾತಿ ಅಥವಾ ಮಕ್ಕಳನ್ನು ನಿಂದಿಸಿದರೆ ಅಥವಾ ಕುಟುಂಬದ ಜವಾಬ್ದಾರಿಗಳನ್ನು
  ಪೂರೈಸಲು ವಿಫಲರಾದ ವ್ಯಕ್ತಿಗಳು ಒಂದು ದಿನ ದೇವರ ಮುಂದೆ ಹೊಣೆಗಾರರಾಗುತ್ತಾರೆ ಎಂದು ನಾವು ಎಚ್ಚರಿಸುತ್ತೇವೆ. ಇದಲ್ಲದೆ,
  ಕುಟುಂಬದ ವಿಘಟನೆಯು ವ್ಯಕ್ತಿಗಳು, ಸಮುದಾಯಗಳು ಮತ್ತು ರಾಷ್ಟ್ರಗಳ ಮೇಲೆ ಪ್ರಾಚೀನ ಮತ್ತು ಆಧುನಿಕ ಪ್ರವಾದಿಗಳು ಮುಂತಿಳಿಸಿರುವ
  ವಿಪತ್ತುಗಳನ್ನು ತರುತ್ತದೆ ಎಂದು ನಾವು ಎಚ್ಚರಿಸುತ್ತೇವೆ.
- ಕುಟುಂಬವನ್ನು ಸಮಾಜದ ಮೂಲಭೂತ ಘಟಕವಾಗಿ ನಿರ್ವಹಿಸಲು ಮತ್ತು ಬಲಪಡಿಸಲು ವಿನ್ಯಾಸಗೊಳಿಸಲಾದ ಕ್ರಮಗಳನ್ನು ಉತ್ತೇಜಿಸಲು ಎಲ್ಲೆಡೆ
  ಜವಾಬ್ದಾರಿಯುತ ಪ್ತಜೆಗಳು ಮತ್ತು ಸರ್ಕಾರಿ ಅಧಿಕಾರಿಗಳಿಗೆ ನಾವು ಮೊರೆಯಿಡುತ್ತೇವೆ.
