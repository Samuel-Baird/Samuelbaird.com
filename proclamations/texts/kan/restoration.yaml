title: ಯೇಸು ಕ್ರಿಸ್ತರ ಸಂಪೂರ್ಣ ಸುವಾರ್ತೆಯ ಪುನಃಸ್ಥಾಪನೆ
subtitle: ಪ್ರಪಂಚಕ್ಕೆ ದ್ವಿಶತಮಾನದ ಒಂದು ಪ್ರಕಟಣೆ
author: ಯೇಸು ಕ್ರಿಸ್ತನ ಕಡೆ ದಿನಗಳ ಸಂತರ ಸಭೆಯ ಪ್ರಥಮ ಅಧ್ಯಕ್ಷತೆಯು ಮತ್ತು ಹನ್ನೆರೆಡು ಅಪೋಸ್ತಲರ ಸಲಹಾ ಮಂಡಳಿ
note: 190 ನೇ ವಾರ್ಷಿಕ ಸರ್ವ ಸಭೆಯ ಸಮ್ಮೇಳನ ಅಂಗವಾಗಿ, ಸಭಾ ಅಧ್ಯಕ್ಷರಾದ ರಸ್ಸೆಲ್ ಎಮ್. ನೆಲ್ಸನ್ ರವರು ಈ ಪ್ರಕಟಣೆಯನ್ನು
  ಓದಿದರು. ಏಪ್ರಿಲ್ 5, 2020, ಸಾಲ್ಟ್ ಲೇಕ್ ಸಿಟಿ, ಯೂಟ.
paragraphs:
- ದೇವರು ಪ್ರಪಂಚದ ಪ್ರತಿಯೊಂದು ದೇಶದಲ್ಲಿರುವ ಅವರ ಮಕ್ಕಳನ್ನು ಪ್ರೀತಿಸುತ್ತಾರೆಂದು ನಾವು ಗಂಭೀರವಾಗಿ ಪ್ರಕಟಿಸುತ್ತೇವೆ.
  ತಂದೆಯಾದ ದೇವರು ನಮಗೆ ದೈವಿಕ ಜನನ, ಓಲಿಕೆಗೆ ಅಪೂರ್ವವಾದ ಜೀವನ, ಆತನ ಪ್ರಿಯಮಗನಾದ ಯೇಸು ಕ್ರಿಸ್ತರ ಅನಂತ ಪ್ರಾಯಶ್ಚಿತ್ತದ
  ತ್ಯಾಗವನ್ನು ನೀಡಿದ್ದಾರೆ. ತಂದೆಯ ಶಕ್ತಿಯಿಂದ ಯೇಸು ಪುನರುತ್ಥಾನಗೊಂಡು ಮತ್ತು ಮರಣದ ಮೇಲೆ ಜಯಗಳಿಸಿದರು. ಅವರು ನಮ್ಮ ರಕ್ಷಕರು,
  ನಮ್ಮ ಮಾದರಿ, ಮತ್ತು ನಮ್ಮ ವಿಮೋಚಕರಾಗಿದ್ದಾರೆ.
- ಇನ್ನೂರು ವರುಷಗಳ ಹಿಂದೆ 1820ರ ಒಂದು ಸುಂದರವಾದ ವಸಂತ ಋತುವಿನ ಶುಭಮುಂಜಾನೆಯಲ್ಲಿ, ಬಾಲ್ಯದ ಜೋಸೆಫ್ ಸ್ಮಿತ್, ಯಾವ ಸಭೆಗೆ
  ಸೇರಲೆಂದು ಹುಡುಕಾಡುತ್ತಿದ್ದರು. ಯು ಎಸ್ ಎ, ನ್ಯೂಯಾರ್ಕ್ ನ ಮೇಲ್ ರಾಜ್ಯದಲ್ಲಿ ಆತನ ಮನೆಯ ಬಳಿಯಿರುವ ಕಾಡಿಗೆ ಪ್ರಾರ್ಥಿಸಲು
  ಹೋದನು. ಆತನ ಆತ್ಮದ ಮುಕ್ತಿಯ ಸಲುವಾಗಿ ಪ್ರಶ್ನೆಗಳನ್ನು ಹೊಂದಿದ್ದರು ಮತ್ತು ದೇವರು ಆತನನ್ನು ಮಾರ್ಗದರ್ಶಿಸುವನೆಂದು ದೃಢ
  ನಂಬಿಕೆಯನ್ನು ಇಟ್ಟುಕ್ಕೊಂಡಿದ್ದರು.
- ಆತನ ಪ್ರಾರ್ಥನೆಯ ಉತ್ತರವಾಗಿ, ತಂದೆಯಾದ ದೇವರು ಮತ್ತು ಆತನ ಮಗನಾದ, ಯೇಸು ಕ್ರಿಸ್ತರು ಜೋಸೇಫನಿಗೆ ಕಾಣಿಸಿಕೊಂಡರೆಂದು ಸತ್ಯ
  ವೇದದಲ್ಲಿ ಪೂರ್ವಗ್ರಹಿಸಲಾಗಿದ್ದಂತೆ ಮತ್ತು “ಎಲ್ಲಾ ವಿಷಯಗಳ ಯಥಾಸ್ಥಿತಿಗೆ ಬರುವ ಸಮಯದ ವರೆಗೆ” (ಅಪೊಸ್ತಲರ ಕೃತ್ಯಗಳು 3:21)
  ಉದ್ಘಾಟಿಸಿದರು ಎಂದು ವಿನಯದಿಂದ ನಾವು ಘೋಷಿಸುತ್ತೇವೆ. ಈ ದರ್ಶನದಲ್ಲಿ ಮೂಲ ಅಪೋಸ್ತಲರ ಮರಣದ ನಂತರ ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಸಭೆಯು
  ಭೂಲೋಕದಿಂದ ಕಳೆದು ಹೋಗಿದೆ ಎನ್ನುವುದು ಆತನು ಕಲಿತುಕೊಂಡನು. ಜೋಸೆಫ್ ಅದರ ಮರಳುವಿಕೆಯಲ್ಲಿ ಪ್ರಮುಖ ಪಾತ್ರ ವಹಿಸುತ್ತಾರೆ.
- ತಂದೆ ಮತ್ತು ಮಗನ ನಿರ್ದೇಶನದ ಅಡಿಯಲ್ಲಿ ಪರಲೋಕದ ಸಂದೇಶಕರು ಜೋಸೇಫನಿಗೆ ಸೂಚನೆ ನೀಡಲು ಬಂದರು ಮತ್ತು ಯೇಸು ಕ್ರಿಸ್ತನ ಸಭೆಯನ್ನು
  ಪುನಃ ಸ್ಥಾಪನೆ ಮಾಡಲು ನಾವು ಸಮ್ಮತಿಸುತ್ತೇವೆ. ಪಾಪಗಳ ವಿಮೋಚನೆಗಾಗಿ ಮುಳುಗಿಸುವ ಮೂಲಕ ದೀಕ್ಷಾಸ್ನಾನ ಅಧಿಕಾರವನ್ನು ಪುನರುತ್ತಾನಗೊಂಡ
  ಸ್ನಾನಿಕನಾದ ಯೋಹಾನನು ಪುನಃಸ್ಥಾಪನೆಗೊಳಿಸಿದನು. ಅಸಲಿ ಹನ್ನೆರೆಡು ಅಪೋಸ್ತಲರಲ್ಲಿ ಮೂವರಾದ—ಪೇತ್ರ, ಜೇಮ್ಸ್, ಮತ್ತು ಯೋಹಾನ—ಅಪೋಸ್ತಲತನವನ್ನು
  ಮತ್ತು ಯಾಜಕತ್ವ ಅಧಿಕಾರದ ಕೀಳಿಗಳನ್ನು ಪುನಃಸ್ಥಾಪನೆ ಮಾಡಿದರು. ಎಲಿಯನನ್ನೂ ಸಹ ಒಳಗೊಂಡಂತೆ ಬೇರೆಯವರೂ ಬಂದು ಮರಣವನ್ನು
  ಮೀರಿಸುವ ನಿತ್ಯ ಸಂಬಂಧಗಳಲ್ಲಿ ಕುಟುಂಬಗಳನ್ನು ನಿರಂತರವಾಗಿ ಒಟ್ಟು ಗೂಡಿಸುವ ಅಧಿಕಾರವನ್ನು ಪುನಃಸ್ಥಾಪಿಸಿದರು.
- 'ಜೋಸೇಫನಿಗೆ ಪ್ರಾಚೀನ ದಾಖಲೆಯನ್ನು: ಮಾರ್ಮನ್ ಗ್ರಂಥ—ಯೇಸು ಕ್ರಿಸ್ತನ ಮತ್ತೊಂದು ಒಡಂಬಡಿಕೆಯು ಅನುವಾದಿಸಲು ದೇವರ ವರ ಮತ್ತು
  ಶಕ್ತಿ ದೊರಕಿದೆ ಎಂದು ನಾವು ಮತ್ತೊಮ್ಮೆ ಸಾಕ್ಷಿಯನ್ನು ನೀಡುತ್ತೇವೆ. ಈ ಪವಿತ್ರ ಬರವಣಿಗೆಯ ಪುಟಗಳು ಯೇಸು ಕ್ರಿಸ್ತನು ಪುನರುತ್ಧಾನಗೊಂಡ
  ಒಡನೆಯೇ ಪಶ್ಚಿಮ ಗೋಳಾರ್ಧಭಾಗದ ಜನರ ನಡುವೆ ನಡೆಸಿದ ವೈಯಕ್ತಿಕ ಸೇವೆಯನ್ನುಒಳಗೊಂಡಿರುತ್ತದೆ. ಇದು ಜೀವನದ ಉದ್ದೇಶ ಕಳಿಸುತದ್ದೆ
  ಮತ್ತು ಯೇಸು ಕ್ರಿಸ್ತನ ಸಿದ್ದಾಂತವನ್ನುಉಪದೇಶ ವಿವರಿಸುತ್ತದೆ. ಇದು ಆ ಉದ್ದೇಶಕೆ ಕೇಂದ್ರಿಕರವಾಗಿದೆ. ಸತ್ಯವೇದಕ್ಕೆ ಒಡನಾಡಿ
  ಗ್ರಂಥವಾಗಿ ಮಾರ್ಮನ್ ಗ್ರಂಥವು ಎಲ್ಲಾ ಮಾನವರು ಪ್ರೀತಿಸುವ ಪರಲೋಕದಲ್ಲಿರುವ ಒಬ್ಬ ತಂದೆಯ ಪುತ್ರರು ಮತ್ತು ಪುತ್ರಿಯರೆಂದು
  ಸಾಕ್ಷಿಯನ್ನು ನೀಡುತ್ತದೆ. ಹಾಗು ಆತನು ನಮ್ಮ ಜೀವನಗಳಿಗೆ ಒಂದು ದೈವಿಕ ಯೋಜನೆಯನ್ನು ಹೊಂದಿದ್ದಾರೆ ಮತ್ತು ಆತನ ಮಗನಾದ ಯೇಸು
  ಕ್ರಿಸ್ತರು ಪ್ರಾಚೀನ ದಿನಗಳಲ್ಲಿನ ಹಾಗೆ ಇಂದು ಸಹ ಮಾತನಾಡುತ್ತಿದ್ದಾರೆ.'
- ಏಪ್ರಿಲ್ 6, 1830 ರಲ್ಲಿ ಆಯೋಜಿಸಲಾದ ಯೇಸು ಕ್ರಿಸ್ತನ ಕಡೆ ದಿನಗಳ ಸಂತರ ಸಭೆಯು ಕ್ರಿಸ್ತನ ಹೊಸ ಒಡಂಬಡಿಕೆಯ ಸಭೆಯಾಗಿ ಪುನಃ
  ಸ್ಥಾಪಿಸಲಾಗಿದೆ ಎಂದು ನಾವು ಘೋಷಿಸುತ್ತೇವೆ. ಈ ಸಭೆಯು ಮುಖ್ಯ ಮೂಲೆಗಲ್ಲು ಮತ್ತು ಆತನಲ್ಲಿನ ಅನಂತ ಪ್ರಾಯಶ್ಚಿತ್ತ ಕ್ರಿಯೆ
  ಹಾಗು ವಾಸ್ತವಿಕ ಪುನರುತ್ಧಾನದ ಯೇಸು ಕ್ರಿಸ್ತನ ಪರಿಪೂರ್ಣ ಜೀವನದ ಮೇಲೆ ಆಧಾರಿತವಾಗಿದೆ. ಮತ್ತೊಮ್ಮೆ ಯೇಸು ಕ್ರಿಸ್ತನು ಅಪೋಸ್ತಲರನ್ನು
  ಕರೆದು ಅವರಿಗೆ ಯಾಜಕತ್ವದ ಅಧಿಕಾರವನ್ನು ನೀಡಿದ್ದಾರೆ. ಪವಿತ್ರಾತ್ಮನನ್ನು ಪಡೆಯಲು, ಮೋಕ್ಷದ ಆಜ್ಞಾವಿಧಿಗಳು ಹಾಗು ನಿರಂತರ
  ಸಂತೋಷವನ್ನು ಗಳಿಸಲು ಎಲ್ಲರನ್ನು ಆತನ ಬಳಿಗೆ ಮತ್ತು ಆತನ ಸಭೆಗೆ ಬರಲು ಆಹ್ವಾನಿಸುತ್ತಿದ್ದಾರೆ.
- ತಂದೆಯಾದ ದೇವರು ಮತ್ತು ಆತನ ಪ್ರಿಯ ಮಗನಾದ ಯೇಸು ಕ್ರಿಸ್ತ ಅವರಿಂದ ಪುನಃಸ್ಥಾಪನೆ ಆರಂಬಗೊಂಡು ಈಗ ಇನ್ನೂರು ವರುಷಗಳು ಮುಗಿದುಬಂದಿದೆ.
  ಪ್ರಪಂಚಾದ್ಯಂತ ದಶಲಕ್ಷಕ್ಕೂ ಹೆಚ್ಚು ಜನರು ಈ ಪೂರ್ವಗ್ರಹಿಸಲಾದ ಘಟನೆಗಳ ಜ್ಞಾನವನ್ನು ಸ್ವೀಕರಿಸಿದ್ದಾರೆ.
- ವಾಗ್ಧನದ ಪುನಃಸ್ಥಾಪನೆಯು ನಿರಂತರ ಪ್ರಕಟಣದ ಮೂಲಕ ಮುಂದುವರೆಯುತ್ತದೆ ಎಂದು ನಾವು ಹರ್ಷದಿಂದ ಘೋಷಿಸುತ್ತೇವೆ. ಭೂ ಲೋಕವು
  ಇನ್ನುಮುಂದೆ ಹಾಗೆ ಇರುವುದಿಲ್ಲ, ಏಕೆಂದರೆ ದೇವರು “ಕ್ರಿಸ್ತರಲ್ಲಿ ಎಲ್ಲವನ್ನು ಒಂದುಗೂಡಿಸುತ್ತಾರೆ” (ಎಫೆಸದವರಿಗೆ 1:10).
- ಪರಲೋಕವು ತೆರೆಯಲ್ಪಟ್ಟಿವೆ ಆತನ ಅಪೋಸ್ತಲರಾದ ನಾವು ನಮಗೆ ತಿಳಿದಿರುವುದಲ್ಲಿ ಎಲ್ಲರು ತಿಳಿದುಕ್ಕೊಳ್ಳಬೇಕು ಎಂದು ಪೂಜ್ಯಭಾವದಿಂದ
  ಮತ್ತು ಕೃತಜ್ಞತೆಯಿಂದ ಎಲ್ಲರನ್ನು—ಆಹ್ವಾನಿಸುತ್ತೇವೆ. ದೇವರು ಆತನ ಪ್ರೀತಿಯ ಪುತ್ರರು ಮತ್ತು ಪುತ್ರೀಯರಿಗೆ ಆತನ ಇಷ್ಟಾರ್ಥಗಳನ್ನು
  ತಿಳಿಯಪಡಿಸುತ್ತಿದ್ದನೆಂದು ನಾವು ಸಮ್ಮತಿಸುತ್ತೇವೆ. ಪುನಃಸ್ಥಾಪನೆಯ ಸಂದೇಶವನ್ನು ಪ್ರಾರ್ಥನಾಮನೋಭಾವದಿಂದ ಅಧ್ಯಯನ ಮಾಡಿ
  ಮತ್ತು ವಿಶ್ವಾಸದಿಂದ ಕ್ರಿಯೆ ಮಾಡುವವರು ಅದರ ದೈವತ್ವದ ತಮ್ಮದೇ ಸಾಕ್ಷಿಯನ್ನು ಪಡೆದುಕೊಳ್ಳಲು ಆಶೀರ್ವದಿಸಲ್ಪಡುತ್ತಾರೆ ಮತ್ತು
  ಕರ್ತನು ಮತ್ತು ರಕ್ಷಕರು ಯೇಸು ಕ್ರಿಸ್ತ ವಾಗ್ದಾನ ಮಾಡಲಾದ ಎರಡನೆಯ ಬರುವಿಕೆಗೆ ಪ್ರಪಂಚವನ್ನು ಸಿದ್ಧಪಡಿಸುವ ಉದ್ದೇಶವನ್ನು
  ಪಡೆದುಕೊಳ್ಳುತ್ತಾರೆ ಎಂದು ನಾವು ಸಾಕ್ಷಿ ಹೇಳುತ್ತೇವೆ.
