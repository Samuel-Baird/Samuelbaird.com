title: ಯ ವಿಶ್ವಾಸದ ಲೇಖನಗಳು
subtitle: ಯೇಸು ಕ್ರಿಸ್ತನ ಕಡೆ ದಿನಗಳ ಸಂತರ ಸಭೆ
author: ''
verses:
- n: 1
  text: ನಾವು ದೇವರಾದ, ನಿತ್ಯ ತಂದೆ, ಮತ್ತು ಆತನ ಮಗನಾದ, ಯೇಸು ಕ್ರಿಸ್ತರನ್ನು, ಮತ್ತು ಪವಿತ್ರಾತ್ಮವನ್ನು ನಂಬುತ್ತೇವೆ.
- n: 2
  text: ಮನುಷ್ಯರು ತಮ್ಮ ಸ್ವಂತ ಪಾಪಗಳಿಗಾಗಿ ಶಿಕ್ಷಿಸಲ್ಪಡುತ್ತಾರೆ ಆದರೆ ಅದಾಮಾನ ಉಲ್ಲಂಘನೆಗಾಗಿ ಅಲ್ಲವೆಂದು ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 3
  text: ಕ್ರಿಸ್ತನ ಪ್ರಾಯಶ್ಚಿತ್ತದ ಮೂಲಕ, ಸುವಾರ್ತೆಯ ಆಜ್ಞಾವಿಧಿಗಳಿಗೆ ಮತ್ತು ಕಾನೂನುಗಳಿಗೆ ವಿಧೇಯರಾಗುವ ಮೂಲಕ ಸಕಲ ಮನುಷ್ಯ
    ಕುಲವು ರಕ್ಷಿಸಲ್ಪಡಬಹುದೆಂದು ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 4
  text: 'ಸುವಾರ್ತೆಯ ಮೊದಲ ತತ್ವಗಳು ಮತ್ತು ಆಜ್ಞಾವಿಧಿಗಳೆಂದರೆ: ಮೊದಲನೆಯದು, ಕರ್ತನಾದ ಯೇಸು ಕ್ರಿಸ್ತನಲ್ಲಿ ವಿಶ್ವಾಸಿಸುವುದು;
    ಎರಡನೆಯದು, ಪಶ್ಚಾತ್ತಾಪ; ಮೂರನೆಯದು, ಪಾಪಗಳ ವಿಮೋಚನೆಗಾಗಿ ಮುಳುಗಿಸುವ ಮೂಲಕ ದೀಕ್ಷಾಸ್ನಾನ; ನಾಲ್ಕನೆಯದು, ಪವಿತ್ರಾತ್ಮದ
    ವರಕ್ಕಾಗಿ ಹಸ್ತಗಳನ್ನೀಡುವುದು ಎಂದು ನಾವು ನಂಬುತ್ತೇವೆ.'
- n: 5
  text: ಸುವಾರ್ತೆಯನ್ನು ಭೋಧಿಸಲು ಮತ್ತು ಅದರ ಆಜ್ಞಾವಿಧಿಗಳನ್ನು ನಿರ್ವಹಿಸಲು, ಒಬ್ಬ ಮನುಷ್ಯನು ದೇವರಿಂದ, ಪ್ರವಾದನೆಯ ಮೂಲಕ
    ಹಾಗೂ ಅಧಿಕಾರ ಹೊಂದಿರುವವರ ಹಸ್ತಗಳನ್ನು ಇಡುವ ಮೂಲಕ, ಕರೆಯಲ್ಪಡಬೇಕೆಂದು ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 6
  text: ಪ್ರಾಚೀನ ಸಭೆಯಲ್ಲಿದ್ದ ಅದೇ ಸಂಘಟನೆಯನ್ನು, ಅಂದರೆ ಅಪೊಸ್ತಲರು, ಪ್ರವಾದಿಗಳು, ಸಭಾಪಾಲಕರು, ಉಪದೇಶಿಕರು, ಸೌವಾರ್ತಿಕರು
    ಮತ್ತು ಮುಂತಾದವುಗಳನ್ನು ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 7
  text: ವಾಣಿಗಳ ವರ, ಪ್ರವಾದನೆ, ಪ್ರಕಟನೆ, ದರ್ಶನಗಳು, ಸ್ವಸ್ಥತೆ, ಭಾಷೆಗಳ ಅರ್ಥವನ್ನು ಹೇಳುವುದು ಮತ್ತು ಮುಂತಾದವುಗಳನ್ನು
    ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 8
  text: ಸರಿಯಾಗಿ ಅನುವಾದಗೊಂಡಷ್ಟರವರೆಗೆ ಸತ್ಯವೇದವನ್ನು ದೇವರ ವಾಕ್ಯವೆಂದು ನಾವು ನಂಬುತ್ತೇವೆ; ಮಾರ್ಮನ್ ಗ್ರಂಥವನ್ನು ಸಹ
    ದೇವರ ವಾಕ್ಯವೆಂದು ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 9
  text: ದೇವರು ಪ್ರಕಟಿಸಿದ ಎಲ್ಲವನ್ನೂ, ಈಗ ಅವರು ಪ್ರಕಟಿಸುತ್ತಿರುವ ಎಲ್ಲವನ್ನೂ ನಾವು ನಂಬುತ್ತೇವೆ ಮತ್ತು ದೇವರ ರಾಜ್ಯಕ್ಕೆ
    ಸಂಬಂಧಿಸಿದ ಅನೇಕ ಮಹತ್ವಪೂರ್ಣ ಮತ್ತು ಪ್ರಮುಖ ವಿಷಯಗಳನ್ನು ಅವರು ಇನ್ನೂ ಪ್ರಕಟಿಸುತ್ತಾರೆ ಎಂದು ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 10
  text: ಇಸ್ರಾಯೆಲರ ವಾಸ್ತವಿಕ ಕೂಡಿಸುವಿಕೆ ಮತ್ತು ಹತ್ತು ಕುಲಗಳ ಪುನಃಸ್ಥಾಪನೆಯಲ್ಲಿ; ಚೀಯೋನ್ (ನವೀನ ಯೆರೂಸಲೇಮ್) ಅನ್ನು
    ಅಮೇರಿಕ ಖಂಡದಲ್ಲಿ ನಿರ್ಮಿಸಲಾಗುವುದು; ಭೂಮಿಯ ಮೇಲೆ ಕ್ರಿಸ್ತನು ವೈಯಕ್ತಿಕವಾಗಿ ಆಳ್ವಿಕೆ ನಡೆಸುತ್ತಾರೆ; ಮತ್ತು, ಭೂಮಿಯು
    ನವೀಕರಿಸಲ್ಪಡುತ್ತದೆ ಮತ್ತು ಅದರ ಸ್ವರ್ಗೀಯ ಮಹಿಮೆಯನ್ನು ಪಡೆಯುತ್ತದೆ ಎಂದು ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 11
  text: ನಮ್ಮ ಆತ್ಮಸಾಕ್ಷಿಯು ನಿರ್ದೇಶಿಸುವ ಪ್ರಕಾರ ಸರ್ವಶಕ್ತನಾದ ದೇವರನ್ನು ಆರಾಧಿಸುವ ಸೌಕರ್ಯದ ಹಕ್ಕನ್ನು ನಾವು ಕೋರಿಕೊಳ್ಳುತ್ತೇವೆ
    ಮತ್ತು ಎಲ್ಲಾ ಮನುಷ್ಯರಿಗೂ ಅವರು ಹೇಗೆ, ಎಲ್ಲಿ, ಅಥವಾ ಏನನ್ನು ಆರಾಧಿಸಬಹುದು ಎಂಬ ಇದೇ ಸೌಕರ್ಯದ ಹಕ್ಕನ್ನು ಅನುಮತಿಸುತ್ತೇವೆ.
- n: 12
  text: ರಾಜರು, ಅಧ್ಯಕ್ಷರು, ಆಳ್ವಿಕೆಗಾರರು ಮತ್ತು ನ್ಯಾಯಾಧೀಶರಿಗೆ ಅಧೀನರಾಗಿ, ಕಾನೂನನ್ನು ಪಾಲಿಸುವುದನ್ನು, ಗೌರವಿಸುವುದನ್ನು
    ಮತ್ತು ಅದಕ್ಕೆ ಬೆಂಬಲವನ್ನು ನೀಡುವುದನ್ನು ನಾವು ನಂಬುತ್ತೇವೆ.
- n: 13
  text: ನಾವು ಪ್ರಾಮಾಣಿಕತೆ, ಸತ್ಯತೆ, ಪರಿಶುದ್ಧತೆ, ದಯಾಳು, ಸದ್ಗುಣ, ಮತ್ತು ಎಲ್ಲಾ ಮಾನವರಿಗೆ ಒಳ್ಳೆಯದು ಮಾಡುವುದನ್ನು
    ನಂಬುತ್ತೇವೆ; ವಾಸ್ತವವಾಗಿ, ನಾವು ಪೌಲನ ಉಪದೇಶವನ್ನು ಅನುಸರಿಸುತ್ತೇವೆ ಎಂದು ಹೇಳಬಹುದು—ನಾವು ಎಲ್ಲವನ್ನೂ ನಂಬುತ್ತೇವೆ,
    ನಾವು ಎಲ್ಲವನ್ನೂ ನಿರೀಕ್ಷಿಸುತ್ತೇವೆ, ನಾವು ಬಹಳಷ್ಟು ವಿಷಯಗಳನ್ನೂ ಸಹಿಸಿಕೊಂಡಿದ್ದೇವೆ. ಮತ್ತು ಎಲ್ಲವನ್ನೂ ಸಹಿಸಿಕೊಳ್ಳಲು
    ಸಾಧ್ಯವಾಗುತ್ತದೆ ಎಂದು ನಿರೀಕ್ಷಿಸುತ್ತೇವೆ. ಇನ್ನೇನಾದರು, ಸದ್ಗುಣ, ಪ್ರೀತಿಕರವೋ, ಅಥವಾ ಒಳ್ಳೆಯ ವರದಿ ಅಥವಾ ಪ್ರಶಂಸನೀಯ
    ಯಾವುದಾದರೂ ಇದ್ದರೆ, ನಾವು ಇಂತಹ ವಿಷಯಗಳನ್ನು ಅನ್ವೇಷಿಸುತ್ತೇವೆ ಎಂದು ನಂಬುತ್ತೇವೆ.
signature: ಜೋಸಫ್ ಸ್ಮಿತ್
