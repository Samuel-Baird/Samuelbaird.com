title: Família
subtitle: Proklamason pa Mundu
author: Primeru Prizidénsia y Konselhu di Dozi Apóstulus di Igreja di Jezus Kristu di Santus di Últimus
  Dias
note: Ês proklamason foi lidu pa Prizidenti Gordon B. Hinckley komu parti di sê mensajen na runion jeral
  di sosiedadi di sokoru rializadu dia 23 di Sitenbru di 1995, na Salt Lake City, Stadu di Utah, EUA.
paragraphs:
- Nós, di Primeru Prizidénsia y Konselhu di Dozi Apóstulus di Igreja di Jezus Kristu di Santus di Últimus
  Dias, solenimenti nu ta proklama ki kazamentu entri ómi y mudjer ê ordenadu pa Deus y ki família ê isensial
  na planu di Kriador pa distinu iternu di Sê fidjus.
- Tudu ser umanu — matxu y fémia — foi kriadu na imajen di Deus. Kada psoa ê fidju matxu ô fidju fémia
  jeradu en spíritu pa pais selestial ki ta ama-l y, pur isu, es ten un natureza y distinu divinu. Seksu
  (maskulinu ô fimininu) ê un karakteristika isensial di identidadi y di prupózitu pré-mortal, mortal
  y iternu di kada psoa.
- Na sfera pré-mortal, fidjus matxu y fidjus fémia ki foi jeradu na spíritu konxeba y ta adoraba Deus
  komu sês Pai Iternu y ta aseitaba Sê planu, ki ta pirmitiba ki Sê fidjus ten un korpu fíziku y ganha
  spirénsia terenu pa es podi prugridi rumu pa perfeison y tirmina pa alkansa sês distinu divinu komu
  erderus di vida iterna. Planu divinu di filisidadi ta pirmiti ki rilasionamentu familiar ta ser perpetuadu
  alén di morti. Ordenansas y konvénius sagradus dispunivel na tenplu santu ta torna pusível ki psoas
  volta pa prizénsa di Deus y pa famílias ser unidu pa senpri.
- Primeru mandamentu ki Deus da pa Adon y Eva era sobri sês putensial di ser pais na kondison di maridu
  y mudjer. Nu ta diklara ki mandamentus di Deus pa Sê fidjus di multiplika y intxi téra kontinua ta privalesi.
  Nu ta diklara inda ki Deus manda ki puder sagradu di prokriason ta ser uzadu somenti entri ómi y mudjer,
  legalmenti kazadu komu maridu y spoza.
- Nu ta diklara ki forma sima vida mortal ê kriadu foi divinamenti stabilisidu pa Deus. Nu ta afirma santidadi
  di vida y sê inpurtánsia na planu iternu di Deus.
- Maridu y mudjer ten soleni risponsabilidadi di ama y kuida di kunpanheru y di sês fidjus. “Fidjus ê
  eransa di Sinhor” (Salmu 127:3). Pais ten diver sagradu di kria sês fidjus na amor y retidon, atendi
  sês nesesidadis fíziku y spiritual, y pa inxina-s ama y sirvi kunpanheru, guarda mandamentus di Deus,
  y ser sidadons kunpridoris di lei indipendentimenti di undi k’es ta mora. Maridu y mudjer — mai y pai
  — ta ser risponsabilizadu peranti Deus pa kunprimentu d’es obrigasons.
- Família ê ordenadu pa Deus. Kazamentu entri ómi y mudjer ê isensial pa Sê planu iternu. Fidjus ten direitu
  di nasi dentu di lasu di matrimóniu, y pa ser kriadu pa pai y mai ki ta onra votos di matrimóniu ku
  total fidelidadi. Filisidadi na vida familiar ê mas provável di ser alkansadu kuandu ê sta fundamentadu
  na insinamentus di Sinhor Jezus Kristu. Kazamentu y família ben susedidu ê stabilisidu y mantidu na
  prinsípiu di fé, di orason, di arependimentu, di perdon, di ruspetu, di amor, di konpaxon, di trabadju,
  y di atividadis rikriativu saudável. Sigundu mudelu divinu, pai debi prizidi sê família ku amor y retidon,
  ku risponsabilidadi pa atendi nesesidadis di vida di sê família y di proteje-s. Primeru risponsabilidadi
  di mai ê kuida di sê fidjus. Ne’s risponsabilidadis sagradu, pai y mai ten obrigason di djuda kunpanheru,
  sima parserus igual. Difisénsia, morti, ô otu sirkunstánsia podi iziji adaptason individual. Otus familiaris
  podi da apoiu kuandu nesesáriu.
- Nu ta aviza ki psoas ki viola konvénius di kastidadi, ki abuza di konjuji ô di fidjus, ô ki dexa di
  kunpri sês risponsabilidadis familiar un dia ta ser risponsabilizadu peranti Deus. Alén disu, nu ta
  aviza ki dizintegrason di família ta trazi riba psoas, kumunidadis, y nasons kalamidadis profetizadu
  pa prufetas antigus y mudernus.
- Nu ta apela sidadons y ajentis di guvernu risponsável di mundu interu pa prumovi es mididas dizignadu
  pa manti y fortalesi família komu unidadi fundamental di sosiedadi.
