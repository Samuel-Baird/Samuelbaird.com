title: Den Levande Kristus
subtitle: Apostlarnas vittnesbörd
author: Jesu Kristi Kyrka av Sista Dagars Heliga
paragraphs:
- När vi nu firar att Jesus Kristus föddes för två tusen år sedan, ger vi vårt vittnesbörd om hans oförlikneliga
  levnad och om den oändliga kraften i hans stora försoningsoffer. Ingen annan har haft ett så djupgående
  inflytande på alla som har levt och som kommer att leva på jorden.
- Han var Gamla testamentets store Jehova, Nya testamentets Messias. Under ledning av sin Fader skapade
  han jorden. ”Allt blev till genom honom, och utan honom blev ingenting till av det som är till” (Johannes
  1:3). Fastän han var syndfri döptes han för att uppfylla all rättfärdighet. Han ”gick omkring och gjorde
  gott” (Apostlagärningarna 10:38), men blev föraktad för det. Hans evangelium var ett budskap om frid
  och god vilja. Han vädjade till alla att följa hans exempel. Han vandrade på vägarna i Palestina, botade
  sjuka, gav de blinda synen åter och uppväckte döda. Han undervisade om eviga sanningar, föruttillvarons
  verklighet, syftet med vårt liv på jorden och de möjligheter som Guds söner och döttrar har i det kommande
  livet.
- Han instiftade nattvarden som påminnelse om sitt stora försoningsoffer. Han fängslades och dömdes på
  falska grunder, förklarades skyldig för att tillfredsställa folkmassan och dömdes att dö på Golgatas
  kors. Han gav sitt liv för att sona alla människors synder. Hans offer som ställföreträdare var en storslagen
  gåva till alla dem som någonsin skulle leva på jorden.
- Vi vittnar högtidligen om att hans liv, som är det centrala i hela mänsklighetens historia, varken började
  i Betlehem eller slutade på Golgata. Han var Faderns förstfödde, den enfödde Sonen i köttet, världens
  Återlösare.
- Han uppstod från graven för att bli ”förstlingen av de insomnade” (1 Korintierbrevet 15:20). Som uppstånden
  besökte Herren dem som han hade älskat i livet. Han verkade också bland sina ”andra får” (Johannes 10:16)
  i det forna Amerika. I vår tid visade han och hans Fader sig för den unge Joseph Smith och inledde den
  länge utlovade tiden när allt skulle sammanfattas (se Efesierbrevet 1:10).
- 'Om den levande Kristus skrev profeten Joseph: ”Hans ögon var som en eldslåga, håret på hans huvud var
  vitt som ren snö, hans ansikte lyste klarare än solen, och hans röst var som ljudet av väldiga vattens
  brus, ja, Jehovas röst, som sa:'
- ’Jag är den förste och den siste. Jag är den som lever. Jag är den som blev dödad. Jag är er förespråkare
  inför Fadern’” (Läran och förbunden 110:3–4).
- 'Om honom sa också profeten: ”Och nu, efter de många vittnesbörd som har getts om honom är detta det
  allra sista vittnesbördet som vi ger om honom: Att han lever!'
- För vi såg honom, ja, på Guds högra sida, och vi hörde rösten vittna om att han är Faderns Enfödde –
- om att medelst honom och genom honom och av honom skapas och skapades världarna, och deras invånare
  är födda som söner och döttrar åt Gud” (Läran och förbunden 76:22–24).
- Vi förkunnar med allvarliga ord att hans prästadöme och hans kyrka har återställts på jorden – ”uppbyggda
  på apostlarnas och profeternas grund, där hörnstenen är Kristus Jesus själv” (Efesierbrevet 2:20).
- Vi vittnar om att han en dag ska återvända till jorden. ”Herrens härlighet ska uppenbaras, alla människor
  ska se det tillsammans” (Jesaja 40:5). Han ska regera som kungarnas Kung och som herrarnas Herre, och
  varje knä ska böjas och varje tunga ska prisa och dyrka honom. Var och en av oss kommer att stå inför
  Gud för att dömas efter sina gärningar och sitt hjärtas önskningar.
- Vi bär, i egenskap av hans vederbörligen ordinerade apostlar, vittnesbörd om att Jesus är den levande
  Kristus, Guds odödlige Son. Han är den store Kungen, Immanuel, som i dag står vid sin Faders högra sida.
  Han är världens ljus, liv och hopp. Hans väg är den stig som leder till lycka i detta liv och evigt
  liv i den kommande världen. Gud vare tack för den oförlikneliga gåvan – hans gudomlige Son.
