title: Trosartiklarna
subtitle: i Jesu Kristi Kyrka av Sista Dagars Heliga
author: ''
verses:
- n: 1
  text: Vi tror på Gud den evige Fadern, på hans Son Jesus Kristus och på den Helige Anden.
- n: 2
  text: Vi tror att människorna kommer att straffas för sina egna synder och inte för Adams överträdelse.
- n: 3
  text: Vi tror att hela människosläktet kan frälsas genom Kristi försoning och genom lydnad mot evangeliets
    lagar och förrättningar.
- n: 4
  text: Vi tror att evangeliets första principer och förrättningar är 1) tro på Herren Jesus Kristus,
    2) omvändelse, 3) dop genom nedsänkning till syndernas förlåtelse, 4) handpåläggning för den Helige
    Andens gåva.
- n: 5
  text: Vi tror att en man för att predika evangeliet och betjäna i dess förrättningar måste kallas av
    Gud genom profetia och genom handpåläggning av dem som har myndighet.
- n: 6
  text: Vi tror på samma organisation som fanns i den ursprungliga kyrkan, nämligen apostlar, profeter,
    herdar, lärare, evangelister och så vidare.
- n: 7
  text: Vi tror på tungomålets, profetians, uppenbarelsens, synernas, helbrägdagörelsens, tungomålsuttydningens
    gåva och så vidare.
- n: 8
  text: Vi tror att Bibeln är Guds ord i den mån den är rätt översatt. Vi tror också att Mormons bok är
    Guds ord.
- n: 9
  text: Vi tror allt vad Gud har uppenbarat och allt vad han nu uppenbarar, och vi tror att han ännu kommer
    att uppenbara många stora och viktiga ting angående sitt rike.
- n: 10
  text: Vi tror på Israels bokstavliga insamling och på de tio stammarnas återställelse, att Sion (Nya
    Jerusalem) kommer att grundläggas på det amerikanska fastlandet, att Kristus personligen kommer att
    regera på jorden samt att jorden kommer att förnyas och få sin paradisiska härlighet.
- n: 11
  text: Vi gör anspråk på förmånen att tillbe Gud den Allsmäktige i enlighet med vårt eget samvetes maningar
    och erkänner alla människors rätt till samma förmån, att tillbe hur, var eller vad de vill.
- n: 12
  text: Vi tror på att underordna oss kungar, presidenter, styresmän och överhetspersoner samt att lyda,
    ära och upprätthålla lagen.
- n: 13
  text: 'Vi tror på att vara ärliga, sanna, kyska, välvilliga och dygdiga och att göra gott mot alla människor,
    ja, vi kan verkligen säga att vi följer Paulus uppmaning: Vi tror allting, vi hoppas allting, vi har
    uthärdat mycket och hoppas kunna uthärda allting. Finns det något som är dygdigt, älskligt eller hedrande
    eller berömvärt, så söker vi efter detta.'
signature: Joseph Smith.
