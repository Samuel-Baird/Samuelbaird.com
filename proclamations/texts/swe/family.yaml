title: Familjen
subtitle: Ett tillkännagivande för världen
author: Första presidentskapet och de tolv apostlarnas råd i Jesu Kristi Kyrka av Sista Dagars Heliga
note: Detta tillkännagivande upplästes av president Gordon B. Hinckley som en del av hans budskap vid
  Hjälpföreningens allmänna möte den 23 september 1995 i Salt Lake City i Utah.
paragraphs:
- Vi, första presidentskapet och de tolv apostlarnas råd i Jesu Kristi Kyrka av Sista Dagars Heliga, förkunnar
  högtidligen att äktenskapet mellan man och kvinna är instiftat av Gud och att familjen har en central
  roll i Skaparens plan för sina barns eviga bestämmelse.
- Alla människor – män och kvinnor – är skapade till Guds avbild. Var och en är ett andebarn, en älskad
  son eller dotter till himmelska föräldrar och har som sådan gudomliga egenskaper och förutsättningar.
  Att det finns olika kön är nödvändigt för den enskildes förjordiska, jordiska och eviga identitet och
  uppgift.
- I föruttillvaron kände och dyrkade dessa söner och döttrar Gud som sin evige Fader och antog hans plan,
  enligt vilken hans barn kunde få en fysisk kropp och få jordiska erfarenheter för att utvecklas mot
  fullkomlighet och slutligen nå sin gudomliga bestämmelse som arvtagare till evigt liv. Den gudomliga
  lycksalighetsplanen möjliggör att familjebanden fortsätter bortom graven. Heliga förrättningar och förbund
  i heliga tempel gör det möjligt för enskilda personer att återvända till Guds närhet, och för familjer
  att vara tillsammans för evigt.
- Det första bud som Gud gav Adam och Eva gällde deras möjlighet att som man och hustru bli föräldrar.
  Vi förkunnar att Guds bud till sina barn att föröka sig och uppfylla jorden fortfarande gäller. Vi förkunnar
  vidare att Gud har befallt att den heliga fortplantningsförmågan endast ska användas mellan man och
  kvinna, lagligt vigda som man och hustru.
- Vi tillkännager att det sätt varpå människoliv skapas har bestämts av Gud. Vi bekräftar livets helgd
  och dess betydelse i Guds eviga plan.
- Man och hustru har ett högtidligt ansvar att älska och vårda sig om varandra och sina barn. ”Barn är
  en Herrens gåva” (Psaltaren 127:3). Föräldrar har ett heligt ansvar att uppfostra sina barn i kärlek
  och rättfärdighet, att sörja för deras fysiska och andliga behov, att lära dem älska och tjäna varandra,
  att hålla Guds bud och vara laglydiga medborgare var än de bor. Män och hustrur – mödrar och fäder –
  kommer att stå till svars inför Gud för hur de uppfyller dessa plikter.
- Familjen är instiftad av Gud. Äktenskap mellan man och kvinna är en nödvändig del av hans eviga plan.
  Barn har rätt att födas inom äktenskapets ram, och att fostras av en far och en mor som ärar sina äktenskapslöften
  med fullständig trohet. Största förutsättningarna för lycka i familjelivet finns då det byggs på Herren
  Jesu Kristi lärdomar. Framgångsrika äktenskap och familjer skapas och bevaras genom principerna tro,
  bön, omvändelse, förlåtelse, respekt, kärlek, medkänsla, arbete och sund rekreation. Enligt gudomlig
  plan ska fadern presidera över sin familj i kärlek och rättfärdighet och han har ansvaret att sörja
  för och beskydda sin familj. Moderns främsta ansvar är barnens omvårdnad. I dessa heliga ansvar är fadern
  och modern skyldiga att hjälpa varandra som likvärdiga makar. Funktionsnedsättning, död eller andra
  omständigheter kan göra det nödvändigt med individuella anpassningar. Släktingar bör vid behov ge hjälp
  och stöd.
- Vi varnar dem som bryter mot kyskhetsbudet, som förgriper sig på maka eller barn, eller som underlåter
  att fullgöra sina skyldigheter mot familjen, att de en dag kommer att stå ansvariga inför Gud. Vi varnar
  vidare för att familjens upplösning kommer att frambringa de stora olyckor över enskilda människor,
  samhällen och nationer som förutsagts av forntida och nutida profeter.
- Vi uppmanar ansvariga samhällsmedborgare, regeringar och myndigheter överallt att verka aktivt för att
  bevara och stärka familjen som samhällets grundläggande enhet.
