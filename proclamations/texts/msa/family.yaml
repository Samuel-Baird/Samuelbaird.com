title: Keluarga
subtitle: Suatu Perisytiharan kepada Dunia
author: Presidensi Utama dan Majlis Dua Belas Rasul dari Gereja Yesus Kristus Orang Suci Zaman Akhir
note: Perisytiharan ini dibaca oleh Presiden Gordon B. Hinckley sebagai bahagian dari pesanannya di Pertemuan
  Umum Lembaga Pertolongan yang diadakan pada 23 September 1995 di Salt Lake City, Utah.
paragraphs:
- Kami, Presidensi Utama dan Majlis Dua Belas Rasul dari Gereja Yesus Kristus Orang Suci Zaman Akhir,
  dengan sungguh-sungguh mengisytiharkan bahawa perkahwinan antara seorang lelaki dan seorang perempuan
  ditahbiskan oleh Tuhan dan bahawa keluarga adalah utama di dalam rancangan Pencipta demi takdir ilahi
  yang abadi bagi anak-anak-Nya.
- Semua insan—lelaki dan perempuan—dicipta untuk menyerupai Tuhan. Setiap insan adalah anak rohani lelaki
  atau anak rohani perempuan kepada ibu bapa syurgawi, dan, oleh demikian, masing-masing mempunyai sifat
  dan takdir ilahi. Jantina merupakan sifat yang asas untuk identiti dan tujuan prafana, fana, dan abadi
  seseorang individu.
- Di alam prafana, anak-anak rohani lelaki dan perempuan mengenali dan menyembah Tuhan sebagai Bapa Abadi
  mereka dan menerima rancangan-Nya di mana melaluinya mereka dapat memperolehi suatu tubuh fizikal serta
  mendapat pengalaman duniawi untuk maju menuju kesempurnaan dan pada akhirnya mencapai takdir mereka
  sebagai waris kepada kehidupan abadi. Rancangan kegembiraan ilahi, membolehkan hubungan keluarga diteruskan
  selepas kematian. Tatacara-tatacara dan perjanjian-perjanjian yang sedia ada di rumah Tuhan yang kudus
  memungkinkan setiap orang untuk kembali ke hadirat Tuhan dan membolehkan keluarga-keluarga disatukan
  secara abadi.
- Perintah pertama yang Tuhan berikan kepada Adam dan Hawa berkaitan dengan kemungkinan mereka mencapai
  keibubapaan sebagai suami dan isteri. Kami mengisytiharkan bahawa perintah Tuhan bagi anak-anak-Nya
  untuk beranak pinak dan bertambah di dunia masih berkuat kuasa. Seterusnya kami mengisytiharkan bahawa
  Tuhan telah memerintah bahawa kuasa memperanakkan yang kudus harus digunakan hanya di antara seorang
  lelaki dan seorang perempuan yang telah dikahwinkan menurut undang-undang negara sebagai suami dan isteri.
- Kami mengisytiharkan bahawa cara dengan mana kehidupan fana dicipta adalah ditetapkan oleh Tuhan. Kami
  menegaskan kesucian kehidupan dan kepentingannya di dalam rancangan kekal Tuhan.
- Suami dan isteri mempunyai tanggungjawab yang mustahak untuk menyayangi serta menjaga satu sama lain
  dan anak-anak mereka. “Anak-anak adalah [suatu warisan] Tuhan” (Mazmur 127:3) Ibu bapa mempunyai tugas
  yang kudus untuk membesarkan anak-anak mereka dengan kasih sayang dan kesolehan, menafkahi mereka dari
  segi keperluan fizikal mahupun keperluan rohani mereka, dan mengajar mereka untuk menyayangi serta melayani
  satu sama lain, mentaati perintah-perintah Tuhan dan menjadi warganegara yang mematuhi undang-undang
  di mana-mana pun mereka tinggal. Para suami dan para isteri—para ibu dan para bapa—akan dipertanggungjawabkan
  di hadapan Tuhan untuk menjalankan kewajipan-kewajipan ini.
- Keluarga ditetapkan Tuhan. Perkahwinan antara lelaki dan wanita adalah perlu untuk rancangan abadi-Nya.
  Anak-anak berhak dilahirkan di dalam ikatan perkahwinan dan dibesarkan oleh seorang bapa dan seorang
  ibu yang melunaskan ikrar perkahwinan dengan kesetiaan yang mutlak. Kegembiraan dalam kehidupan kekeluargaan
  adalah paling mungkin dicapai apabila berasaskan ajaran Tuhan Yesus Kristus. Perkahwinan-perkahwinan
  dan keluarga-keluarga yang berjaya didirikan dan dikekalkan atas asas-asas iman, doa, pertaubatan, pengampunan,
  hormat, kasih sayang, belas kasihan, kerja, dan kegiatan rekreasi yang baik dan sihat. Menurut tujuan
  Tuhan, para bapa patut mengetuai keluarga mereka dengan kasih sayang dan kesolehan, dan bertanggungjawab
  menafkahi keperluan kehidupan dan memberi perlindungan bagi keluarga mereka. Para ibu terutamanya bertanggungjawab
  bagi pemeliharaan anak-anak mereka. Di dalam tanggungjawab-tanggungjawab yang suci ini, para bapa dan
  para ibu diwajibkan membantu satu sama lain sebagai ahli pasangan yang setaraf. Ketidakupayaan, kematian,
  atau keadaan-keadaan lain barangkali memerlukan penyesuaian tersendiri. Keluarga-keluarga terdekat harus
  memberi sokongan apabila perlu.
- Kami memberi amaran bahawa orang yang melanggar perjanjian-perjanjian kemurnian akhlak, yang mendera
  isteri atau suami atau anak-anak, atau gagal memenuhi kewajipan-kewajipan kekeluargaan akan pada suatu
  hari dipertanggungjawabkan di hadapan Tuhan. Seterusnya, kami memberi amaran bahawa pemecahan keluarga
  akan mendatangkan bencana ke atas individu-individu, komuniti-komuniti, dan negara-negara seperti yang
  diramalkan oleh nabi-nabi kuno mahupun kini.
- Kami memanggil warganegara-warganegara dan pegawai-pegawai kerajaan yang bertanggungjawab di merata
  tempat untuk menyokong dan menggalakkan langkah-langkah yang dicipta dengan tujuan mengekalkan serta
  menguatkan keluarga sebagai unit asas masyarakat.
