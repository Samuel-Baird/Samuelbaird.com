retrieved: '2026-11-02'
title: Gjengivelsen av Jesu Kristi evangeliums fylde
subtitle: En erklæring til verden ved 200-årsjubileet
author: Det første presidentskap og De tolv apostlers råd i Jesu Kristi Kirke av Siste Dagers Hellige
note: Denne erklæringen ble lest av president Russell M. Nelson som en del av hans budskap på den 190.
  årlige generalkonferanse 5. april 2020 i Salt Lake City i Utah.
paragraphs:
- Vi erklærer høytidelig at Gud elsker sine barn i alle verdens nasjoner. Gud Faderen har gitt oss sin
  elskede Sønn Jesu Kristi guddommelige fødsel, uforlignelige liv og altomfattende sonoffer. Ved Faderens
  kraft sto Jesus opp igjen og vant seieren over døden. Han er vår Frelser, vårt eksempel og vår Forløser.
- For 200 år siden, på en vakker vårmorgen i 1820, gikk unge Joseph Smith, idet han søkte å få vite hvilken
  kirke han skulle slutte seg til, ut i skogen for å be i nærheten av sitt hjem i delstaten New York i
  USA. Han hadde spørsmål om sin sjels frelse og stolte på at Gud ville rettlede ham.
- I ydmykhet erklærer vi at som svar på hans bønn viste Gud Faderen og hans Sønn Jesus Kristus seg for
  Joseph, og innledet at “alt … blir gjenopprettet” (Apostlenes gjerninger 3:21) slik det er forutsagt
  i Bibelen. I dette synet fikk han vite at etter at de opprinnelige apostlene døde, var Kristi kirke
  i Det nye testamente borte fra jorden. Joseph skulle spille en nøkkelrolle i dens tilbakekomst.
- Vi bekrefter at under ledelse av Faderen og Sønnen, kom himmelske budbærere for å instruere Joseph og
  gjenopprette Jesu Kristi Kirke. Den oppstandne døperen Johannes gjenga myndigheten til å døpe ved nedsenkning
  til syndenes forlatelse. Tre av de opprinnelige tolv apostlene – Peter, Jakob og Johannes – gjenga apostelembedet
  og nøkler til prestedømsmyndighet. Andre kom også, herunder Elijah, som gjenga myndighet til å knytte
  familier sammen for evig i evige forhold som overgår døden.
- 'Vi vitner videre om at Joseph Smith ble gitt Guds gave og kraft til å oversette en oldtidsopptegnelse:
  Mormons bok – enda et vitnesbyrd om Jesus Kristus. Sider i denne hellige teksten inneholder en beretning
  om Jesu Kristi personlige tjenestegjerning blant mennesker på den vestlige halvkule kort tid etter hans
  oppstandelse. Den underviser om livets hensikt og forklarer Kristi lære, som er sentral i denne hensikt.
  Som ledsagende skrift til Bibelen vitner Mormons bok om at alle mennesker er sønner og døtre av en kjærlig
  Fader i himmelen, at han har en guddommelig plan for vårt liv, og at hans Sønn Jesus Kristus taler i
  dag så vel som i fordums tid.'
- Vi erklærer at Jesu Kristi Kirke av Siste Dagers Hellige, organisert den 6. april 1830, er gjenopprettelsen
  av Kristi kirke i Det nye testamente. Denne kirken er forankret i dens hovedhjørnesten, Jesus Kristus,
  i hans fullkomne liv, hans altomfattende forsoning og bokstavelige oppstandelse. Jesus Kristus har igjen
  kalt apostler og gitt dem prestedømsmyndighet. Han innbyr oss alle til å komme til ham og hans kirke,
  til å motta Den hellige ånd, de frelsende ordinanser og til å oppnå varig glede.
- Det har nå gått 200 år siden denne gjenopprettelsen ble innledet av Gud Faderen og hans elskede Sønn
  Jesus Kristus. Millioner over hele verden har tatt imot kunnskap om disse profeterte begivenhetene.
- Vi erklærer med glede at den lovede gjenopprettelsen går fremover gjennom fortsatt åpenbaring. Jorden
  vil aldri bli den samme igjen, når Gud skal “samle alt til ett i Kristus” (Paulus’ brev til efeserne
  1:10).
- Med ærbødighet og takknemlighet innbyr vi som hans apostler alle til å kunne vite – slik vi gjør – at
  himlene er åpne. Vi bekrefter at Gud gjør sin vilje kjent for sine elskede sønner og døtre. Vi vitner
  om at de som med bønnens hjelp studerer gjenopprettelsens budskap og handler i tro, vil bli velsignet
  med å få sitt eget vitnesbyrd om dens guddommelighet og dens hensikt med å forberede verden til vår
  Herre og Frelser Jesu Kristi lovede annet komme.
