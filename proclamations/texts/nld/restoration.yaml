retrieved: '2026-11-02'
title: De herstelling van de volheid van het evangelie van Jezus Christus
subtitle: een proclamatie aan de wereld in het 200e gedenkjaar
author: Het Eerste Presidium en de Raad der Twaalf Apostelen van De Kerk van Jezus Christus van de Heiligen
  der Laatste Dagen
note: President Russell M. Nelson heeft deze proclamatie op 5 april 2020 in de 190e algemene aprilconferentie
  in Salt Lake City (Utah, VS) voorgelezen.
paragraphs:
- Wij verklaren plechtig dat God zijn kinderen in alle landen van de wereld liefheeft. God de Vader heeft
  ons de goddelijke geboorte, het weergaloze leven en het oneindige zoenoffer van zijn geliefde Zoon,
  Jezus Christus, gegeven. Door de macht van de Vader is Jezus herrezen en heeft Hij de dood overwonnen.
  Hij is onze Heiland, ons Voorbeeld en onze Verlosser.
- Tweehonderd jaar geleden ging de jonge Joseph Smith op een prachtige voorjaarsochtend in 1820 het bos
  in bij zijn ouderlijke woning in het noorden van de Amerikaanse staat New York om in gebed te vragen
  bij welke kerk hij zich moest aansluiten. Hij had vragen over het heil van zijn ziel en vertrouwde erop
  dat God hem zou leiden.
- Wij verklaren nederig dat God de Vader en zijn Zoon, Jezus Christus, in antwoord op zijn gebed aan Joseph
  zijn verschenen, en dat Zij, zoals voorzegd in de Bijbel, de tijd hebben ingeluid waarin ‘alle dingen
  worden hersteld’ (Handelingen 3:21). Hij vernam in dit visioen dat de nieuwtestamentische kerk van Christus
  na de dood van de oorspronkelijke apostelen op aarde verloren was gegaan. Joseph zou een grote rol spelen
  in het herstellen ervan.
- Wij bevestigen dat er op aanwijzing van de Vader en de Zoon hemelse boodschappers zijn gekomen om Joseph
  te instrueren en de Kerk van Jezus Christus opnieuw te vestigen. De verrezen Johannes de Doper herstelde
  het gezag om door onderdompeling te dopen tot vergeving van zonden. Drie van de oorspronkelijke twaalf
  apostelen – Petrus, Jakobus en Johannes – herstelden het apostelschap en de sleutels van het priesterschapsgezag.
  Er kwamen ook anderen, onder wie Elia, die het gezag herstelde om familieleden voor altijd met elkaar
  te verbinden in een eeuwige relatie die de dood overstijgt.
- 'Wij getuigen verder dat Joseph Smith de gave en de macht van God kreeg om een oude kroniek te vertalen,
  het Boek van Mormon: een testament van Jezus Christus. In deze heilige tekst staat onder meer een verslag
  van de persoonlijke bediening van Jezus Christus onder mensen op het westelijk halfrond, kort na zijn
  opstanding. Het boek zet het doel van het leven uiteen en verduidelijkt de leer van Christus, die van
  hoofdbelang is voor dat doel. Als Schriftuur die hand in hand met de Bijbel gaat, getuigt het Boek van
  Mormon dat alle mensen zonen en dochters van een liefdevolle Vader in de hemel zijn, dat Hij een goddelijk
  plan voor ons heeft, en dat zijn Zoon, Jezus Christus, in deze tijd spreekt, net als in vroegere tijden.'
- Wij verklaren dat De Kerk van Jezus Christus van de Heiligen der Laatste Dagen, die op 6 april 1830
  is opgericht, de herstelde nieuwtestamentische kerk van Christus is. Deze kerk is verankerd in het volmaakte
  leven van haar hoeksteen, Jezus Christus, en in zijn oneindige verzoening en letterlijke opstanding.
  Jezus Christus heeft weer apostelen geroepen, en heeft hun priesterschapsgezag verleend. Hij nodigt
  ons allen uit om tot Hem en zijn kerk te komen, de Heilige Geest en de heilsverordeningen te ontvangen,
  en blijvende vreugde te verwerven.
- Er is nu tweehonderd jaar voorbijgegaan sinds deze herstelling door God de Vader en zijn geliefde Zoon,
  Jezus Christus, werd ingezet. Miljoenen mensen over de hele wereld hebben met blijdschap van deze geprofeteerde
  gebeurtenissen kennisgenomen.
- Wij verklaren verheugd dat de beloofde herstelling door voortschrijdende openbaring doorgaat. De aarde
  zal nooit meer hetzelfde zijn, omdat God ‘alles weer in Christus bijeen [zal] brengen’ (Efeze 1:10).
- Wij, als zijn apostelen, nodigen iedereen eerbiedig en dankbaar uit om te weten te komen, zoals wij
  weten, dat de hemel openstaat. Wij verklaren dat God zijn wil voor zijn geliefde zonen en dochters bekendmaakt.
  Wij getuigen dat wie de boodschap van de herstelling onder gebed bestuderen en in geloof handelen, gezegend
  zullen worden met hun eigen getuigenis van de goddelijke oorsprong ervan, en van haar doel om de wereld
  op de beloofde wederkomst van onze Heer en Heiland, Jezus Christus, voor te bereiden.
