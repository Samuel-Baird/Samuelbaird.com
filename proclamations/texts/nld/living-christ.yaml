title: De levende Christus
subtitle: Het getuigenis van de apostelen
author: De Kerk van Jezus Christus van de Heiligen der Laatste Dagen
paragraphs:
- Nu wij gedenken dat Jezus Christus twee millennia geleden geboren is, getuigen wij van zijn bestaan,
  zijn weergaloze leven, en de oneindige kracht van zijn grote zoenoffer. Niemand heeft zo’n diepgaande
  invloed gehad op allen die op aarde geleefd hebben en nog zullen leven.
- Hij was de grote Jehova van het Oude Testament, de Messias van het Nieuwe Testament. Onder leiding van
  zijn Vader heeft Hij de aarde geschapen. ‘Alle dingen zijn door het Woord gemaakt, en zonder dit Woord
  is geen ding gemaakt dat gemaakt is’ (Johannes 1:3). Hoewel Hij zondeloos was, liet Hij Zich dopen om
  alle gerechtigheid te vervullen. ‘Hij [is] het land doorgegaan, terwijl Hij goeddeed’ (Handelingen 10:38),
  maar werd ervoor veracht. Zijn evangelie was een boodschap van vrede en welbehagen. Hij drukte allen
  op het hart zijn voorbeeld te volgen. Hij doorkruiste het land Palestina, waarbij Hij zieken genas,
  blinden hun gezichtsvermogen gaf en doden opwekte. Hij verkondigde eeuwige waarheden; zo leerde Hij
  zijn volgelingen dat wij vóór dit leven al bestonden, dat ons leven op aarde een doel heeft, en dat
  de zoons en dochters van God ongekende mogelijkheden hebben in het hiernamaals.
- Hij heeft het avondmaal ingesteld om ons te herinneren aan zijn grote zoenoffer. Hij is in hechtenis
  genomen en schuldig verklaard op grond van lasterlijke aantijgingen, gevonnist om het gepeupel ter wille
  te zijn, veroordeeld tot de dood aan het kruis op Golgotha. Hij heeft zijn leven gegeven om verzoening
  te doen voor de zonden van het hele mensdom. Zijn plaatsvervangende lijden was zijn geschenk aan allen
  die ooit op aarde zouden leven.
- Wij getuigen plechtig dat zijn leven, waar de hele menselijke geschiedenis om draait, niet in Betlehem
  is begonnen, noch op Golgotha is geëindigd. Hij is de Eerstgeborene van de Vader, de eniggeboren Zoon
  in het vlees, de Verlosser van de wereld.
- Hij is herrezen uit het graf ‘en is de eersteling geworden van hen die ontslapen zijn’ (1 Korinthe 15:20).
  Als herrezen Heer heeft Hij degenen bezocht die Hij tijdens zijn leven had liefgehad. Ook is Hij in
  het oude Amerika onder zijn ‘andere schapen’ werkzaam geweest (zie Johannes 10:16). In de hedendaagse
  wereld zijn Hij en zijn Vader verschenen aan de jonge Joseph Smith, waarmee de lang geleden beloofde
  bedeling ‘van de volheid van de tijden’ (Efeze 1:10) werd ingeluid.
- 'Over de levende Christus heeft de profeet Joseph Smith geschreven: ‘Zijn ogen waren als een vurige
  vlam; het haar op zijn hoofd was zo wit als zuivere sneeuw; zijn gelaat straalde nog helderder dan de
  zon; en zijn stem was als het bruisen van geweldige wateren, ja, de stem van Jehova, die zei:'
- ‘Ik ben de eerste en de laatste; Ik ben het die leeft, Ik ben het die werd gedood; Ik ben uw voorspraak
  bij de Vader’ (Leer en Verbonden 110:3–4).
- 'Van Hem heeft de profeet ook gezegd: ‘En nu, na de vele getuigenissen die van Hem zijn gegeven, is
  dit het getuigenis, het laatste van alle, dat wij van Hem geven: dat Hij leeft!'
- ‘Want wij zagen Hem, ja, aan de rechterhand van God; en wij hoorden de stem getuigen dat Hij de Eniggeborene
  van de Vader is –
- ‘dat door Hem en in Hem en uit Hem de werelden worden en werden geschapen, en dat de bewoners daarvan
  voor God gewonnen zonen en dochters zijn’ (Leer en Verbonden 76:22–24).
- Wij verklaren plechtig dat zijn priesterschap en zijn kerk op aarde hersteld zijn – ‘gebouwd op het
  fundament van de apostelen en profeten, waarvan Jezus Christus Zelf de hoeksteen is’ (Efeze 2:20).
- Wij getuigen dat Hij eens op aarde zal terugkeren. ‘En de heerlijkheid van de Heere zal geopenbaard
  worden, en alle vlees tezamen zal het zien’ (Jesaja 40:5). Hij zal heersen als Koning der koningen en
  regeren als Heer der heren, en elke knie zal zich buigen en elke tong zal Hem in aanbidding loven. Ieder
  van ons zal voor Hem staan om door Hem te worden geoordeeld naar onze werken en de verlangens van ons
  hart.
- Wij getuigen, als zijn naar behoren geordende apostelen, dat Jezus de levende Christus is, de onsterfelijke
  Zoon van God. Hij is de grote Koning Immanuël, die Zich nu aan de rechterhand van zijn Vader bevindt.
  Hij is het licht, het leven en de hoop van de wereld. Zijn weg is het pad dat leidt tot geluk in dit
  leven en tot het eeuwige leven in de wereld hierna. God zij dank voor de weergaloze gave van zijn goddelijke
  Zoon.
