title: Ang Panimalay
subtitle: Isa ka Proklamasyon sa Kalibutan
author: Ang Unang Pangulohan kag ang Konseho sang Dose ka Apostoles sang Ang Simbahan ni Jesucristo sang
  mga Santos sa Ulihing mga Adlaw
note: Ini nga proklamasyon ginbasa ni Pangulong Gordon B. Hinckley bilang bahin sang iya mensahe sa General
  Relief Society Meeting nga ginhiwat sang Septyembre 23, 1995, sa Siyudad sang Salt Lake, Utah.
paragraphs:
- Kami, ang Unang Pangulohan kag ang Konseho sang Dose ka Apostoles sang Ang Simbahan ni Jesucristo sang
  mga Santos sa Ulihing mga Adlaw, pormal nga nagaproklamar nga ang pag-asawahay sa tunga sang isa ka
  lalaki kag isa ka babayi ginmando sang Dios kag nga ang panimalay labing importante sa plano sang Tagtuga
  para sa wala’y katapusan nga kapalaran sang Iya mga kabataan.
- Ang tanan nga tawo—lalaki kag babayi—gintuga sa dagway sang Dios. Ang kada isa isa ka pinalangga nga
  espiritu nga anak nga lalaki ukon anak nga babayi sang langitnon nga mga ginikanan, kag tungod sina,
  ang kada isa may diosnon nga kinaiya kag kapalaran. Ang gender [sahi] isa ka kinahanglanon nga kinaiya
  sang indibidwal para sa wala pa mabun-ag, mortal, kag wala’y katapusan nga palatandaan kag katuyuan.
- Sa kalibutan sang wala pa mabun-ag, ang espiritu nga mga anak nga lalaki kag mga anak nga babayi nakakilala
  kag nagasimba sa Dios bilang ila Wala’y Katapusan nga Amay kag nagbaton sang Iya plano nga paagi sa
  sini ang Iya mga kabataan sarang makaangkon sing isa ka pisikal nga lawas kag makaagom sang dutan-on
  nga inagihan sa pag-uswag padulong sa kahimpitan kag sa katapusan makalab-ot sa ila diosnon nga kapalaran
  bilang mga manunubli sang kabuhi nga wala’y katapusan. Ang diosnon nga plano sang kalipayan nagatugot
  sang pang-panimalay nga mga kaangtanan sa pagpadayon didto pa gid sa pihak sang kamatayon. Ang sagrado
  nga mga ordinansa kag mga kasugtanan nga maangkon sa balaan nga mga templo nagahimo sini nga posible
  para sa mga indibidwal sa pagbalik sa nahamtangan sang Dios kag para sa mga panimalay nga matingob sa
  wala’y katapusan.
- Ang una nga kasuguan nga ginhatag sang Dios kanday Adan kag Eva napertineser sa ila potensyal para sa
  pagkaginikanan bilang bana kag asawa. Ginapahayag namon nga ang kasuguan sang Dios para sa Iya mga kabataan
  sa pagmuad kag pagpuno sa duta nagapabilin gihapon nga may puersa. Dugang namon nga ginapahayag nga
  ang Dios nagsugo nga ang sagrado nga mga gahum sang pagtuga sang anak pagagamiton lamang sa tunga sang
  lalaki kag babayi, nga legal nga ginkasal bilang bana kag asawa.
- Ginapahayag namon nga ang mga pahito nga sa amo nga paagi gintuga ang mortal nga kabuhi, diosnon nga
  ginpanulin. Nagapamatuod kami sa pagkabalaan sang kabuhi kag sang iya sini pagkaimportante sa wala’y
  katapusan nga plano sang Dios.
- Ang bana kag asawa may dungganon nga responsibilidad sa pagpalangga kag pagtatap sa isa kag isa kag
  sa ila mga kabataan. “Ang mga anak panublion gikan sa Ginuo” (Mga Salmo 127:3). Ang mga ginikanan may
  sagrado nga tulumanon sa pagpadako sang ila mga kabataan sa gugma kag pagkamatarong, sa pagpanangkap
  sang ila pisikal kag espirituhanon nga mga panginahanglan, kag sa pagtudlo sa ila sa pagpalangga kag
  pag-alagad sa isa kag isa, sa pagtuman sang mga kasuguan sang Dios kag mangin mga banwahanon nga matinumanon
  sa layi bisan diin man sila nagapuyo. Ang mga bana kag mga asawa—mga iloy kag mga amay—pagakabigon nga
  may salabton sa atubang sang Dios sa pagpatuman sining mga obligasyon.
- Ang panimalay gin-ordin sang Dios. Ang pag-asawahay sa tunga sang lalaki kag babayi tuman ka importante
  sa Iya wala’y katapusan nga plano. Ang mga kabataan may kinamatarong nga mabun-ag sa sulod sang higot
  sang matrimonyo, kag padakuon sang isa ka amay kag isa ka iloy nga nagatahod sang panumpa sang pag-asawahay
  upod ang lubos nga pag-unong. Ang kalipayan sa kabuhi sang panimalay laban nga malab-ot kon napasad
  sa mga pinanudlo sang Ginuong Jesucristo. Ang madinalag-on nga mga pag-asawahay kag mga panimalay napahamtang
  kag ginapadayon sa mga prinsipyo sang pagtuo, pangamuyo, paghinulsol, pagpatawad, pagtahod, gugma, kaluoy,
  trabaho, kag makapaayo nga mga kahiwatan sa paglingaw-lingaw. Suno sa diosnon nga plano, ang mga amay
  amo ang magapamuno sa ila mga panimalay sa gugma kag pagkamatarong kag responsable sa pagpanangkap sang
  mga kinahanglanon sa kabuhi kag pag-amlig sang ila mga panimalay. Ang mga iloy una sa tanan, amo ang
  responsable sa pagbatiti sang ila mga kabataan. Sa sining sagrado nga mga responsibilidad, ang mga amay
  kag mga iloy obligado sa pagbulig sa isa kag isa bilang palareho nga magkatuwang. Sa tinion sang kasablagan,
  kamatayon, ukon iban pa nga mga sirkumstansya ayhan pagakinahanglanon ang indibidwal nga pagpabagay.
  Ang mga paryente dapat nga magtanyag sang ayuda kon ginakinahanglan.
- Nagapaandam kami nga ang mga indibidwal nga nagalapas sang kasugtanan sang kaputli, nga nagaabuso sang
  tiayon ukon anak, ukon nga nagapatumbaya sa pagtuman sang mga responsibilidad sa panimalay magatindog
  sa adlaw nga magaabot nga may salabton sa atubang sang Dios. Dugang pa sini, nagapaandam kami nga ang
  pagkabungkag sang panimalay magadala sa mga indibidwal, mga komunidad, kag mga pungsod sang mga kalalat-an
  nga ginpanagna sang dumaan kag moderno nga mga propeta.
- Ginapanawagan namon ang responsable nga mga banwahanon kag mga opisyales sang gobyerno bisan diin sa
  pagpasulong sadtong mga tikang nga gintuyo sa pagtipig kag pagpabakod sang panimalay bilang tig-una
  nga yunit sang sosyedad.
