title: Uskonkappaleet
subtitle: Myöhempien Aikojen Pyhien Jeesuksen Kristuksen Kirkon
author: ''
verses:
- n: 1
  text: Me uskomme Jumalaan, iankaikkiseen Isään, ja hänen Poikaansa, Jeesukseen Kristukseen, ja Pyhään
    Henkeen.
- n: 2
  text: Me uskomme, että ihmiset saavat rangaistuksen omista synneistään eivätkä Aadamin rikkomuksesta.
- n: 3
  text: Me uskomme, että koko ihmissuku voi pelastua Kristuksen sovituksen ansiosta noudattamalla evankeliumin
    lakeja ja toimituksia.
- n: 4
  text: Me uskomme, että evankeliumin ensimmäiset periaatteet ja toimitukset ovat ensimmäiseksi, usko
    Herraan Jeesukseen Kristukseen; toiseksi, parannus; kolmanneksi, upotuskaste syntien anteeksisaamiseksi;
    neljänneksi, kätten päällepaneminen Pyhän Hengen lahjan saamiseksi.
- n: 5
  text: Me uskomme, että saarnatakseen evankeliumia ja suorittaakseen sen toimituksia miehen täytyy olla
    Jumalan kutsuma profetian kautta ja niiden kätten päällepanemisella, joilla on toimivalta.
- n: 6
  text: Me uskomme samaan järjestykseen, joka oli alkukirkossa, nimittäin apostoleihin, profeettoihin,
    paimeniin, opettajiin, evankelistoihin ja niin edelleen.
- n: 7
  text: Me uskomme kielillä puhumisen, profetian, ilmoituksen, näkyjen, parantamisen, kielten tulkitsemisen
    ja niin edelleen lahjaan.
- n: 8
  text: Me uskomme, että Raamattu on Jumalan sanaa, sikäli kuin se on oikein käännetty; me uskomme myös,
    että Mormonin kirja on Jumalan sanaa.
- n: 9
  text: Me uskomme kaiken, mitä Jumala on ilmoittanut, kaiken, mitä hän nykyään ilmoittaa, ja me uskomme,
    että hän ilmoittaa vielä monia suuria ja tärkeitä Jumalan valtakuntaa koskevia asioita.
- n: 10
  text: Me uskomme Israelin todelliseen kokoamiseen ja kymmenen heimon palauttamiseen, että Siion (Uusi-Jerusalem)
    rakennetaan Amerikan mantereelle, että Kristus tulee hallitsemaan henkilökohtaisesti maan päällä ja
    että maa uudistetaan ja se saa paratiisillisen kirkkautensa.
- n: 11
  text: Me vaadimme oikeutta palvella kaikkivaltiasta Jumalaa oman omantuntomme vaatimusten mukaan ja
    sallimme kaikille ihmisille saman oikeuden, palvelivatpa he miten, missä tai mitä tahansa.
- n: 12
  text: Me uskomme, että kuninkaille, presidenteille, hallitsijoille ja hallitusmiehille tulee olla alamainen
    ja että tulee noudattaa, kunnioittaa ja ylläpitää lakia.
- n: 13
  text: Me uskomme, että tulee olla vilpitön, uskollinen, siveellinen, hyväntahtoinen ja hyveellinen ja
    että tulee tehdä hyvää kaikille ihmisille; tosiaankin, voimme sanoa seuraavamme Paavalin kehotusta
    – me uskomme kaikessa, me toivomme kaikessa, me olemme kestäneet paljon ja toivomme voivamme kestää
    kaiken. Jos on jotakin hyveellistä, rakastettavaa tai hyvältä kuuluvaa tai kiitettävää, sitä me etsimme.
signature: Joseph Smith.
