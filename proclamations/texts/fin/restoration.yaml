title: Jeesuksen Kristuksen evankeliumin täyteyden palautus
subtitle: Kaksisataavuotisjulistus maailmalle
author: Myöhempien Aikojen Pyhien Jeesuksen Kristuksen Kirkon ensimmäinen presidenttikunta ja kahdentoista
  apostolin neuvosto
note: Presidentti Russell M. Nelson luki tämän julistuksen osana puhettaan 190. vuosikonferenssissa 5.
  huhtikuuta 2020 Salt Lake Cityssä Utahissa Yhdysvalloissa.
paragraphs:
- Me julistamme juhlallisesti, että Jumala rakastaa lapsiaan maailman jokaisessa kansakunnassa. Isä Jumala
  on antanut meille rakkaan Poikansa Jeesuksen Kristuksen jumalallisen syntymän, verrattoman elämän ja
  äärettömän sovitusuhrin. Isän voimalla Jeesus nousi jälleen ja sai voiton kuolemasta. Hän on meidän
  Vapahtajamme, Esimerkkimme ja Lunastajamme.
- Kaksisataa vuotta sitten kauniina kevätaamuna vuonna 1820 nuori Joseph Smith – halutessaan tietää, mihin
  kirkkoon liittyä – meni rukoilemaan metsikköön lähellä kotiaan New Yorkin osavaltion pohjoisosassa Yhdysvalloissa.
  Hänellä oli kysymyksiä, jotka koskivat hänen sielunsa pelastusta, ja hän luotti siihen, että Jumala
  ohjaisi häntä.
- Nöyrästi me julistamme, että vastauksena Josephin rukoukseen Isä Jumala ja Hänen Poikansa Jeesus Kristus
  ilmestyivät Josephille ja panivat alulle kaiken kohdalleen asettamisen (ks. Ap. t. 3:21), kuten on ennustettu
  Raamatussa. Tässä näyssä Joseph sai tietää, että alkuperäisten apostolien kuoleman jälkeen Kristuksen
  Uuden testamentin aikaan perustama kirkko katosi maan päältä. Joseph tulisi olemaan avainasemassa kirkon
  palauttamisessa.
- Me vahvistamme, että Isän ja Pojan johdolla taivaallisia sanansaattajia tuli opettamaan Josephia ja
  vakiinnuttamaan jälleen Jeesuksen Kristuksen kirkon. Ylösnoussut Johannes Kastaja palautti valtuuden
  kastaa upottamalla syntien anteeksisaamiseksi. Kolme alkuperäisistä kahdestatoista apostolista – Pietari,
  Jaakob ja Johannes – palauttivat apostolinviran ja pappeuden valtuuden avaimet. Myös muita tuli, mukaan
  lukien Elia, joka palautti valtuuden yhdistää perheitä yhteen ikuisesti iankaikkisiksi suhteiksi, jotka
  kestävät yli kuoleman.
- 'Lisäksi me todistamme, että Joseph Smithille annettiin Jumalan lahja ja voima kääntää muinainen aikakirja:
  Mormonin kirja – toinen todistus Jeesuksesta Kristuksesta. Tämän pyhän kirjan sivut sisältävät kertomuksen
  Jeesuksen Kristuksen henkilökohtaisesta palvelutyöstä ihmisten keskuudessa läntisellä pallonpuoliskolla
  pian Hänen ylösnousemuksensa jälkeen. Siinä opetetaan elämän tarkoitusta ja selitetään Kristuksen oppia,
  joka on elämän tarkoituksen kannalta keskeinen. Pyhänä kirjana Raamatun rinnalla Mormonin kirja todistaa,
  että kaikki ihmiset ovat rakastavan taivaallisen Isän poikia ja tyttäriä, että Hänellä on jumalallinen
  suunnitelma meidän elämäämme varten ja että Hänen Poikansa Jeesus Kristus puhuu nykyään samoin kuin
  entisinä aikoina.'
- Me julistamme, että Myöhempien Aikojen Pyhien Jeesuksen Kristuksen Kirkko, joka on järjestetty 6. huhtikuuta
  1830, on Kristuksen Uuden testamentin aikaan perustama kirkko, joka on palautettu. Tämän kirkon ankkurina
  on sen kulmakiven, Jeesuksen Kristuksen, täydellinen elämä sekä Hänen ääretön sovituksensa ja kirjaimellinen
  ylösnousemuksensa. Jeesus Kristus on jälleen kerran kutsunut apostoleja ja on antanut heille pappeuden
  valtuuden. Hän kutsuu meitä kaikkia tulemaan Hänen luokseen ja Hänen kirkkoonsa, ottamaan vastaan Pyhän
  Hengen, pelastuksen toimitukset ja kokemaan kestävää iloa.
- Kaksisataa vuotta on nyt kulunut siitä, kun Isä Jumala ja Hänen rakas Poikansa Jeesus Kristus panivat
  alulle tämän palautuksen. Miljoonat kautta maailman ovat vastaanottaneet tiedon näistä profetoiduista
  tapahtumista.
- Me julistamme riemuiten, että luvattu palautus etenee jatkuvan ilmoituksen välityksellä. Maapallo ei
  enää koskaan tule olemaan entisellään, sillä Jumala yhdistää ”Kristuksessa yhdeksi kaiken” (Ef. 1:10).
- Kunnioitusta ja kiitollisuutta tuntien me Hänen apostolinsa kutsumme kaikkia tietämään – kuten me tiedämme
  – että taivaat ovat avoinna. Me vahvistamme, että Jumala tekee tiettäväksi tahtonsa rakkaille pojilleen
  ja tyttärilleen. Me todistamme, että ne, jotka rukoillen tutkivat palautuksen sanomaa ja toimivat uskossa,
  saavat siunauksena oman todistuksen sen jumalallisuudesta ja sen tarkoituksesta valmistaa maailmaa Herramme
  ja Vapahtajamme Jeesuksen Kristuksen luvattua toista tulemista varten.
