title: Ang Buhi nga Kristo
subtitle: Ang Pagpamatuod sa mga Apostol
author: Ang Simbahan ni Jesukristo sa mga Santos sa Ulahing mga Adlaw
paragraphs:
- Samtang kita magsaulog sa pagkatawo ni Jesukristo duha ka libo ka tuig na ang milabay, kami mohalad
  sa among pagpamatuod sa pagkatinuod sa Iyang dili hitupngan nga kinabuhi ug sa walay kataposan nga gahom
  sa Iyang labing dako nga sakripisyo sa pag-ula. Walay lain nga adunay labaw ka mahinungdanon nga impluwensya
  sa tanan kinsa nakapuyo ug magpuyo pa dinhi sa yuta.
- Siya mao ang Halangdong Jehova sa Daang Tugon, ang Mesiyas sa Bag-ong Tugon. Ubos sa pagdumala sa Iyang
  Amahan, Siya mao ang tiglalang sa yuta. “Ang tanang butang nangahimo pinaagi kaniya ug walay bisan usa
  ka butang nga nahimo nga dili pinaagi kaniya niadtong mga butang nga nangahimo” (Juan 1:3). “Bisan og
  walay sala, Siya gibunyagan aron sa pagtuman sa tibuok pagkamatarong. Siya mipadayon sa pagbuhat og
  maayo” (Mga Buhat 10:38), apan siya gitamay tungod niini. Ang Iyang ebanghelyo usa ka mensahe sa kalinaw
  ug pakigdait. Siya kinasingkasing nga mihangyo sa tanan sa pagsunod sa Iyang panig-ingnan. Siya naglakaw
  sa mga dalan sa Palestina, nag-ayo sa masakiton, naghimo nga ang buta makakita, ug nagbuhi sa patay.
  Siya nagtudlo sa mga kamatuoran bahin sa kahangtoran, sa pagkatinuod sa atong kinabuhi nga wala pa dinhi
  sa yuta, ug sa kahimoan alang sa mga anak nga lalaki ug mga anak nga babaye sa Dios sa umaabot nga kinabuhi.
- Siya mipasiugda sa sakramento isip usa ka handomanan sa Iyang labing dako nga sakripisyo sa pag-ula.
  Siya gidakop ug gihukman sa bakak nga mga pasangil, gipahamtangan og sala aron matagbaw ang manggugubot
  nga panon, ug gihukman nga mamatay sa krus sa Kalbaryo. Siya mihatag sa Iyang kinabuhi aron sa pag-ula
  sa mga sala sa tanang katawhan. Ang Iyang kinabuhi usa ka gasa nga gihatag alang sa tanan kinsa magpuyo
  dinhi sa yuta.
- Kami sa maligdong nga paagi mopamatuod nga ang Iyang kinabuhi, diin mao ang mahinungdanon sa tibuok
  kasaysayan sa tawo, wala magsugod sa Betlehem ni natapos sa Kalbaryo. Siya mao ang Unang Natawo sa Amahan,
  ang Bugtong Anak diha sa unod, ang Manunubos sa kalibotan.
- Siya mibangon gikan sa lubnganan para mahimong “unang bunga gikan sa nangamatay” (1 Mga Taga-Corinto
  15:20). Isip Nabanhaw nga Ginoo, Siya miduaw niadtong Iyang gihigugma dinhi sa kinabuhi. Siya usab nangalagad
  taliwala sa Iyang “ubang mga karnero” (Juan 10:16) sa karaang Amerika. Sa kalibotan karon, Siya ug ang
  Iyang Amahan nagpakita ngadto sa batang lalaki nga si Joseph Smith, sinugdanan sa dugay nang gisaad
  nga “kapaigoan sa kahingpitan sa mga panahon” (Mga Taga-Efeso 1:10).
- 'Mahitungod sa Buhi nga Kristo, si Propeta Joseph misulat: “Ang iyang mga mata ingon sa usa ka siga
  sa kalayo; ang buhok sa iyang ulo puti sama sa lunsay nga yelo; ang iyang panagway mihayag labaw sa
  kahayag sa adlaw; ug ang iyang tingog ingon sa dahunog sa dagko nga katubigan gani ang tingog ni Jehova,
  nga nag-ingon:'
- “Ako mao ang sinugdanan ug ang kataposan; Ako mao siya kinsa nabuhi, Ako mao siya kinsa gipatay; Ako
  mao ang inyong manlalaban ngadto sa Amahan” (D&P 110:3–4).
- 'Mahitungod Kaniya ang Propeta mipahayag usab: “Ug karon, human sa daghan nga pagpamatuod nga gihatag
  mahitungod kaniya kini mao ang pagpamatuod, ang kataposan sa tanan, nga kami naghatag kaniya: Nga siya
  buhi!'
- “Kay kami nakakita kaniya, gani diha sa tuo nga kilid sa Dios; ug kami nakadungog sa tingog nga nagpamatuod
  nga siya mao ang Bugtong Anak sa Amahan—
- “Nga pinaagi kaniya, ug ngadto kaniya, ug tungod kaniya, ang mga kalibotan nalalang, ug ang mga lumulupyo
  niana mao ang mga anak nga lalaki ug mga anak nga babaye sa Dios” (D&P 76:22–24).
- Kami mopahayag pinaagi sa ligdong nga mga pulong nga ang Iyang pagkapari ug ang Iyang Simbahan gipahiuli
  dinhi sa yuta—“tinukod ibabaw sa patukoranan sa … mga apostoles ug mga propeta. Si Jesukristo mao ang
  ulohang bato sa pamag-ang” (Mga Taga-Efeso 2:20).
- Kami mopamatuod nga Siya sa umaabot nga adlaw mobalik nganhi sa yuta. “Ug ang himaya ni Jehova igapadayag,
  ug ang tanang tawo makakita niini; kay ang baba sa Ginoo nagsulti niini” (Isaias 40:5). Siya momando
  isip Hari sa mga Hari ug mohari isip Ginoo sa mga Ginoo, ug ang tanang tuhod magaluhod, ug ang tanang
  dila magdayeg, sa pagsimba diha sa Iyang atubangan. Matag usa kanato mobarog aron Iyang pagahukman sumala
  sa atong mga buhat ug sa mga tinguha sa atong mga kasingkasing.
- Kami mopamatuod, ingon nga sa husto nga paagi Iyang gi-orden nga mga Apostol—nga si Jesus mao ang Buhi
  nga Kristo, ang imortal nga Anak sa Dios. Siya mao ang halangdong Hari Immanuel, kinsa nagbarog karon
  sa tuong kamot sa Iyang Amahan. Siya mao ang kahayag, ang kinabuhi, ug ang paglaom sa kalibotan. Ang
  iyang paagi mao ang dalan nga paingon ngadto sa kalipay dinhi niini nga kinabuhi ug sa kinabuhing dayon
  sa kalibotan nga moabot. Salamat ngadto sa Dios sa dili hitupngan nga gasa sa Iyang balaan nga Anak.
