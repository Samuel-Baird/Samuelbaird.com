title: Ang mga Artikulo sa Hugot nga Pagtuo
subtitle: sa Ang Simbahan ni Jesukristo sa mga Santos sa Ulahing mga Adlaw
author: ''
verses:
- n: 1
  text: Kami nagtuo sa Dios, ang Amahan sa Kahangtoran, ug sa Iyang Anak, si Jesukristo, ug sa Espiritu
    Santo.
- n: 2
  text: Kami nagtuo nga ang mga tawo pagasilotan sa ilang kaugalingon nga mga sala, ug dili tungod sa
    mga kalapasan ni Adan.
- n: 3
  text: Kami nagtuo nga pinaagi sa Pag-ula ni Kristo, ang tanan nga mga katawhan mahimo nga maluwas, pinaagi
    sa pagsunod sa mga balaod ug mga ordinansa sa Ebanghelyo.
- n: 4
  text: 'Kami nagtuo nga ang unang mga baroganan ug mga ordinansa sa Ebanghelyo mao ang: una, Hugot nga
    pagtuo diha ni Ginoong Jesukristo; ikaduha, Paghinulsol; ikatulo, Bunyag pinaagi sa pagpaunlod alang
    sa kapasayloan sa mga sala; ikaupat, Pagpandong sa mga kamot alang sa mga gasa sa Espiritu Santo.'
- n: 5
  text: Kami nagtuo nga ang usa ka tawo kinahanglan gayod pagatawgon sa Dios, pinaagi sa pagpanagna, ug
    pinaagi sa pagpandong sa mga kamot niadto kinsa adunay pagtugot, sa pagsangyaw sa Ebanghelyo ug sa
    pagpangalagad sa mga ordinansa niini.
- n: 6
  text: Kami nagtuo sa sama nga kapunongan nga diha sa Karaan nga Simbahan, sa ato pa, ang apostoles,
    mga propeta, mga pastor, mga magtutudlo, mga ebanghelista, ug uban pa.
- n: 7
  text: Kami nagtuo sa gasa sa mga pinulongan, pagpanagna, pagpadayag, mga panan-awon, pagpang-ayo, pagpanghubad
    sa mga pinulongan, ug uban pa.
- n: 8
  text: Kami nagtuo sa Biblia nga pulong sa Dios kon kini tukma nga pagkahubad; kami nagtuo usab sa Basahon
    ni Mormon nga pulong sa Dios.
- n: 9
  text: Kami nagtuo sa tanan nga gipadayag sa Dios, sa tanan nga gipadayag niya karon, ug kami nagtuo
    nga siya mopadayag pa og daghan nga dagko ug mahinungdanon nga mga butang kalabot sa Gingharian sa
    Dios.
- n: 10
  text: Kami nagtuo sa tinuod nga panagtigom sa Israel ug sa pagpahiuli sa Napulo ka mga Tribo; nga ang
    Zion (ang Bag-ong Jerusalem) pagatukoron diha sa kayutaan sa Amerika; nga si Kristo mohari dinhi sa
    yuta; ug, nga ang yuta pagabag-ohon ug makadawat sa iyang paraisohanon nga himaya.
- n: 11
  text: Kami nag-angkon sa kahigayonan sa pagsimba sa Dios nga Makagagahom sumala sa pagmando sa among
    kaugalingon nga tanlag, ug nagtugot sa tanan nga mga tawo sa sama nga kahigayonan, sa pagpasimba kanila
    sa bisan unsa nga paagi, asa, o unsa ang ilang buot simbahon.
- n: 12
  text: Kami nagtuo sa kamandoan ubos sa mga hari, presidente, mga magmamando, ug sa mga maghuhukom, sa
    pagsunod; pagtahod; ug sa paghupot sa balaod.
- n: 13
  text: Kami nagtuo sa pagkamatinuoron, pagkamatinud-anon, pagkaputli, pagkamanggiluluy-on, mahiyason
    ug sa pagbuhat sa matarong ngadto sa tanan nga mga tawo; sa pagkatinuod, kami mahimo nga moingon nga
    kami nagsunod sa tambag ni Pablo—Kami nagtuo sa tanan nga mga butang, kami naglaom sa tanan nga mga
    butang, kami nakalahutay sa daghan nga mga butang, ug naglaom nga makalahutay sa tanan nga mga butang.
    Kon adunay mga butang nga mahiyason, matahom, o maayo og dungog o dalaygon, kami naninguha sa pagpangita
    niining mga butanga.
signature: Joseph Smith.
