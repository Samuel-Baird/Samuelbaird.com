title: Ang Pamilya
subtitle: Usa ka Pamahayag ngadto sa Kalibotan
author: Ang Unang Kapangulohan ug Konseho sa Napulog Duha ka Apostoles sa Ang Simbahan ni Jesukristo sa
  mga Santos sa Ulahing mga Adlaw
note: Kini nga pamahayag gibasa ni Presidente Gordon B. Hinckley isip kabahin sa iyang mensahe sa Kinatibuk-ang
  Miting sa Relief Society nga gihimo niadtong Septiyembre 23, 1995, sa Siyudad sa Salt Lake, Utah.
paragraphs:
- Kami, ang Unang Kapangulohan ug Konseho sa Napulog Duha ka Apostoles sa Ang Simbahan ni Jesukristo sa
  mga Santos sa Ulahing mga Adlaw, sa maligdong nga paagi mopahayag nga ang kaminyoon tali sa usa ka lalaki
  ug usa ka babaye gi-orden sa Dios ug ang pamilya mahinungdanon sa plano sa Tiglalang alang sa walay
  kataposan nga destinasyon sa Iyang mga anak.
- Ang tanan nga tawo—lalaki ug babaye—gilalang sumala sa hitsura sa Dios. Ang matag usa hinigugmang espiritu
  nga anak nga lalaki o babaye sa langitnong mga ginikanan, ug, sa ingon niana, ang matag usa adunay balaanon
  nga kinaiya ug kalagmitan nga mahimong usa ka dios. Ang pagkalalaki ug pagkababaye usa ka mahinungdanon
  nga kinaiya sa tagsa-tagsa sa kinabuhi nga wala pa dinhi sa yuta, sa pagkamortal, ug sa mahangtoron
  nga kailhanan ug katuyoan.
- Sa kinabuhi nga wala pa dinhi sa yuta, ang espiritu nga mga anak nga lalaki ug babaye nakaila ug nagsimba
  sa Dios ingon nga ilang Amahan sa Kahangtoran ug midawat sa Iyang plano nga naghatag og higayon sa Iyang
  mga anak nga makaangkon og pisikal nga lawas ug makaangkon og yutan-on nga kasinatian sa paglambo ngadto
  sa kahingpitan ug sa kataposan makakab-ot sa ilang balaanon nga destinasyon ingon nga mga manununod
  sa kinabuhing dayon. Ang balaanon nga plano sa kalipay makahimo sa mga relasyon sa pamilya nga magpadayon
  human sa kamatayon. Ang sagrado nga mga ordinansa ug mga pakigsaad nga anaa sa balaan nga mga templo
  makapahimo alang sa tagsa-tagsa sa pagbalik ngadto sa atubangan sa Dios ug alang sa mga pamilya nga
  magkahiusa sa kahangtoran.
- Ang unang sugo nga gihatag sa Dios ngadto ni Adan ug Eva mao ang mahitungod sa posibilidad alang kanila
  isip bana ug asawa nga mahimong mga ginikanan. Kami mopahayag nga ang sugo sa Dios alang sa Iyang mga
  anak sa pagdaghan ug pagpuno sa yuta nagpabilin nga ipatuman. Kami sa dugang mopahayag nga ang Dios
  misugo nga ang sagrado nga mga gahom sa paglalang pagagamiton lamang tali sa lalaki ug babaye, kinsa
  legal nga naminyo isip bana ug asawa.
- Kami mopahayag sa mga paagi diin ang mortal nga kinabuhi gilalang nga gipahimutang sa Dios. Kami mopamatuod
  sa pagkabalaan sa kinabuhi ug sa kamahinungdanon niini diha sa mahangtoron nga plano sa Dios.
- Ang bana ug asawa adunay ligdong nga responsibilidad sa paghigugma ug pag-amuma sa usag usa ug alang
  sa ilang mga anak. “Ang mga anak gasa gikan sa Ginoo” (Mga Salmo 127:3). Ang mga ginikanan adunay sagrado
  nga katungdanan sa pag-amuma sa ilang mga anak sa paghigugma ug sa pagkamatarong, sa pagsangkap sa ilang
  pisikal ug espirituwal nga mga panginahanglan, ug sa pagtudlo kanila sa paghigugma ug sa pag-alagad
  sa usag usa, sa pagsunod sa mga sugo sa Dios, ug magmasulundon sa mga balaod sa ilang nasod bisan asa
  sila magpuyo. Ang mga bana ug mga asawa—mga inahan ug mga amahan—adunay tulubagon sa atubangan sa Dios
  sa pagtuman niini nga mga responsibilidad.”
- Ang pamilya gi-orden sa Dios. Ang kaminyoon tali sa lalaki ug babaye mahinungdanon sa Iyang mahangtoron
  nga plano. Ang mga anak adunay katungod nga matawo ngadto sa mga ginikanan kinsa naminyo, ug maamumahan
  sa usa ka amahan ug sa usa ka inahan nga nagtahod sa mga panaad sa kaminyoon uban sa hingpit nga pagkamaunongon.
  Ang kalipay dinhi sa kinabuhi sa pamilya labaw nga makab-ot kon gipasikad sa mga pagtulun-an ni Ginoong
  Jesukristo. Ang malamposon nga mga kaminyoon ug mga pamilya natukod ug napadayon diha sa mga baroganan
  sa hugot nga pagtuo, pag-ampo, paghinulsol, pagpasaylo, pagtahod, gugma, kaluoy, buhat ug maayong makalingaw
  nga mga kalihokan. Pinaagi sa balaan nga plano, ang mga amahan mao ang mangulo sa ilang mga pamilya
  pinaagi sa gugma ug sa pagkamatarong ug may responsibilidad sa pagsangkap sa mga kinahanglanon sa kinabuhi
  ug sa pagpanalipod sa ilang mga pamilya. Ang nag-unang mga responsibilidad sa mga inahan mao ang pag-atiman
  sa ilang mga anak. Niining sagrado nga mga responsibilidad, ang mga amahan ug mga inahan adunay katungdanan
  sa pagtabang sa usag usa ingon nga magkauban. Ang kakulangan, kamatayon, o laing mga kahimtang mahimong
  manginahanglan sa pagsagop o sa pag-usab niini nga mga kalihokan sa pag-amuma alang sa pamilya. Ang
  uban nga mga kapamilya kinahanglan nga motabang kon gikinahanglan.
- Kami mopahimangno nga ang tagsa-tagsa kinsa makalapas sa mga pakigsaad sa kaputli, kinsa moabuso sa
  ilang kapikas o mga anak, o kinsa mapakyas sa pagtuman sa mga responsibilidad sa pamilya moabot ang
  adlaw nga mobarog nga adunay tulubagon sa atubangan sa Dios. Dugang pa, kami mopahimangno nga ang pagkabungkag
  sa pamilya makadala sa tagsa-tagsa, sa mga komunidad, ug sa nasod sa mga katalagman nga gipanagna sa
  karaan ug sa bag-o nga mga propeta.
- Kami nagtawag sa responsable nga mga lumulupyo ug mga opisyal sa gobyerno bisan asa sa pag-awhag sa
  mga tawo sa paghimo niadtong mga butang nga gihimo sa pagpadayon ug sa pagpalig-on sa pamilya isip sukaranan
  nga yunit sa katilingban.
