title: Odu Uwem Christ
subtitle: Ikɔ ntiense mme Apostle
author: ''
paragraphs:
- Nte nnyin itide emana Jesus Christ isua million iba emi ekebede, nnyin inɔ ikɔ ntiense nnyin ibaŋa akpanikɔ
  eke anana mbiet uwem Esie ye anana utit eti ido eke akamba mkpa usio isop Esie. Owo ndomo kiet efen
  inyeneke utɔ ntɔtuŋɔ odudu emi ke idem mbon emi ekedude ye emi edidude ke ererimbot.
- Enye ekedi Akwa Jehovah eke Akani Testament, Messiah eke Obufa. Ke nda-usuŋ Ete Esie, Enye ekedi Andibot
  ererimbot. “Enye ekenam kpukpru ŋkpɔ; ndien mitoho ke enye inamke ŋkpɔ baba kiet emi ekenamde” (John
  1:3). Okposukedi mikenamke idiɔk-ŋkpɔ, ema enim Enye baptism man akpasanga ye kpukpru eti ido. Enye
  “asaŋa anam ufɔn” (Utom mme Apostle 10:38), edi esua enye ke ntak oro. Ikɔ Esie ekedi etop emem ye unen.
  Enye ama ebeŋe kpukpru owo ete etiene uwut-ŋkpɔ Esie. Enye ama asaŋa ke mme usuŋ ke Palestine, ɔkɔk
  mbon udɔŋɔ, anam mme nnan ekut usuŋ, onyuŋ anam mme akpa-mkpa eset. Enye ama ekpep mme akpanikɔ abaŋade
  nsinsi uwem, ye akpanikɔ abaŋade uwem nnyin mbemiso uwem emi idikpade, ntak uwem nnyin ke ererimbot,
  ye se nditɔ iren ye iban Abasi ekemede ndidi ke uwem ini iso.
- Enye ama ɔtɔŋɔ udia-Ɔbɔŋ man eti akwa mkpa uwa usio-isop Esie. Ema emum Enye enyuŋ ebiere ikpe enɔ Enye
  ke idiɔk ntak, ekɔbi man enem mme idiɔk owo esit, enyuŋ ebiere ete akpa ke cross Calvary. Enye ama ɔnɔ
  uwem Esie nte usio-isop abaŋa mme idiɔk-ŋkpɔ kpukpru owo. Enye ekedi akamba enɔ emi ekenɔde ete ada
  ɔnɔ kpukpru owo emi edidude ke ererimbot.
- Nnyin inɔ ikɔ ntiense ke uteŋe ite ke uwem Esie, emi edide ata akpan ɔnɔ kpukpru owo tɔŋɔ eketɔŋɔ ererimbot,
  ikitɔŋɔke ke Bethlehem idinyung ikureke ke Calvary. Enye ekedi Akpa eyen Ete, Ikpɔŋ-ikpɔŋ Eyen emi Enye
  obonde ke obukidem, Andifak ererimbot.
- Enye ama edemede ɔwɔrɔ ke udi “edidi akpa mbuŋwum ke otu mmɔ emi edede idap” (1 Ŋwed Corinth 15:20).
  Nte Ɔbɔŋ emi esetde ke mkpa, Enye ama osobo ye mbon emi Enye ekemade ke uwem. Enye nko ama anam utom
  ke ufɔt “mme erɔŋ” Esie “efen” (John 10:16) ke America eset. Ke ererimbot mfin, Enye ye Ete Esie ema
  ewut ekpri Joseph Smith idem, eda emi adade “uyɔhɔ ini” (Ŋwed Mbon Ephesus 1:10) emi ekeŋwɔŋɔde ke anyan
  ini edi.
- 'Kabaŋa Odu Uwem Christ, Prophet Joseph ama ewet ete: Enyin esie eketie nte edeme ikaŋ; idet ibuot esie
  eketie nte afia edisana snow; ɔkpɔ-iso esie ama ayama akan unwana utin; ndien uyo esie eketie nte uyo
  ikpɔ mmɔŋ emi efehede, kpa uyo Jehovah, ɔdɔhɔde.'
- Enye edi akpa ye akpatre; Enye edi Enye emi odude uwem, Enye edi Enye emi ekewotde; Enye edi etiŋ ikɔ
  ye Ete ke ibuot nnyin (Se U&E 110:3–4).
- 'Prophet nko etiŋ abaŋa Enye ete ke ema eketiŋ ediwak ikɔ ntiense ebaŋa Enye, emi edi ikɔ ntiense, ke
  akpatre, emi Prophet etiŋde abaŋa Enye: Enye odu uwem!'
- Koro Prophet ama okut Enye, kpa ke ubɔk nnasia Abasi; Prophet onyuŋ okop uyo etiede ntiese ete ke Enye
  edi Ikpɔŋ ikpɔŋ Eyen Ete obonde.
- Ete ke oto ke Enye, onyuŋ ebe ke Enye, ke mme ikɔ edu ndien ekebot, ndien mme andiduŋ ke esit edi nditɔ
  iren ye iban enɔ Abasi (Se U&E 76:22–24).
- Nnyin itiŋ ke mme ikɔ uteŋe ite ke efiak emen itie oku Esie ye Ufɔk Abasi Esie edi ke isɔŋ—“ebɔp ke
  itiat idak isɔŋ …mme apostle ye mme prophet, Jesus Christ ke idem esie onyuŋ edi ata akpan itiat inuk”
  (Ŋwed Mbon Ephesus 2:20).
- Nnyin imitie ntiense ite ke usen kiet ke Enye eyefiak edi ke ererimbot. “Ndien ubɔŋ Jehovah eyeyarare,
  ndien kpukpru obuk-idem eyekut enye ini kiet” (Isaiah 40:5). Enye eyekara nte Edidem mme Ndidem onyuŋ
  akara nte Ɔbɔŋ mme Mbɔŋ, ndien kpukpru edong eyetɔŋɔ ndien kpukpru edeme eyetiŋ ikɔ ukpono ke iso Esie.
  Nnyin kiet kiet iyeda man Enye ebiere ikpe ɔnɔ nnyin nte asaŋade ye mme utom nnyin ye mme uduak esit
  nnyin.
- Nnyin itie ntiense, nte mme Apostle Esie emi emekde nnen nnen—ite ke Jesus edi Odu Uwem Christ, Eyen
  Abasi emi midikpaha. Enye edi akwa Edidem Immanuel, emi adade mfin ke ubɔk nnasia Ete Esie. Enye edi
  unwana, uwem, ye idorenyin ererimbot. Usuŋ Esie edi usuŋ emi adade aka inemesit ke uwem emi ye nsinsi
  uwem ke ererimbot emi edidide. Yak ekɔm Abasi ke ntak anana mbiet enɔ edisana Eyen Esie.
