retrieved: '2026-11-02'
title: Edifiak-mmen Uyoho iko Abasi Jesus Christ ndi
subtitle: Etop isua Ikie-iba emi enode Ererimbot
author: First Preidency ye Esop eke mme Apostle Duopeba eke Ufok Abasi Jesus Christ eke Latter-day Saint
note: Ke utenge ye ekom, nnyin nte mme Apostle Esie imekot kpukpru owo ete edidiongo—nte nnyin idiongoke—ete
  ke ema eberede heaven. Nnyin isongo ite ke Abasi ke ananam ndima ndito iren ye iban Esie ediongo uduak
  Esie. Nnyin itien-se ite ke mbon emi enehede ekot etop Edifiak-nda-ndi emi enyung enam-nkpo ke mbuotidem
  eyebo edidiong man enyene ntiense eke idem mmo kabanga ifiok-nkpo Abasi esie ye ntak esie ke ndibenge
  ererimbot nno enwongo Edidi Obong ye Andinyanga nnyin, Jesus Christ Oyoho Ikaba.
paragraphs:
- Nnyin imeting ete ke Abasi ama ndito Esie ke ofuri idut ke ererimbot. Abasi Ete ama ono nnyin edisana
  emana, anana-mbiet uwem, ye anana-adanga uwa usio-isop eke Ediama Eyen Esie, Jesus Christ. Oto ke odudu
  eke Ete, Jesus afiak eset onyung enyene edikan akan mkpa. Enye edi Andinyanga nnyin, Uwutnkpo nnyin,
  ye Andifak nnyin.
- Isua Ikie-iba emi ekebede, ke ediye usenubok ini-edim ke ke 1820, ekpri Joseph Smith, emi okoyomde ndidiongo
  ewe ufok Abasi ekpedukde, ama oduk aka ikot-eto kiet emi ekperede ufokidung esie ke edere-edere New
  York, USA ndibong akam. Enye ama enyene mbume kabanga erinyanga ukpong esie onyung onim ke Abasi eyeda
  enye usung.
- “Ye nsuhore-idem, nnyin iting ete ke ndiboro akam esie, Abasi Ete ye Eyen Esie, Jesus Christ, ema ebiongore
  eno Joseph enyung etongo ndinam “kpukpru nkpo etongo ntak efon ema” (Acts 3:21) nte ekebemde iso eting
  ke Bible. Ke nkukut oro, enye ama ofiok ete ke ebe-iso Apostle ema ekekpa, Ufok Abasi eke Obufa Testament
  ama osop ke isong Joseph edi-di nkpo-utom ke ndifiak nda enye ndi.
- Nnyin isongo ite ke idak ndausung Abasi ye Eyen, ke mme isungutom heaven ema edi man ekpeb Joseph enyung
  efiak-esiak Ufok Abasi Jesus Christ. John the Baptist emi ekesetde afiak ayak odudu uduok-mmong ke edinyiyin
  man ekwohode idioknkpo efeb ono. Mme akpa Apostle Duopeba ita—Peter, James, ye John—efiak eyak idaha-mbet
  ye mme ukpohode unen itie-oku eno. Mbon efen nko ema edi, esinede Elijah, emi akayakde unen ono ndidian
  ufokemana otokiet ke nsinsi ebuana emi akande mkpa.
- 'Nnyin ika-iso idi ntiense ke ema eno Joseph Smith eno ye odudu Abasi ndikabare nwed eset kiet: Nwed
  Mormon—Udiana Testament Jesus Christ efen. Mme ikpa-nwed edisana nwed emi esine mbuk utom ukworo-iko
  Jesus Christ ke idemesie kotu mbonowo eke Edem Usoputin ke Enye ama Ekeset. Oro ekpeb abanga ntak uwem
  onyung anam ikpo ukpebnkpo Christ anwanga, emi edide akpan-nkpo ono ntak oro. Nte nsanga nwed Abasi
  ono Bible, Nwed Mormon osongo ete ke mme owo edi ndito iren ye iban eke edima Ete ke Heaven, ke Enye
  enyene edisana uduak ono uwem nnyin, ndien ke Eten Esie, Jesus Christ, esiting iko mfin emi ukem nte
  ekesinamde ke eyo eset.'
- Nnyin iting ite ke Ufok Abasi Jesus Christ eke Ndisana-owo ke Ekpere Edem Usen, emi eketongode ke April
  6, 1830, edi Ufok Abasi eke Obufa Testament emi efiakde-emen-edi. Ufok Abasi okongo ke nsana-mma uwem
  akan itiat-inuk esie, Jesus Christ, ye ke anana-adanga Erisio-isop ye ata Eriset Esie. Inikiet efen
  Jesus Christ ama afiak okot mme Apostle onyung ono mmo unen itie-oku. Enye okot kpukpru nnyin edi itiene
  Enye ye Ufok Abasi Esie, man ibo Edisana Spirit, edinam erinyanga, man inyene nsinsi idara.
- Isua Ikie-iba ebe idahaemi tongo nte Abasi Ete ye Edima Eyen Esie, Jesus Christ, eketongo Mfiak-mmen-ndi
  emi. Ediwak owo ke ofuri ererimbot etiene ifiok akwa prophecy emi eketingde.
- Nnyin inemesit iting ite ke Mfiak-nda-ndi emi ekenwongoke ndino ke akaka-iso oto ke nkaiso eriyarare.
  Isong ididige ukem aba, koro Abasi eye ‘tang kpukpru nkpo odong ke Christ” (Ephesians 1:10).
