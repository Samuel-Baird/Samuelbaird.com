title: Ufɔkemana
subtitle: Etop emi enɔde Ererimbot
author: ''
note: President Gordon B. Hinckley ama okot etop emi nte ubak ikɔ esie ke mbono General Relief Society
  emi ekenimde ke September 23, 1995, ke Salt Lake City, Utah.
paragraphs:
- Nnyin, Akpa Presidency ye Eboho mme Apostle Duopeba eke Ufɔk Abasi Jesus Christ mme Ndisana Owo ke Ukperedem
  Usen, inɔ etop ke uteŋe ite ke edi Abasi enim ndɔ ke ufɔt eren ye nwan ndien ke ufɔkemana edi ata akpan
  ke uduak Andibot kabaŋa nsinsi akaŋa nditɔ Esie.
- Ekebot kpukpru owo—eren ye nwan—ke mbiet Abasi. Owo kiet kiet edi edima eyen eren ye eyen anwan spirit
  eke ete ye eka ke heaven, ndien, ke ntre, owo kiet kiet enyene edisana obot ye akaŋa Utɔ owo edi ata
  akpan ndo ɔnɔ owo kabaŋa uwem mbemiso uwem mkpa, uwem mkpa, ye nsinsi idiɔŋɔ ye uduak.
- Ke ini uwem mbemiso uwem mkpa, nditɔ spirit iren ye iban ema efiɔk enyuŋ ekpono Abasi nte Nsinsi Ete
  mmɔ enyuŋ enyime uduak Esie emi nditɔ Esie ekemede ndibɔ obukidem nyuŋ bɔ ifiɔk ke ererimbot man ekɔri
  eka se ifɔnde ima ndien ke akpatre enyene edisana akaŋa mmɔ nte mme adia akpa eke nsinsi uwem. Edisana
  uduak inemesit ayak ebuana ufɔkemana ebighi akan udi. Ndisana edinam ye mme eŋwɔŋɔ emi edude ke mme
  temple eyak mme owo efiak enyɔŋ eka iso Abasi ye mme ufɔkemana ndidiana kiet ke nsinsi.
- Akpa mbet emi Abasi ɔkɔnɔde Adam ye Eve akabaŋa ukeme mmɔ ndinyene nditɔ nte ebe ye nwan. Nnyin idɔhɔ
  ite ke mbet emi Abasi ɔkɔnɔde nditɔ Esie kabaŋa nditɔt nyuŋ nyɔhɔ ererimbot kosuk ododu. Nnyin ifiak
  idɔhɔ ite ke Abasi ɔnɔ mbet ete yak ndisana odudu ndinyene nditɔ odu ke ufɔt eren ye nwan ikpoŋ, emi
  enamde ndɔ nte mbet etemede nte ebe ye nwan.
- Nnyin idɔhɔ ke edi Abasi emek usuŋ emi edade ebot uwem emi edikpade. Nnyin imisɔŋɔ ke uwem edi akpan
  inyuŋ isɔŋɔ ufɔn esie ke nsinsi uduak Abasi.
- Ebe ye nwan enyene akamba ubiɔŋ utom ndima nyuŋ nse ŋkpɔ mbaŋa kiet eken ye nditɔ mmɔ. “Nditɔ edi udeme
  Jehovah” (Ŋwed mme Psalm 127:3). Ete ye eka enyene edisana ubiɔŋ utom ndibɔk nditɔ mmɔ ke ima ye edinen
  ido, ndinɔ mmɔ se mmɔ eyomde ke obukidem ye ke spirit, ye ndikpep mmɔ ndima nyung nnam mkpɔ nnɔ kiet
  eken, ndinim ibet Abasi, nyuŋ ndi mme okop item ke ebiet emi mmɔ eduŋde. Mme ebe ye iban—mme eka ye
  mme ete—eyebɔrɔ mbume ke iso Abasi ebaŋa nte ekenamde mme ubiɔŋ utom emi.
- Edi Abasi emek ufɔkemana. Ndɔ eren ye nwan edi ata akpan ɔnɔ nsinsi uduak Esie. Nditɔ enyene unen ndimana
  ke edidiana kiet ke ndɔ, ye ndikɔri nto ete ye eka emi ekponode eŋwɔŋɔ ndɔ ye ofuri mfarakidem. Ekan
  etim enyene inemesit ke uwem ke ufɔkemana edieke edude etiene mme ukpep-ŋkpɔ Ɔbɔŋ Jesus Christ. Esiak
  enyuŋ enyene mme ndɔ ye mme ufɔkemana emi efɔnde eto mme ukpep-ŋkpɔ mbuɔtidem, akam, erikabare esit,
  ndifen nnɔ, ukpono, ima, mbɔm, utom, ye mme nti mbre. Ke edisana ubono ŋkpɔ, mme ete ena edi ibuot enɔ
  mme ufɔk mmɔ ke ima ye edinen ido enyuŋ enyene ubiɔŋ utom ndinɔ ufɔkemana mmɔ se uwem oyomde nyuŋ mkpeme
  mmɔ. Iso utom mme eka edi ndibɔk nditɔ mmɔ. Ke ndisana utom emi, mme ete ye mme eka enyene ubiɔŋ utom
  ndiwam kiet eken nte mmɔ edi nka. Unɔmɔ, mkpa, mme mme ŋkpɔ efen ekeme ndinam owo kiet kiet anam nte
  ɔfɔnde ye enye. Ana nte nditɔ-ete enwam ke ini eyomde mmɔ.
- Nnyin imiduri utɔŋ ite mme owo emi ebiatde mme eŋwɔŋɔ mfarakidem, emi enamde se idiɔkde ye ebe, mme
  nwan, mme eyen esie, mme emi minamke ubiɔŋ utom esie ke ufɔkemana eyebɔrɔ mbume usen kiet ke iso Abasi.
  Nko, nnyin imiduri utɔŋ ite ke ŋwure ke ufɔkemana eyeda mme nsobo emi mme prophet ke eset ye ke eyo
  emi eketiŋde ɔsɔk mme owo, mme idut, ye mme obio.
- Nnyin imikot nti owo ye mme ada ibuot ke ukara ke ofuri ebiet ite yak mmɔ enam mme ŋkpɔ oro emi enimde
  ete enim enyuŋ esɔŋɔ ufɔkemana nte itak ke obio.
