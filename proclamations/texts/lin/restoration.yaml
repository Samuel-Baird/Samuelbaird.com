retrieved: '2026-11-02'
title: Bozongisi ya Litondi ya Nsango Malamu ya Yesu Klisto
subtitle: Esakola ya Mibu Nkama Mibale na Mokili
author: Bokambi ya Yambo mpe Lisanga ya Bapostolo Zomi na Babale ya Eklezia ya Yesu Klisto ya Basantu
  ba Mikolo mya Nsuka
note: Esakola oyo etangamaki na Mokambi Russell M. Nelson lokola eteni ya etinda na ye na Likita Monene
  ya Mobu ya Mbala ya 190 na mokolo ya 5 Sanza ya Minei, 2020, na Salt Lake City, Utah.
paragraphs:
- Tosakoli na lokumu ete Nzambe alingaka bana na Ye na bikolo nyonso ya mokili. Nzambe Tata apesi biso
  mbotama ya bonzambe, bomoi ezanga bokokani, mpe mbeka ya bomikabi ezanga nsuka ya Mwana na Ye ya Bolingo,
  Yesu Klisto. Na nguya ya Tata, Yesu asekwaki mpe azwaki elonga likolo ya liwa. Ye azali Mobikisi na
  biso, Ndakisa na biso, mpe Mosikoli na biso.
- Mibu nkama mibale eleki; na ntongo moko kitoko na eleko ya milona na 1820, elenge Joseph Smith, kolukaka
  koyeba na eklezia nini asengelaki kosangana, akendaki na zamba penepene ya ndako na bango kosambela
  na etuka ya New York, USA. Azalaki na mituna na ntina ya lobiko ya molimo na ye mpe atiaki elikya ete
  Nzambe akolakisa ye.
- Na bomikitisi nyonso, tosakoli ete lokola eyano na losambo na ye, Nzambe Tata mpe Mwana na Ye, Yesu
  Klisto, bamonanaki epayi ya Joseph mpe babandaki “bozongisi ya makambo nyonso” (Misala 3:21) lokola
  elobamaki na Biblia. Na limoni oyo, ye ayekolaki ete nsima ya liwa ya Bapostolo ya ebandeli, Eklezia
  ya Boyokani ya Sika ya Klisto ebungaki na mabele. Joseph asengelaki kozala esalelo mpo na bozongi na
  yango.
- Tondimi ete na nse ya bokambi ya Tata mpe ya Mwana, bantoma uta na lola bayaki kolakisa Joseph mpe kozongisa
  lisusu Eklezia ya Yesu Klisto. Yoane Mobatisi mosekwi azongisaki likoki ya kobatisa na nzela ya bozindisi
  na mai mpo na bolimbisi ya masumu. Misato ya Bapostolo zomi na babale—Petelo, Yakobo, mpe Yoane—bazongisaki
  mosala ya bapostolo mpe bafungola ya likoki ya bonganganzambe. Basusu mpe bayaki, kotangaka Eliya, oyo
  azongisaki likoki ya kosangisa mabota esika moko mpo na libela na mokangano ya seko mosika koleka ntango
  ya liwa.
- 'Totatoli lisusu ete Joseph Smith apesamaki likabo mpe nguya ya Nzambe mpo na kobongola nkoma ya makomi
  ya kala: Buku ya Mormon—Litatoli Mosusu ya Yesu Klisto. Na kati ya nkasa ya makomi ya bule oyo tozali
  na lisolo ya mosala ya Yesu Klisto ye moko na kati ya bato ya Ndelo ya Westi ya mokili kala mingi te
  nsima ya Bosekwi na Ye. Lisolo oyo ezali koteya ntina ya bomoi mpe kolimbola malongi ya Klisto, oyo
  ezali na katikati ya ntina wana. Lokola moninga na makomi ya Biblia, Buku ya Mormon etatoli ete bato
  nyonso bazali bana mibali mpe bana basi ya Tata ya bolingo na Lola, ete azali na mwango ya bonzambe
  mpo na bomoi na biso, mpe ete Mwana na Ye, Yesu Klisto, azali koloba lelo lokola na mikolo ya kala.'
- Tosakoli ete Eklezia ya Yesu Klisto ya Basantu ba Mikolo mya Nsuka, oyo ebongisamaki na mokolo ya 6,
  Sanza ya Minei, 1830, ezali Eklezia ezongisami ya Boyokani ya Sika ya Klisto. Eklezia oyo ekangami makasi
  kati na bomoi ebonga nie ya libanga ya nsuka mokonzi na yango, Yesu Klisto, mpe kati na Bomikabi na
  Ye ezanga nsuka mpe Bosekwi na Ye na nzoto. Yesu abiangi mbala moko lisusu Bapostolo mpe apesi bango
  likoki ya bonganganzambe. Ye abengisi banso kati na biso toya epayi na Ye mpe na Eklezia na Ye, tozwa
  Molimo Mosantu, makuli ya lobiko, mpe tozwa esengo oyo ewumelaka.
- Mibu nkama mibale esili koleka uta Bozongisi ebandisamaki na Nzambe Tata mpe Mwana na Ye ya Bolingo,
  Yesu Klisto. Bato mingi bayambi boyebi ya makambo oyo masakolamaki na mokili mobimba.
- Tosakoli na esengo nyonso ete Bozongisi oyo elakamaki ezali kokende liboso na nzela ya emoniseli ya
  ntango nyonso. Mabele ekozala soki moke te ndenge moko lisusu, mpo Nzambe “akosangisa biloko nyonso
  esika moko na Klisto” (Baefese 1:10).
- Na limemia mpe botondi, biso lokola Bapostolo na Ye tobengisi banso bayeba—lokola toyebi—ete lola ezali
  ya kofungwama. Tondimi ete Nzambe azali koyebisa bolingi na Ye mpo na bana mibali mpe bana basi na Ye
  ya bolingo. Totatoli ete baoyo bakoyekola na nzela ya losambo nsango ya Bozongisi mpe bakosala na bondimi
  bakopambolama mpo na kozwa litatoli ya bango moko ya bonzambe mpe ya ntina na yango mpo na kolengela
  mokili na ntina ya Boyei ya Mibale elakama ya Nkolo mpe Mobikisi na biso, Yesu Klisto.
