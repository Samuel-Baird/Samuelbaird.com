title: Libota
subtitle: Esakola na Mokili
author: Bakambi ya Yambo mpe Lisanga ya Bapostolo Zomi na Babale ya Eklezia ya Yesu Klisto ya Basantu
  ba Mikolo mya Nsuka
note: Esakola oyo etangamaki na Mokambi Gordon B. Hinckley lokola eteni ya etinda na ye na Likita Linene
  ya Lingomba ya Bamama Basungi na mokolo ya zomi na mibale ya sanza ya Libwa, 1995, na Salt Lake City,
  Utah.
paragraphs:
- Biso, Bakambi ya Yambo mpe Lisanga ya Bapostolo Zomi na Babale ya Eklezia ya Yesu Klisto ya Basantu
  ba Mikolo mya Nsuka, na mongongo ya lokumu nyonso tosakoli ete libala kati na mobali mpe mwasi etindami
  na Nzambe mpe ete libota ezali na katikati ya mwango ya Mokeli mpo na bomoi ya seko ya bana na Ye.
- Bato nyonso—mibali mpe basi—bakelami na elilingi ya Nzambe. Moto na moto azali mwana mobali to mwana
  mwasi ya bolingo ya molimo ya baboti ya lola, mpe, lokola ezali bongo, moto nyonso azali na lolenge
  ya Nzambe mpe nsukansuka akokoma lokola Ye. Kozala mwasi to mobali ezali elembo monene ya bokitoli mpe
  ntina ya moto na bomoi yambo na mbotama, na bomoi awa na mabele, mpe na bomoi ya seko.
- Na bokonzi ya yambo ya mbotama, bana ya mibali mpe ya basi ya molimo bayebaki mpe basanzolaki Nzambe
  lokola Tata na bango ya Seko mpe bandimaki mwango na Ye. Na nzela ya mwango oyo, bana na Ye bakoki kozwa
  nzoto ya mosuni mpe kozwa mayele ya nse mpo na kokola kino na peto mpe nsuka-nsuka kososola bomoi na
  bango ya bonzambe lokola basangoli ya bomoi ya seko. Mwango ya Nzambe ya esengo esalaka ete libota ekoba
  kokangama nsima ya liwa. Makuli mpe mayokani ya bule na batempelo esantu esalaka ete bato bakoka kozonga
  liboso ya Nzambe mpe ete mabota esangisama mpo na seko.
- Mobeko ya yambo oyo Nzambe apesaki Adama mpe Eva mpo na oyo etali makoki na bango ya boboti lokola balongani.
  Tosakoli ete mobeko ya Nzambe mpo ete bana na Ye babota mpe batondisa mabele oyo ezali kaka kosala.
  Tosakoli lisusu ete Nzambe apesaki mobeko ete mobali mpe mwasi basengeli kosalela banguya esantu ya
  bokeli kaka lokola balongani oyo babalani engebene na mibeko lokola mobali mpe mwasi.
- Tosakoli ete nzela ya kokela bomoi na mabele oyo etindamaki na Nzambe. Tondimi bosantu ya bomoi mpe
  monene na yango na mwango ya seko ya Nzambe.
- Mwasi mpe mobali balongani bazali na mokumba ya lokumu ya kolingana mpe kosalisana mpe ya kolinga mpe
  kosalisa bana na bango. “Bana bazali likabo ya Nkolo” (Nzembo 127:3). Baboti bazali na mosala esantu
  ya kobokola bana na bango na bolingo mpe na bosembo, kokokisa bamposa na bango ya mosuni mpe ya molimo,
  mpe koteya bango balingana mpe basalisana, babatela mibeko ya Nzambe, mpe bazala bana ya mboka oyo batosaka
  mibeko epayi nyonso bazwami. Mwasi mpe mobali balongani—bamama mpe batata—bakozala bayanoli liboso ya
  Nzambe mpo na kokokisa ntomo oyo.
- Libota etindami na Nzambe. Libala kati na mobali mpe mwasi ezali na ntina kati na mwango na Ye ya seko.
  Bana basengeli kobotama kati na mikangano ya libota, mpe kobokolama na tata mpe mama oyo azali kotosa
  bandai ya libala na bosembo nyonso. Esengo kati na bomoi ya libota esengeli malamu kokokisama ntango
  libota etongami na mateya ya Nkolo Yesu Klisto. Mabala mpe mabota ya elonga etiami mpe ebatelami na
  mibeko ya bondimi, losambo, bobongoli motema, bolimbisi, limemia, bolingo, mawa, mosala, mpe misala
  ya bosakani ya malonga. Na motindo ya Nzambe, batata basengeli kokamba mabota na bango na bolingo mpe
  na bosembo mpe bazali na mokumba ya kokokisa bosenga ya bomoi mpe bobateli ya mabota na bango. Bamama
  bazali na mokumba ya yambo ya kobokola bana na bango. Na mikumba oyo ya bule, batata mpe bamama basengisami
  kosalisana lokola baninga oyo bakokani. Bolemeni, liwa, to makama mosusu ekoki kosenga bomesani ya bango
  moko. Bato ya libota monene basengeli kosunga soki esengelami.
- Tokebisi ete bato oyo bakobuka boyokani ya bopeto, oyo bakonyokola basi to bana na bango, to oyo bakozanga
  kokokisa mikumba na bango na libota bakotelama mokolo moko mpo na koyanola liboso ya Nzambe. Lisusu,
  tokebisi ete bokabwani ya mabota ekomemela bato, mangomba ya bato, mpe bikolo bampasi oyo baprofeta
  ya kala mpe ya mikolo oyo basilaki koloba.
- Tobeleli bana mboka mpe basali ya mbula matari bipayi nyonso batombola meko oyo ebongisami mpo na kobatela
  mpe kolendisa libota lokola eteni ya motuya ya lisanga ya bato.
