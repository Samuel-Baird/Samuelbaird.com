title: Klisto na Bomoi
subtitle: Litatoli ya Bapostolo
author: Eklezia ya Yesu Klisto ya Basantu ba Mikolo mya Nsuka
paragraphs:
- Lokola tozali kokundola mbotama ya Yesu Klisto oyo esalemaki mibu nkoto mibale eleki, tozali kopesa
  litatoli na biso ya bosolo ya bomoi oyo ekokani na mosusu te mpe ya bolamu ezanga ndelo ya libonza monene
  ya bomikabi na Ye. Moto mosusu moko te atikala kozala na nguya ya makasi likolo ya banso oyo bazala
  mpe baye bakozala likolo ya mabele.
- Azalaki Yehova Monene ya Kondimana ya Kala, Masiya ya Kondimana ya Sika. Na nse ya bokambi ya Tata na
  Ye, Ye azalaki Mokeli ya mabele. “Biloko nyonso bikelamaki na Ye, mpe libanda na Ye eloko moko esalemaki
  te” (Yoane 1:3). Atako azangaki lisumu, Ye abatisamaki mpo na kokokisa makambo nyonso na bosembo. “Atambolaki
  bipayi na bipayi kosalaka misala malamu” (Misala 10:38), nzokande atiolamaki mpo na yango. Nsango malamu
  na Ye ezalaki nsango ya kimia mpe ya boboto. Asengaki bato nyonso balanda ndakisa na Ye. Atambolaki
  na makolo na banzela ya Filisitia, kobikisaka babeli, kosalaka ete bakufi miso bamona, mpe kosekwisaka
  bakufi. Ateyaki bosolo ya boseko, bosolo ya bomoi yambo na mbotama na biso, ntina ya bomoi na biso na
  mabele, mpe makoki mpo na bana mibali mpe bana basi ya Nzambe na bomoi ekoya.
- Azalisaki molulu ya elambo lokola bokundoli ya mbeka monene ya bomikabi na Ye. Bakangaki Ye mpe bakatelaki
  Ye etumbu na makambo ya lokuta, kokweyisaka Ye mpo na kosepelisa ebele ya bato na mitema mabe, mpe bapesaki
  Ye etumbu ya liwa na ekulusu ya Kalavari. Apesaki bomoi na Ye na komikaba mpo na masumu ya bato banso.
  Oyo ya Ye ezalaki likabo monene ya bokitani na esika ya banso baoyo bakozala na mabele.
- Tozali kotatola na lokumu monene ete bomoi na Ye, oyo ezali mpenza na katikati ya lisitwale ya bato
  banso, ebandaki na Beteleme te mpe esukaki na Kalavari te. Azalaki Mobotami ya yambo ya Tata, Mwana
  se Moko na mosuni, Mosikoli ya mokili.
- Asekwaki longwa na bakufi mpo na “kokoma mbuma ya liboso kati na bango oyo balalaki” (1 Bakolinti 15:20).
  Lokola Nkolo Mosekwi, Akendaki kotala baoyo Alingaki na bomoi. Asalaki lisusu kati ya “bampate na Ye
  mosusu” (Yoane 10:16) na Amerika ya kala. Na mokili oyo ya sika, Ye mpe Tata na Ye bamonisamaki na elenge
  mobali Joseph Smith, mpo na kobanda oyo elakamaki kala “eleko ya litondi ya ntango” (Baefese 1:10).
- 'Na oyo etali Klisto na Bomoi, Profeta Joseph akomaki: “Miso na ye ezalaki lokola lolemo ya moto; nsuki
  ya moto na ye ezalaki mpembe lokola mvula ya mpembe pee; elongi na ye engengaki koleka bongengi ya moi;
  mpe mongongo na ye ezalaki lokola lokito ya mai minene kokitaka na lombangu, kutu mongongo ya Yehova,
  kolobaka:'
- “Nazali ya yambo mpe ya nsuka; nazali ye oyo azali na bomoi, nazali ye oyo babomaki; nazali molobeli
  na bino epayi ya Tata” (Mal&May 110:3–4).
- 'Na oyo etali Ye, Profeta asakolaki lisusu: “Mpe sikawa, nsima ya matatoli mingi oyo epesamaki na ntina
  na ye, oyo ezali litatoli, ya nsuka kati na nyonso, oyo tozali kopesa na ntina na ye: Ete azali na bomoi!'
- “Mpo tomonaki ye, kutu na loboko ya mobali ya Nzambe, mpe toyokaki mongongo kopesa litatoli ete azali
  Mobotami se Moko ya Tata—
- “Ete na ye, mpe na nzela na ye, mpe mpo na ye, mikili ezali mpe mikelamaki, mpe bafandi na yango bazali
  bana mibali mpe bana basi babotami ya Nzambe” (Mal&May 76:22–24).
- Tosakoli na maloba ya lokumu mpenza ete bonganganzambe na Ye mpe Eklezia na Ye ezongisami na mabele—“etongami
  na likolo ya moboko ya … bapostolo mpe baprofeta, Yesu Klisto ye moko libanga ya nsuka” (Baefese 2:20).
- Totatoli ete mokolo moko Akozonga na mabele. “Mpe nkembo ya Nkolo ekomonisama, mpe banso bazali na nzoto
  bakomona yango elongo” (Yisaya 40:5). Akoyangela lokola Mokonzi ya Bakonzi mpe akokonza lokola Nkolo
  ya Bankolo, mpe mabolongo nyonso ekofukama liboso na Ye mpe minoko nyonso ekogumbamela Ye. Moko na moko
  kati na biso akotelema mpo na kosambisama na Ye engebene na misala na biso mpe bamposa ya mitema na
  biso.
- Topesi litatoli lokola Bapostolo bakulisami mpenza na Ye—ete Yesu azali Klisto na Bomoi Mwana azanga
  kufa ya Nzambe. Ye azali Emanuele Mokonzi monene, oyo lelo atelemi na loboko ya mobali ya Tata na Ye.
  Azali pole, bomoi mpe elikya ya mokili. Lolenge na Ye ezali nzela ya esengo na bomoi oyo mpe bomoi ya
  seko na mokili ekoya. Tika ete matondi ezonga na Nzambe mpo na likabo ezanga bokokani ya Mwana na Ye
  na bonzambe.
