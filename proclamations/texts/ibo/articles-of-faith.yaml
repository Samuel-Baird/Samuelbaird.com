title: Ndepụta
subtitle: nke Okwukwe Nke Nzukọ nke Jisus Kraịst nke Ndị-nsọ Ụbọchị-ikpeazụ a
author: ''
verses:
- n: 1
  text: Anyị kwere na Chineke, Nna mgbe Ebighi-ebi, na n’Ọkpara Ya, Jisus Kraịst, na Mụọ Nsọ.
- n: 2
  text: Anyị kwere na-aga-ata ndị mmadụ ahụhụ n’ihi mmehie nke aka ha, na ọbụghị n’ihi njehie Adam.
- n: 3
  text: Anyị kwere na site na Aja Mgbaghara mmehie nke Kraịst, mmadụ nile ga-enweta nzọpụta, site na nrube
    isi nye iwu nile na emume-nsọ nile nke Ozi-ọma.
- n: 4
  text: 'Anyị kwere na ụkpụrụ mbụ nile na emume-nsọ nile nke Ozi-ọma bụ: nke mbụ, Okwukwe n’ime Onye-nwe
    Jisus Kraịst; nke abụọ, Nchegharị; nke atọ, Baptism site na-imikpu n’ime mmiri maka nsachapụ nke mmehie
    nile; nke anọ, Ibikwasị aka nile n’isi maka onyinye nke Mụọ Nsọ.'
- n: 5
  text: Anyị kwere na a ga-akpọrịrị nwoke site na Chineke, site n’ibu amụma, na site na-ibikwasị aka nile
    n’isi site na ndị ahụ bụ ndị nọ n’iji ikike, ikwusa Ozi-ọma na ilekọta n’ime emume-nsọ nile dị ya.
- n: 6
  text: Anyị kwere n’otu nhazi ahụ nke dịbuuru n’ime Nzukọ-nsọ mgbe ochie, ịkpọ ha aha, ndị-ozi, ndị amụma,
    ndị ụkọ chukwu, ndị nkụzi, ndị nkwusa ozi-ọma, na ndị ọzọ gaa.
- n: 7
  text: Anyị kwere n’onyinye nke asụsụ dị iche iche, ibu-amụma, mkpughe, ọ́hụ̀ nile, ịgwọ nrịrịa, ịsụgharị
    asụsụ, na ndị ọzọ gaa.
- n: 8
  text: Anyị kwere na Bible bụ okwu nke Chineke ọbụrụ raa na atụgharịrị asụsụ ya nke ọma; anyị kwekwara
    Akwụkwọ nke Mọmọn ịbụ okwu nke Chineke.
- n: 9
  text: Anyị kwere ihe nile nke Chineke kpugheworo, ihe nile Ọ na ekpughe ugbua, anyị kwekwara na Ọ gaje
    ikpughe ọtụtụ oke ihe na ihe nile dị mkpa gbasara Ala-eze nke Chineke.
- n: 10
  text: Anyị kwere na mkpokọta nke Israel na mweghachi nke Agbụrụ Iri ahụ; na a ga-ewu Zaịon (Jerusalem
    Ọhụrụ ahụ) n’elu ala kọntinenti nke Amerika; na Kraịst gaje ịchị-eze n’onwe ya n’elu ụwa; na, ụwa
    ka a ga-agbanwe ọhụrụ na nweta kwa ebube paradaịs ya.
- n: 11
  text: Anyị chọrọ ka a mata na ohere ahụ bụ nke anyị nke ife Chineke Pụrụ Ime Ihe nile ofufe dịka ọchịchọ
    nke mụọ anyị siri dị, hapụkwara mmadụ nile otu ohere ahụ, ka ha fee ofufe otu, ebe, ma-ọbụ ihe ha
    chọrọ.
- n: 12
  text: Anyị kwere na-ịnọ n’okpuru ndị-eze, ndị-isi nduzi, ndị ọchịchị, ndị ikpe, n’irubere, inye ugwu,
    na ịkwado iwu.
- n: 13
  text: Anyị kwere n’ịkwụ wa aka ọtọ, ezi okwu, ịdị ọcha mmekọrịta, na-enye onyinye, ezigbo omume, na
    imere mmadụ dum ihe ọma; n’ezie, anyị nwere ike ịsị na anyị na-eso ịdọ aka na ntị nke Pọl—Anyị kwere
    ihe nile, anyị nwere olile-anya ihe nile, anyị ediwo ọtụtụ ihe, nwekwara olile-anya inwe ike idi ihe
    nile. Ọ bụrụ na onwere ihe ọbụla bụ ezigbo omume, kwesịrị ịhụnanya, ma-ọbụ e kwuru nke ọma ma-ọbụ
    kwesịrị ọjịja mma, anyị na-achụso ihe ndị a nile.
signature: Joseph Smith.
