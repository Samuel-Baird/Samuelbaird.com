title: Ezi na ụlọ Ahụ
subtitle: Ọkwa a mara nye Ụwa
author: Otu Ndịisi Mbụ na Kansụl nke Ndị ozi Iri na abụọ nke Nzukọ nsọ Ahụ nke Jizọs Kraịst nke Ndị nsọ
  Ụbọchị ikpeazụ a
note: Ịma ọkwa nke a ka Onyeisi Gordon B. Hinckley gụpụtara dị ka akụkụ nke ozi ya na Ọgbakọ Zuruọha nke
  Otù Enyemaka e mere na September 23, 1995, niime Obodo ukwu, Salt Lake City, Utah.
paragraphs:
- Anyị, Otu Ndịisi Mbụ na Kansụl nke Ndị ozi Iri na abụọ nke Nzukọ nsọ Ahụ nke Jizọs Kraịst nke Ndị nsọ
  Ụbọchị ikpeazụ a, n’olu dị nsọ na-ama ọkwa na alụmdi na nwunye dị n’etiti otu nwoke na otu nwanyị bụ
  ihe Chineke kwadoro ma na ezi na ụlọ dị n’etiti atụmatụ nke Onye okike maka ebe akaraka ebighị ebi nke
  ụmụ Ya.
- Mmadụ niile e kere eke—nwoke na nwanyi—ka e kere n’oyiyi nke Chineke. Nke ọbụla bụ nwa nwoke ma ọ bụ
  nwa nwanyị nke mmụọ nke nne na nna nke eluigwe hụrụ naanya, ma, n’ụdị ahụ, nke ọbụla nwere ọdịdị na
  akaraka sinachi. Okike ọmụmụ bụ njirimara onwe dị mkpa nke ndụ tupu abịa n’ụwa, ndụ anụ ahụ, na ejirimara
  na ebumnoobi ebighị ebi.
- N’ebe ndụ tupu abịa n’ụwa, ụmụ ndị nwoke na ụmụ ndị nwanyi nke mmụọ matara ma fee Chineke ofufe dị ka
  Nna ha nke Ebighị ebi ma nabata atụmatụ Ya site na nke ụmụ Ya nwere ike iji nweta anụ ahụ ma rite nhụmiihe
  nke ụwa iji gaaniihu ruo n’izuoke ma n’ikpeazụ chọpụta akaraka ha sinachi dị ka ndị nketa nke ndụ ebighị
  ebi. Atụmatụ nke obi ụtọ sinachi na-enye mmekọrịta ezi na ụlọ ike ịdịgide gafee ili. Emume nsọ niile
  na ọgbụgba ndụ niile dị adị na tempụl nsọ niile mere ka o kwe omume maka ndị mmadụ ịlaghachi niihu nke
  Chineke na maka ijikọta ezi na ụlọ niile ọnụ ruo ebighị ebi.
- Iwu nsọ mbụ nke Chineke nyere Adam na Iv gbasara ikike ha maka ịbụ nne na nna dị ka di na nwunye. Anyị
  na-ama ọkwa na iwu nsọ nke Chineke maka ụmụ Ya ịmụba na imejupụta ụwa ka dị ire. Anyi na-aga niihu na-ama
  ọkwa na Chineke enyewo iwu na ike niile dị nsọ nke ịmụta ụmụ ka a ga-eji eme ihe naani n’etiti nwoke
  na nwanyi, ejikọtara n’okpụrụ iwu ọlụlụ dị ka di na nwunye.
- Anyị na-ama ọkwa na ụzọ esi ekepụta ndụ anụ ahụ ga-abụ ihe akwadoro sinachi. Anyị na-ekwusike maka ịdị
  nsọ nke ndụ na maka ịdị mkpa ya niime atụmatụ ebighị ebi nke Chineke.
- Di na nwunye nwere ọrụ dị nsọ ịhụrita onwe ha naanya ma na-elekọrịta onye na ibe ya na ụmụ ha. “Ụmụ
  bụ onyinye nke Onyenwe anyị” (Abụọma 127:3). Ndị nne na nna nwere ọrụ dị nsọ izulite ụmụ ha n’ihụnaanya
  na ezi omume, inwetara ha ihe ndị dị mkpa nke anụ ahụ na nke ime mmụọ, na ikuziri ha ka ha na-ahụrịta
  naanya ma na-ejeritara ozi otu onye na ibe ya, na-edebe iwu nsọ niile nke Chineke, ma bụrụ ndị na-edebe
  iwu obodo n’ebe ọbụla ha bi. Ndị di na ndị nwunye—ndị nne na ndị nna—ka a ga-ejide ịza ajụjụ niihu Chineke
  maka ịrụ ọrụ ndị a dịrị ha.
- Ezi na ụlọ bụ ihe Chineke kwadoro. Alụmdi na nwunye dị n’etiti nwoke na nwanyị dị mkpa n’atụmatụ ebighị
  ebi Ya. O ruuru ụmụaka ka a mụọ ha niime nkwekọrịta nke alụmdi na nwunye, nakwa ka azulite ha n’aka
  nne na nna ndị na-akwanyere nkwa niile nke alụmdi na nwunye ugwu n’ezi ikwesị ntụkwasị obi. Obi ụtọ
  niime ezi na ụlọ ka a ga-enwetakarị mgbe a tọrọ ntọala ya n’elu nkuzi niile nke Onyenwe anyị Jizọs Kraist.
  Alụmdi na nwunye ndị gara nke ọma ka a na-ehiwe ma na-ejigide n’elu ụkpụrụ niile nke okwukwe, ekpere,
  nchegharị, mgbaghara, nsọpụrụ, ihụnaanya, ọmịiko, ọrụ na ihe omume mmeghari ahụ niile kwesịrị ekwesị.
  Site na atụmatụ sinachi, ndị nna ga-abụ onyeisi ezi na ụlọ ha niile jiri ihụnaanya na ezi omume ma nwere
  oke na ọru dịịrị ha inweta ihe niile dị mkpa nke ndụ na nchekwa maka ezi na ụlọ ha niile. Ndị nne nwere
  ọrụ mbụ dịịrị ha maka ọzụzụ nke ụmụ ha. N’ọrụ dị nsọ ndị a dịịrị ha, ndị nna na ndị nne ka e nyere iwu
  inyere otu onye na ibe ya aka dị ka ndị mmekọihe dị nhata nha. Nkwarụ, ọnwụ, ma ọ bụ ọnọdụ ndị ọzọ nwere
  ike mee ka ọ dị mkpa ịnọgharị n’ onwe. Ndị ikwu na ibe kwesịrị inye aka mgbe e nwere mkpa ya.
- Anyị na-adọ aka na nti na ndị niile na-emebi ọgbụgba ndụ niile nke ịdị ọcha mmekọrịta, ndị na-emegbu
  di ma ọ bụ nwunye, ma ọ bụ nwa, ma ọ bụ ndị na-anaghi emezu oke na ọrụ ezi na ụlọ ga-eguzoro otu ụbọchi
  ịza ajụjụ niihu Chineke. Ọzọkwa, anyi na-adọ aka na ntị na mgbasasị nke ezi na ụlọ ga-ewetara mmadụ
  niile, obodo niile, na mba niile oke ọdachi niile e buru n’amụma site n’ọnụ ndị amụma mgbe ochie na
  ugbu a.
- Anyị na-akpọkụ ndị obodo na ndị ụlọ ọrụ gọọmentị kwesịrị ntụkwasị obi n’ebe niile ka ha kwalite atụmatụ
  ndị ahụ a tụpụtara iji jikwaa ma gbaa ezi na ụlọ ume dị ka isi otu nke obodo.
