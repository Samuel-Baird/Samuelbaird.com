title: Mweghachite Ozuzu nke Ozi ọma nke Jizọs Kraịst
subtitle: Ọkwa Emume ncheta Narị Afọ Abụọ a mara nye Ụwa
author: Otu Ndịisi Mbụ na Kansụl nke Ndị Ozi Iri na abụọ nke Nzukọ nsọ Ahụ nke Jizọs Kraịst nke Ndị nsọ
  Ụbọchị ikpeazụ a
note: Ọkwa nke a ka Onyeisi Russell M. Nelson gụrụ dị ka akụkụ nke ozi ya na Ọgbakọ Zuru oha nke ugboro
  190, Eprel 5, 2020, na Obodo ukwu Salt Lake, Utah.
paragraphs:
- Anyị na-ama ọkwa n’olu dị nsọ na Chineke hụrụ ụmụ Ya naanya niime mba niile nke ụwa. Chineke Nna enyewo
  anyị ọmụmụ dị nsọ, ndụ na-enweghị atụ, na aja mgbaghara mmehie na-enweghị ọgwụgwụ nke Ọkpara Ya Ọ Hụrụ
  naanya, Jizọs Kraịst. Site n’ike nke Nna, Jizọs bilitere ọzọ ma nwee mmeri megide ọnwụ. Ọ bụ Onye Nzọpụta
  anyị, Onye Ọmụmaatụ anyị, na Onye Mgbapụta anyị.
- Afọ narị abụọ gara aga, n’ọmarịcha ụtụtụ mmalite oge udu mmiri na 1820, Josef Smith nta, na-achọ ịmata
  nzukọ nsọ nke ọ ga-esonye, banyere niime ọdọ osisi ikpe ekpere n’akụkụ ebe obibi ya n’obodo New York,
  USA. O nwererịị ajụjụ ndị gbasara nzọpụta nke mkpụrụ obi ya ma nwee ntụkwasị obi na Chineke ga-atuziri
  ya aka.
- N’ịdị umeala, anyị na-ama ọkwa na n’azịza nye ekpere ya, Chineke Nna na Ọkpara Ya, Jizọs Kraịst, pụtakwutere
  Josef ma malite “nkwụghachi nke ihe niile” (Ọlụ Ndị-ozi 3:21) dị ka ekwuru na mbụ niime Baịbụl. Niime
  ọhụ nke a, ọ mụtara na isote ọnwụ nke Ndị Ozi isimbụ ahụ, Nzukọ nsọ Agba Ọhụrụ nke Kraịst furu efu site
  n’ụwa. Josef ga-abụ ngwa ọrụ na nlọghachi ya.
- Anyị na-ekwenye na n’okpuru ntuziaka nke Nna na Ọkpara, ndị ozi si n’eluigwe bịara ikuziri Josef ihe
  ma hiwegharịa Nzukọ nsọ nke Jizọs Kraịst. Jọn Omee Baptizm bilitere n’ọnwụ weghachitere ikike nke ime
  baptizim site na-ịmịkpu niime mmiri maka mgbaghara nke mmehie niile. Ndị Ozi atọ niime ndị ozi isimbụ
  ahụ—Pita, Jemis, na Jọn—weghachitere ịbụ onye ozi na ọtụghe niile nke ikike ọkwa nchụaja. Ndị ọzọ bịakwara
  n’ezie, gụnyere Elaịja, onye weghachitere ikike nke ijikọ ezi na ụlọ ruo mgbe ebighị ebi niime mmekọrịta
  ebighị ebi nke gafere ọnwụ.
- 'Anyị na-aga niihu ịgba aka ebe na enyere Josef Smith onyinye na ike nke Chineke iji tụgharịa asụsụ
  otu ndekọihe mgbe gboo: Akwụkwọ nke Mọmọn—Ama Ọzọ nke Jizọs Kraịst. Ihu akwụkwọ edereede a dị nsọ gụnyere
  nkọwapụta mgbasa ozi onwe nke Jizọs Kraịst n’etiti ndị mmadụ no Mpaghara Ọdịda anyanwụ ngwa ngwa Mbilite
  n’ọnwụ Ya gafere. Ọ na-akuzi maka nzube nke ndụ ma na-akọwa ozizi nke Kraịst, nke bụ isi nzube ahụ.
  Dị ka akwụkwọ nsọ nsiso nye Baịbụlụ, Akwụkwọ nke Mọmọn na-agba ama na mmadụ niile e kere eke bụ ụmụ
  ndị nwoke na ụmụ ndị nwanyị nke Nna nke Eluigwe dị ịhụnaanya, na O nwere atụmatụ dị nsọ maka ndụ anyị,
  ma na Ọkpara Ya, Jizọs Kraịst, na-ekwu okwu taa dịkwa ka otu ọ dị n’ụbọchị niile nke mgbe ochie.'
- Anyị na-ama ọkwa na Nzukọ nsọ Ahụ nke Jizọs Kraịst nke Ndị Nsọ Ụbọchị ikpeazụ a, ahaziri na Eprel 6,
  1830, bụ Nzukọ nsọ Agba Ọhụrụ nke Kraịst eweghachitere. Nzukọ nsọ a dabeere na ndụ zuru oke nke isi
  nkuku ụlọ ya, bụ Jizọs Kraịst, na Aja mgbaghara mmehie Ya na-enweghị oké na Mbilite n’ọnwụ Ya mere eme.
  Jizọs Kraịst ọzọkwa akpọwo Ndị Ozi ma enyewo ha ikike nke ọkwa nchụaja. Ọ na-akpọku anyị niile ịbịakwute
  Ya na Nzukọ nsọ Ya, ịnata Mmụọ Nsọ, emume nsọ niile nke nzọpụta, na irite ọńụ na-anọgide.
- Afọ narị abụọ agafewo ugbua kemgbe Mweghachite nke a bidoro site n’aka Chineke Nna na Ọkpara Ya Ọ Hụrụ
  naanya, Jizọs Kraịst. Nde kwuru nde gburugburu ụwa anabatawo mmata ihe maka ihe ndị a eburu n’amụma.
- Anyị n’obi ụtọ na-ama ọkwa na Mweghachite ekwere nkwa na-aganiihu site na mkpughe na-aganiihu. Ụwa agaghị
  ma ọlị abụrụ otu ọ dị ọzọ, dị ka Chineke ga “achịkọta ihe niile n’otu niime Kraịst” (Ndị Efesọs 1:10).
- Na nsọpụrụ na obi ekele, anyị dị ka Ndị Ozi Ya na-akpọku onye niile ịmata—dị ka anyị ma—na eluigwe niile
  ghe oghe. Anyị kwenyere na Chineke na-eme ka amata uche Ya maka ụmụ Ya ndị nwoke na ndị nwanyị. Anyị
  na-agba ama na ndị ahụ jupụtara n’ekpere ịmụ ozi nke Mweghachite ma mee ihe n’okwukwe ka aga agọzi irite
  aka ebe nke onwe ha maka ịdị nsọ ya na nzube ya iji kwado ụwa maka Ọbịbịa nke Ugboro Abụọ ekwere nkwa
  nke Onyenwe anyị na Onye Nzọpụta anyị, Jizọs Kraịst.
