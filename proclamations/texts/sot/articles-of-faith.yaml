title: Lintlha tsa Tumelo tsa Kereke ea Jesu Kreste ea Bahalaleli ba Mehla ea Kajeno
subtitle: ''
author: ''
verses:
- n: 1
  text: Re lumela ho Molimo, Ntate oa Bosafeleng, le ho Mora oa Hae, Jesu Kreste, le ho Moea o Halalelang.
- n: 2
  text: Re lumela hore batho ba tla otleloa libe tsa bona, ’me eseng ka lebaka la lits’ito tsa Adama.
- n: 3
  text: Re lumela hore ka Topollo ea Kreste, batho bohle ba ka pholoha, ka ho phetha melao le lits’ebeletso
    tsa Evangeli.
- n: 4
  text: 'Re lumela hore metheo le lit’sebeletso tsa pele tsa Evangeli ke: ea pele, Tumelo ho Morena Jesu
    Kreste; ea bobeli, Pako; ea boraro, Kolobetso ka ho ineloa metsing bakeng sa ts’oarelo ea libe; ea
    bone, Peho ea matsoho bakeng sa mpho ea moea o Halalelang.'
- n: 5
  text: Re lumela hore motho o tlamehile ho bitsoa ke Molimo, ka boporofeta, le ka ho beoa matsoho ke
    ba fuoeng matla, ho ruta Evangeli le ho tsamaisa lits’ebeletso tsa teng.
- n: 6
  text: Re lumela ho tlhophiso e ts’oanang le e neng e le teng Kerekeng ea Boholo-holo, ke ho re, baapostola,
    baporofeta, balisa, baruti, baevangeli, le ho ea joalo-joalo.
- n: 7
  text: Re lumela ho mpho ea maleme, boporofeta, ts’enolo, lipono, pholiso, ho tolokoa ha maleme, le ho
    ea joalo-joalo.
- n: 8
  text: Re lumela Bibele e le lentsoe la Molimo ha feela e fetoletsoe ka nepo; re boetse re lumela Buka
    ea Mormone e le lentsoe la Molimo.
- n: 9
  text: Re lumela tsohle tseo Molimo a li senotseng, le tsohle tseo a li senolang hajoale, ’me re lumela
    hore ke hona a tla senola lintho tse ngata ’me tsa bohlokoa tse amanang le ’Muso oa Molimo.
- n: 10
  text: Re lumela ho pokello ea sebele ea Israele le ka tsosoloso ea Meloko e Leshome; hore Sione (Jerusalema
    a Ncha) e tla ahoa tikolohong ea Amerika; hore Kreste o tla busa ka bo eena lefats’eng; le hore, lefats’e
    le tla nchafatsoa ’me le fumane khanya ea lona e bo paradeisi.
- n: 11
  text: Re tiisa tokelo ea ho khumamela Molimo ea Matla Ohle ho latela metheo ea matsoalo a rona, ’me
    re lumella batho bohle tokelo e ts’oanang, hore ba khumamele kamoo, kae, le eng eo ba e batlang.
- n: 12
  text: Re lumela hoba tlasa puso ea marena, baetapele, babusi, le bo mastrata, ho mamela, ho hlompha
    le ho ts’ehetsa molao.
- n: 13
  text: Re lumela ho ho ts’epahala, ho ba le ’nete, ho hloeka, ho ba mosa, ho ba le bokhabane, le ho etsa
    botle ho batho bohle; ka ’nete, re ka re re sala morao litaeo tsa Paulosi—Re lumela lintho tsohle,
    re ts’epa lintho tsohle, re se re mamelletse lintho tse ngata, ’me re ts’epa ho mamella lintho tsohle.
    Haeba ho ena le efe kapa efe e khabane, e ntle, kapa tlaleho e ntle kapa e rorisoang, re batlana le
    tsona.
signature: Joseph Smith.
