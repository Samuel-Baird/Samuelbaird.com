retrieved: '2026-11-02'
title: Tsosoloso ea Evangeli e Phethahetseng ea Jesu Kreste
subtitle: Phatlalatso ea Lilemo tse Makholo a Mabeli ho Lefats’e
author: Boetapele ba Pele le Lekhotla la Baapostola ba Leshome le Metso e ’Meli ba Kereke ea Jesu Kreste
  ea Bahalaleli ba Mehla ea Kajeno
note: Ka hlompho le teboho, re le Baapostola ba Hae re mema bohle ho tseba – joalo ka rona – hore maholimo
  a phetlehile. Re tiisa hore Molimo o tsebahatsa thato ea hae ho bara le barali ba hae ba ratoang. Re
  paka hore bao ba ithutang ka borapeli molaetsa oa Tsosoloso ’me ba etsa ka tumelo ba tla hlohonolofatsoa
  ka ho fumana bopaki ba bona ka bohalaleli ba oona le ka morero oa oona oa ho lokisa lefats’e bakeng
  sa Ho Tla Khetlo la Bobeli hoo re ho ts’episitsoeng ha Morena oa rona le Mopholosi, Jesu Kreste.
paragraphs:
- Re phatlalatsa ka ’nete hore Molimo o rata bana ba hae lichabeng tsohle tsa lefats’e. Molimo Ntate o
  re file tsoalo ea bo-Molimo, bophelo bo ke keng ba bapisoa, le sehlabelo se lopollang se sa feleng sa
  Mora oa Hae ea Ratoang, Jesu Kreste. Ka matla a Ntate, Jesu o ile a tsoha hape ’me a fumana tlholo holima
  lefu. Ke Mopholosi oa rona, Mohlala oa rona, le Molopolli oa rona.
- Lilemo tse makholo a mabeli tse fetileng, e le hoseng ho hotle ha limela li thunya ka 1820, mohlankana
  Joseph Smith, a ne a batla ho tseba hore ke Kereke efe eo a ka e kenang, o ile a ea rapella ka lifateng
  tse neng li le haufi le habo leboea la New York, USA. O ne a ena le lipotso mabapi le pholoho ea moea
  oa hae ’me a ts’epile hore Molimo o tla mo tataisa.
- Ka boikokobetso, re phatlalatsa hore e le karabo ea thapelo ea hae, Molimo Ntate le Mora oa Hae, Jesu
  Kreste, ba ile ba itlhahisa ho Joseph ’me ba simolla “pusetso ea lintho tsohle” (Liketso 3:21) joalo
  ka ha ho senotsoe ka Bibeleng. Ponong ena, o ile a ithuta hore kamora mafu a Baapostola ba pele, Kereke
  ea Testamente e Ncha ea Kreste e ile ea lahleha lefats’eng. Joseph o ne a tlo ba bohlokoa ho e khutlisetsa.
- Re tiisa hore tlasa tataiso ea Ntate le Mora, barumuoa ba maholimo ba ile ba tla ho tla ruta Joseph
  le ho theha hape Kereke ea Jesu Kreste. Johanne Mokolobetsi ea tsohileng bafung o ile a tsosolosa matla
  a ho kolobetsa ka ho inela metsing bakeng sa ts’oarelo ea libe. Baapostola ba bararo ho ba leshome le
  metso e ’meli ba pele – Petrose, Jakobo le Johanne – ba ile ba tsosolosa boapostola le litokelo tsa
  matla a boprista. Ba bang ba ile ba tla le bona, ho kenyeletsa Elija, ea ileng a tsosolosa matla a ho
  kopanya malapa ’moho ka ho sa feleng ka likamano tsa bosafeleng ka ho fetisa le lefu.
- 'Re nts’etsa pele ho paka hore Joseph Smith o ile a fuoa mpho le matla a Molimo ho fetolela lingoliloeng
  tsa khale-khale: Buka ea Mormone – Testamente e ’Ngoe ea Jesu Kreste. Maqephe a mang a lingoliloeng
  tsena tse halalelang a kenyeletsa pale ea bosebeletsi ba Jesu Kreste ka bo eena har’a batho ba Lefats’eng
  la Bophirima hang kamora Tsoho ea Hae. E ruta ka morero oa bophelo ’me e hlalosa lithuto tsa tumelo
  tsa Kreste, tseo e leng khubu ea morero ona. Joalo ka ha e le molekane oa mangolo a halalelang le Bibele,
  Buka ea Mormone e paka hore batho bohle ke bara le barali ba Ntate ea Maholimong ea lerato, hore O na
  le moralo o bo-Molimo bakeng sa maphelo a rona, le hore Mora oa Hae, Jesu Kreste, oa bua kajeno joalo
  ka matsatsing a khale.'
- Re phatlalatsa hore Kereke ea Jesu Kreste ea Bahalaleli ba Mehla ea Kajeno, e ileng ea hlophisoa ka
  la 6 ’Mesa, 1830, ke Kereke ea Kreste ea Testamente e Ncha e tsosolotsoeng. Kereke ena e tsepamesitsoe
  ho bophelo bo phethehileng ba lejoe la ntlha la sehloho, Jesu Kreste, le Topollo ea hae e sa feleng
  le Tsoho ea hae Bafung ea sebele. Jesu Kreste o boetse hape o bitsitse Baapostola ’me o ba file matla
  a boprista. O re mema bohle ho tla ho Eena le ho Kereke ea Hae, ho tla fumana Moea o Halalelang, lits’ebeletso
  tsa pholoho, le ho tla fumana nyakallo e sa feleng.
- Lilemo tse makholo a mabeli li se li fetile ho tloha ha Tsosoloso ena e ne e qaloa ke Molimo Ntate le
  Mora oa Hae ea Ratoang, Jesu Kreste. Li milione ho ea le lefats’e li amohetse tsebo ea liketsahalo tsena
  tse porofetiloeng.
- Re phatlalatsa ka thabo hore Tsosoloso e ileng ea ts’episoa e ea pele ka ts’enolo e tsoelang pele. Lefats’e
  le ke ke la hlola le ts’oana hape, ka ha Molimo o tla “bokella ’moho tsohle ho Kreste” (Ba-Efese 1:10).
