title: Lelapa
subtitle: Phatlalatso ho Lefats’e
author: ''
note: Phatlalatso ena e ile ea baloa ke Mookameli Gordon B. Hinckley e le karolo ea molaetsa oa hae kopanong
  e akaretsang ea bo ’m’e e neng e ts’oeroe ka la 23 Loetse 1995, Salt Lake City, Utah.
paragraphs:
- Rona, Boetapele ba Pele le Lekhotla la Baapostola ba Leshome le Metso e ’Meli ba Kereke ea Jesu Kreste
  ea Bahalaleli ba Mehla ea Kajeno re phatlalatsa ka tieo hore lenyalo pakeng tsa monna le mosali le hlotsoe
  ke Molimo ’me le hore lelapa le khubung ea moralo oa ’Mopi bakeng sa qetello ea bosafeleng ea bana ba
  hae.
- Batho bohle—ba batona le ba bats’ehali—ba bopiloe ka sets’oants’o sa Molimo. E mong le e mong ke mora
  kapa morali moeeng ea ratoang oa batsoali ba leholimo, ’me ha ho le joalo e mong le e mong o na le tlholeho
  ea bo-Molimo le qetello. Bong ke ts’ia ea bohlokoa ea botho ea bophelong ba pele ho ba lefats’eng, bophelo
  ba lefats’eng, le morero le botho ba bosafeleng.
- Bophelong ba pele ho ba lefats’eng, bara le barali moeeng ba ne ba tseba le ho khumamela Molimo joaloka
  ntat’a bona oa bosafeleng ’me ba amohela moralo oa hae oo ka ona bana ba hae ba neng ba tla khona ho
  fumana ’mele oa nama ’me ba fumane boiphihlelo lefats’eng ho tsoelapele ho isa ho phethahaleng ’me qetellong
  ho fihlella qetello ea bona ea bo-Molimo e le majalefa a bophelo ba bosafeleng. Moralo oa bo-Molimo
  oa thabo o nolofalletsa hore likamano tsa malapa li nts’etsoe pele ka ng’ane ho lebitla. Lits’ebeletso
  tse halalelang le lilekane tse fumanehang litempeleng tse halalelang li etsa hore ho khonehe bakeng
  sa batho ka bo mong ho khutlela ho boteng ba Molimo ’me le bakeng sa malapa ho ba ’moho ka hosafeleng.
- Taelo ea pele eo Molimo a e fileng Adama le Eva e ne e le mabapi le monyetla oa bona oa ho ba batsoali
  joalo ka monna le mosali. Re phatlalatsa hore taelo ea Molimo bakeng sa bana ba hae ho ngatafala le
  ho ata lefats’eng e setse e ntse e eme. Re tsoelapele ho phatlalatsa hore Molimo o laetse hore matla
  a halalelang a ho beleha a tlameha ho sebelisoa feela pakeng tsa monna le mosali ba nyalaneng ka molao
  e le monna le mosali.
- Re phatlalatsa tsela eo bophelo ba hoshoa bo hloloang ka eona e khethehile e le bo-Molimo. Re tiisa
  khalalelo ea bophelo le bohlokoa ba bona ka moralong oa Molimo oa bosafeleng.
- Monna le mosali ba na le boikarabello bo hlokolosi ba ho ratana le ho hlokomelana le bana ba bona. “Bana
  ke lefa la Morena” (Lipesaleme 127:3). Batsoali ba na le mosebetsi o halalelang oa ho holisa bana ba
  bona ka lerato le ho loka, ho fana ka litlhoko tsa bona tsa nama le tsa moea, le ho ba ruta ho ratana
  le ho sebeletsana, ho ikobela litaelo tsa Molimo, le ho ba baahi ba hlomphang molao hohle moo ba phelang
  teng. Banna le basali—bo ’m’e le bo ntate—ba tla ikarabella ka pele ho Molimo bakeng sa ho phethahatsa
  maikarabello ana.
- Lelapa le hlohonolofalitsoe ke Molimo. Lenyalo pakeng tsa monna le mosali le bohlokoa ho moralo oa hae
  oa bosafeleng. Bana ba na le tokelo ea tlhaho ka har’a tlamahano ea lenyalo, ’me ba holisoe ke ntate
  le ’m’e ba hlomphang boitlamo ba lenyalo ka ho ts’epahala ho phethahetseng. Thabo ka hare ho bophelo
  ba lelapa e na le monyetla o moholo oa ho fihleloa ha e theuoe holima lithuto tsa Morena Jesu Kreste.
  Manyalo le malapa a atlehileng a theuoe le ho bolokoa holima metheo ea tumelo, thapelo, pako, ts’oarelo,
  tlhompho, lerato, kutloelo bohloko, mosebetsi, le liketsahalo tsa boithabiso tse molemo. Ho latela moralo
  oa bo-Molimo, bo ntate ba tlameha ho okamela malapa a bona ka lerato leho loka ’me ba na le boikarabello
  ba ho fana ka litlhoko tsa bophelo le ts’ireletso bakeng sa malapa a bona. Bo ’m’e ba na le boikarabello
  ba mantlha ba kholiso ea bana ba bona. Maikarabellong ana a halalelang, bo ntate le bo ’m’e ba tlameha
  ho thusana joalo ka balekane ba lekanang. Bokooa, lefu, kapa maemo a mang a ka tlisa tlhokahalo ea ho
  ikamahanya le maemo ka bo mong. Baamani ba lokela ho fana ka thuso ha ho hlokahala.
- Re hlokomelisa hore batho ba tlolang lilekane tsa bohloeki, ba hlekefetsang balekane kapa bana, kapa
  ba hlolehang ho phethahatsa boikarabello ba lelapa tsatsing le leng ba tla ema ho ikarabella kapele
  ho Molimo. Re tsoelapele, ho hlokomelisa hore karohano ea lelapa e tla tlisa litlokotsi tse boletsoeng
  ke baporofeta ba khale le ba kajeno holima batho, sechaba, le lichaba.
- Re etsa khoheletso ho baahi ba nang le boikarabello le bahlanka ba ’muso hohle ho hlohlelletsa mehato
  e reretsoeng ho boloka le ho matlafatsa lelapa e le ts’ia ea bohlokoa ea sechaba.
