title: ခရံာ်လၢအမူဝဲတဂၤ
subtitle: ၦၤတၢ်မၢဖိတဖၣ်အတၢ်အုၣ်သး
author: ယ့ၣ်ၡူးခရံာ်အသရိာ်ဘၣ်ဃးဒီးၦၤစီဆှံလၢမုၢ်နံၤခံကတၢၢ်
paragraphs:
- ဒ်ပမၤလၤကပီၤယ့ၣ်ၡူးခရံာ်အအိၣ်ဖျဲၣ်အပူၤကွံာ်အနံၣ်ခံကထိန့ၣ်, ပဟ့ၣ်ထီၣ်ပတၢ်အုၣ်သးလၢအတၢ်အိၣ်မူနီၢ် နီၢ်လၢထိၣ်သတြီၤအီၤဒီးတၢ်အဂၤတသ့ဘၣ်ဒီးအတၢ်လုၢ်ထီၣ်အသးအတၢ်လိးကဒါက့ၤအစိအကမီၤလၢအကတၢၢ်တအိၣ်ဘၣ်န့ၣ်လီၤ.
  ၦၤတအိၣ်ဘၣ်နီတဂၤဘၣ်လၢအတၢ်အိၣ်မူလၢအမၤဆီတလဲကယဲၢ်ၦၤလၢအအိၣ်မူတ့ၢ်ဝဲတဖၣ်ဒီးၦၤလၢအကဟဲအိၣ်မူလၢဟီၣ်ခိၣ်ဖျၢၣ်အဖီခိၣ်တဖၣ်လၢအဒိၣ်ဝဲယိာ်ဝဲတအိၣ်ဘၣ်န့ၣ်လီၤ.
- အဝဲမ့ၢ်ယဟိဝၤလၢလံာ်စီဆှံအလီၢ်လံၤတကတြူၢ်အပူၤ, မ့းၡံအးလၢလံာ်စီဆှံအသီတကတြူၢ်အပူၤန့ၣ်လီၤ. လၢအပၢ်အစုတၢ်နဲၣ်ကျဲအဖီလာ်အမ့ၢ်ၦၤလၢအတ့လီၤဟီၣ်ခိၣ်ဖျၢၣ်တဂၤန့ၣ်လီၤ.
  “ကယဲၢ်တၢ်ခဲလၢာ်ခဲဆ့အံၤကဲ ထီၣ်လၢအစုပူၤ, ဒီးတၢ်လၢအကဲထီၣ်န့ၣ်, တကဲထီၣ်ဘၣ်လၢအစုပူၤဒီး, တအိၣ်ဘၣ်နီတမံၤဘၣ်.”
  (ယိၤဟၣ် ၁:၃) အတၢ်ဒဲးဘးတအိၣ်ဘၣ်သနာ်က့ၤအဝဲဒိးဘျၢအသးဒ်သိးကမၤလၢပှဲၤတၢ်တီတၢ်လိၤခဲလၢာ်န့ၣ်လီၤ. အဝဲ “လဲၤသကုဆးဒးဒီးမၤဂ့ၤတၢ်,”
  (မၤတၢ် ၁၀:၃၈) သနာ်က့ၤအဘၣ်တၢ်သးဟ့အီၤလၢတၢ်အံၤအဃိန့ၣ်လီၤ. အတၢ်သးခုကစီၣ်န့ၣ်မ့ၢ်တၢ်ကစီၣ်လၢဘၣ်ဃးဒီးတၢ်ဃူတၢ်ဖိးဒီးတၢ်မၤဂ့ၤတၢ်န့ၣ်လီၤ.
  အဝဲဃ့သကွံၢ်ကညးကယဲၢ်ၦၤခဲလၢာ်လၢအကလူၤပိာ်ထွဲအဒိအတဲာ်န့ၣ်လီၤ. အဝဲဟးလၢကီၢ်ဖးလ့ၡသးအကျဲတဖၣ်, မၤဘျါက့ၤၦၤဆူးၦၤဆါ,
  ဒုးထံၣ်ထီၣ်က့ၤၦၤအမဲာ်ဘျီၣ်, ဒီးမၤမူထီၣ်က့ၤၦၤအသံန့ၣ်လီၤ. အဝဲသိၣ်လိတၢ်မ့ၢ်တၢ်တီတဖၣ်ဘၣ်ဃးဒီးတၢ်လီၤထူလီၤယိာ်,
  တၢ်အိၣ်မူတချုးဒံးဘၣ်လၢဟီၣ်ခိၣ်အဆၢကတီၢ်အအီၣ်နီၢ်နီၢ်, ပမူပဒါလၢဟီၣ်ခိၣ်ဖျၢၣ်အံၤအဖီခိၣ်, ဒီးတၢ်မၤအသးသ့လၢကကဲထီၣ်ယွၤအဖိခွါတဖၣ်ဒီးအဖိမုၣ်တဖၣ်လၢတၢ်အိၣ်မူလၢကဟဲလၢခံန့ၣ်လီၤ.
- အဝဲဒုးအိၣ်ထီၣ်ဝဲတၢ်အီၣ်ဘူၣ်ဒ်တၢ်သ့ၣ်နီၣ်ထီၣ်တခါလၢအဘၣ်ဃးဒီးအတၢ်လုၢ်ထီၣ်အသး အတၢ်လိးကဒါက့ၤန့ၣ်လီၤ. အဝဲဘၣ်တၢ်ဖီၣ်အီၤဒီးဘၣ်တၢ်ပာ်အၢအီၤလၢတၢ်လၢအတတီတလိၤတဖၣ်,
  ဘၣ်တၢ်စံၣ်ညီၣ်အီၤလၢအကမၤမံၦၤတၢထီၣ်တၢလီၤသ့ၣ်တဖၣ်အသး, ဒီးဘၣ်တၢ်ဆၢတဲာ်လၢကသံဝဲလၢကရၤနံၤအထူၣ်စုညါအလိၤန့ၣ်လီၤ.
  အဝဲဟ့ၣ်လီၤအသးသမူဒ်သိးကပှ့ၤက့ၤဝဲၦၤဟီၣ်ခိၣ်ဖိခဲလၢာ်လၢတၢ်ဒဲးဘးအဂီၢ်န့ၣ်လီၤ. အဝဲမ့ၢ်တၢ်ဟ့ၣ်လၢဘၣ်တၢ်ဟ့ၣ်လီၤအီၤလၢၦၤလၢအဂၤတဂၤအခၢၣ်စးလၢအဘၣ်ဃးဒီးကယဲၢ်ၦၤလၢအအိၣ်မူဝဲလၢဟီၣ်ခိၣ်ဖျၢၣ်အဖီခိၣ်ကိးဂၤဒဲးန့ၣ်လီၤ.
- ပအုၣ်ပသးသညူးသၦၢ်လၢအတၢ်အိၣ်မူလၢအမ့ၢ်ဝဲကယဲၢ်ၦၤကညီအတၢ်စံးစိၤတဲစိၤလၢအရ့ဒိၣ်ခိၣ်သ့ၣ်, တစးထီၣ်လၢဝ့ၢ်ဘ့ၤသလ့ၤဃ့ၤဘၣ်ဒီးတဝံၤလၢကရၤနံၤစ့ၢ်ကီးဘၣ်.
  အဝဲမ့ၢ်ပၢ်အဖိဝဲၢ်ကိတဂၤ, မ့ၢ်အဖိခွါအိၣ်ထဲတဂၤဃီလၢအအိၣ်ဒီးအဖံးအညၣ်, ဒီးမ့ၢ်ၦၤဟီၣ်ခိၣ်ဖိအတၢ်ပှ့ၤက့ၤအကစၢ်တဂၤလီၤ.
- အဝဲဂဲၤဆၢထၢၣ်လၢတၢ်သွၣ်ခိၣ်လၢက “ကဲထီၣ်ၦၤမံဖိတဖၣ်န့ၣ်အတၤသၣ်ဆိလီၤ” (၁ ကရံၣ်သူး ၁၅:၂၀). ဒ်ကစၢ်လၢဂဲၤဆၢထၢၣ်တဂၤအသိး,
  အဝဲလဲၤဟးလၢၦၤလၢအအဲၣ်တဖၣ်အသိးအကျါဖဲအအိၣ်မူအခါန့ၣ်လီၤ. အဝဲစ့ၢ်ကီးမၤအခ့အၦၤအတၢ်မၤလၢအ, “သိဖိအဂုအဂၤ” (ယိၤဟၣ်
  ၁၀:၁၆) လၢထံကီၢ်အမဲရံကၤလၢပျၢၤအသိးအကျါန့ၣ်လီၤ. လၢဟီၣ်ခိၣ်ခဲကနံၣ်အံၤ, အဝဲဒီးအပၢ်အိၣ်ဖျါထီၣ်အသးလၢၦၤပိာ်ခွါဖိသၣ်စီၤယိၤသးစမံာ်,
  တူၢ်လိာ်ဆှၢနုာ်ဝဲတၢ်အၢၣ်လီၤလၢအယံာ်တ့ၢ်မး, “ဖဲအမုၢ်အလါပှဲၤထီၣ်” (အ့းဖ့းစူး ၁:၁၀).
- ဘၣ်ထွဲဒီးခရံာ်လၢအမူဝဲတဂၤ, ဝံစီၤယိၤသးစမံာ်ကွဲးဝဲ, အမဲာ်ချံတဖၣ်လီၤဂာ်ဒ်မ့ၣ်အူလၣ်, အခိၣ်ဆူၣ်န့ၣ်ဝါဝဲဒ်မူခိၣ်ဖီအသိး,
  အမဲာ်အက့ၢ်အဂီၤကပြုၢ်ဒိၣ်န့ၢ်ဒံးမုၢ်တဖျၢၣ်အတၢ်ကပီၤ, ဒီးအတၢ်ကတိၤတၢ်ကလုၢ်အသီၣ်လီၤဂာ်ဒံးထံတဖၣ်လၢအဟဲစီၣ်ထီၣ်ဆူၣ်ဆူၣ်အသိး,
  လၢအမ့ၢ်ယဟိဝၤအတၢ်ကတိၤတၢ်ကလုၢ်ဒီးစံးဝဲဒၣ်,
- ယမ့ၢ်တၢ်အခီၣ်ထံးဒီးတၢ်အကတၢၢ်, ယမ့ၢ်ၦၤလၢအမူဝဲတဂၤ, ယမ့ၢ်ၦၤလၢအဘၣ်တၢ်မၤသံအီၤတဂၤ, ယမ့ၢ်ၦၤသကွံၢ်ကညးန့ၢ်လၢနဂီၢ်လၢပၢ်အအိၣ်န့ၣ်လီၤ
  (တၢ်သိၣ်လိသီလိဒီးတၢ်အၢၣ်လီၤအီလီၤလိာ်အသးတဖၣ် ၁၁၀:၃–၄).
- ဘၣ်ထွဲဒီးအဝဲန့ၣ်ဝံစီၤယိၤသးစမံာ်စံးတဲဖျါထီၣ်ဝဲဒၣ်, ဒီးခဲကနံၣ်အံၤ, ကယဲၢ်တၢ်အုၣ်အသးအါအါဂီၢ်ဂီၢ်လၢဘၣ်တၢ်အုၣ်အသးလၢအီၤန့ၣ်ဝံၤအလီၢ်ခံ,
  အဝဲအံၤမ့ၢ်တၢ်အုၣ်သးအလီၢ်ခံကတၢၢ်တဘျီလၢပဟ့ၣ်လီၤဘၣ်ထွဲဒီးအီၤလၢအဝဲန့ၣ်မူဝဲ.
- အဂ့ၢ်ဒ်အံၤပထံၣ်အီၤ, လၢကစၢ်ယွၤအစုထွဲဒၣ်လဲာ်, ဒီးပနၢ်ဟူတၢ်ကတိၤတၢ်ကလုၢ်လၢအအၢၣ်လီၤလၢအဝဲမ့ၢ်ပၢ်အဖိခွါအိၣ်ဝဲထဲတဂၤဃီန့ၣ်လီၤ.
- လၢအဝဲအဃိန့ၣ်ဒီးခီဖျိအဝဲအဃိန့ၣ်, ဒီးမ့ၢ်လၢအဝဲန့ၣ်, ဟီၣ်ခိၣ်တဖၣ်ဘၣ်တၢ်ဒုးတ့အီၤ, ဒီးၦၤလၢအအိၣ်ဝဲဆိးဝဲလၢဟီၣ်ခိၣ်အဝဲန့ၣ်သ့ၣ်တဖၣ်မ့ၢ်ဝဲယွၤအဖိခွါတဖၣ်ဒီးအဖိမုၣ်တဖၣ်န့ၣ်လီၤ
  (တၢ်သိၣ်လိသီလိဒီးတၢ်အၢၣ်လီၤအီလီၤလိာ်အသးတဖၣ် ၇၆:၂၂–၂၄).
- ပစံးတဲဖျါထီၣ်လၢတၢ်ကတိၤသညူးသၦၢ်အပူၤဘၣ်ဃးဒီးအတၢ်ပာ်စုအစိအကမီၤဒီးအသရိာ်န့ၣ်ဘၣ်တၢ်ဟဲက့ၤစိာ်အီၤလၢဟီၣ်ခိၣ်ဖျၢၣ်အဖီခိၣ်လံန့ၣ်လီၤ.
  “ဒီးမၤထီၣ်သုလၢၦၤတၢ်မၢဖိဒီးဝံသ့ၣ်တဖၣ်အခီၣ်ထံးအဖီခိၣ်ဒီးယ့ၣ်ၡူးခရံာ်အကစၢ်ဒၣ်ဝဲမ့ၢ်ဟံၣ်သနၢၣ်အခီၣ်ထံးလီၤ”
  (အ့းဖ့းစူး ၂:၂၀).
- ပအုၣ်ပသးလၢမုၢ်ကအိၣ်ဝဲတနံၤအဝဲကဟဲက့ၤကဒါက့ၤလၢဟီၣ်ခိၣ်. “ဒီးယွၤအလၤကပီၤကအိၣ်ဖျါထီၣ်, ဒီးကယဲၢ်တၢ်ညၣ်ခဲလၢာ်ကထံၣ်ဘၣ်ဝဲတပူၤဃီလီၤ”
  (ဝံယၡါယၤ ၄၀:၅). အဝဲကစံၣ်ညီၣ်ပၢတၢ်ဒ်စီၤပၤတဖၣ်အစီၤပၤဒီးပၢတၢ်ဒ်ကစၢ်တဖၣ်အကစၢ်အသိး, ဒီးကယဲၢ်ခီၣ်လ့ၢ်ခိၣ်တဖၣ်ကချံးလီၤဒီးကယဲၢ်ပျ့ၤတဖၣ်ကကတိၤတၢ်ဘူၣ်ထီၣ်ဘါထီၣ်လၢအမဲာ်ညါန့ၣ်လီၤ.
  ပဝဲတဂၤဘၣ်တဂၤစုာ်စုာ်ကဆၢထၢၣ်လၢအမဲာ်ညါလၢအဝဲကစံၣ်ညီၣ်ၦၤဒ်ပတၢ်ဖံးတၢ်မၤတဖၣ်ဒီးပသးတဖၣ်အတၢ်သးလီတဖၣ်အသိးန့ၣ်လီၤ.
- ပဟ့ၣ်ထီၣ်တၢ်အုၣ်သး, ဒ်အၦၤလၢအဘၣ်တၢ်ပာ်စုအီၤတၢ်မၢဖိတဖၣ်အသိး, လၢယ့ၣ်ၡူးမ့ၢ်ခရံာ်လၢအမူဝဲတဂၤ, ယွၤအဖိခွါလၢအသံတသ့ဘၣ်န့ၣ်လီၤ.
  အဝဲမ့ၢ်စီၤပၤဧံးမၤနူၤအ့လး, အမ့ၢ်ၦၤတဂၤလၢအဆၢထၢၣ်လၢအပၢ်အစုထွဲလၢမုၢ်မဆါတနံၤအံၤန့ၣ်လီၤ. အဝဲမ့ၢ်တၢ်ကပီၤ, တၢ်မူ,
  ဒီးဟီၣ်ခိၣ်အတၢ်မုၢ်လၢ်န့ၣ်လီၤ. အကျဲမ့ၢ်ဝဲကျဲတဘိလၢကဆှၢၦၤဆူတၢ်သူၣ်ဖှံၣ်သးညီလၢတၢ်အိၣ်မူခဲကနံၣ်အံၤအပူၤဒီးလၢတၢ်အိၣ်မူလီၤထူလီၤယိာ်လၢကဟဲဆူညါန့ၣ်လီၤ.
  မ်ယွၤကဘၣ်တၢ်စံးဘျုးစံးဖှိၣ်အီၤလၢတၢ်ဟ့ၣ်လၢတၢ်ထိၣ်သတြီၤအီၤဒီးတၢ်အဂၤတသ့ဘၣ်လၢအမ့ၢ်အဖိခွါစီဆှံန့ၣ်လီၤ.
