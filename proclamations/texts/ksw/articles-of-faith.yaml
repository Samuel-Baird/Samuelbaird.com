title: တၢ်စူၢ်တၢ်နာ်အတၢ်ကွဲးတဖၣ် လၢယ့ၣ်ၡူးခရံာ်အသရိာ်ဘၣ်ဃးဒီးပှၤစီဆှံလၢမုၢ်နံၤခံကတၢၢ်
subtitle: ''
author: ''
verses:
- n: 1
  text: ပစူၢ်ပနာ်ယွၤ, ပၢ်လၢအမူဝဲလီၤထူလီၤယိာ်တဂၤ, ဒီးအဖိခွါယ့ၣ်ၡူးခရံာ်, ဒီးသးစီဆှံန့ၣ်လီၤ.
  label: ၁
- n: 2
  text: ပစူၢ်ပနာ်လၢၦၤကညီကဘၣ်တၢ်စံၣ်ညီၣ်ဃီၣ်အီၤလၢအတၢ်ဒဲးဘးဒၣ်ဝဲ, ဒီးတမ့ၢ်လၢစီၤအၤဒၣ်အတၢ်သရူးကမၣ်အဃိန့ၣ်ဘၣ်.
  label: ၂
- n: 3
  text: ပစူၢ်ပနာ်လၢခရံာ်အတၢ်လိးကဒါက့ၤၦၤအဃိန့ၣ်, ၦၤကညီခဲလၢာ်တဖၣ်န့ၢ်ဘၣ်တၢ်အုၣ်က့ၤခီၣ်က့ၤသ့ဝဲ, ခီဖျိလၢတၢ်ဒိကနၣ်တၢ်သးခုကစီၣ်အတၢ်သိၣ်တၢ်သီဒီးအတၢ်အၢၣ်လီၤအီလီၤအလုၢ်အလၢ်သ့ၣ်တဖၣ်န့ၣ်လီၤ.
  label: ၃
- n: 4
  text: ပစူၢ်ပနာ်လၢတၢ်သးခုကစီၣ်အတၢ်ဂ့ၢ်မိၢ်ၦၢ်ဒီးအတၢ်အၢၣ်လီၤအီလီၤအလုၢ်အလၢ်သ့ၣ်တဖၣ်အခိၣ်သ့ၣ်မ့ၢ်ဝဲ, တၢတမံၤ,
    တၢ်စူၢ်တၢ်နာ်ကစၢ်ယ့ၣ်ၡူးခရံာ်, ခံမံၤတမံၤ, တၢ်ပီၢ်ယၢ်လီၤက့ၤသး, သၢမံၤတမံၤ, တၢ်ဘျၢထံလၢတၢ်ပျၢ်တၢ်ဒဲးဘးအဂီၢ်,
    လွံၢ်မံၤတမံၤ, တၢ်ပာ်လီၤစုတဖၣ်လၢခိၣ်အလိၤလၢတၢ်ဟ့ၣ်သးစီဆှံအဂီၢ်န့ၣ်လီၤ.
  label: ၄
- n: 5
  text: ပစူၢ်ပနာ်လၢၦၤပိာ်ခွါတဂၤကဘၣ် ဘၣ်တၢ်ကိးအီၤဟဲခီဖျိလၢကစၢ်ယွၤအအိၣ်, ခီဖျိလၢတၢ်ကတိၤတၢ်လၢဝံအကျိာ်, ဒီးတၢ်ပာ်လီၤစုတဖၣ်လၢခိၣ်အလိၤလၢၦၤတဖၣ်လၢအအိၣ်ဒီးတၢ်န့ၢ်စိန့ၢ်ကမီၤ,
    ဒ်သိးကစံၣ်တဲၤတဲလီၤတၢ်သးခုကစီၣ်ဒီးဟ့ၣ်ဒုးမၤတၢ်အၢၣ်လီၤအီလီၤအလုၢ်အလၢ်သ့ၣ်တဖၣ်ကသ့န့ၣ်လီၤ.
  label: ၅
- n: 6
  text: ပစူၢ်ပနာ်လၢတၢ်ကရၢကရိလၢအဒ်သိးဒီးသရိာ်အခီၣ်ထံးလၢပျၢၤတဖျၢၣ်, ဒ်အမ့ၢ်, ၦၤတၢ်မၢဖိတဖၣ်, ဝံတဖၣ်, ၦၤကွၢ်တၢ်တဖၣ်,
    သရၣ်သိၣ်လိတၢ်တဖၣ်, ၦၤလဲၤစံၣ်တဲၤတဲလီၤတၢ်သးခုကစီၣ်တဖၣ်, ဒီးတၢ်အဂၤဒ်န့ၣ်အသိးတဖၣ်န့ၣ်လီၤ.
  label: ၆
- n: 7
  text: ပစူၢ်ပနာ်လၢပျ့ၤတဖၣ်အတၢ်ဟ့ၣ်, တဲတၢ်လၢဝံအကျိာ်, တၢ်လီၣ်ဖျါထီၣ်တၢ်, တၢ်ထံၣ်လၢညါခီတဖၣ်, တၢ်မၤဘျါက့ၤတၢ်တဖၣ်,
    ဒီးတၢ်ကျိးထံပျ့ၤတဖၣ်အတၢ်ကတိၤ, ဒီးတၢ်အဂၤဒ်န့ၣ်အသိးတဖၣ်န့ၣ်လီၤ.
  label: ၇
- n: 8
  text: ပစူၢ်ပနာ်လၢလံာ်စီဆှံမ့ၢ်ဝဲကစၢ်ယွၤအကလုၢ်အကထါထဲလၢအဘၣ်တၢ်ကွဲးကျိးထံအီၤဘၣ်ဘျီးဘၣ်ဒါအသိး, ဒီးပစူၢ်ပနာ်စ့ၢ်ကီးလၢလံာ်မိမဲၣ်မ့ၢ်ကစၢ်ယွၤအကလုၢ်အကထါန့ၣ်လီၤ.
  label: ၈
- n: 9
  text: ပစူၢ်ပနာ်တၢ်ခဲလၢာ်လၢကစၢ်ယွၤလီၣ်ဖျါထီၣ်တ့ၢ်လံ, တၢ်ခဲလၢာ်လၢအလီၣ်ဖျါထီၣ်ဝဲလၢမုၢ်မဆါတနံၤအံၤ, ဒီးပစူၢ်ပနာ်လၢအကလီၣ်ဖျါထီၣ်ဒံးတၢ်လၢအဒိၣ်ဒိၣ်မုၢ်မုၢ်ဒီးတၢ်လၢအရ့ဒိၣ်သ့ၣ်တဖၣ်လၢအဘၣ်ဃးဒီးကစၢ်ယွၤအဘီအမုၢ်န့ၣ်လီၤ.
  label: ၉
- n: 10
  text: ပစူၢ်ပနာ်လၢတၢ်ထၢဖှိၣ်ပာ်ဖှိၣ်က့ၤၦၤအံၣ်စရ့လးဖိနီၢ်နီၢ်ဒီးအတၢ်ပာ်ဖှိၣ်ကဒါက့ၤၦၤအံၣ်စရ့လးဖိအဒူၣ်တဆံ,
    ဒီးလၢစံယိၣ်(ဝ့ၢ်ယရူၤၡလ့ၣ်အသီတဝ့ၢ်)ကဘၣ်တၢ်သူၣ်ထီၣ်အီၤလၢကီၢ်အမဲရံကၤအဖီခိၣ်ဒီးခရံာ်အနီၢ်ကစၢ်ဒၣ်ဝဲကပၢတၢ်လၢဟီၣ်ခိၣ်အဖီခိၣ်,
    ဒီးဟီၣ်ခိၣ်ဖျၢၣ်ကသီထီၣ်က့ၤဒီးကန့ၢ်ဘၣ်တၢ်လၤကပီၤလၢအဘၣ်ဃးပၤရၤဒံစူးန့ၣ်လီၤ.
  label: ၁၀
- n: 11
  text: ပစံးသၦၢ်ၦၢ်လၢတၢ်ခွဲးတၢ်ယာ်လၢပကဘူၣ်ထီၣ်ဘါထီၣ်ကစၢ်ယွၤလၢအဒိၣ်ဝဲစိဝဲတဂၤဖဲဒၣ်ပသးအတၢ်ထံၣ်လၢအနီၤဖးတၢ်ဂ့ၤဒီးတၢ်အၢအဆၢ,
    ဒီးပပျဲၦၤကညီခဲလၢာ်ကအိၣ်ဒီးတၢ်ခွဲတၢ်ယာ်တမံၤဃီ, မ်ပပျဲအဝဲသ့ၣ်ဘူၣ်ထီၣ်ဘါထီၣ်တၢ်ဒ်လဲၣ်ဂ့ၤဒ်လဲၣ်, တပူၤဂ့ၤတပူၤဂ့ၤ,
    မ့တမ့ၢ်ဖဲဒၣ်အဝဲသ့ၣ်အတၢ်သးအိၣ်န့ၣ်တက့ၢ်.
  label: ၁၁
- n: 12
  text: ပစူၢ်ပနာ်လၢပဘၣ်ဒိကနၣ်ဒီးမၤထွဲစီၤလိၣ်စီၤပၤတဖၣ်, ခိၣ်နၢ်တဖၣ်, ၦၤပၢတၢ်ဖိတဖၣ်, ဒီးပဒိၣ်ပၦၢ်တဖၣ်, ဒီးပကဒိကနၣ်တၢ်,
    ယူးယီၣ်တၢ်, ဒီးပာ်ဂၢၢ်ပာ်ကျၢၤတၢ်သိၣ်တၢ်သီတဖၣ်န့ၣ်လီၤ.
  label: ၁၂
- n: 13
  text: ပစူၢ်ပနာ်လၢပကြၢးအိၣ်တီအိၣ်လိၤ, သးတီ, အိၣ်စီအိၣ်ဆှံ, သးအိၣ်မၤဂ့ၤတၢ်, အိၣ်ဂ့ၤအိၣ်ဝါ, ဒီးမၤတၢ်ဂ့ၤလၢၦၤကညီခဲလၢာ်လီၤ.
    မ့ၢ်တၢ်အံၤနီၢ်နီၢ်, ပတဲသ့လၢပမၤထွဲစီၤပီလူးအတၢ်သိၣ်က့ၤသီက့ၤ, ပနာ်တၢ်ခဲလၢာ်, ပမုၢ်လၢ်တၢ်ခဲလၢာ်, ပတူၢ်တၢ်အါမံၤလံ,
    ဒီးပမုၢ်လၢ်လၢပကတူၢ်တၢ်ခဲလၢာ်သ့န့ၣ်လီၤ. တၢ်ဂ့ၤတၢ်ဝါမ့ၢ်အိၣ်, တၢ်လီၤအဲၣ်လီၤကွံမ့ၢ်အိၣ်, မ့တမ့ၢ်တၢ်လၢအလီၤစံးပတြၢၤတမံၤမံၤမ့ၢ်အိၣ်ဒီး,
    ပဃုထံၣ်န့ၢ်တၢ်လၢတၢ်သ့ၣ်တဖၣ်အံၤအဂ့ၢ်န့ၣ်လီၤ.
  label: ၁၃
signature: ကၠိစဲးစမံာ်.
