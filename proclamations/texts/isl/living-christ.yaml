title: Hinn lifandi Kristur
subtitle: Vitnisburður postulanna
author: Kirkja Jesú Krists hinna Síðari daga heilögu
paragraphs:
- Við minnumst nú fæðingar Jesú Krists fyrir tvö þúsund árum og gefum vitnisburð okkar um raunveruleika
  hans, óviðjafnanlegt líf og algjöra friðþægingu. Enginn annar hefur haft svo djúpstæð áhrif á alla sem
  lifað hafa og lifa munu á jörðunni.
- Hann var hinn mikli Jehóva Gamla testamentisins og Messías Nýja testamentisins. Undir handleiðslu föður
  síns var hann skapari jarðarinnar. „Allt varð til fyrir hann, án hans varð ekki neitt sem til er“ (Jóhannes
  1:3). Hann var skírður, þótt syndlaus væri, til að fullnægja öllu réttlæti. „Hann gekk um [og] gerði
  gott“ (Postulasagan 10:38), þótt hann væri fyrirlitinn fyrir það. Fagnaðarerindi hans var boðskapur
  friðar og velgjörðar. Hann hvatti alla til að fylgja fordæmi sínu. Hann fór um vegu Palestínu, læknaði
  sjúka, veitti blindum sýn og reisti upp dána. Hann kenndi eilífan sannleika, raunveruleika fortilveru,
  tilgang jarðlífsins og möguleika sona og dætra Guðs í komandi lífi.
- Hann innleiddi sakramentið sem áminningu um stórfenglega friðþægingarfórn sína. Hann var tekinn höndum
  og borinn fölskum sökum til að fullnægja skrílnum og dæmdur til að deyja á krossi á Golgata. Hann gaf
  líf sitt til að friðþægja fyrir syndir alls mannkyns. Undursamleg var staðgengilsgjöf hans fyrir alla
  sem lifa munu á jörðunni.
- Við berum hátíðlega vitni um að tilvera hans, sem er þungamiðja mannkynssögunnar, hafi hvorki hafist
  í Betlehem né henni lokið á Golgata. Hann var frumburður föðurins, hinn eingetni sonur í holdinu, lausnari
  heimsins.
- Hann reis úr gröfinni til að verða „frumgróði þeirra sem sofnaðir eru“ (1. Korintubréf 15:20). Upprisinn
  vitjaði Drottinn þeirra sem verið höfðu honum kærir í jarðlífinu. Hann þjónaði einnig „öðrum sauðum“
  sínum (sjá Jóhannes 10:16) í Ameríku til forna. Á síðari tímum birtust hann og faðir hans piltinum Joseph
  Smith, til að innleiða hina löngum lofuðu „[ráðstöfun] í fyllingu tímanna“ (Efesusbréfið 1:10).
- 'Spámaðurinn Joseph Smith ritaði um hinn lifandi Krist: „Augu hans voru sem eldslogi, hárið á höfði
  hans var hvítt sem nýfallin mjöll, ljóminn frá svip hans bar af ljóma sólarinnar og rödd hans var sem
  dynur mikilla vatnsfalla, já, rödd Jehóva, sem sagði:'
- Ég er hinn fyrsti og hinn síðasti. Ég er sá, sem lifir. Ég er sá, sem deyddur var. Ég er málsvari yðar
  hjá föðurnum“ (K&S 110:3–4).
- 'Spámaðurinn sagði einnig um hann: „Og nú, eftir þá mörgu vitnisburði, sem gefnir hafa verið um hann,
  er þetta vitnisburðurinn síðastur allra, sem við gefum um hann: Að hann lifir!'
- Því að við sáum hann, já, Guði til hægri handar, og við heyrðum röddina, sem bar vitni um, að hann er
  hinn eingetni föðurins –
- Að með honum, fyrir hann, og af honum eru og voru heimarnir skapaðir, og íbúar þeirra eru getnir synir
  og dætur Guðs“ (K&S 76:22–24).
- Við lýsum því hátíðlega yfir að prestdæmi hans og kirkja hafa verið endurreist á jörðunni – „sem hefur
  að grundvelli postulana og spámennina en Krist Jesú sjálfan að hyrningarsteini“ (Efesusbréfið 2:20).
- Við berum vitni um að hann muni dag einn snúa til jarðarinnar á ný. „Þá mun dýrð Drottins birtast og
  allt hold sjá það“ (Jesaja 40:5). Hann mun ráða og ríkja sem konungur konunganna og Drottinn drottnanna
  og hvert kné mun beygja sig og hver tunga mæla í lofgjörð frammi fyrir honum. Sérhvert okkar mun hljóta
  dóm hans í samræmi við verk okkar og þrá hjartans.
- Við berum vitni sem réttilega vígðir postular hans – að Jesús er hinn lifandi Kristur, hinn ódauðlegi
  sonur Guðs. Hann er hinn mikli konungur Immanúel sem nú er föðurnum til hægri handar. Hann er ljós,
  líf og von heimsins. Vegur hans er leiðin til hamingju í þessu lífi og eilífs lífs í komandi heimi.
  Guði séu þakkir fyrir óviðjafnanlega gjöf guðlegs sonar hans.
