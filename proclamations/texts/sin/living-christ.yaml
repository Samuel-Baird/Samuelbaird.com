title: ජීවමාන ක්‍රිස්තුස්වහන්සේ
subtitle: ප්‍රේරිතවරුන්ගේ සාක්ෂිය
author: යේසුස් ක්‍රිස්තුස්වහන්සේගේ පසුදවස්වල ශුද්ධවන්තයන්ගෙන් යුත් සභාව
paragraphs:
- අපි සහස්‍ර දෙකකට පෙර සිදු වූ යේසුස් ක්‍රිස්තුස්වහන්සේගේ උපත සිහිපත් කරන විට, උන්වහන්සේගේ අසමසම ජීවිතයේ
  යතාර්ථය සහ උන්වහන්සේගේ ශ්‍රේෂ්ඨ වන්දිගෙවීමේ පරිත්‍යාගයේ අපිරිමිත ගුණ ගැන අපි අපගේ සාක්ෂිය පුද කරන්නෙමු.
  මෙම පොළොවේ ජීවත් වූ සහ තවදුරටත් ජීවත්වීමට සිටින සියල්ලන්ම වෙත එතරම් ගැඹුරු ලෙස බලපෑමක් ඇති කළ වෙනත්
  කිසිවෙක් නොමැත.
- උන්වහන්සේ පරණ ගිවිසුමේ යෙහෝවාවහන්සේ වන අතර, අලුත් ගිවිසුමේ මෙසියස්වහන්සේ වන සේක. උන්වහන්සේගේ පියාණන්ගේ
  මගපෙන්වීම යටතේ, පොළොවේ මැවුම්කරුවාණන් වූයේ උන්වහන්සේය. “උන්වහන්සේ කරණකොටගෙන සියල්ල සාදන ලද්දේය; සාදන
  ලද කිසිවක් උන්වහන්සේ නැතිව සාදනු නොලද්දේය” (යොහාන් 1:3). පාප රහිත වුවද, සියලු ධර්මිෂ්ඨකම් සම්පූර්ණ කරන
  පිණිස උන්වහන්සේ බව්තීස්ම වූ සේක. “උන්වහන්සේ යහපත කරමින් හැසිරුන සේක” (ක්‍රියා 10:38), එහෙත් එනිසාම ගැරහුම්
  ලැබූ සේක. උන්වහන්සේගේ ශුභාරංචිය සාමයේ සහ දයානුකම්පාවේ පණිවිඩයකි. උන්වහන්සේගේ ආදර්ශය අනුගමනය කරන ලෙස
  උන්වහන්සේ සියල්ලන්ටම ආයාචනා කළ සේක. උන්වහන්සේ ලෙඩුන් සුවපත් කරමින්, අන්ධයන්ට පෙනීම ලබාදෙමින් සහ මළවුන්
  නැගිටුවමින් පලස්තීනයේ වීදිවල ඇවිද ගිය සේක. උන්වහන්සේ සදාකාලිකත්වයේ සත්‍යයන්ද, අපගේ පෙර ආත්මික ජීවිතයේ
  සැබෑ තත්වයද, පොළොව මත අපගේ ජීවිතයේ අරමුණ සහ මතු පැමිණෙන ජීවිතයේ දෙවියන්වහන්සේගේ පුතුන් සහ දියණියන් ලෙස
  අපගේ හැකියාවන් ගැනද ඉගැන්වූ සේක.
- උන්වහන්සේගේ ශ්‍රේෂ්ඨ වන්දිගෙවීමේ පරිත්‍යාගයේ සිහිපත් කිරීමක් ලෙස උන්වහන්සේ සක්‍රමේන්තුව පිහිටවූ සේක.
  උන්වහන්සේ අත්අඩංගුවට පත්ව ව්‍යාජ චෝදනා මත හෙළා දැක, මැරයෙකුව තෘප්තිමත් කිරීම උදෙසා වරදකරු කරනු ලැබූ
  අතර, කල්වාරියේ කුරුසිය මත මරණයට නියම කරනු ලැබූ සේක. සියලු මනුෂ්‍ය වර්ගයාගේ පාප වෙනුවෙන් වන්දිගෙවීම සඳහා
  උන්වහන්සේ සිය ජීවිතය ලබාදුන් සේක. උන්වහන්සේගේ ජීවිතය මෙලොව ජීවත්වන සියල්ලන්ම වෙනුවෙන් වූ ශ්‍රේෂ්ඨතම
  පරාර්ථකාමී දීමනාවක් විය.
- සියලුම මනුෂ්‍ය ඉතිහාසය තුළ කේන්ද්‍රස්ථානය වන උන්වහන්සේගේ ජීවිතය, බෙත්ලෙහෙමෙන් ආරම්භ වූවේවත්, කල්වාරියෙන්
  අවසන් වූවේවත් නැති බවට අපි ඒකාන්තයෙන්ම සාක්ෂි දරන්නෙමු. උන්වහන්සේ පියාණන්වහන්සේගේ කුළුඳුලාණෝය, මාංශයේ
  ඒකජාතක පුත්‍රයාණෝය, ලෝකයේ මිදුම්කරුවාණෝය.
- “සැතපී සිටින්නන්ගේ නෑඹුල් ඵලය වීමට” උන්වහන්සේ මළවුන්ගෙන් නැගිට සිටි සේක (1 කොරින්ති 15:20). මරණයෙන්
  නැවත නැගිටි ස්වාමින්වහන්සේ ලෙස, උන්වහන්සේ සිය ජීවිතයේ ප්‍රේම කළ අය බැහැදුටු සේක. උන්වහන්සේ පුරාණ අමෙරිකාවේ
  උන්වහන්සේගේ “වෙනත් බැටළුවන්” (යොහාන් 10:16) අතර ද දේවසේවය කළ සේක. දිගුකාලීනව පොරොන්දු වූ “කාලයේ පූර්ණත්වය”
  (එපීස 1:10) ආරම්භ කරමින්, නූතන ලෝකයේදී, උන්වහන්සේ සහ උන්වහන්සේගේ පියාණන්වහන්සේ ජෝසෆ් ස්මිත් යන පිරිමි
  ළමයාට ප්‍රකාශ වූ සේක.
- 'ජීවමාන ක්‍රිස්තුස්වභන්සේ ගැන ඡෝසෆ් ස්මිත් අනාගතවක්තෘවරයා මෙසේ ලීවේය: “උන්වහන්සේගේ දෑස් ගින්දර දළු මෙන්
  විය; උන්වහන්සේගේ හිසෙහි කොන්ඩය පවිත්‍ර හිම මෙන් සුදුය; උන්වහන්සේගේ මුහුණුවර සූර්යයාගේ දීප්තියට වඩා බැබලිණ;
  තවද උන්වහන්සේගේ, එනම් යෙහෝවාවහන්සේගේ වුවත් හඬ මහත් වූ ජලයන් ගලායන ශබ්දය මෙන් විය, එය මෙසේ පැවසීය:'
- “මම පළමුවෙනියාද අන්තිමයාද වන්නෙමි; ජීවත් වන ඒ තැනැත්තා මම වෙමි, මරණයට පත්කෙරුණු ලැබූ ඒ තැනැත්තා මම වෙමි;
  මම පියාණන්වහන්සේ සමඟ නුඹලාගේ මැදහත්කරුවාණන් වෙමි” (ද.ස.ගි. 110:3–4).
- 'උන්වහන්සේ ගැන අනාගතවක්තෘවරයා මෙසේද ප්‍රකාශ කළේය: “තවද දැන්, උන්වහන්සේ ගැන දෙනු ලැබූ බොහෝ සාක්ෂි වලින්
  පසු, සියල්ලේම අවසානයට, අප උන්වහන්සේ ගැන දෙන සාක්ෂිය මෙය වන්නේය: එනම් උන්වහන්සේ ජීවත් වන සේක!'
- “මක්නිසාද දෙවියන්හන්සේගේ දකුණුපස, අපි උන්වහන්සේව දුටුවෙමු; තවද උන්වහන්සේ පියාණන්වහන්සේගේ ඒකජාතක පුත්‍රයාණන්
  බව සාක්ෂි දරන හඬ අපි ඇසුවෙමු—
- “එනම් උන්වහන්සේ මගින්, තවද උන්වහන්සේ තුළින්, තවද උන්වහන්සේගෙන්, ලෝකයන් මැවීය තවද මවා ඇත්තේය, තවද එහි
  වූ පදිංචිකරුවන් දෙවියන්වහන්සේ වෙතට ජාතක වූ පුත්‍රයන් සහ දූවරුන් වන්නෝය” (ද.ස.ගි. 76:22–24).
- අපි මෙම ඒකාන්ත වචන වලින් ප්‍රකාශ කරන්නේ, උන්වහන්සේගේ පූජකවරය සහ උන්වහන්සේගේ සභාව මෙම පොළොව මත නැවත පිහිටුවා
  ඇති බවය—“ප්‍රේරිවරුන්ගේත්, අනාගතවක්තෘවරුන්ගේත් අත්තිවාරම පිට පිහිටුවා, යේසුස් ක්‍රිස්තුස්වහන්සේම එහි
  කොණේ ප්‍රධාන ගලව සිටින බවය” (එපීස 2:20).
- උන්වහන්සේ යම් දිනෙක නැවතත් පොළොවට පැමිණෙන බවට අපි සාක්ෂි දරන්නෙමු. “එවිට ස්වාමින්වහන්සේගේ තේජස ප්‍රකාශ
  වන්නේය, සියලු මනුෂ්‍යයෝ එක්ව එය දකින්නෝය” (යෙසායා 40:5). උන්වහන්සේ රජුන්ගේ රජු ලෙස පාලනය කරමින්, ස්වාමින්ගේ
  ස්වාමින් ලෙස රජ කරන සේක, තවද උන්වහන්සේ ඉදිරියේ නමස්කාර කිරීම උදෙසා සෑම දණක්ම නැමී, සෑම දිවක්ම කතා කරන්නේය.
  අපි සෑම කෙනෙක්ම අපගේ ක්‍රියා සහ අපගේ හදවත්වල ආශාවන් අනුව උන්වහන්සේගෙන් විනිශ්චය වීම සඳහා නැගී සිටිනු
  ලබන්නේය.
- උන්වහන්සේ විසින් නියම අධිකාරිත්වයෙන් යුතුව නියම කළ ප්‍රේරිතවරුන් ලෙස අපි මෙසේ සාක්ෂි දරන්නෙමු—එනම් යේසුස්වහන්සේ
  යනු ජීවමාන ක්‍රිස්තුස්වහන්සේය, දෙවියන්වහන්සේගේ අමරණීය පුත්‍රයාණෝය. උන්වහන්සේ ශ්‍රේෂ්ඨ එම්මානුවෙල් රජු
  වන අතර, උන්වහන්සේ අද දින උන්වහන්සේගේ පියාණන්ගේ දකුණූ පාර්ශවයේ නැගී සිටින සේක. ආලෝකය ද, ජීවනය ද, ලෝකයාගේ
  බලාපොරොත්තුව ද උන්වහන්සේ වන සේක. මෙම ජීවිතයේ සතුට උදෙසා සහ මතු පැමිණෙන ලෝකයේ සදාකාලික ජීවනය උදෙසා මගපෙන්වන
  මාවත උන්වහන්සේගේ මාර්ගය වන්නේය. දෙවියන්වහන්සේගේ අසමසම දීමනාවක් වූ උන්වහන්සේගේ දිව්‍ය පුත්‍රයාණන් වෙනුවෙන්
  දෙවියන්වහන්සේට ස්තූති වේවා!
