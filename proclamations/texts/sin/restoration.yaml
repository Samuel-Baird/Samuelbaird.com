title: යේසුස් ක්‍රිස්තුස්වහන්සේගේ ශුභාරංචියේ පූර්ණත්වය නැවත පිහිටුවීම
subtitle: ලෝකය සඳහා ද්විශතවාර්ෂික ප්‍රකාශය
author: යේසුස් ක්‍රිස්තුස්වහන්සේගේ පසුදවස්වල ශුද්ධවන්තයන්ගෙන් යුත් සභාවේ පළමු සභාපතිත්වය සහ ප්‍රේරිතවරුන්
  දොළොස්දෙනාගේ මන්ත්‍රණ සභාව
note: 2020 අප්‍රියෙල් 5 වන දින, යූටා හි සෝල්ට් ලේක් නගරයේ පැවති, 190 වෙනි වාර්ෂික ප්‍රධාන සම්මන්ත්‍රණයේදී,
  මෙම ප්‍රකාශය සභාපති රසල් එම්. නෙල්සන් විසින් ඔහුගේ පණිවිඩයේ කොටසක් ලෙස කියවන ලදි.
paragraphs:
- ලෝකයේ සෑම ජාතියකම සිටින උන්වහන්සේගේ දරුවන්ට දෙවියන්වහන්සේ ප්‍රේම කරන බව අපි ඒකාන්තයෙන්ම ප්‍රකාශ කරන්නෙමු.
  පියාණන් වන දෙවියන්වහන්සේ විසින් තම ආදරණීය පුත්‍රයාණන් වන යේසුස් ක්‍රිස්තුස්වහන්සේගේ දිව්‍යමය උපත, අසමසම
  ජීවිතය සහ අපිරිමිත වන්දිගෙවීම අපට ලබා දී ඇත. පියාණන්වහන්සේගේ බලයෙන්, යේසුස්වහන්සේ මරණයෙන් නැවත නැගිට,
  මරණයට එරෙහිව ජයග්‍රහණය ලබාගත් සේක. උන්වහන්සේ අපගේ ගැලවුම්කරුවාණන් ය, අපගේ ආදර්ශකයාණන් ය, එමෙන්ම අපගේ
  මිදුම්කරුවාණන් ය.
- අවුරුදු දෙසීයකට පෙර, 1820 දී ලස්සන වසන්ත උදෑසනක, තරුණ ජෝසෆ් ස්මිත්, කුමන සභාවට සම්බන්ධ විය යුතු දැයි
  දැනගැනීමට සොයමින්, අමෙරිකාවේ නිව්යෝර්ක් හි උතුරින් පිහිටි ඔහුගේ නිවස අසල වනයට යාච්ඤා කිරීමට ගියේය. ඔහුට
  ඔහුගේ ප්‍රාණයේ ගැලවීම පිළිබඳව ප්‍රශ්න තිබූ අතර දෙවියන්වහන්සේ ඔහුට මගපෙන්වනු ඇතැයි විශ්වාස කළේය.
- ඔහුගේ යාච්ඤාවට පිළිතුරු වශයෙන්, පියාණන් වන දෙවියන්වහන්සේ සහ උන්වහන්සේගේ පුත් යේසුස් ක්‍රිස්තුස්වහන්සේ
  ජෝසෆ්ට පෙනී සිටිමින් බයිබලයේ පුරෝකථනය කර ඇති පරිදි “සියල්ල නැවත පිහිටුවීම” (ක්‍රියා 3:21 සංසන්දනය කරන්න)
  ආරම්භ කළ බව, නිහතමානී බවින් යුතුව අපි ප්‍රකාශ කරන්නෙමු. මෙම දර්ශනයේදී, මුල් ප්‍රේරිතවරුන්ගේ මරණයෙන්
  පසු, ක්‍රිස්තුස්වහන්සේගේ අලුත් ගිවිසුමේ සභාව පොළොවෙන් නැති වූ බව ඔහු දැනගත්තේය. එහි නැවත පැමිණීමට ජෝසෆ්
  උපකාරී වනු ඇත.
- පියාණන්වහන්සේගේ සහ පුත්‍රයාණන්වහන්සේගේ මගපෙන්වීම යටතේ, ස්වර්ගීය පණිවිඩකරුවන් ජෝසෆ්ට උපදෙස් දීමට හා යේසුස්
  ක්‍රිස්තුස්වහන්සේගේ සභාව නැවත පිහිටුවීමට පැමිණි බව අපි සහතික කරන්නෙමු. මරණයෙන් නැවත නැගිටුවනු ලැබූ යොහාන්
  බව්තීස්ත විසින් පව් කමාව සඳහා ගිල්වීමෙන් බව්තීස්ම වීමේ බලය නැවත පිහිටුවීය. මුල් ප්‍රේරිතවරුන් දොළොස්දෙනාගෙන්
  තිදෙනෙක් වන—පේත්‍රැස්, යාකොබ් සහ යොහාන්—ප්‍රේරිත ධූරය සහ පූජකවර අධිකාරිත්වයේ යතුරු නැවත පිහිටෙව්වෝය.
  මරණය ඉක්මවා යන සදාකාලික සම්බන්ධතාවයන් තුළ සදාකාලිකව පවුල් සමග එක්වීමේ බලය නැවත පිහිට වූ එලයිජා ඇතුලු
  තවත් අයද එලෙසම පැමිණියහ.
- මොර්මොන්ගේ පොත—යේසුස් ක්‍රිස්තුස්වහන්සේගේ තවත් ගිවිසුමකි; යන පුරාණ වාර්තාවක් පරිවර්තනය කිරීම සඳහා ජෝසෆ්
  ස්මිත්ට දෙවියන්වහන්සේගේ දීමනාව හා බලය ලබාදුන් බව අපි තවදුරටත් සාක්ෂි දරන්නෙමු. මෙම පූජනීය පිටපතේ පිටු
  අතර යේසුස් ක්‍රිස්තුස්වහන්සේගේ මරණයෙන් නැවත නැගිටීමෙන් පසුව බටහිර අර්ධගෝලයේ මිනිසුන් අතර උන්වහන්සේගේ
  පුද්ගලික දේවසේවය පිළිබඳ විස්තරයක් ඇතුළත් වේ. එය ජීවිතයේ අරමුණ උගන්වන අතර, එම අරමුණ සඳහා කේන්ද්‍රීය වන
  ක්‍රිස්තුස්වහන්සේගේ දහම ද පැහැදිලි කරයි. සියලුම මනුෂ්‍යයන් ස්වර්ගයේ සිටින ප්‍රේමණීය පියෙකුගේ පුතුන්
  හා දියණියන් බවත්, අපගේ ජීවිත සඳහා දිව්‍යමය සැලැස්මක් උන්වහන්සේ සතුව ඇති බවත්, උන්වහන්සේගේ පුත් යේසුස්
  ක්‍රිස්තුස්වහන්සේ, පැරණි දින වල මෙන්ම අදටත් කතා කරන බවත්, බයිබලයට අනුබද්ධ ශුද්ධලියවිල්ලක් ලෙස මොර්මොන්ගේ
  පොත සාක්ෂි දරයි.
- 1830 අප්‍රියෙල් 6 වන දින සංවිධානය කරන ලද යේසුස් ක්‍රිස්තුස්වහන්සේගේ පසුදවස්වල ශුද්ධවන්තයන්ගෙන් යුත්
  සභාව, නැවත පිහිටුවා ඇති ක්‍රිස්තුස්වහන්සේගේ අලුත් ගිවිසුමේ සභාව බව අපි ප්‍රකාශ කරන්නෙමු. මෙම සභාව එහි
  ප්‍රධාන මුල් ගල වන, යේසුස් ක්‍රිස්තුස්වහන්සේගේ පරිපූර්ණ ජීවිතය, හා උන්වහන්සේගේ අපිරිමිත වන්දිගෙවීම සහ
  සත්‍යයෙන්ම මරණයෙන් නැවත නැගිටීම තුළ නැංගුරම් ලා ඇත. යේසුස් ක්‍රිස්තුස්වහන්සේ නැවත වරක් ප්‍රේරිතවරුන්ව
  කැඳවා ඇති අතර ඔවුන්ට පූජකත්ව අධිකාරිත්වය ලබා දී ඇත. උන්වහන්සේ වෙතට හා උන්වහන්සේගේ සභාව වෙතට පැමිණෙන
  ලෙසත්, ශුද්ධාත්මයාණන්වහන්සේව සහ ගැලවීමේ නියෝගයන් පිළිගන්නා ලෙසත්, එමෙන්ම නොනැසී පවත්නා ප්‍රීතිය ලබාගන්නා
  ලෙසත්, උන්වහන්සේ අප සැමට ආරාධනා කරන සේක.
- පියාණන් වන දෙවියන්වහන්සේ සහ උන්වහන්සේගේ ආදරණීය පුත්, යේසුස් ක්‍රිස්තුස්වහන්සේ විසින් මෙම නැවත පිහිටුවීම
  ආරම්භ කර දැන් අවුරුදු දෙසීයක් ගත වී ඇත. ලොව පුරා මිලියන ගණනක් මෙම අනාවැකිමය සිදුවීම් පිළිබඳ දැනුමක්
  වැළඳගෙන ඇත.
- පොරොන්දු වූ නැවත පිහිටුවීම අඛණ්ඩ එළිදරව් තුළින් ඉදිරියට යන බව අපි සතුටින් ප්‍රකාශ කරන්නෙමු. දෙවියන්වහන්සේ
  “ක්‍රිස්තුස්වහන්සේ තුළ සියල්ල ඒකරාශී කරන” (එපීස 1:9–10) නිසාවෙන්, පොළොව නැවත කිසිදිනෙක පෙර හා සමාන නොවනු
  ඇත.
- ස්වර්ගයන් විවෘතව ඇති බව—අප දන්නා පරිදිම—දැනගැනීමට, ගෞරවාන්විතව හා කෘතඥතාවෙන් යුතුව, උන්වහන්සේගේ ප්‍රේරිතවරුන්
  වශයෙන් අපි සියල්ලන්ටම ආරාධනා කරන්නෙමු. දෙවියන්වහන්සේ තම ආදරණීය පුතුන් හා දූවරුන් උදෙසා උන්වහන්සේගේ කැමැත්ත
  ප්‍රකාශ කරන බව අපි සහතික කරන්නෙමු. නැවත පිහිටුවීම පිළිබඳ පණිවිඩය යාච්ඤාපූර්වකව අධ්‍යයනය කර ඇදහිල්ලෙන්
  ක්‍රියා කරන අයට එහි දේවත්වය පිළිබඳ සහ අපගේ ස්වාමින්වහන්සේ හා ගැලවුම්කරුවාණන් වන, යේසුස් ක්‍රිස්තුස්වහන්සේගේ
  පොරොන්දු වූ දෙවන පැමිණීම සඳහා ලෝකය සූදානම් කිරීමේ අරමුණ පිළිබඳ තමන්ගේම සාක්ෂියක් ලබාගැනීමට ආශිර්වාද
  ලැබෙනු ඇති බවට අපි සාක්ෂි දරන්නෙමු.
