title: കുടുംബം
subtitle: ലോകത്തിനു വേണ്ടിയുള്ള ഒരു പ്രഖ്യാപനം
author: അന്ത്യകാലത്തെ വിശുദ്ധന്മാരുടെ യേശുക്രിസ്തുവിന്റെ സഭയുടെ ആദ്യത്തെ അദ്ധ്യക്ഷതയും, പന്ത്രണ്ടു അപ്പൊസ്തലന്മാരുടെ
  കൌൺസിലും
note: ഈ പ്രഖ്യാപനം 23 സെപ്തംബർ 1995, സാൾറ്റ് ലേയ്ക്ക് സിറ്റി, യൂട്ടായിൽ പ്രസിഡൻറ് ഗോർഡൻ ബി. ഹിൻക്ലി അവന്റെ
  സന്ദേശത്തിന്റെ ഭാഗമായി ജെനറെൽ റിലീഫ് സൊസൈറ്റിയുടെ മീറ്റിങ്ങിൽ വായിച്ചിരുന്നു.
paragraphs:
- ഒരു പുരുഷനും സ്ത്രീയും തമ്മിലുള്ള വിവാഹം ദൈവത്താൽ നിയമിക്കപ്പെട്ടതാണെന്നും, അവന്റെ മക്കളുടെ നിത്യവിധിയ്ക്കുവേണ്ടിയുള്ള
  സൃഷ്ടികർത്താവിന്റെ പദ്ധതിയുടെ മുഖ്യഭാഗം കുടുംബമാണെന്നും, ആദ്യത്തെ അദ്ധ്യക്ഷതയും, പന്ത്രണ്ടു അപ്പൊസ്തലന്മാരുടെ
  കൌൺസിലുമായ ഞങ്ങൾ സത്യനിഷ്ടതയോടെ പ്രഖ്യാപിക്കുന്നു.
- എല്ലാ മനുഷ്യരും — ആണും പെണ്ണും — ദൈവത്തിന്റെ സ്വരൂപത്തിൽ സൃഷ്ടിക്കപ്പെട്ടിരിക്കുന്നു. ഓരോരുത്തനും സ്വർഗ്ഗീയ
  മാതാപിതാക്കളുടെ ഒരു പ്രിയപ്പെട്ട ആത്മീയ പുത്രനോ പുത്രിയോ ആകുന്നു, അതുപോലെ ഓരോരുത്തനും, ഒരു ദൈവീകമായ
  സ്വഭാവവും, ഒരു വിധിയുമുണ്ടു. ലിംഗഭേദം ഒരു വ്യക്തിയുടെ മർത്യതയ്ക്കു മുൻപുള്ളതും, മർത്യതയുടെയും, നിത്യതയുടെയും
  തിരിച്ചറിയലിന്റെയും ഉദ്ദേശൃത്തിന്റെയും അത്യന്താപേക്ഷിതമായ ലക്ഷണമാകുന്നു.
- മർത്യതയ്ക്കു മുൻപുള്ള ജീവിതത്തിൽ, അവന്റെ ആത്മീയ പുത്രന്മാരും, പുത്രിമാരും, ദൈവത്തെ അവരുടെ നിത്യപിതാവായി
  അറിയുകയും, ആരാധിക്കുകയും, അവർ അവന്റെ പദ്ധതി അംഗീകരിക്കുകയും, അതിലൂടെ, അവന്റെ മക്കൾക്കു ഒരു ശാരീരികമായ
  ശരീരം ലഭിക്കുവാനും, ഭൌമികമായ അനുഭവം ലഭിക്കുവാനും, അങ്ങനെ അവർക്കു പരിപൂർണ്ണതയിലേയ്ക്കു അഭിവൃദ്ധിപ്പെടുവാനും,
  നിത്യജീവന്റെ അവകാശികളാകുവാനുള്ള അവരുടെ നിത്യവിധി അത്യന്തികമായി സമ്പാദിക്കുവാനും അവർക്കു കഴിയും. ദൈവീക
  പദ്ധതിയുടെ സന്തോഷം കുടുംബബന്ധങ്ങൾ മരണശേഷവും തുടർന്നുകൊണ്ടിരിക്കുവാൻ സാധ്യമാക്കിത്തീർക്കുന്നു. പരിശുദ്ധ
  ദേവാലയങ്ങളിൽ ലഭ്യമാകുന്ന വിശുദ്ധമായ ചട്ടങ്ങളും നിയമങ്ങളും വ്യക്തികൾക്കു ദൈവസാന്നിദ്ധ്യത്തിലേയ്ക്കു തിരിച്ചുപോകുവാനും
  കുടുംബങ്ങൾ നിത്യമായി ഒന്നിച്ചു ചേരുവാനും സാധ്യമാക്കുന്നു.
- ഭാര്യയും ഭർത്താവുമായി മാതാപിതാക്കൾ ആകുവാനുള്ള പ്രാപ്തി ആദാമിനും ഹവ്വായ്ക്കും ദൈവം നൽകിയ ആദ്യത്തെ കല്പനയോടു
  ബന്ധപ്പെട്ടിരിക്കുന്നു. പെരുകുവാനും ഭൂമിയെ നിറയ്ക്കുവാനുമുള്ള അവന്റെ മക്കളോടുള്ള ദൈവത്തിന്റെ കല്പന പ്രാബല്യത്തിലിരിക്കുന്നുവെന്നു
  ഞങ്ങൾ പ്രഖ്യാപിക്കുന്നു. ന്യായപ്രകാരം വിവാഹം കഴിച്ച ഭാര്യയും ഭർത്താവുമായ ഒരു പുരുഷന്റെയും സ്ത്രീയുടെയും
  ഇടയിൽ മാത്രമേ കുട്ടികളെ ജനിപ്പിക്കുവാനുള്ള പവിത്രമായ അധികാരം ഉപയോഗിക്കുവാൻ പാടുള്ളുവെന്നു ദൈവം കൽപ്പിച്ചിരിക്കുന്നുവെന്നു
  ഞങ്ങൾ വീണ്ടും പ്രഖ്യാപിക്കുന്നു.
- മർത്യതയുടെ ജീവിതം സൃഷ്ടിച്ചിരിക്കുന്ന മാർഗ്ഗം ദൈവീകമായി നിയമിക്കപ്പെട്ടതാണെന്നു ഞങ്ങൾ പ്രഖ്യാപിക്കുന്നു.
  ദൈവത്തിന്റെ നിത്യമായ പദ്ധതിയിൽ ജീവിതത്തിന്റെ പരിശുദ്ധതയും അതിന്റെ പ്രാധാന്യതയുമുണ്ടെന്നു ഞങ്ങൾ ഉറപ്പിച്ചു
  പറയുന്നു.
- ഓരോരുത്തരെയും, അവരുടെ മക്കളെയും, അന്യോന്യം സ്നേഹിക്കുവാനും, പരിപാലിക്കുവാനും, ഭർത്താവിനും ഭാര്യയ്ക്കും
  ഗൌരവമായ ഉത്തരവാദിത്വമുണ്ടു. “മക്കൾ, യഹോവ നൽകുന്ന അവകാശമാകുന്നു” (സങ്കീർത്തനങ്ങൾ 127:3). മാതാപിതാക്കൾക്കു
  അവരുടെ മക്കളെ സ്നേഹത്തിലും നീതിയിലും വളർത്തുവാനുള്ള വിശുദ്ധമായ ഉത്തരവാദിത്വമുണ്ടു. അവരുടെ ശാരീരികവും
  ആത്മീകവുമായ ആവശ്യങ്ങളെ നൽകുവാനും, സ്നേഹിക്കുവാനും, ഓരോരുത്തർക്കും സേവ ചെയ്യുവാനും, ദൈവത്തിന്റെ കൽപനകളെ
  നിരീക്ഷിക്കുവാനും, അവർ താമസ്സിക്കുന്നിടത്തെ നിയമങ്ങൾ അനുസരിച്ചുള്ള പൌരന്മാരായിരിക്കുവാനും, അവർ അവരെ
  പഠിപ്പിക്കണം. ഭർത്താക്കന്മാരും ഭാര്യമാരും — മാതാപിതാക്കന്മാരും — ഈ കടമ നിറവേറ്റുന്നതിൽ ദൈവത്തിന്റെ മുമ്പിൽ
  ഉത്തരവാദികളായിരിക്കും.
- കുടുംബം ദൈവത്താൽ നിയമിക്കപ്പെട്ടതാകുന്നു. പുരുഷനും സ്ത്രീയും തമ്മിലുള്ള വിവാഹം അവന്റെ നിത്യമായ പദ്ധതിയിൽ
  അടിസ്ഥാനപരമായതാണു. ഒരു പിതാവും മാതാവും വിവാഹ കൽപനകളെ പൂർണ്ണമായ വിശ്വസ്തയോടെ അംഗീകരിക്കുകയും, അനുസരിക്കുകയും,
  കുട്ടികളെ വളർത്തുകയും ചെയ്യുന്ന വിവാഹബന്ധത്തിൽ കുട്ടികൾക്കു ജനിക്കുവാനുള്ള നിയമപരമായ അവകാശമുണ്ടു. കർത്താവായ
  യേശുക്രിസ്തുവിന്റെ ഉപദേശങ്ങൾക്കു അധിഷ്ഠിതമായിരിക്കുന്ന കുടുംബ ജീവിതത്തിൽ സന്തോഷം കൈവരിക്കുവാൻ സാധ്യതയുണ്ടു.
  വിജയകരമായ വിവാഹങ്ങളും, കുടുംബങ്ങളും, വിശ്വാസത്തിന്റെ തത്വങ്ങൾ, പ്രാർത്ഥന, മാനസാന്തരം, ക്ഷമ, ആദരവ്, സ്നേഹം,
  കാരുണ്യം, അദ്ധ്വാനം, സുഖസൌകര്യങ്ങളായ വിനോദപരിപാടികളുടെയും അടിസ്ഥാനത്തിൽ സജ്ജീകരിക്കപ്പെടുന്നു. ദൈവീക
  പദ്ധതിയിൽ, പിതാക്കൾക്കു സ്നേഹത്തോടും, നീതിയോടും അവരുടെ കുടുംബങ്ങളുടെ മേൽനോട്ടം വഹിക്കുവാനും, ജീവിതത്തിന്റെ
  ആവശ്യകതകൾ നൽകുവാനും, കുടുംബത്തെ പോഷിക്കുവാനുമുള്ള ഉത്തരവാദിത്യമുണ്ടു. അമ്മമാർക്കു അവരുടെ കുട്ടികളെ പോഷിക്കുവാനുമുള്ള
  പ്രാഥമികമായ ഉത്തരവാദിത്വമുണ്ടു. ഈ പവിത്രമായ ഉത്തരവാദിത്വങ്ങളിൽ മാതാപിതാക്കൾ തുല്യ പങ്കാളികളായി പരസ്പരം
  സഹായിക്കുവാൻ ചുമതലയുള്ളവരാണു. വികലത, മരണം അല്ലെങ്കിൽ വേറെ സാഹചര്യങ്ങളിൽ പരിതഃസ്ഥികളോടു പൂർണ്ണമായും ഇണങ്ങിച്ചേരൽ
  ആവശ്യമായി വന്നേക്കാം. കുടുംബത്തിലെ ബന്ധുക്കൾ ആവശ്യമുള്ളപ്പോൾ പിന്തുണ നൽകണം.
- ചാരിത്രശദ്ധിയുടെ നിയമങ്ങൾ അതിലംഘിക്കുന്ന വ്യക്തികൾ, ജീവിതപങ്കാളികളെ അല്ലെങ്കിൽ സന്തതികളോടു തെറ്റായി
  പെരുമാറുന്നവർ, ദൈവത്തിന്റെ മുമ്പിൽ ഒരു ദിവസം ഉത്തരവാദികളായി നിൽക്കേണ്ടിവരുമെന്നു ഞങ്ങൾ മുന്നറിയിപ്പു
  നൽകുന്നു. കുടുംബത്തിന്റെ ശിഥിലീകരണം, പുരാതനവും ആധുനികവുമായ പ്രവാചകന്മാരാൽ മുൻകൂട്ടി പറയപ്പെട്ട ദുരന്തങ്ങൾ,
  വ്യക്തികളുടെയും സമുദായങ്ങളുടെയും മേൽവരുമെന്നു ഞങ്ങൾ വീണ്ടും മുന്നറിയിപ്പു നൽകുന്നു.
- കുടുംബത്തെ സമുദായത്തിന്റെ പ്രധാന ഘടകമായി നിലനിർത്തുവാനും, ശക്തിപ്പെടുത്തുവാനും, രൂപകൽപന ചെയ്തിട്ടുള്ള
  അപ്പറഞ്ഞ നടപടികളെ അഭിവൃദ്ധിപ്പെടുത്തുവാനുമായി, ഉത്തരവാദിത്വമുള്ള പൌരന്മാരെയും, ഉദ്യോഗസ്ഥന്മാരെയും എല്ലായിടത്തും
  ഞങ്ങൾ വിളിക്കുന്നു.
