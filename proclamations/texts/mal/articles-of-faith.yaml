title: യുടെ വിശ്വാസത്തിന്റെ പ്രസ്താവനകൾ
subtitle: അന്ത്യകാലത്തെ വിശുദ്ധന്മാരുടെ യേശുക്രിസ്തുവിന്റെ സഭ
author: ''
verses:
- n: 1
  text: നിത്യ പിതാവായ ദൈവത്തിലും, അവന്റെ പുത്രനായ യേശുക്രിസ്തുവിലും, പരിശുദ്ധാത്മാവിലും നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 2
  text: മനുഷ്യർ അവരുടെ സ്വന്തം പാപങ്ങൾക്കു വേണ്ടി ശിക്ഷിക്കപ്പെടുമെന്നും ആദാമിന്റെ ലംഘനത്തിനു വേണ്ടിയല്ലെന്നും
    നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 3
  text: ക്രിസ്തുവിന്റെ പ്രായശ്ചിത്തത്തിൽ കൂടി, സുവിശേഷത്തിലെ നിയമങ്ങളും, ചട്ടങ്ങളും അനുസരിക്കുന്നതിൽ കൂടി
    എല്ലാ മനുഷ്യരാശികളും രക്ഷിക്കപ്പെടുമെന്നു നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 4
  text: 'സുവിശേഷത്തിന്റെ ആദ്യത്തെ സിദ്ധാന്തങ്ങളും, ചട്ടങ്ങളും: ഒന്നാമതായി, കർത്താവായ യേശുക്രിസ്തുവിലുള്ള
    വിശ്വാസം; രണ്ടാമതായി, പശ്ചാത്താപം; മൂന്നാമതായി, പാപപരിഹാരത്തിനു വേണ്ടി വെള്ളത്തിൽ മുക്കുന്ന ജ്ഞാനസ്നാനം;
    നാലാമതായി, പരിശുദ്ധാത്മാവു എന്ന ദാനത്തിനു വേണ്ടിയുള്ള കൈവെപ്പുമാണെന്നും നമ്മൾ വിശ്വസിക്കുന്നു.'
- n: 5
  text: പ്രവചനത്തിൽ കൂടിയും, സുവിശേഷം പ്രസംഗിക്കുവാനും, അതിന്റെ ചട്ടങ്ങൾ നിർവ്വഹിക്കുവാൻ അധികാരത്തിലുള്ളവരുടെ
    കൈവെപ്പിൽ കൂടിയും, ഒരു മനുഷ്യൻ ദൈവത്തിനാൽ വിളിക്കപ്പെടണമെന്നും നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 6
  text: അപ്പൊസ്തലന്മാരും, പ്രവാചകന്മാരും, ഇടയന്മാരും, ഉപദേഷ്ടാക്കളും, സുവിശേഷകന്മാരും മറ്റും ഉണ്ടായിരുന്ന
    ആദിമ സഭയിൽ നിലനിന്നിരുന്ന അതേ സംസ്ഥാപനത്തിലും നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 7
  text: ഭാഷകളുടെ വരത്തിലും, പ്രവചനത്തിലും, വെളിപ്പാടിലും, ദർശനങ്ങളിലും, രോഗശാന്തിയിലും, ഭാഷകളുടെ വ്യാഖ്യാനത്തിലും,
    മറ്റും നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 8
  text: കഴിയുന്നിടത്തോളം അതു ശരിയായി തർജ്ജിമ ചെയ്തിട്ടുണ്ടെങ്കിൽ ബൈബിൾ ദൈവത്തിന്റെ വചനമായിരിക്കുന്നു എന്നു
    നമ്മൾ വിശ്വസിക്കുന്നു; മോർമോൺ ഗ്രന്ഥവും ദൈവത്തിന്റെ വചനമായിരിക്കുന്നു എന്നും നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 9
  text: ദൈവം വെളിപ്പെടുത്തിയിരിക്കുന്ന എല്ലാത്തിലും, അവൻ ഇപ്പോൾ വെളിപ്പെടുത്തിക്കൊണ്ടിരിക്കുന്ന എല്ലാത്തിലും,
    നമ്മൾ വിശ്വസിക്കുന്നു; ദൈവരാജ്യത്തെ കുറിച്ചു അനേകം വലുതും, പ്രധാനപ്പെട്ടതുമായ കാര്യങ്ങൾ അവൻ ഇനിയും
    വെളിപ്പെടുത്തുമെന്നും നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 10
  text: യിസ്രായേലിന്റെ ശരിയായ ഒരുമിച്ചുകൂടലിലും, പത്തു ഗോത്രങ്ങളുടെ പുനരുദ്ധാരണത്തിലും; സീയോൻ (പുതിയ യെരൂശലേം)
    അമേരിക്കൻ ഭൂഖണ്ഡത്തിൽ നിർമ്മിക്കപ്പെടുമെന്നും; ക്രിസ്തു തന്നെത്താൻ ഭൂമിയിൽ ഭരിക്കുമെന്നും; ഭൂമി പുതുക്കപ്പെടുകയും,
    അതിന്റെ പറുദീസയുടെ മഹത്വം അതിനു ലഭിക്കുമെന്നും നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 11
  text: നമ്മുടെ സ്വന്തം മനഃസ്സാക്ഷി പറയുന്നതു അനുസരിച്ചു സർവ്വശക്തനായ ദൈവത്തെ ആരാധിക്കുവാനുള്ള അതേ പ്രത്യേകാവകാശം,
    എല്ലാ മനുഷ്യർക്കും അവർ എങ്ങിനെ, എവിടെ, അല്ലെങ്കിൽ എന്തെങ്കിലും ആരാധിക്കുവാനുള്ള അതേ പ്രത്യേകാവകാശം
    അവർക്കു അനുവദിക്കുന്നു എന്നും നമ്മൾ പ്രഖ്യാപിക്കുന്നു.
- n: 12
  text: രാജാക്കന്മാർക്കും, രാഷ്ടപതിമാർക്കും, ഭരണകർത്താക്കൾക്കും, മജിസ്രേട്ടുമാർക്കും വിധേയരായി അവരെ അനുസരിക്കുന്നതിലും,
    ബഹുമാനിക്കുന്നതിലും, നിയമത്തെ പിൻതാങ്ങുന്നതിലും നമ്മൾ വിശ്വസിക്കുന്നു.
- n: 13
  text: സത്യസന്ധരായിരിക്കുന്നതിലും, ആത്മാർത്ഥതയുള്ളവരായിരിക്കുന്നതിലും, നിർമ്മലമായതും, ഉദാരമനസ്കതയും,
    സദ്ഗുണമുള്ളവരായിരിക്കുന്നതിലും, എല്ലാ മനുഷ്യർക്കും നല്ലതു ചെയ്യുന്നതിലും, നമ്മൾ വിശ്വസിക്കുന്നു; യഥാർത്ഥമായി
    പൌലോസിന്റെ ശാന്തോപദേശം — നമ്മൾ പിന്തുടരുന്നു എന്നു നമുക്കു പറയാം, എല്ലാ കാര്യങ്ങളും നമ്മൾ വിശ്വസിക്കുന്നു,
    എല്ലാ കാര്യങ്ങളും നമ്മൾ പ്രത്യാശിക്കുന്നു, നമ്മൾ അനേകം കാര്യങ്ങൾ സഹിച്ചിരിക്കുന്നു, എല്ലാ കാര്യങ്ങളും
    സഹിക്കുവാൻ കഴിയുമെന്നു നമ്മൾ ആശിക്കുകയും ചെയ്യുന്നു. സദ്ഗുണമുള്ളതും, രമ്യമായതും, അല്ലെങ്കിൽ നല്ല വർത്തമാനമുള്ളതും,
    അല്ലെങ്കിൽ പ്രശംസാർഹവുമായ ഏതെങ്കിലും ഉണ്ടെങ്കിൽ നമ്മൾ ഈ കാര്യങ്ങളെ അന്വേഷിച്ചു പിൻതുടരുന്നു.
signature: ജോസഫ് സ്മിത്ത്.
