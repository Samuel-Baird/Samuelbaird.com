title: Misimboti yeChitendero
subtitle: che Chechi yaJesu Kristu yaVatendi vaMazuva Ekupedzisira
author: ''
verses:
- n: 1
  text: Tinotenda muna Mwari, Baba Vokusingapere, neMwanakomana Wavo, Jesu Kristu, nemuneMweya Mutsvene.
- n: 2
  text: Tinotenda kuti vanhu vacharangirwa zvitadzo zvavo pachavo, kwete pamusana pekutadza kwaAdama.
- n: 3
  text: Tinotenda kuti kuburikidza neRudzikinuro rwaKristu, vose vanhu vangaponeswe, nokuteerera kumitemo
    nezvisungo zveVhangeri.
- n: 4
  text: 'Tinotenda kuti misimboti yekutanga nezvisungo zveVhangeri ndeiyi: poshi, Kutenda muna Ishe Jesu
    Kristu; piri, Kutendeuka; tatu, Rubhabhatidzo rwekunyikwa kuitira kuregererwa zvitadzo; china, Kugadzwa
    kwemaoko kuitira kupihwa chipo cheMweya Mutsvene.'
- n: 5
  text: Tinotenda kuti munhu akafanira kudaidzwa naMwari, nehuporofita, nekugadzwa maoko neavo vari mumvumo
    yekuparidza Vhangeri nokushanda muzvisungo zvacho.
- n: 6
  text: Tinotenda hurongwa humwechetehwo hwakanga hwuripo muChechi yeKutanga, sezvizvi, vaapositori, maporofita,
    vapirisita, vadzidzisi, vaparidzi, uye zvichingodaro.
- n: 7
  text: Tinotenda muchipo chendimi, huporofita, zvakazarurwa, zviratidzo, kurapa, kududzira ndimi, uye
    zvichingodaro.
- n: 8
  text: Tinotenda Bhaibheri kuti shoko raMwari kana riri rakadudzirwa nemazvo; tinotendawo kuti Bhuku
    raMormoni izwi raMwari.
- n: 9
  text: Tinotenda zvose Mwari zvavakazarura, zvose zvaVarikuzarura iyezvino, uye tinotenda kuti Vachazarura
    zvizhinji zvikuru zvinokosha zviri maererano neUmambo hwaMwari.
- n: 10
  text: Tinotenda mukuunganidzwa chaiko kweIsraeri nomukudzorerwa pakare kweMarudzi Gumi; kuZioni (Jerusarema
    Idzva) ichavakwa munyika yeAmerica; kuti Kristu achatonga iye mbune pasi pano; uye, nokuti nyika ichaitwa
    itsva uye igogashira kubwinya kwayo kweparadiso.
- n: 11
  text: Tine kodzero yekunamata Samasimba Mwari maererano nezvatinonzwa mupfungwa dzedu, uye tinobvumira
    vose vanhu kodzero imwecheteo, regai vanamate netsika yavanoda, kwavanoda, kana chavanokwanisa.
- n: 12
  text: Tinotenda kuve pasi pemadzimambo, vatungamiri, vatongi, nevatongi vedzimhosva, mukuteerera, kukudza,
    nokutsigira murau.
- n: 13
  text: Tinotenda mukuve tinovimbika, tiri pachokwadi, takachena, tiri tinopa, takarurama, nomukuita zvakanaka
    kuvanhu vose; chokwadi, tingati tinotevedzera kuraira kwaPauro—Tinotenda zvinhu zvose, tinetariro
    pazvinhu zvose, takashingirira zvose zvinhu, uye tinovimba tichakwanisa kushingirira zvose zvinhu.
    Kana paine chakarurama, chiinehunhu, kana chinotaurwa zvakanaka kana chinorumbidzwa, tinozvitsvaka
    zvinhu izvozvo.
signature: Joseph Smith.
