title: Kristu Anorarama
subtitle: Uchapupu hweVaApositora
author: Chechi yaJesu Kristu yaVatendi vaMazuva Ekupedzisira
paragraphs:
- Apo patinorangarira nokupemberera kuzvarwa kwaJesu Kristu makore zviuru zviviri akapfuura ayo, tinopa
  uchapupu hwedu hwehuchokwadi hweupenyu hwake hwusina muenzaniso uye nesimba Rake risina mugumo rokuzvipira
  Kwake kukuru kwerudzikinuro. Hapana mumwe akambova neshanduro yakakura kudaro pamusoro paavo vose vakararama
  uye vachazorarama panyika.
- Aiva Jehova Mukuru weTestamente Yekare, Mesiasi weTestamente Itsva. Kuburikidza nerairo yaBaba Vake,
  Ndiye akava musiki wepanyika. “Zvinhu zvose zvakaitwa naye; kunze kwake hakuna-kuitwa kunyangwe chinhu
  chimwe chakaitwa.” (Johane 1:3). Kunyangwe zvazvo akanga asina zvivi, Akabhabhatidzwa kuti azadzikise
  ururami hwose. “Aipota nenyika achiita zvakanaka” (Mabasa aVaApositora 10:38), asi zvakadaro akavengwa
  nokuda kwazvo. Vhangeri rake raiva shoko rerunyararo netsitsi. Akakumbirisa vose kuti vatevere muenzaniso
  Wake. Akafamba munzira dzePalestine, achiporesa vanorwara, achiita kuti mapofu aone, uye achimutsa vakafa.
  Akadzidzisa zvokwadi zvokusingaperi, huchokwadi hwekurarama kwedu tisati tazvarwa panyika, nechinangwa
  choupenyu hwedu panyika, uye kwaniso yokukura yevanakomana nevanasikana vaMwari muupenyu huchauya.
- Akamisa sakaramende sechiyeuchidzo chekuzvipira Kwake kukuru kwerudzikinuro. Akasungwa uye akatongwa
  pamhosva dzamanyepo, akawanikwa ainemhosva kuitira kufadza mhomho, uye akatongwerwa kufa pamuchinjikwa
  weKarivhari. Akapa upenyu Hwake kudzikinura zvivi zvavanhu vose. Chake chaiva chipo chikuru chakapuwirwa
  vanhu vose vaizorarama panyika.
- Tinopupura noruremekedzo rwakadzama kuti upenyu Hwake, uhwo hunova hwakakoshesesa kunhoroondo yose yavanhu,
  hahwuna kutangira muBetrehema kana kuperera paKarivhari. Aiva Dangwe raBaba, Mwanakomana Mumwechete
  Wakaberekwa munyama, Mununuri wenyika.
- Akamuka kubva muguva “akava chibereko chokutanga chavakavata” (Ⅰ VaKorinte 15:20) Salshe Akamuka, Akashanya
  pakati paavo vaAkanga achida muupenyu hwake panyika. Akaparidzawo kuna “mamwe makwayi” Ake (Johane 10:16)
  muAmerica yechinyakare. Munyika yamazuva ano, lye naBaba Vake vakazviratidza kumukomana Joseph Smith,
  vachitangisa vimbiso yakaitwa kare “yemukuwo wekuzara kwenguva” (VaEfeso 1:10).
- 'Nezva Kristu Anorarama, Muporofita Joseph akanyora kuti: “Maziso avo aiita serimi remoto, vhudzi remusoro
  mavo rakachena sechando chaicho; chiso chavo chaipenya kupfuura kupenya kwezuva; uye izwi ravo rainge
  richiita semvura zhinji iri kuyerera, kana izwi raJehova, richiti:'
- “Ndini wekutanga newekupedzisira; Ndini iye mupenyu, Ndini iye akauraiwa; Ndini murevereri wenyu kuna
  Baba” (D&Z 110:3–4).
- 'Nezvake Muporofita akazivisawo kuti: “Uye zvino, mushure meuchapupu hwakawanda hwakapihwa pamusoro
  pake, uhu ndihwo uchapupu, hwekupedzisira hwevose, hwatinopa pamusoro pake: Kuti mupenyu!'
- “Nokuti takamuona, kunyangwe kurwudyi rwaMwari; uye takanzwa izwi richipupura kuti ndiye Mumwechete
  Akaberekwa waBaba—
- “Kuti naiye, uye kuburikidza naiye, muna iye, nyika dziripo, uye dzakasikwa, uye nevagari vemo vanakomana
  nevanasikana vakaberekwa kuna Mwari” (D&Z 76:22–24).
- Tinozivisa namashoko aneudzamu kuti Hupirisita Hwake uye neChechi Yake zvakadzorerwa panyika—“zvakavakwa
  pahwaro … hwavaapositora navaporofita, Jesu Kristu pachake ari iye ibwe rapakona gurusa” (VaEfeso 2:20).
- Tinopupura kuti rimwe zuva Anozodzoka panyika. “Uye kubwinya kwalshe kucharatidzwa, nyama yose ichazviona
  pamwechete” (Isaya 40:5). Anozotonga saMambo waMadzimambo uye nokutonga salshe waMadzishe, uye ibvi
  roga roga richapfugama uye rurimi rwoga rwoga rwuchataura mukushumira pamberi Pake. Mumwe nomumwe wedu
  anozomira kuti atongwe Naye maererano namabasa edu uye nezvido zvemoyo yedu.
- Tinopa uchapupu, saVaApositora Vake vakagadzwa nemazvo—kuti Jesu ndiye Kristu Anorarama, Mwanakomana
  asingafi waMwari. Ndiye Mambo mukuru Imanueri, uyo anomira nhasi kuruoko rworudyi rwaBaba Vake. Ndiye
  chiedza, upenyu, uye tariro yenyika. Nzira yake ndiro gwara rinotitungamira kurufaro muupenyu hwuno
  uye muupenyu hwokusingaperi munyika ichauya. Mwari ngavatendwe nechipo chisina muenzaniso choMwanakomana
  anehumwari Wavo.
