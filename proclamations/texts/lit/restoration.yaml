retrieved: '2026-11-02'
title: Jėzaus Kristaus Evangelijos pilnatvės Sugrąžinimas
subtitle: Dušimtmetinis pareiškimas pasauliui
author: Pastarųjų Dienų Šventųjų Jėzaus Kristaus Bažnyčios Pirmoji Prezidentūra ir Dvylikos Apaštalų Taryba
note: Šį pareiškimą prezidentas Raselas M. Nelsonas perskaitė kalbėdamas 190-ojoje kasmetinėje visuotinėje
  konferencijoje 2020 m. balandžio 5 d. Solt Leik Sityje, Jutoje.
paragraphs:
- Mes iškilmingai pareiškiame, kad Dievas myli savo vaikus visose pasaulio šalyse. Dievas Tėvas dovanojo
  mums savo mylimo Sūnaus, Jėzaus Kristaus, dievišką gimimą, neprilygstamą gyvenimą ir beribę apmokančiąją
  auką. Tėvo galia Jėzus Kristus prisikėlė ir pasiekė pergalę prieš mirtį. Jis yra mūsų Gelbėtojas, mūsų
  Pavyzdys ir mūsų Išpirkėjas.
- Prieš du šimtus metų, gražų 1820 m. pavasario rytą, jaunuolis Džozefas Smitas, norėdamas sužinoti, prie
  kurios bažnyčios prisijungti, nuėjo melstis į giraitę, esančią netoli jo namų, šiaurinėje Niujorko valstijos
  dalyje, JAV. Jis turėjo klausimų dėl savo sielos išgelbėjimo ir tikėjo, kad Dievas parodys jam kelią.
- Nuolankiai pareiškiame, kad, atsakydami į jo maldą, Dievas Tėvas ir Jo Sūnus, Jėzus Kristus, pasirodė
  Džozefui ir iškilmingai pradėjo Biblijoje išpranašautą „visų dalykų atnaujinimo metą“ (Apaštalų darbų
  3:21). Per tą regėjimą jis sužinojo, kad mirus pirmiesiems apaštalams Kristaus Bažnyčios, aprašytos
  Naujajame Testamente, nebeliko žemėje. Džozefas būsiąs įrankis jai atkurti.
- Mes tvirtiname, jog, Tėvo ir Sūnaus vadovaujami, atėjo dangiški pasiuntiniai, kad mokytų Džozefą ir
  atkurtų Jėzaus Kristaus Bažnyčią. Prikeltas Jonas Krikštytojas sugrąžino įgaliojimą krikštyti panardinant,
  kad būtų atleistos nuodėmės. Trys iš pirmųjų dvylikos apaštalų – Petras, Jokūbas ir Jonas – sugrąžino
  apaštalystę ir kunigystės įgaliojimo raktus. Taip pat atėjo kiti, tarp jų Elija, kuris sugrąžino įgaliojimą
  sujungti šeimas amžiniems santykiams, kurie tęsis po mirties.
- Be to, liudijame, kad Džozefui Smitui buvo suteikta Dievo dovana ir galia išversti senovės metraštį
  – Mormono Knygą, dar vieną liudijimą apie Jėzų Kristų. Šios šventos knygos puslapiuose aprašyta ir asmeninė
  Jėzaus Kristaus tarnystė Vakarų pusrutulio žmonėms netrukus po Jo prisikėlimo. Joje mokoma apie gyvenimo
  tikslą ir paaiškinama Kristaus doktrina, kuri yra esminė tam tikslui pasiekti. Kaip Biblijos porininkė,
  Mormono Knyga liudija, kad visi žmonės yra mylinčio Dangiškojo Tėvo sūnūs ir dukros, kad Jis turi dievišką
  planą mūsų gyvenimui ir kad Jo Sūnus, Jėzus Kristus, mūsų laikais kalba taip pat, kaip senovės dienomis.
- Mes pareiškiame, kad Pastarųjų Dienų Šventųjų Jėzaus Kristaus Bažnyčia, suorganizuota 1830 m. balandžio
  6 d., yra atkurta Kristaus Bažnyčia, aprašyta Naujajame Testamente. Šios Bažnyčios inkaras yra jos kertinio
  akmens, Jėzaus Kristaus, tobulas gyvenimas, Jo beribis Apmokėjimas ir Prisikėlimas tiesiogine prasme.
  Jėzus Kristus dar kartą pašaukė apaštalus ir suteikė jiems kunigystės įgaliojimą. Jis kviečia mus visus
  ateiti pas Jį ir į Jo Bažnyčią, priimti Šventąją Dvasią, išgelbėjimo apeigas ir įgyti nesibaigiantį
  džiaugsmą.
- Praėjo du šimtai metų nuo tada, kai Dievas Tėvas ir Jo mylimas Sūnus, Jėzus Kristus, pradėjo šį Sugrąžinimą.
  Milijonai žmonių visame pasaulyje priėmė žinią apie šiuos išpranašautus įvykius.
- Džiugiai pareiškiame, kad žadėtasis Sugrąžinimas juda pirmyn per besitęsiantį apreiškimą. Žemė niekada
  nebebus tokia pati, nes Dievas „suvienys Kristuje visa“ (Efeziečiams 1:10).
- Su pagarba ir dėkingumu mes, kaip Jo apaštalai, kviečiame visus sužinoti, kaip žinome mes, kad dangūs
  yra atviri. Tvirtiname, kad Dievas atskleidžia savo valią savo mylimiems sūnums ir dukterims. Liudijame,
  kad tie, kurie pamaldžiai studijuos Sugrąžinimo žinią ir veiks su tikėjimu, bus palaiminti, kad įgytų
  asmeninį liudijimą apie Sugrąžinimo dieviškumą ir tikslą paruošti pasaulį pažadėtam antrajam mūsų Viešpaties
  ir Gelbėtojo, Jėzaus Kristaus, atėjimui.
