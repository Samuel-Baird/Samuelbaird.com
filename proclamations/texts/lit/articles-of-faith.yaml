title: Tikėjimo Teiginiai
subtitle: Pastarųjų Dienų Šventųjų Jėzaus Kristaus Bažnyčios
author: ''
verses:
- n: 1
  text: Mes tikime Dievą, Amžinąjį Tėvą, ir jo Sūnų Jėzų Kristų, ir Šventąją Dvasią.
- n: 2
  text: Mes tikime, kad žmonės bus nubausti už savo pačių nuodėmes, o ne už Adomo prasižengimą.
- n: 3
  text: Mes tikime, kad per Kristaus apmokėjimą visa žmonija gali būti išgelbėta per paklusnumą evangelijos
    įstatymams ir apeigoms.
- n: 4
  text: 'Mes tikime, kad pirmieji evangelijos principai ir apeigos yra: pirma, tikėjimas į Viešpatį Jėzų
    Kristų; antra, atgaila; trečia, krikštas panardinant nuodėmėms atleisti; ketvirta, rankų uždėjimas
    Šventosios Dvasios dovanai suteikti.'
- n: 5
  text: Mes tikime, kad evangelijai skelbti ir jos apeigoms atlikti, vyras turi būti pašauktas Dievo per
    pranašystę bei rankų uždėjimą tų, kurie yra įgalioti.
- n: 6
  text: 'Mes tikime ta pačia organizacija, kuri egzistavo pirmykštėje Bažnyčioje, būtent: apaštalais,
    pranašais, ganytojais, mokytojais, evangelistais ir taip toliau.'
- n: 7
  text: Mes tikime liežuvių, pranašystės, apreiškimų, regėjimų, gydymo, liežuvių aiškinimo ir kitomis
    dovanomis.
- n: 8
  text: Mes tikime, kad Biblija yra Dievo žodis, tiek, kiek ji teisingai išversta; mes taip pat tikime,
    kad Mormono Knyga yra Dievo žodis.
- n: 9
  text: Mes tikime visa, ką Dievas apreiškė, visa, ką jis apreiškia šiuo metu, ir tikime, kad jis dar
    apreikš daug didžių ir svarbių dalykų, susijusių su Dievo karalyste.
- n: 10
  text: Mes tikime Izraelio surinkimu tiesiogine prasme ir dešimties genčių sugrąžinimu; kad Sionė (Naujoji
    Jeruzalė) bus pastatyta Amerikos žemyne; kad Kristus pats viešpataus žemėje; ir kad žemė bus atnaujinta
    ir atgaus savo rojišką šlovę.
- n: 11
  text: Mes tvirtiname turį privilegiją garbinti Visagalį Dievą pagal tai, kaip liepia mūsų pačių sąžinė,
    ir pripažįstame tokią pačią privilegiją visiems žmonėms – tegul jie garbina, kaip nori, kur nori ir
    ką nori.
- n: 12
  text: Mes tikime, jog reikia paklusti karaliams, prezidentams, valdytojams bei valdininkams, paklūstant
    įstatymui, gerbiant ir palaikant jį.
- n: 13
  text: 'Mes tikime, jog turime būti sąžiningi, patikimi, skaistūs, geranoriški, dorybingi ir daryti gera
    visiems žmonėms; iš tiesų, galime pasakyti, kad sekame Pauliaus pamokymu: Mes visa tikime, mes viskuo
    viliamės, mes daug ištvėrėme ir tikimės, kad pajėgsime ištverti viską. Jei yra kas dora, mylėtina
    ar verta pritarimo, ar girtina – mes siekiame viso to.'
signature: Džozefas Smitas.
