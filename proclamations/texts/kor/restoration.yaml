retrieved: '2026-11-02'
title: 예수 그리스도의 충만한 복음의 회복
subtitle: 세상에 전하는 200주년 선언문
author: 예수 그리스도 후기 성도 교회 제일회장단 및 십이사도 평의회
note: 본 선언문은 2020년 4월 5일 유타주 솔트레이크시티에서 열린 제190차 연차 대회에서 러셀 엠 넬슨 회장이 말씀의 일부로 낭독한 것이다.
paragraphs:
- 우리는 하나님께서 세상의 모든 나라에 있는 그분의 자녀들을 사랑하신다는 것을 엄숙하게 선언한다. 하나님 아버지께서는 그분의 사랑하는 아들 예수 그리스도의 신성한 출생과, 비할 데
  없는 생애와, 무한한 속죄 희생을 우리에게 주셨다. 예수께서는 아버지의 권능으로 다시 일어나 사망을 이기고 승리를 얻으셨다. 그분은 우리의 구주이시고, 우리의 모범이시며, 우리의
  구속주이시다.
- 200년 전 1820년 아름다운 봄날 아침, 어느 교회에 가입해야 할지 알고자 했던 어린 조셉 스미스는 미국 뉴욕주 북부에 위치한 자신의 집 근처 숲속으로 기도하러 들어갔다. 그는
  자기 영혼의 구원에 관해 궁금한 점이 있었고 하나님께서 자신을 지도해 주실 것이라고 믿었다.
- 우리는 그의 기도에 대한 응답으로 하나님 아버지와 그분의 아들 예수 그리스도께서 조셉에게 나타나셨으며 성경에 예언된 대로 “만물[의] 회복”을(사도행전 3:21) 시작하셨다는 것을
  겸손하게 선언한다. 이 시현을 통해서 그는 신약 시대에 세워진 그리스도의 교회가 초대 사도들이 사망한 뒤 지상에서 사라졌음을 알게 되었다. 조셉은 그 교회가 다시 세워지는 데 자신이
  중요한 역할을 하게 될 것도 알게 되었다.
- 우리는 하늘의 사자들이 조셉을 가르치고 예수 그리스도의 교회를 다시 세우기 위해 아버지와 아들의 지시 아래 지상에 왔음을 분명히 선언한다. 부활한 침례 요한은 죄 사함을 위한 침수로써의
  침례를 행할 권세를 회복하였다. 초대 십이사도 중 세 사람—베드로, 야고보, 요한—은 사도 직분과 신권 권세의 열쇠들을 회복하였다. 지상을 방문한 다른 사자들 중에는 엘리야도 있었다.
  그는 가족이 죽음을 초월하여 영원히 함께할 수 있도록 결합해 주는 권세를 회복하였다.
- 더 나아가서 우리는 조셉 스미스가 하나님의 은사와 능력으로 고대의 기록, 즉 몰몬경—예수 그리스도의 또 하나의 성약—을 번역했음을 증언한다. 이 성스러운 기록의 한 부분에는 예수
  그리스도께서 부활하신 뒤 서반구에 있는 백성들에게 친히 성역을 베푸신 기사가 실려 있다. 몰몬경은 삶의 목적에 대해 가르쳐 주고 그 목적의 중심이 되는 그리스도의 교리를 설명해 준다.
  몰몬경은 성경과 짝을 이루는 경전으로서, 모든 사람은 사랑이 충만하신 하늘 아버지의 아들과 딸이며, 그분께서 우리 삶에 대해 신성한 계획을 갖고 계신다는 것과, 그분의 아들 예수
  그리스도께서 고대와 마찬가지로 오늘날 우리에게 말씀하고 계신다는 사실을 증거해 준다.
- 우리는 1830년 4월 6일에 조직된 예수 그리스도 후기 성도 교회가 신약에 기록된 그리스도의 교회가 회복된 것임을 선언한다. 이 교회는 그 머리 된 모퉁잇돌이신 예수 그리스도의
  완전한 생애와, 그분의 무한한 속죄와, 그분의 실제적인 부활에 뿌리를 두고 있다. 예수 그리스도께서는 다시 한번 사도들을 부르셨고 그들에게 신권 권세를 주셨다. 주님께서는 우리 모두에게
  그분과 그분의 교회로 나아와 성신과 구원 의식을 받고 지속되는 기쁨을 얻으라고 권유하고 계신다.
- 하나님 아버지와 그분의 사랑하는 아들 예수 그리스도에 의해 회복이 시작된 지 200년이 흘렀다. 세계 곳곳에서 수백만 명의 사람들이 고대에 예언되었던 이 일들이 참됨을 받아들였다.
- 우리는 이 약속된 회복이 지속적인 계시를 통해 계속 진행되고 있음을 기쁘게 선언한다. 하나님께서는 “다 그리스도 안에서 [하나로 모으실]” 것이며(에베소서 1:10) 세상은 결코
  전과 같지 않을 것이다.
- 경건하고 감사한 마음으로, 우리는 그분의 사도로서 하늘이 열려 있음을 모든 사람이—우리가 아는 것처럼—알도록 권유한다. 우리는 하나님께서 그분의 사랑하는 아들과 딸들을 위한 자신의
  뜻을 알려 주고 계심을 분명히 선언한다. 회복의 메시지를 기도하는 마음으로 연구하고 신앙으로 실천하는 사람들은 회복이 하나님으로부터 비롯되었으며 그 목적은 우리의 주님이자 구주이신
  예수 그리스도의 약속된 재림을 위해 세상을 준비시키는 것이라는 자신만의 증거를 축복으로 얻을 것임을 우리는 증언한다.
