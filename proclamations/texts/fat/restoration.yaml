retrieved: '2026-11-02'
title: Jesus Christ N’Asɛmpa no ne Mãhyɛ ne Nsanananmu no
subtitle: Mfe Ahaebien Afrenhyia Dawurbɔ a wɔdze ma Wiadze
author: President a Odzi Kan na n’Apamfo na Asomafo Abaguafo Duebien ma Jesus Christ N’Asɔr a ɔwɔ hɔ ma
  Nda a Odzi Ekyir Ahotseweefo
note: Dawurbɔ yi President Russell M. Nelson na ɔkenkanee dɛ ne nsɛm no mu bi wɔ Wiadze Mfɛndzanan Afrenhyia
  Ehyiadzi a otsĩa 190, Ebɔwbira 5, 2020, wɔ Salt Lake Kuropɔn, Utah.
paragraphs:
- Yɛpaa mu kã no ahobrɛadze mu dɛ Nyankopɔn dɔ Ne mba a wɔwɔ wiadze aman nyina mu. Nyame Egya no ama hɛn
  awoo krɔnkrɔn, abrabɔ a ne saso nnyi, na No Dɔba, Jesus Christ no werdam afɔrbɔ a ɔmmbɔadze da no. Ɔnam
  Egya no tum do, Jesus soɛɛr bio na Odzii owu do konyim. Ɔyɛ hɛn Agyenkwa, hɛn Fasusu, na hɛn Pomfo.
- Mfe ahaebien a abɛsen kɔ no, wɔ fefɛw da anapa fɛɛfɛw bi wɔ afe 1820 mu no, akɔkowaba Joseph Smith a,
  ɔrohwehwɛ ehu asɔr kor a ɔnkɔdɔm no, kɔr ndua kwaa a ɔbɛn ne fie mu wɔ New York etsifi afamu, USA. Nna
  ɔwɔ nsɛmbisa a ɔfa ne kra no nkwagye ho na onyaa awerɛhyɛmu dɛ Nyankopɔn bɛkyerɛ no kwan.
- Ahobrɛadze mu ara, yɛbɔ no dawur dɛ wɔ ne mpaabɔ ho mbuae mu no, Nyame Egya no na Ne Ba Jesus Christ,
  puee Joseph Smith do na wɔhyɛɛ “ndzɛmba nyina ahyɛananmu” (Ndwuma 3:21) no ase dɛ mbrɛ woedzi kan akã
  wɔ Bible mu no. Enyido-adzehu yi mu no, osũaa dɛ asɔpɔkan Asomafo no hɔn wu ekyir no, Christ N’Ahyɛmu
  Fofor Asɔr no ɔayew efi wiadze. Joseph na ɔbɛyɛ edwindadze wɔ ne nsan ananmu no mu.
- Yesi no pi dɛ wɔ Egya na Ɔba no Hɔn kwankyerɛ ase no, ɔsor abɔfo baa bɛkyerɛkyerɛɛ Joseph na wɔsanee
  kyekyeer Jesus Christ N’Asɔr no. John Onumanyi no a ɔasoɛr efi owufo mu no dze tumdzi a wɔdze yɛ nsumuhyɛ
  enuma no saan ananmu bae. Asɔpɔkan Asomafo no hɔn mu baasa—Peter, James, na John—dze asomafo na asɔfodzi
  tumdzi nsaafee no saan ananmu bae. Binom so bae, a Elijah kã ho, a ɔdze tumdzi no a wɔdze kã ebusua
  ebusua bɔ mu afebɔɔ wɔ onnyiewiei nkitahodzi mu a ɔtra owu no, saan ananmu bae.
- 'Yɛgye ho dase bio dɛ wɔmaa Joseph Smith Nyame akyɛdze na tum dɛ ɔmfa nkyerɛ tsetse nkyerɛwee ase: Mormon
  Nwoma no—Jesus Christ N’Ahyɛmu Kor so. Jesus Christ nankasa No somdwuma wɔ nkorɔfo a wɔwɔ Anee Wiadze
  Afamu wɔ No Wusoɛr ekyir ara no, no ho nsɛm kã nwoma krɔnkrɔn yi ne nkrataafa ho. Ɔkyerɛkyerɛ hɛn abrabɔ
  no botae na ɔkyerɛkyerɛ Christ ne nkyerɛkyerɛ no mu a, ɔyɛ dɛm botae no ne fapem. Dɛ ɔyɛ kyerɛwsɛm a
  ɔnye Bible no nam dɛ adamfo no, Mormon Nwoma no gye dase dɛ adasa nyina yɛ Egya a ɔwɔ Sor dɔfo mbabanyin
  na mbabaa, dɛ Ɔwɔ nhyehyɛɛ krɔnkrɔn ma hɛn abrabɔ, na dɛ Ne Ba, Jesus Christ, kasa ndɛ tse dɛ tsetse
  ber so mu no.'
- Yɛbɔ no dawur dɛ Jesus Christ N’Asɔr a ɔwɔ hɔ ma Nda a Odzi Ekyir Ahotseweefo no a, wɔkyekyeer no Ebɔbira
  6, 1830, nye Christ N’Ahyɛmu Fofor Asɔr no a wɔdze asan anamu aba no. Asɔr no tsim no kotowdo-bo tsitsir,
  Jesus Christ N’emudzi abraba do, na No Werdambɔ a ɔmmbɔadze da na No Wusoɛr ampaara no do. Jesus Christ
  asan afrɛ Asomafo bio na Ɔama hɔn asɔfodzi tumdzi. Ɔto nsa frɛ hɛn nyina dɛ yɛmbra Ne nkyɛn na N’Asɔr
  mu, mbɛgye Sunsum Krɔnkrɔn no, nkwagye ayɛdze horow, na yenya daapem enyigye.
- Afei mfe ahaebien abɛsen fitsi Nsanananmu yi a Nyame Egya no na No Dɔba, Jesus Christ hyɛɛ ase no. Ɔpepe
  a wɔwɔ wiadze yi mu efua dza osisii yinom ho nyimdzee a wɔhyɛɛ ho nkɔm no.
- Yɛbɔ no dawur enyigye mu dɛ Nsanananmu a wɔbɔɔ ho anohoba no, dua nyikyerɛ a ɔkɔ do no do, dze kɔ kan.
  Asaase yi rennda ho nnyɛ dɛmara bio, osiandɛ Nyame ‘bɛkã ndzɛmba nyina abɔ mu kor wɔ Christ mu’ (Ephesusfo
  1:10).
- Yɛdze obu na enyisɔ no, hɛn N’Asomafo to nsa frɛ obiara dɛ ombohu—dɛ mbrɛ yenyim no—dɛ ɔsorsor ebue.
  Yesi no pi dɛ Nyankopɔn reda Ne pɛ edzi ma Ne mbabanyin na Ne mbabaa adɔfo no. Yɛgye dase dɛ hɔn a mpaabɔ
  mu ara wosũa Nsanananmu ho asɛm na wɔdze gyedzi yɛ asɛm no, wobehyira hɔn ma hɔnankasa woenya no krɔnkrɔnyɛ
  ho dase na no botae dɛ obesiesie wiadze no ama hɛn Ewuradze na hɛn Agyenkwa, Jesus Christ ne Mbae a
  Otsĩa Ebien a wɔabɔ ho anohoba no.
