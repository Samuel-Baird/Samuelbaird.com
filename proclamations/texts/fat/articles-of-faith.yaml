title: Gyedzi ho Nsɛmpɔw No A Ɔwɔ
subtitle: Jesus Christ N’Asɔr a ɔwɔ hɔ ma Nda a Odzi Ekyir Ahotseweefo no mu
author: ''
verses:
- n: 1
  text: Yɛgye Nyankopɔn, Onnyiewiei Egya no, na Ne Ba, Jesus Christ, na Sunsum Krɔnkrɔn no dzi.
- n: 2
  text: Yɛgye dzi dɛ wɔbɛtsẽa nyimpa wɔ hɔnankasa hɔn bɔn ho, na nnyɛ wɔ Adam ne mbrato ho.
- n: 3
  text: Yɛgye dzi dɛ ɔnam Christ no Werdambɔ do adasamba nyinara botum enya nkwa, ber a wɔyɛ setsie ma
    mbra no na Asɛmpa n’ayɛdze no.
- n: 4
  text: 'Yɛgye dzi dɛ fapem na Asɛmpa n’ayɛdze a odzi kan no nye: odzi kan, Gyedzi wɔ Ewuradze Jesus Christ
    mu; otsĩa ebien, Nnuho; otsĩa ebiasa, Nsumuhyɛ enuma a ɔwɔ hɔ ma bɔnfakyɛ; otsĩa anan, Wɔdze nsa rugu
    wo do ama Sunsum Krɔnkrɔn n’akyɛdze no.'
- n: 5
  text: Yɛgye dzi dɛ otwar dɛ Nyame frɛ nyimpa wɔ nkɔnhyɛ do, na wɔ nsa a hɔn a wɔwɔ tumdzi dze gu no
    do, ma ɔdze akã Asɛmpa no na ɔayɛ ayɛdze a ɔkã ho no.
- n: 6
  text: Yɛgye nhyehyɛɛ kor no ara a ɔwɔ Tsetseberdo Asɔr no mu a, wɔyɛ asomafo, nkɔnhyɛfo, asɔfo, akyerɛkyerɛfo,
    nsɛmpakãfo na dza ɔkekã ho no dzi.
- n: 7
  text: Yɛgye kasa horow akyɛdze, nkɔnhyɛ, nyikyerɛ, enyido-adzehu, ayarsa, kasa horow ne nkyerɛase, na
    ma ɔkekã ho no dzi.
- n: 8
  text: Yɛgye Bible no dzi dɛ ɔyɛ Nyame n’asɛm wɔ aber a wɔakyerɛ ase yie; yɛgye Mormon Nwoma no so dzi
    dɛ ɔyɛ Nyame n’asɛm.
- n: 9
  text: Yɛgye dza Nyame eyi akyerɛ nyina, na dza seseiara Oyi kyerɛ nyina dzi, na yɛgye dzi dɛ Ɔbɔkɔ do
    eyi ndzɛmba akɛse a no ho hia tsitsir pii a ɔfa Nyame N’ahenman ho no akyerɛ.
- n: 10
  text: Yɛgye dza wɔakã a ɔkyerɛ dɛ wɔbɛkã Israelmba aboa ano, na Ebusuakuw Du no nsanananmu no dzi; Zion
    (Jerusalem Fofor no) wɔbɛkyekyer no wɔ America asaase tɔw no do; Christ Noara bedzi hen wɔ asaase
    do; na, wɔbɛyɛ asaase yi fofor na oenya ne paradise enyimnyam no.
- n: 11
  text: Yɛgye ndzinoa no to mu dɛ ɔwɔ dɛ yɛsom Otumfo Nyame wɔ kwan a hɛn tsibowa kã kyerɛ hɛn, na yɛma
    nyimpa nyinara ndzinoa kor noara bi dɛ wɔnsom dɛ mbrɛ wɔpɛ, bea a wɔpɛ, anaa dza wɔpɛ.
- n: 12
  text: Yɛgye dzi dɛ ɔwɔ dɛ yɛbrɛ hɛnho adze ma ahemfo, presidentfo, ahwɛdofo na atsɛmbuafo, yɛyɛ setsie
    ma hɔn, yedzi hɔn nyi na yedzi mbra no do.
- n: 13
  text: Yɛgye dzi dɛ ɔwɔ dɛ yɛyɛ anokwafo, yedzi nokwar, yɛyɛ ahosie, yɛyɛ etuhoakyɛ, yɛbɔ ɔbra pa na
    yɛyɛ papa ma nyimpa nyinara; nokwar, dza yebotum akã nye dɛ yedzi Paul n’afotu no do—Yegye ndzɛmba
    nyina dzi, yɛwɔ adze nyina mu enyidado, yɛasɔw ndzɛmba pii na yɛwɔ enyidado dɛ yebotum asɔw ndzɛmba
    nyina. Sɛ ɔbra pa, dza ɔyɛ fɛw anaa ɔwɔ dzin pa anaa ɔsɛ nkamfo a, ndzɛmba yinom na yɛhwehwɛ ekyir
    kwan.
signature: Joseph Smith.
