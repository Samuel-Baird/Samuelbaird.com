title: Christ Ɔtseasefo No
subtitle: Asomafo no hɔn Dasegye
author: Jesus Christ N’Asɔr a ɔwɔ hɔ ma Nda a Odzi Ekyir Ahotseweefo
paragraphs:
- Mber a yeridzi Jesus Christ N’awoo mfe apem ebien a wɔabɛsen kɔ ho fa dze rekaa No no, yɛma hɛn dasegye
  wɔ N’abrabɔ a onnyi kãbea na No werdam afɔrbɔ kɛse no tum a ɔmmbɔadze ho dɛ, ɔyɛ nokwar. Obiara nnyaa
  nhyɛdo nwanwa wɔ hɔn a wɔatsena ase nyina na hɔn a wɔbɛtsena ase nyina wɔ asaase do, kã No nko.
- Ɔno nye Jehovah Kokroko no wɔ Ahyɛmu Dadaw no mu, Messiah no wɔ Fofor no mu. N’Egya N’akwankyerɛ mu
  no, Ɔno na ɔyɛɛ asaase bɔfo. “Wɔnam no do yɛɛ adze nyina; na woennkwetsi no annyɛ biribiara a wɔyɛe”
  (John 1:3). Kaansa Ɔannyɛ bɔn, naaso wonumaa No ama Ɔaahyɛ tsenenee nyina mã. Ɔno “okyinii yɛɛ yie”
  (Ndwuma 10:38), naaso wobuu no enyimtsia wɔ ho. Nna N’asɛmpa yɛ asomdwee na nsiesie nsɛm. Ɔtotɔe serɛɛ
  obiara dɛ ondzi Ne fasusu do. Ɔbɔɔ anamɔn wɔ Palestine atsɛmpɔn no do, saa yarba, maa enyifurafo hun
  adze na Onyaan ewufo no. Ɔkyerɛkyerɛɛ mfesantsen nokwar ho nsɛm, hɛn ɔnnkyebo asetsena ansaana yɛreba
  asaase do no ho nokwar, hɛn abrabɔ wɔ asaase do no botae, na mbrɛ Nyame ne mbabanyin na mbabaa hɔn ndaamba
  mpontu bɛyɛ wɔ abrabɔ a ɔreba no mu.
- Ɔhyɛɛ sacrament no ase dɛ nkaa wɔ No werdam afɔrbɔ kɛse no ho. Wɔkyeer no na wɔdze dasekrum buu no fɔ
  dze dwedwee dɔm tutuw hɔn akoma na wobuu no okumfor wɔ Nyitsirdo mbeamudua do. Ɔdze No nkwa mae dze
  bɔɔ werdam maa adasa nyina hɔn bɔn. Ɔyɛɛ nsiananmu akyɛdze kɛse maa hɔn a wɔbɛtsena asaase do nyina.
- Yɛgye dase enyidzi mu dɛ N’abrabɔ, a adasa nyina abakɔsɛm gyina do no, annhyɛ ase wɔ Bethlehem, eso
  oennwie wɔ Nyitsirdo do. Ɔno nye Egya N’Abakan, Ɔba Kortonoo a Wɔwoo No honam mu no, Wiadze Pomfo no.
- Ɔsoɛree fii owumaa mu “bɛyɛɛ hɔn a wɔadeda mu eduaba kan.” (1 Corinthfo 15:20). Dɛ Ewuradze a Ɔasoɛr
  no, Ɔkɛseraa hɔn a Ɔdɔɔ hɔn wɔ Ne ɔnnkyebo abrabɔ mu no. Ɔkɔsoom No “nguan bi so” (John 10:16) wɔ tsetse
  America man mu. Hɛn ndɛ wiadze mu no, Ɔno na N’Egya puee Joseph Smith do, a ɔdze “efisiesie mber pa
  amayɛ” a wɔabɔ ho anohoba dada no bɔbɔɔ adze (Ephesusfo 1:10).
- 'Nkɔnhyɛnyi Joseph kyerɛɛw wɔ Christ Ɔtseasefo no ho dɛ: “N’enyiwa tse dɛ ogyaframee; tsinhwi a ɔwɔ
  ne tsir do no yɛ fitaa tse dɛ esukwankyɛba mapa; n’enyim hyerɛnee kyɛɛn ewia ne hyerɛn; na ne ndze tse
  dɛ esu akɛse a ɔrepem, Jehovah ne ndze mpo, rese dɛ:'
- “Emi nye ɔkandzifo nye okyidzifo no; emi nye nyia ɔtse ase no, emi nye nyia wokum no no; emi nye hom
  dzimafo wɔ Egya no nkyɛn” (N&A 110:3–4).
- 'Nkɔnhyɛnyi no paa mu kãa No ho asɛm so dɛ: “Na afei, dasegye pii a wɔdze ama wɔ no ho no, iyi nye dasegye
  a odzi ekyir koraa, yɛgye dase wɔ no ho dɛ: Ɔtse ase!'
- “Osiandɛ yehun no, dɛ ɔwɔ Nyame n’abanyimfa; na yɛtsee ndze a ɔregye dase dɛ ɔno nye Egya ne Ba a Wɔwoo
  no Kortoo no—
- “Na wɔnam no do, na wɔnam no mu, na ɔnoara so na ɔbɔɔ wiadze, na hɔn a wɔtse do nyina wɔwoo hɔn Nyame
  ne mbabanyin na mbabaa” (N&A 76:22–24).
- Yɛpaa mu kã wɔ enyidzi nsɛm mu dɛ N’asɔfodzi na N’Asɔr a wɔaasan no ananmu wɔ asaase do—“wɔdze … esi
  asomafo nye nkɔnhyɛfo no fapem do, a Christ Jesus nankasa nye kutuwdo-bo tsitsir” (Ephesusfo 2:20).
- Yɛgye dase dɛ da bi Ɔbɛsan aba asaase do. “Na wɔbɛda Ewuradze n’enyimnyam edzi, na adasa nyina abɔ mu
  ehu” (Isaiah 40:5). Ɔbɔhwɛ asaase do dɛ Ahemfo Hen na Oedzi hen dɛ Ewuranom Ewuradze, na anankroma nyina
  bɔkotow na tɛkyerɛma nyina bɛkasa ayɛyi mu wɔ N’enyim. Hɛn mu kor biara begyina N’enyim ma Oebu hɛn
  atsen dɛ mbrɛ hɛn ndwuma na hɛn akoma n’apɛdze tse.
- Yɛgye dase, dɛ N’Asomafo a wɔahyɛ hɛn asɔfo wɔ kwan a ɔtsen mu no—dɛ Jesus nye Christ Ɔtseasefo no,
  Nyame Ne bɛkyebo Ba no. Ɔno nye Ɔhen kɛse Immanuel no, a ndɛ Ogyina N’Egya N’abanyimfa. Ɔno nye kan
  no, nkwa no, na wiadze enyidado no. No kwan nye anamɔn kwan a ɔtsen kɔ enyigye wɔ abrabɔ yi mu na onnyiewiei
  nkwa wɔ wiadze a ɔreba no mu. Yɛda Nyame ase wɔ Ne Ba krɔnkrɔn akyɛdze a onnyi kãbea no ntsi.
