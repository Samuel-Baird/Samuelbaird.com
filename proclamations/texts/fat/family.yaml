title: Ebusua no
subtitle: Dawurbɔ a wɔdze ma Wiadze
author: President a Odzi Kan na n’Apamfo na Asomafo Abaguafo Duebien a wɔwɔ Jesus Christ N’Asɔr a ɔwɔ
  hɔ ma Nda a Odzi Ekyir Ahotseweefo mu no.
note: President Gordon B. Hinckley na ɔkenkanee dɛm dawurbɔ yi dɛ ne nkrato no mu bi wɔ “Relief Society”
  Nhyiamu kɛse a ɔkɔɔr do wɔ Ɔbradzi 23, 1995 wɔ Salt Lake City, Utah.
paragraphs:
- Hɛn, President a Odzi Kan na n’Apamfo na Asomafo Abaguafo Duebien no a yɛwɔ Jesus Christ N’Asɔr a ɔwɔ
  hɔ ma Nda a Odzi Ekyir Ahotseweefo mu no, bɔ no dawur enyiberdo dɛ banyin na ɔbaa ntamu awar yɛ Nyankopɔn
  Ne nhyehyɛɛ, na Bɔadze Ne nhyehyɛɛ ma Ne mba hɔn onnyiewiei nkrabea ne fapem nye ebusua.
- Nyimpa nyinara—mbanyin na mbaa—wɔbɔɔ hɔn wɔ Nyankopɔn no su do. Kor biara yɛ sor awofo hɔn sunsum dɔba
  banyin anaa dɔba ɔbaa, na dɛm ntsi, kor biara wɔ Nyame suban na nkrabea. Dɛ no bɔbea yɛ banyin anaa
  ɔbaa no yɛ dza ohia tsitsir ma ankorankor biara ansaana ɔbɛba asaase do, ne ɔnnkyebo asetsena ber, na
  no onnyiewiei su na botae.
- Wɔ abrabɔ ansaana nyimpa reba asaase gyinabew mu no, nna sunsum mbabanyin na mbabaa nyim na wɔsoom Nyankopɔn
  dɛ hɔn Onnyiewiei Egya, na wɔgyee Ne nhyehyɛɛ a Ne mba botum edua do enya nyimpadua na woenya asaase
  do sũahu dze enya kan kɔ wɔ emudzi mu, na ewiei no, obiara enya no krɔnkrɔn nkrabea dɛ onnyiewiei adzedzinyi
  no, too mu. Enyigye ho nhyehyɛɛ krɔnkrɔn no tum ma ebusua nkitahodzi kɔ do wɔ owu ekyir. Ayɛdze krɔnkrɔn
  na ahyɛmudzi a wɔyɛ no wɔ temple krɔnkrɔn mu no, ma ankorankor kwan ma wotum san kɔ Nyankopɔn n’enyim
  na ɔma ebusua kã bɔ mu afebɔɔ.
- Mbrasɛm a odzi kan a Nyankopɔn dze maa Adam na Eve no fa hɔn daakye abaatanyɛ dɛ kun na yer. Yɛpaa mu
  kã dɛ Nyankopɔn Ne mbrasɛm ma Ne mba dɛ wɔndɔr na wɔnhyɛ asaase do mã no, da ho dzi mu. Yɛkɔ do paa
  mu kã dɛ Nyankopɔn ahyɛ mbra dɛ awo ho tum krɔnkrɔn no wɔdɛ odzi dwuma wɔ banyin na ɔbaa a wɔawar wɔ
  mbra kwan do, dɛ kun na yer, nkotsee ntamu.
- Yɛpaa mu kã dɛ kwan a wodua do dze bɔ nkwa a ɔnnkyebo yi yɛ Nyame ahyɛdze. Yesi nkwa asetsena yi no
  krɔnkrɔnyɛ, na no ho hia a ohia wɔ Nyankopɔn no onnyiewiei nhyehyɛɛ mu no pi.
- Okun na ɔyer wɔ enyiber asodzi dɛ wɔbɔdɔ na wɔahwɛ hɔn ho na hɔn mba. “Mba yɛ Ewuradze n’egyapadze”
  (Ndwom 127:3). Awofo wɔ dwuma krɔnkrɔn dɛ wɔtsetse hɔn mba wɔ ɔdɔ na tseneneeyɛ mu, wɔma hɔn honandua
  na sunsum mu ehiadze, wɔkyerɛkyerɛ hɔn ma wɔdodɔ na wɔsom hɔnho nkorkor, wodzi Nyankopɔn Ne mbrasɛm
  do, na wɔyɛ amamfo a wodzi ɔman ne mbra do wɔ beebiara a wɔtse. Kunnom na yernom—enãnom na egyanom—bobu
  asɛdze yinom ne nyɛe ho nkontaa wɔ Nyankopɔn enyim.
- Ebusua no yɛ Nyankopɔn Ne nhyehyɛɛ. Banyin na ɔbaa ntamu awar hia tsitsir ma No onnyiewiei nhyehyɛɛ.
  Mba fata dɛ wɔwo hɔn wɔ awar nhyehyɛɛ mu, na egya nye nã a wɔdze nokwardzi dzi awar nsew no do no, tsetse
  hɔn. Nsa botum akã ebusua abrabɔ mu enyigye no sɛ wɔtow ne fapem wɔ Ewuradze Jesus Christ ne nkyerɛkyerɛ
  do a. Awar na ebusua ebusua a wɔkɔdo yie no, wɔkyekyer na wɔkora do wɔ gyedzi, mpaabɔ, nnuhu, fakyɛ,
  enyidzi, ɔdɔ, ayamuhyehye, edwumayɛ, na agodzi dwumadzi a odzi mu fapem do. Dɛ mbrɛ Nyame ahyehyɛ no,
  egyanon wɔdɛ wɔhwɛ hɔn ebusua ebusua do wɔ ɔdɔ na tseneneeyɛ mu na ɔyɛ hɔn asodzi dɛ wɔma hɔn ebusua
  ebusua abrabɔ mu ehiadze na bambɔ. Nãnom hɔn asodzi tsitsir ara nye dɛ wɔtsetse hɔn mba. Asodzi krɔnkrɔn
  yinom mu no, ɔyɛ egyanom na nãnom hɔn asɛdze dɛ wɔboa hɔn ho dɛ adamfo etsĩpɛmfo. Dzɛmdzi, owu, na gyinabew
  binom so botum ama ekehia dɛ ankorankor yɛ nsesã. Ebusuafo nkaafo no wɔdɛ wɔma mboa wɔ hiaber mu.
- Yɛbɔ kɔkɔ dɛ ankorankor a wɔtõ ahosie ahyɛmudzi, wobu ahokafo anaa mba enyimtsĩa, anaa wobu hɔn enyi
  gu hɔn ebusua asodzi do no begyina Nyankopɔn enyim ebu ho nkontaa da bi. Yɛkɔ do bɔ kɔkɔ dɛ ebusua ntsetsewmu
  dze mbusu kɛse a tsetse ber na ndɛ ber yi mu nkɔnhyɛfo ahyɛ ho nkɔm no bɛba ankorankor, nyimpakuw, na
  amanaman do.
- Yɛtotɔ serɛ amamfo a hɔn enyi wɔ adze do, na aban mu dzibewdzifo a wɔwɔ beebiara dɛ wɔdze tsipia bɛma
  dɛm esusudze yinom a wɔahyehyɛ dɛ ɔbɔkora na wɔahyɛ ebusua a ɔyɛ wiadzemba ne fapem tɔw no dzen.
