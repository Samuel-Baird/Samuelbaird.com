title: Հավատո Հանգանակը
subtitle: Հիսուս Քրիստոսի Վերջին Օրերի Սրբերի Եկեղեցու
author: ''
verses:
- n: 1
  text: Մենք հավատում ենք Աստծուն՝ Հավերժական Հորը, և Նրա Որդուն՝ Հիսուս Քրիստոսին, և Սուրբ Հոգուն։
- n: 2
  text: Մենք հավատում ենք, որ մարդիկ կպատժվեն իրենց իսկ գործած մեղքերի, այլ ոչ թե Ադամի օրինազանցության
    համար։
- n: 3
  text: Մենք հավատում ենք, որ Քրիստոսի Քավության շնորհիվ ողջ մարդկությունը կարող է փրկվել՝ հնազանդվելով
    Ավետարանի օրենքներին և արարողություններին։
- n: 4
  text: Մենք հավատում ենք, որ Ավետարանի առաջնային սկզբունքներն ու արարողություններն են. առաջին՝ Հավատք
    առ Տեր Հիսուս Քրիստոս. երկրորդ՝ Ապաշխարություն. երրորդ՝ ընկղմամբ Մկրտություն մեղքերի թողության համար.
    չորրորդ՝ Ձեռնադրում Սուրբ Հոգու պարգևի համար։
- n: 5
  text: Մենք հավատում ենք, որ Ավետարանը քարոզելու և նրա արարողությունները սպասավորելու համար, մարդ պետք
    է կանչված լինի Աստծո կողմից՝ մարգարեությամբ և իշխանություն ունեցողների ձեռնադրմամբ։
- n: 6
  text: Մենք հավատում ենք նույն կազմակերպությանը, որը գոյություն ուներ Նախնական Եկեղեցում՝ իր առաքյալներով,
    մարգարեներով, հովիվներով, ուսուցիչներով, ավետարանիչներով և այլն։
- n: 7
  text: Մենք հավատում ենք լեզուների, մարգարեության, հայտնության, տեսիլքների, բժշկության, լեզուների թարգմանության
    և այլ պարգևների։
- n: 8
  text: Մենք հավատում ենք, որ Աստվածաշունչն Աստծո խոսքն է, որքան որ այն ճիշտ է թարգմանված. մենք հավատում
    ենք նաև, որ Մորմոնի Գիրքն Աստծո խոսքն է։
- n: 9
  text: Մենք հավատում ենք այն ամենին, ինչ Աստված հայտնել է, այն ամենին, ինչ Նա այժմ հայտնում է, և հավատում
    ենք, որ Նա դեռ շատ մեծ ու կարևոր բաներ է հայտնելու Աստծո Արքայության վերաբերյալ։
- n: 10
  text: Մենք բառացիորեն հավատում ենք Իսրայելի Տան հավաքմանը և նրա Տասը Ցեղերի վերականգնմանը. որ Սիոնը
    (Նոր Երուսաղեմը) կկառուցվի Ամերիկյան աշխարհամասում. որ Քրիստոսն անձամբ կթագավորի երկրի վրա. և որ երկիրը
    կնորանա և կընդունի իր դրախտային փառքը։
- n: 11
  text: Մենք պահանջում ենք մեր իսկ խղճի թելադրանքով Ամենազոր Աստծուն երկրպագելու արտոնությունը, և նույն
    արտոնությունը վերապահում ենք բոլոր մարդկանց. թող նրանք երկրպագեն ինչպե՛ս, որտե՛ղ կամ ինչ որ կամենում
    են։
- n: 12
  text: Մենք հավատում ենք թագավորներին, նախագահներին, կառավարիչներին և մյուս իշխանավորներին հպատակվելուն,
    օրենքին հնազանդվելուն, այն հարգելուն և պաշտպանելուն։
- n: 13
  text: Մենք հավատում ենք ազնիվ, ճշմարիտ, մաքրաբարո, բարյացակամ, առաքինի լինելուն և բոլոր մարդկանց բարիք
    անելուն։ Իրավ, կարող ենք ասել, որ մենք հետևում ենք Պողոս Առաքյալի հորդորանքին. Ամեն բանի հավատում
    ենք, ամեն բանի համար հույս ունենք, համբերել ենք շատ բաների և հույս ունենք, որ կկարողանանք համբերել
    բոլոր բաներին։ Եթե մի բան առաքինի է, գեղեցիկ, բարեհամբավ, գովեստի արժանի, մենք ձգտում ենք այդ ամենին։
