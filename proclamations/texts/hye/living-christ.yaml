title: Կենդանի Քրիստոսը
subtitle: Առաքյալների վկայությունը
author: Հիսուս Քրիստոսի Վերջին Օրերի Սրբերի Եկեղեցի
paragraphs:
- Նշելով երկու հազարամյակ առաջ տեղի ունեցած Հիսուս Քրիստոսի ծնունդը՝ մենք բերում ենք մեր վկայությունը
  Նրա անզուգական կյանքի իրողության և Նրա քավող մեծ զոհաբերության անսահման զորության մասին։ Չկա որևէ մեկը,
  ով այդպիսի խորը ազդեցություն ունենա բոլորի վրա, ովքեր ապրել և դեռ ապրելու են երկրի վրա։
- Նա Հին Կտակարանի Մեծ Եհովան էր և Նոր Կտակարանի Մեսիան։ Իր Հոր ղեկավարության ներքո՝ Նա էր երկրի արարիչը։
  «Ամեն ինչ նրանով եղավ, և առանց նրա ոչինչ չեղավ, ինչ որ եղավ» (Հովհ. 1.3)։ Լինելով անմեղ՝ Նա մկրտվեց,
  որ ամեն արդարություն կատարվի։ Նա «շրջում էր՝ բարիք գործելով» (Գոր. 10.38), թեև արհամարհվեց դրա համար։
  Նրա ավետարանը խաղաղության ու բարեհաճության ուղերձ էր։ Նա կոչ արեց բոլորին հետևել Իր օրինակին։ Նա քայլեց
  Պաղեստինի ճանապարհներով՝ բուժելով հիվանդներին, տեսողություն շնորհելով կույրերին, կենդանացնելով մահացածներին։
  Նա սովորեցրեց հավերժական ճշմարտությունների, մեր նախաերկրային կյանքի իրողության, երկրի վրա մեր կյանքի
  նպատակի և գալիք կյանքի համար Աստծո որդիների ու դուստրերի ներուժի մասին։
- Նա հաստատեց հաղորդությունը որպես Իր մեծ քավիչ զոհաբերության հիշեցում։ Նա ձերբակալվեց ու դատապարտվեց
  կեղծ մեղադրանքներով, մեղավոր ճանաչվեց ամբոխին բավարարելու համար, և մահվան դատապարտվեց Գագաթի խաչի վրա։
  Նա զոհեց Իր կյանքը՝ քավելու համար ողջ մարդկության մեղքերը։ Նա մեծ փոխարինող պարգև էր բոլոր նրանց օգտի
  համար, ովքեր երբևէ կապրեն երկրի երեսին։
- Մենք հանդիսավորությամբ վկայում ենք, որ Նրա կյանքը, որն առանցքային դեր ունի ողջ մարդկության պատմության
  մեջ, սկիզբ չի առել Բեթլեհեմում, ոչ էլ ավարտվել է Գագաթում։ Նա Հոր Անդրանիկն էր, Միածին Որդին մարմնում,
  աշխարհի Քավիչը։
- Նա հարություն առավ գերեզմանից. «ննջեցյալներից առաջինը եղավ, որ մեռելներից հարություն է առել» (Ա Կոր.
  15.20)։ Որպես հարություն առած Տեր, Նա այցելեց նրանց, ում սիրում էր կյանքի ընթացքում։ Նա նաև սպասավորեց
  հնադարյան Ամերիկայի Իր «ուրիշ ոչխարներին» (Հովհ. 10.16)։ Մեր ժամանակներում Նա և Նրա Հայրը հայտնվեցին
  պատանի Ջոզեֆ Սմիթին, սկիզբ դնելով վաղուց խոստացված «ժամանակների լրության տնտեսությանը» (Եփես. 1.10)։
- Կենդանի Քրիստոսի մասին մարգարե Ջոզեֆը գրել է. «Նրա աչքերը կարծես կրակի բոցեր լինեին. նրա գլխի մազերը
  ճերմակ էին, ինչպես մաքուր ձյունը. նրա դեմքը փայլում էր արևի պայծառությունից վառ. և նրա ձայնն ասես շառաչյուն
  մեծ ջրերի հնչում լիներ, այսինքն՝ Եհովայի ձայնը, ասելով.
- Ես եմ առաջինը և վերջինը. ես նա եմ, ով ապրում է, ես նա եմ, ով սպանվել էր. ես ձեր բարեխոսն եմ Հոր մոտ»
  (ՎևՈՒ 110.3–4)։
- Նրա վերաբերյալ մարգարեն նաև հայտարարել է. «Եվ արդ, բազմաթիվ վկայություններից հետո, որ տրվել են նրա մասին,
  սա է վկայությունը, ամենավերջինը, որ մենք տալիս ենք նրա մասին. Որ, նա ապրո՛ւմ է։
- Քանզի մենք տեսանք նրան, նույնիսկ Աստծո աջ կողմում. և մենք լսեցինք ձայնը, որը վկայում էր, որ նա Հոր Միածինն
  է,–
- Որ նրանով, նրա միջոցով, և նրանից է, որ աշխարհները կան և ստեղծվել են, և դրանց բնակիչները ծնված որդիներն
  ու դուստրերն են Աստծո» (ՎևՈՒ 76.22–24)։
- Մենք հանդիսավոր հայտարարում ենք, որ Նրա քահանայությունը և Նրա Եկեղեցին վերականգնվել են երկրի երեսին.
  «առաքյալների ու մարգարեների հիմքի վրա շինված, որի անկյունաքարը Քրիստոսն է» (Եփես. 2.20)։
- Մենք վկայում ենք, որ մի օր Նա կվերադառնա երկիր։ «Եվ պիտի հայտնվի Տիրոջ փառքը, և ամեն մարմին միասին պիտի
  տեսնեն» (Եսայի 40.5)։ Նա կղեկավարի ինչպես Թագավորների Թագավոր և կկառավարի ինչպես Տերերի Տեր, և ամեն
  ծունկ պիտի ծալվի ու ամեն լեզու խոստովանի Նրա առաջ երկրպագելով։ Մեզանից յուրաքանչյուրը պետք է կանգնի
  դատվելու Նրա կողմից՝ համաձայն մեր գործերի ու մեր սրտի ցանկությունների։
- Որպես Նրա պատշաճորեն կարգված Առաքյալներ, մենք վկայում ենք, որ Հիսուսը կենդանի Քրիստոսն է, Աստծո անմահ
  Որդին։ Նա է մեծ Թագավոր Էմմանուելը, ով կանգնած է այսօր Իր Հոր աջ կողմում։ Նա է լույսը, կյանքը և հույսն
  աշխարհի։ Նրա ճանապարհն այն արահետն է, որ տանում է դեպի երջանկություն այս կյանքում և հավիտենական կյանք
  գալիք աշխարհում։ Փա՛ռք Աստծուն Իր սուրբ Որդու անզուգական պարգևի համար։
