title: Mataupu Faavae o le Faatuatua
subtitle: o le Ekalesia a Iesu Keriso o le Au Paia o Aso e Gata Ai
author: ''
verses:
- n: 1
  text: Matou te talitonu i le Atua, le Tamā Faavavau, ma Lona Alo, o Iesu Keriso, ma le Agaga Paia.
- n: 2
  text: Matou te talitonu o le a faasalaina tagata ona o a latou lava agasala, ae lē ona o le solitulafono
    a Atamu.
- n: 3
  text: Matou te talitonu e ala i le Togiola a Keriso, e mafai ai ona faaolaina tagata uma, e ala i le
    usiusitai i tulafono ma sauniga o le Talalelei.
- n: 4
  text: 'Matou te talitonu o uluai mataupu autu ma sauniga nei o le Talalelei: muamua, Faatuatua i le
    Alii o Iesu Keriso; o lona lua, Salamo; o lona tolu, Papatisoga e ala i le faatofuina mo le faamagaloga
    o agasala; o lona fa, Faaeega o lima mo le meaalofa o le Agaga Paia.'
- n: 5
  text: Matou te talitonu e ao ina valaauina se tagata e le Atua, e ala i le valoaga, ma ala i le faaeega
    o lima o i latou o e o i ai le pule, e talaʼi atu ai le Talalelei ma faia sauniga o i ai.
- n: 6
  text: Matou te talitonu i le faatulagaga lava lea sa i ai i le Ekalesia Anamua, e pei o, aposetolo,
    perofeta, epikopo, aoao, tagata folafola le talalelei, ma isi tofiga faapena.
- n: 7
  text: Matou te talitonu i le meaalofa o gagana, valoaga, faaaliga, faaaliga vaaia, faamaloloina o maʼi,
    faamatalaga o gagana, ma isi mea faapena.
- n: 8
  text: Matou te talitonu o le Tusi Paia o le afioga ia a le Atua e tusa ma mea ua tonu ona faaliliuina;
    matou te talitonu foi o le Tusi a Mamona o le afioga ia a le Atua.
- n: 9
  text: Matou te talitonu i mea uma na faaali mai e le Atua, mea uma ua ia faaali mai nei, ma matou te
    talitonu foi o le a ia faaali mai le tele o mea silisili ma le tāua tau i le Malo o le Atua i le lumanai.
- n: 10
  text: Matou te talitonu i le faapotopotoina moni o Isaraelu ma le toefuataiga mai o Ituaiga e Sefulu;
    ma o le a faatuina Siona (le Ierusalema Fou) i luga o le konetineta o Amerika; o le a nofotupu lava
    Keriso i le lalolagi; ma, o le a faafouina le lalolagi ma maua lona mamalu faaparataiso.
- n: 11
  text: Matou te taʼutino atu ua ia i matou le aiā tatau matou te tapuai atu ai i le Atua Mamana e tusa
    ai ma o matou lava lotofuatiaifo, ma ua matou tuuina atu foi lea lava aiā tatau i tagata uma, e faitalia
    i latou, pe faapefea, po o fea, po o le a foi le mea latou te tapuai atu i ai.
- n: 12
  text: Matou te talitonu i le usiusitai i tupu, peresitene, faipule, ma faamasino, i le usiusitai, faamamaluina,
    ma le lagolagoina o le tulafono.
- n: 13
  text: Matou te talitonu i le faamaoni, amiotonu, nofomama, agalelei, amiomama, ma le faia o mea lelei
    i tagata uma; e moni, e mafai ona matou faapea atu, ua matou mulimuli i le apoapoaiga a Paulo—Matou
    te talitonu i mea uma, matou te faamoemoe i mea uma, ua uma ona matou onosai i mea e tele, ma ua faamoemoe
    o le a mafai ona matou onosai i mea uma. Afai o i ai nisi mea e mamā, matagofie, pe logoleleia pe
    tauleleia, matou te saili atu i nei mea.
signature: Iosefa Samita.
