title: O Le Keriso Soifua
subtitle: O Le Molimau a le Au Aposetolo
author: O Le Ekalesia a Iesu Keriso o le Au Paia o Aso e Gata Ai
paragraphs:
- A o tatou faamanatuina le soifua mai o Iesu Keriso i le lua afe tausaga talu ai, matou te tuuina atu
  la matou molimau i le moni o Lona soifua lē mafaatusalia ma le aoga e lē gata mai o Lana taulaga togiola
  sili. E leai lava se isi ua i ai se aafiaga matua loloto na’uā o i latou uma na soifua ma o le a soifua
  ai i luga o le fogaeleele.
- O Ia o le Ieova Silisili o le Feagaiga Tuai, o le Mesia o le Feagaiga Fou. O Ia o lē na foafoaina le
  lalolagi, i lalo o le taitaiga a Lona Tama. “Na ia faia mea uma lava; e leai foi se mea e tasi na faia
  e le i faia e ia” (Ioane 1:3). E ui ina leai se agasala, ae na papatisoina o Ia ina ia faataunuu ai
  le amiotonu uma. Sa “femaliuai o ia ma agalelei” (Galuega 10:38), ae na lē amanaiaina o ia. O Lana talalelei
  o se savali o le filemu ma le agalelei. Na ia augani mai i tagata uma ina ia mulimuli atu i Lana faataitaiga.
  Na ia femaliuai i auala o Palesitina, e faamalolo i e mama’i, faapupula i e tauaso, ma faatutu mai e
  na oti. Na ia aoao atu upumoni o le faavavau, o le tulaga moni sa tatou i ai i le muai olaga, o le faamoemoega
  o lo tatou ola ai i le fogaeleele, ma le tulaga e mafai ona ausia e atalii ma afafine o le Atua i le
  olaga a sau.
- Na Ia faatuina le faamanatuga e avea ma faamanatu o Lana taulaga togiola sili. Na pue faapagotaina o
  Ia ma faasalaina i ni tuua’iga sese, na ta’usalaina ina ia faamalie ai le motu o tagata, ma faasalaina
  i le oti i luga o le satauro i Kalevario. Na Ia tuuina atu Lona soifua e togiola ai agasala a tagata
  uma. O Lana [taulaga] o se meaalofa sili foai fua mo i latou uma e soifua mai i luga o le fogaeleele.
- Matou te ta’utino atu i upu ma le faamaoni a’ia’i, o Lona soifua, lea e totonugalemu i le talafaasolopito
  o tagata uma, e le’i amataina mai i Peteleema pe faaiuina foi i luga o Kalevario. O Ia o le Ulumatua
  a le Tama, o le Alo Pele e Toatasi i la le tino, o le Faaola ia o le lalolagi.
- Na toe tu mai o Ia mai le tuugamau e “avea ma faapolopolo o e ua momoe” (1 Korinito 15:20). I Lona tulaga
  o se Alii Toetu, na Ia asiasi atu ai ia i latou na alofagia e ia i le olaga nei. Na ia asiasi atu foi
  i isi o Ana “mamoe” (Ioane 10:16) i Amerika anamua. I le lalolagi i nei ona po, na faaali atu ai o Ia
  ma Lona Tama i le taulealea o Iosefa Samita, i le amataga o le oo mai o le “sauniga i le faaatoaga o
  tausaga” (Efeso 1:10).
- 'Na tusia e le Perofeta o Iosefa e faatatau i le Keriso Soifua, “O ona fofoga e pei o le afi mumū; o
  lauao o lona ao sa papa’e e pei o le kiona mamā; o ona fofoga sa susulu e sili atu i lo le pupula o
  le la; ma o lona siufofoga sa pei o le leo o le tafe-taalili o vai tetele, o le siufofoga lava o Ieova,
  ua fetalai mai:'
- “O A’u lē muamua ma lē mulimuli; o A’u o lē o ola, o A’u o lē na fasia; o A’u o lo outou fautua i le
  Tamā” (MF&F 110:3–4).
- 'Na folafola mai foi e le Perofeta e uiga ia te Ia: “Ma o lenei, ina ua mavae le tele o molimau ua tuuina
  mai e uiga ia te ia, o le molimau mulimuli lenei, i molimau uma, ma te tuu atu e uiga ia te ia: O loo
  soifua o ia!'
- “Aua na ma vaai ia te ia, i le lima taumatau lava o le Atua; ma sa ma faalogo i le leo o molimau mai
  o ia o le Toatasi na Fanaua e le Tamā.
- “E faapea e ma ala mai ia te ia, ma o ia, ua i ai lalolagi ma na foafoaina, ma o e ua nonofo ai o atalii
  ma afafine fanauina mo le Atua” (MF&F 76:22–24).
- Matou te folafola atu i upu ma le faamaoni a’ia’i, ua toefuataiina mai i le fogaeleele Lana perisitua
  ma Lana Ekalesia—“ua atina’e i luga o le faavae o le au aposetolo, atoa ma le au perofeta, o le maa
  tulimanu o Iesu Keriso lava lea” (Efeso 2:20).
- Matou te ta’utino atu o le a i ai se aso e toe afio mai ai o Ia i le lalolagi. “Ona faaalia mai ai lea
  o le pupula o Ieova, e vaaia lava e tagata uma faatasi” (Isaia 40:5). O le a pule o Ia o le Tupu o Tupu
  ma nofo tupu foi o le Alii o Alii, ma o le a tootutuli tulivae uma ma tapua’i laulaufaiva uma ia te
  Ia. O le a tatou tutu atu taitoatasi ina ia faamasinoina e Ia e tusa ma a tatou galuega ma manaoga o
  o tatou loto.
- Matou te molimau atu, i le avea ai ma Ana Aposetolo ua faauuina i le ala e tatau ai—o Iesu o le Keriso
  Soifua, o le Alo tino ola pea o le Atua. O Ia o le Tupu silisili o Emanuelu, o loo afio i le taimi nei
  i le itu taumatau o Lona Tama. O Ia o le malamalama, o le ola, ma le faamoemoega o le lalolagi. Ia faafetaia
  le Atua mo le meaalofa lē mafaatusalia o Lona Alo paia lea.
