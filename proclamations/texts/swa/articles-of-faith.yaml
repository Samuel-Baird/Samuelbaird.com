title: Makala ya Imani
subtitle: ya Kanisa la Yesu Kristo la Watakatifu wa Siku za Mwisho
author: ''
verses:
- n: 1
  text: Tunaamini katika Mungu, Baba wa Milele, na katika Mwanawe, Yesu Kristo, na katika Roho Mtakatifu.
- n: 2
  text: Tunaamini kwamba wanadamu wataadhibiwa kwa ajili ya dhambi zao wenyewe, na siyo kwa ajili ya uvunjaji
    sheria wa Adamu.
- n: 3
  text: Tunaamini kwamba kwa njia ya Upatanisho wa Kristo, wanadamu wote wanaweza kuokolewa, kwa kutii
    sheria na ibada za Injili.
- n: 4
  text: 'Tunaamini kwamba kanuni na ibada za kwanza za Injili ni: kwanza, Imani katika Bwana Yesu Kristo;
    pili, Toba; tatu, Ubatizo kwa kuzamishwa kwa ajili ya ondoleo la dhambi; nne, Kuwekewa mikono kwa
    ajili ya kipawa cha Roho Mtakatifu.'
- n: 5
  text: Tunaamini kwamba mwanadamu ni lazima aitwe na Mungu, kwa unabii, na kwa kuwekewa mikono na wale
    walio katika mamlaka, ili kuhubiri Injili na kuhudumu katika ibada zake.
- n: 6
  text: Tunaamini katika muundo ule ule ambao ulikuwepo katika Kanisa la Asili, yaani, mitume, manabii,
    wachungaji, walimu, wainjilisti, na kadhalika.
- n: 7
  text: Tunaamini katika vipawa vya ndimi, unabii, ufunuo, maono, uponyaji, fasiri za ndimi, na kadhalika.
- n: 8
  text: Tunaamini Biblia kuwa ni neno la Mungu ilimradi imetafsiriwa kwa usahihi; pia tunaamini Kitabu
    cha Mormoni kuwa ni neno la Mungu.
- n: 9
  text: Tunaamini yale yote Mungu aliyoyafunua, na ambayo sasa anayafunua, na tunaamini kwamba bado Yeye
    atayafunua mambo mengi makuu na muhimu yahusuyo Ufalme wa Mungu.
- n: 10
  text: Tunaamini katika kukusanyika kiuhalisi kwa Israeli na katika urejesho wa Makabila Kumi; kwamba
    Sayuni (Yerusalemu Mpya) itajengwa katika ya bara la Marekani; kwamba Kristo atatawala yeye mwenyewe
    juu ya dunia; na, kwamba dunia itafanywa upya na kupokea utukufu wake wa kipepo.
- n: 11
  text: Tunadai haki ya kumwabudu Mungu Mwenyezi kulingana na mwongozo wa dhamiri zetu sisi wenyewe, na
    tunawaruhusu watu wote haki hiyo, na waabudu namna, mahali, au chochote watakacho.
- n: 12
  text: Tunaamini katika kuwa chini ya wafalme, marais, watawala, na waamuzi, katika kutii, kuheshimu,
    na kuzishika sheria.
- n: 13
  text: Tunaamini katika kuwa waaminifu, wakweli, wasafi, wakarimu, wema, na katika kufanya mema kwa watu
    wote; naam, twaweza kusema kwamba tumefuata maonyo ya Paulo—Tunaamini mambo yote, tunatumaini mambo
    yote, tumestahimili mambo mengi, na tunatumaini kuwa tutaweza kustahimili mambo yote. Kama kuna kitu
    chochote kilicho chema, chenye kupendeza, au chenye taarifa njema au chenye kustahili sifa, tunayatafuta
    mambo haya.
signature: Joseph Smith.
