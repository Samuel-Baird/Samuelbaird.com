title: Відновлення повноти євангелії Ісуса Христа
subtitle: Проголошення світові, присвячене двохсотій річниці цієї події
author: Перше Президентство і Рада Дванадцятьох Апостолів Церкви Ісуса Христа Святих Останніх Днів
note: Це проголошення було зачитано Президентом Расселом М. Нельсоном як частину його звернення на 190-й
  річній генеральній конференції 5 квітня 2020 року в Солт-Лейк-Сіті, шт. Юта.
paragraphs:
- Ми урочисто проголошуємо, що Бог любить Своїх дітей у кожній країні світу. Даром Бога Батька для нас
  є божественне народження, незрівнянне життя і нескінченна спокутна жертва Його Улюбленого Сина, Ісуса
  Христа. Силою Батька Ісус піднявся знову й отримав перемогу над смертю. Він — наш Спаситель, наш Взірець
  і наш Викупитель.
- Двісті років тому, чудового весняного ранку 1820 року, юний Джозеф Сміт, прагнучи дізнатись, до якої
  церкви йому приєднатися, пішов помолитися в гай, що був неподалік його дому в північній частині штату
  Нью-Йорк, США. У нього були запитання стосовно спасіння його душі, і він вірив у те, що Бог направить
  його.
- Ми зі смиренням проголошуємо, що у відповідь на його молитву Бог Батько і Його Син, Ісус Христос, явилися
  Джозефу та розпочали те “відновлення всього” (Дії 3:21), про яке пророковано у Біблії. У цьому видінні
  він дізнався, що після смерті першопокликаних апостолів Христову новозавітну Церкву було втрачено на
  землі. Джозеф буде знаряддям в її поверненні.
- Ми підтверджуємо, що під керівництвом Батька і Сина небесні посланці являлися, щоб навчати Джозефа та
  знову встановити Церкву Ісуса Христа. Воскреслий Іван Христитель відновив повноваження христити зануренням
  для відпущення гріхів. Троє з першопокликаних дванадцятьох апостолів — Петро, Яків та Іван — відновили
  апостольство і ключі повноваження священства. Являлися також і інші, зокрема Ілля, який відновив повноваження
  зʼєднувати сімʼї назавжди у вічних стосунках, які продовжуються і після смерті.
- 'Ми також свідчимо, що Джозефу Сміту було дано дар і силу Бога перекласти давній літопис — Книгу Мормона:
  Ще одне свідчення про Ісуса Христа. Сторінки цього священного тексту містять розповідь про особисте
  священнослужіння Ісуса Христа серед людей у Західній півкулі невдовзі після Його Воскресіння. Ця книга
  навчає про мету життя та пояснює доктрину Христа, яка є основною для досягнення тієї мети. Книга Мормона
  як Писання-супутник Біблії свідчить, що всі люди є синами і дочками люблячого Небесного Батька, що Він
  має божественний план для нашого життя і що Його Син, Ісус Христос, промовляє сьогодні, як і в дні давнини.'
- Ми проголошуємо, що Церква Ісуса Христа Святих Останніх Днів, яка була організована 6 квітня 1830 року,
  є відновленою новозавітною Христовою Церквою. Основну увагу ця Церква зосереджує на досконалому житті
  її наріжного каменя — Ісуса Христа, на Його нескінченній Спокуті та буквальному Воскресінні. Ісус Христос
  знову покликав апостолів і дав їм повноваження священства. Він запрошує всіх нас прийти до Нього і Його
  Церкви, отримати Святого Духа, спасительні обряди і здобути нескінченну радість.
- Вже минуло двісті років відтоді, як це Відновлення було розпочате Богом Батьком та Його Улюбленим Сином,
  Ісусом Христом. Мільйони людей по всьому світу дізналися про ці пророковані події.
- Ми з радістю проголошуємо, що обіцяне Відновлення продовжується й далі через триваюче одкровення. Земля
  вже ніколи не буде знову такою ж, коли Бог “усе обʼєдна[є] в Христі” (Ефесянам 1:10).
- З благоговінням і вдячністю ми, Його апостоли, запрошуємо всіх дізнатися — як знаємо ми, — що небеса
  відкриті. Ми підтверджуємо, що Бог робить відомою Свою волю Своїм улюбленим синам і дочкам. Ми свідчимо,
  що ті, хто з молитвою вивчатиме це послання про Відновлення і діятиме з вірою, будуть благословенні
  отримати своє власне свідчення про його божественність і його мету — підготувати світ до обіцяного Другого
  пришестя нашого Господа і Спасителя, Ісуса Христа.
