title: Живий Христос
subtitle: Свідчення апостолів
author: Церква Ісуса Христа Святих Останніх Днів
paragraphs:
- Вшановуючи народження Ісуса Христа дві тисячі років тому, ми складаємо свідчення про реальність Його
  незрівнянного життя і безмежну доброчесність Його великої спокутної жертви. Ніхто інший не мав такого
  глибокого впливу на всіх, хто жив і буде жити на землі.
- Він був Великим Єговою Старого Завіту і Месією Нового Завіту. Під проводом Свого Батька Він створив
  землю. “Усе через Нього повстало, і ніщо, що повстало, не повстало без Нього” (Іван 1:3). Будучи безгрішним,
  Він охристився, аби виповнити всю праведність. Він “ходив…, добро чинячи” (Дії 10:38), але Його зневажали
  за це. Його євангелія була посланням миру і доброї волі. Він закликав усіх наслідувати Його приклад.
  Він ходив шляхами Палестини, зцілюючи хворих, даючи сліпим зір і воскрешаючи мертвих. Він вчив про істини
  вічності, реальність нашого доземного існування, мету нашого життя на землі та потенціал синів і дочок
  Бога у житті прийдешньому.
- Він запровадив причастя як нагадування про Свою велику спокутну жертву. Його було схоплено і засуджено
  на підставі облудних звинувачень, визнано винним, аби задовольнити натовп, і вироком для Нього була
  смерть на Голгофському хресті. Він віддав Своє життя, аби спокутувати гріхи всього людства. Він був
  великим вікарним даром заради всіх, хто жив, хто живе і хто житиме на землі.
- Ми урочисто свідчимо, що Його життя, яке є головною подією усієї історії людства, не почалося у Віфлеємі
  і не закінчилося на Череповищі. Він був Першонародженим від Батька, Єдинонародженим Сином у плоті, Викупителем
  світу.
- Він воскрес з могили, щоб стати “первіст[ком] серед покійних” (1 Коринтянам 15:20). Як воскреслий Господь,
  Він відвідав тих, кого любив за життя. Він також священнослужив серед Своїх “інших овець” (Іван 10:16)
  у давній Америці. У наш час Він та Його Батько явилися юнакові Джозефу Сміту, відкривши обіцяний з давніх
  давен “розподіл повноти часів” (див. Ефесянам 1:10).
- 'Пророк Джозеф написав про Живого Христа: “Його очі були наче полумʼя вогненне; волосся на Його голові
  було біле, наче чистий сніг; Його обличчя сяяло яскравіше сонця, а Його голос був немов шум великих
  вод, саме голос Єгови, Який мовив:'
- “Я перший і останній; Я Той, Хто живе, Я Той, Кого було вбито; Я ваш заступник перед Батьком” (УЗ 110:3–4).
- 'Пророк також проголосив про Нього: “І тепер, після багатьох свідчень, які було дано про Нього, ось
  свідчення, останнє з усіх, яке ми даємо про Нього: Що Він живе!'
- “Бо ми бачили Його, саме праворуч Бога; і ми чули голос, що засвідчив, що Він є Єдинонародженим від
  Батька —
- “Що Ним, і через Нього, і від Нього світи є та було створено, і жителі їхні є синами й дочками, народженими
  Богові” (УЗ 76:22–24).
- Ми проголошуємо урочистими словами, що Його священство і Його Церкву було відновлено на землі — “збудован[у]
  на основі апостолів і пророків, де наріжним каменем є Сам Ісус Христос” (Ефесянам 2:20).
- Ми свідчимо, що одного дня Він повернеться на землю. “І зʼявиться слава Господня, і разом побачить її
  кожне тіло” (Ісая 40:5). Він правитиме як Цар над царями і царюватиме як Господь над панами, і кожне
  коліно схилиться та кожний язик промовлятиме у поклонінні перед Ним. Кожен з нас постане перед Ним,
  і Він судитиме нас згідно з нашими діяннями і прагненнями наших сердець.
- Ми свідчимо як Його належно висвячені апостоли, — що Ісус є Живим Христом, безсмертним Сином Бога. Він
  — великий Цар Еммануїл, Який сьогодні стоїть праворуч Свого Батька. Він є світлом, життям і надією світу.
  Його шляхом є шлях, що веде до щастя в цьому житті і вічного життя у світі прийдешньому. Дяка Богові
  за незрівнянний дар Його божественного Сина!
