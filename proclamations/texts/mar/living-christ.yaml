title: जिवंत ख्रिस्त
subtitle: प्रेषितांची साक्ष
author: अखेरच्या काळातील संतांचे येशू ख्रिस्ताचे चर्च
paragraphs:
- जसे आपण दोन हजार वर्षांपूर्वी येशू ख्रिस्ताच्या जन्माचे स्मरण करत आहोत, तसेच आम्ही त्याच्या अतुलनीय
  जीवनाच्या वास्तवतेची आणि त्याच्या महान प्रायश्चित्ताच्या अमर्याद सामर्थ्याची साक्ष देतो. पृथ्वीवर जगलेल्या
  आणि राहणार्‍या सर्वांवर इतका खोल परिणाम इतर कोणीही केलेला नाही.
- तो जुन्या करारातील महान यहोवा होता, आणि नवीन कराराचा मशीहा. आपल्या पिता ह्यांच्या मार्गदर्शनाखाली त्याने
  पृथ्वीची निर्मिती केली. “सर्व गोष्टी त्याच्याद्वारे बनविल्या गेल्या होत्या; आणि त्याच्याशिवाय कोणतीही
  वस्तू बनलेली नव्हती जी बनविली गेली” (योहान १:३). तो पापरहित असूनही, सर्व धार्मिकता पूर्ण करण्यासाठी
  त्याने बाप्तिस्मा घेतला. “तो चांगले काम करत गेला” (प्रेषितांची कृत्ये १०:३८), तरीही त्याचा तिरस्कार
  झाला. त्याची सुवार्ता शांती आणि सद्भावनेचा संदेश होती. त्याने सर्वांना त्याच्या उदाहरणाचे अनुसरण करण्याची
  विनंती केली. तो पॅलेस्टाईनच्या रस्त्यांवरून चालत गेला, आजारी लोकांना बरे करत होता, आंधळ्यांना दृष्टी
  देत होता, आणि मृतांना पुन्हा जिवंत करत होता. त्याने अनंतकाळाची सत्ये, पृथ्वीवरील आपल्या जीवनाचा उद्देश,
  परमेश्वरच्या मुलांच्या आणि मुलींच्या क्षमता, आपल्या शाश्वत अस्तित्वाची वास्तविकता, आणि पुढील जीवन शिकवले.
- त्याने आपल्या महान प्रायश्चित्त बलिदानाची आठवण म्हणून प्रभू भोजन स्थापना केले. त्याला अटक झाली आणि खोट्या
  आरोपांवर त्याला दोषी ठरवण्यात आले. जमावाचे समाधान करण्यासाठी त्याच्यावर खटला चालवण्यात आला आणि कलवरीच्या
  वधस्तंभावर मृत्युदंड ठोठावण्यात आला. त्याने संपूर्ण मानवजातीच्या पापांचे प्रायश्चित्त करण्यासाठी आपले
  जीवन दिले. त्याचे जीवन हे पृथ्वीवर जगलेल्या, सध्या जगणाऱ्या आणि भविष्यात जगणाऱ्या सर्वांसाठी एक महान
  प्रतिनिधित्व देणगी होती.
- आम्ही प्रामाणिकपणे साक्ष देतो की त्याचे जीवन, जे संपूर्ण मानवी इतिहासाच्या केंद्रस्थानी आहे, ना बेथलेहेममध्ये
  सुरू झाले, ना कलवरी येथे संपले. तो पिता ह्यांचा पहिला पुत्र होता, देहामध्ये जन्मलेला एकुलता एक पुत्र,
  आणि जगाचा तारणहार होता.
- तो मेलेल्यांतून उठला आणि “झोपलेल्यांचे प्रथम फळ बनला” (१ करिंथकर १५:२०). उठलेल्या प्रभू म्हणून, त्याने
  आपल्या पृथ्वीवरील जीवनात ज्या व्यक्तींवर प्रेम केले होते त्यांच्यासोबत भेट दिली. त्याने प्राचीन अमेरिकेतील
  त्याच्या “इतर मेंढरांमध्ये” (योहान १०:१६) सेवा केली.आधुनिक जगात, तो आणि त्याचे पिता जोसेफ स्मिथ या मुलासमोर
  प्रकट झाले आणि “काळाच्या परिपूर्णतेचे वितरण” (इफिसकर १:१०) सुरू केले, जे खूप दिवसांपासून वचन दिले गेले
  होते.
- 'जिवंत ख्रिस्ताविषयी, प्रेषित जोसेफ यांनी लिहिले: “त्याचे डोळे अग्नीच्या ज्वालासारखे होते; त्याच्या
  डोक्याचे केस शुद्ध बर्फासारखे पांढरे होते; त्याचा चेहरा सूर्याच्या तेजापेक्षा अधिक उजळ होता; आणि त्याचा
  आवाज मोठ्या पाण्याच्या वाहत्या आवाजासारखा होता, अगदी यहोवाच्या वाणीप्रमाणे, म्हणत:'
- “मी पहिला आणि शेवटचा आहे; जो जिवंत आहे तो मीच आहे; जो मारला गेला तो मीच आहे; मी पिता जवळ तुमचा वकील
  आहे” (D&C ११०:३–४).
- 'त्याच्याबद्दल, प्रेषितांनी असेही घोषित केले: “आणि आता, त्याच्याबद्दल इतर लोकांनी दिलेल्या अनेक साक्षांनंतर,
  ही सर्वांत शेवटची साक्ष आहे जी आम्ही त्याच्याबद्दल देतो: तो जिवंत आहे!'
- कारण आम्ही त्याला पाहिले, अगदी परमेश्वराच्या उजवीकडे; आणि आम्ही त्या आवाजाला ऐकले ज्याने साक्ष दिली
  की तो पिता ह्यांचा एकुलता एक पुत्र आहे—
- आणि त्याच्याद्वारे, आणि त्याच्याद्वारे, आणि त्याच्याशी, जग निर्माण झाले आणि निर्माण केले गेले, आणि त्यातील
  रहिवासी परमेश्वराला मुलगा आणि मुलगी आहेत” (D&C ७६:२२–२४).
- आम्ही गंभीरतेच्या शब्दात जाहीर करतो की त्याचे याजकपद आणि त्याचे चर्च पृथ्वीवर पुनर्संचयित केले गेले
  आहे—“प्रेषित आणि संदेष्ट्यांच्या पायावर बांधले गेले आहे, येशू ख्रिस्त स्वतः मुख्य कोनशिला आहे” (इफिसकर
  २:२०).
- आम्ही साक्ष देतो की तो कधीतरी पृथ्वीवर परत येईल. “आणि प्रभूचे तेज प्रकट होईल, आणि सर्व जन ते एकत्र पाहतील”
  (यशया ४०:५). तो राजांचा राजा म्हणून राज्य करेल आणि प्रभुंचा प्रभु म्हणून राज्य करेल, आणि प्रत्येक गुडघा
  वाकवेल आणि प्रत्येक जीभ त्याच्यापुढे उपासनेत बोलेल. आपल्या कृतीनुसार आणि आपल्या अंतःकरणाच्या इच्छेनुसार
  आपल्यापैकी प्रत्येकाचा त्याच्याकडून न्याय केला जाईल.
- आम्ही साक्ष देतो, त्याच्या विधिवत नियुक्त प्रेषितांप्रमाणे—की येशू हा जिवंत ख्रिस्त आहे, परमेश्वराचा
  अमर पुत्र आहे. तो महान राजा इमॅन्युएल आहे, जो आज आपल्या पिता ह्यांच्या उजवीकडे उभा आहे. तो प्रकाश, जीवन
  आणि जगाची आशा आहे. त्याचा मार्ग हा ह्या जीवनात आनंद आणि पुढील जीवनात अनंतकाळचे जीवन मिळवणारा मार्ग आहे.
  परमेश्वराचे आभार मानले पाहिजेत त्यांच्या दैवी पुत्राच्या अतुलनीय देणगीसाठी.
