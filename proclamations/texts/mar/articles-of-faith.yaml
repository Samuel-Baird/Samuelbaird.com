title: चे विश्वासाचे लेख
subtitle: अखेरच्या काळातील संतांचे येशू ख्रिस्ताचे चर्च
author: ''
verses:
- n: 1
  text: आम्ही परमेश्वर, शाश्वत पिता ह्यांच्यावर, आणि त्यांचे पुत्र येशू ख्रिस्तावर आणि पवित्र आत्म्यावर
    विश्वास ठेवतो.
  label: १
- n: 2
  text: आम्ही विश्वास ठेवतो की माणसांना त्यांच्या स्वतःच्या पापांसाठी शिक्षा होईल, आदामाच्या अपराधासाठी
    नाही.
  label: २
- n: 3
  text: आम्ही विश्वास ठेवतो की ख्रिस्ताच्या प्रायश्चित्ताद्वारे, सुवार्तेच्या नियम व विधींचे पालन केल्यास,
    सर्व मानवजातीचे तारण होऊ शकते.
  label: ३
- n: 4
  text: 'आम्ही विश्वास ठेवतो की सुवार्तेची पहिली तत्त्वे व विधी हे आहेत: पहिले, प्रभु येशू ख्रिस्तावर
    विश्वास;दुसरे, पश्चात्ताप; तिसरे, पापांच्या क्षमेसाठी बुडवून बाप्तिस्मा; चौथे, पवित्र आत्म्याचे वरदान
    मिळण्यासाठी हात ठेवणे.'
  label: ४
- n: 5
  text: आम्ही विश्वास ठेवतो एखाद्या माणसाला परमेश्वराकडून, भविष्यवाणीद्वारे आणि अधिकारपदावर असलेल्यांनी
    हात ठेवून, सुवार्तेचा प्रचार करण्यासाठी आणि त्याचे नियम पाळण्यासाठी पाचारण केले पाहिजे.
  label: ५
- n: 6
  text: आम्ही आदिम चर्चमध्ये अस्तित्वात असलेल्या त्याच संघटनेवर विश्वास ठेवतो, म्हणजेच प्रेषित, संदेष्टे,
    पाळक, शिक्षक, सुवार्तिक आणि असेच इतर.
  label: ६
- n: 7
  text: आम्ही जिभेची देणगी’, भविष्यवाणी, प्रकटीकरण, दृष्टांत, आरोग्य, जीभांच्या भाषेचे भाषांतर, आणि अशा
    इतर गोष्टींवर विश्वास ठेवतो.
  label: ७
- n: 8
  text: आम्ही पवित्र शास्त्र जोपर्यंत ते योग्यरित्या भाषांतरित केले आहे; ते परमेश्वराचे वचन मानतो; आपण
    मॉर्मनचे पुस्तक देखील परमेश्वराचे वचन मानतो.
  label: ८
- n: 9
  text: आम्ही परमेश्वराने जे काही प्रकट केले आहे, ते आता जे काही प्रकट करतात त्यावर आम्ही विश्वास ठेवतो
    आणि परमेश्वराच्या राज्याशी संबंधित अनेक महान आणि महत्त्वाच्या गोष्टी ते पुढेही प्रकट करतील असा आमचा
    विश्वास आहे.
  label: ९
- n: 10
  text: आम्ही इस्राएलच्या प्रत्यक्ष एकत्रीकरणावर आणि दहा जमातींच्या पुनर्स्थापनेवर विश्वास ठेवतो; सायोन
    (नवीन यरुशलेम) अमेरिकन खंडावर उभारली जाईल असा आमचा विश्वास आहे; ख्रिस्त पृथ्वीवर प्रत्यक्षपणे राज्य
    करील; आणि पृथ्वीचे नूतनीकरण होऊन तिला तिचे स्वर्गसदृश वैभव प्राप्त होईल, असा आम्ही विश्वास ठेवतो.
  label: १०
- n: 11
  text: आम्ही स्वतःच्या विवेकाच्या आदेशानुसार सर्वशक्तिमान परमेश्वराची उपासना करण्याचा विशेषाधिकार आम्ही
    स्वीकारतो आणि सर्व लोकांना समान विशेषाधिकार देतो, त्यांना कसे, कुठे किंवा काय करू शकते याची उपासना
    करू द्या.
  label: ११
- n: 12
  text: आम्ही राजे, राष्ट्रपती, शासक आणि दंडाधिकाऱ्यांच्या अधीन राहण्यात, कायद्याचे पालन करण्यात, सन्मान
    करण्यात आणि टिकवून ठेवण्यात विश्वास ठेवतो.
  label: १२
- n: 13
  text: आम्ही प्रामाणिक, सत्यनिष्ठ, शुद्ध, परोपकारी, सद्गुणी राहण्यावर आणि सर्व लोकांशी चांगले वागण्यावर
    विश्वास ठेवतो; खरं तर, आम्ही पौलाच्या उपदेशाचे पालन करतो असे म्हणू शकतो—आम्ही सर्व गोष्टींवर विश्वास
    ठेवतो, सर्व गोष्टींची आशा धरतो, अनेक गोष्टी सहन केल्या आहेत, आणि सर्व गोष्टी सहन करण्यास सक्षम होऊ
    अशी आशा करतो. जर काही सद्गुणी, मनोहर, चांगल्या कीर्तीचे किंवा स्तुत्य असेल, तर आम्ही त्यांचा शोध घेतो.
  label: १३
signature: जोसेफ स्मिथ.
