title: Ekkewe Nongonongen Achifoua
subtitle: ren Ewe Mwichefenin Jises Kraist ren Aramas mi Pin non Fansoun Soponon
author: ''
verses:
- n: 1
  text: Sia nuku non Kot, ewe Sam Esemuch, me Noun We, Jises Kraist, me ewe Ngun mi Fen.
- n: 2
  text: Sia nuku pwe aramas repwe pwisin tipisini tipisir ren ar tipis, nge esapw ren an Adam we anea
    sonap.
- n: 3
  text: Sia nuku pwe seni ewe Achasefanin Kraist, aramas meinisin repwe kuna manau, ren ar aneasochisi
    ekkewe annuk me angangepin an ewe Kapas Allim.
- n: 4
  text: 'Sia nuku pwe ewe aewin nongonong me angangepin an ewe Kapas Allim: ewin, Nuku non ewe Samon Jises
    Kraist; oruan, Aier; eunungatin, Papatais ren mono non konik ren omusomusen tipis; eruanun, Ewe nifangen
    Ngun mi Fen seni iseta paw won mokur.'
- n: 5
  text: Sia nuku pwe aramas repwe koko seni Kot, seni osini, me seni ewe iseta paw won mokur seni ekkewe
    mi wor ar mumuta, pwe repwe afanafana ewe Kapas Allim me anganga angangepin.
- n: 6
  text: Sia nuku non ewe pwan chok tetten a fis non ewe Wesewesen Mwichefen, ren, aposel, soufos, chon
    masen siip, sense, chon afanafan, me soposopono.
- n: 7
  text: Sia nuku non ekkewe nifangen kapas, osini, pwarata, nepasepwi, echikar, awewei kapas, me soposopono.
- n: 8
  text: Sia nuku ewe Paipen pwe ina ewe kapasen Kot ika pwe ewe awewen mei pung; sia pwan nuku ewe Puken
    Mormon pwe kapasen Kot.
- n: 9
  text: Sia nuku mettoch meinisin Kot a pwarano, mettoch meinisin I a pwarano iei, me sia nuku pwe I epwe
    pwan pwarano chommong mettoch mi amwarar me auchea fan asengesin ewe Muun Kot.
- n: 10
  text: Sia nuku non ewe ennetin chusefanin Israel me non niwin sefanin ekkewe Engon Einang; pwe Zion
    (ewe Minafon Jerusalem) epwe foruta non ewe eif Merika; pwe Kraist epwe pwisin nemenem won ewe fonufan;
    me, ewe fonufan epwe sofo sefan me angei an ningen paratais.
- n: 11
  text: Sia etiwa ewe tufichin fen ngeni ewe Kot Napanap anongonong won emmwenin ach nuku, me mut ngeni
    aramas meinisin ewe pwan chok tufich, mut ngeni ir repwe fen ngeni non napanapan, ian, are met ra
    mochen.
- n: 12
  text: Sia nuku non ach sipwe nom fan nemenemen ekkewe king, preseten, sou emmwen, me ekkewe samon, ren
    aneasochis, sufon, me aponueta ekkewe annuk.
- n: 13
  text: Sia nuku non ach sipwe wenechar, ennet, nimenimoch, kirekiroch; nimenimoch seni nisou, me non
    ach fofforoch ngeni aramas meinisin; ennetin, sia tongeni apasa pwe sia tapweno mwirin ewe ourour
    an Paul—Sia nuku mettoch meinisin, sia epinukunuk mettoch meinisin, sia fen engino ngeni chommong
    mettoch, me epinukunuk pwe sipwe tongeni engino ngeni mettoch meinisin. Ika pwe epwe wor och mettoch
    mi nimenimoch seni nisou, murino, are óch porousan are mwirino, sia tapweno mwirin ekkei mettoch.
signature: Joseph Smith.
