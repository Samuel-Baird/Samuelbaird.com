title: Ewe Famini
subtitle: Eu Esinesin ngeni ewe Fonufan
author: Ewe Aewin Presetensi me ewe Mwichen Engon me Ruemon Aposel seni Ewe Mwichefenin Jises Kraist ren
  Aramas mi Pin non Fansoun Soponon
note: Preseten Gordon B. Hinckley a anneani ei esinesin pwe eu kinikinin an poraus me non ewe Mwichenapen
  Fin Anisi mi fis non September 23, 1995, non Salt Lake City, Utah.
paragraphs:
- Am, ewe Aewin Presetensi me ewe Mwichen Engon me Ruemon Aposel seni Ewe Mwichefenin Jises Kraist ren
  Aramas mi Pin non Fansoun Soponon, aua pwäratä pwe pupunu nefinan emon mwan me emon fefin mi kefinita
  me ren Kot me ewe famini mi popunapen ewe kokkot an ewe Chon Föri ren fetanin manauen Noun kewe semirit
  feinfeino.
- Meinisin aramas—mwan me fefin—ra för non nikinikin Kot. Emon me emon at ika nengin non pekin ngun mi
  achengicheng noun sam me in me won nang, me, usun chok, emon me emon a wor pusin nonnomun napanapan
  me fetanin manauan. Sokofesinin kich mi eu auchean napanapen nikinikin emon me mwan ei manau me, manau
  won ei fonufan, me nonnomun ir ion esemuch me popun.
- Non fansoun me mwen ei manau, at me nengin non pekin ngun ra sinei me ra pin ngeni Kot pwe I Semer we
  Esemuch me ra etiwa An kokkot ewe minne Noun kewe semirit ra tongeni angei eu inis me kaeo me won ewe
  fonufan me fefeita ngeni ar repwe unusoch me ra tongeni sinei fetanin manauer pwe ir repwe weri manau
  esemuch. Ewe kokkoten pwapwa mi atufichi chiechi non famini ne sopweno pekinon mano. Angangepin me pwon
  mi pin a fis me non ekkewe tempel me ra atufichi ngeni aramas ar repwe niwinsefan ngeni mwen mesen Kot
  me famini repwe tongeni chufengen ren fansoun esemuch.
- Ewe aewin annuk Kot a ngeni Atam me If fan asengesin ar tufichin winiti sam me in usun mwan me fefin
  mi pupunu. Aua pwäratä pwe an Kot we annuk fan iten Noun kewe semirit repwe nounoutiw me amasowa fonufan
  mi chok chuen pochokun. Aua pwan pwäratä pwe Kot a annuku pwe ekkewe manamanen nounou semirit repwe
  chok fis nefinen emon mwan me emon fefin, mi pupunu fengen fan pungun annuk.
- Aua pwäratä pwe ewe napanap minne manau mi för mi kefinita seni nang. Aua pwäratä pwe manau mi pin me
  mi pwan auchea non an Kot we kokkot esemuch.
- Mwan me fefin mi pupunu mi wor wiser ar repwe tongei me tumunu fengenir me pwan nour kewe semirit. “Ekkewe
  semirit eu niffang seni ewe Samon” (Kon Fel 127:3). Mi wor eu wisen sam me in mi pin pwe repwe amari
  nour kewe semirit non tong me wenewen, ne awora met mi namot fan iter non pekin inis me non pekin ngun,
  me aitir ar repwe tongei me angang ngeni emon me emon, anneasosichi ekkewe annukun Kot, me anneasosichi
  ekkewe annukun muu non fonuer we. Mwan me fefin mi pupunu—sam me in—repwe pwisin kapunguno me mwen Kot
  ren fisitan ekkei wis.
- Ewe famini mi kefinita me renKot. Pupunu nefinen mwan me fefin mi eu mettoch mi namot ngeni An we kokkot
  esemuch. Semirit a wor ar pung ar repwe uputiw non eu famini mi chufengen ren apupunu, me repwe mamarita
  fan emwenien emon sam me emon in ekkewe ir mi ennetin aucheani ar kewe pwonen apupunu ren föfför ennet.
  Pwapwa non manauen famini mi tongeni pwonuta nupwen mi kouta won an ewe Samon Jises Kraist kewe afanafan.
  Fetan ochun pupunu me famini a fisiochuta me mamarita won ekkewe nongonongen nuku, iotek, aier, omusomus,
  sufon, tong, angang, me mokutukutun angangen apochokunen inis. Seni kokkoten nang, ekkwe sam repwe wisen
  nemeni ar we famini non tong me wenechar me repwe wisen awora met mi namot ren manauen me tumunun ar
  we famini. Ekkewe in ra wisen tumunu nour kewe semirit. Non ekkei wis mi pin, sam me in repwe aninis
  fengen pwe ir mi chok nonnofengen. Terin inis, mano, are pwan ekkoch mettoch mi tongeni ekkesiwini ekkei
  wis. Pwan ekkoch chon ekkewe famini repwe awora aninis nupwen mi namot.
- Sia esinesin pwe aramas ion mi atai ekkewe annukun nimenimoch, ion mi ninni ngawei nour kewe semirit
  are punuer kewe, are rese apwonueta wiser kewe non ewe famine eu ran repwe angei niwinin me uta mwen
  mesen Kot. Soposopono, aua esinesin ngeni kemi pwe paras fesenin ewe famini epwe efisata won aramas,
  sopw, me eif ekkewe osukosuk ekkewe soufosun nom me soufosun ikenai ra fen pwäratä.
- Aua kökköri ekkewe aramas, me chon angangen muun ekis meinisin ar repwe apochokuna ekkenamokutukut ra
  foruta ar repwe anapano me apochokuna ewe famini pwe ina ewe kinikinin nongonongun neni me aramas.
