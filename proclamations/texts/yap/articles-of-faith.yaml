title: Fapi Kenggin Likʼngin e Mich ko Fare Galasia Ku Yesus Kristus ni Fan ko Gidiiʼen Got ko Tin Tomur
  e Rran
subtitle: ''
author: ''
verses:
- n: 1
  text: Ba mich u wunʼmad ni bay Got, ni Chitmangiy ni Machalbog, nge Fak ni Jesus Kristus, nge Fare Kan
    ni Thothup.
- n: 2
  text: Ba mich u wunʼmad ni bay ni gechig nag e gidii ni bachan e denen rorad, ma gathi bachan Adam ni
    thab e motochiyal.
- n: 3
  text: Ba mich u wanʼmad ni bachan e Bayul ni pi Kristus, ma gubin e gidii ma rayog ni ngar pateged e
    yafos ni manemus u daken e motochiyal ni unfol riy ni gubin nge machiben e Gospel.
- n: 4
  text: 'Ba mich u wanʼmad ni tin ni mʼon i kenggin likʼngin machiben e Gospel e: bin taʼareb, Nge mich
    u wunʼiy somol ni Jesus Kristus; bin lʼagruw, Ngan kalngan; bin dalip, Taufe u maren nge mʼay machan
    e pi denen; bin aningeg, Taʼpaay nga daken lolgey ngan piʼe tawaʼath ko Kan Thothup.'
- n: 5
  text: Ba mich u wanʼmad ni gidii e thingari yib e pong rokʼ Got ngakʼ u daken e pi profet ni wol rogon
    ni kan midil nag, ngan tay paʼay nga daken lolgey, ni piʼin ni bay matowrad, ni nge machib nag e Gospel
    nge pi gaming nge rogon e motochiyal ni bay.
- n: 6
  text: Ba mich u wanʼmad ni taʼab gamʼing e yibe rin ko Galasia ni Kakrom nge tin chiney, pong ngaehol,
    pi apostal, pi profet, pi pastor, pi sensey, pi evangelist, nge ku boch ra-rogon e ngongolen e galasia.
- n: 7
  text: Ba mich u wanʼmad ni kan pii e tawaath u balowthey, tini yibe yog ni bay buch, thin rok Got ni
    be yib, changar ni be thilthil, fasagey ko liliy, nge rogon i pilpilyeg e thin u balowthey, nge ku
    boch banʼen.
- n: 8
  text: Ba mich u wanʼmad ni Bible ni kan pilyeg ni ba matʼaw e thin rokʼ Got; ma kub mich u wanʼmad ni
    Babiyor ku Mormon e thin rokʼ Got.
- n: 9
  text: Ba mich u wanʼmad gubin e pinʼen ni yib rok Got ni i weliy, nge gubin ni ke yib ne ke weliy e
    chiney, ma ba mich u wanʼmad ni bay i weliy boch ni thʼab i gaʼ falngin nge boch ni rib gaʼ fan banen
    ni gamʼingin Gilʼilungun Got.
- n: 10
  text: Ba mich u wanʼmad rib riyulʼ ni bay ni ulunguy piyu Israel ma bay ni fulweg nga yalen fa Ragag
    i Ganong; ma Zion (fa bin Beʼech e Yerusalem) e bay ni toy nga daken e nam nu Mariken; me kristus
    e bay suwey e Fayleng; ma Fayleng e bay ki beʼech me suguy e maluplup ni paradis.
- n: 11
  text: Gamad be yog nib puf matʼawon e liyor ngak Got ni gubin ma rayog rok ni wod rogon ni be yiluy
    laniyanʼ mad ngomad, nge kuʼer ngak gubin e gidii ni taareb rogon matawrod, yad rorad ko rogon e liyor
    rorad ko pinen ara rogon fa gin ni ngar liyor gad ngay.
- n: 12
  text: Ba mich u wanʼmad ni kan dugliy ni ke mil famad nga tan paʼ e pi pilung, nge pi presedent, nge
    pi tasuwon, nge pi mite thin ni nguʼun fol muun taʼ farad mini kol ayuwen e motochiyal.
- n: 13
  text: Ba mich u wanʼmad ni nguʼug yulʼyul gad, mad muʼug weliyed e tin nib yalen, nge tin tamilang,
    muʼug gol gad, muʼug matʼaw niged gamad, nguʼug rinʼed e tin nib felʼ ngakʼ urngin e gidii; thingar
    gogned ni nguʼug folgad ko tini chiyliy Paul—Ere ba mich u wanʼ mad gubin, banʼen ma gamad be athpeg
    gubin banen, kagu yunʼuyed boor banʼen, ma athap romad e yigiyog ni gu yunʼuyed gubin banʼen nib felʼ.
    Faʼanra bay banen nib tamilang gamʼingin, ma ba felʼ matʼawon fa manging, ni felʼ bugwan, ma aram
    e pinenʼ ni gamad be gay.
signature: Joseph Smith.
