title: Vishwaas ke Vishye Ishu Masih Ka Girjaghar Antim-dino Ke Santho Ka
subtitle: ''
author: ''
verses:
- n: 1
  text: Hum Pitah Parmeshwar mei, aur unke Putr Ishu Masih mei, aur Pavitr Aatma mei vishwaas karte hai.
- n: 2
  text: Hum vishwaas karte hai ki manushya apne hi paapo ke liye dand bhogenge, aur Adam ke ulanghan ke
    liye nahi.
- n: 3
  text: Hum vishwaas karte hai ki Masih ke Balidaan ke duara, sabhi manushya bach sakege, jab veh Susmachaar
    ke kanoon ka agyakaari banege aur dharam vidhi ko apnayege.
- n: 4
  text: 'Hum vishwaas karte hai ki susmachaar ka sidhant aur dharam vidhi hai: pahela, Ishu Masih par
    Vishwaas; dusra, Paschyataap; teesra, paapo se chama paane ke liye paani mei puri tarah se dubo kar
    Baptisma lena; chautha, Sar par haath rakh kar Pavitr Aatma ka taufa dena.'
- n: 5
  text: Hum vishwaas karte hai ki manushya ko Parmeshwar bulata hai, bhavis suchna se, aur jinke paas
    sahi adhikaar hai unke duara sar par haath rakh kar, Susmachaar prachaar karne ke liye aur dharam
    vidhi dene ke liye.
- n: 6
  text: Hum vishwaas karte hai usi sanghatan mei jo Prachin Girja mei tha, jaise chela, bhavisvakta, paadri,
    updeshak, susmachaar prachaarak aur is prakaar se aage.
- n: 7
  text: Hum vishwaas karte hai, bhasha, bhavis suchna, divya darshan, changa karna, bhasao ko samajhne
    ka taufa aur is prakaar se aage.
- n: 8
  text: Hum vishwaas karte hai ki Dharamshastra Parmeshwar ka vachan hai agar vah sahi tarah se anuwaad
    kiya gaya ho; hum yeh bhi vishwaas karte hai Marman Dharamshastra bhi Parmeshwar ka vachan hai.
- n: 9
  text: Hum un sabhi cheezo mei vishwaas karte hai jo Parmeshwar ne bayaan kiya hai, vah sabhi jo Vah
    abhi bayaan kar raha hai, aur hum vishwaas karte hai ki Parmeshwar ke Rajye ke liye kai mahatpurn
    cheeze bayaan karege.
- n: 10
  text: Hum Israel ke ikatha hone mei vishwaas karte hai, aur Das Vansho ka lautna; taki Zion (Naya Jerusalem)
    America mei ban sake; ki Masih khud is dharti par raaj karege; aur yeh dharti pavitr ho jayega aur
    ek naya mahima payega.
- n: 11
  text: Hum Param Pitah Parmeshwar ki bhakti ke swabhagya ka dawa karte hai, apne vichaar aur khayalat
    ke anusaar, aur sabhi manushya ko yah swabhagya dete hai ki vah jaha chahe, jaise chahe aur jise chahe
    unki bhakti kar sakte hai.
- n: 12
  text: Hum rajao, pradhano, rajya karne valo, aur magistrates se shasit hone mei vishwaas karte hai,
    aur kanoon ki aadar, maante, aur palan karte hai.
- n: 13
  text: Hum vishwaas karte hai sacche hone mei, vishwaaskari, satti, pavitrata, dusro ke liye accha karya
    karna, accha jivan bitana aur sabhi manushya ke liye acchai karna; jisse hum elaan kar sake ki hum
    Paul ke updesh ka palan karte hai—Hum sabhi cheezo mei vishwaas karte hai, hum sabhi cheezo mei asha
    rakhte hai, hum bahut kuch paar kar chuke hai aur asha hai ki sabhi kuch paar kar sakege. Agar vaha
    koi acchi, pyaari, acchi jaankari deni vali yah prashansa layak hogi tho hum in cheezo ko dhundthe
    hai.
signature: Joseph Smith.
