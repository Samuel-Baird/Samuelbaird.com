title: Ishu Masih ke Susamachaar ka Sampurn Punahsthaapna
subtitle: Ek Aupchaarik Ghoshna Duniya ke Liye Dui Sau Saal ke Samaroh Pe
author: Ishu Masih ka Girjaghar Antim-dino ke Santo ka ke First Presidency aur Barah Devduton ke Quorum
note: Unke prati shraddha aur aabhaar ke saath, hum Unke Devduton ki tarah sab ko yeh janne ka nimantran
  dete hai—jaisa hum karte hai—ki swarg ab khul gaya hai. Hum daawe se kehte hai ki Parmeshwar Apni ichcha
  Apne priye beton aur betiyon ko batane laga hai. Hum gawahi dete hai ki woh jo praathna purwak Punahsthaapna
  ke sandesh ko padhenge aur vishwaas se kaam lenge jo ashish milega uske divyeta ke khud gawaah hone
  ki aur uska lakshye ki duniya ko taeyaar kiya jaaega vaada kiye gaye hamare Prabhu aur Uddhaarkarta,
  Ishu Masih ke Dusra Aagman ke liye.
paragraphs:
- Hum haardik rup se ghoshna karta hai ki Parmeshwar duniya ke har ek desh me Apan ladkan se pyaar kare
  hai. Parmeshwar jo Pita hai ne hum logon ko divye janm, bemisaal zindagi, aur Apne Priye Putra, Ishu
  Masih ka aseem praeshchit ka balidaan diya hai. Pita ke shakti se, Ishu phir se ji uthis aur maut pe
  vijay paais. Wah hamare Uddhaarkarta, Adarsh, aur Muktidaata hai.
- Dui sau saal pehle, 1820 ke ek sundar bahaar ke subha me, jawaan Joseph Smith, kon church me shaamil
  hoi ke khoj me, apan ghar ke paas la jangalon me ge praathna kare uttar New York, USA me. Uske paas
  sawaal raha apan aatma ke uddhaar pe aur uske yakeen raha ki Parmeshwar uske raasta dikhaai.
- Vinamrata se, hum log aelaan karta ki uske praathna ke jawaab me, Parmeshwar jo Pita hai aur Uske Putra,
  Ishu Masih, Joseph ke saamne aais aur “sab kuch waapas laawe” (Acts 3:21) ke shuru karis jaise Bible
  me bahut pehle batawa ge raha. Yeh drishye me, usne seekha ki sabse pehle Devduton ke mare ke baad,
  Masih ke Nawa Niyam ka Girja dharti pe nahi raha. Joseph upyogi hoga use waapas laane me.
- Hum log maanta hai ki Pita aur Putra ke aguwaai me, swarg ke dut aais raha Joseph ke sikhaawe aur Ishu
  Masih ka Girjaghar phir se staaphit kare ke. Punarjiwit John Baptisma Dene Waala paap se mukti ke liye
  dubaae ke baptisma kare la adhikaar ke punahsthaapit karis raha. Pehla barah Devduton me se teen—Peter,
  James, aur John—ne devdut hone ke farz aur purohiti ke adhikaar ke chaabiyon ko phir se sthaapit kiya.
  Anye dut bhi aaye, jaise Elijah, jon parivaar ke hamesha ke liye anant rishton me jode la adhikaar ke
  punahsthaapit karis jon maut ke baad bhi kaayam rehta hai.
- Hum yeh bhi bayaan deta hai ki Joseph Smith ke Parmeshwar se uphaar aur shakti diya ge raha ek pracheen
  lekh anuwaad kare ke jon hai Mormon Dharamshaastra—Ishu Masih ka Ek Aur Gawaah. Ih lekh ke kuch paejes
  me ek kahani hai Ishu Masih ke Punarjiwit hoe ke turant baad me Uske prachaar ke Western Hemisphere
  ke logon me. Isme zindagi ke lakshye sikhaawe hai aur Masih ke siddhaant samjhaawe hai, jon ki uh lakshye
  ke liye mukhye hai. Bible ke saathi shaastra hone ke naate, Mormon Dharamshaastra gawahi deta hai ki
  sab manushye ek pyaar karne waale Swarg ke Pita ke bete aur betiyaan hai, ki Uske paas hamare zindagi
  ka divye yojna hai, aur ki Uska Putra, Ishu Masih, aaj bhi waise baat karta hai jaise puraane dino me
  karta raha.
- Hum aelaan karte hai ki Ishu Masih ka Girjaghar Antim-dino ke Santo ka, jo April 6, 1830 me sthaapit
  hua tha, Masih ka Naya Niyam ka punahsthaapit Girja hai. Yeh Girja apne mukhye kone ka patthar, Ishu
  Masih ke jiwan pe mazbooti se juda hai, aur Uske aseem Praeshchit aur likhe gaye Punarjiwan pe. Ishu
  Masih ek dafa phir Devduton ke bulaais hai aur uh log ke purohiti adhikaar dees hai. Wah hum sab ko
  amantrit karta hai Uske paas aawe ke, aur Pavitra Aatma paawe ke, uddhaar ke dharamvidhiyaan, aur hamesha
  ke khushi haasil kare ke.
- Dui sau saal ab hoi ge hai jabse Parmeshwar jo Pita hai aur Uske Priye Putra, Ishu Masih ke zariye Punahsthaapna
  shuru hois raha. Duniya ke laakho insaan ih bhavishyevaani diya ge la ghatnaaon ke ek gyaan ke apnaais.
- Hum log khushi se aelaan karta hai ki jon Punahsthaapna vaada kara ge raha lagataar praktikaran ke zariye
  jaari hai. Dharti phir kabhi pehle ke rakam nahi rahi, kyunki Parmeshwar “sab cheej ek sange laai Masih
  me” (Ephesians 1:10).
