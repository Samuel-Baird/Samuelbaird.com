retrieved: '2026-11-02'
title: La restauració de la plenitud de l’evangeli de Jesucrist
subtitle: Una proclamació del bicentenari pel món
author: La Primera Presidència i el Consell dels Dotze Apòstols de l’Església de Jesucrist dels Sants
  dels Darrers Dies
note: Aquesta proclamació va ser llegida pel President Russell M. Nelson com a part del seu missatge a
  la 190a Conferència General Anual del 5 d’abril de 2020 a Salt Lake City, Utah.
paragraphs:
- Proclamem amb solemnitat que Déu estima els Seus fills de totes les nacions del món. Déu el Pare ens
  ha donat el naixement diví, la vida incomparable i el sacrifici expiatori infinit del Seu Fill Estimat,
  Jesucrist. Pel poder del Pare, Jesús va ressuscitar i va vèncer la mort. Ell és el nostre Salvador,
  el nostre Exemple i el nostre Redemptor.
- Fa dos-cents anys, en un matí radiant de la primavera de 1820, el jove Josep Smith, que volia saber
  a quina església s’havia d’unir, va anar a una arbreda a orar vora casa seva al nord de l’estat de Nova
  York, EUA. Tenia preguntes sobre la salvació de la seva ànima i confiava que Déu el guiaria.
- Amb humilitat, declarem que com a resposta a la seva oració, Déu el Pare i el Seu Fill, Jesucrist, es
  van aparèixer a Josep i van iniciar “la restauració de totes les coses” (Fets 3:21) com s’havia profetitzat
  a la Bíblia. En aquesta visió, va aprendre que després de la mort dels Apòstols originals, l’Església
  de Crist del Nou Testament va desaparèixer de la Terra. Josep seria un instrument clau pel seu retorn.
- Afirmem que sota la direcció del Pare i del Fill, missatgers celestials van baixar per instruir Josep
  i restablir l’Església de Jesucrist. Joan el Baptista ressuscitat va restaurar l’autoritat de batejar
  per immersió per a la redempció dels pecats. Tres dels dotze Apòstols originals, Pere, Jaume i Joan,
  van restaurar l’apostolat i les claus de l’autoritat del sacerdoci. D’altres també van baixar, inclòs
  Elies el Profeta, que va restaurar l’autoritat per unir les famílies per sempre en relacions eternes
  que transcendeixen la mort.
- 'També testifiquem que a Josep Smith se li va donar el do i el poder de Déu per traduir un registre
  antic: El Llibre de Mormó, un altre testimoni de Jesucrist. A les pàgines d’aquest text sagrat s’inclou
  la narració del ministeri personal de Jesucrist entre les persones de l’hemisferi occidental just després
  de la Seva Resurrecció. També ensenya sobre el propòsit de la vida i explica la doctrina de Crist, que
  és central per aquest propòsit. El Llibre de Mormó és un llibre d’Escriptura que, juntament amb la Bíblia,
  testifica que totes les persones som fills i filles d’un amorós Pare Celestial, que Ell té un pla diví
  per les nostres vides i que el Seu Fill, Jesucrist, parla avui dia com ho feia en els temps antics.'
- Declarem que l’Església de Jesucrist dels Sants dels Darrers Dies, organitzada el 6 d’abril de 1830,
  és l’Església de Crist del Nou Testament restaurada. Aquesta Església està fonamentada en la vida perfecta
  de la seva pedra angular, Jesucrist, en la Seva Expiació infinita i la Seva Resurrecció literal. Jesucrist
  ha cridat de nou apòstols i els ha donat l’autoritat del sacerdoci. Convida a tothom a venir a Ell i
  a la Seva Església per rebre l’Esperit Sant, les ordenances de salvació i tenir joia perdurable.
- Ja han passat dos-cents anys d’ençà que Déu el Pare i el Seu Fill Estimat, Jesucrist, van iniciar la
  Restauració. Milions de persones arreu del món han abraçat el coneixement d’aquests esdeveniments profetitzats.
- Declarem joiosos que la Restauració promesa avança a través de la revelació continuada. La Terra mai
  tornarà a ser la mateixa a mesura que Déu reuneixi “totes les coses en el Crist” (Efesis 1:10).
- Amb reverència i gratitud, com als Seus Apòstols convidem a tothom a conèixer, tal com nosaltres sabem,
  que els cels estan oberts. Afirmem que Déu dona a conèixer la Seva voluntat als Seus estimats fills
  i filles. Testifiquem que aquells que estudiïn en oració el missatge de la Restauració i actuïn amb
  fe, seran beneïts per obtenir el seu propi testimoni de la seva divinitat i propòsit per preparar el
  món per a la Segona Vinguda promesa del nostre Senyor i Salvador, Jesucrist.
