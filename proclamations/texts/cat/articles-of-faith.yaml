title: Els Articles de Fe
subtitle: de l’Església de Jesucrist dels Sants dels Darrers Dies
author: ''
verses:
- n: 1
  text: Nosaltres creiem en Déu, el Pare Etern, i en el Seu Fill, Jesucrist, i en l’Esperit Sant.
- n: 2
  text: Creiem que tota persona serà castigada pels seus propis pecats i no per la transgressió d’Adam.
- n: 3
  text: Creiem que per l’Expiació de Crist, tota la humanitat pot salvar-se per mitjà de l’obediència
    a les lleis i ordenances de l’Evangeli.
- n: 4
  text: 'Creiem que els primers principis i ordenances de l’Evangeli són: primer, la fe en el Senyor Jesucrist;
    segon, el penediment; tercer, el baptisme per immersió per a la remissió dels pecats; quart, la imposició
    de les mans per a conferir el do de l’Esperit Sant.'
- n: 5
  text: Creiem que una persona ha de ser cridada per Déu, per profecia i per la imposició de les mans
    per aquells que tenen l’autoritat per a predicar l’Evangeli i administrar les seves ordenances.
- n: 6
  text: 'Creiem en la mateixa organització que existia a l’Església primitiva, és a dir: apòstols, profetes,
    pastors, mestres, evangelistes, etc.'
- n: 7
  text: Creiem en el do de llengües, profecia, revelació, visions, guarició, interpretació de llengües,
    etc.
- n: 8
  text: Creiem que la Bíblia és la paraula de Déu fins on estigui correctament traduïda; també creiem
    que el Llibre de Mormó és la paraula de Déu.
- n: 9
  text: Creiem tot el que Déu ha revelat, tot el que revela en l’actualitat i creiem que encara revelarà
    moltes coses grans i importants pertanyents al Regne de Déu.
- n: 10
  text: Creiem en l’aplegament literal del poble d’Israel i en la restauració de les deu tribus; que Sió,
    la Nova Jerusalem, serà edificada sobre el continent americà; que Crist regnarà personalment sobre
    la Terra, i que la Terra serà renovada i rebrà la seva glòria paradisíaca.
- n: 11
  text: 'Reclamem el privilegi d’adorar Déu Totpoderós segons els dictats de la nostra consciència i reconeixem
    el mateix privilegi a tothom: que adorin com, on o el què decideixin.'
- n: 12
  text: Creiem en estar governats pels reis, presidents, dirigents i magistrats; en obeir, honrar i donar
    suport a la llei.
- n: 13
  text: 'Creiem en ser honrats, verídics, casts, benevolents, virtuosos i en fer el bé a tothom; en veritat
    podem dir que seguim l’admonició de Pau: Tot ho creiem, tot ho esperem, hem suportat moltes coses
    i esperem poder suportar totes les coses. Si hi ha quelcom virtuós, digne d’estima, de bona reputació
    o lloable, a això aspirem.'
signature: Josep Smith.
