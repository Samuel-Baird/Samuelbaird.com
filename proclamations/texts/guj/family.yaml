title: પરિવાર
subtitle: વિશ્વ માટે એક જાહેરાત
author: અંતિમ કાળ ના સંતોની ઈશુ ખ્રિસ્તની ગિરજાની પ્રથમ અધ્યક્ષતા અને બાર પ્રેરિતોની પરિષદ
note: નીતિવચન ૨૩ સપ્ટેમ્બર, ૧૯૯૫ના રોજ યુટાહના સોલ્ટ લેક સિટીમાં યોજાયેલી જનરલ સહાયતા સંસ્થાની બેઠકમાં
  રાષ્ટ્રપતિ ગોર્ડન બી. હિંકલીએ આ જાહેરનામું વાંચ્યું.
paragraphs:
- 'અમે, અંતિમ કાળ ના સંતોની ઈશુ ખ્રિસ્તની ગિરજાની પ્રથમ અધ્યક્ષતા અને બાર પ્રેરિતોની પરિષદ નિષ્ઠાપૂર્વક
  જાહેર કરીએ છીએ કે: એક પુરુષ અને એક સ્ત્રી વચ્ચેના લગ્ન ભગવાન દ્વારા નિયુક્ત કરવામાં આવ્યા છે અને એમના
  બાળકોના અનંત ભવિષ્ય માટે પરિવાર એ સૃષ્ટિકર્તા ની યોજનામાં જરૂરી છે.'
- બધા માનવીઓ — પુરુષ કે સ્ત્રી — ઈશ્વરના સ્વરૂપમાં બનાવવામાં આવ્યા છે. દરેક સ્વર્ગીય માતા-પિતાના પ્રિય
  આધ્યાત્મિક પુત્રઅથવા પુત્રી છે, અને, તેથી, દરેકનો એક દૈવી સ્વભાવ અને ભાગ્ય હોય છે. વ્યક્તિના જન્મ પહેલા
  ના, નશ્વર અને શાશ્વત ઓળખ અને હેતુ માટે જાતિ એક અનિવાર્ય લાક્ષણિકતા છે.
- જન્મ પૂર્વે જીવનમાં આત્મા દીકરાઓ અને દીકરીઓ ઈશ્વરને પોતાના શાશ્વત પિતા તરીકે ઓળખતા અને તેની ઉપાસના કરતા
  અને તેમની યોજના ને સ્વીકારી હતી, જેના દ્વારા તેમના બાળકો પાર્થિવ શરીર પ્રાપ્ત કરી શકે અને સંપૂર્ણતાની
  દિશામાં પ્રગતિ કરવા માટે સાંસારિક અનુભવો મેળવી શકે અને અંતે તેમના અનંત જીવનના વારસદાર તરીકે પોતાની દૈવી
  ભાગ્ય પ્રાપ્ત કરી શકે. ભગવાનની સુખની પવિત્ર યોજના કૌટુંબિક સંબંધોને મૃત્યુ પછી પણ ચાલુ રાખવા સક્ષમ બનાવે
  છે. પવિત્ર મંદિરોમાં ઉપલબ્ધ પવિત્ર ધાર્મિક વિધિઓ અને કરારો વ્યક્તિને ભગવાનની હાજરીમાં પાછા જવા અને કુટુંબોને
  અનંત સુધી જોડે રહેવા સંભવ કરે છે.
- ઈશ્વરે આદમ અને હવાને પહેલી આજ્ઞા આપી હતી કે તેઓ પતિ અને પત્ની તરીકે માતા બનવાની ક્ષમતા રાખી શકે. આપણે
  જાહેર કરીએ છીએ કે ઈશ્વરના બાળકોને પૃથ્વીને વધારીને તેને ફરીથી ભરવાની આજ્ઞા હજુ પણ લાગુ છે. આપણે આગળ
  જણાવીએ છીએ કે ઈશ્વરે આજ્ઞા આપી છે કે પ્રજનનની પવિત્ર શક્તિઓનો ઉપયોગ ફક્ત કાયદેસર રીતે પતિ અને પત્ની
  તરીકે થયેલા પુરુષ અને સ્ત્રી વચ્ચે જ થવો જોઈએ.
- આપણે એની ઘોષણા કરીએ છીએ કે જેનાથી પૃથ્વી પર પાર્થિવ જીવનની સૃષ્ટિની દિવ્ય નિયુક્તિ થઈ છે. આપણે જીવનની
  પવિત્રતા અને ઈશ્વરની શાશ્વત યોજનામાં એના મહત્ત્વને મક્કમતાપૂર્વક સ્વીકારીએ છે.
- પતિ — પત્નીએ એકબીજાને અને પોતાના બાળકો પ્રત્યે પ્રેમ અને કાળજી રાખવાની જવાબદારી બજાવાની છે. “બાળકો પ્રભુ
  તરફથી મળેલો વારસો છે” (ગીતશાસ્ત્ર ૧૨૭:૩). માબાપની પવિત્ર ફરજ છે કે તેઓ પોતાના બાળકોને પ્રેમ અને ન્યાયીપણાથી
  ઉછેરવા, તેમની શારીરિક અને આધ્યાત્મિક જરૂરિયાતો પૂરી પાડવા, અને તેમને એકબીજાને પ્રેમ કરવા અને સેવા આપવા,
  ઈશ્વરની આજ્ઞાઓનું પાલન કરવા, અને તેઓ જ્યાં પણ રહે ત્યાં કાયદાનું પાલન કરતા નાગરિકો બનવા શીખવવા. પતિ
  — પત્ની એટલે કે માતા — પિતા એ આ જવાબદારીઓ નિભાવવા માટે પરમેશ્વર સમક્ષ જવાબદાર રહેશે.
- કુટુંબ ઈશ્વરની આજ્ઞા છે. પુરુષ અને સ્ત્રી વચ્ચેનો લગ્ન તેમની શાશ્વત યોજના માટે જરૂરી છે. બાળકોને લગ્નજીવનના
  બંધનમાં જન્મવાનો અને તેઓનો ઉછેર એવા પિતા અને માતા દ્વારા કરવાનો હક છે કે જેઓ સંપૂર્ણ વફાદારીથી લગ્નની
  પ્રતિજ્ઞા પાળે છે. કુટુંબ જીવનમાં સુખ ત્યારે જ પ્રાપ્ત થવાની સૌથી વધારે સંભાવના છે જ્યારે તમે પ્રભુ
  ઈસુ ખ્રિસ્તના શિક્ષણ પર સ્થાપિત કરવામાં આવે. સફળ લગ્ન અને કુટુંબ વિશ્વાસ, પ્રાર્થના, પસ્તાવો, ક્ષમા,
  આદર, પ્રેમ, કરુણા, કામ અને તંદુરસ્ત મનોરંજનના સિદ્ધાંતો પર સ્થાપિત થાય છે અને તેને ટકાવી રાખે છે. ઈશ્વરની
  રચના મુજબ, પિતાઓએ પ્રેમ અને ન્યાયીપણાથી પોતાના કુટુંબનું નેતૃત્વ કરવું જોઈએ અને પોતાના કુટુંબને જીવન
  અને રક્ષણ આપવું જોઈએ. માતાઓ પોતાના બાળકોના ઉછેર માટે જવાબદાર છે. આ પવિત્ર જવાબદારીઓમાં પિતા અને માતા
  એક બીજાને મદદ કરવા માટે જવાબદાર છે. અપંગતા, મૃત્યુ કે બીજા કોઈ સંજોગોમાં વ્યક્તિએ પોતાને બદલવું પડી
  શકે. જ્યારે જરૂર હોય ત્યારે સગા સંબંધીઓ દ્વારા મદદ મળવી જોઈએ.
- અમે ચેતવણી આપીએ છીએ કે જે લોકો જાતીય શુદ્ધતાના કરારનો ભંગ કરે છે, પોતાના જીવનસાથી કે બાળકોનેા દુરુપયોગ
  કરે છે અથવા કુટુંબની જવાબદારીઓ નિભાવવામાં નિષ્ફળ જાય છે તેઓ એક દિવસ ઈશ્વર સમક્ષ જવાબદાર ઠરશે. વધુમાં,
  અમે ચેતવણી આપીએ છીએ કે કુટુંબના વિભાજન પછી વ્યક્તિઓ, સમુદાયો અને રાષ્ટ્રો પર પ્રાચીન અને આધુનિક પ્રબોધકોએ
  ભવિષ્યવાણી કરી હતી તેવી જ આફતો આવશે.
- અમે જવાબદાર નાગરિકો અને સરકારી અધિકારીઓને સમાજના મૂળભૂત એકમ તરીકે કુટુંબને જાળવવા અને તેને મજબૂત કરવા
  રચાયેલા પગલાંને પ્રોત્સાહન આપવા કહીએ છીએ.
