title: ក្រុមគ្រួសារ
subtitle: ការប្រកាស ដល់ពិភពលោក
author: គណះប្រធានទីមួយ និងក្រុមប្រឹក្សានៃពួកសាវកដប់ពីរនាក់ នៃសាសនាចក្រនៃ ព្រះយេស៊ូវគ្រីស្ទ នៃពួកបរិសុទ្ឋថ្ងៃចុងក្រោយ
note: ការប្រកាសនេះត្រូវបានអាន ដោយប្រធាន ហ្គរដុន ប៊ី ហ៊ិងគ្លី ជាផ្នែកនៃសារលិខិតរបស់លោក នៅក្នុងការប្រជុំសមាគមសង្គ្រោះទូទៅ
  ដែលបានធ្វើឡើងនៅថ្ងៃទី ២៣ ខែ កញ្ញា ឆ្នាំ ១៩៩៥ នៅក្នុងទីក្រុងសលត៍ លេក រដ្ឋយូថាហ៍។
paragraphs:
- យើងជាគណះប្រធានទីមួយ និងក្រុមប្រឹក្សានៃពួកសាវកដប់ពីរនាក់ នៃសាសនាចក្រនៃ ព្រះយេស៊ូវគ្រីស្ទ នៃពួកបរិសុទ្ឋថ្ងៃចុងក្រោយ
  សូមប្រកាសជាឧឡារិកថា អាពាហ៍ពិពាហ៍ រវាងបុរស និងស្រី្ត គឺត្រូវបានតែងតាំងឡើងដោយព្រះ ហើយថាគ្រួសារជាផ្នែកដ៏សំខាន់មួយ
  នៅ​ក្នុងផែនការរបស់ព្រះដ៏បង្កបង្កើត សំរាប់គោលដៅដ៏នៅអស់កល្បជានិច្ចនៃកូនចៅរបស់ទ្រង់។
- មនុស្សទាំងអស់—ទាំងប្រុសទាំងស្រី—ត្រូវបានបង្កើតឡើងតាមរូបភាពនៃព្រះ។ មនុស្សម្នាក់ៗ សុទ្ឋតែជាបុត្រា និងបុត្រីខាងវិញ្ញាណរបស់ព្រះមាតាបិតាសួគ៌
  ដូច្នេះហើយមនុស្សម្នាក់ៗមាន ចរិត និងគោលដោនៃព្រះ។ ភេទប្រុសស្រី គឺជាលក្ខណះពិសេសនៃអត្តសញ្ញាណ និង គោលបំណងរបស់បុគ្គលម្នាក់ៗ
  នៅជីវិតមុនផែនដី ជីវិតរមែងស្លាប់ និងនៅអស់កល្បជានិច្ច។
- នៅជីវិតមុនផែនដី បុត្រា និងបុត្រីខាងវិញ្ញាណទាំងឡាយបានស្គាល់ ហើយបានថ្វាយបង្គំព្រះ ជាព្រះវរបិតាដ៍នៅអស់កល្បជានិច្ចរបស់ពួកគេ
  ហើយបានទទួលផែនការរបស់ទ្រង់ ដែលនាំឱ្យ​កូនចៅទាំងឡាយ អាចទទួលរូបកាយ ហើយនឹងទទួលបទពិសោធន៍នៅលើផែនដី ដើម្បីរីក​ចំរើនទៅរកភាពល្អឥតខ្ចោះ
  ហើយនៅទីបញ្ចប់ នឹងដឹងពីគោលបំណងដ៍ទេវភាពរបស់ពួកគេ ដោយទទួលជីវិតដ៏នៅអស់កល្បទុកជាមរតក។ ផែនការនៃសុភមង្គលដ៍ទេវភាពនេះ
  ផ្តល់​លទ្ឋភាពដល់ទំនាក់ទំនងក្រុមគ្រួសារចេះតែបន្តមានរហូតហួសពីសេចក្តីស្លាប់។ ពីធីបរិសុទ្ឋ និង សេចក្តីសញ្ញាពិសិដ្ឋនានា
  ដែលមាននៅក្នុងព្រះវិហារបរិសុទ្ឋ អាចធ្វើឱ្យបុគ្គលម្នាក់ៗត្រឡប់ទៅ​កាន់វត្តមាននៃព្រះរិញ ហើយដើម្បីឱ្យក្រុមគ្រួសារអាចត្រូវបានរួបរួមគ្នាដ៏អស់កល្បជានិច្ច។
- ព្រះបញ្ញាត្តិ ទីមួយ ដែលព្រះបានប្រទានដល់លោកអ័ដាម និងនាងអេវ៉ា ទាក់ទងទៅនឹង​សមត្ថភាពរបស់ពួកគេ សំរាប់ភាពជាឪពុកម្ដាយ
  ក្នុងនាមជាស្វាមី និងភរិយា។ យើងសូម​ប្រកាសថា ព្រះបញ្ញាត្តិរបស់ព្រះសំរាប់កូនចៅរបស់ទ្រង់ ដើម្បីបង្កើតកូនចៅឱ្យចំរើនជាច្រើនឡើង
  ឱ្យមានពាសពេញលើផែនដី នោះនៅតែឱ្យប្រតិបត្តិនៅឡើយ។ យើងសូមប្រកាសថែមទៀតថា ព្រះបានបញ្ជាថា អំណាចពិសិដ្ឋនៃការបង្កើតកូន
  គឺត្រូវបានប្រើរវាងតែបុរស និងស្ត្រី ដែលបាន​រៀបអាពាហ៏ពិពាហ៍យ៉ាងស្របច្បប់ជាប្តី និងប្រពន្ឋប៉ុណ្ណោះ។
- យើងសូមប្រកាសថា មធ្យោបាយដើម្បីបង្កើតជីវិតរមែងស្លាប់នេះ គឺត្រូវបានតែងតាំងឡើងដោយ​ព្រះ។ យើងសូមបញ្ជាក់នូវការញែកចេញជាបរិសុទ្ធនៃជីវិត
  និងសារៈសំខាន់នៃជីវិតនៅក្នុង​ផែនការដ៏អស់កល្បជានិច្ចរបស់ព្រះ។
- ស្វាមី និងភរិយា មានការទទួលខុសត្រូវដ៏ឧឡារិកដើម្បីស្រឡាញ់ និងថែរក្សាគ្នាទៅរិញទៅមក ព្រមទាំងកូនចៅរបស់ខ្លួនផងដែរ។
  « កូនចៅជាមរតកពីព្រះយេហូវ៉ា » (ទំនុក​ដំកើង ១២៧:៣)។ ឪពុកម្តាយមានកាតព្វកិច្ចដ៏ពិសិដ្ឋ ដើម្បីចិញ្ចឹមបីបាច់កូនចៅរបស់ខ្លួនដោយក្តីស្រឡាញ់
  និង​សេចក្ដីសុចរិត ផ្គត់ផ្គង់សេចក្តីត្រូវការ ទាំងខាងរូបកាយនិងខាងវិញ្ញាណរបស់ពួកគេ និងបង្រៀន ពួកគេឱ្យចេះស្រឡាញ់
  និងបំរើគ្នាទៅវិញទៅមក ចេះគោរពព្រះបញ្ញាត្តិទាំងឡាយនៃព្រះ ហើយ​ធ្វើជាពលរដ្ឋល្អ ចេះគោរពច្បាប់គ្រប់ទីកន្លែង
  ដែលពួកគេរស់នៅ។ ស្វាមី និងភរិយា—ម្ដាយ និងឪពុក—នឹងទទួលខុសត្រូវនៅចំពោះព្រះភ័ក្រ្តព្រះ តាមការប្រតិបត្តិនៃភារកិច្ចទាំងឡាយនេះ។
- ក្រុមគ្រួសារ ត្រូវបានតែងតាំងឡើងដោយព្រះ។ អាពាហ៍ពិពាហ៍រវាងបុរស និងស្ត្រី គឺជាផ្នែក​មួយដ៏សំខាន់ក្នុងផែនការដ៏នៅអស់កល្បជានិច្ចរបស់ទ្រង់។
  កូនចៅមានសិទ្ឋនឹងទទួលកំណើតមក ក្នុងចំណងនៃអាពាហ៍ពិពាហ៍ ហើយនឹងត្រូវបានចិញ្ចឹមបីបាច់ដោយឪពុកម្តាយ ដែលគោរព​ប្រតិបត្តិតាមសច្ចានៃអាពាហ៍ពិពាហ៍ដោយស្មោះត្រង់ទាំងស្រុង។
  សុភមង្គលនៅក្នុងជីវិតគ្រ្ផសារ អាចកើតមានឡើងបាន នៅពេលធ្វើតាមការបង្រៀនរបស់ព្រះអម្ចាស់ព្រះយេស៊ូវគ្រីស្ទ។
  អាពាហ៍ពិពាហ៍ និងគ្រួសារដែលមានជោគជ័យ នោះគឺត្រូវស្ថាបនា និងថែរក្សានៅលើ​គោលការណ៍នៃសេចក្តីជំនឿ ការអធិស្ឋាន
  ការប្រែចិត្ត ការអភ័យទោស ការគោរពគ្នា សេចក្តីស្រឡាញ់ សេចក្តីមេត្តាករុណា ការងារ និងកម្មវិធីកំសាន្តល្អៗនានា។
  តាមការរៀបចំដ៏​ទេវភាពនេះ ឪពុកត្រូវបានចាត់ឱ្យធ្វើជាអ្នកដឹកនាំនៅក្នុងគ្រួសាររបស់ខ្លួន ដោយសេចក្តីស្រឡាញ់
  និងសេចក្តីសុចរិត ហើយមានភារកិច្ចក្នុងការ​ផ្គត់ផ្តង់សេចក្ដីត្រូវការក្នុងជីវិត ព្រមទាំងការពារក្រុម​គ្រួសារខ្លួនផង។
  ម្តាយមានភារកិច្ចសំខាន់ដើម្បីថែរក្សាបីបាច់កូនចៅបស់ខ្លួន។ នៅក្នុង ការទទួលខុសត្រូវដ៏ពិសិដ្ឋទាំងនេះ ឪពុក
  និងម្ដាយ មានកាតព្វកិច្ចដើម្បីជួយគ្នាទៅវិញទៅមក​ជាដៃគូស្មើគ្នា។ ពិការភាព មរណភាព ឬកាលៈទេសៈផ្សេងៗទៀត អាចនឹងត្រូវសម្របទៅតាម
  ស្ថានភាពចាំបាច់របស់បុគ្គលម្នាក់ៗ។ ញាតិសន្តានក្រុមគ្រួសារ គួរតែជួយគាំទ្រ នៅពេលមាន​សេចក្តីត្រូវការ។
- យើងសូមព្រមានថា បុគ្គលណាដែលបំពានលើសេចក្តីសញ្ញានៃព្រហ្មចារីភាព ដោយបានធ្វើបាប​ភរិយា ឬកូនចៅ ឬមិនបានបំពេញការទទួលខុសត្រូវក្នុងគ្រួសារ
  គង់តែថ្ងៃណាមួយនឹងទទួល​ខុសត្រូវនៅចំពោះព្រះ។ លើសពីនេះទៅទៀត យើងសូមព្រមានថា ការបែកបាក់នៅក្នុងគ្រួសារ នឹងនាំមកនូវមហន្តរាយដល់បុគ្គលនោះ
  សហគមន៍ និងជាតិសាសន៍ ដូចដែលបានទាយទុកជាមុន ដោយពួកព្យាការីសម័យបុរាណ និងពួកព្យាការីសម័យទំនើប។
- យើងសូមអំពារនាវដល់ ប្រជាពលរដ្ឋ និងមន្ត្រីរាជការទាំងឡាយនៅក្នុងរដ្ឋាភិបាល ដែលទទួល​ខុសត្រូវនៅគ្រប់ទីកន្លែងទាំងអស់
  សូមឱ្យគាំទ្រនូវអ្វីៗទាំងនេះ ដែលបានរៀបរាប់ឡើង ដើម្បី​ទ្រទ្រង់ និងធ្វើឱ្យក្រុមគ្រួសារមាំមួន ដូចជាអង្គភាពមួយដ៏សំខាន់នៃសង្គម។
