title: Христ који живи
subtitle: Сведочанство апостола
author: Црква Исуса Христа светаца последњих дана
paragraphs:
- Док обележавамо рођење Исуса Христа које се догодило пре две хиљаде година, дајемо вам своје сведочанство
  о стварности Његовог живота који се не може поредити ни са чим и бескрајној моћи Његове велике помирбене
  жртве. Нико други није имао тако дубок утицај на све оне који су живели или ће тек живети на земљи.
- Био је Велики Јахве Старог завета, Месија Новог завета. Под вођством свог Оца, створио је земљу. „Све
  је кроз [Њега] постало, и без [Њега] ништа није постало што је постало” (Јован 1:3). Иако безгрешан,
  био је крштен да би праведност била испуњена, „који прође чинећи добро” (Дела 10:38), па ипак је био
  презрен због тога. Његово Јеванђеље било је порука мира и добре воље. Он је све позвао да следе Његов
  пример. Ходао је путевима Палестине, исцељивао болесне, чинио да слепи прогледају, подизао мртве. Поучавао
  је о истинама вечности, стварности нашег предсмртног постојања, сврси нашег живота на земљи и могућностима
  синова и кћери Божјих у будућем животу.
- Установио је причешће као подсетник на своју велику помирбену жртву. Био је ухапшен и лажно оптужен,
  осуђен да би руља била задовољена и кажњен да умре на крсту на Калварији. Дао је свој живот ради откупљења
  греха читавог човечанства. Био је велика жртва поднета у корист свих оних који ће икада живети на земљи.
- Свечано сведочимо да Његов живот, који је средиште читаве људске историје, нити је почео у Витлејему,
  нити се окончао на Калварији. Он је Очев Прворођенац, Јединорођенац у телу, Откупитељ света.
- Устао је из гроба да би постао „новина онима који умреше” (1. Коринћанима 15:20). Као васкрсли Господ,
  посетио је оне које је током живота волео. Такође је послуживао међу „друг[им] овц[ама]” (Јован 10:16)
  у древној Америци. У савременом свету, Он и Његов Отац указали су се дечаку Џозефу Смиту, започевши
  дуго обећавану „уредбу извршетка времена” (Ефесцима 1:10).
- 'О живом Христу, пророк Џозеф је написао: „Очи Његове беху као пламен огњени; коса на глави Његовој
  беше бела као чисти снег; лице Његово сијаше више од сјаја сунчевог; а глас Његов беше као хука великих
  вода, и то глас Јахвин који говори:'
- Ја сам први и последњи; ја сам онај који живи, ја сам онај који беше погубљен; ја сам ваш заступник
  код Оца” (УиЗ 110:3–4).
- 'О Њему је пророк такође изјавио: „А сада, након много сведочанстава о Њему датих, ово је сведочанство,
  и то последње, које дајемо о Њему: Да Он живи!'
- Јер видесмо Га, и то здесна Богу; и чусмо глас што сведочи да је Он Јединорођенац Очев –
- Да се по Њему, и преко Њега, и од Њега, светови стварају и беху створени, а становници њихови јесу рођени
  синови и кћери Божје” (УиЗ 76:22–24).
- Свечаним речима изјављујемо да су Његово свештенство и Његова Црква обновљени на земљи – „назидани на
  темељу апостола и пророка, где је камен од угла сам Исус Христос” (Ефесцима 2:20).
- Сведочимо да ће се Он једног дана вратити на земљу. „И јавиће се слава Господња, и свако ће тело видети”
  (Исаија 40:5). Он ће управљати као Цар над царевима, и владаће као Господ над господима, и пред Њим
  ће се свако колено савити и сваки језик говорити о Њему са дивљењем. Свакоме од нас Он ће судити према
  нашим делима и жељама наших срца.
- Као Његови прописно заређени апостоли, износимо сведочанство да Исус јесте живи Христ, бесмртни Син
  Божји. Он је велики Цар Емануило који данас стоји здесна свом Оцу. Он је светло, живот и нада света.
  Његов пут је стаза која води до среће у овом животу и вечном животу у будућем свету. Захвални смо Богу
  за неупоредиви дар Његовог божанског Сина.
