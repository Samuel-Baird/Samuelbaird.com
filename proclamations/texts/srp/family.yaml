title: Породица
subtitle: Проглас свету
author: Прво председништво и Савет дванаесторице апостола Цркве Исуса Христа светаца последњих дана
note: Овај проглас прочитао је председник Гордон Б. Хинкли као део своје поруке на Општем састанку Потпорног
  друштва одржаном 23. септембра 1995. године, у Солт Лејк Ситију, у Јути.
paragraphs:
- Ми, Прво председништво и Савет Дванаесторице апостола Цркве Исуса Христа светаца последњих дана, свечано
  објављујемо да је брак између мушкарца и жене установљен од Бога и да је породица средиште Створитељевог
  плана у вези са вечном судбином Његове деце.
- Сва људска бића – мушкарци и жене – створена су по обличју Божјем. Свако је вољени духовни син или кћер
  Небеских Родитеља и као такав има божанску природу и судбину. Пол је основна карактеристика појединачног
  предсмртничког, смртничког и вечног идентитета и сврхе.
- У предсмртничком животу, духовни синови и кћери су познавали и обожавали Бога као свог Вечног Оца и
  прихватили су Његов план по коме Његова деца могу да добију физичка тела и стекну земаљско искуство
  како би напредовала према савршенству и коначно остварила своју божанску судбину у својству баштиника
  вечног живота. Божански план среће омогућава настављање породичних односа и након смрти. Свети обреди
  и завети доступни у светим храмовима, појединцима пружају могућност да се врате у Божје присуство, а
  породицама да буду вечно сједињене.
- Прва заповест коју је Бог дао Адаму и Еви била је у вези са њиховом могућношћу родитељства у својству
  мужа и жене. Ми објављујемо да је Божја заповест Његовој деци да се множе и напуне земљу и даље на снази.
  Уз то објављујемо да је Бог заповедио да се свете моћи стварања живота могу користити само између мушкарца
  и жене који су законито венчани као муж и жена.
- Објављујемо начин на који се смртнички живот ствара како би био божански установљен. Сведочимо о светињи
  живота и његовој важности у Божјем вечном плану.
- Муж и жена имају свечану одговорност да се воле и брину једно о другом и о својој деци. Деца су наследство
  од Господа (Псалми 127:3). Родитељи имају свету дужност да своју децу подижу у љубави и праведности,
  да им обезбеде материјалне и духовне потребе, да их подучавају да се међусобно воле и служе једни другима,
  да се придржавају Божјих заповести и да буду грађани који се придржавају закона где год да живе. Мужеви
  и жене – мајке и очеви – сматраће се одговорнима пред Богом за неиспуњавање ових обавеза.
- Породица је успостављена од Бога. Брак између мушкарца и жене од суштинског је значаја за Његов вечни
  план. Деца имају право да буду рођена у оквиру брака, и да их подижу отац и мајка који поштују брачне
  завете са потпуном оданошћу. Срећа у породичном животу најбоље се постиже када се он заснива на учењима
  Господа Исуса Христа. Успешни бракови и породице засновани су и подупрти начелима вере, молитве, покајања,
  праштања, поштовања, љубави, самилости, рада и корисним забавним активостима. Према божанској замисли,
  очеви треба да своје породице воде у љубави и праведности и одговорни су да својим породицама обезбеде
  животне потребе и заштиту. Мајке су првенствено одговорне за негу њихове деце. У тим светим одговорностима,
  очеви и мајке су дужни да једни другима помажу као равноправни партнери. Инвалидитет, смрт или неке
  друге околности могу изискивати прилагођавање појединаца. Ако је потребно, шира породица треба да пружи
  подршку.
- Упозоравамо да ће се појединци који крше завете чедности, који злостављају брачног друга или потомство,
  или који занемарују испуњавање својих породичних одговорности, једног дана наћи одговорнима пред Богом.
  Уз то, упозоравамо да ће распад породице донети појединцима, заједницама и народима несреће проречене
  од стране древних и савремених пророка.
- Позивамо одговорне грађане и надлежна лица у владама широм света да потпомажу ове мере осмишљене ради
  подупирања и јачања породице као основне јединице друштва.
