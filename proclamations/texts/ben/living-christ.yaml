title: জীবিত খ্রীষ্ট
subtitle: প্রেরিতগণের সাক্ষ্য
author: শেষকালীন ধার্মিকদের যীশু খ্রীষ্টের মন্ডলী
paragraphs:
- আমরা যখন দুই হাজার বছর আগে যীশু খ্রীষ্টের জন্মকে স্মরণ করছি, তাঁর অতুলনীয় জীবনের বাস্তবতা এবং তাঁর
  মহান আত্মত্যাগমূলক বলিদানের অসীম গুণাবলী সম্পর্কে আমরা সাক্ষ্য দিচ্ছি। পৃথিবীতে যারা জীবন অতিবাহিত করেছে
  বা যারা ভবিষ্যতে আসবে তাদের সকলের উপর অন্য কোনো ব্যক্তির এত গভীরভাবে প্রভাব পড়েনি।
- তিনি ছিলেন পুরাতন নিয়মে মহান যিহোবা, নতুনে মশীহ। তাঁর পিতার নির্দেশে তিনি পৃথিবীর সৃষ্টিকর্তা ছিলেন।
  “সকলই তাঁর দ্বারা হয়েছিলো, যা হয়েছে, তার কিছুই তাঁর ব্যতিরেকে হয় নাই” (যোহন ১:৩)। যদিও পাপহীন, তিনি
  সমস্ত ধার্মিকতা পূরণের জন্য বাপ্তাইজিত হয়েছিলেন। তিনি “হিতকার্য্য করে বেড়াতেন” (প্রেরিত ১০:৩৮), তথাপি
  তাঁকে অবজ্ঞা করা হয়েছিলো। তাঁর সুসমাচার ছিলো শান্তি ও শুভেচ্ছার বার্তা। তিনি সকলকে তাঁর উদাহরণ অনুসরণ
  করার জন্য আহ্বান করেছিলেন। তিনি ফিলিস্তিনের রাস্তায় হেঁটে, অসুস্থদের নিরাময় করেছিলেন, অন্ধকে দৃষ্টি
  দিয়েছিলেন এবং মৃতদের জীবিত করেছিলেন। তিনি অনন্তকালের সত্যতা, আমাদের প্রাথমিক জীবনের অস্তিত্বের বাস্তবতা,
  পৃথিবীতে আমাদের জীবনের উদ্দেশ্য এবং ঈশ্বরের পুত্র ও কন্যাদের ভবিষ্যৎ জীবনের সম্ভাবনার জন্য শিক্ষা দিয়েছেন।
- তাঁর মহান আত্মত্যাগের অনুস্মারক হিসাবে তিনি প্রভুর ভোজের প্রচলন করেছিলেন। তাঁকে গ্রেফতার করা হয়েছিলো
  এবং মিথ্যা অভিযোগ দাওয়া হয়েছিলো, জনসাধারণকে সন্তুষ্ট করার জন্য তাকে দোষী সাব্যস্ত করা হয়েছিলো, এবং
  ক্যালভারির ক্রশে মৃত্যুদণ্ডের দায়ে অভিযুক্ত করা হয়েছিলো। তিনি সমস্ত মানবজাতির পাপের জন্য তাঁর জীবন
  আত্মত্যাগ করেছেন। পৃথিবীতে যারা কখনও বসবাস করবে, তাদের সকলের হয়ে তিনি এক মহান প্রতিনিধিত্বমূলক উপহার
  ছিলেন।
- আমরা আন্তরিকভাবে সাক্ষ্য দিচ্ছি যে তাঁর জীবন, যা সমস্ত মানব ইতিহাসের কেন্দ্রস্থল, না তো বেথলেহেমে শুরু
  হয়েছিলো না ক্যালভারিতে শেষ হয়েছিলো। তিনি স্বর্গীয় পিতার প্রথমজাত, দেহের একজাত পুত্র, বিশ্বের মুক্তিদাতা।
- তিনি কবর থেকে উঠে “নিদ্রাগতদের মধ্যে অগ্রিমাংশ হয়েছেন” (১ করিন্থীয় ১৫:২০)। জাগ্রত প্রভু হিসাবে, তিনি
  জীবিত থাকতে যাদের ভালোবেসেছিলেন তাদের মধ্যে তিনি পরিদর্শন করেছিলেন। তিনি প্রাচীন আমেরিকায় তাঁর “আরও
  মেষ” (যোহন ১০:১৬) দের মধ্যেও পরিচর্যা করেছিলেন। আধুনিক বিশ্বের মধ্যে, তিনি ও তাঁর পিতা বালক যোষেফ স্মীথের
  কাছে উপস্থিত হয়েছিলেন, দীর্ঘ-প্রতিশ্রুত “পূর্ণ সময়ের পরিসমাপ্তি”-এর সূচনা করেছিলেন (ইফিষীয় ১:১০)।
- 'জীবন্ত খ্রীষ্টের ব্যাপারে, ভাববাদী যোষেফ লিখেছিলেন: “তাঁর চোখ আগুনের শিখার মতো ছিলো; তাঁর মাথার চুল
  শুভ্র তুষারের মতো সাদা ছিলো; তাঁর মুখাকৃতি সূর্যের উজ্জ্বলতা থেকে উজ্জ্বল এবং তাঁর কণ্ঠস্বর ছিলো জলের
  স্রোতের শব্দের মতো, স্বয়ং যিহোবার কণ্ঠস্বর, যিনি বলছিলেন:'
- “আমিই প্রথম এবং শেষ; আমিই সে যিনি জীবিত আছি, আমিই সে যাকে হত্যা করা হয়েছিলো; আমি পিতার সন্মুখে তোমাদের
  পক্ষে মধ্যস্থতাকারী” (ডি এন্ড সি ১১০:৩–৪)।
- 'তাঁর ব্যাপারে ভাববাদী আরও ঘোষণা করেছেন: “এবং এখন, তাঁর বিষয়ে প্রদত্ত বহু সাক্ষ্যের পর, সর্বশেষ যে
  সাক্ষ্য আমরা তাঁর বিষয়ে দিচ্ছি তা হলো: যে তিনি জীবিত!'
- “আমরা এমনকি তাঁকে ঈশ্বরের ডান দিকে দেখেছি; এবং সেই কণ্ঠস্বর শুনেছি যা সাক্ষ্য দিচ্ছিল যে, তিনিই পিতার
  একজাত পুত্র—
- “তাঁর দ্বারা এবং তাঁর মাধ্যমে এবং তাঁর থেকে পৃথিবী সৃষ্টি হয়েছে ও হয়েছিলো, এবং এর অধিবাসীরা ঈশ্বরের
  পুত্র এবং কন্যা” (ডি এন্ড সি ৭৬:২২–২৪)।
- আমরা আন্তরিকভাবে ঘোষণা করেছি যে তাঁর যাজকত্ব ও তাঁর মন্ডলী পৃথিবীতে পুনঃপ্রতিষ্ঠিত হয়েছে—যা “প্রেরিত
  ও ভাববাদীদের ভিত্তির ওপর স্থাপিত, আর যীশু খ্রীষ্ট স্বয়ং যার প্রধান ভিত্তি প্রস্তর” (ইফিষীয় ২:২০)।
- আমরা সাক্ষ্য দিচ্ছি যে তিনি একদিন পৃথিবীতে ফিরে আসবেন। “আর প্রভুর গৌরব প্রকাশ পাবে, আর সমস্ত মানুষ এক
  সঙ্গে তাহা দেখবে” (যিশাইয় ৪০:৫)। তিনি রাজাদের রাজা হিসাবে শাসন করবেন এবং প্রভুদের প্রভু হিসাবে রাজত্ব
  করবেন, এবং প্রতিটি জানু নত হবে এবং প্রতিটি জিহ্বা তাঁর সন্মুখে আরাধনা করবে। আমাদের প্রত্যেকে আমাদের
  কাজের এবং আমাদের অন্তরের ইচ্ছা অনুযায়ী তাঁর কাছে বিচারিত হতে হবে।
- আমরা,তাঁর যথাযথভাবে নির্ধারিত প্রেরিত হিসেবে, সাক্ষ্য দিচ্ছি—যে যীশুই জীবিত খ্রীষ্ট, ঈশ্বরের অমর পুত্র।
  তিনি মহান রাজা ইম্মানুয়েল, যিনি আজ তাঁর পিতার ডান দিকে দাঁড়িয়ে আছেন। তিনি হলেন জগতের আলো, জীবন, এবং
  আশা। তাঁর পথই হলো সেই পথ,
