title: র বিশ্বাসের বিধিসমূহ
subtitle: শেষকালীন ধার্মিকদের যীশু খ্রীষ্টের মন্ডলী
author: ''
verses:
- n: 1
  text: আমরা অনন্ত পিতা, ঈশ্বর, তাঁর পুত্র, যীশু খ্রীষ্ট এবং পবিত্র আত্মায় বিশ্বাস করি।
  label: ১
- n: 2
  text: আমরা বিশ্বাস করি যে মানুষ তাদের নিজ পাপের জন্য দন্ড পাবে, আদমের অপরাধের জন্য নয়।
  label: ২
- n: 3
  text: আমরা বিশ্বাস করি যে খ্রীষ্টের প্রায়শ্চিত্তের মাধ্যমে, সমস্ত মানব জাতি রক্ষা পাবে, সুসমাচারের
    ধর্মানুষ্ঠানসমূহ এবং বিধি মালার বাধ্যতা দ্বারা।
  label: ৩
- n: 4
  text: 'আমরা বিশ্বাস করি যে, সুসমাচারের সর্ব প্রথম নীতিমালা এবং ধর্মানুষ্ঠানসমূহ হলো: প্রথম, প্রভু যীশু
    খ্রীষ্টে বিশ্বাস; দ্বিতীয়, অনুতাপ; তৃতীয়, পাপের মুক্তির জন্য নিমজ্জন দ্বারা বাপ্তিস্ম ; চতুর্থ,
    পবিত্র আত্মা উপহার দেওয়ার জন্য হস্তার্পণ।'
  label: ৪
- n: 5
  text: আমরা বিশ্বাস করি যে, সুসমাচার প্রচার এবং ধর্মানুষ্ঠানসমূহ পরিচালনা করার জন্য একজন মানুষকে ঈশ্বর
    কর্তৃক আহুত হতে হবে, ভবিষ্যদ্বাণী দ্বারা, ও ভার প্রাপ্তব্যক্তিদের হস্তার্পণ দ্বারা।
  label: ৫
- n: 6
  text: আমরা একই সাংগঠনিক দলে বিশ্বাস করি যা আদিকালীন মন্ডলীতে বিদ্যমান ছিলো, যেমন প্রেরিতগণ, ভাববাদীগণ,
    যাজকগণ, শিক্ষকগণ, প্রচারকগণ, ইত্যাদি।
  label: ৬
- n: 7
  text: আমরা বিভিন্ন ভাষায় কথা বলার আশীর্বাদ, ভবিষ্যদ্বাণী, দৈববাণী, দর্শন, আরোগ্য দান, ভাষার অনুবাদ,
    ইত্যাদিতে বিশ্বাস করি।
  label: ৭
- n: 8
  text: আমরা বিশ্বাস করি বাইবেল ঈশ্বরের বাণী, যতটা নির্ভুল ভাবে অনুবাদ করা হয়েছে; আমরা মরমনের পুস্তককেও
    ঈশ্বরের বাণী রূপে বিশ্বাস করি।
  label: ৮
- n: 9
  text: ঈশ্বর যা কিছু প্রকাশ করেছেন, যা কিছু তিনি এখন প্রকাশ করেন আমরা তার সব কিছুতেই বিশ্বাস করি এবং
    আমরা বিশ্বাস করি যে, তিনি এখনো তাঁর রাজ্য বিষয়ক অনেক মহৎ এবং গুরুত্বপূর্ণ বিষয় প্রকাশ করবেন।
  label: ৯
- n: 10
  text: আমরা বিশ্বাস করি, ইস্রায়েল জাতির আক্ষরিক সমাবেশে এবং দশ বংশের পুনরূদ্ধারে; আমেরিকা মহাদেশের উপরই
    সিয়োন (নতুন যিরূশালেম) নির্মিত হবে; খ্রীষ্ট নিজে পৃথিবীতে রাজত্ব করবেন; এবং পৃথিবী নবায়িত হবে ও
    তার স্বর্গীয় মহিমা ফিরে পাবে।
  label: ১০
- n: 11
  text: আমরা আমাদের বিবেকের নির্দেশ অনুসারে সর্বশক্তিমান ঈশ্বরের আরাধনার সুযোগ দাবি করি, এবং সমস্ত মানুষদের
    একই সুযোগ প্রদান করি, তারা যে যেভাবে, যেখানে, যা কিছুতে থাকুক না কেন, তাদেরকে আরাধনা করার সুযোগ দেওয়া
    হয়।
  label: ১১
- n: 12
  text: আমরা বিশ্বাস করি রাজাগণ, সভাপতিগণ, শাসকবর্গ এবং ম্যাজিস্ট্রেটদের অনুগত হওয়াতে, আজ্ঞাবহ হওয়াতে,
    সম্মান দেওয়াতে এবং আইন-শৃঙ্খলা ধরে রাখাতে।
  label: ১২
- n: 13
  text: আমরা সৎ, সত্যবাদী, বিশুদ্ধতায়, দয়ালু ও সুনীতিসম্পন্ন হওয়ায় এবং সকলের প্রতি সৎকর্ম করায় বিশ্বাস
    করি; নিশ্চয়ই, আমরা বলতে পারি যে আমরা পৌলের পরামর্শ অনুসরণ করি—আমরা সবকিছুতে বিশ্বাস করি, সবকিছুতে
    প্রত্যাশা রাখি, আমরা অনেক কিছু সহ্য করেছি এবং আশা রাখি আমরা সব কিছু সহ্য করতে সমর্থ হবো। যদি কোনো
    কিছু সুনীতিসম্পন্ন, সুন্দর, কীর্তিমান এবং প্রশংসনীয় হয়, আমরা তা পাওয়ার চেষ্টা করি।
  label: ১৩
signature: যোষেফ স্মীথ।
