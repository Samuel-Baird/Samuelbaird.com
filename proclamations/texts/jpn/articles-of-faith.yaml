title: の信仰箇条
subtitle: 末日聖徒イエス・キリスト教会
author: ''
verses:
- n: 1
  text: 1わたしたちは、永遠の父なる神と、その御子イエス・キリストと、聖霊とを信じる。
- n: 2
  text: 2わたしたちは、人は自分の罪のゆえに罰せられ、アダムの背きのゆえには罰せられないことを信じる。
- n: 3
  text: 3わたしたちは、キリストの贖罪により、全人類は福音の律法と儀式に従うことによって救われ得ると信じる。
- n: 4
  text: 4わたしたちは、福音の第一の原則と儀式とは、第一に主イエス・キリストを信じる信仰、第二に悔い改め、第三に罪の赦しのために水に沈めるバプテスマ、第四に聖霊の賜物を授けるための按手であることを信じる。
- n: 5
  text: 5わたしたちは、福音を宣べ伝え、その儀式を執行するためには、人は預言によって、また権能を持つ者による按手によって、神から召されなければならないと信じる。
- n: 6
  text: 6わたしたちは、初期の教会にあったと同一の組織、すなわち、使徒、預言者、牧者、教師、祝福師などがあることを信じる。
- n: 7
  text: 7わたしたちは、異言、預言、啓示、示現、癒し、異言の解釈などの賜物があることを信じる。
- n: 8
  text: 8わたしたちは、正確に翻訳されているかぎり、『聖書』は神の言葉であると信じる。また、『モルモン書』も神の言葉であると信じる。
- n: 9
  text: 9わたしたちは、神がこれまでに啓示されたすべてのこと、神が今啓示されるすべてのことを信じる。またわたしたちは、神がこの後も、神の王国に関する多くの偉大で重要なことを啓示されると信じる。
- n: 10
  text: 10わたしたちは、イスラエルの文字どおりの集合と十部族の回復とを信じる。また、シオン（新エルサレム）がアメリカ大陸に築かれること、キリストが自ら地上を統治されること、そして地球は更新されて楽園の栄光を受けることを信じる。
- n: 11
  text: 11わたしたちは、自分の良心の命じるとおりに全能の神を礼拝する特権があると主張し、またすべての人に同じ特権を認める。彼らがどのように、どこで、何を礼拝しようと、わたしたちはそれを妨げない。
- n: 12
  text: 12わたしたちは、王、大統領、統治者、長官に従うべきこと、法律を守り、尊び、支えるべきことを信じる。
- n: 13
  text: 13わたしたちは、正直、真実、純潔、慈善、徳高くあるべきこと、またすべての人に善を行うべきことを信じる。実に、わたしたちはパウロの勧告に従うと言ってもよい。わたしたちはすべてのことを信じ、すべてのことを望む。わたしたちはすでに多くのことを堪え忍んできており、またすべてのことを堪え忍べるようにと望んでいる。どのようなことでも、徳高いこと、好ましいこと、あるいは誉れあることや称賛に値することがあれば、わたしたちはこれらのことを尋ね求めるものである。
signature: ジョセフ・スミス
