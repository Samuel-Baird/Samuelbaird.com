title: Kristus yang Hidup
subtitle: Kesaksian dari Para Rasul
author: Gereja Yesus Kristus dari Orang-Orang Suci Zaman Akhir
paragraphs:
- Pada saat kita memperingati kelahiran Yesus Kristus dua ribu tahun yang lalu, kami menyampaikan kesaksian
  kami akan kenyataan kehidupan-Nya yang tak tertandingi dan kebajikan tanpa batas Kurban Pendamaian-Nya
  yang agung. Tidak ada seorang lain pun yang memiliki pengaruh yang demikian dalam ke atas semua orang
  yang pernah hidup dan yang masih akan hidup di atas bumi ini.
- Dia adalah Yehova Agung dari Perjanjian Lama, Mesias dari Perjanjian Baru. Di bawah arahan Bapa-Nya,
  Dia adalah pencipta bumi. “Segala sesuatu dijadikan oleh Dia dan tanpa Dia tidak ada suatu pun yang
  telah jadi dari segala yang telah dijadikan” (Yohanes 1:3). Meskipun tanpa dosa, Dia dibaptiskan untuk
  menggenapi segala kebenaran. Dia “berjalan berkeliling sambil berbuat baik” (Kisah Para Rasul 10:38),
  tetapi dipandang rendah karenanya. Injil-Nya adalah pesan damai sejahtera dan niat baik. Dia mengundang
  agar semua orang mengikuti teladan-Nya. Dia berjalan di jalan-jalan Palestina, menyembuhkan yang sakit,
  mencelikkan yang buta, dan membangkitkan yang mati. Dia mengajarkan kebenaran tentang kekekalan, kenyataan
  keadaan prafana kita, tujuan kehidupan kita di bumi, dan potensi bagi para putra dan putri Allah dalam
  kehidupan yang akan datang.
- Dia menetapkan sakramen sebagai peringatan akan Kurban Pendamaian-Nya yang agung. Dia ditangkap dan
  dihukum atas tuduhan-tuduhan palsu, dinyatakan bersalah untuk memuaskan keinginan gerombolan orang banyak,
  dan dijatuhi hukuman untuk mati di kayu salib Kalvari. Dia menyerahkan nyawa-Nya untuk mendamaikan dosa-dosa
  seluruh umat manusia. Dia adalah karunia besar pengganti bagi semua orang yang pernah dan akan hidup
  di bumi.
- Kami dengan khusyuk bersaksi bahwa kehidupan-Nya, yang adalah pusat dari seluruh sejarah manusia, tidak
  dimulai di Betlehem maupun berakhir di Kalvari. Dia adalah Putra Sulung Bapa, Putra Tunggal yang diperanakkan
  dalam daging, Penebus dunia.
- Dia bangkit dari kubur untuk menjadi “yang sulung dari orang-orang yang telah meninggal” (1 Korintus
  15:20). Sebagai Tuhan yang telah Bangkit, Dia mengunjungi orang-orang yang telah Dia kasihi semasa hidup-Nya.
  Dia juga melayani di antara “domba-domba lain”-Nya (Yohanes 10:16) di Amerika kuno. Di dunia modern,
  Dia dan Bapa-Nya menampakkan diri kepada anak muda Joseph Smith, mengawali “kegenapan waktu” (Efesus
  1:10) yang telah lama dijanjikan.
- 'Mengenai Kristus Yang Hidup, Nabi Joseph menulis: “Mata-Nya bagaikan nyala api; rambut kepala-Nya putih
  bagaikan salju murni; air muka-Nya bersinar melebihi kecemerlangan matahari; dan suara-Nya bagaikan
  bunyi deru perairan luas, bahkan suara Yehova, memfirmankan:'
- ‘Aku adalah yang pertama dan yang terakhir; Aku adalah Dia yang hidup, Aku adalah Dia yang dibunuh;
  Aku adalah pembelamu di hadapan Bapa’” (A&P 110:3–4).
- 'Mengenai Dia Nabi juga menyatakan: “Dan sekarang, setelah banyak kesaksian yang telah diberikan tentang
  Dia, inilah kesaksian, yang terakhir dari semuanya, yang kami berikan tentang Dia: Bahwa Dia hidup!'
- Karena kami melihat-Nya, bahkan pada sisi kanan Allah; dan kami mendengar suara yang memberikan kesaksian
  bahwa Dia adalah Anak Tunggal Bapa—
- Bahwa oleh Dia, dan melalui Dia, dan dari Dia, dunia-dunia ada dan diciptakan, dan penghuninya adalah
  para putra dan putri yang diperanakkan bagi Allah” (A&P 76:22–24).
- Kami menyatakan dengan khusyuk bahwa imamat-Nya dan Gereja-Nya telah dipulihkan di atas bumi—“yang dibangun
  di atas dasar para rasul dan para nabi, dengan Kristus Yesus sebagai batu penjuru” (Efesus 2:20).
- Kami bersaksi bahwa kelak Dia akan kembali ke bumi. “Maka kemuliaan Tuhan akan dinyatakan dan seluruh
  umat manusia akan melihatnya bersama-sama” (Yesaya 40:5). Dia akan memerintah sebagai Raja di atas segala
  raja dan Tuan di atas segala tuan, dan setiap lutut akan bertelut dan setiap lidah akan berbicara dalam
  pemujaan di hadapan-Nya. Kita masing-masing akan berdiri untuk diadili oleh-Nya sesuai dengan perbuatan
  dan hasrat hati kita.
- Kami bersaksi, sebagai para Rasul-Nya yang sungguh-sungguh ditahbiskan—bahwa Yesus adalah Kristus yang
  Hidup, Putra baka Allah. Dia adalah Raja Imanuel yang agung, yang sekarang berdiri di sebelah kanan
  Bapa-Nya. Dia adalah terang, kehidupan, dan pengharapan dunia. Jalan-Nya adalah jalan yang menuntun
  pada kebahagiaan dalam kehidupan ini dan kehidupan kekal di dunia yang akan datang. Syukur kepada Allah
  atas karunia Putra Ilahi-Nya yang tak tertandingi.
