title: Pemulihan Kegenapan Injil Yesus Kristus
subtitle: Pernyataan Peringatan Dua Ratus Tahun kepada Dunia
author: Presidensi Utama dan Dewan Dua Belas Rasul Gereja Yesus Kristus dari Orang-Orang Suci Zaman Akhir
note: Pernyataan ini dibacakan oleh Presiden Russell M. Nelson sebagai bagian dari pesannya pada Konferensi
  Umum Tahunan ke-190, 5 April 2020, di Salt Lake City, Utah.
paragraphs:
- Kami dengan khusyuk menyatakan bahwa Allah mengasihi anak-anak-Nya di setiap bangsa di dunia. Allah
  Bapa telah memberikan kepada kita kelahiran ilahi, kehidupan yang tak tertandingi, dan Kurban Pendamaian
  yang tak terbatas dari Putra Terkasih-Nya, Yesus Kristus. Dengan kuasa dari Bapa, Yesus bangkit kembali
  dan memperoleh kemenangan atas kematian. Dia adalah Juruselamat kita, Teladan kita, dan Penebus kita.
- Dua ratus tahun lalu, di pagi musim semi yang indah pada tahun 1820, Joseph Smith muda, berusaha untuk
  mengetahui gereja mana yang harus diikuti, pergi ke hutan untuk berdoa dekat rumahnya di bagian utara
  New York, AS. Dia memiliki pertanyaan perihal keselamatan jiwanya dan percaya bahwa Allah akan mengarahkan
  dia.
- Dalam kerendahhatian, kami menyatakan bahwa sebagai jawaban terhadap doanya, Allah Bapa dan Putra-Nya,
  Yesus Kristus, menampakkan diri kepada Joseph dan menginaugurasi “pemulihan segala sesuatu” (Kisah Para
  Rasul 3:21) sebagaimana diramalkan dalam Alkitab. Dalam penglihatan ini, dia memperoleh pengetahuan
  bahwa setelah kematian para Rasul awal, Gereja Perjanjian Baru Kristus lenyap dari bumi. Joseph akan
  menjadi alat dalam mengembalikannya.
- Kami menegaskan bahwa di bawah arahan Bapa dan Putra, para utusan surgawi datang untuk memberikan petunjuk
  kepada Joseph dan menegakkan kembali Gereja Yesus Kristus. Yohanes Pembaptis yang telah bangkit memulihkan
  wewenang untuk membaptiskan melalui pencelupan untuk pengampunan akan dosa-dosa. Tiga dari dua belas
  Rasul awal—Petrus, Yakobus, dan Yohanes—memulihkan kerasulan dan kunci-kunci wewenang imamat. Yang lain
  juga datang, termasuk Elia, yang memulihkan wewenang untuk mempersatukan keluarga bersama selama-lamanya
  dalam hubungan kekal yang melampaui kematian.
- 'Kami lebih lanjut bersaksi bahwa Joseph Smith diberi karunia dan kuasa Allah untuk menerjemahkan sebuah
  catatan kuno: Kitab Mormon—Satu Kesaksian Lagi tentang Yesus Kristus. Halaman-halaman dari teks sakral
  ini mencakup sebuah kisah tentang pelayanan pribadi Yesus Kristus di antara orang-orang di Belahan Bumi
  bagian Barat segera setelah Kebangkitan-Nya. Itu mengajarkan tentang tujuan kehidupan dan menjelaskan
  ajaran Kristus, yang adalah sentral bagi tujuan itu. Sebagai tulisan suci rekanan untuk Alkitab, Kitab
  Mormon bersaksi bahwa seluruh umat manusia adalah putra dan putri dari seorang Bapa di Surga yang penuh
  kasih, bahwa Dia memiliki rencana ilahi bagi kehidupan kita, dan bahwa Putra-Nya, Yesus Kristus, berbicara
  di zaman sekarang seperti juga di zaman dahulu.'
- Kami menyatakan bahwa Gereja Yesus Kristus dari Orang-Orang Suci Zaman Akhir, diorganisasi pada tanggal
  6 April 1830, adalah Gereja Perjanjian Baru Kristus yang dipulihkan. Gereja ini tersauh pada kehidupan
  yang sempurna dari batu penjuru utamanya, Yesus Kristus, dan pada Pendamaian tak terbatas serta Kebangkitan
  harfiah-Nya. Yesus Kristus sekali lagi telah memanggil para Rasul dan telah memberi mereka wewenang
  imamat. Dia mengundang kita semua untuk datang kepada-Nya dan pada Gereja-Nya, untuk menerima Roh Kudus,
  tata cara-tata cara keselamatan, dan untuk memperoleh sukacita abadi.
- Dua ratus tahun kini telah berlalu sejak Pemulihan ini diinisiasi oleh Allah Bapa dan Putra Terkasih-Nya,
  Yesus Kristus. Jutaan orang di seluruh dunia telah memiliki suatu pengetahuan tentang peristiwa yang
  telah dinubuatkan ini.
- Kami dengan senang hati menyatakan bahwa Pemulihan yang telah dijanjikan berjalan maju melalui wahyu
  yang berkesinambungan. Bumi tidak akan pernah lagi sama, karena Allah akan “mempersatukan di dalam Kristus
  sebagai Kepala segala sesuatu” (Efesus 1:10).
- Dengan kekhidmatan dan rasa syukur, kami sebagai para Rasul-Nya mengundang semua orang untuk mengetahui—sebagaimana
  kami mengetahuinya—bahwa surga terbuka. Kami menegaskan bahwa Allah menyatakan kehendak-Nya bagi para
  putra dan putri terkasih-Nya. Kami bersaksi bahwa mereka yang dengan doa yang sungguh-sungguh menelaah
  pesan Pemulihan dan bertindak dengan iman akan diberkati untuk memperoleh kesaksian mereka sendiri akan
  keilahiannya dan akan tujuannya untuk mempersiapkan dunia bagi Kedatangan Kedua yang dijanjikan dari
  Tuhan dan Juruselamat kita, Yesus Kristus.
