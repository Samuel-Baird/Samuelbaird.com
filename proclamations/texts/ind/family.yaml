title: Keluarga
subtitle: Pernyataan kepada Dunia
author: Presidensi Utama dan Dewan Dua Belas Rasul Gereja Yesus Kristus dari Orang-Orang Suci Zaman Akhir
note: Pernyataan ini dibacakan oleh Presiden Gordon B. Hinckley sebagai bagian dari pesannya pada Pertemuan
  Umum Lembaga Pertolongan yang diadakan pada tanggal 23 September 1995, di Salt Lake City, Utah.
paragraphs:
- Kami, Presidensi Utama dan Dewan Dua Belas Rasul Gereja Yesus Kristus dari Orang-Orang Suci Zaman Akhir,
  dengan khusyuk menyatakan bahwa pernikahan antara seorang pria dan seorang wanita ditetapkan oleh Allah
  dan bahwa keluarga merupakan yang inti dari rencana Sang Pencipta untuk takdir kekal anak-anak-Nya.
- Seluruh umat manusia—pria dan wanita—diciptakan menurut rupa Allah. Masing-masing adalah putra atau
  putri roh terkasih dari orang tua surgawi, dan, sebagai yang demikian, masing-masing memiliki kodrat
  dan takdir yang ilahi. Jenis kelamin merupakan karakteristik penting dari identitas dan tujuan prafana,
  fana, dan kekal setiap individu.
- Dalam alam prafana, para putra dan putri roh mengenal dan memuja Allah sebagai Bapa Kekal mereka dan
  menerima rencana-Nya yang melaluinya anak-anak-Nya dapat memperoleh tubuh jasmani dan mendapatkan pengalaman
  duniawi untuk maju ke arah kesempurnaan dan pada akhirnya menyadari kodrat ilahi mereka sebagai ahli
  waris kehidupan kekal. Rencana kebahagiaan yang ilahi memungkinkan hubungan keluarga untuk dilanjutkan
  setelah kematian. Tata cara-tata cara dan perjanjian-perjanjian sakral yang tersedia di bait suci yang
  kudus memungkinkan bagi setiap individu untuk kembali ke hadirat Allah dan bagi keluarga-keluarga untuk
  disatukan secara kekal.
- Perintah pertama yang Allah berikan kepada Adam dan Hawa berkaitan dengan potensi mereka untuk menjadi
  orang tua, sebagai suami dan istri. Kami menyatakan bahwa perintah Allah bagi anak-anak-Nya untuk beranak
  cucu dan memenuhi bumi tetap berlaku. Kami selanjutnya menyatakan bahwa Allah telah memerintahkan agar
  kuasa prokreasi yang sakral ini digunakan hanya antara pria dan wanita, yang telah dinikahkan secara
  resmi sebagai suami dan istri.
- Kami menyatakan cara yang melaluinya kehidupan fana diciptakan telah ditetapkan secara ilahi. Kami menegaskan
  kekudusan kehidupan dan tentang pentingnya itu dalam rencana kekal Allah.
- Suami dan istri memiliki tanggung jawab khusyuk untuk mengasihi dan memelihara satu sama lain dan anak-anak
  mereka. “Anak-anak … adalah milik pusaka daripada Tuhan” (Mazmur 127:3). Orang tua memiliki kewajiban
  sakral untuk membesarkan anak-anak mereka dalam kasih dan kesalehan, menyediakan kebutuhan fisik dan
  rohani mereka, dan mengajari mereka untuk saling mengasihi dan melayani, mematuhi perintah-perintah
  Allah, dan menjadi penduduk yang mematuhi hukum di mana pun mereka tinggal. Para suami dan istri—ibu
  dan ayah—akan diminta bertanggung jawab di hadapan Allah untuk pelaksanaan kewajiban-kewajiban ini.
- Keluarga ditetapkan oleh Allah. Pernikahan antara pria dan wanita adalah penting bagi rencana kekal-Nya.
  Anak-anak berhak untuk dilahirkan dalam ikatan perkawinan, dan untuk dibesarkan oleh seorang ayah dan
  seorang ibu yang menghormati perjanjian perkawinan dengan kesetiaan mutlak. Kebahagiaan dalam kehidupan
  keluarga paling mungkin dicapai bila didasarkan pada ajaran-ajaran Tuhan Yesus Kristus. Pernikahan dan
  keluarga yang berhasil ditegakkan dan dipertahankan dengan asas-asas iman, doa, pertobatan, pengampunan,
  rasa hormat, kasih, rasa iba, kerja, dan kegiatan rekreasi yang sehat. Berdasarkan rancangan ilahi,
  para ayah harus mengetuai keluarga mereka dalam kasih dan kesalehan, serta bertanggung jawab untuk menyediakan
  kebutuhan hidup dan perlindungan bagi keluarga mereka. Para ibu terutama bertanggung jawab bagi pengasuhan
  anak-anak mereka. Dalam tanggung jawab sakral ini, para ayah dan ibu berkewajiban untuk saling membantu
  sebagai pasangan yang setara. Kecacatan, kematian, atau keadaan lainnya mungkin mengharuskan penyesuaian
  peran individu. Kerabat lainnya hendaknya memberikan dukungan bila dibutuhkan.
- Kami memperingatkan bahwa individu yang melanggar perjanjian kesucian, yang menganiaya pasangan atau
  keturunan, atau yang gagal memenuhi tanggung jawab keluarga kelak akan mempertanggungjawabkannya di
  hadapan Allah. Lebih lanjut, kami memperingatkan bahwa kehancuran keluarga akan mendatangkan, kepada
  individu, masyarakat, dan bangsa, bencana yang dinubuatkan oleh para nabi zaman dahulu dan zaman modern.
- Kami meminta para penduduk dan pejabat pemerintahan yang bertanggung jawab di mana pun untuk meningkatkan
  langkah-langkah tersebut yang dirancang untuk mempertahankan dan memperkuat keluarga sebagai unit dasar
  masyarakat.
