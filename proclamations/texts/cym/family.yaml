title: Y Teulu
subtitle: Arddatganiad i’r Byd
author: Y Brif Lywyddiaeth a Chyngor y Deuddeg Apostolion o Eglwys Iesu Grist Saint y Dyddiau Diweddar
note: Darllenwyd y datganiad hwn gan Llywydd Gordon B. Hinckley fel rhan o’i neges yng Nghyfarfod Cyffredinol
  y Gymdeithas Cariad Pur a gynhaliwyd ar 23 Medi 1995 yn Salt Lake City, Utah.
paragraphs:
- Ymrydim ni’r Brif Lywyddiaeth a Chyngor y Deuddeg Apostolion o Eglwys Iesu Grist Saint y Dyddiau Diweddar
  yn arddatganu’n ddifrifol fod priodas rhwng dyn a menyw wedi’i hordeinio gan Dduw a bod y teulu’n ganolog
  i gynllun y crëwr ar gyfer tynged dragwyddol Ei blant.
- Mae pop bod dynol, yn wryw ac yn fenyw, wedi’u creu yn ndelw Duw. Mae pop un yn fab neu’n ferch ysbrydol
  annwyl i rieni nefol, ac felly, mae gan bob un natur a thynged ddwyfol. Mae rhyw yn nodwedd hanfodol
  o anianaeth a diben unigol—cyn—farwel, marwol a tragwyddol.
- Yn y deyrnas cyn-marwol, roedd meibion a merched ysbrydol yn adnabod ac yn addoli Duw fel eu Tad Tragwyddol,
  ac yn derbyn Ei gynllun a fyddai’n galluogi Ei blant i gael corff corfforol ac ennill profiad daearol
  er mwyn symud ymlaen tuag at berffeithrwydd ac yn y pen draw, wireddu eu tynged ddwyfol fel etifeddion
  bywyd tragwyddol. Mae cynllun dwyfol hapusrwydd yn galluogi parhau a pherthnasoedd teuluol y tŷ hwnt
  i’r bedd. Mae ordinhadau a chyfamodau cysegredig sydd ar gael mewn temlau sanctaidd yn ei gwneud yn
  bosib i unigolion ddychwelyd i bresenoldeb Duw ac i deuluoedd gael eu huno am byth.
- Roedd y gorchymyn cyntaf a roddodd i Adda ac Efa yn ymwneud a’u potensial i fod yn rhieni fel gŵr a
  gwraig. Rydym yn datgan bod gorchymyn Duw i’w blant luosi ac ail-boblogi’r ddaear yn parhau mewn grym.
  Datganwn ymhellach fod Duw wedi gorchymyn na ddylid defnyddio pwerau cysegredig atgenhedlu ond rhwng
  dyn a menyw sydd wedi’u priodi’n gyfreithlon fel gŵr a gwraig.
- Datganwn fod y modd y caiff bywyd marwol ei greu wedi’i benodi gan Dduw. Cadarnhawn sancteiddrwydd bywyd
  a’i phwysigrwydd yng nghynllun tragwyddol Dduw.
- Mae gan ŵr a gwraig gyfrifoldeb difrifol i garu a gofalu am ei gilydd ac am eu plant. “Etifeddiaeth
  gan yr Arglwyddyw plant” (Salm 127:3). Mae gan rieni ddyletswydd sanctaidd i fagu eu plant mewn cariad
  a chyfiawnder, i ddarparu ar gyfer eu hanghenion corfforol ac ysbrydol, ac i’w dysgu i garu a gwasanaethu
  ei gilydd, i gadw gorchmynion Duw, ac i fod yn ddinasyddion sy’n ufuddhau i’r gyfraith ble bynnag y
  maent yn byw. Bydd gwŷr a gwragedd—mamau a thadau—yn atebol gerbron Duw am gyflawni’r rhwymedigaethau
  hyn.
- Mae’r teulu wedi’i ordeinio gan Dduw. Mae priodas rhwng dyn a menyw yn hanfodol i’w gynllun tragwyddol.
  Mae gan blant hawl i gael eu geni o fewn rhwymau priodas, ac i gael eu magu gan dad a mam sy’n parchu
  addunedau priodasol gyda ffyddlondeb llwyr. Mae’n fwyaf tebygol y ceir hapusrwydd ym mywyd teuluol pan
  gaiff ei sefydlu ar ddysgeidiaeth yr Arglwydd Iesu Grist. Sefydlir a chynhelir priodasau a theuluoedd
  llwyddiannus ar egwyddorion ffydd, gweddi, edifeirwch, maddeuant, parch, cariad, tosturi, gwaith, a
  gweithgareddau hamdden iachus. Yn ôl trefniant dwyfol, mae tadau i lywyddu dros eu teuluoedd mewn cariad
  a chyfiawnder, ac maent yn gyfrifol am ddarparu anghenion bywyd ac amddiffyniad i’w teuluoedd. Mamau
  sydd â’r prif gyfrifoldeb am fagu eu plant. Yn y cyfrifoldebau cysegredig hyn, mae dyletswydd ar dadau
  a mamau i gynorthwyo ei gilydd fel partneriaid cyfartal. Gall anabledd, marwolaeth, neu amgylchiadau
  eraill olygu bod angen addasiadau unigol. Dylai teuluoedd estynedig roi cymorth pan fo angen.
- Rydym yn rhybuddio y bydd unigolion sy’n torri cyfamodau diweirdeb, sy’n cam-drin priod neu blant, neu
  sy’n methu â chyflawni cyfrifoldebau teuluol, yn atebol gerbron Duw un diwrnod. At hynny, rydym yn rhybuddio
  y bydd ymchwalu’r teulu yn dwyn ar unigolion, cymunedau a chenhedloedd y trychinebau a ragfynegwyd gan
  broffwydi hynafol a modern.
- Alwadwn ar ddinasyddion cyfrifol a swyddogion llywodraeth ym mhobman i hyrwyddo’r mesurau hynny sydd
  wedi’u llunio i gynnal a chryfhau’r teulu fel yr uned sylfaenol cymdeithas.
