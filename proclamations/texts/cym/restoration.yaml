retrieved: '2026-11-02'
title: Yr Adferiad o Gyflawnder Efengyl Iesu Grist
subtitle: Arddatganiad Dwy-ganrifol i’r Byd
author: Y Brif Lywyddiaeth a Chyngor y Deuddeg Apostol o Eglwys Iesu Grist Saint y Dyddiau Diwethaf
note: Gafodd yr arddatganiad hwn ei ddarllen gan Lywydd Russell M. Nelson fel rhan o’i neges at y 190ain
  Cynhadledd Fyd-eang Flynyddol, Ebrill 5, 2020 yn Ninas Llyn Halen, Utah.
paragraphs:
- Yr ydym yn arddatgan o ddifrif bod Duw yn caru Ei blant ym mhob cenedl o’r byd. Rhoddodd Duw Tad i ni’r
  enedigaeth ddwyfol, y bywyd anghymharol, a’r aberth cymodol anfeidrol o’i Fab Annwyl, Iesu Grist. Trwy
  nerth y Tad, cyfododd Iesu eto ac enillodd y fuddugoliaeth dros farwolaeth. Fe ydi ein Hiachawdwr, ein
  Henghraifft, ac ein Gwaredwr.
- Dwy gant o flynyddoedd yn ôl, ar fore hardd gwanwyn yn 1820, wnaeth Joseph Smith ifanc, wrth chwilio
  i wybod pa eglwys i ymuno gyda, mynd i’r coed i weddïo yn agos i’w dŷ ym mlaenau Efrog Newydd, UDA.
  Roedd ganddo gwestiynau ynglŷn ag iachawdwriaeth ei enaid ac ymddiriedodd fod Duw am gyfarwyddo fe.
- Mewn gostyngeiddrwydd, yr ydym yn datgan bod mewn ymateb i’w weddi, wnaeth Duw Tad a’I Fab, Iesu Grist,
  ymddangos i Joseph ac urddfreiniasant “adferiad pob peth” (Actau 3:21) fel rhagfynegwyd yn y Beibl.
  Yn y weledigaeth hon, dysgodd bod yn dilyn marwolaeth o’r Apostolion gwreiddiol, roedd Eglwys y Testament
  Newydd Crist ar goll oddi wrth y ddaear. Bydd Joseph yn offerynnol i’w dychweliad.
- Yr ydym yn cadarnhau bod o dan gyfarwyddo’r Tad a’r Mab, daeth negeswyr nefol i ddysgu Joseph ac ailsefydlu
  Eglwys Iesu Grist. Adferodd Ioan Fedyddiwr atgyfoded yr awdurdod i fedyddio trwy drochiad am ollyngdod
  pechodau. Adferodd tri o Apostolion gwreiddiol Iesu—Pedr, Iago, ac Ioan—yr apostolaeth ac allweddi awdurdod
  offeiriadaethol. Doed eraill hefyd, yn cynnwys Elias, yr hwn adferodd yr awdurdod i huno teuluoedd at
  ei gilydd am byth mewn perthnasoedd tragwyddol sy’n trosgynnu marwolaeth.
- 'Yr ydym yn tystiolaethu bellach bod Joseph Smith wedi derbyn rhodd a gallu Duw i gyfieithu coflyfr
  hynafol: Llyfr Mormon—Testament Arall am Iesu Grist. Mae tudalennau o’r testun sanctaidd yma yn cynnwys
  adroddiad o weinyddiaeth bersonol Iesu Grist ymysg pobl yn yr Hemisffer Gorllewinol yn fuan ar ôl Ei
  Atgyfodiad. Mae’n dysgu pwrpas bywyd ac yn esbonio athrawiaeth Crist sy’n ganolog i’r pwrpas hwn. Fel
  ysgrythur cydymaith i’r Beibl, mae’r Llyfr Mormon yn tystiolaethu bod pob bodau dynol yn feibion a merched
  i Dad cariadus yn y Nefoedd, bod E gyda chynllun dwyfol am ein bywydau, a bod Ei Fab, Iesu Grist, yn
  siarad heddiw yn ogystal â dyddiau cynt.'
- Yr ydym yn datgan bod Eglwys Iesu Grist Saint y Dyddiau Diwethaf, trefnwyd ar Ebrill 6, 1830, ydi Eglwys
  y Testament Newydd Crist wedi ei adfer. Mae’r Eglwys wedi ei angori mewn bywyd perffaith o’i brif gonglfaen,
  Iesu Grist, ac mewn Ei Gymod anfeidrol ac Atgyfodiad llythrennol. Galwodd Iesu Grist Apostolion eto
  a roddodd iddynt awdurdod offeiriadaethol. Gwahoddodd E gyd ohonom ni i ddod ato Fe a’I Eglwys, i dderbyn
  yr Ysbryd Glân, ordinhadau iachawdwriaeth, ac i ennill llawenydd parhaol.
- Aed dwy gant o flynyddoedd ers cafodd yr Adferiad ei gychwyn gan Dduw Tad a’I Fab Annwyl, Iesu Grist.
  Mae miliynau trwy’r byd wedi derbyn gwybodaeth o’r digwyddiadau proffwydedig rhain.
- Yr ydym yn datgan yn llawen fod yr addewid Adferiad yn mynd ymlaen trwy ddatguddiad parhaus. Ni fydd
  y ddaear yr un fath byth eto, gan fydd Duw yn “dwyn yr holl greadigaeth i undod yng Nghrist” (Effesiaid
  1:10).
- Gyda pharchedigaeth a diolchgarwch, yr ydym ni Ei Apostolion yn gwahodd pawb i gwybod—fel yr ydym yn
  gwybod—bod y nefoedd ar agor. Yr ydym yn cadarnhau bod Duw yn gwneud hysbys Ei ewyllys am Ei feibion
  a merched annwyl. Yr ydym yn tystiolaethu bod y rhai sy’n astudio’n weddigar neges yr Adferiad a gweithredu
  mewn ffydd bydd ei fendithio i ennill tyst ei hunan o’i ddwyfoliaeth ac o’i bwrpas i baratoi’r byd am
  yr Ail Ddyfodiad addewid o’n Harglwydd ac Iachawdwr, Iesu Grist.
