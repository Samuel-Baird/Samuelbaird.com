title: Ethryglau Ffydd
subtitle: yr Eglwys Iesu Grist Saint y Dyddiau Diwethaf
author: ''
verses:
- n: 1
  text: Credwn ni mewn Duw, y Tad Tragwyddol, ac mewn Ei Fab, Iesu Grist, ac mewn yr Ysbryd Glân.
- n: 2
  text: Credwn ni fydd unigolion yn cael eu cosbi am bechodau eu hunain, ac nid am gamwedd Adda.
- n: 3
  text: Credwn ni fod trwy gymod Grist, gall holl ddynolryw cael eu hachub, trwy ufudd-dod i gyfreithiau
    ac ordinhadau’r Efengyl.
- n: 4
  text: 'Credwn ni fod egwyddorion ac ordinhadau cyntaf yr Efengyl yw: yn gyntaf, Ffydd yn yr Arglwydd
    Iesu Grist; yn ail, edifeirwch; yn drydydd, Bedyddio gan drochiad am ollyngdod pechodau; yn bedwerydd,
    Arddodiad dwylo am rodd yr Ysbryd Glân.'
- n: 5
  text: Credwn ni fod rhaid i unigolyn cael ei alw gan Dduw trwy broffwydoliaeth, a gan arddodiad dwylo
    gan y rhai sydd efo’r awdurdod, i bregethu’r Efengyl a gweinyddu yn yr ordinhadau o hynny.
- n: 6
  text: Credwn ni mewn yr un sefydliad a bodolodd yn yr Eglwys wreiddiol, sef, apostolion, proffwydi,
    gweinidogion, athrawon, efengylwyr ac yn y blaen.
- n: 7
  text: Credwn ni mewn y rhodd o dafodau, proffwydoliaeth, datguddiad, gweledigaethau, iacháu, dehongliad
    o dafodau, ac yn y blaen.
- n: 8
  text: Credwn ni fod y Beibl yn air Dduw mor bell iddo gael ei gyfieithu yn gywir; Credwn ni hefyd bod
    y Llyfr Mormon yn air Dduw.
- n: 9
  text: Credwn ni bopeth mae Duw wedi datguddio, popeth datguddia Fe nawr, a chredwn ni fydd E’n eto datguddio
    llawer o bethau mawr a phwysig i ymwneud a Theyrnas Dduw.
- n: 10
  text: 'Credwn ni mewn y casgliad llythrennol o Israel ac mewn adferiad y Deg Llwyth; bydd Seion (y Jerwsalem
    Newydd) yn cael ei adeiladu ar y cyfandir Americaidd: bydd Grist yn teyrnasu yn bersonol ar y ddaear;
    ac, bydd y ddaear yn cael ei adnewyddu a derbyn ei gogoniant paradwysol.'
- n: 11
  text: Hawliom ni’r fraint i addoli Duw Hollalluog yn ôl gorchmynion ein cydwybod bersonol, ac yn ymestyn
    yr un hawl i bob unigolyn, gad iddyn nhw addoli sut, ble, neu beth ddewisent.
- n: 12
  text: Credwn ni mewn bod yn ddeiliad i frenhinoedd, llywyddion, rheolwyr, ynadon, wrth ufuddhau, anrhydeddu,
    a chynnal y gyfraith.
- n: 13
  text: Credwn ni mewn bod yn onest, gwir, diwair, cyfeillgar, rhinweddol, ac mewn gwneud yn dda tuag
    at bob unigolyn; yn wir, gallwn ni ddeud ein bod yn dilyn cyfarwydded Paul—Credwn ni bopeth, gobeithiwn
    ni bopeth, rydyn ni wedi dyfalbarhau trwy lawer o bethau a gobeithiwn i ddyfalbarhau trwy bopeth.
    Os oes unrhyw beth rhinweddol, hyfryd neu o adroddiad da neu ganmoladwy, ceisiom ni am y pethau hyn.
signature: Joseph Smith.
