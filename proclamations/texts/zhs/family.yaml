title: 家庭
subtitle: 致全世界文告
author: 耶稣基督后期圣徒教会总会会长团及十二使徒议会
note: 本文告由戈登·兴格莱会长于1995年9月23日犹他州盐湖城举行的总会妇女大会宣读，是其信息的一部分。
paragraphs:
- 我们耶稣基督后期圣徒教会总会会长团及十二使徒议会郑重宣告，一男一女之间的婚姻是神所制定，而家庭是造物主为祂子女永恒目标所订计划的核心。
- 全人类，不论男女，都是照着神的形像所造。每个人都是天上父母所心爱的灵体儿女，因为这样，每个人皆有神圣的特性及目标。性别是每个人前生、今生和永恒身分及目的之基本特征。
- 在前生时，灵体儿女知道神是永恒之父，并且崇拜祂，接受祂的计划，借此计划得到骨肉身体，获取尘世经验，迈向完全，终而达成神圣目标，成为永生的继承者。这项神圣的幸福计划使家人的关系可以超越死亡而永远延续，圣殿中的神圣教仪和圣约让人有可能回到神的面前，并使家人能永远结合在一起。
- 神赐给亚当与夏娃的第一条诫命，与他们夫妻为人父母的潜能有关。我们宣告，神要祂儿女生养众多、遍满地面的诫命，至今仍有效。我们进一步宣告，神已命令只有合法结婚、成为夫妻的男女，才能运用此神圣的生育能力。
- 我们宣告，这种创造尘世生命的方法是神所制定。我们肯定生命的神圣和其在神永恒计划中的重要。
- 夫妻肩负神圣的责任要彼此相爱、彼此照顾，也要爱护和照顾他们的儿女。「儿女是耶和华所赐的产业」（诗篇127：3）。父母有神圣的职责，要在爱与正义中教养儿女，提供他们属世和属灵所需要的，也要教导他们彼此相爱、彼此服务、遵守神的诫命，并且不论住在何处，都要做一个守法的国民。丈夫和妻子——母亲和父亲——将在神前为履行这些义务负责。
- 家庭是神所制定的，男女之间的婚姻是祂永恒计划的基本部分。孩子有权利在婚约下出生，并由完全忠贞、奉行婚姻誓约的父母养育。以主耶稣基督的教训为基础，最有可能获得家庭生活的幸福；成功的婚姻与家庭建立在信心、祈祷、悔改、宽恕、尊敬、爱心、同情、工作及有益身心的娱乐等原则上，并借这些原则来维持。依照神的安排，父亲应在爱与正义中主领家庭、负责提供生活所需并保护家人。母亲的主要责任是养育儿女。父母有义务在这些神圣责任中互相协助，是平等的伙伴，遇到残疾、死亡或其他情形时，可因个别情况调整。必要时亲戚应伸出援手。
- 我们要提出警告，违反贞洁圣约、虐待配偶儿女或未克尽家庭职责的人，有一天要在神前为此负责。再者，我们提出警告，家庭的瓦解会为个人、社会和国家，带来古今先知所预言的灾难。
- 我们呼吁各地负责任的国民及政府人士，推动那些维护及巩固家庭成为社会基本单位的措施。
