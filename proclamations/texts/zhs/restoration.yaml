retrieved: '2026-11-02'
title: 耶稣基督圆满福音的复兴
subtitle: 两百周年致全世界文告
author: 耶稣基督后期圣徒教会总会会长团及十二使徒议会
note: 本文告由罗素·纳尔逊会长于2020年4月5日在犹他州盐湖城举行的第190周年上半年总会大会上宣读，是其信息的一部分。
paragraphs:
- 我们郑重宣告，神爱祂在世界各国的儿女。父神赐给了我们祂的爱子耶稣基督的神圣诞生、无与伦比的生平和无限的赎罪牺牲。耶稣借着父的力量复活了，战胜了死亡。祂是我们的救主、典范和救赎主。
- 两百年前，1820年的一个美丽春天早晨，在美国纽约州北部地区，少年约瑟·斯密很想知道该加入哪个教会，他走进住家附近的树林里祈祷。他对于关乎自己灵魂救恩的事有所疑问，也信赖神会给他指示。
- 我们谦卑地宣告，父神和祂的儿子耶稣基督回答了约瑟的祈祷，向他显现，开启了圣经中所预言的「万物复兴」（使徒行传3：21）。在这个异象中，约瑟获知，在最初的使徒们死亡后，基督在新约时代的教会便不复存在于世上，而且他会成为复兴基督教会的重要工具。
- 我们申明，在父与子的指示下，天上的使者曾前来指导约瑟，再次建立耶稣基督的教会。复活的施洗约翰复兴了为罪的赦免的浸没洗礼的权柄。最初十二位使徒里的三位——彼得、雅各和约翰——复兴了使徒的职分和圣职权柄的权钥。包括以来加在内的其他天上使者也来到；以来加复兴了使家人能永远在一起、让家庭关系能超越死亡而持续到永恒的权柄。
- 我们进一步作证，约瑟·斯密蒙得神的恩赐和能力，翻译了一部古代纪录：摩尔门经——耶稣基督的另一部约书。这部神圣纪录的篇章中，含有耶稣基督在复活后不久，到西半球的人民中亲自施助的记载。摩尔门经教导关于人生的目的，阐明基督的教义，而这教义正是人生目的之核心所在。摩尔门经与圣经相辅相成，摩尔门经见证：所有人类都是慈爱天父的儿女；天父为我们的生活制定了一项神圣计划；祂的儿子耶稣基督今日对世人说话，就如同祂在古代那样。
- 我们宣告，1830年4月6日成立的耶稣基督后期圣徒教会，是基督在新约时代教会的复兴。这教会是牢牢奠基在其主要的房角石——耶稣基督——完美的一生、祂无限的赎罪和真实的复活上。耶稣基督再度召唤了使徒，并赐给了他们圣职权柄。祂邀请我们所有的人归向祂和祂的教会，接受圣灵和救恩的教仪，享有恒久的喜乐。
- 自从父神和祂的爱子耶稣基督开启福音的复兴，至今已经过了两百年。世界各地千百万人诚挚地相信了先知们所预言的这些事件。
- 我们欣然宣告，神所应许的福音复兴正透过不断的启示向前开展。大地会变得极为不同，因为神会「使一切所有的都在基督里面同归于一」（以弗所书1：10）。
- 身为祂的使徒，我们怀着虔敬和感激之情，邀请所有的人都能知道诸天已开启，就如同我们知道一样。我们申明，神正在显明对祂心爱儿女的旨意。我们见证，凡透过祈祷研读福音复兴的信息，并凭信心采取行动的人，都会蒙得祝福，对福音复兴的神圣性和目的获得个人见证——该目的乃是帮助世人准备好，迎接神所应许的我们的主和救主耶稣基督的第二次来临。
