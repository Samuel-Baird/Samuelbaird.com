title: 活着的基督
subtitle: 使徒的见证
author: 耶稣基督后期圣徒教会
paragraphs:
- 当我们纪念耶稣基督两千年前的诞生时，我们要提出我们的见证：有关祂无与伦比的一生的真实性，和祂伟大赎罪牺牲的无限效力。再没有其他人对曾活在世上和将活在世上的人有如此深远的影响。
- 祂是旧约中伟大的耶和华，新约中的弥赛亚。在祂父的指示下，祂是大地的创造者，「万物是借着祂造的；凡被造的，没有一样不是借着祂造的」（约翰福音1：3）。祂虽无罪，但仍受洗以尽诸般的义；祂「周流四方，行善事」（使徒行传10：38），然而却遭人蔑视。祂的福音是平安、喜悦的信息，祂恳请所有的人跟随祂的榜样。祂走在巴勒斯坦的道路上，医治病患，使瞎子能见，使死人复生。祂教导永恒的真理、我们前生存在的真实性、我们今生在世上的目的，以及神的儿女在来生的潜能。
- 祂制定圣餐以提醒人记得祂伟大的赎罪牺牲。祂被逮捕、遭诬陷定罪，又被判有罪以满足暴民，并被宣判要死在髑髅山的十字架上。祂舍弃自己的生命来赎全人类的罪；祂为了所有曾活在世上的人，付出自己作为一份伟大的礼物。
- 我们郑重见证：祂的一生，即全人类历史的中心，并非始于伯利恒，亦非终于髑髅山。祂是父的长子、肉身中的独生子、世界的救赎主。
- 祂从坟墓中起来，「成为睡了之人初熟的果子」（哥林多前书15：20）。祂，复活之主，到祂一生中所爱的那些人之中探访他们。祂在古代美洲「另外有羊」（约翰福音10：16），祂也到他们当中施助。而在现代，祂和祂的父向少年约瑟·斯密显现，开启了那应许已久的「日期满足」的时代（以弗所书1：10）。
- 先知约瑟如此描写活着的基督：「祂的眼睛如同火焰；祂的头发白如纯雪；祂的容颜发光，比太阳还亮；祂的声音，即耶和华的声音，像众水奔腾的声音，说：
- 「我是首先的，也是末后的；我是那活着的，我是那被杀的；我是你们在父面前的中保」（教约110：3-4）。
- 关于祂，先知也宣告：「现在，在许多对祂作的见证后，最后，这是我们对祂作的见证：祂活着！
- 「因为我们看见祂在神的右边，也听到有声音作见证说，祂是父的独生子——
- 「诸世界现在和过去都是借祂、经祂、由祂创造的，其上的居民是神所生的儿女」（教约76：22-24）。
- 我们以郑重的言语宣告，祂的圣职和祂的教会已经在世上复兴了——「被建造在使徒和先知的根基上，有基督耶稣自己为房角石」（以弗所书2：20）。
- 我们见证祂有一天会回到世上。「耶和华的荣耀必然显现；凡有血气的必一同看见」（以赛亚书40：5）。祂将以万王之王、万主之主的身分来统治管理；在祂面前，人人都必屈膝，人人都必开口崇拜。我们每一个人都要站在祂的面前，依照我们的行为以及内心的愿望来接受审判。
- 身为经适当按立的祂的使徒，我们见证：耶稣是活着的基督，是不朽的神子。祂是伟大的君王以马内利，如今站在祂父的右边。祂是世界的光、生命和希望。祂的道路乃是今生通往幸福、来生迈向永生之路。感谢神赐给我们祂神圣的儿子——这份无与伦比的礼物。
