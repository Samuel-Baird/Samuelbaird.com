title: Maatii
subtitle: Labsii Addunyaaf Darbe
author: Geggeessaa Jalqabaa fi Yaaʼii Ergamoota Kudha Lamaanii Kan Waldaa Yesus Kristos Qulqulloota Guyaa
  Boodaa
note: Labsiin kun Prezidaantii Gordon B. Hinckley kan taʼaanin akka kutaa ergaa isaaniitti wal-gaʼii Walii
  galaa gumii wal-gargaarsa dubartootaatiif Fulbaana 23, 1995, Magaalaa Salt Lake, Yutah keessatti geggeefame
  irratti kan dubbifameedha.
paragraphs:
- Nuyi, Geggeessaan jalqabaa fi Yaaʼiin Ergamoota Kudha Lamaanii kan Waldaa Yesus Kristos Qulqulloota
  Guyyaa Boodaa, gaaʼilli dhiiraa fi durbartii gidduutti raawwatamu Waaqayyoon kan hundeeffame taʼuu isaa
  akkasumas maatiin giddu-gala karoora Uumaa hiree jireenya bara baraa inni ijoollee Isaatiif kaaʼe akka
  taʼe kabajaan nii labsina.
- Ilmaan namaa hundinuu—dhiiraa fi durbartiin—akka fakkaattii Waaqaayyootti kan uumamaniidha. Tokkoon
  tokkoon isaanis ilmaan yookiin intaloota jaalʼatamoo hafuuraa warra waaqa irraati, akkasumas, akkasittiin,
  tokkoon tokkoon isaanii uumama waaqummaa fi hiree qabu. Saalli amala barbaachisaa nama dhuunfaa jireenya
  ammaan duraa, duʼaa, akkasumas eenyummaa isa kan bara baraatii fi kaayyooti.
- Jireenya isa adunyaan duraa keessaatti, ijoolleen durbaa fi dhiiraa hafuuraa Waaqayyoon akka abbaa isaanii
  isa bara baraatti isa beekanii akkasumas waaqeffachaa turani, akkasumas ijoolleen isaa karoora isaa
  isa qaama foonii argachuu fi muuxannoo biyya lafaa irratti akka argatanii gara mudaa malee argamuutti
  of fooyyessuudhaan akkasumas dhuma irratti isaan jireenya bara baraa akka hiree waaqummaa isaaniitti
  warra dhaalan akka taʼaniif karoora isa isaan taasisu fudhatanii turani. Karoorri gammaachuu waaqummaas
  walitti dhufeenyi awwaala bira darbee akka itti fufu nii heyyama. Sirnoonni fi waadaawwan qulqullaaʼoon
  mana qulqullummaa keessatti argamanis namoonni dhuunfaa gara fuula Waaqayyootti akka deebiʼaniif, akkasumas
  maatiin bara baraan akka tokko taʼaniif isaan in dandeessisa.
- Abboommiin inni jalqabaa Waaqayyo Addaamii fi Hewwaaniif kenne akka abbaa manaa fi haadha manaatti warra
  taʼuu dandaʼuu isaanii kan ilaallatu ture. Nuyi abboommiin Waaqayyo inni ijoollee isaa akka baayʼatanii
  fi lafa irra akka guutaniif kenne hojii irra akka oolu nii labsina. Nuyi humni qulqulluun dhalchuu dhiiraa
  fi dubartii gidduutti qofa raawwatamuu akka qabu, akka abbaa manaa fi haadha manaattis karaa seera qabeessa
  taʼeen yoo wal-fuudhan taʼuu isaa Waaqayyo akka abboome itti daballee nii labsina.
- Nuyi jireenyi inni duʼu karaa isaan ittiin uumamanis waaqummaadhaan kan murtaaʼan akka taʼan nii labsina.
  Nuyi qulqullummaa jireenyaa fi karoora Waaqayyoo isa bara baraa keessa barbaachisummaa jiru nii mirkaneessina.
- Abbaa manaa fi haati manaa sirriitti wal-jaalʼachuu fi wal-kunuunsuuf akkasumas ijoollee isaaniitiifis
  itti gaafatamummaa guddaa qabu. “Ijoolleen kennaa Waaqayyooti” (Faarfannaa 127:3). Maatiinis ijoollee
  isaanii karaa jaalalaa fi gaarummaan akka guddisaniif, fedhii foonii fi hafuuraa isaaniif waan barbaachisu
  guutuu, akka walii isaanii jaalʼatanii fi wal-tajaajiluu, abboommii waaqayyoos akka eeganii, fi bakka
  jiraatan kamitti iyyuu lammiilee seera kabajan akka taʼaniif barsiisuun dirqama qulqullaaʼaatu irraa
  eegama. Abbootiin manaa fi haadholiin manaa—Abbootii fi haadholiin yoo dirqama kana raawwachuu baatan
  isaaniif fuula Waaqayyoo duratti in gaafatamu.
- Maatiin Waaqayyoon kan hundeeffameedha. Gaaʼilli dhiiraa fi durba gidduutti taasifamu karoora isaa isa
  bara baraatiif barbaachisaadha. Ijoolleenis hidhaa gaaʼelaa keessatti dhalachuuf, akkasumas isaan abbaa
  fi haadha waadaa gaaʼelaa amanamummaa guutuudhaan kabajaniin guddifamuuf mirga qabu. Jireenya maatii
  keessatti gammachuun kan argamu maatiin barsiisa Yesus Kristos irratti yoo ijaarame qofadha. Gaaʼiloonni
  fi maatiiwwan milkaaʼoo taʼan amantiidhaan, kadhannaadhaan, yaada garaa geeddarachuudhaan, dhiifamaan,
  kabajaan, jaalalaan, gara laafinaan, hojii fi sagantaa bashanansiisoo gaarii taʼan irratti hundaaʼuun
  kan hundeeffamuu fi kan eegamuudha. Akka karoora waaqummaatti, abbootiin maatii isaaniif dursanii jaalalaa
  fi qajeelummaadhaan geggeessuu qabu akkasumas waantota isaan barbaachisan hundumaa dhiʼeessuu fi eegumsa
  barbaachisu gochuuf dirqama qabu. Dirqamni haadholii adda durummaadhaan nyaata ijoollee isaanii toʼachuudha.
  Itti gaafatamummaa qulqullaʼaa kana keessatti, haadholii fi abbootiin akka michuutti dirqama wal-deggeruu
  wal-qixxummaadhaan nii fudhatu. Hirʼina qaamaa, duʼi yookiin sababa haalota kan birootiin guddifachaa
  fudhachuun barbaachisuu nii dandaʼa. Yeroo barbaachisaa taʼee argametti firoota dhiʼootii fi maatiiwwaniif
  deggersa kennuun isaan irra jira.
- Warri waadaa seera qulqullinaa cabsan kami iyyuu, abbaa manaa yookiin ijoollee isaanii miidhan, yookiin
  itti gaafatamummaa maatii isaanii warri hin baʼin gaaf tokko fuula Waaqayyoo duratti akka itti gaafataman
  nuyi nii akeekachiifna. Dabalataan, diigamuun maatii akka nama dhuunfaatti, akka hawwaasaa fi akka biyyaatti
  karaa raajoota durii fi kan ammaatiin badiisota dubbatamanii turan waan fidaniif nuyi nii akeekkachiifna.
- Nuyi lammiilee itti gaafatamummaa qabanii fi qondaaltonni mootummaa bakka hundatti argamtan tarkaanfiiwwan
  maatii akka kutaa buʼuura hawaasaatti eeguu fi cimsuuf qophaaʼan sana akka guddistaniif waamicha isiniif
  in dhiʼeessina.
