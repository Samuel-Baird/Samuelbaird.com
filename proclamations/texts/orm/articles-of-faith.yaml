title: Keeyyata Amantii
subtitle: Waldaa Yesuus Kiristoos Qulqullootaa Guyyaa Boodaa
author: ''
verses:
- n: 1
  text: Nuyi Waaqayyoon, isa abbaa bara baraa taʼetti, akkasumas Ilma Isaatti, Yesuus Kiristoos, fi Hafuura
    Qulqulluutti nii amanna.
- n: 2
  text: Nuyi namoonni kan adabaman cubbuu ofii isaaniitiif malee, irra daddarbaa Addaamiif akka hin taane
    nii amanna.
- n: 3
  text: Nuyi karaa Gatii kaffaltii cubbuu Kiristositiin, seerotaa fi sirna wangeelaatiif abboomamuudhaan,
    ilmi namaa hundinuu fayyuu akka dandaʼu nii amanna.
- n: 4
  text: 'Nuyi qajeelfamni buʼuuraa fi sirnoonni wangeelaa warri jalqabaa: tokkoffaan, Gooftaa Yesuus Kiristoositti
    amanuu; lammaaffaan, Yaada garaa geeddarachuu; sadaffaan, Dhiifamuu cubbuutiif cuuphaa gadi fagoo
    cuuphamuudhaan; afuraffaan, Kennaa Hafuura qulqulluutiif harka irra kaaʼuutti nii amanna.'
- n: 5
  text: Nuyi namni tokko wangeela lallabuuf, akkasumas sirna achi keessa jiru bulchuuf, raajiidhaan, warra
    aangoo qabaniin harki irra kaaʼamuudhaan, Waqayyoon waamamuu akka qabu nii amanna.
- n: 6
  text: Nuyi jaarmayaa tokkotti Waldaa Jalqabaa keessa akkuma ture, jechuunis, ergamoota, raajota, paasteroota,
    barsiisota, lallabdoota wangeelaa fi kan kana fakkaatan nii amanna.
- n: 7
  text: Nuyi kennaa afaan haaraa, raajii, mulʼataa, arguu, fayyisuu, afaanota hiikuu fi kan kana fakkaatan
    nii amanna.
- n: 8
  text: Nuyi Macaafni Qulqulluun hamma sirriitti hiikametti dubbii Waaqayyoo akka taʼe nii amanna, nuyi
    dabalataan Macaafni Mormon dubbii Waaqayyoo akka taʼe nii amanna.
- n: 9
  text: Nuyi waan Waaqayyo mulʼisee ture hundumaa, waan Inni amma mulʼisu hundumaa, akkasumas nuyi ammas
    waantota gurguddaa baayʼee fi waantota barbaachisoo Mootummaa Waaqayyoo wajjin wal qabatan akka Inni
    muliʼisu nii amanna.
- n: 10
  text: Nuyi Isiraaʼeloonni kallattiidhaan walitti qabamuu isaanii fi Gosoonni Kurnan iddoo isaaniitti
    deebiʼanii akka dhaabaman; akka Xiyoon (Yerusaalem haaraan) ardii Ameerikaa keessatti akka ijaaramu;
    Kiristoos lafa irratti dhuunfaadhaan akka moʼu; akkasumas, lafti akkahaarefamtuu fi ulfina isaa isa
    jannata taʼe akka argattu nii amanna.
- n: 11
  text: Nuyi akka ajaja qor-qalbii keenyaatti mirga Waaqa isa Hundumaa Dandaʼu waaqeffachuu arganneerra,
    akkasumas namoota hundumaatiifis mirga wal-fakkaatu Isaan akkamitti, eessatti, yookiin maaliin akka
    waaqeffataniif nii heyyamna.
- n: 12
  text: Nuyi moototaaf, pirezidaantotaaf, bulchitootaaf akkasumas abbootii murtiitiif, abboomamuuf, kabajuu
    fi seera deggeruu jalatti buluutti nii amanna.
- n: 13
  text: Nuyi Amanamummaatti, dhugummaatti, qulqullumaatti, arjummaatti, amala gaariitti, namoota gargaarsa
    barbaadan hundumaf gaarii gochuutti nii amanna; nuyi ifatti gorsa Phaawuloos duukkaa in buuna jechuu
    nii dandeenya—nuyi waan hundumaa nii amanna, nuyi waan hundumaa nii abdanna, nuyi waan baayʼee obsinee
    jirra, akkasumas waan hundumaas obsuu akka dandeenyu nii abdanna. Waanti gaarummaa qabu, jaalala,
    yookiin gabaasa gaarii yookiin galateeffamuuf kan malu yoo jiraate, nuyis waantota kana nii barbaanna.
signature: Yooseef Ismiiz.
