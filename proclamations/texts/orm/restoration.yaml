slug: restoration
language: orm
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=orm
retrieved: '2026-11-02'
title: Deebiʼuu Guutummaa Wangeela Yesus Kristos
subtitle: Labsii Yaadannoo Waggaa Dhibba Lamaffaa Addunyaaf Darbe
author: Geggeessaa Jalqabaa fi Yaaʼii Ergamoota Kudha Lamaanii Waldaa Yesus Kristos Qulqulloota Guyyaa
  Boodaa
note: Labsiin kun prezidaantii Russell M. Nelsoniin akka kutaa ergaa isaaniitti wal-gaʼii walii galaa
  waggaa 190ffaa, Ebila 5, 2020, magaalaa Soolti Leek, Yutaah keessatti gaggeeffame irratti kan dubbifameedha.
paragraphs:
- Nuyi Waaqayyoo ilmaan isaa biyyoota hundumaa keessa jiraatan akka jaalʼatu kabajaan cimsinee nii labsina.
  Waaqayyoo abbaanis ilmaa isaa isa jaalʼatamaa, Yesus Kristosiin, dhalachuu waaqummaa, jireenya isa hin
  madaalamne, akkasumas aarsaa gatii kaffaltii cubbuu isa dhuma hin qabnee nuuf kennera. Humna abbaatiin
  Yesus Kristos duʼee deebiʼee duʼa irratti moʼicha argateera. Inni fayyisaa, fakkeenya keenya, akkasumas
  oolchaa keenyadha.
- Waggoota dhibba lamaan dura, bara 1820 (A.L.A) tti ganama birraa bareedaa tokkotti, dargageessichi Yooseef
  Ismiiz, waldaa isa kamiitti makachuu akka qabu beekuu barbaaduudhaan, New York, USA bosona naannoo mana
  isaatii keessatti kadhachuudhaaf seene. Inni fayyina lubbuu isaa ilaalchisee gaaffii qaba ture akkasumas
  Waaqayyo akka isa qajeelchu amanee ture.
- Gadi of deebisuudhaan, deebii kadhata isaatiitiif Waaqayyo abbaanii fi ilmi isaa, Yesus Kristos, Yooseef
  Ismiizitti akka of mulʼsanii fi Macaafa Qulqulluu keessattis akkuma raajame “waantonni hundinuu iddootti
  deebiʼuu” (Hojii Ergamootaa 3:21) akka jalqaban nuyi nii labsina. Mulʼata kana keessatti, inni duʼa
  Ergamoota warra jalqabaa hordofee, waldaan Kiristoos inni Kakuu Haaraa lafa kana irraa akka badee ture
  barateera. Yoseef iddootti deebiʼuu isaa kana keessattis meeshaa taʼe.
- Gaggeessaa Waaqayyoo abbaa fi Yesus Kristosiin, ergamoonni waaqa irraa Yooseefiin barsiisuu fi waldaa
  Yesus Kristosiin deebisanii dhaabuuf akka dhufanii turan nuyi nii mirkaneessina. Duʼaa inni kaafame
  Yohaannis cuuphaan cuuphaa gad-fagoo fi dhiifamuu cubbuutiif aangoo deebiseera. Ergamoota warra jalqabaa
  keessaa warri sadanii–Pheexros, Yaaqoob, fi Yohaannis–furtuuwwan ergamummaa fi aangoo lubummaa lammataa
  deebisanii jiru. Isa maatiiwwan duʼa moʼanii bara baraan akka walitti hidhamanii jiraataniif aangoo
  deebisee ture, Eliyaasiin dabalatee, warri kaanis dhufaniiru.
- Yooseef Ismiiz galmeewwan bara durii isa taʼe, Macaafa Mormoniin-dhuga baatuu Yesus Kristos isa kan
  biraa isa taʼe akka hiikuuf kennaan Waaqayyoo fi humni akka kennaameef nuyi itti daballee dhugaa nii
  baana. Fuulonni barreeffama qulqullaaʼaa kanaa seenaa tajaajila dhuunfaa Yesus Kristos isa inni duʼaa
  kaʼuu isaa booddee Kutaa Addunyaa Lixaa keessa namoota jiraatan gidduutti godhee turee of keessatti
  qabata. kunis kaayyoo jireenyaa isa gidduu-galeessa taʼe, kan barsiisuu fi barsiisa Kiristoosiin kan
  ibsuudha. Akka caaffata qulqullaaʼoottis Macaafa Qulqulluu gargaaree, Macaafni Mormon sanyiin namaa
  hundinuu dhiiraa fi dubartiin ijoollee jaalʼatamoo abbaa isa waaqa irraa akka taʼan, innis jireenya
  keenyaaf karoora waaqummaa akka qabu, akkasumas ilmi isaa Yesus Kristos akkuma guyyoota durii sana harʼas
  akka dubbatu dhugaa nii baʼa.
- Eebila 6, 1830(A.L.A) tti Waldaan Yesus Kristos Qulqulloota Guyyaa Boodaa akka gurmoofte, Waldaan Kiristoos
  inni Kakuu Haaraa deebitee kan ijaaramte taʼuu nuyi nii labsina. Waldaan kunis isa qajeelchaa dhagaa
  golee ishee taʼeef, Yesuus Kiristoosittii, jireenya mudaa hin qabne isa taʼee fi gatii kaffaltii cubbuu
  isaa isa dhuma hin qabnee fi duʼaa kaʼuu isa dhugaa irratti kan hundeeffamteedha. Yesus Kristos ammas
  irra deebiin Ergamoota waameera akkasumas aangoo lubummaa isaaniif kenneera. Inni hundumti keenya gara
  Isaa fi gara Waldaa Isaatii akka dhufnuuf, akkasumas Hafuura qulqulluu, akkasumas sirnoota fayyinaa
  akka fudhannuuf, akkasumas gammachuu dhaabbataa akka argannuuf nu haffeera.
- Lammaffaa deebiʼuun kun Waaqayyo abbaadhaa fi Ilma Isaa isa jaalʼatamaan, Yesus Kristosiin, erga jalqabee
  waggoonni dhibbi lama darbaniiru. Gutummaa addunyaa keessatti namoonni baayʼeen miiliyoonaan lakkaaʼaman
  beekumsa taateewwan raajiin irratti dubbatamee fudhataniiru.
- Iddootti deebiʼuun waadaa galamee Kunis karaa mulʼata itti fufiinsa qabuutiin gara fuul-duraatti akka
  tarkaanfatu gammachuudhaan nii labsina. Laftis gonkumaa deebitee akka duraa hin taatu, sababni isaa
  Waaqayyo “waanta hundumaas harka Kiristoos jalatti walitti in qaba.” (Efesoon 1:10)
- Nuyi Ergamoonni Isaa akkuma beeknu- samiin banamaa taʼuu isaa akka beekaniif-waaqeffannaa fi galataan
  hunda nii haffeerra. Waaqayyoo fedhii isaa ijoollee dhiiraa fi durbaa isaa jaalʼatamootti beeksisaa
  akka jiru nuyi nii mirkaneessina. Dabalataan warri kadhannaadhaan waaʼee ergaa isa deebiʼee qoratanii
  fi amantiidhaan hojjetan waaqummaa isaa fi kaayyoo Dhufaatii isa Lammaffaa Gooftaa keenyaa akkasumas
  fayyisaa keenya Yesus Kristos isa abdachiifameef biyya lafaa qopheessuuf dhuga baʼumsa mataa isaaniitiin
  akka isaan eebbifaman dhugaa nii baana.
