title: Kiristoos Isa Jiraataa
subtitle: Dhuga baʼumsa Ergamootaa
author: Waldaa Yesus Kristos Qulqulloota Guyyaa Boodaa
paragraphs:
- Dhaloota Yesus Kristos isa waggoota kuma lamaan duraa nuyi yeroo yaadannu, nuyi waaʼee dhugummaa jireenya
  Isaatii isa dorgommii hin qabnee fi aarsaa Isaa gatii kaffaltii cubbuu isa guddaa gaarummaa Isaa isa
  daangaa hin qabne dhugaa nii baana. Biyya lafaa kana irra warra jiraatanii darban, kana booda illee
  warra jiraatan keessaa kan akka Isaa dhiibbaa guddaa akkasii hunduma irratti uume hin jiru.
- Inni Yaahiwwee isa Guddaa isa Kakuu Moofaati, Masihii isa Haaraati. Qajeelfama Abbaa Isaatii jalatti,
  Inni uumaa lafaa ture. “Waanti hundinuus isaan taʼe; waan taʼe keessaas isa malee kan taʼe tokko illee
  hin jiru” (Yohaannis 1:3). Cubbuu kan hin qabne yoo taʼe iyyuu, Inni qajeelummaa hundumaa raawwachuuf
  in cuuphame. Inni “naannaʼee hojii gaarii in hojjete” (Hojii Ergamootaa 10:38), taʼus garuu kanaaf in
  tuffatame. Wangeelli Isaa ergaa nagaa fi gaarummaati. Inni hundumtuu fakkeenya Isaa duukkaa akka buʼaniif
  haffeereera. Karaa Filisxeem irra adeemee, dhukkubsataa fayyiiseera, jaamaa ija baneera, warra duʼanis
  kaaseera. Inni dhugummaa isa bara baraa, jiraachuu keenya osoo gara biyya lafaa hin dhufiniin duraa,
  kaayyoo jireenya keenya biyyaa lafaa kana irraa, akkasumas jireenya dhufu keessattis ijoollee dhiiraa
  fi durbaa Waaqayyoo taʼuu akka dandeenyuuf barsiiseera.
- Aarsaa gatii kaffaltii cubbuu guddaaf Inni akka ittiin yaadatamuuf irbaata qulqulluu in dhaabe. Inni
  himata sobaatiin qabamee, itti faradamee hidhame maqaan isaas badee, fedhii namootaa hundumaa eeguuf
  jecha duuti itti faradamee, fannoo kaalvarii irratti akka duʼuufis itti faradamee ture. Cubbuu namoota
  hundumaaf furee akka taʼuuf jecha aarsaa of godhee lubbuu isaa dabarsee kenne. Inni warra biyya lafaa
  irra jiraatanii fi jiraachuuf jiran hundumaaf kennaa bakka buʼummaa ture.
- Jireenyi Isaa seenaa dhala namaa hundumaaf, giddu-galeessa akka taʼe, yookiin Betelehemitti akka hin
  jalqabne yookiin Kaalvariittis akka hin xumurramne, nuyi cimsinee dhugaa nii baana. Inni Ilma isa angafaa
  abbaati, Ilma tokkicha fooniin mulʼate, Fayyisaa biyya lafaa ture.
- Inni “Warra obbaafatan keessaa angafa taʼuun” (1 Qorontos 15:20) awwaala keessaa kaʼeera. Gooftichi
  akkuma duʼaa kaʼeen, Inni warra bara jireenya Isaa keessatti jaalʼate daawwatee ture. Akkasumas immoo
  Inni Ameerikaa durii keessatti “hoolota biroo” (Yohaannis 10:16) gidduutti tajaajilaa tureera. Adunyaa
  ammayyaaʼaa keessattis, Innii fi Abbaan Isaa yeroo dheeraadhaaf isa abdachiifamee ture “barri murame
  yeroo guutetti” (Efesoon 1:10) dargageessicha Yooseef Ismiizitti mulʼataniiru.
- 'Kiristoos isa jiraataa ilaalchisee, raajichi Yooseef Ismiiz akkas jechuun barreesseera: Iji isaa akka
  barbadaa abiddati, Rifeensi mataa Isaatii akka cabbii qulqulluu adii ture, fuulli Isaa ifa aduu caalaa
  kan ifu ture; sagaleen Isaas akka sagalee bishaanota baayʼeeti, akka sagalee Yaahiwwees ture, akkas
  jechuun:'
- “Ani isa jalqabaati akkasumas isa dhumaatis, Ani isa jiraataadha, Ani isa ajjeefamee tureedha; Ani isa
  Abbaa wajjin walitti isin araarsuudha (Barumsaa fi Kakuuwwan 110:3–4).
- 'Raajichis waaʼee isaa akkas jedhee labse: Akkasumas amma, waaʼee Isaatiif dhuga baʼumsoonni baayʼeen
  erga kennamanii booda, kunis waaʼee isaa dhuga baʼumsicha, isa dhumaa hundumaa, kan nuyi Isaaf kenninu:
  Inni jiraataa taʼuu Isaati!'
- “Nuyi gara harka mirgaa Waaqayyotti illee, Isa waan argineef, akkasumas nuyi Inni Tokkicha Ilma abbaa
  akka taʼe yeroo sagaleen dhugaa baʼu dhageenyeerraani—
- “Biyyi lafaas Isaan, akkasumas karaa Isaatiin akkasumas Isumaanis uumamanii turani, kan irra jiraatanis
  ilmaanii fi ijoollee durbaa Waaqayyooti (Barumsaa fi Kakuuwwan 76:22–24).
- Nuyi Lubummaan Isaa fi Waldaan Isaa—“hundee … ergamootaa fi raajotaa irratti ijaaramtaniittu, Kristos
  Yesus immoo ofii Isaatii isa dhagaa golee qajeelchuudha” (Efesoon 2:20) biyya lafaa irratti deebiʼuu
  isaanii kabajaan nii labsina.
- Inni gaaf tokko gara lafaatti akka deebiʼus nuyi dhugaa in baana. “Akkasumas yommus ulfinni Waaqayyoo
  in mulʼata, namni foon uffate hundinuus kana walii wajjin arguuf jira” (Isaayyaas 40:5). Inni Mootii
  Moototaa taʼee in bulcha akkasumas Gooftaa Gooftotaa taʼees in moʼa, akkasumas jilbi hundinuu isaaf
  in jilbeenfatu akkasumas arrabni hundinuus waaqeffannaadhaan fuula Isaa duratti in dubbataani. Tokkoon
  tokkoon keenyas akka hojii keenyaatti akkasumas akka fedhii garaa keenyaatti Isaan firdii argachuuf
  in dhaabbanna.
- Nuyi akka Ergamoota Isaa sirnaan muudamaniitti—Yesus Kristos isa Jiraataa taʼuu Isaa akkasumas Ilma
  Waaqayyoo isa hin duune taʼuu Isaa dhugaa in baana. Innis isa harʼa harka mirgaa Abbaa Isaa dhaabbatu,
  mootii guddaa isa taʼe Amanuʼeelidha. Inni ifa, jireenyaa, fi abdii biyya lafaati. Karaan Isaas jireenya
  ammaa keessatti gara gammachuutti akkasumas adunyaa isa dhufu keessattis gara jireenya bara baraatti
  kan geessuudha. Dhuma kan hin qabne kennaa waaqummaa Ilma Isaatii isa kenne Waagayyoof galanni haa taʼu.
