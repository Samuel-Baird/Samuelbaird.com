title: Yaʼĉlishayjop pa niʼvatĉacuĵayasha Na Lhishĵanĵavat pa Jesucristo shi papi Niĉacuĵanĵasa yiey nava
  Yojʼeshaʼne Nalhus
subtitle: ''
author: ''
verses:
- n: 1
  text: Nishtaĉacuĵanesh ĉasvaachsha pa Dios ti catsitata ôyjôlhayech, shi pa lhôôs Jesucristo Shiʼ pa
    Espiritu Santo.
- n: 2
  text: Nishtaĉacuĵanesh napi nivaĉle ti chiyĉloôyitʼapeʼe ĵayu pava yitsôtʼajesh lhsaschʼeshaʼne pa tanĉa
    lhecha pava lhsaschʼeĉ pa Adán.
- n: 3
  text: Nishtaĉacuĵanesh pa Cristo pa lhech vatjutjoʼom ĉa ĵaspa lhaĉômʼôʼa papu ĉan niʼnilhĵenshaʼne
    pan tʼôjôʼôj papi yicuʼulhjulh nava vatyojiĵates shi nava tôlhshaam na is yaʼĉlish.
- n: 4
  text: 'Nishtaĉacujanesh nava vatjutsaʼ tôlhʼeshicham tôlheyshi na is vatyôjiĵat, nôque vatjutsa: Niʼvatĉacujayashaʼa
    pa lhĉaʼanvaĉle Jesucristo, naʼ napuʼeyshi: vatatvaychʼaĉlaĵayash puʼjaʼnaʼeyshi: vatnayĵayash ĉa
    ĵaspa chinvômesh pa chiʼnatcumʼapeʼe shta pava saschʼeshaʼne. Yichatjulheyshi: Chintʼaĵayeshʼapeʼe
    pava vatpôĉôtôy pa chinôyôĵem pa lhanvaĉleyash pa Espiritu Santo.'
- n: 5
  text: Nishtaĉacuĵanesh pa Dios ti iseʼemjop ca natcumeyshilhatam pa nivaĉle lhayaʼash ti pʼalha ti vanĉatôyĵata
    lhecheʼesh pa chintʼaĵayeshʼapeʼe pava vatpôĉôtôy papi ôpis ti yiʼeʼem pa vatvaĉleyash pa isjop ĉa
    nivanquʼeiĵatsĵanesh na is yaĉlish shi ĉa niĉlôvalhcʼoya nava chiytôyĵata.
- n: 6
  text: 'Nishtaĉacujanesh na ôpisesh Vatvelhaĵayashamʼesh na vatjutsa lhishĵanĵavat ti nôque lhjunashchʼe:
    vaʼtʼeyĵatsĵanĵas, chiytôyĵata pava vaĉlan, tashinshtas lhavos, vanqʼeyĵatsĵanshaʼne, tasinoʼyesh
    na is yaĉlish pa nôqueʼe paʼpʼelhcha.'
- n: 7
  text: Nishtaĉacuĵanesh papu ti yiʼeʼem ti Tôôytseĵeshchʼe peelh yaʼĉlish, yitôycʼôya pa lhjunashchʼe
    ĵayu paʼnain, yashinitĵat ĵayu, taʼvanchay ĵayu, tquʼilhĵey ĵayu, tasinoyesh jayu pavʼelhcha yaĉlishay,
    nôqueʼe pavʼelhcha nôʼĉlesh jayu.
- n: 8
  text: Nishtaĉacujanesh nava tôlhshaam nava isis yaʼĉlishay ti lhech lhĉlishay pa Dios, yiey na yiʼeʼshi
    ti yivoʼyeshchʼe ti chinôyôjquʼe shi shta ti nishtaĉacuĵanesh na lhquʼisĵayanach pa Mormón lhĉliishay
    shta pa Dios.
- n: 9
  text: Nishtaĉacuĵanesh lhaĉômʼa nava shinvanĵayinesh pa Dios yiey nantʼajôʼôj nava shtaʼvan nôqueʼesh
    shi shta ti nishtaĉacuĵanesh ti shtaʼvan ĵayu pava aĉloj ussham na lhjunashchʼe shaʼne, yaʼshesh ti
    lhechʼe pa lhjunash ti tôʼlheychisham pa lhanvaĉleyash pa Dios.
- n: 10
  text: Nishtaĉacuĵanesh pa tcʼaʼsham ti tôlhʼeshicham papi lhchifas pa Israel shi ti chinĉlanchisham
    papi diez na tʼônashchʼeshane vatcʼoya, vooy pa Sión (nichʼa Jerusalén) chiytsemaĵʼe ĵayu na lhĉachiʼvatʼeshi
    na cotsĵatiyish, pa Cristo nivaĉleʼesh ĵayu ĉa lhĉaʼanvaĉleʼaʼesh pa lhech cotsĵatiyish chiyniʼchʼayan
    ĵayu pa chiyanʼe ĵayu pa vatôĉlôjqueyash.
- n: 11
  text: Shtavatfaycutesh ti ôpis ti camômeshjacʼoya ĉa shtʼalhey pa Dios ti tʼunʼin lhavaachsha pantʼônashjoʼom
    pa shtantsôtʼajesh ĉatsaychavalhjayash pa shtancʼatʼeshcʼoya shta lhaĉômʼa napi nivaĉle ti pʼalhachʼeʼin
    ti chinfaĉjoʼom ĉa shtʼalha, ti taʼtʼe lhjunash, ta yiʼeʼ Shi pa ĉa lhjunashaʼesh lhavach papu.
- n: 12
  text: Nishtaĉacuĵanesh ĉa shtʼajoytaĵa napi yaashchishamchʼe chiʼyinvaĉleyanshane napi chiʼvelhasham
    vatvaĉles, napi vatsavatjacʼoya lhĉaanvaĉles, napi nôʼôĉlhaʼa chiyinvaĉleyanshane, pa shtanvaĉleyanshaʼne,
    shtaʼjôyechʼe shi ĉa shtatʼuʼeshchʼe na uĵjaam lhayôjijat.
- n: 13
  text: Nishtaĉacuĵanesh ti ĉaschʼanĵamatses, ti shtavatvoyĵateshchʼe, shnôʼôvĉatsichshi, niĉastsopa,
    shtasnachshelh pa na papʼelhcha, na yivoʼyeshchʼe ni nôʼôlhjaney ti isjop ĉa ĉasyijôʼaʼesh ĉa shtavoquʼe
    can lhʼnônash ca Pablo. Nishtaĉacuquʼe caslhaĉômʼa pa caslhaĉômʼaʼa ĉa shtavatjumtiʼin shta, cajuquʼe
    ti shtavôtĉlôyitesh navaʼ na lhjunashchʼe, shi ti isjop ĉa shtachʼancʼoya pavʼelhcha taj ti shtaniyitʼapeʼe.
    Ĉa niĉaaĵ taj pa yieʼ ti isʼejop joʼom ti yivoʼyeshchʼe pa lhecheʼesh pa isjop ĉa shtanshameshelh,
    lhech côque shtaychavalhelhjulh.
signature: José Smith.
