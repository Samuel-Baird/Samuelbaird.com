title: Te Au Akatinamouanga Akarongo O Te Akonoanga A Iesu Mesia O Te Aronga Tapu I Te Au Ra I Muri Nei
subtitle: ''
author: ''
verses:
- n: 1
  text: Te irinaki nei matou ki te Atua te Metua Mutukore, e ki Tana Tamaiti ia Iesu Mesia, e ki te Vaerua
    Tapu.
- n: 2
  text: Te irinaki nei matou e ka akautungaia te tangata nei no ta ratou uaorai au ara, e kare e no ta
    Adamu aati ture.
- n: 3
  text: Te irinaki nei matou e, na roto i te Tarangaara a te Mesia, ka ora te au tangata katoatoa, me
    kauraro ratou ki te au ture e te au angaanga oroa o te Evangelia.
- n: 4
  text: 'Te irinaki nei matou e ko te au tumu tuatua mua e te au angaanga oroa o te Evangelia koia oki:
    te mea mua, ko te Akarongo ki te Atu ia Iesu Mesia; te rua, ko te Tataraara; te toru, ko te Bapetizo
    taruku no te akakoreanga ara; te ā, ko te Tukuanga rima no te orongaanga i te Vaerua Tapu.'
- n: 5
  text: Te irinaki nei matou e ka kapikiia te tangata e te Atua e tikaʼi, na roto i te totou, e te tukuanga
    rima na ratou tei mou i te mana, kia ako atu i te Evangelia e kia akaaere i te au angaanga oroa no
    te reira.
- n: 6
  text: Te irinaki nei matou e kia vai rai te au taonga i teia rā, mei tei vai ana i roto i te Akonoanga
    i Taito, koia oki, te au aposetolo, te au peroveta, te au episekopo, te au puapii, te au patereareka,
    e te vai atura.
- n: 7
  text: Te irinaki nei matou i te orongaanga o te au reo, te totouanga, te eeuanga, te au orama, te akaoraanga
    i te maki, te akaurianga o te au reo, e te vai atura.
- n: 8
  text: Te irinaki nei matou ki te Bibilia e e reo ïa no te Atua, me kua tika te akauriangaia. Te irinaki
    katoa nei matou i te Puka a Momoni e e reo ïa no te Atua.
- n: 9
  text: Te irinaki nei matou i te au mea ta te Atua i eeu ana, e te au mea katoa Tana e eeu mai nei, e
    te irinaki nei matou e ka eeu ua mai rai Aia e manganui te au mea puapinga kia tau ki te anoano o
    te Basileia o te Atua.
- n: 10
  text: Te irinaki nei matou i te akaputuputuangaia a Iseraela e pera katoa ki roto i te akaokianga mai
    o te Kopu Tino Ngauru; e ko Ziona (te Ierusalema Ou) te ka akatuia ki runga i te Enua Marike; e ko
    te Mesia uaorai te ka tutara ki runga i teia nei ao; e ko teia nei ao, ka akaouia te reira e ka rauka
    tona tu kakā mei ia paradaiso rai.
- n: 11
  text: Te akakite nei matou e e tikaanga to matou kia akamori ki te Atua Mana Katoatoa, kia tau ki te
    anoano o to matou ngakau, e kia orongaia ki te au tangata katoatoa te reira tikaanga kia akamori,
    noatu e ka akapeea, noatu e kiea, e noatu e i te aa.
- n: 12
  text: Te irinaki nei matou e kia kauraro matou ki te au ariki, te au peresideni, te au tutara, e te
    au akavaanga teitei, e i te kauraroanga, te akangateiteianga, e te turuturuanga i te ture.
- n: 13
  text: Te irinaki nei matou e kia tiratiratū matou, kia tika, kia tiamā, kia meitaki, kia akono meitaki,
    e kia tika ta matou ka rave ki te au tangata katoatoa; e, i na, te karanga nei matou e te aru nei
    matou i te akoanga a Paulo—Te irinaki nei matou i te au mea katoatoa; te manakonako nei matou i te
    au mea katoatoa, e kua akakoromaki ana matou i te au mea e manganui, e ma te manakonako kia akakoromaki
    uatu rai i te au mea ravarai. Me e mea meitaki, e mea manea tikai, me kore ra e mea rongo meitaki
    e te paapaanunui, ka kimi rai matou i teia au mea.
signature: Iosepha Timeti.
