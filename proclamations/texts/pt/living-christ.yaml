title: O Cristo Vivo
subtitle: O Testemunho dos Apóstolos
author: A Igreja de Jesus Cristo dos Santos dos Últimos Dias
paragraphs:
- Ao comemorarmos o nascimento de Jesus Cristo, ocorrido há dois mil anos, oferecemos nosso testemunho
  da realidade de Sua vida incomparável e o infinito poder de Seu grande sacrifício expiatório. Ninguém
  mais exerceu uma influência tão profunda sobre todos os que já viveram e ainda viverão sobre a face
  da Terra.
- Ele foi o Grande Jeová do Velho Testamento e o Messias do Novo Testamento. Sob a direção de Seu Pai,
  Ele foi o criador da Terra. “Todas as coisas foram feitas por ele, e sem ele nada do que foi feito se
  fez” (João 1:3). Embora jamais tivesse cometido pecado, Ele foi batizado para cumprir toda a justiça.
  Ele “andou fazendo o bem” (Atos 10:38), mas foi desprezado por isso. Seu evangelho era uma mensagem
  de paz e boa vontade. Ele pediu a todos que seguissem Seu exemplo. Ele caminhou pelas estradas da Palestina,
  curando os enfermos, fazendo com que os cegos vissem e levantando os mortos. Ele ensinou as verdades
  da eternidade, a realidade de nossa existência pré-mortal, o propósito de nossa vida na Terra e o potencial
  que os filhos e filhas de Deus têm em relação à vida futura.
- Ele instituiu o sacramento como lembrança de Seu grande sacrifício expiatório. Foi preso e condenado
  por falsas acusações, para satisfazer uma multidão enfurecida, e sentenciado a morrer na cruz do Calvário.
  Ele deu Sua vida para expiar os pecados de toda a humanidade. Seu sacrifício foi uma grandiosa dádiva
  vicária em favor de todos os que viveriam sobre a face da Terra.
- Prestamos solene testemunho de que Sua vida, que é o ponto central de toda a história humana, não começou
  em Belém nem se encerrou no Calvário. Ele foi o Primogênito do Pai, o Filho Unigênito na carne, o Redentor
  do mundo.
- Ele levantou-Se do sepulcro para ser “feito as primícias dos que dormem” (1 Coríntios 15:20). Como Senhor
  Ressuscitado, Ele visitou aqueles que havia amado em vida. Ele também ministrou a Suas “outras ovelhas”
  (João 10:16) na antiga América. No mundo moderno, Ele e Seu Pai apareceram ao menino Joseph Smith, dando
  início à prometida “dispensação da plenitude dos tempos” (Efésios 1:10).
- 'A respeito do Cristo Vivo, o Profeta Joseph escreveu: “Os seus olhos eram como uma labareda de fogo;
  os cabelos de sua cabeça eram brancos como a pura neve; o seu semblante resplandecia mais do que o brilho
  do sol; e a sua voz era como o ruído de muitas águas, sim, a voz de Jeová, que dizia:'
- Eu sou o primeiro e o último; sou o que vive, sou o que foi morto; eu sou o vosso advogado junto ao
  Pai” (D&C 110:3–4).
- 'A respeito Dele, o Profeta também declarou: “E agora, depois dos muitos testemunhos que se prestaram
  dele, este é o testemunho, último de todos, que nós damos dele: Que ele vive!'
- Porque o vimos, sim, à direita de Deus; e ouvimos a voz testificando que ele é o Unigênito do Pai —
- Que por ele e por meio dele e dele os mundos são e foram criados; e seus habitantes são filhos e filhas
  gerados para Deus” (D&C 76:22–24).
- Declaramos solenemente que Seu sacerdócio e Sua Igreja foram restaurados na Terra, “edificados sobre
  o fundamento dos apóstolos e dos profetas, de que Jesus Cristo é a principal pedra da esquina” (Efésios
  2:20).
- Testificamos que Ele voltará um dia à Terra. “E a glória do Senhor se manifestará, e toda a carne juntamente
  verá” (Isaías 40:5). Ele governará como Rei dos Reis e reinará como Senhor dos Senhores, e todo joelho
  se dobrará e toda língua confessará em adoração perante Ele. Cada um de nós será julgado por Ele de
  acordo com nossas obras e os desejos de nosso coração.
- Prestamos testemunho, como Apóstolos Seus, devidamente ordenados, de que Jesus é o Cristo Vivo, o Filho
  imortal de Deus. Ele é o grande Rei Emanuel, que hoje Se encontra à direita de Seu Pai. Ele é a luz,
  a vida e a esperança do mundo. Seu caminho é aquele que conduz à felicidade nesta vida e à vida eterna
  no mundo vindouro. Graças damos a Deus pela incomparável dádiva de Seu Filho divino.
