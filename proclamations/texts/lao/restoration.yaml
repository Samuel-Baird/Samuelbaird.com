title: ການ​ຟື້ນ​ຟູ​ຄວາມ​ສົມ​ບູນ​ແຫ່ງ​ພຣະ​ກິດ​ຕິ​ຄຸນ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ
subtitle: ການ​ປະ​ກາດ​ຕໍ່​ໂລກ​ເນື່ອງ​ໃນ​ວາ​ລະ​ຄົບ​ຮອບ​ສອງ​ຮ້ອຍ​ປີ
author: ຝ່າຍ​ປະ​ທານ​ສູງ​ສຸດ ແລະ ສະ​ພາ​ອັກ​ຄະ​ສາ​ວົກ​ສິບ​ສອງ​ຂອງ​ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ແຫ່ງ​ໄພ່​ພົນ​ຍຸກ​ສຸດ​ທ້າຍ
note: ປະ​ທານ​ຣະ​ໂຊ ເອັມ ແນວ​ສັນ ໄດ້​ອ່ານ​ການ​ປະ​ກາດ​ນີ້ ໃນ​ຄຳ​ປາ​ໄສ​ຂອງ​ເພິ່ນ ຢູ່​ກອງ​ປະ​ຊຸມ​ໃຫຍ່​ສາ​ມັນປະ​ຈຳ​ປີ
  ຄັ້ງ​ທີ 190, ເມື່ອ​ວັນ​ທີ 5 ເດືອນ​ເມ​ສາ, 2020, ໃນ​ເມືອງ​ເຊົາ​ເລັກ, ລັດ​ຢູ​ທາ.
paragraphs:
- ພວກ​ເຮົາ​ປະ​ກາດ​ຢ່າງ​ໜັກ​ແໜ້ນ​ວ່າ ພຣະ​ເຈົ້າ​ຮັກ​ລູກໆ​ຂອງ​ພຣະ​ອົງ ໃນ​ທຸກ​ປະ​ຊາ​ຊາດ​ຂອງ​ໂລກ. ພຣະ​ເຈົ້າ​ອົງ​ເປັນ​ພຣະ​ບິ​ດາ​ໄດ້​ມອບ​ການ​ກຳ​ເນີດ​ອັນ​ສູງ​ສົ່ງ,
  ພຣະ​ຊົນ​ຊີບ​ທີ່​ຫາ​ອັນ​ປຽບ​ບໍ່​ໄດ້, ແລະ ການ​ເສຍ​ສະ​ລະ​ຊົດ​ໃຊ້​ອັນບໍ່​ມີ​ຂອບ​ເຂດ​ຂອງ​ພຣະ​ບຸດ​ທີ່​ຮັກ​ຂອງ​ພຣະ​ອົງ,
  ພຣະ​ເຢ​ຊູ​ຄຣິດ​ໃຫ້​ເຮົາ. ດ້ວຍ​ອຳ​ນາດ​ຂອງ​ພຣະ​ບິ​ດາ, ພຣະ​ເຢ​ຊູ​ໄດ້​ລຸກ​ຂຶ້ນ​ອີກ ແລະ ໄດ້​ເອົາ​ຊະ​ນະ​ຄວາມ​ຕາຍ.
  ພຣະ​ອົງ​ເປັນ​ພຣະ​ຜູ້​ຊ່ວຍ​ໃຫ້​ລອດ​ຂອງ​ເຮົາ, ເປັນ​ຕົວ​ຢ່າງ​ຂອງ​ເຮົາ, ແລະ ເປັນ​ພຣະ​ຜູ້​ໄຖ່​ຂອງ​ເຮົາ.
- ເມື່ອ​ສອງ​ຮ້ອຍ​ປີ​ກ່ອນ, ໃນ​ວັນ​ທີ່​ສວຍ​ງາມ​ຂອງ​ລະ​ດູ​ໃບ​ໄມ້​ປົ່ງ ໃນ​ປີ 1820, ຊາຍ​ໜຸ່ມ​ໂຈ​ເຊັບ ສະ​ມິດ,
  ຢາກ​ຮູ້​ວ່າ​ສາດ​ສະ​ໜາ​ຈັກ​ໃດ​ທີ່​ເພິ່ນ​ຄວນ​ເຂົ້າ​ຮ່ວມ, ຈຶ່ງ​ໄດ້​ເຂົ້າ​ໄປ​ໃນ​ປ່າ ຢູ່​ໃກ້​ບ້ານ​ຂອງ​ເພິ່ນ
  ໃນ​ເຂດ​ເໜືອ​ຂອງ​ລັດ​ນິວ​ຢອກ, ສະ​ຫະ​ລັດ​ອາ​ເມ​ຣິ​ກາ ເພື່ອ​ອະ​ທິ​ຖານ. ເພິ່ນ​ມີ​ຄຳ​ຖາມ​ກ່ຽວ​ກັບ​ຄວາມ​ລອດ​ຂອງ​ຈິດ​ວິນ​ຍານ​ຂອງ​ເພິ່ນ
  ແລະ ໄວ້​ວາງ​ໃຈ​ວ່າ​ພຣະ​ເຈົ້າ​ຈະ​ຊີ້​ນຳ​ເພິ່ນ.
- ໃນ​ຄວາມ​ຖ່ອມ​ຕົວ, ພວກ​ເຮົາ​ປະ​ກາດ​ວ່າ ໃນ​ການ​ຕອບ​ຄຳ​ອະ​ທິ​ຖານ​ຂອງ​ເພິ່ນ, ພຣະ​ເຈົ້າ​ອົງ​ເປັນ​ພຣະ​ບິ​ດາ
  ແລະ ພຣະ​ບຸດ​ຂອງ​ພຣະ​ອົງ, ພຣະ​ເຢ​ຊູ​ຄຣິດ, ໄດ້​ມາ​ປະ​ກົດ​ຕໍ່​ໂຈ​ເຊັບ ແລະ ໄດ້​ເລີ່ມ​ຕົ້ນ​ເວ​ລາ​ທີ່ “ທຸກ​ສິ່ງ​ຈະ​ຖືກ​ຕັ້ງ​ຂຶ້ນ​ໃໝ່”
  (ກິດ​ຈະ​ການ 3:21) ດັ່ງ​ທີ່​ຖືກ​ບອກ​ໄວ້​ລ່ວງ​ໜ້າ​ຢູ່​ໃນ​ພຣະ​ຄຣິສ​ຕະ​ທຳ​ຄຳ​ພີ. ຢູ່​ໃນ​ພາບ​ນິ​ມິດ​ນີ້,
  ເພິ່ນ​ໄດ້​ຮຽນ​ຮູ້​ວ່າ ຫລັງ​ຈາກ​ການ​ຕາຍ​ຂອງ​ພວກ​ອັກ​ຄະ​ສາ​ວົກ​ລຸ້ນ​ດັ້ງ​ເດີມ, ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ຄຣິດ​ໃນ​ພຣະ​ຄຳ​ພີ​ໃໝ່​ໄດ້​ສູນ​ຫາຍ​ໄປ​ຈາກ​ໂລກ​ນີ້.
  ໂຈ​ເຊັບ​ຈະ​ເປັນ​ເຄື່ອງ​ມື​ໃນ​ການ​ນຳ​ສາດ​ສະ​ໜາ​ຈັກ​ກັບ​ຄືນ​ມາ.
- ພວກ​ເຮົາ​ຢືນ​ຢັນ​ວ່າ ພາຍ​ໃຕ້​ການ​ຊີ້​ນຳ​ຂອງ​ພຣະ​ບິ​ດາ ແລະ ພຣະ​ບຸດ, ທູດ​ຈາກ​ສະ​ຫວັນ​ໄດ້​ມາ​ແນະ​ນຳ​ໂຈ​ເຊັບ
  ແລະ ສະ​ຖາ​ປະ​ນາ​ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ຄືນ​ໃໝ່. ໂຢ​ຮັນ​ບັບ​ຕິ​ສະ​ໂຕ​ທີ່​ໄດ້ຟື້ນ​ຄືນ​ຊີ​ວິດ​ແລ້ວ​ໄດ້​ຟື້ນ​ຟູ​ສິດ​ອຳ​ນາດ​ຂອງ​ການ​ບັບ​ຕິ​ສະ​ມາ​ໂດຍ​ການ​ລົງ​ໄປ​ໃນ​ນ້ຳ​ໝົດ​ທັງ​ຕົວ​ເພື່ອ​ການ​ປົດ​ບາບ.
  ສາມ​ຄົນ​ຂອງ​ກຸ່ມ​ອັກ​ຄະ​ສາ​ວົກ​ສິບ​ສອງ​ລຸ້ນ​ດັ້ງ​ເດີມ—ເປ​ໂຕ, ຢາ​ໂກ​ໂບ, ແລະ ໂຢ​ຮັນ—ໄດ້​ຟື້ນ​ຟູ​ການ​ເປັນ​ອັກ​ຄະ​ສາ​ວົກ
  ແລະ ຂໍ​ກະ​ແຈ​ຂອງ​ສິດ​ອຳ​ນາດ​ຖາ​ນະ​ປະ​ໂລ​ຫິດ​. ຄົນ​ອື່ນໆ​ກໍ​ໄດ້​ມາ​ຄື​ກັນ, ລວມ​ທັງ​ເອ​ລີ​ຢາ, ຜູ້​ຊຶ່ງ​ໄດ້​ຟື້ນ​ຟູ​ສິດ​ອຳ​ນາດ​ເພື່ອ​ໃຫ້​ເຕົ້າ​ໂຮມ​ຄອບ​ຄົວ​ເຂົ້າ​ກັນ​ຕະ​ຫລອດ​ໄປ
  ໃນ​ຄວາມ​ສຳ​ພັນ​ນິ​ລັນ​ດອນ ທີ່​ເໜືອ​ກວ່າ​ຄວາມ​ຕາຍ.
- 'ພວກ​ເຮົາ​ເປັນ​ພະ​ຍານ​ອີກ​ວ່າ ໂຈ​ເຊັບ ສະ​ມິດ ໄດ້​ຮັບ​ຂອງ​ປະ​ທານ ແລະ ອຳ​ນາດ​ຂອງ​ພຣະ​ເຈົ້າ ເພື່ອ​ໃຫ້​ແປ​ບັນ​ທຶກ​ບູ​ຮານ:
  ພຣະ​ຄຳ​ພີ​ມໍ​ມອນ—ປະ​ຈັກ​ພະ​ຍານ​ອີກ​ຢ່າງ​ໜຶ່ງ​ເຖິງ ພຣະ​ເຢ​ຊູ​ຄຣິດ. ຢູ່​ໃນ​ບັນ​ທຶກ​ທີ່​ສັກ​ສິດ​ນີ້ ແມ່ນ​ລວມ​ທັງ​ເລື່ອງ​ລາວ​ກ່ຽວ​ກັບ​ການ​ປະ​ຕິ​ບັດ​ສາດ​ສະ​ໜາ​ກິດ​ເປັນ​ສ່ວນ​ຕົວ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ
  ໃນ​ບັນ​ດາ​ຜູ້​ຄົນ​ຢູ່​ຊີກ​ໂລກ​ເບື້ອງ​ຕາ​ເວັນ​ຕົກ ບໍ່​ດົນ​ຫລັງ​ຈາກ​ການ​ຟື້ນ​ຄືນ​ພຣະ​ຊົນ​ຂອງ​ພຣະ​ອົງ.
  ມັນ​ສິດ​ສອນ​ເຖິງ​ຈຸດ​ປະ​ສົງ​ຂອງ​ຊີ​ວິດ ແລະ ອະ​ທິ​ບາຍ​ຄຳ​ສອນ​ຂອງ​ພຣະ​ຄຣິດ, ຊຶ່ງ​ເປັນ​ຈຸດ​ໃຈ​ກາງ​ຂອງ​ຈຸດ​ປະ​ສົງ​ນັ້ນ.
  ໂດຍ​ທີ່​ເປັນ​ພຣະ​ຄຳ​ພີ​ຄຽງ​ຄູ່​ໄປ​ກັບ​ພຣະ​ຄຣິສ​ຕະ​ທຳ​ຄຳ​ພີ, ພຣະ​ຄຳ​ພີ​ມໍ​ມອນ​ເປັນ​ພະ​ຍານ​ວ່າ ມະ​ນຸດ​ທຸກ​ຄົນ​ເປັນ​ບຸດ
  ແລະ ທິ​ດາ​ຂອງ​ພຣະ​ບິ​ດາ​ຜູ້​ສະ​ຖິດ​ຢູ່​ໃນ​ສະ​ຫວັນ​ທີ່​ຊົງ​ຮັກ, ວ່າ​ພຣະ​ອົງ​ມີ​ແຜນ​ແຫ່ງ​ສະ​ຫວັນ​ສຳ​ລັບ​ຊີ​ວິດ​ຂອງ​ເຮົາ,
  ແລະ ວ່າ​ພຣະ​ບຸດ​ຂອງ​ພຣະ​ອົງ, ພຣະ​ເຢ​ຊູ​ຄຣິດ, ກ່າວ​ໃນ​ທຸກ​ວັນ​ນີ້ ເທົ່າໆ​ກັບ​ໃນ​ສະ​ໄໝ​ກ່ອນ.'
- ພວກ​ເຮົາ​ປະ​ກາດ​ວ່າ ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ແຫ່ງ​ໄພ່​ພົນ​ຍຸກ​ສຸດ​ທ້າຍ, ຊຶ່ງ​ໄດ້​ຖືກ​ຈັດ​ຕັ້ງ​ຂຶ້ນ​ໃນ​ວັນ​ທີ
  6 ເດືອນ​ເມ​ສາ, 1830, ຄື​ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ຄຣິດ​ໃນ​ພຣະ​ຄຳ​ພີ​ໃໝ່​ທີ່​ຖືກ​ຟື້ນ​ຟູ. ສາດ​ສະ​ໜາ​ຈັກ​ນີ້​ຍຶດ​ໝັ້ນ​ຢູ່​ທີ່​ພຣະ​ຊົນ​ຊີບ​ທີ່​ດີ​ພ້ອມ​ຂອງ​ຫີນ​ເສົາ​ເອກ​ອັນ​ສຳ​ຄັນ,
  ພຣະ​ເຢ​ຊູ​ຄຣິດ, ແລະ ໃນ​ການ​ຊົດ​ໃຊ້​ອັນ​ບໍ່​ມີ​ຂອບ​ເຂດ​ຂອງ​ພຣະ​ອົງ ແລະ ໃນ​ການ​ຟື້ນ​ຄືນ​ພຣະ​ຊົນ​ທີ່​ຈິງ​ແທ້​ຂອງ​ພຣະ​ອົງ.
  ອີກ​ເທື່ອ​ໜຶ່ງ ພຣະ​ເຢ​ຊູ​ຄຣິດ​ໄດ້​ເອີ້ນ​ອັກ​ຄະ​ສາ​ວົກ ແລະ ໄດ້​ມອບ​ສິດ​ອຳ​ນາດ​ຖາ​ນະ​ປະ​ໂລ​ຫິດ​ໃຫ້​ພວກ​ເພິ່ນ.
  ພຣະ​ອົງ​ເຊື້ອ​ເຊີນ​ເຮົາ​ທຸກ​ຄົນ​ໃຫ້​ມາ​ຫາ​ພຣະ​ອົງ ແລະ ມາ​ຫາ​ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ອົງ, ເພື່ອ​ຮັບ​ເອົາ​ພຣະ​ວິນ​ຍານ​ບໍ​ລິ​ສຸດ,
  ພິ​ທີ​ການ​ແຫ່ງ​ຄວາມ​ລອດ, ແລະ ຄວາມ​ສຸກ​ທີ່​ຍືນ​ຍາວ.
- ສອງ​ຮ້ອຍ​ປີ​ໄດ້​ຜ່ານ​ພົ້ນ​ໄປ​ນັບ​ຕັ້ງ​ແຕ່​ພຣະ​ເຈົ້າ​ອົງ​ເປັນ​ພຣະ​ບິ​ດາ ແລະ ພຣະ​ບຸດ​ທີ່​ຮັກ​ຂອງ​ພຣະ​ອົງ,
  ພຣະ​ເຢ​ຊູ​ຄຣິດ ໄດ້​ເລີ່ມ​ຕົ້ນ​ການ​ຟື້ນ​ຟູ​ນີ້. ຫລາຍ​ລ້ານ​ຄົນ​ຕະ​ຫລອດ​ທົ່ວ​ໂລກ​ໄດ້​ຮັບ​ເອົາ​ຄວາມ​ຮູ້​ເຫລົ່າ​ນີ້​ຂອງ​ເຫດ​ການ​ທີ່​ຖືກ​ທຳ​ນາຍ​ໄວ້.
- ພວກ​ເຮົາ​ຍິນ​ດີ​ທີ່​ຈະ​ປະ​ກາດ​ວ່າ ການ​ຟື້ນ​ຟູ​ທີ່​ສັນ​ຍາ​ຍັງ​ດຳ​ເນີນ​ໄປ​ໜ້າ ຜ່ານ​ທາງ​ການ​ເປີດ​ເຜີຍ​ອັນ​ຕໍ່​ເນື່ອງ.
  ແຜ່ນ​ດິນ​ໂລກ​ຈະ​ບໍ່​ເໝືອນ​ເດີມ​ອີກ, ຂະ​ນະ​ທີ່​ພຣະ​ເຈົ້າ “ຮວບ​ຮວມ​ສິ່ງ​ສາ​ລະ​ພັດ​ໄວ້​ໃນ​ພຣະ​ຄຣິດ” (ເອ​ເຟ​ໂຊ
  1:10).
- ດ້ວຍ​ຄວາມ​ຄາ​ລະ​ວະ ແລະ ຄວາມຮູ້​ບຸນ​ຄຸນ, ພວກ​ເຮົາ​ໃນ​ຖາ​ນະ​ອັກ​ຄະ​ສາ​ວົກ​ຂອງ​ພຣະ​ອົງ ຂໍ​ເຊື້ອ​ເຊີນ​ທຸກ​ຄົນ
  ໃຫ້​ຮູ້—ດັ່ງ​ທີ່​ພວກ​ເຮົາ​ຮູ້—ວ່າ​ສະ​ຫວັນ​ເປີດ​ຢູ່. ພວກ​ເຮົາ​ຢືນ​ຢັນ​ວ່າ ພຣະ​ເຈົ້າ​ກຳ​ລັງ​ເຮັດ​ໃຫ້​ພຣະ​ປະ​ສົງ​ຂອງ​ພຣະ​ອົງ​ເປັນ​ທີ່​ຮູ້​ຈັກ​ແກ່​ບຸດ
  ແລະ ທິ​ດາ​ຂອງ​ພຣະ​ອົງ. ພວກ​ເຮົາ​ຢືນ​ຢັນ​ວ່າ ຜູ້​ທີ່​ສຶກ​ສາ​ຂ່າວ​ສານ​ເລື່ອງ​ການ​ຟື້ນ​ຟູ​ດ້ວຍ​ການ​ອະ​ທິ​ຖານ
  ແລະ ກະ​ທຳ​ຕາມ​ດ້ວຍ​ສັດ​ທາ ຈະ​ໄດ້​ຮັບ​ພອນ​ແຫ່ງ​ການ​ເປັນ​ພະ​ຍານ​ດ້ວຍ​ຕົວ​ເອງ ເຖິງ​ຄວາມ​ສູງ​ສົ່ງ ແລະ ຈຸດ​ປະ​ສົງຂອງ​ການ​ຟື້ນ​ຟູ
  ເພື່ອ​ກະ​ກຽມ​ໂລກ​ສຳ​ລັບ​ການ​ສະ​ເດັດ​ມາ​ຄັ້ງ​ທີ​ສອງ​ຂອງ​ພຣະ​ຜູ້​ເປັນ​ເຈົ້າ ແລະ ພຣະ​ຜູ້​ຊ່ວຍ​ໃຫ້​ລອດ​ຂອງ​ເຮົາ,
  ພຣະ​ເຢ​ຊູ​ຄຣິດ, ທີ່​ສັນ​ຍາ​ໄວ້.
