title: ຫລັກ​ແຫ່ງ​ຄວາມ​ເຊື່ອ ຂອງ​
subtitle: ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ແຫ່ງ​ໄພ່​ພົນ​ຍຸກ​ສຸດ​ທ້າຍ
author: ''
verses:
- n: 1
  text: ພວກ​ເຮົາ ເຊື່ອ​ໃນ ພຣະ​ເຈົ້າ, ພຣະ​ບິ​ດາ​ຜູ້​ສະ​ຖິດ​ນິ​ລັນ​ດອນ, ແລະ ໃນ ພຣະ​ບຸດ​ຂອງ​ພຣະ​ອົງ, ພຣະ​ເຢ​ຊູ​ຄຣິດ,
    ແລະ ໃນ ພຣະ​ວິນ​ຍານ​ບໍ​ລິ​ສຸດ.
- n: 2
  text: ພວກ​ເຮົາ​ເຊື່ອ​ວ່າ ມະ​ນຸດ​ຈະ​ໄດ້​ຮັບ​ໂທດ​ເພາະ​ບາບ ຂອງ​ຕົນ ແລະ ບໍ່​ແມ່ນ​ເພາະ​ການ​ລ່ວງ​ລະ​ເມີດ ຂອງ​ອາ​ດາມ.
- n: 3
  text: ພວກ​ເຮົາ​ເຊື່ອ​ວ່າ ຜ່ານ​ທາງ ການ​ຊົດ​ໃຊ້​ຂອງ​ພຣະ​ຄຣິດ ມະ​ນຸດ​ຊາດ​ທັງ​ປວງ​ຈະ ລອດ​ໄດ້ ໂດຍ ການ​ປະ​ຕິ​ບັດ​ຕາມ
    ກົດ ແລະ ພິ​ທີ​ການ​ແຫ່ງ ພຣະ​ກິດ​ຕິ​ຄຸນ.
- n: 4
  text: 'ພວກ​ເຮົາ​ເຊື່ອ​ວ່າ ຫລັກ​ທຳ ແລະ ພິ​ທີ​ການ​ເບື້ອງ​ຕົ້ນ​ແຫ່ງ​ພຣະ​ກິດ​ຕິ​ຄຸນ​ຄື: ໜຶ່ງ ສັດ​ທາ​ໃນ​ອົງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ເຈົ້າ;
    ສອງ ການ​ກັບ​ໃຈ; ສາມ ບັບ​ຕິ​ສະ​ມາ​ໂດຍ ການ​ລົງ​ໄປ​ໃນ​ນ້ຳ​ໝົດ​ທັງ​ຕົວ​ເພື່ອ​ການ​ປົດ​ບາບ; ສີ່ ການ​ວາງ
    ມື​ເພື່ອ​ຮັບ ຂອງ​ປະ​ທານ​ແຫ່ງ​ພຣະ​ວິນ​ຍານ​ບໍ​ລິ​ສຸດ.'
- n: 5
  text: ພວກ​ເຮົາ​ເຊື່ອ​ວ່າ ມະ​ນຸດ​ຕ້ອງ​ໄດ້​ຮັບ ການ​ເອີ້ນ​ຈາກ​ພຣະ​ເຈົ້າ​ໂດຍ ການ​ພະ​ຍາ​ກອນ ແລະ ໂດຍ ການ​ວາງ​ມື​ໂດຍ​ຜູ້​ມີ
    ສິດ​ອຳ​ນາດ ເພື່ອ​ໃຫ້ ສັ່ງ​ສອນ​ພຣະ​ກິດ​ຕິ​ຄຸນ ແລະ ປະ​ຕິ​ບັດ ພິ​ທີ​ການ​ຕາມ​ນັ້ນ.
- n: 6
  text: ພວກ​ເຮົາ​ເຊື່ອ​ໃນ ການ​ຈັດ​ວາງ​ລະ​ບຽບ​ງານ​ຢ່າງ​ດຽວ​ກັນ​ກັບ​ທີ່​ມີ​ຢູ່​ໃນ​ສາດ​ສະ​ໜາ​ຈັກ​ສະ​ໄໝ​ບູ​ຮານ
    ນັ້ນ​ຄື ອັກ​ຄະ​ສາ​ວົກ, ສາດ​ສະ​ດາ, ສິດ​ຍາ​ພິ​ບານ, ຄູ​ສອນ, ຜູ້​ປະ​ກາດ​ຂ່າວ​ປະ​ເສີດ, ແລະ ອື່ນໆ.
- n: 7
  text: ພວກ​ເຮົາ​ເຊື່ອ​ໃນ ຂອງ​ປະ​ທານ​ແຫ່ງ ການ​ເວົ້າ​ພາ​ສາ, ການ​ພະ​ຍາ​ກອນ, ການ​ເປີດ​ເຜີຍ, ພາບ​ທີ່​ມາ​ໃຫ້​ເຫັນ,
    ການ​ປິ່ນ​ປົວ, ການ​ແປ​ພາ​ສາ, ແລະ ອື່ນໆ.
- n: 8
  text: ພວກ​ເຮົາ​ເຊື່ອ​ວ່າ ພຣະ​ຄຣິສ​ຕະ​ທຳ​ຄຳ​ພີ​ເປັນ ພຣະ​ຄຳ​ຂອງ​ພຣະ​ເຈົ້າ​ຕາບ​ໃດ​ທີ່​ແປ​ມັນ ຖືກ​ຕ້ອງ.
    ພວກ​ເຮົາ​ເຊື່ອ​ອີກ​ວ່າ ພຣະ​ຄຳ​ພີ​ມໍ​ມອນ​ເປັນ​ພຣະ​ຄຳ​ຂອງ​ພຣະ​ເຈົ້າ.
- n: 9
  text: ພວກ​ເຮົາ​ເຊື່ອ​ທັງ​ໝົດ​ທີ່​ພຣະ​ເຈົ້າ​ໄດ້ ເປີດ​ເຜີຍ​ມາ, ທັງ​ໝົດ​ທີ່​ພຣະ​ອົງ​ເປີດ​ເຜີຍ​ຢູ່​ໃນ​ຂະ​ນະ​ນີ້
    ແລະ ພວກ​ເຮົາ​ເຊື່ອ​ວ່າ ພຣະ​ອົງ​ຈະ ເປີດ​ເຜີຍ​ເລື່ອງ​ສຳ​ຄັນ ແລະ ຍິ່ງ​ໃຫຍ່​ອີກ​ຫລາຍ​ເລື່ອງ​ກ່ຽວ​ກັບ​ອາ​ນາ​ຈັກ​ຂອງ​ພຣະ​ເຈົ້າ.
- n: 10
  text: ພວກ​ເຮົາ​ເຊື່ອ​ໃນ ການ​ຮ່ວມ​ກັນ​ແທ້ໆ​ຂອງ​ເຊື້ອ​ສາຍ​ອິດ​ສະ​ຣາ​ເອນ ແລະ ໃນ​ການ​ກັບ​ຄືນ​ມາ​ຂອງ​ຄົນ
    ສິບ​ເຜົ່າ ແລະ ວ່າ ຊີ​ໂອນ (ເຢ​ຣູ​ຊາ​ເລັມ​ໃໝ່) ຈະ​ຖືກ​ສ້າງ​ຂຶ້ນ​ໃນ​ທະ​ວີບ​ອາ​ເມ​ຣິ​ກາ ວ່າ​ພຣະ​ຄຣິດ​ຈະ
    ປົກ​ຄອງ​ແຜ່ນ​ດິນ​ໂລກ​ເອງ ແລະ ວ່າ​ແຜ່ນ​ດິນ​ໂລກ​ຈະ​ຖືກ ເຮັດ​ໃໝ່ ແລະ ໄດ້​ຮັບ ລັດ​ສະ​ໝີ​ພາບ ແຫ່ງ​ສຸ​ຂະ​ເສີມ​ຂອງ​ມັນ.
- n: 11
  text: ພວກ​ເຮົາ​ເຊື່ອ​ຖື ສິດ​ທິ​ແຫ່ງ​ການ​ນະ​ມັດ​ສະ​ການ​ພຣະ​ເຈົ້າ ຜູ້​ມີ​ລິດ​ທາ​ນຸ​ພາບ​ຕາມ ການ​ບອກ​ຂອງ
    ຄວາມ​ຮູ້​ສຶກ​ຜິດ ຫລື ຖືກ​ຂອງ​ເຮົາ​ເອງ ແລະ ຍອມ​ໃຫ້​ຄົນ​ທັງ​ປວງ​ມີ​ສິດ​ທິ​ເຊັ່ນ​ດຽວ​ກັນ ໃຫ້​ເຂົາ ນະ​ມັດ​ສະ​ການ​ຢ່າງ​ໃດ,
    ທີ່​ໃດ, ຫລື ສິ່ງ​ໃດ​ທີ່​ເຂົາ​ຈະ​ນະ​ມັດ​ສະ​ການ.
- n: 12
  text: ພວກ​ເຮົາ​ເຊື່ອ​ໃນ​ການ​ຂຶ້ນ​ຢູ່​ກັບ​ກະ​ສັດ, ປະ​ທາ​ນາ​ທິ​ບໍ​ດີ, ຜູ້​ປົກ​ຄອງ, ແລະ ຜູ້​ພິ​ພາກ​ສາ ໃນ​ການ​ເຮັດ​ຕາມ​ການ​ຍົກ​ຍ້ອງ
    ແລະ ໃນ​ການ​ສະ​ໜັບ​ສະ​ໜູນ ກົດ​ໝາຍ.
- n: 13
  text: ພວກ​ເຮົາ​ເຊື່ອ​ໃນ​ການ​ເປັນ​ຄົນ ຊື່​ສັດ, ຈິງ​ໃຈ, ບໍ​ລິ​ສຸດ, ມີ​ເມດ​ຕາ, ມີ​ຄຸນ​ນະ​ທຳ, ແລະ ໃນ ການ​ເຮັດ​ຄວາມ​ດີ​ຕໍ່​ມະ​ນຸດ​ທັງ​ປວງ
    ໂດຍ​ແທ້​ແລ້ວ ພວກ​ເຮົາ​ຈະ​ກ່າວ​ວ່າ ພວກ​ເຮົາ​ດຳ​ເນີນ​ຕາມ ຄຳ​ແນະ​ນຳ​ຂອງ​ໂປ​ໂລ—ນັ້ນ​ຄື ພວກ​ເຮົາ​ເຊື່ອ​ທຸກ​ສິ່ງ,
    ພວກ​ເຮົາ ຫວັງ​ທຸກ​ສິ່ງ, ພວກ​ເຮົາ​ອົດ​ທົນ​ມາ​ແລ້ວ​ຫລາຍ​ສິ່ງ ແລະ ຫວັງ​ທີ່​ຈະ​ສາ​ມາດ ອົດ​ທົນ​ໄດ້​ທຸກ​ສິ່ງ
    ຫາກ​ມີ​ສິ່ງ​ໃດ​ທີ່​ເປັນ ຄຸນ​ນະ​ທຳ, ງົດ​ງາມ, ຫລື ຈາກ​ການ​ລາຍ​ງານ​ດີ ຫລື ຄວນ​ສັນ​ລະ​ເສີນ, ພວກ​ເຮົາ​ສະ​ແຫວງ​ຫາ​ສິ່ງ​ເຫລົ່າ​ນີ້.
signature: ໂຈ​ເຊັບ ສະ​ມິດ.
