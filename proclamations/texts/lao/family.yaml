title: ຄອບ​ຄົວ
subtitle: ການ​ປະ​ກາດ​ຕໍ່​ໂລກ
author: ຝ່າຍ​ປະ​ທານ​ສູງ​ສຸດ ແລະ ສະ​ພາ​ອັກ​ຄະ​ສາ​ວົກ​ສິບ​ສອງ​ຂອງ​ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ແຫ່ງ​ໄພ່​ພົນ​ຍຸກ​ສຸດ​ທ້າຍ
note: ປະ​ທານ​ກໍ​ດອນ ບີ ຮິງ​ລີ ໄດ້​ອ່ານ​ການ​ປະ​ກາດ​ນີ້​ໃນ​ຄຳ​ປາ​ໄສ​ຂອງ​ເພິ່ນ ທີ່​ກອງ​ປະ​ຊຸມ​ສະ​ມາ​ຄົມ​ສະ​ຕີ​ສົງ​ເຄາະ​ສາ​ມັນ
  ເມື່ອ​ວັນ​ທີ 23 ເດືອນ​ກັນ​ຍາ, 1995, ໃນ​ເມືອງ​ເຊົາ​ເລັກ, ລັດ​ຢູ​ທາ.
paragraphs:
- ພວກ​ເຮົາ, ຝ່າຍ​ປະ​ທານ​ສູງ​ສຸດ ແລະ ສະ​ພາ​ອັກ​ຄະ​ສາ​ວົກ​ສິບ​ສອງ​ຂອງ​ສາດ​ສະ​ໜາ​ຈັກ​ຂອງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ແຫ່ງ​ໄພ່​ພົນ​ຍຸກ​ສຸດ​ທ້າຍ,
  ຂໍ​ປະ​ກາດ​ຢ່າງ​ໜັກ​ແໜ້ນ​ວ່າ ການ​ແຕ່ງ​ງານ​ລະ​ຫວ່າງ​ຊາຍ ແລະ ຍິງ ເປັນ​ການ​ແຕ່ງ​ຕັ້ງ​ຈາກ​ພຣະ​ເຈົ້າ ແລະ ວ່າ​ຄອບ​ຄົວ​ເປັນ​ຈຸດ​ໃຫຍ່​ໃຈ​ກາງ​ຕໍ່​ແຜນ​ຂອງ​ພຣະ​ຜູ້​ສ້າງ
  ສຳ​ລັບ​ຈຸດ​ໝາຍ​ປາຍ​ທາງ​ນິ​ລັນ​ດອນ​ຂອງ​ລູກໆ​ຂອງ​ພຣະ​ອົງ.
- ມະ​ນຸດ​ທຸກ​ຄົນ—ຊາຍ ແລະ ຍິງ—ໄດ້​ຖືກ​ສ້າງ​ຂຶ້ນ​ຕາມ​ຮູບ​ຮ່າງ​ລັກ​ສະ​ນະ​ຂອງ​ພຣະ​ເຈົ້າ. ແຕ່​ລະ​ຄົນ​ກໍ​ເປັນ​ບຸດ
  ຫລື ທິ​ດາ​ທາງ​ວິນ​ຍານ​ທີ່​ຮັກ​ຫອມ​ຂອງ​ບິ​ດາ​ມານ​ດາ​ແຫ່ງ​ສະ​ຫວັນ, ແລະ, ເມື່ອ​ເປັນ​ເຊັ່ນ​ນັ້ນ, ແຕ່​ລະ​ຄົນ​ຈຶ່ງ​ມີ​ທຳ​ມະ​ຊາດ​ແຫ່ງ​ສະ​ຫວັນ
  ແລະ ມີ​ຈຸດ​ໝາຍ​ປາຍ​ທາງ. ເພດເປັນ​ບຸກ​ຄະ​ລິກ​ລັກ​ສະ​ນະ​ທຳ​ມະ​ຊາດ​ຂອງ​ເອ​ກະ​ລັກ ແລະ ຈຸດ​ປະ​ສົງ​ໃນ​ໂລກ​ກ່ອນ​ເກີດ,
  ໃນ​ໂລກ​ນີ້, ແລະ ໃນ​ນິ​ລັນ​ດອນ​ຂອງ​ແຕ່​ລະ​ຄົນ.
- ໃນ​ພົມ​ມະ​ຈັກ​ກ່ອນ​ເກີດ, ບຸດ ແລະ ທິ​ດາ​ທາງ​ວິນ​ຍານ​ຮູ້​ຈັກ ແລະ ນະ​ມັດ​ສະ​ການ​ພຣະ​ເຈົ້າ ວ່າ​ເປັນ​ພຣະ​ບິ​ດາ​ນິ​ລັນ​ດອນ​ຂອງ​ເຂົາ
  ແລະ ຍອມ​ຮັບ​ເອົາ​ແຜນ​ຂອງ​ພຣະ​ອົງ ຊຶ່ງ​ໃນ​ແຜນ​ນັ້ນ ລູກໆ​ຂອງ​ພຣະ​ອົງ​ຈະ​ໄດ້​ຮັບ​ຮ່າງ​ກາຍທີ່​ມີ​ເນື້ອ​ໜັງ
  ແລະ ມີ​ປະ​ສົບ​ການ​ຕ່າງໆ​ຢູ່​ໃນ​ໂລກ ເພື່ອ​ຈະ​ໄດ້​ພັດ​ທະ​ນາ​ຕົນ ຈົນ​ເຖິງ​ຂັ້ນ​ດີ​ພ້ອມ​ທຸກ​ຢ່າງ ແລະ ໃນ​ທີ່​ສຸດ​ບັນ​ລຸ​ຈຸດ​ໝາຍ​ປາຍ​ທາງ​ແຫ່ງ​ສະ​ຫວັນ​ຂອງ​ເຂົາ
  ໃນ​ຖາ​ນະ​ຜູ້ຮັບ​ມໍ​ລະ​ດົກ​ແຫ່ງ​ຊີ​ວິດ​ນິ​ລັນ​ດອນ. ແຜນ​ແຫ່ງ​ຄວາມ​ສຸກ​ຂອງ​ພຣະ​ເຈົ້າ​ເຮັດ​ໃຫ້​ຄວາມ​ສຳ​ພັນ​ຂອງ​ຄອບ​ຄົວ​ຍືນ​ຍົງ​ຕໍ່​ໄປ​ຫລັງ​ຈາກ​ຄວາມ​ຕາຍ.
  ພິ​ທີ​ການ ແລະ ພັນ​ທະ​ສັນ​ຍາ​ສັກ​ສິດ​ຕ່າງໆ​ທີ່​ມີ​ໄວ້​ໃນ​ພຣະ​ວິ​ຫານ​ສັກ​ສິດ ເຮັດ​ໃຫ້​ເປັນ​ໄປ​ໄດ້​ສຳ​ລັບ​ຜູ້​ຄົນ​ທີ່​ຈະ​ກັບ​ໄປ​ຫາ​ທີ່ປະ​ທັບ​ຂອງ​ພຣະ​ເຈົ້າ
  ແລະ ໃຫ້​ຄອບ​ຄົວ​ຢູ່​ນຳ​ກັນ​ຊົ່ວ​ນິ​ລັນ​ດອນ​ໄດ້.
- ພຣະ​ບັນ​ຍັດ​ຂໍ້​ທຳ​ອິດ​ທີ່​ພຣະ​ເຈົ້າ​ໄດ້​ມອບ​ໃຫ້​ອາ​ດາມ ແລະ ເອ​ວາ ແມ່ນ​ກ່ຽວ​ກັບ​ສັກ​ກະ​ຍະ​ພາບ​ຂອງ​ເຂົາ​ເຈົ້າ​ທີ່​ຈະ​ໄດ້​ເປັນ​ພໍ່​ແມ່​ໃນ​ຖາ​ນະ​ສາ​ມີ
  ແລະ ພັນ​ລະ​ຍາ. ພວກ​ເຮົາ​ຂໍ​ປະ​ກາດ​ວ່າ ພຣະ​ບັນ​ຍັດ​ຂອງ​ພຣະ​ເຈົ້າ​ຕໍ່​ລູກໆ​ຂອງ​ພຣະ​ອົງ​ວ່າ ຈົ່ງ​ມີ​ລູກ​ເຕົ້າ​ໃຫ້​ແຜ່​ຜາຍ​ຂະ​ຫຍາຍ​ທະ​ວີ​ຄູນ​ຈົນ​ເຕັມ​ແຜ່ນ​ດິນ​ໂລກ
  ຍັງ​ເປັນ​ພຣະ​ບັນ​ຍັດ​ທີ່​ໃຊ້​ໄດ້​ຢູ່. ພວກ​ເຮົາ​ຂໍ​ປະ​ກາດ​ຕື່ມ​ອີກ​ວ່າ ພຣະ​ເຈົ້າ​ໄດ້​ບັນ​ຊາ​ວ່າ ອຳ​ນາດ​ທີ່​ສັກ​ສິດ​ຂອງ​ການ​ໃຫ້​ກຳ​ເນີດ​ແມ່ນ​ຕ້ອງ​ເກີດ​ຂຶ້ນ​ລະ​ຫວ່າງ​ຊາຍ
  ແລະ ຍິງ, ຜູ້​ແຕ່ງ​ງານ​ກັນ​ຢ່າງ​ຖືກ​ຕ້ອງ​ຕາມ​ກົດ​ໝາຍ​ໃນ​ຖາ​ນະ​ສາ​ມີ ແລະ ພັນ​ລະ​ຍາ​ເທົ່າ​ນັ້ນ.
- ພວກ​ເຮົາ​ຂໍ​ປະ​ກາດ​ວ່າ​ມະ​ນຸດ​ຖືກ​ສ້າງ​ຂຶ້ນ​ມາ​ຕາມ​ທີ່​ພຣະ​ເຈົ້າ​ໄດ້​ຈັດ​ແຕ່ງ​ໄວ້. ພວກ​ເຮົາ​ຂໍ​ຢືນ​ຢັນ​ເຖິງ​ຄວາມ​ສັກ​ສິດ​ຂອງ​ຊີ​ວິດ
  ແລະ ເຖິງ​ຄວາມ​ສຳ​ຄັນ​ຂອງ​ມັນ​ໃນ​ແຜນ​ນິ​ລັນ​ດອນ​ຂອງ​ພຣະ​ເຈົ້າ.
- ສາ​ມີ ແລະ ພັນ​ລະ​ຍາ​ມີ​ໜ້າ​ທີ່​ຮັບ​ຜິດ​ຊອບ​ຢ່າງ​ຈິງ​ຈັງ​ທີ່​ຈະ​ຮັກ ແລະ ດູ​ແລ​ກັນແລະ​ກັນ ແລະ ລູກໆ​ຂອງ​ຕົນ.
  “ເດັກ​ນ້ອຍ​ຄື​ຂອງ​ຂວັນ​ທີ່​ພຣະ​ຜູ້​ເປັນ​ເຈົ້າ​ໂຜດ​ປະ​ທານ” (ເພງ​ສັນ​ລະ​ເສີນ 127:3). ພໍ່​ແມ່​ມີ​ໜ້າ​ທີ່​ອັນ​ສັກ​ສິດ​ທີ່​ຈະ​ລ້ຽງ​ດູ​ລູກໆ​ຂອງ​ຕົນ​ດ້ວຍ​ຄວາມ​ຮັກ
  ແລະ ດ້ວຍ​ຄວາມ​ຊອບ​ທຳ, ທີ່​ຈະ​ຈັດ​ຫາ​ສິ່ງ​ຈຳ​ເປັນ​ທາງ​ກາຍ ແລະ ທາງ​ວິນ​ຍານ​ໃຫ້​ເຂົາ, ແລະ ທີ່​ຈະ​ສິດ​ສອນ​ເຂົາ​ໃຫ້​ຮັກ
  ແລະ ຮັບ​ໃຊ້​ຊຶ່ງ​ກັນ​ແລະ​ກັນ, ເຊື່ອ​ຟັງ​ພຣະ​ບັນ​ຍັດ​ຂອງ​ພຣະ​ເຈົ້າ, ແລະ ເປັນ​ພົນ​ລະ​ເມືອງ​ທີ່​ເຊື່ອ​ຟັງ​ກົດ​ໝາຍ​ໃນ​ບ່ອນ​ທີ່​ເຂົາ​ອາ​ໄສ​ຢູ່.
  ສາ​ມີ ແລະ ພັນ​ລະ​ຍາ—ແມ່ ແລະ ພໍ່—ຈະ​ຕ້ອງ​ຮັບ​ຜິດ​ຊອບ​ຢູ່​ຕໍ່​ພຣະ​ພັກ​ຂອງ​ພຣະ​ເຈົ້າ ເນື່ອງ​ຈາກ​ການ​ບໍ່​ປະ​ຕິ​ບັດ​ໜ້າ​ທີ່​ຮັບ​ຜິດ​ຊອບ​ເຫລົ່າ​ນີ້​ຂອງ​ຕົນ.
- ຄອບ​ຄົວ​ແມ່ນ​ຖືກ​ແຕ່ງ​ຕັ້ງ​ຂຶ້ນ​ໂດຍ​ພຣະ​ເຈົ້າ. ການ​ແຕ່ງ​ງານ​ລະ​ຫວ່າງ​ຊາຍ ແລະ ຍິງ ເປັນ​ສິ່ງຈຳ​ເປັນ​ຕໍ່​ແຜນ​ນິ​ລັນ​ດອນ​ຂອງ​ພຣະ​ອົງ.
  ເດັກ​ນ້ອຍ​ມີ​ສິດ​ທີ່​ຈະ​ມາ​ເກີດ​ນຳ​ພໍ່​ແມ່​ທີ່​ແຕ່ງ​ງານ​ກັນ, ແລະ ທີ່​ຈະ​ໄດ້​ຮັບ​ການ​ລ້ຽງ​ດູ​ຈາກ​ພໍ່​ແມ່​ຜູ້​ນັບ​ຖື​ຄຳ​ໝັ້ນ​ສັນ​ຍາ​ທີ່​ໄດ້​ກະ​ທຳ​ໄວ້​ຕໍ່​ກັນ
  ແລະ ຊື່​ສັດ​ບໍ​ລິ​ສຸດ​ຕໍ່​ກັນ. ຄອບ​ຄົວ​ຈະ​ມີ​ຄວາມ​ສຸກ​ກໍ​ຕໍ່​ເມື່ອ​ເຂົາ​ເຈົ້າ​ດຳ​ເນີນ​ຊີ​ວິດ​ຕາມ​ຄຳ​ສອນ​ຂອງ​ອົງ​ພຣະ​ເຢ​ຊູ​ຄຣິດ​ເຈົ້າ.
  ການ​ແຕ່ງ​ງານ ແລະ ຄອບ​ຄົວ​ຈະ​ມີ​ຄວາມ​ສຳ​ເລັດ​ໄດ້​ໃນ​ຊີ​ວິດ​ກໍ​ຕໍ່​ເມື່ອ​ເຂົາ​ເຈົ້າ​ໝັ້ນ​ຄົງ​ຢູ່​ໃນ​ຫລັກ​ທຳ​ແຫ່ງ​ສັດ​ທາ,
  ການ​ອະ​ທິ​ຖານ, ການ​ກັບ​ໃຈ, ການ​ໃຫ້​ອະ​ໄພ, ການ​ນັບ​ຖື, ຄວາມ​ຮັກ, ຄວາມ​ເຫັນ​ອົກ​ເຫັນ​ໃຈ, ວຽກ​ງານ, ແລະ
  ກິດ​ຈະ​ກຳ​ທີ່​ໃຫ້​ການ​ພັກ​ຜ່ອນ​ຢ່ອນ​ອາ​ລົມ​ທີ່​ເປັນ​ປະ​ໂຫຍດ​ຕ່າງໆ. ໃນ​ແຜນ​ຂອງ​ພຣະ​ເຈົ້າ​ນັ້ນ, ພໍ່​ຈະ​ເປັນ​ຜູ້​ນຳ​ພາ​ຄອບ​ຄົວ​ຂອງ​ຕົນ​ດ້ວຍ​ຄວາມ​ຮັກ
  ແລະ ດ້ວຍ​ຄວາມ​ຊອບ​ທຳ ແລະ ມີ​ໜ້າ​ທີ່​ຮັບ​ຜິດ​ຊອບ​ທີ່​ຈະ​ຈັດ​ຫາ​ສິ່ງ​ທີ່​ຈຳ​ເປັນ​ໃນ​ຊີ​ວິດ ແລະ ປົກ​ປັກ​ຮັກ​ສາ​ຄອບ​ຄົວ​ຂອງ​ຕົນ.
  ຜູ້​ເປັນ​ແມ່​ມີ​ໜ້າ​ທີ່​ຮັບ​ຜິດ​ຊອບ​ຕົ້ນ​ຕໍ​ໃນ​ການ​ລ້ຽງ​ດູ​ລູກ​ເຕົ້າ​ຂອງ​ຕົນ. ໃນ​ໜ້າ​ທີ່​ຮັບ​ຜິດ​ຊອບ​ອັນ​ສັກ​ສິດ​ເຫລົ່າ​ນີ້,
  ພໍ່​ແມ່​ຕ້ອງ​ໄດ້​ຊ່ວຍ​ກັນ​ແລະ​ກັນ ແລະ ເປັນ​ຫຸ້ນ​ສ່ວນ​ທີ່​ເທົ່າ​ທຽມ​ກັນ. ການ​ພິ​ການ, ການ​ຕາຍ, ຫລື ໃນ​ກໍ​ລະ​ນີ​ອື່ນໆ
  ອາດ​ເຮັດ​ໃຫ້​ໜ້າ​ທີ່​ຂອງ​ພໍ່ ຫລື ແມ່​ປ່ຽນ​ໄປ. ຍາດ​ຕິ​ພີ່​ນ້ອງ​ຄວນ​ຊ່ວຍ​ເຫລືອ​ກັນ​ໃນ​ຍາມ​ຂັດ​ສົນ.
- ພວກ​ເຮົາ​ຂໍ​ເຕືອນ​ວ່າ ຜູ້​ໃດ​ທີ່​ລະ​ເມີດ​ພັນ​ທະ​ສັນ​ຍາ​ແຫ່ງ​ກົດ​ພົມ​ມະ​ຈັນ, ຜູ້​ໃດ​ທີ່​ທຳ​ຮ້າຍ​ຄູ່​ແຕ່ງ​ງານ
  ຫລື ລູກໆ, ຫລື ຜູ້​ໃດ​ທີ່​ບໍ່​ເຮັດ​ໜ້າ​ທີ່​ຂອງ​ຄອບ​ຄົວ ຈະ​ຕ້ອງ​ຮັບ​ຜິດ​ຊອບ​ຢູ່​ຕໍ່​ພຣະ​ພັກ​ຂອງ​ພຣະ​ເຈົ້າ​ໃນ​ມື້​ໜຶ່ງ.
  ຍິ່ງ​ໄປ​ກວ່າ​ນັ້ນ, ພວກ​ເຮົາ​ຂໍ​ເຕືອນ​ອີກ​ວ່າ ການ​ທຳ​ລາຍ​ຄອບ​ຄົວ​ຈະ​ນຳ​ໄພ​ວິ​ບັດ​ມາ​ສູ່​ຕົນ​ເອງ, ມາ​ສູ່​ຊຸມ​ຊົນ,
  ແລະ ມາ​ສູ່​ປະ​ເທດ​ຊາດ ດັ່ງ​ທີ່​ສາດ​ສະ​ດາ​ທັງ​ຫລາຍ​ໃນ​ສະ​ໄໝ​ບູ​ຮານ ແລະ ໃນ​ສະ​ໄໝ​ປະ​ຈຸ​ບັນ​ກ່າວ​ໄວ້.
- ພວກ​ເຮົາ​ຂໍ​ຮຽກ​ຮ້ອງ​ໃຫ້​ພົນ​ລະ​ເມືອງ ແລະ ເຈົ້າ​ໜ້າ​ທີ່​ລັດ​ຖະ​ບານ​ໃນ​ທຸກ​ທົ່ວ​ໜ້າ ຈົ່ງ​ຊ່ວຍ​ກັນ​ຊຸກ​ຍູ້​ຜູ້​ຄົນ​ໃຫ້​ເຮັດ​ຕາມ​ນີ້
  ເພື່ອ​ຈະ​ໄດ້​ຮັກ​ສາ ແລະ ເສີມ​ຄວາມ​ເຂັ້ມ​ແຂງ​ໃຫ້​ແກ່​ຄອບ​ຄົວ ໃນ​ຖາ​ນະ​ໜ່ວຍ​ທີ່​ສຳ​ຄັນ​ຍິ່ງ​ຂອງ​ສັງ​ຄົມ.
