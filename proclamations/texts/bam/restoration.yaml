retrieved: '2026-11-02'
title: Yesu Krisita ka Kibaru Duman Dafalen ka Seginni
subtitle: San Kɛmɛ fila Weleweledali diɲɛ ye
author: Yesu Krisita ka Don Labanw Senumanw ka Egilisi ka Ɲɛmɔgɔya Fɔlɔ ani Ciden Tannifilaw ka Lajɛ
note: Ni weleweledali kalan na Ɲɛmɔgɔ Russell M. Nelson fɛ a ka kuma hukumu kɔnɔ san yɛlɛma Forobaɲɔgɔnyeba
  siɲɛ 190 sen fɛ, awirili kalo tile 5, san 2020, Salt Lake City, Utah.
paragraphs:
- An b’a fɔ ni boya ye ko Ala bɛ A denw kanu siya bɛɛ cɛ la diɲɛ kɔnɔ. Fa Ala ye Alamaya bangeli di an
  ma, ɲɛnamaya min tɛ se ka suma ni fɛn wɛrɛ ye, ani A Denkɛ kanulen Yesu Krisita ka jurumu kafari saraka
  dan tɛ min na. Ni Fa ka sebaaya barika ye, Yesu kunu na ani A ye se sɔrɔ saya kan. Ale de ye an Kisibaa
  ye, an ka Misali ani an Kunmabɔbaa.
- A san kɛmɛ fila ye nin ye, san 1820, samiyɛ sɔgɔma cɛɲi dɔ la, kamalennin Joseph Smith, min tun b’a
  ɲini k’a dɔn a ka kan ka don egilisi min kɔnɔ, o taara kungo kɔnɔ ka delili kɛ a ka so kɛrɛfɛ New York
  woroduguyanfan fɛ. Ɲininkaliw tun b’a fɛ ka ɲɛsin a ni kisili ma ani a tun dalen b’a la ko Ala bɛna
  a ɲɛminɛ.
- Ni ma jigi ye, an bɛ a fɔ ko a ka deli jaabi la, Fa Ala ani A Denkɛ, Yesu Krisita, ye u yɛrɛ jira Joseph
  la ani u ye “fɛn bɛɛ sigi ko kura” dayɛlɛli kɛ (Kɛwalew 3:21) I na fɔ a tun lase la Bibile kɔnɔ. O yeli
  kɔnɔ, a y’a dɔn ko Cidenw fɔlɔw salen kɔfɛ, Krisita ka Layidu kura Egilisi tununa ka bɔ dugukolo kan.
  Joseph tun bɛna kɛ sababu ye seginni na.
- An bɛ a fɔ ko Fa ani Denkɛ ka ɲɛminɛli kɔnɔ, sankolo cilasela nana ka Joseph kalan ani ka Yesu Krisita
  ka Egilisi sigi ko kura. Yuhana batiselikɛla kununlen ye batiseli yamaruya lasegin ka su ji la walasa
  ka jurumuw yafa. Ciden Tannifilaw fɔlɔ cɛma saba, Piɛrɛ, Yakuba, ani Yuhana ye Cidenya ani pɛrɛtirizi
  yamaruya kilew lasegin. Dɔ wɛrɛw fana tun bɛ na, Eli bɛ o la, o min ye sebaaya lasegin min bɛ Denbaya
  lajɛn badaa badaa jɛɲɔgɔnya kɔnɔ min bɛ tɛmɛ saya kan.
- 'An bɛ a seereya ka taa fɛ ko Joseph Smith tun ye dili sɔrɔ ani Ala ka sebaaya ka se ka ko kɛlen kɔrɔ
  dɔ bayɛlɛma: Mormɔn ka Gafe—Seereya wɛrɛ Yesu Krisita kan. Nin sɛbɛn senuma ɲɛw la ye, bɛ ɲɛfɔli kɛ
  ka ta Yesu Krisita yɛrɛ ka baara la dugu kolo tilancɛ tilebiyanfan mɔgɔw cɛ la sɔnni A ka kununli kɔfɛ.
  A bɛ ɲɛnamaya kun kalan kɛ ani ka ɲɛfɔli kɛ Krisita ka kalanw la, o min bɛ ni kun caman cɛ la. I n’a
  fɔ Bibile ka sɛbɛnni senuman taamaɲɔgɔn, Mormɔn ka Gafe bɛ a seereya ko hadamadenw bɛɛ ye Sankolola
  Fa kanulen dɔ denkɛw ani denmusow ye, ko fɛrɛ do bɛ A fɛ an ka ɲɛnamaya kosɔn, ani ko A Denkɛ, Yesu
  Krisita, bɛ kuma fana bi i na fɔ donw kɔrɔlen.'
- An bɛ a fɔ ko Yesu Krisita ka Don Labanw Senumanw ka Egilisi, min labɛnna awirili kalo tile 6, san 1830
  ye Krisita ka Layidu kura Egilisi laseginlen ye. Nin Egilisi jɔlɛn don ɲɛnamaya lakika ani A ka seleke
  kabakuru nafaman kan, Yesu Krisita, ani A ka jurumu kafari banbali la ani A ka kununli. Yesu Krisita
  ye Cidenw wele kura ani A ye pɛrɛtirizi ka yamaruya di u ma. A bɛ an bɛɛ wele ka ta Ale yɔrɔ ani A ka
  Egilisi la, ka Hakili Senu sɔrɔ, kisili walesenumanw, ani ka nisɔndiya baabali sɔrɔ.
- San kɛmɛ fila tɛmɛ na sisan ka bi nin o Seginni bilala sen kan Fa Ala fɛ ani A Denkɛ kanulen, Yesu Krisita.
  Mɔgɔw miliyɔn caman diɲɛ kɔnɔ, ye ni dɔnniya sɔrɔ ka bɔ nin kirayakumaw kow fɛ.
- An b’a fɔ ni nisɔndiya ye ko Seginni min tun layidu ta la bɛ taa ɲɛ ni jirali ye ka ta fɛ. Dugukolo
  tɛ na kɛ nin cogoya kelen ye tugun, sabu la Ala na “fɛnw bɛɛ lajɛ ka kɛ kelen ye Krisita la” (Efesekaw
  1:10).
- Ni bonyaba ni waleɲumandɔn ye, anw minnu ye A ka Cidenw ye, anw b’a ɲini bɛɛ fɛ u k’a don—i n’a fɔ anw
  b’a dɔn cogo min na—ko sankolo dayɛlɛlen don. Anw bɛ a Fɔ ko Ala bɛ A sago jira A denkɛw ani A denmusow
  kanulenw kosɔn. An bɛ a seereya ko min nun bɛ Seginni ciw kalan ni deli ye ani ka baara kɛ ni dannaya
  ye olu bɛ na duba ka se ka u yɛrɛw ka seereya sɔrɔ ani a ka Alaya la ani a ka diɲɛ dila kun an Matigi
  ani Kisibaa, Yesu Krisita, ka Nali ko Filanan min tun layidu ta la.
