slug: restoration
language: quh
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=quh
retrieved: '2026-11-02'
title: Kutirichinqa tukuy juntʼayta Jesucristoq evangelionmanta
subtitle: Juk jatun willay kay pachapaq iskay waranqa wata juntʼakusaqtin
author: Ñawpaq kaq Kuraq Kamachiqkuna, Chunka iskayniyuq Apostolesmanta qutu ima, Jesucristoq Iglesianmanta
  allin kawsaqkunapaq qhipa qhipa pʼunchaykunapi
note: Russell M. Nelson kuraq kamachiq iglesiamanta ñawirirqa kay jatun rakʼiynintajina khuyapayanapaq
  jatun qutunpi pachak jisqʼun chunka yupana watapi Mayqinchus apakurqa phichqa ariwaki killapi, iskay
  waranqa iskay chunka watapi Salt Lake City, Utah, EE. UU.
paragraphs:
- Willayku qhallallirichispa Diospaq wawasninta munakusqanta tukuy suyu pachapi. Tata Dios quwanchik sumaq
  paqariyta, mana ni imaman kawsayta rikchʼakuqta, munasqa wawan Jesucristo mana tukukuyniyuq qhispichiyninta,
  ñakʼariyninta ima. Tataq atiyninrayku, Jesus watiqmanta kawsarimurqa, atipaspa wañuyta. Pay Salvadorninchik,
  qhatinanchikpaq, qhispichinawanchikpaq ima.
- Iskay pachaq wataña juk may kʼacha paqarin pawqarpara killapi waranqa pusaq pachak iskay chunka watamanta,
  waynuchu Jose Smith yachayta munaspa, ima iglesiamanchus kʼaskananpaq. sachʼa sachaʼaman Tata Diosman
  mañakuq rirqa, wasinpaq qayllanpi chincha pacha Nueva York suyupi Estados Unidosmanta. Paypata tapukuykunasnin
  kapurqa salvacionmanta almanpaq chanta Diospi pusaykachananta atinikurqa.
- Llampʼu sunquwan willayku Tata Dios mañakuyninta kutichisqanta, Tata Dios, Jesuctristo churinwan ima
  rikhurimurqanku Joseman, chaywan Dios watiqmanta tukuy imata musuqyachinankama (Hechos 3:21). Imaynatachus
  bibliapi predikakurqa. Chay rikhusqanpi yacharqa Jose ñawpa apóstoles wañusqankumanta pacha, Cristoq
  iglesian musuq testamentomanta chinkapurqa kay jallpʼamanta, paypaq ruwasqanta kutirichimunanpaq kanan
  karqa.
- Ari nispa kayku, Tata, Churi ima kamachiyninwan jamurqanku janaq pachamanta chaskis, Joseta yachachinankupaq,
  ajinamanta Jesucristoq iglesianta watiqmanta rikhurichinapaq. Juan Bautista watiqmanta kawsarisqajina,
  kutirichimun atiyta bautisanapaq pʼultispa juchasta pampachanapaq. Kimsantin Pedro Santiago, Juan ima,
  chunka iskayniyuq ñawpa apostolesmanta, kutirichimurqanku apostoladuta, kichaykunastawan sacerdocioq
  atiyninmanta. chantapis jamurqanku waqkuna, paykuna ukhupi profeta Elias, pichus kutirichimurqa atiyta
  yawarmasista tantanapaq wiñaypaq wiñay kawsaypi apanakunankupaq wañuymanta astawan jaqayman.
- 'Chantapis quyku kawsayniykumanta willayninta maypichus Jose Smithman qurqanku Diosmanta atiyta chanta
  yachayta ima, tikrananpaq juk ñawpa qillqayta: Mormonpaq pʼanqan, waq willay Jesucristomanta raphiykunasninpi
  kay llimphu qillqaypi tarikun qillqasqa Jesucristoq ruwaykunasnin, watiqmanta kawsarimuktin jatun kuntisuyupi
  runaq chawpinninkupi. Kay pʼanqa yachachin imapaqchus kawsasqanchikta yachachispa, sutʼinchantaq Cristoq
  yachachiykunasninta, maypichus allin kan kayta ruwanapaq pʼanqajina bibliawan khuska mormonpaq pʼanqan
  willan tukuy runakuna kasqankuta qhari wawas chanta warmi wawas janaq pacha Tata munakuyniyuq kasqanta.
  Paypata kapun juk Diospaq wakichiynin kawsayninchikpaq chantapis Churin Jesucristo parlawanchiq kunan
  pacha imaynatachus ruwakurqa ñawpaq pʼunchaykunapi.'
- Willayku Jesucristoq Iglesian allin kawsaqkunapaq qhipa qhipa pʼunchaykunapi wakichisqa suqta p´unchay
  ariwaki killapi waranqa pusaq pachaq kimsa chunka watamanta, Cristoq kutirichisqa iglesian kasqanta,
  Musuq testamentomanta pacha. Kay iglesia ruwakun Jesucristoq llimpu kawsayninta rikhuspa, kantaq kamachiq
  rumi kʼuchujina mana tukukuyniyuq expiacionninpi, chanta watiqmanta kawsarimusqampi ima. Jesucristo
  watiqmanta apostolesta waqyan quntaq sacerdocioq atiyninta. Paytaq jaywawanchis tukuyta Payman chanta
  Iglesianmanwan jamunapaq. espiritu santuta japʼinapaq qhispichikunapaq llimphu ruwaykunasta chanta wiñay
  kusiyta japʼinapaq.
- Iskay pachaq wataña Tata Dios Jesucristoq munasqa Wawan qallariyta qurqanku kay kutirichiyta. Junukuna
  runakuna tukuynin mundupi ari ninku kaykunasta riqsispa, mayqinkunachus nikurqa pasananta.
- Kusikuywan willayku Kutirichisqa juntʼaywan ñawpaqman risqanta yanninta sutʼinchaspa. Kay pacha manaña
  ni jaykʼaq kikin kanqachu Dios kay pachapi kaqkunatapis jukllaman tantanqa, chanta Cristoq kamachiyninman
  churanqa (Efesios 1:10).
- Kʼumuykuywan chanta munakuywan chiqan apostoles kaspa waqyayku tukuyta nuqayku imaynatachus yachasqaykutajina-Janaqpachakuna
  kicharisqas kasqanta. Sutʼinchaykutaq imaynatachus Dios munanyninta riqsichisqanta, munasqas qhari chanta
  warmi wawasninman. Willaykutaq piqkunachus yachayta munaqkuna mañakuspa espirituwan chay willay Kutirichisqamanta
  chanta ruwaspa iñiywan yupaychasqas kanqanku japʼinankupaq kawsay willayninkuta llimphu chanta chayanankupaq
  chayman. Wakichispa pachata iskay kaq kutimuyninpaq nisqanmanjina, ñuqanchiqpata Señorninchik chanta
  qhispichiyninchik Jesucristo.
