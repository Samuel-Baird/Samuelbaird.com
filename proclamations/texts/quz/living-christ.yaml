title: Kausaq Cristo
subtitle: Apostolkunaq Sutʼinchaynin
author: Qhepa Pʼunchaykunapi Chanin Runakunaq Jesucristoq Iglesian
paragraphs:
- Iskay waranqa wata Jesucristoq paqarisqanta yuyarispa, sutʼinchaykuta qoyku, mana pantay cheqaq kausayninmanta
  chʼuya mana tukukuq ñakʼariyninmantawan. Manan pipas ñanta qhawachiranchu pay hina, ñaupa kausaqkunapaq
  ni chayraq kay pachapi kausaqkunapaqpas.
- Paymi Ñaupa Testamentopi hatun Jehová karan, Mosoq Testamentopitaq Mesías. Taytanpa nisqanta pachata
  kamaran. Imaymanakunapas paipa ruwasqanmi karan, mana pauwanqa manan imapas ruwasqachu kanman karan
  (Juan 1:3). Mana huchayuq kaspapas, chaninta huntʼanampaq ununchakuran. Pami allinkunata ruwaspa puriran
  (Hechos 10:38) chhaynapas cheqñisqa karan. Evangelionmi apamuran thaq kayta, allin ruwayta. Paymi llapanta
  waqhariran ruwasqanta qatinankupaq. Palestina ñankunata puriran, onqoqkunata qhaliyachispa, ñausakunata
  qhawarichispa, wañusqakunata hatarichispa ima. Wiñaypaq cheqaqkunata yachachiran, manaraq kay pachaman
  hamuspa kausayninchismanta, imapaq kay pachaman hamusqanchismanta, Diospa churinkuna ususinkuna hamuq
  kausaypi atipayninkunamantapas.
- Ñakʼarisqanta yuyarinanchispaq Santa Cenata saqewaranchis. Llullakuykunawan wesqʼasqa tumpayusqa karan,
  runakunata thaknichinankupaq huchasapata hina qhawachiranku, hinataq Calvario cruspi wañunqa nispa niranku.
  Payqa kausayninta qoran llapan runakunaq huchankunata pay patapi apanampaq. Chay hatun qoyta haywariran
  llapan pachapi tiyaqkunapaq.
- Yupaychaywan sutʼinchayku kay pacahpi kaqkunapaq, sumaq kausayninqa manan Belenpichu qallarirar nitaq
  Calvariopichu tukukuran. Paymi karay Taytaq phiwi Churin, aychapi sapan Churi, teqsi muyuntimpi huchakuna
  kacharichiq.
- Aya sankhamanta hatariran puñuqkunamanta ñaupaq kaq kanampaq (1 Corintios 15:20). Kausareq Wiraqocha
  hina, kay pachapi munakusqankunawan puriran. Ñaupa Americapipas huq kaq Owijankunatapas (Juan 10:16)
  watukuran. Kunan pachakunapi, Pay, Taytanpiwan, José Smith waynaman rikhuriranku ancha suyasqa Diospa
  llapan ruwayninkuna hutʼasqa kanan qallarichinankupaq (Efesios 1:10).
- 'Kausaq Cristomanta, Profeta José qheqaran: “Ñawinkuna yauraq nina hina karan; umanpi chuqchankuna yuraq
  chʼuya ritʼI hina karan; uyanmi kʼancharan intiq llipʼipin hina; rimasqanmi karan askha unuq qaparqachasqan
  hina, arí, Jehova hinata rimarimuran:'
- “Ñaupaq kaqmi kani qhepa kaqmi kani; kausaqmi kani, wañuchisqan karani; Taytaq ñaupanpi abogadoykichismi
  kani” (Doctrina Conveniopiwan 110:3–4).
- 'Paymanta, Profetaqa nillarantaq: “Kunanqa paymanta askha sutʼinchaykuna nisqanku qhepata, kaymi sutʼinchay,
  llipinmanta qhepa, kaq ñoqayku paymanta qoyku: ¡Kausanmi!'
- “Diospa pañampi rikusqayku rayku; sutʼinchaytataq uyariyku sapan churi kasqanmanta;
- “Pay rayku, paywan, paymanta pachakuna kanku, karanku kamasqa, churikunataq ususikunataq Diospaq churiyasqa
  kanku” (Doctrina Conveniopiwan 76:22–24).
- Chanin rimaywan niyku Sacerdocio Iglesianpiwan allpa patapi huqmanta hatarichisqa kasqanta, Apostolkua,
  profetakuna patapi hatarichisqa, Jesucristo kikintaqmi taqyachiq rumi (Efesios 2:20).
- Sutʼinchaykun ima pʼunchaypas kay pachaman kutimunanmanta, hinaspa Jehováq kʼanchaynin rikukunqa, llipin
  aychataq kuska rikunqaku (Isaías 40:5). Paymi kamachinqa Rey de reyes hina, Wiraqochakunaq Wirachochanhina
  reinanqa, llapan moqotaq qhonqorikunqa, lliu qallutaq payta yupaychaspa rimanqa. Llapanchismi payman
  risunchis ima ruwasqanchismanta, ima sonqonchispa munasqanmanta tapuwananchispaq.
- Apostolninkuna ordenasqa kaspa, sutʼinchayku, Jesúsmi kausaq Cristo, wiñaypaq kausaq, Diospa Churin.
  Paymi hatun Rey Emanuel, kunan Taytampa pañampi kashan. Paymi teqsi muyupaq kʼanchay, kausay, suyakuy.
  Ñanninmi pusariwanchis kay kay kausaypi qʼochorikuyman, hamuq kausaypitaq wiñaypaq kausayman. Mana pantaq
  Churin qowasqankumanta, Diosta añay niyku.
