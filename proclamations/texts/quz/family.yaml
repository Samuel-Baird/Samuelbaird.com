title: Wasi Ayllu
subtitle: Teqsi Muyuntimpaq huk Rimarimuy
author: Qhepa Pʼunchaykunapi Chanin Runakunaq Jesucristoq Iglesianpi Ñaupaq kaq Umalleqkuna, Chunka Iskayniyuq
  Apostolkunapiwan
note: Gordon B. Hinkley Umalleqmi kay rimariyta ñawincharan, Sociedad de Socorro huñunakuypi rimaspa,
  iskay chunka kinsayuq pʼunchay setiembre killapi waranqa esqon pachaq esqon chunka pisqayuq watapi,
  Salt Lake Citypi Utahpi, EE.UU.
paragraphs:
- Ñoqayku, Qhepa Pʼunchaykunapi Chanin Runakunaq Jesucristoq Iglesianpi Ñaupaq kaq Umalleqkuna, Chunka
  Iskayniyuq Apostolkunapiwan, yupaychaywan rimariyku qhari warmiwan kasarakunankuqa Diospa Kamachisqanmi,
  wasi ayllutaqmi kamaqpa Planninpa chaupinpi kashan wiñay kausayman wawankuna chayanankupaq.
- Llapin runakuna, qharikunapas warmikunapas Diosman rikchʼaympi kamasqa kanku. Sapankanku hanaq pachapi
  tayta mamankuq espiritupi churiasqa qharipas warmipas ancha munasqa kanku, hinataq sapankanku tayta
  mamanku hina kanku. Qhari kay otaq warmi kay ñaupaq kausaypi, kunan kausaypi, khepa kausaypipas kaqllapunin
  kanqa.
- Ñaupaq kausaypi espiritupi Diospa churinkuna ususinkuna hina payta wiñaypaq taytata hina reqsiranku,
  yupaycharanku, plannintataq chaskiranku wawankuna kurkuyoq kanakupaq kay pachapi ruwasqankuwan llumpʼa
  kayman chayanankupaq, taytanchiswan wiñaypaq kausayta tarinankupaq. Qʼochurikuypaq plannin rayku wasi
  ayllukunapi kaqkuna wañusqanku qhepatapas kuskalla kankuman. Willka Templokunapi Ordenanzakuna Conveniokuna
  ruwasqanku rayku runakuna Diospa ñaupanman kutinku, wasi ayllukunapas wiñaypaq huñusqa kanampaq.
- Adanman Evamanwan Diosqa ñaupa kaq kamachita qoran, qhari warmi casarasqa kaspa tayta mama atipayniyuq
  kasqankumanta. Diospa wawankunaman miranankupaq allpa huntʼachinankupaq kamachisqanqa kikillanpunin
  kunankamapas kashan. Diospa nisqanta rimayku, ichaqa miranankupaqqa warmi qhari casarasqapunin kananku.
- Dios kikinmi nin imayna kay pachaman kausay apamunata. Kausayqa ancha willkasqa, Diospa planninpipas
  askha hatunmi.
- Kasarasqa qhari warmipas paykuna pura khuyanakunanku qhawarinakunanku, hinallataq wawankunatapas. Wawakunaqa
  Jehovapa herencianmi (Salmo 127:3). Tayta mamaqa willka ruwayniyuqmi kanku, khuyakuywan chaninkaywan
  wawakunata uywananku, kurkunkutapas nunankutapas kallpachananku, paykuna pura munanakuyta yanapanakuyta
  yachachinanku, Diospa kamachinkunata gobiernoq leyninkunatapas maypi tiyaspapas kasukuyta yachachinanku.
  Tayta mamaqa Diospa ñaupanpi kaykuna ruwakunanmanta responsable kanku.
- Wasi aylluqa Diospa kamachisqanmi. Diospa wiñaypaq planninpiqa kasarakuyqa kanampunin. Wawakunaqa kasarasqa
  ukhupi paqarinanku, chanin llumpʼa tayta mamakunaq uywasqa kanankupaq. Wasi ayllupiqa qʼochorikuyta
  tarikunman Wiraqocha Jesucristoq yachachisqanman hina kausaqtinkun. Kasarakuypi wasi ayllukunapipas
  sichus iñiyuq kanku, mañakunku, huchankunamanta wananku, pampachanku, yupaychanku, munanakunku, khuyapayanakunku,
  llankʼaq kanku allin ruwayta akllanku, chay wasi aylluqa tʼikarinqapunin. Taytanchispa kamachisqan rayku,
  qhariqa wasi aylluta munakuywan, chaninkaywan umallinan, imaymanakunatapas kausanankupaq qonan, ima
  mana allinkunamantapas waqaychanan. Warmitaq wawakunata uywanan. Kay willka ruwaykunapiqa tayta mamakuna
  kaq hinalla yanapanakunanku. Ima sasachaykunapipas otaq wañuypipas sapanka maskananku imayna allchayta.
  Huk wasi ayllipi kaqkunapas yanapayta atinkumanmi.
- Llumpʼa kay Convenio pʼakiqkunata warmikunatapas otaq qharikunatapas, wawankunatapas llakichinku chayqa
  otaq mana ruwayninkunata huntʼankuchu chayqa, huq pʼunchaymi Diospa ñaupanpi kankichis nispa niyku.
  Hinallataq niyku, wasi aylli chʼeqerichiyqa, runakunapaq, wasi ayllukunapaq, suyukunapaq, ñakʼariykunatan
  apamunqa profetakunaq nisqanman hina.
- Teqsi muyuntimpi chanin runakunata, gobiernopi runakunata waqharimuyku imakunatapas ruwanankupaq wasi
  ayllukunata kallpachanankupaq, wasi ayllukunata suyukunaq chaupinpi churanankupaq.
