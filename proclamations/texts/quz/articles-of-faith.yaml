title: Iñiy Qhawachiq
subtitle: Qhepa Pʼunchaykunapi Chanin Runakunaq Jesucristoq Iglesianpa
author: ''
verses:
- n: 1
  text: Ñoqayku Dios Wiñaypaq Taytapi, Jesucristo Churinpiwan, Espíritu Santopiwan, iñiyku.
- n: 2
  text: Runakuna manan Adanpa kamachi pʼakisqanmantachu wanachisqa kanqaku aswan paykunaq huchankumanta
    wanachisqa kanankupi iñiyku.
- n: 3
  text: Cristoq expiaciónnin rayku, lliw runakuna Evangelioq kamachiyninkunata ordenanzankunatawan kasukuspa,
    kespichisqa kanankupi iñiyku.
- n: 4
  text: 'Evangelioq ñauqap kaq principiokunapi ordenanzakunapi iñiyku chaykunan kanku: ñaupaq kaq, Wiraqocha
    Jesucristopi Iñiy; iskay kaq, wanakuy; kinsa kaq, Huchakuna pampachanapaq unu hukhuman chinkayuspa
    ununchakuy; tawa kaq, Uma pataman maki churay Espíritu Santoq donninta haywanapaq.'
- n: 5
  text: Runakuna Diospa waqhasqan kananpi iñiyku, profeciawan, maki churaywan, atipayniyuq runakunamanta,
    Evangelio reqsichinankupaq, ordenanzakunata ruwanankupaqwan.
- n: 6
  text: Ñaupa Iglesia hina, kikin organización kasqanpi iñiyku; chaymi apostolkuna, profetakuna, maestrokuna,
    evangelistakuna ima.
- n: 7
  text: Simikuna rimariypi, profeciapi, revelacionpi, visionkunapi, hampiykunapi, simikuna tʼikraypi,
    iñiyku.
- n: 8
  text: Allin tʼikrasqa Bibliaq Diospa rimariynin kasqanpi iñiyku; hinallataqmi Mormon Tapara Diospa rimariynin
    kasqanpi iñiyku.
- n: 9
  text: Diospa llapan ña revelasqampi, kunan pacha revelasqanpipas iñiyku, hinallataq Diospa suyunmanta
    askha hatun revelacionkuna kanampiraq iñiyku.
- n: 10
  text: Cheqaqtapuni Israel llaqta huñunakunampi, Chunka Tribukuna huqmanta hatarinampi iñiyku; Sion (Mosoq
    Jerusalen), América hatun suyupi hatarichisqa kanqa; Kikin Cristo reynanqa pacha patapi, allpataq
    tʼikrasqa kanqa, paraiso kʼanchaytataq chaskinqa.
- n: 11
  text: Sonqoykuq nisqanman hina ancha atipayniyuq Diosta yupaychayta munayku, hinallataqmi runakunatapas
    imaynatapas, maypipas, ima munasqankutapas yupaychachunku nispa niyku.
- n: 12
  text: Reykuna, Presidentekuna, gobernantekuna, magistradokuna nisqanpi iñiyku; kamachikuna kasukuypi,
    yupaychaypi, qʼemiyuypiwan iñiyku.
- n: 13
  text: 'Chanin kaypi, cheqaq rimaypi, llumpʼa kaypi, allin ruwaypi, llapan runakunata allin ruwaypi iñiyku;
    cheqaqtapuni niyku, Pabloq nisqanta qatiyku: llapamta iñiyku, llapanta suyayku; imaymanapi ñakʼariykuña,
    suyaykutaqmi llapan ñakʼariykunapi kaytapas. Sichus chʼuya kay, munaycha kay, allin qhawachikuq, chanin
    hina rikuchikuq kan chayqa, chaytan taripayta munayku.'
signature: José Smith.
