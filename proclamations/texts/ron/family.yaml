title: Familia
subtitle: Proclamație către lume
author: Prima Președinție și Consiliul celor Doisprezece Apostoli ai Bisericii lui Isus Hristos a Sfinților
  din Zilele din Urmă
note: Această proclamație a fost citită de președintele Gordon B. Hinckley ca parte a mesajului său din
  cadrul Adunării generale a Societății de Alinare din 23 septembrie 1995 din orașul Salt Lake, Utah.
paragraphs:
- Noi, Prima Președinție și Consiliul celor Doisprezece Apostoli ai Bisericii lui Isus Hristos a Sfinților
  din Zilele din Urmă, proclamăm, în mod solemn, căsătoria dintre un bărbat și o femeie ca fiind rânduită
  de Dumnezeu, familia fiind în centrul planului Creatorului cu privire la destinul etern al copiilor
  Săi.
- Toate ființele umane – bărbați și femei – sunt create după chipul lui Dumnezeu. Fiecare este un fiu
  iubit sau o fiică iubită de spirit ai unor Părinți Cerești și, prin urmare, fiecare are o natură și
  un destin divine. Genul reprezintă o caracteristică fundamentală pentru scopul și identitatea în viața
  premuritoare, muritoare și eternă a unei persoane.
- În existența premuritoare, fiii și fiicele de spirit L-au cunoscut și L-au preaslăvit pe Dumnezeu ca
  Tatăl lor Etern și au acceptat planul Său prin care copiii Săi puteau obține un trup fizic și dobândi
  experiență pământească pentru a progresa către perfecțiune și, în cele din urmă, pentru a-și împlini
  destinul divin ca moștenitori ai vieții eterne. Planul divin al fericirii face posibil ca relațiile
  de familie să continue și după moarte. Rânduielile și legămintele sacre disponibile în templele sfinte
  dau posibilitatea persoanelor să se întoarcă în prezența lui Dumnezeu și familiilor să fie unite pentru
  eternitate.
- Prima poruncă pe care Dumnezeu a dat-o lui Adam și Evei a fost cu privire la capacitatea lor de a deveni
  părinți ca soț și soție. Noi declarăm că porunca lui Dumnezeu către copiii Săi de a se înmulți și a
  umple pământul rămâne valabilă. Declarăm în continuare că Dumnezeu a poruncit ca sacrele puteri de procreare
  să fie întrebuințate numai între bărbat și femeie, căsătoriți legal ca soț și soție.
- Declarăm că mijlocul prin care este creată viața muritoare este stabilit de Divinitate. Noi afirmăm
  caracterul sacru al vieții și al importanței ei în planul etern al lui Dumnezeu.
- Soțul și soția au responsabilitatea solemnă de a se iubi și îngriji unul de celălalt și de copiii lor.
  „[Copiii] sunt o moștenire de la Domnul” (Psalmii 127:3). Părinții au datoria sacră de a-și crește copiii
  cu dragoste și neprihănire, de a asigura cele necesare pentru nevoile lor fizice și spirituale și de
  a-i învăța să se iubească și să se slujească unul pe altul, să țină poruncile lui Dumnezeu și să fie
  cetățeni care respectă legea oriunde ar trăi. Soții și soțiile – mamele și tații – vor fi făcuți răspunzători
  înaintea lui Dumnezeu de împlinirea acestor obligații.
- Familia este rânduită de Dumnezeu. Căsătoria dintre bărbat și femeie este esențială în planul Său etern.
  Copiii au dreptul de a se naște în cadrul legăturilor de căsătorie și de a fi crescuți de un tată și
  o mamă care-și onorează jurămintele căsătoriei cu toată fidelitatea. Fericirea în viața de familie este
  cel mai probabil obținută când este zidită pe învățăturile Domnului Isus Hristos. Căsătoriile și familiile
  reușite sunt stabilite și menținute pe principiile credinței, rugăciunii, pocăinței, iertării, respectului,
  dragostei, compasiunii, muncii și ale activităților de recreere sănătoase. Planul divin stabilește că
  tații trebuie să prezideze asupra familiei lor cu dragoste și neprihănire și sunt răspunzători de asigurarea
  celor necesare pentru viața și protejarea familiei lor. Mamele sunt, în primul rând, responsabile pentru
  îngrijirea copiilor lor. În aceste responsabilități sacre, tații și mamele sunt obligați să se ajute
  unul pe celălalt ca parteneri egali. Dizabilitatea, moartea sau alte situații pot necesita adaptarea
  rolurilor. Membrii familiei extinse trebuie să ofere ajutor atunci când este nevoie.
- Noi avertizăm că persoanele care încalcă legămintele castității, care supun abuzului soțul/soția ori
  copiii sau care nu își îndeplinesc responsabilitățile față de familie vor da socoteală într-o zi înaintea
  lui Dumnezeu. De asemenea, avertizăm că dezintegrarea familiei va aduce asupra persoanelor, comunităților
  și națiunilor nenorocirile prezise de profeții din vechime și de cei din zilele noastre.
- Facem un apel către cetățenii responsabili și guvernanții de pretutindeni să promoveze acele măsuri
  menite să mențină și să întărească familia ca unitate fundamentală a societății.
