title: Articolele de Credință
subtitle: ale Bisericii lui Isus Hristos a Sfinților din Zilele din Urmă
author: ''
verses:
- n: 1
  text: Noi credem în Dumnezeu, Tatăl Veșnic, și în Fiul Său, Isus Hristos, și în Duhul Sfânt.
- n: 2
  text: Noi credem că oamenii vor fi pedepsiți pentru propriile lor păcate și nu pentru greșeala lui Adam.
- n: 3
  text: Noi credem că, prin ispășirea lui Hristos, toți oamenii pot fi salvați supunându-se legilor și
    rânduielilor Evangheliei.
- n: 4
  text: 'Noi credem că primele principii și rânduieli ale Evangheliei sunt: primul, credința în Domnul
    Isus Hristos; al doilea, pocăința; al treilea, botezul prin scufundare pentru iertarea păcatelor;
    al patrulea, așezarea mâinilor pentru darul Duhului Sfânt.'
- n: 5
  text: Noi credem că un om trebuie să fie chemat de Dumnezeu prin profeție și prin așezarea mâinilor
    de către aceia care dețin autoritatea de a predica Evanghelia și de a administra rânduielile acesteia.
- n: 6
  text: 'Noi credem în aceeași organizare care exista în Biserica din vechime, și anume: apostoli, profeți,
    preoți, învățători, evangheliști și așa mai departe.'
- n: 7
  text: Noi credem în darul de a vorbi în alte limbi, de a profeți, de a avea revelații, de a avea viziuni,
    de a tămădui, de a interpreta limbile și așa mai departe.
- n: 8
  text: Noi credem că Biblia este cuvântul lui Dumnezeu, în măsura în care este tradusă corect; noi credem,
    de asemenea, că și Cartea lui Mormon este cuvântul lui Dumnezeu.
- n: 9
  text: Noi credem în tot ceea ce a revelat Dumnezeu, tot ceea ce revelează El în zilele noastre și credem
    că El va revela încă multe lucruri mărețe și importante referitoare la Împărăția lui Dumnezeu.
- n: 10
  text: Noi credem în adunarea adevărată a lui Israel și în restaurarea celor zece triburi; că Sionul
    (Noul Ierusalim) va fi clădit pe continentul american; că Hristos va domni în persoană pe pământ;
    și că pământul va fi înnoit și va primi gloria sa de paradis.
- n: 11
  text: Noi afirmăm că avem dreptul de a-L preaslăvi pe Dumnezeu Cel Atotputernic, așa cum ne îndeamnă
    propria conștiință, și recunoaștem tuturor oamenilor același drept de a preaslăvi cum doresc, unde
    doresc sau ceea ce doresc.
- n: 12
  text: Noi credem că trebuie să ne supunem regilor, președinților, conducătorilor și magistraților și
    să ne supunem, să onorăm și să susținem legea.
- n: 13
  text: 'Noi credem că trebuie să fim cinstiți, fideli, puri, binevoitori, virtuoși și că trebuie să facem
    bine tuturor oamenilor; într-adevăr, putem spune că urmăm îndemnul lui Pavel: Credem toate lucrurile,
    sperăm toate lucrurile, noi am îndurat multe lucruri și sperăm să putem îndura toate lucrurile. Dacă
    este ceva care este virtuos, vrednic de iubit, care are bună reputație sau este demn de laudă, noi
    căutăm aceste lucruri.'
signature: Joseph Smith.
