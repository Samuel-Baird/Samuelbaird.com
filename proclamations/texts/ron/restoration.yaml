title: Restaurarea plenitudinii Evangheliei lui Isus Hristos
subtitle: Proclamație către lume cu ocazia bicentenarului
author: Prima Președinție și Consiliul celor Doisprezece Apostoli ai Bisericii lui Isus Hristos a Sfinților
  din Zilele din Urmă
note: Această proclamație a fost citită de președintele Russell M. Nelson ca parte a mesajului dânsului
  din cadrul celei de a 190-a Conferințe Generale Bianuale din data de 5 aprilie 2020 din orașul Salt
  Lake, Utah.
paragraphs:
- Noi proclamăm, în mod solemn, că Dumnezeu îi iubește pe copiii Săi din fiecare națiune a lumii. Dumnezeu
  Tatăl ne-a oferit nașterea divină, viața incomparabilă și sacrificiul ispășitor infinit al Preaiubitului
  Său Fiu, Isus Hristos. Prin puterea Tatălui, Isus S-a ridicat din nou și a obținut victoria asupra morții.
  El este Salvatorul nostru, Exemplul nostru și Mântuitorul nostru.
- În urmă cu două sute de ani, într-o frumoasă dimineață de primăvară a anului 1820, tânărul Joseph Smith,
  căutând să știe cărei biserici să se alăture, s-a dus în pădurea din apropierea casei sale din partea
  de nord a statului New York, S.U.A., pentru a se ruga. El avea întrebări despre salvarea sufletului
  său și a avut încredere că Dumnezeu avea să-l îndrume.
- Cu umilință, noi declarăm că, sub formă de răspuns la rugăciunea sa, Dumnezeu Tatăl și Fiul Său, Isus
  Hristos, i S-au arătat lui Joseph și au inaugurat „[așezarea] din nou a tuturor lucrurilor” (Faptele
  apostolilor 3:21), așa cum a fost prezis în Biblie. Prin această viziune, el a aflat că, după moartea
  primilor apostoli, Biserica lui Hristos din vremea Noului Testament n-a mai existat pe pământ. Joseph
  avea să fie instrumentul esențial în aducerea ei înapoi.
- Noi afirmăm că, sub îndrumarea Tatălui și a Fiului, mesageri cerești au venit pentru a-l instrui pe
  Joseph și a reîntemeia Biserica lui Isus Hristos. Ioan Botezătorul înviat a restaurat autoritatea de
  a boteza prin scufundare pentru iertarea păcatelor. Trei dintre primii doisprezece apostoli – Petru,
  Iacov și Ioan – au restaurat apostolatul și cheile autorității preoției. Alții au venit, de asemenea,
  inclusiv Ilie, care a restaurat autoritatea de a uni familiile laolaltă pentru totdeauna în relații
  eterne care transcend moartea.
- 'În continuare, depunem mărturie că lui Joseph Smith i s-au dat darul și puterea lui Dumnezeu de a traduce
  o cronică din vechime – Cartea lui Mormon: un alt testament al lui Isus Hristos. Pagini din acest text
  sacru includ o relatare despre slujirea personală a lui Isus Hristos printre oamenii din emisfera vestică,
  la scurt timp după învierea Sa. Ne învață despre scopul vieții și explică doctrina lui Hristos, care
  este esențială pentru realizarea acestui scop. Fiind o scriptură parteneră a Bibliei, Cartea lui Mormon
  depune mărturie că toate ființele omenești sunt fii și fiice ai unui Tată iubitor din Cer, că El are
  un plan divin pentru viața noastră și că Fiul Său, Isus Hristos, vorbește astăzi la fel ca în zilele
  din vechime.'
- Noi declarăm că Biserica lui Isus Hristos a Sfinților din Zilele din Urmă, organizată în data de 6 aprilie
  1830, este Biserica lui Hristos din vremea Noului Testament restaurată. Această Biserică este ancorată
  în viața perfectă a pietrei sale din capul unghiului, Isus Hristos, și în ispășirea Sa infinită și în
  învierea Sa reală. Isus Hristos a chemat, încă o dată, apostoli și le-a dat autoritatea preoției. El
  ne invită pe toți să venim la El și la Biserica Sa, să-L primim pe Duhul Sfânt, să primim rânduielile
  necesare salvării și să dobândim bucurie trainică.
- Două sute de ani au trecut acum de când această restaurare a fost începută de Dumnezeu Tatăl și de Preaiubitul
  Său Fiu, Isus Hristos. Milioane de oameni din întreaga lume au acceptat cunoașterea despre aceste evenimente
  profețite.
- Declarăm, cu bucurie, că restaurarea promisă avansează prin intermediul revelației continue. Pământul
  nu va mai fi niciodată la fel pe măsură ce Dumnezeu va „uni iarăși într-unul în Hristos, toate lucrurile”
  (Efeseni 1:10).
- Cu pioșenie și recunoștință, noi, în calitate de apostoli ai Săi, îi invităm pe toți să știe – așa cum
  știm și noi – că cerurile sunt deschise. Afirmăm că Dumnezeu Își face cunoscută voia în ceea ce-i privește
  pe preaiubiții Săi fii și preaiubitele Sale fiice. Noi depunem mărturie că cei care studiază, cu ajutorul
  rugăciunii, mesajul restaurării și acționează cu credință vor fi binecuvântați să dobândească propria
  mărturie despre caracterul ei divin și despre scopul ei de a pregăti lumea pentru a Doua Venire promisă
  a Domnului și Salvatorului nostru, Isus Hristos.
