title: Àwọn Nkan Ìgbàgbọ́ ti Ìjọ ti Jésù Krístì ti Àwọn Ènìyàn Mímọ́ Ìgbà Ìkẹhìn
subtitle: ''
author: ''
verses:
- n: 1
  text: A gbàgbọ́ nínú Ọlọ́run, Bàbá Ayérayé, àti nínú Ọmọ Rẹ̀, Jésù Krístì, àti nínú Ẹ̀mí Mímọ́.
- n: 2
  text: A gbàgbọ́ wípé gbogbo ènìyàn yíó jìyà fún ẹ̀ṣẹ̀ ara wọn láìṣe fún ìrékọjá Ádámù.
- n: 3
  text: A gbàgbọ́ wípé nípasẹ̀ ètùtù Krístì, gbogbo ènìyàn lè ní ìgbàlà, nípa ìgbọràn sí àwọn òfin àti
    ìlànà ìhìnrere.
- n: 4
  text: 'A gbàgbọ́ wípé àwọn ìpìnlẹ̀ àti àwọn ìlànà ìhìnrere àkọ́kọ́ ni: Èkíní, Ìgbàgbọ́ nínú Jésù Krístì;
    Èkejì, Ìrònúpìwàdà; Ẹ̀kẹta, Baptísímù nípá ìrìbọmi fún ìwẹ̀nùmọ́ ẹ̀ṣẹ̀; Ẹ̀kẹrin, ìgbọ́wọ́ lé lórí
    fún ẹ̀bùn Ẹ̀mí Mímọ́.'
- n: 5
  text: A gbàgbọ́ wípé ènìyàn gbọ́dọ̀ gba ìpè Ọlọ́run, nípa àsọtẹ́lẹ̀, àti nípa gbígbọ́wọ́ lé lórí nípasẹ
    àwọn tí ó wà nípò àṣẹ, láti ṣe ìwàásù ìhìnrere àti láti kópa nínú àwọn iṣẹ́ ìlànà inú rẹ̀.
- n: 6
  text: A gbàgbọ́ nínú àkójọpọ̀ kannã tí ó wà nínú Ìjọ Àtijọ́, olórúkọ bíi, àwọn àpóstélì, àwọn wòlĩ,
    àwọn olùṣọ́-àgùntàn, àwọn olùkọ́ni, àwọn ẹ̀fángẹ́lístì àti bẹ̃bẹ̃ lọ.
- n: 7
  text: A gbàgbọ́ nínú ẹ̀bùn ìfèdèsòrò, àsotẹ́lẹ̀, ìfihàn, àwọn ìran, ìwòsàn, ìtúmọ̀ èdè àti bẹ̃bẹ̃ lọ.
- n: 8
  text: A gbàgbọ́ wípé Bíbélì jẹ́ ọ̀rọ̀ Ọlọ́run níwọ̀n ìgbà tí a bá ṣe ìtúmọ̀ rẹ̀ ní pípé; A gbàgbọ́ bákannã
    pé Ìwé Ti Mọ́mọ́nì jẹ́ ọ̀rọ̀ Ọlọ́run.
- n: 9
  text: A gbàgbọ́ nínú gbogbo ohun ti Ọlọ́run ti fihàn, gbogbo ohun tí Ó ńṣe ìfihàn rẹ̀ lọ́wọ́lọ́wọ́,
    a sì gbàgbọ́ wípé Ó yì mã ṣe ìfihàn ọ̀pọ̀lọpọ̀ ohun ńlá àti pàtàkì tí ó ní ṣe pẹ̀lú ìjọba Ọlọ́run.
- n: 10
  text: A gbàgbọ́ nínú ìkọ́jọpọ̀ Ísráẹ́lì gãn àti nínú ìmúpadà àwọn Ẹ̀yà Mẹ́wá; pé Síónì (Jerúsálẹ́mù
    titun nì) yíó jẹ́ kíkọ́ lórí orílẹ̀-èdè Amẹ́ríkà; pé Krístì yíó jọba fúnra rẹ̀ lórí ayé; àti pé ayé
    yíó di ìsọdititun yíó sì gba ògo párádísè rẹ̀.
- n: 11
  text: Àá nṣe ìbéèrè ẹ̀tọ́ láti sin Ọlọ́run Atóbijùlọ gẹ́gẹ́ bĩ ìtọ́sọ́nà ẹ̀rí ọkàn wa, a sì gba gbogbo
    ènìyàn láàyè fún irú ẹ̀tọ́ bẹ̃, jẹ́ kí wọ́n jọ́sìn bí, níbi, ohun tí wọ́n lè ṣe.
- n: 12
  text: A gbàgbọ́ nínú títẹríba fún àwọn ọba, àwọn ãrẹ, àwọn alákóso, àwọn onídájọ́, ní gbígbọ́nràn sí,
    bíbọ̀wọ̀ fún àti ṣíṣe ìmúdúró òfin.
- n: 13
  text: A gbàgbọ́ nínú síṣõtọ́, jíjẹ́ olóótọ́, aláì ní ẽrí, onínúrere, oníwà ọ̀wọ̀ àti ní ṣíṣe rere sí
    gbogbo ènìyàn; nítõtọ́, a lè sọ wípe à á ntẹ̀lé ìmọ̀ràn Páùlù — A gba ohun gbogbo gbọ́, a nírètí nínú
    ohun gbogbo, a ti farada ọ̀pọ̀lọpọ̀ ohun, a sì nírètí pé a ó lè farada ohun gbogbo. Tí a bá rí nkankan
    tí ó níwà ọ̀wọ̀, tí ó dára, tàbí tí ó ní ìròyìn rere tàbí yẹ fún ìyìn, à á nwá nkan wọ̀nyí.
signature: Joseph Smith
