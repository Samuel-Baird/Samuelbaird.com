title: Umuryango
subtitle: Itangazo ku Isi
author: Ubuyobozi bwa Mbere n’Inteko y’Intumwa Cumi n’Ebyiri b’Itorero rya Yesu Kristo ry’Abera b’Iminsi
  ya Nyuma
note: Iri tangazo ryasomwe n’Umuyobozi Gordon B. Hinckley nk’igice cy’ubutumwa bwe mu Nama Rusange y’Umuryango
  w’Ihumure yabaye kuwa 23 Nzeri 1995 mu Mujyi wa Salt Lake, Utah.
paragraphs:
- Twebwe, Ubuyobozi bwa Mbere n’Inteko ry’Intumwa Cumi n’Ebyiri b’Itorero rya Yesu Kristo ry’Abera b’Iminsi
  ya Nyuma, dutangaje ku mugaragaro ko ugushyingirwa hagati y’umugabo n’umugore kwimitswe n’Imana kandi
  ko umuryango ari ifatizo ry’umugambi w’Umuremyi ku igeno rihoraho ry’abana Be.
- Abantu bose—abagabo n’abagore—baremwe mu ishusho y’Imana. Buri wese ni roho ikundwa y’umuhungu cyangwa
  y’umukobwa w’ababyeyi bo mu ijuru, kandi, bityo, buri wese afite kamere n’igeno ritagatifu. Igitsina
  ni imiterere y’ingenzi y’ikiranga umuntu ku giti cye n’intego ye bihorabo mbere y’ivuka, mu buzima mu
  isi, no mu buzima buhoraho.
- Mu isi ya mbere y’ivuka, roho z’abahungu n’abakobwa zari zizi kandi ziramya Imana nka Se Uhoraho kandi
  zemeye umugambi Wayo w’uko abana Bayo bahabwa umubiri maze bakagira ubunararibonye ku isi bwo kugenda
  begera ubutungane nuko amaherezo bakazimenyera igeno ryabo ritagatifu nk’abaragwa b’ubugingo buhoraho.
  Umugambi w’Imana w’ibyishimo utuma imibanire y’umuryango izakomeza nyuma y’urupfu. Imigenzo mitagatifu
  n’ibihango byo mu ngoro ntagatifu bituma bishoboka ko abantu basubira imbere y’Imana n’imiryango ngo
  bahuzwe ubuziraherezo.
- Itegeko rya mbere Imana yahaye Adamu na Eva ryerekeranye n’ubushobozi bwabo bwa kibyeyi nk’umugabo n’umugore.
  Dutangaje ko iryo tegeko ry’Imana ry’uko abana Bayo bagwira kandi bakuzura isi rikiriho. Byongeye kandi,
  dutangaje ko Imana yategetse ko ububasha butagatifu bw’irema ry’ubuzima bugomba gukoreshwa gusa hagati
  y’umugabo n’umugore, bashyingiranywe bijyanye n’amategeko nk’umugabo n’umugore.
- Dutangaje ko uburyo ubuzima bupfa buremwamo bwashyizweho n’Imana. Twemeje ubutagatifu bw’ubuzima n’ubw’agaciro
  kabwo mu mugambi uhoraho w’Imana.
- Umugabo n’umugore bafite inshingano itajenjetse yo gukundana no kwitanaho umwe ku wundi no ku bana babo.
  “Abana ni umurage uturuka kuri Nyagasani” (Zaburi 127:3). Ababyeyi bafite inshingano ntagatifu yo kurera
  abana babo mu rukundo n’ubukiranutsi, kubaha ibyo bakeneye by’umubiri n’ibya roho, no kubigisha gukundana
  no gufashanya, kubahiriza amategeko y’Imana, kandi bakaba abaturage bakurikiza amategeko y’aho batuye
  hose. Abagabo n’abagore—ababyeyi b’abagore n’ababyeyi b’abagabo—bazabazwa imbere y’Imana uko bubahirije
  izi nshingano.
- Umuryango wimitswe n’Imana. Ugushyingirwa hagati y’umugabo n’umugore ni ingenzi mu mugambi Wayo uhoraho.
  Abana bagomba kuvukira mu ipfundo ry’ishyingirwa, kandi bakarerwa n’umugabo n’umugore bubahiriza amasezerano
  y’ishyingirwa n’ubudahemuka bwuzuye. Ibyishimo byo mu muryango bigerwaho akenshi iyo bishingiye ku nyigisho
  za Nyagasani Yesu Kristo. Bigenda neza mu ngo n’imiryango iyo byubatswe kandi bigashikama ku mahame
  y’ukwizera, isengesho, ukwihana, imbabazi, icyubahiro, urukundo, ibambe, umurimo, n’imyidagaduro ikiza.
  Kubw’umugambi w’Imana, abagabo bagomba guhagararira imiryango yabo mu rukundo n’ubukiranutsi kandi bashinzwe
  gutanga ibyangombwa by’ubuzima n’uburinzi ku miryango yabo. Abagore bashinzwe bwa mbere kwita ku burere
  bw’abana babo. Muri izi nshingano ntagatifu, abagabo n’abagore bategetswe gufashanya nk’abashyingiranywe
  bareshya. Mu bumuga, urupfu, cyangwa n’ibindi bihe bashobora kureba ubundi buryo babyitwaramo neza.
  Imiryango bafitanye isano ikwiye gufasha bibaye ngombwa.
- Tubaburiye ko abantu batatira ibihango by’ukudasambana, abafata nabi abo bashakanye cyangwa abana babo,
  cyangwa abananirwa kuzuza inshingano zabo mu muryango, umunsi umwe bazabibazwa imbere y’Imana. Byongeye,
  tubaburiye kandi ko ugusenyuka k’umuryango bizazanira abantu ubwabo, abaturage, n’amahanga ibiza byavuzwe
  n’abahanuzi ba kera n’abo iki gihe.
- Duhamagariye abaturage bubahiriza inshingano n’abayobozi ba leta ho ari ho hose gushyira imbere izo
  ngamba zashyiriweho gushyigikira no gushimangira ko umuryango ari urugingo shingiro ry’igihugu.
