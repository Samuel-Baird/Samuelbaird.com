title: Die Lewende Christus
subtitle: Die Getuienis van die Apostels
author: Die Kerk van Jesus Christus van die Heiliges van die Laaste Dae
paragraphs:
- Terwyl ons die geboorte van Jesus Christus twee millennia gelede herdenk, bied ons ons getuienis van
  die werklikheid van sy onvergelykbare lewe en die oneindige krag van sy groot versoenende offerande.
  Geeneen het nog ooit so ’n diepgaande invloed gehad op almal wat al ooit op hierdie aarde geleef het,
  en wat nog op hierdie aarde sal lewe nie.
- Hy was die Groot Jehova van die Ou Testament, die Messias van die Nuwe. Onder die leiding van sy Vader,
  was Hy die skepper van die aarde. “Alle dinge het deur Hom ontstaan, en sonder Hom het nie een ding
  ontstaan wat ontstaan het nie” (Johannes 1:3). Alhoewel Hy sondeloos was, is Hy gedoop om alle geregtigheid
  te vervul. Hy “het die land deurgegaan, [en] goed gedoen” (Handelinge 10:38), en tog was Hy daarvoor
  verag. Sy evangelie was ’n boodskap van vrede en welwillendheid. Hy het almal gesmeek om sy voorbeeld
  te volg. Hy het die paaie van Palestina bewandel, die siekes genees, die blindes laat sien, en die dode
  opgewek. Hy het die waarhede van die ewigheid, die werklikheid van ons vooraardse bestaan, die doel
  van ons lewe op die aarde, en die potensiaal vir die seuns en dogters van God in die komende lewe, geleer.
- Hy het die nagmaal ingestel as ’n herinnering van sy groot versoenende offerande. Hy is gearresteer
  en veroordeel op valse aanklagte, skuldig bevind om ’n gepeupel tevrede te stel, en gevonnis om op Gólgota
  se kruis te sterf. Hy het sy lewe gegee om versoening te doen vir die sondes van die ganse mensdom.
  Syne was ’n groot plaasvervangende gawe ten behoewe van almal wat ooit op hierdie aarde sou lewe.
- Ons getuig plegtig dat sy lewe, wat sentraal tot die geskiedenis van alle mense is, nie in Bethlehem
  begin het nie, nóg op Gólgota geëindig het. Hy is die Eersgeborene van die Vader, die Eniggebore Seun
  in die vlees, die Verlosser van die wêreld.
- Hy het uit die graf opgestaan om “die eersteling [te] word van dié wat ontslaap het” (1 Korinthiërs
  15:20). As die Verrese Here, het Hy diegene wat Hy in die lewe liefgehad het, besoek. Hy het ook onder
  sy “ander skape” (Johannes 10:16) in antieke Amerika gedien. In die moderne wêreld het Hy en sy Vader
  aan die seun Joseph Smith verskyn om die lang-beloofde “[tydvak] van die volheid van tye” in te lui
  (Efésiërs 1:10).
- 'Aangaande die Lewende Christus het die Profeet Joseph geskryf: “Sy oë was soos ’n vuurvlam; die hare
  van sy hoof was wit soos suiwere sneeu; sy gelaat het geblink bó die helderheid van die son; en sy stem
  was soos die klank van ruisende groot waters, naamlik die stem van Jehova, wat sê:'
- “Ek is die eerste en die laaste; Ek is Hy wat leef, Ek is Hy wat gedood was; Ek is julle Voorspraak
  by die Vader” (L&V 110:3–4).
- 'Van Hom het die Profeet ook verklaar: “En nou, na die vele getuienisse wat van Hom gegee is, dit is
  die getuienis, laaste van almal, wat ons van Hom gee: Dat Hy leef!'
- “Want ons het Hom gesien, en wel aan die regterhand van God; en ons het die stem gehoor wat getuienis
  lewer dat Hy die Eniggeborene van die Vader is—
- “Dat deur Hom, en deur middel van Hom, en van Hom die wêrelde geskape word en was, en die inwoners daarvan
  is gebore seuns en dogters vir God” (L&V 76:22–24).
- Ons verklaar in woorde van plegtigheid dat sy priesterskap en sy Kerk herstel is op die aarde—“gebou
  op die fondament van … apostels en profete, terwyl Jesus Christus self die hoeksteen is” (Efésiërs 2:20).
- Ons getuig dat Hy eendag sal terugkeer na die aarde. “En die heerlikheid van die Here sal geopenbaar
  word, en alle vlees tesame sal dit sien” (Jesaja 40:5). Hy sal regeer as Koning van Konings, en heers
  as Heer van alle Here, en elke knie sal buig en elke tong sal in aanbidding voor Hom spreek. Elkeen
  van ons sal deur Hom geoordeel word volgens ons werke en die begeertes van ons harte.
- As sy behoorlik geordineerde Apostels lewer ons getuienis—dat Jesus die Lewende Christus is, die onsterflike
  Seun van God. Hy is die groot Koning Emmanuel, wat vandag aan die regterhand van sy Vader staan. Hy
  is die lig, die lewe en die hoop van die wêreld. Sy weg is die pad wat na geluk in hierdie lewe lei
  en die ewige lewe in die wêreld wat kom. Aan God sy die dank vir die onvergelyklike gawe van sy goddelike
  Seun.
