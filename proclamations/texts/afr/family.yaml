title: Die Familie
subtitle: ’n Proklamasie aan die Wêreld
author: Die Eerste Presidensie en Raad van die Twaalf Apostels van die Kerk van Jesus Christus van die
  Heiliges van die Laaste Dae
note: Hierdie proklamasie is gelees deur President Gordon B Hinckley as deel van sy boodskap by die Algemene
  Verligtingsverenigingsvergadering wat op 23 September 1995, in Salt Lake City, Utah gehou is.
paragraphs:
- Ons, die Eerste Presidensie en die Raad van die Twaalf Aposels van die Kerk van Jesus Christus van die
  Heiliges van die Laaste dae, verklaar plegtig dat die huwelik tussen ’n man en ’n vrou deur God geordineer
  is en dat die familie sentraal staan in die Skepper se plan vir die ewige bestemming van sy kinders.
- Alle mense—manlik en vroulik—is na die beeld van God geskape. Elkeen is ’n geliefde geestesseun of -dogter
  van hemelse ouers, en as sodanig het elkeen ’n goddelike aard en bestemming. Geslag is ’n noodsaaklike
  kenmerk van individuele vooraardse, sterflike en ewige identiteit en doel.
- In die vooraardse ryk het geestesseuns en -dogters God as hul Ewige Vader geken en aanbid en sy plan
  aanvaar waardeur sy kinders ’n fisiese liggaam kon verkry en aardse ervaring kon opdoen om na volmaaktheid
  te vorder en uiteindelik hul goddelike bestemming as erfgename van die ewige lewe te verwesenlik. Die
  goddelike plan van geluk maak dit moontlik om familieverhoudings anderkant die graf voort te sit. Heilige
  ordinansies en verbonde wat in heilige tempels beskikbaar is, maak dit vir individue moontlik om na
  die teenwoordigheid van God terug te keer en vir families om vir ewig verenig te wees.
- Die eerste gebod wat God aan Adam en Eva gegee het, het betrekking op hulle potensiaal vir ouerskap
  as man en vrou. Ons verklaar dat God se gebod aan sy kinders om te vermeerder en die aarde te vul, van
  krag bly. Ons verklaar verder dat God beveel het dat die heilige voortplantingsmagte slegs tussen man
  en vrou aangewend moet word, wettiglik getroud as man en vrou.
- Ons verklaar dat die manier waarop die sterflike lewe geskep word, goddelik bestem is. Ons bevestig
  die heiligheid van die lewe en die belangrikheid daarvan in God se ewige plan.
- Man en vrou het ’n plegtige verantwoordelikheid om mekaar en hulle kinders lief te hê en vir hulle te
  sorg. “Kinders is ’n erfdeel van die Here” (Psalm 127:3). Ouers het ’n heilige plig om hul kinders in
  liefde en geregtigheid groot te maak, om in hul fisiese en geestelike behoeftes te voorsien, en om hulle
  te leer om mekaar lief te hê en te dien, die gebooie van God te onderhou en wetsgehoorsame burgers te
  wees waar hulle ook al woon. Mans en vroue—moeders en vaders—sal voor God aanspreeklik gehou word vir
  die nakoming van hierdie verpligtinge.
- Die familie is deur God geordenineer. Die huwelik tussen man en vrou is noodsaaklik vir sy ewige plan.
  Kinders is geregtig op geboorte binne die huweliksbande, en om grootgemaak te word deur ’n vader en
  ’n moeder wat huweliksgeloftes met volkome getrouheid eerbiedig. Geluk in die familielewe sal heel waarskynlik
  verkry word wanneer dit op die leringe van die Here Jesus Christus gegrond is. Suksesvolle huwelike
  en families word gevestig en onderhou op beginsels van geloof, gebed, bekering, vergifnis, respek, liefde,
  deernis, werk en heilsame ontspanningsaktiwiteite. Volgens goddelike ontwerp moet vaders in liefde en
  regverdigheid oor hulle families presideer en is hulle verantwoordelik om in die lewensbenodigdhede
  en beskerming van hulle families te voorsien. Moeders is hoofsaaklik verantwoordelik vir die versorging
  van hul kinders. In hierdie heilige verantwoordelikhede is vaders en moeders verplig om mekaar as gelyke
  vennote te help. Gestremdheid, dood of ander omstandighede kan individuele aanpassing noodsaak. Uitgebreide
  familie moet ondersteuning verleen wanneer nodig.
- Ons waarsku dat individue wat verbonde van kuisheid verbreek, wat huweliksmaat of kinders mishandel
  of wat versuim om familieverantwoordelikhede na te kom, eendag voor God aanspreeklik sal wees. Daarbenewens
  waarsku ons dat die verbrokkeling van die familie die rampe wat deur eertydse en hedendaagse profete
  voorspel is, oor individue, gemeenskappe en nasies sal bring.
- Ons doen ’n beroep op verantwoordelike burgers en regeringsbeamptes oral om daardie maatreëls te bevorder
  wat ontwerp is om die familie as die fundamentele eenheid van die samelewing.
