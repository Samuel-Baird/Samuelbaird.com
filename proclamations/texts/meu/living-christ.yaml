title: Keriso Mauri
subtitle: Aposetolo edia hahemomokani
author: Iesu Keriso ena Dubu Ekalesia Helagadia Dina Gabediai
paragraphs:
- Iesu Keriso ena vara lagani daha rua vada e ore ta moalelaiamu, eda hahemomokani ta heniamu ena mauri
  korikorina asi iha hegeregerena bona siahu asi dokona ena kara dika iabi ohona badana boubounai. Ta
  ese siahu bada hereana ini bamona taunimanima iboudiai latadiai daidia be enoho bona ma bae noho tanobada
  latanai.
- Ia be Taravatu Gunana ena Iehova Badana, Ahemauri Tauna Taravatu Matamatana ai. Tamana ena dala henunai,
  Ia ese tanobada e karaia. “Gau iboudiai Ia ese e karadia bona bema Ia lasi gau ta basinema hekara, bena
  e karaia” (Ioane 1:3). Asi ena dika ta, Ia e bapatisoa na gau iboudiai iha maoromaorodia dainai. Ia
  e loava namo e karava (Aposetolo Edia Kara 10:38), edadaraiava una dainai. Ena Sivarai Namo be maino
  bona ura namona. Ena noinoi be iboudiai Ia ena haheitalai bae gavaia. Ia e raka Palestine daladiai,
  gorere e hanamodia, mata kepulu eha roharohadia, bona mase e hatoreisidia. Ia ese e hadibadia mia hanaihanai
  momokanina, lauma edia noho gabuna, ita eda mauri badina tanobadai, bona Dirava natuna mamaruanedia
  bona hahinedia edia dibaka mauri gabena ena mai lalonai.
- Ia ese anibou e matamaia Ia ese dika iabi ohona boubouna ilalotaona. Ia be edabaiatao bona eha hebadelaia
  koikoi maduna kereredia ai, ebutua tao kava orea ta lalodia baine haheatoa namonamo, bona egwauraia
  baine mase Kalavaria Sataurona ai. Ia ena mauri eheni taunimanima iboudiai edia dika iabi ohona dainai.
  Ia ena be harihari gauna bada hereana taunimanima iboudiai ladadiai daidia be, tanobadai do bae noho.
- Ita hemataurai ai Ia ena mauri taha hemomokaniamu, edena be taunimanima iboudiai edia guna maurina ihuanai,
  se hematama Bethlehem ai eiava se ore Kalavaria ai. Ia be tamana ena roboa. Natuna vara edeana tamona
  tauani lalonai, tanobada ihamaurina.
- Ia gara amo e toreisi bena e mahuta taudia edia au huahua anina matamana ai ela (1 Korinto 15:20). Toreisi
  Lohiabadana, Ia ese e lalokau heniava taudia evadivadi henidia ena mauri ai. Ia danu eharoro loaloava
  ena mamoe haida ediai gunaguna Amerika tanobadana lalonai. Tanobada matamatana lalonai, Ia bona Ia Tamana
  e hedinarai mero Iosepa Smith enai, e gwauhamatalaia guna iha hedinaraina “Iheni lasidia negadia iboudiai
  bae guguru” (Efeso 1:10).
- 'Peroveta tauna Iosepa ese Keriso Mauri dainai etorea: “Ia matana be vaitani lahi hururuna ta na heto;
  kwarana huina be kurokuro goevagoeva ninoa oromana; Ia vairana be dina diarina ediari daenai; bona Ia
  erena be vaitani ranu badadia eheaumu regena; bona danu Iehova erena egwaumu:'
- “Lau na matamana bona dokona; Lau na Ia daika be e nohomu, Lau na Ia daika be e alaia; Lau na umui ivairalaimui
  Tamada enai” (Hahediba bona Gwauhamata Herevadia 110:3–4).
- 'Ia dainai Peroveta tauna danu e gwau hedinarai: “Bona harihari, hahemomokani momo muridiai ededia be
  ia dainai vada e heni, ina hahemomokani, orena, edena be Ia dainai ta henimu: Ia na e mauri nohomu.'
- “Vada ita ese taitaia, Dirava idibana kahanai; bona ita ese erena vada ta kamonai, doini e nohomu Ia
  na Tamana Natuna vara edeana.
- “Bena Ia dainai, bona Ia lalona amo, bona Ia ena amo, tanobada iboudiai na vada e karadia, bona e noholaiamu
  taudia iboudiai na natuna mamaruanedia bona hahinedia Dirava enai” (Hahediba bona Gwauhamata Herevadia
  76:22–24).
- Ita ta gwau hedinaraimu mai hematauraida ida, bena Ia ena Helaga Dubu Dagina Biaguna bona Ia ena Dubu
  be eha daidia lou tanobada latanai—“eha ginia Aposetolo bona Peroveta taudia edia nadigini latanai,
  Iesu Keriso sibona be daiguni nadina Lohiana” (Efeso 2:20).
- Ita ese ta hamomokaniamu Ia na dina haida tanobada do baine lou mai “bona Lohiabada ihanamolaina do
  baine hedinarai, bona hidiho iboudiai ese nega tamonai bae itaia” (Isaiah 40:5). Ia baine hahetohoa
  Pavapava iboudiai edia Pavapava bona baine halohiaia Lohiabada iboudiai edia Lohiabada, bona tui iboudiai
  bae diho bona mala iboudiai bae hereva vairanai bae tomadiho. Ita ta ta baita tore bena Ia ese baine
  ha hetohoda eda gaukara bona kudouda edia ura hegeregerenai.
- Ita na mai eda hahemomokani Ia ena nega namonai Aposetolo eha helagadia na heto—Iesu na Keriso Mauri,
  Dirava natuna noho hanaihanai. Ia na Pavapava badana Emanuela, daika be hari dina Tamana idibana kahanai
  e ginimu. Ia na diari, mauri bona tanobada ena helaorea. Ia ena dala na e laomu moale hanaihanai ina
  mauri lalonai bona mauri hanaihanai e maimu tanobadanai. Dirava na bae hanamoa badina natuna na ena
  harihari gauna helagana asi iha hegeregerena.
