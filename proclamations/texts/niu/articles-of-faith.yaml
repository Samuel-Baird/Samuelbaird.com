title: Tau Hatakiaga kua Tua
subtitle: a Mautolu ki ai ma e Lotu a Iesu Keriso ke he tau Aho Fakamui nei
author: ''
verses:
- n: 1
  text: 1. Kua tua a mautolu ke he Atua, ko e Matua Tukulagi, mo e Haana a Tama, ko Iesu Keriso, mo e
    Agaaga Tapu.
- n: 2
  text: 2. Kua tua a mautolu to fakahala e tau tagata ha ko e ha lautolu a tau agahala ka e nākai fakahala
    ha ko e holifono ha Atamu.
- n: 3
  text: 3. Kua tua a mautolu ko e Lukutotoaga ha Keriso ke fakamomoui aki e tau tagata oti kana, kaeke
    kua omaoma ke he tau fakatufono mo e tau gahua tapu he Evagelia.
- n: 4
  text: '4. Kua tua a mautolu ko e tau fakaakoaga mo e tau gahua tapu fakamua he Evagelia a nei: fakamua,
    tua ke he Iki ko Iesu Keriso; ke ua aki, Fakatokihala, ke tolu aki Papateisoaga ke tanumia ke he vai
    ma e fakamagaloaga he tau agahala; ke fa aki, Fakalagoaga he tau lima ke moua e mena fakaalofa noa
    ko e Agaaga Tapu.'
- n: 5
  text: 5. Kua tua a mautolu, kua lata ke kotofa he Atua e tagata ke he Haana perofetaaga mo e fakalagoaga
    he tau lima mai ia lautolu ne toka ai e pule ke fakamatala e Evagelia mo e taute e tau gahua tapu
    kua hā hā i ai.
- n: 6
  text: 6. Kua tua a mautolu ke he matakau kua tatai ni mo e matakau he Lotu ne fakatū i tuai, ne fakahigoa
    ko e tau aposetolo, tau perofeta, tau akoako, tau faiaoga, tau kau fakamatala, mo e falu foki.
- n: 7
  text: 7. Kua tua a mautolu ke he mena fakaalofa, ko e tau vagahau kehekehe, tau perofetaaga, kitiaga
    ke he tau mena galo, fakamalolōaga, fakaliliuaga he tau vagahau kehekehe mo e falu foki.
- n: 8
  text: 8. Kua tua a mautolu ko e Tohi Tapu, ko e tau kupu he Atua kaeke kua hako mo e tonu e tau fakaliliuaga;
    kua tua foki a mautolu ko e Tohi Moromona ko e tau kupu he Atua.
- n: 9
  text: 9. Kua tua a mautolu ke he tau mena oti kua fakakite he Atua, kua fakakite mai foki e tau mena
    oti ne taute e Ia kua tua foki a mautolu to fakakite mai e Ia e tau mena lalahi mo e mahuiga hagaao
    ia ke he Kautū he Atua.
- n: 10
  text: 10. Kua tua a mautolu ke he fakamaopoopoaga he tau tagata Isaraela mo e to liu ke fakamaopoopo
    e tau Kautu ne Hogofulu (10 tribes); to fakatū ai a Siona (Ierusalema Foou) ke he motu na ko Amelika;
    to haele mai a Keriso ke pule ke he lalolagi, to fakafoou e lalolagi mo e to moua ai e tūaga lilifu
    fakaparataiso.
- n: 11
  text: 11. Kua hā hā ia mautolu e atāina mo e tonuhia ke hufeilo ke he Atua Mua Ue Atu, ke he tau puhala
    kua fioia ha mautolu a tau loto ki ai, mo e fakaatā foki e tonuhiaaga nei ke he tau tagata oti, ke
    hufeilo ke he tau puhala, tau matavaki mo e tau mena ne kua manako a lautolu ki ai.
- n: 12
  text: 12. Kua tua a mautolu mo e falanaki atu ke he tau patuiki, tau takitaki, tau pule, mo e tau iki
    fakafili, ke omaoma, fakalilifu mo e leveki atu ke he tau mata fakatufono.
- n: 13
  text: 13. Kua tua a mautolu ke he mahani fakamooli, mahani hakohako, mahani meā, mahani totonu mo e
    mahanai mitaki ke he tau tagata oti; kua muitua a mautolu ke he tau tomatomaaga ha Paulo—Kua tua a
    mautolu ke he tau mena oti, kua amaamanaki ke he tau mena oti, ne fakauka a mautolu ke he tau mena
    loga mo e amanaki ke fakauka ke he tau mena oti. Kaeke kua fai mena kua mua atu haana mitaki, fulufuluola,
    poke talahaua to kumi atu foki a mautolu ke he tau mena oti nei.
signature: Iosefa Samita.
