title: Kua Moui a Keriso
subtitle: Tau Fakamooliaga he tau Aposetolo
author: Ko e Lotu A Iesu Keriso Ma e Tau Tagata Tapu He Tau Aho Fakamui Nei
paragraphs:
- Taute e tautolu e tau fakalilifuaga ke he fanauaga ha Iesu Keriso ke he ua e afe tau tau kua mole, fakakite
  foki ha tautolu a tau fakamooliaga ke he Haana moui kua nakai fai mena ke fakatatai atu aki, mo e lilifu
  tukulagi ha ko e Haana lukutotoaga. Nakai fai tagata ne kua hokulo e logonaaga ke he tau fakaohoohoaga
  ke lata mo lautolu ne kua momoui mo lautolu ka mumui mai ke he lalolagi.
- Ko Ia ko Iehova mua ue atu ki loto he Maveheaga Tuai, ko e Mesia he Maveheaga Foou. Ki lalo hifo he
  tau hatakiaga he Haana Matua, ko Ia ne tufugatia e lalolagi. “Ne taute e Ia e tau mena oti kana, nakai
  fakaai ke maeke foki ha mena taha ne taute ka nakai taute e Ia” (Ioane 1:3) Pete kua nakai agahala a
  Ia, ne papateiso a Ia ke lata mo e fakakatoatoaaga he mahani tututonu. Ne haele fano a Ia mo e taute
  e tau gahua mitaki (Gahua 10:38), pete ne fakavihiatia e lautolu a Ia. Ko e Haana evagelia ko e fakapuloaaga
  he mafola. Ne uiina e Ia a lautolu oti ke mumui ke he Haana tau fakafifitakiaga. Ne fano hui a Ia ke
  he puhala tu i Palasataina, mo e fakamalolō e tau tagata gagao, fakamaama e tau mata kua pouli ti fakamomoui
  a lautolu ne kua mamate. Ne fakaako e Ia e tau mena mooli oti hagaao ke he moui tukulagi, mo e mooli
  he tau momoui ke he lalolagi fakamua, ko e kakano he tau momoui ke he lalolagi nei, mo e tau mena ke
  taute e tautolu ke fakatolomaki aki e tau momoui ha tautolu ko e tau fanau he Atua ke he moui ne fakatali
  ki ai.
- Ne taute e Ia e fakamanatuaga ke fakamanatu aki Haana a lukutotoaga. Ne tapaki mo e hokotaki pikopiko,
  e lautolu a Ia, fakahala ke fakafiafia aki a lautolu e tau tagata kelea ti fakahala ke he mate ki luga
  he akau fakalava i Kolokota. Ne foaki e Ia Haana moui ke paleplale aki e tau agahala he tau tagata oti.
  Ko e Haana fakaalofa fakamooli ke lata mo lautolu ka momoui mai mo e nonofo ai ke he lalolagi.
- Ne fakamooli mo e fakamakai a tautolu ke he Haana moui, ko e tuaga uho mahuiga ma e tau tagata oti tali
  mai fakamua, kamata mai i Petelehema ke hoko atu ki Kolokota. Ko Ia ko e Uluaki he Matua, ko e Tama
  Fuataha ke he tino nei, ko e Laveakiaga ke he lalolagi.
- Ne liu tu mai a Ia mai he Haana tukuaga, “ko Ia foki ko e fua fakamua mai ia lautolu ne kua momohe”.
  (Tohi 1 Korinito 15:20) Ha ko e Iki Liu Tu Mai, ne ahiahi atu a Ia ki a lautolu ne ofania e ia. Ne fekafekau
  atu foki a Ia ke he falu he Haana tau mamoe”, (Ioane 10:16) i Amelika ke he vahai tuai. Ke he lalolagi
  foou nei, ne haele mai a Ia mo e Haana Matua ke he fuata mui ko Iosefa Samita, ke lata mo e maveheaga
  ne kua leva ne mavehe ma e fakakatoatoaaga ke he tau aho fakamui nei” (Efeso 1:10).
- 'Ha kua Moui a Keriso, hanei e tohiaga ha Iosefa Samita: “Ko e Haana na fofoga foki tuga ne puho he
  afi ia, ko e tau lauulu he Haana ulu kua tea hinavake tuga ni e kiona, ko e Haana fofoga kua kikila
  mo e maama tuga ne laa; ko e Haana leo kua go tuga e vai ne tafe holopī fano, ko e leo foki ha Iehova
  ne vagahau mai:'
- “Ko Au ko e fakamua mo e fakamui, ko Au nei ne moui, ko Au nei ne kelipopo ai, ko Au nei ko e gutu vagahau
  ma mutolu ke he Matua” (Tohi he Tau Fakatufono mo e Tau Maveheaga 110:3–4).
- 'Ha ko Ia foki ne fakapuloa ai he Perofeta: “Magaaho nei, kua mole atu e loga he tau fakamooliaga ne
  kua talahau ki a Ia, hanei e fakamooliaga fakahiku ki a Ia; Ne kua moui a Ia!'
- '“Ne kitia e mautolu a Ia ke he faahi matau he Atua: ne logona e mautolu e leo kua fakamatala mai e
  talahauaga kua mooli, ko Ia ni ko e Tama Fuataha he Matua—'
- “Ha ko Ia ni, mo e ko Ia ni mo Ia ni, kua pihia e lalolagi mo e tufugatiaaga, mo e tau tagata kua ha
  ha i ai, ko e tau fanau taane mo e tau fanau fifine oti a lautolu ke he Atua” (Tohi he Tau Fakatufono
  mo e Tau Maveheaga 76:22–24).
- Kua manako ke fakapuloa atu e talahauaga nei mo e nakai fakauaua ko e Haana feua ekepoa mo e Haana Lotu
  ne liuaki mai ke he lalolagi—“kua fakatu ke he fakaveaga … he tau aposetolo mo e tau perofeta, ko Iesu
  Keriso ko e takitaki, ko e maka he malokuaga” (Efeso 2:20).
- Kua fakamooli a mautolu to hoko mai e aho ke liu mai a Ia ke he lalolagi. “Ko e lilifu he Iki to fakakite
  mai, to maeke he tau tagata oti kana ke kitia” (Isaia 40:5). To eke a Ia mo Patuiki he tau Patuiki to
  pule foki a Ia ke he tau Iki he tau Iki, to fakatokotui mai e tau tulihui oti kana, to tokutoku oti
  he tau alelo oti kana mo e hufeilo atu ki a Ia. To igatia a tautolu mo e tūtū ki mua Haana ke lata mo
  e fakafiliaga mo e fakafili ai ke he tau gahua ha tautolu mo e tau manako he ha tautolu a tau loto.
- Kua fakamooli a mautolu, ko e Haana tau Aposetolo—kua fakauku mo e omonuo-ko Iesu ko Ia ko e Keriso
  Moui, ko e tama tukulagi he Atua. Ko Ia ko e Patuiki Emanuela mua ue atu, kua nofo ke he magaaho nei
  ke he faahi matau he Haana Matua. Ko Ia ko e maama, ko e moui, mo e amanakiaga he lalolagi. Ko e Haana
  puhala ke takitaki aki a tautolu ke he fiafia he mouiaga nei mo e moui ke he lalolagi ne tatali mai.
  Kia fakaaue atu ke he Atua ke he Haana fakaalofa kua nakai fai fakatataiaga ha ko e Haana tama Fuataha.
