title: Символы веры
subtitle: Церкви Иисуса Христа Святых последних дней
author: ''
verses:
- n: 1
  text: Мы верим в Бога, Отца Вечного, и в Сына Его, Иисуса Христа, и в Духа Святого.
- n: 2
  text: Мы верим, что люди будут наказаны за свои собственные грехи, а не за согрешение Адама.
- n: 3
  text: Мы верим, что через Искупление Христа всё человечество может быть спасено посредством повиновения
    законам и таинствам Евангелия.
- n: 4
  text: 'Мы верим, что основными принципами и таинствами Евангелия являются: первое – вера в Господа Иисуса
    Христа; второе – покаяние; третье – крещение погружением в воду для отпущения грехов; четвёртое –
    возложение рук для дарования Духа Святого.'
- n: 5
  text: Мы верим, что человек должен быть призван Богом через пророчество и через возложение рук теми,
    кто облечены властью, дабы проповедовать Евангелие и исполнять таинства его.
- n: 6
  text: 'Мы верим в ту же организацию, которая существовала в Первоначальной Церкви, а именно: в апостолов,
    пророков, пасторов, учителей, евангелистов и так далее.'
- n: 7
  text: Мы верим в дар языков, пророчества, откровения, видений, исцеления, истолкования языков и так
    далее.
- n: 8
  text: Мы верим, что Библия – слово Божье в той мере, в какой она переведена правильно; мы также верим,
    что Книга Мормона – слово Божье.
- n: 9
  text: Мы верим во всё, что открыл Бог, во всё, что Он ныне открывает, и мы верим, что Он ещё откроет
    много великого и важного, касающегося Царства Божьего.
- n: 10
  text: Мы верим в буквальное собирание Израиля и в восстановление десяти колен; в то, что Сион (Новый
    Иерусалим) будет построен на Американском континенте; что Христос будет лично царствовать на Земле
    и что Земля обновится и получит свою райскую славу.
- n: 11
  text: 'Мы заявляем о своём праве поклоняться Богу Всемогущему согласно голосу нашей совести и признаём
    такое же право за всеми людьми: пусть они поклоняются как, где или чему им угодно.'
- n: 12
  text: Мы верим, что необходимо подчиняться государям, президентам, правителям и судебным властям, соблюдая,
    почитая и поддерживая закон.
- n: 13
  text: 'Мы верим, что нам следует быть честными, верными, целомудренными, благожелательными, добродетельными
    и делать добро всем людям; воистину мы можем сказать, что следуем наставлению Павла: Мы всему верим,
    на всё надеемся; мы многое перенесли и надеемся, что сможем перенести всё. Если есть что-либо добродетельное,
    прекрасное, достойное уважения или похвалы, мы стремимся ко всему этому.'
signature: Джозеф Смит.
