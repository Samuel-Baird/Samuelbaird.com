retrieved: '2026-11-02'
title: Восстановление полноты Евангелия Иисуса Христа
subtitle: Воззвание к миру в честь двухсотлетнего юбилея
author: Первое Президентство и Совет Двенадцати Апостолов Церкви Иисуса Христа Святых последних дней
note: Это воззвание было зачитано Президентом Расселом М. Нельсоном в рамках его послания на 190-й ежегодной
  Генеральной конференции 5 апреля 2020 года в городе Солт-Лейк-Сити, штат Юта, США.
paragraphs:
- Мы торжественно провозглашаем, что Бог любит Своих детей во всех странах мира. Бог-Отец даровал нам
  Божественное рождение, ни с чем не сравнимую жизнь и бесконечную искупительную жертву Своего Возлюбленного
  Сына Иисуса Христа. Силой Отца Иисус восстал из мертвых и одержал победу над смертью. Он наш Спаситель,
  наш Пример для подражания и наш Искупитель.
- Двести лет назад, прекрасным весенним утром 1820 года, юный Джозеф Смит, стремясь узнать, к какой церкви
  ему присоединиться, удалился в рощу близ своего дома на севере штата Нью-Йорк, США, чтобы помолиться.
  У него были вопросы по поводу спасения его души, и он верил, что Бог направит его.
- Мы смиренно провозглашаем, что в ответ на эту молитву Джозефу явились Бог-Отец и Его Сын, Иисус Христос,
  и положили начало «совершению всего» (Деяния 3:21), как было предсказано в Библии. В этом видении он
  узнал, что после смерти первых Апостолов новозаветной Церкви Христовой на Земле не стало. Джозефу предстояло
  сыграть важную роль в ее возвращении.
- Мы утверждаем, что под руководством Отца и Сына Джозефу являлись Небесные посланники с целью наставлять
  его и снова учредить Церковь Иисуса Христа. Воскресший Иоанн Креститель восстановил власть крещения
  погружением в воду для отпущения грехов. Трое из первых Двенадцати Апостолов – Петр, Иаков и Иоанн –
  восстановили власть Апостольства и ключи власти священства. Также являлись и другие, в том числе Илия,
  который восстановил власть навсегда объединять семьи в вечных отношениях, которые продолжаются и после
  смерти.
- Мы также свидетельствуем, что Джозефу Смиту были даны дар и сила Бога перевести древнюю летопись – Книгу
  Мормона, ещё одно свидетельство об Иисусе Христе. На страницах этого священного текста приводится рассказ
  о личном служении Иисуса Христа среди жителей Западного полушария вскоре после Его Воскресения. В нем
  говорится о смысле жизни и объясняется учение Христа, которое служит средоточием этого смысла. Книга
  Мормона – Священное Писание, сопутствующее Библии, – свидетельствует о том, что все люди суть сыновья
  и дочери любящего Небесного Отца, что у Него есть Божественный план для нашей жизни и что Его Сын Иисус
  Христос говорит сегодня так же, как и во дни древние.
- Мы провозглашаем, что Церковь Иисуса Христа Святых последних дней, организованная 6 апреля 1830 года,
  есть восстановленная новозаветная Церковь Христова. Церковь эта зиждется на совершенной жизни ее главного
  краеугольного камня, Иисуса Христа, и на Его бесконечном Искуплении и буквальном Воскресении. Иисус
  Христос снова призвал Апостолов и дал им власть священства. Он приглашает всех нас прийти к Нему и в
  Его Церковь, получить Духа Святого, таинства спасения и обрести непреходящую радость.
- С тех пор как Бог-Отец и Его Возлюбленный Сын Иисус Христос положили начало Восстановлению, прошло двести
  лет. Миллионы людей по всему миру с готовностью приняли знание об этих событиях, предсказанных Пророками.
- Мы с радостью провозглашаем, что обещанное Восстановление продолжается посредством непрекращающегося
  откровения. Земля будет изменяться по мере того, как Бог «все небесное и земное соедин[яет] под главою
  Христом» (к Ефесянам 1:10).
- Мы, Его Апостолы, с благоговением и благодарностью приглашаем всех узнать, как знаем это мы, что Небеса
  открыты. Мы утверждаем, что Бог являет Свою волю в отношении Своих возлюбленных сыновей и дочерей. Мы
  свидетельствуем, что те, кто с молитвой изучают послание Восстановления и действуют с верой, будут благословлены
  обретением собственного свидетельства о его Божественности и о его цели – подготовить мир к обещанному
  Второму пришествию нашего Господа и Спасителя, Иисуса Христа.
