title: Живой Христос
subtitle: Свидетельство Апостолов
author: Церковь Иисуса Христа Святых последних дней
paragraphs:
- В дни, когда мы отмечаем две тысячи лет от рождества Иисуса Христа, мы приносим свое твердое свидетельство
  о реальности Его беспримерной жизни и бесконечной силе Его великой Искупительной жертвы. Никто не оказал
  столь глубокого влияния на всех, кто жил и кому еще только предстоит жить на этой Земле.
- Он был Великим Иеговой Ветхого Завета и Мессией − Нового. Действуя под руководством Своего Отца, Он
  создал Землю. «Все чрез Него нáчало быть, и без Него ничто не нáчало быть, что нáчало быть» (от Иоанна
  1:3). Будучи безгрешным, Он крестился, чтобы «исполнить всякую правду». Он «ходил, благотворя» (Деяния
  10:38), хотя был презираем за это. Его Евангелие было посланием мира и доброй воли. Он увещевал всех
  следовать Своему примеру. Он ходил дорогами Палестины, исцеляя больных, возвращая зрение слепым и воскрешая
  умерших. Он учил истинам о вечной жизни, говорил о реальности нашего предземного существования, о цели
  нашей жизни на Земле и возможностях, ожидающих сынов и дочерей Божьих в жизни грядущей.
- Он учредил причастие в память о Своей великой Искупительной жертве. Взятый под стражу и осужденный по
  ложному обвинению, Он был признан виновным в угоду толпе и приговорен к смерти на кресте Голгофы. Он
  отдал Свою жизнь, чтобы искупить грехи всего рода человеческого. То была великая заместительная жертва
  ради всех людей, когда бы они ни жили на Земле.
- Мы торжественно свидетельствуем, что жизнь Его, средоточие всей человеческой истории, началась не в
  Вифлееме и закончилась не на Лобном месте. Это был Первенец Отца, Единородный Сын во плоти, Искупитель
  мира.
- Он восстал из могилы, чтобы стать «первенцем из умерших» (1-е к Коринфянам 15:20). Он, Воскресший Господь,
  появлялся среди тех, кого любил при жизни. Он служил и «другим овцам» Своим (от Иоанна 10:16) в древней
  Америке. А в современном мире Он и Его Отец явились юноше Джозефу Смиту, возвестив о давно обещанном
  «устроении полноты времен» (к Ефесянам 1:10).
- 'О Живом Христе Пророк Джозеф написал: «Очи Его были подобно пламени огненному; волосы головы Его были
  белыми, наподобие чистого снега; лицо Его сияло превыше блеска солнца; и голос Его был подобен рёву
  бурных великих вод, да, голос Иеговы, говорящий:'
- Я есть первый и последний; Я Тот, Кто жив; Я Тот, Кто был предан смерти; Я – ваш Ходатай перед Отцом»
  (У. и З. 110:3–4).
- 'Пророк также провозгласил о Нем: «И ныне, после многих свидетельств, которые были даны о Нём, это последнее
  из всех свидетельств, которое мы даём о Нём, – что Он жив!'
- Ибо мы видели Его по правую руку Бога; и мы слышали голос, свидетельствовавший, что Он есть Единородный
  от Отца –
- Что Им, через Него и от Него миры есть и были сотворены, и жители их – сыны и дочери, рождённые Богу»
  (У. и З. 76:22–24).
- 'Мы торжественно заявляем: теперь Его священство и Его Церковь восстановлены на Земле, «быв утверждены
  на основании Апостолов и пророков, имея Самого Иисуса Христа краеугольным камнем» (к Ефесянам 2:20).'
- Мы свидетельствуем, что некогда Он снова вернется на Землю. «И явится слава Господня, и узрит всякая
  плоть [спасение Божие]» (Исаия 40:5). Он будет править как Царь царей и властвовать как Господь господствующих,
  и всякое колено преклонится, и всякий язык будет благоговейно исповедовать Его. Каждый из нас предстанет
  пред Ним, чтобы быть судимым согласно своим делам и желаниям своего сердца.
- Мы приносим свидетельство, как Его Апостолы, посвященные должным образом, что Иисус есть Живой Христос,
  бессмертный Сын Божий. Он − великий Царь Еммануил, стоящий ныне по правую руку Своего Отца. Он − свет,
  жизнь и надежда мира. Стези Его − путь, ведущий к счастью в этой жизни и к жизни вечной в мире грядущем.
  Благодарение Богу за этот бесподобный дар − за Его Божественного Сына.
