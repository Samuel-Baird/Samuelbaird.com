title: Семья
subtitle: Воззвание к миру
author: Первое Президентство и Совет Двенадцати Апостолов Церкви Иисуса Христа Святых последних дней
note: Это обращение было зачитано Президентом Гордоном Б. Хинкли как часть его выступления на Общем собрании
  Общества милосердия 23 сентября 1995 г. в г. Солт-Лейк-Сити, штат Юта, США.
paragraphs:
- Мы, Первое Президентство и Совет Двенадцати Апостолов Церкви Иисуса Христа Святых последних дней, торжественно
  провозглашаем, что брак мужчины и женщины предначертан Богом, и в замысле Творца, определяющем вечную
  судьбу Его детей, семье отведено центральное место.
- Все люди − как мужчины, так и женщины − сотворены по образу Божьему. Каждый является возлюбленным духовным
  сыном или дочерью Небесных Родителей, и потому Божественная природа и судьба уготованы всем. Пол неразрывно
  связан с сущностью и предназначением каждого в его предземной, земной и вечной жизни.
- В предземной жизни духовные сыновья и дочери познали Бога и поклонялись Ему как своему Вечному Отцу.
  Они приняли Его план, следуя которому, Его дети смогли получить физические тела и обрести опыт земной
  жизни, необходимый для движения к совершенству и конечному осуществлению своего Божественного предназначения
  как наследников жизни вечной. Божественный план счастья дает возможность семье продолжить свое существование
  и в мире ином. Священные таинства и заветы, доступные в святых храмах, делают возвращение в присутствие
  Божье возможным для каждого, а семьи благодаря им воссоединятся в вечности.
- 'Первая заповедь Бога Адаму и Еве, как мужу и жене, относилась к их способности стать родителями. Мы
  заявляем, что заповедь, данная Богом Своим детям, − «размножайтесь и наполняйте Землю» − остается в
  силе. Мы также заявляем: Бог повелел, чтобы священные силы деторождения могли использовать только мужчина
  и женщина, состоящие в законном браке как муж и жена.'
- Мы заявляем, что силы, посредством которых зарождается земная жизнь, предназначены для этого Богом.
  Мы подтверждаем святость жизни и важнейшую роль, отведенную ей в вечном плане Божьем.
- 'На мужа и жену торжественно возлагается обязанность проявлять любовь и заботу по отношению друг к другу
  и к своим детям. «Вот наследие от Господа: дети» (Псалтирь 126:3). Растить детей в любви и праведности,
  удовлетворять их мирские и духовные потребности, учить их любви и служению друг другу, повиновению заповедям
  Божьим и воспитать их законопослушными гражданами своей страны − это священный долг родителей. За то,
  как эти обязанности выполняются ими, мужья и жены − матери и отцы − будут держать ответ пред судом Божьим.'
- Семья предначертана Богом. Брак мужчины и женщины имеет фундаментальное значение в Его вечном плане.
  Дети имеют право быть рожденными в рамках супружества и воспитываться отцом и матерью, строго соблюдающими
  свои брачные обеты. Счастья в семейной жизни можно достичь, прежде всего следуя учениям Господа Иисуса
  Христа. Счастливые браки и семьи основаны и укрепляются верой, молитвой, покаянием, прощением, уважением,
  любовью, состраданием, трудолюбием, а также полноценным отдыхом. В соответствии с Божественным замыслом
  отцы должны председательствовать над своими семьями в любви и праведности. Долг отцов − обеспечивать
  семьям защиту и все жизненно необходимое. Основная обязанность матерей − воспитание детей. Выполняя
  эти священные обязанности, отцы и матери должны помогать друг другу как равные. В случае увечья, смерти
  или других чрезвычайных обстоятельств роли могут измениться. При необходимости должны оказать помощь
  ближайшие родственники.
- 'Мы предостерегаем: те, кто нарушает заветы целомудрия, жестоко обращается с женой, мужем или потомством
  или же отказывается от исполнения семейных обязанностей, в свое время предстанут пред судом Божьим.
  Более того, мы предостерегаем, что разрушение семьи навлечет на людей, общины и целые народы бедствия,
  предреченные древними и современными Пророками.'
- Мы призываем достойных граждан и государственных служащих всего мира принять все меры, направленные
  на сохранение и укрепление семьи как основной ячейки общества.
