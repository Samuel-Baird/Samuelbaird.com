title: ஜீவிக்கும் கிறிஸ்து
subtitle: அப்போஸ்தலர்களின் சாட்சியம்
author: பிற்காலப் பரிசுத்தவான்களின் இயேசு கிறிஸ்து சபை
paragraphs:
- இரண்டாயிரம் ஆண்டுகளுக்கு முன்பே இயேசு கிறிஸ்து பிறந்ததை நாம் நினைவுகூரும்போது, ஒப்பற்ற அவரது ஜீவியம்
  மற்றும் அவரது மாபெரும் பாவ நிவாரண பலியின் எல்லையில்லா நன்மையின் எதார்த்தம் குறித்தும் சாட்சியமளிக்கிறோம்.
  இப்பூமியில் வாழ்ந்தவர்கள், இன்னும் வாழப்போகிறவர்கள் அனைவருக்குள்ளும் ஒரு ஆழ்ந்த செல்வாக்கை அவரைத் தவிர
  வேறு ஒருவரும் ஏற்படுத்தியதில்லை.
- அவரே பழைய ஏற்பாட்டின் மாபெரும் யேகோவாவாயும், புதிய ஏற்பாட்டின் மேசியாவாகவும் இருந்தார். அவரது பிதாவின்
  வழிநடத்துதலின்படி அவர் பூமியின் சிருஷ்டிகரானார், “சகலமும் அவர் மூலமாய் உண்டாயிற்று; உண்டானதொன்றும் அவராலேயல்லாமல்
  உண்டாகவில்லை” (யோவான் 1:3). பாவமற்ற போதிலும், எல்லா நீதியையும் நிறைவேற்ற அவர் ஞானஸ்நானம் பெற்றார். அவர்
  “நன்மை செய்கிறவராய் சுற்றித்திரிந்தார்”. (அப்போஸ் 10:38), எனினும் அவர் அதற்காக இகழப்பட்டார். அவரது சுவிசேஷம்,
  சமாதானம் மற்றும், நன்மை செய்வதன் செய்தியாகும். எல்லோரையும் அவரது முன்மாதிரியைப் பின்பற்றும்படி அவர்
  வேண்டினார். அவர் பாலஸ்தீனத்தின் சாலைகளில் நடந்து பிணியாளிகளைச் சுகமாக்கி, குருடரைப் பார்வை பெறச் செய்து,
  மரித்தோரை உயிரோடெழுப்பினார். அவர் நித்தியத்தின் சத்தியங்கள், அநித்தியத்துக்கு முந்தைய நமது வாழ்க்கையின்
  உண்மை நிலை, இப்பூமியில் நமது வாழ்க்கையின் நோக்கம், வரப் போகிற வாழ்க்கையில் தேவனுடைய குமாரர்கள் மற்றும்
  குமாரத்திகளுக்கு காத்திருப்பவை குறித்தும் போதித்தார்.
- அவரது மாபெரும் பாவ நிவாரண பலியின் நினைவு கூருதலாக திருவிருந்தை அவர் ஏற்படுத்தினார். அவர் கைது செய்யப்பட்டு,
  பொய்யான குற்றச்சாட்டுகள் சுமத்தப்பட்டு, ஒரு ஜனக்கூட்டத்தைத் திருப்திப்படுத்திட குற்றவாளியாக்கப்பட்டு,
  கல்வாரி சிலுவையில் மரிக்க வேண்டுமென தண்டிக்கப்பட்டார். அனைத்து மனுக்குலத்தின் பாவங்களுக்காக பாவ நிவர்த்தி
  செய்திட தனது ஜீவனைக் கொடுத்தார். அவர் செய்தது இந்த பூமியில் எக்காலத்திலும் ஜீவிக்கும் எல்லோருக்கும்
  செய்யப்படுகிற ஒரு மாபெரும் பதிலி வரமாயிருந்தது.
- பெத்லகேமில் ஆரம்பமாகாத, அல்லது கல்வாரியில் நிறைவடையாத அவரது ஜீவியம், அனைத்து மனித வரலாற்றுக்கும் மையமாயிருக்கிறது,
  என பயபக்தியோடு நாங்கள் சாட்சியமளிக்கிறோம். அவரே பிதாவின் முதற்பேறானவரும், மாமிசத்தில் வந்த ஒரே பேறான
  குமாரனும், உலகத்தின் மீட்பருமானவர்.
- அவர் மரித்தோரிலிருந்தெழும்பி “நித்திரையடைந்தவர்களில் முதற்பலனானார்” (1 கொரி. 15:20). உயிர்த்தெழுந்த
  கர்த்தராய், தன் ஜீவியத்தின்போது நேசித்தவர்களை அவர் சந்தித்தார். பூர்வ அமெரிக்காவிலுள்ள தனது “பிற ஆடுகளின்”
  மத்தியிலும் அவர் ஊழியம் செய்தார். (யோவான் 10:16). இந்த நவீன உலகத்தில் அவரும், அவரது பிதாவும், சிறுவனாகிய
  ஜோசப் ஸ்மித்துக்கு “காலங்களின் நிறைவேறுதலின் சகாப்தம்” என்று நீண்ட காலத்துக்கு முன்னே வாக்குத்தத்தம்
  செய்யப்பட்டதை ஆரம்பித்து வைக்க தரிசனமானார்கள் (எபேசியர் 1:10).
- 'ஜீவனுள்ள கிறிஸ்துவைக் குறித்து தீர்க்கதரிசி ஜோசப் எழுதியதாவது: “அவரது கண்கள் அக்கினி ஜூவாலையைப் போன்றிருந்தன;
  அவரது சிரசின் கேசம் தூய பனியைப் போன்ற வெண்மையாயிருந்தது; அவரது முகரூபம் சூரியனுடைய பிரகாசத்திலும் அதிகமாய்
  பிரகாசித்தது; அவரது குரல் கொந்தளிக்கிற ஜலப்பிரவாகத்தின் சத்தத்தைப் போலிருந்தது. யேகோவாவின் சத்தம் சொன்னது:'
- “நானே ஆதியும் அந்தமுமாயிருக்கிறேன்; நானே ஜீவிக்கிறவராயிருக்கிறேன்; நானே கொலை செய்யப்பட்டவர்; நானே பிதாவிடம்
  உங்கள் மத்தியஸ்தராயிருக்கிறேன்”. (கோ.உ 110:3–4).
- 'அவரைக் குறித்து தீர்க்கதரிசி மேலும் அறிவித்தார் “இப்பொழுது அவரைப்பற்றி கொடுக்கப்பட்ட அநேக சாட்சிகளுக்குப்
  பின்னர், எல்லாவற்றுக்கும் கடைசியாக நாங்கள் கொடுக்கும் சாட்சி இதுவே: அவர் ஜீவிக்கிறார்!'
- “ஏனெனில் தேவனின் வலது பாரிசத்தில் நாங்கள் அவரைக் கண்டோம். பிதாவின் ஒரே பேறானவர் அவரே என்று சாட்சி கொடுத்த
  குரலை நாங்கள் கேட்டோம்.
- “அவரால், அவர் மூலமாக, அவரைக்கொண்டு உலகங்கள் சிருஷ்டிக்கப்படுகின்றன, சிருஷ்டிக்கப்பட்டன, மேலும் அதன்
  குடிகள் தேவனின் பேறான புத்திரர்களும் புத்திரிகளுமாக இருக்கிறார்கள்” (கோ.உ 76:22–24).
- அவரது ஆசாரியத்துவமும், அவரது சபையும் பூமியில் மறுஸ்தாபிதம் செய்யப்பட்டிருக்கிறதெனவும், “அப்போஸ்தலர்,
  தீர்க்கதரிசிகளென்பவர்களுடைய அஸ்திபாரத்தின் மேல் கட்டப்பட்டவர்களுமாயிருக்கிறீர்கள், அதற்கு இயேசு கிறிஸ்து
  தாமே மூலைக்கல்லாயிருக்கிறார்” (எபேசியர் 2:20) என்றும் பயபக்தியான வார்த்தைகளில் நாங்கள் அறிவிக்கிறோம்.
- ஓர் நாள் அவர் பூமிக்குத் திரும்பவும் வருவார் என நாங்கள் சாட்சியமளிக்கிறோம். “கர்த்தரின் மகிமை வெளியரங்கமாகும்,
  மாம்சமான யாவும் அதை ஏகமாய்க் காணும்” (ஏசாயா 40:5). அவர் இராஜாதி இராஜாவாய் ஆட்சி செய்வார்; கர்த்தாதி
  கர்த்தாவாய் இராஜ்யபாரம் பண்ணுவார்; முழங்கால் யாவும் அவருக்கு முன்பாக முடங்கும்; நாவுகள் யாவும் அவர்
  சமுகத்தில் ஆராதித்து பேசும்; நாம் ஒவ்வொருவரும் நம்முடைய கிரியைகளின் படியேயும், நம்முடைய இருதயங்களின்
  வாஞ்சைகளின் படியேயும் அவரைக் கொண்டு நியாயந் தீர்க்கப்பட நிற்போம்.
- முறையாக நியமிக்கப்பட்ட அவரது அப்போஸ்தலர்களாகிய நாங்கள், இயேசுவே ஜீவிக்கிற கிறிஸ்து; அழிவற்ற தேவகுமாரன்
  என்று சாட்சியமளிக்கிறோம். இன்றைக்கு பிதாவின் வலது பாரிசத்தில் நிற்கிற அவரே அந்த மகத்துவமான இம்மானுவேல்
  இராஜா. அவரே உலகத்தின் ஒளியும், ஜீவனும், நம்பிக்கையுமாயிருக்கிறார். அவரது வழியே இந்த ஜீவியத்திலுள்ள மகிழ்ச்சிக்கும்,
  வரப்போகிற உலகத்திலுள்ள நித்திய ஜீவனுக்கும் வழிநடத்துகிற பாதையாயிருக்கிறது. அவரது தெய்வீக குமாரனின் ஒப்பற்ற
  ஈவுக்காக தேவன் நன்றி செலுத்தப்படுவாராக.
date: ஜனவரி 1, 2000
