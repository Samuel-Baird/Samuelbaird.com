title: Ang Buhay na Cristo
subtitle: Ang Patotoo ng mga Apostol
author: Ang Simbahan ni Jesucristo ng mga Banal sa mga Huling Araw
paragraphs:
- Habang ipinagdiriwang natin ang pagsilang ni Jesucristo dalawang libong taon na ang nakararaan, iniaalay
  namin ang aming patotoo tungkol sa katotohanan ng Kanyang hindi mapapantayang buhay at ang walang hanggang
  kapangyarihan ng Kanyang dakilang mapagbayad-salang sakripisyo. Walang sinuman ang nakapagbigay ng gayong
  makahulugang impluwensiya sa lahat ng nabuhay na at sa lahat ng mabubuhay pa sa mundo.
- Siya ang Dakilang Jehova ng Lumang Tipan, at ang Mesiyas ng Bago. Sa ilalim ng pamamahala ng Kanyang
  Ama, Siya ang manlilikha ng daigdig. “Ang lahat ng mga bagay ay ginawa niya; at alin man sa lahat ng
  ginawa ay hindi ginawa kung wala siya” (Juan 1:3). Bagaman siya ay walang kasalanan, bininyagan siya
  upang gawin ang buong katuwiran. Siya ay “naglilibot na gumagawa ng mabuti” (Ang Mga Gawa 10:38), gayon
  pa man ay kinamuhian siya dahil dito. Ang Kanyang ebanghelyo ay mensahe ng kapayapaan at mabuting balita.
  Nakiusap Siya sa lahat na sumunod sa Kanyang halimbawa. Binagtas niya ang mga daan sa Palestina na nanggagamot
  ng maysakit, nagbibigay ng paningin sa bulag, at nagpapabangon ng patay. Itinuro Niya ang katotohanan
  tungkol sa kawalang-hanggan, ang katotohanan tungkol sa buhay natin bago tayo nabuhay sa mundo, ang
  layunin ng buhay natin sa mundo, at ang potensiyal ng mga anak na lalaki at babae ng Diyos sa buhay
  na darating.
- Pinasimulan Niya ang sakramento bilang paalaala sa Kanyang dakilang mapagbayad-salang sakripisyo. Dinakip
  Siya at tinuligsa batay sa mga maling paratang, pinarusahan upang mabigyang-kasiyahan ang mga mandurumog,
  at hinatulan ng kamatayan sa krus ng Kalbaryo. Inialay Niya ang Kanyang buhay para sa kasalanan ng lahat
  ng sangkatauhan. Siya ang dakilang kaloob para sa lahat ng mabubuhay sa ibabaw ng mundo.
- Taimtim kaming nagpapatotoo na ang Kanyang buhay, na siyang tampulan ng buong kasaysayan ng sangkatauhan,
  ay hindi nagsimula sa Betlehem o nagtapos sa Kalbaryo. Siya ang Panganay ng Ama, ang Bugtong na Anak
  sa laman, ang Manunubos ng daigdig.
- Nagbangon Siya sa libingan upang “maging pangunahing bunga ng nangatutulog” (1 Mga Taga-Corinto 15:20).
  Bilang Nabuhay na Mag-uling Panginoon, dumalaw Siya sa mga taong minahal Niya noong nabubuhay pa Siya
  sa lupa. Naglingkod din Siya sa Kanyang “ibang mga tupa” (Juan 10:16) sa sinaunang Amerika. Sa makabagong
  daigdig, Siya at ang Kanyang Ama ay nagpakita sa batang si Joseph Smith, upang pasimulan ang matagal
  nang ipinangakong “kaganapan ng mga panahon” (Mga Taga-Efeso 1:10).
- 'Tungkol sa Buhay na Cristo, isinulat ng Propetang Joseph: “Ang kanyang mga mata ay gaya ng ningas ng
  apoy; ang buhok sa kanyang ulo ay puti gaya ng busilak na niyebe; ang kanyang mukha ay nagniningning
  nang higit pa sa liwanag ng araw; at ang kanyang tinig ay gaya ng lagaslas ng malalawak na tubig, maging
  ang tinig ni Jehova, na nagsasabing:'
- “Ako ang una at ang huli; ako ang siyang nabuhay, ako ang siyang pinaslang; ako ang inyong tagapamagitan
  sa Ama” (Doktrina at mga Tipan 110:3–4).
- 'Tungkol sa Kanya ay ipinahayag rin ng Propeta: “At ngayon, matapos ang maraming patotoo na ibinigay
  hinggil sa kanya, ito ang patotoo, na pinakahuli sa lahat, na aming ibibigay tungkol sa kanya: Na siya
  ay buhay!'
- “Sapagkat siya ay aming nakita, maging sa kanang kamay ng Diyos; at aming narinig ang tinig na nagpapatotoo
  na siya ang Bugtong na Anak ng Ama—
- “Na sa kanya, at sa pamamagitan niya, at mula sa kanya, ang mga daigdig ay nililikha at nalikha, at
  ang mga naninirahan dito ay mga isinilang na anak na lalaki at babae ng Diyos” (Doktrina at mga Tipan
  76:22–24).
- Ipinahahayag namin nang taimtim na ang Kanyang pagkasaserdote at Kanyang Simbahan ay ipinanumbalik na
  sa mundo na—“itinatayo sa ibabaw ng kinasasaligan ng mga apostol, at ng mga propeta, na si Cristo Jesus
  din ang pangulong bato na panulok” (Mga Taga-Efeso 2:20).
- Nagpapatotoo kami na darating ang panahon na babalik Siyang muli sa mundo. “At ang kaluwalhatian ng
  Panginoon ay mahahayag, at makikitang magkakasama ng lahat na tao” (Isaias 40:5). Mamamahala siya bilang
  Hari ng mga Hari at maghahari bilang Panginoon ng mga Panginoon, ang bawat tuhod ay luluhod at ang bawat
  dila ay magpapahayag sa pagsamba sa Kanya. At bawat isa sa atin ay tatayo upang hatulan Niya ayon sa
  ating mga gawa at naisin ng ating mga puso.
- Nagpapatotoo kami, bilang Kanyang marapat na inordenan na mga Apostol—na si Jesus ang Buhay na Cristo,
  ang walang kamatayang Anak ng Diyos. Siya ang dakilang Haring Emmanuel, na ngayon ay nakatayo sa kanang
  kamay ng Kanyang Ama. Siya ang liwanag, ang buhay, at pag-asa ng mundo. Siya ang daan na naghahatid
  sa kaligayahan sa buhay na ito at buhay na walang hanggan sa daigdig na darating. Salamat sa Diyos sa
  Kanyang walang kapantay na kaloob na Kanyang banal na Anak.
