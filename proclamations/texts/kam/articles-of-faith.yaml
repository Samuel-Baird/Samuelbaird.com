title: Ilungu sya Mũĩkĩĩo sya Ĩkanisa ya Yesũ Klĩsto ya Atheu ma Mĩthenya ya Mũminũkĩlyo
subtitle: ''
author: ''
verses:
- n: 1
  text: Nĩtũĩkĩĩaa nthĩnĩ wa Ngai, Asa wa Tene na Tene, na nthĩnĩ wa Mwana Wake Yesũ Klĩsto, na nthĩnĩ
    wa Veva Mũtheu.
- n: 2
  text: Nĩtũĩkĩĩaa kana andũ makasilĩlwa kwondũ wa naĩ syoo ene, na tiũndũ wa ĩvĩtyo ya Atamu.
- n: 3
  text: Nĩtũĩkĩĩaa kana kwĩsĩla nthĩnĩ wa Wĩw’anĩthyo wa Klĩsto, andũ onthe nĩmatonya kũtangĩĩwa, kwa
    wĩwi wa mĩao na maũtw’io ma Ũvoo Mũseo.
- n: 4
  text: 'Nĩtũĩkĩĩaa kana maũmanyĩsyo na maũtw’io ma mbee ma Ũvoo Mũseo nĩ: mbee, Mũĩkĩĩo nthĩnĩ wa Mwĩaĩi
    Yesũ Klĩsto; kelĩ, Kũalyũla Ngoo; katatũ, Ũvatiso kwa kũindwa kwondũ wa ũekeo wa naĩ; kana, Kwilĩĩlwa
    kwa moko kwondũ wa mũthĩnzĩo wa Veva Mũtheu.'
- n: 5
  text: Nĩtũĩkĩĩaa kana mũndũũme no nginya etwe nĩ Ngai, kwĩsĩla wathani, na kwilĩĩlwa kwa moko nĩ ala
    mena ũkũmũ, nĩkana atavanie Ũvoo Mũseo na kũtũmĩka nthĩnĩ wa maũtw’io ala mevo.
- n: 6
  text: Nĩtũĩkĩĩaa nthĩnĩ wa walany’o ũla waĩvo Ĩkanisanĩ ya Tene, ta, atũmwa, athani, aĩthi, amanyĩsya,
    atavania ma ũvoo mũseo, na angĩ.
- n: 7
  text: Nĩtũĩkĩĩaa nthĩnĩ wa mũthĩnzĩo wa ithyomo, wathani, ũvuany’o, mawoni, ũvosyo, ũalyũlo wa ithyomo,
    na angĩ.
- n: 8
  text: Nĩtũĩkĩĩaa Mbivilia kwĩthĩwa yĩ ndeto ya Ngai ethĩwa nĩmbalyũle kwa ũw’o; na ĩngĩ nĩtũĩkĩĩaa Ĩvuku
    ya Momoni kwĩthĩwa yĩ ndeto ya Ngai.
- n: 9
  text: Nĩtũĩkĩĩaa kĩla kyonthe Ngai ũvuanĩtye, na kĩla kyonthe Ekũvuany’a yu, na nĩtũĩkĩĩa kana Nũkũthi
    kũvuany’a maũndũ manene na mavata makonetye Ũsumbĩ wa Ngai.
- n: 10
  text: Nĩtũĩkĩĩaa nthĩnĩ wa wũmbany’a wa Isilaeli na kũtũngĩĩwa kwa Mbaĩ ila Ĩkũmi; kana Saioni (Yelusaleme
    Nzaũ) ĩkaakwa ĩlembetanĩ ya Amelika; kana Klĩsto akasumbĩka ewe mwene ĩũlũ wa nthĩ; na kana nthĩ ĩkaalyũlwa
    na kũkwata ũtheu wa Ũseonĩ.
- n: 11
  text: Nĩtũwetaa kwĩthĩwa na ĩvuso ya kũmũthaitha Ngai Mwene ũtonyi kwĩanana na welekelyo wa wasya wa
    ngoo sitũ, na kũmaekea andũ onthe kwĩthĩwa na ĩvuso oyĩu, eka mathaithe oũndũ, ovala, kana okĩla mekwenda.
- n: 12
  text: Nĩtũĩkĩĩaa kwĩthĩwa twĩ uungu wa asumbĩ, atongoi, asumbĩki, na ala mena ũkũmũ wa kũsilĩla, nthĩnĩ
    wa wĩwi, kũnenga ndaĩa, na kũtw’ĩkĩla mĩao.
- n: 13
  text: Nĩtũĩkĩĩaa nthĩnĩ wa kwĩthĩwa twĩ aĩkĩĩku, maw’o, ma mĩkalĩle mĩtheu, alau, aĩlu, na nthĩnĩ wa
    kwĩka ũseo kwa andũ onthe; na ũw’o ki, notwasye kana nĩtũatĩĩaa ũtai wa Vaũlo—Nĩtũĩkĩĩaa maũndũ onthe,
    nĩtwĩĩkwatasya maũndũ onthe, nĩtũmĩĩsye maũndũ maingĩ, na twĩĩkwatĩsya kwĩthĩwa tũtonya kũmĩĩsya maũndũ
    onthe. Ethĩwa ve ũndũ ona wĩva mwaĩlu, wa kwendeesya, kana wa nguma nzeo kana ũkumw’a, nĩtũmanthaa
    syĩndũ ii.
signature: Joseph Smith.
