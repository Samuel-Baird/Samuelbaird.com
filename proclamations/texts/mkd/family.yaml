title: Семејството
subtitle: Проглас кон Светот
author: Првото Претседателство и Советот на Дванаесетте Апостоли на Црквата на Исус Христос на Светците
  од Подоцнежните Дни.
note: Овој проглас беше прочитан од Претседател Гордон Б. Хинкли како дел од неговата порака на Генералниот
  Состанок на Здружение за Помош одржан на 23 Септември, 1995, во Солт Лејк Сити, Јута.
paragraphs:
- Ние, Првото Претседателство и Советот на Дванаесетте Апостоли на Црквата на Исус Христос на Светците
  од Подоцнежните Дни, свечено објавуваме дека бракот помеѓу еден маж и една жена е одреден од Бог и дека
  семејството е во центарот на планот на Создавачот за вечната судбина на Неговите деца.
- Сите човечки суштества—машки и женски—се создадени според ликот на Бог. Секој е возљубен духовен син
  или ќерка од небесни родители, и, како такви, секој има божествена природа и судбина. Полот е суштинска
  карактеристика на индивидуалните предсмртни, смртни, и вечни идентитет и цел.
- Во предсмртното царство, духовните синови и ќерки го знаеја и обожаваа Бог како нивен Вечен Отец и го
  прифатија Неговиот план преку кој Неговите деца би можеле да добијат физичко тело и да стекнат земно
  искуство да напредуваат кон совршеност и конечно да ја реализираат нивната вечна божествена судбина
  како наследници на вечен живот. Божествениот план за среќа им овозможува на семејните врски да бидат
  овековечени вон гробот. Светите обреди и завети достапни во светите храмови овозможуваат за индивидуалците
  да се вратат во присуството на Бог а за семејствата да бидат обединети вечно.
- Првата заповед која Бог им ја даде на Адам и Ева се однесуваше на нивниот потенцијал за родителство
  како сопруг и сопруга. Објавуваме дека заповедта на Бог за Неговите деца за да се размножуваат и да
  ја исполнат земјата останува на сила. Понатаму објавуваме дека Бог заповедал дека светите моќи за создавање
  потомство треба да се применуваат само помеѓу маж и жена, законски венчани како сопруг и сопруга.
- Ние го објавуваме начинот преку кој смртниот живот е создаден да биде божествено определен. Ја потврдуваме
  светоста на животот и неговата важност во вечниот план на Бог.
- Сопруг и сопруга имаат свечена одговорност да се љубат и грижат едни за други и за нивните деца. „Децата
  се наследство од Господ“ (Псалми 127:3). Родителите имаат света должност да ги одгледаат нивните деца
  со љубов и праведност, да обезбедат за нивните физички и духовни потреби, и да ги научат да љубат и
  да служат едни со други, да ги запазуваат заповедите на Бог, и да бидат граѓани кои се придржуваат до
  законот каде и да живеат. Сопруг и сопруга—мајки и татковци—ќе бидат одговорни пред Бог за изведувањето
  на овие обврски.
- Семејството е одредено од Бог. Бракот помеѓу маж и жена е суштински за Неговиот вечен план. Децата имаат
  право да бидат родени во врската на бракот, и да бидат одгледани од татко и мајка кои ги почитуваат
  брачните заклетви со комплетна верност. Среќата во семејниот живот е најверојатно да биде остварена
  кога е основана врз учењата на Господ Исус Христос. Успешни семејства и бракови се воспоставени и одржани
  на принципи на вера, молитва, покајание, простување, почит, љубов, сочувство, работа, и здрави рекреативни
  активности. Преку божествен план, татковците претседаваат врз нивните семејства со љубов и праведност
  и се одговорни да ги обезбедат потребите за живот и заштита на нивните семејства. Мајките се главно
  одговорни за негувањето на нивните деца. Во овие свети обврски, татковците и мајките се обврзани да
  си помагаат едни со други како еднакви партнери. Неспособност, смрт, или други околности може да бараат
  индивидуална адаптација. Далечните семејства треба да пружат поддршка кога е потребно.
- Предупредуваме дека индивидуалци кои ги прекршуваат заветите за чедност, кои злоупотребуваат сопружник
  или потомство, или кои не успеваат да ги исполнат семејните одговорности еден ден ќе стојат одговорни
  пред Бог. Понатаму, предупредуваме дека растурањето на семејството ќе донесе врз индивидуалци, заедници,
  и нации катастрофи претскажани од древните и модерните пророци.
- Ги повикуваме одговорните граѓани и службеници на владата насекаде да ги промовираат тие мерки дизајнирани
  да го одржат и зацврстат семејството како основна единица на општеството.
