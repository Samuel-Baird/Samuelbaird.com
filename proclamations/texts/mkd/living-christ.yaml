title: Живиот Христос
subtitle: Сведоштвото на Апостолите
author: Црквата на Исус Христос на Светците од Подоцнежните Дни
paragraphs:
- Додека го одбележуваме раѓањето на Исус Христос пред два милениуми, ние го нудиме нашето сведоштво за
  реалноста за Неговиот неспоредлив живот и неограничената доблест на Неговата голема помирувачка жртва.
  Ниту еден друг немал толку длабоко влијание врз сите кои живееле и кои допрва ќе живеат на земјата.
- Тој беше Големиот Јехова на Стариот Завет, Месијата на Новиот. Под водство од Неговиот Отец, Тој беше
  создавач на земјата. „Сите нешта беа создадени од Него; и без Него ништо не беше создадено од тоа што
  беше создадено“ (Јован 1:3). Иако безгрешен, Тој беше крстен да ја исполни сета праведност. „Тој одеше
  наоколу правејќи добро“ (Дела 10:38), сепак беше презиран за тоа. Неговото евангелие беше порака за
  мир и добра волја. Тој ги замоли сите да го следат Неговиот пример. Тој чекореше по патиштата на Палестина,
  исцелувајќи ги болните, овозможувајќи на слепите да прогледаат, и оживувајќи ги мртвите. Тој поучуваше
  за вистините на вечноста, реалноста на нашето предсмртно постоење, целта на нашиот живот на земјата,
  и можностите за синовите и ќерките на Бог во животот што следи.
- Тој го воспостави сакраментот како потсетник на Неговата голема помирувачка жртва. Тој беше уапсен и
  обвинет за лажни обвиненија, обвинет да се задоволи толпа, и осуден да умре на крстот на Голгота. Тој
  го даде Неговиот живот да се помири за гревовите на сето човештво. Неговиот беше голем и произлезен
  дар во името на сите кои некогаш ќе живеат на земјата.
- Ние свечено сведочиме дека Неговиот живот, што е во центарот на целата човечка историја, ниту започна
  во Витлеем ниту заврши на Голгота. Тој беше Првородениот од Отецот, Единородениот Син во телото, Искупителот
  на светот.
- Тој се крена од гробот да „стане прв плод на оние кои спиеја“ (1 Коринтјаните 15:20). Како Воскреснат
  Господ, Тој ги посети оние кои беше ги љубел во животот. Тој исто така служеше помеѓу Неговите „други
  овци“ (Јован 10:16) во древна Америка. Во современиот свет, Тој и Неговиот Отец му се појавија на момчето
  Џозеф Смит, воведувајќи го долговетуваното „уредување за целината на времињата“ (Ефесјаните 1:10).
- 'За Живиот Христос, Пророкот Џозеф напиша: „Неговите очи беа како огнен пламен; косата на неговата глава
  беше бела како чиста снег; Неговиот лик сјаеше повеќе од осветленоста на сонцето; и Неговиот глас беше
  како звукот на течението на големите води, и тоа гласот на Јехова, велејќи:'
- „Јас сум првиот и последниот; Јас сум Тој што живее, Јас сум Тој што беше убиен; Јас сум вашиот адвокат
  со Отецот“ (УИЗ 110:3–4).
- 'За Него Пророкот исто објави: „И сега, после многу сведоштва кои беа дадени за Него, ова е сведоштвото,
  последно од сите, кое ние го даваме за Него: Дека Тој живее!'
- „Зашто ние го видовме, и тоа од десната страна на Бог; и го слушнавме гласот како води запис дека Тој
  е Единородениот од Отецот—
- „Дека преку Него, и низ Него, и од Него, световите се и беа создадени, и тамошните жители се родени
  синови и ќерки на Бог“ (УИЗ 76:22–24).
- Ние објавуваме со свечени зборови дека Неговото свештенство и Неговата Црква беа обновени на земјата—„изградени
  врз основата на…апостоли и пророци, Исус Христос самиот како главен камен темелник“ (Ефесјаните 2:20).
- Ние сведочиме дека Тој еден ден ќе се врати на земјата. „И славата на Господ ќе биде откриена, и сите
  луѓе ќе ја видат заедно“ (Исаија 40:5). Тој ќе господари како Цар над Царевите и ќе владее како Господ
  над Господарите, и секое колено ќе клекне и секој јазик ќе зборува со богослужба пред Него. Секој од
  нас ќе стои да биде суден од Него според нашите дела и желбите на нашето срце.
- Ние сведочиме, како Негови соодветно ракоположени Апостоли—дека Исус е Живиот Христос, бесмртниот Син
  на Бог. Тој е големиот Цар Имануел, кој денес стои на десната страна на Неговиот Отец. Тој е светлината,
  животот, и надежта на светот. Неговиот начин е патот кој води до среќа во овој живот и вечен живот во
  светот што следи. Да Му се заблагодариме на Бог за неспоредливиот дар на Неговиот божествен Син.
