title: Обновата на Целината на Евангелието на Исус Христос
subtitle: Двестегодишен Проглас кон Светот
author: Првото Претседателство и Советот на Дванаесет Апостоли на Црквата на Исус Христос на Светците
  од Подоцнежните Дни
note: Овој проглас го прочита Претседателот Расел М. Нелсон како дел на неговата порака на 190-та Годишна
  Генерална Конференција, Април 5, 2020, во Солт Лејк Сити, Јута.
paragraphs:
- Ние свечено прогласуваме дека Бог ги љуби сите Негови деца во секоја нација на светот. Бог Отецот ни
  го дал божественото раѓање, неспоредливиот живот, и неограничената помирувачка жртва на Неговиот Возљубен
  Син, Исус Христос. Со моќта на Отецот, Исус стана повторно и ја стекна победата врз смртта. Тој е наш
  Спасител, нашиот Пример, и нашиот Искупител.
- Пред двесте години, на убаво пролетно утро во 1820, младиот Џозеф Смит, барајќи да дознае на која Црква
  да ѝ се придружи, отиде во шумата да се моли близу до неговиот дом во северната држава Њујорк, САД.
  Тој имаше прашања во врска со спасението на неговата душа и веруваше дека Бог би го насочил.
- Со понизност, објавуваме дека како одговор на неговата молитва, Бог Отецот и Неговиот Син, Исус Христос,
  му се појавија на Џозеф и го воспоставија „обновувањето на сите нешта“ (Дела 3:21) како што е претскажано
  во Библијата. Во оваа визија, тој научи дека после смртта на првобитните Апостоли, Црквата на Новиот
  Завет на Христос беше загубена од земјата. Џозеф би бил од помош во нејзиното враќање.
- Ние потврдуваме дека под упатство на Отецот и Синот, небесни гласници дојдоа да му дадат инструкции
  на Џозеф и повторно да ја воспостават Црквата на Исус Христос. Воскреснатиот Јован Крстител ја обновил
  власта за да крштава преку потопување за опростувањето на гревови. Тројца од првобитните дванаесет Апостоли—Петар,
  Јаков, и Јован—ги обновија апостолството и клучевите на свештенската власт. Други дојдоа исто така,
  вклучувајќи го Илија, кој ја обнови власта да спојува семејства заедно во вечни врски кои надминуваат
  смрт.
- 'Ние понатаму сведочиме дека на Џозеф Смит му беше даден дар и моќ од Бог да преведе еден древен запис:
  Книгата на Мормон—Уште Едно Сведоштво на Исус Христос. Страници на овој свет текст содржат извештај
  за личното служење на Исус Христос помеѓу луѓето на Западната Хемисфера наскоро после Неговото Воскреснување.
  Поучува за целта на животот и го објаснува учењето на Христос, кое е во ценатрот на таа цел. Како придружно
  свето писмо на Библијата, Книгата на Мормон сведочи дека сите човечки суштества се синови и ќерки на
  прекрасен Отец на Небесата, дека Тој има божествен план за нашите животи, и дека Неговиот Син, Исус
  Христос, зборува денес исто како и во старите денови.'
- Ние објавуваме дека Црквата на Исус Христос на Светците од Подоцнежните Дни, организирана на 6 Април,
  1830, е обновената Црква на Новиот Завет на Христос. Оваа Црква е укотвена во совршениот живот на нејзиниот
  камен темелник, Исус Христос, и Неговото неограничено Помирување и буквално Воскреснување. Исус Христос
  уште еднаш повика Апостоли и им даде свештенска власт. Тој нѐ поканува сите нас да дојдеме при Него
  и Неговата Црква, да Го примиме Светиот Дух, обредите за спасение, и да добиеме постојана радост.
- Двесте години поминаа откако оваа Обнова беше започната од Бог Отецот и Неговиот Возљубен Син, Исус
  Христос. Милиони низ светот го прифатија знаењето за овие пророкувани настани.
- Ние со задоволство објавуваме дека ветената Обнова продолжува понатаму преку постојано откровение. Земјата
  никогаш нема да биде иста, бидејќи Бог „ќе ги собере во едно сите нешта во Христос“ (Ефесјаните 1:10).
- Со препорака и благодарност, ние како Негови Апостоли ги покануваме сите да знаат—како што ние знаеме—дека
  небесата е отворена. Ние потврдуваме дека Бог ја открива Неговата волја за Неговите возљубени синови
  и ќерки. Ние сведочиме дека оние кои молитвено ја проучуваат пораката на Обновата и дејствуваат со вера
  ќе бидат благословени да добијат сопствено сведоштво за нејзината божественост и цел да го подготви
  светот за ветеното Второ Доаѓање на нашиот Господ и Спасител, Исус Христос.
