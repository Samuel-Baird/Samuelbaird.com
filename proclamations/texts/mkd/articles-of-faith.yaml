title: Поставки на верата
subtitle: на Црквата на Исус Христос на Светците од Подоцнежните Дни
author: ''
verses:
- n: 1
  text: Веруваме во Бога, Вечниот Отец, и во Неговиот Син Исус Христос и во Светиот Дух.
- n: 2
  text: Веруваме дека луѓето ќе бидат казнети поради сопствените гревови, а не поради престапот на Адам.
- n: 3
  text: Веруваме дека преку помирението на Христос, сите луѓе можат да бидат спасени преку покорување
    на законите и обредите на Евангелието.
- n: 4
  text: 'Веруваме дека првите принципи и обреди на Евангелието се: прво, вера во Господ Исус Христос;
    второ, покајание; трето, крштавање со потопување за ослободување од гревовите; четврто, ракополагање
    за дарот на Светиот Дух.'
- n: 5
  text: Веруваме дека човекот мора да биде повикан од Бога, преку пророштво и ракополагање од оние што
    имаат овластување, за да го проповеда Евангелието и да ги извршува неговите обреди.
- n: 6
  text: Веруваме во истото устројство што постоеше во првобитната Црква и тоа апостоли, пророци, пастири,
    учители, евангелисти и така натаму.
- n: 7
  text: Веруваме во дар за јазици, пророштво, откровение, виденија, исцелување, толкување на јазици и
    така натаму.
- n: 8
  text: Веруваме дека Библијата е словото на Бога, до онаа мера до која е преведена точно; исто така,
    веруваме дека Книгата на Мормон е словото на Бога.
- n: 9
  text: Веруваме во сѐ што откриваше Бог, во сѐ што открива сега и веруваме дека Тој допрва ќе открие
    многу големи и важни нешта за царството Божјо.
- n: 10
  text: Веруваме во буквално собирање на Израил и во обновувањето на десетте племиња; веруваме дека Сион
    (Новиот Ерусалим) ќе биде изграден на американскиот континент; дека Христос лично ќе управува на земјата;
    и дека земјата ќе биде обновена и ќе ја прими својата рајска слава.
- n: 11
  text: Полагаме право на привилегијата да Му се поклонуваме на Семоќниот Бог, според гласот на нашата
    сопствена совест, и да им ја допуштиме на сите луѓе истата привилегија, да им допуштиме да се поклонуваат
    на свој начин, во свое место и како што можат.
- n: 12
  text: Веруваме дека сме под управа на кралеви, претседатели, управители и чиновници, покорни сме на
    законот, го почитуваме и го поддржуваме.
- n: 13
  text: Веруваме дека треба да бидеме чесни, верни, морално чисти, добронамерни, доблесни и да им правиме
    добро на сите луѓе; всушност, можеме да речеме дека ја почитуваме опомената на Павле—веруваме во сѐ,
    се надеваме на сѐ, многу сме истрпеле и се надеваме дека ќе бидеме способни сѐ да истрпиме. Ако постои
    нешто доблесно, љубезно, што е наречено добро или достојно за пофалба, ние го бараме тоа.
signature: Џозеф Смит.
