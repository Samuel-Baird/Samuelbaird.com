title: येशू ख्रीष्टको सुसमचारको पूर्णताको पुनर्स्थापना
subtitle: संसारका लागि द्विशतवार्षिक घोषणा
author: पछिल्ला दिनका सन्तहरूको येशू ख्रीष्टको चर्चका प्रथम अध्यक्षता र बाह्र प्रेरितहरूको परिषद
note: आदर र आभारका साथ, उहाँको प्रेरितको रुपमा स्वर्ग खुलेको छ भन्ने—हामीलाई थाहा भए जस्तै—सबैलाई थाहा
  पाउन निम्त्याउछौं। हामी पुष्टि गर्दछौं की आफ्ना छोराहरू र छोरीहरूलाई परमेश्वरले आफ्नो इच्छा ज्ञात गराउनुभएको
  छ। हामी गवाही दिन्छौं कि जसले प्रार्थनापूर्वक पूनर्स्थापनाको सन्देशलाई अध्ययन गर्दछ र विश्वासमा कार्य
  गर्दछ उसले आफ्नो दैवी अनि हाम्रा परमप्रभु र मुक्तिदाता, येशू ख्रीष्टको प्रतिज्ञा गरिएको दोस्रो आगमनका
  लागि संसारलाई तयार पार्ने उद्देश्यका बारेमा आफ्नै साक्षी प्राप्त गर्न आशीषित हुनेछन्
paragraphs:
- हामी गम्भीरतापुर्वक घोषणा गर्छौं कि परमेश्वरले संसारका प्रत्येक राष्ट्रमा रहेका आफ्ना सन्तानलाई प्रेम
  गर्नुहुन्छ। परमेश्वर पिताले हामीलाई दैवी जन्म, अतुलनीय जीवन, र अनन्त प्रायश्चित्त प्रदान गर्ने उहाँको
  आफ्नो प्रिय पुत्र येशू ख्रीष्टको वलिदान दिनुभएको छ। पिताको शक्तिद्वारा येशू फेरी उठ्नुभयो र मृत्युमाथि
  विजय प्राप्त गर्नुभयो। उहाँ हाम्रो उद्दारकर्ता, हाम्रो उदाहरण र हाम्रो मुक्तिदाता हुनुहुन्छ।
- दुई सयवर्ष अगाडी, १८२० को बसन्त ऋतुको एक सुन्दर बिहानीमा, कलिलो जोसेफ स्मिथ, कुन चर्चमा सहभागी हुने
  भन्ने जान्न खोज्दै USA को अपस्टेट न्यु योर्कको आफ्नो घर नजिकको सानो बनमा पार्थना गर्न गए। उनीसंग आफ्नो
  जीवात्माको मुक्ति सम्बन्धमा प्रश्नहरू थिए र उनमा विश्वास थियो की परमेश्वरले उनलाई बाटो देखाउनु हुनेछ।
- हामी विनम्र घोषणा गर्छौं की उनको प्रार्थनाको उत्तरमा, परमेश्वर पिता, उहाँको पुत्र येशू ख्रीष्ट जोसेफसामु
  देखिनुभयो र अगमवक्ताहरूले गरेको पूर्व घोषणा जस्तै “सबै थोकको पुनर्स्थापना” को(प्रेरित ३:२१) शिलान्यास
  गर्नुभयो। त्यो दर्शनमा उनले थाहा पाए कि प्रेरितहरूको मृत्यु पछि ख्रीष्टको नयाँ करारको चर्च पृथ्वीवाट
  हरायो। त्यसलाई फेरी फर्काउन जोसेफले धेरै कार्य गर्नुपर्नेछ।
- हामी पुष्टि गर्छौं कि पिता र पुत्रको निर्देशनमा स्वर्गीय दुतहरू जोसेफ स्मिथलाई सिकाउन र येशू ख्रीष्टको
  चर्चको पुनर्स्थापना गर्न आए। पापबाटको छुटकाराका निमित्त निमज्जनद्वारा हुने बप्तिस्माको अधिकारको पुनर्स्थापना
  पुनरुत्थित भएका बप्तिस्मा दिनुहुने यूहन्नाले गरे। मूल बाह्र प्रेरितहरू मध्ये तीन—पत्रुस, याकूब, र यहून्ना—ले
  प्रेरितको अधिकार र पादरित्वको अधिकारका चावीहरूको पुनर्स्थापना गर्न आए। परिवारलाई मृत्यु नाँघेर अनन्त
  सम्बन्धमा बाँध्न सक्ने उपहार र अधिकारको पुनर्स्थापना गर्ने एलियाह सहितका अरू पनि आए।
- 'हामी थप गवाही दिन्छौं कि जोसेफ स्मिथलाई एक प्राचिन इतिहाँस: मोर्मोनको पुस्तक—येशू ख्रीष्टको अर्को करारको
  अनुवाद गर्ने उपहार र शक्ति दिएको थियो। यो पवित्र पुस्तकका पृष्ठहरूमा येशू ख्रीष्टको पुनरुत्थान लगत्तै
  पश्चिमी गोलार्धमा भएका जनहरू माँझको उहाँको सेवाको विवरण समावेश छ। यसले जीवनको उद्धेश्य सिकाउँछ र ख्रीष्टको
  सिद्धान्तको व्याख्या गर्छ, जुन सिद्धान्त जीवनको उद्धेश्यका लागि महत्वपूर्ण छ। बाइबलको जोडी धर्मशास्त्रको
  रुपमा मोर्मोनको पुस्तकले गवाही दिन्छ कि सबै मानव जाति स्वर्गमा रहने मायालु पिताका छोराहरू र छोरीहरू
  हुन्, कि हाम्रो जीवनका लागि उहाँसंग एक दैवी योजना छ, र कि उहाँको पुत्र येशू ख्रीष्ट प्राचिन दिनहरूमा
  जस्तै आजका दिनहरूमा पनि बोल्नुहुन्छ।'
- हामी घोषणा गर्छौं कि १८३० अप्रिल ६ मा संगठित गरिएको पछिल्ला दिनका सन्तहरूको येशू ख्रीष्टको चर्च ख्रीष्टको
  नयाँ करारको चर्चको पुनर्स्थापना हो। यसको प्रमुख आधारशीला येशू ख्रीष्टको सिद्ध जीवन, उहाँको अनन्त प्रायश्चित्त
  र शाब्दिक पुनरुत्थानमा यो चर्च आधारित छ। येशू ख्रीष्टले फेरी एक पटक प्रेरितहरूलाई बोलाउनुभएको छ, र उनीहरूलाई
  पादरित्वको अधिकार दिनुभएको छ। उहाँले हामी सबैलाई उहाँमा र उहाँको चर्चमा आउन, पवित्र आत्माको, मुक्तिका
  विधिहरूको प्राप्त गर्न र सदैव रहने खुशियाली प्राप्त गर्न निम्त्याउनुहुन्छ।
- परमेश्वर पिता र उहाँको प्रिय पुत्र येशू ख्रीष्टले पुनर्स्थापनाको शिलान्यास गरेदेखि अहिलेसम्म दुइ सय
  बर्ष बितेका छन्। संसारभरिका करोडौंले ती अगमवाणी गरिएका घटनाहरूलाई अंगालेका छन्।
- हामी सहर्ष घोषणा गर्छौं कि प्रतिज्ञा गरिएको त्यो पुनर्स्थापना निरन्तर प्रकाश मार्फत अघि बढ्दछ। पृथ्वी
  फेरी पहिले जस्तै कहिल्यै हुनेछैन, किनकि परमेश्वरले “सबै थोकहरू ख्रीष्टको अधिनमा ल्याउनुहुनेछ”(एफिसी
  १:१०).
