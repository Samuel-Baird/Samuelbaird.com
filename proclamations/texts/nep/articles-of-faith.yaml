title: पछिल्ला दिनका सन्तहरूको येशू ख्रीष्टको चर्चको आस्थाका बुँदाहरू
subtitle: ''
author: ''
verses:
- n: 1
  text: हामी अनन्त पिता परमेश्वरमा र उहाँका पुत्र येशू ख्रीष्टमा र पवित्र आत्मामा विश्वास गर्छौँ।
  label: १
- n: 2
  text: हामी विश्वास गर्छौँ कि मानिसहरू उनीहरूका आफ्ना पापका लागि दण्डित हुनेछन्, आदमको उल्लङ्घनका निम्ति
    होइन।
  label: २
- n: 3
  text: हामी विश्वास गर्छौँ कि ख्रीष्टको प्रायश्चित्तद्वारा, सुसमाचारका नियमहरू र विधिहरूप्रतिको आज्ञाकारिताका
    कारण सबै मानव जातिले मुक्ति पाउन सक्छन्।
  label: ३
- n: 4
  text: 'हामी विश्वास गर्छौँ कि सुसमाचारका प्रारम्भिक सिद्धान्त र विधिहरू यी हुन्: पहिलो परमप्रभु येशू
    ख्रीष्टमाथिको आस्था, दोस्रो पश्चात्ताप, तेस्रो पापको छुटकाराका निम्ति पूर्ण रुपमा डुबुल्की मारीकन
    बप्तिस्मा, चौथो शिरमाथि हात राखेर दिइने पवित्र आत्माको उपहार।'
  label: ४
- n: 5
  text: हामी विश्वास गर्छौँ कि कुनै पनि मानिसले सुसमाचारको प्रचार गर्न र त्यसका विधिहरूको प्रशासन गर्न
    अगमवाणीद्वारा र अधिकार प्राप्त गरेकाहरूद्वारा हात राखेर परमेश्वरबाट बोलावट गरिएको हुनुपर्छ।
  label: ५
- n: 6
  text: 'हामी त्यही प्राचीन चर्चमा विद्यमान भएअनुसारको सङ्घठनमा विश्वास गर्छौँ, नामत: प्रेरितहरू, अगमवक्ताहरू,
    पाष्टरहरू, शिक्षकहरू, सुसमाचार-प्रचारकहरू आदि।'
  label: ६
- n: 7
  text: हामी भाषाहरू, अगमवाणी, प्रकाश, दर्शन, चङ्गाइ, भाषाका भाषान्तकरणका र आदि उपहारहरूमा विश्वास गर्छौँ।
  label: ७
- n: 8
  text: हामी बाइबलको सहीरुपमा अनुबाद भएसम्म त्यो परमेश्वरको वचन हो भनी विश्वास गर्छौं; हामी मोर्मोनको
    पुस्तकलाई पनि परमेश्वरको वचन हो भनी विश्वास गर्छौँ।
  label: ८
- n: 9
  text: हामी त्यो सबैमा विश्वास गर्छौँ कि जुन परमेश्वरले प्रकट गर्नुभएको छ, ती सबैमा जुन उहाँले अहिले
    प्रकट गर्नुहुन्छ र हामी विश्वास गर्छौँ कि उहाले परमेश्वरको अधिराज्यका बारेमा अझ महान् र महत्वपूर्ण
    धेरै कुराहरू प्रकट गर्नुहुनेछ।
  label: ९
- n: 10
  text: 'हामी इस्राएलको वास्तविक मूलको अनुरुप एकत्र हुने र दश घरानाहरूको पुनर्स्थापना हुनेमा विश्वास गर्छौँ;
    कि सियोन (नयाँ येरुसलेम) अमेरिकी महादेशमा बनाइनेछ; कि ख्रीष्टले आफैँ पृथ्वीमा राज्य गर्नुहुनेछ; र
    पृथ्वीलाई पुन: नवीकरण गरिनेछ र यसको स्वर्गीय महिमा प्राप्त गर्नेछ।'
  label: १०
- n: 11
  text: हामी आफ्नो विवेकअनुसार सर्वसक्तिमान् परमेश्वरको आराधना गर्न पाउने अधिकारको दावा गर्छौँ र सबै मनिसहरूलाई
    आफूले चाहेअनुसार जसरी, जहाँ, जसको पनि आराधना गर्न पाउने अधिकार दिन्छौँ।
  label: ११
- n: 12
  text: हामी कानुनको पालना गर्न, सम्मान गर्न र समर्थन गर्न राजाहरूको, राष्ट्रपतिहरूको, राज्यपालहरूको र
    मजीस्ट्रेटहरूको अधीनमा रहनेमा विश्वास गर्छौँ।
  label: १२
- n: 13
  text: हामी इमान्दार, सत्य, शुद्ध, परोपकारी, साच्चरित्रवान हुनमा र सबै मानिसहरूको भलो गर्नमा विश्वास
    गर्छौँ; वास्तवमा, हामी भन्न सक्छौं कि हामी पाओलले दिएको उपदेशको पालना गर्छौँ—हामी सबै कुराहरूमा विश्वास
    गर्छौँ, हामीले सबै कुराहरुमा आशा गर्छौं, हामीले धेरै कुराहरू सहेका छौँ र सबै कुराहरू सहन सक्ने आशा
    गर्छौँ। यदि त्यहाँ कुनै सच्चरित्रवान, प्रेमयोग्य, अथवा असल वा प्रशंसायोग्य भए, हामी ती कुराहरूको खोजी
    गर्छौँ।
  label: १३
signature: योसेफ स्मिथ
