title: Peneinei
subtitle: Kalohk Ehu Ong Sampah
author: Presidensi Keieu oh Pwihn en Kaweid en Wahnpoaron Ehk-riemen en Mwomwohdiso en Sises Krais en
  Souleng en Imwin Rahn akan
note: Kalohk wet wadawada sang rehn President Gordon B. Hinckley ni eh wia kisehn sapwellime mahsen me
  kohda ong Mihting Lap en Pwihn en Sawas en Lih me wiawi Septempe 23, 1995, nan Salt Lake City, Utah.
paragraphs:
- Kiht, Presidensi Keieu oh Pwihn en Kaweid en Wahnpoaron Ehk-riemen en Mwomwohdiso en Sises Krais en
  Souleng en Imwin Rahn akan, kalohngkihda ni mehlel me pwopwoud nanpwungen ohl emen oh lih emen koasoandihsang
  Koht oh me peneinei kesempwal ong sapwellimen Sounkapikipiko pilahn ong mour poatoapoat en Sapwellime
  serih kan.
- Aramas koaros—ohl oh lih—kepikipikda ni mwohmw en Koht. Emen emen iei seri pwutak de serepein ngehn
  kesempwal en ihn oh sahm nanleng, oh, pwehki met, emen emen ahniki kepikipik sarawi oh mour sarawi me
  koasoandieng emen emen irail. Wia ohl de lih iei mwohmw kesempwal en ihs aramas emen oh ah pwukoa nan
  ah mour mwohn mour wet, mour pohn sampah, oh mour poatoapoat.
- Nan mour mwohn mour wet, seri pwutak oh serepein ngehn kan esehier oh kin pwongih Koht nin duwen Samarail
  Poatoapoat oh alehda Sapwellime pilahn me pahn elehieng Sapwellime serih kan en alehdi paliwar oh alehdi
  irair en mour pohn sampah pwehn keirda ong unsekla oh kedekedeo alehdi mour en ehu rahn me koasoandi
  sarawi ni duwen irail akan me sohsohki mour poatoapoat. Pilahn sarawi en peren kin kahrehieng ehupenehn
  nanpwungen peneinei en kak doulahte mwurin sousouo. Tiahk oh inou sarawi kan me mie ihte nan tehnpas
  sarawi kan kin kahrehieng emenemen aramas en kak pwurala rehn Koht oh kahrehieng peneinei kan en kak
  patpene kohkohlahte.
- Kosonned keieu me Koht ketikiheng Adam oh Ihp doke ara kak en wia pahpa nohno ni duwen ohl oh lih pwopwoud.
  Se kalohngki me sapwellimen Koht kosonned ong Sapwellime serihkan en kaparaparla pwe kadaudokarail kan
  en kousoanla wasa koaros nin sampah wie manaman te. Se doula kalohngki me Koht ketkihda kosonned me
  manaman sarawi kan en wiahda mour pahn doadoahk ihte nanpwungen ohl oh lih, me kapwopwoud ni pwung en
  kosonned ni duwen ohl oh lih pwopwoud.
- Se kalohngki me wiepe me mour en pohn sampah kin kepikipikda koasoandihsang powe. Se kamehlel kesempwalpen
  mour oh kesempwalpe nan sapwellimen Koht pilahn poatoapoat.
- Ohl oh lih pwopwoud ahniki pwukoa kesempwal en poakohng oh apwalih emen emen oh neira serih kan. “Serih
  kan iei sohso sang Kauno” (Melkahka kan 127:3). Pahpa nohno kan ahniki pwukoa sarawi en apwaliada neira
  serihkan ni limpoak oh mour pwung, en apwaliala arail anahn akan me pid paliwar oh pali ngehn, oh en
  padahkihieng irail en poakohng oh papah emenemen, kapwaiada kosonned akan en Koht, oh en wia tohn wehi
  me kin kapwaiada kosonned akan en wehi wasa sohte lipilipil me re kousoan ie. Ohl oh lih pwopwoud kan—nohno
  kan oh pahpa kan—pahn pwukoahki mwohn Koht duwen arail apwaliala pwukoa pwukat.
- Peneinei koasoandihsang Koht. Pwopwoud nanpwungen ohl oh lih kesempwal ong Sapwellime pilahn poatoapoat.
  Serihkan ahniki pwuhng en ipwidi nan selin pwopwoud, oh en epwelda rehn pahpa men oh nohno men me kin
  wauniki ara inou kan en pwopwoud ni loaloapwoat unsek. Peren nan mour en peneinei kin keieu kak pweida
  ni eh pahn poahsoankihda padahk kan en Kaun Sises Krais. Pwopwoud kan oh peneinei kan me kin pweida
  kin kokouda oh kin wie epwehpwel sang ni padahk kan en pwoson, kapakap, koluhla, mahk, waun, limpoak,
  tetehk mehteikan, doadoahk, oh kemwekid en kemweit mwahu kan. Sang ni koasoandi sarawi, pahpa kan pahn
  kin kaunda arail peneinei kan ni limpoak oh mour pwung oh pwukoahki soahng kan me anahn ong mour oh
  en sinsile arail peneinei kan. Nohno kan pwukoahki keieu en apwalih keirdahn neirail serihkan. Nan pwukoa
  sarawi pwukat, pahpa kan oh nohno kan ahniki pwukoa en sewese emenemen ni duwen werek pahrek. Soumwahula,
  mehla, de irair teikan kak en kahrehieng aramas emen eh anahne wekidala ah pwukoa. Peneinei lap kan
  konehng en kihda utuht ni ansou me mie anahnepe.
- Se keperki me emen emen aramas me kawehla inou kan en mour mwakelekel, me kin wiakawe ah pwoud de nah
  seri, de me sohte kapwaiada ah pwukoa kan ong ah peneinei pahn ehu rahn kadeingki mwohn Koht. Doulahte,
  se keperki me mwerpeseng en peneinei pahn wahdohng pohn emen emen aramas, kousapw kan, oh wehi kan mwekid
  suwed akan me kokohpda sang soukohp akan en kawao oh rahn wet.
- Se poahngoangki towe kan en wehi oh tohn doadoahk en kopworment kan wasa koaros me nsenoh en utung irair
  pwuko me koasoandi en kolokol oh kakehlailih peneinei nin duwen eh wia pwihn poahsoan en wehi.
