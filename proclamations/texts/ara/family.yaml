title: العائلة
subtitle: إعلان للعالم
author: الرئاسة الأولى ومجلس الرسل الإثني عشر لكنيسة يسوع المسيح لقدّيسي الأيام الأخيرة
note: لقد قرأ الرئيس غوردن ب. هنكلي هذا الإعلان كجزء من رسالته في اجتماع جمعية الإعانة العام في ٢٣ أيلول
  ١٩٩٥، في سولت ليك سيتي، يوتا.
paragraphs:
- نحن، الرئاسة الأولى ومجلس الرسل الاثني عشر في كنيسة يسوع المسيح لقدّيسي الأيام الأخيرة، نعلن وبهيبة
  أنّ الزواج بين الرجل والمرأة أمرٌ عيّنه اللّٰه وأنّ العائلة عنصرٌ جوهري في الخطّة التي وضعها الخالق
  لمصير أبنائه الأبدي.
- لقد خلق اللّٰه الإنسان، ذكراً وأنثى، على صورته. كل فرد هو الابن الروحي الحبيب أو الابنة الروحية الحبيبة
  لوالدين سماويّيْن، وبهذه الصفة، يملك كل فرد طبيعة ومصيراً إلهيّين. فالجنس المذكّر أو المؤنّث ميزة أساسية
  لهوية الفرد وسبب وجوده ما قبل الأرضي، الأرضي والأبدي.
- ففي الحياة ما قبل الأرضية، عرف الأبناء والبنات الروحيّون اللّٰه وعبدوه كأبيهم الأبدي. لقد قبلوا خطّته
  التي تقضي بإمكانية حصول أبنائه على جسد من لحم ودم واكتسابهم خبرة على الأرض بغية الارتقاء نحو الكمال
  وتحقيق مصيرهم الإلهي بوراثة الحياة الأبدية في نهاية المطاف. فخطة السعادة الإلهية تخوّل استمرارية العلاقات
  العائلية إلى ما بعد الموت. أمّا المراسيم والعهود المقدّسة التي تتم تأديتها في الهياكل المقدّسة فتخوّل
  الأفراد الرجوع إلى حضرة اللّٰه وتسمح للعائلات بأن تتّحد إلى الأبد.
- إنّ الوصية الأولى التي أعطاها اللّٰه لآدم وحوّاء تتعلّق بإمكانية اختبارهما الأبوّة كزوج وزوجة. نحن نعلن
  أنّ وصيّة اللّٰه لأبنائه التي تقضي بأن يثمروا ويكثروا ويملأوا الأرض، لا زالت سارية المفعول. كما نعلن
  أنّ اللّٰه أوصى بممارسة قدرات الخلق المقدّسة فقط بين رجل وامرأة يجمعهما رباط الزواج شَرْعاً.
- نحن نعلن أنّ الطريقة التي تُخلَق بها الحياة على الأرض هي طريقة وضعها اللّٰه. وأننا نؤكد على قداسة الحياة
  وأهمّيتها في خطة اللّٰه الأبدية.
- تقع على عاتق الزوج والزوجة مسؤوليّة جديّة ومقدّسة تقضي بأن يحبّا بعضهما ويعتنيا ببعضهما كما تقضي بأن
  يحبّا أولادهما ويعتنيا بهم. ”البنون ميراث من عند الرّب“ (المزامير ١٢٧‏:٣). ويقع على عاتق الوالديْن واجب
  مقدّس يقضي بتربية أولادهما بالمحبّة والبر، بتأمين حاجاتهم الجسدية والروحية، وبتعليمهم المحبّة وخدمة
  بعضهم البعض، بالحفاظ على وصايا اللّٰه والتصرّف كمواطنين يحترمون القانون حيثما عاشوا. وسيدان الأزواج
  والزوجات—الأمهات والآباء—أمام اللّٰه على أداء هذه الواجبات.
- أما العائلة فلقد دعا اللّٰه إلى إنشائها. الزواج بين الرجل والمرأة عنصر أساسي في خطّته الأبدية. يملك
  الأولاد الحقّ بأن يولدوا في إطار الزواج، وبأن تتمّ تربيتهم من قبل أب وأم يحترمان نذور الزواج بوفاء تام.
  أمّا فرص تحقيق السعادة في الحياة العائلية فهي تزيد إذا ما بنيت هذه الأخيرة على تعاليم الرّب يسوع المسيح.
  فالزواج والعائلة الناجحان يرتكزان في البدء، ويبقيان مرتكزيْن على مبادئ الإيمان والصلاة، والتوبة والمغفرة،
  الاحترام والمحبّة، الرأفة والعمل والنشاطات الترفيهية المفيدة. تنصّ خطّة اللّٰه على أن يترأّس الأب عائلته
  بالمحبّة والبرّ وأن يكون مسؤولاً عن تأمين حاجات الحياة الأساسية والحماية لها. أمّا مسؤولية الأمّ الأساسية
  فتقضي بتربية أولادها. وخلال تأدية المهام المقدسة هذه، على الأب والأمّ مساعدة بعضهما كشريكيْن متساوييْن.
  وقد يُضطَرّ الفرد إلى التكيّف بطريقة معيّنة في حال حصول أية إعاقة أو في حال الوفاة أو في أية ظروف أخرى.
  كما يجب على الأقارب الآخرين أن يقدموا الدعم لدى الحاجة.
- 'نحن نطلق التحذير التالي: إنّ الأشخاص الذين يخترقون عهود العفّة والذين يسيؤون إلى زوجهم أو أولادهم،
  أو الذين لا يلتزمون بمسؤولياتهم العائلية، سيقفون يوماً ليدانوا أمام اللّٰه. ونحن نطلق التحذير التالي:
  إنّ تفكك العائلة سيلقي على الأفراد والمجتمعات والأمم بالكوارث التي تنبأ بها أنبياء الأمس وأنبياء اليوم.'
- نحن ندعو كلّ مواطن مسؤول في الحكم، أينما كان، إلى تشجيع هذه الإجراءات التي تهدف إلى الحفاظ على العائلة
  وتعزيزها كوحدة المجتمع الأساسية.
