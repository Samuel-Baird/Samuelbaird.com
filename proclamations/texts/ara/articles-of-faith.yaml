title: بنود الإيمان
subtitle: لكنيسة يسوع المسيح لقدّيسي الأيام الأخيرة
author: ''
verses:
- n: 1
  text: نؤمن باللّٰه، الآب الأزليّ، وبابنه يسوع المسيح، وبالروح القدس.
  label: ١
- n: 2
  text: نؤمن بأنّ البشر سيُعَاقَبون من أجل خطاياهُم ليس بسبب تعدّي آدَم.
  label: ٢
- n: 3
  text: نؤمن بأنّ جميع البشر يستطيعون أن يخْلُصُوا عن طريق كفّارة المسيح، وذلك بإطاعة شرائع الإنجيل ومراسيمه.
  label: ٣
- n: 4
  text: 'نؤمن بأنّ المبادئ والمراسيم الأربعة الأولى للإنجيل هي: أولاً: الإيمان بالرّبّ يسوع المسيح؛ وثانياً:
    التوبة؛ وثالثاً: العماد بالتغطيس لغفران الخطايا؛ ورابعاً: وضع الأيدي لموهبة الروح القدس.'
  label: ٤
- n: 5
  text: نؤمن بأنّ الإنسان يجب أن يُدعى من اللّٰه عن طريق النبوّة ووضع الأيدي على يد هؤلاء الذين لهم السلطة،
    لكي يبشّر بالإنجيل ويقوم بالمراسيم المتعلّقة به.
  label: ٥
- n: 6
  text: 'نؤمن بنفس التنظيم الذي قامت عليه الكنيسة القديمة، أي: الرسل والأنبياء والرعاة والمعلّمين والمبشّرين
    إلخ.'
  label: ٦
- n: 7
  text: نؤمن بموهبة الألسُن والنبوّة والرؤيا والأحلام والشفاء وتفسير الألسُن، إلخ.
  label: ٧
- n: 8
  text: نؤمن بأنّ الكتاب المقدس هو كلمة اللّٰه بقدر ما تُرجِم صحيحاً؛ كما نؤمن بأنّ كتاب مورمون هو كلمة
    اللّٰه.
  label: ٨
- n: 9
  text: نؤمن بكل ما كشفه اللّٰه وبما يكشفه الآن ونؤمن أيضاً أنّه سيظل يكشف أموراً كثيرة عظيمة هامة تتعلق
    بملكوت اللّٰه.
  label: ٩
- n: 10
  text: نؤمن بتجمُّع إسرائيل الحرفيّ واستعادة القبائل العشرة؛ وأنّ صهيون (أورشليم الجديدة) ستُؤسّس على
    القارّة الأمريكية؛ وأنّ المسيح سيملِك شخصيّاً على الأرض؛ وأنّ الأرض ستتجدّد وتتسلّم مجدها الفردوسيّ.
  label: ١٠
- n: 11
  text: ندّعي امتياز عبادة اللّٰه القويّ طبقاً لما يمليه علينا ضميرُنا، كما نسمح لجميع البشر بهذا الامتياز،
    فَلْيَعبدوا ما يريديون وكيف يريدون وأين يريدون.
  label: ١١
- n: 12
  text: نؤمن بأنّه يجب علينا أن نخضع للملوك والرؤساء والحكّام وأصحاب السلطة القضائيّة، كما نؤمن بأنّه
    يجب علينا إطاعة القانون واحترامه وتأييده.
  label: ١٢
- n: 13
  text: نؤمن بأنّه يجب علينا أن نكون أمناء وصادقين وأطهاراً ومحسنين وأصحاب فضيلة وأن نعمل الخير لكل البشر؛
    حقّاً قد نقول إنّنا نتبع نصائح بولس الرسول بأنّنا نؤمن بكلّ الأشياء ونأمل بكلّ الأشياء وأنّنا تحمّلنا
    الكثير ونرجو أن نقدر على احتمال كلّ الأشياء. فإن كان هناك شيء ذو فضيلة ومحبوب أو يستحق التقدير أو
    المدح فنحن نسعى وراء هذا الشيء.
  label: ١٣
signature: جوزف سميث.
