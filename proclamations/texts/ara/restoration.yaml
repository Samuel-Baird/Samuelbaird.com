title: استعادة ملء إنجيل يسوع المسيح
subtitle: إعلان إلى العالم بمناسبة الذكرى المئوية الثانية
author: الرئاسة الأولى ومجلس الرسل الاثني عشر لكنيسة يسوع المسيح لقديسي الأيام الأخيرة.
note: قرأ الرئيس رسل م. نلسن هذا الإعلان كجزء من كلمته في المؤتمر السنوي العام الحادي والتسعين بعد المائة،
  في ٥ نيسان ٢٠٢٠، في مدينة سولت ليك، في يوتا.
paragraphs:
- نعلن بصورة رسمية أن اللّٰه يحب أولاده وبناته في كل دولة من دول العالم. لقد أعطانا اللّٰه الآب الولادة
  الإلهية، والحياة التي لا تُضاهى، والأضحية الكفارية اللامتناهية لابنه الحبيب، يسوع المسيح. بقوة الآب،
  قام يسوع ثانية وحقق النصر على الموت. إنه مخلصنا، وقُدْوَتُنا، وفادينا.
- قبل مائتي عام، في صباح ربيعي جميل عام ١٨٢٠، ذهب الشاب جوزف سميث، الذي كان يحاول معرفة الكنيسة التي عليه
  الانضمام إليها، للصلاة في غابة بالقرب من منزله في شمال ولاية نيويورك في الولايات المتحدة الأميركية.
  كان لديه تساؤلات بشأن خلاص نفسه وكان واثقا من أن اللّٰه سَيُوَجِّهُهُ.
- نعلن بكل تواضع أن اللّٰه الآب وابنه يسوع المسيح ظهرا لجوزف استجابة لصلاته مبتدئين بذلك ”رَدَّ كل شيء“
  (أعمال الرسل ٣‏:٢١) حسب نبوءة الكتاب المقدس. في هذه الرؤيا، عَلِم جوزف أن كنيسة المسيح التي أسسها في
  زمن العهد الجديد فُقِدَت من الأرض بعد وفاة الرسل الأصليين وأن جوزف سيكون أساسيا لعودتها.
- إننا نؤكد أن مراسيل سماويين جاءوا بتوجيه من الآب لإرشاد جوزف وإعادة تأسيس كنيسة يسوع المسيح. أعاد يوحنا
  المعمدان المُقامُ من الموت سلطة التعميد بالتغطيس لمغفرة الخطايا. كما أن ثلاثةً من الرسل الاثني عشر الأصليين—بطرس
  ويعقوب ويوحنا—أعادوا المناصب الرَّسولِيّة ومفاتيح سلطة الكهنوت. جاء آخرون أيضًا، بما في ذلك إيليا، الذي
  أعاد السلطة لربط العائلات معًا إلى الأبد في علاقات أبدية تتجاوز الموت.
- 'نشهد كذلك أن جوزف سميث مُنِح موهبة وقوة اللّٰه لترجمة سِجِلٍّ قديم: كتاب مورمون—شاهدٌ آخر ليسوع المسيح.
  تتضمن صفحات هذا النص المقدس سَرْدًا للخدمة الشخصية ليسوع المسيح بين الناس في النصف الغربي من الأرض بعد
  قيامته بوقت قصير. يُعَلِّمُ كتاب مورمون الغرض من الحياة ويشرح عقيدة المسيح، التي هي جوهر هذا الغرض.
  ككتاب مصاحب للكتاب المقدس، يشهد كتاب مورمون أن جميع البشر هم أبناء وبنات لأب مُحِبٍّ في السماء، وأن
  لديه خطة إلهية لحياتنا، وأن ابنه، يسوع المسيح، يتحدث إلى البشر اليوم أيضًا كما في القِدَمِ.'
- إننا نعلن أن كنيسة يسوع المسيح لقديسي الأيام الأخيرة، التي تم تنظيمها في ٦ نيسان ١٨٣٠، هي كنيسة المسيح
  التي أسسها في زمن العهد الجديد والتي تمت استعادتها. ترتكز هذه الكنيسة على الحياة المثالية لحجر الزاوية
  الرئيس لها، يسوع المسيح، وعلى كفارته اللامتناهية وقيامته الحَرْفِيَّةِ من الموت. دعا يسوع المسيح مرة
  أخرى رسلا ومَنَحَهُم سُلْطة الكهنوت. إنه يدعونا جميعًا أن نأتي إليه وإلى كنيسته، لنقبل الروح القدس،
  ومراسيم الخلاص، ونحظى ببهجة دائمة.
- لقد مرت مائتا سنة الآن منذ أن بدأت هذه الاستعادة على يد اللّٰه الآب وابنه الحبيب، يسوع المسيح. لقد اعتنق
  الملايين في جميع أنحاء العالم ما عرفوه عن هذه الأحداث التي جرى التنبؤ بها.
- نعلن بكل سرور أن الاستعادة الموعودة تمضي قُدُما من خلال الوَحْيِ المستمر. لن تكون الأرض مرة أخرى كما
  هي، لأن اللّٰه سوف ”يجمع كل شيء في المسيح“ (أفسس ١‏:١٠).
- بِخُشوعٍ وامْتِنانٍ، فإننا كَرُسُلٍ له ندعو الجميع ليعرفوا—كما نعرف نحن—أن السماوات مفتوحة. نؤكد أن
  اللّٰه يعلن إرادته لأبنائه وبناته الأَحِبَّة. إننا نشهد بأن كل من يدرس بروح الصلاة رسالة الاستعادة،
  ويتصرف بإيمان، فإنه سوف يُبارك بِتَسَلُّمِ شهادة شخصية عن قُدْسِيَّتِها وغَرَضِها الذي هو تهيئة العالم
  للمجئ الثاني الموعود لربنا ومخلصنا يسوع المسيح.
