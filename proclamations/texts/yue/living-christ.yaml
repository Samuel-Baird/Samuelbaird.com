title: 活著的基督
subtitle: 使徒的見證
author: 耶穌基督後期聖徒教會
paragraphs:
- 當我們紀念耶穌基督兩千年前的誕生時，我們要提出我們的見證：有關祂無與倫比的一生的真實性，和祂偉大贖罪犧牲的無限效力。再沒有其他人對曾活在世上和將活在世上的人有如此深遠的影響。
- 祂是舊約中偉大的耶和華，新約中的彌賽亞。在祂父的指示下，祂是大地的創造者，「萬物是藉著祂造的；凡被造的，沒有一樣不是藉著祂造的」（約翰福音1：3）。祂雖無罪，但仍受洗以盡諸般的義；祂「周流四方，行善事」（使徒行傳10：38），然而卻遭人蔑視。祂的福音是平安、喜悅的信息，祂懇請所有的人跟隨祂的榜樣。祂走在巴勒斯坦的道路上，醫治病患，使瞎子能見，使死人復生。祂教導永恆的真理、我們前生存在的真實性、我們今生在世上的目的，以及神的兒女在來生的潛能。
- 祂制定聖餐以提醒人記得祂偉大的贖罪犧牲。祂被逮捕、遭誣陷定罪，又被判有罪以滿足暴民，並被宣判要死在髑髏山的十字架上。祂捨棄自己的生命來贖全人類的罪；祂為了所有曾活在世上的人，付出自己作為一份偉大的禮物。
- 我們鄭重見證：祂的一生，即全人類歷史的中心，並非始於伯利恆，亦非終於髑髏山。祂是父的長子、肉身中的獨生子、世界的救贖主。
- 祂從墳墓中起來，「成為睡了之人初熟的果子」（哥林多前書15：20）。祂，復活之主，到祂一生中所愛的那些人之中探訪他們。祂在古代美洲「另外有羊」（約翰福音10：16），祂也到他們當中施助。而在現代，祂和祂的父向少年約瑟·斯密顯現，開啟了那應許已久的「日期滿足」的時代（以弗所書1：10）。
- 先知約瑟如此描寫活著的基督：「祂的眼睛如同火焰；祂的頭髮白如純雪；祂的容顏發光，比太陽還亮；祂的聲音，即耶和華的聲音，像眾水奔騰的聲音，說：
- 「我是首先的，也是末後的；我是那活著的，我是那被殺的；我是你們在父面前的中保」（教約110：3-4）。
- 關於祂，先知也宣告：「現在，在許多對祂作的見證後，最後，這是我們對祂作的見證：祂活著！
- 「因為我們看見祂在神的右邊，也聽到有聲音作見證說，祂是父的獨生子——
- 「諸世界現在和過去都是藉祂、經祂、由祂創造的，其上的居民是神所生的兒女」（教約76：22-24）。
- 我們以鄭重的言語宣告，祂的聖職和祂的教會已經在世上復興了——「被建造在使徒和先知的根基上，有基督耶穌自己為房角石」（以弗所書2：20）。
- 我們見證祂有一天會回到世上。「耶和華的榮耀必然顯現；凡有血氣的必一同看見」（以賽亞書40：5）。祂將以萬王之王、萬主之主的身分來統治管理；在祂面前，人人都必屈膝，人人都必開口崇拜。我們每一個人都要站在祂的面前，依照我們的行為以及內心的願望來接受審判。
- 身為經適當按立的祂的使徒，我們見證：耶穌是活著的基督，是不朽的神子。祂是偉大的君王以馬內利，如今站在祂父的右邊。祂是世界的光、生命和希望。祂的道路乃是今生通往幸福、來生邁向永生之路。感謝神賜給我們祂神聖的兒子——這份無與倫比的禮物。
