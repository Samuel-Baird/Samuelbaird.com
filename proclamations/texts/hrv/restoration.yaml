title: Obnova punine evanđelja Isusa Krista
subtitle: Proglas svijetu povodom dvjestote godišnjice
author: Prvo predsjedništvo i Vijeće dvanaestorice apostola Crkve Isusa Krista svetaca posljednjih dana
note: Ovaj je proglas pročitao predsjednik Russell M. Nelson kao dio svoje poruke na 190. godišnjem Općem
  saboru održanom 5. travnja 2020. u Salt Lake Cityju, Utah.
paragraphs:
- Svečano proglašavamo da Bog voli svoju djecu u svakom narodu svijeta. Bog Otac pružio nam je božansko
  rođenje, neusporedivi život i beskrajnu pomirbenu žrtvu svojega ljubljenog Sina, Isusa Krista. Moću
  je Očevom Isus ustao ponovno i stekao pobjedu nad smrću. On je naš Spasitelj, naš Uzor i naš Otkupitelj.
- Prije dvije stotine godina, predivnoga proljetnog jutra 1820., mladi se Joseph Smith, tražeći spoznaju
  kojoj se crkvi priključiti, otišao moliti u šumarku u blizini svoje kuće na sjevernom dijelu države
  New York u SAD-u. Imao je pitanja vezana za spasenje svoje duše te se uzdao da će ga Bog usmjeriti.
- U poniznosti izjavljujemo da su se, kao odgovor na njegovu molitvu, Bog Otac i njegov Sin, Isus Krist,
  ukazali Josephu i svečano uveli »sveopć[u] obnov[u]« (Djela 3:21) kako je predskazano u Bibliji. U ovom
  je viđenju on naučio da je, nakon smrti prvotnih apostola, Kristova novozavjetna Crkva bila izgubljena
  sa Zemlje. Joseph bi bio oruđe u njezinu povratku.
- Mi potvrđujemo da su, pod usmjerenjem Oca i Sina, nebeski glasnici došli podučiti Josepha i ponovno
  uspostaviti Crkvu Isusa Krista. Uskrsli Ivan Krstitelj obnovio je ovlast za krštenje uranjanjem za otpust
  grijeha. Trojica prvotnih apostola – Petar, Jakov i Ivan – obnovili su apostolstvo i ključeve svećeničke
  ovlasti. Drugi su također došli, uključujući Iliju koji je obnovio ovlast spajanja obitelji zauvijek
  u vječne odnose koji nadilaze smrt.
- 'Nadalje svjedočimo da su Josephu Smithu dani dar i moć od Boga za prevođenje drevnog zapisa – Mormonove
  knjige: Još jednog svjedočanstva o Isusu Kristu. Stranice ovoga svetog zapisa uključuju izvješće o osobnom
  službeništvu Isusa Krista među narodom zapadne polutke ubrzo nakon njegova Uskrsnuća. U njoj se naučava
  o svrsi života i objašnjava nauk Kristov koji je u srži te svrhe. Kao Sveto pismo koje stoji uz Bibliju,
  Mormonova knjiga svjedoči da su sva ljudska bića sinovi i kćeri brižnoga Oca na Nebu, da on ima božanski
  naum za naš život i da njegov Sin, Isus Krist, govori danas, kao što je to činio u drevne dane.'
- Izjavljujemo da je Crkva Isusa Krista svetaca posljednjih dana, uspostavljena 6. travnja 1830., obnovljena
  Kristova novozavjetna Crkva. Ova je Crkva usidrena u savršeni život svojega glavnoga ugaonog kamena,
  Isusa Krista, i u njegovo beskonačno Pomirenje i doslovno Uskrsnuće. Isus Krist ponovno je pozvao apostole
  i dao im svećeničku ovlast. On poziva sve nas da dođemo k njemu i njegovoj Crkvi, primimo Duha Svetoga,
  uredbe spasenja te steknemo trajnu radost.
- Sada je proteklo dvije stotine godina od kada su Bog Otac i njegov ljubljeni Sin, Isus Krist, pokrenuli
  ovu Obnovu. Milijuni diljem svijeta prigrlili su spoznaju o ovim prorokovanim događajima.
- Radosno izjavljujemo da obećana Obnova ide dalje kroz kontinuiranu objavu. Zemlja više nikada neće biti
  ista jer će Bog »obuhvatiti pod jednu glavu u Kristu sve« (Efežanima 1:10).
- S poštovanjem i zahvalnošću, kao njegovi apostoli, mi pozivamo sve da saznaju – kao što mi znamo – da
  su Nebesa otvorena. Potvrđujemo da Bog obznanjuje svoju volju za svoje ljubljene sinove i kćeri. Svjedočimo
  da će oni koji uz molitvu proučavaju poruku Obnove i djeluju u vjeri biti blagoslovljeni stjecanjem
  vlastitog svjedočanstva o njezinu božanskom porijeklu i svrsi da pripremi svijet za obećani Drugi dolazak
  našega Gospodina i Spasitelja, Isusa Krista.
