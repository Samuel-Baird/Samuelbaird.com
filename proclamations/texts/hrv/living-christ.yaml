title: Živući Krist
subtitle: Svjedočanstvo apostola
author: Crkva Isusa Krista svetaca posljednjih dana
paragraphs:
- Spominjući se rođenja Isusa Krista prije dva tisućljeća, iznosimo svoje svjedočanstvo o stvarnosti njegova
  neprispodobiva života i beskrajne moći njegove velike pomirbene žrtve. Nitko drugi nije imao tako snažan
  utjecaj na sve one koji su živjeli i koji će tek živjeti na Zemlji.
- On je bio Veliki Jahve Staroga zavjeta, Mesija Novoga. Pod upravljanjem svojeg Oca, On je stvorio Zemlju.
  »Sve je po njemu postalo i ništa što je postalo nije bez njega postalo« (Ivan 1:3). Premda bezgrešan,
  bio je kršten da se ispuni sva pravednost. On je »prošao čineći dobro« (Djela 10:38), a ipak je bio
  prezren zbog toga. Njegovo je evanđelje bilo poruka mira i dobre volje. Usrdno je pozivao sve da slijede
  njegov primjer. Hodao je putovima Palestine, iscjeljujući bolesne, uzrokujući da slijepi vide i uskrisujući
  mrtve. Podučavao je o istinama vječnosti, stvarnosti našega predsmrtnog postojanja, svrsi našeg života
  na Zemlji i potencijalu Božjih sinova i kćeri u budućem životu.
- Ustanovio je sakrament kao podsjetnik na svoju veliku pomirbenu žrtvu. Bio je uhićen i lažno optužen,
  proglašen krivim da se zadovolji rulja i osuđen na smrt na križu na Kalvariji. Dao je svoj život da
  pomiri za grijehe cijelog čovječanstva. Njegovo veliko zastupničko djelo dar je u korist svih koji će
  ikad živjeti na Zemlji.
- Svečano svjedočimo da njegov život, koji je središte cijele ljudske povijesti, niti je započeo u Betlehemu
  niti je završio na Kalvariji. Bio je Prvorođenac Očev, Jedinorođeni Sin u tijelu, Otkupitelj svijeta.
- Ustao je iz groba da postane »prvenac umrlih« (1 Korinćanima 15:20). Kao uskrsli Gospodin posjetio je
  one koje je volio za života. Također je posluživao među svojim »drug[im] ov[cama]« (Ivan 10:16) u drevnoj
  Americi. U suvremenom svijetu, On i njegov Otac ukazali su se dječaku Josephu Smithu, započinjući davno
  obećanu »provedbu punine vremena« (Efežanima 1:10).
- 'O Živućem je Kristu prorok Joseph napisao: »Oči njegove bijahu poput ognjena plamena; kosa na glavi
  njegovoj bijaše bijela poput čista snijega; lice njegovo sjaše jače od sjaja sunčanog; i glas njegov
  bijaše poput zvuka sručavanja velikih voda, to jest glas Jahvin, što govoraše:'
- Ja sam prvi i posljednji; ja sam onaj koji živi, ja sam onaj koji bijaše ubijen; ja sam zagovornik vaš
  kod Oca« (NiS 110:3–4).
- 'Prorok je o njemu također izjavio: »A sad, nakon mnogih svjedočanstava koja bijahu dana o njemu, ovo
  je svjedočanstvo, posljednje od svih, koje mi dajemo o njemu: Da on živi!'
- Jer vidjesmo ga, i to zdesna Bogu; i čusmo glas gdje iznosi svjedočanstvo da je on Jedinorođenac Očev
  –
- Da se po njemu, i kroz njega, i od njega svjetovi stvaraju i bijahu stvoreni, a žitelji njihovi rođeni
  su sinovi i kćeri Bogu« (NiS 76:22–24).
- Izjavljujemo trezvenim riječima da su njegovo svećeništvo i njegova Crkva obnovljeni na Zemlji – »nazidani
  na pravom temelju – na apostolima i prorocima, a zaglavni je kamen sam Krist Isus« (Efežanima 2:20).
- Svjedočimo da će se on jednog dana vratiti na Zemlju i »otkrit će se tada slava Jahvina, i svako će
  je tijelo vidjeti« (Izaija 40:5). Vladat će kao Kralj nad kraljevima i kao Gospodar nad gospodarima
  te će se svako koljeno prignuti i svaki će mu jezik hvale iskazivati. Svatko će od nas stati pred njega
  da nam se sudi prema osobnim djelima i nakanama srca.
- Kao njegovi propisno zaređeni apostoli svjedočimo da Isus jest živući Krist, besmrtni Sin Božji. On
  je veliki kralj Emanuel koji danas stoji zdesna svojem Ocu. On je svjetlost, život i nada svijetu. Njegov
  put vodi k sreći u ovom životu i k vječnom životu u budućem svijetu. Neka je Bogu hvala na neprispodobivu
  daru njegova božanskog Sina.
