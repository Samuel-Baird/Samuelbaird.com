title: Članci vjere
subtitle: Crkve Isusa Krista svetaca posljednjih dana
author: ''
verses:
- n: 1
  text: Vjerujemo u Boga, Vječnoga Oca, i u njegova Sina, Isusa Krista, i u Duha Svetoga.
- n: 2
  text: Vjerujemo da će ljudi biti kažnjeni za svoje vlastite grijehe, a ne za Adamov prijestup.
- n: 3
  text: Vjerujemo da kroz Kristovo Pomirenje sav ljudski rod može biti spašen poslušnošću zakonima i uredbama
    evanđelja.
- n: 4
  text: 'Vjerujemo da su ovo prva načela i uredbe evanđelja: prvo, vjera u Gospodina Isusa Krista; drugo,
    pokajanje; treće, krštenje uranjanjem za otpust grijeha; četvrto, polaganje ruku za dar Duha Svetoga.'
- n: 5
  text: Vjerujemo da čovjek mora biti pozvan od Boga, proroštvom, i polaganjem ruku od onih koji imaju
    ovlast, kako bi propovijedao evanđelje i posluživao u uredbama njegovim.
- n: 6
  text: Vjerujemo u isto uređenje kakvo postojaše u prvobitnoj Crkvi, to jest, apostole, proroke, pastire,
    učitelje, evanđeliste, i tako dalje.
- n: 7
  text: Vjerujemo u dar jezika, proroštva, objave, viđenja, iscjeljivanja, tumačenja jezika, i tako dalje.
- n: 8
  text: Vjerujemo da je Biblija riječ Božja u onoj mjeri u kojoj je ispravno prevedena; također vjerujemo
    da je Mormonova knjiga riječ Božja.
- n: 9
  text: Vjerujemo svemu što je Bog objavio, svemu što on sada objavljuje, i vjerujemo da će on još objaviti
    mnogo toga velikoga i važnoga što se odnosi na Kraljevstvo Božje.
- n: 10
  text: Vjerujemo u doslovno sabiranje Izraela i u obnovu Deset Plemena; da će Sion (Novi Jeruzalem) biti
    izgrađen na američkom kontinentu; da će Krist osobno vladati na zemlji; i da će zemlja biti obnovljena
    i primiti svoju rajsku slavu.
- n: 11
  text: Polažemo pravo na povlasticu štovanja Svemogućeg Boga prema uputama svoje vlastite savjesti, i
    dopuštamo svim ljudima istu povlasticu, neka štuju kako, gdje ili što žele.
- n: 12
  text: Vjerujemo da trebamo biti podložni kraljevima, predsjednicima, vladarima i sucima, da se trebamo
    pokoravati zakonu, poštivati ga i podržavati.
- n: 13
  text: Vjerujemo da trebamo biti pošteni, odani, čisti, dobrohotni, kreposni, te dobro činiti svim ljudima;
    doista, možemo reći da slijedimo naputak Pavlov — Vjerujemo svemu, nadamo se svemu, podnijeli smo
    mnogo toga, i nadamo se da ćemo moći podnijeti sve. Ako postoji bilo što kreposno, lijepo, ili na
    dobru glasu ili hvalevrijedno, mi to tražimo.
signature: Joseph Smith.
