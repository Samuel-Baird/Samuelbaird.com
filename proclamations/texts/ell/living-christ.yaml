title: Ο Ζων Χριστός
subtitle: Η Μαρτυρία των Αποστόλων
author: Η Εκκλησία του Ιησού Χριστού των Αγίων των Τελευταίων Ημερών
paragraphs:
- Καθώς τιμούμε τη μνήμη της γέννησης του Ιησού Χριστού πριν από δύο χιλιετίες, προσφέρουμε τη μαρτυρία
  μας για την πραγματικότητα της απαράμιλλης ζωής Του και την απέραντη αρετή της μεγάλης εξιλεωτικής θυσίας
  Του. Κανένας άλλος δεν είχε μια τόσο βαθιά επιρροή επάνω σε όλους που έχουν ζήσει και που ακόμη θα ζήσουν
  επάνω στη Γη.
- Αυτός ήταν ο μεγάλος Ιεχωβά της Παλαιάς Διαθήκης, ο Μεσσίας της Καινής [Διαθήκης]. Υπό την καθοδήγηση
  του Πατέρα Του, ήταν ο δημιουργός της Γης. «Όλα έγιναν διαμέσου αυτού· και χωρίς αυτόν δεν έγινε ούτε
  ένα το οποίο έχει γίνει» (Κατά Ιωάννην 1:3). Μολονότι αναμάρτητος, βαπτίστηκε για να εκπληρώσει κάθε
  χρηστότητα. «Πέρασε ευεργετώντας» (Πράξεις 10:38), και εντούτοις μισήθηκε γι’ αυτό. Το Ευαγγέλιό Του
  ήταν ένα μήνυμα ειρήνης και καλής θέλησης. Παρακάλεσε τους πάντες να ακολουθήσουν το παράδειγμά Του.
  Διάβηκε τους δρόμους της Παλαιστίνης, θεραπεύοντας τους αρρώστους, κάνοντας τους τυφλούς να δουν και
  ανασταίνοντας τους νεκρούς. Δίδαξε τις αλήθειες της αιωνιότητας, την πραγματικότητα της προγήινης ύπαρξής
  μας, τον σκοπό της ζωής μας στη Γη και τη δυνατότητα για τους γυιους και τις κόρες του Θεού στην ερχόμενη
  ζωή.
- Καθιέρωσε τη μετάληψη για να μας θυμίζει τη μεγάλη Του εξιλεωτική θυσία. Συνελήφθη και καταδικάστηκε
  με ψευδείς κατηγορίες, κηρύχθηκε ένοχος για την ικανοποίηση μιας φατρίας και καταδικάστηκε να πεθάνει
  στον σταυρό του Γολγοθά. Έδωσε τη ζωή Του για την εξιλέωση των αμαρτιών ολόκληρης της ανθρωπότητας.
  Ήταν το δικό Του μεγάλο αντιπροσωπευτικό δώρο για λογαριασμό όλων που θα ζούσαν επάνω στη Γη.
- Με ταπεινότητα δίνουμε τη μαρτυρία μας ότι η ζωή Του, που είναι κεντρική σε ολόκληρη την ανθρώπινη ιστορία,
  ούτε άρχισε στη Βηθλεέμ ούτε τελείωσε στον Γολγοθά. Ήταν ο Πρωτότοκος του Πατέρα, ο Μονογενής Υιός κατά
  τη σάρκα, ο Λυτρωτής του κόσμου.
- Αναστήθηκε από τον τάφο για να «[γίνει] η απαρχή αυτών που έχουν κοιμηθεί» (Προς Κορινθίους Α΄ 15:20).
  Ως Ανεστημένος Κύριος, επισκέφθηκε εκείνους που αγάπησε στη ζωή. Επίσης, τέλεσε διακονία προς τα «άλλα
  πρόβατά Του» (Κατά Ιωάννην 10:16) στην αρχαία αμερικανική ήπειρο. Στον σημερινό κόσμο, Αυτός και ο Πατέρας
  Του παρουσιάστηκαν σε ένα αγόρι, τον Τζόζεφ Σμιθ, αρχίζοντας την από παλαιά υποσχεθείσα «θεϊκή νομή
  [οικονομία] τού πληρώματος των καιρών» (Προς Εφεσίους 1:10).
- 'Για τον ζώντα Χριστό, ο προφήτης Τζόζεφ έγραψε: «Τα μάτια Του ήταν σαν φλόγα φωτιάς. Τα μαλλιά της
  κεφαλής Του ήταν λευκά σαν το καθαρό χιόνι. Η όψη Του έλαμπε περισσότερο από τη λαμπρότητα του ηλίου.
  Και η φωνή Του ήταν σαν τον ήχο πολλών ορμητικών νερών, δηλαδή η φωνή του Ιεχωβά, που είπε:'
- «Εγώ είμαι ο πρώτος και ο τελευταίος. Είμαι αυτός που ζει, είμαι αυτός που θανατώθηκε. Είμαι ο συνήγορός
  σας προς τον Πατέρα» (Δ&Δ 110:3–4).
- 'Γι’ Αυτόν ο Προφήτης δήλωσε επίσης: «Και τώρα, μετά από τόσες μαρτυρίες που έχουν δοθεί για Αυτόν,
  τούτη είναι η μαρτυρία, η απολύτως τελευταία, που δίνουμε για Αυτόν: Ζει!'
- »Γιατί τον είδαμε, δηλαδή στα δεξιά του Θεού. Και ακούσαμε τη φωνή που έδινε μαρτυρία ότι είναι ο Μονογενής
  τού Πατρός –
- »Ότι με Αυτόν, και μέσω Αυτού, και από Αυτόν, οι κόσμοι υπάρχουν και δημιουργήθηκαν, και οι κάτοικοί
  τους είναι γιοι και κόρες του Θεού» (Δ&Δ 76:22–24).
- Δηλώνουμε με λόγια ειλικρίνειας ότι η ιεροσύνη Του και η Εκκλησία Του έχουν αποκατασταθεί επάνω στη
  Γη – «που έχουν οικοδομηθεί επάνω στο θεμέλιο… των αποστόλων και των προφητών, που ο ακρογωνιαίος τους
  λίθος είναι ο ίδιος ο Ιησούς Χριστός» (Προς Εφεσίους 2:20).
- Καταθέτουμε μαρτυρία ότι κάποια ημέρα θα επανέλθει στη Γη. «Και η δόξα του Κυρίου θα φανερωθεί και όλη
  η σάρκα μαζί θα την δει» (Ησαΐας 40:5). Θα κυβερνά ως Βασιλεύς Βασιλέων και θα βασιλεύει ως Κύριος Κυρίων
  και κάθε γόνατο θα λυγίσει εμπρός Του και κάθε γλώσσα θα δοξολογήσει τον Κύριο. Καθένας από εμάς θα
  σταθεί για να κριθεί από Αυτόν σύμφωνα με τα έργα μας και τις επιθυμίες της καρδιάς μας.
- Καταθέτουμε τη μαρτυρία μας, ως οι κανονικά χειροτονημένοι Απόστολοί Του – ότι ο Ιησούς είναι ο ζων
  Χριστός, ο αθάνατος Υιός του Θεού. Αυτός είναι ο μεγάλος Βασιλεύς Εμμανουήλ, που στέκεται σήμερα δίπλα
  στο δεξιό χέρι του Πατέρα Του. Αυτός είναι το φως, η ζωή και η ελπίδα του κόσμου. Ο δρόμος Του είναι
  το μονοπάτι που οδηγεί στην ευτυχία σε αυτή τη ζωή και στην αιώνια ζωή στον κόσμο του μέλλοντος. Ευλογημένος
  να είναι ο Θεός για το απαράμιλλο δώρο του θείου Υιού Του.
