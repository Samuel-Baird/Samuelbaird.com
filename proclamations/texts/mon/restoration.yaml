title: Есүс Христийн сайн мэдээний бүрэн байдлын сэргээлт
subtitle: Дэлхий дахинаа өргөх хоёр зуун жилийн ойн тунхаг
author: Есүс Христийн Хожмын Үеийн Гэгээнтнүүдийн Сүмийн Тэргүүн зөвлөл ба Арван хоёр төлөөлөгчийн зөвлөл
note: Энэхүү тунхгийг 2020 оны 4-р сарын 5-нд Юта мужийн Солт Лэйк Сити хотноо болсон жил тутмын 190 дэх
  Ерөнхий чуулган дээр ерөнхийлөгч Рассэлл М.Нэлсон захиасныхаа нэгэн хэсэг болгон уншжээ.
paragraphs:
- Бурхан дэлхийн бүх улс оронд байх Өөрийн хүүхдүүдэд хайртай гэдгийг бид албан ёсоор тунхаглаж байна.
  Бурхан Эцэг бидэнд Өөрийн Хайртай Хүү Есүс Христийн бурханлаг төрөлт, зүйрлэшгүй амьдрал, хязгааргүй
  цагаатгах золиослолыг өгсөн билээ. Эцэгийн хүчээр Есүс дахин босож, үхлийг ялан дийлсэн. Тэр бол бидний
  Аврагч, Үлгэр жишээ үзүүлэгч, Гэтэлгэгч мөн.
- Хоёр зуун жилийн өмнө, 1820 оны хаврын нэгэн сайхан өглөө залуу Иосеф Смит аль сүмд нэгдэхээ мэдэхийг
  эрэлхийлэн, АНУ-ын Нью-Йоркийн хойд хэсэг дэх гэрийнхээ ойролцоох ой руу залбирахаар явсан. Түүнд бодгалийнх
  нь авралын талаар асуух зүйлс байсан ба Бурхан удирдамж заавар өгнө гэдэгт итгэн найдаж байв.
- Иосеф Смитийн залбирлын хариуд Бурхан Эцэг, Түүний Хүү Есүс Христ хоёр Түүнд үзэгдэж, Библид зөгнөснөөр
  “бүхнийг сэргээх” (Үйлс 3:21) үеийг эхлүүлснийг бид даруухнаар тунхаглаж байна. Энэ үзэгдлээр тэрээр
  анхны төлөөлөгчдийг нас барсны дараа Шинэ Гэрээний үеийн Христийн Сүм дэлхий дээр байхаа больсныг мэджээ.
  Иосеф уг Сүмийг эргүүлэн авчрах зэмсэг байлаа.
- Эцэг, Хүү хоёрын удирдлаган доор Иосефт зааж сурган, Есүс Христийн Сүмийг дахин зохион байгуулахаар
  тэнгэрлэг элч нар ирсэн гэдгийг бид баталж байна. Амилуулагдсан Иохан Баптисч нүглийн ангижралын төлөөх
  усанд умбуулан баптисм хүртээх эрх мэдлийг сэргээсэн. Анхны арван хоёр төлөөлөгчийн гурав нь болох Петр,
  Иаков, Иохан нар төлөөлөгчийн эрхийг болон санваарын эрх мэдлийн түлхүүрүүдийг сэргээсэн. Ирсэн бусдын
  дунд, гэр бүлүүдийг үхлийн дараа үүрд үргэлжлэх мөнхийн харилцаанд холбох эрх мэдлийг сэргээсэн Елиа
  байжээ.
- 'Түүнчлэн бид Иосеф Смитэд “Мормоны Ном: Есүс Христийн бас нэгэн гэрээ” хэмээх эртний цэдгийг орчуулах
  Бурханы бэлэг, хүч өгөгдсөн гэдгийг гэрчилж байна. Энэхүү ариун нандин цэдгийн хуудаснууд Есүс Христийн
  амилсныхаа дараахан дэлхийн бөмбөрцгийн баруун хагас дахь хүмүүст өөрийн биеэр тохинуулсан түүхийг багтаадаг.
  Энэ нь амьдралын зорилгын талаар зааж, уг зорилгын төвд орших Христийн сургаалыг тайлбарладаг. Библитэй
  эн зэрэгцэх судар болох Мормоны Ном нь бүх хүн төрөлхтөн бол биднийг хайрладаг Тэнгэр дэх Эцэгийн охид,
  хөвгүүд; бидний амьдралд зориулсан бурханлаг төлөвлөгөө Түүнд байдаг; Түүний Хүү Есүс Христ эрт дээр
  үед ярьдаг байсанчлан өнөө үед ч ярьдаг гэдгийг гэрчилдэг.'
- 1830 оны 4-р сарын 6-нд зохион байгуулагдсан Есүс Христийн Хожмын Үеийн Гэгээнтнүүдийн Сүм бол Шинэ
  Гэрээний үеийн Христийн сэргээгдсэн Сүм мөн гэдгийг бид тунхаглаж байна. Сүм нь өөрийн булангийн чулуу
  болох Есүс Христийн төгс амьдрал, хязгааргүй Цагаатгал, бодит Амилалт дээр зангуугаа бэхэлдэг. Есүс
  Христ төлөөлөгчдийг дахин дуудаж, тэдэнд санваарын эрх мэдэл олгосон. Тэрээр бид бүхнийг Өөрт нь болон
  Өөрийнх нь Сүмд ирж, Ариун Сүнс болон авралын ёслолуудыг хүлээн авч, үүрдийн баяр баясгаланг хүртэхэд
  урьдаг.
- Бурхан Эцэг, Түүний Хүү Есүс Христ хоёр Сэргээлтийг эхлүүлснээс хойш өдгөө хоёр зуун жил улиран оджээ.
  Дэлхий даяар сая сая хүн эдгээр бошиглогдсон үйл явдлын тухай мэдлэгийг хүлээн авсан юм.
- Тасралтгүй өгөгдсөөр буй илчлэлтээр дамжуулан, амлагдсан Сэргээлт урагшилсаар байгааг бид баяртайяа
  тунхаглаж байна. Бурхан “бүх юмсыг Христ дотор нэгтгэх” (Ефес 1:10) тул дэлхий эргэлт буцалтгүй өөрчлөгдөх
  болно.
- Бид Түүний төлөөлөгчдийн хувиар, тэнгэр нээлттэйг бүх хүн бидний адил олж мэдэхийг хүндэтгэл, талархалтайгаар
  урьж байна. Бурхан Өөрийн тааллыг хайртай охид, хөвгүүддээ мэдүүлж байгааг бид баталж байна. Сэргээлтийн
  захиасыг залбирч судлан, итгэлээр үйлддэг хүмүүс үүний бурханлаг байдлын талаар мөн бидний Их Эзэн,
  Аврагч Есүс Христийн амлагдсан Хоёр дахь ирэлтэд дэлхийнхнийг бэлдэх зорилгынх нь тухай өөрийн гэсэн
  гэрчийг хүлээн авахаар адислагдах болно гэдгийг бид гэрчилж байна.
