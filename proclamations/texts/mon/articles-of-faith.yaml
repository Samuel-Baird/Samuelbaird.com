title: ийн Итгэлийн Тунхаг
subtitle: Есүс Христийн Хожмын Үеийн Гэгээнтнүүдийн Сүм
author: ''
verses:
- n: 1
  text: Бурхан, Мөнхийн Эцэг, мөн Түүний Хүү Есүс Христ мөн Ариун Сүнсэнд бид итгэдэг.
- n: 2
  text: Адамын зөрчлийн улмаас бус, хүмүүн өөрсдийнхөө нүглүүдийн улмаас шийтгэгдэх болно гэдэгт бид итгэдэг.
- n: 3
  text: Христийн Цагаатгалаар дамжин Сайн мэдээний хуулиуд хийгээд ёслолуудад дуулгавартай байснаар бүх
    хүн төрөлхтөн аврагдана гэдэгт бид итгэдэг.
- n: 4
  text: 'Сайн мэдээний анхдагч зарчмууд хийгээд ёслолууд нь: нэгдүгээрт, Их Эзэн Есүс Христэд итгэх итгэл;
    хоёрдугаарт, Наманчлал; гуравдугаарт, Нүглүүдийн ангижралын төлөөх усанд умбуулах баптисм; дөрөвдүгээрт
    Ариун Сүнсний бэлгийн төлөөх гар тавилт гэдэгт бид итгэдэг.'
- n: 5
  text: Сайн мэдээг номлох хийгээд үүний ёслолуудыг гүйцэтгэхийн тулд хүн бошиглолоор, мөн эрх мэдэл бүхий
    тэдний гар тавилтаар Бурханаас дуудагдах ёстой гэдэгт бид итгэдэг.
- n: 6
  text: Анхны Сүмд байсан тэрхүү зохион байгуулалтад, тухайлбал төлөөлөгчид, бошиглогчид, пасторууд, багш
    нар, евангелистууд болон бусдад бид итгэдэг.
- n: 7
  text: Хэлний, бошиглолын, илчлэлтийн, үзэгдлийн, эдгээхийн, хэлнүүдийн хөрвүүлгийн болон бусад бэлэгт
    бид итгэдэг.
- n: 8
  text: Библи зөв орчуулагдсан байхын хэрээр Бурханы үг мөн гэдэгт бид итгэдэг; тэрчлэн Мормоны Ном бол
    Бурханы үг мөн гэдэгт бид итгэдэг.
- n: 9
  text: Бурханы илчилсэн бүгдэд, эдүгээ түүний илчилж буй бүгдэд бид итгэдэг мөн Бурханы хаант улсад хамаарах
    олон агуу хийгээд чухал зүйлийг Тэрээр цаашид илчлэх болно гэдэгт бид итгэдэг.
- n: 10
  text: Израил жинхэнэ ёсоор нэгдэж, мөн Арван овог дахин сэргэж, Сион Шинэ Иерусалим Америк тивд байгуулагдах
    болно гэдэгт; Христ дэлхий дээр өөрийн биеэр хаанчлах болно гэдэгт; мөн дэлхий шинэчлэгдэж мөн диваажингийн
    алдар суугаа хүлээн авах болно гэдэгт бид итгэдэг.
- n: 11
  text: Ухамсрынхаа шаардлагын дагуу Бүхнийг Чадагч Бурханыг шүтэн бишрэх онцгой боломжийг бид шаардаж
    байна мөн энэхүү онцгой боломжийг бүх хүмүүст зөвшөөрч, хэрхэн, хаана, эсвээс юуг шүтэн бишрэх нь
    тэдний хэрэг гэдгийг хүлээн зөвшөөрдөг.
- n: 12
  text: Хаад, ерөнхийлөгчид, удирдагчид мөн шүүгчдэд захирагдаж хуулийг дуулгавартай дагаж, хүндлэн дээдэлж
    мөн дэмжих ёстой гэдэгт бид итгэдэг.
- n: 13
  text: Шударга, үнэнч, ариун явдалтай, нинжин сэтгэлтэй, ач буянтай байхад мөн бүх хүмүүст сайн сайхныг
    үйлдэхэд бид итгэдэг; чухамдаа— бид бүх зүйлд итгэдэг, бид бүх зүйлд найддаг, бид олон зүйлийг хүлцэн
    тэвчлээ мөн бүх зүйлийг хүлцэн тэвчих болно гэдэгт найддаг гэсэн Паулын зөвлөгөөг бид дагадаг хэмээн
    хэлж болно. Хэрэв ариун журамтай, сайхан, эсвээс сайн гэгддэг буюу сайшаалтай ямар нэгэн зүйл байдаг
    бол, бид эдгээр зүйлүүдийг эрэлхийлдэг.
signature: Иосеф Смит.
