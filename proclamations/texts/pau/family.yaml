title: A Telungalek
subtitle: Chais el mora Beluulechad
author: ''
note: Tial chais a lechiliuii a Merreder el Gordon B. Hinckley el mle tebechedel a klmechel er a Miting
  er a Cherrengelel a Cheldebechel er a Relief Society el mla er ngii er se er a lluich ma edei el kebesengil
  Ongetiu el buil, ra rak ra 1995, ra Salt Lake City, Utah.
paragraphs:
- Kemam, el First Presidency me a Chelchad er a Teruich me a Terung el Apostol er a Ikelesia er a Jesus
  Kristo er a Uriul-klebesei el Santo, loba cheledaol tekoi e ouchais el kmo a chebechiil er a delongelel
  a sechal me a redil a mechedaol er a Dios ea telungalek a sel kmal nga er a belngel e moktek er sel
  uldesuel a Ulemeob el kirel a diak a ulebengelel klengar el mo er a Rengelekel.
- A rokui el chad —el sechal me a redil— a ulebeob el di uaia teletelel a Dios. A derstang er tir a mekreos
  el ngalek er a reng el sechal me a redil el ngelekel a chedam me a chedil er a babeluades, me a, leuaisei,
  e a derstang er tir a sebecherir el mo ngmai a chedaol teletelir ma blekerdelir. Sel klaodengei er a
  chad el kmo ng sechal malechub eng redil a klou a belkul el kirel a klengar ruchei er tial klengar,
  me a klengar er a beluulechad, me a klengar ruriul er tial beluulechad me a moktek er ngii.
- Chelsel a klengar ruchei er a beluulechad, ea rengalek er a reng el sechal me a redil a milengull er
  a Dios el ngii a Diak a Ulebengelel el Chedam e kilengei er a Uldesuel el ngii a Rengelekel a mo nguu
  a bedengir er a tech e mo kiei er tial beluulechad el mesuub el merael el mo klikiid meng mo sebecherir
  el mo nguu a diak a ulebengelel el klengar. Tial uldasou el kirel a deureng a sobecheklii a deleuill
  er a telungalek meng melemolem e ruriul er a kodall. A chedaol ruoll me a telbiil el nga er a chelsel
  a templo a rullii meng mo sebechel a chad el lemuut el mo er a rengedel a Dios me a telungalek a lmuut
  el mo dmak el mo er a diak a ulebengelel.
- A kot el llach el ngiluu a Dios el msang a Adam me a Eva a sel techall el mo er tir el sebecherir el
  mo oungalek el obekel. Aki ouchais el kmo sel llechul a Dios el mo er a Rengelekel el mo omdois e omekeek
  er a beluulechad a kmal dirk mesisiich. Aki melemolem el louchais el kmo a Dios a mla kmu el kmo sel
  chedaol klisiich el omeob er a rengalek a kirel di mekedmokl er a delongelel a sechal me a redil, el
  tir a mla moterekokl el kaubuch.
- Aki ouchais el kmo sel uchul a blebelel a klengar tial beluulechad a kmal ulterekokl el chedaol. Aki
  smisichii el kmo a klengar a chedaol e kmal klou a belkul er sel diak a ulebengelel el uldesuel a Dios.
- A robekel a kmal chedaol a ngerchelir el kirir el kaubeltik el reng e kaukerreu me a dirrek el mo er
  a rengelekir. “A rengalek a dikesel a Rubak” (Psalm 127:3). A rechedam me a rechedil a nga er ngii a
  chedaol el ngerchelir el omekeroul er a rengelekir loba beltik el reng me a llemalt, e mesterir a lousbech
  a bedengir er a tech me a bedengir er a reng, e mo olisechakl er tir el mo kaubeltik el reng e mo mesiou
  er a tang me a tang, e mo oltirakl a llechul a Dios, e mo oltirakl a llach er a beluu er a ike le kiei
  er ngii. A robekel ma—rechedil me a rechedam—a mo mukerkeriil er a medal a Dios el kirel a okedmeklel
  aika el ngerachel.
- A Telungalek a mechedaol ra Dios. A chebechiil er a delongelel a sechal me a redil a klou a belkul er
  sel diak a ulebengelel Uldesuel. A rengalek a ngar er ngii a lemeltir el me mechell er a chelsel a chebechiil,
  e mukeroul er a chedam me a chedil el tir a mui el oltirakl aikel telbiil er a chelsel a chebechiil.
  A deureng er a chelsel a telungalek a sebechel mo er ngii alsekum a telungalek a ultuil er a osischeklel
  a Rubak el Jesus Kristo. A ungil chebechiil me a telungalek a sebechel mekedmokl e melemolem el ultuil
  er a osischakl er a klaumerang, nglunguuch, ouchel reng ra klengit, klausubes, omengull, beltik el reng,
  klechubechub, ureor, me a ungil e ngar er ngii a belkul el omilil me a omeruul. Me ngokiu chedaol kedmeklel,
  ea rechedam a bdelul a telungalek loba beltik el reng me a llemalt e ngerchelir el smiik e kudmokl aikel
  ousbech er a klechad me a ungil ulekerreu el mora telungalek. A kot el ngerchelir a rechedil a omekerreu
  e omekeroul er a rengelekir. Chelsel aikakid el chedaol el ngerachel, ea rechedam me a rechedil a kirir
  el kaukledem e kaingeseu el tabesul a ngerchelir. A lebor ngii a chelitechut, kodall, malechub eng kuk
  di ngodech el teletael, eng kirel kuk mo mengodech a teletelel aikal ngerachel. A re kauchad el chad
  a dirrek el kirir el kaingeseu.
- Aki omeklatk er tirkel chad el tir a tomellii sel telbiil er a llach el kirel a delboes, el tir a melemall
  e omekringel e mengurusii e ra rebecherir me a rengelekir, malechub e te diak el ruul aike el ngerchelir
  er a telungalek a mo dechor e mo mukerkeriil er a medal a Dios er a ta er a klebesei. Osisiu, ea ki
  omeklatk el kmo a terudel a telungalek a mo uchul ea derstang el chad, me a hang, me a beluu a mo chuarm
  ra ringel me a kerior el ngii a mla medung er a rechuodel me a rebeches el profet.
- Aki omekedong er a rokui el oungerachel el chad er a beluu me a remengeteklel a kabelment er a ngii
  dil ker me bo lolisiich aika el tekoi me a teletael el ngii a mla meketmokl el mo omecheliu e melisiich
  er a telungalek el ngii a kot el klou a ultutelel er a beluu.
