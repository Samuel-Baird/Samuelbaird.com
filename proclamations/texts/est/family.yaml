title: Perekond
subtitle: Läkitus maailmale
author: Viimse Aja Pühade Jeesuse Kristuse Kiriku Esimene Presidentkond ja Kaheteistkümne Apostli Nõukogu
note: Selle läkituse luges ette president Gordon B. Hinckley osana oma sõnumist Abiühingu üldkoosolekul
  23. septembril 1995 Ameerika Ühendriikides Salt Lake Citys.
paragraphs:
- Meie, Viimse Aja Pühade Jeesuse Kristuse Kiriku Esimene Presidentkond ja Kaheteistkümne Apostli Nõukogu,
  kuulutame pühalikult, et abielu mehe ja naise vahel on Jumala poolt seatud ning et perekond on kesksel
  kohal Looja plaanis seoses Tema laste igavese saatusega.
- Kõik inimesed – mehed ja naised – on loodud Jumala näo järgi. Igaüks on taevaste vanemate armastatud
  vaimupoeg või -tütar ning seega on igaühel jumalik loomus ja saatus. Sugu on isiku surelikkusele eelneva,
  sureliku ning igavese identiteedi oluline omadus ning suunitlus.
- Surelikkusele eelnevas maailmas tundsid ja teenisid vaimupojad ja -tütred Jumalat kui oma Igavest Isa
  ning võtsid vastu Tema plaani, mille kaudu Tema lapsed võivad saada füüsilise keha ning maapealse kogemuse,
  et areneda täiuslikkuse poole ning saavutada lõpuks oma jumalik eesmärk igavese elu pärijatena. Jumalik
  õnneplaan teeb võimalikuks perekonnasuhete jätkumise teisel pool hauda. Pühades templites saadavad pühad
  talitused ja lepingud võimaldavad inimestel tagasi pöörduda Jumala palge ette ja annavad perekondadele
  võimaluse olla ühendatud igavesti.
- Esimene käsk, mille Jumal Aadamale ja Eevale andis, puudutas nende kui mehe ja naise võimet saada lapsevanemateks.
  Me kuulutame, et Jumala käsk oma lastele paljuneda ja täita maa kehtib endiselt. Me kuulutame lisaks
  sellele, et Jumala käsul tohivad püha sigitusjõudu kasutada ainult mees ja naine, kes on seaduslikus
  abielus.
- Me kuulutame, et viis, kuidas surelik elu luuakse, on jumalikult määratud. Me kinnitame, et elu on Jumala
  igaveses plaanis püha ja tähtis.
- Mehel ja naisel on püha kohustus armastada teineteist ja hoolitseda teineteise eest ning armastada oma
  lapsi ja hoolitseda nende eest. „Lapsed on pärand Jehoovalt” (Laulud 127:3). Vanematel on püha kohustus
  kasvatada oma lapsi armastuses ja õigsuses, hoolitseda nende füüsiliste ja vaimsete vajaduste eest ning
  õpetada neid armastama ja teenima üksteist, järgima Jumala käske ning olema seadustele kuulekad kodanikud,
  kus iganes nad ka ei elaks. Nende kohustuste täitmise eest vastutavad mehed ja naised – emad ja isad
  – Jumala ees.
- Perekond on seatud Jumala poolt. Abielu mehe ja naise vahel on Tema igavese plaani peamine osa. Lastel
  on õigus sündida abielusidemetes ning saada kasvatatud isa ja ema poolt, kes austavad oma abielulubadusi
  täieliku truudusega. Õnn saavutatakse perekonnaelus kõige kindlamalt siis, kui see on rajatud Issanda
  Jeesuse Kristuse õpetustele. Õnnestunud abielud ja perekonnad on üles ehitatud usu, palvetamise, meeleparanduse,
  andestuse, austuse, armastuse, kaastunde, töö ja tervisliku meelelahutuse põhimõtetele. Jumaliku plaani
  kohaselt tuleb isadel juhtida oma perekonda armastusega ja õigsuses ning nad vastutavad oma perekonna
  kaitsmise ja selle vajaduste rahuldamise eest. Emad vastutavad eelkõige oma laste kasvatamise eest.
  Nende pühade kohustuste täitmisel tuleb isal ja emal aidata teineteist võrdsete kaaslastena. Puude,
  surma või muude asjaolude korral võib osutuda vajalikuks nende rollide ümberkorraldamine. Vajaduse korral
  peaksid toetama sugulased.
- Me hoiatame, et neil, kes rikuvad vooruslikkuse lepinguid, kes kohtlevad halvasti oma abikaasat või
  järglasi või kes ei täida oma perekonnakohustusi, tuleb ühel päeval anda vastust Jumala ees. Me hoiatame
  ka, et perekondade lagunemine toob üksikisikutele, ühiskonnale ja rahvastele need õnnetused, mida on
  ette kuulutanud nii muistsed kui kaasaegsed prohvetid.
- Me kutsume vastutavaid kodanikke ja valitsuste ametnikke üle maailma toetama neid meetmeid, mille eesmärgiks
  on perekonna kui ühiskonna põhialuse säilitamine ja tugevdamine.
