retrieved: '2026-11-02'
title: Jeesuse Kristuse evangeeliumi täiuse taastamine
subtitle: Kahesajanda aastapäeva läkitus maailmale
author: Viimse Aja Pühade Jeesuse Kristuse Kiriku Esimene Presidentkond ja Kaheteistkümne Apostli Nõukogu
note: Selle läkituse luges ette president Russell M. Nelson osana oma sõnumist 190. kevadisel üldkonverentsil
  5. aprillil 2020 Ameerika Ühendriikides Salt Lake Citys.
paragraphs:
- Kuulutame pühalikult, et Jumal armastab oma lapsi kõikjal maailmas. Jumal Isa on meile andnud oma armastatud
  Poja Jeesuse Kristuse jumaliku sünni, võrreldamatu elu ja lõputu lepitusohvri. Isa väe läbi tõusis Jeesus
  taas ja sai surmast võitu. Ta on meie Päästja, meie Eeskuju ja meie Lunastaja.
- Kakssada aastat tagasi, 1820. aasta ilusal kevadhommikul, läks noor Joseph Smith, otsides teadmist,
  millise kirikuga liituda, oma kodu lähedal Ameerika Ühendriikides New Yorgi osariigis metsa, et palvetada.
  Tal oli küsimusi oma hinge päästmise kohta ja ta uskus, et võib saada juhatust Jumalalt.
- Kuulutame alandlikult, et vastusena tema palvele ilmusid Josephile Isa Jumal ja Tema Poeg Jeesus Kristus
  ning panid aluse ajale, „mil oma kohale asetatakse kõik” (Ap 3:21), nagu Piiblis on ette kuulutatud.
  Selles nägemuses sai ta teada, et pärast algsete apostlite surma oli Kristuse Uue Testamendi aegne Kirik
  maa pealt kadunud. Josephil pidi olema oluline roll selle taastamisel.
- Me kinnitame, et Isa ja Poja juhatusel tulid taevased käskjalad Josephit juhendama ja Jeesuse Kristuse
  Kirikut taastama. Ülestõusnud Ristija Johannes taastas volituse ristida vee alla kastmise teel pattude
  andekssaamiseks. Kolm algsest kaheteistkümnest apostlist – Peetrus, Jaakobus ja Johannes – taastasid
  apostlikutse ja preesterluse volituse võtmed. Tuli ka teisi, sealhulgas Eelija, kes taastas volituse
  liita igaveseks kokku perekonnad igavikulistes suhetes, mis ületavad surma väe.
- 'Tunnistame samuti, et Joseph Smithile anti Jumala and ja vägi tõlkida muistne ülestähendus – „Mormoni
  Raamat: teine testament Jeesusest Kristusest”. Selle püha teksti lehekülgedel on ülevaade Jeesuse Kristuse
  isiklikust teenimisest inimeste seas läänepoolkeral peatselt pärast Tema ülestõusmist. See õpetab elu
  eesmärki ja selgitab Kristuse õpetust, millel on selles eesmärgis keskne koht. Piibli kaaspühakirjana
  tunnistab Mormoni Raamat, et kõik inimesed on armastava Taevase Isa pojad ja tütred, et Tal on meie
  elu jaoks jumalik plaan ja et Tema Poeg Jeesus Kristus räägib tänapäevalgi nagu vanal ajal.'
- Kuulutame, et Viimse Aja Pühade Jeesuse Kristuse Kirik, mis organiseeriti 6. aprillil 1830, on Kristuse
  Uue Testamendi taastatud Kirik. See Kirik on kinnitatud selle nurgakivi, Jeesuse Kristuse täiusliku
  elu ning Tema lõputu lepituse ja tõestisündinud ülestõusmise külge. Jeesus Kristus on taas kutsunud
  apostleid ja andnud neile preesterluse volituse. Ta kutsub meid kõiki tulema Tema juurde ja Tema Kirikusse,
  võtma vastu Püha Vaimu, päästeks vajalikud talitused ja tundma kestvat rõõmu.
- Nüüd on möödunud kakssada aastat sellest, kui Jumal Isa ja Tema armastatud Poeg Jeesus Kristus sellele
  taastamisele alguse panid. Miljonid kogu maailmas on võtnud omaks teadmise nendest prohvetlikult kuulutatud
  sündmustest.
- Kuulutame rõõmsalt, et lubatud taastamine edeneb jätkuva ilmutuse kaudu. Maa ei ole enam kunagi sama,
  sest Jumal kogub Kristuses „üheks kokku kõik asjad” (vt Ef 1:10).
- Aupaklikkuse ja tänuga kutsume Tema apostlitena kõiki teadma – nagu meie teame –, et taevad on avatud.
  Me kinnitame, et Jumal avaldab oma tahet oma armastatud poegadele ja tütardele. Me tunnistame, et kõiki,
  kes uurivad palvemeelselt taastamissõnumit ja tegutsevad usus, õnnistatakse isikliku tunnistusega selle
  jumalikkusest ja selle eesmärgist valmistada maailma ette meie Issanda ja Päästja Jeesuse Kristuse lubatud
  teiseks tulemiseks.
