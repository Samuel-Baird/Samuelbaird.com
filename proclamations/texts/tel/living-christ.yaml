title: జీవముతో ఉన్న క్రీస్తు
subtitle: అపొస్తలుల యొక్క సాక్ష్యము
author: యేసు క్రీస్తు యొక్క కడవరి దిన పరిశుద్ధుల సంఘము
paragraphs:
- రెండువేల సంవత్సరముల క్రితము పుట్టిన యేసు జన్మమును మనము కొనియాడుచుండగా, సాటిలేని ఆయన జీవితము మరియు అనంతమైన
  సుగుణముగల ఆయన గొప్ప ప్రాయశ్చిత్త త్యాగము యొక్క వాస్తవికతను గూర్చి మేము సాక్ష్యమిచ్చుచున్నాము. మరెవరూ
  కూడా ఈ భూమి పైన జీవించిన మరియు జీవించబోవు వారందరిపై ఇంతటి లోతైన ప్రభావము కలిగియుండలేదు.
- ఆయన పాత నిబంధన యొక్క గొప్ప యెహోవా, క్రొత్త నిబంధన యొక్క మెస్సీయ. ఆయన తండ్రి యొక్క మార్గదర్శకత్వాన, ఆయన
  ఈ భూమిని సృష్టించెను. “సమస్తమును ఆయన మూలముగా కలిగెను; కలిగియున్నదేదియు ఆయన లేకుండ కలుగలేదు” (యోహాను
  1:3). పాపము లేనివాడైనప్పటికీ, సమస్త నీతిని నెరవేర్చుటకై ఆయన బాప్తిస్మమునొందెను. ఆయన “మేలు చేయుచు సంచరించుచుండెను”
  (అపొ. కార్య. 10:38), అయినను తృణీకరింపబడెను. ఆయన సువార్త శాంతి మరియు సమాధానము యొక్క సందేశము. తన మాదిరిని
  అనుసరించమని ఆయన అందరినీ వేడుకొనెను. ఆయన రోగులను స్వస్థపరచుచు, గ్రుడ్డివారు చూచునట్లుగా చేయుచు, మరణించిన
  వారిని లేపుచు పాలస్తీనా దారులలో నడిచెను. ఆయన నిత్యత్వము యొక్క సత్యములను, మన పూర్వమర్త్య ఉనికి యొక్క
  వాస్తవికతను, ఈ భూమిపై మన జీవితము యొక్క ఉద్దేశమును మరియు రాబోవు జీవితములో దేవుని యొక్క కుమారులు మరియు
  కుమార్తెల సంభావ్యతను బోధించెను.
- గొప్పదైన ఆయన ప్రాయశ్చిత్త త్యాగమునకు జ్ఞాపకార్థముగా ఆయన సంస్కారమును ఏర్పరచెను. ఆయన కల్పితమైన నేరములకై
  నిందింపబడెను మరియు బంధింపబడెను, అల్లరిమూకను తృప్తిపరచుటకై దోషియని తీర్పునొందెను మరియు కల్వరి సిలువపైన
  మరణించుటకై శిక్షనొందెను. సమస్త మానవాళి పాపములకు ప్రాయశ్చిత్తము చేయుటకై ఆయన తన ప్రాణమునిచ్చెను. భూమిపై
  జీవించే వారందరి తరఫున ఆయన ఇచ్చినది ఒక గొప్ప ప్రత్యామ్నాయ బహుమానము.
- సమస్త మానవ చరిత్రకు కేంద్రమైనట్టి ఆయన జీవితము బేత్లెహేములో ఆరంభము కాలేదు, కల్వరిలో ముగియలేదని మేము గంభీరముగా
  సాక్ష్యమిచ్చుచున్నాము. ఆయన, తండ్రి యొక్క తొలి సంతానము, శరీరధారియైన అద్వితీయ కుమారుడు, లోకము యొక్క రక్షకుడు.
- “నిద్రించిన వారిలో ప్రథమ ఫలముగా నుండుటకై” (1 కొరింథీయులకు 15:20) సమాధిలో నుండి ఆయన లేచెను. లేచిన ప్రభువుగా,
  జీవితములో ఆయన ప్రేమించిన వారిని ఆయన దర్శించెను. ప్రాచీన అమెరికాలోనున్న తన “వేరే గొఱ్ఱెల” (యోహాను 10:16)
  మధ్య కూడా ఆయన పరిచర్య చేసెను. ఈ ఆధునిక ప్రపంచములో, ఆయన మరియు ఆయన తండ్రి బాలుడైన జోసెఫ్‌ స్మిత్‌కు ప్రత్యక్షమై,
  దీర్ఘకాలంగా వాగ్దానం చేయబడిన దానిని “కాలము సంపూర్ణమైనప్పుడు జరుగవలసిన యేర్పాటును బట్టి” (ఎఫెసీయులకు
  1:10) జరిగించెను.
- 'జీవముతో ఉన్న క్రీస్తును గూర్చి, ప్రవక్త జోసెఫ్‌ ఈ విధముగా వ్రాసెను: “ఆయన నేత్రములు అగ్నిజ్వాలవలే ఉండెను;
  ఆయన తలవెంట్రుకలు తెల్లగా శుద్ధమైన హిమమువలే ఉండెను; ఆయన ముఖము మహాతేజస్సుతో ప్రకాశించుచున్న సూర్యునివలే
  ఉండెను; ఆయన కంఠస్వరము విస్తార జలప్రవాహముల ధ్వనివలే, యెహోవా కంఠస్వరమువలే నుండి, ఈలాగు చెప్పుచుండెను:'
- “ఆదియు అంతమును నేనే; జీవించుచున్న వాడను నేనే, వధించబడిన వాడను నేనే; తండ్రితో మీ న్యాయవాదిగా ఉన్నాను”
  (సి మరియు ని 110:3–4).
- 'ఆయన గూర్చి ప్రవక్త ఈవిధంగా కూడా ప్రకటించెను: “ఇప్పుడు, ఆయనను గూర్చి ఇవ్వబడిన అనేక సాక్ష్యముల తరువాత
  ఆయనను గూర్చి ఇచ్చు సాక్ష్యములన్నిటిలో ఇది చివరిది: అదేమనగా ఆయన సజీవుడు!'
- “ఏలయనగా దేవుని కుడిచేతి వైపున ఆయనను మేము చూచితిమి; ఆయన తండ్రి యొక్క అద్వితీయుడని ఒక స్వరము సాక్ష్యము
  చెప్పుటను వింటిమి—
- “ఆయన చేత, ఆయన ద్వారా, ఆయన వలన ప్రపంచములు సృష్టించబడెను మరియు సృష్టించబడును, వాటి నివాసులు దేవునికి కుమారులు,
  కుమార్తెలునైయున్నారు” (సి మరియు ని 76:22–24).
- “క్రీస్తు యేసే ముఖ్యమైన మూలరాయియై యుండగా అపొస్తలులును, ప్రవక్తలును వేసిన పునాది మీద” (ఎఫెసీయులకు 2:20)
  ఆయన యాజకత్వము మరియు ఆయన సంఘము భూమి పైన పునరుద్ధరింపబడెను అని గంభీర వాక్కులతో ఆయనను గూర్చి మేము ప్రకటించుచున్నాము.
- ఏదో ఒకరోజు ఈ భూమి పైకి ఆయన తిరిగి రానైయున్నాడని మేము సాక్ష్యమిచ్చుచున్నాము. “యెహోవా యొక్క మహిమ బయలుపరచబడును.
  ఒకడును తప్పకుండ సర్వశరీరులు దాని చూచెదరు” (యెషయా 40:5). ఆయన రాజులకు రాజై పరిపాలించును మరియు ప్రభువులకు
  ప్రభువై ఏలును, ప్రతి మోకాలును వంగును మరియు ఆయన ముందర స్తుతించుచు ప్రతి నాలుకయు మాట్లాడును. మన క్రియల
  చేత మరియు మన హృదయవాంఛల ప్రకారము ప్రతీ ఒక్కరము ఆయనచే తీర్పుతీర్చబడుటకై నిలిచెదము.
- ఆయన చేత క్రమముగా నియమించబడిన అపొస్తలులుగా మేము సాక్ష్యమిచ్చుచున్నాము—యేసే జీవముతో నున్న క్రీస్తు, దేవుని
  యొక్క అమర్త్య కుమారుడు. ఆయన గొప్ప రాజైన ఇమ్మానుయేలు, తన తండ్రి కుడి పార్శ్వమందు ఈనాడు నిలిచియున్నాడు.
  ఆయన ఈ లోకమునకు వెలుగు, జీవము మరియు నిరీక్షణయైయున్నాడు. ఆయన మార్గము ఈ జీవితములో సంతోషము వైపు నడిపించుటకు
  మరియు రాబోవు లోకములో నిత్య జీవము వైపు నడిపించుటకు త్రోవయైయున్నది. ఆయన దైవిక కుమారుని యొక్క సాటిలేని
  బహుమానము కొరకు దేవునికి కృతజ్ఞతలు చెల్లించాలి.
date: 2000, జనవరి 1
