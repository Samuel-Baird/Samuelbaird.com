title: యేసు క్రీస్తు సువార్త సంపూర్ణత యొక్క పునఃస్థాపన
subtitle: ప్రపంచమునకు ద్విశతాబ్ది ప్రకటన
author: యేసు క్రీస్తు యొక్క కడవరి దిన పరిశుద్ధుల సంఘము యొక్క ప్రథమ అధ్యక్షత్వము మరియు పన్నెండుమంది అపొస్తలుల
  సలహాసభ
note: 2020, ఏప్రిల్ 5వ తేదీన యూటాలోని సాల్ట్ లేక్ సిటీలో జరిగిన 190వ వార్షిక సర్వసభ్య సమావేశములో తన సందేశములో
  భాగముగా ఈ ప్రకటనను అధ్యక్షులు రస్సెల్ ఎమ్. నెల్సన్ చదివి వినిపించారు.
paragraphs:
- ప్రపంచములోని ప్రతి దేశములోనున్న తన పిల్లలను దేవుడు ప్రేమించుచున్నారని మేము గంభీరముగా ప్రకటించుచున్నాము.
  తండ్రియైన దేవుడు మనకు దైవిక పుట్టుకను, సాటిలేని జీవితమును, తన ప్రియ కుమారుడైన యేసు క్రీస్తు యొక్క అనంతమైన
  ప్రాయశ్చిత్త త్యాగమును అనుగ్రహించెను. తండ్రి యొక్క శక్తి ద్వారా యేసు తిరిగి లేచి, మరణముపై విజయము పొందెను.
  ఆయన మన రక్షకుడు, మనకు మాదిరి మరియు మన విమోచకుడు.
- రెండు వందల సంవత్సరముల క్రితం, 1820లో ఒక అందమైన వసంతకాల ఉదయమున యవ్వనుడైన జోసెఫ్ స్మిత్ ఏ సంఘములో చేరవలెనో
  తెలుసుకొనవలెనని కోరుతూ, ప్రార్థన చేయుటకు అమెరికాలోని ఉత్తర న్యూయార్క్‌లో తన ఇంటికి సమీపములోనున్న అడవిలోనికి
  వెళ్ళెను. తన ఆత్మ యొక్క రక్షణకు సంబంధించిన ప్రశ్నలను అతడు కలిగియుండెను, దేవుడు తనను నిర్దేశించునని విశ్వసించెను.
- అతని ప్రార్థనకు సమాధానముగా తండ్రియైన దేవుడు, ఆయన కుమారుడైన యేసు క్రీస్తు జోసెఫ్‌కు ప్రత్యక్షమయ్యారని
  మరియు బైబిలులో ముందే చెప్పబడినట్లుగా అన్నింటి యొక్క పునఃస్థాపనను (అపొస్తలుల కార్యములు 3:21 చూడుము) ప్రారంభించిరని
  మేము వినయముగా ప్రకటించుచున్నాము. ఈ దర్శనములో, మొదటి అపొస్తలుల మరణము తరువాత, క్రీస్తు యొక్క క్రొత్త నిబంధన
  సంఘము భూమిపై నుండి కోల్పోబడినదని అతడు తెలుసుకొనెను. దానిని తిరిగి తెచ్చుటలో జోసెఫ్ కీలక పాత్ర పోషించబోవుచుండెను.
- తండ్రి మరియు కుమారుని ఆదేశాల మేరకు, పరలోక దూతలు జోసెఫ్‌కు బోధించుటకు మరియు యేసు క్రీస్తు సంఘమును తిరిగి
  స్థాపించుటకు వచ్చెనని మేము ధృవీకరించుచున్నాము. పునరుత్థానము చెందిన బాప్తిస్మమిచ్చు యోహాను, పాప విమోచన
  కొరకు ముంచుట ద్వారా బాప్తిస్మమిచ్చు అధికారమును పునఃస్థాపించెను. మొదటి పన్నెండుమంది అపొస్తలులలో ముగ్గురైన
  పేతురు, యాకోబు, యోహానులు అపొస్తలత్వమును మరియు యాజకత్వ అధికారము యొక్క తాళపుచెవులను పునఃస్థాపించిరి. ఏలియాతో
  సహా ఇతరులు కూడా వచ్చి, మరణాన్ని అధిగమించే నిత్య సంబంధములలో కుటుంబములను శాశ్వతముగా జతచేయు అధికారమును
  పునఃస్థాపించిరి.
- ప్రాచీన గ్రంథమైన మోర్మన్ గ్రంథము—యేసు క్రీస్తు యొక్క మరియొక నిబంధనను అనువదించుటకు జోసెఫ్ స్మిత్‌కు దేవుని
  బహుమానము మరియు శక్తి ఇవ్వబడినదని కూడా మేము సాక్ష్యమిచ్చుచున్నాము. ఈ పవిత్ర గ్రంథము యొక్క పుటలు యేసు
  క్రీస్తు పునరుత్థానము తరువాత పశ్చిమ అర్థగోళములోని ప్రజల మధ్య ఆయన చేసిన వ్యక్తిగత పరిచర్య యొక్క వృత్తాంతమును
  కలిగియున్నవి. ఇది జీవితము యొక్క ఉద్దేశము గురించి బోధించును, ఆ ఉద్దేశమునకు కేంద్రమైన క్రీస్తు సిద్ధాంతమును
  వివరించును. మానవులందరూ పరలోకమందున్న ప్రేమగల తండ్రి యొక్క కుమారులు, కుమార్తెలని, మన జీవితముల కొరకు ఆయన
  ఒక దైవిక ప్రణాళికను కలిగియున్నారని, ఆయన కుమారుడైన యేసు క్రీస్తు ప్రాచీన దినములలో వలే నేడు కూడా మాట్లాడుచున్నారని
  బైబిలుకు సహలేఖనముగా మోర్మన్ గ్రంథము సాక్ష్యమిచ్చును.
- 1830, ఏప్రిల్ 6వ తేదీన ఏర్పాటు చేయబడిన యేసు క్రీస్తు యొక్క కడవరి దిన పరిశుద్ధుల సంఘము క్రీస్తు యొక్క
  పునఃస్థాపించబడిన క్రొత్త నిబంధన సంఘమని మేము ప్రకటించుచున్నాము. ఈ సంఘము దాని ప్రధాన మూలరాయియైన యేసు క్రీస్తు
  యొక్క పరిపూర్ణ జీవితముతో, ఆయన అనంతమైన ప్రాయశ్చిత్తము మరియు యధార్థమైన పునరుత్థానముతో అనుసంధానించబడినది.
  యేసు క్రీస్తు మరొకసారి అపొస్తలులను పిలిచి, వారికి యాజకత్వ అధికారమును అనుగ్రహించెను. ఆయన మనందరినీ తన
  యొద్దకు, ఆయన సంఘము యొద్దకు రమ్మని, పరిశుద్ధాత్మను, రక్షణ విధులను, శాశ్వతమైన ఆనందమును పొందమని ఆహ్వానించుచున్నారు.
- తండ్రియైన దేవుడు, ఆయన ప్రియ కుమారుడైన యేసు క్రీస్తు ఈ పునఃస్థాపనను ప్రారంభించినప్పటి నుండి ఇప్పటికి
  రెండు వందల సంవత్సరములు గడిచెను. ప్రపంచవ్యాప్తముగా కోట్ల మంది ఈ ప్రవచనాత్మక సంఘటనల జ్ఞానమును స్వీకరించిరి.
- వాగ్దానము చేయబడిన పునఃస్థాపన నిరంతర బయల్పాటు ద్వారా ముందుకు సాగునని మేము సంతోషముగా ప్రకటించుచున్నాము.
  దేవుడు “సమస్తమును క్రీస్తునందు ఏకముగా సమకూర్చునప్పుడు,” (ఎఫెసీయులకు 1:10) ఈ భూమి మునుపటిలా ఇంకెన్నడూ
  ఉండదు.
- పరలోకములు తెరువబడినవని ఆయన అపొస్తలులమైన మేము తెలుసుకున్నట్లుగా అందరూ తెలుసుకోవాలని భక్తితో, కృతజ్ఞతతో
  మేము ఆహ్వానించుచున్నాము. తన ప్రియమైన కుమారులు, కుమార్తెల కొరకు దేవుడు తన చిత్తమును తెలియజేయుచున్నారని
  మేము ధృవీకరించుచున్నాము. పునఃస్థాపన సందేశమును ప్రార్థనాపూర్వకముగా అధ్యయనము చేసి, విశ్వాసముతో వ్యవహరించే
  వారు స్వంతముగా దాని దైవత్వము యొక్క మరియు మన ప్రభువు, రక్షకుడైన యేసు క్రీస్తు యొక్క వాగ్దానము చేయబడిన
  రెండవ రాకడ కొరకు ప్రపంచమును సిద్ధము చేయవలెననే దాని ఉద్దేశము యొక్క సాక్ష్యమును పొందుటకు ఆశీర్వదింపబడెదరని
  మేము సాక్ష్యమిచ్చుచున్నాము.
