title: కుటుంబము
subtitle: ప్రపంచమునకు ఒక ప్రకటన
author: యేసు క్రీస్తు యొక్క కడవరి దిన పరిశుద్ధుల సంఘము యొక్క ప్రథమ అధ్యక్షత్వము మరియు పన్నెండుమంది అపొస్తలుల
  సలహాసభ
note: ఈ ప్రకటనను 1995, సెస్టెంబరు 23న యూటాలోని సాల్ట్ లేక్‌ సిటీలో జరిగిన ప్రధాన ఉపశమన సమాజ సమావేశము నందు
  అధ్యక్షులు గార్డన్ బి. హింక్లి తన సందేశములో భాగముగా చదివారు.
paragraphs:
- మేము యేసు క్రీస్తు యొక్క కడవరి దిన పరిశుద్ధుల సంఘము యొక్క ప్రథమ అధ్యక్షత్వము మరియు పన్నెండుమంది అపొస్తలుల
  సలహాసభ సగర్వముగా ప్రకటించునదేమనగా, స్త్రీ పురుషుల మధ్య వివాహము దేవుని చేత నియమించబడినది మరియు సృష్టికర్త
  ప్రణాళిక అయిన తన పిల్లల నిత్య గమ్యమునకు కుటుంబము కేంద్రమైయున్నది.
- మానవులందరూ, స్త్రీ మరియు పురుషుడు, దేవుని స్వరూపములో సృష్టించబడ్డారు. ప్రతీ ఒక్కరు పరలోక తల్లిదండ్రులకు
  ప్రియమైన ఆత్మ కుమారుడు లేదా కుమార్తె అయ్యున్నారు మరియు అటులనే ప్రతీ ఒక్కరు దైవిక స్వభావమును, గమ్యమును
  కలిగియున్నారు. వ్యక్తి యొక్క పూర్వమర్త్య, మర్త్య, నిత్య గుర్తింపునకు మరియు ఉద్దేశమునకు లింగభేధము ఆవశ్యకమైన
  లక్షణము.
- పూర్వమర్త్య జీవితములో ఆత్మ కుమారులు మరియు కుమార్తెలు దేవుడిని వారి నిత్యుడగు తండ్రిగా ఎరిగి, ఆరాధించారు
  మరియు ఆయన ప్రణాళికను అంగీకరించారు, తద్వారా ఆయన పిల్లలు భౌతిక శరీరమును పొందగలరు, పరిపూర్ణత వైపు సాగిపోవు
  భూలోక అనుభవమును గడించగలరు మరియు చివరకు నిత్య జీవపు వారసులుగా వారి దైవిక గమ్యమును చేరుకోగలరు. సంతోషము
  కొరకైన ఈ దైవిక ప్రణాళిక కుటుంబ బాంధవ్యములను మరణము తరువాత కూడా శాశ్వతముగా ఉండునట్లు చేస్తుంది. పరిశుద్ధ
  దేవాలయములలో లభ్యమగు పవిత్రమైన విధులు మరియు నిబంధనలు వ్యక్తులు దేవుని యొక్క సన్నిధికి తిరిగి వెళ్ళుటను
  మరియు కుటుంబాలు నిత్యము కలిసి ఉండుటను సుసాధ్యం చేస్తాయి.
- భర్త మరియు భార్యగా మాతాపితృత్వమును గూర్చి వారి సామర్థ్యమునకు సంబంధించిన మొదటి ఆజ్ఞను దేవుడు ఆదాము మరియు
  హవ్వకు ఇచ్చారు. దేవుడు భూమిని హెచ్చించి, నింపుమని ఆయన బిడ్డలకిచ్చిన ఆజ్ఞ ఇప్పటికీ అమలులో ఉన్నదని మేము
  ప్రకటించుచున్నాము. పిల్లలను పుట్టించు పవిత్ర శక్తులు చట్టబద్ధముగా భార్యాభర్తలుగా వివాహము చేసుకొనిన స్త్రీ
  పురుషుల మధ్య మాత్రమే వినియోగింపబడవలెనను ప్రభువు ఆజ్ఞను కూడా మేము ప్రకటించుచున్నాము.
- మర్త్య జీవితమును సృష్టించుటకు ఏర్పరచిన సాధనములు దైవికముగా ఏర్పరచబడినవని మేము ప్రకటించుచున్నాము. జీవితము
  యొక్క పవిత్రతను మరియు దేవుని నిత్య ప్రణాళికలో దాని ప్రాధాన్యతను మేము రూఢిపరచుచున్నాము.
- భార్యాభర్తలు ఒకరినొకరు మరియు వారి పిల్లలను ప్రేమించుటకు, భద్రత కల్పించుటకు పవిత్రమైన బాధ్యత కలిగియున్నారు.
  “బిడ్డలు యెహోవా అనుగ్రహించు స్వాస్థ్యము” (కీర్తనలు 127:3). తల్లిదండ్రులు వారి పిల్లలను ప్రేమలో మరియు
  నిజాయితీలో పెంచుటకు, వారి శారీరక మరియు ఆత్మీయ అవసరతల కొరకు సమకూర్చుటకు మరియు ఒకరినొకరు ప్రేమించి, సేవ
  చేసుకొనుటను, దేవుని ఆజ్ఞలను పాటించుటను, వారు ఎక్కడ నివసించిననూ శాసనములను వహించు పౌరులుగా ఉండుటను వారికి
  బోధించు పవిత్ర విధిని కలిగియున్నారు. భార్యాభర్తలు, తల్లిదండ్రులు ఈ బాధ్యతల నిర్వహణకు దేవుని యెదుట లెక్క
  అప్పగించవలసిన వారైయున్నారు.
- కుటుంబము దేవునిచేత నియమించబడినది. ఆయన నిత్య ప్రణాళికకు స్త్రీ పురుషుల మధ్య వివాహము ఆవశ్యకమైనది. పిల్లలు
  వివాహబంధములో మాత్రమే జన్మించవలెను మరియు పూర్తి విశ్వాసముతో వివాహ ప్రమాణములను గౌరవించు తల్లిదండ్రులచేత
  పెంచబడవలెను. ప్రభువైన యేసు క్రీస్తు యొక్క బోధనలపై పునాది వేయబడిన కుటుంబ జీవితములో సంతోషము మరింత అధికముగా
  పొందబడును. విశ్వాస సూత్రములు, ప్రార్థన, పశ్చాత్తాపము, క్షమాపణ, గౌరవము, ప్రేమ, దయ, పని మరియు ఆరోగ్యకరములైన,
  మనోరంజకములైన కార్యక్రమములపై విజయవంతమైన వివాహములు మరియు కుటుంబములు స్థాపించబడి, నిర్వహించబడును. దైవిక
  రూపకల్పన ద్వారా, తండ్రులు ప్రేమ మరియు నీతితో వారి కుటుంబములపై అధ్యక్షత్వం వహించాలి మరియు వారి జీవితావసరాలను
  అందించి, వారి కుటుంబములను కాపాడవలసిన బాధ్యత వారికి ఉంది. తల్లులు వారి పిల్లల పోషణకు ప్రాథమికముగా బాధ్యులు.
  ఈ పవిత్ర బాధ్యతలలో తండ్రులు మరియు తల్లులు సమాన భాగస్థులుగా ఒకరికొకరు సహాయము చేసుకొనుటకు బద్ధులైయున్నారు.
  వైకల్యము, మరణము లేదా ఇతర పరిస్థితులు వ్యక్తిగత సవరణ అవసరమగునట్లు చేయవచ్చు. అవసరమైనప్పుడు ఇతర కుటుంబ
  సభ్యులు వారి సహకారమును అందించవలెను.
- వ్యక్తులు ఎవరైతే పవిత్రత యొక్క నిబంధనలను అతిక్రమించెదరో, భాగస్వామిని లేదా పిల్లలను హింసించెదరో లేదా
  కుటుంబ బాధ్యతలను నిర్వర్తించడంలో విఫలమగుదురో వారు ఒకరోజు దేవుని యెదుట లెక్క అప్పగించవలసిన వారైయుందురని
  మేము హెచ్చరించుచున్నాము. మేము ఇంకను కుటుంబముల యొక్క విచ్చిన్నములు వ్యక్తులపైన, సమాజములపైన, దేశములపైన
  ప్రాచీన మరియు ఆధునిక ప్రవక్తలచే ప్రవచించబడిన విపత్తులను తెచ్చునని హెచ్చరించుచున్నాము.
- కుటుంబమును సమాజము యొక్క ప్రధాన భాగముగా గ్రహించి బలపరచుటకు రూపొందించబడిన ప్రమాణములను హెచ్చించమని ప్రతిచోట
  నున్న బాధ్యతగల పౌరులకు మరియు ప్రభుత్వ అధికారులకు మేము పిలుపునిచ్చుచున్నాము.
