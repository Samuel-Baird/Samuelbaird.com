retrieved: '2026-11-02'
title: Jēzus Kristus evaņģēlija pilnības atjaunošana
subtitle: Divsimtgades vēstījums pasaulei
author: Pēdējo Dienu Svēto Jēzus Kristus Baznīcas Augstākais prezidijs un Divpadsmit apustuļu padome
note: Šo vēstījumu prezidents Rasels M. Nelsons nolasīja kā daļu no savas uzrunas 190. gadskārtējā vispārējā
  konferencē, kas notika 2020. gada 5. aprīlī Soltleiksitijā, Jūtas štatā.
paragraphs:
- Mēs svinīgi paziņojam, ka Dievs mīl Savus bērnus ikvienā pasaules tautā. Dievs Tēvs ir dāvājis mums
  Sava mīļotā Dēla, Jēzus Kristus, dievišķo piedzimšanu, nepārspējamo dzīvi un bezgalīgo Izpirkšanas upuri.
  Ar Tēva spēku Jēzus augšāmcēlās un izcīnīja uzvaru pār nāvi. Viņš ir mūsu Glābējs, mūsu Paraugs un mūsu
  Pestītājs.
- Pirms divsimt gadiem, kādā skaistā 1820. gada pavasara rītā, gados jaunais Džozefs Smits, cenzdamies
  saprast, kurai baznīcai pievienoties, devās uz mežu netālu no savām mājām, ASV Ņujorkas štata ziemeļdaļā,
  lai lūgtu Dievu. Viņam bija jautājumi par savas dvēseles pestīšanu, un viņš paļāvās uz Dieva vadību.
- Mēs pazemīgi paziņojam, ka, atbildot uz Džozefa lūgšanu, viņam parādījās Dievs Tēvs un Viņa Dēls, Jēzus
  Kristus, kuri iesāka „visu lietu atjaunošanu” (Ap. d. 3:21), kā tas ir pareģots Bībelē. Redzot šo vīziju,
  viņš uzzināja, ka pēc sākotnējo apustuļu nāves Kristus Jaunās Derības Baznīca uz Zemes bija pārstājusi
  pastāvēt. Džozefam bija jākļūst par darbarīku tās atjaunošanā.
- Mēs apliecinām, ka Tēva un Dēla vadībā ieradās debesu vēstneši, kuri apmācīja Džozefu un no jauna dibināja
  Jēzus Kristus Baznīcu. Augšāmceltais Jānis Kristītājs atjaunoja pilnvaras kristīšanai ar iegremdēšanu
  grēku piedošanai. Trīs no sākotnējiem Divpadsmit apustuļiem — Pēteris, Jēkabs un Jānis — atjaunoja apustuļa
  amatu un priesterības pilnvaru atslēgas. Ieradās vēl citi, tostarp Elija, kurš atjaunoja pilnvaras ģimeņu
  apvienošanai uz visiem laikiem mūžīgajās attiecībās, kas turpinās arī pēc nāves.
- 'Turklāt mēs liecinām, ka Džozefam Smitam tika dota Dieva dāvana un spēks, lai pārtulkotu senus pierakstus
  — Mormona Grāmatu: vēl vienu liecību par Jēzu Kristu. Šīs svētās grāmatas lappusēs ir ietverts pieraksts
  par Jēzus Kristus personīgo kalpošanu starp cilvēkiem rietumu puslodē neilgi pēc Viņa Augšāmcelšanās.
  Tā māca par dzīves mērķi un izskaidro Kristus mācību, kam ir galvenā loma šī mērķa īstenošanā. Mormona
  Grāmata ir vēl viena Svēto Rakstu grāmata, līdztekus Bībelei, kas apliecina, ka visi cilvēki ir mīloša
  Debesu Tēva dēli un meitas, ka Viņam ir dievišķa iecere mūsu dzīvei un ka Viņa Dēls, Jēzus Kristus,
  runā mūsdienās, tāpat kā sendienās.'
- Mēs paziņojam, ka Pēdējo Dienu Svēto Jēzus Kristus Baznīca, kas tika organizēta 1830. gada 6. aprīlī,
  ir Kristus atjaunotā Jaunās Derības Baznīca. Šī Baznīca stingri balstās uz tās galvenā stūrakmens, Jēzus
  Kristus, nevainojamās dzīves, Viņa bezgalīgās Grēku izpirkšanas un Viņa burtiskās Augšāmcelšanās pamata.
  Jēzus Kristus ir no jauna aicinājis apustuļus un piešķīris tiem priesterības pilnvaras. Viņš aicina
  mūs visus — nākt pie Viņa un pievienoties Viņa Baznīcai, lai saņemtu Svēto Garu, glābšanas priekšrakstus
  un iegūtu nezūdošu prieku.
- Šobrīd ir pagājuši divi simti gadu, kopš Dievs Tēvs un Viņa mīļotais Dēls, Jēzus Kristus, aizsāka šo
  Atjaunošanu. Miljoniem cilvēku visā pasaulē ir aizrautīgi pieņēmuši zināšanas par šiem iepriekš pravietotajiem
  notikumiem.
- Mēs ar prieku paziņojam, ka apsolītā Atjaunošana turpinās caur nepārtrauktu atklāsmi. Zeme vairs nekad
  nebūs tāda pati, kā agrāk, Dievam „visu apvienojot zem vienas galvas — Kristus” (Efeziešiem 1:10).
- Mēs, būdami Viņa apustuļi, ar godbijību un pateicību aicinām visus pārliecināties, kā to esam darījuši
  mēs, ka debesis ir atvērtas. Mēs apliecinām, ka Dievs dara zināmu Savu gribu attiecībā uz Saviem mīļotajiem
  dēliem un meitām. Mēs liecinām, ka tie, kuri ar lūgšanu studēs Atjaunošanas vēstījumu un rīkosies ticībā,
  tiks svētīti ar liecību par tās dievišķumu un mērķi — sagatavot pasauli apsolītajai mūsu Kunga un Glābēja,
  Jēzus Kristus, Otrajai atnākšanai.
