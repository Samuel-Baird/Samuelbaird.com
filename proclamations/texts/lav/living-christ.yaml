title: Dzīvais Kristus
subtitle: Apustuļu liecība
author: Pēdējo Dienu Svēto Jēzus Kristus Baznīca
paragraphs:
- Pieminot Jēzus Kristus nākšanu pasaulē pirms diviem gadu tūkstošiem, mēs sniedzam savu liecību par Viņa
  nepārspējamās dzīves īstenumu un Viņa veiktā Grēku izpirkšanas upura bezgalīgo vērtību. Nav neviena
  cita, kas būtu atstājis tik dziļu iespaidu uz visiem, kuri jebkad ir dzīvojuši un vēl dzīvos uz Zemes.
- Viņš bija Vecās Derības Dižais Jehova un Jaunās Derības Mesija. Sava Tēva vadībā Viņš kļuva par Zemes
  radītāju. „Caur Viņu viss ir radies, un bez Viņa nekas nav radies, kas ir” (Jāņa 1:3). Kaut arī Viņš
  bija bez grēka, Viņš tapa kristīts, lai piepildītu visu taisnību. Viņš gāja „apkārt, labu darīdams”
  (Ap. d. 10:38), tomēr tika par to nicināts. Viņa evaņģēlijs bija miera un labvēlības vēsts. Viņš dedzīgi
  lūdza visus sekot Viņa piemēram. Viņš staigāja pa Palestīnas ceļiem, dziedinādams slimos, darīdams aklos
  redzīgus un atmodinādams mirušos. Viņš mācīja mūžības patiesās mācības par mūsu pirmslaicīgās esamības
  īstenumu, par mūsu zemes dzīves mērķi un par Dieva dēlu un meitu izaugsmes iespējām pēc šīs dzīves.
- Viņš iedibināja Svēto Vakarēdienu kā atgādinājumu par Viņa veiktās Grēku izpirkšanas diženo upuri. Viņš
  tika apcietināts un nepatiesi apsūdzēts, tiesāts, lai izdabātu pūlim, un notiesāts uz nāvi pie krusta
  Golgātā. Viņš atdeva Savu dzīvību, lai izpirktu visas cilvēces grēkus. Viņš ziedojās visu to cilvēku
  labā, kuri jebkad dzīvos uz Zemes.
- Mēs svētsvinīgā garā liecinām, ka Viņa dzīve, kas ir centrālais notikums visā cilvēces vēsturē, nesākās
  Bētlemē un nebeidzās Golgātā. Viņš bija Tēva pirmdzimtais, Vienpiedzimušais Dēls miesā, pasaules Pestītājs.
- Viņš uzcēlās no mirušiem „kā pirmais no mirušajiem” (1. korintiešiem 15:20). Kā Augšāmceltais Kungs
  Viņš apciemoja tos, ko bija mīlējis Savas dzīves laikā. Viņš kalpoja arī starp „citām avīm” (Jāņa 10:16)
  senajā Amerikā. Mūslaiku pasaulē Viņš un Viņa Tēvs parādījās zēnam Džozefam Smitam, aizsākot sen apsolīto
  pilnības atklāšanas laikmetu (skat. Efeziešiem 1:10).
- 'Runājot par dzīvo Kristu, pravietis Džozefs Smits rakstīja: „Viņa acis bija kā uguns liesma; mati uz
  Viņa galvas bija balti kā tīrs sniegs; Viņa vaigs spīdēja spožāk par sauli; un Viņa balss bija kā lielu
  bangojošu ūdeņu skaņa, patiesi Jehovas balss, sakot:'
- „Es esmu pirmais un pēdējais; Es esmu Tas, kurš dzīvo, Es esmu Tas, kurš tika nokauts; Es esmu jūsu
  aizstāvis Tēva priekšā.” (M&D 110:3–4.)
- 'Vēl pravietis par Viņu pavēstīja: „Un tagad, pēc daudzām liecībām, kas ir dotas par Viņu, šī ir liecība,
  pēdējā no visām, ko mēs dodam par Viņu, — ka Viņš dzīvo!'
- Jo mēs redzējām Viņu, patiesi pie Dieva labās rokas; un mēs dzirdējām balsi liecinām, ka Viņš ir Tēva
  Vienpiedzimušais Dēls, —
- ka ar Viņu un caur Viņu, un no Viņa pasaules ir un tika radītas, un to iedzīvotāji ir dzimuši par Dieva
  dēliem un meitām.” (M&D 76:22–24.)
- Mēs svētsvinīgi paziņojam, ka Viņa priesterība un Viņa Baznīca ir atjaunota uz Zemes — „uzcelt[a] uz
  apustuļu un praviešu pamata, kura[s] stūra akmens ir Kristus Jēzus” (Efeziešiem 2:20).
- Mēs apliecinām, ka kādu dienu Viņš atgriezīsies uz Zemes, „lai parādītos Tā Kunga godība un lai visa
  cilvēce kopā to redzētu” (Jesajas 40:5). Viņš valdīs kā ķēniņu Ķēniņš un pārvaldīs kā kungu Kungs, un
  Viņa priekšā lieksies visi ceļi, un visas mēles Viņu pielūgs. Ikviens no mums stāsies Viņa priekšā,
  lai tiktu tiesāts pēc saviem darbiem un savas sirds vēlmēm.
- Būdami Viņa pienācīgi ordinētie apustuļi, mēs apliecinām, ka Jēzus ir dzīvais Kristus, nemirstīgais
  Dieva Dēls. Viņš ir varenais Ķēniņš Imanuēls, kurš šodien stāv pie Sava Tēva labās rokas. Viņš ir pasaules
  gaisma, dzīvība un cerība. Viņa ceļš ir ceļš, kas ved uz laimi šajā dzīvē un mūžīgo dzīvību nākamajā
  pasaulē. Mēs pateicamies Dievam par šo neatkārtojamo dāvanu — Viņa dievišķo Dēlu.
