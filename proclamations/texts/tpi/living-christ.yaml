title: Krais I Stap Laip
subtitle: Testimoni Bilong Ol Aposel
author: Sios bilong Jisas Krais bilong ol Seint long Las de
paragraphs:
- Taim yumi hamamasim bon de bilong Jisas Krais tu tausen yia i go pinis, mipela autim testimoni bilong
  mipela long tru tru laip bilong Em we i no wankain olsem laip long dispela graun na long bikpela klinpela
  sakrifais bilong Em. I nogat narapela i bin givim bikpela save o tingting long husat i bin stap long
  dispela graun na long husat bai go het long stap long dispela graun.
- Em i bin Bikpela Jehova bilong Olpela Testamen, Mesaia bilong Nupela Testamen. Aninit long daireksen
  bilong Papa bilong Em, Em i mekim kamap dispela graun. “Olgeta samting Em i mekim; na sapos Em i nogat
  bai i nogat ol dispela samting kamap” (Jon 1:3). Em i nogat sin, tasol Em i kisim baptisim long mekim
  kamap olgeta stretpela pasin. Em i “go nabaut long mekim gutpela pasin” (Aposel 10:38), tasol yet ol
  i bagarapim Em long gutpela wok bilong em. Gutnius bilong Em i toktok bilong bel isi na gutpela samting
  long kamap. Em i bel isi tru askim yumi olgeta long bihainim eksampel bilong Em. Em i wokabaut long
  rot bilong Palestain, oraitim ol sik, mekim aipas long lukluk, na kirapim dai man. Em i lainim toktru
  bilong stap oltaim oltaim, toktru bilong laip bipo long yumi kamap long graun, as bilong laip bilong
  yumi long graun, na long sans long ol pikinini man na meri bilong God long narapela laip long kam.
- Em i mekim o soim sakramen long yumi long tingim bikpela sakrifais bilong Em. Ol i kalabusim Em na kotim
  Em long giaman toktok, sasim Em long hamamasim ol nogut ol manmeri, na salim Em long dai long diwai
  kros bilong Kalvari. Em i givim laip bilong Em long karim sin bilong olgeta manmeri. Presen bilong Em,
  Em i bikpela presen em i givim long olgeta husat bai stap long dispela graun.
- Mipela i trutru autim testimoni olsem laip bilong Em, we namel long olgeta histori bilong man, bipo
  long mama i karim Em long Bethlehem na go het long stap bihain long idai bilong Em long bodi long Kalvari.
  Em i nambawan pikinini bilong Papa, Pikinini man trutru long bodi, Ridima bilong dispela graun.
- Em i kirap long matmat long “kamap nambawan prut bilong ol lain husat i slip” (1 Korin 15:20). Olsem
  Bikpela i kirap pinis, Em I visit wantaim husat Em i bin lavim taim Em stap laip. Em i wok misinari
  tu namel long ol arapela sipsip bilong Em” (Jon 10:16) long Amerika bipo tru. Long graun bilong tede,
  Em na Papa bilong Em kamap long boi Josep Smit, kamapim promis bilong long taim” dispela taim bilong
  olgeta samting” (Efesus 1:10).
- 'Long Krais i stap Laip, Profet Joseph i rait: “Ol ai bilong em i bin olsem lait bilong paia; gras long
  het bilong em i wait olsem puia sno; lait long pes bilong em i sain antap moa long lait bilong san;
  na nek bilong em i olsem krai bilong bikpela wara i ron spit, tru dispela nek bilong Jehova, i tok:'
- “Mi em nambawan na laspela; mi em husat i stap laip, mi em husat ol i bin kilim; mi em namel man bilong
  yupela long Papa” (D na K 110:3–4).
- 'Long Em Profet i tokaut: “Na nau, bihain long ol planti testimoni em ol narapela lain i bin givim long
  em, dispela em i testimoni, laspela bilong olgeta, em mitupela i givim long em: Olsem em i stap laip!'
- “Long wanem mitupela lukim em, tru long han sut bilong God; na mitupela harim nek i witnes olsem em
  i dispela Wanpela Pikinini Man bilong Papa Tasol—
- “Olsem long em, na thru long em, na bilong em, ol dispela wol i stap na i bin kamap, na ol lain i stap
  long ol em ol pikinini man na pikinini meri bilong God” (D na K 76:22–24).
- Mipela i autim long strongpela toktok tru olsem Prishud bilong Em na Sios bilong Em i kam bek gen pinis
  long dispela graun … “kamapim long faundesen bilong … ol aposel na profet, Jisas Krais em yet strongpela
  pos” (Efesus 2:20).
- Mipela i autim testimoni olsem Em bai sampela de kam bek long graun. “Na glori bilong Bikpela bai soim
  na olgeta bodi bai lukim wantaim” (Aisaia 40:5). Em bai rul olsem King bilong olgeta King na stap olsem
  Bikpela, na olgeta bai brukim skru na olgeta tang bai toktok long lotuim Em. Wanwan bilong yumi bai
  sanap long em jasim yumi long wanem yumi bin mekim na long laik bilong lewa bilong yumi.
- Mipela autim testimoni, olsem ol Aposel bilong Em odein pinis—olsem Jisas Em i Krais i Stap Laip, Pikinini
  man bilong God i stap oltaim oltaim. Em i bikpela King Imanuel, husait i sanap nau long hansut bilong
  Papa bilong Em. Em i lait, laip, na hop bilong dispela wol. Wei bilong Em i rot i go long hamamas long
  dispela laip na laip oltaim oltaim long graun long kam. Mipela i tenkim God long dispela presen bilong
  Holi Pikinini bilong Em we i no inap long galasim wantaim narapela.
