retrieved: '2026-11-02'
title: Restoresen bilong Olgeta Toktok bilong Gospel bilong Jisas Krais
subtitle: Wanpela Tokaut long makim 200 yia bilong Gospel long Wol
author: Nambawan Presidensi na Kaunsil bilong ol Twelpela Aposel bilong Sios bilong Jisas Krais bilong
  ol Seint long Las de
note: Presiden Russell M. Nelson i bin ridim dispela tokaut olsem hap bilong toksave bilong em long 190
  Enuel Jenerol Konferens, long namba 5 de bilong mun Epril, 2020, long Salt Lake City, Utah.
paragraphs:
- Mipela i tokaut strong olsem God i laikim tumas ol pikinini bilong Em long olgeta nesen bilong wol.
  God Papa i bin kamapim yumi olsem ol pikinini bilong Em, na givim yumi dispela laip i gutpela stret,
  na atoning sakripais bilong Jisas Krais i nogat pinis bilong en. Wantaim pawa bilong Papa, Jisas i bin
  kirap bek gen na winim dai. Em i Seivia bilong yumi, Em i soim yumi long rot, na Em i Ridima bilong
  yumi.
- Tu handred yia i go pinis, na long wanpela naispela moning long taim bilong liklik san, long yia 1820,
  Joseph Smith i bin gat bikpela laik long save wanem sios em bai bihainim, em i go long bus long beten
  klostu long haus bilong em long New York, USA. Em i bin gat planti askim long salvesen bilong sol bilong
  em na em i bin trastim olsem God bai halivim em.
- Wantaim daunpasin mipela i tokaut olsem long bekim beten bilong em God Papa na Pikinini Man bilong Em,
  Jisas Krais i kamap long Joseph na statim wok bilong “mekim olgeta samting i kamap nupela gen” (Aposel
  3:21) olsem Baibel i tok. Long dispela visen, em i lainim olsem bihain long dai bilong ol nambawan twelpela
  Aposel, Nupela Testamen Sios bilong Krais i bin lus long graun. Joseph i bai kamap olsem man husat God
  i makim em long wokim wok long bringim dispela sios i kambek.
- Mipela i tok gen olsem aninit long daireksen bilong Papa na Pikinini Man, ol man bilong karim toktok
  i kam long heven i bin kam long tisim Joseph na kirapim bek Sios bilong Jisas Krais. Jon Bilong Baptais
  husat i bin kirap bek pinis long dai i bin kam na bringim i kambek dispela atoriti bilong baptais aninit
  long wara long rausim sin. Ol tripela nambawan Aposel—Pita, Jems na Jon—i bin bringim i kambek pawa
  bilong mekim wok olsem Aposel na ol ki bilong prishud atoriti. Ol narapela i bin kam tu, olsem Elaija,
  husat i bin bringim i kambek atoriti long bungim ol famili wantaim long stap oltaim oltaim bihain long
  dai.
- Mipela i tokaut moa yet olsem Joseph Smith i bin kisim spesol blesing na pawa bilong God long tanim
  tok bilong wanpela buk bilong tumbuna taim, dispela em i Buk Momon—em i narapela testamen bilong Jisas
  Krais. Insait long dispela buk, i gat ol holi toktok olsem ministri wok bilong Jisas Krais namel long
  ol pipol long dispela hap bilong wol long Wes bihain tasol long kirap bek bilong Em. Em i toktok long
  as bilong laip bilong yumi na tok klia long doktrin bilong Krais, we em i stap namel long dispela as
  toktok. Olsem wanpela skripsa we i poromanim Buk Baibel, Buk Momon testifai olsem olgeta manmeri ol
  i pikinini bilong Papa long heven husat i laikim yumi tumas, Em i gat plen bilong laip bilong yumi,
  na Pikinini Man bilong Em Jisas Krais i toktok long yumi tede wankain olsem long taim bipo.
- Mipela i tokaut olsem Sios bilong Jisas Krais bilong ol Seint long Las De, ol i bin stretim long 6 Epril,
  1830, em i Nupela Testaman Sios bilong Krais i kambek gen. Dispela Sios i stap anka insait long stretpela
  laip bilong bikpela kona ston, Jisas Krais, na long dispela Atoning Sakripais bilong Em we i nogat arere
  bilong en, na Kirap Bek tru bilong Em. Jisas Krais i singautim gen ol Aposel na i givim ol prishud atoriti.
  Em i singautim yumi olgeta long kam long Em na long Sios bilong Em, long kisim Holi Gos, ol odinens
  bilong salvesen, na long kisim hamamas tru bilong oltaim.
- Tu handred yia i go pinis nau long taim dispela Restoresen God i bin statim wantaim Pikinini Man bilong
  Em husat Em i laikim tumas, Jisas Krais. Planti milien lain long wol i holim pasim dispela save long
  ol dispela samting ol profet i bin tok bai kamap.
- Mipela i hamamas long tokaut olsem dispela promis bilong Restoresen i go het yet long ol revelesen i
  wok long kamap yet. Dispela ples graun bai i no inap wankain olsem bipo, taim God i “bai bungim olgeta
  samting long Krais” (Efesus 1:10).
- Wantaim bikpela rispek na tok tenkyu, mipela olsem ol Aposel bilong Em i askim olgeta long save—olsem
  mipela i save—olsem ol heven i op. Mipela i tok gen olsem God i wok long mekim kamap laik bilong Em
  bilong olgeta pikinini man na meri bilong Em, Em i laikim tumas. Mipela i tokaut olsem ol lain husat
  i beten na stadi long toksave bilong Restoresen na wokim samting wantaim feit bai kisim blesing long
  kisim save bilong ol yet olsem em i wok bilong God na as bilong dispela em long redim wol long Nambatu
  Kambek bilong Bikpela na Seivia bilong yumi, Jisas Krais.
