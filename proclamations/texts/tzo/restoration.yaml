slug: restoration
language: tzo
source_url: https://www.churchofjesuschrist.org/study/scriptures/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ/the-restoration-of-the-fulness-of-the-gospel-of-jesus-christ?lang=tzo
retrieved: '2026-11-02'
title: Slikesel ta achʼ slekil kʼop Kajvaltik Jesukristo
subtitle: Aʼyej loʼil albil ta sventa sbejel banamil ta lajunvinik jabil
author: Ti Bankilal Peserenteetik xchiʼuk ti Lajchab Volol Tsobolik Jtakboliletik ta Schʼulna Jesukristo
  ta Chʼul Jchʼunolajeletik ta Slajebal Kʼakʼal
note: Peserente Russell M. Nelson la yapta ti liʼ aʼyej loʼil tanijbil skʼoplal la yal ta yaʼyej sloʼil
  ta mukʼta tsʼobajel ta jujun jabil jaʼ yoʼtolal 190, ikʼot ta pasel ta skʼakʼalil ta svoʼbal yual abril
  ta 2020, ta Salt Lake City, Utah, EE. UU.
paragraphs:
- Ta xkalkutik ta lekilal ti Rioxe skʼanojan ti yalab snichʼnab ta skotol mukʼtikil lum tas bejel banamile,
  Riox jaʼ jtotik yakʼojbutik lekil vokʼel ayanel ta sbatel osilʼ, ti kuxlejal mu stakʼ koʼoltasel xchiʼuk
  ti svokol la stoj mulil ta sbatel osil Snichʼon lek skʼanoj. Jesukristo. Ta svuʼel Jtotik, Jesus ichaʼkuxi
  xchiʼuk la spas kanal ta sventa lajel, Ti Stuke jaʼ kaj Koltavanejtik, ta jchanbetik Stalel xchiʼuk
  jaʼ kaj Pojvanejtik.
- Oy xa ta lajunvik jabil, ta jun alakʼ sba sob osil ta skʼakʼalil ta xnichinan teʼetik ta 1820, kerem
  Jose Smith, ta skʼan ta snaʼ bu junukal chʼulna ta stsʼaklin, ibat skʼopan Jtotik ta teʼetik te noʼox
  nopol ta sna ta yakʼol slumal Nueva York, Estados Unidos. Yuʼun oy kʼusi ta skʼan ta sjakʼ ta sventa
  kʼu x elan xuʼ xkol schʼulel xchiʼuk spatubil yoʼnton ta Riox ti jaʼ ta x-akʼbat yaʼaye.
- Ta nijetel ta machetel ta xkalkutik ti, kʼu x-elan la yichʼ takʼbel ti kʼu x-elan la skʼopan Jtotike,
  Riox Totil xchiʼuk snichʼon Jesukristo la yakʼ sbaik ta ilel ta stojolal Jose xchiʼuk jaʼ jech la “yichʼ
  likesel skotol kʼusitik oy” (Hechos 3:21) jech kʼu x elan albil xa onoʼox skʼoplal ta Biblia. Jech kʼu
  x elan ilbil xa o noʼoxe, Jose la yaʼay ti ta tsʼakal kʼalal ichamik ti baʼyuk jtakboliletike, ti schʼulna
  Kristo, ta skʼakʼalil Achʼ Testamento muʼyuk xa oyuk ta banamil, xchiʼuk jaʼ to stuk ta spas batsʼi
  lekil abtelal ta slikesel.
- Ta xkalkutik ti, jaʼ ta yuʼun Totil xchiʼuk Nichʼonil, italik j-almantaletik ta vinajel tal xchanubtasik
  Jose Smith xchiʼuk xchaʼlikesel Schʼulna Jesukristo. Juan J-akʼvanej ta voʼ ichaʼkuxi la xchaʼlikes
  vuʼelil sventa akʼvoʼ ta mukel ta voʼ kʼuxi xchʼay mulil. Oxib ta lajchab baʼyuk jtakboliletik—Pedro,
  Santiago xchiʼuk Juan la xchaʼlikesik ti abtelal ta jtakbolile xchiʼuk ti syavial stsatsal Jtotike.
  Xchiʼuk xtok oy italik yantik, jech kʼuchaʼal Elias Jvaʼlej yuʼun Riox ta kʼusi ta xkʼotanan ta pasel,
  bochʼo la schaʼlikes tsatsalil ta syomel stsobel jnaklumetik ta sbatel osil ti jech jaʼ echʼem to stsaloj
  kʼuchaʼal lajele.
- 'Xchiʼuk xtok ta xkalkutik ta jamal ti Jose Smith la yichʼ akʼbel svuʼel stsatsal Jtotik kʼuxi sjelubtas
  ta yan kʼop pokoʼ tsʼib: Svun Mormon, Yan skʼoptak Jesukristo. Ti ta svunaltak vaʼay chʼul vune te ta
  xichʼ tael yaʼyej sloʼilal kʼu x-elan iabtej stuk Jesukristo ta jchʼiel jkʼopojel liʼ ta jbokʼ banamil
  amerika ta tsʼakal jutuk kʼalal ichaʼkuxie. Ti Svun Mormone ta xchanubtasvan ta kʼu x-elan sjam smelol
  kuxlejal xchiʼuk ta xalbe lek smelol smantal Kristo, ti yuʼun jaʼ tsots skʼoplal ta sventa vaʼaye. Ti
  jech jaʼ lekil vun jech kʼuchaʼal Bibliae, ti Svun Mormone ta xal ta jamal ti skotol jchʼiel jkʼopojele
  jaʼ yalab snichʼnab Jtotikl ta Vinajel, ti oy kʼusi schapanoj Stuk ta sbatel osil ta sventa jkuxlejaltik
  xchiʼuk snichʼone, Jesukristo, ta skʼopanutik liʼ ta ora, jech kʼu x-elan la spas ta voʼneje.'
- Ta xkalkutik ti Schʼulna Jesukristo ta Chʼul Jchʼunulajeltik ta slajebal Kʼakʼale la yichʼ likesel ta
  svakibal skʼakʼalil yual abril ta sjabilal 1830, jaʼ likesbil ta achʼ Schʼulna Jesukristo. Ta skʼakʼalil
  Achʼ Testamentoe, Liʼ Chʼulnae jaʼ te stsakoj stsatsal yipal ta slekil skuxlej ta yoyal ton. Jesukristo
  xchiʼuk ta kʼu x-elan muʼyuk slajeb la stoj mulil xchiʼuk kʼu x-elan ichaʼ kuxi. Jesukristo la svaʼan
  yan velta jtakboliletik xchiʼuk la yakʼbe stsatsal sacerdocio. Ti Stuke ta xi yikʼutik talel ta stojolal
  Stuk xchiʼuk ta Schʼulna kʼuxi xkichʼtik Chʼul Espiritu, yichʼel koltael xchiʼuk stael skuxetel oʼntonil
  muʼyuk slajeb.
- Echʼem xa lajunvinik jabil, jaʼ o noʼox ti Riox Totil xchiʼuk Snichʼon lek Skʼanoj, Jesukristo, la slikesik
  ti liʼ kʼu x-elan la yichʼ likesele. Epal miyon jchʼiel jkʼopojel ta sbejel banamil schʼunojik xa ti
  kʼusi nabil kʼotem ta pasel ti bu albil xa o noʼox skʼoplal ta baʼyuke.
- Ta skuxetel oʼntonil ta xkalkutik ti xchaʼlikesel bu albil xa o noʼox skʼoplale lek ta xano batel jech
  kʼu x-elan ta xichʼ aʼyel batele, ti banamile muʼyuk xa bu jechuk koʼol sba, ta skoj Riox ta “svol ta
  stsob skotol kʼusitik oy x-ayan ta Kristo” (kʼelo Efesios 1:10).
- Ta lekilal ta utsilal xchiʼuk ta tojel ta vokolil, ti jech vuʼunkutik jtakbolilunkutik ta xi tavankutik
  ta ikʼel ta skotolik ta snaʼel —jech kʼu x-elan jnaʼkutik vuʼunkutik— ti vinajeletike jamalik ta xkalkutik
  lek ti Rioxe ta xakʼ ta naʼel kʼusi ta Skʼan ta skerem ta stseb. Ta xkalkutik ta jamal ti bochʼotik
  ta schanik lek ta espiritu ta skʼopanel jtotik ti aʼyej loʼil ta kʼu x-elan yichʼoj chaʼlikesel xchiʼuk
  me ta saʼik ta schʼunolajel oʼntonil ta staik tsʼuʼiltasel kʼuxi xalik ta jamal stukʼil ti slekil yutsil
  xchiʼuk kʼusi stu, ti jaʼ kʼuxi xichʼ meltsanel sbejel banamil kʼalal me ital xchibal velta jech kʼu
  x-elan yaloj Kajvaltik xchiʼuk Jkoltavanej, Jesukristoe.
