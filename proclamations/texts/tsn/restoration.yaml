retrieved: '2026-11-02'
title: Tsosoloso ya Botlalo jwa Efangele ya ga Jeso Keresete
subtitle: Kanamiso mo Lefatsheng ya Go Ipelela dingwaga tse di makgolo a mabedi
author: Boporesidente jwa Ntlha le Lekgotla la Baaposetole ba ba Lesome le Bobedi ba Kereke ya ga Jeso
  Keresete ya Baitshepi ba Malatsi a Bofelo
note: Kanamiso e e ne ya balwa ke Poresidente Russell M. Nelson jaaka karolo ya molaetsa wa gagwe kwa
  Khonforenseng ya Kakaretso ya Ngwaga le ngwaga ya bo 190, Moranang 5, 2020, kwa Salt Lake City, Utah.
paragraphs:
- Re anamisa ka masisi gore Modimo o rata bana ba Gagwe mo setšhabeng senngwe le senngwe sa lefatshe.
  Modimo Rara o re neetse botsalo jwa selegodimo, botshelo jo bo sa tshwantshanngweng, le setlhabelo sa
  tetlanyo se sesenang selekanyo sa Morwa wa Gagwe yo o Rategang, Jeso Keresete. Ka thata ya ga Rara,
  Jeso o ne a tsoga gape mme a amogela phenyo godimo ga loso. Ke Mmoloki wa rona, Sekao sa rona, le Morekolodi
  wa rona.
- Dingwaga tse di makgolo a mabedi tse di fetileng, mo mosong o montle wa dikgakologo tsa 1820, Joseph
  Smith yo mmotlana, a batla go itse gore ke kereke efe e a ka ikgolaganyang le yone, a ya mo sekgweng
  go rapela gaufi le legae la gagwe kwa bokone jwa kgaolo ya New York, USA. O ne a na le dipotso mabapi
  le poloko ya mowa wa gagwe mme a tshepa gore Modimo o tlaa mo kaela.
- Ka boikokobetso, re bolela gore mo karabong ya thapelo ya gagwe, Modimo Rara le Morwa wa Gagwe, Jeso
  Keresete, ba ne ba iponatsa mo go Joseph mme ba simolola “tsosoloso ya dilo tsotlhe” (Ditiro 3:21) jaaka
  go boletswe pele mo Baebeleng. Mo ponatshegelong e, o ne a ithuta gore morago ga loso lwa Baaposetole
  ba ntlha, Kereke ya ga Keresete ya Kgolagano e Ntšha e ne e sa tlhole e le teng mo lefatsheng. Joseph
  o tlaa nna sedirisiwa mo go boeng ga yone.
- Re tlhomamisa gore ka fa tlase ga kaelo ya ga Rara le Morwa, barongwa ba selegodimo ba ne ba tla go
  kaela Joseph le go tlhomamisa gape Kereke ya ga Jeso Keresete. Johane wa Mokolobetsi yo o tsogileng
  o ne a tsosolosa taolo ya go kolobetsa ka go nwetsa gore o itshwarelwe dibe. Ba le bararo ba Baaposetole
  ba ntlha mo go ba ba lesome le bobedi—Petere, Jakobe, le Johane—ba tsosolosa boaposetole le dilotlele
  tsa taolo ya boperesiti. Ba bangwe ba ne ba tla le bone, go akaretsa Elija, yo o neng a tsosolosa taolo
  ya go kopanya malwapa ka bosenang bokhutlo mo botsalanong jwa bosakhutleng jo bo fetang loso.
- 'Gape re fa bosupi gore Joseph Smith o ne a neelwa mpho le thata ya Modimo go ranola polelo ya bogologolo:
  Buka ya ga Momone—Kgolagano e Nngwe ya ga Jeso Keresete. Ditsebe tsa mokwalo o o boitshepo o di akaretsa
  pego ya bodiredi ka sebele jwa ga Jeso Keresete mo gare ga batho kwa bontlheng jwa Lefatshe jo bo ka
  kwa Bophirima morago fela ga Tsogo ya Gagwe. E ruta ka maikaelelo a botshelo le go tlhalosa thuto ya
  ga Keresete, e e leng konokono mo maikaelelong ao. Jaaka mopati wa dikwalo tse di boitshepo wa Baebele,
  Buka ya ga Momone e paka gore batho botlhe ke barwa le barwadie Rara wa Legodimo yo o lorato, gore O
  na le togamaano ya selegodimo ya matshelo a rona, le gore Morwa wa gagwe, Jeso Keresete, o bua mo nakong
  e fela jaaka mo malatsing a bogologolo.'
- Re bolela gore Kereke ya ga Jeso Keresete ya Baitshepi ba Malatsi a Bofelo, e e rulagantsweng Moranang
  6, 1830, ke Kereke ya ga Keresete e e tsosolositsweng ya Kgolagano e Ntšha. Kereke e e itsetsepetse
  ka botshelo jo bo itekanetseng jwa lentswe la yone le legolo la sekhutlo, Jeso Keresete, le mo Tetlanyong
  ya gagwe ya bosenang selekanyo le Tsogo tota. Jeso Keresete gape o biditse Baaposetole mme o ba neetse
  taolo ya boperesiti. O re laletsa rotlhe go tla kwa go Ene le Kereke ya Gagwe, go amogela Mowa o o Boitshepo,
  ditao tsa poloko, le go amogela boipelo jo bo sa feleng.
- Dingwaga tse di makgolo a mabedi jaanong di fetile e sale Tsosoloso e e simololwa ke Modimo Rara le
  Morwa wa Gagwe yo o Rategang, Jeso Keresete. Dimilione go ralala lefatshe ba amogetse kitso ya ditiragalo
  tse di perofetilweng tse.
- Re bolela ka boitumelo gore Tsosoloso e e solofeditsweng e ya pele ka tshenolo e e tsweletseng. Lefatshe
  ga le kitla gape le nna jaaka le ne le ntse, jaaka Modimo a tlaa “phuthela dilo tsotlhe go le gongwe
  mo go Keresete” (Baefeso 1:10)
- Ka tlotlo le malebogo, rona jaaka Baaposetole ba Gagwe re laletsa botlhe go itse—jaaka re itse—gore
  magodimo a bulegile. Re tlhomamisa gore Modimo o itsisethato ya Gagwe ya barwa le barwadie ba ba rategang.
  Re paka gore bao ba ba ithutang molaetsa wa Tsosoloso ka mowa wa thapelo mme ba dira ka tumelo ba tlaa
  segofadiwa go amogela bosupi jwa bone jwa selegodimo jwa yone le maikaelelo a yone a go baakanyetsa
  lefatshe Go Tla ga Bobedi mo go solofeditsweng ga Morena wa rona le Mmoloki, Jeso Keresete.
