title: Keresete Yo o Tshedileng
subtitle: Bopaki jwa Baaposetole
author: Kereke ya ga Jeso Keresete ya Baitshepi ba Malatsi a Bofelo
paragraphs:
- Jaaka re ntse re gopola matsalo a ga Jeso Keresete dingwaga tse di dikete tse pedi tse di fetileng,
  re fa bopaki jwa rona jwa bonnete jwa botshelo jwa Gagwe jo bosenang selekanyo le bomolemo jo bosenang
  bokhutlo jwa setlhabelo sa Gagwe se segolo sa tetlanyo. Ga go ope yo mongwe yo o nnileng le tlhotlheletso
  e kgolo go le kalo mo go botlhe ba ba kileng ba tshela le ba ba santseng ba tlaa tshela mo lefatsheng.
- E ne e le Jehofa yo Mogolo wa Kgolagano e Kgologolo, Mesia wa Kgolagano e Ntšha. Ka fa tlase ga kaelo
  ya ga Rraagwe, E ne e le mmopi wa lefatshe. “Dilo tsotlhe di dirilwe ke ene, mme kwantle ga gagwe go
  ne gosa dirwa sepe sa tse di dirilweng” (Johane 1:3). Le mororo a ne a sena sebe, O ne a kolobediwa
  go diragatsa tshiamo yotlhe. O ne a “tsamaya a dira molemo” (Ditiro 10:38), mme a nyadiwa ka seo. Efangele
  ya gagwe e ne e le molaetsa wa kagiso le tshiamo. O lopile botlhe go sala sekai sa Gagwe morago. O ne
  a tsamaya ditsela tsa Palesetina ka dinao, a fodisa ba ba lwalang, a dira gore difofu di bone, mme a
  tsosa baswi. O rutile boammaaruri jwa bosakhutleng, bonnete jwa go re re ne re le teng pele ga botshelo
  jo, maikaelelo a botshelo jwa rona mo lefatsheng, le bokgoni jwa barwa le barwadie Modimo mo botshelong
  jo bo tlang.
- O ne a tlhoma sakaramente e le segopotso sa setlhabelo sa Gagwe se segolo sa tetlanyo. O ne a tshwarwa
  le go sekisiwa ka ditatofatso tse e seng tsone, a bonwa molato go kgotsofatsa segopa, mme a atlholelwa
  go swa mo mokgorong kwa Khalefari. O ne a neela botshelo jwa Gagwe go lefela dibe tsa batho botlhe.
  Sa gagwe e ne e le mpho e kgolo mo boemong jwa botlhe ba ba tlaa tshelang mo lefatsheng.
- Re paka ka masisi gore botshelo jwa Gagwe, jo bo leng konokono ya ditso tsa batho, ga bo a simolola
  kwa Bethelehema le fa e le go felela kwa Khalefari. E ne e le Motsalwapele wa ga Rara, Morwa yo o Tsetsweng
  a le Esi mo na meng, Morekolodi wa lefatshe.
- O tsogile mo lebitleng “go nna lebutswapele la ba ba robetseng” (1 Bakorinthe 15:20). Jaaka Morena yo
  o Tsogileng, O ne a etela mo gare ga bao a neng a ba ratile mo botshelong. O ne le gone a direla mo
  gare ga “dinku tse dingwe” tsa Gagwe (Johane 10:16) kwa Amerika wa bogologolo. Mo lefatsheng la gompieno,
  Ene le Rraagwe ba ne ba iponatsa go mosimane Joseph Smith, ba simolola “tsamaiso e e saleng e solofeditswe
  ya dinako ka botlalo” (Baefeso 1:10).
- 'Ka Keresete yo o tshedileng Moperofeti Joseph o kwadile: “Matlho a gagwe a ne a ntse jaaka kgabo ya
  molelo; moriri wa tlhogo ya gagwe o le mosweu jaaka kapoko e e itshekileng; sefatlhogo sa gagwe se phatsima
  go feta phatsimo ya letsatsi; mme lentswe la gagwe le ne le le jaaka go suma ga goelela ga metsi a magolo,
  e bong lentswe la ga Jehofa, le re:'
- “Ke nna wa ntlha le wa bofelo; ke nna yo ke tshedileng, ke nna yo ke bolailweng; ke nna mmueledi wa
  lona le Rara” (D&D 110:3–4).
- 'Ka Ene Moperofeti le ene o ne a bolela: “Mme jaanong, morago ga bopaki jo bontsi jo bo neetsweng ka
  ene, se ke bopaki, jwa bofelo jwa otlhe, jo re bo neelang ka ene: Gore o tshedile!'
- “Gonne re mmone, e leng mo seatleng sa moja sa Modimo; mme re utlwile lentswe le supa tshupo e gore
  ke e ne Morwa yo o Tsetsweng a le Esi wa ga Rara—
- “Gore ka ene, le go ya ka ene, le mo go ene, mafatshe a teng mme a ne a bopiwa, ebile baagi ba ba mo
  go one ke barwa le barwadi ba ba tsetsweng ba le esi ke Modimo” (D&D 76:22–24).
- Re bolela ka mafoko a a masisi gore boperesiti jwa Gagwe le Kereke ya Gagwe di tsosolotswe mo lefatsheng—“di
  agilwe mo motheong wa … baaposetole le baperofeti, Jeso Keresete ka boene e le lentswe le legolo la
  sekhutlo” (Baefeso 2:20).
- Re paka gore letsatsi lengwe O tlaa boela mo lefatsheng. “Mme kgalalelo ya Morena e tlaa senolwa, mme
  nama yotlhe e tlaa e bona mmogo” (Isaia 40:5). O tlaa busa jaaka Kgosi ya Dikgosi mme a rene jaaka Morena
  wa Barena, mme mangole otlhe a tlaa obama mme diteme tsotlhe di tlaa bua mo kobamelong fa pele ga Gagwe.
  Mongwe le mongwe wa rona o tlaa ema go atlholwa ke Ene go yeng ka ditiro tsa rona le dikeletso tsa dipelo
  tsa rona.
- Re fa bopaki, jaaka Baaposetole ba gagwe ba ba tlhomilweng sentle—gore Jeso ke Keresete yoo Tshedileng,
  Morwa wa Modimo yo sa sweng. Ke Kgosi e kgolo Emmanuele, yo o emeng gompieno mo letsogong la moja la
  ga Rraagwe. Ke lesedi, botshelo, le tsholofelo ya lefatshe. Tsela ya gagwe ke mmila o o isang kwa boitumelong
  mo botshelong jo le botshelo jo bosakhutleng mo lefatsheng le le tlaa tlang. Modimo a lebogelwe neo
  e e senang selekanyo ya Morwa wa Gagwe wa selegodimo.
