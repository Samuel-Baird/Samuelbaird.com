title: Mekwalwana ya Tumelo
subtitle: ya Kereke ya ga Jeso Keresete ya Baitshepi ba Malatsi a Bofelo
author: ''
verses:
- n: 1
  text: Re dumela mo Modimong, Rara wa Bosakhutleng, le mo go Morwaagwe, Jeso Keresete, le mo Moweng o
    o Boitshepo.
- n: 2
  text: Re dumela gore batho ba tla a otlhaelwa dibe tsa bone, mme eseng tlolomolao ya ga Atamo.
- n: 3
  text: Re dumela gore goeng ka Tefo ya ga Keresete, batho botlhe ba ka nna ba bolokwa, ka go obamela
    melao le ditlhomo tsa Efangele.
- n: 4
  text: 'Re dumela gore melawana ya ntlha le ditlhomo tsa Efangele ke: wa ntlha, Tumelo mo go Morena Jeso
    Keresete; wa bobedi, Boikotlhao; wa boraro, Kolobetso ka go tibisiwa go amogela boitshwarelo jwa dibe;
    wa bone, go bewa diatla go amogela mpho ya Mowa o o Boitshepo.'
- n: 5
  text: Re dumela gore motho o tshwanetse go bidiwa ke Modimo, ka seporofeto, le ka go bewa diatla ke
    bao ba banang le tetla, go rera Efangele le go direla mo ditlhomong tseo.
- n: 6
  text: Re dumela mo thulaganong e e tshwanang le ya Kereke e neng ele teng ya Bogologolo, e e bidiwang,
    baaposetole, baporofiti, baruti, barutintshi, baefangedi, le jalo jalo.
- n: 7
  text: Re dumela mo neong ya diteme, seporofeto, tshenolo, dipono, phodiso, thanolo ya diteme, lejalo
    jalo.
- n: 8
  text: Re dumela Baebele e le lefoko la Modimo fela fa e ranolotswe sentle; gape re dumela Buka ya ga
    Momone gore ke lefoko la Modimo.
- n: 9
  text: Re dumela tsotlhe tse Modimo a di senotseng, tsotlhe tse a di senolang jaanong, mme re dumela
    gore o tla senola gole gontsi mogogolo le dilo tsedi botlhokwa tse di amang Bogosi jwa Modimo.
- n: 10
  text: Re dumela mo go kokoaneng ga Iseraele le mo tsosolosong ya Merafe e e Lesome; gore Sione (Jerusalema
    yo Mosha) o tla agiwa mo khonthinenteng ya Amerika; gore Keresete o tlaa busa ka boene mo lefatsheng;
    le, gore lefatshe le tlaa shafadiwa le go amogela kgalalelo ya parataese.
- n: 11
  text: Re tsaya tshono ya kobamelo Modimo Mothatayotlhe go yeng ka tlhotlheletso ya segakolodi sa rona,
    le go letlelela batho botlhe tshono e e tshwanang, gore ba dira kobamelo ya bone jang, kae, kgotsa
    e le eng.
- n: 12
  text: Re dumela mo gonne ka fa tlase ga dikgosi, boporesidente, babusi, le boramelao, mo go obameleng,
    go tlotleng, le go ema nokeng molao.
- n: 13
  text: Re dumela mo go nneng boikanyego, boammaaruri, boitshoko, bopelontle, bosiami, le godira molemo
    go batho botlhe; tota, re ka re re sala morago dikgakololo tsa ga Paulo—Re dumela dilo tsotlhe, re
    solofela dilo tsotlhe, re itshokela go fitlhelela dilong tse dintsi, le go solofela go kgona go itshokela
    go fitlhelela dilo tsotlhe. Fa go nale le sengwe sa bomolemo, se se rategang, kgotsa sa pego e e molemo
    kgotsa e e bakesegang, re a di senka dilo tse.
signature: Joseph Smith.
