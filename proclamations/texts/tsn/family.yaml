title: Lelwapa
subtitle: Kanamiso go Lefatshe
author: Boporesidente jwa Ntlha le Lekgotla la Baaposetole ba ba Lesome le Bobedi ba Kereke ya ga Jeso
  Keresete ya Baitshepi ba Malatsi a Bofelo
note: Kanamiso e e ne ya balwa ke Poresidente Gordon B. Hinckley e le karolo ya molaetsa wa gagwe kwa
  Phuthegong ya Kakaretso ya Mokgatlho wa Thuso e e neng e tshwerwe ka Lwetse 23, 1995, kwa Salt Lake
  City, Utah.
paragraphs:
- Rona, re le Boporesidente Jwa Ntlha le Lekgotla la Baaposetole ba ba Lesome le Bobedi ba Kereke ya ga
  Jeso Keresete ya Baitshepi ba Malatsi a Bofelo, re anamisa ka tlhoafalo gore lenyalo fa gare ga monna
  le mosadi le tlhomilwe ke Modimo le gore lelwapa ke pinagare ya togamaano ya Mmopi ya phelelo ya bosakhutleng
  ya bana ba Gagwe.
- Batho botlhe—banna le basadi—ba bopilwe mo setshwanong sa Modimo. Mongwe le mongwe ke morwa kgotsa morwadie
  wa semowa yo o ratwang wa batsadi ba legodimo, ka jalo, mongwe le mongwe o na le tlholego ya semodimo
  le phelelo. Bong ke mokgwa o o botlhokwa wa botshelo jwa pele jwa motho, botshelo jwa go swa, boleng
  le boikaelelo jo bosakhutleng.
- Mo bogosing jwa pele ga botshelo, barwa le barwadie ba semowa ba ne ba itse le go obamela Modimo e le
  Rara wa bone wa Bosakhutleng; mme ba amogela togamaano ya Gagwe e ka yone bana ba Gagwe ba ka amogelang
  mebele le go fitlhelela maitemogelo a lefatshe go tswelela pele go ya boitekanelong mme kwa bofelong
  ba lemoge phelelo ya bone ya selegodimo e le barua boswa ba botshelo jo bosakhutleng. Togamaano ya semodimo
  ya boitumelo e dira gore dikamano tsa lelwapa di tswelepele go feta lebitla. Ditao le dikgolagano tse
  di boitshepo tse di leng teng mo ditempeleng tse di boitshepo di dira gore go kgonege gore batho ba
  boele kwa boleng teng jwa Modimo le gore malwapa a golaganngwe ka bosakhutleng.
- Taelo ya ntlha, e Modimo a neng a e neela Atame le Efa e ne e amana le bokgoni jwa bone jwa go nna batsadi
  e le monna le mosadi. Re bolela gore taelo ya Modimo ya gore bana ba gagwe ba ntsifale le go tlatsa
  lefatshe e santse e le mo taolong. Re bolela gape gore Modimo o laotse gore maatla a a boitshepo a go
  dira bana a tshwanetse go dirisiwa fela fa gare ga monna le mosadi, ba nyalane ka fa molaong e le monna
  le mosadi.
- Re bolela gore ke ka tselaefe botshelo jwa motho bo bopilweng ka o ne go nna jo bo tlhomilweng semodimo.
  Re tlhomamisa boitshepo jwa botshelo le botlhokwa jwa jone mo togamaanong ya bosakhutleng ya Modimo.
- Monna le mosadi bana le boikarabelo jo bomasisi go ratana le go tlhokomelana le go tlhokomela bana ba
  bone. “Bana ke boswa jo botswang kwa go Morena” (Pesalema 127:3) Batsadi ba na le tiro e e boitshepo
  go godisa bana ba bone ka lorato le tshiamo, le go ba tlamela mo ditlhokong tsa bone tsa senama le tsa
  semowa, le go ba ruta go ratana le go direlana, go boloka ditaolo tsa Modimo, le go nna baagi ba baikobelang
  molao gongwe le gongwe kwa ba nnang teng. Banna le basadi—bomme le borre—ba tlaa ikarabela fa pele ga
  Modimo ka tiragatso ya maitlamo a.
- Lelwapa le tlhomilwe ke Modimo. Lenyalo fa gare ga monna le mosadi le botlhokwa thata mo togamaanong
  ya bosakhutlheng ya Gagwe. Ke tshwanelo ya bana go tsalwa mo kgolaganong ya lenyalo, le go godisiwa
  ke rre le mme ba ba tshegetsang maikano a lenyalo ka boikanyego jo bo feletseng. Boitumelo mo botshelong
  jwa lelwapa bo ka fitlhelelwa thata fa bo thailwe mo dithutong tsa Morena Jeso Keresete. Manyalo le
  malwapa a a atlegileng a tlhomamisiwa le go babalelwa mo melawaneng ya tumelo, thapelo, boikotlhao,
  boitshwarelo, tlotlo, lorato, bopelotlhomogi, tiro, le ditiro tsa itloso-bodutu tse di molemo. Ka thulaganyo
  ya semodimo, borre ba tshwanetse ba okamela malwapa a bone ka lorato le tshiamo mme ba na le maikarabelo
  a go tlamela malwapa a bone ka ditlhokego tsa botshelo le go ba sireletsa. Maikarabelo a konokono a
  bomme ke go tlhokomela bana ba bone. Mo maikarabelong a a boitshepo a, borre le bomme ba tlamega go
  thusana e le balekane ba ba lekanang. Bogole, loso, kgotsa maemo a mangwe a ka tlhoka gore motho a fetogele
  maemo. Bamasika ba tshwanetse go thusa fa go tlhokega.
- Re tlhagisa gore batho ba ba tlolang dikgolagano tsa boitsheko, ba ba sotlang bakapelo kgotsa bana,
  kgotsa ba ba palelwang ke go diragatsa maikarabelo a lelwapa ka letsatsi lengwe ba tlaa ikarabela fa
  pele ga Modimo. Mo godimo ga moo, re tlhagisa gore go thubega ga lelwapa go tlaa tlisa mo bathong, metse
  le ditšhaba matlhotlhapelo a a boletsweng e sale pele ke baperofeti ba bogologolo le ba segompieno.
- Re ikuela go baagi ba ba nang le boikarabelo le badiredi ba puso gongwe le gongwe go tlotlomatsa ditsela
  tse di thailweng go babalela le go nonotsha lelwapa le e leng karolo ya konokono ya setšhaba.
