title: A Família
subtitle: Uma Proclamação ao Mundo
author: A Primeira Presidência e o Conselho dos Doze Apóstolos d’A Igreja de Jesus Cristo dos Santos dos
  Últimos Dias
note: Esta proclamação foi lida pelo Presidente Gordon B. Hinckley como parte da sua mensagem na Reunião
  Geral da Sociedade de Socorro, realizada a 23 de setembro de 1995, em Salt Lake City, Utah, EUA.
paragraphs:
- Nós, a Primeira Presidência e o Conselho dos Doze Apóstolos d’A Igreja de Jesus Cristo dos Santos dos
  Últimos Dias, proclamamos solenemente que o casamento entre um homem e uma mulher é ordenado por Deus
  e que a família é essencial ao plano do Criador para o destino eterno dos Seus filhos.
- Todos os seres humanos, homens e mulheres, são criados à imagem de Deus. Cada indivíduo é uma filha
  ou um filho espiritual amado de pais celestiais e, como tal, possui uma natureza e um destino divinos.
  O género é uma característica essencial da identidade e do propósito pré-mortal, mortal e eterno de
  cada um.
- Na esfera pré-mortal, os filhos e as filhas espirituais conheciam e adoravam a Deus como o seu Pai Eterno
  e aceitaram o Seu plano, através do qual os Seus filhos poderiam obter um corpo físico e adquirir experiência
  terrena para progredir rumo à perfeição e, por fim, cumprir o seu destino divino como herdeiros da vida
  eterna. O plano divino de felicidade permite que os relacionamentos familiares sejam perpetuados para
  além da morte. As ordenanças e os convénios sagrados disponíveis nos templos santos, possibilitam que
  todos os indivíduos regressem à presença de Deus e que as famílias fiquem unidas para toda a eternidade.
- O primeiro mandamento que Deus deu a Adão e Eva dizia respeito ao seu potencial de se tornarem pais,
  como marido e mulher. Declaramos que o mandamento de Deus para que os Seus filhos se multiplicassem
  e enchessem a Terra continua em vigor. Declaramos ainda que Deus ordenou que os poderes sagrados da
  procriação sejam empregues apenas entre homem e mulher, legalmente casados como marido e mulher.
- Declaramos que os meios pelos quais a vida mortal é criada são divinamente estabelecidos. Afirmamos
  a santidade da vida e a sua importância no plano eterno de Deus.
- O marido e a mulher têm a solene responsabilidade de se amar e cuidar um do outro e dos seus filhos.
  “Os filhos são herança do Senhor” (Salmos 127:3). Os pais têm o dever sagrado de criar os filhos com
  amor e retidão, de suprir as suas necessidades físicas e espirituais e de os ensinar a amarem-se e a
  servirem-se uns aos outros, a guardar os mandamentos de Deus e a ser cidadãos cumpridores da lei, onde
  quer que vivam. O marido e a mulher, a mãe e o pai, terão de prestar contas perante Deus pelo cumprimento
  destas obrigações.
- A família é ordenada por Deus. O casamento entre homem e mulher é essencial para o Seu plano eterno.
  Os filhos têm o direito de nascer dentro dos laços do matrimónio e de ser criados por um pai e uma mãe
  que honram os votos matrimoniais com plena fidelidade. A felicidade na vida familiar é mais provável
  de ser alcançada quando fundamentada nos ensinamentos do Senhor Jesus Cristo. O casamento e a família
  bem-sucedidos são estabelecidos e mantidos com base nos princípios da fé, oração, arrependimento, perdão,
  respeito, amor, compaixão, trabalho e atividades recreativas salutares. Segundo o modelo divino, o pai
  deve presidir a família com amor e retidão e é responsável por suprir as suas necessidades fundamentais
  e por protegê-la. A mãe é principalmente responsável por cuidar dos filhos. Nestas responsabilidades
  sagradas, o pai e a mãe têm a obrigação de se ajudar um ao outro como parceiros iguais. Incapacidade,
  morte ou outras circunstâncias podem exigir uma adaptação individual. A família alargada deve oferecer
  apoio quando necessário.
- Advertimos que os que violam os convénios da castidade, que maltratam o cônjuge ou os filhos, ou que
  falham no cumprimento das suas responsabilidades familiares, terão um dia de prestar contas perante
  Deus. Advertimos ainda que a desintegração da família trará sobre os indivíduos, as comunidades e as
  nações as calamidades preditas pelos profetas antigos e modernos.
- Apelamos aos cidadãos e governantes responsáveis, de todas as partes do mundo, que promovam estas medidas
  concebidas para manter e fortalecer a família como a unidade fundamental da sociedade.
