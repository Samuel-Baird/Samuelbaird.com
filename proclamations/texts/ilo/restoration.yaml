retrieved: '2026-11-02'
title: Ti Pannakaisubli ti Pakabuklan ti Ebanghelio ni Jesucristo
subtitle: Maysa a Waragawag iti Lubong para iti Maika-200 a Tawen nga Anibersario
author: Ti Umuna a Panguluen ken Konseho dagiti Sangapulo-ket-dua nga Apostol ti Ti Simbaan ni Jesucristo
  dagiti Santo iti Ud-udina nga Aldaw
note: Imbasa ni Presidente Russel M. Nelson daytoy a waragawag kas paset ti mensahena iti maika-190 a
  Tinawen a Sapasap a Komperensia, idi Abril 5, 2020, iti Salt Lake City, Utah.
paragraphs:
- Sipapasnek nga iwaragawagmi nga ay-ayaten ti Dios dagiti annakna iti tunggal pagilian iti lubong. Inikkannatayo
  ti Dios Ama iti nadiosan a pannakayanak, ti awan kaaspingna a biag, ken ti awan patinggana a pangsubbot
  a sakripisio ti Ay-ayatenna nga Anak, a ni Jesucristo. Babaen ti pannakabalin ti Ama, nagungar manen
  ni Jesus ket nagballigi ken patay. Isu ti Mangisalakantayo, ti Pagwadantayo, ken ti Mannubbottayo.
- Dua gasut a tawenen ti napalabas, iti maysa a napintas nga agsapa ti panagsusulbod idi 1820, ti ubing
  a ni Joseph Smith, nga agsapsapul iti pannakaammo no ania a simbaan ti pakikamenganna, ket napan iti
  kakaywan iti asideg ti pagtaenganna iti amianan a paset ti estado ti New York, USA, tapno agkararag.
  Addaan kadagiti saludsod maipanggep iti pannakaisalakan ti kararuana ken nagtalek a ti Dios ti mangtarabay
  kenkuana.
- Sipapakumbaba nga, ipakdaarmi a kas sungbat iti kararagna, nagparang ti Dios Ama ken ti Anakna, a ni
  Jesucristo, ken ni Joseph ket nangrugi iti “pannakaisubli dagiti amin a banag” (Dagiti Aramid 3:21)
  kas naipadto iti Biblia. Iti daytoy a parmata, naammuanna a kalpasan ti ipapatay dagiti sigud nga Apostol,
  napukaw iti daga ti Simbaan ni Cristo iti Baro a Tulag. Agbalinto ni Joseph a ramit iti pannakaisubli
  daytoy.
- Pasingkedanmi a babaen ti panangiturong ti Ama ken ti Anak, immay dagiti nailangitan a mensahero a nangbilin
  ken ni Joseph a mangipasdek manen iti Simbaan ni Jesucristo. Insubli ti nagungar a ni Juan Bautista
  ti turay a mangbuniag babaen ti pannakaipabatok para iti pannakaugas ti basbasol. Tallo kadagiti sigud
  a sangapulo-ket-dua nga Apostol—da Pedro, Santiago, ken Juan—ti nangisubli iti kinaapostol ken dagiti
  tulbek ti turay ti priesthood. Immay met dagiti dadduma pay, agraman ken ni Elias, a nangisubli iti
  turay a mamagkaykaysa kadagiti pamilia iti agnanayon iti awan patinggana a pagnanaigan a mangparmek
  iti patay.
- 'Paneknekanmi pay a naikkan ni Joseph Smith iti sagut ken bileg ti Dios a mangipatarus iti maysa a nagkauna
  a kasuratan: ti Libro ti Mormon—Mainayon a Pammaneknek ken ni Jesucristo. Mairaman kadagiti panid iti
  daytoy sagrado a teksto ti maysa a pakaammuan ti personal a panagministro ni Jesucristo kadagiti tao
  iti Deppaarna iti Laud kalpasan laeng ti Panagungarna. Daytoy ti mangisuro iti panggep ti biag ken mangilawlawag
  iti doktrina ni Cristo, nga isu ti kangrunaan iti dayta a panggep. Kas maysa a kadua ti nasantuan a
  kasuratan iti Biblia, paneknekan ti Libro ni Mormon nga amin a tattao ket lallaki ken babbai nga annak
  ti managayat nga Ama iti Langit, nga addaan Isuna iti nadiosan a plano para iti biagtayo, ken ti Anakna,
  a ni Jesucristo, ket agsarita iti agdama a kas idi nagkauna a panawen.'
- Ipakdaarmi a ti Ti Simbaan ni Jesucristo dagiti Santo iti Ud-udina nga Aldaw, a nabuangay idi Abril
  6, 1830, ti naisubli a Simbaan ni Cristo iti Baro a Tulag. Sititibker a nakabatay daytoy a Simbaan iti
  naan-anay a biag ti kangrunaan a panulina a bato, a ni Jesucristo, ken iti awan patinggana a Pannubbot
  ken literal a Panagungarna. Nangawag manen ni Jesucristo kadagiti Apostol ken nangted kadakuada iti
  turay ti priesthood. Awisennatayo amin nga umasideg Kenkuana ken iti Simbaanna, tapno umawat iti Espiritu
  Santo, dagiti ordinansa ti pannakaisalakan, ken tapno manggun-od iti napaut a rag-o.
- Dua gasut a tawenen ti napalabas manipud pay idi inrugi ti Dios Ama ken ti Ay-ayatenna nga Anakna, ni
  Jesucristo daytoy a Pannakaisubli. Minilmilion a tattao iti intero a lubong ti nangawat iti pannakaammo
  maipapan kadagitoy a naipadto a paspasamak.
- Siraragsak nga ipakdaarmi a dumurdur-asen ti naikari a Pannakaisubli babaen ti agtultuloy a paltiing.
  Ti daga saanton a kas iti sigud, agsipud ta ti Dios “pagkaykaysaennanto dagiti amin a bambanag ken ni
  Cristo” (Taga-Efeso 1:10).
- Addaan iti panagraem ken panagyaman, dakami kas Apostolna awisenmi ti amin a mangammo—a kas iti panangammomi—a
  silulukat dagiti langit. Pasingkedanmi nga ipakpakaammon ti Dios ti pagayatanna kadagiti patpatgenna
  nga annak a lallaki ken babbai. Paneknekanmi a dagiti asino man a nainkararagan a mangadal iti mensahe
  ti Pannakaisubli ken agtignay a sipapammati ket mabendisionandanto a manggun-od iti bukodda a pammaneknek
  iti kinadiosanna ken ti panggepna a mangisagana iti lubong para iti naikari a Maikadua a Yaay ti Apo
  ken Mangisalakantayo, a ni Jesucristo.
