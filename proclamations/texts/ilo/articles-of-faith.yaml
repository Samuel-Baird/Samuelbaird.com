title: Ti Pagannurotan ti Pammati
subtitle: Ti Simbaan ni Jesucristo Dagiti Santo iti Ud-udina nga Aldaw
author: ''
verses:
- n: 1
  text: Mamatikami iti Dios, ti agnanayon nga Ama, ken iti Anakna a ni Jesucristo, ken iti Espiritu Santo.
- n: 2
  text: Mamatikami a madusanto dagiti tao gapu kadagiti bukodda a basol a saan a gapu iti nagbasolan ni
    Adan.
- n: 3
  text: Mamatikami a babaen ti Pannubbot ni Cristo, maisalakan amin a sangkataw-an, babaen ti panagtungpal
    kadagiti paglintegan ken ordinansa ti Ebanghelio.
- n: 4
  text: 'Mamatikami a dagiti umuna a pagbatayan ken ordinansa ti Ebanghelio: umuna, Pammati ken ni Apo
    a Jesucristo; maikadua, Panagbabawi; maikatlo, Panagbuniag babaen ti pannakaipabatok iti danum para
    iti pannakaugas dagiti basol; maikapat, Pannakaipatay dagiti dakulap a para iti sagut ti Espiritu
    Santo.'
- n: 5
  text: Mamatikami a nasken nga awagan ti Dios ti tao babaen iti padto, ken babaen ti panangipatay kadagiti
    dakulap dagiti naikkan iti turay a mangikasaba iti Ebanghelio ken mangannong kadagiti ordinansa.
- n: 6
  text: Mamatikami iti timpuyog a kapada ti Nagkauna a Simbaan, a buklen dagiti apostol, propeta, pastor,
    maestro, mangaskasaba, ken dadduma pay.
- n: 7
  text: Mamatikami iti sagut ti pagsasao, padto, paltiing, parmata, panagagas, panagipatarus ti pagsasao,
    ken dadduma pay.
- n: 8
  text: Mamatikami a sao ti Dios ti Biblia no husto la ketdi ti pannakaipatarusna; mamatikami met a sao
    ti Dios ti Libro ni Mormon.
- n: 9
  text: Mamatikami iti amin nga impalgak ti Dios, amin nga ipalpalgakna, ken mamatikami nga adu pay ti
    ipalgakna a naindaklan ken napateg a banag maipapan iti Pagarian ti Dios.
- n: 10
  text: Mamatikami iti makita a panaguummong ti Israel ken ti pannakaisubli ti kasisigud ti Sangapulo
    a Tribu; a mabangonto ti Zion (ti Baro a Jerusalem) iti kontinente ti America; nga agturayto a mismo
    ni Cristo iti daga; a mapabaronto ti daga ken awatennanto ti kangayedan a pannakaitan-okna.
- n: 11
  text: Itandudomi ti karbengan nga agrukbab iti Mannakabalin a Dios babaen ti panangibagnos ti konsensiami,
    ken ipalugodmi iti amin a tao ti umasping a karbengan, bay-anmi nga agrukbabda iti wagas no kasano,
    sadino, ken no ania pay.
- n: 12
  text: Mamatikami nga agtungpalkami kadagiti ari, presidente, mangituray, mahistrado, iti panagtungpal,
    panagdayaw, ken panangkanunong iti paglintegan.
- n: 13
  text: Mamatikami iti kinalinteg, kinapudno, kinadalus ti dayaw, kinamanangngaasi, kinasaguday ken iti
    panagaramid iti naimbag iti amin a tao; ngarud, masaomi a sursurotenmi ti pannursuro ni Pablo—Mamatikami
    iti amin a banag, mangnamnamakami iti amin a banag, adun a banag ti inibturmi, ken mangnamnamakami
    a kabaelanmi pay nga ibturan ti amin a banag. No adda nadalus, makaay-ayo, wenno addaan iti nasayaat
    a pakasaritaan wenno pakaidayawan, tun-oyanmi dagitoy a banag.
signature: Joseph Smith.
