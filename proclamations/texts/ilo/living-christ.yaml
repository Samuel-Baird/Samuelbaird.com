title: Ti Sibibiag a Cristo
subtitle: Ti Pammaneknek dagiti Apostol
author: Ti Simbaan ni Jesucristo dagiti Santo iti Ud-udina nga Aldaw
paragraphs:
- Bayat ti panangrambaktayo iti pannakayanak ni Jesucristo dua ribu a tawenen ti napalabas, idiayami ti
  pammaneknekmi maipapan iti kinapudno ti awan kapadana a biagna ken ti awan patinggana a kinatarnaw ken
  bileg ti naindaklan a pangsubbot a sakripisiona. Awan ti sabali pay a naun-uneg a pangaring iti amin
  a nagbiag ken agbiagto pay laeng iti rabaw ti daga.
- Isu ti Naindaklan a Jehova iti Daan a Tulag, ti Mesias iti Baro a Tulag. Babaen ti panangiturong ti
  Amana, Isu ti namarsua ti daga. “Dagiti isu amin napaaddada gapu kenkuana, ket no isu awan, awan ti
  napaadda kadagiti adda” (Juan 1:3). Nupay awan basolna, Isu ket nabuniagan tapno matungpal ti amin a
  kinalinteg. Isu ket “namagpagna a nagar-aramid iti naimbag” (Dagiti Aramid 10:38), ngem nauyaw isuna
  gapu iti daytoy. Ti ebangheliona ket maysa a mensahe ti talna ken pagimbagan. Sipapasnek a kiniddawna
  iti amin a sumurot iti pagwadanna. Nagna Isuna kadagiti kalsada ti Palestina, nangagas kadagiti masakit,
  nangted panagkita kadagiti bulsek, ken nangpagungar kadagiti natay. Insurona dagiti kinapudno ti agnanayon,
  ti kinapudno ti kaaddatayo iti biag sakbay daytoy a biag, ti panggep ti biagtayo iti daga, ken ti potensial
  para kadagiti lallaki ken babbai nga annak ti Dios iti umay a biag.
- Inrugina ti ordinansa ti sakramento kas panglaglagip iti naindaklan a pangsubbot a sakripisiona. Isu
  ket natiliw ken nakedngan gapu kadagiti inuulbod a pammabasol, nakedngan tapno mangparagsak iti maysa
  a bunggoy dagiti mangriribuk, ken nakedngan a matay iti krus iti Kalbario. Intedna ti biagna tapno subbotenna
  ti basbasol ti amin a sangkataw-an. Ti sagutna ket maysa a naindaklan a sagut nga agpaay iti amin nga
  agbiagto iti rabaw ti daga.
- Sipapasnekkami a mangipaneknek a ti biagna, nga isu ti kangrunaan iti amin a pakasaritaan ti tao, a
  nagbiag ni Cristo sakbay ti naindagaan a pannakayanakna iti Betlehem ket nagtultuloy a nagbiag kalpasan
  ti naindagaan a pannakatayna iti Kalbario. Isu ti Inauna ti Ama, ti Bugbugtong nga Anak iti lasag, ti
  Mannubbot ti lubong.
- Nagungar manipud iti tanem tapno “isu ti umuna a bunga kadagiti matmaturog” (1 Taga-Corinto 15:20).
  Kas Nagungar nga Apo, simmarungkar Isuna kadagiti impategna iti biag. Nagserbi pay Isuna kadagiti sabsabali
  a karnero[na]” (Juan 10:16) iti nagkauna nga America. Iti moderno a lubong, nagpakita Isu ken ti Amana
  iti ubing a ni Joseph Smith, a nangirugi iti nabayagen a naikari a “dispensasion ti pannakatungpal dagiti
  panawen” (Taga-Efeso 1:10).
- 'Maipanggep iti Sibibiag a Cristo, insurat ni Propeta Joseph: “Kasla dumardarang nga apuy dagiti matana;
  puraw ti buokna a kas iti puro a niebe; naranraniag ti rupana ngem iti init; ket ti timekna kas iti
  anasaas ti dakkel a danum, a kas iti timek ni Jehova, a nagkuna:'
- “Siak ti umuna ken maudi; siak ti nagbiag, siak ti napapatay; siak ti mangibabaet kadakayo iti Ama”
  (DkK 110:3–4).
- 'Maipanggep Kenkuana impakdaar pay ti Propeta: “Ket ita, kalpasan ti adu a pammaneknek a naipaay kenkuana,
  daytoy ti pammaneknek, a maudi iti amin, nga ipaaymi kenkuana: A sibibiag!'
- “Ta nakitami, uray ti makanawan ti Dios; ket nangngegmi ti timek a mangpaneknek nga isu ti Bugbugtong
  ti Ama—
- “A babaen kenkuana, ken gapu kenkuana, ken kenkuana, mabukel ken nabukel dagiti lubong, ket nagbalin
  nga annak a lallaki ken babbai ti Dios dagiti agindeg kadagitoy” (DkK 76:22–24).
- Ipakdaarmi kadagiti balikas a maited a sipapasnek ken sipupudno a naisublin iti daga ti kinasaserdotena
  ken ti Simbaanna—“a nabangon iti rabaw ti simiento dagiti apostol ken mammadto, ket ni Cristo Jesus
  met laeng ti bato a nangnangruna ti iking” (Taga-Efeso 2:20).
- Paneknekanmi nga Isu ket agsublinto iti daga iti maysa nga aldaw. “Ken ti dayag ni Jehova maiparangarangto,
  ken amin a lasag isu ti makitadanto amin” (Isaias 40:5). Agturayto Isuna kas Ari dagiti Ari ken agturayto
  a kas Apo dagiti Appo, ken agparintumengto amin a tumeng ket amin a dila agipudnonto kas pagdayaw iti
  sangona. Tunggal maysa kadatayo ket agtakderto tapno ukomennatayo a maibatay kadagiti aramidtayo ken
  dagiti tarigagay ti puspusotayo.
- Iburaymi ti pammaneknekmi, kas siuumno a naordenan nga Apostol—a ni Jesus ti Sibibiag a Cristo, ti imortal
  nga Anak ti Dios. Isu ti naindaklan nga Ari Emmanuel, a nagtakder ita nga aldaw iti makanawan nga ima
  ti Amana. Isu ti silaw, ti biag, ken ti namnama ti lubong. Ti dalanna isu ti dana nga agturong iti kinaragsak
  iti daytoy a biag ken agnanayon a biag iti lubong nga umay. Agyamantayo iti Dios gapu iti sagut ti nadiosan
  nga Anakna, a ti sagutna awan ti kapada wenno kayariganna.
