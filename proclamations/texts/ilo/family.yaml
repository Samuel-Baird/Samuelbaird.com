title: Ti Kaamaan
subtitle: Maysa a Waragawag iti Lubong
author: Ti Umuna a Panguluen ken Konseho dagiti Sangapulo-ket-dua nga Apostol ti Ti Simbaan ni Jesucristo
  dagiti Santo iti Ud-udina nga Aldaw
note: Daytoy a waragawag ket imbasa ni Presidente Gordon B. Hinckley kas paset ti mensahena iti General
  Relief Society Meeting a naangay idi Septiembre 23, 1995, iti Salt Lake City, Utah.
paragraphs:
- Dakami, ti Umuna a Panguluen ken ti Konseho dagiti Sangapulo-ket-dua nga Apostol ti Ti Simbaan ni Jesucristo
  dagiti Santo iti Ud-udina nga Aldaw, sipapasnekkami a mangiwaragawag a ti kallaysa iti nagbaetan ti
  maysa a lalaki ken maysa a babai ket inordenan ti Dios ken ti kaamaan ti sentro iti plano ti Namarsua
  para iti agnanayon a pagtungpalan dagiti annakna.
- Amin a tattao—lalaki ken babai—ket naparsua a kalanglanga ti Dios. Tunggal maysa ket maipatpateg nga
  espiritu nga anak a lalaki wenno babai dagiti nailangitan a nagannak, ket, iti kasta, tunggal maysa
  ket addaan iti nadiosan a kababalin ken pagtungpalan. Ti sekso ket maysa a kangrunaan a talugading ken
  panggep ti tao sakbay ti yaayna iti daga, iti kaaddana iti daga, ken ti agnanayon.
- Iti pagarian sakbay ti yaay iti daga, ammo ken nagdaydayaw iti Dios dagiti espiritu nga annak a lallaki
  ken babbai a kas Agnanayon nga Amada ken inawatda ti planona a pakagun-odan dagiti annakna iti nagtagilasag
  a bagida ken pakaaddaanda iti padas iti daga tapno dumur-as nga agturong iti pannakaan-anay ket iti
  kamaudiananna maragpatda ti nadiosan a pagtungpalanda a kas agtawid iti agnanayon a biag. Ti nadiosan
  a plano ti kinaragsak ti mangpabalin kadagiti relasion ti kaamaan tapno agtalinaed iti labes ti tanem.
  Dagiti sagrado nga ordinansa ken katulagan a magun-od kadagiti nasantuan a templo ti mangpabalin para
  kadagiti tao tapno makasubli iti sidong ti Dios ken para kadagiti kaamaan tapno agkaykaysa iti agnanayon.
- Ti umuna a bilin nga inted ti Dios kada Adan ken Eva ket maipapan iti kabaelanda nga agbalin a nagannak
  kas agassawa. Ipakdaarmi a ti bilin ti Dios para kadagiti annakna nga agpaadu ken punnuenda ti daga
  ket sitatalinaed a bilin. Ipakdaarmi pay nga imbilin ti Dios a dagiti sagrado a pannakabalin ti panagparsua
  ket maaramat laeng iti nagbaetan ti lalaki ken babai, mayannurot iti linteg a nagkallaysa kas agassawa.
- Ipakdaarmi a ti wagas a nakaparsuaan iti mortal a biag ket nadiosan a naisaad. Pasingkedanmi ti kinasagrado
  ti biag ken ti kinapategna iti agnanayon a plano ti Dios.
- Addaan dagiti agassawa iti napasnek a pagrebbengan a mangipateg ken mangaywan iti tunggal maysa ken
  dagiti annakda. “Dagiti annak ti pagpatawid ni Jehova [Apo]” (Dagiti Salmo 127:3). Addaan dagiti nagannak
  iti sagrado a pagrebbengan a mangpatanor kadagiti annakda iti ayat ken kinalinteg, mangted kadakuada
  kadagiti pisikal ken naespirituan a kasapulanda, ken mangisuro kadakuada a mangipateg ken agserbi iti
  tunggal maysa, agtungpal kadagiti bilin ti Dios, ken agbalin a managtungpal iti linteg a makipagili
  sadino man ti pagnaedanda. Dagiti agassawa—inna ken amma—ti agsungbatto iti sango ti Dios para iti pannakatungpal
  dagitoy a pagrebbengan.
- Inordenan ti Dios ti kaamaan. Ti kallaysa iti nagbaetan ti lalaki ken babai ket napateg unay iti agnanayon
  a planona. Karbengan dagiti ubbing ti mayanak kadagiti begkes ti matrimonio, ken tapno padakkelen ti
  maysa nga ama ken maysa nga ina a mangdayaw kadagiti kari ti kallaysa nga addaan iti naan-anay a kinapudno.
  Kaaduan a magun-od ti ragsak ti biag ti kaamaan no nabangon daytoy kadagiti pannursuro ni Apo Jesucristo.
  Naipasdek ken napagtalinaed dagiti naballigian a kallaysa ken kaamaan kadagiti pagbatayan ti pammati,
  kararag, panagbabawi, pammakawan, respeto, ayat, panangngaasi, aramid, ken makaay-ayo nga aramiden iti
  panagaliwaksay. Babaen ti nadiosan a plano, nasken a dagiti amma ti mangidaulo kadagiti kaamaanda iti
  ayat ken kinalinteg ken pagrebbenganda ti mangipaay kadagiti kasapulan ti biag ken pannakasaluad dagiti
  kaamaanda. Kangrunaan a pagrebbengan dagiti inna ti mangpadakkel kadagiti annakda. Kadagitoy sagrado
  a pagrebbengan, obligasion dagiti amma ken inna nga agtinnulong a kas agkadua nga addaan iti agpada
  a pagrebbengan. Ti pannakabaldado, pannakatay, wenno dadduma pay a kasasaad ket mabalin a mangpabalbaliw
  iti pagrebbengan ti tunggal maysa iti kaamaan. Nasken a tumulong dagiti kabagian ti kaamaan no kasapulan.
- Iballaagmi a dagiti tao a mangsalungasing kadagiti katulagan ti kinadalus ti dayaw, dagiti mangabuso
  iti asawa wenno anak, wenno dagiti mapaay a mangaramid kadagiti pagrebbengan iti kaamaan, nga iti maysa
  nga aldaw agtakderdanto nga agsungbat iti sango ti Dios. Iballaagmi pay a ti pannakarakrak ti kaamaan
  ket mangisangbay kadagiti tao, komunidad, ken pagilian kadagiti didigra kas impadto dagiti nagkauna
  ken kabaruanan a propeta.
- Awaganmi dagiti agrebbeng nga umili ken opisial ti gobierno iti tunggal disso nga itandudoda dagiti
  pagrukodan a naisangrat a mangpatalinaed ken mangpapigsa iti kaamaan a kas kangrunaan a yunit ti kagimongan.
