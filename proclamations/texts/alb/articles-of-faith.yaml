title: Nenet e Besimit
subtitle: të Kishës së Jezu Krishtit të Shenjtorëve të Ditëve të Mëvonshme
author: ''
verses:
- n: 1
  text: Ne besojmë në Perëndinë, Atin e Përjetshëm, dhe në Birin e Tij, Jezu Krishtin, dhe në Frymën e
    Shenjtë.
- n: 2
  text: Ne besojmë se njerëzit do të ndëshkohen për vetë mëkatet e tyre dhe jo për shkeljen e Adamit.
- n: 3
  text: Ne besojmë se nëpërmjet Shlyerjes së Krishtit, i gjithë njerëzimi mund të shpëtohet, me anë të
    bindjes ndaj ligjeve dhe ordinancave të Ungjillit.
- n: 4
  text: 'Ne besojmë se parimet dhe ordinancat e para të Ungjillit janë: së pari, Besimi në Zotin Jezu
    Krisht; së dyti, Pendimi; së treti, Pagëzimi me anë të zhytjes për heqjen e mëkateve; së katërti,
    Vënia e duarve për dhuratën e Frymës së Shenjtë.'
- n: 5
  text: Ne besojmë se një njeri duhet të thirret nga Perëndia, me anë të profecisë dhe me anë të vënies
    së duarve prej atyre që janë në autoritet, për të predikuar Ungjillin dhe për të administruar ordinancat
    e tij.
- n: 6
  text: Ne besojmë në të njëjtin organizim që ekzistonte në Kishën Primitive, domethënë, apostuj, profetë,
    barinj, mësues, ungjilltarë e kështu me radhë.
- n: 7
  text: Ne besojmë në dhuratën e gjuhëve, të profecisë, zbulesës, vegimeve, shërimit, interpretimit të
    gjuhëve e kështu me radhë.
- n: 8
  text: Ne e besojmë Biblën të jetë fjala e Perëndisë, për aq sa ajo përkthehet me saktësi; ne gjithashtu
    e besojmë Librin e Mormonit të jetë fjala e Perëndisë.
- n: 9
  text: Ne besojmë gjithçka që Perëndia ka zbuluar, gjithçka që Ai zbulon tani dhe ne besojmë se Ai përsëri
    do të zbulojë shumë gjëra të mëdha dhe të rëndësishme lidhur me Mbretërinë e Perëndisë.
- n: 10
  text: Ne besojmë në mbledhjen aktuale të Izraelit dhe në rivendosjen e Dhjetë Fiseve; që Sioni (Jeruzalemi
    i Ri) do të ndërtohet në kontinentin amerikan; që Krishti do të mbretërojë personalisht mbi tokë;
    dhe që toka do të ripërtërihet dhe do të marrë lavdinë e saj të parajsës.
- n: 11
  text: Ne shpallim privilegjin e adhurimit të Perëndisë së Plotfuqishëm në përputhje me zërin e ndërgjegjes
    sonë dhe u lejojmë të gjithë njerëzve të njëjtin privilegj, që ata duhet të adhurojnë si, ku dhe çfarë
    të zgjedhin.
- n: 12
  text: Ne besojmë në nënshtrimin ndaj mbretërve, presidentëve, sundimtarëve dhe gjykatësve, në bindjen,
    nderimin dhe mbështetjen e ligjit.
- n: 13
  text: Ne besojmë në qenien të ndershëm, të vërtetë, të dëlirë, mirëdashës, të virtytshëm dhe në bërjen
    mirë të gjithë njerëzve; në të vërtetë, ne mund të themi se ndjekim këshillën e Palit—Ne besojmë të
    gjitha gjërat, ne shpresojmë të gjitha gjërat, ne i kemi duruar të gjitha gjërat dhe shpresojmë të
    jemi në gjendje t’i durojmë të gjitha gjërat. Në qoftë se ka diçka të virtytshme, të dashur ose me
    famë të mirë apo të denjë për t’u lavdëruar, ne i kërkojmë këto gjëra.
signature: Joseph Smith.
