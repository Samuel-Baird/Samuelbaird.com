title: Krishti i Gjallë
subtitle: Dëshmia e Apostujve
author: Kisha e Jezu Krishtit e Shenjtorëve të Ditëve të Mëvonshme
paragraphs:
- Ndërsa përkujtojmë lindjen e Jezu Krishtit dy mijë vjet më parë, ne japim dëshminë tonë për vërtetësinë
  e jetës së Tij të pashoqe dhe fuqinë e pafundme të flijimit të Tij madhështor shlyes. Asnjë tjetër nuk
  ka pasur një ndikim kaq të thellë mbi të gjithë ata që kanë jetuar dhe do të jetojnë ende në tokë.
- Ai ishte Jehova i Madhërishëm i Dhiatës së Vjetër, Mesia i Dhiatës së Re. Nën drejtimin e Atit të Tij,
  Ai ishte krijuesi i tokës. “Të gjitha gjërat u bënë me anë të tij, dhe pa atë nuk u bë asnjë nga ato
  që u bënë” (Gjoni 1:3). Ndonëse pa mëkat, Ai u pagëzua për të përmbushur të gjithë drejtësinë. Ai “e
  përshkoi vendin duke bërë mirë” (Veprat e Apostujve 10:38), por megjithatë u përbuz për këtë. Ungjilli
  i Tij ishte një mesazh paqeje dhe mirëdashjeje. Ai iu përgjërua të gjithëve që ta ndiqnin shembullin
  e Tij. Ai eci rrugëve të Filistisë, duke shëruar të sëmurët, duke bërë që të verbrit të shihnin dhe
  duke ngritur të vdekurit. Ai dha mësim për të vërtetat e përjetësisë, realitetin e ekzistencës sonë
  para lindjes, qëllimin e jetës sonë në tokë dhe potencialin e bijve dhe bijave të Perëndisë në jetën
  që vjen.
- Ai e vendosi sakramentin si një kujtues për flijimin e Tij madhështor shlyes. Ai u arrestua dhe u dënua
  me akuza të rreme, u fajësua për të kënaqur një turmë dhe u dënua të vdiste në kryqin e Kalvarit. Ai
  dha jetën e Tij për të shlyer për mëkatet e gjithë njerëzimit. Ai ishte një dhuratë madhështore mëkëmbëse
  për të gjithë ata që do të jetonin ndonjëherë në tokë.
- Ne dëshmojmë solemnisht se jeta e Tij, e cila është qendrore për të gjithë historinë njerëzore, as nuk
  filloi në Bethlehem, as nuk përfundoi në Kalvar. Ai ishte i Parëlinduri i Atit, Biri i Vetëmlindur në
  mish, Shëlbuesi i botës.
- Ai u ngrit nga varri dhe “është fryti i parë i atyre që kanë fjetur” (1 Korintasve 15:20). Si Zot i
  Ringjallur, Ai i vizitoi ata që i kishte dashur në jetë. Ai gjithashtu dha shërbesë midis “dele[ve]
  të tjera” (Gjoni 10:16) të Tij në Amerikën e lashtë. Në botën moderne, Ai dhe Ati i Tij iu shfaqën djaloshit
  Jozef Smith, duke filluar “[periudhën e] plotës[isë së] kohë[ve]” (Efesianëve 1:10) që ishte premtuar
  kohë më parë.
- 'Për Krishtin e Gjallë, Profeti Jozef shkroi: “Sytë e tij ishin si flakë zjarri; dhe flokët e kokës
  së tij ishin të bardhë si dëborë e pastër; fytyra e tij shkëlqente më shumë se ndriçimi i diellit; dhe
  zëri i tij ishte si tingulli i rrjedhjes së shumë ujërave, madje zëri i Jehovës, duke thënë:'
- ‘Unë jam i pari dhe i fundit; unë jam ai që jeton, unë jam ai që u vra; unë jam avokati juaj me Atin’”
  (DeB 110:3–4).
- 'Për Të, Profeti gjithashtu shpalli: “Dhe tani, pas shumë dëshmive që janë dhënë për të, kjo është dëshmia,
  e fundit e të gjithave, që ne japim për të: Se ai jeton!'
- Sepse ne e pamë atë, madje në të djathtën e Perëndisë; dhe ne e dëgjuam zërin duke dhënë dëshmi se ai
  është i Vetëmlinduri i Atit –
- Se nga ai dhe nëpërmjet tij, dhe prej tij, botët janë e u krijuan dhe banorët e tyre janë bij e bija
  të lindura të Perëndisë” (DeB 76:22–24).
- Ne shpallim me fjalë solemne që priftëria e Tij dhe Kisha e Tij janë rivendosur në tokë, “ndërtuar mbi
  themelin e apostujve dhe … profetëve, duke qenë Jezu Krishti vetë guri [kryesor] i qoshes” (Efesianëve
  2:20).
- Ne dëshmojmë se një ditë Ai do të kthehet në tokë. “Atëherë lavdia e Zotit do të zbulohet dhe çdo qenie
  do ta shohë” (Isaia 40:5). Ai do të sundojë si Mbreti i Mbretërve dhe do të mbretërojë si Zoti i Zotërve
  dhe çdo gju do të gjunjëzohet, dhe çdo gjuhë do të flasë me adhurim para Tij. Secili nga ne do të qëndrojë
  për t’u gjykuar prej Tij sipas veprave tona dhe dëshirave të zemrave tona.
- Ne japim dëshmi, si Apostujt e Tij të shuguruar siç duhet, që Jezusi është Krishti i Gjallë, Biri i
  pavdekshëm i Perëndisë. Ai është i madhërishmi Mbreti Emanuel, i cili qëndron sot në të djathtë të Atit
  të Tij. Ai është drita, jeta dhe shpresa e botës. Udha e Tij është shtegu që të çon drejt lumturisë
  në këtë jetë dhe jetës së përjetshme në botën që vjen. I qofshim falë Perëndisë për dhuratën e pashoqe
  që na ka dhënë, Birin e Tij hyjnor!
