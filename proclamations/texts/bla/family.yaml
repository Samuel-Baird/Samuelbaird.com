title: Kitoohkawapstssin
subtitle: Noo Ootapiyisin, Noo Tsaahko Iʼtsinapsskowaaw
author: ''
note: Amo inapsskakssin Kitoohkawapstssin naa nitsiitoomaakinnaan Gordon B. Hinckey itoksstoomaayi amok
  aakiohkanakaʼtsiyisin, September 23, 1995, Salt Lake City, Utah.
paragraphs:
- Niistoonnaan nitsitaoʼtotamaʼpsspinaan kitaotoomatohpinnaan ki amoksi naatsikopotsiitapiyiiksi Aʼpistotokiw
  ototohkaʼtaniksi noo Tsisais Kaaist Otsitawatsimoyihkahpi Ki Itaomaiʼtakiitsi Sakoyiksistsikoistsi.
  Iksstoonatoʼtotamaʼpiiw annohk iʼtsinapsskowahpi miksi ihkiimsstsinaiksi mahksstaamitaʼpinnaʼkiʼsaaw
  atowaʼpistotowahpiaaw otatowanissowaayi otakiʼtomanistaopssaaw. Amohkai Aʼpistotokiw otokakksstsimaan.
  Iksstoonatsitapoʼtotamaʼpiiw miksi okoʼsiksi mahkotsstamssapowawahkanaaw annik otsitapaksipaitapiyihpiaaw
  issoohtsik.
- Noo kanaitapiiw kottakinnooniksi kinnoon ki kiksisstsinnoon Aʼpistotokiw ki oppitaam taka ihtsistapitapiwaʼsoʼp
  ma Aʼpistotokiw ki mi oppitaam. Itotoisapaʼpistotokiw manitsinaʼpiaaw. Amohkayi nohkohtatoyisanookiw
  Aʼpistotokiw. Matakohkanaiʼtomanistsinaoʼp akohkanayookitsinaoʼp. Ma ninaaw ki ma akiiw otssawomaipokawaʼssaaw
  ikkamaakiyis kiaʼa kaminayis annayi akanistsipokawaʼsiiw ki annayi akanistsipaitapiiw. Matakohkottsisawaiʼpoʼtohsiwatsiksi
  ki annayi akanistohkaʼpssiiw.
- Sawomaipokawaʼsoʼsin istsinoaʼ ki ikawatoyimmaw Aʼpistotokiw. Ma Aʼpistotokiw kinnoon itanistsitsihtaaw
  miksi okoʼsiksi, kottakinnooniksi, mahkohkohkoistoomssaiksi ki mahkoohksistapokoʼssaiksi anni nitokoʼsimmiihpi.
  Aʼpistotokiw itokakkohtomoyiiw noo matapi. Itanistsiwaiksi kitakohkottohkoistoomihpoaaw kitakohkottohkokoʼsspoaaw,
  istapakaitapiyihpoaaw. Ki moyi otokakksstsimaan itanistsiwaiksi kitakitsipokawaʼsspoaaw noo tsaahko.
  Ma ninaaw ki ma akiiw aʼtowaʼpistotowahkiaaw akitsipsstatowaʼpistotowayaaw Aʼpistotokiw okoowayi. Kamohtssapowawahkainowainiki
  moohkitsikakohtomoohpoaayi kitakohkottsskohpokaʼpaitapimowa Aʼpistotokiw ki kitsitapiimoaiksi. Ki annimai
  moksi okoʼsiksi ottakkiowawaiksi sotamaahsiʼtsimiaaw mi otokakksstsimaan.
- Otsisttsitsaokakksstsimaan ma Aʼpistotokiw itanistsiw miksi kitsitoomahksittohkaahsinnooniksi mi Adam
  ki mi Eve annohk kitakomatapipokaamihpowaaw sootamitaʼpinnaʼkik kitahkssokaʼpatowaʼpsstototssoway. Kitakitsipsstatowaʼpistototsspowaaw
  nokoowayi. Ki annohk sootaminnaʼkik kitaakaipokaamssoway kitakohtsistapakaitapiyihpowaaw noo tsaahko.
  Annohk amohk nitokakksstsimaan ikkamohtssapoinowainiki anniayi akonimm Aʼpistotokiw ki ikkamohkoipittsikatoominowainiki
  matakokakioʼsatoomatsiksay.
- Mohk pookaamssin ihtoʼtsstsiw Aʼpistotokiw. Aaniw ahksstamitaʼpinnaʼkiʼs ahksstamssokawattatoʼsi mohk
  niipaitapiyssin, nitaʼpoʼtotamaʼpiiw. Ikatsimmaʼpiiw kiaʼa ikatowaʼpiiw. Tsska mohk niipaitapiyssin
  nitaʼpoʼtotamaʼpiw mohk otokakksstsimaan.
- Miksi ihkiimsstsinaiksi ihkotayaaw maahkaotoiʼtsikatahsaaw miksi okoʼsowaiksi, mahkawaiʼstamattsaahsawaiksi;
  mahkaikimmotsiyisaiksi, makaisspommotsiyisaiksi, ki mahkakomimmotsiyisaiksi. “Aʼpistotokiw ihpsksskopaoʼkiw
  okoʼsiksi” (Ninihkssin 127:3). Ki moyi sokaʼpiiw mahkaiʼstamattsaahsawaiksi Aʼpistotokiw otsisksstsimoʼtanistsi.
  Akaiʼstamattsiyaaw miksi okoʼsowaiksi mahkohtssapowawahkahsaiks Aʼpistotokiw otokakkstsimanistsi ki
  noo tsaahko stokakksstsimanistsi. Amoistssk sawaiʼstamattsasaaw miksi okoʼsowaiksi ostowaway aksskitapsstsiiw.
  Miksistsipahtsaʼpssiyaaw.
- 'Kitoohkawapstssin ki miksi ihkiimsstsinaiksi nitaʼpitoʼtotamaʼpiw ma Aʼpistotokiw otokakksstsimaanists.
  Pokaiksi isopoyaʼpaitsitoomiaaw mahkssopoyaʼpoksistssaaw ki mahkssopoyaʼponssaaw. Miksi ainnaʼkimmiksi
  mahkssokawattatoʼsaaw mi atowaʼpistotowahpiaaw ki otatowanissoway, kitoohkawapstssin akohtaiʼtamaopiaaw
  ikkamohtaisapowawakasaaw Tsisais Kaaist nitaiʼstamattsotsiyihp. Amoistsskai aiʼstamattsotsspʼ: ahkaomaiʼtakioʼsin,
  ahkawatsimoiyihkaoʼssin, aatsimmihkaʼsin, ssaakiʼtakssin, ahkaotamimmotsiyoʼsin, ahkawakomimmotsiyoʼsin,
  ahksikimmapipitsiyoʼsin, ahkaiʼtomanitsikaʼkimaoʼsin, ki ahkaiʼtomanistsiʼtamohkanaʼpssoʼsi. Ma Aʼpistotokiw
  aaniw ma ninaaw matoʼtsitssksipoyiimi mi akiiy iksisttanistsipoʼtowayaaw kakitssikahkiw mi otakanitsistawatsimahpiaaw.
  Ma Aʼpistotokiw ihpipoʼtoyiw mi ninaay mahkaotomatoʼsay mi okoowayi ki mahkaohkoʼtsimaan. Ki mi akiiy
  ihpipoʼtoyiiw mahkaotoiʼtsikatoʼsay mi okoowayi ki miksi okoʼsowaiksi. Ki miksi otsistapiksoʼkowawaiksi
  mahksspoommoissaw ikkamapatsiyisaaw.'
- Annohk nitoʼtotoyinapsskowannaan amotssk annooksskimitssk otatowanissoway ki kataiinnaʼkohsiksi, ki
  amotssk apaiinanistotoiksi okoʼsowaiksi ki otohkiimaanowaiksi, ki maatohtssapoiyiksi ikakkohtomowahpiaaw.
  Annitsskoʼkiaaw aksinapanssatsiyaaw Aʼpistotokiw ki kimattsitsistapakkiyinapsskotsspoaaw. Amotssk nitsskai
  annokohpattsskimiaaw kitoohkawapstssin akohtawattsikimmatsistotoyiyaaw otsihkowanowawaiksi. Ki annoo
  kanaitapiw amoistssk niitsisskai iʼsskanaʼpiy aotoomaakiiksi, annohk ki nikh isskoohtsik, anistomiaaw
  akoʼtstsiyaaw.
- Ki annohk nitohkanainihkatsimatannaan amotssk nohkayikaʼkimaiksi ki Itaoʼtotamaʼpssiksi ki amotssk Aʼpotomoyiksi
  noyi aokaksstsimaiksi, mahkohksiʼtomanitsikaʼkimaahsaaw mahkohkitomanistaisokaʼpis, mahkohkitomanistaisskonataʼpis
  kitoohkawapstssinnoon. Mahkohkitomanistayiipoyssi kitsihkawaninnooniksi.
