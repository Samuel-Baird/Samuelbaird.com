title: Die Glaubensartikel
subtitle: der Kirche Jesu Christi der Heiligen der Letzten Tage
author: ''
verses:
- n: 1
  text: Wir glauben an Gott, den ewigen Vater, und an seinen Sohn, Jesus Christus, und an den Heiligen
    Geist.
- n: 2
  text: Wir glauben, dass der Mensch für seine eigenen Sünden bestraft werden wird und nicht für die Übertretung
    Adams.
- n: 3
  text: Wir glauben, dass durch das Sühnopfer Christi alle Menschen errettet werden können, indem sie
    die Gesetze und Verordnungen des Evangeliums beachten.
- n: 4
  text: 'Wir glauben, dass die ersten Grundsätze und Verordnungen des Evangeliums sind: erstens der Glaube
    an den Herrn Jesus Christus; zweitens die Umkehr; drittens die Taufe durch Untertauchen zur Sündenvergebung;
    viertens das Händeauflegen zur Gabe des Heiligen Geistes.'
- n: 5
  text: Wir glauben, dass man durch Prophezeiung und das Händeauflegen derer, die Vollmacht dazu haben,
    von Gott berufen werden muss, um das Evangelium zu predigen und seine heiligen Handlungen zu vollziehen.
- n: 6
  text: Wir glauben an die gleiche Organisation, wie sie in der Urkirche bestanden hat, nämlich Apostel,
    Propheten, Hirten, Lehrer, Evangelisten und so weiter.
- n: 7
  text: Wir glauben an die Gabe der Zungenrede, Prophezeiung, Offenbarung, der Visionen, der Heilung,
    Auslegung der Zungenrede und so weiter.
- n: 8
  text: Wir glauben, dass die Bibel, soweit richtig übersetzt, das Wort Gottes ist; wir glauben auch,
    dass das Buch Mormon das Wort Gottes ist.
- n: 9
  text: Wir glauben alles, was Gott offenbart hat, und alles, was er jetzt offenbart; und wir glauben,
    dass er noch viel Großes und Wichtiges offenbaren wird, was das Reich Gottes betrifft.
- n: 10
  text: Wir glauben an die buchstäbliche Sammlung Israels und die Wiederherstellung der Zehn Stämme, dass
    Zion (das Neue Jerusalem) auf dem amerikanischen Kontinent errichtet werden wird, dass Christus persönlich
    auf der Erde regieren wird und dass die Erde erneuert werden und ihre paradiesische Herrlichkeit empfangen
    wird.
- n: 11
  text: Wir beanspruchen das Recht, den allmächtigen Gott zu verehren, wie es uns das eigene Gewissen
    gebietet, und gestehen allen Menschen das gleiche Recht zu, mögen sie verehren, wie oder wo oder was
    sie wollen.
- n: 12
  text: Wir glauben, dass es recht ist, einem König, Präsidenten, Herrscher oder Vertreter der Staatsmacht
    untertan zu sein und das Gesetz zu beachten, zu ehren und für es einzutreten.
- n: 13
  text: Wir glauben, dass es recht ist, ehrlich, treu, keusch, gütig und tugendhaft zu sein und allen
    Menschen Gutes zu tun; ja, wir können sagen, dass wir der Ermahnung des Paulus folgen – wir glauben
    alles, wir hoffen alles, wir haben viel ertragen und hoffen, alles ertragen zu können. Wenn es etwas
    Tugendhaftes oder Liebenswertes gibt, wenn etwas guten Klang hat oder lobenswert ist, so trachten
    wir danach.
signature: Joseph Smith.
