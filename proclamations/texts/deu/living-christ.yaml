title: Der lebendige Christus
subtitle: Das Zeugnis der Apostel
author: Kirche Jesu Christi der Heiligen der Letzten Tage
paragraphs:
- Wir gedenken in diesem Jahr der Geburt Jesu Christi vor zweitausend Jahren und geben Zeugnis für die
  Wirklichkeit seines unvergleichlichen Lebens und die unendliche Macht seines großen Sühnopfers. Niemand
  sonst hatte so weitreichenden Einfluss auf alle Menschen, die schon auf der Erde gelebt haben, jetzt
  leben und noch leben werden.
- Er war der große Jehova des Alten Testaments und der Messias des Neuen Testaments. Auf Weisung seines
  Vaters erschuf er die Erde. „Alles ist durch das Wort geworden und ohne es wurde nichts, was geworden
  ist.“ (Johannes 1:3.) Obgleich sündenfrei, ließ er sich taufen, um die Gerechtigkeit ganz zu erfüllen.
  Er zog umher und tat Gutes (siehe Apostelgeschichte 10:38) und wurde doch dafür verachtet. Sein Evangelium
  war die Botschaft vom Frieden für die Menschen seines Wohlgefallens. Er forderte alle eindringlich auf,
  seinem Beispiel nachzueifern. Er wandelte auf den Straßen Palästinas, heilte die Kranken, machte die
  Blinden sehend und weckte die Toten auf. Er lehrte die ewigen Wahrheiten und sprach von der Gewissheit
  unseres vorirdischen Daseins, vom Zweck des Erdenlebens und von den Möglichkeiten, die den Söhnen und
  Töchtern Gottes im zukünftigen Leben offenstehen.
- Er führte das Abendmahl ein, das an sein großes Sühnopfer erinnern soll. Er wurde gefangen genommen
  und aufgrund falscher Anschuldigungen angeklagt. Er wurde für schuldig befunden, um die wütende Menge
  zufriedenzustellen, und zum Kreuzestod auf Golgota verurteilt. Er gab sein Leben hin, um für die Sünden
  aller Menschen zu sühnen. Dies war die große Gabe, die er stellvertretend für alle Menschen dargebracht
  hat, die je auf der Erde leben sollten.
- Wir bezeugen feierlich, dass sein Leben, das den zentralen Punkt der Menschheitsgeschichte bildet, weder
  in Betlehem begann noch auf Golgota endete. Er war der Erstgeborene des Vaters, der einziggezeugte Sohn
  im Fleisch, der Erlöser der Welt.
- Er ist aus dem Grab auferstanden als „der Erste der Entschlafenen“ (1 Korinther 15:20). Als der auferstandene
  Herr erschien er denen, die er während seines Erdenlebens geliebt hatte. Außerdem diente er seinen anderen
  Schafen (siehe Johannes 10:16) im alten Amerika. In der Neuzeit erschienen er und sein Vater dem jungen
  Joseph Smith und leiteten damit die lange verheißene „Fülle der Zeiten“ ein (Epheser 1:10).
- 'Über den lebendigen Christus schrieb der Prophet Joseph Smith: „Seine Augen waren wie eine Feuerflamme,
  sein Haupthaar war weiß wie reiner Schnee, sein Antlitz leuchtete heller als das Licht der Sonne, und
  seine Stimme tönte wie das Rauschen großer Gewässer, ja, die Stimme Jehovas, die sprach:'
- Ich bin der Erste und der Letzte; ich bin der, der lebt, ich bin der, der getötet worden ist; ich bin
  euer Fürsprecher beim Vater.“ (Lehre und Bündnisse 110:3,4.)
- 'Außerdem sagte der Prophet über ihn: „Und nun, nach den vielen Zeugnissen, die für ihn gegeben worden
  sind, ist dies, als letztes von allen, das Zeugnis, das wir für ihn geben: Er lebt!'
- Denn wir haben ihn gesehen, ja, zur rechten Hand Gottes; und wir haben die Stimme Zeugnis geben hören,
  dass er der Einziggezeugte des Vaters ist –
- dass von ihm und durch ihn und aus ihm die Welten erschaffen werden und wurden, und deren Bewohner sind
  für Gott gezeugte Söhne und Töchter.“ (Lehre und Bündnisse 76:22-24.)
- Wir verkünden feierlich, dass sein Priestertum und seine Kirche auf der Erde wiederhergestellt worden
  sind – „auf das Fundament der Apostel und Propheten gebaut; der Eckstein ist Christus Jesus selbst“
  (Epheser 2:20).
- Wir bezeugen, dass er eines Tages zur Erde zurückkehren wird. „Dann offenbart sich die Herrlichkeit
  des Herrn, alles Fleisch wird sie sehen.“ (Jesaja 40:5.) Dann regiert er als König der Könige und herrscht
  als Herr der Herren, und jedes Knie muss sich beugen und jede Zunge ihn preisen. Wir alle werden dann
  vor dem Herrn stehen und gemäß unseren Werken und den Wünschen unseres Herzens gerichtet werden.
- Wir als seine rechtmäßig ordinierten Apostel geben Zeugnis, dass Jesus der lebendige Christus ist, der
  unsterbliche Sohn Gottes. Er ist der große König Immanuel, der heute zur Rechten des Vaters steht. Er
  ist das Licht, das Leben und die Hoffnung der Welt. Sein Weg ist der Pfad, der zu Glücklichsein hier
  auf der Erde und zu ewigem Leben im Jenseits führt. Gott sei gedankt für diese unvergleichliche Gabe,
  nämlich dafür, dass er uns seinen Sohn geschenkt hat.
