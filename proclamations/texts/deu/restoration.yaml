retrieved: '2026-11-02'
title: Die Wiederherstellung der Fülle des Evangeliums Jesu Christi
subtitle: 'Zum 200. Jahrestag: Eine Proklamation an die Welt'
author: Die Erste Präsidentschaft und der Rat der Zwölf Apostel der Kirche Jesu Christi der Heiligen der
  Letzten Tage
note: Diese Proklamation wurde am 5. April 2020 von Präsident Russell M. Nelson im Rahmen seiner Ansprache
  bei der 190. Frühjahrs-Generalkonferenz in Salt Lake City verlesen.
paragraphs:
- Wir erklären feierlich, dass Gott seine Kinder in jedem Land der Welt liebt. Gottvater hat uns die göttliche
  Geburt, das unvergleichliche Leben und das unbegrenzte Sühnopfer seines geliebten Sohnes, Jesus Christus,
  geschenkt. Dank der Macht des Vaters ist Jesus wiederauferstanden und hat den Sieg über den Tod errungen.
  Er ist unser Erretter, unser Vorbild und unser Erlöser.
- Vor zweihundert Jahren, an einem schönen Frühlingsmorgen im Jahr 1820, wollte der junge Joseph Smith
  wissen, welcher Kirche er sich anschließen solle, und ging in der Nähe seines Elternhauses im Bundesstaat
  New York in einen Wald, um dort zu beten. Er hatte Fragen zur Errettung seiner Seele und vertraute darauf,
  dass Gott ihn leiten werde.
- In aller Demut erklären wir, dass ihm als Antwort auf sein Gebet Gottvater und sein Sohn, Jesus Christus,
  erschienen sind und die in der Bibel vorhergesagte „Wiederherstellung von allem“ (Apostelgeschichte
  3:21) eingeleitet haben. In dieser Vision erfuhr er, dass nach dem Tod der ursprünglichen Apostel die
  Kirche Christi aus der Zeit des Neuen Testaments von der Erde verlorengegangen war. Joseph sollte bei
  der Rückkehr dieser Kirche eine wichtige Rolle spielen.
- Wir bekräftigen, dass auf Weisung des Vaters und des Sohnes himmlische Boten erschienen sind, die Joseph
  unterwiesen und die Kirche Jesu Christi erneut aufgerichtet haben. Der auferstandene Johannes der Täufer
  stellte die Vollmacht wieder her, durch Untertauchen zur Vergebung der Sünden zu taufen. Drei der ursprünglichen
  zwölf Apostel – Petrus, Jakobus und Johannes – stellten das Apostelamt und die Schlüssel der Priestertumsvollmacht
  wieder her. Auch andere Boten kamen, darunter Elija, der die Vollmacht wiederherstellte, Familien für
  immer zu vereinen, sodass ihre Verbindung über den Tod hinaus besteht.
- 'Wir bezeugen ferner, dass Joseph Smith von Gott die Gabe und Macht erhalten hat, einen Bericht aus
  alter Zeit zu übersetzen: das Buch Mormon – einen weiteren Zeugen für Jesus Christus. Auf den Seiten
  dieses heiligen Buches wird auch geschildert, wie Jesus Christus kurz nach seiner Auferstehung unter
  den Menschen in der westlichen Erdhälfte gewirkt hat. In diesem Buch erfährt man etwas über den Sinn
  des Lebens, und darin wird auch die Lehre Christi dargelegt, die eng mit dem Sinn des Lebens verbunden
  ist. Als mit der Bibel zusammengehörige heilige Schrift bezeugt das Buch Mormon, dass alle Menschen
  Söhne und Töchter eines liebevollen Vaters im Himmel sind, dass Gott einen Plan für das Leben eines
  jeden von uns hat und dass Gottes Sohn, Jesus Christus, heute ebenso zu den Menschen spricht wie in
  alter Zeit.'
- Wir erklären, dass die Kirche Jesu Christi der Heiligen der Letzten Tage, die am 6. April 1830 gegründet
  wurde, die wiederhergestellte Kirche des Herrn aus der Zeit des Neuen Testaments ist. Das Fundament
  dieser Kirche sind das vollkommene Leben ihres Ecksteins, Jesus Christus, sowie dessen unbegrenztes
  Sühnopfer und buchstäbliche Auferstehung. Jesus Christus hat erneut Apostel berufen und ihnen Priestertumsvollmacht
  übertragen. Er lädt uns alle ein, zu ihm und in seine Kirche zu kommen, den Heiligen Geist und die errettenden
  heiligen Handlungen zu empfangen und immerwährende Freude zu erlangen.
- Zweihundert Jahre sind nun schon vergangen, seit diese Wiederherstellung von Gottvater und seinem geliebten
  Sohn Jesus Christus eingeleitet wurde. Millionen Menschen in aller Welt haben das Wissen um diese prophezeiten
  Ereignisse angenommen.
- Wir erklären voller Freude, dass die verheißene Wiederherstellung durch fortdauernde Offenbarung voranschreitet.
  Die Erde wird nie mehr so sein wie zuvor, denn Gott wird „in Christus alles … vereinen“ (Epheser 1:10;
  Einheitsübersetzung 1980).
- 'Voller Ehrfurcht und Dankbarkeit laden wir als Apostel des Herrn alle Menschen ein, das zu erkennen,
  was auch wir wissen: Die Himmel sind offen. Wir bekräftigen, dass Gott seinen Willen für seine geliebten
  Söhne und Töchter kundtut. Wir bezeugen, dass diejenigen, die sich gebeterfüllt mit der Botschaft von
  der Wiederherstellung befassen und im Glauben handeln, mit einem Zeugnis davon gesegnet werden, dass
  die Wiederherstellung von Gott kommt und dem Zweck dient, die Welt auf das verheißene Zweite Kommen
  unseres Herrn und Erretters, Jesus Christus, vorzubereiten.'
