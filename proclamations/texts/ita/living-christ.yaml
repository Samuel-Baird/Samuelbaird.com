title: Il Cristo vivente
subtitle: La testimonianza degli apostoli
author: La Chiesa di Gesù Cristo dei Santi degli Ultimi Giorni
paragraphs:
- Nel commemorare la nascita di Gesù Cristo avvenuta duemila anni fa, offriamo la nostra testimonianza
  della realtà della Sua vita senza pari e dell’infinito potere del Suo grande sacrificio espiatorio.
  Nessun altro ha esercitato un’influenza tanto profonda su tutti coloro che sono vissuti e vivranno sulla
  terra.
- Egli fu il Grande Geova dell’Antico Testamento e il Messia del Nuovo. Sotto la guida di Suo Padre Egli
  fu il Creatore della terra. “Ogni cosa è stata fatta per mezzo di [lui]; e senza di [lui] neppure una
  delle cose fatte è stata fatta” (Giovanni 1:3). Nonostante fosse senza peccato, Egli fu battezzato per
  adempiere ogni giustizia. Egli “è andato attorno facendo del bene” (Atti 10:38), tuttavia fu disprezzato
  per questo. Il Suo vangelo era un messaggio di pace e di buona volontà. Egli esortava tutti a seguire
  il Suo esempio. Percorreva le strade della Palestina guarendo gli infermi, ridando la vista ai ciechi
  e risuscitando i morti. Insegnava le verità dell’eternità, la realtà della nostra esistenza preterrena,
  lo scopo della nostra vita sulla terra e il potenziale dei figli e delle figlie di Dio nella vita a
  venire.
- Egli istituì il sacramento come memento del Suo grande sacrificio espiatorio. Fu arrestato e condannato
  sulla base di false accuse, dichiarato colpevole per soddisfare la plebaglia e condannato a morire sulla
  croce del Calvario. Egli dette la Sua vita per espiare i peccati di tutta l’umanità. Il Suo fu un grande
  dono fatto per procura in favore di tutti coloro che siano mai vissuti sulla terra.
- Noi attestiamo solennemente che la Sua vita, che è l’avvenimento centrale di tutta la storia umana,
  non iniziò a Betlemme né ebbe fine sul Calvario. Egli era il Primogenito del Padre, il Figlio Unigenito
  nella carne, il Redentore del mondo.
- Egli si levò dalla tomba per diventare la “primizia di quelli che dormono” (1 Corinzi 15:20). Come Signore
  risorto apparve a coloro che aveva amato in vita. Egli svolse il Suo ministero anche presso le Sue “altre
  pecore” (Giovanni 10:16) nell’antica America. In tempi moderni, Lui e Suo Padre apparvero al giovane
  Joseph Smith, introducendo la dispensazione della pienezza dei tempi (vedere Efesini 1:10) da tanto
  tempo promessa.
- 'Il profeta Joseph scrisse del Cristo vivente: “I suoi occhi erano come una fiamma di fuoco; i capelli
  del capo erano bianchi come la neve pura; il suo viso risplendeva più del brillare del sole e la sua
  voce era come il suono dello scorrere di grandi acque, sì, la voce di Geova che diceva:'
- Io sono il primo e l’ultimo; sono colui che vive, sono colui che fu ucciso; io sono il vostro avvocato
  presso il Padre” (DeA 110:3–4).
- 'Il Profeta disse anche di Lui: “E ora, dopo le numerose testimonianze che sono state date di lui, questa
  è la testimonianza, l’ultima di tutte, che diamo di lui: Che egli vive!'
- Poiché lo vedemmo, sì, alla destra di Dio; e udimmo la voce che portava testimonianza che egli è il
  Figlio Unigenito del Padre—
- Che da lui e tramite lui, e mediante lui, i mondi sono e furono creati, e i loro abitanti sono generati
  figli e figlie per Dio” (DeA 76:22–24).
- Noi dichiariamo con parole solenni che il Suo sacerdozio e la Sua Chiesa sono stati restaurati sulla
  terra — “edificati sul fondamento degli apostoli e dei profeti, essendo Cristo Gesù stesso la pietra
  angolare” (Efesini 2:20).
- Noi attestiamo che un giorno Egli ritornerà sulla terra. “Allora la gloria dell’Eterno sarà rivelata,
  e ogni carne, ad un tempo, la vedrà” (Isaia 40:5). Egli governerà come Re dei re e regnerà come Signore
  dei signori, e ogni ginocchio si piegherà e ogni lingua Lo adorerà. Ognuno di noi starà dinanzi a Lui
  per essere giudicato secondo le proprie opere e i desideri del proprio cuore.
- Noi rendiamo testimonianza, come Suoi apostoli debitamente ordinati, che Gesù è il Cristo vivente, l’immortale
  Figlio di Dio. Egli è il grande Re Emmanuele, che oggi sta alla destra di Suo Padre. Egli è la luce,
  la vita e la speranza del mondo. La Sua via è la strada che conduce alla felicità in questa vita e alla
  vita eterna nel mondo a venire. Sia ringraziato Dio per il dono senza pari del Suo Figlio divino.
