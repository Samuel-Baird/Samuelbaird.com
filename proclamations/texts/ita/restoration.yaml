title: La Restaurazione della pienezza del vangelo di Gesù Cristo
subtitle: Un proclama al mondo per il bicentenario
author: Prima Presidenza e Consiglio dei Dodici Apostoli de La Chiesa di Gesù Cristo dei Santi degli Ultimi
  Giorni
note: Questo proclama è stato letto dal presidente Russell M. Nelson il 5 aprile 2020 come parte del suo
  messaggio alla 190ª conferenza generale di aprile a Salt Lake City, Utah.
paragraphs:
- Noi proclamiamo solennemente che Dio ama i Suoi figli in ogni nazione del mondo. Dio Padre ci ha dato
  la nascita divina, la vita incomparabile e il sacrificio espiatorio infinito del Suo Figlio diletto,
  Gesù Cristo. Per il potere del Padre, Gesù risorse e ottenne la vittoria sulla morte. Egli è il nostro
  Salvatore, il nostro Esempio e il nostro Redentore.
- Duecento anni fa, in una bella mattina di primavera del 1820, il giovane Joseph Smith, per sapere a
  quale chiesa unirsi, andò a pregare nei boschi vicino a casa sua nella parte settentrionale dello Stato
  di New York, negli Stati Uniti. Egli aveva delle domande in merito alla salvezza della propria anima
  e confidava nel fatto che Dio lo avrebbe guidato.
- In umiltà noi dichiariamo che, in risposta alla sua preghiera, Dio Padre e Suo Figlio, Gesù Cristo,
  apparvero a Joseph e inaugurarono la “restaurazione di tutte le cose” (Atti 3:21) come predetto nella
  Bibbia. In questa visione egli apprese che, dopo la morte degli Apostoli originali, la Chiesa di Cristo
  del Nuovo Testamento era andata perduta dalla terra. Joseph sarebbe stato determinante per il suo ritorno.
- Noi affermiamo che, sotto la direzione del Padre e del Figlio, dei messaggeri celesti vennero a istruire
  Joseph e a ristabilire la Chiesa di Gesù Cristo. Il risorto Giovanni Battista restaurò l’autorità di
  battezzare per immersione per la remissione dei peccati. Tre dei dodici Apostoli originali — Pietro,
  Giacomo e Giovanni — restaurarono l’apostolato e le chiavi dell’autorità del sacerdozio. Vennero anche
  altri, tra cui Elia, il quale restaurò l’autorità di unire le famiglie per sempre in rapporti eterni
  che trascendono la morte.
- 'Noi testimoniamo inoltre che Joseph Smith ricevette il dono e il potere di Dio per tradurre antichi
  annali: Il Libro di Mormon – Un altro testamento di Gesù Cristo. Le pagine di questo testo sacro contengono
  un resoconto del ministero svolto personalmente da Gesù Cristo tra popoli dell’emisfero occidentale
  poco dopo la Sua risurrezione. Esso insegna lo scopo della vita e spiega la dottrina di Cristo, che
  è al centro di tale scopo. Come volume di Scritture complementare alla Bibbia, il Libro di Mormon rende
  testimonianza che tutti gli esseri umani sono figli e figlie di un amorevole Padre nei cieli, che Egli
  ha un piano divino per la nostra vita e che Suo Figlio, Gesù Cristo, parla oggi così come nei tempi
  antichi.'
- Noi dichiariamo che La Chiesa di Gesù Cristo dei Santi degli Ultimi Giorni, organizzata il 6 aprile
  1830, è la Chiesa di Cristo del Nuovo Testamento restaurata. Questa Chiesa è ancorata alla vita perfetta
  della sua pietra angolare principale, Gesù Cristo, alla Sua Espiazione infinita e alla Sua risurrezione
  letterale. Gesù Cristo ha chiamato di nuovo degli apostoli e ha dato loro l’autorità del sacerdozio.
  Egli invita tutti noi a venire a Lui e alla Sua Chiesa per ricevere lo Spirito Santo, le ordinanze di
  salvezza e per ottenere gioia duratura.
- Sono ora trascorsi duecento anni da quando Dio Padre e il Suo Figlio diletto, Gesù Cristo, diedero inizio
  a questa Restaurazione. Milioni di persone in tutto il mondo hanno abbracciato una conoscenza di questi
  eventi profetizzati.
- Noi dichiariamo con gioia che la Restaurazione promessa va avanti tramite la rivelazione continua. La
  terra non sarà mai più la stessa, poiché Dio “[raccoglierà] sotto un sol capo, in Cristo, tutte le cose”
  (Efesini 1:10).
- Con riverenza e gratitudine, noi, come Suoi apostoli, invitiamo tutti a sapere — come lo sappiamo noi
  — che i cieli sono aperti. Noi affermiamo che Dio sta rendendo nota la Sua volontà per i Suoi beneamati
  figli e le Sue beneamate figlie. Noi rendiamo testimonianza che coloro che studiano con l’aiuto della
  preghiera il messaggio della Restaurazione e agiscono con fede avranno la benedizione di ottenere la
  loro testimonianza personale della sua divinità e del suo scopo di preparare il mondo per la promessa
  Seconda Venuta del nostro Signore e Salvatore, Gesù Cristo.
