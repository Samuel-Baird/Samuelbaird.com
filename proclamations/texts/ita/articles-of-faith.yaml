title: Articoli di Fede
subtitle: de La Chiesa di Gesù Cristo dei Santi degli Ultimi Giorni
author: ''
verses:
- n: 1
  text: Noi crediamo in Dio, il Padre Eterno, e in Suo Figlio Gesù Cristo e nello Spirito Santo.
- n: 2
  text: Noi crediamo che gli uomini saranno puniti per i loro propri peccati e non per la trasgressione
    di Adamo.
- n: 3
  text: Noi crediamo che tramite l’Espiazione di Cristo tutta l’umanità può essere salvata, mediante l’obbedienza
    alle leggi e alle ordinanze del Vangelo.
- n: 4
  text: 'Noi crediamo che i primi principi e le prime ordinanze del Vangelo sono: primo, la fede nel Signore
    Gesù Cristo; secondo, il pentimento; terzo, il battesimo per immersione per la remissione dei peccati;
    quarto, l’imposizione delle mani per il dono dello Spirito Santo.'
- n: 5
  text: Noi crediamo che un uomo deve essere chiamato da Dio, per profezia, e mediante l’imposizione delle
    mani da parte di coloro che detengono l’autorità, per predicare il Vangelo e per amministrarne le
    ordinanze.
- n: 6
  text: 'Noi crediamo nella stessa organizzazione che esisteva nella chiesa primitiva, cioè: apostoli,
    profeti, pastori, insegnanti, evangelisti e così via.'
- n: 7
  text: Noi crediamo nel dono delle lingue, della profezia, della rivelazione, delle visioni, della guarigione,
    della interpretazione delle lingue e così via.
- n: 8
  text: Noi crediamo che la Bibbia è la Parola di Dio, per quanto è tradotta correttamente; crediamo anche
    che il Libro di Mormon è la parola di Dio.
- n: 9
  text: Noi crediamo in tutto ciò che Dio ha rivelato, in tutto ciò che rivela ora, e noi crediamo che
    Egli rivelerà ancora molte cose grandi e importanti relative al Regno di Dio.
- n: 10
  text: Noi crediamo nel raduno letterale d’Israele e nella restaurazione delle dieci tribù, che Sion
    (la Nuova Gerusalemme) sarà edificata nel continente americano, che Cristo regnerà personalmente sulla
    terra e che la terra sarà rinnovata e riceverà la sua gloria paradisiaca.
- n: 11
  text: 'Noi rivendichiamo il privilegio di adorare Dio Onnipotente secondo i dettami della nostra coscienza
    e riconosciamo a tutti gli uomini lo stesso privilegio: che adorino come, dove o ciò che vogliono.'
- n: 12
  text: Noi crediamo di dover essere soggetti ai re, ai presidenti, ai governanti ed ai magistrati, di
    dover obbedire, onorare e sostenere le leggi.
- n: 13
  text: 'Noi crediamo nell’essere onesti, fedeli, casti, benevoli e virtuosi e nel fare il bene a tutti
    gli uomini. In verità possiamo dire di seguire l’ammonimento di Paolo: crediamo ogni cosa, speriamo
    ogni cosa, abbiamo sopportato molte cose e speriamo di essere in grado di sopportare ogni cosa. Se
    vi sono cose virtuose, amabili, di buona reputazione o degne di lode, queste sono le cose che noi
    ricerchiamo.'
signature: Joseph Smith.
