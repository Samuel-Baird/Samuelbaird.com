title: Отбасы
subtitle: Әлемге Үндеу
author: ''
note: Бұл мәлімдемені президент Гордон Б. Хинкли 1995 жылы 23 қырқүйекте Солт Лейк Ситиде (Юта) өткен
  Жалпы Мейірімділік Қоғамының жиналысында сөйлеген сөзі ретінде оқыды.
paragraphs:
- Біз, Иса Мәсіхтің Соңғы Замандағы Әулиелер Шіркеуінің Бірінші Президенттігі мен Он екі Апостолдар кеңесі
  салтанатты түрде, әйел мен еркек арасындағы неке Құдай тағайындаған және Жаратушының жоспарында отбасы
  Өз балаларының мәңгілік тағдыры үшін басты орын алады деп жария етеміз.
- Барлық адамдар – еркек пен әйел – Құдай бейнесінде жаратылған. Әрқайсысы – көктегі ата-ананың сүйікті
  рухани ұлы немесе қызы, сондықтан әрқайсысының құдайлық табиғаты мен тағдыры бар. Гендер – бұл жеке
  өлім алдындағы, өлетін және мәңгілік сәйкестік пен мақсаттың маңызды сипаттамасы.
- Өлім алдындағы патшалықта рухани ұлдар мен қыздар Құдайды өздерінің Мәңгілік Әкесі деп білді және оған
  ғибадат етті және Оның балалары физикалық денеге ие болып, кемелдікке жету үшін жердегі тәжірибе жинай
  алатын және ақыр соңында өздерінің құдайлық тағдырларын мәңгілік өмірдің мұрагерлері ретінде жүзеге
  асыра алатын жоспарды қабылдады. Құдайдың бақыт жоспары отбасылық қарым-қатынасты көрден тыс қалдыруға
  мүмкіндік береді. Қасиетті ғибадатханаларда қол жетерлік қасиетті рәсімдер мен келісімдер әр адамға
  Құдайдың алдына оралуға және отбасылардың мәңгілікке бірігуіне мүмкіндік береді.
- Алғашқы өсиет Құдай Адам ата мен Хауа анаға, олардың ерлі-зайыптылар ретінде ата-ана болу мүмкіндігіне
  байланысты. Құдайдың өз балаларына жерді көбейту және толтыру туралы өсиеті өз күшінде қалады деп мәлімдейміз.
  Сондай-ақ, Құдай ұрпақтардың қасиетті күштерін ерлі-зайыптылар ретінде заңды түрде некеде тұрған ер
  мен әйелдің арасында ғана қолдануды бұйырғанын мәлімдейміз.
- Біз жария етеміз, жердегі өмір туындайтын күштер, Құдай бағыштаған. Біз өмірдің қасиеттілігін және Құдайдың
  мәңгілік жоспарындағы оның маңыздылығын растаймыз.
- Ерлі-зайыптылар бір-біріне және балаларына деген сүйіспеншілік пен қамқорлыққа жауапкершілікпен қарайды.
  «Балалар Иеміздің мұрасы» (Забур 126:3). Ата-ананың қасиетті міндеті – ол балаларын сүйіспеншілік пен
  әділеттілікке тәрбиелеу, олардың физикалық және рухани қажеттіліктерін қамтамасыз ету және оларды бір-біріне
  деген сүйіспешілік пен қызмет етуге үйрету, Құдайдың өсиеттерін орындауға және қай жерде болмасын заңға
  бағынышты азамат болуға тәрбиелеу. Осы міндеттерді олар қалай орындайтындығы үшін ерлер мен әйелдер,
  аналар мен әкелер Құдайдың үкімі алдында жауап беретін болады.
- Отбасы Құдайдан тағайындалған. Ер мен әйел арасындағы неке Оның мәңгілік жоспары үшін өте маңызды. Балаларға
  ерлі-зайыптылық шарттарында туылу құқығы беріледі және ерлі-зайыптылық анттарын адалдықпен орындайтын
  әкесі мен анасының тәрбиесінде болуға құқылы. Отбасылық өмірінде бақытты болу Ие Иса Мәсіхтің ілімі
  негізінде ғана қол жеткізуге болады. Сәтті некелер мен отбасылар сенім, мінажат ету, тәубеге келу, кешірім,
  құрмет, сүйіспеншілік, жанашырлық, еңбек және сау сауықтыру шаралары негізінде құрылады және сақталады.
  Құдайдың берген нұсқауына сай, әкелер өз отбасыларына сүйіспеншілік пен әділеттікте басшылық етіп, отбасының
  тұрмыстық қажеттіліктерін қамтамасыз етіп, отбасын қорғау керек. Аналар ең алдымен балаларының тәрбиесіне
  жауап береді. Осы қасиетті міндеттерде әкелер мен аналар бір-біріне тең серіктестер ретінде көмектесуге
  міндетті. Мүгедектік, қайтыс болу немесе басқа жағдайлар жеке бейімделуді қажет етуі мүмкін. Қажет болған
  жағдайда жақын туыстары қолдау көрсетуі керек.
- 'Біз ескртеміз: пәктік келісімін бұзатын, жұбайын немесе ұрпағын қорлайтын немесе отбасылық міндеттерін
  орындамайтын адамдар бір күні Құдай алдында жауап береді. Сонымен қатар, біз отбасының ыдырауы жеке
  адамдарды, қауымдастықтар мен ұлттарды, ежелгі және қазіргі пайғамбарлардың алдын ала айтқан апаттарға
  әкелетінін ескертеміз.'
- Біз барлық жерде жауапты азаматтар мен үкімет қызметкерлерін қоғамды құрудың негізгі бөлігі ретінде
  отбасын сақтау мен нығайтуға бағытталған шараларды насихаттауға шақырамыз.
