title: Тірі Мәсіх
subtitle: Апостолдардың куәлігі
author: ''
paragraphs:
- Екі мыңжылдықтағы Иса Мәсіхтің туған күнін еске алып, біз оның теңдессіз өмірінің шындығына және оның
  ұлы күнәдан арылтқан құрбандығының шексіз қасиетіне куәлік етеміз. Жерде өмір сүрген және әлі де өмір
  сүретіндердің барлығына соншалықты терең әсер еткен ешкім жоқ.
- Ол Көне Өсиеттің Ұлы Иеговасы болды және Жаңаның Мессиясы. Әкесінің басшылығымен Ол жердің жаратушысы
  болды. «Барлық затты сол жаратты, жаратылған ештеңе онсыз пайда болмаған» (Жохан 1:3). Ол күнәсіз болса
  да, барлық әділдікті орындау үшін су рәсімін де өтті. Ол «игі істерді жасап, жалғастырды» (Елшіл. Істері
  10:38), сол үшін Оны жек көрді. Оның Інжілі бейбітшілік пен ізгі ниет туралы хабардар етті. Ол барлығын
  Өзінен үлгі алуға шақырды. Ол Палестина елін аралап, науқастарды сауықтырып, соқырлардың ажарын ашып,
  және өлілерді тірілтті. Ол мәңгілік өмірдің шындығын, біздің өлім алдындағы тіршілік шындығын, біздің
  жер бетіндегі өмір мақсатын және Құдайдың ұлдары мен қыздарының болашақ өміріндегі әлеуетін үйретті.
- Ол діни ант рәсімін өзінің ұлы құрбандығын еске салу ретінде негіздеді. Ол жалған айыптармен қамауға
  алынып, сотталды, тобырды қанағаттандыру үшін күнәлі деп танылып, Ғолғота яғни «Маңдайтөбе» айқыш ағашына
  шегеленіп өлімге кесілді. Ол өз өмірін бүкіл адамзаттың күнәларын өтеу үшін берді. Ол осы жер бетінде
  қашанда өмір сүретін барлық адамдар үшін ұлы теңдесі жоқ сыйлық.
- Біз оның бүкіл адамзат тарихында өзегі болған өмірінің Бетлехемде басталмағанын және Ғолғота Маңдайтөбесінде
  аяқталмағандығын салтанатты түрде куәлік етеміз. Ол Әкенің Тұңғышы, Жалғыз рухани Ұлы, әлем Өтемшісі
  болды.
- Ол моладан көтеріліп, «өлгендердің алғашқысы болды» (Қорынттықтарға 1-хат 15:20). Ол Қайта тірілген
  Ие ретінде, өмірде жақсы көрген адамдар арасында болды. Ол ежелгі Америкадағы Өзінің «басқа да қойларына»
  қызмет етті (Жохан 10:16). Қазіргі әлемде Ол және Оның Әкесі жас бала Джозеф Смитке көрініп, көптен
  бері уәде етілген «заманның толық дәуірін» (Ефестіктерге 1:10) ашты.
- 'Тірі Мәсіх туралы пайғамбар Жозефтің жазғаны: «Оның көздері оттың жалынындай; оның басындағы шашы таза
  аппақ қардай; оның жүзі күн сәулесінен де жоғары жарқырады; және оның дауысы ағынды сулардың даусына
  ұқсас, тіпті Иегованың дауысы сияқты сөйледі:'
- «Басы да Аяғы Менмін; әрі мәңгі Тірімін, Мен – сол өлім жазасына кесілген; Әкенің алдында сенің әділ
  Қорғаушыңмын» (І мен Ө 110:3–4).
- 'Ол туралы пайғамбар былай деп мәлімдеді: «Енді оған берілген көптеген куәліктерден кейін, бұл біз оған
  берген барлық куәліктің соңғысы болып табылады: Ол тірі!'
- «Біз Оны Құдайдың оң жағында тұрғанын көрдік; және Ол Әкенің рухани жалғыз Ұлы екенін куәгер ететін
  дауысты естідік –
- «Ол үшін, ол арқылы және одан әлемдер бар және жаратылған, ал олардың тұрғындары Құдайдан туылған ұл
  мен қыздар» (І мен Ө 76:22–24).
- Біз Оның әулиелігі мен Оның шіркеуі жер бетінде қайта қалпына келтірілгенін салтанатты түрде мәлімдейміз
  – «апостолдар мен пайғамбарлар … салған іргетасының негізі және басты тасы Иса Мәсіхтің Өзі» (Ефестіктерге
  2:20).
- Біз Оның жер бетіне қайтып оралатындығына куәлік етеміз. «Сонда Жаратқан Иенің ұлылығы бар адамзатқа
  көрінетін болады» (Ишая 40:5). Ол патшалардың Патшасы ретінде билік етіп, мырзалардың Иесі ретінде билік
  етеді және әр бір адам тізе бүгіп, әр тіл біткен пенде Оны мойндайтын болады. Бәріміз де Оның қиямет
  сотының алдында тұрып, өз іс- әрекетіміз бен жүрек қалауымыз бойынша әшкереленетін боламыз.
- Біз Оның тиісті түрде тағайындаған Апостолдары ретінде, Иса Тірі Мәсіх мәңгі Құдайдың Ұлы екендігіне
  куәлік етеміз. Ол бүгін Өз Әкесінің оң жағында құрметті орында тұрған ұлы Патша Емануил. Ол – өмір шырағы
  және әлем үміті. Оның жолы – бұл өмірде бақыт пен ақыреттегі мәңгілік өмірге апаратын жол. Құдайға Оның
  теңдесі жоқ сыйы құдайшыл Ұлы үшін алғыс.
