title: UKristu oPhilayo
subtitle: UbuFakazi BabaPhostoli
author: IBandla likaJesu Kristu labaNgcwele beziNsuku zokuGcina
paragraphs:
- Njengoba sikhumbula ukuzalwa kukaJesu Kristu iminyaka eyizinkulungwane ezimbili eyedlula, sinika ubufakazi
  bethu ngobukhona ngempela bempilo yakhe engenakulinganiswa namandla angapheliyo omhlatshelo Wakhe omkhulu
  ohlawulayo. Akukho muntu oseke waba nomthelela omkhulu kangaka kubo bonke asebeke baphila nalabo abasazophila
  kulomhlaba.
- WayenguJehova oMkhulu weThestamente Elidala, uMesiya weLisha. Ngokuyalwa nguYise, wayengumdali womhlaba.
  “Konke kwavela ngaye; ngaphandle kwakhe akuvelanga lutho kukho konke okuvelileyo” (NgokukaJohane 1:3).
  Nakuba engenasono, wabhabhadiswa ukugcwalisa konke ukulunga. “Wahamba enza umusa” (IzEnzo 10:38), kodwa
  bamdelela ngalokho. Ivangeli Lakhe lalingumyalezo wokuthula noxolo. Wabanxusa bonke ukuba balandele
  isibonelo Sakhe. Wahamba emigwaqeni yasePalestine, ephilisa abagulayo, enza izimpumputhe zibone, futhi
  evusa abafileyo. Wafundisa amaqiniso aphakade, ubukhona ngempela bempilo eyandulela eyasemhlabeni, inhloso
  yempilo yethu emhlabeni, nalokho amadodana namadodakazi kaNkulunkulu angaba yikho empilweni ezayo.
- Wamisa isidlo esingcwele njengesikhumbuzo somhlatshelo Wakhe omkhulu ohlawulayo. Waboshwa futhi wabekwa
  icala lamanga, waboshwa ukwenelisa uquqaba, futhi wagwetshwa ngokufa esiphambanweni sendawo ethiwa yiKhalivari.
  Wanikela ngempilo Yakhe ukuhlawulela izono zaso sonke isintu. Waba yisipho esikhulu sabo bonke abayoke
  baphile emhlabeni.
- Siyafakaza ngesizotha ukuthi impilo Yakhe, ebaluleke kakhulu emlandweni waso sonke isintu, ayizange
  iqale eBetlehema noma iphelele endaweni ethiwa yiKhalivari. Wayeyizibulo likaYise, iNdodana Ezelwe Yodwa
  enyameni, uMhlengi womhlaba.
- Wavuka ethuneni “engulibo lwabaleleyo” (Ⅰ kwabaseKorinte 15:20). NjengeNkosi eVukileyo, wavakashela
  labo ayebathandile empilweni. Wasebenza futhi phakathi “kwezinye izimvu” Zakhe (NgokukaJohane 10:16)
  eMelika yasemandulo. Esikhathini samanje, Yena noYise bavela kumfana uJoseph Smith, beqala okwakuthenjisiwe
  kudala “uhlelo lokuphelela kwezikhathi” (Kwabase-Efesu 1:10).
- 'NgoKristu oPhilayo, umPhrofethi uJoseph wabhala ukuthi: “Amehlo [akhe] ayefana nelangabi lomlilo; izinwele
  zekhanda lakhe zazimhlophe njengeqhwa elicwebileyo; ubuso bakhe babukhazimula ngaphezulu kokukhanya
  kwelanga; futhi izwi lakhe lalinjengenhlokomo yamanzi amaningi, ngisho izwi likaJehova, lithi:'
- “Ngiyisiqalo nesiphetho; nginguye ophilayo, nginguye owabulawa; ngingummeli wenu kuBaba” (Mf&V 110:3–4).
- 'Ngaye umPhrofethi waphinde washo ukuthi: “Manje, emva kobufakazi obuningi osebunikiwe ngaye, nabu ubufakazi,
  ekugcineni kwako konke, esibunikayo ngaye: Ukuthi uyaphila!'
- “Ngokuba sambona, ngisho ngakwesokunene sikaNkulunkulu; futhi sezwa izwi lifakaza ukuthi uyiNdodana
  Ezelwe Yodwa kaBaba—
- “Ukuthi ngaye, futhi ngendlela yakhe, futhi nangamasu akhe, imihlaba ikhona futhi yadalwa, nabantu bayo
  bangamadodana namadodakazi azelwe kuNkulunkulu” (Mf&V 76:22–24).
- Siyasho ngamazwi esizotha ukuthi ubuphristi Bakhe neBandla Lakhe kubuyiselwe emhlabeni—“[kwa]khiwe phezu
  kwesisekelo sabaphostoli nabaprofethi, uKristu Jesu uqobo lwakhe eyitshe legumbi” (Kwabase-Efesu 2:20).
- Siyafakaza ukuthi ngelinye ilanga uyobuya emhlabeni. “Inkazimulo kaJehova iyakubonakaliswa, yonke inyama
  ikubone kanyekanye” (U-Isaya 40:5). Uyakubusa njengeNkosi yamaKhosi futhi noMbusi wabaBusi, futhi wonke
  amadolo ayakuguqa nezilimi ziyakukhuluma zidumise phambi Kwakhe. Umuntu ngamunye uyokwahlulelwa Nguye
  ngokwemisebenzi nangokwezifiso zezinhliziyo zethu.
- Siyafakaza, njengabaPhostoli bakhe abagcotshiweyo ngokufanele—ukuthi uJesu unguKristu oPhilayo, iNdodana
  kaNkulunkulu engafiyo. UyiNkosi u-Imanuweli omkhulu, omileyo namhlanje ngasesandleni sokunene sikaYise.
  Ungukukhanya, ukuphila, nethemba lomhlaba. Indlela Yakhe yindlela eholela enjabulweni kulempilo nokuphila
  kwaphakade emhlabeni ozayo. Makabongwe uNkulunkulu ngesipho esingenakulinganiswa seNdodana Yakhe evela
  Kuye.
