title: مسیح زنده
subtitle: گواهی رسولان
author: کلیسای عیسی مسیح مقدّسین آخرین زمان
paragraphs:
- در حالی که میلاد عیسی مسیح در دو هزار سال پیش را گرامی می‌داریم، ما گواهی خود از واقعیت زندگی بی‌همتای
  او و قدرت بیکران ایثار بر آمده از کفّارۀ عظیم او را تقدیم می‌کنیم. هیچ کس دیگری بر همۀ آنانی که تاکنون
  بر زمین زیسته و یا خواهند زیست، چنین تأثیر عمیقی نگذارده است.
- او همان یهوۀ کبیرعهد عتیق، مسیحای عهد جدید بود. تحت هدایت پدرش، او خالق زمین بود. «همه چیز به وسیلۀ
  او هستی یافت و بدون او چیزی آفریده نشد» (یوحنا ۱‏:۳) اگرچه از گناه عاری بود، او تعمید یافت تا کمال پرهیزکاری
  را بجا آورد. او «به همه‌جا می‌رفت و کارهای نیک انجام می‌داد» (اعمال رسولان ۱۰‏:۳۸) ولی بازهم بخاطر آن
  منفور بود. مژدۀ او پیامی از صلح و حسن نیت بود. او ازهمه استدعا کرد که از الگوی رفتار او پیروی کنند.
  او جاده‌های فلسطین را پیمود؛ مریضان را شفا داد، موجب شد که کور ببیند و مرده را برخیزاند. او، حقایق جاودانگی،
  واقعیّت وجود ما پیش از تولد، هدف از زندگی ما بر روی زمین و توان بالقوۀ پسران و دختران خدا در زندگی پیش
  رو را تعلیم داد.
- او عِشای مقدّس را به عنوان یادآوری از ایثار عظیم بر آمده از کفّاره‌اش برپا نمود. او به اسارت در آمد
  و به اتهامات واهی محکوم شد؛ بخاطر خرسندی جمعی از اوباش مجرم شناخته شد و به مرگ بر روی صلیب در گلگتا
  محکوم گردید. او زندگی‌اش را برای کفارۀ گناهان تمام بشریت تقدیم کرد. اهدای جان او هدیۀ عظیمی بود به نیابت
  از تمام آنانی که بر زمین زندگی کرده و خواهند کرد.
- ما رسماً گواهی می‌دهیم که زندگی او، که در کانون همۀ تاریخ بشر است، نه در بیت‌الحم آغاز شد و نه در گلگتا
  به پایان رسید. او نخست زادۀ پدر، یگانه پسر مولود در کالبد، همان ضامن جهان بود.
- او از قبر برخاست تا «اولین کسی شود که از میان مردگان برخاست» ‏(۱ قرنتیان ۱۵‏:۲۰). به عنوان سَروَرِ رستاخیز
  یافته، او به دیدارِ آنهایی رفت که در زندگی موردِ مهرش بودند. او همچنین در میانِ «گوسفندانِ دیگرش» (یوحنا
  ۱۰‏:۱۶) در قارۀ آمریکای دورانِ باستان به خدمت پرداخت. در جهانِ معاصر، او و پدرش بر جوزف اِسمیت پدیدار
  گشتند، و آن آغازی گشت بر رخدادِ وعدۀ کهن «دورانِ کمالِ زمان‌ها» (افسسیان ۱‏:۱۰).
- 'پیامبر جوزف دربارۀ مسیح زنده نوشت: «چشمانش مانند شعلۀ آتش بود؛ موی سرش سپید مانند برفِ ناب بود؛ رُخسارش
  فراتر از روشنی خورشید می‌درخشید؛ و صدایش همانند صدای خروش آب‌های بزرگ بود، یعنی صدای یهوه، گفتا:'
- «من نخستین و آخرین هستم؛ من او هستم که زندگی می‌کند، من او هستم که کشته شد؛ من شفیع شما نزد پدر هستم»
  (اصول اصول و پیمان ها ۱۱۰‏:۳–۴).
- 'پیامبر همچنین در مورد او اظهار کرد: «و اینک، پس از گواهی‌های بسیاری که از او داده شده‌اند، آخر سر،
  این شهادتی است که ما از او می‌دهیم: اینکه او زنده است!'
- «زیرا ما او را دیدیم، حتّی در سمت راست خدا؛ و ما صدایی شنیدیم که شهادت داد که او یگانه زادۀ پدر است
  —
- «که توسط او، و از طریق او، و از سوی او، جهان‌ها آفریده می‌شوند و آفریده شده‌اند، و ساکنانِ آنها پسران
  و دخترانِ زاده شده برای خدا هستند» (اصول و پیمان ها ۷۶‏:۲۲–۲۴).
- ما با بیانی خالصانه و جدی اعلام می‌کنیم که توانایی کشیشی او و کلیسای او، «که بر شالودۀ… رسولان و انبیا
  بنیان گشته، و عیسی مسیح هم سنگ اصلی آن است» (افسسیان ۲‏:۲۰) بر روی زمین احیا شده‌اند.
- ما گواهی می‌دهیم که او روزی به زمین باز خواهد گشت. «و جلال سَروَر آشکار خواهد شد، و تمام مردم آن را
  خواهند دید» (اشعیا ۴۰‏:۵). او در نقش شاه شاهان فرمان خواهد راند و به عنوان سَروَرِ سروَران سلطنت خواهد
  کرد، و در برابر او هر زانویی خم خواهد شد، و هر زبانی در پرستش او سخن خواهد راند. هر یک از ما برای داوری
  شدن بر طبق کارهایمان و تمایلات قلبی‌مان در برابرش خواهیم ایستاد.
- ما به عنوان رسولان مُحِقِ منصوب او گواهی می‌دهیم — که عیسی، مسیح زنده است، او پسر فناناپذیر خداست. او
  نور، زندگی و امید دنیاست. راه او مسیریست که به شادمانی راستین در این زندگی، و به زندگی جاودان در جهان
  پیش رو منتهی می‌گردد. سپاس باد بر خدا از برای هدیۀ بی‌همتای پسر الهی‌اش.
