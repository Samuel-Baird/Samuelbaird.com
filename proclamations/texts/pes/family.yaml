title: خانواده
subtitle: اعلامیه‌ای به جهان
author: ریاست اوّل و شورای دوازده رسول کلیسای عیسی مسیح مقدّسین آخرین زمان
note: این بیانیه به عنوان بخشی از پیام رئیس گوردون بی. هینکلی در جلسۀ عمومی انجمن امداد زنان که در ۲۳
  سپتامبر ۱۹۹۵ در سالت لیک سیتی در یوتا برگزار شد، توسّط وی قرائت شد.
paragraphs:
- ما، ریاست اول و شورای دوازده رسول کلیسای عیسی مسیح مقدّسین آخرین زمان، رسماً اعلام می‌کنیم که ازدواج
  بین یک مرد و یک زن، از جانب خدا مقدّر شده است و اینکه خانواده در مرکز برنامۀ آفریدگار برای سرنوشت جاویدان
  فرزندانش قرار دارد.
- همۀ انسان‌ها — مرد و زن — در نگارۀ خدا آفریده شده‌اند. هریک از آنها، یک پسر یا دختر محبوب روحی والدین
  آسمانی است، و ازاین لحاظ، یکایک ایشان سرشت و فرجامی یزدانی دارد. جنسیّت، یک ویژگی‌ اساسی از هوّیت و
  هدفِ پیش از توّلد زندگی فانی و حیاتِ جاویدانِ فرد می‌باشد.
- در حوزۀ زندگی پیش از تولّد، پسران و دخترانِ در روح، خدا را به عنوان پدر جاویدان خویش می‌شناختند و می‌پرستیدند
  و طرح او را مبنی بر اینکه فرزندانش بتوانند برای پیشرفت در جهت تکامل، بدنی جسمانی بدست آورده و صاحب تجربۀ
  زمینی گردند پذیرفتند تا در نهایت، به فرجام الهی خود به عنوان وارثان زندگی جاویدان دست یابند. برنامۀ
  شادمانی الهی، رابطه‌های خانوادگی را قادر می‌سازد تا در فراسوی مرگ تداوم یابند. آیین‌ها و پیمان‌های منزّه
  موجود در معابد مقدّس، بازگشت به پیشگاه خدا را برای افراد، و پیوند جاودانه را برای خانواده‌ها میسّر می‌سازند.
- اوّلین فرمانی که خدا به آدم و حوّا داد، در ارتباط با توان بالقوّۀ آنان برای پدر و مادر شدن در مقام شوهر
  و زن بود. ما اعلام می‌داریم که فرمان خدا به فرزندانش برای ازدیاد نسل و پرکردن زمین همچنان پابرجاست.
  ما علاوه بر این اعلام می‌داریم که خدا فرمان داده است که قدرت‌ مقدّس تولید مثل، صرفاً می‌باید بین مرد
  و زنی که قانوناً به عنوان زن و شوهر ازدواج کرده‌اند به کار گرفته شود.
- ما اظهار می‌کنیم وسیله‌ای که زندگی فانی به واسطۀ آن آفریده شده است، بنیادی الهی دارد. ما تقدّس حیات
  و اهمیت آن در برنامۀ ابدی خدا را تصدیق می‌کنیم.
- شوهر و زن در جهت عشق ورزی و مراقبت از یکدیگر و فرزندانشان، مسئولیتی رسمی و مسلّم برعهده دارند. «فرزندان
  میراثی از سروَرند» (مزامير ۱۲۷‏:۳). والدین وظیفه‌ای مقدّس دارند که فرزندانشان را درعشق و پرهیزکاری پرورش
  دهند، تا مایحتاجِ جسمی و روحی‌شان را فراهم کنند و به آنها تعلیم دهند تا به همدیگر عشق ورزیده، به یکدیگر
  خدمت کنند، فرامین خدا را رعایت کنند، و در هر کجا که زندگی می‌کنند، شهروندانی قانون‌ مدار باشند. شوهران
  و زنان — مادران و پدران — برای ایفای این وظایف در برابر خدا پاسخگو خواهند بود.
- خانواده از جانب خدا مُقدّر گردیده است. ازدواج بین مرد و زن برای برنامۀ جاویدان او ضروری است. بچّه‌ها
  مستحق این هستند که در چارچوب پیوند ازدواج متولّد شده و توسّط پدر و مادری که با وفاداری کامل تعهّدات
  ازدواج‌ را ارج می‌نهند، پرورش یابند. زمانی که خانواده بر اساس آموزه‌های سروَر، عیسی مسیح، بنا شده باشد،
  دستیابی به شادی در خانواده بسیار محتمل است. ازدواج‌ها و خانواده‌های موفّق بر مبنای ایمان، نیایش، توبه،
  بخشش، احترام، محبّت، دلسوزی، کار و فعالیت‌های فرح‌بخش سالم استوار و برقرار گردیده‌اند. طبق طرح الهی،
  لازم است که پدران با عشق و پرهیزکاری سرپرست خانواده‌هایشان و مسئول تأمین ملزومات زندگی و حفاظت از خانواده‌هایشان
  باشند. مادران در درجۀ اوّل، مسئول پرورش کودکانشان هستند. دراین مسئولیت‌های مقدّس، پدران و مادران موظف
  به یاری به یکدیگر به صورت شُرَکایی برابر هستند. ناتوانی جسمی، مرگ یا دیگر مقتضیات ممکن است سازگاری بر
  حسب مورد را ایجاب کنند. در زمان نیاز، خویشاوندان می‌بایستی دست یاری خود را دراز کنند.
- ما هشدار می‌دهیم که افرادی که پیمان‌های پاکدامنی را نقض می‌کنند، آنهایی که با همسر یا اولادشان بدرفتار
  هستند، یا آنانی که از برآورده‌ ساختن وظایف خانوادگی سر باز می‌زنند، روزی در برابر خدا پاسخگو خواهند
  بود. به علاوه، ما هشدار می‌دهیم که از هم پاشیدگی خانواده، افراد، جوامع و ملّت‌ها را به فجایعی دچار خواهد
  کرد که توسط پیامبران روزگار باستان و دوران معاصر پیشگویی شده‌اند.
- ما از شهروندان مسئولیت پذیر و منصب‌داران دولتی در هرجا استدعا داریم که آن دسته از اقداماتی که در جهت
  ابقاء و تقویت خانواده که مؤلّفۀ اصلی جامعه است را ترویج دهند.
