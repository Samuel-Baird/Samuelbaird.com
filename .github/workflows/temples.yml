# Keeps /temples and data/lds-temples.{json,csv} current.
# Weekly (and on demand from the Actions tab) it re-reads the Church's official temple list, refetches
# the pages of temples that are not yet operating or changed status, and rebuilds the site.
# It commits only when the data changed; Vercel then deploys the commit as usual.
name: Sync temples

on:
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temples-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sites/samuelbaird.com
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            sites/samuelbaird.com
            sites/deseret-wiki/src/data
            packages
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync, rebuild and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/fetch-temples.mjs --refresh-changing
          # The data file carries a "generated" date; ignore it when deciding whether anything changed.
          if git diff --quiet -I '"generated":' -- data/lds-temples.json; then
            echo "No temple changes."; exit 0
          fi
          cp data/lds-temples.json data/lds-temples.csv scripts/cache/temples.json "$RUNNER_TEMP/"
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/lds-temples.json" "$RUNNER_TEMP/lds-temples.csv" data/
            cp "$RUNNER_TEMP/temples.json" scripts/cache/
            node scripts/build.mjs
            git add -A .
            git diff --cached --quiet && exit 0
            git commit -q -m "Sync temples from the official temple list"
            git push -q origin "HEAD:$BRANCH" && exit 0
            echo "Push rejected (branch moved); retrying from the new tip..."
            sleep $((attempt * 5))
          done
          exit 1
