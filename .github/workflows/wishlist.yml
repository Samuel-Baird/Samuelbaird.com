# Keeps /wishlist in sync with the Amazon list.
# - Every 6 hours (and on demand from the Actions tab) it re-reads the public Amazon list.
# - When you edit wishlist/priorities.json on main, it rebuilds the page right away.
# It commits only when something changed; Vercel then deploys the commit as usual.
name: Sync wishlist

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['wishlist/priorities.json']

permissions:
  contents: write

concurrency:
  group: wishlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Always work from the newest commit on the branch, and if a push races with another
      # commit (another sync run, or you pushing), start over from the new tip rather than
      # trying to merge generated files.
      - name: Sync, rebuild and push
        env:
          BRANCH: ${{ github.ref_name }}
          FORCE_BUILD: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            node scripts/fetch-wishlist.mjs
            if [ "$FORCE_BUILD" != "true" ] && git diff --quiet -- wishlist/data.json; then
              echo "No wishlist changes."; exit 0
            fi
            node scripts/build.mjs
            git add -A
            git diff --cached --quiet && exit 0
            git commit -q -m "Sync wishlist from Amazon"
            git push -q origin "HEAD:$BRANCH" && exit 0
            echo "Push rejected (branch moved); retrying from the new tip..."
            sleep $((attempt * 5))
          done
          exit 1
