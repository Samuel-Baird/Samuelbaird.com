# Fails when a site's copy of the shared family style or chrome is out of date with packages/family.
name: Family style in sync
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/family-sync.mjs --check
