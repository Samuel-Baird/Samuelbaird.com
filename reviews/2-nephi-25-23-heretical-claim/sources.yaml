- id: oaks-1998-have-you-been-saved
  type: primary
  title: Have You Been Saved?
  author: Dallin H. Oaks
  date: '1998-04-01'
  locator: https://pulpit.restorationcommons.org/talks/1998-04-oaks-have-you-been-saved/#p13
  accessed: '2026-10-15'
  inspected: true
  inspected_via: mcp__2b2805da... read_paragraphs(talk_id='1998-04-oaks-have-you-been-saved', from_paragraph=12, count=4)
  quote: And what is “all we can do”? It surely includes repentance (see Alma 24:11) and baptism, keeping the commandments, and enduring to the end.
  verification:
    tool: null
    verdict: direct-read
    link: https://pulpit.restorationcommons.org/talks/1998-04-oaks-have-you-been-saved/#p13
  grade_supports: disputed
  traced_to: null
  used_on_screen: false
  counter: true
  notes: 'Oaks introduces it as an answer to ''Some Christians accuse Latter-day Saints ... of denying the grace of God through claiming they can earn their own salvation.'' P12: ''they will not be saved
    finally until they have completed their mortal probation with the required continuing repentance, faithfulness, service, and enduring to the end.'' Strongest text for the reel''s reading; also shows
    the apostle explicitly rejecting ''earn''. Note quote omits the Oaks text''s final ''see'' formatting only; run verify_quote before on-screen use.'
  found_by: capy-historian
  claims:
  - 2
