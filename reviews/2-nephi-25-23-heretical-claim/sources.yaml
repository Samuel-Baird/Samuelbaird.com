- id: mcclellan-2020-2nephi-25-23
  type: scholarly
  title: 2 Nephi 25:23 in Literary and Rhetorical Context
  author: Daniel O. McClellan
  date: '2020-01-01'
  locator: https://corpus.restorationcommons.org/b/2-nephi-25-23-in-literary-and-rhetorical-context-3135/18
  accessed: '2026-10-15'
  inspected: true
  inspected_via: mcp__3302d05e... read_pages(path='Read/Articles/Dan McClellan/2 Nephi 25:23 in Literary and Rhetorical Context.pdf', from_page=1, to_page=20)
  quote: The original intended sense of our clause in 2 Nephi 25:23 was “it is by grace that we are saved, despite all we can do.”
  verification:
    tool: cite_page
    verdict: page-read
    link: https://corpus.restorationcommons.org/b/2-nephi-25-23-in-literary-and-rhetorical-context-3135/18
  grade_supports: disputed
  traced_to: null
  used_on_screen: false
  counter: false
  notes: 'Journal of Book of Mormon Studies 29 (2020) 1-19. McClellan is a Church scripture translation supervisor; the article states the views are his own. Pages 3-5 survey leader readings; 7-12 give
    1710-1840 ''after all ... can do'' parallels (secondary: the underlying 18th/19th-c. texts were NOT opened by me); 17-18 give 2 Ne 10:24 and conclusion; 19 gives the ''long-normative'' comment. Note
    p. 8: ''The sense of following in time is not precluded in this usage'' and p. 19 ''natural ambiguity of the idiom''.'
  found_by: capy-historian
  claims:
  - 2
- id: uchtdorf-2015-gift-of-grace
  type: primary
  title: The Gift of Grace
  author: Dieter F. Uchtdorf
  date: '2015-04-01'
  locator: https://pulpit.restorationcommons.org/talks/2015-04-uchtdorf-the-gift-of-grace/#p53
  accessed: '2026-10-15'
  inspected: true
  inspected_via: mcp__2b2805da... read_paragraphs(talk_id='2015-04-uchtdorf-the-gift-of-grace', from_paragraph=49, count=8); verify_quote
  quote: We must understand that “after” does not equal “because.”
  verification:
    tool: verify_quote
    verdict: exact
    link: https://pulpit.restorationcommons.org/talks/2015-04-uchtdorf-the-gift-of-grace/#p53
  grade_supports: disputed
  traced_to: null
  used_on_screen: false
  counter: false
  notes: 'Next sentence (p54): ''We are not saved “because” of all that we can do.'' (read via read_paragraphs; a verify_quote of the two sentences joined returned not-verbatim only because of quote-mark
    placement, so quote the single sentence). P51: ''Grace is a gift of God, and our desire to be obedient ... is the reaching out of our mortal hand to receive this sacred gift.'' Uchtdorf does not say
    ''despite''.'
  found_by: capy-historian
  claims:
  - 2
