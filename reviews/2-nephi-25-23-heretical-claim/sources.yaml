  quote: Even that grace of God promised in the scriptures comes only “after all we can do.”
  verification:
    tool: verify_quote
    verdict: exact
    link: https://pulpit.restorationcommons.org/talks/1995-10-packer-the-brilliant-morning-of-forgiveness/#p22
  grade_supports: disputed
  traced_to: null
  used_on_screen: false
  counter: true
  notes: 'Counter to the ''despite'' reading, and the best match for the reel''s characterisation. Context p20-21: relief ''can be earned through repentance''; Isaiah 1 ''if ye be willing and obedient''.
    Same speaker also says p23 ''You cannot do that. And you don''t have to do it.'' (about self-justifying transgression), so read in context.'
  found_by: capy-historian
  claims:
  - 2
