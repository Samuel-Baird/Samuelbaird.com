slug: bom-dark-skin-question
title: What does the Book of Mormon say about dark skin?
hook: The curse language is real. What does it actually explain?
summary: The Lamanite skin passages, past racial teachings, and the present rejection of racial curse theories are distinct questions. This response acknowledges the difficult language and the harm without turning a question-only clip into an argument it never makes.
