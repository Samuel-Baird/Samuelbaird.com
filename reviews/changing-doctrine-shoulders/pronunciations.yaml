expansion_rules:
- pattern: D&C
  expand_to: Doctrine and Covenants
- note: Never read an initialism as individual letters unless that is genuinely how
    it's said aloud; expand scripture-reference numbers into natural speech in the
    narration text itself (see pronunciations.md).
