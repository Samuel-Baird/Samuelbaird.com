- id: n07
  kind: narration
  text: I would not defend the phrase never about sleeve length. The older instructions really affected what members wore. But covenant language was not invented after the redesign. Here is Russell M. Nelson in April two-thousand-one, more than twenty years before that change.
  pose: researching
  stage: blank
  sources:
  - church-2011-fsy-dress
  - nelson-2001-garment-commitment
  opinion: true
- id: q01
  kind: card
  text: The covenant meaning predates this controversy. It does not erase older clothing limits. Both were taught together, years before the new designs were authorized.
  pose: quote
  sources:
  - nelson-2001-garment-commitment
  - church-2024-garment-redesign
  card:
    quote: Wearing the temple garment has deep symbolic significance. It represents a continuing commitment.
    attribution: Russell M. Nelson · April 2001 · Personal Preparation for Temple Blessings
    source: nelson-2001-garment-commitment
- id: n08
  kind: narration
  text: 'The stronger Latter-day Saint account holds both together: real covenant commitment and real instructions about its expression. The institution can authorize a different design while continuing to require garment wearing. That describes continuity without rewriting what obedience previously cost people.'
  pose: teaching
  stage: blank
  sources:
