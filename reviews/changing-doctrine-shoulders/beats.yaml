- id: n04
  kind: narration
  text: 'A changed requirement can be a reason to question how confidently it was taught. But the argument needs another step: was a particular clothing requirement an eternally fixed doctrine, or an application that could change? Calling both doctrine does not establish that they are the same.'
  pose: teaching
  stage: blank
  sources:
  - church-2011-fsy-dress
  - articles-faith-9
  opinion: true
- id: n05
  kind: narration
  text: The ninth Article of Faith explicitly anticipates future revelation. That is the Latter-day Saint model to evaluate. It does not prove that any particular redesign came from God, and it does not make every explanation of a change equally convincing.
  pose: reading
  stage: blank
  sources:
