- id: n01
  kind: narration
  text: Being shamed over your shoulders, then watching the expectations change, can feel like your sacrifice has been dismissed. I would not answer that by pretending the old rule was imaginary.
  pose: solemn
  stage: blank
  sources: []
  opinion: true
- id: n02
  kind: narration
  text: The twenty-eleven For the Strength of Youth guide explicitly told young women to cover their shoulders. It placed that instruction beside language about the Lord's standards not changing. That was official guidance, not just a local dress preference.
  pose: source
  stage: blank
  sources:
  - church-2011-fsy-dress
  opinion: false
- id: n03
  kind: narration
  text: 'And the changes are real: the twenty-twenty-two youth guide uses principles without that shoulder checklist. In twenty-twenty-four, the First Presidency authorized redesigned garments. Those are related changes, but youth dress guidance and the garment itself are different things.'
  pose: teaching
  stage: blank
  sources:
  - church-2022-fsy-body
  - church-2024-garment-redesign
  opinion: false
- id: c02
