  kind: narration
  text: Her connection between the garment and outer clothing is reasonable. The current handbook says to wear the garment beneath outer clothing and not alter it to accommodate clothing styles. The cut has practical consequences. An authorized new design is different from members privately changing their garments.
  pose: pointing
  stage: blank
