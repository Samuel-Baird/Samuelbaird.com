slug: changing-doctrine-shoulders
title: Changed sleeves, unchanged covenant?
hook: The shoulder rule was real. Does changing it prove the faith false?
summary: Acknowledge the former shoulder standard and the cost of obeying it, then test what garment redesign actually shows. Before-change teaching documents covenant continuity without proving every design decision divinely revealed.
