- id: coates-1978-indian-policies
  type: scholarly
  title: 'Brigham Young and Mormon Indian Policies: The Formative Period, 1836-1851'
  author: Lawrence G. Coates
  date: '1978-04-01'
  locator: https://corpus.restorationcommons.org/b/18-3-e071/174 (GSA Read/Articles/BYU Studies/18-3.pdf, pp. 174-177 of PDF; journal pp. 444-447)
  accessed: '2026-10-15'
  inspected: true
  inspected_via: mcp__3302d05e-59ab-4fcc-b554-2284af2fe3d1__read_pages(path='Read/Articles/BYU Studies/18-3.pdf', from_page=172, to_page=180); contents page via read_pages(from_page=1,to_page=3)
  quote: legion leaders were ordered to stop the depredations and if necessary to exterminate those who do not separate themselves from their hostile clans and sue for peace
  verification:
    tool: null
    verdict: page-read
    link: https://corpus.restorationcommons.org/b/18-3-e071/174
  grade_supports: disputed
  traced_to: null
  used_on_screen: false
  counter: false
  notes: 'OCR text is lowercase and unpunctuated, so exact punctuation unverified. Coates (p. 174) says Young ''directed daniel wells to order the nauvoo legion to subdue the hostile indians''; the orders
    are Wells''s Special Order No. 1, 31 Jan 1850, in Nauvoo Legion correspondence (Coates fn. 70). P. 175 quotes a later order: ''let it be with them extermination or peace'' (fn. 74, Wells 9 Feb 1850).
    P. 176: ''probably not more than forty indians'' of the Timpanogos band died; Legion ''did not execute to the letter'' the order. P. 177: leaders ''abandoned their plans to exterminate all hostiles'',
    prisoners released; Young ''much chagrined at the conduct of the settlers at fort utah''. P. 173: Young asked ''why should men have a disposition to kill a destitute naked indian who may steal a shirt
    or a horse''. Coates writes from a Church-affiliated press (BYU Studies), so tilts sympathetic to Young; the ''forty'' figure rests on Stansbury/Gottfredson estimates and may be low. Page 178 also records
    Young''s 1851 reprimand and ''cheaper by far'' remark.'
  found_by: capy-historian
  claims:
  - 3
