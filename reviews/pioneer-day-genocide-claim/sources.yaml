    to_page=357)'
  quote: While some of Young's decisions had tragic consequences, he was not an "exterminator."
  verification:
    tool: null
    verdict: page-read
    link: https://corpus.restorationcommons.org/b/turner-brigham-young-pioneer-prophet-e29d/354
  grade_supports: disputed
  traced_to: null
  used_on_screen: false
  counter: false
  notes: 'Year is my recollection of the publication date (Belknap/Harvard 2012); not shown on the pages I read. P. 228: Young in 1853 attributed settlement survival to willingness to ''kill every soul
    of them [the Indians] if we had been obliged to do so''; Young''s 1852 policy ''better and cheaper to feed and clothe the Indians, than to fight them''; he ''meted out harsh retribution'' once prodded.
    P. 352: despite the maxim, neither Mormons nor agents gave enough food ''to compensate them for their steady loss of traditional resources'' and ''native populations steadily fell''. P. 352-353: Bear
    River, Connor''s men ''guided by the Mormon scout Porter Rockwell'', killed many women and children; Deseret News initially praised, Young later criticized Connor. P. 354: Connor ordered ''attack and
    kill every male Indian over twelve years of age''; Connor hailed ''the exterminator''. P. 355: Young told Utes ''we shall occupy this valley and the next, and the next''. P. 356: Young ordered ''treat
    them as Enemies''; Squaw Fight killed more than a dozen men, women and children. P. 357: Circleville massacre; no evidence Young investigated.'
  found_by: capy-historian
