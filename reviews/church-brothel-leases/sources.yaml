    link: https://corpus.noahairmet.com/b/quinn-the-mormon-hierarchy-extensions-of-power-5180/858
  grade_supports: fact
  traced_to: null
  used_on_screen: true
  counter: false
  notes: The same entry gives a merger as the stated purpose, so the order is not purely a moral statement. The card keeps that clause. The on-screen card omits the crude word with [...].
