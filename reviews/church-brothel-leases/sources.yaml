- id: quinn-ext-1897
  type: scholarly
  title: The Mormon Hierarchy, Extensions of Power, appendix 5 (printed p. 798, archive p. 828), 1897 entry
  author: D. Michael Quinn
  date: '1997'
  locator: https://corpus.noahairmet.com/b/quinn-the-mormon-hierarchy-extensions-of-power-5180/828
  accessed: '2026-10-07'
  inspected: true
  inspected_via: 'GSA read_pages (path Read/LDS History/Misc/Quinn, The Mormon Hierarchy: Extensions of Power.pdf, page 828)'
  quote: Apostle Brigham Young, Jr. temporarily resigns as vice-president of Brigham Young Trust Co. because first counselor George Q. Cannon allows its property to become "a first class" brothel on Commercial Street (now Regent Street), Salt Lake City. Apostle Heber J. Grant is invited to its opening reception and is stunned to discover himself inside "a regular whore-house." This situation begins in 1891, and for fifty years church-controlled real estate companies lease houses of prostitution.
  verification:
    tool: GSA read_pages
    verdict: page-read, wording matches the printed entry; the page text hyphenates whore-house across a line break
    link: https://corpus.noahairmet.com/b/quinn-the-mormon-hierarchy-extensions-of-power-5180/828
  grade_supports: fact
  traced_to: null
  used_on_screen: true
  counter: false
  notes: Quinn's chronology is a secondary scholarly summary. The underlying diaries and ledgers were not inspected. Quinn attributes the dating, 1891 to 1941, and the motive for the resignation. The entry does not name the lessees or the rent.
