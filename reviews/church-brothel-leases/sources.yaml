  quote: First Presidency orders Clayton Investment Company to get rid of its "whorehouses," no matter the financial loss, so that church-affiliated company can merge with church-owned Zion's Securities Corp. Ends fifty years of church's leases to brothels.
  verification:
    tool: GSA read_pages
