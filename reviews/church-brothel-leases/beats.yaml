  kind: narration
  text: Two corrections. Nineteen oh seven to nineteen forty-one is thirty-four years, not thirty-seven. And the report declaring the Church free of debt is dated March twentieth, nineteen oh seven, and the conference record has it read on April sixth. Neither correction shortens a long delay.
  pose: teaching
  stage: blank
  sources:
  - smith-1907-audit
  opinion: false
- id: n05
  kind: narration
  text: Now the real question, was it money? In the pages I checked, there is no statement of why. Quinn documents what happened, not why it lasted thirty-four years past the debt. That can look damning. But money as the reason is an inference, not something this record shows.
  pose: thoughtful
  stage: blank
  sources:
  - quinn-ext-1897
  - quinn-ext-1941
  opinion: true
- id: q02
  kind: card
  text: Here is the one recorded moment where money and morality were weighed. March nineteen forty-one. The First Presidency ordered the company to sell off the houses regardless of financial loss.
  pose: quote
  sources:
  - quinn-ext-1941
  card:
    quote: no matter the financial loss, so that church-affiliated company can merge with church-owned Zion's Securities Corp. Ends fifty years of church's leases to brothels.
    attribution: D. Michael Quinn · Extensions of Power, appendix 5 · 10 Mar. 1941
    source: quinn-ext-1941
- id: n06
  kind: narration
  text: That cuts against the video's conclusion. A Church that simply loved the income would not order a sale at a loss. The stronger reading is a standard leaders recognized by eighteen ninety-seven, enforced far too slowly, and finally enforced at a cost. That is serious. It does not establish a Church that simply loves money.
  pose: teaching
  stage: blank
  sources:
  - quinn-ext-1897
  - quinn-ext-1941
  opinion: true
- id: n99
  kind: narration
  text: The leases were wrong, the correction was late, and the record shows both. What it does not show is motive. God bless.
