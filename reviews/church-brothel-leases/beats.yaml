slug: church-brothel-leases
title: Church-controlled companies and brothel leases, 1891-1941
hook: The brothel leases are documented. Does the record prove the Church did it for money?
summary: Concede the documented leases and the harm first, then correct the arithmetic and the debt-free date, and test the one step the record does not support, that money was the reason. Quinn records objections from inside the leadership in 1897 and a 1941 order to end the leases regardless of financial loss.
