title: Who Gets to Decide Your Place in Heaven?
hook: A child can repeat a teaching without being qualified to pronounce a judgment.
summary: 'A response to Annie’s comedy skit about Mormon children repeating church talk: what the sources say about
  degrees of glory, racial teachings, outer darkness, and family sealing.'
