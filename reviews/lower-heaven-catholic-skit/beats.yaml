- id: n09
  kind: narration
  text: The Church recognizes marriage between a husband and a wife. Temple sealing and the marriage covenant are
    required for the highest celestial degree. That requirement is real; it does not establish a particular family’s
    final judgment.
  pose: solemn
  stage: blank
  sources:
  - dc-131-scripture
  - handbook-38-current
- id: n10
  kind: narration
  text: That does not authorize a child to assign these mothers a kingdom or promise their friend complete loneliness.
    Being saved differs from receiving the highest celestial degree or an eternal family sealing.
  pose: thoughtful
  stage: blank
  sources:
  - dc-76-scripture
  - handbook-38-current
