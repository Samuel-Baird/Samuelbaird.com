- id: n11
  kind: narration
  text: That promise is conditioned on celestial worthiness. It offers hope without specifying this family’s future
    arrangement or reversing the marriage restriction. The handbook likewise promises eventual blessings to faithful
    people unable to marry in mortality.
  pose: teaching
  stage: blank
  sources:
