- id: n01
  kind: narration
  text: He is using a creedal definition of Christianity. Under that definition, exclusion
    follows. The disputed question is whether that definition should govern every
    account of Christian identity.
  pose: teaching
  stage: blank
  opinion: true
- id: n02
  kind: narration
  text: The Church explicitly professes Jesus Christ as the divine Savior and teaches
    salvation through Him. It also openly rejects important parts of the historic
    creeds.
  pose: reading
  stage: blank
  opinion: false
  sources:
  - live-christian
- id: n03
  kind: narration
  text: The current Church essay claims a restoration of Christianity. Catholics defend
    the creeds as expressions of apostolic faith. Those are competing accounts of
    Christian authority; identifying the difference does not decide between them.
  pose: teaching
  stage: blank
  opinion: false
  sources:
  - live-christian
  - live-ccc460
- id: n04
  kind: narration
  text: Rome ruled Latter-day Saint baptism invalid in 2001. His video explicitly
