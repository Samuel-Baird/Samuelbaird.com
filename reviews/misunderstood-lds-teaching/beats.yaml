- id: n07
  kind: narration
  text: He is questioning a change of essence. The current official essay does not
    define exaltation in those philosophical terms. It does clearly affirm becoming
    like God. Those are different claims, and we should distinguish them. An affirmation
    of exaltation is not, by itself, an official answer to every metaphysical question.
  pose: reading
  stage: blank
  opinion: false
  sources:
  - live-becoming
- id: q01
  kind: card
  text: The essay says exalted people continue worshipping the Father, and their progression
    never replaces Him. That clarifies worship and dependence; it does not settle
    every question about divine nature.
  pose: teaching
  card:
    quote: Our progression will never change His identity as our Father and our God.
    attribution: Becoming Like God — Gospel Topics essay
    source: live-becoming
  sources:
  - live-becoming
- id: n08
  kind: narration
  text: That same essay describes receiving your own planet as a cartoonish reduction
