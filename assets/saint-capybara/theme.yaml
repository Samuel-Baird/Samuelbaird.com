# Saint Capybara visual theme.
#
# Single source of truth for palette, typography, and frame layout. Read by
# tools/capy/layout.py (frame composition geometry) and tools/capy/plates.py,
# tools/capy/sprites.py, tools/capy/text.py, tools/capy_caption_cards.py.
#
# This is a DISTINCT visual system from docs/style-guide.md (the other
# identity's charcoal/cream-serif quote-card style). Do not mix them.
#
# layout.version 2 (2026-09-09): full-bleed video, three frame modes
# (clip/host/card), no chips/wordmark/hook-on-screen, measured-width
# captions. See docs/saint-capybara/brand.md sec 8 for the rationale and
# the plan at the top of this file's git history for the numbers' origin.

palette:
  # Character (sprite) palette -- vestigial, left over from the retired
  # PIL sprite renderer (tools/capy/parts.py, compose.py). Not read by the
  # current (finalized-art) pipeline. Kept only so that old code doesn't
  # error if ever run standalone. See brand.md sec 7 for the real,
  # AI-generated art's representative sampled colors.
  transparent: [0, 0, 0, 0]
  outline:     [42, 33, 23, 255]
  fur:         [196, 148, 92, 255]
  fur_shade:   [156, 110, 60, 255]
  snout:       [176, 122, 108, 255]
  halo:        [217, 174, 59, 255]
  halo_shade:  [181, 138, 35, 255]
  crucifix:    [201, 130, 47, 255]
  book_cover:  [122, 40, 34, 255]
  book_pages:  [242, 232, 210, 255]
  paper:       [235, 224, 196, 255]
  scroll:      [222, 205, 168, 255]
  eye_white:   [247, 240, 224, 255]
  eye:         [42, 33, 23, 255]
  brow:        [80, 56, 32, 255]

  # Frame / UI palette -- the live one. Card borders, caption
  # fill/outline/pill colors, the parchment background.
  parchment:      "#E8DAC0"
  ink:             "#2E2117"
  fur_hex:         "#C4945C"
  snout_hex:       "#B07A6C"
  halo_gold_hex:   "#D9AE3B"
  highlight_brick: "#B7431F"
  source_teal:     "#2F6B5E"

fonts:
  display: "Press Start 2P"      # card attribution, chart labels
  display_file: "fonts/PressStart2P-Regular.ttf"
  body: "Pixelify Sans"          # captions, card quote/body text
  body_file: "fonts/PixelifySans-Regular.ttf"
  license_note: "Both fonts are SIL Open Font License 1.1. OFL text files are bundled alongside each font in this folder. OFL permits embedding/burning into video; keep the OFL text with the font files and do not sell the fonts standalone."

layout:
  version: 2
  canvas: { width: 1080, height: 1920, fps: 30 }

  # Documented assumptions (union of TikTok / Reels / Shorts platform-UI
  # chrome at 1080x1920): top 0-250 is status bar + For You/Following
  # tabs; bottom 1580-1920 is username/caption/sound-ticker/nav; the
  # right column x>930 for y 1000-1650 is the like/comment/share/avatar
  # rail. All text (captions, card text) stays inside x 60-1020,
  # y 250-1580. Sprite feet may brush the username band by design --
  # see brand.md sec 8.
  platform_safe: { top: 250, bottom: 340, right: 150 }
  sprite_bottom: 1850              # every mode's sprite feet sit on this line
  # 2026-09-09 (user feedback): moved down from 1600 to 1850 -- "slightly
  # above bottom of image" -- since a caching bug (see capy/sprites.py
  # _cache_key, fixed same day) had been silently reusing stale
  # bottom-left-positioned sprite renders for CLIP-mode beats, which read
  # as the sprite "covering" the source video's own burned-in captions.
  # 1850 keeps every mode's sprite top comfortably clear of that mode's
  # caption band even with the extra headroom: host top=930 (captions end
  # 660), clip/card top=1450/1370 (captions end 1120).

  # CLIP mode (kind: clip) -- source video fills the canvas.
  # Sprite is bottom-LEFT (2026-09-09 user feedback -- REVERSED the
  # 2026-09-09-earlier-that-day "bottom-right" change; see
  # feedback_capy_clip_sprite_bottom_right.md, superseded). Also pushed
  # lower than every other mode via its own `sprite_bottom` override
  # (1900 vs the shared 1850 -- see top-level `sprite_bottom:` above) per
  # the same feedback: "moved down lower... when overlaid on original
  # clips". Captions sit in a separate vertical band (y 860-1120) above
  # the sprite's box (top = 1900-400 = 1500), so the two never overlap --
  # keep it that way if either number ever changes; captions win the
  # band, resize/reposition the sprite instead.
  clip:
    letterbox_band: { y0: 230, y1: 850 }               # landscape sources fit here, over a blurred cover copy
    letterbox_bg: { blur_scale: 4, boxblur: "10:2", dim: 0.45 }
    sprite_bottom: 1900                                # per-mode override of the top-level sprite_bottom (1850)
    sprite:   { x0: 32, size: 400, outline_px: 5, shadow: { dx: 10, dy: 10, alpha: 110 } }
    captions: { y0: 860, y1: 1120, max_width: 960 }

  # HOST mode (kind: narration) -- parchment or full-bleed freeze, big sprite.
  host:
    sprite:   { x_center: 540, size: 920, outline_px: 0, ground_shadow: { rx: 300, ry: 26, alpha: 60 } }
    captions: { y0: 300, y1: 660, max_width: 960 }
    freeze:   { dim: 0.55, blur_sigma: 8 }

  # CARD mode (kind: card, evidence, chart, excerpt) -- card on top, medium sprite.
  # box enlarged 2026-09-13 (user feedback: "images should be larger") --
  # x1 pulled in to 930 (from 1040) to stay clear of the right-side
  # like/comment/share icon rail (platform_safe.right, active y 1000-1650)
  # now that the box extends down into that band; y1 pushed from 830 to
  # 1150 to give evidence images meaningfully more room. Captions moved
  # down to match (was y0/y1 860/1120) -- buffer to the sprite's top
  # (1850 - 480 = 1370) is now ~40px, down from ~250px; a real, deliberate
  # tradeoff per that same feedback ("captions can be moved lower if
  # needed"), not an oversight.
  card:
    # box (2026-09-13 update): no longer drawn as a bordered/filled
    # rectangle for `evidence` beats (see plates.py: _paste_evidence) --
    # it's now only a default fit/position hint, both for the
    # storyboard-preview paste and for where the live Resolve overlay
    # clip (see hybrid-resolve-pipeline.md) starts out before the user
    # resizes it. `card`/`excerpt` quote-card kinds still draw this as a
    # real bordered box (draw_card/draw_excerpt_card) -- unchanged.
    box:      { x0: 40, y0: 250, x1: 930, y1: 1150 }
    pad: 44
    sprite:   { x0: 32, size: 480, outline_px: 4, shadow: null }
    captions: { y0: 1170, y1: 1330, max_width: 960 }

  # Citation/credit zone (2026-09-13 user direction) -- a fixed
  # bottom-of-canvas strip for an `evidence` beat's source credit,
  # independent of `card.box` above: previously the credit was drawn at
  # the bottom of the (now unbordered) evidence box, so it moved around
  # with wherever the photo ended up. It now always renders in this same
  # spot regardless of the photo's size/position. Deliberately sits
  # inside the documented platform-unsafe bottom band (platform_safe.bottom,
  # y>1580) -- same accepted trade-off as sprite_bottom: 1850 above.
  citation:
    y0: 1840
    y1: 1910
    max_width: 1000

captions:
  # `size` is the starting px; the renderer (tools/capy/text.py) wraps by
  # measured width (font.getlength) and steps size down by shrink_step
  # until <= max_lines fit inside max_width. There is no character budget
  # in the renderer -- max_chars_per_line below is only the phrase
  # grouper's pre-estimate when no font measurer is supplied.
  style_capy:   { font: body, size: 84, min_size: 60, primary: parchment, outline: ink, stroke_px: 6, pill: null }
  style_source: { font: body, size: 76, min_size: 56, primary: parchment, outline: ink, stroke_px: 6,
                  pill: { color: source_teal, alpha: 150, pad_x: 28, pad_y: 16 } }
  style_card:   { font: body, size: 76, min_size: 56, primary: parchment, outline: ink, stroke_px: 6, pill: null }
  highlight_color: highlight_brick
  line_height: 1.15
  max_lines: 2
  shrink_step: 4
  max_chars_per_line: 24
  max_words_per_phrase: 6
  gap_break_seconds: 0.35
  attach_punctuation: true

card_text:
  quote:       { font: body,    size: 48, min_size: 36, line_height: 1.20, color: ink }
  attribution: { font: display, size: 26, min_size: 20, line_height: 1.40, color: source_teal }
  chart:       { title: { font: display, size: 30 }, label: { font: body, size: 32 }, credit: { font: body, size: 24 } }
  evidence_credit: { font: body, size: 26 }

audio:
  target_lufs: -16
  head_pad_seconds: 0.25
  sample_rate: 48000

cache:
  root: "D:/saint-capybara/cache"   # override with env CAPY_CACHE_DIR; beside the finalized art, outside the repo
  sprites: sprites
  mock: mock

brand:
  no_reuse_note: >
    Do not reuse anything from the creator's other identity: docs/style-guide.md's
    charcoal/cream-serif quote cards, bottom-left credit chip, or its fonts/music.
    See docs/saint-capybara/brand.md for the full anonymity rules.
