slug: joseph-smith-con-man-critical-thinking
title: "Was Joseph Smith a Freemason in 1823, and has no one in the Bible seen God?"
caption: "A reel stacks labels on Joseph Smith and says no one in the Bible has seen God. What do the Masonic dates, the 1826 record and the Bible itself say?"
hook: "Joseph Smith joined the Freemasons in 1842, not 1823, and the Bible says people saw God."
summary: "A Christian-leaning reel calls Joseph Smith a freemason, known con man and gold painter in 1823, and says no one in the Bible has seen God. We check the Masonic dates, what the 1826 South Bainbridge charge does and does not show, and what the Bible says about seeing God. The reel's plural-wives line is left for a separate video."
format: { width: 1080, height: 1920, fps: 30, min_seconds: 60, max_seconds: 180 }
