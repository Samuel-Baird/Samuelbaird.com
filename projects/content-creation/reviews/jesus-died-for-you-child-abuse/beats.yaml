slug: jesus-died-for-you-child-abuse
title: Does teaching children the Atonement require shame?
hook: Children are innocent in Christ. What should that change about how we teach?
summary: A response to Ashley Buckner on children, the Atonement, and shame. LDS scripture affirms little
  children’s innocence; dated curriculum and accountability at eight still require careful teaching. Independent
  project. Not affiliated with or endorsed by The Church of Jesus Christ of Latter-day Saints.
