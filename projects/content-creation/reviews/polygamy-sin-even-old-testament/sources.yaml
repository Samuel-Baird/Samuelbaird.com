  notes: "Appendix E (2013): 'Evidence supports probable sexual relations with twelve of Joseph Smith's plural wives', listing Fanny Alger, Louisa Beaman, Emily Dow Partridge, Eliza Maria Partridge, Almera Woodard Johnson, Lucy Walker, Sylvia Sessions, Maria Lawrence, Sarah Lawrence, Malissa Lott, Olive Frost, Mary Heron. By elimination, the two of the twelve who were legally married (Hales's fourteen-woman list) are Sylvia Sessions and Mary Heron (an inference; p. 211 says only that Sylvia is 'one of two'). Hales's Sylvia entry relies on her daughter Josephine's 1915 affidavit; that basis was later undercut by Perego's DNA study (see perego-bys-58-4). Temple Lot (1892) depositions are quoted in this appendix (e.g. Joseph B. Noble on Louisa Beaman; Malissa Lott's testimony). This is a 2013 book; Hales's later view (his website and JMH 2024) treats the sealings to women living with their husbands as eternity-only. Patty Sessions's diary says 'for Eternity' (see hales-jmh-2024 for the undated 'time and eternity' superscript)."
