- id: knight-pastoral-epistles
  type: scholarly
  title: "The Pastoral Epistles (NIGTC), commentary on 1 Timothy 3:2"
  author: "George W. Knight III"
  date: "1992"
  locator: "GSA Read/Bible/Commentaries/New International Greek Testament Commentary (NIGTC, 15 vols)/1-2 Timothy, Titus.pdf, PDF pp. 195-197 (book pp. 157-159)"
  accessed: "2026-10-15"
  inspected: true
  inspected_via: "GSA read_pages (pp. 195-197) and get_page_image of p. 196 (saved images/knight-nigtc-1tim3-p196.jpg)"
  quote: "Two considerations make it doubtful that polygamy is exclusively in view | polygamy, which existed among Jews of the NT age"
  verification: {tool: "GSA read_pages + get_page_image", verdict: page-read, link: "https://corpus.restorationcommons.org/b/1-2-timothy-titus-219d/196"}
  grade_supports: fact
  traced_to: null
  used_on_screen: true
  counter: true
  notes: "Knight DOES say polygamy 'is certainly ruled out by the sense of the phrase', then argues the phrase is about marital and sexual fidelity more broadly (comparing 5:9 and the Ten Commandments' adultery prohibition). Scholars therefore split: Knight includes polygamy among what is excluded, Towner thinks the specific polygamy reading is less than likely. Publication year of the NIGTC volume not confirmed from the scan (1992 is from memory; leave off screen)."

