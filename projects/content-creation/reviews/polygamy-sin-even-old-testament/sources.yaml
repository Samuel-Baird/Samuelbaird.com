# ---------------------------------------------------------------- Scholarly
- id: towner-1tim-3-2
  type: scholarly
  title: "The Letters to Timothy and Titus (NICNT), commentary on 1 Timothy 3:2"
  author: "Philip H. Towner (author per the user-supplied source list and the self-citation 'Towner, Goal' in fn. 35; the title-page scan was not retrieved)"
  date: "2006"
  locator: "GSA Read/Bible/Commentaries/New International Commentary on the New Testament (NICNT, 21 vols)/1-2 Timothy, Titus.pdf, PDF p. 302 (book p. 250), with fn. 42 spilling to p. 303"
  accessed: "2026-10-15"
  inspected: true
  inspected_via: "GSA read_pages (pp. 301-304) and get_page_image of p. 302 (saved images/towner-nicnt-1tim3-p302.jpg)"
  quote: "Various considerations make these specific interpretations less than likely | monogamy was the generally accepted norm in Greco-Roman and Jewish culture by this time"
  verification: {tool: "GSA read_pages + get_page_image", verdict: page-read, link: "https://corpus.restorationcommons.org/b/1-2-timothy-titus-516f/302"}
  grade_supports: fact
  traced_to: null
  used_on_screen: true
  counter: true
  notes: "Towner lists the options for 'husband of one wife' (exclude polygamists; exclude unmarried men; prohibit remarriage after death or divorce) and finds these specific readings 'less than likely', settling on fidelity in a monogamous marriage as the broader point. Fn. 42 says polygamy was practised in some Jewish circles (CD 4:20-5:6; Josephus, Antiquities 17.14) but that monogamy was the generally accepted norm and a prohibition would have been unnecessary, and that a polygamy reading would force a polyandry reading of 5:9. Towner is not LDS and holds that monogamy is meant; he does not say polygamy was approved."

