title: Joseph Smith in a Sheet? Check the Evidence
caption: A ghost story at a baptism? What does the nineteenth-century newspaper actually give us?
hook: Joseph Smith in a sheet? Check the evidence.
summary: 'A response to the claim that a nineteenth-century newspaper anecdote supports a fraud interpretation of
  Joseph Smith: the alleged witness, the reprints, the contemporary denial, and the early ordinance record.'
