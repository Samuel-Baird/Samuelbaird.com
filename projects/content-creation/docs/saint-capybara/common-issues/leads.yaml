# Hand-maintained map of common-issues topic slug -> apologetic-lead locators
# to mine for that topic's proposals/<slug>.md (2026-09-13, see README.md and
# apologetics-playbook.md "Source hierarchy").
#
# fair_gsa: a Gospel Scholar Archive DIRECTORY hint under Read/Articles/FAIR/FAIR/...
#   (or Read/Misc/Apologetics/...) to pass as search_concordance's path_contains --
#   a scope to search within, NOT a pre-verified page locator. The miner still has
#   to search, open, and cite_page the actual page itself before treating anything
#   found there as inspected.
# fair_web: a live fairlatterdaysaints.org URL, only when no GSA mirror exists.
# knowhy / evidence: scripturecentral.org (KnoWhy or Evidence Central), web-only.
# found_by: "hand" (this file's author) or "search_concordance"/"WebSearch" if a
#   capy-lead-miner run appended an entry it found itself -- append, don't
#   overwrite the hand-curated ones above it.
#
# Batch order (docs/saint-capybara/common-issues/README.md / the seeding plan):
# batch 1 below; later batches added here as they're worked.

