# every new project) -- pull individual entries from here into a project's
# script/pronunciations.yaml as its narration actually needs them, rather
# than copying all 342 wholesale. Where a name also appears in the general
# seed list (Nephi, Moroni, Lehi, Mosiah, Zarahemla, Cumorah, ...), that
# seed entry is the one already in projects -- treat it as authoritative
# over this file's mechanical conversion of the same name.

