    ipa: "/əˈbɪnədaɪ/"
    status: unverified
  # Terms most likely to actually appear in a general "reasons I'm not
  # Mormon" reaction video (prioritized for this project):
  - word: Mormon
    ipa: "/ˈmɔːrmən/"
    status: unverified
  - word: LDS
    ipa: "ok-as-is"
    status: unverified
    note: "spoken as three letters -- misaki generally handles this correctly without an override; keep as documentation, don't force an IPA override unless a render mispronounces it."
  - word: Smith
    ipa: "ok-as-is"
    status: unverified
  - word: Brigham
    ipa: "/ˈbrɪɡəm/"
    status: unverified
  - word: Kirtland
    ipa: "/ˈkɜːrtlənd/"
    status: unverified
  - word: polygamy
    ipa: "/pəˈlɪɡəmi/"
    status: unverified
  - word: tithing
    ipa: "/ˈtaɪðɪŋ/"
    status: unverified
    note: "common TTS trap -- rhymes with 'writhing,' not 'tithe-ing' with a hard TH."
  - word: Nauvoo Expositor
    ipa: "ok-as-is"
    status: unverified
    note: "'Nauvoo' entry above covers the risky word; 'Expositor' reads fine unaided."
  - word: Utah
    ipa: "/ˈjuːtɔː/"
    status: unverified
  - word: Zion
    ipa: "/ˈzaɪən/"
    status: unverified
  - word: stake
    ipa: "ok-as-is"
    status: unverified
    note: "LDS organizational unit, homograph with the wooden/gambling senses -- context usually disambiguates for TTS; watch for mis-stress on first render."
  - word: bishopric
    ipa: "/ˈbɪʃəprɪk/"
    status: unverified
  - word: seer stone
    ipa: "ok-as-is"
    status: unverified
  - word: garments
    ipa: "ok-as-is"
    status: unverified
    note: "LDS temple garments -- plain English word, watch tone/emphasis rather than pronunciation."

expansion_rules:
  - pattern: "D&C"
    expand_to: "Doctrine and Covenants"
  - note: "Never read an initialism as individual letters unless that is genuinely how it's said aloud; expand scripture-reference numbers into natural speech in the narration text itself (see pronunciations.md)."
