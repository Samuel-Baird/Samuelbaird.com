# Saint Capybara seed pronunciation dictionary. See
# docs/saint-capybara/pronunciations.md for the mechanism and rules.
# Copy into a project's script/pronunciations.yaml and extend as needed.
# All entries: status: unverified until confirmed by ear against a real
# capy_tts.py render (docs/saint-capybara/pronunciations.md).

